# SIOPS, the municipal declaration of health revenue and spending, one row per municipality and year (intake source siops_municipal).
# Meaning from the Ministry of Health's SIOPS notas técnicas dos indicadores (https://www.gov.br/saude/pt-br/acesso-a-informacao/siops/indicadores/notas-tecnicas) and from the relations the values obey (indicators 2.1, 2.2, 3.1, 3.2 and the per-inhabitant amounts recomputed from the amounts, Acre 2023).
dataset: SIOPS-MUNICIPAL
record: declaration
columns:
  UF:
    role: declaration.state
    kind: category
    model: dimension
    fact_domain: administrative
    fact_domain_evidence: '"UF da tabela" (declaration.state): SIOPS municipal declaration of health revenue and spending: the budget register'
    name: UF da tabela
    missing: []
    note: The state whose table the row came from (TabNet's municipal tables are one per state); the municipality code starts with the state's
      own.
    years:
    - 2000
    - 2025
  CO_MUNICIPIO:
    role: declaration.municipality
    kind: place
    model: where
    fact_domain: administrative
    fact_domain_evidence: '"Município (código)" (declaration.municipality): SIOPS municipal declaration of health revenue and spending: the budget
      register'
    name: Município (código)
    place_of: event
    width: 6
    width_evidence: TabNet prints the 6-digit IBGE code (no check digit) before the name; 'Município ignorado' of a state is the state code followed
      by 0000
    note: The municipality that declared; the Distrito Federal declares as a state and is not in this table.
    years:
    - 2000
    - 2025
  NO_MUNICIPIO:
    role: declaration.municipality_name
    kind: text
    model: excluded
    name: Município (nome)
    years:
    - 2000
    - 2025
  FREQUENCIA:
    role: declaration.count
    kind: number
    model: mark
    fact_domain: administrative
    fact_domain_evidence: '"Freqüência" (declaration.count): SIOPS municipal declaration of health revenue and spending: the budget register'
    name: Freqüência
    missing: []
    unit: count
    unit_of: declarations of the municipality in the year
    unit_evidence: 'TabNet ''Freqüência'': the count of records of the DBF; 1 where the municipality declared'
    note: TabNet lists a municipality that did not declare only when asked for zero rows, as 0; this table does not ask, so it is absent, not
      0.
    years:
    - 2000
    - 2025
  POPULACAO:
    role: declaration.population
    kind: number
    model: mark
    fact_domain: administrative
    fact_domain_evidence: '"População" (declaration.population): SIOPS municipal declaration of health revenue and spending: the budget register'
    name: População
    missing: []
    unit: count
    unit_of: inhabitants
    unit_evidence: 'TabNet ''População'': the population SIOPS takes for the year''s per-inhabitant indicators'
    note: 'Not the census count: the estimate SIOPS uses for the year.'
    years:
    - 2000
    - 2025
  IND_1_1:
    role: declaration.indicator_1_1
    kind: number
    model: mark
    fact_domain: administrative
    fact_domain_evidence: '"1.1 %R.Líquida Total" (declaration.indicator_1_1): SIOPS municipal declaration of health revenue and spending: the
      budget register'
    name: 1.1 %R.Líquida Total
    missing: []
    measure: false
    note: A finished ratio the source calculates (never summed or recomputed from sums of places); '...' where TabNet has no value.
    years:
