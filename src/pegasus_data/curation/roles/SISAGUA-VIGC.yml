# SISAGUA VIGC: Surveillance, cyanobacteria and cyanotoxins: one file, 2014-2026.
# Columns as the intake lands them (curation/intake.yml, source sisagua_surveillance_cyanobacteria; the 30 headers of the file read through the
# shared SISAGUA dictionary's aliases). Meaning from the system's own data dictionary: dicionario_vigilancia_ciano.odt
# (https://arquivosdadosabertos.saude.gov.br/dados/sisagua/dicionarios/; copy in registries/sisagua/dictionaries), checked against the header and first rows of the published file.
dataset: SISAGUA-VIGC
record: water_analysis
columns:
  CO_MUNICIPIO_IBGE:
    role: sample.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Código IBGE" (sample.municipality): geographic location of the collection municipality in the
      surveillance or control register'
    name: Código IBGE
    years:
    - 2014
    - 2026
    note: 'IBGE code of the municipality where the sample was collected, 6 digits (dictionary). The Distrito Federal is split
      into its Regiões Administrativas with codes 530001-5300xx made up in the IBGE format (Brasília 530010): the dictionary
      says so, and they are not IBGE municipalities.'
  DS_LOCAL:
    role: sample.site_description
    kind: text
    model: excluded
    name: Descrição do Local
    years:
    - 2014
    - 2026
    note: Open text for the address of the sampling place (dictionary).
  DT_COLETA:
    role: sample.collection_date
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: '"Data da Coleta" (sample.collection_date): date the sample was collected: the sampling process'
    name: Data da Coleta
    years:
    - 2014
    - 2026
  DT_INCLUSAO_REGISTRO:
    role: sample.registered_date
    kind: date
    model: mark
    fact_domain: administrative
    fact_domain_evidence: '"Data de Registro no SISAGUA" (sample.registered_date): record keeping: dates the record was entered
      or filled in SISAGUA'
    name: Data de Registro no SISAGUA
    years:
    - 2014
    - 2026
    note: Saved automatically when the data are entered (dictionary).
  DT_LAUDO:
    role: sample.report_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: '"Data do Laudo" (sample.report_date): date the laboratory issued the report of the analyses: the
      sampling process'
    name: Data do Laudo
    years:
    - 2014
    - 2026
  GRUPO_PARAMETROS:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Cianobactérias', 'Cianotoxinas')
    role: analysis.parameter_group
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Grupo de parâmetros" (analysis.parameter_group): parameter, limit or result of the laboratory
      or field analysis of the water sample: the investigation of the water'
    name: Grupo de parâmetros
    years:
    - 2014
    - 2026
  HR_COLETA:
    role: sample.collection_time
    kind: text
    model: mark
    fact_domain: process
    fact_domain_evidence: '"Hora da coleta" (sample.collection_time): time of day the sample was collected: the sampling process'
    name: Hora da coleta
    years:
    - 2014
    - 2026
    note: HH:MM.
  NO_AREA:
    role: sample.area_name
    kind: text
    model: excluded
    name: Área
    years:
    - 2014
    - 2026
  NO_CATEGORIA_AREA:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Bairro', 'Comunidade Ribeirinha', 'Núcleo/Propriedade Rural', 'Povoado/Lugarejo', 'Área urbana isolada')
    role: sample.area_category
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Categoria Área" (sample.area_category): where and how the sample was taken at the supply: the
      sampling site description'
    name: Categoria Área
    years:
    - 2014
    - 2026
    note: Bairro, sede de distrito ou vila, aldeia indígena, comunidade quilombola, ribeirinha, povoado ... (the dictionary
      lists ten).
  NO_ETA:
    role: supply.treatment_plant_name
    kind: text
    model: excluded
    name: Nome da ETA/UTA
    years:
    - 2014
    - 2026
    note: Water treatment plant or unit where the sample was taken; empty when it was taken elsewhere (dictionary).
  NO_LOCAL:
    role: sample.location_name
    kind: text
    model: excluded
    name: Local
    years:
    - 2014
    - 2026
  NO_MUNICIPIO:
    role: sample.municipality_name
    kind: text
    model: excluded
    name: Município
    years:
    - 2014
    - 2026
    note: Name of the municipality of CO_MUNICIPIO_IBGE; the code is the place.
  NO_REGIAO:
    role: sample.macro_region
    kind: place
    model: mark
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Região Geográfica" (sample.macro_region): geographic location of the collection municipality in
      the surveillance or control register'
    name: Região Geográfica
    years:
    - 2014
    - 2026
    note: Name of the macro-region (SUDESTE, NORDESTE ...) of the collection municipality.
  NO_REGIONAL:
    role: sample.health_regional
    kind: place
    model: mark
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Regional de Saúde" (sample.health_regional): geographic location of the collection municipality
      in the surveillance or control register'
    name: Regional de Saúde
    years:
    - 2014
    - 2026
    note: 'Free text kept by the SISAGUA managers of each state (dictionary: ''mantida pelos gestores do Sisagua em cada UF'');
      not IBGE''s nor the Ministry''s health region table.'
  NO_SOLUCAO_ABASTECIMENTO:
    role: supply.name
    kind: text
    model: excluded
    name: Nome da Forma de Abastecimento
    years:
    - 2014
    - 2026
  NU_AMOSTRA:
    role: sample.number
    kind: identifier
    model: link_only
    name: Número da amostra
    years:
    - 2014
    - 2026
    note: 'From GAL when the municipality uses it, otherwise typed by the surveillance officer (dictionary): not unique across
      municipalities.'
  NU_ANO:
    role: sample.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: '"Ano" (sample.year): year of the collection: the period the record belongs to'
    name: Ano
    years:
    - 2014
    - 2026
  NU_LATITUDE:
    role: sample.latitude
    kind: place
    model: mark
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Latitude" (sample.latitude): latitude of the sampling point: the sampling site'
    name: Latitude
    years:
    - 2014
    - 2026
    note: Decimal degrees; written with a decimal point or a comma (the intake reads both).
  NU_LONGITUDE:
    role: sample.longitude
    kind: place
    model: mark
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Longitude" (sample.longitude): longitude of the sampling point: the sampling site'
    name: Longitude
    years:
    - 2014
    - 2026
    note: The control's outside-the-standard file spells the header LONGIDADE.
  NU_MES:
    role: sample.month
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: '"Mês" (sample.month): month of the collection: the period the record belongs to'
    name: Mês
    years:
    - 2014
    - 2026
  NU_SOLUCAO_ABASTECIMENTO:
    role: supply.code
    kind: identifier
    model: link_only
    name: Código Forma de abastecimento
    years:
    - 2014
    - 2026
    note: 'Generated by SISAGUA when the supply is registered (dictionary): S or C, the 6-digit municipality and a sequence.'
  PARAMETRO:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Anabaena sp.', 'Aphanizomenon sp.', 'Aphanocapsa sp.', 'Aphanothece sp.', 'Chroococcus sp.', 'Cilindrospermopsina - VMP: 1,0 µg/L', 'Cuspidothrix sp.', 'Cyanodictyon sp.', 'Cylindrospermopsis sp.', 'Dolichospermum sp.', 'Geitlerinema sp.', 'Jaaginema sp.' …)
    role: analysis.parameter
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Parâmetro" (analysis.parameter): parameter, limit or result of the laboratory or field analysis
      of the water sample: the investigation of the water'
    name: Parâmetro
    years:
    - 2014
    - 2026
    note: Water-quality parameter, spelled differently between files and years (Cloro Residual Livre / Cloro residual livre);
      the other-parameters tables carry the limit (VMP) in the name.
  RESULTADO:
    missing: []
    role: analysis.result
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: '"Resultado" (analysis.result): parameter, limit or result of the laboratory or field analysis of
      the water sample: the investigation of the water'
    unit_unknown: 'the unit is the parameter''s own: PARAMETRO names it (mg/L, uT, uH, UFC/mL) or, in the control''s UNIDADE
      column, states it; no single unit holds for the column'
    name: Resultado
    years:
    - 2014
    - 2026
    note: 'The typed column is the quantified value (decimal comma); MENOR_LD, MENOR_LQ (below the limit of detection or quantification,
      never zero), PRESENTE and AUSENTE are not numbers: they are null here and named in RESULTADO__FLAG, with the value as
      filed in RESULTADO__RAW.'
  SG_UF:
    role: sample.state
    kind: place
    model: mark
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"UF" (sample.state): geographic location of the collection municipality in the surveillance or
      control register'
    name: UF
    years:
    - 2014
    - 2026
  TP_ABASTECIMENTO:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2026)'
    role: supply.type
    kind: category
    model: dimension
    fact_domain: administrative
    fact_domain_evidence: '"Tipo da Forma de Abastecimento" (supply.type): attribute of the water supply (system or alternative
      solution) the sample belongs to: the supply register'
    name: Tipo da Forma de Abastecimento
    years:
    - 2014
    - 2026
    note: SAA sistema de abastecimento de água, SAC solução alternativa coletiva, SAI solução alternativa individual (dictionary).
  TP_LOCAL:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Casa', 'Creche', 'Edifício/Prédio', 'Estabelecimento comercial', 'Estabelecimento de ensino', 'Estabelecimento de saúde', 'Grupo de casas', 'Outro', 'Praça')
    role: sample.location_type
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Tipo do local" (sample.location_type): where and how the sample was taken at the supply: the sampling
      site description'
    name: Tipo do local
    years:
    - 2014
    - 2026
    note: Type of the place (school, health facility, house, industry ...; the dictionary lists 28).
  TP_MOTIVO_COLETA:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Desastre', 'Rotina')
    role: sample.reason
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Motivo da coleta" (sample.reason): why the sample was taken (Denúncia, Desastre, Rotina, Surto):
      the surveillance''s sampling process'
    name: Motivo da coleta
    years:
    - 2014
    - 2026
    note: Surto and Desastre samples follow an event; Rotina is the programmed surveillance.
  TP_PONTO_COLETA:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Bebedouro', 'Cavalete/Hidrômetro', 'Cisterna', 'Reservatório de distribuição', 'Reservatório de água', 'Saída de tratamento/pós-desinfecção', 'Torneira antes da reservação', 'Torneira após a reservação', 'Água pós-filtração/pré-desinfecção')
    role: sample.point
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Ponto de Coleta" (sample.point): where and how the sample was taken at the supply: the sampling
      site description'
    name: Ponto de Coleta
    years:
    - 2014
    - 2026
    note: 'Complements TP_PROCEDENCIA_COLETA (dictionary Obs1): tap before or after the reservoir, reservoir, fountain, drinking
      fountain ...'
  TP_PROCEDENCIA_COLETA:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2026)'
    role: sample.supply_part
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Procedência da Coleta" (sample.supply_part): part of the supply where the sample was taken (point
      of capture, treatment plant, distribution system, in the home, alternative solution): the sampling site'
    name: Procedência da Coleta
    years:
    - 2014
    - 2026
  TP_ZONA:
    missing: []
    # declared from DATASUS's own sources (2026): no code table: the records hold the labels themselves ('Rural', 'Urbana')
    role: sample.zone
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: '"Zona" (sample.zone): where and how the sample was taken at the supply: the sampling site description'
    name: Zona
    years:
    - 2014
    - 2026
    note: Rural or Urbana (dictionary).
