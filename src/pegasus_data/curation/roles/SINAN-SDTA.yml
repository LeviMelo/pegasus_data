      NU1_4_F_NU: {sex: F, age_band: '1'}
      NU_1_4_IGN: {sex: I, age_band: '1'}
      NU_5_9_NU: {sex: M, age_band: '5'}
      NU5_9_F_NU: {sex: F, age_band: '5'}
      NU_5_9_IGN: {sex: I, age_band: '5'}
      NU_10_19_M: {sex: M, age_band: '10'}
      NU10_19_N: {sex: F, age_band: '10'}
      NU_10_19IG: {sex: I, age_band: '10'}
      NU_20_49_N: {sex: M, age_band: '20'}
      NU_20_49_F: {sex: F, age_band: '20'}
      NU_20_49IG: {sex: I, age_band: '20'}
