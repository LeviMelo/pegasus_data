  QT_DOC_BAS:
    role: school.qt_doc_bas
    kind: number
    model: mark
    missing_unknown: the dictionary names no code for a count that was not filled
    unit: count
    unit_of: número de Docentes da Educação Básica
    unit_evidence: '''Dicionário de Variáveis - Tabela de Escolas'' (microdados_censo_escolar_2021-2024.zip, Anexos/ANEXO I
      - Dicionário de Dados): ''Número de Docentes da Educação Básica'''
    name: Número de Docentes da Educação Básica
    years:
    - 2021
    - 2024
    note: 'Dictionary note: Notas importantes: 1) Os docentes referem-se aos indivíduos que estavam em efetiva regência de classe
      na data de referência do Censo Escolar da Educação Básica (última quarta-feira do mês de maio). 2) Os docentes são contados
      uma única vez em cada estabelecimento de ensino, contudo, um mesmo docente pode atuar em mais de uma Região Geográfica,
      Unidade da Federação, Município, estabelecimento de ensino, etapa de ensino, etc. Portanto, a soma dos docentes constantes
      nos Microdados não representam o total Brasil ou das Unidades da Federação. Para consultar o número de docentes em cada
      unidade de agregação, de forma distinta, acesse as Sinopses Estatísticas, ou, Inepdata, cujo links estão indicados no
      cabeçalho deste documento. Os docentes são contados somente uma vez em cada Etapa de Ensino, independentemente de atuarem
      em mais de uma delas. 3) Na Educação Infantil inclui, os docentes que atuam em turmas de Creche, Pré-Escola e unificadas.
      4) Na Pré-Escola da Educação Infantil, inclui os docentes que atuam em turmas unificadas. 5) Nos Anos Iniciais do Ensino
      Fundamental, inclui os docentes que atuam em turmas do 1º ao 5º ano do Ensino Fundamental e em turmas da Educação Infantil
      e Ensino Fundamental Multietapa. 6) Nos Anos Finais do Ensino Fundamental, inclui os docentes que atuam em turmas do 6º
      ao 9º ano do Ensino Fundamental e em turmas do Ensino Fundamental Correção de Fluxo e turmas Multi. 7) Na Educação Profissional,
      inclui os docentes que atuam nas seguintes Etapas de Ensino: Curso Técnico Integrado à Educação Profissional, Ensino Médio
      Normal/Magistério, Curso Técnico Concomitante, Curso Técnico Subsequente, Curso Técnico Misto (Concomitante e Subsequente),
      Curso FIC Concomitante, Cursos FIC Integrados à EJA de níveis Fundamental e Médio e Curso Técnico Integrado à EJA de Nível
      Médio. 8) Na Educação de Jovens e Adultos (EJA), inclui os docentes que atuam em turmas das seguintes Etapas: EJA Ensino
      Fundamental, EJA Ensino Médio, Cursos FIC de níveis Fundamental e Médio e Curso Técnico Integrado à EJA (EJA Integrada
      à Educação Profissional de Nível Médio). 9) Na EJA - Ensino Fundamental, inclui os docentes que atuam em turmas da EJA
      Ensino Fundamental Anos Iniciais e Anos Finais e Cursos FIC de nível Fundamental. 10) Na EJA - Ensino Médio, inclui os
      docentes que atuam em turmas da EJA Ensino Médio, Cursos FIC de nível Médio e Curso Técnico Integrado à EJA (EJA Integrada
      à Educação Profissional de Nível Médio). 11) Na Educação Especial, inclui os docentes que atuam em turmas de Classes Exclusivas
      (Escolas Exclusivamente Especializadas e/ou em Classes Exclusivas de Ensino Regular e/ou EJA) e em Classes Comuns do Ensino
      Regular e/ou EJA. 12) Nas Classes Comuns da Educação Especial, inclui os docentes que atuam em turmas que possuam alunos
      com algum tipo de deficiência, transtorno global do desenvolvimento e altas habilidades/superdotação do Ensino Regular
      e/ou EJA. 13) Nas Classes Exclusivas da Educação Especial, inclui os docentes que atuam em turmas de Escolas Exclusivamente
      Especializadas e/ou em Classes Exclusivas do Ensino Regular e/ou EJA. Num 8.'
