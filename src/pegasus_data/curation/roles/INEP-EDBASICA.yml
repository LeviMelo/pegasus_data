# INEP school census (microdados_ed_basica): one row per school and census year, 2021-2024 (intake source inep).
# Meaning from the 'Dicionário de Variáveis - Tabela de Escolas' (microdados_censo_escolar_2024.zip, Anexos/ANEXO I - Dicionário de Dados). The file has 426 columns; these 18 are the ones pegasus_data declares and reads (the intake's `columns`); the others are landed as filed, undeclared.
dataset: INEP-EDBASICA
record: school
columns:
  CO_ENTIDADE:
    role: school.code
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: '"Código da Escola" (school.code): the school: the school register'
    name: Código da Escola
    years:
    - 2021
    - 2024
    note: INEP code of the school, 8 digits (dictionary).
  CO_MUNICIPIO:
    role: school.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Código do Município" (school.municipality): municipality of the school: the school register'
    name: Código do Município
    years:
    - 2021
    - 2024
    note: IBGE code, 7 digits (dictionary). Where the school is, not where the student lives.
  NU_ANO_CENSO:
    role: school.census_year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: '"Ano do Censo" (school.census_year): year of the census: the period the record belongs to'
    name: Ano do Censo
    years:
    - 2021
    - 2024
  QT_MAT_BAS:
    missing: []
    role: school.enrolments
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: '"Número de Matrículas da Educação Básica" (school.enrolments): enrolments of the school in basic
      education, by the census: count of persons'
    unit: count
    unit_of: enrolments in basic education
    unit_evidence: '''Dicionário de Variáveis - Tabela de Escolas'' (microdados_censo_escolar_2024.zip, Anexos/ANEXO I - Dicionário
      de Dados): ''Número de Matrículas da Educação Básica'''
    name: Número de Matrículas da Educação Básica
    years:
    - 2021
    - 2024
    note: Excludes classes exclusively of complementary activity or of specialised educational care (dictionary note). An
      enrolment is not a person.
  QT_MAT_BAS_0_3:
    missing: []
    role: school.enrolments_age_0_3
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: '"Número de Matrículas da Educação Básica - Até 3 anos de idade" (school.enrolments_age_0_3): enrolments
      of the school in basic education, by the census: count of persons'
    unit: count
    unit_of: enrolments in basic education, até 3 anos de idade
    unit_evidence: '''Dicionário de Variáveis - Tabela de Escolas'' (microdados_censo_escolar_2024.zip, Anexos/ANEXO I - Dicionário
      de Dados): ''Número de Matrículas da Educação Básica - Até 3 anos de idade'''
    name: Número de Matrículas da Educação Básica - Até 3 anos de idade
    years:
    - 2021
    - 2024
    note: Age band computed from the student's age on the census reference date, the last Wednesday of May (dictionary note).
