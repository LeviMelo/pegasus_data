dataset: IBGE-POP
record: population
columns:
  ANO:
    role: population.year
    kind: date
    model: when
    name: Ano
    years:
    - 1980
    - 2025
  COD_MUN:
    role: population.residence
    kind: place
    model: stratum
    codelists:
    - BR_MUNICIPALFA
    name: Município
    years:
    - 2000
    - 2025
    note: Seven-digit IBGE codes; geography reads both widths.
  FXETARIA:
    role: population.age_band_legacy
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Faixa Etária detalhada\" (population.age_band_legacy): attribute of the person (age)"
    name: Faixa Etária detalhada
    years:
    - 1980
    - 1999
  IDADE:
    role: population.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Age\" (population.age_band): attribute of the person (age)"
    name: Age
    years:
    - 2000
    - 2025
    note: 'An age or a band as the table codes it: single years (000), bands (2559 = 25-59), or A0000.'
  MUNIC_RES:
    role: population.residence
    kind: place
    model: stratum
    codelists:
    - BR_MUNICIPALFA
    name: código do município
    years:
    - 1980
    - 1999
  POP:
    role: population.count
    kind: number
    model: mark
    name: População residente
    years:
    - 2000
    - 2025
  POPULACAO:
    role: population.count
    kind: number
    model: mark
    name: Population count
    years:
    - 1980
    - 1999
  SEXO:
    role: population.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (population.sex): attribute of the person (sex)"
    name: Sexo
    years:
    - 1980
    - 2025
    note: Coded M/F in some tables and 1/2 in others (the variable note).
  SITUACAO:
    missing: ['3', 'I']
    # declared from DATASUS's own sources (1991): no form dictionary; the table names every code the records use, each with its own label (1='urbana', 2='rural'): a code table, not a catch-all; 3='Ignorado', I='Ignorado'
    role: population.urban_rural
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Situação de domicílio\" (population.urban_rural): attribute of the person (residence)"
    name: Situação de domicílio
    years:
    - 1980
    - 1999
