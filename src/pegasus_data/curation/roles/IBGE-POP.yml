    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Age\" (population.age_band): attribute of the person (age)"
    name: Age
    years:
    - 2000
    - 2025
    note: 'An age or a band as the table codes it: single years (000), bands (2559 = 25-59), or A0000.'
  MUNIC_RES:
    role: population.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"código do município\" (population.residence): count of persons in the population table"
    codelists:
    - BR_MUNICIPALFA
    name: código do município
    years:
    - 1980
    - 1999
  POP:
    missing: []
    # measured 2025 (902502 rows, 902502 filled): range [1, 216049], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    # a zero is a recorded zero, not a missing code: a quantity that can be none (no zero in the 902,502 values of 2025; 2026-11-23)
    role: population.count
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"População residente\" (population.count): count of persons in the population table"
    name: População residente
    years:
    - 2000
    - 2025
  POPULACAO:
    missing: []
    # measured 1999 (1123428 rows, 1123428 filled): range [0, 491287], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    # a zero is a recorded zero, not a missing code: a quantity that can be none (0 on 0.3% of the 1,123,428 values of 1999; 2026-11-23)
    role: population.count
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Population count\" (population.count): count of persons in the population table"
