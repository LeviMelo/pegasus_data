dataset: SINAN-ESPO
record: notification
columns:
  C_D:
    role: epizootic.dogs_sick
    kind: number
    model: mark
    name: Número de cães doentes
    years:
    - 2013
    - 2022
    note: Number of sick dogs, if notified (Dicionario_de_dados_Epizootias_Esporotricose).
  C_M:
    role: epizootic.dogs_dead
    kind: number
    model: mark
    name: Número de cães mortos
    years:
    - 2013
    - 2022
    note: Number of dead dogs, if notified (same dictionary).
  DS_OUT_AMB:
    role: epizootic.other_setting_description
    kind: text
    model: excluded
    name: Se outro ambiente, especificar
    years:
    - 2013
    - 2022
  DT_DIGITA:
    role: notification.entry_date
    kind: date
    model: mark
    name: Data de Digitação
    years:
    - 2013
    - 2022
  DT_INI_EPI:
    role: epizootic.start
    kind: date
    model: when
    name: Data do início da epizootia
    years:
    - 2013
    - 2022
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    name: Data da Notificação
    years:
    - 2013
    - 2022
    note: role from the notification block
  ESPECIE:
    missing: []
    # declared from DATASUS's own sources (2019): the form's dictionary: 1='Gato', 2='Cão', 3='Gato e Cão'; the tabulation: no value labelled as not recorded
    role: epizootic.species
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Espécie reportada na notificação\" (epizootic.species): fact about the health event or the person's health"
    name: Espécie reportada na notificação
    years:
    - 2013
    - 2022
    note: 1 cat, 2 dog, 3 both (same dictionary).
  G_D:
    role: epizootic.cats_sick
    kind: number
    model: mark
    name: Número de gatos doentes
    years:
    - 2013
    - 2022
    note: Number of sick cats, if notified (same dictionary).
  G_M:
    role: epizootic.cats_dead
    kind: number
    model: mark
    name: Número de gatos mortos
    years:
    - 2013
    - 2022
    note: Number of dead cats, if notified (same dictionary).
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2013
    - 2022
    note: role from the notification block
  ID_NOTIFIC:
    role: notification.identifier
    kind: identifier
    model: link_only
    name: Identificador da notificação
    years:
    - 2013
    - 2022
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    name: Ano da notificação
    years:
    - 2013
    - 2022
    note: role from the notification block
  SEM_NOT:
    role: notification.epi_week
    kind: number
    model: mark
    name: Semana Epidemiológica da Notificação
    years:
    - 2013
    - 2022
  SEM_PRI:
    role: case.onset_epi_week
    kind: number
    model: mark
    name: Semana Epidemiológica dos Primeiros Sintomas/Diagnóstico
    years:
    - 2013
    - 2022
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    name: UF de Notificação
    codelists:
    - UF_BR
    years:
    - 2013
    - 2022
    note: role from the notification block
  TP_AMB_OCO:
    missing: ['0', '6', '7', '8', '9']
    # declared from DATASUS's own sources (2019): the form's dictionary: 1='Domicílio', 2='Parque, praça ou zoológico', 3='Área Silvestre', 4='Reserva ecológica', 5='Outro'; the tabulation: 0='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'
    role: epizootic.setting
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Ambiente de ocorrência\" (epizootic.setting): exposure circumstance of the event"
    name: Ambiente de ocorrência
    years:
    - 2013
    - 2022
  TP_ZN_OCO:
    missing: ['9']
    # declared from DATASUS's own sources (2019): the form's dictionary: 1='Urbana', 2='Rural', 3='Periurbana', 9='Ignorado'; the tabulation: no value labelled as not recorded
    role: epizootic.zone
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Zona\" (epizootic.zone): exposure circumstance of the event"
    name: Zona
    years:
    - 2013
    - 2022
