dataset: SINAN-SIFA
record: notification
columns:
  CLASSI_FIN:
    role: case.classification
    kind: category
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Classificação Final\" (case.classification): final classification of the case: clinical classification"
    name: Classificação Final
    codelists:
    - CLASINTO
    - CLASRC
    - CLASSCHIK
    - CLASSDENG
    - CLASSFA
    - CLASSHEPAT
    years:
    - 2010
    - 2025
  CRITERIO:
    missing: []
    # declared from DATASUS's own sources (2023): no form dictionary; the table names every code the records use, each with its own label (1='laboratorial', 2='clínico-epidemiológico'): a code table, not a catch-all; no value labelled as not recorded
    role: case.confirmation_criterion
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Critério de Confirmação\" (case.confirmation_criterion): criterion by which the case was confirmed: clinical-laboratory"
    name: Critério de Confirmação
    codelists:
    - CONFDESC
    - CONFDESCA
    - CONFDESCB
    - CONFDESCC
    - CONFDESCDENG2011
    - CONFDESCDIF
    years:
    - 2010
    - 2025
  CS_ESCOL_N:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.education
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Escolaridade\" (patient.education): attribute of the person (schooling)"
    name: Escolaridade
    codelists:
    - ESCOLARNET
    years:
    - 2010
    - 2025
  CS_GESTANT:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9. Ignorado
    role: patient.pregnancy_status
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Gestante\" (patient.pregnancy_status): fact about the health event or the person's health"
    name: Gestante
    codelists:
    - GESTANTE
    years:
    - 2010
    - 2025
  CS_RACA:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Raça/Cor\" (patient.race): attribute of the person (race/colour)"
    name: Raça/Cor
    codelists:
    - RAÇA
    years:
    - 2010
    - 2025
  CS_SEXO:
    missing:
    - 'I'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: I- Ignorado
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (patient.sex): attribute of the person (sex)"
    name: Sexo
    codelists:
    - SEXO
    years:
    - 2010
    - 2025
  DOENCA_TRA:
    missing: ['9']
    # declared from DATASUS's own sources (2023): no form dictionary; the tabulation labels 1 Sim, 2 Não and the records hold only ['1', '2', '9']; SINAN's yes/no table, where every one of the 943 harvested forms that define 9 define it as Ignorado
    role: case.work_related
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Doença Relacionada ao Trabalho\" (case.work_related): work-relatedness of the disease: a fact about the event"
    name: Doença Relacionada ao Trabalho
    codelists:
    - SIM_NAO
    years:
    - 2010
    - 2025
  DT_DIAG:
    role: case.diagnosis_date
    kind: date
    model: when
    name: Data do Diagnóstico
    years:
    - 2010
    - 2025
  DT_ENCERRA:
    role: notification.closing_date
    kind: date
    model: mark
    name: Data de Encerramento
    years:
    - 2010
    - 2025
  DT_INVEST:
    role: notification.investigation_date
    kind: date
    model: mark
    name: Data da Investigação
    years:
    - 2010
    - 2025
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    name: Data da Notificação
    years:
    - 2010
    - 2025
  DT_OBITO:
    role: case.death_date
    kind: date
    model: mark
    name: Data de Óbito
    years:
    - 2010
    - 2025
  EVOLUCAO:
    missing: ['9']
    # declared from DATASUS's own sources (2023): no form dictionary; the table names every code the records use, each with its own label (1='vivo', 2='óbito pelo agravo notificado', 3='óbito por outra causa', 9='ignorado'): a code table, not a catch-all; 9='Ignorado'
    role: case.outcome
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Evolução do Caso\" (case.outcome): outcome of the case: outcome of the event"
    name: Evolução do Caso
    codelists:
    - ALTAOBIT
    - CURAOBIT
    - EVOACBIO
    - EVOACGRA
    - EVOCANCE
    - EVODENG
    years:
    - 2010
    - 2025
  ID_AGRAVO:
    role: case.disease
    kind: code_tree
    model: event_type
    name: Agravo/doença
    codelists:
    - ICD10
    - AGRAVONOTS
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
    years:
    - 2010
    - 2025
  ID_MN_RESI:
    role: patient.residence
    kind: place
    model: stratum
    name: Município de Residência
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2010
    - 2025
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2010
    - 2025
  ID_OCUPA_N:
    role: patient.occupation
    kind: code_tree
    model: dimension
    name: Ocupação
    codelists:
    - CBO2002
    - OCUPANET
    - SEMOCUPA
    years:
    - 2010
    - 2025
  ID_PAIS:
    role: patient.residence_country
    kind: place
    model: dimension
    name: País de Residência
    codelists:
    - PAISNET
    years:
    - 2010
    - 2025
  ID_REGIONA:
    role: notification.region
    kind: place
    model: where
    name: Regional de Saúde da Notificação
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2010
    - 2025
  ID_RG_RESI:
    role: patient.residence_region
    kind: place
    model: dimension
    name: Regional de Saúde da Residência
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2010
    - 2025
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    name: Ano da notificação
    years:
    - 2010
    - 2025
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    note: Age with its unit packed into the first digit (1 hours, 2 days, 3 months, 4 years); the age stratum is
      the derived IDADE_anos.
    name: Idade
    years:
    - 2010
    - 2025
  SEM_DIAG:
    role: case.diagnosis_week
    kind: number
    model: mark
    name: Semana Epidemiológica do Diagnóstico
    years:
    - 2010
    - 2025
  SEM_NOT:
    role: notification.week
    kind: number
    model: mark
    name: Semana Epidemiológica da Notificação
    years:
    - 2010
    - 2025
  SG_UF:
    role: patient.residence_state
    kind: place
    model: dimension
    name: UF de Residência
    codelists:
    - UF_BR
    years:
    - 2010
    - 2025
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    name: UF de Notificação
    codelists:
    - UF_BR
    years:
    - 2010
    - 2025
  TP_NOT:
    missing: []
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt): 1 Negativa, 2 Individual, 3 Surto, 4 Agregado, a mandatory field with no code for not recorded
    role: notification.type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de Notificação\" (notification.type): notification type (individual, negative, ...): record type"
    name: Tipo de Notificação
    years:
    - 2010
    - 2025
  IDADE_anos:
    missing_unknown: 'no codelist or tabulation band of DATASUS bounds it'
    role: patient.age_years
    kind: number
    model: stratum
    derived: true
    note: Fractional years derived from NU_IDADE_N by the query (ADR-0070).
