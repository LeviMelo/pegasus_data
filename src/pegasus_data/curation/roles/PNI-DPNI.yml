dataset: PNI-DPNI
record: vaccination
columns:
  ANO:
    role: vaccination.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (vaccination.year): reference period or load date of the published aggregate"
    name: Ano
    years:
    - 1994
    - 2019
  ANOMES:
    role: vaccination.month_yyyymm
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano/Mês\" (vaccination.month_yyyymm): reference period or load date of the published aggregate"
    name: Ano/Mês
    years:
    - 2004
    - 2019
  DIFER:
    role: vaccination.dropout_difference
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Diferença D1-Dn\" (vaccination.dropout_difference): doses applied and coverage: care delivered"
    name: Diferença D1-Dn
    years:
    - 2004
    - 2019
    note: First dose minus the closing dose, for the dropout rate.
  DOSE:
    role: vaccination.dose
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: "\"Dose\" (vaccination.dose): how care or investigation was carried out"
    name: Dose
    years:
    - 1994
    - 2019
    codelists:
    - DOSE
  DOSE1:
    role: vaccination.first_doses
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Doses D1 (dose inicial do esquema)\" (vaccination.first_doses): doses applied and coverage: care delivered"
    name: Doses D1 (dose inicial do esquema)
    years:
    - 2004
    - 2019
  DOSEN:
    role: vaccination.closing_doses
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Doses Dn (dose final do esquema)\" (vaccination.closing_doses): doses applied and coverage: care delivered"
    name: Doses Dn (dose final do esquema)
    years:
    - 2004
    - 2019
  FX_ETARIA:
    role: vaccination.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Faixa Etária\" (vaccination.age_band): attribute of the person (age)"
    name: Faixa Etária
    years:
    - 1994
    - 2019
    codelists:
    - FXET
  IMUNO:
    role: vaccination.vaccine
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: "\"Imunobiológico\" (vaccination.vaccine): how care or investigation was carried out"
    name: Imunobiológico
    years:
    - 1994
    - 2019
    codelists:
    - IMUNO
    - IMUNOC
    - COBIMUNO
    - COBIMUC
  MES:
    role: vaccination.month
    kind: date
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Mês\" (vaccination.month): reference period or load date of the published aggregate"
    codelists:
    - MESES
    name: Mês
    years:
    - 2004
    - 2019
  MUNIC:
    role: vaccination.municipality
    kind: place
    model: where
    place_of: event
    codelists:
    - BR_MUNICIPALFA
    name: Município
    years:
    - 1994
    - 2019
    note: The variable note says the municipality of application; the open-data republication names the same 
      file ..._RESIDENCIA (residence). Both claims recorded; not resolved.
  QT_DOSE:
    role: vaccination.doses
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Quantidade de Doses Aplicadas\" (vaccination.doses): doses applied and coverage: care delivered"
    name: Quantidade de Doses Aplicadas
    years:
    - 1994
    - 2019
  UF:
    role: vaccination.state
    kind: place
    model: mark
    place_of: record
    codelists:
    - UF_BR
    name: Unidade da Federação
    years:
    - 1994
    - 2019
  ABAND:
    role: vaccination.dropout_rate
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: '"ABAND" (vaccination.dropout_rate): doses applied and coverage: care delivered'
    years:
    - 2009
    - 2009
    measure: false
    name: Taxa de abandono
    note: 'The published dropout rate (abandono), a finished rate: (D1 minus the dose that finishes the schedule) over D1, times
      100 (PNI nota técnica Taxas de abandono, DATASUS, sources/notatecnicaTx.pdf; the column name is matched to it by name).
      Declared as in PNI-DPNIUF. Held empty in the 2009 files read (19,268 rows, none filled).'
