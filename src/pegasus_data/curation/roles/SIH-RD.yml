  GESTRISCO:
    missing: ['1']
    # 1 is RD's fill on every AIH and also the layout's 'Não' (SISAIH01 ST_GESTRISCO, '0-Sim 1-Não', only for
    # laqueadura): the two cannot be told apart. Measured 2026-10-14, DATA_SOURCES
    role: pregnancy.high_risk
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Indicador se é gestante de risco\" (pregnancy.high_risk): fact about the health event or the person's health"
    note: >-
      Asked only of sterilisation AIHs (SISAIH01: "Somente para Laqueadura"), coded 0 Sim, 1 Não; RD writes 1 on
      every other AIH (99.84% of 36.6 million AIHs of 2010, 2016 and 2023, men included, and all 969,672 AIHs of
      "parto normal em gestação de alto risco" of 2014-2023). 1 is therefore a default outside sterilisation and
      cannot be told from a documented Não within it: declared not recorded, and the column carries no information
      for any other admission. 0 (Sim) is on 148,028 of 859,946 AIHs of the three laqueadura procedures, 2014-2023.
      TabNet binds the field to SIMNAO (1 Sim), the opposite coding, which was not followed.
    name: Indicador se é gestante de risco
    years:
    - 1999
    - 2026
