    role: survey.survey_type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de inquérito\" (survey.survey_type): attribute of the establishment register (structure, service, management)"
    name: Tipo de inquérito
    years:
    - 2010
    - 2026
  DT_DIGITA:
    role: notification.entry_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data de Digitação\" (notification.entry_date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data de Digitação
    years:
    - 2010
    - 2026
  DT_NOTIFIC:
