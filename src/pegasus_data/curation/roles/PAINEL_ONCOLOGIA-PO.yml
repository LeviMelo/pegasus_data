dataset: PAINEL_ONCOLOGIA-PO
record: case
columns:
  ANOMES_DIA:
    role: case.diagnosis_month
    kind: date
    precision: month
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Ano e mês do diagnóstico\" (case.diagnosis_month): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: Ano e mês do diagnóstico
    years:
    - 2013
    - 2026
  ANOMES_TRA:
    role: case.treatment_month
    kind: date
    precision: month
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Ano e mês do tratamento\" (case.treatment_month): date of care, sample, test, treatment, hospitalisation or transfer: how care and diagnosis happened"
    name: Ano e mês do tratamento
    years:
    - 2013
    - 2026
  ANO_DIAGN:
    role: case.diagnosis_year
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Ano do diagnóstico\" (case.diagnosis_year): laboratory result, titre, clinical measure, time to onset or exposure of the case: the health event"
    name: Ano do diagnóstico
    years:
    - 2013
    - 2026
  ANO_TRATAM:
    role: case.treatment_year
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Ano do tratamento\" (case.treatment_year): contact tracing, blockade, treatment delay or visits: how care happened"
    name: Ano do tratamento
    years:
    - 2013
    - 2026
  CNES_DIAG:
    role: case.diagnosis_facility
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"CNES do estabelecimento de diagnóstico\" (case.diagnosis_facility): facility: the facility register"
    codelists:
    - CADGERBR
    name: CNES do estabelecimento de diagnóstico
    years:
    - 2013
    - 2026
  CNES_TRAT:
    role: case.treatment_facility
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"CNES do estabelecimento de tratamento\" (case.treatment_facility): facility: the facility register"
    codelists:
    - CADGERBR
    name: CNES do estabelecimento de tratamento
    years:
    - 2013
    - 2026
  CNS_PAC:
    role: patient.cns
    kind: identifier
    model: link_only
    name: Cartão Nacional de Saúde do paciente
    years:
    - 2013
    - 2026
    note: A direct personal identifier, passed through unchanged.
  DIAGNOSTIC:
    role: case.diagnosis_group
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Grupo diagnóstico\" (case.diagnosis_group): fact about the health event or the person's health"
    name: Grupo diagnóstico
    years:
    - 2013
    - 2026
    missing: []
    note: 'The form (Dicionario_Painel_Oncologia.pdf (painel_oncologia/Doc)): 1 Neoplasias malignas (Lei 12.732/12),
      2 in situ, 3 comportamento incerto ou desconhecido, 4 C44 e C73.'
  DIAG_DETH:
    role: case.diagnosis
    kind: code_tree
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Diagnóstico detalhado\" (case.diagnosis): diagnosis, classification or injury code of the case: the health event"
    name: Diagnóstico detalhado
    years:
    - 2013
    - 2026
    codelists:
    - ICD10
    note: Three-character ICD-10 (D48, C44, C50 in 2026).
  DT_DIAG:
    role: case.diagnosis_date
    kind: date
    model: when
    fact_domain: clinical
    fact_domain_evidence: "\"Data do diagnóstico\" (case.diagnosis_date): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: Data do diagnóstico
    years:
    - 2013
    - 2026
  DT_NASC:
    role: patient.birth_date
    kind: date
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Data de nascimento\" (patient.birth_date): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Data de nascimento
    years:
    - 2013
    - 2026
  DT_TRAT:
    role: case.treatment_start_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data detalhada do primeiro tratamento registrado\" (case.treatment_start_date): date of care, sample, test, treatment, hospitalisation or transfer: how care and diagnosis happened"
    name: Data detalhada do primeiro tratamento registrado
    years:
    - 2013
    - 2026
  ESTADIAM:
    role: case.stage_at_diagnosis
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Estadiamento\" (case.stage_at_diagnosis): fact about the health event or the person's health"
    name: Estadiamento
    years:
    - 2013
    - 2026
    missing:
    - '9'
    note: 'The form (Dicionario_Painel_Oncologia.pdf (painel_oncologia/Doc)): 0-4 the stage, 5 Não se aplica (a
      value), 9 Ignorado.'
  IDADE:
    role: patient.age
    kind: number
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Idade
    years:
    - 2013
    - 2026
    note: "The form (Dicionario_Painel_Oncologia.pdf (painel_oncologia/Doc)): 000 to 999, 999 idade ignorada. Plain
      years at diagnosis, three digits (062), unlike SIM's and SIH's coded ages."
    missing:
    - '999'
  MUN_DIAG:
    role: case.diagnosis_municipality
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município do diagnóstico\" (case.diagnosis_municipality): municipality or state where the case was cared for, diagnosed or treated, or delivered: how care happened"
    codelists:
    - BR_MUNICIPALFA
    name: Município do diagnóstico
    years:
    - 2013
    - 2026
  MUN_RESID:
    role: patient.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Município de residência\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    codelists:
    - BR_MUNICIPALFA
    name: Município de residência
    years:
    - 2013
    - 2026
  MUN_TRATAM:
    role: case.treatment_municipality
    kind: place
    model: mark
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município do tratamento\" (case.treatment_municipality): municipality or state where the case was cared for, diagnosed or treated, or delivered: how care happened"
    codelists:
    - BR_MUNICIPALFA
    name: Município do tratamento
    years:
    - 2013
    - 2026
  SEXO:
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo do paciente\" (patient.sex): attribute of the person (sex)"
    name: Sexo do paciente
    years:
    - 2013
    - 2026
    missing: []
    note: 'The form (Dicionario_Painel_Oncologia.pdf (painel_oncologia/Doc)): F, M.'
  TEMPO_TRAT:
    role: case.days_to_treatment
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Tempo até o tratamento\" (case.days_to_treatment): contact tracing, blockade, treatment delay or visits: how care happened"
    name: Tempo até o tratamento
    years:
    - 2013
    - 2026
    missing:
    - '99999'
    note: 'The form (Dicionario_Painel_Oncologia.pdf (painel_oncologia/Doc)): a sign (+ treatment after the diagnosis
      report, - before) and four digits of days; 99999 sem informação de tratamento.'
  TRATAMENTO:
    role: case.treatment_type
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Tipo de tratamento\" (case.treatment_type): how care or investigation was carried out"
    name: Tipo de tratamento
    years:
    - 2013
    - 2026
    missing:
    - '5'
    note: 'The form (Dicionario_Painel_Oncologia.pdf (painel_oncologia/Doc)): 1 Cirurgia, 2 Quimioterapia, 3 Radioterapia,
      4 Quimioterapia + Radioterapia, 5 Sem informação de tratamento.'
  UF_DIAGN:
    role: case.state_of_diagnosis
    kind: place
    model: mark
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF do diagnóstico\" (case.state_of_diagnosis): municipality or state where the case was cared for, diagnosed or treated, or delivered: how care happened"
    codelists:
    - UF_BR
    name: UF do diagnóstico
    years:
    - 2013
    - 2026
  UF_RESID:
    role: patient.residence_state
    kind: place
    model: mark
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"UF de residência\" (patient.residence_state): attribute of the patient (age, birth, residence, occupation, employer)"
    codelists:
    - UF_BR
    name: UF de residência
    years:
    - 2013
    - 2026
  UF_TRATAM:
    role: case.state_of_treatment
    kind: place
    model: mark
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF do tratamento\" (case.state_of_treatment): municipality or state where the case was cared for, diagnosed or treated, or delivered: how care happened"
    codelists:
    - UF_BR
    name: UF do tratamento
    years:
    - 2013
    - 2026
