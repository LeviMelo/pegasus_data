# FA-EPIZ: the Ministry's monitoring of yellow fever, epizootics in non-human primates (fa_epizpnh_1994-2026.csv, Portal de Dados Abertos do SUS).
# Declared from the Dicionário de variáveis (Febre Amarela, Portal de Dados Abertos do SUS), which names each column and gives no code table, and checked against the 2637 rows of the lake.
# A row is an event of animals: no person, no sex or age.
dataset: FA-EPIZ
record: epizootic
columns:
  ID:
    role: epizootic.identifier
    kind: identifier
    model: link_only
    name: "Identificador sequencial único"
  MACRORREG_OCOR:
    role: epizootic.macroregion
    kind: place
    model: dimension
    place_of: event
    fact_domain: clinical
    fact_domain_evidence: "\"Sigla da macrorregião do local de ocorrência\" (epizootic.macroregion): animal cases, deaths or onset of the epizootic: the health event"
    name: "Sigla da macrorregião do local de ocorrência"
  COD_UF_OCOR:
    role: epizootic.state
    kind: place
    model: where
    place_of: event
    fact_domain: clinical
    fact_domain_evidence: "\"Código IBGE da Unidade Federada do local de ocorrência\" (epizootic.state): animal cases, deaths or onset of the epizootic: the health event"
    name: "Código IBGE da Unidade Federada do local de ocorrência"
  UF_OCOR:
    role: epizootic.state_abbreviation
    kind: text
    model: excluded
    name: "Sigla da Unidade Federada do local de ocorrência"
    note: "One row writes PR in lower case."
  COD_MUN_OCOR:
    role: epizootic.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: clinical
    fact_domain_evidence: "\"Código IBGE do município do local de ocorrência\" (epizootic.municipality): animal cases, deaths or onset of the epizootic: the health event"
    name: "Código IBGE do município do local de ocorrência"
  MUN_OCOR:
    role: epizootic.municipality_name
    kind: text
    model: excluded
    name: "Nome do município do local de ocorrência"
  DATA_OCOR:
    role: epizootic.date
    kind: date
    model: when
    fact_domain: clinical
    fact_domain_evidence: "\"Data de ocorrência do evento (dd/mm/aaaa)\" (epizootic.date): animal cases, deaths or onset of the epizootic: the health event"
    name: "Data de ocorrência do evento (dd/mm/aaaa)"
    note: "Blank in 22 of 2637 rows (the day is mostly empty in the early years); the year and month then come from ANO_OCOR and MES_OCOR."
  SE_OCOR:
    role: epizootic.epi_week
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Semana epidemiológica de ocorrência do evento\" (epizootic.epi_week): animal cases, deaths or onset of the epizootic: the health event"
    name: "Semana epidemiológica de ocorrência do evento"
  MES_OCOR:
    role: epizootic.month
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Mês de ocorrência do evento\" (epizootic.month): animal cases, deaths or onset of the epizootic: the health event"
    name: "Mês de ocorrência do evento"
    measure: false
    note: "A calendar index; blank in 13 rows."
  ANO_OCOR:
    role: epizootic.year
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Ano de ocorrência do evento\" (epizootic.year): animal cases, deaths or onset of the epizootic: the health event"
    name: "Ano de ocorrência do evento"
    note: "The lake's year partition."
  MONITORAMENTO_OCOR:
    role: epizootic.monitoring_period
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Período de monitoramento de ocorrência do evento\" (epizootic.monitoring_period): animal cases, deaths or onset of the epizootic: the health event"
    name: "Período de monitoramento de ocorrência do evento"
    note: "July to June, as FA-HUM's. The dictionary names it MONITORAMENTO_OCO; the file's header is MONITORAMENTO_OCOR."
