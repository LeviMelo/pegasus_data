dataset: IBGE-IDOSO
record: population
columns:
  ANO:
    role: population.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (population.year): reference year of the population table"
    name: Ano
    years:
    - 1991
    - 2010
  CORRACA:
    role: population.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Race/color\" (population.race): attribute of the person (race/colour)"
    name: Race/color
    years:
    - 1991
    - 2010
  IDADE:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2010)'
    role: population.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Age\" (population.age_band): attribute of the person (age)"
    name: Age
    years:
    - 1991
    - 2010
    note: 'An age or a band as the table codes it: single years (000), bands (2559 = 25-59), or A0000.'
  MUNCOD:
    role: population.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Municipality code (6-digit)\" (population.residence): count of persons in the population table"
    codelists:
    - BR_MUNICIPALFA
    name: Municipality code (6-digit)
    years:
    - 1991
    - 2010
  POPDEPEND:
    missing: []
    # measured 2010 (33382 rows, 33382 filled): range [0, 55595], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: population.dependent_age
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"População dependente\" (population.dependent_age): count of persons in the population table"
    name: População dependente
    years:
    - 1991
    - 2010
  POPTOT:
    missing: []
    # measured 2010 (33382 rows, 33382 filled): range [1, 416379], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: population.total
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Total population (indicator base)\" (population.total): count of persons in the population table"
    name: Total population (indicator base)
    years:
    - 1991
    - 2010
  SEXO:
    role: population.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (population.sex): attribute of the person (sex)"
    name: Sexo
    years:
    - 1991
    - 2010
    note: Coded M/F in some tables and 1/2 in others (the variable note).
