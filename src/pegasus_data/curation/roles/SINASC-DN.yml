dataset: SINASC-DN
record: birth
columns:
  APGAR1:
    missing: ['99']
    domain: [0, 10]
    # 99 is the not-recorded code: APGAR.CNV of NASC_NOV_TAB labels it 'Ign' beside the bands 00-03, 04-07 and 08-10 (the 1994-95 kit labels 11-99
    # 'Ignorado'), the layout's 'entre 00 e 10' leaves it outside. DNBR2009-2024 (44.9 M births): 99 on 30,468 (1,011-2,588 a year); the only other
    # value outside the domain is 89 (once, 2014) and '-0' (2010-2011). Measured 2026-10-14.
    role: birth.apgar1
    kind: number
    model: mark
    unit: score
    unit_evidence: "Estrutura_SINASC_2019.txt: APGAR1 \"Valor do Índice de Apgar, medido no 1º minuto de vida\" (00 to 10)"
    fact_domain: clinical
    fact_domain_evidence: "\"Índice de Apgar - 1º minuto\" (birth.apgar1): newborn condition or gestation at birth: the health event"
    name: Índice de Apgar - 1º minuto
    years:
    - 1994
    - 2026
  APGAR5:
    missing: ['99']
    domain: [0, 10]
    # 99 is the not-recorded code: APGAR.CNV of NASC_NOV_TAB labels it 'Ign' (see APGAR1). DNBR2009-2024: 99 on 23,887 (801-2,005 a year), no other
    # value outside the domain. Measured 2026-10-14.
    role: birth.apgar5
    kind: number
    model: mark
    unit: score
    unit_evidence: "Estrutura_SINASC_2019.txt: APGAR5 \"Valor do Índice de Apgar, medido no 5º minuto de vida\" (00 to 10)"
    fact_domain: clinical
    fact_domain_evidence: "\"Índice de Apgar - 5º minuto\" (birth.apgar5): newborn condition or gestation at birth: the health event"
    name: Índice de Apgar - 5º minuto
    years:
    - 1994
    - 2026
