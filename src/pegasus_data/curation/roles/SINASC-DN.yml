    domain: [1, 65]
    # 00 and 99 are the not-recorded codes: IDADEMAE.CNV of NASC_NOV_TAB labels 00 'Ign' and 66-99 'Ign' (the 1994-95 kit 00 and 60-99 'Ignorado').
    # DNBR2009-2024: 99 on 743 births (11-194 a year) beside at most 58 for any age 60-65, 00 on none. Ages 66-98 would stay outside the domain.
    # Measured 2026-10-14.
    role: mother.age
    kind: number
    model: stratum
    unit: years
    unit_evidence: "Estrutura_SINASC_2019.txt: \"Idade (anos)\" IDADEMAE \"Idade da mãe\"; Estrutura_SINASC_anterior.pdf: \"Idade da mãe em anos\""
    fact_domain: person
