    name: Idade da mãe
    years:
    - 1994
    - 2026
  IDADEPAI:
    missing: ['99']
    domain: [10, 98]
    # 99 is read as not recorded, against the tabulation band: IDADEPAI.CNV of NASC_NOV_TAB files 99 under '80 e+' (00-09 'Ign'), but DNBR2010-2024
    # hold it on 772 fathers against 56-111 for each age 86-98, a tenfold spike that is no age distribution. Both claims are written here; the band
    # is TabNet's display, the spike is the records'. Ages 00-09 (the band's 'Ign') stay outside the domain. Measured 2026-10-14.
    role: father.age
    kind: number
    model: mark
    unit_unknown: "Estrutura_SINASC_2019.txt: IDADEPAI \"Idade do pai\", with no unit (the mother's line says \"Idade (anos)\")"
    fact_domain: person
    fact_domain_evidence: "\"Idade do pai\" (father.age): attribute of the person"
    name: Idade do pai
    years:
    - 2010
    - 2026
    note: Adds entity `father`; no listed entity fits.
