dataset: SIASUS-AN
record: authorisation
columns:
  AN_ACEVAS:
    missing: []
    # declared from DATASUS's own sources (2013): no form dictionary; the table names every code the records use, each with its own label (N='não', S='sim'): a code table, not a catch-all; no value labelled as not recorded
    role: authorisation.vascular_access
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Acesso vascular\" (authorisation.vascular_access): fact about the health event or the person's health"
    name: Acesso vascular
    years:
    - 2008
    - 2014
  AN_ALBUMI:
    missing: ['00', '0', '99']
    domain: [0.5, 7]
    # The layout's field is 'Albumina em g%', 2 digits: 00 and 0 are the unfilled field (25.2% of AN's 5,652,863 rows, 2009-2014). 99 stands on 9,383 rows
    # against 253 for the five values below it (37 times): the fill, on the lines that fill AN_ALTURA, AN_PESO, AN_DIURES and AN_GLICOS with their nines (9,091 lines have it in all five).
    # domain [0.5, 7] g/dL is a plausibility bound of the unit (the plasma proteins are 6-8 g/dL, albumin is a part of them). Measured 2026-10-14.
    role: authorisation.albumi
    kind: number
    model: mark
    unit: "g/dL"
    unit_evidence: "Informe_Tecnico_SIASUS_2019_07.pdf AN_ALBUMI \"Albumina em g%\""
    fact_domain: clinical
    fact_domain_evidence: "\"Albumina\" (authorisation.albumi): measurement or laboratory result of the patient: clinical"
    note: "Measured, SIASUS-AN 2009-2014 (every UF): 28.2 % of the positive values exceed 10 g/dL, where albumin stays under about 6: many records hold tenths without the decimal point ('39' for 3.9); the unit is the layout's, the scale is not uniform."
    name: Albumina
    years:
    - 2008
    - 2014
  AN_ALTURA:
    missing: ['000', '0', '00', '999']
    domain: [0, 254]
    # 000, 0 and 00 are the unfilled field (18.8% of AN's 5,652,863 rows, 2009-2014; a height of 0 cm is no measurement) and 999 the all-nines fill (9,266 rows, the same
    # lines that fill AN_PESO, AN_DIURES and AN_GLICOS). domain [0, 254]: the range DATASUS's tabulation band labels as values. Measured 2026-10-14.
    role: authorisation.altura
    kind: number
    model: mark
    unit: cm
    unit_evidence: "Informe_Tecnico_SIASUS_2019_07.pdf AN_ALTURA \"Altura do paciente em cm\""
    fact_domain: clinical
    fact_domain_evidence: "\"Altura\" (authorisation.altura): measurement or laboratory result of the patient: clinical"
    name: Altura
    years:
    - 2008
    - 2014
  AN_CNCDO:
    missing: []
    # declared from DATASUS's own sources (SP 2014-09): no form dictionary; the table names every code the records use, each with its own label (N='não'): a code table, not a catch-all; no value labelled as not recorded
    role: authorisation.cncdo
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Inscrição na CNCDO\" (authorisation.cncdo): billing, financing, management or contractual attribute"
    name: Inscrição na CNCDO
    years:
    - 2008
    - 2014
  AN_DIURES:
    missing: ['9999']
    # 9999 is on 9,277 rows, the all-nines fill of the 9,091 lines that fill AN_ALTURA, AN_PESO and AN_GLICOS. Zero is NOT declared: it is an anuria as readily as a blank
    # ('0' on 1.30 M rows and '0000' on 1.14 M, 44.7% together, beside 13.6% null) and nothing tells the two apart. No document gives a range. Measured 2026-10-14.
    role: authorisation.diures
    kind: number
    model: mark
    unit: ml
    unit_evidence: "Informe_Tecnico_SIASUS_2019_07.pdf AN_DIURES \"Diurese em ml\""
    fact_domain: clinical
    fact_domain_evidence: "\"Diurese\" (authorisation.diures): measurement or laboratory result of the patient: clinical"
    name: Diurese
    years:
    - 2008
    - 2014
  AN_DTPDR:
    role: authorisation.first_dialysis_date
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data da primeira diálise realizada\" (authorisation.first_dialysis_date): authorisation, treatment start and sessions, surgery and follow-up: care delivered"
    name: Data da primeira diálise realizada
    years:
    - 2008
    - 2014
  AN_GLICOS:
    missing: ['0000', '0', '00', '000', '9999']
    # Zero is the unfilled field (33.0% of AN's 5,652,863 rows, 2009-2014; a blood glucose of 0 mg/dL is no measurement). 9999 is on 9,327 rows, the fill of the
    # same 9,091 lines that fill AN_ALTURA, AN_PESO and AN_DIURES (all nines of each field's width). No document gives a range for it. Measured 2026-10-14.
    role: authorisation.glicos
    kind: number
    model: mark
    unit: "mg/dL"
    unit_evidence: "Informe_Tecnico_SIASUS_2019_07.pdf AN_GLICOS \"Glicose em Mg/dl\""
    fact_domain: clinical
    fact_domain_evidence: "\"Glicose\" (authorisation.glicos): measurement or laboratory result of the patient: clinical"
    name: Glicose
    years:
    - 2008
    - 2014
  AN_HB:
    missing: ['00', '0']
    domain: [1, 25]
    # The layout's field is 'HB em g%', 2 digits ('NUM'): 00 and 0 are the unfilled field (17.9% of AN's 5,652,863 rows, 2009-2014, all UFs); a haemoglobin of 0 is no
    # measurement. domain [1, 25] g/dL is a plausibility bound of the unit (no layout gives a range): tenths without the decimal point ('97' for 9.7) fall outside it
    # (8.2% of the positive values exceed 25). 99 (21,250) stands among 93 (25,408) and 98 (13,660), the tenths of 9.3-9.9: a value. Measured 2026-10-14.
    role: authorisation.hb
    kind: number
    model: mark
    unit: "g/dL"
    unit_evidence: "Informe_Tecnico_SIASUS_2019_07.pdf AN_HB \"HB em g%\""
    fact_domain: clinical
    fact_domain_evidence: "\"Hemoglobina\" (authorisation.hb): measurement or laboratory result of the patient: clinical"
    note: "Measured, SIASUS-AN 2009-2014 (every UF): 8.2 % of the positive values exceed 25 g/dL: many records hold tenths without the decimal point ('97' for 9.7); the unit is the layout's, the scale is not uniform."
    name: Hemoglobina
    years:
    - 2008
    - 2014
  AN_HBSAG:
    missing: []
    # declared from DATASUS's own sources (2013): no form dictionary; the table names every code the records use, each with its own label (N='negativo', P='positivo'): a code table, not a catch-all; no value labelled as not recorded
