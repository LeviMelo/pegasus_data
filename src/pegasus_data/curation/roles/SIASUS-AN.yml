    - 2014
  AN_PESO:
    missing: ['000', '0', '00', '999']
    domain: [1, 300]
    # 000, 0 and 00 are the unfilled field (18.2% of AN's 5,652,863 rows, 2009-2014; a weight of 0 kg is no measurement) and 999 the all-nines fill (9,285 rows, the same
    # lines that fill AN_ALTURA, AN_DIURES and AN_GLICOS). domain [1, 300] kg is a plausibility bound of the unit (the tabulation band's [0, 999] holds its fill): 163,983 values
    # lie in 300-998, the tenths without the decimal point ('700' for 70.0), and fall outside it. Measured 2026-10-14.
    role: authorisation.peso
    kind: number
    model: mark
    unit: kg
    unit_evidence: "Informe_Tecnico_SIASUS_2019_07.pdf AN_PESO \"Peso do paciente em kg\""
    fact_domain: clinical
    fact_domain_evidence: "\"Peso\" (authorisation.peso): measurement or laboratory result of the patient: clinical"
    note: "Measured, SIASUS-AN 2009-2014 (every UF): 4.5 % of the positive values exceed 300 kg: many records hold tenths without the decimal point ('620' for 62.0); the unit is the layout's, the scale is not uniform."
    name: Peso
    years:
    - 2008
    - 2014
  AN_TRU:
    missing: ['0000', '0', '00', '000', '9999']
    domain: [0, 100]
    # Zero is the unfilled field (24.6% of AN's 5,652,863 rows, 2009-2014; a urea reduction of 0% is no measurement); 9999 is on 19,741 rows against 1 for the
    # five values below it. domain [0, 100] is the formula's: a percentage. 99 ('0099' 17,090, 6 times its neighbours) is a plausible reduction and stays a value. Measured 2026-10-14.
    role: authorisation.tru
    kind: number
    model: mark
    unit: percent
    unit_evidence: "Manual_Operacional_APAC_v_1_1.pdf s6.2 (nephrology complementary data, SIGTAP group 03 subgroup 05): \"TRU = (Uréia pré-hemodiálise (mg/dl) - Uréia pós-hemodiálise (mg/dl) x 100) / Uréia pré-hemodiálise (mg/dl)\""
    fact_domain: clinical
    fact_domain_evidence: "\"Taxa de redução de ureia\" (authorisation.tru): measurement or laboratory result of the patient: clinical"
    name: Taxa de redução de ureia
    years:
    - 2008
    - 2014
