dataset: SINAN-HIVE
record: notification
columns:
  CLASSI_FIN:
    role: case.classification
    kind: category
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Classificação Final\" (case.classification): final classification of the case: clinical classification"
    name: Classificação Final
    codelists:
    - CLASINTO
    - CLASRC
    - CLASSCHIK
    - CLASSDENG
    - CLASSFA
    - CLASSHEPAT
    years:
    - 2015
    - 2024
  CRITERIO:
    role: case.confirmation_criterion
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Critério de Confirmação\" (case.confirmation_criterion): criterion by which the case was confirmed: clinical-laboratory"
    name: Critério de Confirmação
    codelists:
    - CONFDESC
    - CONFDESCA
    - CONFDESCB
    - CONFDESCC
    - CONFDESCDENG2011
    - CONFDESCDIF
    years:
    - 2015
    - 2024
  CS_ESCOL_N:
    missing: ['09', '9', '99']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 0='Analfabeto', 1='1ª a 4ª série incompleta do EF', 10='Não se aplica', 2='4ª série completa do EF (antigo 1° grau)', 3='5ª à 8ª série incompleta do EF (antigo ginásio ou 1° grau)', 4='Ensino fundamental completo (antigo ginásio ou 1° grau)', 5='Ensino médio incompleto (antigo colegial ou 2° grau)', 6='Ensino médio completo (antigo colegial ou 2° grau)', 7='Educação superior incompleta', 8='Educação superior completa', 9='Ignorado'; the tabulation: 09='Ign/Branco', 9='Ign/Branco', 99='Ign/Branco'; CONFLICT: the records use ['00', '01', '02', '03', '04', '05', '06', '07', '08'], which the form does not define
    role: patient.education
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Escolaridade\" (patient.education): attribute of the person (schooling)"
    name: Escolaridade
    codelists:
    - ESCOLARNET
    years:
    - 2015
    - 2024
    note: role from the notification block
  CS_GESTANT:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9. Ignorado
    role: patient.pregnancy_status
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Gestante\" (patient.pregnancy_status): fact about the health event or the person's health"
    name: Gestante
    codelists:
    - GESTANTE
    years:
    - 2015
    - 2024
    note: role from the notification block
  CS_RACA:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Raça/Cor\" (patient.race): attribute of the person (race/colour)"
    name: Raça/Cor
    codelists:
