    missing: ['9']
    # declared from the SIVEP-Gripe data dictionary (Dicionário de Dados, ficha de registro individual de SRAG hospitalizado, 25/05/2023): 1='1º Trimestre', 2='2º Trimestre', 3='3º Trimestre', 4='Idade Gestacional Ignorada', 5='Não', 6='Não se aplica', 9='Ignorado'
    role: patient.pregnancy_status
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Gestante\" (patient.pregnancy_status): fact about the health event or the person's health"
    name: "Gestante"
    note: "The code 0 occurs (1493 rows over the nine years) and the dictionary does not name it: it stays undecoded."
