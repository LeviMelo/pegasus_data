    # declared from the SIVEP-Gripe data dictionary (Dicionário de Dados, ficha de registro individual de SRAG hospitalizado, 25/05/2023): 1='Branca', 2='Preta', 3='Amarela', 4='Parda', 5='Indígena', 9='Ignorado'
