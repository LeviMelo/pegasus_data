# SRAG-NOTIF: the notifications of severe acute respiratory syndrome (SIVEP-Gripe), one file per epidemiological year on
# the Portal de Dados Abertos do SUS. Every column is declared from the data dictionary of the Ministry of Health
# (Dicionário de Dados, ficha de registro individual de casos de SRAG hospitalizados, 25/05/2023, 2019-2025,
# https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/dicionario-de-dados-2019-a-2025.pdf) and checked against the
# 4,666,910 rows of the 15 lake partitions (one schema, 194 columns, 2018-2026 onsets). A column the dictionary does
# not describe, or describes without a code table, is `review: draft` and declares no code.
dataset: SRAG-NOTIF
record: notification
columns:
  NU_NOTIFIC:
    role: notification.number
    kind: identifier
    model: link_only
    name: "Número do registro"
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data do preenchimento da ficha de notificação\" (notification.date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: "Data do preenchimento da ficha de notificação"
  SEM_NOT:
    role: notification.epi_week
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Semana Epidemiológica do preenchimento da ficha de notificação\" (notification.epi_week): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: "Semana Epidemiológica do preenchimento da ficha de notificação"
    note: "The dictionary says this week is calculated from the date of first symptoms; it is the epidemiological week of DT_NOTIFIC (Sunday to Saturday, week 1 the first with four days in the year): equal in 100000 of 100000 rows of the 2022 file, against 40102 for DT_SIN_PRI."
  DT_SIN_PRI:
    role: case.onset
    kind: date
    model: when
    fact_domain: clinical
    fact_domain_evidence: "\"Data de 1ºs sintomas\" (case.onset): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: "Data de 1ºs sintomas"
    note: "The lake partitions this dataset by the year and month of this date (a file holds the notifications of its epidemiological year, and a few onsets of the year before)."
  SEM_PRI:
    role: case.onset_epi_week
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Semana Epidemiológica dos Primeiros Sintomas\" (case.onset_epi_week): fact about the health event or the person's health"
    name: "Semana Epidemiológica dos Primeiros Sintomas"
    note: "The epidemiological week of DT_SIN_PRI in 100000 of 100000 rows of the 2022 file."
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF (da unidade notificadora)\" (notification.state): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: "UF (da unidade notificadora)"
  ID_REGIONA:
    role: notification.health_region_name
    kind: text
    model: excluded
    name: "Regional de Saúde de Notificação"
  CO_REGIONA:
    role: notification.health_region
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Regional de Saúde de Notificação\" (notification.health_region): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: "Regional de Saúde de Notificação"
  ID_MUNICIP:
    role: notification.municipality_name
    kind: text
    model: excluded
    name: "Município de notificação"
  CO_MUN_NOT:
    role: notification.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município de notificação, código (IBGE)\" (notification.municipality): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: "Município de notificação, código (IBGE)"
  CS_SEXO:
    missing: ['I']
    # declared from the SIVEP-Gripe data dictionary (Dicionário de Dados, ficha de registro individual de SRAG hospitalizado, 25/05/2023): M='Masculino', F='Feminino', I='Ignorado'
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (patient.sex): attribute of the patient (age, birth, residence, occupation, employer)"
    name: "Sexo"
    note: "The open files file M, F and I; the dictionary lists the DBF export's 1, 2 and 9 (4,666,910 rows measured: M 2483220, F 2182883, I 807, none other)."
  DT_NASC:
    role: patient.birth_date
    kind: date
    model: excluded
    name: "Data de nascimento"
    note: "A personal birth date: passed through unmodified and flagged, never modelled (205 of 560577 rows of the 2022 file are blank)."
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age_coded): attribute of the patient (age, birth, residence, occupation, employer)"
    name: "Idade"
    measure: false
    note: "-9 and other negative values occur (the dictionary says at most 150); the age stratum is the derived IDADE_anos."
  TP_IDADE:
    role: patient.age_unit
    kind: category
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Tipo da idade\" (patient.age_unit): attribute of the patient (age, birth, residence, occupation, employer)"
    name: "Tipo da idade"
    note: "Measured against DT_NASC and DT_SIN_PRI (2022 file, 560372 rows with both dates) - unit 1 is 1.0 day per unit, unit 2 is 30.2 days per unit, unit 3 is 365 to 368 days per unit."
  COD_IDADE:
    role: patient.age_code
    kind: category
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Código da idade\" (patient.age_code): attribute of the patient (age, birth, residence, occupation, employer)"
    name: "Código da idade"
    review: draft
    note: "Not in the dictionary. Measured: equals TP_IDADE followed by NU_IDADE_N in three digits in 560576 of 560577 rows of the 2022 file (the one other holds -9)."
