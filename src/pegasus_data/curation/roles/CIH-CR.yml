dataset: CIH-CR
record: admission
columns:
  ANO_CMPT:
    role: admission.processing_year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano de competência\" (admission.processing_year): processing competence or manager authorisation of the AIH: billing and management"
    name: Ano de competência
    years:
    - 2008
    - 2011
  CAR_INT:
    role: admission.admission_character
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Caráter da internação\" (admission.admission_character): urgent or elective admission: a care-process fact"
    name: Caráter da internação
    years:
    - 2008
    - 2011
  CGC_HOSP:
    role: facility.cnpj
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"CGC (CNPJ) do hospital\" (facility.cnpj): facility register (CNES): establishment, bed, equipment, team, habilitation or professional"
    codelists:
    - CNPJ_BR
    name: CGC (CNPJ) do hospital
    years:
    - 2008
    - 2011
  CNES:
    role: admission.facility
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"Código CNES do estabelecimento\" (admission.facility): facility or its location: the facility register"
    codelists:
    - CADGERBR
    name: Código CNES do estabelecimento
    years:
    - 2008
    - 2011
  COBRANCA:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2011)'
    role: admission.discharge_reason
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Motivo de saída/permanência\" (admission.discharge_reason): motivo de saida/permanencia: the code that closes the AIH for payment (billing reason)"
    name: Motivo de saída/permanência
    years:
    - 2008
    - 2011
    codelists:
    - SAIDAPERM
    - SAIDAPERMC
  COD_IDADE:
    role: patient.age_unit
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Unidade de idade\" (patient.age_unit): encoding unit of another field"
    codelists:
    - IDADEDET
    name: Unidade de idade
    years:
    - 2008
    - 2011
    missing:
    - '0'
    note: 'the form, FQA CIH 180610.doc (TAB_CIH kit; sources/tab_cih_extract/fqa_strings.txt): 0 ignorada, 2 dias,
      3 meses, 4 anos, 5 anos (mais de 100).'
  DIAG_PRINC:
    role: admission.diagnosis
    kind: code_tree
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Diagnóstico principal\" (admission.diagnosis): diagnosis or cause code: the health event"
    codelists:
    - ICD10
    - S_CID
    name: Diagnóstico principal
    years:
    - 2008
    - 2011
  DIAG_SECUN:
    role: admission.secondary_diagnosis
    kind: code_tree
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Diagnóstico secundário\" (admission.secondary_diagnosis): diagnosis or cause code: the health event"
    codelists:
    - ICD10
    - S_CID
    name: Diagnóstico secundário
    years:
    - 2008
    - 2011
  DIAS_PERM:
    missing: []
    domain: [0, 9999]
    # proposed (2010): the range DATASUS's tabulation bands label as values; outside it 2 of 2604948 values in 2010 (11008: 1, 26269: 1)
    role: admission.length_of_stay
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Dias de permanência\" (admission.length_of_stay): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Dias de permanência
    years:
    - 2008
    - 2011
  DT_INTER:
    role: admission.start
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data de internação\" (admission.start): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Data de internação
    years:
    - 2008
    - 2011
  DT_SAIDA:
    role: admission.end
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data de saída\" (admission.end): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Data de saída
    years:
    - 2008
    - 2011
  ESPEC:
    role: admission.bed_specialty
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Especialidade do leito/da internação\" (admission.bed_specialty): specialty of the bed used: a care-process fact"
    name: Especialidade do leito/da internação
    years:
    - 2008
    - 2011
  FONTE:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2011)'
    role: admission.payment_source
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Fonte da remuneração\" (admission.payment_source): billing, financing, management or contractual attribute"
    name: Fonte da remuneração
    years:
    - 2008
    - 2011
  GESTAO:
    role: admission.management_type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de gestão\" (admission.management_type): management arrangement of the payer: management"
    name: Tipo de gestão
    years:
    - 2008
    - 2011
    codelists:
    - GESTAO
    missing: []
    note: 'the form, FQA CIH 180610.doc (TAB_CIH kit; sources/tab_cih_extract/fqa_strings.txt): 0 gestão estadual,
      1 gestão municipal.'
  HOMONIMO:
    role: patient.homonym_flag
    kind: category
    model: link_only
    fact_domain: administrative
    fact_domain_evidence: "\"Indicador de homônimo\" (patient.homonym_flag): encoding unit of another field"
    name: Indicador de homônimo
    years:
    - 2008
    - 2011
  IDADE:
    missing_unknown: 'no codelist or tabulation band of DATASUS bounds it'
    role: patient.age
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Idade
    years:
    - 2008
    - 2011
  MES_CMPT:
    role: admission.processing_month
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Mês de competência\" (admission.processing_month): processing competence or manager authorisation of the AIH: billing and management"
    codelists:
    - MESES
    name: Mês de competência
    years:
    - 2008
    - 2011
  MORTE:
    fatal: ['1']
    # from DATASUS's labels (MORTES, every year): 0='Sem óbito', 1='Com óbito': the stay ended in death (any cause)
    role: admission.death
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Óbito (saída com morte)\" (admission.death): stay ended in death: outcome of the event"
    name: Óbito (saída com morte)
    years:
    - 2008
    - 2011
    codelists:
    - MORTES
    missing: []
    note: 'the form, FQA CIH 180610.doc (TAB_CIH kit; sources/tab_cih_extract/fqa_strings.txt): 0 não, 1 sim.'
  MUNIC_MOV:
    role: admission.facility_municipality
    kind: place
    model: where
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: "\"Município de internação (movimentação)\" (admission.facility_municipality): facility or its location: the facility register"
    codelists:
    - BR_MUNICIPALFA
    name: Município de internação (movimentação)
    years:
    - 2008
    - 2011
  MUNIC_RES:
    role: patient.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Município de residência\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    codelists:
    - BR_MUNICIPALFA
    name: Município de residência
    years:
    - 2008
    - 2011
  NACIONAL:
    role: patient.nationality
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Nacionalidade\" (patient.nationality): attribute of the person (nationality/birthplace)"
    name: Nacionalidade
    years:
    - 2008
    - 2011
    codelists:
    - NACION3D
  NASC:
    role: patient.birth_date
    kind: date
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Data de nascimento\" (patient.birth_date): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Data de nascimento
    years:
    - 2008
    - 2011
  NATUREZA:
    missing: []
    # declared from DATASUS's own sources (2010): no form dictionary; the table names every code the records use, each with its own label (01='administracao direta da saude', 02='administracao direta outros orgaos', 03='administracao indireta - autarquias', 04='administracao indireta - fundação publica', 05='administracao indireta - empresa publica', 06='administracao indireta - org. social publica', 07='empresa privada', 08='fundacao privada', 09='cooperativa', 11='entidade beneficente sem fins lucrativos', 13='sindicato'): a code table, not a catch-all; no value labelled as not recorded
    role: facility.legal_nature_old
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Natureza jurídica do estabelecimento\" (facility.legal_nature_old): attribute of the establishment register (structure, service, management)"
    name: Natureza jurídica do estabelecimento
    years:
    - 2008
    - 2011
    codelists:
    - NATUREZA
    - NATUREZC
  PROC_REA:
    role: admission.procedure
    kind: code_tree
    model: event_type
    fact_domain: process
    fact_domain_evidence: "\"Procedimento realizado\" (admission.procedure): procedure performed or requested: care delivered"
    codelists:
    - SIGTAP
    name: Procedimento realizado
    years:
    - 2008
    - 2011
  SEXO:
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo do paciente\" (patient.sex): attribute of the person (sex)"
    codelists:
    - SEXO
    name: Sexo do paciente
    years:
    - 2008
    - 2011
  UTI_INT_TO:
    missing: []
    # measured 2011 (469749 rows, 460247 filled): range [0, 623], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    # a zero is a recorded zero, not a missing code: a quantity that can be none (0 on 95.1% of the 320,135 values of 2011; 2026-11-23)
    role: admission.intermediate_days
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Diárias de UTI intermediária\" (admission.intermediate_days): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Diárias de UTI intermediária
    years:
    - 2008
    - 2011
  UTI_MES_TO:
    missing: ['0']
    # measured 2011 (469749 rows, 469749 filled): range [0, 0], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    # 0 on every row of every held year (5,578,205 rows, 2009-2011) while UTI_INT_TO, filled in the same records, is positive on 5% and DIAS_PERM on 83%: a column
    # the files carry but do not fill, not zero ICU days (2026-11-23)
    role: admission.icu_days_month
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Total de dias de UTI durante a internação\" (admission.icu_days_month): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Total de dias de UTI durante a internação
    years:
    - 2008
    - 2011
  IDADE_anos:
    missing_unknown: 'no codelist or tabulation band of DATASUS bounds it'
    role: patient.age_years
    kind: number
    model: stratum
    unit: years
    unit_evidence: "made by the query, not filed by DATASUS: whole years from the age and its unit column (ADR-0070, `_age.py`); the declaration's own name is \"Idade em anos\""
    fact_domain: person
    fact_domain_evidence: "\"Idade em anos (derivada de IDADE e COD_IDADE)\" (patient.age_years): attribute of the patient (age, birth, residence, occupation, employer)"
    derived: true
    name: Idade em anos (derivada de IDADE e COD_IDADE)
    note: Fractional years from the curated recipe (ADR-0070), the subject's age stratum.
