dataset: CIH-CR
record: admission
columns:
  ANO_CMPT:
    role: admission.processing_year
    kind: date
    model: when
    name: Ano de competência
    years:
    - 2008
    - 2011
  CAR_INT:
    role: admission.admission_character
    kind: category
    model: mark
    name: Caráter da internação
    years:
    - 2008
    - 2011
  CGC_HOSP:
    role: facility.cnpj
    kind: institution
    model: institution
    codelists:
    - CNPJ_BR
    name: CGC (CNPJ) do hospital
    years:
    - 2008
    - 2011
  CNES:
    role: admission.facility
    kind: institution
    model: institution
    codelists:
    - CADGERBR
    name: Código CNES do estabelecimento
    years:
    - 2008
    - 2011
  COBRANCA:
    role: admission.discharge_reason
    kind: category
    model: mark
    name: Motivo de saída/permanência
    years:
    - 2008
    - 2011
    codelists:
    - SAIDAPERM
    - SAIDAPERMC
  COD_IDADE:
    role: patient.age_unit
    kind: category
    model: mark
    codelists:
    - IDADEDET
    name: Unidade de idade
    years:
    - 2008
    - 2011
    missing:
    - '0'
    note: 'the form, FQA CIH 180610.doc (TAB_CIH kit; sources/tab_cih_extract/fqa_strings.txt): 0 ignorada, 2 dias,
      3 meses, 4 anos, 5 anos (mais de 100).'
  DIAG_PRINC:
    role: admission.diagnosis
    kind: code_tree
    model: event_type
    codelists:
    - ICD10
    - S_CID
    name: Diagnóstico principal
    years:
    - 2008
    - 2011
  DIAG_SECUN:
    role: admission.secondary_diagnosis
    kind: code_tree
    model: mark
    codelists:
    - ICD10
    - S_CID
    name: Diagnóstico secundário
    years:
    - 2008
    - 2011
  DIAS_PERM:
    missing: []
    domain: [0, 9999]
    # proposed (2010): the range DATASUS's tabulation bands label as values; outside it 2 of 2604948 values in 2010 (11008: 1, 26269: 1)
    role: admission.length_of_stay
    kind: number
    model: mark
    name: Dias de permanência
    years:
    - 2008
    - 2011
  DT_INTER:
    role: admission.start
    kind: date
    model: when
    name: Data de internação
    years:
    - 2008
    - 2011
  DT_SAIDA:
    role: admission.end
    kind: date
    model: when
    name: Data de saída
    years:
    - 2008
    - 2011
  ESPEC:
    role: admission.bed_specialty
    kind: category
    model: mark
    name: Especialidade do leito/da internação
    years:
    - 2008
    - 2011
  FONTE:
    role: admission.payment_source
    kind: category
    model: mark
    name: Fonte da remuneração
    years:
    - 2008
    - 2011
  GESTAO:
    role: admission.management_type
    kind: category
    model: mark
    name: Tipo de gestão
    years:
    - 2008
    - 2011
    codelists:
    - GESTAO
    missing: []
    note: 'the form, FQA CIH 180610.doc (TAB_CIH kit; sources/tab_cih_extract/fqa_strings.txt): 0 gestão estadual,
      1 gestão municipal.'
  HOMONIMO:
    role: patient.homonym_flag
    kind: category
    model: link_only
    name: Indicador de homônimo
    years:
    - 2008
    - 2011
  IDADE:
    role: patient.age
    kind: number
    model: mark
    name: Idade
    years:
    - 2008
    - 2011
  MES_CMPT:
    role: admission.processing_month
    kind: date
    model: when
    codelists:
    - MESES
    name: Mês de competência
    years:
    - 2008
    - 2011
  MORTE:
    role: admission.death
    kind: category
    model: mark
    name: Óbito (saída com morte)
    years:
    - 2008
    - 2011
    codelists:
    - MORTES
    missing: []
    note: 'the form, FQA CIH 180610.doc (TAB_CIH kit; sources/tab_cih_extract/fqa_strings.txt): 0 não, 1 sim.'
  MUNIC_MOV:
    role: admission.facility_municipality
    kind: place
    model: where
    codelists:
    - BR_MUNICIPALFA
    name: Município de internação (movimentação)
    years:
    - 2008
    - 2011
  MUNIC_RES:
    role: patient.residence
    kind: place
    model: stratum
    codelists:
    - BR_MUNICIPALFA
    name: Município de residência
    years:
    - 2008
    - 2011
  NACIONAL:
    role: patient.nationality
    kind: category
    model: dimension
    name: Nacionalidade
    years:
    - 2008
    - 2011
    codelists:
    - NACION3D
  NASC:
    role: patient.birth_date
    kind: date
    model: stratum
    name: Data de nascimento
    years:
    - 2008
    - 2011
  NATUREZA:
    missing: []
    # declared from DATASUS's own sources (2010): no form dictionary; the table names every code the records use, each with its own label (01='administracao direta da saude', 02='administracao direta outros orgaos', 03='administracao indireta - autarquias', 04='administracao indireta - fundação publica', 05='administracao indireta - empresa publica', 06='administracao indireta - org. social publica', 07='empresa privada', 08='fundacao privada', 09='cooperativa', 11='entidade beneficente sem fins lucrativos', 13='sindicato'): a code table, not a catch-all; no value labelled as not recorded
    role: facility.legal_nature_old
    kind: category
    model: mark
    name: Natureza jurídica do estabelecimento
    years:
    - 2008
    - 2011
    codelists:
    - NATUREZA
    - NATUREZC
  PROC_REA:
    role: admission.procedure
    kind: code_tree
    model: event_type
    codelists:
    - SIGTAP
    name: Procedimento realizado
    years:
    - 2008
    - 2011
  SEXO:
    role: patient.sex
    kind: category
    model: stratum
    codelists:
    - SEXO
    name: Sexo do paciente
    years:
    - 2008
    - 2011
  UTI_INT_TO:
    role: admission.intermediate_days
    kind: number
    model: mark
    name: Diárias de UTI intermediária
    years:
    - 2008
    - 2011
  UTI_MES_TO:
    role: admission.icu_days_month
    kind: number
    model: mark
    name: Total de dias de UTI durante a internação
    years:
    - 2008
    - 2011
  IDADE_anos:
    role: patient.age_years
    kind: number
    model: stratum
    derived: true
    name: Idade em anos (derivada de IDADE e COD_IDADE)
    note: Fractional years from the curated recipe (ADR-0070), the subject's age stratum.
