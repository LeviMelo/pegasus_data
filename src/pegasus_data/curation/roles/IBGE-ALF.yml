dataset: IBGE-ALF
record: population
columns:
  ANO:
    role: population.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (population.year): reference year of the population table"
    name: Ano
    years:
    - 1991
    - 2010
  CORRACA:
    role: population.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Race/color\" (population.race): attribute of the person (race/colour)"
    name: Race/color
    years:
    - 1991
    - 2010
  IDADE:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2010)'
    role: population.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Age\" (population.age_band): attribute of the person (age)"
    name: Age
    years:
    - 1991
    - 2010
    note: 'An age or a band as the table codes it: single years (000), bands (2559 = 25-59), or A0000.'
  MUNCOD:
    role: population.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Municipality code (6-digit)\" (population.residence): count of persons in the population table"
    codelists:
    - BR_MUNICIPALFA
    name: Municipality code (6-digit)
    years:
    - 1991
    - 2010
  POPALFAB:
    missing: []
    # measured 2010 (233414 rows, 233414 filled): range [0, 1.83563e+06], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: population.literate
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"População alfabetizada\" (population.literate): count of persons in the population table"
    name: População alfabetizada
    years:
    - 1991
    - 2010
  POPNALFAB:
    missing: []
    # measured 2010 (233414 rows, 233414 filled): range [0, 40705], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: population.illiterate
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"População não alfabetizada\" (population.illiterate): count of persons in the population table"
    name: População não alfabetizada
    years:
    - 1991
    - 2010
  POPTOT:
    missing: []
    # measured 2010 (233414 rows, 233414 filled): range [1, 1.86271e+06], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: population.total
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Total population (indicator base)\" (population.total): count of persons in the population table"
    name: Total population (indicator base)
    years:
    - 1991
    - 2010
  SEXO:
    role: population.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (population.sex): attribute of the person (sex)"
    name: Sexo
    years:
    - 1991
    - 2010
    note: Coded M/F in some tables and 1/2 in others (the variable note).
  SITUACAO:
    missing: ['3', 'I']
    # declared from DATASUS's own sources (2000): no form dictionary; the table names every code the records use, each with its own label (R='rural', U='urbana'): a code table, not a catch-all; 3='Ignorado', I='Ignorado'
    role: population.urban_rural
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Situação de domicílio\" (population.urban_rural): attribute of the person (residence)"
    name: Situação de domicílio
    years:
    - 1991
    - 2010
