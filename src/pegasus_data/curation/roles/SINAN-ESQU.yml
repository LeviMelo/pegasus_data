dataset: SINAN-ESQU
record: notification
columns:
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    review: draft
    name: Ano de Nascimento
    note: 'Meaning inferred (curation source: inferred): a 4-digit birth year. No population-account property name
      fits a birth year, so model is provisional.'
    years:
    - 2007
    - 2026
  AN_QUALI:
    missing: ['0', '4', '5', '6', '7', '8', '9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='Positivo', 2='Negativo', 3='Não realizado'; the tabulation: 0='Ign/Branco', 4='Ign/Branco', 5='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'
    role: case.stool_qualitative
    kind: category
    model: mark
    name: Análise qualitativa (Hoffman)
    years:
    - 2007
    - 2026
  AN_QUANT:
    missing: []
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 0='0(zero)', 1='1 (um) ou mais ovos'; the tabulation: no value labelled as not recorded
    role: case.stool_quantitative
    kind: category
    model: mark
    name: Análise quantitativa (Kato-Katz)
    years:
    - 2007
    - 2026
    note: 'Typed number(4) on the form, which prints 0 (zero) / 1 (um) ou mais ovos; the records hold 0 and 1 only
      (2021: 1,298 and 1,096): a flag, not an egg count.'
