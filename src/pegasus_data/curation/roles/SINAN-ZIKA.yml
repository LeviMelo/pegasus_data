dataset: SINAN-ZIKA
record: notification
columns:
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    note: Birth year alone; birth_year is not a stratum property (STRATA lists birth_date and age_*).
    name: Ano de Nascimento
    years:
    - 2015
    - 2026
  CLASSI_FIN:
    role: case.classification
    kind: category
    model: event_type
    name: Classificação Final
    codelists:
    - CLASINTO
    - CLASRC
    - CLASSCHIK
    - CLASSDENG
    - CLASSFA
    - CLASSHEPAT
    years:
    - 2015
    - 2026
  COMUNINF:
    role: case.infection_municipality
    kind: place
    model: mark
    name: Município Provável da Fonte de Infecção
    codelists:
    - BR_MUNICIPALFA
    - MUNICAC
    - MUNICAL
    - MUNICAM
    - MUNICAP
    - MUNICBA
    - MUNICBR
    years:
    - 2015
    - 2026
  COPAISINF:
    role: case.infection_country
    kind: place
    model: mark
    name: País Provável da Fonte de Infecção
    codelists:
    - PAISNET
    years:
    - 2015
    - 2026
  COUFINF:
    role: case.infection_state
    kind: place
    model: mark
    name: UF Provável da Fonte de Infecção
    codelists:
    - UF_BR
    - UFCCODIG
    - UFCODIGO
    - UFCSIGLA
    - UFSIGLA
    years:
    - 2015
    - 2026
  CRITERIO:
    role: case.confirmation_criterion
    kind: category
    model: mark
    name: Critério de Confirmação
    codelists:
    - CONFDESC
    - CONFDESCA
    - CONFDESCB
    - CONFDESCC
    - CONFDESCDENG2011
    - CONFDESCDIF
    years:
    - 2015
    - 2026
  CS_ESCOL_N:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.education
    kind: category
    model: dimension
    name: Escolaridade
    codelists:
    - ESCOLARNET
    years:
    - 2015
    - 2026
  CS_GESTANT:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9. Ignorado
    role: patient.pregnancy_status
    kind: category
    model: dimension
    note: Trimester or not pregnant at notification; auto-filled 6 for males.
    name: Gestante
    codelists:
    - GESTANTE
    years:
    - 2015
    - 2026
  CS_RACA:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.race
    kind: category
    model: stratum
    name: Raça/Cor
    codelists:
    - RAÇA
    years:
    - 2015
    - 2026
  CS_SEXO:
    missing:
    - 'I'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: I- Ignorado
    role: patient.sex
    kind: category
    model: stratum
    also:
    - case.sex
    name: Sexo
    codelists:
    - SEXO
    years:
    - 2015
    - 2026
  DOENCA_TRA:
    missing: ['9']
    # declared from DATASUS's own sources (2016): no form dictionary; the tabulation labels 1 Sim, 2 Não and the records hold only ['1', '2', '9']; SINAN's yes/no table, where every one of the 943 harvested forms that define 9 define it as Ignorado
    role: case.work_related
    kind: category
    model: mark
    name: Doença Relacionada ao Trabalho
    codelists:
    - SIM_NAO
    years:
    - 2015
    - 2026
  DT_DIGITA:
    role: notification.entry_date
    kind: date
    model: mark
    note: Data-entry date; measures entry lag, not the clinical timeline.
    name: Data de Digitação
    years:
    - 2015
    - 2026
  DT_ENCERRA:
    role: notification.closing_date
    kind: date
    model: mark
    name: Data de Encerramento
    years:
    - 2015
    - 2026
  DT_INVEST:
    role: notification.investigation_date
    kind: date
    model: mark
    name: Data da Investigação
    years:
    - 2015
    - 2026
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    name: Data da Notificação
    years:
    - 2015
    - 2026
  DT_OBITO:
    role: case.death_date
    kind: date
    model: mark
    name: Data de Óbito
    years:
    - 2015
    - 2026
  DT_SIN_PRI:
    role: case.onset
    kind: date
    model: when
    name: Data dos Primeiros Sintomas / Data do Diagnóstico
    years:
    - 2015
    - 2026
  EVOLUCAO:
    missing: ['9']
    # declared from DATASUS's own sources (2016): no form dictionary; the table names every code the records use, each with its own label (1='vivo', 2='óbito pelo agravo notificado', 3='óbito por outra causa', 9='ignorado'): a code table, not a catch-all; 9='Ignorado'
    role: case.outcome
    kind: category
    model: mark
    name: Evolução do Caso
    codelists:
    - ALTAOBIT
    - CURAOBIT
    - EVOACBIO
    - EVOACGRA
    - EVOCANCE
    - EVODENG
    years:
    - 2015
    - 2026
  ID_AGRAVO:
    role: case.disease
    kind: code_tree
    model: event_type
    note: An ordinary coded column (CID-10 based agravo list), not a record identifier; draft typed it identifier.
    name: Agravo/doença
    codelists:
    - ICD10
    - AGRAVONOTS
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
    years:
    - 2015
    - 2026
  ID_MN_RESI:
    role: patient.residence
    kind: place
    model: stratum
    also:
    - case.residence
    name: Município de Residência
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2015
    - 2026
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2015
    - 2026
  ID_OCUPA_N:
    role: patient.occupation
    kind: code_tree
    model: dimension
    name: Ocupação
    codelists:
    - CBO2002
    - OCUPANET
    - SEMOCUPA
    years:
    - 2015
    - 2026
  ID_PAIS:
    role: patient.residence_country
    kind: place
    model: dimension
    name: País de Residência
    codelists:
    - PAISNET
    years:
    - 2015
    - 2026
  ID_REGIONA:
    role: notification.health_region
    kind: place
    model: where
    name: Regional de Saúde da Notificação
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2015
    - 2026
  ID_RG_RESI:
    role: patient.residence_region
    kind: place
    model: dimension
    note: Health region of residence, derived from ID_MN_RESI.
    name: Regional de Saúde da Residência
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2015
    - 2026
  ID_UNIDADE:
    role: notification.facility
    kind: institution
    model: institution
    name: Unidade de Saúde Notificadora
    codelists:
    - AB
    - NHE
    - NHENIVEL
    - NHEUNIDADE
    - NHE_NIVEL_MUN
    - UNIDANET
    - CADGERBR
    years:
    - 2015
    - 2026
  IN_VINCULA:
    role: notification.linked_flag
    kind: category
    model: excluded
    note: Set by the system after the TB/HANS linking routine; of doubtful use for arboviruses.
    name: Vinculação
    years:
    - 2015
    - 2026
  NDUPLIC_N:
    role: notification.duplicate_flag
    kind: category
    model: excluded
    note: Duplicate-review flag (2 = exclude from counts); a counting filter, not an analytical property.
    name: Não Listar/Não Contar (Duplicidade)
    codelists:
    - NDUPLIC_N
    years:
    - 2015
    - 2026
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    note: Filled by the system from DT_NOTIFIC; not year of illness.
    name: Ano da notificação
    years:
    - 2015
    - 2026
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    note: Age with its unit packed into the first digit (1 hours, 2 days, 3 months, 4 years); the age stratum is
      the derived IDADE_anos.
    name: Idade
    years:
    - 2015
    - 2026
  SEM_NOT:
    role: notification.epi_week
    kind: number
    model: mark
    note: AAAASS, published by the source; never recomputed.
    name: Semana Epidemiológica da Notificação
    years:
    - 2015
    - 2026
  SEM_PRI:
    role: case.onset_week
    kind: number
    model: mark
    note: AAAASS epidemiological week of onset, published by the source.
    name: Semana Epidemiológica dos Primeiros Sintomas/Diagnóstico
    years:
    - 2015
    - 2026
  SG_UF:
    role: patient.residence_state
    kind: place
    model: dimension
    note: State level of ID_MN_RESI, the residence stratum.
    name: UF de Residência
    codelists:
    - UF_BR
    years:
    - 2015
    - 2026
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    name: UF de Notificação
    codelists:
    - UF_BR
    years:
    - 2015
    - 2026
  TPAUTOCTO:
    missing: []
    # declared from DATASUS's own sources (2025): no form dictionary; the table names every code the records use, each with its own label (1='sim', 2='não', 3='indeterminado'): a code table, not a catch-all; no value labelled as not recorded
    role: case.autochthonous
    kind: category
    model: mark
    name: Caso é Autóctone da Residência?
    codelists:
    - AUTOCTONE
    years:
    - 2015
    - 2026
  TPUNINOT:
    role: facility.type
    kind: category
    model: mark
    note: Kind of establishment that notified; describes the facility, not the case.
    name: Tipo de Unidade Notificante
    codelists:
    - TIPOUNIDADE
    years:
    - 2015
    - 2026
  TP_NOT:
    missing: []
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt): 1 Negativa, 2 Individual, 3 Surto, 4 Agregado, a mandatory field with no code for not recorded
    role: notification.type
    kind: category
    model: mark
    name: Tipo de Notificação
    years:
    - 2015
    - 2026
  TP_SISTEMA:
    role: notification.system
    kind: category
    model: excluded
    note: Which SINAN application inserted the record (Net or Online); bookkeeping.
    name: Tipo de Sistema
    years:
    - 2015
    - 2026
  IDADE_anos:
    role: patient.age_years
    kind: number
    model: stratum
    derived: true
    note: Fractional years derived from NU_IDADE_N by the query (ADR-0070).
