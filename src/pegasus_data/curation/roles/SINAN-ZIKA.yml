dataset: SINAN-ZIKA
record: notification
columns:
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Ano de Nascimento\" (patient.birth_year): attribute of the patient (age, birth, residence, occupation, employer)"
    note: Birth year alone; birth_year is not a stratum property (STRATA lists birth_date and age_*).
    name: Ano de Nascimento
    years:
    - 2015
    - 2026
  CLASSI_FIN:
    role: case.classification
    kind: category
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Classificação Final\" (case.classification): final classification of the case: clinical classification"
    name: Classificação Final
    codelists:
    - CLASINTO
    - CLASRC
    - CLASSCHIK
    - CLASSDENG
    - CLASSFA
    - CLASSHEPAT
    years:
    - 2015
    - 2026
  COMUNINF:
    role: case.infection_municipality
    kind: place
    model: where
    place_of: event
    fact_domain: clinical
    fact_domain_evidence: "\"Município Provável da Fonte de Infecção\" (case.infection_municipality): place of infection, exposure, travel, risk or accident: exposure of the case"
    name: Município Provável da Fonte de Infecção
    codelists:
    - BR_MUNICIPALFA
    - MUNICAC
    - MUNICAL
    - MUNICAM
    - MUNICAP
    - MUNICBA
    - MUNICBR
    years:
    - 2015
    - 2026
  COPAISINF:
    role: case.infection_country
    kind: place
    model: where
    place_of: event
    fact_domain: clinical
    fact_domain_evidence: "\"País Provável da Fonte de Infecção\" (case.infection_country): place of infection, exposure, travel, risk or accident: exposure of the case"
    name: País Provável da Fonte de Infecção
    codelists:
    - PAISNET
    years:
    - 2015
    - 2026
  COUFINF:
    role: case.infection_state
    kind: place
    model: where
    place_of: event
    fact_domain: clinical
    fact_domain_evidence: "\"UF Provável da Fonte de Infecção\" (case.infection_state): place of infection, exposure, travel, risk or accident: exposure of the case"
    name: UF Provável da Fonte de Infecção
    codelists:
    - UF_BR
    - UFCCODIG
    - UFCODIGO
    - UFCSIGLA
    - UFSIGLA
    years:
    - 2015
    - 2026
  CRITERIO:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (0=''Ign/Branco''; 2023)'
    role: case.confirmation_criterion
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Critério de Confirmação\" (case.confirmation_criterion): criterion by which the case was confirmed: clinical-laboratory"
    name: Critério de Confirmação
    codelists:
    - CONFDESC
    - CONFDESCA
    - CONFDESCB
    - CONFDESCC
    - CONFDESCDENG2011
    - CONFDESCDIF
    years:
    - 2015
    - 2026
  CS_ESCOL_N:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.education
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Escolaridade\" (patient.education): attribute of the person (schooling)"
    name: Escolaridade
    codelists:
    - ESCOLARNET
    years:
    - 2015
    - 2026
  CS_GESTANT:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9. Ignorado
    role: patient.pregnancy_status
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Gestante\" (patient.pregnancy_status): fact about the health event or the person's health"
    note: Trimester or not pregnant at notification; auto-filled 6 for males.
    name: Gestante
    codelists:
    - GESTANTE
    years:
    - 2015
    - 2026
  CS_RACA:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Raça/Cor\" (patient.race): attribute of the person (race/colour)"
    name: Raça/Cor
    codelists:
    - RAÇA
    years:
    - 2015
    - 2026
  CS_SEXO:
    missing:
    - 'I'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: I- Ignorado
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (patient.sex): attribute of the person (sex)"
    also:
    - case.sex
    name: Sexo
    codelists:
    - SEXO
    years:
    - 2015
    - 2026
  DOENCA_TRA:
    missing: ['9']
    # declared from DATASUS's own sources (2016): no form dictionary; the tabulation labels 1 Sim, 2 Não and the records hold only ['1', '2', '9']; SINAN's yes/no table, where every one of the 943 harvested forms that define 9 define it as Ignorado
    role: case.work_related
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Doença Relacionada ao Trabalho\" (case.work_related): work-relatedness of the disease: a fact about the event"
    name: Doença Relacionada ao Trabalho
    codelists:
    - SIM_NAO
    years:
    - 2015
    - 2026
  DT_DIGITA:
    role: notification.entry_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data de Digitação\" (notification.entry_date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    note: Data-entry date; measures entry lag, not the clinical timeline.
    name: Data de Digitação
    years:
    - 2015
    - 2026
  DT_ENCERRA:
    role: notification.closing_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data de Encerramento\" (notification.closing_date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data de Encerramento
    years:
    - 2015
    - 2026
  DT_INVEST:
    role: notification.investigation_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data da Investigação\" (notification.investigation_date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data da Investigação
    years:
    - 2015
    - 2026
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data da Notificação\" (notification.date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data da Notificação
    years:
    - 2015
    - 2026
  DT_OBITO:
    role: case.death_date
    kind: date
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Data de Óbito\" (case.death_date): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: Data de Óbito
    years:
    - 2015
    - 2026
  DT_SIN_PRI:
    role: case.onset
    kind: date
    model: when
    fact_domain: clinical
    fact_domain_evidence: "\"Data dos Primeiros Sintomas / Data do Diagnóstico\" (case.onset): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: Data dos Primeiros Sintomas / Data do Diagnóstico
    years:
    - 2015
    - 2026
  EVOLUCAO:
    missing: ['9']
    # declared from DATASUS's own sources (2016): no form dictionary; the table names every code the records use, each with its own label (1='vivo', 2='óbito pelo agravo notificado', 3='óbito por outra causa', 9='ignorado'): a code table, not a catch-all; 9='Ignorado'
    fatal: ['2']
    fatal_other: ['3']
    # from DATASUS's labels (the tabulation table that labels the records, ZIKA 2016; 2015-2026): 2='Óbito pelo agravo notificado', 3='Óbito por outra causa'
    role: case.outcome
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Evolução do Caso\" (case.outcome): outcome of the case: outcome of the event"
    name: Evolução do Caso
    codelists:
    - ALTAOBIT
    - CURAOBIT
    - EVOACBIO
    - EVOACGRA
    - EVOCANCE
    - EVODENG
    years:
    - 2015
    - 2026
  ID_AGRAVO:
    role: case.disease
    kind: code_tree
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Agravo/doença\" (case.disease): diagnosis, classification or injury code of the case: the health event"
    note: An ordinary coded column (CID-10 based agravo list), not a record identifier; draft typed it identifier.
    name: Agravo/doença
    codelists:
    - ICD10
    - AGRAVONOTS
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
    years:
    - 2015
    - 2026
  ID_MN_RESI:
    role: patient.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Município de Residência\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    also:
    - case.residence
    name: Município de Residência
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2015
    - 2026
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município de Notificação\" (notification.municipality): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2015
    - 2026
  ID_OCUPA_N:
    role: patient.occupation
    kind: code_tree
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Ocupação\" (patient.occupation): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Ocupação
    codelists:
    - CBO2002
    - OCUPANET
    - SEMOCUPA
    years:
    - 2015
    - 2026
  ID_PAIS:
    role: patient.residence_country
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"País de Residência\" (patient.residence_country): attribute of the patient (age, birth, residence, occupation, employer)"
    name: País de Residência
    codelists:
    - PAISNET
    years:
    - 2015
    - 2026
  ID_REGIONA:
    role: notification.health_region
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Regional de Saúde da Notificação\" (notification.health_region): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Regional de Saúde da Notificação
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2015
    - 2026
  ID_RG_RESI:
    role: patient.residence_region
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Regional de Saúde da Residência\" (patient.residence_region): attribute of the patient (age, birth, residence, occupation, employer)"
    note: Health region of residence, derived from ID_MN_RESI.
    name: Regional de Saúde da Residência
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2015
    - 2026
  ID_UNIDADE:
    role: notification.facility
    kind: institution
    width: 7
    width_evidence: "SINAN stores the notifying unit as a number: zero-filled to CNES's 7 digits, the commonest short codes are CNES establishments registered in their notifications' municipality (TOXC 2023 8 of 8, DENG 2023 20 of 20; 2026-10-12)"
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"Unidade de Saúde Notificadora\" (notification.facility): notifying unit, or the record's own system timestamp: facility register and record keeping"
    name: Unidade de Saúde Notificadora
    codelists:
    - AB
    - NHE
    - NHENIVEL
    - NHEUNIDADE
    - NHE_NIVEL_MUN
    - UNIDANET
    - CADGERBR
    years:
    - 2015
    - 2026
  IN_VINCULA:
    role: notification.linked_flag
    kind: category
    model: excluded
    fact_domain: administrative
    fact_domain_evidence: "\"Vinculação\" (notification.linked_flag): record type, internal flag or system field"
    note: Set by the system after the TB/HANS linking routine; of doubtful use for arboviruses.
    name: Vinculação
    years:
    - 2015
    - 2026
  NDUPLIC_N:
    role: notification.duplicate_flag
    kind: category
    model: excluded
    fact_domain: administrative
    fact_domain_evidence: "\"Não Listar/Não Contar (Duplicidade)\" (notification.duplicate_flag): duplicate-record flag: internal flag"
    note: Duplicate-review flag (2 = exclude from counts); a counting filter, not an analytical property.
    name: Não Listar/Não Contar (Duplicidade)
    codelists:
    - NDUPLIC_N
    years:
    - 2015
    - 2026
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Ano da notificação\" (notification.year): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    note: Filled by the system from DT_NOTIFIC; not year of illness.
    name: Ano da notificação
    years:
    - 2015
    - 2026
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age_coded): attribute of the patient (age, birth, residence, occupation, employer)"
    note: Age with its unit packed into the first digit (1 hours, 2 days, 3 months, 4 years); the age stratum is
      the derived IDADE_anos.
    name: Idade
    years:
    - 2015
    - 2026
  SEM_NOT:
    role: notification.epi_week
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Semana Epidemiológica da Notificação\" (notification.epi_week): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    note: AAAASS, published by the source; never recomputed.
    name: Semana Epidemiológica da Notificação
    years:
    - 2015
    - 2026
  SEM_PRI:
    role: case.onset_week
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Semana Epidemiológica dos Primeiros Sintomas/Diagnóstico\" (case.onset_week): laboratory result, titre, clinical measure, time to onset or exposure of the case: the health event"
    note: AAAASS epidemiological week of onset, published by the source.
    name: Semana Epidemiológica dos Primeiros Sintomas/Diagnóstico
    years:
    - 2015
    - 2026
  SG_UF:
    role: patient.residence_state
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"UF de Residência\" (patient.residence_state): attribute of the patient (age, birth, residence, occupation, employer)"
    note: State level of ID_MN_RESI, the residence stratum.
    name: UF de Residência
    codelists:
    - UF_BR
    years:
    - 2015
    - 2026
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF de Notificação\" (notification.state): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: UF de Notificação
    codelists:
    - UF_BR
    years:
    - 2015
    - 2026
  TPAUTOCTO:
    missing: []
    # declared from DATASUS's own sources (2025): no form dictionary; the table names every code the records use, each with its own label (1='sim', 2='não', 3='indeterminado'): a code table, not a catch-all; no value labelled as not recorded
    role: case.autochthonous
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Caso é Autóctone da Residência?\" (case.autochthonous): whether the case is autochthonous to the residence: epidemiological fact of the event"
    name: Caso é Autóctone da Residência?
    codelists:
    - AUTOCTONE
    years:
    - 2015
    - 2026
  TPUNINOT:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2023)'
    role: facility.type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de Unidade Notificante\" (facility.type): attribute of the establishment register (structure, service, management)"
    note: Kind of establishment that notified; describes the facility, not the case.
    name: Tipo de Unidade Notificante
    codelists:
    - TIPOUNIDADE
    years:
    - 2015
    - 2026
  TP_NOT:
    missing: []
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt): 1 Negativa, 2 Individual, 3 Surto, 4 Agregado, a mandatory field with no code for not recorded
    role: notification.type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de Notificação\" (notification.type): notification type (individual, negative, ...): record type"
    name: Tipo de Notificação
    years:
    - 2015
    - 2026
  TP_SISTEMA:
    role: notification.system
    kind: category
    model: excluded
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de Sistema\" (notification.system): record type, internal flag or system field"
    note: Which SINAN application inserted the record (Net or Online); bookkeeping.
    name: Tipo de Sistema
    years:
    - 2015
    - 2026
  IDADE_anos:
    missing_unknown: 'no codelist or tabulation band of DATASUS bounds it'
    role: patient.age_years
    kind: number
    model: stratum
    unit: years
    unit_evidence: "made by the query, not filed by DATASUS: whole years from the age and its unit column (ADR-0070, `_age.py`); the declaration's own name is \"Idade em anos\""
    fact_domain: person
    fact_domain_evidence: "\"IDADE_anos\" (patient.age_years): attribute of the patient (age, birth, residence, occupation, employer)"
    derived: true
    note: Fractional years derived from NU_IDADE_N by the query (ADR-0070).
