# CENSO2010-DOMICILIOS: one sampled household (private permanent occupied, or the other kinds of unit visited, `V4001`) of the Census 2010 sample (intake source census2010_domicilios).
# Meaning from IBGE's own layout, Layout_microdados_Amostra.xls sheet DOMI (Documentacao.zip of the microdata): each variable's name, positions, digits and code list; the title is IBGE's words.
# A property is named in English where it is a stratum or a key; every other variable is `<entity>.<IBGE variable>`, because translating 300 questionnaire items would add claims the layout does not make.
