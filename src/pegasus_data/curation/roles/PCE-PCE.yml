dataset: PCE-PCE
record: survey
columns:
  CS_FASE:
    role: survey.program_phase_category
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Fase da atividade (categoria)\" (survey.program_phase_category): attribute of the establishment register (structure, service, management)"
    name: Fase da atividade (categoria)
    years:
    - 2024
    - 2026
  DT_COMP:
    role: survey.reporting_period_month_year_of_activity
    kind: date
    model: when
    name: Competência (mês/ano) da atividade
    years:
    - 1995
    - 2026
    codelists:
    - ANO
    - DT_COMP
  ID_DISTR:
    role: survey.health_district_region_code
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Código do Distrito/Regional de Saúde\" (survey.health_district_region_code): attribute of the establishment register (structure, service, management)"
    name: Código do Distrito/Regional de Saúde
    years:
    - 1995
    - 2026
  ID_DRS:
    role: survey.regional_health_department_drs_code
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Código do Departamento Regional de Saúde (DRS)\" (survey.regional_health_department_drs_code): attribute of the establishment register (structure, service, management)"
    name: Código do Departamento Regional de Saúde (DRS)
    years:
    - 2024
    - 2026
  ID_LOC:
    role: survey.locality
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Código da localidade (UF + município + localidade)\" (survey.locality): attribute of the establishment register (structure, service, management)"
    name: Código da localidade (UF + município + localidade)
    years:
    - 1995
    - 2026
    note: Twelve digits, state + municipality + locality (270040900006); no municipal table matches that width
      and it is never cut to make one.
  ID_UF:
    role: survey.state
    kind: place
    model: where
    codelists:
    - UF_BR
    name: UF de execução da atividade (código)
    years:
    - 1995
    - 2026
  NU_FASE:
    role: survey.work_cycle_number
    kind: number
    model: mark
    name: Número do ciclo de trabalho
    years:
    - 2024
    - 2026
  QT_17:
