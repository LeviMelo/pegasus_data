dataset: SINAN-SIFG
record: notification
columns:
  CLASSI_FIN:
    role: case.classification
    kind: category
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Classificação Final\" (case.classification): final classification of the case: clinical classification"
    name: Classificação Final
    codelists:
    - CLASINTO
    - CLASRC
    - CLASSCHIK
    - CLASSDENG
    - CLASSFA
    - CLASSHEPAT
    years:
    - 2007
    - 2025
  CS_ESCOL_N:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.education
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Escolaridade\" (patient.education): attribute of the person (schooling)"
    name: Escolaridade
    codelists:
    - ESCOLARNET
    years:
    - 2007
    - 2025
  CS_GESTANT:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9. Ignorado
    role: patient.pregnancy_status
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Gestante\" (patient.pregnancy_status): fact about the health event or the person's health"
    name: Gestante
    codelists:
    - GESTANTE
    years:
    - 2007
    - 2025
  CS_RACA:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Raça/Cor\" (patient.race): attribute of the person (race/colour)"
    name: Raça/Cor
    codelists:
    - RAÇA
    years:
    - 2007
    - 2025
  CS_SEXO:
    missing:
    - 'I'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: I- Ignorado
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (patient.sex): attribute of the person (sex)"
    name: Sexo
    codelists:
    - SEXO
    years:
    - 2007
    - 2025
  DSMOTIVO:
    role: treatment.partner_untreated_reason_text
    kind: text
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Outro motivo\" (treatment.partner_untreated_reason_text): treatment given: serum, drug, doses, dates or transfer"
    note: Draft typing said number; curation says free text.
    name: Outro motivo
    years:
    - 2007
    - 2025
  DSTITULO1:
    role: pregnancy.prenatal_test_titre
    kind: text
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Título\" (pregnancy.prenatal_test_titre): obstetric history, gestation or test result of the pregnancy: clinical"
    note: Free-text titre (curation sifg.yml:21), e.g. 1:16; kept text.
    name: Título
    years:
    - 2007
    - 2025
  DTTESTE1:
    role: pregnancy.prenatal_test_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data do teste não treponêmico no pré-natal\" (pregnancy.prenatal_test_date): prenatal care, test dates and delivery type: how care happened"
    name: Data do teste não treponêmico no pré-natal
    years:
    - 2007
    - 2025
  DT_DIAG:
    role: case.diagnosis_date
    kind: date
    model: when
    fact_domain: clinical
    fact_domain_evidence: "\"Data do Diagnóstico\" (case.diagnosis_date): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: Data do Diagnóstico
    years:
    - 2007
    - 2025
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data da Notificação\" (notification.date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data da Notificação
    years:
    - 2007
    - 2025
  ID_AGRAVO:
    role: case.disease
    kind: code_tree
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Agravo/doença\" (case.disease): diagnosis, classification or injury code of the case: the health event"
    name: Agravo/doença
    codelists:
    - ICD10
    - AGRAVONOTS
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
    years:
    - 2007
    - 2025
  ID_MN_RESI:
    role: patient.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Município de Residência\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Município de Residência
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2007
    - 2025
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município de Notificação\" (notification.municipality): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
    years:
    - 2007
    - 2025
  ID_OCUPA_N:
    role: patient.occupation
    kind: code_tree
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Ocupação\" (patient.occupation): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Ocupação
    codelists:
    - CBO2002
    - OCUPANET
    - SEMOCUPA
    years:
    - 2007
    - 2025
  ID_PAIS:
    role: patient.residence_country
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"País de Residência\" (patient.residence_country): attribute of the patient (age, birth, residence, occupation, employer)"
    name: País de Residência
    codelists:
    - PAISNET
    years:
    - 2007
    - 2025
  ID_REGIONA:
    role: notification.region
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Regional de Saúde da Notificação\" (notification.region): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Regional de Saúde da Notificação
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2007
    - 2025
  ID_RG_RESI:
    role: patient.residence_region
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Regional de Saúde da Residência\" (patient.residence_region): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Regional de Saúde da Residência
    codelists:
    - REGIONET
    - CIR_BR
    years:
    - 2007
    - 2025
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Ano da notificação\" (notification.year): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Ano da notificação
    years:
    - 2007
    - 2025
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age_coded): attribute of the patient (age, birth, residence, occupation, employer)"
    note: Age with its unit packed into the first digit (1 hours, 2 days, 3 months, 4 years); the age stratum is
      the derived IDADE_anos.
    name: Idade
    years:
    - 2007
    - 2025
  PRE_MUNIRE:
    role: pregnancy.prenatal_municipality
    kind: place
    model: mark
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município de realização do pré-natal\" (pregnancy.prenatal_municipality): prenatal care, test dates and delivery type: how care happened"
    name: Município de realização do pré-natal
    codelists:
    - BR_MUNICIPALFA
    years:
    - 2007
    - 2025
  PRE_UFREL:
    role: pregnancy.prenatal_state
    kind: place
    model: mark
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF de realização do pré-natal\" (pregnancy.prenatal_state): prenatal care, test dates and delivery type: how care happened"
    name: UF de realização do pré-natal
    codelists:
    - UF_BR
    years:
    - 2007
    - 2025
  SEM_DIAG:
    role: case.diagnosis_week
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Semana Epidemiológica do Diagnóstico\" (case.diagnosis_week): laboratory result, titre, clinical measure, time to onset or exposure of the case: the health event"
    name: Semana Epidemiológica do Diagnóstico
    years:
    - 2007
    - 2025
  SG_UF:
    role: patient.residence_state
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"UF de Residência\" (patient.residence_state): attribute of the patient (age, birth, residence, occupation, employer)"
    name: UF de Residência
    codelists:
    - UF_BR
    years:
    - 2007
    - 2025
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF de Notificação\" (notification.state): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: UF de Notificação
    codelists:
    - UF_BR
    years:
    - 2007
    - 2025
  TPCONFIRMA:
    missing: ['0', '4', '5', '6', '7', '8', '9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='Reagente', 2='Não reagente', 3='Não realizado', 9='Ignorado'; the tabulation: 0='Ign/Branco', 4='Ign/Branco', 5='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'
    role: case.confirmatory_test
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Teste confirmatório\" (case.confirmatory_test): fact about the health event or the person's health"
    name: Teste confirmatório
    years:
    - 2007
    - 2025
  TPESQPAR:
    missing: ['9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='penicilina g benzatina', 2='400.000ui 2 - penicilina g benzatina', 3='penicilina g benzatina', 4='800.000ui', 5='não realizado', 7='200..000ui 4 - outro esquema', 9='ignorado'; the tabulation: no value labelled as not recorded
    role: treatment.partner_regimen
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Esquema de tratamento prescrito ao parceiro\" (treatment.partner_regimen): treatment given to the case"
    note: Draft typing said number; coded regimen per curation.
    name: Esquema de tratamento prescrito ao parceiro
    years:
    - 2007
    - 2025
  TPESQUEMA:
    missing: ['0', '6', '8', '9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='Penicilina G benzatina', 2='400.000UI 2 - Penicilina G benzatina', 3='Penicilina G benzatina', 4='800.000UI', 5='Não realizado', 7='200..000UI 4 - Outro esquema', 9='Ignorado'; the tabulation: 0='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'; the form overrules the tabulation on ['7']
    role: treatment.regimen
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Esquema de tratamento\" (treatment.regimen): treatment given to the case"
    name: Esquema de tratamento
    years:
    - 2007
    - 2025
  TPEVIDENCI:
    missing: ['0', '5', '6', '7', '8', '9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='Primária', 2='Secundária', 3='Terciária', 4='Latente', 9='Ignorado'; the tabulation: 0='Ign/Branco', 5='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'
    role: case.clinical_stage
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Classificação clínica\" (case.clinical_stage): fact about the health event or the person's health"
    name: Classificação clínica
    years:
    - 2007
    - 2025
  TPMOTPARC:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2023)'
    role: treatment.partner_untreated_reason
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Motivo para o não tratamento do parceiro\" (treatment.partner_untreated_reason): treatment given to the case"
    note: Draft typing said number; coded reason per curation.
    name: Motivo para o não tratamento do parceiro
    years:
    - 2007
    - 2025
  TPTESTE1:
    missing: ['0', '4', '5', '6', '7', '8', '9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 2='Não reagente', 3='Não realizado', 9='Ignorado'; the tabulation: 0='Ign/Branco', 4='Ign/Branco', 5='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'; CONFLICT: the records use ['1'], which the form does not define
    role: case.first_test
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Primeiro teste\" (case.first_test): fact about the health event or the person's health"
    name: Primeiro teste
    years:
    - 2007
    - 2025
  TP_NOT:
    missing: []
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt): 1 Negativa, 2 Individual, 3 Surto, 4 Agregado, a mandatory field with no code for not recorded
    role: notification.type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de Notificação\" (notification.type): notification type (individual, negative, ...): record type"
    name: Tipo de Notificação
    years:
    - 2007
    - 2025
  TRATPARC:
    missing: ['9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='sim', 2='não', 9='ignorado'; the tabulation: no value labelled as not recorded
    role: treatment.partner_treated
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Parceiro tratado concomitantemente à gestante\" (treatment.partner_treated): treatment given to the case"
    note: Draft typing said number; coded yes/no per curation.
    name: Parceiro tratado concomitantemente à gestante
    years:
    - 2007
    - 2025
  IDADE_anos:
    missing_unknown: 'no codelist or tabulation band of DATASUS bounds it'
    role: patient.age_years
    kind: number
    model: stratum
    unit: years
    unit_evidence: "made by the query, not filed by DATASUS: whole years from the age and its unit column (ADR-0070, `_age.py`); the declaration's own name is \"Idade em anos\""
    fact_domain: person
    fact_domain_evidence: "\"IDADE_anos\" (patient.age_years): attribute of the patient (age, birth, residence, occupation, employer)"
    derived: true
    note: Fractional years derived from NU_IDADE_N by the query (ADR-0070).
