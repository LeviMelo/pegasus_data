dataset: DADOS_ABERTOS-COBERTURA_RESIDENCIA
record: procedure
columns:
  CO_ANO:
    role: vaccination.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (vaccination.year): reference period or load date of the published aggregate"
    name: Ano
    years:
    - 
    - 
  CO_MUNICIPIO:
    role: patient.residence
    kind: place
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Código do município\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    codelists:
    - BR_MUNICIPALFA
    name: Código do município
    years:
    - 
    - 
    note: Municipality of residence of the people vaccinated (the publication's name and the SI-PNI panel's 
      definition).
  CO_UF:
    role: vaccination.state
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Código da Unidade da Federação\" (vaccination.state): record type, internal flag or system field"
    name: Código da Unidade da Federação
    years:
    - 
    - 
    codelists:
    - UF_BR
    note: State abbreviation (MG, SP).
  DT_CARGA:
    role: vaccination.load_date
    kind: date
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Data de carga\" (vaccination.load_date): reference period or load date of the published aggregate"
    name: Data de carga
    years:
    - 
    - 
    note: DD/MM/YYYY of the extract.
  NU_IMUNO:
    role: vaccination.vaccine
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: "column NU_IMUNO, no label recorded (vaccination.vaccine): how care or investigation was carried out"
    years:
    - 
    - 
    note: The vaccine's name as text (BCG, Febre Amarela), not a code.
  NU_POPULACAO:
    role: vaccination.target_population
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"População\" (vaccination.target_population): population targeted: persons"
    name: População
    years:
    - 
    - 
  NU_TAXA_COBERTURA:
    role: vaccination.coverage
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Taxa de cobertura vacinal\" (vaccination.coverage): doses applied and coverage: care delivered"
    measure: false
    name: Taxa de cobertura vacinal
    years:
    - 
    - 
    note: A fraction (0.96), not a percentage; the published rate, never summed or recomputed.
  QT_DOSE:
    role: vaccination.doses
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Quantidade de doses\" (vaccination.doses): doses applied and coverage: care delivered"
    name: Quantidade de doses
    years:
    - 
    - 
