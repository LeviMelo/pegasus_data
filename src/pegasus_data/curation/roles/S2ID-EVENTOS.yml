# S2iD, disasters registered by municipalities since 1991: one row per municipal event (intake source s2id).
# Meaning from the MIDR/SEDEC 'Dicionário de Dados - Reconhecimento Federal - Relatório Gerencial - Dados informados' (updated 2021-10-13, https://dadosabertos.mdr.gov.br/dataset/1aabd419-5677-4fa2-a0e3-a1a3e1a42234), whose column names are the 2021 file's; the file of 2026 (70 columns, 76,190 rows) was read. The 15 first columns are the ones pegasus_data declares and reads; the 55 after them are described from the same dictionary where it names them (the 2026 file abbreviates the names of the 2021 dictionary), and `review: draft` where it does not.
dataset: S2ID-EVENTOS
record: disaster
columns:
  Cod_Cobrade:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2025)'
    role: disaster.cobrade
    kind: category
    model: dimension
    fact_domain: administrative
    fact_domain_evidence: '"COBRADE" (disaster.cobrade): the disaster event reported by a municipality: the disaster register'
    name: COBRADE
    years:
    - 1991
    - 2025
    note: Brazilian classification of disasters; the dictionary calls it the type of disaster. S2iD types an event by its
      trigger, not its consequence.
  Cod_IBGE_Mun:
    role: disaster.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: '"Município" (disaster.municipality): the disaster event reported by a municipality: the disaster
      register'
    width: 7
    width_evidence: all 76,190 values of the 2026 file have 7 characters (IBGE code with check digit)
    name: Município
    years:
    - 1991
    - 2025
  Data_Evento:
    role: disaster.date
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: '"Data do evento" (disaster.date): the disaster event reported by a municipality: the disaster register'
    name: Data do evento
    years:
    - 1991
    - 2025
    note: dd/mm/yyyy; 1991 to 2025 in the file read.
  descricao_tipologia:
    role: disaster.type_description
    kind: text
    model: excluded
    name: Descrição da tipologia
    years:
    - 1991
    - 2025
  DH_AFETADOS_SECA_ESTIAGEM:
