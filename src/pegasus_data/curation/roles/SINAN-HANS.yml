dataset: SINAN-HANS
record: notification
columns:
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    note: Year only; a stratum needs a population-account property (birth_date or age_*), so mark.
    name: Ano de Nascimento
    years:
    - 2001
    - 2026
  AVALIA_N:
    missing: []
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 0='Grau zero', 1='Grau I', 2='Grau II', 3='Não avaliado'; the tabulation: no value labelled as not recorded
    role: case.disability_at_diagnosis
    kind: category
    model: mark
    name: Avaliação do Grau de Incapacidade Física no Diagnóstico
    years:
    - 2001
    - 2026
  AVAL_ATU_N:
    missing: ['9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 0='grau zero', 1='grau I', 2='grau II', 3='Não avaliado', 9='Ignorado'; the tabulation: no value labelled as not recorded
    role: treatment.disability_at_discharge
    kind: category
    model: mark
    name: Avaliação de incapacidade física no momento da cura
    years:
    - 2001
    - 2026
