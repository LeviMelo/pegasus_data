dataset: SINAN-PFAN
record: notification
columns:
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Ano de Nascimento\" (patient.birth_year): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Ano de Nascimento
    years:
    - 2007
    - 2026
    note: Four-digit birth year (the form's notification block); a calendar index, not a measurement.
  ANT_30_DIA:
    missing: ['0', '3', '4', '5', '6', '7', '8', '9']
    # declared from DATASUS's own sources (2019-2021): the form's dictionary: 1='Sim', 2='Não', 9='Ignorado'; the tabulation: 0='Ign/Branco', 3='Ign/Branco', 4='Ign/Branco', 5='Ign/Branco', 6='Ign/Branco', 7='Ign/Branco', 8='Ign/Branco', 9='Ign/Branco'
    role: case.vaccinated_within_30_days_before_onset
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Recebeu vacina nos 30 dias anteriores\" (case.vaccinated_within_30_days_before_onset): fact about the health event or the person's health"
    name: Recebeu vacina nos 30 dias anteriores
    years:
    - 2007
    - 2026
  ANT_DOSES:
    missing_unknown: 'no codelist or tabulation band of DATASUS bounds it'
    role: case.number_of_polio_doses_received
    kind: number
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Número de doses válidas\" (case.number_of_polio_doses_received): laboratory result, titre, clinical measure, time to onset or exposure of the case: the health event"
