dataset: PNI-CPNI
record: vaccination
columns:
  ANO:
    role: vaccination.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (vaccination.year): reference period or load date of the published aggregate"
    name: Ano
    years:
    - 1994
    - 2019
  COBERT:
    role: vaccination.coverage_percent
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Cobertura Vacinal\" (vaccination.coverage_percent): doses applied and coverage: care delivered"
    measure: false
    name: Cobertura Vacinal
    years:
    - 1994
    - 2019
    note: The coverage DATASUS publishes, a percentage with a decimal comma (29,53); a finished rate, not 
      additive, never recomputed here.
  DOSE:
    missing: []
    # declared from DATASUS's own sources (SP 2004): no form dictionary; the table names every code the records use, each with its own label (01='1ª dose', 02='2ª dose', 03='3ª dose', 04='dose única'): a code table, not a catch-all; no value labelled as not recorded
    role: vaccination.dose
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: "\"Dose\" (vaccination.dose): how care or investigation was carried out"
    name: Dose
    years:
    - 1994
    - 2012
    codelists:
    - DOSE
  FX_ETARIA:
    missing: []
    # declared from DATASUS's own sources (SP 2004): no form dictionary; the table names every code the records use, each with its own label (02='homens sem discriminação de idade', 06='homens 12 a 14 anos', 23='homens 12 a 49 anos', 50='menor de 1 ano', 51='1 ano', 53='3 anos', 59='1 a 4 anos', 72='2 meses'): a code table, not a catch-all; no value labelled as not recorded
    role: vaccination.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Faixa Etária\" (vaccination.age_band): attribute of the person (age)"
    name: Faixa Etária
    years:
    - 1994
    - 2012
    codelists:
    - FXET
  IMUNO:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2019)'
    role: vaccination.vaccine
    kind: category
    model: dimension
    fact_domain: process
    fact_domain_evidence: "\"Imunobiológico\" (vaccination.vaccine): how care or investigation was carried out"
    name: Imunobiológico
    years:
    - 1994
    - 2019
    codelists:
    - IMUNO
    - IMUNOC
    - COBIMUNO
    - COBIMUC
  MUNIC:
    role: vaccination.municipality
    kind: place
    model: where
    place_of: event
    codelists:
    - BR_MUNICIPALFA
    name: Município
    years:
    - 1994
    - 2019
    note: The variable note says the municipality of application; the open-data republication names the same 
      file ..._RESIDENCIA (residence). Both claims recorded; not resolved.
  POP:
    missing: []
    # measured 2019 (401 rows, 384 filled): range [66, 79855], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: vaccination.target_population
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"População Alvo\" (vaccination.target_population): population targeted: persons"
    name: População Alvo
    years:
    - 1994
    - 2019
    note: The coverage's denominator, as published.
  QT_DOSE:
    missing: []
    # measured 2019 (401 rows, 401 filled): range [1, 35312], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    role: vaccination.doses
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Quantidade de Doses Aplicadas\" (vaccination.doses): doses applied and coverage: care delivered"
    name: Quantidade de Doses Aplicadas
    years:
    - 1994
    - 2019
  UF:
    role: vaccination.state
    kind: place
    model: mark
    place_of: record
    codelists:
    - UF_BR
    name: Unidade da Federação
    years:
    - 1994
    - 2019
