# SINAN's individual-notification block: the columns every agravo's form carries (sinan_agravos.yml's header:
# "every agravo carries SINAN's notification block"). Declared once, from SINAN-LEPT's curated entries, without their
# years (each agravo's files carry the block in their own). `column_roles.roles()` reads it for a SINAN agravo that has
# no roles file of its own; an agravo's own file always wins. Only the block: an agravo's own investigation fields
# are declared in its own file, never inferred from another's (2026-10-07).
dataset: SINAN-*
record: notification
columns:
  ID_MN_RESI:
    role: patient.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Município de Residência\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    also:
    - case.residence
    name: Município de Residência
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Município de Notificação\" (notification.municipality): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
  ID_RG_RESI:
    role: patient.residence_health_region
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Regional de Saúde da Residência\" (patient.residence_health_region): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Regional de Saúde da Residência
    codelists:
    - REGIONET
    - CIR_BR
  ID_REGIONA:
    role: notification.health_region
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"Regional de Saúde da Notificação\" (notification.health_region): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Regional de Saúde da Notificação
    codelists:
    - REGIONET
    - CIR_BR
  ID_PAIS:
    role: patient.residence_country
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"País de Residência\" (patient.residence_country): attribute of the patient (age, birth, residence, occupation, employer)"
    name: País de Residência
    codelists:
    - PAISNET
  SG_UF:
    role: patient.residence_state
    kind: place
    model: dimension
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"UF de Residência\" (patient.residence_state): attribute of the patient (age, birth, residence, occupation, employer)"
    name: UF de Residência
    codelists:
    - UF_BR
    note: 'State of residence: redundant with the first two digits of ID_MN_RESI (the stratum); kept as a dimension
      because `residence_state` is not a population-account property name.'
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    place_of: event
    fact_domain: process
    fact_domain_evidence: "\"UF de Notificação\" (notification.state): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: UF de Notificação
    codelists:
    - UF_BR
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data da Notificação\" (notification.date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data da Notificação
  DT_SIN_PRI:
    role: case.onset
    kind: date
    model: when
    fact_domain: clinical
    fact_domain_evidence: "\"Data dos Primeiros Sintomas / Data do Diagnóstico\" (case.onset): onset, exposure, diagnosis, outcome or vaccination date of the case: the health event"
    name: Data dos Primeiros Sintomas / Data do Diagnóstico
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Ano da notificação\" (notification.year): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Ano da notificação
  ID_AGRAVO:
    role: case.disease
    kind: code_tree
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Agravo/doença\" (case.disease): diagnosis, classification or injury code of the case: the health event"
    name: Agravo/doença
    codelists:
    - ICD10
    - AGRAVONOTS
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
  ID_UNIDADE:
    role: notification.facility
    kind: institution
    width: 7
    width_evidence: "SINAN stores the notifying unit as a number: zero-filled to CNES's 7 digits, the commonest short codes are CNES establishments registered in their notifications' municipality (TOXC 2023 8 of 8, DENG 2023 20 of 20; 2026-10-12)"
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"Unidade de Saúde Notificadora\" (notification.facility): notifying unit, or the record's own system timestamp: facility register and record keeping"
    name: Unidade de Saúde Notificadora
    codelists:
    - AB
    - NHE
    - NHENIVEL
    - NHEUNIDADE
    - NHE_NIVEL_MUN
    - UNIDANET
    - CADGERBR
  CS_SEXO:
    missing:
    - 'I'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: I- Ignorado
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (patient.sex): attribute of the person (sex)"
    also:
    - case.sex
    name: Sexo
    codelists:
    - SEXO
  CS_RACA:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.race
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Raça/Cor\" (patient.race): attribute of the person (race/colour)"
    name: Raça/Cor
    codelists:
    - RAÇA
  CS_GESTANT:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9. Ignorado
    role: patient.pregnancy_status
    kind: category
    model: dimension
    fact_domain: clinical
    fact_domain_evidence: "\"Gestante\" (patient.pregnancy_status): fact about the health event or the person's health"
    name: Gestante
    codelists:
    - GESTANTE
  CS_ESCOL_N:
    missing:
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: 9 Ignorado
    role: patient.education
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Escolaridade\" (patient.education): attribute of the person (schooling)"
    name: Escolaridade
    codelists:
    - ESCOLARNET
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age_coded): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Idade
    note: Age with its unit packed into the first digit (1 hours, 2 days, 3 months, 4 years); the age stratum 
      is the derived IDADE_anos.
  IDADE_anos:
    role: patient.age_years
    kind: number
    model: stratum
    unit: years
    unit_evidence: "made by the query, not filed by DATASUS: whole years from the age and its unit column (ADR-0070, `_age.py`); the declaration's own name is \"Idade em anos\""
    fact_domain: person
    fact_domain_evidence: "\"IDADE_anos\" (patient.age_years): attribute of the patient (age, birth, residence, occupation, employer)"
    derived: true
    note: Fractional years derived from NU_IDADE_N by the query (ADR-0070).
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Ano de Nascimento\" (patient.birth_year): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Ano de Nascimento
    note: Four-digit birth year (the form's notification block); a calendar index, not a measurement.
