# SINAN's individual-notification block: the columns every agravo's form carries (sinan_agravos.yml's header:
# "every agravo carries SINAN's notification block"). Declared once, from SINAN-LEPT's curated entries, without their
# years (each agravo's files carry the block in their own). `column_roles.roles()` reads it for a SINAN agravo that has
# no roles file of its own; an agravo's own file always wins. Only the block: an agravo's own investigation fields
# are declared in its own file, never inferred from another's (2026-10-07).
dataset: SINAN-*
record: notification
columns:
  ID_MN_RESI:
    role: patient.residence
    kind: place
    model: stratum
    also:
    - case.residence
    name: Município de Residência
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
  ID_MUNICIP:
    role: notification.municipality
    kind: place
    model: where
    name: Município de Notificação
    codelists:
    - BR_MUNICIPALFA
    - CAPITAL
    - CLUSTERBR
    - MUFROPY
    - MUNFRONT
    - MUNFRONT_1
    - MUNICAC
  ID_RG_RESI:
    role: patient.residence_health_region
    kind: place
    model: dimension
    name: Regional de Saúde da Residência
    codelists:
    - REGIONET
    - CIR_BR
  ID_REGIONA:
    role: notification.health_region
    kind: place
    model: where
    name: Regional de Saúde da Notificação
    codelists:
    - REGIONET
    - CIR_BR
  ID_PAIS:
    role: patient.residence_country
    kind: place
    model: dimension
    name: País de Residência
    codelists:
    - PAISNET
  SG_UF:
    role: patient.residence_state
    kind: place
    model: dimension
    name: UF de Residência
    codelists:
    - UF_BR
    note: 'State of residence: redundant with the first two digits of ID_MN_RESI (the stratum); kept as a dimension because
      `residence_state` is not a population-account property name.'
  SG_UF_NOT:
    role: notification.state
    kind: place
    model: where
    name: UF de Notificação
    codelists:
    - UF_BR
  DT_NOTIFIC:
    role: notification.date
    kind: date
    model: when
    name: Data da Notificação
  DT_SIN_PRI:
    role: case.onset
    kind: date
    model: when
    name: Data dos Primeiros Sintomas / Data do Diagnóstico
  NU_ANO:
    role: notification.year
    kind: number
    model: mark
    name: Ano da notificação
  ID_AGRAVO:
    role: case.disease
    kind: code_tree
    model: event_type
    name: Agravo/doença
    codelists:
    - ICD10
    - AGRAVONOTS
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
  ID_UNIDADE:
    role: notification.facility
    kind: institution
    model: institution
    name: Unidade de Saúde Notificadora
    codelists:
    - AB
    - NHE
    - NHENIVEL
    - NHEUNIDADE
    - NHE_NIVEL_MUN
    - UNIDANET
    - CADGERBR
  CS_SEXO:
    role: patient.sex
    kind: category
    model: stratum
    also:
    - case.sex
    name: Sexo
    codelists:
    - SEXO
  CS_RACA:
    role: patient.race
    kind: category
    model: stratum
    name: Raça/Cor
    codelists:
    - RAÇA
  CS_GESTANT:
    role: patient.pregnancy_status
    kind: category
    model: dimension
    name: Gestante
    codelists:
    - GESTANTE
  CS_ESCOL_N:
    role: patient.education
    kind: category
    model: dimension
    name: Escolaridade
    codelists:
    - ESCOLARNET
  NU_IDADE_N:
    role: patient.age_coded
    kind: number
    model: mark
    name: Idade
    note: Age with its unit packed into the first digit (1 hours, 2 days, 3 months, 4 years); the age stratum is the derived
      IDADE_anos.
  IDADE_anos:
    role: patient.age_years
    kind: number
    model: stratum
    derived: true
    note: Fractional years derived from NU_IDADE_N by the query (ADR-0070).
  ANO_NASC:
    role: patient.birth_year
    kind: number
    model: mark
    review: draft
    name: Ano de Nascimento
    note: 'Meaning inferred (curation source: inferred): a 4-digit birth year. No population-account property name fits a
      birth year, so model is provisional.'
