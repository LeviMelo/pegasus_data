dataset: SIASUS-AMP
record: procedure
columns:
  AMP_ACEVAS:
    role: authorisation.vascular_access_type
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Acesso vascular\" (authorisation.vascular_access_type): fact about the health event or the person's health"
    name: Acesso vascular
    years:
    - 2016
    - 2026
  AMP_ALBUMI:
    role: authorisation.serum_albumin
    kind: number
    missing_unknown: "the AMP file's own \"not recorded\" fills are not measured here (one file, 2025); the dialysis homonym's are ('0000', '0', '9999', ...; ATD, 2026-10-14)"
    unit_unknown: "no document of the AMP file gives the unit of serum albumin; the dialysis homonym is no more explicit for PTH and Kt/V (Informe_Tecnico_SIASUS_2019_07.pdf)"
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Albumina\" (authorisation.serum_albumin): fact about the health event or the person's health"
    name: Albumina
    note: "A laboratory value, not a code: the field is \"serum albumin\" in the dialysis block of the APAC layout (Layout interno do APAC 11/04/2014 APA_ALBUMI; ATD_ALBUMI in Informe Técnico SIASUS 2019-07 §3.4.8), and the AMP 2025 file holds decimal and zero-padded numbers ('4.0', '0000', '0001', '45'; 74 distinct values), which no code table is (measured 2026-10-24)."
    years:
    - 2016
    - 2026
  AMP_CARACT:
