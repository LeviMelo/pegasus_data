# CENSO2010-MORTALIDADE: one death in a sampled household between August 2009 and July 2010, as the household reported it (intake source census2010_mortalidade).
# Meaning from IBGE's own layout, Layout_microdados_Amostra.xls sheet MORT (Documentacao.zip of the microdata): each variable's name, positions, digits and code list; the title is IBGE's words.
# A property is named in English where it is a stratum or a key; every other variable is `<entity>.<IBGE variable>`, because translating 300 questionnaire items would add claims the layout does not make.
dataset: CENSO2010-MORTALIDADE
record: death
columns:
  CODMUN:
    role: deceased.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: '"CÓDIGO DO MUNICÍPIO" with the state (V0001, V0002) (deceased.residence): attribute of the person, the municipality
      of the household'
    name: Município de residência (UF + código do município)
    years:
    - 2010
    - 2010
    note: 7-digit IBGE code made of V0001 and V0002 (positions 1-7); 6-digit places of the lake come from it
  V0001:
    role: deceased.state_code
    kind: place
    model: mark
    place_of: subject
    fact_domain: administrative
    fact_domain_evidence: '"UNIDADE DA FEDERAÇÃO" (deceased.state_code): geography, sampling or processing key of the survey'
    name: UNIDADE DA FEDERAÇÃO
    years:
    - 2010
    - 2010
  V0002:
    role: deceased.municipality_code_in_state
    kind: category
    model: excluded
    name: CÓDIGO DO MUNICÍPIO
    years:
    - 2010
    - 2010
    missing: []
  V0011:
    role: deceased.weighting_area
    kind: identifier
    model: link_only
    name: ÁREA DE PONDERAÇÃO
    years:
    - 2010
    - 2010
  V0300:
    role: deceased.household_control
    kind: identifier
    model: link_only
    name: CONTROLE
    years:
    - 2010
    - 2010
  V0010:
    role: deceased.sample_weight
    kind: number
    model: mark
    measure: false
    fact_domain: administrative
    fact_domain_evidence: '"PESO AMOSTRAL" (deceased.sample_weight): geography, sampling or processing key of the survey'
    name: PESO AMOSTRAL
    note: 3 digits then 13 after an implied decimal point; the digits as filed are V0010__RAW.
    years:
    - 2010
    - 2010
  V1001:
    role: deceased.region
    kind: category
    model: dimension
    fact_domain: administrative
    fact_domain_evidence: '"REGIÃO GEOGRÁFICA" (deceased.region): geography, sampling or processing key of the survey'
    name: REGIÃO GEOGRÁFICA
    years:
    - 2010
