dataset: IBGE-PROJUF
record: population
columns:
  ANO:
    role: population.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (population.year): reference year of the population table"
    name: Ano
    years:
    - 2000
    - 2070
  IDADE:
    role: population.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Age\" (population.age_band): attribute of the person (age)"
    name: Age
    years:
    - 2000
    - 2070
    note: 'An age or a band as the table codes it: single years (000), bands (2559 = 25-59), or A0000.'
  POPULACAO:
    role: population.count
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Population count\" (population.count): count of persons in the population table"
    name: Population count
    years:
    - 2000
    - 2070
  SEXO:
    role: population.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (population.sex): attribute of the person (sex)"
    name: Sexo
    years:
    - 2000
    - 2070
    note: Coded M/F in some tables and 1/2 in others (the variable note).
  UFCOD:
    role: population.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Unidade da Federação\" (population.residence): count of persons in the population table"
    codelists:
    - UF_BR
    name: Unidade da Federação
    years:
    - 2000
    - 2070
    note: "The projections' only place: a state."
