dataset: IBGE-PROJUF
record: population
columns:
  ANO:
    role: population.year
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Ano\" (population.year): reference year of the population table"
    name: Ano
    years:
    - 2000
    - 2070
  IDADE:
    missing_unknown: 'no form dictionary is harvested for it, and DATASUS''s tabulation alone does not declare (no value labelled as not recorded; 2070)'
    role: population.age_band
    kind: category
    model: dimension
    fact_domain: person
    fact_domain_evidence: "\"Age\" (population.age_band): attribute of the person (age)"
    name: Age
    years:
    - 2000
    - 2070
    note: 'An age or a band as the table codes it: single years (000), bands (2559 = 25-59), or A0000.'
  POPULACAO:
    missing: []
    # measured 2070 (4914 rows, 4914 filled): range [1496, 790083], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded (no codelist or tabulation band of DATASUS bounds it)
    # a zero is a recorded zero, not a missing code: a quantity that can be none (no zero in the 4,914 values of 2070; 2026-11-23)
    role: population.count
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Population count\" (population.count): count of persons in the population table"
    name: Population count
    years:
    - 2000
    - 2070
  SEXO:
    role: population.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (population.sex): attribute of the person (sex)"
    name: Sexo
    years:
    - 2000
    - 2070
    note: Coded M/F in some tables and 1/2 in others (the variable note).
  UFCOD:
    role: population.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Unidade da Federação\" (population.residence): count of persons in the population table"
    codelists:
    - UF_BR
    name: Unidade da Federação
    years:
    - 2000
    - 2070
    note: "The projections' only place: a state."
