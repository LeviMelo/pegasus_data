dataset: SIHSUS-MT
record: act
columns:
  ANO_MES:
    role: act.processing_competence
    kind: date
    model: when
    fact_domain: administrative
    fact_domain_evidence: "\"Processing year-month (professional-acts file)\" (act.processing_competence): payment points, value or processing competence of the professional act: billing"
    name: Processing year-month (professional-acts file)
    years:
    - 1995
    - 1997
    note: YYYYMM of processing.
  ATO_PROF:
    role: act.procedure
    kind: code_tree
    model: event_type
    fact_domain: process
    fact_domain_evidence: "\"Professional-act (procedure) code\" (act.procedure): procedure or quantity of acts performed: care delivered"
    codelists:
    - TPROC
    name: Professional-act (procedure) code
    years:
    - 1995
    - 1997
    note: Eight-digit SIH procedure codes (1995-1997), before SIGTAP.
  CGC_CPF:
    role: act.provider_document
    kind: identifier
    model: link_only
    name: Professional's or entity's CGC/CPF
    years:
    - 1995
    - 1997
    note: A CGC (legal entity) or a CPF (person) as ID_CGC_CPF says; a CPF is a direct personal identifier and
      passes through unchanged.
  CGC_HOSP:
    role: facility.cnpj
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"CNPJ do Estabelecimento\" (facility.cnpj): facility register (CNES): establishment, bed, equipment, team, habilitation or professional"
    name: CNPJ do Estabelecimento
    codelists:
    - CNPJ_BR
    years:
    - 1995
    - 1997
    note: role from SIH-RD
  ESPEC:
    missing: []
    role: admission.bed_specialty
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Especialidade do Leito\" (admission.bed_specialty): specialty of the bed used: a care-process fact"
    name: Especialidade do Leito
    years:
    - 1995
    - 1997
    note: role from SIH-RD
  ID_CGC_CPF:
    role: act.provider_document_type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"CGC-vs-CPF indicator\" (act.provider_document_type): attribute of the establishment register (structure, service, management)"
    name: CGC-vs-CPF indicator
    years:
    - 1995
    - 1997
  NUM_PROC:
    role: admission.process_number
    kind: identifier
    model: excluded
    name: Número do processo
    years:
    - 1995
    - 1997
    note: role from SIH-RD
  N_AIH:
    role: admission.aih
    kind: identifier
    model: link_only
    name: Número da AIH
    years:
    - 1995
    - 1997
    note: role from SIH-RD
  QTD_ATO:
    role: act.quantity
    kind: number
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Quantity of the act\" (act.quantity): procedure or quantity of acts performed: care delivered"
    name: Quantity of the act
    years:
    - 1995
    - 1997
  RATEIO:
    role: act.apportioned
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Apportionment flag/code\" (act.apportioned): attribute of the establishment register (structure, service, management)"
    name: Apportionment flag/code
    years:
    - 1995
    - 1997
  SP_PONTO:
    role: act.points
    kind: number
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Professional-service points\" (act.points): payment points, value or processing competence of the professional act: billing"
    name: Professional-service points
    years:
    - 1995
    - 1997
  TIPO:
    role: act.record_type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Record-type code (1995-1997 professional-acts file)\" (act.record_type): attribute of the establishment register (structure, service, management)"
    name: Record-type code (1995-1997 professional-acts file)
    years:
    - 1995
    - 1997
  TIPO_ATO:
    role: act.type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Type of professional act\" (act.type): attribute of the establishment register (structure, service, management)"
    name: Type of professional act
    years:
    - 1995
    - 1997
  UF_DOM:
    missing: ['00']
    # not recorded, sentinel sweep 2026-11-23 ('00' sihsus_mt 1996:0.03; not a code of UF_BR)
    role: professional.domicile_state
    kind: place
    model: mark
    place_of: subject
    fact_domain: administrative
    fact_domain_evidence: "\"State of the professional's domicile\" (professional.domicile_state): facility register (CNES): establishment, bed, equipment, team, habilitation or professional"
    codelists:
    - UF_BR
    name: State of the professional's domicile
    years:
    - 1995
    - 1997
  UF_VINC:
    role: professional.link_state
    kind: place
    model: mark
    place_of: subject
    fact_domain: administrative
    fact_domain_evidence: "\"State of the professional's institutional link\" (professional.link_state): facility register (CNES): establishment, bed, equipment, team, habilitation or professional"
    codelists:
    - UF_BR
    name: State of the professional's institutional link
    years:
    - 1995
    - 1997
  UF_ZI:
    role: admission.manager_municipality
    kind: place
    model: mark
    place_of: record
    fact_domain: administrative
    fact_domain_evidence: "\"Município Gestor\" (admission.manager_municipality): processing competence or manager authorisation of the AIH: billing and management"
    name: Município Gestor
    codelists:
    - BR_MUNICGESTOR
    years:
    - 1995
    - 1997
    note: role from SIH-RD
  VAL_ATO:
    missing: []
    # measured 1996 (4483286 rows, 4483286 filled): range [0, 4649.74], none negative, non-numeric or fill-shaped at the maximum; the sources name no code for not recorded
    # a zero is a recorded zero, not a missing code: a quantity that can be none (0 on 0.1% of the 4,483,286 values of 1996; 2026-11-23)
    role: act.value
    kind: number
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Value of the act\" (act.value): payment points, value or processing competence of the professional act: billing"
    name: Value of the act
    years:
    - 1995
    - 1997
  ESTADO:
    review: draft
    role: act.state_sinpas
    kind: place
    model: mark
    place_of: record
    name: Estado (name read from the column; no layout found)
    years:
    - 1995
    - 1995
    note: 'Held in the 1995 files only; no layout of the MT (professional acts) file names it (IT_SIHSUS_1603 and GEOCOD_AIH
      document the RD file). The values are UF codes: the national total of the 1995 file is 4,987,902 rows over 27 codes. Coded
      as UFD_SINPAS and UFS_SINPAS are (21 is the commonest value, 1,256,358 rows: São Paulo in the SINPAS code); whose state
      it is, the layout does not say.'
  UFD_IBGE:
    review: draft
    role: act.domicile_state_ibge
    kind: place
    model: mark
    place_of: record
    name: UF D (IBGE code; name read from the column)
    years:
    - 1995
    - 1995
    note: 'Held in the 1995 files only; no layout of the MT (professional acts) file names it (IT_SIHSUS_1603 and GEOCOD_AIH
      document the RD file). The values are UF codes: the national total of the 1995 file is 4,987,902 rows over 27 codes. The
      IBGE UF code (35, São Paulo, is the commonest value); D is read as domicile, as in UF_DOM, which is not confirmed.'
  UFD_SINPAS:
    review: draft
    role: act.domicile_state_sinpas
    kind: place
    model: mark
    place_of: record
    name: UF D (SINPAS code; name read from the column)
    years:
    - 1995
    - 1995
    note: 'Held in the 1995 files only; no layout of the MT (professional acts) file names it (IT_SIHSUS_1603 and GEOCOD_AIH
      document the RD file). The values are UF codes: the national total of the 1995 file is 4,987,902 rows over 27 codes. The
      same state as UFD_IBGE in the SINPAS code (21 where UFD_IBGE is 35: 1,256,128 rows each).'
  UFS_IBGE:
    review: draft
    role: act.service_state_ibge
    kind: place
    model: mark
    place_of: record
    name: UF S (IBGE code; name read from the column)
    years:
    - 1995
    - 1995
    note: 'Held in the 1995 files only; no layout of the MT (professional acts) file names it (IT_SIHSUS_1603 and GEOCOD_AIH
      document the RD file). The values are UF codes: the national total of the 1995 file is 4,987,902 rows over 27 codes. The
      IBGE UF code; what S stands for (service, saída) is not documented.'
  UFS_SINPAS:
    review: draft
    role: act.service_state_sinpas
    kind: place
    model: mark
    place_of: record
    name: UF S (SINPAS code; name read from the column)
    years:
    - 1995
    - 1995
    note: 'Held in the 1995 files only; no layout of the MT (professional acts) file names it (IT_SIHSUS_1603 and GEOCOD_AIH
      document the RD file). The values are UF codes: the national total of the 1995 file is 4,987,902 rows over 27 codes. The
      same state as UFS_IBGE in the SINPAS code.'
