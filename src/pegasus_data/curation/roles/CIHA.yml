dataset: CIHA
record: admission
columns:
  ANO_CMPT:
    role: admission.processing_year
    kind: date
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Ano de processamento\" (admission.processing_year): processing competence or manager authorisation of the AIH: billing and management"
    name: Ano de processamento
    years:
    - 2011
    - 2026
  CAR_INT:
    role: admission.admission_character
    kind: category
    model: excluded
    fact_domain: process
    fact_domain_evidence: "\"Caráter da internação (campo reservado, vazio na CIHA)\" (admission.admission_character): urgent or elective admission: a care-process fact"
    note: Reserved, empty in CIHA.
    name: Caráter da internação (campo reservado, vazio na CIHA)
    years:
    - 2011
    - 2026
  CGC_CONSOR:
    role: admission.payer_consortium_cnpj
    kind: institution
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"CNPJ da Fonte de Remuneração - Consórcios Públicos\" (admission.payer_consortium_cnpj): count or payer of AIH documents: billing"
    note: Filled only when FONTE is 13 (public consortium).
    name: CNPJ da Fonte de Remuneração - Consórcios Públicos
    codelists:
    - CNPJ_BR
    years:
    - 2011
    - 2026
  CGC_HOSP:
    role: facility.cnpj
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"CNPJ do Estabelecimento de Saúde\" (facility.cnpj): facility register (CNES): establishment, bed, equipment, team, habilitation or professional"
    name: CNPJ do Estabelecimento de Saúde
    codelists:
    - CNPJ_BR
    years:
    - 2011
    - 2026
  CNES:
    role: admission.facility
    kind: institution
    model: institution
    fact_domain: administrative
    fact_domain_evidence: "\"Código CNES do estabelecimento\" (admission.facility): facility or its location: the facility register"
    name: Código CNES do estabelecimento
    codelists:
    - CADGERBR
    years:
    - 2011
    - 2026
  COBRANCA:
    role: admission.discharge_reason
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Motivo da cobrança\" (admission.discharge_reason): motivo de saida/permanencia: the code that closes the AIH for payment (billing reason)"
    name: Motivo da cobrança
    codelists:
    - SAIDAPERM
    years:
    - 2011
    - 2026
  COD_IDADE:
    role: patient.age_unit
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Unidade de medida da idade\" (patient.age_unit): encoding unit of another field"
    note: Unit of IDADE; use IDADE_anos.
    name: Unidade de medida da idade
    codelists:
    - IDADEDET
    years:
    - 2011
    - 2026
  DIAG_PRINC:
    role: admission.diagnosis
    kind: code_tree
    model: event_type
    fact_domain: clinical
    fact_domain_evidence: "\"Código do diagnóstico principal\" (admission.diagnosis): diagnosis or cause code: the health event"
    name: Código do diagnóstico principal
    codelists:
    - ICD10
    - S_CID
    years:
    - 2011
    - 2026
  DIAG_SECUN:
    role: admission.secondary_diagnosis
    kind: code_tree
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Diagnóstico secundário (CID-10)\" (admission.secondary_diagnosis): diagnosis or cause code: the health event"
    name: Diagnóstico secundário (CID-10)
    codelists:
    - ICD10
    - S_CID
    years:
    - 2011
    - 2026
  DIAS_PERM:
    missing: []
    domain: [0, 9999]
    # proposed (SP 2026-07): the range DATASUS's tabulation bands label as values; outside it 0 of 282405 values in SP 2026-07 (none)
    role: admission.length_of_stay
    kind: number
    model: mark
    unit: days
    unit_evidence: "Layout_Arquivos_CIHA.pdf field 22 \"Dias de permanência\""
    fact_domain: process
    fact_domain_evidence: "\"Dias de permanência\" (admission.length_of_stay): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Dias de permanência
    years:
    - 2011
    - 2026
  DT_ATEND:
    role: admission.start
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data do atendimento\" (admission.start): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Data do atendimento
    years:
    - 2011
    - 2026
  DT_SAIDA:
    role: admission.end
    kind: date
    model: when
    fact_domain: process
    fact_domain_evidence: "\"Data de saída\" (admission.end): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Data de saída
    years:
    - 2011
    - 2026
  ESPEC:
    role: admission.bed_specialty
    kind: category
    model: excluded
    fact_domain: process
    fact_domain_evidence: "\"Especialidade (campo reservado, vazio na CIHA)\" (admission.bed_specialty): specialty of the bed used: a care-process fact"
    note: Reserved, empty in CIHA.
    name: Especialidade (campo reservado, vazio na CIHA)
    years:
    - 2011
    - 2026
  FONTE:
    missing: []
    # declared from DATASUS's own sources (SP 2026-07): no form dictionary; the table names every code the records use, each with its own label (01='convenio plano privado', 02='particular pessoa fisica', 03='gratuito', 04='financiado/ses', 05='financiado/sms', 06='convenio plano publico', 09='particular pessoa juridica', 10='pronon', 11='pronas/pcd', 13='consorcio'): a code table, not a catch-all; no value labelled as not recorded
    role: admission.payer
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Fonte da remuneração\" (admission.payer): billing, financing, management or contractual attribute"
    name: Fonte da remuneração
    codelists:
    - FONTE
    years:
    - 2011
    - 2026
  GESTAO:
    missing: []
    # declared from DATASUS's own sources (SP 2026-07): no form dictionary; the table names every code the records use, each with its own label (E='estadual plena', M='municipal plena assist'): a code table, not a catch-all; no value labelled as not recorded
    role: admission.management_type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de gestão\" (admission.management_type): management arrangement of the payer: management"
    name: Tipo de gestão
    codelists:
    - GESTAO
    years:
    - 2011
    - 2026
  HOMONIMO:
    role: patient.homonym_flag
    kind: category
    model: excluded
    fact_domain: administrative
    fact_domain_evidence: "\"Homônimo (campo reservado, vazio na CIHA)\" (patient.homonym_flag): encoding unit of another field"
    note: Reserved, empty in CIHA.
    name: Homônimo (campo reservado, vazio na CIHA)
    years:
    - 2011
    - 2026
  IDADE:
    role: patient.age
    measure: false
    kind: number
    model: mark
    fact_domain: person
    fact_domain_evidence: "\"Idade\" (patient.age): attribute of the patient (age, birth, residence, occupation, employer)"
    note: Value packs a unit given by COD_IDADE; IDADE_anos is the age stratum.
    name: Idade
    years:
    - 2011
    - 2026
  MES_CMPT:
    role: admission.processing_month
    kind: date
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Mês de processamento\" (admission.processing_month): processing competence or manager authorisation of the AIH: billing and management"
    name: Mês de processamento
    years:
    - 2011
    - 2026
  MODALIDADE:
    missing: []
    # declared from DATASUS's own sources (SP 2026-07): no form dictionary; the table names every code the records use, each with its own label (00='atendimentos ambulatoriais consolidados', 01='atendimentos ambulatoriais individualizados', 02='internações'): a code table, not a catch-all; no value labelled as not recorded
    role: admission.modality
    kind: category
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Modalidade do atendimento\" (admission.modality): how care or investigation was carried out"
    name: Modalidade do atendimento
    codelists:
    - MODALIDADE
    years:
    - 2011
    - 2026
  MORTE:
    missing: []
    # declared from DATASUS's own sources (SP 2026-07): no form dictionary; the table names every code the records use, each with its own label (0='sem óbito', 1='com óbito'): a code table, not a catch-all; no value labelled as not recorded
    role: admission.death
    kind: category
    model: mark
    fact_domain: clinical
    fact_domain_evidence: "\"Óbito (saída com morte)\" (admission.death): stay ended in death: outcome of the event"
    name: Óbito (saída com morte)
    codelists:
    - MORTES
    years:
    - 2011
    - 2026
  MUNIC_MOV:
    role: admission.facility_municipality
    kind: place
    model: where
    place_of: event
    fact_domain: administrative
    fact_domain_evidence: "\"Município do estabelecimento\" (admission.facility_municipality): facility or its location: the facility register"
    name: Município do estabelecimento
    codelists:
    - BR_MUNICIPALFA
    - BR_MUNICIP
    - BR_REGIAO
    - BR_MACSAUD
    - BR_PNDR
    - BR_CAPITAL
    years:
    - 2011
    - 2026
  MUNIC_RES:
    role: patient.residence
    kind: place
    model: stratum
    place_of: subject
    fact_domain: person
    fact_domain_evidence: "\"Município de residência\" (patient.residence): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Município de residência
    codelists:
    - BR_MUNICIPALFA
    - BR_MUNICIP
    - BR_REGIAO
    - BR_MACSAUD
    - BR_PNDR
    - BR_CAPITAL
    years:
    - 2011
    - 2026
  NACIONAL:
    role: patient.nationality
    kind: category
    model: excluded
    fact_domain: person
    fact_domain_evidence: "\"Nacionalidade (campo reservado, vazio na CIHA)\" (patient.nationality): attribute of the person (nationality/birthplace)"
    note: Reserved, empty in CIHA.
    name: Nacionalidade (campo reservado, vazio na CIHA)
    years:
    - 2011
    - 2026
  NASC:
    role: patient.birth_date
    kind: date
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Data de nascimento do paciente\" (patient.birth_date): attribute of the patient (age, birth, residence, occupation, employer)"
    name: Data de nascimento do paciente
    years:
    - 2011
    - 2026
  NATUREZA:
    role: facility.sus_relation
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Natureza da relação com o SUS\" (facility.sus_relation): attribute of the establishment register (structure, service, management)"
    name: Natureza da relação com o SUS
    codelists:
    - NATUREZA
    - NATUREZC
    years:
    - 2011
    - 2026
  PROC_REA:
    role: admission.procedure
    kind: code_tree
    model: event_type
    fact_domain: process
    fact_domain_evidence: "\"Procedimento realizado\" (admission.procedure): procedure performed or requested: care delivered"
    name: Procedimento realizado
    codelists:
    - SIGTAP
    years:
    - 2011
    - 2026
  QT_PROC:
    role: admission.procedure_count
    kind: number
    model: mark
    unit: count
    unit_of: "procedures"
    unit_evidence: "Layout_Arquivos_CIHA.pdf field 11 \"Quantidade de procedimento\""
    fact_domain: process
    fact_domain_evidence: "\"Quantidade de procedimento\" (admission.procedure_count): count of admissions or procedures: how care was delivered"
    name: Quantidade de procedimento
    years:
    - 2011
    - 2026
  SEXO:
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo do paciente\" (patient.sex): attribute of the person (sex)"
    name: Sexo do paciente
    codelists:
    - SEXO
    years:
    - 2011
    - 2026
  UTI_INT_TO:
    role: admission.intermediate_days
    kind: number
    model: mark
    unit: days
    unit_evidence: "Layout_Arquivos_CIHA.pdf field 9 \"Total de dias de UTI intermediária durante a internação\""
    fact_domain: process
    fact_domain_evidence: "\"Quantidade de diárias em unidade intermediária\" (admission.intermediate_days): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Quantidade de diárias em unidade intermediária
    years:
    - 2011
    - 2026
  UTI_MES_TO:
    role: admission.icu_days_month
    kind: number
    model: mark
    unit_unknown: "Layout_Arquivos_CIHA.pdf gives the field as \"(zerado)\": zero-filled, no quantity"
    fact_domain: process
    fact_domain_evidence: "\"Quantidade de dias de UTI no mês\" (admission.icu_days_month): admission and discharge dates, length of stay, ICU or intermediate-care days: how the stay happened"
    name: Quantidade de dias de UTI no mês
    years:
    - 2011
    - 2026
  IDADE_anos:
    role: patient.age_years
    kind: number
    model: stratum
    unit: years
    unit_evidence: "made by the query, not filed by DATASUS: whole years from the age and its unit column (ADR-0070, `_age.py`); the declaration's own name is \"Idade em anos\""
    fact_domain: person
    fact_domain_evidence: "\"Idade em anos (derivada de IDADE e COD_IDADE)\" (patient.age_years): attribute of the patient (age, birth, residence, occupation, employer)"
    derived: true
    name: Idade em anos (derivada de IDADE e COD_IDADE)
    note: Fractional years by CIH's rule (unit 5 in decades, OQ-74 resolved 2026-10-08).
