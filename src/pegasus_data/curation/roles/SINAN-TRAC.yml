dataset: SINAN-TRAC
record: notification
columns:
  CS_INQUERI:
    missing: []
    # declared from DATASUS's own sources (2023): no form dictionary; the table names every code the records use, each with its own label (1='escolar', 2='domiciliar'): a code table, not a catch-all; no value labelled as not recorded
    role: case.survey_type
    kind: category
    model: mark
    fact_domain: administrative
    fact_domain_evidence: "\"Tipo de inquérito\" (case.survey_type): record type, internal flag or system field"
    name: Tipo de inquérito
    years:
    - 2009
    - 2026
  CS_SEXO:
    missing:
    - 'I'
    - '9'
    # declared from DATASUS's own sources: DIC_DADOS_NET Notificação Individual (rev. Nov/2018, sources/dic_notif_indiv.txt), the notification block every form carries: I- Ignorado; its own form also defines 9 'Ignorado'
    role: patient.sex
    kind: category
    model: stratum
    fact_domain: person
    fact_domain_evidence: "\"Sexo\" (patient.sex): attribute of the person (sex)"
    also:
    - case.sex
    name: Sexo
    codelists:
    - SEXO
    years:
    - 2009
    - 2026
    note: role from the notification block
  DT_DIGITA:
    role: notification.entry_date
    kind: date
    model: mark
    fact_domain: process
    fact_domain_evidence: "\"Data de Digitação\" (notification.entry_date): when, where and by whom the case was notified, investigated, entered, closed or cared for: the notification process"
    name: Data de Digitação
    years:
    - 2009
    - 2026
  DT_NOTIFIC:
