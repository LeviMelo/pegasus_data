# CENSO2010-PESSOAS: one person living in a sampled household of the Census 2010 sample, with the sample weight that expands the row to the population (intake source census2010_pessoas).
# Meaning from IBGE's own layout, Layout_microdados_Amostra.xls sheet PESS (Documentacao.zip of the microdata): each variable's name, positions, digits and code list; the title is IBGE's words.
# A property is named in English where it is a stratum or a key; every other variable is `<entity>.<IBGE variable>`, because translating 300 questionnaire items would add claims the layout does not make.
