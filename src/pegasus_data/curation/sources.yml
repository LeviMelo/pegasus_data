# What every `[TOKEN]` in a `source_ref` actually refers to.
#
# Curation entries cite their evidence as `[ESTRUTURA-SIM] "..."`. Until this
# file existed the tokens resolved to nothing: 396 citations across 41 tokens,
# and no way to tell which document any of them meant, or to check a quote
# against the thing it was quoted from. An unverifiable citation is not much
# better than no citation, and it silently decays into one.
#
# `local` points into `sources/`, which holds the documents themselves. That
# directory is deliberately NOT committed — it is 1.3 GB of Ministry PDFs,
# TabWin .DEF/.CNV packs and extracted evidence, all re-downloadable from the
# DATASUS FTP tree and the SINAN portal. This manifest is committed instead, so
# the trail survives in version control even when the bytes do not.
#
# `local: null` means the document is cited but no copy is vendored. Those are
# listed under `open_questions` rather than quietly dropped.
#
# tests/test_source_manifest.py fails if a curation file cites a token that is
# not declared here, which is what stops the trail dangling again.

