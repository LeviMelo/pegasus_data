  # ==================================================================== SIH
  SIH.CM:
    system: SIH
    series: CM
    # A register of maintainers has a month and no place: nothing is inherited from SIH's AIH block.
    semantic_axes:
      default_time: competence
      time:
        competence: {fields: [COMPET], encoding: yyyymm}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIH.CM: CMBRaamm.dbc, SIHSUS/200801_/Dados) and the catalog's family (3 columns:
      CNPJ_MANT, COMPET, RAZAO; 42 files, 2019-2026)
    what_one_row_is: >-
      one entity that maintains SIH hospitals, in one monthly register of maintainers (CMBRaamm)
    unit_of_analysis: maintainer-month
    use: support
    why_no_event_type: >-
      A register of the entities that maintain SIH's hospitals: one row per maintainer and monthly competence
      (CNPJ and legal name), a standing, not an event.
    gotchas:
      - A dimension, not activity. Counting rows counts maintainers on file, not admissions.
      - Joined to SIH.CH by CNPJ_MANT; the competence is COMPET here and CMPT in CH.
  SIH.CH:
    system: SIH
    series: CH
    # CH is its own register: the municipality of the hospital and the month of the snapshot, not SIH's AIH block (MUNIC_RES, ANO_CMPT).
    semantic_axes:
      default_geography: facility
      geography:
        facility: {fields: [MUNIC_LOC], code_system: ibge_municipality}
      default_time: competence
      time:
        competence: {fields: [CMPT], encoding: yyyymm}
    use: support
    why_no_event_type: >-
      A register of the hospitals that bill SIH: one row per hospital and monthly competence (CNES, CNPJ,
      maintainer, municipality, names), a standing, not an admission.
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIH.CH, corrected 2026-10-08: CHBRaamm.dbc, 2019 onward, 3,785 hospitals in 2026-03) and the
      catalog's family (7 columns: CMPT, CNES, CGC_HOSP, CNPJ_MANT, MUNIC_LOC, NOMEFANT, RAZAO; 42 files, 2019-2026)
    what_one_row_is: one hospital that bills SIH, in one monthly register (CHBRaamm)
    unit_of_analysis: hospital-month
    gotchas:
      - This is a dimension, not activity. Counting rows counts hospitals on file, not admissions.
      - >-
        Not a retired pre-CNES register: the files run from 2019 to 2026 beside CNES. It names the hospitals that bill
        SIH, with the maintainer's CNPJ (joined to SIH.CM).
  SIH.MT:
    system: SIH
    series: MT
    use: not_an_event_source
    why_no_event_type: >-
      Not declared yet: the professional acts billed under an AIH, 1995-1997 (ATO_PROF, QTD_ATO, VAL_ATO per
      N_AIH), the predecessor of SIH-SP, whose procedure event is declared; MT's 17-column layout was never read
      against it.
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIH.MT, corrected 2026-10-08: the expansion of MT is not documented; 4,057,795 rows in
      1997-02) and the catalog's family (17 columns: ATO_PROF, N_AIH, QTD_ATO, VAL_ATO, TIPO_ATO, CGC_CPF ...; 24 files, 1995-1997)
    what_one_row_is: one professional act billed under an AIH, 1995-1997 (national monthly files)
    unit_of_analysis: professional act
    gotchas:
      - >-
        Not a subset of admissions: this entry used to read MT as procedure changes, a reading from the name that the
        columns do not support (the ontology was corrected on 2026-10-08).
      - >-
        The predecessor of SIH.SP (professional services): the act's procedure (ATO_PROF, eight-digit SIH codes), its type,
        quantity, points and value, and the CGC or CPF of the professional or entity paid. A row is an act, not an admission.
  SIH.BASE_AIH1:
    system: SIH
    series: BASE_AIH1
    use: not_an_event_source
    why_no_event_type: >-
      The same admissions as SIH-RD in another layout (one 12 GB DuckDB star schema, 221.5 million AIH rows from
      2008-01, according to the ontology's measurement of 2026-10-08), so counting it beside RD counts every
      admission twice.
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIH.BASE_AIH1, corrected 2026-10-08: SIHSUS/base_aih1.duck, 12 GB, fact table stg_aih of 221.5
      million rows and 74 columns) and the catalog's family (one file, 74 columns, no period)
    what_one_row_is: one approved AIH in a consolidated star schema (a DuckDB database), from 2008-01
    unit_of_analysis: admission
    gotchas:
      - >-
        The same admissions as SIH.RD in another layout, not a supplementary file; never pooled with SIH.RD (twelve
        dimension tables: municipalities, establishments, procedures, ICD subcategories with CSAP groups).
      - Not part of the monthly series: the file has no competence in its name, its competence is the column DT_COMPET.

