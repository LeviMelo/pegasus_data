  SIA.AC:
    system: SIA
    series: AC
    # An explicit empty block, as IBGE.PROJUF's: the 2001-2007 APAC blocks (AC, CO, EX, OP, PC, PF, PQ, PR, UD, UO) carry none of the AP_* columns of SIA's
    # APAC header block, and no layout names their place and competence columns (ADR-0077): nothing is inherited.
    semantic_axes: {}
    use: not_an_event_source
    why_no_event_type: >-
      Not declared yet: the authorisation header of the 2001-2007 APAC archives (one row per APAC), the same
      kind of event the 2008-onward APAC datasets declare as an authorisation; its closing and validity rules
      were never read from a layout (none found, ADR-0077; catalogue confidence medium), and the sibling blocks
      hold the same APACs.
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIA.AC: the authorisation block of the 2001-2007 APAC archives, ACAC0201.EXE) and ADR-0077
    what_one_row_is: >-
      one APAC (authorisation of high-complexity outpatient care) of 2001-2007: its issue and validity dates, type,
      main procedure and closing reason, with the CPF/CNS and names of the patient, the responsible professional and the director
    unit_of_analysis: APAC
    known_biases: >
      Published as self-extracting archives (ACAC0201.EXE) that extension-based
      scanners skip entirely. An archive holds up to seven tables, and from 2005
      the archives named AC hold only the billing block, SIA.CO (ADR-0077).
    gotchas:
      - >-
        One archive is up to seven DBF members, each its own dataset here (SIA.AC, CO, EX, OP, PC, PF, PQ, PR, UD, UO).
        Reading only the first member silently discards the others.
      - The blocks join on their *_NUM column (the APAC number) or *_CODUNI (the unit).
      - Patient CPF columns fail the CPF check digit and are pseudonyms; the responsible-professional and director CPFs are real. See FINDINGS.md 3j.
      - Date of birth, sex, municipality and full postcode are real and unobfuscated, which makes the record re-identifiable without any direct identifier.

  SIA.CO:
    system: SIA
    series: CO
    semantic_axes: {}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIA.CO) and ADR-0077; no layout document found
    what_one_row_is: >-
      one billed procedure of an APAC of 2001-2007: the procedure, its specialty, the quantity and value
      presented and approved (COB_*), with the credit-assignment CNPJ and invoice
    unit_of_analysis: APAC-billed procedure
    use: not_an_event_source
    why_no_event_type: >-
      The billing lines of the APACs of SIA-AC (COB_*: procedure, quantity and value presented and approved), a
