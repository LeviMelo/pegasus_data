        status:
          column: AP_TPAPAC
          values: ["1", "3"]
          evidence: >-
            AP_TPAPAC is 1 on the first monthly row of an APAC, 2 on the rows of its later months and
            3 on a single-row APAC (layout: 1 initial, 2 continuity, 3 single). Measured on AR AC 2023 (all 421 rows type 3) and DF 2015 (type 1 849, type 2 814): every
            APAC with a row of type 1 has it on its earliest competence, where the month of AP_DTINIC
            equals AP_CMP (AQ AC 2023: 2,921 of 2,921); an APAC without one began in an earlier file
            (366 of 3,287). Counting rows of type 1 or 3 counts each APAC once.
        consolidation:
          key: [AP_AUTORIZ]
    asserted_by: pegasus_data
    what_one_row_is: one authorisation for a radiotherapy course
    unit_of_analysis: authorisation
    known_biases: Same SUS-only limitation as SIA.AQ.
    gotchas:
      - A radiotherapy course spans many sessions under one authorisation, so rows are not sessions.
      - Read alongside SIA.AQ for patients receiving both.

  SIA.AM:
    system: SIA
    series: AM
    event_types:
      - name: medicine_authorisation
        kind: authorisation
        grain: one APAC, the authorisation of a period of dispensing a specialised-component medicine
        classifiers:
