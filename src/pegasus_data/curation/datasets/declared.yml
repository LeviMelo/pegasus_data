      carry only this block, whose billed-procedure event is not declared.
    gotchas:
      - Joins SIA.AC on the APAC number (COB_NUM); from 2005 the archives carry only this block (ADR-0077).
      - >-
          Presented and approved quantities and values are separate columns; the money is of the competence
