# What one row IS, for the datasets the ontology declares.
#
# datasets.yml covers the four datasets documented first; this file covers the
# rest of the data-bearing ones. Keyed on the ontology code (SIH.SP) so
# info() joins them to the declaration in ontology.yml.
#
# The point of this file is not to restate the dataset's name. It is to record
# the things that are true about a row and are NOT recoverable from the bytes:
# what the row counts, what it silently excludes, and which mistake people make
# with it first. Every gotcha here is a mistake that has actually been made.
# Semantic axes, declared per SYSTEM rather than per dataset.
#
# Datasets inside a system are not independent: every SIH dataset is a view of
# an AIH and every CIHA row carries the same MUNIC_RES/MUNIC_MOV pair. Restating
# the axes per dataset is the duplication that lets one file drift and answer
# differently from its siblings -- the same failure that put a per-UF codelist on
# a national roll-up (FINDINGS 3n).
#
# GRAIN IS NOT INHERITED and must not be. CNES shares CODUFMUN across all 13 of
# its datasets while their grains differ -- establishment-month,
# professional-establishment-month, establishment-bed type-month -- and treating
# COUNT(*) as one thing across them is precisely what the aggregate algebra
# refuses.
#
# The geography names are analytical facts, not derivable: nothing in the bytes
# says MUNIC_RES is where the patient LIVES and MUNIC_MOV is where they were
# TREATED. The municipality columns themselves are already identifiable from
# their curated codelist binding; only the ROLE needs stating.
#
# Every field named here is checked to exist by
# tests/test_semantic_axes.py, so a typo is a failure rather than a silently
# empty aggregate.
shared_by_system:

  IBGE:
    # The area-year indicator files share MUNCOD and ANO from ibge/_shared.
    # POP and PROJUF override below: POP keys on MUNIC_RES, and PROJUF is
    # projected by STATE, so it must not inherit a municipality axis at all.
    semantic_axes:
      default_geography: area
      geography:
        area: {fields: [MUNCOD], code_system: ibge_municipality}
      default_time: reference
      time:
        reference: {fields: [ANO], encoding: year}

  SIA:
    # The APAC family. `AP_*` is the shared APAC header block, carried by every
    # authorisation sub-layout (AM/AN/AQ/AR/AB/ACF/ATD/...). SIA.PA is the
    # production file and uses `PA_*` instead, so it declares its own in
    # core.yml rather than inheriting this.
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [AP_MUNPCN], code_system: ibge_municipality}
        facility: {fields: [AP_UFMUN], code_system: ibge_municipality}
        manager: {fields: [AP_GESTAO], code_system: ibge_municipality}
      default_time: competence
      time:
        competence: {fields: [AP_CMP], encoding: year_month}
        processing: {fields: [AP_MVM], encoding: year_month}
  SISCAN:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CO_MUN_RESIDENCIA], code_system: ibge_municipality}
        facility: {fields: [CO_MUN_UNIDADE_SAUDE], code_system: ibge_municipality}
      default_time: competence
      time:
        # A YEAR, not a month: SISCAN's shared header carries only ANO_COMP.
        # Declaring a month here would invent a precision the file lacks.
        competence: {fields: [ANO_COMP], encoding: year}
  PNI:
    semantic_axes:
      default_geography: application
      geography:
        application: {fields: [MUNIC], code_system: ibge_municipality}
      default_time: competence
      time:
        competence: {fields: [ANO], encoding: year}
  SIH:
    # Every SIH dataset is a view of an AIH and shares the header block. SIH.RD
    # declares its own in core.yml; the rest inherit this.
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [MUNIC_RES], code_system: ibge_municipality}
        facility: {fields: [MUNIC_MOV], code_system: ibge_municipality}
      default_time: competence
      time:
        competence: {fields: [ANO_CMPT, MES_CMPT], encoding: year_month}
  SISPRENATAL:
    semantic_axes:
      default_geography: facility
      geography:
        facility: {fields: [CO_MUN_UBS], code_system: ibge_municipality}
      default_time: enrolment
      time:
        enrolment: {fields: [DT_INC], encoding: date}

  CIH:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [MUNIC_RES], code_system: ibge_municipality}
        facility: {fields: [MUNIC_MOV], code_system: ibge_municipality}
      default_time: admission
      time:
        admission: {fields: [DT_INTER], encoding: date}
        discharge: {fields: [DT_SAIDA], encoding: date}

  CIHA:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [MUNIC_RES], code_system: ibge_municipality}
        facility: {fields: [MUNIC_MOV], code_system: ibge_municipality}
      default_time: attendance
      time:
        attendance: {fields: [DT_ATEND], encoding: date}
        discharge: {fields: [DT_SAIDA], encoding: date}

  SIM:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CODMUNRES], code_system: ibge_municipality}
        occurrence: {fields: [CODMUNOCOR], code_system: ibge_municipality}
      default_time: occurrence
      time:
        occurrence: {fields: [DTOBITO], encoding: date}
        registration: {fields: [DATAREG], encoding: date}

  SINASC:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CODMUNRES], code_system: ibge_municipality}
        occurrence: {fields: [CODMUNNASC], code_system: ibge_municipality}
      default_time: birth
      time:
        birth: {fields: [DTNASC], encoding: date}
        registration: {fields: [DTCADASTRO], encoding: date}

  CNES:
    semantic_axes:
      default_geography: facility
      geography:
        facility: {fields: [CODUFMUN], code_system: ibge_municipality}
      default_time: competence
      time:
        competence: {fields: [COMPETEN], encoding: year_month}

  RESP:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CODMUNRES], code_system: ibge_municipality}
        notification: {fields: [CODMUNNOT], code_system: ibge_municipality}
      default_time: notification
      time:
        notification: {fields: [DT_NOTIFIC], encoding: date}

  ESUSNOTIFICA:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CD_MN_RESI], code_system: ibge_municipality}
        notification: {fields: [CD_MUNICIP], code_system: ibge_municipality}
      default_time: notification
      time:
        notification: {fields: [DT_NOTIFIC], encoding: date}

  PAINEL_ONCOLOGIA:
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [MUN_RESID], code_system: ibge_municipality}
        diagnosis: {fields: [MUN_DIAG], code_system: ibge_municipality}
        treatment: {fields: [MUN_TRATAM], code_system: ibge_municipality}
      default_time: diagnosis
      time:
        diagnosis: {fields: [DT_DIAG], encoding: date}
        treatment: {fields: [DT_TRAT], encoding: date}

datasets:

  # ------------------------------------------------------------------ SIH
  SIH.SP:
    system: SIH
    series: SP
    event_types:
      - name: procedure
        kind: procedure
        grain: one professional-act line of an AIH, a quantity of one procedure
        weight:
          column: SP_QT_PROC
          evidence: >-
            DATASUS's own tabulation of SP (TAB_SIH SP2008.DEF) sums SP_QT_PROC as "Quantidade Aprovada" and SP_QTD_ATO
            as "Quantidade de Ato"; the approved quantity is the procedure count, as PA_QTDAPR is SIA's (ADR-0155).
            AC 2019-01: 30,321 lines of 3,284 AIHs, every AIH in SIH.RD; SP_QT_PROC is 0 on 6,541 lines (acts billed,
            no procedure approved).
        classifiers:
          - {column: SP_ATOPROF, role: primary, structure: SIGTAP}
          - {column: SP_PROCREA, role: alternative, structure: SIGTAP}
          - {column: SP_CIDPRI, role: alternative, structure: ICD10}
        note: >-
          SP records no sex or age: the patient's are in SIH.RD, on the same AIH (SP_NAIH = N_AIH). The tabulation
          names SP_ATOPROF "Procedimentos Secundários" and SP_PROCREA "Procedimento Principal" (the admission's).
    asserted_by: pegasus_data
    what_one_row_is: one professional act billed inside an admission, NOT one admission
    unit_of_analysis: professional service
    known_biases: >
      Only acts that were billed appear. Care given and not billed — which is
      routine for salaried staff in public hospitals — leaves no row, so SP
      undercounts activity in exactly the settings least driven by billing.
    gotchas:
      - Many rows per AIH. Counting rows counts services, not patients or admissions.
      - Joins to SIH.RD on the AIH number; summing SP as though it were RD multiplies the count several-fold.
      - SP_PROCREA and the RD procedure need not agree — one is the act, the other the admission.
      - The professional identified is the one who billed, not necessarily the one who treated.

  SIH.RJ:
    system: SIH
    series: RJ
    use: not_an_event_source
    why_no_event_type: >-
      A rejection is an administrative outcome of a billing claim, not a clinical event. In Alagoas, 2018, RJ's
      23,601 rows carry 18,598 distinct AIH numbers (a claim is presented again), and 4,885 of them (26.3%) are
      also in SIH-RD that year, so counting RJ beside RD counts admissions twice.
    asserted_by: pegasus_data
    what_one_row_is: one AIH that was rejected in processing
    unit_of_analysis: rejected admission claim
    known_biases: >
      A rejection is an administrative event, not a clinical one. Rejection rates
      track the competence of a hospital's billing office as much as anything
      about care.
    gotchas:
      - >-
        Most rejected AIH numbers are absent from SIH.RD, so an analysis of RD alone silently drops them: in Alagoas,
        2018, 13,713 of RJ's 18,598 distinct AIH numbers are not in RD that year.
      - >-
        A rejected AIH may be corrected and re-presented, appearing in RD: 4,885 of those 18,598 numbers (26.3%) are
        also in RD in 2018, so the same episode can exist in both.
      - One AIH can be rejected more than once (23,601 rows for 18,598 numbers in Alagoas, 2018); rows are not admissions.
      - Do not add RJ to RD as though they were disjoint populations over time.

  SIH.ER:
    system: SIH
    series: ER
    use: not_an_event_source
    why_no_event_type: >-
      The errors of RJ's claims, one row per error: in Alagoas, 2018, ER has 27,769 rows for 18,598 AIH numbers
      (up to 14 each) and every one is an RJ number, so a row is neither an admission nor a rejection.
    asserted_by: pegasus_data
    what_one_row_is: one rejection, carrying the error that caused it
    unit_of_analysis: rejection reason
    known_biases: >
      Diagnostic rather than epidemiological. It explains why claims failed and
      says nothing about the patients behind them.
    gotchas:
      - The companion to SIH.RJ, not a separate population. Do not pool them.
      - One AIH can carry several errors, so rows are not admissions.

  # ----------------------------------------------------------------- CNES
  CNES.ST:
    system: CNES
    series: ST
    use: support
    why_no_event_type: >-
      A register of establishments: one row per establishment and monthly competence (861 rows for 861 distinct
      CNES codes in Acre, 2018-12), a standing that lasts while the establishment stays registered, not
      something that happened.
    asserted_by: pegasus_data
    what_one_row_is: one health establishment, as registered in one monthly competência
    unit_of_analysis: establishment-month
    source_publication:
      dataset: CNES.ST
      observed_systems: [CNES]
      observed_series: [ST]
      temporal_resolution: month
      physical_geography: uf
    semantic_axes:
      default_time: competence
      time:
        competence: {fields: [COMPETEN], encoding: yyyymm}
      default_geography: facility
      geography:
        facility: {fields: [CODUFMUN], code_system: ibge_municipality}
    known_biases: >
      A register, not a census of activity. An establishment stays registered
      whether or not it is treating anyone, and registration is a condition of
      being paid, so the incentive is to register and keep registering.
    gotchas:
      - One establishment appears once per month. Pooling years without deduplicating counts it many times.
      - The CNES code is the join key for SIH and SIA, and it is reused if an establishment changes hands.
      - Establishments close and reopen under new codes, so a code is not a stable identity across long spans.

  CNES.PF:
    system: CNES
    series: PF
    use: support
    why_no_event_type: >-
      A register of professional posts: one row per professional, establishment and month, so a row is a post
      held (a doctor at four hospitals is four rows), not an event.
    asserted_by: pegasus_data
    what_one_row_is: one professional's registration AT one establishment, in one month
    unit_of_analysis: professional-establishment-month
    known_biases: >
      Registration reflects contractual attachment, not hours actually worked.
      A professional formally attached to a facility they rarely attend still
      generates a row.
    gotchas:
      - A doctor working at four hospitals is four rows. Counting rows counts posts, not people.
      - Counting distinct professionals requires the professional identifier, not the row count.
      - The occupation is a CBO code, and CBO was renumbered in 2002 — codes do not compare across that boundary.

  CNES.LT:
    system: CNES
    series: LT
    use: support
    why_no_event_type: >-
      A register of bed counts: one row per establishment and bed type with the existing, contracted and SUS
      quantities (201 rows for 32 establishments in Acre, 2018-12), a stock at the month, not events.
    asserted_by: pegasus_data
    what_one_row_is: a bed count for one establishment and bed type, in one month
    unit_of_analysis: establishment-bed type-month
    known_biases: >
      Beds are split into SUS and non-SUS. Reporting only the SUS column
      understates a hospital's capacity; reporting the total overstates what is
      available to SUS patients.
    gotchas:
      - Already a count, not one row per bed. Summing rows is meaningless; sum the quantity column.
      - SUS and non-SUS beds are separate columns and answer different questions.
      - Beds existing is not beds staffed, which the ICU counts during 2020 made painfully clear.

  CNES.EQ:
    system: CNES
    series: EQ
    use: support
    why_no_event_type: >-
      A register of equipment counts: one row per establishment and equipment type with the existing and in-use
      quantities (2,473 rows for 589 establishments in Acre, 2018-12), a stock, not events.
    asserted_by: pegasus_data
    what_one_row_is: an equipment count for one establishment and equipment type, in one month
    unit_of_analysis: establishment-equipment type-month
    known_biases: >
      Registered equipment is not working equipment. There is no incentive to
      deregister a machine that has broken down.
    gotchas:
      - Existing and in-use are separate columns; the gap between them is the interesting number.
      - A count per row, so sum the quantity rather than the rows.

  CNES.EP:
    system: CNES
    series: EP
    use: support
    why_no_event_type: >-
      A register of care teams: a team stays registered from month to month, so a row is a team standing in a
      month, not an event.
    asserted_by: pegasus_data
    what_one_row_is: one registered care team at one establishment, in one month
    unit_of_analysis: team-month
    known_biases: >
      Team registration drives primary-care funding transfers, so it is recorded
      carefully and is sensitive to funding rule changes rather than to changes
      in care.
    gotchas:
      - Team composition changes without the team changing identity.
      - Family health coverage is usually computed from teams times a population parameter, not from this table alone.

  CNES.HB:
    system: CNES
    series: HB
    use: support
    why_no_event_type: >-
      A register of accreditations: what an establishment is authorised to bill for, with validity dates; not
      care given.
    asserted_by: pegasus_data
    what_one_row_is: one high-complexity accreditation held by an establishment
    unit_of_analysis: accreditation
    known_biases: >
      Accreditation is what an establishment is AUTHORISED to bill for, which is
      an upper bound on what it does and frequently well above it.
    gotchas:
      - Presence of an accreditation is not evidence the service was ever provided; check SIA or SIH for activity.
      - Accreditations have validity dates and lapse; a row is not necessarily current.

  CNES.SR:
    system: CNES
    series: SR
    use: support
    why_no_event_type: >-
      A register of specialised services an establishment declares offering: an offer, not activity.
    asserted_by: pegasus_data
    what_one_row_is: one specialised service offered by an establishment, with its classification
    unit_of_analysis: service-establishment
    known_biases: Self-declared, and declaring a service costs nothing.
    gotchas:
      - Service and classification are a pair; the classification narrows the service and is meaningless alone.
      - An establishment can declare many services, so rows are not establishments.

  CNES.RC:
    system: CNES
    series: RC
    use: support
    why_no_event_type: >-
      A register of the contractual rules under which an establishment serves the SUS: the funding relationship,
      not care.
    asserted_by: pegasus_data
    what_one_row_is: one contractual rule under which an establishment serves SUS
    unit_of_analysis: contract rule
    known_biases: Administrative. It describes the funding relationship, not the care.
    gotchas:
      - The rule governs how activity is paid, which shapes how it is reported in SIH and SIA.

  CNES.IN:
    system: CNES
    series: IN
    use: support
    why_no_event_type: >-
      A register of the financial incentives an establishment receives: the history of federal programmes, not
      events.
    asserted_by: pegasus_data
    what_one_row_is: one financial incentive an establishment receives
    unit_of_analysis: incentive
    known_biases: >
      Incentives follow policy programmes, so the series is a record of federal
      programme history as much as of establishments.
    gotchas:
      - Incentives start and stop with programmes; a break in the series is usually a policy change, not a data gap.

  CNES.DC:
    system: CNES
    series: DC
    use: support
    why_no_event_type: >-
      Complementary attributes of the establishment register, one row per establishment and month, a supplement
      of CNES.ST: not events.
    asserted_by: pegasus_data
    what_one_row_is: complementary attributes of one establishment, in one month
    unit_of_analysis: establishment-month
    known_biases: A supplement to CNES.ST rather than a population of its own.
    gotchas:
      - Only meaningful joined to CNES.ST on the CNES code and competência.

  CNES.GM:
    system: CNES
    series: GM
    use: support
    why_no_event_type: >-
      A register of management arrangements and contracted targets: a target agreed, not activity achieved.
    asserted_by: pegasus_data
    what_one_row_is: management arrangements and contracted targets for one establishment
    unit_of_analysis: establishment-month
    known_biases: >
      Targets are negotiated, so they reflect what a manager agreed to be measured
      on rather than what the population needs.
    gotchas:
      - Contracted target is not achieved activity; compare against SIH or SIA to get the latter.

  CNES.EF:
    system: CNES
    series: EF
    use: support
    why_no_event_type: >-
      A register of the philanthropic status of an establishment and its conditions: an attribute of the
      establishment, not an event.
    asserted_by: pegasus_data
    what_one_row_is: philanthropic status of one establishment, and the conditions attached
    unit_of_analysis: establishment-month
    known_biases: >
      Philanthropic status carries a tax exemption conditional on a minimum share
      of SUS care, so the status is defended and the reporting is careful.
    gotchas:
      - Philanthropic hospitals are a large share of Brazilian hospital capacity; excluding them distorts any capacity analysis.

  CNES.EE:
    system: CNES
    series: EE
    use: support
    why_no_event_type: >-
      A register of the teaching and research attributes of an establishment: an attribute of the establishment,
      not an event.
    asserted_by: pegasus_data
    what_one_row_is: teaching and research attributes of one establishment
    unit_of_analysis: establishment-month
    known_biases: >
      Teaching hospitals take more complex cases, so their outcome statistics are
      not comparable with general hospitals without case-mix adjustment.
    gotchas:
      - Use this to identify teaching hospitals before comparing mortality or length of stay across facilities.

  # ------------------------------------------------------------------ SIA
  SIA.BI:
    system: SIA
    series: BI
    event_types:
      - name: procedure
        kind: procedure
        grain: one BPA-I line, a quantity of one procedure for one identified patient
        weight:
          column: QT_APROV
          evidence: >-
            BI is PA's BPA-I rows (PA_DOCORIG I): AC 2023-01 holds 68,554 rows and 81,366 approved procedures in both, up to 51 on one row.
        classifiers:
          - {column: PROC_ID, role: primary, structure: SIGTAP}
          - {column: CIDPRI, role: alternative, structure: ICD10}
        note: >-
          The individualised procedures only; care reported on the consolidated BPA is in PA alone. Never pooled with PA's event.
    asserted_by: pegasus_data
    what_one_row_is: a quantity of one outpatient procedure for one identified person (PA's BPA-I rows)
    unit_of_analysis: procedure
    known_biases: >
      Only what SIGTAP has reported individually (BPA-I): procedures on the consolidated BPA never reach BI,
      so BI's coverage changes with the instrument each procedure is reported on, not only with activity.
    gotchas:
      - PA's I rows republished with the patient's fields. Adding BI to PA double-counts the same care.
      - One person appears many times; rows are procedures, not patients.
      - The patient identifier is obfuscated, so it links a person's records to each other and does not name them.

  SIA.PA:
    system: SIA
    series: PA
    event_types:
      - name: procedure
        kind: procedure
        grain: one line of outpatient production, PA_DOCORIG's document - an attendance (BPA-I, I), an APAC's main or secondary procedure (P, S), a RAAS line (A, B), or a consolidated count with no patient (BPA-C, C)
        weight:
          column: PA_QTDAPR
          evidence: >-
            A row is a quantity of one procedure, not one procedure: AC 2023-01 holds 95,414 rows and 1,192,449 approved procedures, the consolidated BPA (C) 21,398 rows and 1,046,221 of them (up to 95,404 on one row). The approved quantity is what SIA accepted; PA_QTDPRO, the quantity presented, differs (1,195,363). No quantity is empty; 623 rows approve 0.
        classifiers:
          - {column: PA_PROC_ID, role: primary, structure: SIGTAP}
          - {column: PA_CIDPRI, role: alternative, structure: ICD10}
        note: >-
          Every outpatient procedure of SIA, once. BI republishes PA's I rows and PS its B rows (measured row for row, AC 2023-01), so a procedure is counted from one of the three, never two. A consolidated row has an age but no residence or sex (MUNPCN 999999, SEXO 0): a count by residence leaves C unallocated, visibly.
        source_notes:
          source: >-
            DATASUS/Ministério da Saúde, Disseminação de dados em saúde: Sistema de Informações Ambulatoriais do SUS -
            SIASUS, Informe Técnico (file Informe_Tecnico_SIASUS_2019_07), section 2.1 and layout, pp. 2-4
            (sources/siasus/Informe_Tecnico_SIASUS_2019_07.pdf);
            statements taken from other documents carry their own citation
          definition: >-
            The information in the PA files, obtained after the processing of the SIASUS, refers to the outpatient care
            performed in each competence (year and month) from January 2008, when the Table of Procedures, Medicines,
            Orthoses, Prostheses and Special Materials of the SUS was implemented (Portaria GM/MS nº 321 of 08/02/2007,
            whose start, set for July 2007, was postponed to January 2008 by Portaria GM/MS nº 1,541 of 27/06/2007)
            (p. 2 and its note 4). The files hold the procedures obtained through five registration instruments - APAC,
            BPA-C, BPA-I, RAAS-AD and RAAS-PSI - and the content of each record varies with the instrument that originated
            it, identified by PA_DOCORIG: P main procedure and S secondary procedure of an APAC, C the BPA-C, A the RAAS-AD,
            B the RAAS psicossocial, I the BPA-I (pp. 2-3). A BPA-C generates one record for each pair [procedure code,
            CBO]; a BPA-I one for each attendance (one or more attendances may be of the same patient); an APAC one for each
            procedure code performed in it, main or secondary (p. 3). PA_QTDPRO is the quantity produced (presented) and
            PA_QTDAPR the approved quantity (p. 4); the TabNet notes define the approved quantity as the procedures
            approved for payment by the health secretariats and the presented quantity as the procedures presented for
            payment ("Produção Ambulatorial do SUS por local de residência - a partir de 2008" Notas Técnicas, pp. 2-3,
            http://tabnet.datasus.gov.br/cgi/sia/Prod_amb_loc_res_2008.pdf).
          valid_from: 2008
          limitations:
            - >-
              The municipality of residence is available only for the records made through the BPA-I or the APAC (TabNet
              "Produção Ambulatorial do SUS por local de residência - a partir de 2008" Notas Técnicas, p. 1). The sex and
              the age of the patient may be "not informed or not required" (p. 2), and PA_FLIDADE flags whether the age is
              not required, compatible with the SIGTAP range, outside it, nonexistent or blank (Informe Técnico, p. 4).
            - >-
              The BPA-C registers, for each establishment (CNES) and month, the procedure consolidated by CBO, age and
              quantity, the age being mandatory only for procedures with the SIGTAP attribute 012 "requires age in the BPA
              (consolidated)"; the BPA-I registers each user with the CNS, name, sex, date of birth, municipality of
              residence, nationality and race/colour. A procedure goes to the BPA-C or to the BPA-I according to the
              Registration Instrument assigned to it in the SIGTAP (Ministério da Saúde/SAS/DRAC/CGSI, BPA: manual de
              operação do sistema, version 1, September 2012, pp. 5 and 18-23, sources/bpa_manual.txt).
            - >-
              The authorisation number (PA_AUTORIZ) of a BPA-I is not mandatory and is not checked, and may be repeated
              for several attendances of one patient, so its filling is of limited quality if used for any control
              (Informe Técnico, p. 3).
            - >-
              RIPSA's sheet on medical consultations per inhabitant (ficha F.1, p. 276, in Indicadores básicos para a
              saúde no Brasil: conceitos e aplicações, 2nd ed., 2008,
              http://tabnet.datasus.gov.br/tabdata/livroidb/2ed/capituloF.pdf), built from the SIA/SUS, counts the
              consultations presented to the manager, approved or not, and states that this number does not necessarily
              express the total performed in the SUS, because it is influenced by the remuneration modality (by
              procedure performed or by the total resident population); that it leaves out the consultations made
              without a SUS link; and that it includes those given to non-residents.
          form: >-
            Instruments of registration: BPA-C (Boletim de Produção Ambulatorial Consolidado), BPA-I (Individualizado), APAC
            (Autorização de Procedimentos Ambulatoriais de Alta Complexidade), RAAS-AD and RAAS-PSI (Registro das Ações
            Ambulatoriais de Saúde).
    asserted_by: pegasus_data
    what_one_row_is: a quantity of one procedure from one production document (PA_DOCORIG) at one establishment in one competência
    unit_of_analysis: procedure-establishment-month
    known_biases: >
      The consolidated BPA (PA_DOCORIG C, 87% of AC 2023-01's approved procedures) records no patient; the
      other documents (BPA-I, APAC, RAAS) carry the patient's residence, sex and age. Which document a
      procedure is reported on is SIGTAP's rule for that procedure, so a share by residence changes with the
      procedure mix, not only with care.
    gotchas:
      - Sum the quantity column, never the rows (the `procedure` event does).
      - Quantity presented and quantity approved differ; only one of them was paid for.
      - Do not pool with SIA.BI or SIA.PS, which are PA's I and B rows republished with more fields.

  SIA.AQ:
    system: SIA
    series: AQ
    event_types:
      - name: chemotherapy_authorisation
        kind: authorisation
        grain: one APAC, the authorisation of a chemotherapy treatment period (up to three monthly rows)
        classifiers:
          - {column: AP_CIDPRI, role: primary, structure: ICD10}
          - {column: AP_PRIPAL, role: alternative, structure: SIGTAP}
        status:
          column: AP_TPAPAC
          values: ["1", "3"]
          evidence: >-
            AP_TPAPAC is 1 on the first monthly row of an APAC, 2 on the rows of its later months and
            3 on a single-row APAC (layout: 1 initial, 2 continuity, 3 single). Measured on AQ AC 2019-2023, SP 2023-01 and DF 2015: every
            APAC with a row of type 1 has it on its earliest competence, where the month of AP_DTINIC
            equals AP_CMP (AQ AC 2023: 2,921 of 2,921); an APAC without one began in an earlier file
            (366 of 3,287). Counting rows of type 1 or 3 counts each APAC once.
        consolidation:
          key: [AP_AUTORIZ]
        note: >-
          Counts authorisations, not patients or new treatments: a regimen is a chain of APACs, and AQ_CONTTR
          (continuity, S/N) marks the chain's later links but would need a second status column.
          Tumour site is AP_CIDPRI (C and D codes); AQ_CID10 is empty in the 74-column files.
    asserted_by: pegasus_data
    what_one_row_is: one authorisation for a chemotherapy regimen, usually covering a month of treatment
    unit_of_analysis: authorisation
    known_biases: >
      Only SUS-funded oncology appears. Private and supplementary-health treatment
      is absent, and it is not evenly distributed by income or region.
    gotchas:
      - A course of chemotherapy is many consecutive authorisations, not one. Counting rows counts months, not patients.
      - Carries tumour staging, which most SUS datasets do not; it is the reason this dataset is used at all.
      - The staging is recorded at authorisation and is not revised as the disease progresses.

  SIA.AR:
    system: SIA
