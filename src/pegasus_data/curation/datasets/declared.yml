  # =================================================================== IBGE
  # Denominators. Every one of these exists to sit under a health numerator, and
  # the commonest error with them is a mismatch of year, geography vintage or
  # method between the two halves of a rate.
  IBGE.POP:
    system: IBGE
    series: POP
    use: denominator
    why_no_event_type: >-
      The resident population by municipality, sex and age: a count of people at a date, the denominator of a
      rate, not events.
    # Overrides the IBGE family block: the population file keys on MUNIC_RES.
    semantic_axes:
      default_geography: area
      geography:
        area: {fields: [MUNIC_RES], code_system: ibge_municipality}
      default_time: reference
      time:
        reference: {fields: [ANO], encoding: year}
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as IBGE.POP
    what_one_row_is: the resident population of one municipality in one year
    unit_of_analysis: municipality-year
    known_biases: >
      Census years are counts; the years between them are estimates produced by a
      projection method that has itself changed more than once. A rate series
      across a census boundary partly measures the change in method.
    gotchas:
      - The denominator for most rates computed against DATASUS health data. Match its year to the numerator's year, not to the year of publication.
      - Municipality codes change as municipalities are created and merged. A join on code alone across decades silently loses or mismatches areas.
  IBGE.POPS:
    system: IBGE
    series: POPS
    # Keys on COD_MUN and ANO (curation/roles/IBGE-POPS.yml), not on the family's MUNCOD.
    semantic_axes:
      default_geography: area
      geography:
        area: {fields: [COD_MUN], code_system: ibge_municipality}
      default_time: reference
      time:
        reference: {fields: [ANO], encoding: year}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (IBGE.POPS: IBGE/POPSVS/POPSBRaa.zip, 26 files, 2000-2025 in the catalog)
    what_one_row_is: >-
      the resident population of one municipality, sex and age in one year, as the Ministry of Health's SVS
      estimates it
    unit_of_analysis: municipality-sex-age-year
    use: denominator
    why_no_event_type: >-
      The Ministry's estimate of the resident population by municipality, sex and age: a count of people at a
      date, another estimate beside IBGE.POP and IBGE.POPT, not events.
    gotchas:
      - Another estimate of the same population as IBGE.POP and IBGE.POPT; never added to them.
      - >-
          Match its year to the numerator's, and record which of the three estimates a rate used.
  IBGE.POPT:
    system: IBGE
    series: POPT
    # Keys on MUNIC_RES and ANO (curation/roles/IBGE-POPT.yml), not on the family's MUNCOD.
    semantic_axes:
      default_geography: area
      geography:
        area: {fields: [MUNIC_RES], code_system: ibge_municipality}
      default_time: reference
      time:
        reference: {fields: [ANO], encoding: year}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (IBGE.POPT: IBGE/POPTCU/POPTBRaa.zip, 33 files, 1992-2025 in the catalog)
    what_one_row_is: >-
      the total resident population of one municipality in one year, as IBGE sends it each year to the Tribunal
      de Contas da União
    unit_of_analysis: municipality-year
    use: denominator
    why_no_event_type: >-
      IBGE's estimate of the total resident population by municipality, as sent to the Tribunal de Contas da
      União: a count of people, no sex or age, not events.
    gotchas:
      - >-
          No sex or age: it cannot be a denominator for a sex- or age-specific rate.
      - Another estimate of the same population as IBGE.POP and IBGE.POPS; never added to them.
  IBGE.PROJUF:
    system: IBGE
    series: PROJUF
    use: denominator
    why_no_event_type: >-
      A projection of the resident population by state: a count of people at a date, not events.
    # Projected by STATE, not by municipality. An EXPLICIT empty block, which
    # is a statement that this dataset has no municipality axis -- different
    # from saying nothing, which would inherit the family's MUNCOD and key the
    # cells on something no municipality table can resolve.
    semantic_axes: {}
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as IBGE.PROJUF
    what_one_row_is: the projected population of one state in one year
    unit_of_analysis: state-year
    known_biases: >
      A projection, not a count. Used where census figures are too old for the
      period being analysed, which means it is least reliable exactly where it is
      most needed — the years furthest from the last census.
    gotchas:
      - State-level only. It cannot serve as a denominator for a municipal rate.
      - Published as national files. There is no per-state file, so a state filter matches nothing; the state is a column.
      - Projections are revised. Two vintages of PROJUF disagree for the same year, so record which one a rate used.
  IBGE.ALF:
    system: IBGE
    series: ALF
    use: context
    why_no_event_type: >-
      A census table of the resident population by literacy (1991, 2000 and 2010): who lives where, not events.
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as IBGE.ALF
    what_one_row_is: literate and illiterate population counts for one area in one year
    unit_of_analysis: area-year
    gotchas:
      - Literacy is self-declared at census, not tested.
      - The area is whatever geography the table was published at; check it before joining to a municipal numerator.
  IBGE.ESCA:
    system: IBGE
    series: ESCA
