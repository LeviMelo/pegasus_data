          The pre-2008 counterpart of SIA.AR: PR's files end in 2007 and AR's start in 2008 (the catalog).
      - >-
          Date of birth, sex and residence are real and unobfuscated, which makes the record re-identifiable
          without any direct identifier.
  SIA.UD:
    system: SIA
    series: UD
    semantic_axes: {}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIA.UD: named from its columns UDI_*) and ADR-0077; no layout document found
    what_one_row_is: >-
      one dialysis unit in one month: counts of machines and modalities, water treatment, the partner
      laboratories and services, and the unit's responsible nephrologist and director (UDI_*)
    unit_of_analysis: dialysis unit-month
    use: support
    why_no_event_type: >-
      A census of the dialysis units, one row per unit and month (UDI_*): machines, modalities, partner services
      and responsible professionals; a standing, not an event.
    gotchas:
      - A census of units, not of patients or sessions.
      - >-
          Joins on the unit's CNES code (*_CODUNI).
  SIA.UO:
    system: SIA
    series: UO
    semantic_axes: {}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (SIA.UO: named from its columns UDO_*) and ADR-0077; no layout document found
    what_one_row_is: >-
      one oncology unit in one month: radiotherapy rooms and equipment (simulator, cobalt, linear accelerator,
      brachytherapy), partner services and responsible professionals (UDO_*)
    unit_of_analysis: oncology unit-month
    use: support
    why_no_event_type: >-
      A census of the oncology units, one row per unit and month (UDO_*): radiotherapy rooms and equipment,
      partner services and responsible professionals; a standing, not an event.
    gotchas:
      - A census of units, not of patients or sessions.
      - >-
          Joins on the unit's CNES code (*_CODUNI).
  SIA.ABO:
    system: SIA
    series: ABO
    event_types:
      - name: bariatric_followup_authorisation
        kind: authorisation
        grain: one APAC, the authorisation of a period of follow-up after bariatric surgery
        classifiers:
          - {column: AP_PRIPAL, role: primary, structure: SIGTAP}
        status:
          column: AP_TPAPAC
          values: ["1", "3"]
          evidence: >-
            AP_TPAPAC is 1 on the first monthly row of an APAC, 2 on the rows of its later months and
            3 on a single-row APAC (layout: 1 initial, 2 continuity, 3 single). Measured on ABO AC 2023 (17 of 17 APACs with a type-1 row; 22 APACs): every
            APAC with a row of type 1 has it on its earliest competence, where the month of AP_DTINIC
            equals AP_CMP; an APAC without one began in an earlier file. Counting rows of type 1 or 3
            counts each APAC once (data/probes/apac/measure6.py, 2026-10-10).
        consolidation:
          key: [AP_AUTORIZ]
        note: >-
          Every row's AP_PRIPAL is 0301120056, the procedure of SIA.AB, which ABO continues from 2014 (the two
          overlap in 2014-2017). The layout has no AP_CIDPRI, and AP_CIDCAS is empty on every row read; the
          comorbidity codes AP_CID_C1..C5 are filled on under 10% of rows.
    asserted_by: pegasus_data
    what_one_row_is: one authorisation for follow-up care after bariatric surgery
    unit_of_analysis: authorisation
    known_biases: Follow-up is under-claimed relative to the surgery itself.
    gotchas:
      - Continues SIA.AB, the same follow-up procedure (0301120056), not its surgical counterpart; the surgery is an AIH in SIH.

  SIA.AB:
    system: SIA
    series: AB
    event_types:
      - name: bariatric_followup_authorisation
        kind: authorisation
        grain: one APAC, the authorisation of a period of follow-up after gastroplasty
        classifiers:
          - {column: AP_PRIPAL, role: primary, structure: SIGTAP}
          - {column: AP_CIDCAS, role: alternative, structure: ICD10}
        status:
          column: AP_TPAPAC
          values: ["1", "3"]
          evidence: >-
            AP_TPAPAC is 1 on the first monthly row of an APAC, 2 on the rows of its later months and
            3 on a single-row APAC (layout: 1 initial, 2 continuity, 3 single). Measured on AB SP 2015 (7,783 of 7,783 APACs with a type-1 row; 8,223 APACs) and SP 2025 (2,601 of 2,601): every
            APAC with a row of type 1 has it on its earliest competence, where the month of AP_DTINIC
            equals AP_CMP; an APAC without one began in an earlier file. Counting rows of type 1 or 3
            counts each APAC once (data/probes/apac/measure6.py, 2026-10-10).
        consolidation:
          key: [AP_AUTORIZ]
        note: >-
          Every row's AP_PRIPAL is 0301120056, ACOMPANHAMENTO DE PACIENTE POS-GASTROPLASTIA (Manual Operacional APAC
          6.5, sources/apac_manual.txt): the surgery itself is an AIH, in SIH. AP_CIDPRI and AP_CIDSEC are 0000 on every
          row read; AP_CIDCAS (E66x) is filled on 43% of 2015's rows and on 3 of 6,821 in 2025.
    asserted_by: pegasus_data
    what_one_row_is: one month of an authorisation for follow-up after gastroplasty (not the surgery, which is an AIH in SIH)
    unit_of_analysis: authorisation
    known_biases: >
      Follow-up is claimed only where a registered bariatric service exists, so
      volume follows the services rather than the operated population.
    gotchas:
      - Not the surgery. Until 2026-10-10 this file said "authorisation for bariatric surgery"; every row read carries 0301120056, follow-up after gastroplasty.
      - ABO carries the same procedure from 2014; the two overlap in 2014-2017.

  SIA.AMP:
    system: SIA
    series: AMP
    event_types:
      - name: multiprofessional_followup_authorisation
        kind: authorisation
        grain: one APAC, the authorisation of a period of multiprofessional team follow-up
        classifiers:
          - {column: AP_PRIPAL, role: primary, structure: SIGTAP}
          - {column: AP_CIDCAS, role: alternative, structure: ICD10}
        status:
          column: AP_TPAPAC
          values: ["1", "3"]
          evidence: >-
            AP_TPAPAC is 1 on the first monthly row of an APAC, 2 on the rows of its later months and
            3 on a single-row APAC (layout: 1 initial, 2 continuity, 3 single). Measured on AMP SP 2023 (1,180 of 1,180 APACs with a type-1 row; 5,236 single-row; 6,469 APACs): every
            APAC with a row of type 1 has it on its earliest competence, where the month of AP_DTINIC
            equals AP_CMP; an APAC without one began in an earlier file. Counting rows of type 1 or 3
            counts each APAC once (data/probes/apac/measure6.py, 2026-10-10).
        consolidation:
          key: [AP_AUTORIZ]
        note: >-
          AP_CIDPRI is 0000 on every row read; AP_CIDCAS is filled on 4% of SP 2023's rows. Two procedures
          (0301130051 on single-row APACs, 0301130060 on the others).
    asserted_by: pegasus_data
    what_one_row_is: one authorisation for multiprofessional team follow-up
    unit_of_analysis: authorisation
    known_biases: Reporting depends on a team being formally constituted and registered.
    gotchas:
      - Rows are authorisation periods, not encounters with each professional.

  SIA.PS:
    system: SIA
    series: PS
    event_types:
      - name: procedure
        kind: procedure
        grain: one RAAS psychosocial line, a quantity of one procedure for one patient
        weight:
          column: PA_QTDAPR
          evidence: >-
            PS is PA's RAAS psychosocial rows (PA_DOCORIG B): AC 2023-01 holds 1,461 rows and 2,002 approved procedures in both; QTDATE (686) and QTDPCN (686) count attendances and patients, not procedures.
        classifiers:
          - {column: PA_PROC_ID, role: primary, structure: SIGTAP}
          - {column: CIDPRI, role: alternative, structure: ICD10}
        note: >-
          Never pooled with PA's event, which holds the same rows.
    asserted_by: pegasus_data
    what_one_row_is: one psychosocial care action recorded under RAAS
    unit_of_analysis: care action
    known_biases: >
      Covers CAPS and the psychosocial network. Mental health care delivered in
      primary care or in hospital is not here, so this is not all mental health
      activity.
    gotchas:
      - RAAS records actions, not authorisations; the reporting model differs from the APAC datasets.
      - One user receives many actions; rows are not people.

  SIA.SAD:
    system: SIA
    series: SAD
    event_types:
      - name: procedure
        kind: procedure
        grain: one RAAS home-care line, a quantity of one procedure for one patient
        weight:
          column: PA_QTDAPR
          evidence: >-
            SAD is PA's RAAS home-care rows (PA_DOCORIG A): AC 2014-01 holds 289 rows and 289 approved procedures in
            both, TO 2015-10 1,631 rows and 1,656. QTDATE counts attendances (21 and 44), not procedures.
        classifiers:
          - {column: PA_PROC_ID, role: primary, structure: SIGTAP}
          - {column: CIDPRI, role: alternative, structure: ICD10}
        note: >-
          Published 2012-2018 only (1,088 files, 19 in 2018); later home care is in PA's A rows alone. Never pooled
          with PA's event, which holds the same rows.
    asserted_by: pegasus_data
    what_one_row_is: a quantity of one home-care procedure under the Melhor em Casa programme (PA's RAAS-AD rows)
    unit_of_analysis: care action
    known_biases: >
      Only municipalities that joined the programme report, so absence usually
      means the programme is not there rather than that home care is not happening.
    gotchas:
      - Rows are actions, not patients or home visits by a single professional.

  # --------------------------------------------------------------- SISCAN
  SISCAN.CC:
    system: SISCAN
    series: CC
    asserted_by: pegasus_data
    what_one_row_is: one cervical cytology exam and its result
    unit_of_analysis: exam
    known_biases: >
      Screening data, so it describes who was screened rather than who has
      disease. Women who never present are invisible, and they are the ones at
      highest risk.
    gotchas:
      - One woman screened repeatedly is several rows; rows are exams, not people.
      - An abnormal cytology is an indication for biopsy, not a diagnosis. SISCAN.HC carries the confirmation.
      - Succeeded SISCOLO, so the series changes naming regime partway through.

  SISCAN.HC:
    system: SISCAN
    series: HC
    asserted_by: pegasus_data
    what_one_row_is: one cervical biopsy and its histopathology result
    unit_of_analysis: exam
    known_biases: >
      Only women referred after an abnormal screen reach here, so the population
      is selected by the screening step and its abnormality rate is not a
      population rate.
    gotchas:
      - The confirmatory counterpart to SISCAN.CC. Histopathology overrules cytology where they disagree.

  SISCAN.MM:
    system: SISCAN
    series: MM
    asserted_by: pegasus_data
    what_one_row_is: one mammogram and its BI-RADS classification
    unit_of_analysis: exam
    known_biases: >
      Screening and diagnostic mammograms are both here and mean different
      things; mixing them distorts any positivity rate.
    gotchas:
      - BI-RADS is an ordered assessment category, not a diagnosis; categories 4 and 5 indicate biopsy.
      - Succeeded SISMAMA, so naming changes partway through the series.

  SISCAN.CM:
    system: SISCAN
    series: CM
    asserted_by: pegasus_data
    what_one_row_is: one breast cytology exam and its result
    unit_of_analysis: exam
    known_biases: Far less common than mammography; small counts are volatile.
    gotchas:
      - Distinct from SISCAN.HM, which is histopathology on tissue rather than cells.

  SISCAN.HM:
    system: SISCAN
    series: HM
    asserted_by: pegasus_data
    what_one_row_is: one breast biopsy and its histopathology result
    unit_of_analysis: exam
    known_biases: Reached only after an abnormal mammogram, so the population is selected.
    gotchas:
      - The confirmatory step for SISCAN.MM, and the dataset that actually establishes a cancer diagnosis.

  # --------------------------------------------------------------- others
  CIHA.CIHA:
    event_types:
      - name: hospitalisation
        kind: hospitalisation
        grain: one non-SUS hospitalisation
        classifiers:
          - {column: DIAG_PRINC, role: primary, structure: ICD10}
          - {column: PROC_REA, role: alternative, structure: SIGTAP}
        status:
          column: MODALIDADE
          values: ["02"]
          evidence: >-
            CIHA's own MODALIDADE table: 00 consolidated and 01 individual outpatient care,
            02 INTERNAÇÕES (SE 2022: 4,685 of 21,740 rows).
    system: CIHA
    series: CIHA
    asserted_by: pegasus_data
    what_one_row_is: one admission or outpatient episode NOT funded by SUS
    unit_of_analysis: episode
    known_biases: >
      Reporting is a regulatory obligation with weak enforcement, so coverage is
      substantially lower than SIH's and varies by state.
    gotchas:
      - The complement to SIH, which is the point of it — together they approach total hospital activity.
      - Do not pool with SIH without deduplicating; the payment source differs and so does the meaning.
      - Under-reporting means CIHA is a lower bound on non-SUS activity, never an estimate of it.

  CIH.CR:
    event_types:
      - name: hospitalisation
        kind: hospitalisation
        grain: one communicated non-SUS hospitalisation (CIH, 2008-2010)
        classifiers:
          - {column: DIAG_PRINC, role: primary, structure: ICD10}
          - {column: PROC_REA, role: alternative, structure: SIGTAP}
    system: CIH
    series: CR
    asserted_by: pegasus_data
    what_one_row_is: one non-SUS-funded hospital admission
    unit_of_analysis: admission
    known_biases: Same weak-enforcement problem as CIHA, and the series is retired.
    gotchas:
      - Superseded by CIHA. For a long series, read both and mind the transition.

  PNI.DPNI:
    system: PNI
    series: DPNI
    use: context
    why_no_event_type: >-
      Counts of doses by municipality, vaccine and dose number (an aggregate; the IG and UF files are the same
      measure at other aggregations): vaccinations delivered by place, not records. A dose count could be an
      event type with that quantity as its weight (as SIA-PA's); none has been declared.
    asserted_by: pegasus_data
    what_one_row_is: a count of doses administered, by municipality, immunobiological and dose number
    unit_of_analysis: municipality-vaccine-dose-period
    known_biases: >
      Doses are counted where they are given, not where the person lives, so
      municipalities with regional vaccination posts look better than they are
      and their neighbours look worse.
    gotchas:
      - Aggregate. Sum the quantity, never the rows.
      - First, second and booster doses are different dose numbers; adding them across dose numbers does not give people vaccinated.
      - The IG and UF variants are the same measure at different aggregations. Pooling them double-counts.

  PNI.CPNI:
    system: PNI
    series: CPNI
    use: context
    why_no_event_type: >-
      A coverage rate (doses over an estimated target population) per municipality, vaccine and period: a rate
      is not an event, and it is never summed.
    asserted_by: pegasus_data
    what_one_row_is: a vaccination coverage figure for one municipality, vaccine and period
    unit_of_analysis: municipality-vaccine-period
    known_biases: >
      Coverage is doses over an estimated target population, so it inherits every
      error in the denominator. Coverage above 100% is common and means the
      denominator is wrong, not that everyone was vaccinated.
    gotchas:
      - A RATE, already divided. Never sum it across municipalities; recompute from doses and population instead.
      - The denominator changes when population estimates are revised, so a coverage series can move without any change in doses.

  DADOS_ABERTOS.COBERTURA_RESIDENCIA:
    system: DADOS_ABERTOS
    series: COBERTURA_RESIDENCIA
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CO_MUNICIPIO], code_system: ibge_municipality}
      default_time: reference
      time:
        reference: {fields: [CO_ANO], encoding: year}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (Dados_Abertos/SIPNIBD/Cobertura_Residencia.parquet, 1,088,479 rows, 2015-2026) and
      curation/roles/DADOS_ABERTOS-COBERTURA_RESIDENCIA.yml
    what_one_row_is: >-
      the vaccination coverage of one municipality of residence for one immunobiological and year (SI-PNI/RNDS):
      doses, target population and coverage
    unit_of_analysis: municipality of residence-vaccine-year
    use: context
    why_no_event_type: >-
      A published coverage rate by municipality of residence, vaccine and year (a fraction): a rate is not an
      event, and it is never summed or recomputed.
    known_biases: >
      Coverage is doses over an estimated target population (NU_POPULACAO), so it inherits every error of that
      denominator.
    gotchas:
      - A fraction (0.96), not a percentage; the published rate, never summed or recomputed.
      - >-
          Not an alias of PNI.CPNI: another system (SI-PNI/RNDS), the municipality of residence rather than
          of application, another layout.
  DADOS_ABERTOS.DOSES_RESIDENCIA:
    system: DADOS_ABERTOS
    series: DOSES_RESIDENCIA
    semantic_axes:
      default_geography: residence
      geography:
        residence: {fields: [CO_MUNICIPIO], code_system: ibge_municipality}
      default_time: competence
      time:
        competence: {fields: [NU_ANO, NU_MES], encoding: year_month}
    asserted_by: pegasus_data
    source: manual
    source_ref: >-
      curation/ontology.yml (Dados_Abertos/SIPNIBD/Doses_Residencia.parquet, 236,140,984 rows read 2026-10-08)
      and curation/roles/DADOS_ABERTOS-DOSES_RESIDENCIA.yml
    what_one_row_is: >-
      the doses administered to the residents of one municipality in one year and month, by strategy,
      immunobiological, dose, age, race/colour and sex (SI-PNI/RNDS)
    unit_of_analysis: municipality of residence-year-month-strategy-vaccine-dose-age-race-sex
    use: context
    why_no_event_type: >-
      Cells of doses (QT_DOSE) by residence, year, month, strategy, vaccine, dose, age, race and sex
      (236,140,984 rows read on 2026-10-08), not records of vaccinations. A dose count could be an event type
      with that quantity as its weight (as SIA-PA's); none has been declared.
    known_biases: >
      Counted by the residence of the person vaccinated, where PNI.DPNI counts where the dose was given, so the
      two can disagree for a municipality with a regional vaccination post.
    gotchas:
      - Aggregate. Sum QT_DOSE, never the rows.
      - >-
          Not the DPNI tables: another system (SI-PNI/RNDS), another place (residence), another layout.
          Until 2026-10-08 it was declared an alias of PNI.DPNI, so a query read the old DBF tables instead.
  SISPRENATAL.PN:
    system: SISPRENATAL
    series: PN
    asserted_by: pegasus_data
    what_one_row_is: one pregnancy enrolled in antenatal monitoring
    unit_of_analysis: pregnancy
    known_biases: >
      Only pregnancies enrolled in the programme appear. Women who begin antenatal
      care late or not at all are the ones the programme most wants to reach and
      the ones least likely to be in the data.
    gotchas:
      - Rows are pregnancies, not women; a woman with two pregnancies appears twice.
      - Enrolment date is not the date care began, and the gap matters for the first-trimester indicator.

  PAINEL_ONCOLOGIA.PO:
    event_types:
      - name: cancer_case
        kind: case
        grain: one cancer diagnosis with its first treatment, as the Painel de Oncologia records it
        classifiers:
          - {column: DIAG_DETH, role: primary, structure: ICD10}
        note: >-
          CNS_PAC is blank on every row (2026: 213,834 of 213,834), so cases cannot be consolidated by person.
    system: PAINEL_ONCOLOGIA
    series: PO
    asserted_by: pegasus_data
    what_one_row_is: one cancer patient followed from diagnosis to first treatment
    unit_of_analysis: patient-tumour
    known_biases: >
      Built to measure one legal obligation — treatment within sixty days of
      diagnosis — so it covers patients who reached treatment. Those who never
      did are the ones the indicator cannot see.
    gotchas:
      - Dates are C(10) with separators here, unlike the bare AAAAMMDD used in SIH and SIM.
      - The interval is diagnosis to FIRST treatment; later lines of treatment are not in it.
      - A patient with two primary tumours appears twice.

  RESP.RESP:
    event_types:
      - name: notification
        kind: notification
        grain: one notified newborn or foetus with a suspected congenital alteration (microcephaly)
        status:
          column: CLASSIFIN
          exclude: ["6"]
          evidence: >-
            CLASSIFIN 6 is Excluído (DIC_DADOS_RESP), a record excluded from surveillance; every other row,
            a blank one included, is a notification.
      - name: case
        kind: case
        status:
          column: CLASSIFIN
          values: ["1"]
          evidence: CLASSIFIN 1 is Confirmado (DIC_DADOS_RESP); 161 of 1,174 in PE 2016.
      - name: probable_case
        kind: probable_case
        status:
          column: CLASSIFIN
          values: ["2"]
          evidence: CLASSIFIN 2 is Provável (DIC_DADOS_RESP).
    system: RESP
    series: RESP
    asserted_by: pegasus_data
    what_one_row_is: one notified case of suspected microcephaly or congenital alteration
    unit_of_analysis: notified case
    known_biases: >
      Created during the 2015-16 Zika epidemic under intense attention, so
      notification was far more sensitive at the peak than before or after. The
      case definition was also revised during the epidemic.
    gotchas:
      - Suspected cases, most of which were later discarded on investigation. Do not read notifications as confirmed cases.
      - The head-circumference threshold defining a case changed mid-series; counts either side are not comparable.

  PCE.PCE:
    system: PCE
    series: PCE
    use: context
    why_no_event_type: >-
      Survey summaries by locality, phase and month: stool exams performed, positives, people treated and snails
      captured (QT_EXAM, QT_POS, QT_TRAT, QT_CAP), not records of cases. In states with focal transmission the
      cases are notified in SINAN, and Bahia 2000-2004 recorded no egg counts (PCE technical note).
    asserted_by: pegasus_data
    what_one_row_is: survey and treatment results for schistosomiasis in one locality
    unit_of_analysis: locality-survey
    known_biases: >
      Active case-finding surveys, so results depend entirely on where teams went.
      A locality with no rows was not surveyed; it is not a locality without disease.
    gotchas:
      - Aggregate counts of people examined and positive, not individual records.
      - Positivity is conditional on being surveyed, and surveys target known endemic areas.

  ESUSNOTIFICA.DCCR:
    event_types:
      - name: notification
        kind: notification
        grain: one notified case of chronic Chagas disease (e-SUS Notifica)
        evidence: "e-SUS Notifica is a notification system; the form carries no final classification column"
    system: ESUSNOTIFICA
    series: DCCR
    asserted_by: pegasus_data
    what_one_row_is: one notified case of COVID-19
    unit_of_analysis: notified case
    known_biases: >
      Notification tracked testing capacity, which varied enormously across the
      pandemic and across the country. Case counts are a measure of testing at
      least as much as of infection.
    gotchas:
      - Built outside SINAN in 2020 for volume reasons, so it does not share SINAN's structure.
      - Self-reported notifications are included, with a different reliability from laboratory-confirmed ones.

  # ==================================================================== SIM
  # The mortality variants. DOEXT, DOINF and DOMAT are SUBSETS of the DO base:
  # pooling them with SIM.DO counts the same death twice. DOREXT (residents
  # abroad, 2013-) and DORIG (residents abroad or unknown, 1995) are its
  # COMPLEMENT: DO's files are by state of residence and hold neither. DOR is the
  # 1979-1995 base itself. DOFET is foetal deaths, never pooled with any.
  SIM.DOEXT:
    system: SIM
    series: DOEXT
    use: not_an_event_source
    why_no_event_type: >-
      A subset of SIM-DO that DATASUS extracts: the deaths with an underlying cause in chapter XX (V01-Y98). In
      Acre, 2018, all 689 DOEXT deaths of residents are among SIM-DO's 4,094 and SIM-DO has exactly 689 deaths
      with a V-Y underlying cause, so counting both counts them twice. They are counted from SIM-DO with a
      condition on the cause.
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as SIM.DOEXT
    what_one_row_is: one death certificate for a death from external causes
    unit_of_analysis: death
    known_biases: >
      External-cause deaths are the ones most likely to reach medico-legal
      investigation, so cause is better established here than in the base as a
      whole. Intent, however, is not: deaths of undetermined intent absorb a
      substantial share of what is elsewhere counted as suicide or homicide, and
      that share varies by state.
    gotchas:
      - A subset of SIM.DO, not a separate collection. Pooling the two counts these deaths twice.
      - Undetermined-intent codes are not a residual to ignore; where they are common, homicide and suicide are correspondingly understated.
  SIM.DOFET:
    event_types:
      - name: foetal_death
        kind: foetal_death
        classifiers:
          - {column: CAUSABAS, role: primary, structure: ICD10}
          - {column: CAUSABAS_O, role: alternative, structure: ICD10, recodes: CAUSABAS}
        status:
          column: TIPOBITO
          values: ["1"]
          evidence: TIPOBITO 1 is a foetal death (SIM layout).
        exposure:
          events: ["SINASC-DN:birth", "SIM-DOFET:foetal_death"]
          per: 1000
          evidence: >-
            The foetal death rate: foetal deaths per 1,000 total births (live births and foetal deaths), the
            denominator ICD-10 (volume 2, the statistics of perinatal mortality) defines for it.
        source_notes:
          source: >-
            Ministério da Saúde/SVS, Declaração de Óbito: manual de instruções para preenchimento, Brasília, 2022, pp. 15,
            17, 57 and 61-62 (http://bvsms.saude.gov.br/bvs/publicacoes/declaracao_obito_manual_preenchimento.pdf);
            statements taken from other documents carry their own citation
          definition: >-
            A foetal death is the death of a product of conception before the complete expulsion or extraction from the
            mother's body, whatever the duration of the pregnancy; it is indicated by the fact that the foetus, after
            separation, neither breathes nor shows any other sign of life, such as heartbeat, pulsation of the umbilical
            cord or effective movement of the voluntary muscles (DO manual, Apêndice B, p. 57; the SIM dictionary, updated
            07/2025, sources/dicionario-de-dados-SIM-tabela-DO.pdf, gives the same wording for TIPOBITO 1, p. 1). In a
            foetal death the municipality of residence is the mother's, the dates of death and of birth must be equal and
            the age field is not filled (SIM dictionary, pp. 1-3). A newborn who shows a sign of life, even for a few
            moments, is a live birth, not a foetal death, and receives a Declaração de Nascido Vivo and a Declaração de
            Óbito (DO manual, FAQ 3, pp. 61-62).
          final_after_years: 1
          known_errors:
            - >-
              The gestation time is frequently omitted on the Declaração de Óbito, which hampers the precise application of
              the definition of the perinatal period (RIPSA, Indicadores básicos para a saúde no Brasil: conceitos e
              aplicações, 2nd ed., 2008, ficha C.2, p. 116, http://tabnet.datasus.gov.br/tabdata/livroidb/2ed/capituloC.pdf).
            - >-
              Early neonatal mortality may be underestimated by the exclusion of deaths declared as stillbirths but that in
              fact occurred soon after birth (RIPSA ficha C.1.1, p. 110).
          limitations:
            - >-
              A DO is issued for a foetal death when the gestation lasted at least 20 weeks, or the foetus weighed at least
              500 g, or measured at least 25 cm; below all three limits it is not issued unless the family requests it, in
              which case the physician may issue it for burial and its data must be registered in the SIM (DO manual, pp. 15
              and 17). The manual adds that the internationally accepted concept of foetal death covers all deaths without
              sign of life whatever the duration, and that in Brazil, for epidemiological purposes, the DO is advised from
              those limits (pp. 61-62).
            - >-
              RIPSA's sheet C.2 (pp. 116-117) states that the perinatal rate requires correction of the under-enumeration of
              foetal and early neonatal deaths, especially in the North and Northeast; that the under-enumeration of foetal
              deaths tends to be greater and is difficult to estimate; and that, given it and the poor information on the
              duration of gestation, foetal deaths of ignored or blank gestational age should be added to the numerator and
              the denominator. It also notes that ICD-10 anticipated the start of the perinatal period to 22 completed weeks
              of gestation, that the earlier concept took 28 weeks, and that the use of the earlier concept causes
              imprecision (p. 116).
            - >-
              In 2011 the content of the DO changed, with more detail in the information collected, and both forms were
              used at the same time during that year (TabNet "Óbitos fetais - a partir de 1996" Notas Técnicas,
              consolidation up to 22/03/2017, p. 1, http://tabnet.datasus.gov.br/cgi/sim/Obitos_Fetais_1996_2012.pdf).
              The categories of duration of gestation overlap because of changes in the forms over time (p. 4).
            - >-
              Data release timetable: the states transfer the data to the national module within 60 days after the end of
              the month of occurrence (art. 34); the SVS consolidates the statistical year by 30 June of the following year
              (art. 36, par. 2); the data are released as preliminary between 30 June and 30 August of the year after the
              year of occurrence and as official until 30 December of that year (art. 37) (Portaria SVS nº 116, of
              11/02/2009, in Ministério da Saúde/SVS, Legislação relativa aos SIM e SINASC, 2009, pp. 97-98,
              sources/sim_tab/Docs_Tabs_CID10/DOCS/Legislacao_PDF.pdf). The TabNet notes add that occasional corrections
              are still made after the national base is consolidated (p. 1).
          form: Declaração de Óbito (DO), with TIPOBITO 1 (fetal).
    system: SIM
    series: DOFET
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as SIM.DOFET
    what_one_row_is: one fetal death certificate
    unit_of_analysis: fetal death
    known_biases: >
      Registration of fetal deaths is markedly less complete than of live births
      or infant deaths, and completeness falls with gestational age. Early losses
      are largely absent, so any denominator built from this file is a floor.
    gotchas:
      - A fetal death is NOT counted in mortality rates and must never be pooled with SIM.DO.
      - Published as national files. There is no per-state file, so a state filter matches nothing; the state is a column inside the data.
      - The boundary between a late fetal death and an early neonatal death is a certification judgement, and it moves the number between this file and DOINF.
  SIM.DOINF:
    system: SIM
    series: DOINF
    use: not_an_event_source
    why_no_event_type: >-
      A subset of SIM-DO that DATASUS extracts: the deaths under one year of age (IDADE below 400, the minutes,
      hours, days and months of the age code; 7 of the 35,864 records of 2018 carry 400, zero years). In Acre,
      2018, all 273 DOINF deaths of residents are among SIM-DO's 4,094 and SIM-DO has exactly 273 with IDADE
      below 400, so counting both counts them twice. They are counted from SIM-DO with a condition on the age.
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as SIM.DOINF
    what_one_row_is: one death certificate for a death under one year of age
    unit_of_analysis: death
    known_biases: >
      The numerator of the infant mortality rate, and the more under-registered
      half of it. Deaths in the first days of life are the most likely to go
      unregistered, and that loss concentrates where the rate is highest.
    gotchas:
      - A subset of SIM.DO. Pooling the two counts these deaths twice.
      - The denominator belongs to SINASC, not here. Mixing a SIM numerator with a census denominator gives a different rate.
  SIM.DOMAT:
    system: SIM
    series: DOMAT
    use: not_an_event_source
    why_no_event_type: >-
      A subset of SIM-DO that DATASUS extracts by its maternal-death rule (1,639 of the 1,658 records of 2018
      have an obstetric-chapter underlying cause, 17 B and 2 F codes). In Acre, 2018, all 9 DOMAT deaths of
      residents are among SIM-DO's 4,094; the rule is narrower than the pregnancy and puerperium flags (16
      deaths there carry an O-chapter cause or a flag), so counting both counts them twice and a flag does not
      reproduce it. They are counted from SIM-DO.
    asserted_by: pegasus_data
    source: manual
    source_ref: identity declared in curation/ontology.yml as SIM.DOMAT
    what_one_row_is: one death certificate for a death related to pregnancy, childbirth or the puerperium
    unit_of_analysis: death
    known_biases: >
      Maternal deaths are systematically missed on the certificate alone, which
      is why investigation committees exist. Counts here rise when investigation
      improves, so a rising series can mean better ascertainment rather than
      worse outcomes.
    gotchas:
      - A subset of SIM.DO. Pooling the two counts these deaths twice.
      - The numerator of the maternal mortality ratio; the denominator is live births from SINASC.
      - Investigation reclassifies deaths months after certification, so a recent year is not comparable with a settled one.
  SIM.DOR:
    system: SIM
    series: DOR
    use: not_an_event_source
    why_no_event_type: >-
      Not declared yet: the deaths of 1979-1995 in the ICD-9 era, whose causes are CID-9 (CID9WHO); the death
      event is declared for the ICD-10 files (SIM-DO from 1996) and an ICD-9 event needs its own classifier and
      the ICD-9 to ICD-10 bridge (STATUS lists ICD-9 as not done).
    asserted_by: pegasus_data
    source: layout_doc
    source_ref: MORT98.HLP (SIM/CID9/DOCS), directory DORES
    what_one_row_is: one non-foetal death certificate, 1979-1995, filed by state of residence
    unit_of_analysis: death
    known_biases: >
      The ICD-9 era: causes are ICD-9 (CID9WHO), and the 1979-1995 layout codes
      residence with seven-digit municipality codes and its own category tables.
    gotchas:
      - The predecessor of SIM.DO, not a republication of it; the two cover different years.
      - Deaths of residents abroad or of unknown residence are in SIM.DORIG (1995), not here.
  SIM.DOREXT:
    event_types:
      - name: death
        kind: death
        classifiers:
          - {column: CAUSABAS, role: primary, structure: ICD10}
        status:
          column: TIPOBITO
          values: ["2"]
          evidence: >-
            TIPOBITO 2 is a non-foetal death (SIM layout); DOREXT carries both (2022: 433 of 451 are 2, 18 are 1).
      - name: foetal_death
        kind: foetal_death
        classifiers:
          - {column: CAUSABAS, role: primary, structure: ICD10}
        status:
          column: TIPOBITO
          values: ["1"]
          evidence: TIPOBITO 1 is a foetal death (SIM layout); 18 of DOREXT's 451 records in 2022.
    system: SIM
    series: DOREXT
    asserted_by: pegasus_data
    source: manual
    source_ref: the records (2022, 451 deaths) and SIM.DORIG's description in MORT98.HLP
    what_one_row_is: one death in Brazil of a person resident abroad
    unit_of_analysis: death
    gotchas:
      - Not a subset of SIM.DO. DO's files are by state of residence and hold no residents abroad; deaths in Brazil are DO plus DOREXT.
      - Every cause, not only external ones. DOEXT is the external-cause subset of DO.
  SIM.DORIG:
    system: SIM
    series: DORIG
    use: not_an_event_source
    why_no_event_type: >-
      Not declared yet, as SIM-DOR (ICD-9 era): the 1995 deaths of residents abroad or of unknown residence, the
      complement of SIM-DOR's state files; it holds one file, 1995.
    asserted_by: pegasus_data
    source: layout_doc
    source_ref: MORT98.HLP (SIM/CID9/DOCS), directory DOIGN
    what_one_row_is: one non-foetal death of a resident abroad or of unknown residence, 1995
    unit_of_analysis: death
    gotchas:
      - The complement of SIM.DOR's state files for 1995, not an original version of them.

