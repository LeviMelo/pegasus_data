          evidence: >-
            AP_TPAPAC is 1 on the first monthly row of an APAC, 2 on the rows of its later months and
            3 on a single-row APAC (layout: 1 initial, 2 continuity, 3 single). Measured on AM AC 2023 (15,430 of 15,430 APACs with a type-1 row; 15,887 APACs): every
            APAC with a row of type 1 has it on its earliest competence, where the month of AP_DTINIC
            equals AP_CMP; an APAC without one began in an earlier file. Counting rows of type 1 or 3
            counts each APAC once (data/probes/apac/measure6.py, 2026-10-10).
        consolidation:
          key: [AP_AUTORIZ]
    asserted_by: pegasus_data
    what_one_row_is: one authorisation to dispense a specialised-component medicine
    unit_of_analysis: authorisation
    known_biases: >
      Covers the specialised component only — the high-cost drugs. Basic-component
      medicines dispensed in primary care are not here, so this is not a picture
      of pharmaceutical use in general.
    gotchas:
      - Continuing therapy is reauthorised periodically; rows are authorisation periods, not patients or prescriptions.
      - Court-ordered dispensing appears here and can distort spending series for individual drugs.

  SIA.AD:
    system: SIA
    series: AD
    event_types:
      - name: procedure_authorisation
        kind: authorisation
        grain: one APAC, the authorisation of a high-complexity procedure with no APAC file of its own
        classifiers:
