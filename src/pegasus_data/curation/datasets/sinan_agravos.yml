# 36 agravos named from the open-data tree.

  # ------------------------------------------------------------------------
  # The 22 agravos whose identity is declared in ontology.yml. They had names
  # and no row definition, which left them looking documented in info() and
  # silent about the only question that decides how a row may be counted.
  #
  # The unit follows from what SINAN IS — a compulsory-notification system — so
  # it is a notification everywhere except where the form itself counts
  # something else: SDTA counts outbreaks, HIVG counts pregnancies, and HIVE
  # follows an exposed child rather than recording a case.
  SINAN_AIDA:
    label: Aids (adulto)    # the agravo's name where DATASUS gives none
    event_types:
      - name: notification
        kind: notification
        grain: one notification; a person notified twice is two
    system: SINAN
    series: AIDA
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.AIDA
    what_one_row_is: one AIDS case notified in a patient aged 13 or over
    gotchas:
      - A row is a notification, not a confirmed case. These files carry no CLASSI_FIN column
        (0 of 18 files, catalog 2026-09-30), so the outcome of investigation is not a field here.
      - AIDS in adults and in children are separate datasets with different case definitions. Pooling them silently mixes two definitions.
      - Counting by DT_NOTIFIC measures reporting; counting by DT_SIN_PRI measures onset. They differ by weeks.
  SINAN_AIDC:
    label: Aids (criança)    # the agravo's name where DATASUS gives none
    system: SINAN
    series: AIDC
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.AIDC
    what_one_row_is: one AIDS case notified in a child under 13
    gotchas:
      - A row is a notification, not a confirmed case. These files carry no CLASSI_FIN column
        (0 of 18 files, catalog 2026-09-30), so the outcome of investigation is not a field here.
      - The paediatric case definition differs from the adult one and the transmission route is usually vertical, so these rows are not interchangeable with AIDA.
  SINAN_BOTU:
    label: Botulismo    # the agravo's name where DATASUS gives none
    system: SINAN
    series: BOTU
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.BOTU
    what_one_row_is: one notified case of botulism
    gotchas:
      - A row is a notification, not a confirmed case. CLASSI_FIN carries the outcome of investigation, including discarded.
      - Botulism is rare enough that one outbreak dominates a year. Rates over small denominators are unstable.
  SINAN_COLE:
    label: Cólera    # the agravo's name where DATASUS gives none
    system: SINAN
    series: COLE
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.COLE
    what_one_row_is: one notified case of cholera
    gotchas:
      - A row is a notification, not a confirmed case. CLASSI_FIN carries the outcome of investigation, including discarded.
      - Notifications concentrate in epidemic years, so the series is mostly zeroes punctuated by outbreaks rather than a trend.
  SINAN_DCRJ:
    label: Doenças e agravos (RJ)    # the agravo's name where DATASUS gives none
    event_types:
      - name: notification
        kind: notification
        grain: one notification; a person notified twice is two
        evidence: "SINAN is a compulsory-notification system: every agravo's file is its notifications (this file's header)"
        source_notes:
          source: "Nota Técnica nº 48/2025-CGZV/DEDT/SVSA/MS, Ministério da Saúde (sources/sinan_docs/Nota_Tecnica_Doenca_de_Creutzfeldt-Jakob(DCJ).pdf)"
          definition: A notification with ICD-10 A81.0 in the form's code field.
          valid_from: 2005
          final_after_years: 2
          known_errors:
            - Fields 32 and 33 of the form may be inconsistent or untrue, given how hard the diagnosis is.
            - A case without a final classification after 60 days was set to "Inconclusivo" automatically, suspected or confirmed.
          limitations:
            - Confirmation was intermittent; for years no histopathology or immunocytochemistry of brain tissue was done, so notified cases could not be classified "Confirmado", and several states could not send samples.
            - Surveillance and adherence to the diagnostic recommendations differ between states; the data are not a faithful picture of the disease in the country.
          form: >-
            Ficha de Notificação/Conclusão, which has no fields for the disease's own characteristics.
    system: SINAN
    series: DCRJ
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.DCRJ
    what_one_row_is: one notified case of Creutzfeldt-Jakob disease
    gotchas:
      - A row is a notification, not a confirmed case. Confirmation is frequently post-mortem, so the outcome settles long after the notification date.
  SINAN_ESPO:
    # animal epizootics, not notified people: SINAN's shared person notification does not hold beside it
    shared_event_types: false
    event_types:
      - name: epizootic
        kind: epizootic
        grain: one notified sporotrichosis epizootic in cats or dogs (a Sinan Net notification with a serial number)
        classifiers:
          - {column: ESPECIE, role: primary}
          - {column: TP_ZN_OCO, role: alternative}
          - {column: TP_AMB_OCO, role: alternative}
        persons: false
        evidence: >-
          The form's dictionary (Dicionario_de_dados_Epizootias_Esporotricose.pdf) lists the Sinan Net epizootics base: ID_NOTIFICACAO
          is the "número seriado atribuído às notificações em ordem sequencial" and the counts of sick and dead cats and dogs are
          "se informado na notificação", so they are marks, not weights. It has no classification column, so no status rule narrows
          the notifications. The serial is gapless: 32,492 distinct values in 32,492 rows of the ten files (2013-2022), so no
          consolidation is needed. Rows equal on every fact but the serial and the entry date number 9,071 (27.9%); the file holds
          no animal, owner or address, so a re-entry cannot be told from a second animal and none is dropped.
        source_notes:
          source: "Dicionario de dados, agravo Esporotricose (epizootia), base de dados Epizootias do Sinan Net (CGZV/DEDT/SVSA/MS; sources/pdfs/tabsinan__Dicionario_de_dados_Epizootias_Esporotricose.pdf)"
          valid_from: 2013
          valid_to: 2022
          limitations:
            - The counts of sick and dead cats and dogs (G_D, G_M, C_D, C_M) are optional on the notification; all four are blank in 1,262 rows.
            - The municipality is the one that notified (ID_MUNICIP); the municipality where the epizootic occurred is not in the files.
    # its place is the notifying municipality and its onset DT_INI_EPI, not the shared ID_MN_RESI and DT_SIN_PRI, which ESPO lacks
    semantic_axes:
      default_geography: notification
      geography:
        notification: {roles: [epizootic.municipality], code_system: ibge_municipality}
      default_time: onset
      time:
        onset: {roles: [epizootic.start], encoding: date}
        notification: {roles: [notification.date], encoding: date}
    system: SINAN
    series: ESPO
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.ESPO
    what_one_row_is: one notified sporotrichosis epizootic in cats or dogs
    unit_of_analysis: notification of an epizootic
    known_biases: >
      Only the epizootics someone noticed and notified appear, so the series follows where veterinary and health services look and
      where notification was set up, not where the disease is: one state in 2013-2015, ten in 2022, and Rio de Janeiro holds 62% of
      the 32,492 notifications. The counts of animals are optional on the form (blank in 1,262 rows).
    gotchas:
      - A row is a notification of an epizootic, an event of animals, not a case in a person; there is no person, sex or age.
      - These files carry no CLASSI_FIN column (0 of 10 files, catalog 2026-09-30), so the outcome of investigation is not a field here.
      - Notifiable only in some states and only recently (13 UFs in the files; one in 2013-2015, ten in 2022; Rio de Janeiro 62% of the rows), so a national series understates it and the understatement varies by state.
      - Which animals a row stands for is not in the file (the counts of sick and dead animals are optional); 27.9% of the rows repeat another except for the serial and the entry date.
  SINAN_EXAN:
    label: Doenças exantemáticas    # the agravo's name where DATASUS gives none
    system: SINAN
    series: EXAN
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.EXAN
    what_one_row_is: one rash-and-fever case investigated for measles or rubella
    gotchas:
      - This is a surveillance channel, not a disease. Most rows are investigated and discarded, which is the system working as designed.
      - Counting rows counts investigations. Confirmed measles is a subset identified by CLASSI_FIN.
  SINAN_HANS:
