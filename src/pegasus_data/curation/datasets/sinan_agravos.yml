# SINAN's agravos, named from DATASUS's own open-data tree.
#
# The legacy tree names each notifiable disease with a four-letter code and
# says nowhere what it stands for. Dados_Abertos/SINAN/ files the same data
# under Portuguese disease names, which makes the open-data tree a crosswalk
# DATASUS itself published. This file is that join.
#
# What one row is comes from what SINAN is: a compulsory-notification system,
# so a row is a NOTIFICATION, not a case and not a person. Someone notified
# twice is two rows, and a notification later discarded on investigation stays
# in the file with its classification changed.
# Every agravo carries SINAN's notification block, so these axes hold for all 58
# datasets in this file. Declared once: restating them per agravo is the
# duplication that lets one file drift and answer differently from the rest.
#
# The gotcha on every dataset below already says this in prose -- "Counting by
# DT_NOTIFIC measures reporting; counting by DT_SIN_PRI measures onset. They
# differ by weeks." This is the machine-readable form of that same statement,
# and the reason an aggregate must be told WHICH question it is answering.
shared:
  # what one row is, for every agravo that does not state its own `unit_of_analysis` (HIVE, HIVG, NTRA, SDTA, ESPO do)
  unit_of_analysis: notification
  # one aggregate recipe for every agravo counted on these axes (`_aggregate.family_specs`): notifications by
  # municipality of residence and month of notification, with the classification, sex, outcome and confirmation
  # criterion each form carries, and age banded from its IDADE_anos. A row is a NOTIFICATION, not a case (CLASSI_FIN
  # separates them); CLASSI_FIN, CRITERIO and EVOLUCAO code sets are defined PER AGRAVO in SINAN's Anexo I, and where
  # the bound tables cannot label an agravo's codes the raw code shows. A recipe file of the same name replaces it.
  aggregate:
    name: "{dataset_id}_municipality_month"
    label: "{label}"
    description: "{label} — notificações por município de residência e mês de notificação. Uma linha da fonte é {what_one_row_is}."
    geography_binding: residence
    time_binding: notification
    time_grain: month
    dimensions: [CLASSI_FIN, CS_SEXO, EVOLUCAO, CRITERIO]
    age_dimension: {of: IDADE_anos}
    dimension_labels: {CLASSI_FIN: Classificação final, CS_SEXO: Sexo, EVOLUCAO: Evolução, CRITERIO: Critério de confirmação}
    measures:
      notifications: {kind: count, label: Notificações, unit: notification}
  # rows SINAN's own duplicity review marks "do not count" are not counted, in every agravo whose form carries the flag
  duplicates:
    flag: {column: NDUPLIC_N, codes: ['2']}
    evidence: >-
      NDUPLIC_N, "Não Listar/Não Contar (Duplicidade)": 0 'Não identificado', 1 'Não é duplicidade (não listar)', 2
      'Duplicidade (não contar)' (SINAN's codelist). The published files are mostly reviewed already: 6 rows of
      tuberculosis 2022 (of 103,382) and 9 of meningitis 2022 (of 20,063) carry 2, dengue 2019 none. Dengue holds none
      in 2018-2024 either (13,460,004 rows): NDUPLIC_N is blank on 13,294,976, 1 on 19,277, 0 on 145,714 (the zero-fill of
      Espírito Santo's rows, 8,726 in 2021 and 136,988 in 2024) and "/" on 37, never 2, so for SINAN-DENG this rule removes
      nothing (measured 2026-10-24 on the held years; a consumer project's audit reported the same for 2010-2026).
  # what a row becomes when counted: a notification, in every agravo (the header above); an agravo declares its
  # own `case` or `probable_case` only from its own form's classification codes
  event_types:
    - name: notification
      kind: notification
      grain: one notification; a person notified twice is two
      evidence: "SINAN is a compulsory-notification system: every agravo's file is its notifications (this file's header)"
  semantic_axes:
    default_geography: residence
    geography:
      residence:
        roles: [patient.residence]
        code_system: ibge_municipality
      notification:
        roles: [notification.municipality]
        code_system: ibge_municipality
    # Notification is the default because it is the one date SINAN guarantees:
    # a notification exists by definition, and DT_SIN_PRI is filled from the
    # patient's account of when symptoms began, so it is later-arriving and
    # more often absent.
    default_time: notification
    time:
      notification: {roles: [notification.date], encoding: date}
      onset: {roles: [case.onset], encoding: date}
      diagnosis: {roles: [case.diagnosis_date], encoding: date}

