        source_notes:
          source: "Nota Técnica nº 133/2022-CGZV/DEDT/SVSA/MS, Ministério da Saúde (sources/sinan_docs/Nota_Tecnica_Toxoplasmose.pdf)"
          definition: >-
            A notification with ICD-10 O98.6, P37.1 or B58 of a child under one year of age.
          valid_from: 2019
          final_after_years: 3
          known_errors:
            - ICD-10 codes entered wrongly (pregnant women notified with B58 or P37.1, for example).
            - >-
              EVOLUCAO 1 is "Vivo" in DATASUS's table and "Cura" (serological negativation) on the form and in the
              protocol (p. 24); both are kept, the label shown is DATASUS's (DATA_SOURCES).
          limitations:
            - >-
              EVOLUCAO is blank or "Ignorado" for over half the records (55.5 % in 2023) and is enabled only for classes
              1, 2 or blank (protocol p. 26): deaths of probable cases are not in it.
