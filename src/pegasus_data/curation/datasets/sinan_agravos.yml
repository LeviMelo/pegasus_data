            gestational form and 420 for the congenital (pp. 21, 24), and a probable case is notified as suspected (p.
            21): confirmed cases are a lower bound, the probable among the inconclusive and the blank. A notification is
            not a case: of 2019's 2,858 congenital notifications 1,642 were confirmed, of 8,436 gestational 6,346 (lake,
            2026-10-12)
        exposure:
          events: ["SINASC-DN:birth"]
          per: 1000
          evidence: >-
            live births, as the notification's (above): a convention of the literature and of the syphilis indicators,
            no official indicator (Nota Técnica 133/2022 states none; the protocol's one figure is a study's 8 per
            10,000 live births, p. 7); for the gestational form a detection rate per birth, not an incidence among
            pregnancies
