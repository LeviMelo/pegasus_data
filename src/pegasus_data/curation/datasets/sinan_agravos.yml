              residence; 14.5 % of records (5,172 of 35,650, 2019-2025) carry no usable age and link to nothing, and
              twins merge.
            - The data may not represent the disease's behaviour in the country (implementation of the 2018 guidelines differs between places).
            - The period available for tabulation is the one after surveillance was implemented (2019 on); nothing earlier can be validated.
