    what_one_row_is: one notified case of leprosy
    gotchas:
      - A row is a notification. These files carry no CLASSI_FIN column (0 of 26 files, catalog
        2026-09-30). By the notification dictionary's Anexo I (sources/dic_notif_indiv.txt), a
        leprosy notification enters as confirmed, a category the system assigns, and becomes
