            - >-
              The Ministry selects poisonings by methanol, lead and mercury with declared text descriptors and exclusions
              over those fields (lead also excluding field 49's pesticide, rodenticide and veterinary groups; batteries
              counted as a lead and mercury source), the selection TabNet applies since 2026; a count by agent read
              otherwise is not comparable with it.
