        grain: one notification confirmed by the investigation
        classifiers:
          - {column: CLASSI_FIN, role: alternative}
        status:
          column: CLASSI_FIN
          values: ["1"]
          evidence: >-
            CLASSI_FIN 1 Confirmado, 2 Descartado, 8 Inconclusivo (Protocolo de notificação e investigação, 2018, p. 23
