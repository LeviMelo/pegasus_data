      - A child counted here may already appear in HIVE as an exposed child. Exposure and infection are different states.
  SINAN_HIVE:
    label: HIV (exposição)    # the agravo's name where DATASUS gives none
    system: SINAN
    series: HIVE
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.HIVE
    what_one_row_is: one child born to a mother with HIV, followed until infection is confirmed or excluded
    unit_of_analysis: exposed child
    gotchas:
      - An exposed child is not an infected child. Most are followed and found uninfected, which is the point of the register.
      - Rows here are a denominator for vertical transmission, not a numerator. The numerator is in HIVC.
  SINAN_HIVG:
    label: HIV (gestante)    # the agravo's name where DATASUS gives none
    system: SINAN
    series: HIVG
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.HIVG
    what_one_row_is: one pregnancy in a woman with HIV
    unit_of_analysis: pregnancy
    gotchas:
      - The unit is a pregnancy, not a woman. Two pregnancies in the same woman are two rows.
      - Pairs with HIVE, which follows the resulting child, but the link between them is not published.
  SINAN_LER:
    label: LER/DORT    # the agravo's name where DATASUS gives none
    system: SINAN
    series: LER
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.LER
    what_one_row_is: one notified repetitive-strain or work-related musculoskeletal disorder
    gotchas:
      - This is the earlier code for what LERD later carries. A continuous series needs both, and the boundary is a renaming rather than a change in what is counted.
      - Occupational notification depends on a workplace having an occupational health service, so coverage tracks formal employment rather than injury.
  SINAN_MENT:
    label: Transtorno mental relacionado ao trabalho    # the agravo's name where DATASUS gives none
    system: SINAN
    series: MENT
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.MENT
    what_one_row_is: one notified mental health disorder attributed to work
    gotchas:
      - Attribution to work is a judgement recorded on the form, not a finding, and it varies by notifying service.
      - Occupational notification tracks formal employment, so informal workers are largely absent.
  SINAN_NTRA:
    # a survey batch with counts, not a notified person: SINAN's shared notification event does not hold
    # no residence (a batch is not a person) and no onset or diagnosis date: placed where and when it was notified
    semantic_axes:
      default_geography: notification
      geography:
        notification: {roles: [notification.municipality], code_system: ibge_municipality}
      default_time: notification
      time:
        notification: {roles: [notification.date], encoding: date}
    event_types: []
    system: SINAN
    series: NTRA
    use: denominator
    why_no_event_type: >-
      A row is a survey batch (school or household), not a person, and the positives it counts are the people SINAN-TRAC lists
      one by one: in 2019 TRAC has 5,932 rows against NU_CASOPOS' 6,431, every one of TRAC's 1,112 batches (unit, notification
      date, survey type) is in NTRA, and TRAC holds exactly NU_CASOPOS rows in 1,067 of those 1,112. Counting both counts each
      case twice, and the batch has no sex or age. What only NTRA holds is NU_CASOEXA, the people examined (444,257 in 2019), the
      denominator of a survey's positivity.
    asserted_by: pegasus_data
    source: layout_doc
    source_ref: DIC_DADOS_Tracoma_v5.pdf (portalsinan), notification part
    what_one_row_is: one trachoma survey batch (school or household) with the numbers examined and positive
    unit_of_analysis: survey batch
    known_biases: >
      The batches are the surveys a programme chose to run (survey type 1: 2,008 of the 2,337 batches of 2019, with 1.35% of the
      examined positive; type 2: 329 batches, 4.55%), so a positivity describes the people examined where and as the surveys were
      run, not a population; and the same cases are listed again, one by one, in SINAN.TRAC.
    gotchas:
      - NU_CASOEXA is the people examined and NU_CASOPOS those found positive; a row is not a case, and the positives are the cases SINAN.TRAC lists one by one, so never add the two.
      - A zero is a result: the dictionary says the numbers must differ from zero, yet 1,118 of the 2,337 batches of 2019 have no positive and 4 have no one examined.
  SINAN_SDTA:
    system: SINAN
    series: SDTA
    # an outbreak, not a person: SINAN's shared notification event does not hold. Its ill are counted by sex and age
    # band in columns (OQ-76, ADR-0156); SINAN's shared person notification does not hold beside them
    shared_event_types: false
    event_types:
      - name: case
        kind: case
        grain: one person ill in a foodborne outbreak, from the outbreak's count of its ill by sex and age band
        duplicates:
          except: [NU_NOTIFIC, DT_DIGITA, NU_LOTE_H, NU_LOTE_V, DT_TRANSUS, DT_TRANSDM, DT_TRANSSM, DT_TRANSRM, DT_TRANSRS, DT_TRANSSE, DT_INVEST, DT_ENCERRA]
          evidence: >-
            Rows equal on every recorded fact but entry metadata (notification number, entry, transfer, investigation
            and closing dates) are one outbreak entered again: 0-3 a year in 2007-2022 but 21 in 2019 and 28 in 2023,
            19 of them one Maranhão outbreak of 32 ill notified by one unit (CNES 9005064). Near-copies that differ in a
            fact (that unit's 13 others, onsets 23 and 25 March) are not merged: which copy is right is not known.
        weight:
          grid: ill
          sex: {axis: sex, male: M, female: F}
          age: {axis: age_band, unknown: [I]}
          total: NU_TOT
          margin: NU_F_TOT
          evidence: >-
            Form field 32 counts the ill by sex (masculino, feminino, ignorado) and band (<1, 1-4, 5-9, 10-19, 20-49,
            50+, ignorada); its dictionary (SDTA_DIC_DADOS.pdf) requires the grid to sum to the ill interviewed (field
            28, NU_ENT_DOE), while NU_TOT (field 29) is every ill person. Tested on the records (2010, 2015, 2019, 2023):
            masculino + feminino + ignorado equals the band's total column, and the bands sum to each sex's total, in
            every row that fills the grid (458 of 498 in 2010, 571 of 771 in 2019, 1,162 of 1,162 in 2023). 0 to 3
            rows a year (2007-2024) leave one cell blank, which NU_F_TOT, the grid's own total, solves. The grid is
            below NU_TOT in 47 rows of 2010 and 70 of 2023, above it in 10 of 2023.
        note: >-
          The place is the outbreak's (ID_MUNI_RE, the form's field 11, "município de ocorrência do surto"), not the
          residence of the ill. The ill beyond the grid (NU_TOT less the grid's sum) are counted with sex and age
          unknown; an outbreak with neither grid nor total is a group whose ill were not counted, never zero.
        source_notes: &sdta_notes
          source: "Nota Técnica nº 45/2024-CGZV/DEDT/SVSA/MS, Ministério da Saúde (sources/sinan_docs/Nota_Tecnica_Surtos_de_DTA.pdf)"
          definition: >-
            An outbreak of water- and foodborne disease: two or more people with similar signs and symptoms after
            eating food or drinking water of the same origin; one case is an outbreak for botulism and cholera.
          final_after_years: 3
          known_errors:
            - >-
              The form's etiological agent (field 56) and causal food (field 57) are free text, standardised by the
              Ministry into AGENTE_ET1-AGENTE_ET3 and ALIMENTO_C's categories. "Ignorado" is a blank field or one saying
              nothing was found; "Inconclusivo" a vague answer (bacteria, viral, presumed); "Inconsistente" one naming
              something else (contaminated water as the agent).
          limitations:
            - The national database is frozen three years after the notification year; later local corrections are not in it.
          form: >-
            Ficha de Investigação de Surto-DTA (Sinan). Of the Ministry's own food categories, "Alimentos mistos" is
            one food made of ingredients of different categories and "Múltiplos alimentos" two or more foods named as
            the cause.
      - name: outbreak
        kind: outbreak
        grain: one foodborne outbreak, the unit its ill arrive in
        duplicates:
          except: [NU_NOTIFIC, DT_DIGITA, NU_LOTE_H, NU_LOTE_V, DT_TRANSUS, DT_TRANSDM, DT_TRANSSM, DT_TRANSRM, DT_TRANSRS, DT_TRANSSE, DT_INVEST, DT_ENCERRA]
          evidence: >-
            Rows equal on every recorded fact but entry metadata (notification number, entry, transfer, investigation
            and closing dates) are one outbreak entered again: 0-3 a year in 2007-2022 but 21 in 2019 and 28 in 2023,
            19 of them one Maranhão outbreak of 32 ill notified by one unit (CNES 9005064). Near-copies that differ in a
            fact (that unit's 13 others, onsets 23 and 25 March) are not merged: which copy is right is not known.
        persons: false
        evidence: >-
          A row is one outbreak (the form's own unit; Nota Técnica Surtos de DTA §2.1: two or more ill, one for botulism
          and cholera). Its ill come in clusters, so counted as people they fit with φ 0.066 (PegaSUS OPEN_QUESTIONS 14):
          the outbreak is the unit a change in their occurrence is read on, with its ill (NU_TOT) as its size.
        source_notes: *sdta_notes
    semantic_axes:
      default_geography: occurrence
      geography:
        occurrence:
          roles: [outbreak.municipality]
          code_system: ibge_municipality
        notification:
          roles: [notification.municipality]
          code_system: ibge_municipality
      default_time: onset
      time:
        notification: {roles: [notification.date], encoding: date}
        onset: {roles: [case.onset], encoding: date}
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.SDTA
    what_one_row_is: one foodborne outbreak, NOT one person affected
    unit_of_analysis: outbreak
    gotchas:
      - The unit is the event. These rows must never be added to person-level counts from other agravos.
      - The number of people involved is a field on the outbreak, not a count of rows.
  SINAN_SIFC:
    label: Sífilis congênita    # the agravo's name where DATASUS gives none
    event_types:
      - name: notification
        kind: notification
        grain: one notification; a person notified twice is two
        exposure:
          events: ["SINASC-DN:birth"]
          per: 1000
          evidence: "the Ministry's incidence rate of congenital syphilis in children under one, per 1,000 live births (Boletim Epidemiológico de Sífilis, SVSA/MS)"
    system: SINAN
    series: SIFC
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.SIFC
    what_one_row_is: one case of syphilis transmitted in pregnancy
    gotchas:
      - Read as a sentinel indicator. A congenital case implies an antenatal failure, so counts here measure prenatal care as much as infection.
      - Pairs with SIFG, which records the maternal case that should have prevented it.
  SINAN_SIFG:
    label: Sífilis em gestante    # the agravo's name where DATASUS gives none
    event_types:
      - name: notification
        kind: notification
        grain: one notification; a person notified twice is two
        exposure:
          events: ["SINASC-DN:birth"]
          per: 1000
          evidence: "the Ministry's detection rate of syphilis in pregnancy, per 1,000 live births (Boletim Epidemiológico de Sífilis, SVSA/MS)"
    system: SINAN
    series: SIFG
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.SIFG
    what_one_row_is: one case of syphilis detected during pregnancy
    gotchas:
      - A rise here is ambiguous. It may mean more infection or more testing, and this file alone cannot separate them.
      - Pairs with SIFC. The ratio between them is an outcome measure, but the two are not linked record to record.
  SINAN_SRC:
    label: Síndrome da rubéola congênita    # the agravo's name where DATASUS gives none
    system: SINAN
    series: SRC
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.SRC
    what_one_row_is: one case of congenital rubella syndrome
    gotchas:
      - A row is a notification, not a confirmed case. CLASSI_FIN carries the outcome of investigation, including discarded.
      - Counts are near zero after elimination of endemic rubella, so a single case is a surveillance event rather than a rate.
  SINAN_TRAC:
    label: Tracoma    # the agravo's name where DATASUS gives none
    system: SINAN
    series: TRAC
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.TRAC
    what_one_row_is: one trachoma case found in a survey, from the follow-up sheet
    gotchas:
      - Cases are found through school screening surveys, so counts follow where surveys were run rather than where disease is.
    # its residence is ID_MUNI_RE (patient.residence in its roles), not the shared ID_MN_RESI, which TRAC lacks
    semantic_axes:
      default_geography: residence
      geography:
        residence: {roles: [patient.residence], code_system: ibge_municipality}
        notification: {roles: [notification.municipality], code_system: ibge_municipality}
      default_time: notification
      time:
        notification: {roles: [notification.date], encoding: date}
  SINAN_VARC:
    label: Varicela    # the agravo's name where DATASUS gives none
    system: SINAN
    series: VARC
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.VARC
    what_one_row_is: one notified case of varicella
    gotchas:
      - A row is a notification, not a confirmed case. CLASSI_FIN carries the outcome of investigation, including discarded.
      - Notification requirements changed once varicella vaccine entered the schedule, so the series is not comparable across that boundary.
  SINAN_VIOL:
    label: Violência interpessoal e autoprovocada    # the agravo's name where DATASUS gives none
    event_types:
      - name: notification
        kind: notification
        grain: one notification; a person notified twice is two
    system: SINAN
    series: VIOL
    asserted_by: pegasus_data
    source: manual
    source_ref: SINAN is a compulsory-notification system; identity declared in curation/ontology.yml as SINAN.VIOL
    what_one_row_is: one notification of interpersonal or self-inflicted violence
    gotchas:
      - One person subjected to repeated violence generates several notifications. Rows are events reported, not victims.
      - Notifiable universally only from 2011. Growth across that boundary is largely the notification requirement arriving.
      - Under-notification is the rule, and it is worst for exactly the forms of violence least likely to reach a health service.
