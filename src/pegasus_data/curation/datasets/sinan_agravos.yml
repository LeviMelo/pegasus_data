          known_errors:
            - >-
              The toxic agent (form field 50: AGENTE_1-3, P_ATIVO_1-3, OUT_AGENTE) is free text, written with misspellings
              and abbreviations ("CUMBO", "XUMB" for chumbo; "HG" inside unrelated words).
