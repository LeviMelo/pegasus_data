# What one row IS, per dataset. None of this is derivable from the bytes, and
# every one of these is a mistake someone has already made with the data.
datasets:
  SIHSUS_RD:
    event_types:
      - name: hospitalisation
        kind: hospitalisation
        grain: one hospitalisation episode; an AIH is a billing document
        classifiers:
          - {column: DIAG_PRINC, role: primary, structure: ICD10}
          # The epidemiology of procedures and surgeries; childbirth is defined by procedure.
          - {column: PROC_REA, role: alternative, structure: SIGTAP}
        status:
          column: IDENT
          values: ["1"]
          evidence: >-
            IDENT 1 is the principal AIH; a long stay adds continuation AIHs (IDENT 3, 5)
            under the same N_AIH (SISAIH01 layout seq 9; DATASUS_SOURCES). TabNet's
            "Internações" excludes them: AC 2014 type-1 rows 52,733 = TabNet 52,733.
        consolidation:
          key: [N_AIH]
        note: >-
          Transfers between hospitals are separate AIHs; consolidating them needs
          linkage and is not done here.
    system: SIHSUS
    series: RD
    asserted_by: pegasus_data
    what_one_row_is: one billing episode (AIH), NOT one patient
    unit_of_analysis: admission
    source_publication:
      dataset: SIH.RD
      observed_systems: [SIH, SIHSUS]
      observed_series: [RD]
      temporal_resolution: month
      physical_geography: uf
    semantic_axes:
      default_time: competence
      time:
        competence: {fields: [ANO_CMPT, MES_CMPT], encoding: year_month}
        admission: {fields: [DT_INTER], encoding: date}
        discharge: {fields: [DT_SAIDA], encoding: date}
      default_geography: residence
      geography:
        residence: {fields: [MUNIC_RES], code_system: ibge_municipality}
        facility: {fields: [MUNIC_MOV], code_system: ibge_municipality}
    known_biases: >
      Fields that affect payment are filled carefully; fields that do not are
      frequently empty. Only SUS-funded admissions appear, so private and
      supplementary-health care is absent — which is roughly a quarter of
      Brazilian hospital activity and is not distributed evenly by region or income.
    gotchas:
      - One patient readmitted three times is three rows. There is no stable patient key.
      - DIAG_SECUN is present and dead from the 113-column generation onward, filled with '0000'.
      - MUNIC_RES and MUNIC_MOV answer different questions (residence vs occurrence).
      - VAL_TOT is nominal reais at billing time, never deflated.
      - An AIH may be re-presented after rejection; the same episode can appear across competências.

  SIM_DO:
    event_types:
      - name: death
        kind: death
        classifiers:
          - {column: CAUSABAS, role: primary, structure: ICD10}
          - {column: CAUSABAS_O, role: alternative, structure: ICD10, recodes: CAUSABAS}
        status:
          column: TIPOBITO
          values: ["2"]
          evidence: >-
            TIPOBITO 2 is a non-foetal death; DO files carry only these (AC 2022: 4,159 of
            4,159), foetal deaths are published as SIM.DOFET.
        marks: [LINHAA, LINHAB, LINHAC, LINHAD, LINHAII]
    system: SIM
    series: DO
    asserted_by: pegasus_data
    what_one_row_is: one death certificate
    unit_of_analysis: death
    source_publication:
      dataset: SIM.DO
      observed_systems: [SIM]
      observed_series: [DO]
      temporal_resolution: year
      # DOAC2022.dbc, DOSP2022.dbc... -- one file per UF per year. The records
      # engine refused UF scoping for SIM because this line was missing, while
      # the tree plainly partitions by state.
      physical_geography: uf
    semantic_axes:
      default_time: occurrence
      time:
        occurrence: {fields: [DTOBITO], encoding: date}
        registration: {fields: [DTCADASTRO], encoding: date}
      default_geography: residence
      geography:
        residence: {fields: [CODMUNRES], code_system: ibge_municipality}
        occurrence: {fields: [CODMUNOCOR], code_system: ibge_municipality}
    known_biases: >
      Coverage is high nationally but not uniform: under-registration persists in
      the North and Northeast, and ill-defined causes (CID-10 chapter XVIII, R00-R99)
      concentrate where medical certification is weakest. Comparing cause-specific
      rates across regions compares certification quality as much as mortality.
    gotchas:
      - Dates are DDMMAAAA here and AAAAMMDD in SIH.
      - CAUSABAS (coder-selected) is not LINHAD (physician-written); they differ routinely.
      - LINHAA-D hold several CID-10 codes per cell, '*'-delimited, and the order is the causal chain.
      - IDADE packs its unit into the value; SIH uses a separate COD_IDADE column.
      - Preliminary files (PRELIM) are revised for years afterwards; a year is not final when first published.

  SINASC_DN:
    event_types:
      - name: birth
        kind: birth
        grain: one live birth
        marks: [IDANOMAL, CODANOMAL]
    system: SINASC
    series: DN
    asserted_by: pegasus_data
    what_one_row_is: one live birth declaration
    unit_of_analysis: live birth
    source_publication:
      dataset: SINASC.DN
      observed_systems: [SINASC]
      observed_series: [DN]
      temporal_resolution: year
      physical_geography: uf
    semantic_axes:
      default_time: birth
      time:
        birth: {fields: [DTNASC], encoding: date}
        registration: {fields: [DTCADASTRO], encoding: date}
      default_geography: residence
      geography:
        residence: {fields: [CODMUNRES], code_system: ibge_municipality}
        occurrence: {fields: [CODMUNNASC], code_system: ibge_municipality}
    known_biases: >
      Live births only — stillbirths are in SIM as foetal deaths, so perinatal
      analysis needs both systems joined and neither alone is a denominator for
      the other.
    gotchas:
      - ESCMAE and ESCMAE2010 are different schooling classifications; they are not interchangeable across the break.
      - APGAR is recorded at 1 and 5 minutes in separate columns.

  SIASUS_PA:
    system: SIASUS
    series: PA
    asserted_by: pegasus_data
    what_one_row_is: one line of outpatient production, usually already aggregated
    unit_of_analysis: procedure-month
    source_publication:
      dataset: SIA.PA
      observed_systems: [SIA, SIASUS]
      observed_series: [PA]
      temporal_resolution: month
      physical_geography: uf
    semantic_axes:
      default_time: competence
      time:
        competence: {fields: [PA_CMP], encoding: yyyymm}
      default_geography: facility
      geography:
        facility: {fields: [PA_UFMUN], code_system: ibge_municipality}
        patient: {fields: [PA_MUNPCN], code_system: ibge_municipality}
    known_biases: >
      PA is production reporting, not a patient record. Most rows are counts of a
      procedure performed by an establishment in a month, so the file cannot
      answer questions about individuals even where a patient column exists.
    gotchas:
      - This is the largest dataset on the tree (54,199 files) and the one the previous inventory missed entirely.
      - APAC files (high-complexity authorisations) are a different unit from ordinary PA rows.
      - 2001-2007 APAC files carry patient CPF and names in a public download.
