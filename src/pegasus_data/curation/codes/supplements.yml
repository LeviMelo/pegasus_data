# Codes a form's own dictionary omits, from another official source.
# scripts/harvest_codes.py merges them into the harvested table of the series:
# a supplement never replaces a dictionary code, and a conflicting label fails
# the harvest. Each entry cites its source.
SINAN:
  AIDA:
    CRITERIO:
      source_ref: 'SES-RJ TabNet, Nota Técnica Aids — http://sistemas.saude.rj.gov.br/tabnetbd/Sinan/Nota_Tecnica_aids_relacionado.pdf
        ("600, 601 - ÓBITO", "901, 902 - HIV+"); the intermediate criteria also in TAB_SINANNET CRITAIDS.CNV'
      codes:
        '120': CDC + CDC/laboratório
        '123': CDC + CDC/laboratório + Rio de Janeiro/Caracas
        '130': CDC + Rio de Janeiro/Caracas
        '140': CDC/laboratório + Rio de Janeiro/Caracas
        '200': CDC/laboratório
        '400': CDC excepcional
        '500': ARC + óbito
        '601': Critério óbito
        '902': HIV+
  CHIK:
    AUTO_IMUNE:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), ChikNON.def binds the field to Sim_nao.cnv, whose Ign/Branco is ",0-9" (every digit the table does not list); the dictionary (DIC_DADOS_ONLINE, rev. 21/10/2015) prints 1 Sim and 2 Não. SINAN-CHIK 2014-2019: the 9 is on one row, of Espírito Santo (2026-10-24)'
      codes: {'9': Ignorado}
    RES_CHIKS1: &chik_result
      source_ref: 'TAB_SINANONLINE kit (DATASUS), ChikNON.def binds the result to Resultado.cnv, whose Ign/Branco is ",0-9"; the dictionary prints 1 to 4. SINAN-CHIK 2014-2019: every cell of 0 (RES_CHIKS1 67, RES_CHIKS2 193, RESUL_PRNT 199, RESUL_PCR_ 5) is on a notification of Espírito Santo, whose export writes 0 where the form was not answered (see SINAN-DENG SOROTIPO) (2026-10-24)'
      codes: {'0': Ign/Branco}
    RES_CHIKS2: *chik_result
    RESUL_PRNT: *chik_result
    RESUL_PCR_: *chik_result
    CRITERIO:
      source_ref: 'SINAN-CHIK 2014-2019: the 2 cells of 0 are on notifications of Espírito Santo, whose export writes 0 where the form was not answered (see SINAN-DENG SOROTIPO); the kit''s confirmation tables (CONFDESC, CONFDESCDENG2011) list ",9" as Ign/Branco and not 0, and the role has declared 0 not recorded (2026-10-24)'
      codes: {'0': Ign/Branco}
    EVOLUCAO:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), ChikNON.def binds the field to evodeng.cnv, whose Ign/Branco is "0,9"; the dictionary prints 1 to 4 and 9. SINAN-CHIK 2014-2019: the one cell of 0 is on a notification of Espírito Santo (2026-10-24)'
      codes: {'0': Ign/Branco}
  DENG:
    CLASSI_FIN:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the field to Classdeng.cnv: 1 to 4 the classifications of the NET form, 5 Descartado, 8 Inconclusivo, 10 to 12, and Ign/Branco ",0-9"; the dictionary (DIC_DADOS_ONLINE, rev. 21/10/2015) prints 5 and 10 to 13. SINAN-DENG 2018-2024: the 8 (1,447,939 rows, 542,641 of them in 2024) is neither the discarded nor the confirmed. Of those tested in 2020, the 5 (Descartado) are positive in 1.8 % (NS1), 1.5 % (IgM) and 0.6 % (PCR), the 10 in 71 %, 92 % and 77 %, and the 8 in 44 %, 50 % and 14 %; the 8 is closed (99.9 % have DT_ENCERRA) and carries no confirmation criterion in 93 % of 2024 (against none of the 10 and the 5), and SINAN-LEPT shows the same profile for the same code. The 0 (8,678 cells) is on notifications of Espírito Santo alone, as in the fields below (2026-10-24)'
      codes: {'8': Inconclusivo, '0': Ign/Branco}
    CRITERIO:
      source_ref: 'SINAN-DENG 2018-2024: the 3,872 cells of 0 are all on notifications of Espírito Santo, whose export writes 0 where the form was not answered (see SOROTIPO); the kit''s CONFDESCDENG2011.CNV lists ",9" as Ign/Branco and not 0, and the role has declared 0 not recorded (2026-10-24)'
      codes: {'0': Ign/Branco}
    SOROTIPO:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the field to Sorodeng.cnv: DENV 1 to 4, and Ign/Branco "0-9"; the dictionary prints 1 to 4. SINAN-DENG 2018-2024 (13,460,004 rows): all 286,068 cells of 0 (131,058 in 2024) are on notifications of Espírito Santo (SG_UF_NOT 32), none from the other 26 UFs, the state whose export writes 0 where the form was not answered: its rows carry 0 in the other fields below, and its cases classified 10 have 0 in every alarm sign while its cases classified 11 and 12 answer 1, 2 or 9 (2026-10-24)'
      codes: {'0': Ign/Branco}
    HISTOPA_N: &deng_result
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the result to Resultado.cnv (Resultado3.cnv for HISTOPA_N), whose Ign/Branco is ",0-9"; the dictionary prints 1 to 4. SINAN-DENG 2018-2024: every cell of 0 (HISTOPA_N 283,568, IMUNOH_N 283,663, RESUL_SORO 1,827, RESUL_NS1 946, RESUL_VI_N 293, RESUL_PCR_ 456) is on a notification of Espírito Santo, whose export writes 0 where the form was not answered (see SOROTIPO) (2026-10-24)'
      codes: {'0': Ign/Branco}
    IMUNOH_N: *deng_result
    RESUL_SORO: *deng_result
    RESUL_NS1: *deng_result
    RESUL_VI_N: *deng_result
    RESUL_PCR_: *deng_result
    EVOLUCAO:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the field to evodeng.cnv, whose Ign/Branco is "0,9"; the dictionary prints 1 to 4 and 9. SINAN-DENG 2018-2024: the 13,549 cells of 0 are all on notifications of Espírito Santo (see SOROTIPO); in 2024 none of its 2,206 has a death date, while all 70 of that state coded 2 or 3 have one (2026-10-24)'
      codes: {'0': Ign/Branco}
    HOSPITALIZ:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the field to sim_nao.cnv, whose Ign/Branco is ",0-9"; the dictionary prints 1, 2 and 9. SINAN-DENG 2018-2024: the 7 cells of 0 are all on notifications of Espírito Santo (see SOROTIPO) (2026-10-24)'
      codes: {'0': Ign/Branco}
    ALRM_HIPOT: &deng_sign
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the sign to Sim_nao.cnv, whose Ign/Branco is ",0-9" (every digit the table does not list); the dictionary prints 1 Sim and 2 Não. SINAN-DENG 2018-2024: every cell of 0 and of 9 is on a notification of Espírito Santo alone (ALRM_HIPOT 288,121 cells of 0, GRAV_PULSO 294,578), the state whose export writes 0 where the form was not answered (see SOROTIPO): in 2024 the 134,177 zeros of ALRM_HIPOT are all on cases classified 10, which are not asked for warning signs, while that state''s cases classified 11 answer 1, 2 or 9, and the 136,819 zeros of GRAV_PULSO include none on a case classified 12. The 9 is Ignorado, as in every SINAN form that defines it (2026-10-24)'
      codes: {'0': Ign/Branco, '9': Ignorado}
    ALRM_PLAQ: *deng_sign
    ALRM_VOM: *deng_sign
    ALRM_SANG: *deng_sign
    ALRM_HEMAT: *deng_sign
    ALRM_ABDOM: *deng_sign
    ALRM_LETAR: *deng_sign
    ALRM_HEPAT: *deng_sign
    ALRM_LIQ: *deng_sign
    GRAV_PULSO: *deng_sign
    GRAV_CONV: *deng_sign
    GRAV_ENCH: *deng_sign
    GRAV_INSUF: *deng_sign
    GRAV_TAQUI: *deng_sign
    GRAV_EXTRE: *deng_sign
    GRAV_HIPOT: *deng_sign
    GRAV_HEMAT: *deng_sign
    GRAV_MELEN: *deng_sign
    GRAV_METRO: *deng_sign
    GRAV_SANG: *deng_sign
    GRAV_AST: *deng_sign
    GRAV_MIOC: *deng_sign
    GRAV_CONSC: *deng_sign
    GRAV_ORGAO:
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds this sign ("Grave: Outros órgãos") to Sim_nao.cnv: 1 Sim, 2 Não and Ign/Branco ",0-9"; the Sinan Online dictionary (DIC_DADOS_ONLINE, rev. 21/10/2015) does not list the field. SINAN-DENG 2018-2024: every cell of 0 (294,587) and of 9 (81) is on a notification of Espírito Santo alone (see ALRM_HIPOT); the 9 is Ignorado, as in every SINAN form that defines it (2026-10-24)'
      codes: {'1': Sim, '2': Não, '0': Ign/Branco, '9': Ignorado}
    DIABETES: &deng_condition
      source_ref: 'TAB_SINANONLINE kit (DATASUS), DengueNETON3.0.def binds the field to Sim_nao.cnv, whose Ign/Branco is ",0-9"; the dictionary prints 1 Sim and 2 Não. SINAN-DENG 2018-2024: the 9 (DIABETES 242 cells, RENAL 229) is on notifications of Espírito Santo alone (see ALRM_HIPOT); it is Ignorado, as in every SINAN form that defines it (2026-10-24)'
      codes: {'9': Ignorado}
    HEMATOLOG: *deng_condition
    HEPATOPAT: *deng_condition
    RENAL: *deng_condition
    HIPERTENSA: *deng_condition
    ACIDO_PEPT: *deng_condition
    AUTO_IMUNE: *deng_condition
  ESQU:
    EVOLUCAO:
      source_ref: 'DIC_DADOS_Esquistossomose_v5 prints "1 – Cura 2, Não Cura" without a separator, read as one code; the records use 2 (2021: 65 of 1,646), so 2 is Não cura (2026-10-08)'
      drop: ['1']
      codes: {'1': Cura, '2': Não cura}
  LER:
    EVOL_AFAST:
      source_ref: 'DIC_DADOS_DRT_LERDORT_v5 campo 54 prints the outcome during the leave as "Melhora Piora 9- Ignorado" with the numerals of the first two lost from its text layer; the Dermatoses and PAIR dictionaries print the same list "1- melhora 2- piora 9- ignorado", and the LERD 2025 file holds 1, 2 and 9 (2026-10-24)'
      codes: {'1': Melhora, '2': Piora, '9': Ignorado}
  LERD:
    EVOL_AFAST:
      source_ref: 'as LER: the same dictionary, the same list, the numerals lost; the LERD 2025 file holds 1, 2 and 9 (2026-10-24)'
      codes: {'1': Melhora, '2': Piora, '9': Ignorado}
  LEPT:
    CLASSI_FIN:
      source_ref: 'TAB_SINANNET kit (DATASUS), LeptoNET.def binds the field to Classifi.cnv: 1 Confirmado, 2 Descartado, 8 Inconclusivo, and Ign/Branco ",0-9"; DIC_DADOS_Leptospirose_v5 campo 61 prints 1 and 2. SINAN-LEPT 2015-2024: the 6,439 rows of 8 are all closed (DT_ENCERRA filled), carry no confirmation criterion in 97 % (against 2 % of the 1 and the 2), a positive result in 16.5 % (confirmed 43 %, discarded 1 %) and no death (2026-10-24)'
      codes: {'8': Inconclusivo}
    LAB_MICR_1: &lept_micro
      source_ref: 'TAB_SINANNET kit (DATASUS), LeptoNET.def binds the result to Reage.cnv: 1 Reagente, 2 Não reagente, 3 Não realizado, and Ign/Branco ",0-9" (every digit it does not list, so also 4); DIC_DADOS_Leptospirose_v5 campo 50 prints 1, 2, 3 and 9. The file of 2024 holds 4 on 130 and 269 rows of the two results (2026-10-24)'
      codes: {'4': Ign/Branco}
    LAB_MICR_2: *lept_micro
  MENI:
    ANT_TRAUMA:
      source_ref: 'DIC_DADOS_Meningite_v5 prints "1. Sim / 3. Não / 9.Ignorado" for tp_doenca_pre_traumatismo; the files hold 1, 2 and 9 and never 3 (2010: 2 on 23,627 of 27,721 recorded; 2015, 2021 alike), and the tabulation labels 2 Não and 3 Ign/Branco. The dictionary''s 3 is kept as printed; 2 is the No the records use (2026-10-08)'
      codes: {'2': Não}
  PFAN:
    CLI_A_S_FA:
      source_ref: 'The PFAN dictionary prints "9 - Ignorado"; its text layer lost the capital, read as "gnorado" (2026-10-09).
        The field''s siblings in the same table print 9 Ignorado'
      drop: ['9']
      codes: {'9': Ignorado}
    CLI_BICD_N:
      source_ref: 'DIC_DADOS_PFA prints the right biceps reflex (campo 48) "1- Diminuído 1. Ausente 2. Normal 3. Aumentado 9- Ignorado", numbering that repeats 1 and loses 4; the left biceps and the two triceps print 1 Diminuído, 2 Ausente, 3 Normal, 4 Aumentado, 9 Ignorado, and the PFAN 2023 file holds the same five codes for the right biceps as for the triceps (1: 89, 2: 39, 3: 243, 4: 6, 9: 161 against 88, 37, 250, 6, 163; 2026-10-24)'
      drop: ['1', '2', '3']
      codes: {'1': Diminuído, '2': Ausente, '3': Normal, '4': Aumentado}
    EVOR_S_MIE:
      source_ref: 'DIC_DADOS_PFA prints the sensibility of the left lower limb at the revisit (campo 80) "1- Diminuída 2- Ausente 1- Normal 2- Parestesia 3- Prejudicado 9- Ignorado", numbering that repeats 1 and 2; the right lower limb and both upper limbs print 1 Diminuída, 2 Ausente, 3 Normal, 4 Parestesia, 5 Prejudicado, 9 Ignorado, and the PFAN 2023 file holds codes 1 to 5 and 9 for it as for the right lower limb (3: 416 against 419, 4: 7 against 6, 5: 7 against 9; 2026-10-24)'
      drop: ['2', '3']
      codes: {'2': Ausente, '3': Normal, '4': Parestesia, '5': Prejudicado}
  SDTA:
    ST_INCUB_M:
      source_ref: 'SDTA_FICHA.pdf (Ficha de Investigação Surto - DTA, SVS 08/06/2006), campo 34 "Período de Incubação Mínimo (em horas ou dias)": "1 - Horas, 2 - Dias"; the Surto DTA v5 dictionary prints the field varchar(1) without its codes (2026-10-23)'
      codes: {'1': Horas, '2': Dias}
    MAX_ST_INC:
      source_ref: 'SDTA_FICHA.pdf (Ficha de Investigação Surto - DTA, SVS 08/06/2006), campo 35 "Período de Incubação Máximo (em horas ou dias)": "1 - Horas, 2 - Dias"; the Surto DTA v5 dictionary prints the field varchar(1) without its codes (2026-10-23)'
      codes: {'1': Horas, '2': Dias}
    ST_INC_ME:
      source_ref: 'SDTA_FICHA.pdf (Ficha de Investigação Surto - DTA, SVS 08/06/2006), campo 36 "Mediana do Período de Incubação (em horas ou dias)": "1 - Horas, 2 - Dias"; the Surto DTA v5 dictionary prints the field varchar(1) without its codes (2026-10-23)'
      codes: {'1': Horas, '2': Dias}
    TP_LOCAL:
      source_ref: 'DIC_DADOS_Surto_DTA_v5.pdf and SDTA_FICHA.pdf, campo 38 "Local de Ingestão" (tp_local_preparacao, varchar 2), the same table as campo 37 (TP_PRO_PRE); the dictionary names no DBF column for campo 38, so TP_LOCAL is bound to it by elimination (variables/sinan/sdta.yml, 2026-10-23)'
      codes: {'01': Ambulantes, '02': Comemorações, '03': Creche /Escola, '04': Hospital /Unidade de Saúde, '05': Indústria,
              '06': Lanchonete /Confeitaria /Padaria, '07': Produção /Agropecuária, '08': Refeitório, '09': Residência,
              '10': Restaurante, '11': Outros Especificar, '99': Ignorado}
  SIFC:
    HEPATO:
      source_ref: 'DIC_DADOS_Sifilis_Congenita_v5, st_sinal_sintoma_hepato (SINAN-W name HEPATO): "1 sim 2. não 3. não se aplica 9. ignorado"'
      codes: {'1': Sim, '2': Não, '3': Não se aplica, '9': Ignorado}
    CLI_OUTRO:
      source_ref: 'DIC_DADOS_Sifilis_Congenita_v5, st_sinal_sintoma_outro (SINAN-W name CLI_OUTRO): "1 sim 2. não 3. não se aplica 9. ignorado"'
      codes: {'1': Sim, '2': Não, '3': Não se aplica, '9': Ignorado}
  SIFG:
    TPESQUEMA:
      source_ref: 'DIC_DADOS_Gestante_Sifilis_v5 campo 41 prints "1 - Penicilina G benzatina 2.400.000UI; 2 - ... 4.800.000UI; 3 - ... 7.200.000UI; 4 - Outro esquema; 5 - Não realizado; 9 - Ignorado" (SIFIGEN_FICHA.pdf alike); the text extraction ran the labels of codes 1-4 together ("400.000UI 2 - Penicilina G benzatina", "800.000UI") and invented a code 7 from "7.200..000UI" (2026-10-23)'
      drop: ['1', '2', '3', '4', '7']
      codes: {'1': Penicilina G benzatina 2.400.000UI, '2': Penicilina G benzatina 4.800.000UI, '3': Penicilina G benzatina 7.200.000UI, '4': Outro esquema}
    TPESQPAR:
      source_ref: 'DIC_DADOS_Gestante_Sifilis_v5 campo 43 prints the same list as campo 41 ("1 - penicilina g benzatina 2.400.000ui ... 4 - outro esquema; 5 - não realizado; 9 - ignorado"; SIFIGEN_FICHA.pdf alike); the text extraction mixed up the labels of codes 1-4 and invented a code 7 (2026-10-23)'
      drop: ['1', '2', '3', '4', '7']
      codes: {'1': Penicilina G benzatina 2.400.000UI, '2': Penicilina G benzatina 4.800.000UI, '3': Penicilina G benzatina 7.200.000UI, '4': Outro esquema}
    TPMOTPARC:
      source_ref: 'DIC_DADOS_Gestante_Sifilis_v5 campo 44 "Motivo para o não tratamento do Parceiro" (tp_motivo, varchar2(1)) and SIFIGEN_FICHA.pdf campo 44, which the text extraction did not read (2026-10-23)'
      codes: {'1': Parceiro não teve mais contato com a gestante, '2': Parceiro não foi comunicado/convocado à US para tratamento,
              '3': 'Parceiro foi comunicado/convocado à US para tratamento, mas não compareceu',
              '4': Parceiro foi comunicado/convocado à US mas recusou o tratamento, '5': Parceiro com sorologia não reagente, '6': Outro motivo}
  VIOL:
    CS_ESCOL_N:
      source_ref: 'The violence dictionary''s text reads "43 Analfabeto" where every other SINAN NET dictionary and form prints the same scale with "0-Analfabeto" (aids_crianca, antirrabico, dermatoses, lerdort, mental, pfa)'
      drop: ['43']
      codes: {'0': Analfabeto}
