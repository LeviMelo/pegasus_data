        '7': Infecções por Pf com Quinina em 7 dias
        '8': Infecções por Pf de crianças com cápsulas retais de artesunato em 4 dias e dose única de
          Mefloquina no 3º dia e Primaquina no 5º ida
        '9': Infecções mistas por Pv + Pf com Quinina em 3 dias, doxiciclina em 5 dias e Primaquina em
          7 dias
        '10': Prevenção de recaída da malária por Pv com Cloroquina em dose única semanal durante 3 meses
        '11': Malária grave e complicada
        '99': 'Outro esquema utilizado (por médico) - descrever:'
      source_ref: malaria__DIC_DADOS_Malaria_v5.pdf
