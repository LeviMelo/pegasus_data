# What KIND of thing a codelist is.
#
# Not everything DATASUS calls a lookup table is doing the same job, and the
# difference decides where it belongs. Sorting them by SIZE was the obvious
# thing to try and it is wrong: a 50,000-row cap keeps a table of 450 municipal
# rollups and throws away CID10, which is the most important codelist in the
# tree for anyone doing clinical work.
#
# So the role is declared, not inferred. Structure cannot separate these —
# CID10 has one label per code and so does an establishment directory — because
# the difference is what the code REFERS to, which is an institutional fact.
#
#   enumeration     a small closed set of DATASUS's own codes. SEXO, CAR_INT,
#                   RACACOR. Meaningless outside DATASUS and available nowhere
#                   else, which makes them the irreplaceable part of this
#                   project.
#
#   classification  a published standard DATASUS republishes: CID10, CBO,
#                   SIGTAP procedures, CNAE. Large, and kept anyway — DATASUS's
#                   own copy is complete for the data DATASUS publishes, which
#                   is a stronger guarantee than a general-purpose library
#                   gives, and sending someone elsewhere to decode a diagnosis
#                   defeats the point of the package.
#
#   geography       municipalities, regions, health districts. Essential as
#                   denominators and as joins; they collapse well because they
#                   are written as code ranges.
#
#   registry        a directory of ENTITIES — establishments, teams, units.
#                   CADGERBR is 687,789 health establishments. This is not code
#                   semantics: it is a dimension table, and the project already
#                   publishes it properly as the CNES.ST dataset with a declared
#                   join key. Carrying half a million establishment names inside
#                   a Python package to save a `fetch` is the wrong trade.
#
#   crosswalk       an identifier mapped to another identifier, which is a
#                   category of its own rather than a label. CADGERBR's own
#                   labels pack a CNPJ in front of the establishment name, and
#                   that CNPJ is how an establishment is matched across systems
#                   that key on tax identity rather than on CNES. Extracted to
#                   its own table rather than thrown away with the prose.
#
# Only `registry` is held out of the shipped pack. Everything else travels with
# the package so that `fetch(labels=True)` works on a fresh install with no
# network and no separate download.

# codebook: where a codebook ends and an entity register begins, for the label
# pack's recoding check (labelpack.build_label_pack). A codelist with more codes than
# `max_codes`, or codes wider than `max_width`, is a register (establishments,
# municipalities, teams, occupations): its kits renaming a code are renaming an
# entity, not recoding, so no kit is dropped. A codebook's codes are a digit or
# two (RACACOR 1-5, ANO 00-99). A deliberate analytic cut, not learned: the
# registers sit orders of magnitude above it (CADGERBR 687,789 codes, CNES
# teams, CBO ~2,500) and the codebooks far below (SEXO 3, RACACOR 6).
codebook:
  max_codes: 128
  max_width: 3

# label_bindings: the ladder of evidence for "which table labels this column" (semantics/label_bindings.py, read by
# `decide` at query time and by `compile_bindings` at build time). Deliberate analytic cuts, not learned.
label_bindings:
  # Below this share of observed codes, no candidate is the column's codelist. Also the share of rows the form's own
  # harvested table must decode to count as covering the column. Not measured.
  too_weak: 0.5
  # Candidates within this share of the best are ties; grain decides between them. Not measured.
  share_tie: 0.05
  # Mapping codes to fewer than this share of distinct labels is a ROLLUP: it answers a coarser question (which
  # region) than the column asks (which place). Not measured.
  rollup: 0.5
  # A decision is STORED only on enough evidence: every observed code decoded, or at least this many distinct codes.
  # Two small samples of an empty column, or one code in two decoded, are not grounds for a permanent answer; the
  # decision then waits for a read that sees more (live compile 2026-09-28).
  min_evidence: 5
  # The form's own dictionary is taken when it decodes this share of the ROWS. Not measured.
  form_dictionary_rows: 0.95

# Bridges between classifications (`view._bridge_code`): a recipe's short name for a bridge, the classification each
# lands in and the width of its codes there, and the share of the evidence a claim must hold to cross (a code the old
# classification held several meanings of crosses only when one meaning has that share). SIA's (A) and SIH's (H) old
# procedure codes land in SIGTAP's 10 digits; CBO 1994 occupations in CBO 2002's 6.
bridges:
  names: {A: SIGTAP_A, H: SIGTAP_H}
  targets:
    SIGTAP_A: {classification: SIGTAP, width: 10}
    SIGTAP_H: {classification: SIGTAP, width: 10}
    CBO94: {classification: CBO2002, width: 6}
  unique: 0.95

# Lookup tables of the TabWin kits worth promoting to first-class reference sets: the table-name prefix (longest wins),
# the column that holds the code and the one that holds the label, and the reference set it becomes. Discovered by
# reading the kits, each verified against a real member's DBF header; a table not listed is inferred and reported as
# guessed (`tabkit.parse_kit`).
# CADMUN has 28 columns; MUNCOD/MUNNOME are the pair, but MUNSIAFI is shorter and looked more key-like among its
# non-null values, and OBSERV is a 50-character field blank for 5,517 of 5,652 rows: inference chose MUNSIAFI -> OBSERV
# and produced a municipality table that decoded no municipalities.
# SINAN's lookups are keyed by what the data holds (2026-10-03): inference took CNAENET's row sequence CO_SEQ over
# CLASS_CNAE (CNAE 1.0 classes: data 85111, 75116), so 85111 decoded nothing and 10 read "CULTIVO DE CACAU".
# UNIDINVEST's key is the CNES ID_UNIDADE (ACGR 2023 UNI_ATENDE: 365,011 of 400,352 rows; none match its ID_ESTAB, whose
# apparent matches came from a CSV export that strips leading zeros), with the label the .DEFs name.
kit_tables:
  CID10: {code: CID10, label: DESCR, reference: icd10}
  CID9: {code: CID9, label: DESCR, reference: icd9}
  TPROC: {code: IP_COD, label: IP_DSCR, reference: procedures}
  TPROC10: {code: IP_COD, label: IP_DSCR, reference: procedures}
  EMUSO: {code: IP_COD, label: IP_DSCR, reference: procedures}
  EMUSO10: {code: IP_COD, label: IP_DSCR, reference: procedures}
  TCNES: {code: CNES, label: RAZAO, reference: cnes}
  TCH: {code: CGC_HOSP, label: RAZAO, reference: cnpj}
  CADMUN: {code: MUNCOD, label: MUNNOME, reference: municipality}
  TABMUN: {code: MUNCOD, label: MUNNOME, reference: municipality}
  CIDCAP: {code: CAUSAS, label: DESCRICAO, reference: icd_chapter}
  TABUF: {code: CODIGO, label: DESCRICAO, reference: uf}
  TABOCUP: {code: CODIGO, label: DESCRICAO, reference: occupation}
  TABPAIS: {code: CODIGO, label: DESCRICAO, reference: country}
  CNAENET: {code: CLASS_CNAE, label: DS_CNAE, reference: cnae}
  UNIDINVEST: {code: ID_UNIDADE, label: NM_UNIDADE, reference: sinan_unit}

roles:
  registry:
    what: >
      Directories of establishments, units and teams. Held out of the shipped
      label pack because they are entity data, not code semantics — and because
      the same information is published as a dataset with a declared join key,
      which is the honest way to reach it.
    reach_it_instead_by: >
      fetch("CNES-ST") for establishments, then join on the CNES key declared in
      joins.yml. The label pack still ships the CNES↔CNPJ crosswalk extracted
      from these tables, because that is a join primitive rather than a label.
    patterns:
      - CADGER*        # Cadastro Geral — establishments, national and per state
      - UNIDTOTAL      # every unit, all types
      - UNIDBR
      - UNIDSAUDE
      - UNISAUDE
      - INE_EQUIPE*    # primary-care team registry
      - TCNES*         # CNES establishment tables, national and per state
      - HUF_*          # federal university hospitals
      - HOSFED*        # federal hospitals
    # a register that is a plain code -> name table: its key and name columns, as its DBF names them (read off the SIA
    # kit's members, 2026-11-09: 27 INE_EQUIPE tables, 2 HUF tables); a table not listed here is not read by guess
    columns:
      INE_EQUIPE*: {code: CHAVE, label: DS_REGRA}
      HUF_*: {code: CNES, label: NOMEFANT}
    # which system's kit carries a register (SIH's .DEF names CADGERAL, but TAB_SIH.zip does not contain it: measured
    # 2026-09-29, SIH's kit holds one registry table, CIH's none)
    # the establishment register (CADGER*) as the kit lays it out; the CNES code and CPF/CNPJ columns are CNES-ST's
    # roles (establishment.cnes, establishment.cpf_cnpj). `label` is the first non-empty of its columns (trade name,
    # else legal name). `excluded.open_end`: an exclusion date starting with it means the establishment was never
    # excluded; CADGERBR 2026-11-09, 692,005 rows: the 636,189 DATAEXCL 9999xxxx are exactly the rows with EXCLUIDO 0
    establishments:
      label: [FANTASIA, RAZ_SOCI]
      legal: RAZ_SOCI
      maintainer: RSOC_MAN
      municipality: CODUFMUN
      health_region: REGSAUDE
      excluded_flag: EXCLUIDO
      included: DATAINCL
      excluded: {column: DATAEXCL, open_end: "9999"}
    owners:
      CADGER: CNES
      UNIDTOTAL: CNES
      CNPJ_BR: CNES
      INE_EQUIPE: SIASUS

  # Declared for the record. These all ship; the entries exist so that a reader
  # can see the judgement was made rather than defaulted into.
  classification:
    what: Published standards DATASUS republishes, kept whole.
    patterns:
      - CID10*
      - CID9*
      - CBO*
      - CNAE*
      - TPROC*
      - PROC*
      - SIGTAP*

  geography:
    what: Municipalities, regions and health districts.
    patterns:
      - MUNIC*
      - BR_*
      - MESO*
      - MICRO*
      - RSAUD*
      - CSAUD*
      - UF*
