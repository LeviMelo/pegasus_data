                  33: 679330, 35: 3439121, 41: 399027, 42: 228849, 43: 241831, 50: 107541, 51: 147696, 52: 223436,
                  53: 99582}

# BNAFAR (sources/bnafar.py): the supply-unit suffixes of solid oral forms.
bnafar:
  source: "BNAFAR's own rows (SP and RS, 3,107 rows)"
  as_of: "2025-06"
  # U0042 is on 106 distinct product descriptions, 97 naming COMPRIMIDO and the rest "COMP"; U0041 on 16, 14 naming
  # CAPSULA and 2 "CAP INAL". The suffix is a national unit-of-supply code that also encodes volume (U0062 is a 100 mL
  # bottle, U0086 20 mL), not the PDM's own unit number (levotiroxina's comprimido is the PDM's unit 2, BNAFAR's U0042),
  # so other presentations pass their suffix.
  solid_oral: {U0042: COMPRIMIDO, U0041: "CÁPSULA"}

# IBGE, Censo 2022, Agregados por Setores Censitarios (sources/ibge_tracts.py).
ibge_tracts:
  source: "https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/ (dictionary of the demography file)"
  as_of: "2026-05-20 (the date IBGE put in the basic file's name)"
  basic_file: "Agregados_por_Setor_csv/Agregados_por_setores_basico_BR_20260520.zip"
  # Every path below is relative to the Census 2022 root, https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/.
  # A dictionary: its xlsx, its sheet and the column (0-based) of each field in it; null where the sheet has none (the unit is then unstated).
  dictionaries:
    setores: {file: "Agregados_por_Setores_Censitarios/dicionario_de_dados_agregados_por_setores_censitarios_20261113.xlsx", sheet: "Dicionário não PCT",
              columns: {unit: 0, theme: 1, variable: 2, label: 3}, basic_sheet: "Dicionário Básico"}
    renda_responsavel: {file: "Agregados_por_Setores_Censitarios_Rendimento_do_Responsavel/dicionario_de_dados_renda_responsavel_20260508.xlsx",
                        sheet: "Dicionário Renda Responsável", columns: {unit: null, theme: 0, variable: 1, label: 2}}
  # The wide topics: folder and zip, the dictionary and the theme's name in it, and the values' type: integer (a count; "X" suppressed is null)
  # or decimal (float64; "X" suppressed and "." not applicable are null, a decimal point). The header must be the theme's dictionary variables.
  aggregates:
    alfabetizacao: {folder: "Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv", file: "Agregados_por_setores_alfabetizacao_BR.zip",
                    dictionary: setores, theme: "Alfabetização", values: integer}
    domicilio1: {folder: "Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv", file: "Agregados_por_setores_caracteristicas_domicilio1_BR_20261021.zip",
                 dictionary: setores, theme: "Características do Domicílio - Parte 1", values: integer}
    domicilio2: {folder: "Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv", file: "Agregados_por_setores_caracteristicas_domicilio2_BR_20250417.zip",
                 dictionary: setores, theme: "Características do Domicílio - Parte 2", values: integer}
    domicilio3: {folder: "Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv", file: "Agregados_por_setores_caracteristicas_domicilio3_BR_20250417.zip",
                 dictionary: setores, theme: "Características do Domicílio - Parte 3", values: integer}
    cor_ou_raca: {folder: "Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv", file: "Agregados_por_setores_cor_ou_raca_BR.zip",
                  dictionary: setores, theme: "Cor ou Raça", values: integer}
    # Income of the household head, IBGE of 2026-05-08: V06001 heads, V06002 residents, V06003 variance of residents, V06004 mean, V06005 variance, V06006 median (of heads with income)
    renda_responsavel: {folder: "Agregados_por_Setores_Censitarios_Rendimento_do_Responsavel", file: "Agregados_por_setores_renda_responsavel_BR_20260508_csv.zip",
                        dictionary: renda_responsavel, theme: "Renda do Responsável", values: decimal}
  # The sample's tables by weighting area (Areas de Ponderacao, 14,270 areas: the unit of the sample's estimates) and the tracts that compose each area.
  # A table is one xlsx of the zip: two title rows, then header_rows of header (a group's name is on its first merged cell), then one row per area
  # after IBGE's "Brasil" total row; columns 0-3 are municipality code, its name, area code, area name; the rest are numbers (decimal). Others of the
  # zip's 34 tables read the same way once declared with their header_rows (Tab8_x are the income tables).
  weighting_areas:
    tables_zip: "Microdados_e_Areas_de_Ponderacao/Areas_de_Ponderacao/tabelas_xlsx_20261106.zip"
    composition: "Microdados_e_Areas_de_Ponderacao/Documentacao/Áreas de ponderação/Composição das Áreas de Ponderação.xlsx"
    tables:
      renda_trabalho: {member: "XLS/Tab8_1.xlsx", header_rows: 1}
      renda_pessoas: {member: "XLS/Tab8_2.xlsx", header_rows: 1}
      renda_domiciliar_per_capita: {member: "XLS/Tab8_3.xlsx", header_rows: 2}
  # The variables of each sex's eleven age bands of the demography file, in the bands' order (0-4 ... 70+): V01009-V01019 men, V01020-V01030 women.
  sex_band_variables: {"1": [V01009, V01010, V01011, V01012, V01013, V01014, V01015, V01016, V01017, V01018, V01019],
                       "2": [V01020, V01021, V01022, V01023, V01024, V01025, V01026, V01027, V01028, V01029, V01030]}

# IBGE, Localidades do Brasil 2022 (geography.py): the SCT_LOCALIDADE categories that are a municipality's seat.
ibge_localities:
  source: "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/localidades/Localidades_do_Brasil/2022/Localidades_Brasil_gpkg.zip"
  as_of: "2022"
  seat_categories: ["Sede Municipal", "Capital Estadual", "Capital Federal"]

# IBGE, Bioma predominante por municipio (sources/ibge_biomas.py).
ibge_biomas:
  source: "https://geoftp.ibge.gov.br/informacoes_ambientais/estudos_ambientais/biomas/documentos/Bioma_Predominante_por_Municipio_2024.csv"
  as_of: "2024"
  # IBGE's lagoon areas carry territorial codes but are not municipalities (Lagoa Mirim, Lagoa dos Patos); at six digits both would read as 430000.
  not_municipalities: ["4300001", "4300002"]

# IBGE, CNEFE Censo 2022 (sources/ibge_cnefe.py): the dictionary's codes. The file's column order and types stay in the adapter.
ibge_cnefe:
  source: "Dicionario_CNEFE_Censo_2022.xls (IBGE), and the aggregate by CEP's own column names"
  as_of: "2022 Census"
  # NV_GEO_COORD
  levels:
    "1": "address, original Census coordinate"
    "2": "address, modified coordinate (apartments at one number)"
    "3": "address, estimated coordinate (none or invalid originally)"
    "4": "block face"
    "5": "locality"
    "6": "census tract"
  # COD_ESPECIE: the species of address a record stands for, and the derived column that counts its records.
  species:
    "1": {label: "private household", column: n_private_households}
    "2": {label: "collective household", column: n_collective_households}
    "3": {label: "agricultural establishment", column: n_agricultural}
    "4": {label: "educational establishment", column: n_education}
    "5": {label: "health establishment", column: n_health}
    "6": {label: "establishment of other purposes", column: n_other_purpose}
    "7": {label: "building under construction or renovation", column: n_construction}
    "8": {label: "religious establishment", column: n_religious}
  # IBGE's aggregate columns that count the records of a species of COD_ESPECIE (TOT_END counts distinct addresses).
  aggregate_species: {TOT_DP: "1", TOT_DC: "2", TOT_EAGRO: "3", TOT_EENSINO: "4", TOT_ESAUDE: "5", TOT_EOF: "6", TOT_ECR: "7", TOT_ERELIG: "8"}
  # IBGE's dwelling-type columns count the dwellings (private households and collective ones) of each COD_TIPO_ESPECIE:
  # the type is filed on species 1 and 2 only, and every collective household is type 104 (Alagoas: 1,042 of the 4,024 "other").
  aggregate_types: {TOT_TIPO_101: "101", TOT_TIPO_102: "102", TOT_TIPO_103: "103", TOT_TIPO_104: "104"}

# IBGE, Censo 2010 sample microdata (sources/census_commuting.py): the questionnaire's answer codes and the SIDRA tables they are checked against.
census_commuting:
  source: "Layout_microdados_Amostra.xls (IBGE Censo 2010), SIDRA tables 1615 and 1611"
  as_of: "Census 2010"
  # layer -> the event kind, the question variable, the place-code variable, and the question's answer codes for
  # "another municipality", "foreign country", "several places" (null when the question has no such answer), as the questionnaire files them (text).
  layers:
    work: {kind: commute_work_2010, question: V0660, code_variable: V6604, other_municipality: "3", foreign_country: "4", several_places: "5"}
    study: {kind: commute_study_2010, question: V0636, code_variable: V6364, other_municipality: "2", foreign_country: "3", several_places: null}
  # Persons by place of work / school: the SIDRA table, variable, classification and the category "Outro municipio".
  sidra:
    work: {table: 1615, variable: 918, classification: 469, category: 12188}
    study: {table: 1611, variable: 690, classification: 468, category: 12164}

# The columns of the raw files a registry store holds, described from the source's own documentation (`pegasus-data holdings`:
# every variable held is described, or the check fails). One entry per `registries/<store>` (lower case); `source` names the
# document, `columns` lists each column as the files spell it. A store pegasus_data builds from these is classed as built there
# (its Parquet files), never listed. Intake sources (intake.yml) and lake datasets (roles/) describe their own columns.
registry_columns:
  ibge_tracts:
    source: "IBGE, Censo 2022, Agregados por Setores Censitários, malha_com_atributos/Dicionario_de_dados_malha_agregados.xlsx (sheet Setor, read 2026-11-23); the V-variables are in the dictionary workbook held beside the files"
    columns:
      SETOR: "The key column of the themes' files (domicilio1-3 and kin): the tract's geocode, the same value as CD_SETOR; IBGE's dictionary names the themes' variables and not this key"
      CD_SETOR: Geocódigo de Setor Censitário (15 numerals, the first seven the municipality)
      SITUACAO: Situação do Setor Censitário (Urbana, Rural)
      CD_SIT: "Situação detalhada do Setor Censitário (IBGE's mesh dictionary spells it CD_SITUACAO): 1 urban, high density; 2 urban, low density; 3 urban nucleus; 5 rural village; 6 rural nucleus; 7 rural hamlet; 8 rural area; 9 water mass"
      CD_TIPO: "Tipo do Setor Censitário: 0 não especial; 1 favela e comunidade urbana; 2 quartel e base militar; 3 alojamento/acampamento; 4 baixo patamar domiciliar; 5 agrupamento indígena; 6 unidade prisional; 7 convento/hospital/ILPI/IACA; 8 agrovila do PA; 9 agrupamento quilombola"
      AREA_KM2: Área do Setor Censitário em quilômetros quadrados
      CD_REGIAO: Código das Grandes Regiões (Regiões Geográficas)
      NM_REGIAO: Nome das Grandes Regiões (Regiões Geográficas)
      CD_UF: Código da Unidade da Federação
      NM_UF: Nome da Unidade da Federação
      CD_MUN: Código do Município
      NM_MUN: Nome do Município
      CD_DIST: Código do Distrito
      NM_DIST: Nome do Distrito
      CD_SUBDIST: "Código do Subdistrito (IBGE's mesh dictionary spells it CD_SUBDIS)"
      NM_SUBDIST: Nome do Subdistrito
      CD_BAIRRO: Código do Bairro
      NM_BAIRRO: Nome do Bairro
      CD_NU: Código do Núcleo Urbano
      NM_NU: Nome do Núcleo Urbano
      CD_FCU: Código da Favela ou Comunidade Urbana
      NM_FCU: Nome da Favela ou Comunidade Urbana
      CD_AGLOM: Código do Aglomerado
      NM_AGLOM: Nome do Aglomerado
      CD_RGINT: Código da Região Geográfica Intermediária
      NM_RGINT: Nome da Região Geográfica Intermediária
      CD_RGI: Código da Região Geográfica Imediata
      NM_RGI: Nome da Região Geográfica Imediata
      CD_CONCURB: Código da Concentração Urbana
      NM_CONCURB: Nome da Concentração Urbana
  ibge_cnefe:
    source: 'IBGE, Censo 2022, CNEFE: Dicionario_CNEFE_Censo_2022.xls and Dicionario_Agregados_por_CEP_CNEFE_Censo_2022.xls (held in the store)'
    columns:
      COD_UNICO_ENDERECO: Código único do endereço
      COD_UF: Código da UF
      COD_MUNICIPIO: Código do município
      COD_DISTRITO: Código do distrito
      COD_SUBDISTRITO: Código do subdistrito
      COD_SETOR: Código do setor
      NUM_QUADRA: Número da quadra ¹
      NUM_FACE: Número da face
      CEP: Código de Endereçamento Postal
      DSC_LOCALIDADE: Localidade
      NOM_TIPO_SEGLOGR: Tipo do logradouro
      NOM_TITULO_SEGLOGR: Título do logradouro
      NOM_SEGLOGR: Nome do logradouro
      NUM_ENDERECO: Número no logradouro
      DSC_MODIFICADOR: Modificador do número
      NOM_COMP_ELEM1: 'Complemento: Elemento 1'
      VAL_COMP_ELEM1: 'Complemento: Valor 1'
      NOM_COMP_ELEM2: 'Complemento: Elemento 2'
      VAL_COMP_ELEM2: 'Complemento: Valor 2'
      NOM_COMP_ELEM3: 'Complemento: Elemento 3'
      VAL_COMP_ELEM3: 'Complemento: Valor 3'
      NOM_COMP_ELEM4: 'Complemento: Elemento 4'
      VAL_COMP_ELEM4: 'Complemento: Valor 4'
      NOM_COMP_ELEM5: 'Complemento: Elemento 5'
      VAL_COMP_ELEM5: 'Complemento: Valor 5'
      LATITUDE: Latitude do Endereço
      LONGITUDE: Longitude do Endereço
      NV_GEO_COORD: Nível de geocodificação (1=Endereço - coordenada original do Censo 2022; 2=Endereço - coordenada modificada (apartamentos em
        um mesmo número no logradouro) ²; 3=Endereço - coordenada estimada (endereços originalmente sem coordenadas ou coordenadas inválidas) ³;
        4=Face de quadra; 5=Localidade; 6=Setor censitário)
      COD_ESPECIE: Espécie de endereço (1=Domicílio particular; 2=Domicílio coletivo; 3=Estabelecimento agropecuário; 4=Estabelecimento de ensino;
        5=Estabelecimento de saúde; 6=Estabelecimento de outras finalidades; 7=Edificação em construção ou reforma; 8=Estabelecimento religioso)
      DSC_ESTABELECIMENTO: Identificação do estabelecimento
      COD_INDICADOR_ESTAB_ENDERECO: Indicador de estabelecimento (1=Único; 2=Múltiplo, com até 10 estabelecimentos no endereço; 3=Múltiplo, com
        mais de 10 estabelecimentos no endereço; 4=Múltiplo, com quantidade de estabelecimentos desconhecida no endereço)
      COD_INDICADOR_CONST_ENDERECO: Indicador de construção ou reforma (1=Único; 2=Múltiplo, com até 10 unidades no endereço; 3=Múltiplo, com mais
        de 10 unidades no endereço; 4=Múltiplo, com quantidade de unidades desconhecida no endereço)
      COD_INDICADOR_FINALIDADE_CONST: Indicador de finalidade de construção (1=Residencial; 2=Não residencial; 3=Misto; 4=Indeterminado)
      COD_TIPO_ESPECI: 'Tipo da edificação dos domicílios (101=Casa; 102=Casa de vila ou em condomínio; 103=Apartamento; 104=Outros) (the files''
        header is cut at 15 characters: COD_TIPO_ESPECI)'
      TOT_END: Total de endereços (Agregados por CEP)
      TOT_DP: Total de domicílios particulares (Agregados por CEP)
      TOT_TIPO_101: Total de casas (Agregados por CEP)
      TOT_TIPO_102: Total de casas de vila ou em condomínio (Agregados por CEP)
      TOT_TIPO_103: Total de apartamentos (Agregados por CEP)
      TOT_TIPO_104: Total de outros tipos de edificação (Agregados por CEP)
      TOT_DOM_COND: Total de domicílios em arranjos condominiais (Agregados por CEP)
      TOT_DC: Total de domicílios coletivos (Agregados por CEP)
      TOT_EAGRO: Total de estabelecimentos agropecuários (Agregados por CEP)
      TOT_EENSINO: Total de estabelecimentos de ensino (Agregados por CEP)
      TOT_ESAUDE: Total de estabelecimentos de saúde (Agregados por CEP)
      TOT_ERELIG: Total de estabelecimentos religiosos (Agregados por CEP)
      TOT_EOF: Total de estabelecimentos de outras finalidades (Agregados por CEP)
      TOT_ECR: Total de edificações em construção ou reforma (Agregados por CEP)
  ibge_biomas:
    source: "IBGE, Bioma predominante por município 2024 (Bioma_Predominante_por_Municipio_2024.csv, the file's own header)"
    columns:
      GEOCÓDIGO: IBGE code of the municipality (7 numerals; two lagoons carry territorial codes and are not municipalities, see not_municipalities above)
      NOME DO MUNICÍPIO: Name of the municipality
      SIGLA DA UF: State abbreviation
      BIOMA PREDOMINANTE: The biome that covers most of the municipality's area
  inmet:
    source: "The Zenodo mirror's own glossaries (inmet_autoh_glossary.csv, inmet_convd_glossary.csv, held beside them: each catalog column's description in Portuguese and English) for the catalogs and the glossaries' columns; NOAA NCEI, Integrated Surface Database, isd-history.csv header and its isd-history.txt description for the ISD station list"
    columns:
      STATION_ID: INMET station code (glossary)
      STATION_NAME: Official station name (glossary)
      STATION_STATUS: Station status in 2025 (glossary)
      STATION_START: Date the station began operating (glossary)
      STATION_X: Longitude of the station in degrees (glossary)
      STATION_Y: Latitude of the station in degrees (glossary)
      STATION_Z: Altitude of the station in metres (glossary)
      STATE_ALIAS: State abbreviation (glossary)
      FIELD: The glossary's field name, a column of the mirror's database or catalog
      DTYPE: The glossary's data type of the field
      DESCRIPTION_PT: The glossary's description of the field in Portuguese
      DESCRIPTION_EN: The glossary's description of the field in English
      FILE: The mirror's file the field belongs to
      USAF: ISD station identifier assigned by the US Air Force (with WBAN, the station's key)
      WBAN: ISD station identifier assigned by the US Weather Bureau, Air Force, Navy (99999 where none)
      STATION NAME: ISD station name
      CTRY: ISD country code (FIPS)
      STATE: ISD state code (US stations)
      ICAO: ISD ICAO aerodrome identifier
      LAT: ISD station latitude, signed decimal degrees
      LON: ISD station longitude, signed decimal degrees
      ELEV(M): ISD station elevation in metres
      BEGIN: ISD first date of the station's record (YYYYMMDD)
      END: ISD last date of the station's record (YYYYMMDD)
    unconfirmed: [USAF, WBAN, STATION NAME, CTRY, STATE, ICAO, LAT, LON, ELEV(M), BEGIN, END]
    unconfirmed_why: "the ISD column meanings are NOAA's isd-history.txt header as known; that file was not fetched here (the CSV carries the names only)"
  tuss:
    source: "ANS, PDA 049 TUSS dictionary (dicionario-pda-049-tuss.ods, dadosabertos.ans.gov.br/FTP/PDA/terminologia_unificada_saude_suplementar_TUSS-049/, read 2026-11-23: sheets TUSS_18, 19, 20, 22_a_57_76_77, 60_79, 63, 64)"
    columns:
      CD_TERMO: "Identifier of the term (the TUSS table's 'Código do Termo'; in tables 22 and 24 one code can have an active and an inactive term)"
      NM_TERMO: Description of the term (the table's 'Termo')
      DS_TERMO_DETALHADA: Detailed description of the term (tables 18 and 60/79)
      DS_TERMO_DETALHADO: Detailed description of the group (table 63's 'Grupo')
      DT_INICIO_VIGENCIA: Date the term's validity began in the TISS standard
      DT_FIM_VIGENCIA: Last date of the term's validity; empty means the term is active
      DT_FIM_IMPLANTACAO: Date from which all exchange agents must use the term
      DT_INICIO_VIGENCIA;DT_FIM_VIGENCIA: "A header artefact: a file whose header is filed with the two dictionary columns DT_INICIO_VIGENCIA and DT_FIM_VIGENCIA joined by the delimiter; they are those two columns"
      TP_MODELO: Model description (table 19, materials and OPME)
      NM_FABRICANTE: Manufacturer's name as in the ANVISA registration (table 19)
      REGISTRO_ANVISA: ANVISA registration number (tables 19 and 20)
      GR_CLASSE_RISCO: Risk class under the ANVISA registration (table 19)
      NM_TECNICO: Technical name under the ANVISA registration (table 19)
      NM_APRESENTACAO: Form of presentation of the medicine (table 20)
      NM_LABORATORIO: Name of the company that holds the ANVISA registration (table 20)
      ID_TERMINOLOGIA_TUSS: Identifier of the TUSS table (table 64's 'Terminologia')
      CD_TUSS: Identifier of the term (table 64's 'Código TUSS')
      TP_ENVIO: How the datum is sent to ANS, individualised or consolidated (a consolidated term is sent within a group of table 63 and cannot be told apart by its TUSS code)
      CD_GRUPO: Identifier of the table-63 group the procedure code belongs to (filled for consolidated sending only)
      DS_GRUPO_DETALHADA: Detailed description of that group (consolidated sending only)
  anac:
    source: "ANAC registers (AerodromosPublicos.csv, AerodromosPrivados.csv, Aerodromos_Publicos_Excluidos.csv: the files' own headers, after their 'Atualizado em' line); ANAC, Dados Estatisticos do Transporte Aereo, 'Descricao das variaveis', Etapa Basica, as quoted by sources/anac_air.py; OurAirports (ourairports_airports.csv, ourairports.com/data, public domain: its header)"
