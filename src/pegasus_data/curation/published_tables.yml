# Published numbers and code meanings that the source adapters (sources/*.py, geography.py) read, each with its source
# and the date it was read. A source adapter keeps the LAYOUT of a file (column positions, widths, header spellings);
# what a published table says, or what a code of the publisher means, is declared here and read with
# semantics.curation.declared("published_tables.yml", <section>, ...). Not a curation file of variables (the loader skips it).

# IBGE, Pesquisa de Pos-Enumeracao do Censo Demografico 2022 (sources/pes.py): the net error rate of the 2022 Census.
pes:
  source: "IBGE, Pesquisa de Pos-Enumeracao do Censo Demografico 2022, https://biblioteca.ibge.gov.br/visualizacao/livros/liv102110.pdf, Tables 1 and 8-12"
  as_of: "2023 (the report's publication; the numbers are the report's, as typed from its tables)"
  enumerated: 195101203
  imputed: 7979553
  # Table 9: net error (%) by sex and 5-year group 0-4 ... 75-79, 80+.
  net_error_age_sex:
    men: [10.2, 9.0, 8.1, 8.2, 10.6, 10.4, 9.8, 8.7, 8.0, 7.3, 6.6, 5.6, 5.1, 4.5, 4.3, 3.5, 4.1]
    women: [10.0, 8.8, 8.3, 9.4, 11.2, 10.2, 9.1, 8.1, 7.6, 7.0, 6.3, 5.2, 5.0, 4.2, 3.7, 3.3, 4.5]
  # Table 10: net error (%) by state (IBGE code).
  net_error_uf: {12: 8.0, 27: 4.8, 16: 10.8, 13: 10.1, 29: 7.4, 23: 7.4, 53: 9.9, 32: 10.0, 52: 7.3, 21: 6.5, 51: 7.3,
                 50: 7.2, 31: 6.1, 41: 5.4, 25: 3.8, 15: 9.9, 26: 8.0, 22: 4.1, 24: 6.2, 43: 5.5, 33: 15.5, 11: 11.2,
                 14: 10.9, 42: 7.4, 28: 5.8, 35: 10.8, 17: 6.8}
  # Table 12: net error (%) by municipality size (people): the classes' upper bounds, and nine rates.
