    official_name: Transtornos mentais relacionados ao trabalho
    translated_name: Work-related mental disorders
    what_it_is: One notified mental health disorder attributed to work.
    observed_as: [MENT]
    confidence: medium

  SINAN.NTRA:
    system: SINAN
    official_name: Tracoma — inquérito (notificação)
    translated_name: Trachoma survey
    what_it_is: >
      One trachoma survey batch, school or household (CS_INQUERI), with the
      numbers examined and positive (NU_CASOEXA, NU_CASOPOS), from the
      notification part of DIC_DADOS_Tracoma_v5.pdf (portalsinan; local sources/portalsinan). Corrected 2026-10-08: this entry read NTRA as
      occupational-accident notifications; the columns and the dictionary are
      trachoma's.
    observed_as: [NTRA]
    confidence: high

