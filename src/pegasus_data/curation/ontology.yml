  IBGE.RENDA:
    system: IBGE
    official_name: Renda
    translated_name: Income
    what_it_is: Population by income bracket.
    observed_as: [RENDA]

  IBGE.IDOSO:
    system: IBGE
    official_name: População Idosa
    translated_name: Older population
    what_it_is: Population aged 60 and over, published as its own table.
    observed_as: [IDOSO]

  # ------------------------------------------------- SINAN agravos not in
  # datasets_sinan.yml. That file carries "what one row is" for 36 agravos;
  # these 22 are declared here for identity so the API can resolve them, and
  # should gain a row-level entry there as they are documented.

  SINAN.AIDA:
    system: SINAN
    official_name: AIDS em adultos
    translated_name: AIDS in adults
    what_it_is: One AIDS case notified in a patient aged 13 or over.
    observed_as: [AIDA]

  SINAN.AIDC:
    system: SINAN
    official_name: AIDS em crianças
    translated_name: AIDS in children
    what_it_is: >
      One AIDS case notified in a child under 13, kept separate because the
      case definition and the transmission route differ from the adult form.
    observed_as: [AIDC]

  SINAN.HIVA:
    system: SINAN
    official_name: HIV em adultos
    translated_name: HIV in adults
    what_it_is: >
      One HIV infection notified in an adult — notifiable in its own right since
      2014, separately from progression to AIDS.
    observed_as: [HIVA]
    confidence: medium

  SINAN.HIVC:
    system: SINAN
    official_name: HIV em crianças
    translated_name: HIV in children
    what_it_is: One HIV infection notified in a child.
    observed_as: [HIVC]
    confidence: medium

  SINAN.HIVE:
    system: SINAN
    official_name: Criança exposta ao HIV
    translated_name: Child exposed to HIV
    what_it_is: >
      One child born to a mother with HIV, followed until infection is confirmed
      or excluded. An exposure record, not a diagnosis.
    observed_as: [HIVE]
    confidence: medium

  SINAN.HIVG:
    system: SINAN
    official_name: Gestante com HIV
    translated_name: Pregnant woman with HIV
    what_it_is: >
      One pregnancy in a woman with HIV, notified so that vertical transmission
      prophylaxis can be tracked.
    observed_as: [HIVG]
    confidence: medium

  SINAN.SIFC:
    system: SINAN
    official_name: Sífilis congênita
    translated_name: Congenital syphilis
    what_it_is: >
      One case of syphilis transmitted in pregnancy. Treated as a sentinel
      indicator: a congenital case means antenatal screening or treatment failed.
    observed_as: [SIFC]

  SINAN.SIFG:
    system: SINAN
    official_name: Sífilis em gestante
    translated_name: Syphilis in pregnancy
    what_it_is: >
      One case of syphilis detected during pregnancy — the notification that
      should prevent a SINAN.SIFC case.
    observed_as: [SIFG]

  SINAN.HANS:
    system: SINAN
    official_name: Hanseníase
    translated_name: Leprosy
    what_it_is: >
      One notified case of leprosy, carrying the operational classification and
