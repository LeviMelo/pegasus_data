    observed_as: [HANS]

  SINAN.VIOL:
    system: SINAN
    official_name: Violência interpessoal e autoprovocada
    translated_name: Interpersonal and self-inflicted violence
    what_it_is: >
      One notification of violence — domestic, sexual, or self-inflicted.
      Notifiable universally since 2011, and heavily under-notified, so counts
