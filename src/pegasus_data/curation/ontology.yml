  SINAN.TRAC:
    system: SINAN
    official_name: Tracoma — acompanhamento de casos
    translated_name: Trachoma, case follow-up
    what_it_is: >
      One trachoma case found in a survey, from the follow-up sheet (RQ002
      "Planilha para Acompanhamento de Agregados" of DIC_DADOS_Tracoma_v5.pdf (portalsinan; local sources/portalsinan)): case number,
      residence, age, sex, clinical forms (TF, TI, TS, TT, CO) and referral to
      surgery. The cases behind SINAN.NTRA's survey counts.
    observed_as: [TRAC]
    confidence: high

  SINAN.DCRJ:
    system: SINAN
    official_name: Doença de Creutzfeldt-Jakob
    translated_name: Creutzfeldt-Jakob disease
    what_it_is: One notified case of Creutzfeldt-Jakob disease.
    observed_as: [DCRJ]
    confidence: medium

  SINAN.LER:
    system: SINAN
    official_name: LER/DORT
    translated_name: Work-related musculoskeletal disorder
    what_it_is: >
      One notified repetitive-strain or work-related musculoskeletal disorder.
      The earlier code for what later files carry as LERD; both exist in the
      tree and should be read together for a full series.
    observed_as: [LER]
    confidence: medium

  SINAN.MENT:
