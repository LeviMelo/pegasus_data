  # should gain a row-level entry there as they are documented.

  SINAN.AIDA:
    system: SINAN
    official_name: AIDS em adultos
    translated_name: AIDS in adults
    what_it_is: One AIDS case notified in a patient aged 13 or over.
    observed_as: [AIDA]

  SINAN.AIDC:
    system: SINAN
    official_name: AIDS em crianças
    translated_name: AIDS in children
    what_it_is: >
      One AIDS case notified in a child under 13, kept separate because the
      case definition and the transmission route differ from the adult form.
    observed_as: [AIDC]

  SINAN.HIVA:
    system: SINAN
    official_name: HIV em adultos
    translated_name: HIV in adults
    what_it_is: >
      One HIV infection notified in an adult — notifiable in its own right since
      2014, separately from progression to AIDS.
    observed_as: [HIVA]
    confidence: medium

  SINAN.HIVC:
    system: SINAN
    official_name: HIV em crianças
    translated_name: HIV in children
    what_it_is: One HIV infection notified in a child.
    observed_as: [HIVC]
    confidence: medium

  SINAN.HIVE:
    system: SINAN
    official_name: Criança exposta ao HIV
    translated_name: Child exposed to HIV
    what_it_is: >
