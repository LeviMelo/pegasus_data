      or excluded. An exposure record, not a diagnosis.
    observed_as: [HIVE]
    confidence: medium

  SINAN.HIVG:
    system: SINAN
    official_name: Gestante com HIV
    translated_name: Pregnant woman with HIV
    what_it_is: >
      One pregnancy in a woman with HIV, notified so that vertical transmission
      prophylaxis can be tracked.
    observed_as: [HIVG]
    confidence: medium

  SINAN.SIFC:
    system: SINAN
    official_name: Sífilis congênita
    translated_name: Congenital syphilis
    what_it_is: >
      One case of syphilis transmitted in pregnancy. Treated as a sentinel
      indicator: a congenital case means antenatal screening or treatment failed.
    observed_as: [SIFC]

  SINAN.SIFG:
    system: SINAN
    official_name: Sífilis em gestante
    translated_name: Syphilis in pregnancy
    what_it_is: >
      One case of syphilis detected during pregnancy — the notification that
      should prevent a SINAN.SIFC case.
    observed_as: [SIFG]

  SINAN.HANS:
    system: SINAN
    official_name: Hanseníase
    translated_name: Leprosy
    what_it_is: >
      One notified case of leprosy, carrying the operational classification and
