# Link specs (ADR-0107, ADR-0110). Each links records of two datasets through
# roles (curation/roles.yml). A spec is data, reviewed like the curation:
#
#   left / right   dataset, and an optional SQL `where` over its roles (quoted
#                  names: "admission.death"); `group` makes one record per group
#                  (the live births of one delivery); `explode_days` turns an
#                  interval into one row per day [start role, end role, new role]
#   passes         strictest first; each key pairs a left role with a right role
#   control        the left role shifted for the negative control, and by how
#                  many days
#   validate       held-out checks on the linked pairs: two roles that should
#                  agree (optionally within `tolerance`), or an `sql` condition
#                  over l.* and r.*
#
# The first three reproduce omnisus's deterministic study (EVALUATION
# 2026-09-30) so both projects can be checked against each other.

links:
  sih_deaths_to_sim:
    description: >
      Admissions that ended in death (SIH-RD MORTE = 1) to the death certificate.
      The shared event is the day: the discharge date is the death date.
    left: {dataset: SIH-RD, where: "\"admission.death\" = '1'"}
    right: {dataset: SIM-DO}
    passes:
      - name: birth date, sex, death day, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date], [admission.facility, death.facility]]
      - name: birth date, sex, death day
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date]]
      - name: birth date, sex, residence, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [patient.residence, deceased.residence], [admission.facility, death.facility]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: residence agrees, left: patient.residence, right: deceased.residence}
      - {name: died in hospital, sql: "r.\"death.place\" = 'hospital'"}
    probabilistic:
      compare:
        - [patient.birth_date, deceased.birth_date]
        - [patient.sex, deceased.sex]
        - [admission.end, death.date]
        - [admission.facility, death.facility]
        - [patient.residence, deceased.residence, {given: admission.facility_municipality, side: left}]
      blocks:
        - [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex]]
        - [[admission.end, death.date], [admission.facility, death.facility]]
        - [[admission.end, death.date], [patient.residence, deceased.residence], [patient.sex, deceased.sex]]
      target_fdr: 0.01

  sim_infant_deaths_to_sinasc:
    description: >
      Deaths before one year of life, of children born in the death's year, to
      their birth record. Both files are organised by residence, so almost every
      such death should have a birth: the linked share approximates sensitivity.
    left:
      dataset: SIM-DO
      where: >
        year("deceased.birth_date") = year("death.date")
        AND "death.date" - "deceased.birth_date" < 365
    right: {dataset: SINASC-DN}
    passes:
      - name: birth date, sex, residence, weight
        keys: [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex],
               [deceased.residence, mother.residence], [death.birth_weight, birth.weight]]
      - name: birth date, sex, residence, mother's age
        keys: [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex],
               [deceased.residence, mother.residence], [death.maternal_age, mother.age]]
    control: {role: deceased.birth_date, shift_days: 7}
    validate:
      - {name: delivery type agrees, left: death.delivery, right: birth.delivery}
      - {name: plurality agrees, left: death.plurality, right: birth.plurality}
      - {name: gestational weeks within 2, left: death.gestation_weeks, right: birth.gestation_weeks, tolerance: 2}
    probabilistic:
      compare:
        - [deceased.birth_date, baby.birth_date]
        - [deceased.sex, baby.sex]
        - [deceased.residence, mother.residence]
        - [death.birth_weight, birth.weight]
        - [death.maternal_age, mother.age]
      blocks:
        - [[deceased.birth_date, baby.birth_date]]
        - [[deceased.residence, mother.residence], [death.birth_weight, birth.weight]]
        - [[deceased.residence, mother.residence], [deceased.sex, baby.sex], [death.maternal_age, mother.age]]
      target_fdr: 0.01

  sinasc_births_to_delivery_admission:
    description: >
      A birth to the mother's delivery admission. In a delivery AIH the patient
      is the mother, and SINASC records her birth date; the birth day falls
      inside the admission. The live births of one mother, one day, one hospital
      are one delivery (twins link once).
    left:
      dataset: SINASC-DN
      group: [mother.birth_date, birth.facility, birth.date]
    right:
      dataset: SIH-RD
      where: "\"patient.sex\" = 'F'"
      explode_days: [admission.start, admission.end, admission.day]
    passes:
      - name: mother's birth date, hospital, day inside the admission
        keys: [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility],
               [birth.date, admission.day]]
    control: {role: mother.birth_date, shift_days: 7}
    validate:
      - {name: obstetric diagnosis (ICD-10 chapter XV), sql: "r.\"admission.diagnosis\" LIKE 'O%'"}
      - {name: residence agrees, left: mother.residence, right: patient.residence}
    probabilistic:
      compare:
        - [mother.birth_date, patient.birth_date]
        - [birth.facility, admission.facility]
        - [birth.date, [admission.start, admission.end]]
        - [mother.residence, patient.residence, {given: admission.facility_municipality}]
      # Every block keeps the mother's birth date. A block of hospital + day in
      # the stay + residence pairs each birth with every woman in the ward that
      # day: harmless in RR, hundreds of millions of candidates nationally
      # (2026-09-30). A typo-variant block on the mother's birth date was measured
      # and left out: a one-digit typo earns ~5 bits against ~13 for equality, so
      # such pairs stay under the 1% threshold, and the extra candidates only
      # add runner-ups (RR 8,447 -> 8,444, AC 10,128 -> 9,969; ADR-0114).
      blocks:
        - [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility]]
        - [[mother.birth_date, patient.birth_date], [birth.date, [admission.start, admission.end]]]
      target_fdr: 0.01

  sim_maternal_deaths_to_admission:
    description: >
      Deaths from obstetric causes (ICD-10 chapter O) to the woman's SIH
      admission that ended in them. The reverse of sih_deaths_to_sim, restricted
      to maternal deaths, so a death outside hospital or without an SUS
      admission stays unlinked.
    left: {dataset: SIM-DO, where: "\"death.cause\" LIKE 'O%' AND \"deceased.sex\" = 'F'"}
    right: {dataset: SIH-RD, where: "\"patient.sex\" = 'F'"}
    passes:
      - name: birth date, death day, hospital
        keys: [[deceased.birth_date, patient.birth_date], [death.date, admission.end],
               [death.facility, admission.facility]]
      - name: birth date, death day
        keys: [[deceased.birth_date, patient.birth_date], [death.date, admission.end]]
    control: {role: deceased.birth_date, shift_days: 7}
    validate:
      - {name: admission ended in death, sql: "r.\"admission.death\" = '1'"}
      - {name: obstetric admission diagnosis, sql: "r.\"admission.diagnosis\" LIKE 'O%'"}
      - {name: residence agrees, left: deceased.residence, right: patient.residence}
    probabilistic:
      compare:
        - [deceased.birth_date, patient.birth_date]
        - [death.date, admission.end]
        - [death.facility, admission.facility]
        - [deceased.residence, patient.residence]
      blocks:
        - [[deceased.birth_date, patient.birth_date]]
        - [[death.date, admission.end], [death.facility, admission.facility]]
      target_fdr: 0.01

  sih_neonatal_admissions_to_sinasc:
    description: >
      Admissions of babies in their first 28 days (the patient is the baby) to
      their birth record: the baby's birth date and sex, the mother's residence,
      and usually the hospital of birth.
    left: {dataset: SIH-RD, where: "\"patient.age_years\" < 0.0767 AND \"admission.start\" - \"patient.birth_date\" <= 28"}
    right: {dataset: SINASC-DN}
    passes:
      - name: birth date, sex, hospital, residence
        keys: [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex],
               [admission.facility, birth.facility], [patient.residence, mother.residence]]
      - name: birth date, sex, residence
        keys: [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex],
               [patient.residence, mother.residence]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: perinatal diagnosis (ICD-10 chapter XVI), sql: "r.\"birth.place\" = 'hospital' AND l.\"admission.diagnosis\" LIKE 'P%'"}
      - {name: born in the admitting hospital, left: admission.facility, right: birth.facility}
    probabilistic:
      compare:
        - [patient.birth_date, baby.birth_date]
        - [patient.sex, baby.sex]
        - [admission.facility, birth.facility]
        - [patient.residence, mother.residence]
      # Every block keeps the baby's birth date. A block of hospital, residence
      # and sex alone paired every newborn admission with every birth at the
      # same maternity hospital (tens of millions of candidates in RR) and adds
      # no identifying evidence (2026-09-30).
      blocks:
        - [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex]]
        - [[patient.birth_date, baby.birth_date], [admission.facility, birth.facility]]
      target_fdr: 0.01

  ciha_deaths_to_sim:
    description: >
      Non-SUS admissions that ended in death (CIHA MORTE = 1, admissions only) to
      the death certificate: the private-sector twin of sih_deaths_to_sim, so
      together they cover deaths in every hospital that reports.
    left: {dataset: CIHA, where: "\"admission.death\" = '1' AND \"admission.modality\" = '02'"}
    right: {dataset: SIM-DO}
    passes:
      - name: birth date, sex, death day, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date], [admission.facility, death.facility]]
      - name: birth date, sex, death day
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: died in hospital, sql: "r.\"death.place\" = 'hospital'"}
      - {name: residence agrees, left: patient.residence, right: deceased.residence}
    probabilistic:
      compare:
        - [patient.birth_date, deceased.birth_date]
        - [patient.sex, deceased.sex]
        - [admission.end, death.date]
        - [admission.facility, death.facility]
        - [patient.residence, deceased.residence, {given: admission.facility_municipality, side: left}]
      blocks:
        - [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex]]
        - [[admission.end, death.date], [admission.facility, death.facility]]
      target_fdr: 0.01

  sinasc_births_to_ciha_delivery:
    description: >
      A birth to the mother's delivery admission in a non-SUS hospital (CIHA): the
      private-sector twin of sinasc_births_to_delivery_admission.
    left:
      dataset: SINASC-DN
      group: [mother.birth_date, birth.facility, birth.date]
    right:
      dataset: CIHA
      where: "\"patient.sex\" = 'F' AND \"admission.modality\" = '02'"
      explode_days: [admission.start, admission.end, admission.day]
    passes:
      - name: mother's birth date, hospital, day inside the admission
        keys: [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility],
               [birth.date, admission.day]]
    control: {role: mother.birth_date, shift_days: 7}
    validate:
      - {name: obstetric diagnosis (ICD-10 chapter XV), sql: "r.\"admission.diagnosis\" LIKE 'O%'"}
      - {name: residence agrees, left: mother.residence, right: patient.residence}
    probabilistic:
      compare:
        - [mother.birth_date, patient.birth_date]
        - [birth.facility, admission.facility]
        - [birth.date, [admission.start, admission.end]]
        - [mother.residence, patient.residence, {given: admission.facility_municipality}]
      blocks:
        - [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility]]
        - [[mother.birth_date, patient.birth_date], [birth.date, [admission.start, admission.end]]]
      target_fdr: 0.01
