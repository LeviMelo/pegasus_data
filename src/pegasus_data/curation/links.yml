# Link specs (ADR-0107, ADR-0110). Each links records of two datasets through
# roles (curation/roles.yml). A spec is data, reviewed like the curation:
#
#   left / right   dataset, and an optional SQL `where` over its roles (quoted
#                  names: "admission.death"); `group` makes one record per group
#                  (the live births of one delivery); `explode_days` turns an
#                  interval into one row per day [start role, end role, new role]
#   passes         strictest first; each key pairs a left role with a right role
#   control        the left role shifted for the negative control, and by how
#                  many days
#   person         [left person, right person]: the role prefix naming, on each
#                  side, the person both records are about (a delivery's mother
#                  is the admission's patient); entities.py merges links on it
#   validate       held-out checks on the linked pairs: two roles that should
#                  agree (optionally within `tolerance`), or an `sql` condition
#                  over l.*, r.*; `among` limits either kind to the pairs a
#                  condition over l.* and r.* selects (admissions that ended in death)
#   same_event     required: true when the two records are one event (a death
#                  in hospital: its admission and its certificate), false when
#                  they are two events of one person (a birth, then a death);
#                  counts of the two sides share events only when true
#   params         a spec run per the caller's codes (one topic's admissions or
#                  cases) instead of once per period: `codes: {side, role, any}`
#                  names the role of a side that the caller's ICD-10 codes filter
#                  by prefix, `any` the broader role (every diagnosis) the caller
#                  may choose. The codes join the side's filter and the run's
#                  file name (engine.bind); such a spec declares no `person`,
#                  being no national run for the persons merge
#   outcome        {origin, event}: a cohort's follow-up. `origin` a left date
#                  role (the clock's zero), `event` the right date role that
#                  happens to the person (a death), carried into the pairs
#   earliest       a left side's group is stood for by the record with the
#                  earliest value of this role (`latest`: the latest)
#
# The first three reproduce omnisus's deterministic study (EVALUATION
# 2026-09-30) so both projects can be checked against each other.

# verdict: the thresholds of a link's verdict, [highest chance rate %, lowest
# held-out validation agreement %]. A deliberate analytic choice fixed before
# any result (ADR-0107), so no result could move it; read by engine.judge().
verdict:
  viable: [5.0, 90.0]
  caution: [20.0, 75.0]

links:
  sih_deaths_to_sim:
    description: >
      Admissions that ended in death (SIH-RD MORTE = 1) to the death certificate.
      The shared event is the day: the discharge date is the death date.
    person: [patient, deceased]   # the same person on each side (linkage/entities.py)
    same_event: true   # one death, recorded by the admission that ended in it and by its certificate
    left: {dataset: SIH-RD, where: "\"admission.death\" = '1'"}
    right: {dataset: SIM-DO}
    passes:
      - name: birth date, sex, death day, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date], [admission.facility, death.facility]]
      - name: birth date, sex, death day, the hospital's municipality
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date], [admission.facility_municipality, death.municipality]]
      - name: birth date, sex, residence, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [patient.residence, deceased.residence], [admission.facility, death.facility]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: residence agrees, left: patient.residence, right: deceased.residence}
      - {name: died in hospital, sql: "r.\"death.place\" = 'hospital'"}
    probabilistic:
      compare:
        - [patient.birth_date, deceased.birth_date]
        - [patient.sex, deceased.sex]
        - [admission.end, death.date]
        - [admission.facility, death.facility]
        - [patient.residence, deceased.residence, {given: admission.facility_municipality, side: left}]
      blocks:
        - [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex]]
        - [[admission.end, death.date], [admission.facility, death.facility]]
        - [[admission.end, death.date], [patient.residence, deceased.residence], [patient.sex, deceased.sex]]
      target_fdr: 0.01

  sim_infant_deaths_to_sinasc:
    description: >
      Deaths before one year of life, to
      their birth record. Both files are organised by residence, so almost every
      such death should have a birth: the linked share approximates sensitivity.
    person: [deceased, baby]   # the same person on each side (linkage/entities.py)
    same_event: false   # a death and the birth before it: two events of one person
    sensitivity: left   # every infant death has its birth: the deaths' linked share is the link's sensitivity
    left:
      dataset: SIM-DO
      where: >
        "death.date" - "deceased.birth_date" < 365
    # A baby who died in January may have been born the December before: the
    # birth is in last year's file (ADR-0121; was a same-year filter).
    right: {dataset: SINASC-DN, pad_years: [1, 0]}
    passes:
      - name: birth date, sex, residence, weight
        keys: [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex],
               [deceased.residence, mother.residence], [death.birth_weight, birth.weight]]
      - name: birth date, sex, residence, mother's age
        keys: [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex],
               [deceased.residence, mother.residence], [death.maternal_age, mother.age]]
    control: {role: deceased.birth_date, shift_days: 7}
    validate:
      - {name: delivery type agrees, left: death.delivery, right: birth.delivery}
      - {name: plurality agrees, left: death.plurality, right: birth.plurality}
      - {name: gestational weeks within 2, left: death.gestation_weeks, right: birth.gestation_weeks, tolerance: 2}
    probabilistic:
      compare:
        - [deceased.birth_date, baby.birth_date]
        - [deceased.sex, baby.sex]
        - [deceased.residence, mother.residence]
        - [death.birth_weight, birth.weight]
        - [death.maternal_age, mother.age]
      # A birth date alone met ~7,000 births a day nationally (~200M candidates,
      # out of memory); none of them can be a clear best on the date alone, so
      # each date block keeps sex and one more field (ADR-0114, amended).
      blocks:
        - [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex], [deceased.residence, mother.residence]]
        - [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex], [death.birth_weight, birth.weight]]
        - [[deceased.birth_date, baby.birth_date], [deceased.sex, baby.sex], [death.maternal_age, mother.age]]
        - [[deceased.birth_date, baby.birth_date], [deceased.residence, mother.residence], [death.birth_weight, birth.weight]]
        - [[deceased.residence, mother.residence], [death.birth_weight, birth.weight]]
        - [[deceased.residence, mother.residence], [deceased.sex, baby.sex], [death.maternal_age, mother.age]]
      target_fdr: 0.01

  sim_women_deaths_to_sinasc_mothers:
    description: >
      Deaths of women aged 15-49 to the birth records on which they are the
      mother, the source of an adult reference for race (RACACORMAE, her own
      declaration). One birth record stands for each mother (her birth date and
      residence), the latest, so her race is the declaration closest to her
      death. A woman who never gave birth in the births' years has no partner:
      the linked share is the share of women who were mothers and kept their
      residence, a selected population (ADR-0149). Chance agreement of a birth
      date within a municipality grows with its number of mothers: the control
      is read per municipality size, not only overall (docs/evaluation/2026-10-05-race-bridge-adult.md).
    person: [deceased, mother]   # the same person on each side (linkage/entities.py)
    same_event: false   # a woman's death and her earlier births
    left:
      dataset: SIM-DO
      where: >
        "deceased.sex" = 'F' AND "deceased.age_years" BETWEEN 15 AND 49
    right:
      dataset: SINASC-DN
      # a woman's births before her death: four years before the death year and that year (the race bridge's
      # narrowest window, 2012-2016). Without it a year's run read only that year's births: 2010-2018 run on
      # 2026-10-09 by PegaSUS's person links were all not viable (one pass, 91 % chance agreement)
      pad_years: [4, 0]
      group: [mother.birth_date, mother.residence]
      latest: birth.date
    passes:
      - name: birth date, residence
        keys: [[deceased.birth_date, mother.birth_date], [deceased.residence, mother.residence]]
    control: {role: deceased.birth_date, shift_days: 7}
    validate:
      - {name: death on or after the latest birth, sql: "l.\"death.date\" >= r.\"birth.date\""}

  sinasc_births_to_delivery_admission:
    description: >
      A birth to the mother's delivery admission. In a delivery AIH the patient
      is the mother, and SINASC records her birth date; the birth day falls
      inside the admission. The live births of one mother, one day, one hospital
      are one delivery (twins link once).
    person: [mother, patient]   # the same person on each side (linkage/entities.py)
    same_event: true   # one delivery, recorded by the birth and by the admission it fell in
    left:
      dataset: SINASC-DN
      group: [mother.birth_date, birth.facility, birth.date]
    right:
      dataset: SIH-RD
      where: "\"patient.sex\" = 'F'"
      explode_days: [admission.start, admission.end, admission.day]
    passes:
      - name: mother's birth date, hospital, day inside the admission
        keys: [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility],
               [birth.date, admission.day]]
    control: {role: mother.birth_date, shift_days: 7}
    validate:
      - {name: obstetric diagnosis (ICD-10 chapter XV), sql: "r.\"admission.diagnosis\" LIKE 'O%'"}
      - {name: residence agrees, left: mother.residence, right: patient.residence}
    probabilistic:
      compare:
        - [mother.birth_date, patient.birth_date]
        - [birth.facility, admission.facility]
        - [birth.date, [admission.start, admission.end]]
        - [mother.residence, patient.residence, {given: admission.facility_municipality}]
      # Every block keeps the mother's birth date. A block of hospital + day in
      # the stay + residence pairs each birth with every woman in the ward that
      # day: harmless in RR, hundreds of millions of candidates nationally
      # (2026-09-30). A typo-variant block on the mother's birth date was measured
      # and left out: a one-digit typo earns ~5 bits against ~13 for equality, so
      # such pairs stay under the 1% threshold, and the extra candidates only
      # add runner-ups (RR 8,447 -> 8,444, AC 10,128 -> 9,969; ADR-0114).
      blocks:
        - [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility]]
        - [[mother.birth_date, patient.birth_date], [birth.date, [admission.start, admission.end]]]
      target_fdr: 0.01

  sim_maternal_deaths_to_admission:
    description: >
      Deaths from obstetric causes (ICD-10 chapter O) to the woman's SIH
      admission that ended in them. The reverse of sih_deaths_to_sim, restricted
      to maternal deaths, so a death outside hospital or without an SUS
      admission stays unlinked.
    person: [deceased, patient]   # the same person on each side (linkage/entities.py)
    same_event: true   # one death, recorded by its certificate and the admission that ended in it
    left: {dataset: SIM-DO, where: "\"death.cause\" LIKE 'O%' AND \"deceased.sex\" = 'F'"}
    right: {dataset: SIH-RD, where: "\"patient.sex\" = 'F'"}
    passes:
      - name: birth date, death day, hospital
        keys: [[deceased.birth_date, patient.birth_date], [death.date, admission.end],
               [death.facility, admission.facility]]
      - name: birth date, death day
        keys: [[deceased.birth_date, patient.birth_date], [death.date, admission.end]]
    control: {role: deceased.birth_date, shift_days: 7}
    validate:
      - {name: admission ended in death, sql: "r.\"admission.death\" = '1'"}
      - {name: obstetric admission diagnosis, sql: "r.\"admission.diagnosis\" LIKE 'O%'"}
      - {name: residence agrees, left: deceased.residence, right: patient.residence}
    probabilistic:
      compare:
        - [deceased.birth_date, patient.birth_date]
        - [death.date, admission.end]
        - [death.facility, admission.facility]
        - [deceased.residence, patient.residence]
      blocks:
        - [[deceased.birth_date, patient.birth_date]]
        - [[death.date, admission.end], [death.facility, admission.facility]]
      target_fdr: 0.01

  sih_neonatal_admissions_to_sinasc:
    description: >
      Admissions of babies in their first 28 days (the patient is the baby) to
      their birth record: the baby's birth date and sex, the mother's residence,
      and usually the hospital of birth.
    person: [patient, baby]   # the same person on each side (linkage/entities.py)
    same_event: false   # a birth and a later admission of the baby
    left: {dataset: SIH-RD, where: "\"patient.age_years\" < 0.0767 AND \"admission.start\" - \"patient.birth_date\" <= 28"}
    right: {dataset: SINASC-DN, pad_years: [1, 0]}   # born in late December, admitted in January (ADR-0121)
    passes:
      - name: birth date, sex, hospital, residence
        keys: [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex],
               [admission.facility, birth.facility], [patient.residence, mother.residence]]
      - name: birth date, sex, residence
        keys: [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex],
               [patient.residence, mother.residence]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: perinatal diagnosis (ICD-10 chapter XVI), sql: "r.\"birth.place\" = 'hospital' AND l.\"admission.diagnosis\" LIKE 'P%'"}
      - {name: born in the admitting hospital, left: admission.facility, right: birth.facility}
    probabilistic:
      compare:
        - [patient.birth_date, baby.birth_date]
        - [patient.sex, baby.sex]
        - [admission.facility, birth.facility]
        - [patient.residence, mother.residence]
        # ICD-10's P07 codes state the baby's weight or gestation (ADR-0117).
        - [admission.diagnoses, birth.weight, {kind: icd_birth_weight}]
        - [admission.diagnoses, birth.gestation_weeks, {kind: icd_gestation}]
        # The baby inherits its mother's delivery AIH (the stored delivery link):
        # a hospital issues the mother's and the newborn's AIHs close together
        # (13% within 100 against 3% for another mother there that day;
        # docs/plans/linkage-theory.md §3.3, 2026-10-03).
        - [admission.aih, mother.delivery_aih, {kind: number_distance}]
      inherit:
        right:
          - {via: sinasc_births_to_delivery_admission, role: admission.aih, as: mother.delivery_aih}
      # Every block keeps the baby's birth date. A block of hospital, residence
      # and sex alone paired every newborn admission with every birth at the
      # same maternity hospital (tens of millions of candidates in RR) and adds
      # no identifying evidence (2026-09-30).
      # Birth date and sex alone met ~3,500 births per admission nationally; a baby
      # born elsewhere is found through the residence (ADR-0114, amended).
      blocks:
        - [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex], [patient.residence, mother.residence]]
        - [[patient.birth_date, baby.birth_date], [admission.facility, birth.facility]]
      target_fdr: 0.01

  ciha_deaths_to_sim:
    description: >
      Non-SUS admissions that ended in death (CIHA MORTE = 1, admissions only) to
      the death certificate: the private-sector twin of sih_deaths_to_sim, so
      together they cover deaths in every hospital that reports.
    person: [patient, deceased]   # the same person on each side (linkage/entities.py)
    same_event: true   # one death, as sih_deaths_to_sim
    left: {dataset: CIHA, where: "\"admission.death\" = '1' AND \"admission.modality\" = '02'"}
    right: {dataset: SIM-DO}
    passes:
      - name: birth date, sex, death day, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date], [admission.facility, death.facility]]
      - name: birth date, sex, death day, the hospital's municipality
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [admission.end, death.date], [admission.facility_municipality, death.municipality]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: died in hospital, sql: "r.\"death.place\" = 'hospital'"}
      - {name: residence agrees, left: patient.residence, right: deceased.residence}
    probabilistic:
      compare:
        - [patient.birth_date, deceased.birth_date]
        - [patient.sex, deceased.sex]
        - [admission.end, death.date]
        - [admission.facility, death.facility]
        - [patient.residence, deceased.residence, {given: admission.facility_municipality, side: left}]
      blocks:
        - [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex]]
        - [[admission.end, death.date], [admission.facility, death.facility]]
      target_fdr: 0.01

  sinasc_births_to_ciha_delivery:
    description: >
      A birth to the mother's delivery admission in a non-SUS hospital (CIHA): the
      private-sector twin of sinasc_births_to_delivery_admission.
    person: [mother, patient]   # the same person on each side (linkage/entities.py)
    same_event: true   # one delivery, as sinasc_births_to_delivery_admission
    left:
      dataset: SINASC-DN
      group: [mother.birth_date, birth.facility, birth.date]
    right:
      dataset: CIHA
      where: "\"patient.sex\" = 'F' AND \"admission.modality\" = '02'"
      explode_days: [admission.start, admission.end, admission.day]
    passes:
      - name: mother's birth date, hospital, day inside the admission
        keys: [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility],
               [birth.date, admission.day]]
    control: {role: mother.birth_date, shift_days: 7}
    validate:
      - {name: obstetric diagnosis (ICD-10 chapter XV), sql: "r.\"admission.diagnosis\" LIKE 'O%'"}
      - {name: residence agrees, left: mother.residence, right: patient.residence}
    probabilistic:
      compare:
        - [mother.birth_date, patient.birth_date]
        - [birth.facility, admission.facility]
        - [birth.date, [admission.start, admission.end]]
        - [mother.residence, patient.residence, {given: admission.facility_municipality}]
      blocks:
        - [[mother.birth_date, patient.birth_date], [birth.facility, admission.facility]]
        - [[mother.birth_date, patient.birth_date], [birth.date, [admission.start, admission.end]]]
      target_fdr: 0.01

  sinan_dengue_deaths_to_sim:
    description: >
      Dengue notifications closed as death by dengue (SINAN EVOLUCAO = 2) to
      the death certificate. SINAN carries no birth date since the LGPD
      rewrite, so the shared event is the death day, with residence, sex and
      age. The certificate's own cause (dengue, A90-A97) is held out as the
      check.
    person: [case, deceased]
    same_event: false   # the notification counts the illness; the death is its outcome
    left: {dataset: SINAN-DENG, where: "\"case.outcome\" = '2'"}
    right: {dataset: SIM-DO}
    passes:
      - name: death day, residence, sex
        keys: [[case.death_date, death.date], [case.residence, deceased.residence], [case.sex, deceased.sex]]
    control: {role: case.death_date, shift_days: 7}
    validate:
      - {name: certificate cause is dengue, sql: "r.\"death.cause\" BETWEEN 'A90' AND 'A97Z'"}
      - {name: age within a year, sql: "abs(l.\"case.age_years\" - r.\"deceased.age_years\") <= 1.5"}
    probabilistic:
      compare:
        - [case.death_date, death.date]
        - [case.sex, deceased.sex]
        - [case.age_years, deceased.age_years, {kind: integer}]
        - [case.residence, deceased.residence]
        - [notification.facility, death.facility]
      blocks:
        - [[case.death_date, death.date], [case.residence, deceased.residence]]
        - [[case.death_date, death.date], [case.sex, deceased.sex]]
      target_fdr: 0.01

  # Toxoplasmosis (BACKLOG 6.2; docs/evaluation/2026-10-10-links-toxoplasmosis.md). SINAN has carried no birth date
  # since the LGPD rewrite: a child's birth date is rebuilt from the age in days and the date of first symptoms
  # (`patient.birth_date` of SINAN-TOXC, roles.yml), so only a notification aged in days (85.5% of TOXC 2019-2025) has a key.
  # TOXC's ID_AGRAVO is not a filter: the file is the congenital form, and its records carry P37.1, B58 and O98.6.
  sinan_toxc_to_sinasc:
    description: >
      Congenital toxoplasmosis notifications to the child's birth record. SINAN carries the child's sex, municipality
      of residence and (for an age in days) birth date, SINASC the same and the birth facility; neither side carries a
      name, the mother's birth date or the birth weight, so the key is the weakest of the spine's links and
      the negative control decides whether it identifies anyone.
    person: [patient, baby]
    same_event: false   # the notification counts an infection; the birth is the person's own event
    left: {dataset: SINAN-TOXC}
    right: {dataset: SINASC-DN, pad_years: [1, 0]}   # born in December, notified in January
    passes:
      - name: birth date, sex, residence, notifying unit is the birth facility
        keys: [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex],
               [patient.residence, mother.residence], [notification.facility, birth.facility]]
      - name: birth date, sex, residence
        keys: [[patient.birth_date, baby.birth_date], [patient.sex, baby.sex],
               [patient.residence, mother.residence]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: notified where the baby was born, left: notification.municipality, right: birth.municipality}
      - {name: notified within a year of birth, sql: "l.\"notification.date\" - r.\"birth.date\" BETWEEN 0 AND 365"}

  sinan_toxc_to_sih_admission:
    description: >
      Congenital toxoplasmosis notifications to the child's SIH admission with the disease (P37.1, or B58 under two
      years). One record stands for the admissions of a child (the latest), found by birth date, sex and residence;
      the pool is a few thousand admissions a year, so a key that cannot single out a birth among millions can single
      out an admission among them.
    person: [patient, patient]
    same_event: false   # a notified infection and a hospital stay for it: two records of one person
    left: {dataset: SINAN-TOXC}
    right:
      dataset: SIH-RD
      pad_years: [1, 1]   # born or notified at the turn of the year; readmitted the year after
      where: >
        "admission.diagnoses" LIKE '%P371%' OR ("admission.diagnoses" LIKE '%B58%' AND "patient.age_years" < 2)
      group: [patient.birth_date, patient.sex, patient.residence]
      latest: admission.end
    passes:
      - name: birth date, sex, residence
        keys: [[patient.birth_date, patient.birth_date], [patient.sex, patient.sex],
               [patient.residence, patient.residence]]
      - name: birth date, sex
        keys: [[patient.birth_date, patient.birth_date], [patient.sex, patient.sex]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: notified where the child was admitted, left: notification.municipality, right: admission.facility_municipality}
      - {name: notified within a year of the admission, sql: "abs(l.\"notification.date\" - r.\"admission.start\") <= 365"}

  sinan_toxc_to_sim:
    description: >
      Congenital toxoplasmosis notifications to the death certificate that names the disease (P37.1 the underlying
      or any line of the certificate, B58 underlying). SINAN's own death date (DT_OBITO, filled for under 1% of
      TOXC) is held out as the check where it exists.
    person: [patient, deceased]
    same_event: false   # a notified infection and the death certificate of the person
    left: {dataset: SINAN-TOXC}
    right:
      dataset: SIM-DO
      pad_years: [0, 1]
      where: >
        "death.cause" = 'P371' OR "death.causes" LIKE '%P371%' OR "death.cause" LIKE 'B58%'
    passes:
      - name: birth date, sex, residence
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [patient.residence, deceased.residence]]
      - name: birth date, sex
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: SINAN death date is the certificate's, left: case.death_date, right: death.date}
      - {name: died after the first symptoms, sql: "r.\"death.date\" >= l.\"case.onset\""}

  sih_toxoplasmosis_admissions_to_sim:
    description: >
      Admissions with congenital toxoplasmosis (P37.1, or B58 under two years) to the death certificate that names the
      disease, whether or not the admission ended in death: a child discharged and dead later, or dead in another
      hospital, is reached, which sih_deaths_to_sim (admissions that ended in death) cannot. One record stands
      for a child's admissions (the latest).
    person: [patient, deceased]
    same_event: false   # an admission and the person's death, possibly weeks later
    left:
      dataset: SIH-RD
      where: >
        "admission.diagnoses" LIKE '%P371%' OR ("admission.diagnoses" LIKE '%B58%' AND "patient.age_years" < 2)
      group: [patient.birth_date, patient.sex, patient.residence]
      latest: admission.end
    right:
      dataset: SIM-DO
      pad_years: [0, 1]
      where: >
        "death.cause" = 'P371' OR "death.causes" LIKE '%P371%' OR "death.cause" LIKE 'B58%'
    passes:
      - name: birth date, sex, residence
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [patient.residence, deceased.residence]]
      - name: birth date, sex
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      - {name: death on or after the admission, sql: "r.\"death.date\" >= l.\"admission.start\""}
      - {name: admission ended in death, sql: "l.\"admission.death\" = '1'"}

  sinan_toxg_to_sinasc:
    description: >
      Gestational toxoplasmosis notifications to the mother's birth record. SINAN carries the woman's birth year,
      age and residence; SINASC her full birth date, age and residence, and the delivery is dated: a key of
      birth year and municipality is shared by hundreds of mothers in any city, and the delivery
      window (the nine months after the first symptoms) is not an equality key the deterministic passes can use,
      so this link is declared to be measured, and is expected not to be viable outside small municipalities.
    person: [patient, mother]
    same_event: false   # a notified infection in pregnancy and the delivery
    left: {dataset: SINAN-TOXG}
    right: {dataset: SINASC-DN, pad_years: [0, 1]}
    passes:
      - name: birth year, residence
        keys: [[patient.birth_year, mother.birth_year], [patient.residence, mother.residence]]
    control: {role: patient.birth_year, shift_days: 1}   # an integer role shifts by that many units: one year
    validate:
      - {name: delivery within ten months of the first symptoms, sql: "r.\"birth.date\" - l.\"case.onset\" BETWEEN -30 AND 300"}
      - {name: age within a year, left: patient.age_years, right: mother.age, tolerance: 1.5}

  # A cohort's follow-up (docs/evaluation/2026-10-14-admission-death-link.md). The admissions of one topic (the caller's
  # ICD-10 codes) to the death certificate of ANY cause: the 30-day and 1-year mortality of a hospital cohort needs the
  # deaths of those discharged alive, which sih_deaths_to_sim (MORTE = 1) cannot reach. Declared once, run per
  # (codes, period, area): `link("sih_admissions_to_sim", period=("2018", "2022"), geography="AL", codes=["I21", "I22"])`.
  #
  # The key is a person's birth date, sex and residence, and the day of death inside the follow-up window: without the
  # window a namesake who died in any of the six years pairs, and the control found 40% of the pairs by chance (Alagoas
  # I21-I22); inside the first year 16%, the first 30 days 2.1%. One run reports its false-match rate and verdict at each
  # horizon (`horizons` of the report), as the false-match rate is the window's. The SIH's race is not a key: 60% of
  # Alagoas's admissions have none and the rest are nearly all "parda".
  sih_admissions_to_sim:
    description: >
      Admissions with the caller's diagnoses (params.codes: ICD-10 prefixes on the principal diagnosis, or on every
      diagnosis) to the death certificate of any cause that falls within a year of the admission, whether or not the
      admission ended in death: a person discharged and dead a week or months later, or dead in another hospital, is
      reached, which sih_deaths_to_sim (admissions that ended in death) cannot. One record stands for each person, the
      first admission of the period, the origin of a 30-day and 1-year follow-up; a person is a birth date, sex and
      residence.
    same_event: false   # an admission and the person's death, possibly months later
    params:
      codes: {side: left, role: admission.diagnosis, any: admission.diagnoses}
    outcome: {origin: admission.start, event: death.date}
    left:
      dataset: SIH-RD
      group: [patient.birth_date, patient.sex, patient.residence]
      earliest: admission.start
      explode_days: [admission.start, 365, follow_up.day]   # one row per day of the year after the admission
    right: {dataset: SIM-DO, pad_years: [0, 1]}   # a year of deaths after the last admission year: the 1-year follow-up
    passes:
      - name: birth date, sex, residence, day of death in the year after the admission
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [patient.residence, deceased.residence], [follow_up.day, death.date]]
      # what the first pass leaves of the admissions that ended in death: a residence the two files write differently, or
      # a namesake who died in the same year (the window cannot tell them apart, the day and the hospital can: the
      # pass of sih_deaths_to_sim). Without the hospital the control found 233 of its 288 pairs by chance
      - name: birth date, sex, death on the discharge day, hospital
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex], [admission.end, death.date],
               [admission.facility, death.facility]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      # held out: the certificate of an in-hospital death says so, in the hospital's municipality and CNES
      - name: admissions that ended in death have a certificate of a death in hospital
        among: "l.\"admission.death\" = '1'"
        sql: "r.\"death.place\" = 'hospital'"
      - name: admissions that ended in death have a certificate of a death in the hospital's municipality
        among: "l.\"admission.death\" = '1'"
        sql: "r.\"death.municipality\" = l.\"admission.facility_municipality\""
      # these read the day of death, a key: they cannot decide the verdict, and say whether the window and the dates agree
      - name: admissions that ended in death have the certificate's death on the discharge day
        among: "l.\"admission.death\" = '1'"
        sql: "r.\"death.date\" = l.\"admission.end\""
      - {name: death on or after the admission, sql: "r.\"death.date\" >= l.\"admission.start\""}

  # The same mechanism on a notification system: the cases of the caller's agravo codes (TOXC's ID_AGRAVO holds P371, B58
  # and O986) to the death certificate of any cause within a year of the notification, so that a case's survival does
  # not depend on SINAN closing it as a death (EVOLUCAO is blank or ignored for 55% of the 20,968 TOXC of 2019-2023).
  # Declared to be measured, and measured not viable (2019-2022, P371: 723 pairs, 680 of them in the control): a cohort
  # that rarely dies (0.3% of these children) is outnumbered by the infants born the same day in the same city who did,
  # so a key of birth date, sex and residence cannot tell them apart (docs/evaluation/2026-10-14-admission-death-link.md).
  sinan_toxc_cases_to_sim:
    description: >
      Congenital toxoplasmosis notifications of the caller's agravo codes (params.codes on ID_AGRAVO) to the child's
      death certificate of any cause within a year of the notification, whether or not SINAN closed the case as a
      death. One record stands for each child, the first notification (a child is a birth date, sex and residence); a
      notification aged in months or years has no birth date and is not linked.
    same_event: false   # a notification and the person's death
    params:
      codes: {side: left, role: case.disease}
    outcome: {origin: notification.date, event: death.date}
    left:
      dataset: SINAN-TOXC
      group: [patient.birth_date, patient.sex, patient.residence]
      earliest: notification.date
      explode_days: [notification.date, 365, follow_up.day]
    right: {dataset: SIM-DO, pad_years: [0, 1]}
    passes:
      - name: birth date, sex, residence, day of death in the year after the notification
        keys: [[patient.birth_date, deceased.birth_date], [patient.sex, deceased.sex],
               [patient.residence, deceased.residence], [follow_up.day, death.date]]
    control: {role: patient.birth_date, shift_days: 7}
    validate:
      # held out: a case SINAN closed as a death by the agravo has a certificate that names it
      - name: cases closed as a death by the agravo have a certificate that names it
        among: "l.\"case.outcome\" = '2'"
        sql: "r.\"death.cause\" = 'P371' OR r.\"death.causes\" LIKE '%P371%' OR r.\"death.cause\" LIKE 'B58%'"
      # these read the day of death, a key
      - name: SINAN's death date is the certificate's
        among: "l.\"case.death_date\" IS NOT NULL"
        sql: "r.\"death.date\" = l.\"case.death_date\""
