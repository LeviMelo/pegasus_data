      has two rows. Figure 3 lists 1,633 codes that no Figure 4 package does, which have neither: the nature-of-injury codes
      S00-T98 (1,459; the appendix maps them apart, Figure 12 "N-code ICD mappings"), the mycoses B37-B49, B55, B58-B59
      and A31, A42-A44, D80-D84, D89.8-D89.9, C46, and single codes among them I50.0 and I50.1 (heart failure), N17.0-N17.9
      (acute kidney failure), I70.1, I70.9, K75.0 and Y25.3. A Figure 4 range that names a three-character code Figure 3
      does not list (C22 in "C2, C22, C22.9", the parent of a listed subcode) names no member. Figure 3 and the GBD 2017
      list differ in 86 of about 5,900 codes: B34.2 (coronavirus infection, site unspecified), which GBD 2017 holds at level
      2, is not in the GBD 2019 list.
