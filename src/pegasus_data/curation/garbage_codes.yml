# Garbage codes: the ICD-10 codes of underlying cause of death that say little about what the person died of (ill-defined
# R00-R99, heart failure, septicaemia, unspecified stroke, ...), classified by how far the true cause could lie from the
# code: the Global Burden of Disease's four levels, the classification Brazilian and global burden studies use. Read through
# `pegasus_data.garbage_codes()`; what it is and the two editions' differences are in DATA_SOURCES.md.
#
# Every list below is TRANSCRIBED from a published table, never typed from memory, and keeps its source's spelling (typos
# included: "ID5.9", "TO7.", "E998", "Z17-unsp."). An edition is a published list, so a code ICD-10 created after the list
# was published is not in it, whatever a range spells (U07.1, COVID-19, 2020-01, lies inside GBD 2017's "U07-U81").
#
# `reading`: how an endpoint is read, found by reproducing a published count (docs/evaluation/2026-10-14-garbage-codes.md).
# `ranges`: comma-separated codes and ranges as printed.
#
# Sources, both open access; the file's own licence record (Springer Nature's Figshare) reads "CC BY + CC0", CC BY 4.0:
#   GBD2017  França E, Ishitani L, Teixeira R, Duncan BB, Marinho F, Naghavi M. Changes in the quality of cause-of-death
#            statistics in Brazil: garbage codes among registered deaths in 1996-2016. Popul Health Metr 2020;18(Suppl 1):20.
#            doi:10.1186/s12963-020-00221-4. Supplementary file 1 (12963_2020_221_MOESM1_ESM.docx, doi:10.6084/m9.figshare.13023345.v1) transcribes the GBD 2017
#            Causes of Death Collaborators' Supplementary appendix 1 (Lancet 2018;392:1736-88).
#   GBD2019  Johnson SC, Cunningham M, Dippenaar IN, et al. Public health utility of cause of death data: applying empirical
#            algorithms to improve data quality. BMC Med Inform Decis Mak 2021;21:175. doi:10.1186/s12911-021-01501-1.
#            Supplemental Appendix (12911_2021_1501_MOESM1_ESM.pdf, doi:10.6084/m9.figshare.14721984.v1): Figure 3 (the cause "Garbage Code": every ICD-10 code the
#            GBD 2019 treats as one) and Figure 4 (ICD-10 codes by garbage package and class, pp. 35-37).

reading: >-
  A range lists every ICD-10 code between its two endpoints in ICD-10's own order, written with the point: a three-character
  code comes before its subcodes (A00, A00.0, A00.9, A01). A range closes at its last endpoint, so "A40-A44.9" holds A40
  and every subcode of A44, and "R58.0-R78" stops at R78 itself, without R78.0-R78.9. A code written alone is that code
  only ("A01" is the three-character code, not A01.0-A01.4). An endpoint is a position in the order, as printed: one that
  is not an ICD-10 code ("ID5.9", "ZB0", "unsp.") closes the range where it falls. The printed two-character blocks ("C1",
  "D0") name no code.
levels:
  1: >-
    the true cause could be in any of the three broad GBD groups (communicable, maternal, neonatal and nutritional; non-communicable;
    injuries)
  2: the true cause is in one of those groups but could be any of its level-2 causes
  3: the true cause could be any of the level-3 causes of its level-2 cause
  4: the true cause could be any of the level-4 causes of its level-3 cause
