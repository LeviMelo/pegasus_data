system: SINAN
asserted_by: pegasus_data
variables:
  NAUSEAS:
    official_name: Náuseas
    translated_name: Nausea
    description: >
      Whether the patient reported nausea (1=Sim, 2=Não, 9=Ignorado), one
      item on the typhoid-fever sign/symptom checklist alongside fever,
      headache and rose-colored spots on the trunk; the same field name is
      carried by the pre-2007 dengue form.
    code_system: none
    source: layout_doc
    source_ref: Febre_Tifoide_v5.pdf, ficha de investigação, campo 37 (Sinais e Sintomas)
  S1_IGM:
    official_name: Resultado sorologia IgM - 1ª amostra
    translated_name: IgM result, first sample
    description: >
      IgM antibody result from the first blood sample drawn during a
      suspected measles/rubella investigation (also carried by the pre-2007
      dengue form): a reagent result signals recent infection, since IgM
      appears early.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 1)
  S1_IGG:
    official_name: Resultado sorologia IgG - 1ª amostra
    translated_name: IgG result, first sample
    description: >
      IgG antibody result from the same first sample; on this early sample
      IgG mostly reflects past exposure or vaccination rather than the
      current acute infection being investigated.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 1)
  S2_IGM:
    official_name: Resultado sorologia IgM - 2ª amostra
    translated_name: IgM result, second sample
    description: >
      IgM result from the second, convalescent sample, drawn later than S1
      to catch a case whose first sample tested falsely negative or
      inconclusive for the antibody.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 2)
  S2_IGG:
    official_name: Resultado sorologia IgG - 2ª amostra
    translated_name: IgG result, second sample
    description: >
      IgG result from the second sample; comparing it against the first
      sample's IgG shows a rising titer, the classic laboratory sign of a
      recent measles or rubella infection.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 2)
  ABDOMINAL:
    official_name: Dor Abdominal
    translated_name: Abdominal pain
    description: >
      Whether the patient reported abdominal pain (1=Sim, 2=Não, 9=Ignorado),
      one item on the spotted fever (Febre Maculosa) sign/symptom checklist
      alongside fever, headache and myalgia; the same field name is reused
      on the pre-2007 dengue form.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Maculosa_v5.pdf, campo 33 (Sinais e Sintomas)
  ACIDO_PEPT:
    official_name: Doença ácido-péptica
    translated_name: Pre-existing peptic acid disease
    description: >
      Whether the patient has a pre-existing peptic acid disease such as a
      gastric or duodenal ulcer, recorded as a comorbidity on the
      dengue/chikungunya form because it raises bleeding risk as dengue
      progresses.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 34 (Doenças pré-existentes)
  ALRM_ABDOM:
    official_name: Dor abdominal (sinal de alarme)
    translated_name: Abdominal pain warning sign
    description: >
      Whether the patient developed intense, continuous abdominal pain, one
      of the dengue warning signs that flags progression toward severe
      dengue and prompts closer monitoring or hospitalization.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_HEMAT:
    official_name: Aumento do hematócrito
    translated_name: Rising hematocrit
    description: >
      Whether the patient's hematocrit rose, a dengue warning sign of plasma
      leaking from blood vessels as the disease worsens; a rising hematocrit
      with falling platelets signals impending severe dengue.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_HEPAT:
    official_name: Hepatomegalia
    translated_name: Enlarged liver warning sign
    description: >
      Whether the patient's liver was found enlarged on physical exam, one
      of the dengue warning signs recorded when the case is being classified
      as dengue with warning signs or severe dengue.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_HIPOT:
    official_name: Hipotensão postural/lipotimia
    translated_name: Postural hypotension warning sign
    description: >
      Whether the patient had postural hypotension or a fainting spell, a
      dengue warning sign reflecting early circulatory compromise from
      plasma leakage, before frank shock sets in.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_LETAR:
    official_name: Letargia ou irritabilidade
    translated_name: Lethargy or irritability warning sign
    description: >
      Whether the patient showed lethargy or irritability, a dengue warning
      sign of reduced perfusion or early neurological involvement that
      prompts closer clinical monitoring.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_LIQ:
    official_name: Acúmulo de líquidos
    translated_name: Fluid accumulation warning sign
    description: >
      Whether fluid accumulated clinically, such as ascites or a
      pleural/pericardial effusion, a dengue warning sign of vascular
      leakage that can progress to respiratory or circulatory compromise.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_PLAQ:
    official_name: Queda abrupta de plaquetas
    translated_name: Abrupt platelet drop warning sign
    description: >
      Whether the patient's platelets fell abruptly, a dengue warning sign
      reflecting the marrow suppression and consumption that typically
      precede bleeding complications.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_SANG:
    official_name: Sangramento de mucosa/outras hemorragias
    translated_name: Mucosal bleeding warning sign
    description: >
      Whether the patient bled from a mucosal surface or had another
      hemorrhage, a dengue warning sign distinct from the more severe
      bleeding recorded separately under the dengue-grave fields.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_VOM:
    official_name: Vômitos persistentes
    translated_name: Persistent vomiting warning sign
    description: >
      Whether the patient had persistent vomiting, a dengue warning sign
      that both signals disease progression and risks dehydration, worsening
      the plasma-leakage picture.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ARRITMIAS:
    official_name: Taquicardia persistente/Arritmias
    translated_name: Persistent tachycardia/arrhythmia
    description: >
      Whether the patient had persistent tachycardia or an arrhythmia, a
      cardiac sign of acute Chagas myocarditis recorded on the investigation
      form's sinais-e-sintomas checklist.
    code_system: internal
    source: layout_doc
    source_ref: Chagas_v5_instr.pdf, campo 41 (Sinais e Sintomas)
  ASSINTOMA:
    official_name: Assintomático
    translated_name: Asymptomatic
    description: >
      Marks a confirmed acute Chagas case as asymptomatic: none of the
      form's listed signs (fever, edema, chagoma, hepatomegaly, etc.) were
      present, so only this checkbox is marked "Sim".
    code_system: internal
    source: layout_doc
    source_ref: Chagas_v5_instr.pdf, campo 41 (Sinais e Sintomas)
  AUTO_IMUNE:
    official_name: Doenças auto-imunes
    translated_name: Pre-existing autoimmune disease
    description: >
      Whether the patient has a pre-existing autoimmune disease, recorded as
      a comorbidity on the dengue/chikungunya form alongside diabetes and
      hypertension because it can complicate dengue's clinical course.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 34 (Doenças pré-existentes)
  AVALIA_N:
    official_name: Avaliação do Grau de Incapacidade Física no Diagnóstico
    translated_name: Disability grade at diagnosis
    description: >
      Physical-disability grade assessed at leprosy diagnosis on the WHO
      0/I/II scale: grade zero is no damage, grade I is sensory loss only,
      grade II is visible deformity or injury; code 3 means not evaluated.
    code_system: external
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 37
  AVAL_ATU_N:
    official_name: Avaliação de incapacidade física no momento da cura
    translated_name: Disability grade at cure
    description: >
      The same WHO physical-disability grade reassessed at cure or
      treatment completion, letting the program measure whether disability
      worsened, stayed stable, or was prevented during multidrug therapy.
    code_system: external
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, tela de acompanhamento, campo 13
  BACILOSCOP:
    official_name: Baciloscopia
    translated_name: Skin-smear microscopy result
    description: >
      Result of the skin-smear microscopy for M. leprae bacilli at leprosy
      diagnosis: a positive smear classifies the case as multibacillary even
      when its clinical form looks paucibacillary.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 40 (Baciloscopia)
  BACO:
    official_name: Aumento do Baço
    translated_name: Enlarged spleen
    description: >
      Whether the patient's spleen was found enlarged on exam, one of the
      sign/symptom checkboxes on the visceral leishmaniasis (kala-azar)
      investigation form alongside fever, weakness and pallor.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas)
  CHAGOMA:
    official_name: Chagoma de inoculação/Sinal de Romaña
    translated_name: Inoculation chagoma/Romaña's sign
    description: >
      Whether the patient had an inoculation chagoma or Romaña's sign:
      localized swelling, often around one eye, marking the skin or mucosal
      site where the Chagas parasite entered the body.
    code_system: internal
    source: layout_doc
    source_ref: Chagas_v5_instr.pdf, campo 41 (Sinais e Sintomas)
