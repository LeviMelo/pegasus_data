# The last CNES columns: free-text names, and the SUS/non-SUS splits.
#
# Two things worth knowing about this handful. The C(60) name fields are the
# human-readable labels beside coded identifiers, and they are uncontrolled text
# — never group by them, group by the code and use the name only for display.
# And the AMB/HOSP SUS and non-SUS flags come in pairs that are NOT mutually
# exclusive: an establishment can serve both, so counting either alone
# undercounts and adding them double-counts the establishments that do both.
system: CNES
asserted_by: pegasus_data

variables:

  NOME_EQP:
    official_name: Nome da equipe
    translated_name: Team name
    description: >
      The team's name as typed locally. Display text beside IDEQUIPE, which is
      the identifier to group by; the same team is spelt several ways across
      competências.
    code_system: none
    source: inferred
    reasoning: C(60) free text paired with the coded team identifier.

  NOMEAREA:
    official_name: Nome da área
    translated_name: Coverage area name
    description: >
      The coverage area's name as typed locally, beside the coded ID_AREA. Same
      caution as NOME_EQP: it is a label, not a key.
    code_system: none
    source: inferred
    reasoning: C(60) free text paired with the coded area identifier.

  DESCSEGM:
    official_name: Descrição do segmento
    translated_name: Segment description
    description: >
      The territorial segment's description, beside the coded ID_SEGM. Free text
      describing a neighbourhood or locality.
    code_system: none
    source: inferred
    reasoning: C(60) free text paired with the coded segment identifier.

  CODEQUIP:
    official_name: Código do equipamento
    translated_name: Equipment code
    description: >
      A shorter equipment code carried beside TIPEQUIP. Where the two disagree
      TIPEQUIP is the one bound to the equipment codelist.
    code_system: none
    source: inferred
    reasoning: C(2) code in the equipment record, narrower than TIPEQUIP.

  QT_CONTR:
    official_name: Quantidade de leitos contratados
    translated_name: Contracted beds
    description: >
      Beds the establishment has contracted to SUS. A contractual figure rather
      than a physical one, so it can differ from QT_SUS, which is what is
      actually made available.
    code_system: none
    source: inferred
    reasoning: N(4) tally in the bed record; CONTR reads contratado.

  AMB_SUS:
    official_name: Atendimento ambulatorial SUS
    translated_name: Outpatient care for SUS
    description: >
      Whether the service treats SUS outpatients. Pairs with AMB_NSUS, and the
      two are not exclusive — most establishments do both.
    code_system: none
    source: inferred
    reasoning: A yes/no flag; the SUS half of the ambulatorial pair.

  HOSP_SUS:
    official_name: Atendimento hospitalar SUS
    translated_name: Hospital care for SUS
    description: >
      Whether the service admits SUS patients. The hospital counterpart of
      AMB_SUS, and the flag that identifies which establishments SIH activity
      can come from.
    code_system: none
    source: inferred
    reasoning: A yes/no flag; the SUS half of the hospitalar pair.

  HOSP_NSUS:
    official_name: Atendimento hospitalar não SUS
    translated_name: Hospital care outside SUS
    description: >
      Whether the service admits non-SUS patients. Set together with HOSP_SUS
      for the mixed hospitals that are most of Brazilian capacity.
    code_system: none
    source: inferred
    reasoning: A yes/no flag; the non-SUS half of the hospitalar pair.

  CNESTERC:
    official_name: CNES do terceiro
    translated_name: Contracted provider CNES
    description: >
      The CNES code of the third party providing a contracted-out service. What
      makes it possible to follow a service to the establishment that actually
      performs it rather than the one that reports it.
    code_system: none
    source: inferred
    reasoning: C(7) CNES establishment code; TERC reads terceirizado.

  UFMUNRES:
    official_name: UF e município de residência do profissional
    translated_name: Professional's state and municipality of residence
    description: >
      Where the professional lives, state and municipality packed into one
      field. Against the establishment's municipality it shows commuting, which
      is how staffing shortages in small municipalities become visible.
    code_system: none
    source: inferred
    reasoning: >
      C(8) carrying a two-digit UF followed by a six-digit IBGE municipality
      code; UFMUNRES reads UF e município de residência.
