# SISCAN — SISCAN_MAMOGRAFIA, 2013-2018 yearly extracts, continued from
# siscan_fill_04.yml: eight further named mammography findings, each as a
# per-breast (MD=mama direita/ME=mama esquerda) count pair. All declared
# C(0,0) — CSV opendatasus extracts, not fixed-width DBFs.
system: SISCAN
asserted_by: pegasus_data

variables:

  NU_CALC_TIPICA_BENIG_MD:
    official_name: Calcificação tipicamente benigna, mama direita
    translated_name: Count of typically-benign calcifications, right breast
    description: >
      Count of right-breast findings classified as "calcificações
      tipicamente benignas" — the standard BI-RADS lexicon category for
      calcifications that need no further work-up.
    code_system: none
    source: inferred
    reasoning: CALC_TIPICA_BENIG abbreviates calcificação tipicamente benigna; MD is mama direita.

  NU_CALC_TIPICA_BENIG_ME:
    official_name: Calcificação tipicamente benigna, mama esquerda
    translated_name: Count of typically-benign calcifications, left breast
    description: The left-breast counterpart of NU_CALC_TIPICA_BENIG_MD.
    code_system: none
    source: inferred
    reasoning: Same CALC_TIPICA_BENIG stem; ME is mama esquerda.

  NU_CALC_VASCULARES_MD:
    official_name: Calcificações vasculares, mama direita
    translated_name: Count of vascular calcifications, right breast
    description: >
      Count of right-breast findings of vascular calcification — calcified
      vessel walls, a classic benign calcification type distinct from the
      typically-benign category above.
    code_system: none
    source: inferred
    reasoning: CALC_VASCULARES is calcificações vasculares, unabbreviated; MD is mama direita.

  NU_CALC_VASCULARES_ME:
    official_name: Calcificações vasculares, mama esquerda
    translated_name: Count of vascular calcifications, left breast
    description: The left-breast counterpart of NU_CALC_VASCULARES_MD.
    code_system: none
    source: inferred
    reasoning: Same CALC_VASCULARES stem; ME is mama esquerda.

  NU_CISTO_OLEOSO_MD:
    official_name: Cisto oleoso, mama direita
    translated_name: Count of oil cysts, right breast
    description: Count of right-breast findings of oil cyst (cisto oleoso) — a benign fat-necrosis finding, often post-traumatic or post-surgical.
    code_system: none
    source: inferred
    reasoning: CISTO_OLEOSO is cisto oleoso, unabbreviated; MD is mama direita.

  NU_CISTO_OLEOSO_ME:
    official_name: Cisto oleoso, mama esquerda
    translated_name: Count of oil cysts, left breast
    description: The left-breast counterpart of NU_CISTO_OLEOSO_MD.
    code_system: none
    source: inferred
    reasoning: Same CISTO_OLEOSO stem; ME is mama esquerda.

  NU_ECTASIA_DUCTAL_MD:
    official_name: Ectasia ductal, mama direita
    translated_name: Count of duct ectasia findings, right breast
    description: Count of right-breast findings of duct ectasia (ectasia ductal) — benign dilation of the milk ducts.
    code_system: none
    source: inferred
    reasoning: ECTASIA_DUCTAL is ectasia ductal, unabbreviated; MD is mama direita.

  NU_ECTASIA_DUCTAL_ME:
    official_name: Ectasia ductal, mama esquerda
    translated_name: Count of duct ectasia findings, left breast
    description: The left-breast counterpart of NU_ECTASIA_DUCTAL_MD.
    code_system: none
    source: inferred
    reasoning: Same ECTASIA_DUCTAL stem; ME is mama esquerda.

  NU_GINECOMASTIA_MD:
    official_name: Ginecomastia, mama direita
    translated_name: Count of gynecomastia findings, right breast
    description: >
      Count of right-breast findings of gynecomastia — benign glandular
      enlargement, relevant because SISCAN mammography also covers male
      patients.
    code_system: none
    source: inferred
    reasoning: GINECOMASTIA is unabbreviated; MD is mama direita.

  NU_GINECOMASTIA_ME:
    official_name: Ginecomastia, mama esquerda
    translated_name: Count of gynecomastia findings, left breast
    description: The left-breast counterpart of NU_GINECOMASTIA_MD.
    code_system: none
    source: inferred
    reasoning: Same GINECOMASTIA stem; ME is mama esquerda.

  NU_LINFON_INTRAMAM_MD:
    official_name: Linfonodo intramamário, mama direita
    translated_name: Count of intramammary lymph node findings, right breast
    description: >
      Count of right-breast findings of an intramammary lymph node — a
      normal structure that can mimic a nodule and is recorded to explain a
      benign round opacity.
    code_system: none
    source: inferred
    reasoning: LINFON_INTRAMAM abbreviates linfonodo intramamário; MD is mama direita.

  NU_LINFON_INTRAMAM_ME:
    official_name: Linfonodo intramamário, mama esquerda
    translated_name: Count of intramammary lymph node findings, left breast
    description: The left-breast counterpart of NU_LINFON_INTRAMAM_MD.
    code_system: none
    source: inferred
    reasoning: Same LINFON_INTRAMAM stem; ME is mama esquerda.

  NU_IMPLANT_SEM_SIN_RUPTU_MD:
    official_name: Implante sem sinais de ruptura, mama direita
    translated_name: Count of intact-implant findings, right breast
    description: >
      Count of right-breast mammograms reporting a breast implant with no
      signs of rupture — paired with NU_IMP_COM_SIN_RUPTU_MD for the
      ruptured case.
    code_system: none
    source: inferred
    reasoning: IMPLANT_SEM_SIN_RUPTU abbreviates implante sem sinais de ruptura; MD is mama direita.

  NU_IMPLANT_SEM_SIN_RUPTU_ME:
    official_name: Implante sem sinais de ruptura, mama esquerda
    translated_name: Count of intact-implant findings, left breast
    description: The left-breast counterpart of NU_IMPLANT_SEM_SIN_RUPTU_MD.
    code_system: none
    source: inferred
    reasoning: Same IMPLANT_SEM_SIN_RUPTU stem; ME is mama esquerda.

  NU_IMP_COM_SIN_RUPTU_MD:
    official_name: Implante com sinais de ruptura, mama direita
    translated_name: Count of ruptured-implant findings, right breast
    description: >
      Count of right-breast mammograms reporting a breast implant with
      signs of rupture — the counterpart of NU_IMPLANT_SEM_SIN_RUPTU_MD.
    code_system: none
    source: inferred
    reasoning: IMP_COM_SIN_RUPTU abbreviates implante com sinais de ruptura; MD is mama direita.

  NU_IMP_COM_SIN_RUPTU_ME:
    official_name: Implante com sinais de ruptura, mama esquerda
    translated_name: Count of ruptured-implant findings, left breast
    description: The left-breast counterpart of NU_IMP_COM_SIN_RUPTU_MD.
    code_system: none
    source: inferred
    reasoning: Same IMP_COM_SIN_RUPTU stem; ME is mama esquerda.
