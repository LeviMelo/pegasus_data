system: SINAN
asserted_by: pegasus_data

variables:

  # --- LEPT (leptospirose): exposure and confirmatory lab work ---

  CON_ANIMAI:
    official_name: Contato com animais
    translated_name: Contact with animals (exposure flag)
    description: >
      Whether the patient had contact with animals (rats, dogs, cattle,
      etc.) before symptom onset — an exposure question distinct from
      CON_ENCHEN, the flood-water contact question, on the leptospirosis
      antecedents checklist.
    code_system: none
    source: inferred
    reasoning: C1 flag; CON_=contato per prefix convention, ANIMAI=animais.

  CON_ENCHEN:
    official_name: Contato com enchente
    translated_name: Contact with flood water (exposure flag)
    description: >
      Whether the patient had contact with flood water before symptom
      onset — the single most common leptospirosis exposure route in
      Brazil, recorded separately from general animal contact (CON_ANIMAI).
    code_system: none
    source: inferred
    reasoning: C1 flag; ENCHEN=enchente (flood).

  LAB_CREATI:
    official_name: Creatinina
    translated_name: Creatinine test result
    description: >
      Creatinine level or reading recorded for the case — the key
      renal-function marker used to flag severe leptospirosis (Weil's
      disease), distinct from the paired-serology fields LAB_R_1/LAB_S_2.
    code_system: none
    source: inferred
    reasoning: C3 field; LAB_=lab prefix, CREATI=creatinina.

  LAB_MET_D:
    official_name: Outro método laboratorial - descrição
    translated_name: Other lab test method, description
    description: >
      Free-text name of an additional or alternative laboratory method
      used to confirm leptospirosis beyond the standard paired-serology
      titers (e.g. PCR, culture).
    code_system: none
    source: inferred
    reasoning: C20 text; LAB_=lab prefix, MET=método, D=descrição.

  LAB_R_1:
    official_name: Resultado da 1ª amostra
    translated_name: First serology sample result/titer
    description: >
      Result (e.g. MAT titer) of the first blood sample tested for
      leptospirosis antibodies — paired with LAB_S_2, the second sample, to
      show the diagnostic four-fold rise between acute and convalescent
      titers.
    code_system: none
    source: inferred
    reasoning: C6 fits a titer string (e.g. "1:200"); R_1 read as resultado/amostra 1, paired with LAB_S_2.

  LAB_S_2:
    official_name: Resultado da 2ª amostra
    translated_name: Second (convalescent) serology sample result/titer
    description: >
      Result of the second, later blood sample tested for leptospirosis
      antibodies — compared against LAB_R_1 (first sample) to confirm
      diagnosis via a rising titer.
    code_system: none
    source: inferred
    reasoning: C6, same shape as LAB_R_1; S_2 read as segunda amostra.

  LAB_UF:
    official_name: UF do laboratório
    translated_name: State (UF) where the lab test was performed
    description: >
      Two-letter state abbreviation of the laboratory that ran the
      leptospirosis confirmatory test, not necessarily the patient's home
      state.
    code_system: none
    source: inferred
    reasoning: C2 fits a UF abbreviation; LAB_=lab prefix, UF is the standard state-code field name across DATASUS systems.

  # --- shared HANT/LEPT: occupational exposure ---

  ANT_OCUPAC:
    official_name: Antecedente ocupacional
    translated_name: Occupational exposure antecedent
    description: >
      Coded occupational exposure preceding illness (e.g. farming,
      sewer/sanitation work, animal handling) — relevant to both
      hantavirose and leptospirosis, whose main risk factor is job-related
      environmental contact.
    code_system: none
    source: inferred
    reasoning: >
      C5 coded field; ANT_=antecedente, OCUPAC=ocupacional; the agravo
      grouping places it in both the HANT and LEPT strata rather than one
      exclusively.

  # --- LTAN (leishmaniose tegumentar americana): lesion, origin, entomology ---

  CLI_CUT_DI:
    official_name: Lesão cutânea - descrição
    translated_name: Cutaneous lesion, clinical description
    description: >
      Coded or short free-text description of the skin lesion's clinical
      appearance (e.g. ulcer type) recorded on exam — supports the
      clinical diagnostic criterion for cutaneous leishmaniasis, apart from
      the entomological ENTO_* findings.
    code_system: none
    source: inferred
    reasoning: C11; CLI_=clínico, CUT=cutâneo; width fits a short descriptive code rather than a full sentence.

  CON_PAIS:
    official_name: País de contágio
    translated_name: Country of probable infection
    description: >
      Country where the patient most likely acquired cutaneous
      leishmaniasis, used to flag imported cases — the international
      counterpart to CON_UF (Brazilian state of contágio).
    code_system: none
    source: inferred
    reasoning: C10 text; CON_=contágio in this context (place of likely infection), PAIS=país.

  CON_UF:
    official_name: UF de contágio
    translated_name: State (UF) of probable infection
    description: >
      Brazilian state where the patient most likely acquired cutaneous
      leishmaniasis, used when transmission is domestic rather than
      imported — pairs with CON_PAIS for the international case.
    code_system: none
    source: inferred
    reasoning: C8; CON_=contágio, UF=state code.

  ENTO_EQUIN:
    official_name: Presença de equinos
    translated_name: Horses present near residence (entomological finding)
    description: >
      Whether horses were present near the patient's household —
      equines can be peridomestic hosts that draw the sandfly vector
      close to homes, part of the entomological-investigation checklist
      with ENTO_INSET and ENTO_PERID.
    code_system: none
    source: inferred
    reasoning: C12 flag/short code; ENTO_=entomológico per prefix convention, EQUIN=equino.

  ENTO_EXI_3:
    official_name: Existência de [item 3] no peridomicílio
    translated_name: "Presence of a third checklist item (entomological survey)"
    description: >
      Whether a specific reservoir/environmental feature — the third item
      in a numbered peridomestic checklist alongside ENTO_EQUIN and
      ENTO_INSET — was found near the household during the entomological
      survey; the exact item behind "3" isn't confirmed by the evidence
      available.
    code_system: none
    source: inferred
    reasoning: >
      C11; ENTO_=entomológico, EXI=existência, trailing 3 implies a
      numbered series (ENTO_EXI_1/2 not in this partition), so the
      specific checklist item can't be pinned down from name alone.

  ENTO_INSET:
    official_name: Presença de insetos vetores
    translated_name: Sandfly vector insects found (entomological finding)
    description: >
      Whether sandflies (the Lutzomyia vector) were captured or observed at
      the investigation site — the direct vector-presence finding,
      compared with the reservoir-host flags ENTO_EQUIN and ENTO_EXI_3.
    code_system: none
    source: inferred
    reasoning: C12; ENTO_=entomológico, INSET=inseto.

  ENTO_PERID:
    official_name: Investigação peridomiciliar
    translated_name: Peridomestic area investigated (flag)
    description: >
      Whether the area immediately around the household was investigated
      for leishmaniasis transmission risk — the umbrella flag for the
      peridomestic entomological checklist that includes ENTO_EQUIN and
      ENTO_INSET.
    code_system: none
    source: inferred
    reasoning: C12; ENTO_=entomológico, PERID=peridomiciliar.

  # --- SDTA (surto de doença transmitida por alimentos): outbreak investigation ---

  AGENTE_ET1:
    official_name: Agente etiológico 1
    translated_name: First identified/suspected etiologic agent
    description: >
      Name of the first pathogen identified or suspected as the cause of
      the foodborne-disease outbreak (e.g. Salmonella, Staphylococcus
      aureus, Norovirus) — paired with AGENTE_ET2 when a second agent is
      also implicated.
    code_system: none
    source: inferred
    reasoning: C40, wide enough for a pathogen name; AGENTE_ET=agente etiológico, trailing 1 implies a numbered series.

  AGENTE_ET2:
    official_name: Agente etiológico 2
    translated_name: Second identified/suspected etiologic agent
    description: >
      Name of a second pathogen implicated in the same outbreak, when
      more than one etiologic agent is identified — the companion field to
      AGENTE_ET1.
    code_system: none
    source: inferred
    reasoning: C38, same pattern as AGENTE_ET1 with trailing 2.

  DTTRANSRS:
    official_name: Data relacionada à transmissão
    translated_name: Transmission-related date
    description: >
      A date tied to the outbreak's transmission event (e.g. the suspect
      meal or transmission window), stored as text rather than a native
      date type. The exact question isn't confirmed by the evidence
      available.
    code_system: none
    source: inferred
    reasoning: >
      C10 (not D8, unlike most SINAN dates) but named with the DT_ date
      prefix and TRANS (transmissão); low file coverage (17f) suggests a
      less-common or regionally added field whose precise scope could not
      be pinned down further.

  MAX_INC:
    official_name: Incubação máxima
    translated_name: Maximum incubation period observed
    description: >
      Longest incubation period (onset minus exposure) observed among the
      outbreak's cases — used with NU_INCUB_M (the minimum) to bound the
      likely exposure window in the epidemic curve.
    code_system: none
    source: inferred
    reasoning: N3 numeric; MAX_INC=máxima incubação.

  NU_INCUB_M:
    official_name: Incubação mínima
    translated_name: Minimum incubation period observed
    description: >
      Shortest incubation period observed among the outbreak's cases —
      the lower bound paired with MAX_INC (the maximum) to narrow the
      probable exposure window.
    code_system: none
    source: inferred
    reasoning: N3 numeric, same shape as MAX_INC; NU_=número prefix, INCUB=incubação, trailing M read as mínima (paired opposite of MAX_).

  ST_A_CLINI:
    official_name: Situação - caso clínico
    translated_name: Case meets clinical-only criteria (flag)
    description: >
      Whether the case was classified using clinical criteria alone,
      without laboratory confirmation of the etiologic agent — one of the
      outbreak's case-classification flags alongside ST_INC_ME.
    code_system: none
    source: inferred
    reasoning: C1 flag; ST_=situação per prefix convention, A_CLINI read as caso clínico.

  ST_INC_ME:
    official_name: Situação da incubação estimada
    translated_name: Incubation-period estimate status (flag)
    description: >
      Whether the outbreak's incubation-period figures (MAX_INC,
      NU_INCUB_M) were directly observed or estimated — a data-quality
      flag on those two numeric fields rather than a clinical finding.
    code_system: none
    source: inferred
    reasoning: C1 flag; ST_=situação, INC=incubação, ME read as estimada/medida.
