system: SINAN
asserted_by: pegasus_data
variables:

  TRAB_DOE:
    official_name: Há ou houve outros trabalhadores com a mesma doença no local de trabalho
    translated_name: Other workers with the same disease at this workplace
    description: >
      Flags whether other workers at the same workplace had or currently have the
      same work-related condition, recorded during case investigation of an
      occupational-disease notification. Value 1=Sim, 2=Não, 9=Ignorado. Present
      across all six SINAN work-related-disease sub-fichas in this system (cancer,
      occupational dermatoses, LER/DORT, work-related mental disorders, noise-induced
      hearing loss/PAIR, pneumoconioses) even though the source document below is
      titled for LER/DORT specifically — the field block (31-60) is reused verbatim
      across the sub-fichas.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — Dicionário de Dados SINAN NET v5.0, Agravo: DRT Ler Dort, campo 55 'Há ou houve outros trabalhadores com a mesma doença no local de trabalho', DBF=TRAB_DOE (Ministério da Saúde/SVS/GT-SINAN, revisado março/2012)"
    notes: >
      No codelist is bound to this column in the catalog even though the value set
      (1/2/9) is confirmed verbatim in the source document — SINAN has zero observed
      values in this catalog build, so the automated codelist binder had nothing to
      match against. Do not read the missing binding as evidence the field is
      uncoded.

  AFAST_TRAB:
    official_name: Conduta geral – afastamento do local de trabalho
    translated_name: General response taken — removal from the workplace
    description: >
      One of six "what was done about it" flags recorded after a work-related-disease
      diagnosis (see also COLETIVA, CONDUTA, INDIVIDUAL, MUDA_TRAB, NENHUM, AFAST_RISC
      — each records a distinct possible response as its own yes/no column rather
      than one multi-select field). This one flags whether the worker was removed
      from the workplace itself. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral – Afastamento do local de trabalho', DBF=AFAST_TRAB (Ministério da Saúde/SVS/GT-SINAN, revisado março/2012)"

  COLETIVA:
    official_name: Conduta geral – adoção de proteção coletiva
    translated_name: General response taken — collective protection measures adopted
    description: >
      One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one records whether collective protective measures (e.g. engineering
      controls at the workstation) were adopted. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral – adoção de proteção coletiva', DBF=COLETIVA"

  CONDUTA:
    official_name: Conduta geral – outros
    translated_name: General response taken — other (unlisted) action
    description: >
      The catch-all member of the six "conduta geral" flags: records whether some
      action outside the five named categories was taken. Pairs with the free-text
      field CONDUT_DES, which is only meant to be filled when this is 1=Sim.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral – outros', DBF=CONDUTA"

  INDIVIDUAL:
    official_name: Conduta geral – adoção de proteção individual
    translated_name: General response taken — individual protection measures adopted
    description: >
      One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one records whether individual protective equipment/measures were
      adopted for the worker. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral – adoção de proteção individual', DBF=INDIVIDUAL"

  MUDA_TRAB:
    official_name: Conduta geral – adoção de mudança na organização do trabalho
    translated_name: General response taken — change to work organization adopted
    description: >
      One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one records whether the way work is organized (tasks, rotation, pace)
      was changed in response to the case. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral – adoção de mudança na organização do trabalho', DBF=MUDA_TRAB"

  NENHUM:
    official_name: Conduta geral – nenhuma
    translated_name: General response taken — none
    description: >
      One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one records that no action at all was taken in response to the case.
      1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral – nenhuma', DBF=NENHUM"
    notes: >
      A generic-looking name (worth surfacing so it isn't mistaken for a column
      about some other "nenhum") — it belongs to the same six-flag "conduta geral"
      block as AFAST_TRAB/COLETIVA/CONDUTA/INDIVIDUAL/MUDA_TRAB.

  AFAST_RISC:
    official_name: Conduta geral – afastamento do agente do risco com mudança de função e/ou posto de trabalho
    translated_name: General response taken — hazard removed via role/station change
    description: >
      One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one specifically records whether the risk-generating exposure was
      removed by changing the worker's function or workstation (as opposed to
      removing the worker from the workplace, which is AFAST_TRAB). 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 56 'Conduta geral – afastamento do agente do risco com mudança de função e/ou posto de trabalho', DBF=AFAST_RISC"

  CONDUT_DES:
    official_name: Conduta geral, se outros – especificar
    translated_name: General response — free-text detail when "other" was checked
    description: >
      Free-text elaboration (up to 30 characters) enabled only when CONDUTA=1
      (Sim), i.e. when the response taken falls outside the five named "conduta
      geral" categories. Empty/irrelevant whenever CONDUTA is not 1.
    code_system: none
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 57 'Conduta geral, se outro especificar', DBF=CONDUT_DES, varchar2(30)"

  AFASTAMENT:
    official_name: Houve afastamento do Trabalho para tratamento
    translated_name: Work leave taken for treatment
    description: >
      Flags whether the worker was given leave from work for treatment of the
      condition. 1=Sim, 2=Não, 9=Ignorado. Gates the following block: when 2, 9 or
      blank, the ficha skips straight to the "other workers affected" question
      (TRAB_DOE) — the leave-duration fields NU_AFAST/TP_AFAST and the outcome
      field EVOL_AFAST are only meaningful when this is 1.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 53 'Houve afastamento do Trabalho para tratamento', DBF=AFASTAMENT"

  AGRAVO_DES:
    official_name: Agravos associados, se outros – especificar
    translated_name: Associated conditions — free-text detail when "other" was checked
    description: >
      Free-text elaboration (up to 30 characters) for a pre-existing/associated
      condition not covered by the named comorbidity flags (ASMA, HANSENIASE,
      HIPERTEN, MENTAL and, outside this batch, TUBE/DIABETES). Only meaningful
      when OUT_AGRAVO=1 (Sim).
    code_system: none
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 46 'Agravos associados, se outros especificar', DBF=AGRAVO_DES, varchar2(30)"

  ASMA:
    official_name: Agravos associados – Asma
    translated_name: Associated condition — asthma
    description: >
      Pre-existing/associated-condition comorbidity flag: whether the patient has
      asthma, recorded alongside the other named "agravos associados" flags
      (HIPERTEN, HANSENIASE, MENTAL, OUT_AGRAVO). 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 46 'Agravos associados – Asma', DBF=ASMA"

  EVOL_AFAST:
    official_name: Evolução da situação de saúde do paciente com afastamento do trabalho
    translated_name: Health outcome while on work leave
    description: >
      Outcome of the patient's health status specifically during the period of
      work leave recorded via AFASTAMENT/NU_AFAST/TP_AFAST. Value set is
      Melhora/Piora/9-Ignorado — not the generic Sim/Não/Ignorado used by most
      other flags in this ficha. Only populated when the leave duration
      (NU_AFAST/TP_AFAST) is greater than zero.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 54 'Com afastamento do trabalho' (Evolução), values Melhora/Piora/9-Ignorado, DBF=EVOL_AFAST"
    notes: >
      Do not confuse with EVOLUCAO (the case-level outcome used elsewhere in SINAN,
      e.g. cura/óbito) — this column is scoped narrowly to the work-leave episode
      and uses a different two-category-plus-ignored value set.

  HANSENIASE:
    official_name: Agravos associados – Hanseníase
    translated_name: Associated condition — leprosy (Hansen's disease)
    description: >
      Pre-existing/associated-condition comorbidity flag: whether the patient has
      Hansen's disease, recorded alongside ASMA/HIPERTEN/MENTAL/OUT_AGRAVO.
      1=Sim, 2=Não, 9=Ignorado. This is a comorbidity checkbox on a work-related-
      disease ficha — it is not the Hanseníase case-notification form itself.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 46 'Agravos associados – Hanseníase', DBF=HANSENIASE"

  HIPERTEN:
    official_name: Agravos associados – Hipertensão arterial
    translated_name: Associated condition — hypertension
    description: >
      Pre-existing/associated-condition comorbidity flag: whether the patient has
      hypertension, recorded alongside ASMA/HANSENIASE/MENTAL/OUT_AGRAVO.
      1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 46 'Agravos associados – Hipertensão arterial', DBF=HIPERTEN"

  MENTAL:
    official_name: Agravos associados – Transtorno mental
    translated_name: Associated condition — mental disorder
    description: >
      Pre-existing/associated-condition comorbidity flag: whether the patient has
      a diagnosed mental disorder, recorded alongside ASMA/HANSENIASE/HIPERTEN/
      OUT_AGRAVO. 1=Sim, 2=Não, 9=Ignorado. This is a comorbidity checkbox on any
      work-related-disease ficha (e.g. a hearing-loss or cancer notification) — it
      is not specific to the "Transtornos Mentais Relacionados ao Trabalho"
      notification itself, even though this batch's series for the column
      includes that sub-system.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 46 'Agravos associados – transtorno mental', DBF=MENTAL"

  NU_AFAST:
    official_name: Tempo de afastamento do trabalho para tratamento (número)
    translated_name: Work-leave duration — magnitude
    description: >
      The numeric magnitude of how long the worker was on leave for treatment,
      paired with the unit code in TP_AFAST (e.g. NU_AFAST=3 + TP_AFAST=3 means
      "3 months"). Only populated when AFASTAMENT=1. On its own, without the
      paired unit, the number is not interpretable.
    code_system: none
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 53.3 'Tempo de afastamento do trabalho para tratamento', DBF=NU_AFAST, varchar(2)"
    notes: >
      Declared width varies between 2 and 5 characters across the files carrying
      this column — likely different DBF schema vintages. Treat magnitudes from
      the 5-char files with more caution about the plausible value range.

  OUT_AGRAVO:
    official_name: Agravos associados – outra doença
    translated_name: Associated condition — other (unlisted) disease
    description: >
      The catch-all member of the "agravos associados" comorbidity block
      (see ASMA/HANSENIASE/HIPERTEN/MENTAL): flags whether the patient has some
      other pre-existing condition not covered by the named checkboxes.
      1=Sim, 2=Não, 9=Ignorado. Pairs with the free-text field AGRAVO_DES.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 46 'Agravos associados – outra doença', DBF=OUT_AGRAVO"

  TP_AFAST:
    official_name: Tempo de afastamento do trabalho para tratamento (unidade)
    translated_name: Work-leave duration — unit
    description: >
      The unit of time for the magnitude in NU_AFAST: 1=hora, 2=dias, 3=meses,
      4=anos. Read together (e.g. NU_AFAST=2, TP_AFAST=2 = "2 days").
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 53.3, unit codes 1-hora/2-dias/3-meses/4-anos, DBF=TP_AFAST"
    notes: >
      SPURIOUS-BINDING? candidate worth flagging directly: the catalog also binds
      a MELHORA codelist to this column, but the layout document shows TP_AFAST's
      real value set is the 1/2/3/4 time-unit list above — Melhora/Piora belongs
      to the unrelated field EVOL_AFAST, not to this one.

  OUTRO_SIN:
    official_name: Sinais e sintomas – outro
    translated_name: Signs and symptoms — other (unlisted)
    description: >
      Flags whether a sign or symptom outside the ficha's named checklist was
      present. 1=Sim, 2=Não, 9=Ignorado. Pairs with a free-text elaboration field
      (SINTO_DES in the source layout) that is not part of this batch. The column
      is reused with the same generic meaning outside the work-related-disease
      fichas too (this batch also carries it for Doença de Chagas Aguda).
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 49 'Sinais e Sintomas – Outro', DBF=OUTRO_SIN"

  DOR:
    official_name: Sinais e sintomas – Dor
    translated_name: Signs and symptoms — pain
    description: >
      Flags whether pain was one of the presenting signs/symptoms. 1=Sim, 2=Não,
      9=Ignorado in the LER/DORT musculoskeletal-symptom checklist that grounds
      this entry. The same column name is reused generically for a "pain present"
      flag in unrelated fichas this batch also carries (dengue, febre tifóide) —
      the yes/no/ignored mechanics hold there too, but the exact symptom checklist
      surrounding it differs per agravo.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf — campo 49 'Sinais e Sintomas – Dor', DBF=DOR"

  CS_SUSPEIT:
    official_name: Suspeita do agravo
    translated_name: Type of suspected case
    description: >
      A disease-specific sub-classification captured at notification time, before
      lab confirmation. The category set depends entirely on which agravo the
      ficha belongs to: for exanthematic-disease notifications, 1=Sarampo,
      2=Rubéola (confirmed for this batch's EXAN series via the bound SARARUBE
      codelist); for meningitis notifications, 1=Doenças Meningocócicas,
      2=Outras Meningites; for AIDS notifications it instead flags child vs adult.
      In this batch the column is also carried by HANT (hantavirose) and ROTA
      (rotavirus) files, whose specific use of CS_SUSPEIT is not documented by
      this general dictionary.
    code_system: internal
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/NINDIV/DIC_DADOS_NET_Not_Individual_rev.pdf — Dicionário de Dados SINAN NET v5.0, bloco Notificação Individual, campo 'Suspeita do Agravo', DBF=CS_SUSPEIT (Ministério da Saúde/SVS/GT-SINAN, revisado novembro/2018)"
    notes: >
      Only the Sarampo/Rubéola meaning (EXAN) is verified here. For HANT and ROTA
      files carrying this column, treat the value meaning as unconfirmed.

  DT_NOTI_AT:
    official_name: Data da Notificação Atual
    translated_name: Current follow-up notification date
    description: >
      From the Hanseníase/Tuberculose follow-up ("acompanhamento") ficha: the date
      of the current follow-up visit, auto-populated from that visit's own
      notification date. Distinct from DT_NOTIFIC, which is the date of the
      original index notification the patient's treatment is being followed up
      from.
    code_system: none
    source: layout_doc
    source_ref: "http://portalsinan.saude.gov.br/images/documentos/Agravos/NINDIV/DIC_DADOS_NET_Not_Individual_rev.pdf — section 1.1 'RQ003 – Preenchimento Acompanhamento de Hanseníase e Tuberculose', mapping table row 'Data da Notificação' -> 'Data da Notificação Atual'"

  TP_SISTEMA:
    official_name: Tipo de Sistema
    translated_name: Originating sub-system
    description: >
      Records which SINAN application inserted the record: 1=Sinan Net (desktop),
      2=Sinan Online (web). Assigned automatically by the system, not entered by
      the notifier — useful for understanding data-quality or completeness shifts
      that track the Sinan Net-to-Online migration rather than the disease itself.
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — Dicionário de Dados, Sinan Online, DENGUE, campo 116 'Tipo de Sistema', DBF=TP_SISTEMA (Ministério da Saúde/SVSA/DAENT)"

  HOSPITALIZ:
    official_name: Ocorreu Hospitalização?
    translated_name: Was the patient hospitalized?
    description: >
      Flags whether the case was hospitalized. 1=Sim, 2=Não, 9=Ignorado. Gates the
      hospitalization-location fields (MUNICIPIO and, inferred, UF) and any
      admission-date field: when 2 or 9, the ficha skips them.
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 62 'Ocorreu Hospitalização?', DBF=HOSPITALIZ"

  MUNICIPIO:
    official_name: Município (da hospitalização)
    translated_name: Municipality where the patient was hospitalized
    description: >
      IBGE code and name of the municipality where the patient was hospitalized —
      only populated when HOSPITALIZ=1. Distinct from ID_MUNICIP (municipality of
      the notifying unit) and ID_MN_RESI (municipality of residence): a patient
      can be notified in one municipality, live in a second, and be hospitalized
      in a third.
    code_system: external
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 65 'Município': 'Código e nome completo do município onde o paciente foi hospitalizado', DBF=MUNICIPIO"
    notes: >
      This batch also carries the column for febre tifóide (FTIF) and raiva
      (RAIV) files, where the same "hospitalization municipality" meaning is
      inferred by name/series match rather than separately confirmed.

  PETEQUIAS:
    official_name: Manifestações hemorrágicas – Petéquias
    translated_name: Hemorrhagic manifestations — petechiae
    description: >
      Within the dengue hemorrhagic-manifestations checklist, flags whether
      petechiae were among the manifestations observed. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 107 'Petéquias' ('Se Sim, Quais? — Petéquias'), DBF=PETEQUIAS"

  EXANTEMA:
    official_name: Sinais clínicos – Exantema
    translated_name: Clinical sign — rash (exanthema)
    description: >
      Clinical-sign-present flag in the dengue/chikungunya presenting-symptoms
      checklist: whether a rash was observed. 1=Sim, 2=Não in the source table
      (the catalog's SIM_NAO binding suggests some files also carry a 9=Ignorado).
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 27 'Sinais clínicos (Exantema)', DBF=EXANTEMA"

  MIALGIA:
    official_name: Sinais clínicos – Mialgia
    translated_name: Clinical sign — muscle pain (myalgia)
    description: >
      Clinical-sign-present flag in the dengue/chikungunya presenting-symptoms
      checklist: whether myalgia was observed. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 25 'Sinais clínicos (Mialgia)', DBF=MIALGIA"

  ARTRITE:
    official_name: Sinais clínicos – Artrite
    translated_name: Clinical sign — arthritis
    description: >
      Clinical-sign-present flag in the dengue/chikungunya presenting-symptoms
      checklist: whether arthritis (joint swelling/inflammation, as distinct from
      the milder ARTRALGIA/joint-pain-only flag on the same ficha) was observed.
      1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 32 'Sinais clínicos (Artrite)', DBF=ARTRITE"
    notes: >
      This batch also carries the column for pneumoconioses (PNEU) files, where
      the same clinical-sign meaning is not confirmed by this document.

  NAUSEA:
    official_name: Sinais clínicos – Náusea
    translated_name: Clinical sign — nausea
    description: >
      Clinical-sign-present flag in the dengue/chikungunya presenting-symptoms
      checklist: whether nausea was observed. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf — campo 29 'Sinais clínicos (Náusea)', DBF=NAUSEA"

  VOMITO:
    official_name: Sinais clínicos – Vômito
