system: SISCAN
asserted_by: pegasus_data
variables:

  CO_MIC_TRI:
    official_name: "Codigo de microrganismo - Trichomonas vaginalis"
    translated_name: "Trichomonas vaginalis flag (cervical cytology)"
    description: >
      Whether the Papanicolaou smear's MICROBIOLOGIA block reported Trichomonas vaginalis. The result form lists it as one of eight organism/finding checkboxes a cytotechnician can mark; declared C(1,0), so this is a single-character presence flag, not a count or an organism-load measure.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"
    notes: >
      Presence here means the organism was reported on this smear, not that the patient was symptomatic or treated for it.


  CO_NEO_MAL:
    official_name: "Codigo de outras neoplasias malignas (citologia)"
    translated_name: "Other malignant neoplasm flag (cervical cytology)"
    description: >
      Flags the 'OUTRAS NEOPLASIAS MALIGNAS' checkbox under ATIPIAS EM CELULAS GLANDULARES on the cytology result - a catch-all for a malignant tumour seen on the smear that does not fit the printed squamous or glandular atypia categories.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"
    notes: >
      OUTNEO, a wider C(8,0) field in the same file family, reads as the same checkbox under a different naming pass; treat the two as probable duplicates rather than independent findings.


  CO_RES_NOR:
    official_name: "Resultado dentro dos limites da normalidade"
    translated_name: "Cytology result within normal limits"
    description: >
      Answer to 'Dentro dos limites da normalidade no material examinado? Sim/Nao' on the cytology result - whether the pathologist found the smear entirely within normal limits, independent of the specific abnormal-cell categories recorded elsewhere in the row. Bound to codelist LIMITENORM, an internal Yes/No list rather than a clinical grading scale.

    codelists: ["LIMITENORM"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  CVCIONAL:
    official_name: "Coleta - meio convencional"
    translated_name: "Conventional (slide) collection method flag"
    description: >
      Reads as the companion flag to MEIOLIQU, marking that the sample was collected as a conventional (dry-slide) Papanicolaou smear rather than liquid-based cytology.

    code_system: none
    source: inferred
    reasoning: >
      Decomposes to an abbreviation of 'convencional', paired with the neighbouring field MEIOLIQU ('meio liquido'). Liquid-based cervical cytology became a billable SUS procedure alongside the conventional smear, so a binary collection-method pair is the natural DATASUS-style encoding, but neither field name is confirmed against a written source - the paper form on file predates the liquid-based option and does not show either checkbox.

    notes: >
      Moderate confidence only; treat as a working hypothesis, not a citation.


  MEIOLIQU:
    official_name: "Coleta - meio liquido"
    translated_name: "Liquid-based collection method flag"
    description: >
      Reads as the liquid-based-cytology counterpart to CVCIONAL - see that entry for the reasoning and the same confidence caveat.

    code_system: none
    source: inferred
    reasoning: >
      MEIO+LIQU decomposes directly to 'meio liquido' (liquid medium), the standard term for liquid-based Pap-smear preparation, paired with CVCIONAL as the two collection-method options.

    notes: >
      Moderate confidence only; not confirmed against a written source.


  C_EPI_ESCA:
    official_name: "Epitelio escamoso representado na amostra"
    translated_name: "Squamous epithelium present in sample"
    description: >
      Whether squamous epithelium is present in the smear - one of the ADEQUABILIDADE DO MATERIAL checkboxes ('Epitelios representados na amostra: Escamoso / Glandular / Metaplasico') used to judge whether the sample is technically adequate. This is a presence flag, distinct from O_CIT_ESCA, which carries the actual squamous-abnormality diagnosis.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  C_EPI_GLAN:
    official_name: "Epitelio glandular representado na amostra"
    translated_name: "Glandular epithelium present in sample"
    description: >
      Glandular counterpart of C_EPI_ESCA: whether glandular epithelium is present in the smear, from the same 'Epitelios representados na amostra' adequacy checkboxes.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  O_CIT_ESCA:
    official_name: "Resultado - atipias em celulas escamosas"
    translated_name: "Squamous-cell abnormality result code"
    description: >
      Coded diagnostic category for squamous-cell abnormality on the smear - the ATIPIAS EM CELULAS ESCAMOSAS block of the result, spanning ASC-US/ASC-H through low- and high-grade intraepithelial lesion to invasive squamous carcinoma. Bound to codelist ATICELESC; the raw codes are DATASUS-internal and only readable through that codelist's labels.

    codelists: ["ATICELESC"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  O_CIT_GLAN:
    official_name: "Resultado - atipias em celulas glandulares"
    translated_name: "Glandular-cell abnormality result code"
    description: >
      Glandular twin of O_CIT_ESCA - coded diagnostic category from ATIPIAS EM CELULAS GLANDULARES (adenocarcinoma in situ, invasive adenocarcinoma, etc). Bound to codelist ATICELGLAN.

    codelists: ["ATICELGLAN"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  DENCARCINV:
    official_name: "Carcinoma epidermoide invasor (citologia)"
    translated_name: "Invasive squamous carcinoma flag (cytology)"
    description: >
      Flag for the 'Carcinoma epidermoide invasor' checkbox at the foot of the ATIPIAS EM CELULAS ESCAMOSAS block on the cytology result - cytologic evidence of frankly invasive squamous carcinoma, not a histologically confirmed diagnosis.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  INSATSFAC:
    official_name: "Amostra insatisfatoria para avaliacao oncotica"
    translated_name: "Unsatisfactory sample flag (cytology)"
    description: >
      Flags that the smear was judged unsatisfactory for oncotic evaluation. The form lists six specific reasons (acellular/hypocellular material, >75% blood, >75% pus cells, drying artefact, external contaminants, cell overlap) under this heading; this column carries the overall insatisfatoria verdict, not which specific reason applied.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  SATISFACT:
    official_name: "Amostra satisfatoria para avaliacao oncotica"
    translated_name: "Satisfactory sample flag (cytology)"
    description: >
      The satisfatoria counterpart of INSATSFAC under ADEQUABILIDADE DO MATERIAL.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  REJEITADA:
    official_name: "Amostra rejeitada"
    translated_name: "Rejected sample flag (cytology)"
    description: >
      Flags that the slide was rejected before analysis - the AMOSTRA REJEITADA POR section (missing/wrong slide identification, damaged or absent slide, cause outside the lab's control, or another stated cause). A rejected sample carries no cytologic result at all.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"
    notes: >
      Do not confuse with INSATSFAC, which covers samples that WERE read but judged technically inadequate.


  RESNORM:
    official_name: "Resultado normal/benigno"
    translated_name: "Normal/benign result flag"
    description: >
      Summary 'resultado normal/benigno' flag, matching the heading printed at the top of the histopathology form's citology-encaminhamento block.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    notes: >
      Likely a duplicate of CO_RES_NOR under a different naming pass - SISCOLO's export appears to carry more than one naming generation for some result flags across the 2006-2015 span.


  LBGRAU:
    official_name: "Lesao intraepitelial de baixo grau"
    translated_name: "Low-grade squamous intraepithelial lesion (LSIL) flag"
    description: >
      Flag for 'Lesao intra-epitelial de baixo grau (compreendendo efeito citopatico pelo HPV e neoplasia intra-epitelial cervical grau I)' - LSIL - under ATIPIAS EM CELULAS ESCAMOSAS.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  LAGRAU:
    official_name: "Lesao intraepitelial de alto grau (familia)"
    translated_name: "High-grade squamous lesion family flag"
    description: >
      Ties to the 'alto grau' squamous-lesion family on the cytology result, which appears more than once on the form: as 'nao se pode afastar lesao de alto grau' (ASC-H-type wording, under celulas atipicas de significado indeterminado) and as the definitive 'Lesao intra-epitelial de alto grau' (HSIL) checkbox. Which exact checkbox this column encodes could not be pinned down from the form alone.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"
    notes: >
      Confidently in the high-grade squamous family; the exact checkbox (ASC-H vs HSIL) is not independently confirmed. Do not treat as interchangeable with LAGRAUMI, which is unambiguous.


  LAGRAUMI:
    official_name: "Lesao intraepitelial de alto grau, nao podendo excluir microinvasao"
    translated_name: "High-grade lesion, cannot exclude microinvasion"
    description: >
      Direct match to the form checkbox of the same wording - high-grade squamous intraepithelial lesion where microinvasion cannot be excluded, one step short of a frank invasive-carcinoma call.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  OUTNEO:
    official_name: "Outras neoplasias malignas (citologia)"
    translated_name: "Other malignant neoplasm flag (cytology, alternate encoding)"
    description: >
      Flag for the same 'OUTRAS NEOPLASIAS MALIGNAS' checkbox as CO_NEO_MAL.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"
    notes: >
      Probable duplicate of CO_NEO_MAL - see that entry.


  TEMPCITANT:
    official_name: "Tempo desde a citologia anterior"
    translated_name: "Time since previous Pap smear"
    description: >
      Codes how long ago the woman's previous Pap smear was, drawn from anamnese question 2 ('Fez o exame preventivo alguma vez? Sim, quando fez o ultimo exame? ano ___'). Bound to codelist TEMPO, an internal set of time-since-last-exam bins rather than a raw date.

    codelists: ["TEMPO"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero (formulario no.415), p.1-2"

  DT_ANM_PRE:
    official_name: "Ano do exame preventivo anterior informado na anamnese"
    translated_name: "Year of previously reported Pap smear"
    description: >
      The 4-digit year the patient reported for her last Pap smear on anamnese question 2 ('ano ___'). Declared C(4,0), matching a bare year rather than a full DD/MM/AAAA date.

    code_system: none
    source: inferred
    reasoning: >
      DT_ is DATASUS's date-field prefix; a declared width of 4 characters only fits a bare year, which matches the 'ano ___' blank on anamnese question 2 rather than any full-date field on the form.

    notes: >
      Do not expect day/month precision from this column - it is a year only.


  REPREZT:
    official_name: "Representacao da zona de transformacao"
    translated_name: "Transformation-zone representation flag"
    description: >
      Whether the transformation zone / endocervical component is represented in the cervical smear - a standard adequacy sub-item in the Bethesda-based Brazilian cervical-cytology nomenclature (Nomenclatura Brasileira para Laudos Cervicais, INCA 2006), tracked alongside but separately from the basic satisfatoria/insatisfatoria call. Only present from 2008 onward (2,210 of the 2,858 CC files), consistent with a criterion added partway through the 2006-2015 window rather than present at launch.

    code_system: none
    source: inferred
    reasoning: >
      REPREZT decomposes to 'representacao da zona de transformacao'; presence/absence of the transformation-zone component is a documented part of the Brazilian cervical-cytology reporting nomenclature, and the field's later start year is consistent with a criterion added after the system's 2006 launch.

    notes: >
      Exact code values not verified against a written source - a well-reasoned reading, not a citation.


  NEOINSUTU:
    official_name: "Adenocarcinoma in situ (citologia/histopatologia)"
    translated_name: "Adenocarcinoma in situ flag"
    description: >
      Reads as the 'Adenocarcinoma "in situ"' checkbox under ATIPIAS EM CELULAS GLANDULARES (cytology form) or the equivalent MICROSCOPIA entry on the histopathology form.

    code_system: none
    source: inferred
    reasoning: >
      NEO+INSUTU is a near-exact respelling of 'neoplasia in situ' (adenocarcinoma "in situ" is the only 'in situ' checkbox on either form), with the vowel order in 'situ' transposed - a common effect of stripping accents/vowels when building fixed-width field names.

    notes: >
      Moderate confidence; the near match in spelling is the main evidence.


  CO_NEO_ADE:
    official_name: "Codigo de adenocarcinoma (histopatologia)"
    translated_name: "Adenocarcinoma category code (histopathology)"
    description: >
      Coded field selecting which adenocarcinoma category applies in the MICROSCOPIA block of the histopathology result - 'Adenocarcinoma in situ' vs 'Adenocarcinoma invasor' - when the diagnosis is glandular rather than squamous.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"

  CO_NEO_NIC:
    official_name: "Codigo de grau da neoplasia intraepitelial cervical (NIC)"
    translated_name: "NIC grade code"
    description: >
      Coded field selecting the cervical intraepithelial neoplasia (NIC) grade - I, II or III - from the histopathology microscopy list.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    notes: >
      Likely redundant with the individual per-grade flags carried elsewhere in the same file (NICDLEVE/NICDMODE/NICDACENT) - both a single coded field and separate booleans appear to exist for the same finding.


  CO_RES_FRA:
    official_name: "Numero de fragmentos da biopsia"
    translated_name: "Number of biopsy fragments"
    description: >
      Count of tissue fragments received, from 'Biopsia, numero de fragmentos ___' in the MACROSCOPIA section. Declared C(2,0): a 2-digit count, not a code.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"

  CO_RES_LOC:
    official_name: "Localizacao do tumor no colo"
    translated_name: "Tumour location on the cervix"
    description: >
      Where on the cervix the tumour is located - ectocervice, endocervice, or juncao escamo-colunar - from the MACROSCOPIA 'localizacao do tumor' checkboxes. Bound to codelist LOCALIZACAO.

    codelists: ["LOCALIZACAO"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"

  CO_RES_MAR:
    official_name: "Distancia da margem cirurgica mais proxima (mm)"
    translated_name: "Distance to nearest surgical margin (mm)"
    description: >
      Measured distance, in millimetres, from the tumour to the nearest surgical margin, from 'Distancia da margem mais proxima ___ mm' in MACROSCOPIA. Declared C(4,0): a measurement, not a code.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"

  CO_RES_TAM:
    official_name: "Tamanho do tumor - dimensao 1"
    translated_name: "Tumour size, dimension 1"
    description: >
      First of the two blanks in 'Peca cirurgica, tamanho do tumor ___ x ___ cm' in MACROSCOPIA, stored as a separate column rather than as one two-part field. Declared C(4,0).

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"

  O_RES_TAM2:
    official_name: "Tamanho do tumor - dimensao 2"
    translated_name: "Tumour size, dimension 2"
    description: >
      Second blank of the same 'tamanho do tumor ___ x ___ cm' field - pairs with CO_RES_TAM.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    depends_on: ["CO_RES_TAM"]

  CO_RES_TIP:
    official_name: "Tipo de procedimento cirurgico"
    translated_name: "Surgical procedure type code"
    description: >
      Coded field for 'Tipo de procedimento cirurgico*': biopsia, exerese da zona de transformacao, conizacao, histerectomia simples, histerectomia com anexectomia uni/bilateral, or outros.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    notes: >
      Genuinely a small fixed-list coded field even though the catalog carries no codelist for it - SISCAN is catalogued from file headers only here, so the binder had nothing to attach; that is a gap in the catalog, not evidence the column is free text.


  CRESBIOPSI:
    official_name: "Tipo de procedimento cirurgico - biopsia"
    translated_name: "Surgical procedure flag: biopsia"
    description: >
      Individual checkbox flag for 'biopsia' under 'Tipo de procedimento cirurgico*' on the histopathology result - the same checkbox group CO_RES_TIP encodes as a single code.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    depends_on: ["CO_RES_TIP"]
    notes: >
      Likely redundant with CO_RES_TIP - both a single coded field and per-option flags appear to exist for this checkbox group.


  CRESCONIZA:
    official_name: "Tipo de procedimento cirurgico - conizacao"
    translated_name: "Surgical procedure flag: conizacao"
    description: >
      Individual checkbox flag for 'conizacao' under 'Tipo de procedimento cirurgico*' on the histopathology result - the same checkbox group CO_RES_TIP encodes as a single code.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    depends_on: ["CO_RES_TIP"]
    notes: >
      Likely redundant with CO_RES_TIP - both a single coded field and per-option flags appear to exist for this checkbox group.


  CRESHISSIM:
    official_name: "Tipo de procedimento cirurgico - histerectomia simples"
    translated_name: "Surgical procedure flag: histerectomia simples"
    description: >
      Individual checkbox flag for 'histerectomia simples' under 'Tipo de procedimento cirurgico*' on the histopathology result - the same checkbox group CO_RES_TIP encodes as a single code.

    code_system: none
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf, Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero (formulario no.414), p.1-2"
    depends_on: ["CO_RES_TIP"]
    notes: >
      Likely redundant with CO_RES_TIP - both a single coded field and per-option flags appear to exist for this checkbox group.


  CRESPANHIS:
