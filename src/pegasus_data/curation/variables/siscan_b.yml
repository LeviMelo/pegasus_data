  PRESULPAAF:
    official_name: "Resultado geral da puncao aspirativa"
    translated_name: "Overall FNA (PAAF) result code"
    description: >
      Summary code for the overall PAAF result across the four categories (benigno / indeterminado / suspeito / positivo), rather than any one sub-finding. Declared with two widths across files in the catalog (C(1,0) and C(8,0)) - its encoding appears to have changed at some point across the 2009-2015 span rather than being one stable format throughout.

    codelists: ["PRESULPAAF"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf, INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do cancer de mama no Brasil (2010)"
    reasoning: >
      P(uncao) RESUL(tado) PAAF spells out directly, and Figura 9 of the SISMAMA informe reports the result of PAAF exams as exactly these four categories in aggregate.


  CATBIRADS:
    official_name: "Categoria BI-RADS"
    translated_name: "BI-RADS category"
    description: >
      The mammography report's BI-RADS category (0 through 6), the American College of Radiology's standardised reporting scale that SISMAMA/INCA adopted for every mammogram. Category 0 = inconclusive (needs further imaging); 1 = no findings; 2 = benign findings; 3 = probably benign; 4(A/B/C) = suspicious; 5 = highly suggestive of malignancy; 6 = biopsy-proven malignancy, with escalating recommended follow-up from routine screening through biopsy at each step. Bound to codelist CATBIRADS.

    codelists: ["CATBIRADS"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf, INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do cancer de mama no Brasil (2010)"
    reasoning: >
      Tabela 1 of the SISMAMA informe ('Categoria BI-RADS no laudo mamografico e recomendacoes de conduta') gives the category scale and interpretation verbatim.


  CANMMAMOGR:
    official_name: "Risco elevado para cancer de mama"
    translated_name: "Elevated breast-cancer risk flag"
    description: >
      Flag for 'Apresenta risco elevado* para cancer de mama?' on the request forms - elevated risk being defined (verbatim on both the citology-mama form and the SISMAMA informe) as a first-degree relative diagnosed before 50, bilateral breast or any-age ovarian cancer in a first-degree relative, a male relative with breast cancer, or a personal history of proliferative lesion with atypia / lobular neoplasia in situ. This flag drives the recommended screening interval - annual rather than biennial mammography, per Quadro 1 of the informe.

    codelists: ["RISCOELEVADO"]
    code_system: internal
    source: web
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf, INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do cancer de mama no Brasil (2010)"

