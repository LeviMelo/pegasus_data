# DADOS_ABERTOS.DOSES_RESIDENCIA — vaccine doses applied, aggregated by
# patient residence (/dissemin/publicos/Dados_Abertos/SIPNIBD/Doses_Residencia.parquet)
#
# A SI-PNI (Sistema de Informação do Programa Nacional de Imunizações) open-
# data extract, not a SIA/SIASUS file (ADR-0095's DADOS_ABERTOS-inherits-
# SIASUS-curation note is about a different DADOS_ABERTOS series; this one is
# vaccination, curated on its own). One row per combination of year, month,
# residence municipality, strategy, immunobiological, dose, age, race and sex,
# with the number of doses (qt_dose).
#
# Sources. The Ministry publishes no dictionary for this Parquet. It publishes
# one for the per-dose open dataset this file aggregates ("Doses aplicadas pelo
# PNI", Dicionario_tb_ria_rotina.pdf, 60 variables of the RNDS vaccination
# record, https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/dbbni/
# Dicionario_tb_ria_rotina.pdf, read 2026-11-08), whose fields are the same
# concepts under longer names (co_estrategia_vacinacao, co_dose_vacina,
# nu_idade_paciente, co_origem_registro, co_sistema_origem, dt_entrada_datalake).
# Where an entry below cites it, it is a correspondence of names AND of the
# values read, not a statement by the Ministry about this file.
#
# Values. Read 2026-11-08 by ranged requests: three row groups of 100,000 rows
# (row groups 0, 700 and 1500 of 2,362; years 2026, 2024 and 2023). Despite
# their co_ names, co_estrategia, co_racacor, co_sexo and co_transcricao hold
# the LABEL, not a code; co_imuno and co_dose hold an integer code and are
# paired with a label column. So no codelist is bound: the file carries its own.
system: DADOS_ABERTOS
asserted_by: pegasus_data

variables:
  nu_ano:
    official_name: Ano
    translated_name: Year
    description: Calendar year of the vaccination to which the row's doses are attributed (integer, 2023 to 2026 in the rows read).
    code_system: none
    source: inferred
    reasoning: 'Name (nu_ = number) and values (2023, 2024, 2026 in the sample); the per-dose dictionary has no year field, only dt_vacina (Data da vacinação), of which this is the year.'
  nu_mes:
    official_name: Mês
    translated_name: Month
    description: Calendar month (1 to 12) of the vaccination to which the row's doses are attributed.
    code_system: none
    source: inferred
    reasoning: 'Name and values (1, 5 and 9 in the three row groups read); the per-dose dictionary has only dt_vacina (Data da vacinação), of which this is the month.'
  co_municipio:
    official_name: Código IBGE do município de residência do paciente
    translated_name: Municipality IBGE code (residence)
    description: IBGE code, six digits as text, of the municipality of residence of the person vaccinated. Residence, not the place of vaccination.
    code_system: external
    codelist: BR_MUNICIPALFA
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field co_municipio_paciente: "Código IBGE do município de residência do paciente". The aggregate names the same concept co_municipio; all 300,000 values read are six digits.'
  co_estrategia:
    official_name: Estratégia de vacinação
    translated_name: Vaccination strategy
    description: 'The vaccination strategy under which the dose was given, as its name (despite the co_ prefix, not a code): Rotina, Campanha Indiscriminada, Campanha Seletiva, Especial, Pós-exposição, Pré-exposição, Reexposição, Serviço Privado, Soroterapia, Bloqueio, Intensificação, Pesquisa, Vacinação Escolar, Monitoramento das Estratégias de Vacinação; empty in 0.5% of the rows read.'
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), fields co_estrategia_vacinacao / ds_estrategia_vacinacao: "Código da estratégia de vacinação" / "Descrição da estratégia de vacinação". The aggregate carries only the description; the 14 values listed are those read in 300,000 rows, not a published list.'
  co_transcricao:
    official_name: Registro de origem por transcrição
    translated_name: Record transcribed from another source
    description: 'Sim or Não: whether the dose was entered as a transcription of an earlier record rather than registered at application (19,324 of 300,000 rows read are Sim).'
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), fields co_origem_registro / ds_origem_registro: "Código/Descrição que identifica o registro de origem como transcrição". The aggregate holds the Sim / Não description.'
  co_imuno:
    official_name: Código do imunobiológico
    translated_name: Immunobiological code
    description: Integer code of the immunobiological (vaccine, serum or immunoglobulin) of the doses. Its name is ds_imuno and its abbreviation sg_imuno on the same row (e.g. 9 hepatite B, 42 penta, 25 dT, 103 COVID-19 Pfizer bivalente). A code the file never pairs with a name stays unnamed.
    code_system: internal
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), fields co_vacina / sg_vacina / ds_vacina: "Código/Sigla/Descrição da vacina administrada". The pairing of code, name and abbreviation is read from the rows, one name per code in the 300,000 read. Dataset description: 47 immunobiologicals, 30 vaccines, 13 sera and 4 immunoglobulins (dadosabertos.saude.gov.br).'
    notes: 'The file labels itself (ds_imuno, sg_imuno), so no external codelist is bound; the raw code is kept beside the label.'
  ds_imuno:
    official_name: Descrição do imunobiológico
    translated_name: Immunobiological description
    description: Name of the immunobiological identified by co_imuno, in lower case as filed (e.g. "vacina hepatite B", "soro antibotrópico").
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field ds_vacina: "Descrição da vacina administrada".'
  sg_imuno:
    official_name: Sigla do imunobiológico
    translated_name: Immunobiological abbreviation
    description: Abbreviation of the immunobiological identified by co_imuno (e.g. HB, Penta, dT, VR, HPV9), as filed; some are truncated at 20 characters ("COV-19 PFIZER-COMIRN").
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field sg_vacina: "Sigla da vacina administrada".'
  co_dose:
    official_name: Código da dose
    translated_name: Dose code
    description: Integer code of the dose of the vaccine (1 first dose, 2 second, 3 third, 4 fourth, 8 "Dose", 38 "Reforço", 6 first booster, 7 second booster, 10 revaccination, and others); its label is ds_dose on the same row. The codes are the PNI's own, not an ordinal.
    code_system: internal
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), fields co_dose_vacina / ds_dose_vacina: "Código/Descrição da dose da vacina administrada". Code-to-label pairs read from 300,000 rows, one label per code.'
    notes: 'Self-labelling through ds_dose; the raw code is kept. Not bound to the older PNI DOSE.CNV, whose code space was not shown to be the same.'
  ds_dose:
    official_name: Descrição da dose
    translated_name: Dose description
    description: 'Label of the dose identified by co_dose as filed: "1ª Dose", "2ª Dose", "3ª Dose", "4ª Dose", "Dose", "Reforço", "1º Reforço", "2º Reforço", "Revacinação", "Dose Inicial", "Dose Adicional", doubled and treatment doses, and others.'
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field ds_dose_vacina: "Descrição da dose da vacina administrada".'
  nu_idade:
    official_name: Idade do paciente
    translated_name: Age of the patient
    description: Age at vaccination as text, in mixed units. A whole number of years ("34", 85% of the rows read), for infants a number of months with the unit written ("6 meses", "1 mês"; 14% of the rows read), "< 30 dias" (0.04%) and the top band "80 anos ou mais" (1.3%). A numeric age needs the unit read first, and 80+ is a band, not an age.
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field nu_idade_paciente: "Idade do paciente" (VARCHAR). The months form is read from the rows; the dictionary does not state a unit.'
  co_racacor:
    official_name: Raça/cor do paciente
    translated_name: Race/colour of the patient
    description: 'Race/colour as its name (despite the co_ prefix, not a code): BRANCA, PARDA, PRETA, AMARELA, INDIGENA, SEM INFORMACAO (the last for 17% of the rows read), in upper case without accents.'
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), fields co_raca_cor_paciente / no_raca_cor_paciente: "Código/Nome que identifica a raça/cor do paciente". The aggregate holds the name; the six values are those read.'
  co_sexo:
    official_name: Sexo biológico do paciente
    translated_name: Biological sex of the patient
    description: 'Sex as its name (despite the co_ prefix, not a code): Feminino, Masculino or Outros (6 of 300,000 rows read).'
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field tp_sexo_paciente: "Descrição do sexo biológico do paciente". The three values are those read.'
  qt_dose:
    official_name: Quantidade de doses
    translated_name: Dose count
    description: Number of doses applied for the row's combination of year, month, residence municipality, strategy, immunobiological, dose, age, race and sex (integer; 1 in 70% of the rows read, mean 3, largest 4,655). An aggregate, so sum it and never count rows.
    code_system: none
    source: inferred
    reasoning: 'Name (qt_ = quantity), and the grain: the per-dose record has one row per dose, while here a row is a combination of dimensions and qt_dose exceeds 1 in 30% of the 300,000 rows read (up to 4,655). No source states it.'
  sg_sistema_origem:
    official_name: Sistema de origem do registro
    translated_name: Source system of the record
    description: Name of the system that sent the vaccination record to the national base (RNDS), as text despite the sg_ prefix, e.g. "ESUS APS - NACIONAL (OFFLINE)" (46% of the rows read), "NOVO PNI", "PRONTUÁRIO ELETRÔNICO DO CIDADÃO / E-SUS APS", "VACIVIDA", and municipal or commercial systems (266 distinct values in the 300,000 rows read). One system can be written with more than one spelling ("SISTEMA IMUNE WEB", "SISTEMA IMUNEWEB").
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), fields co_sistema_origem / ds_sistema_origem: "Código/Descrição do sistema de origem". The aggregate holds the description; the spellings are those read.'
  dt_carga:
    official_name: Data de carga
    translated_name: Load date
    description: Date the row was loaded into the open-data extract, as text "dd/mm/yyyy 00:00:00" (one value, 03/08/2026, in the 300,000 rows read from three different years). A publishing artefact, not a clinical date.
    code_system: none
    source: web
    source_ref: 'Ministério da Saúde, Dicionário de dados, Doses aplicadas pelo PNI (dbbni/Dicionario_tb_ria_rotina.pdf), field dt_entrada_datalake: "Data e hora de entrada no Datalake", "Dado de controle do Datalake". The same control date; the aggregate keeps the day only.'
