# SISCAN — two unrelated clusters.
#
# 1) The HC (Histopatológico do Colo, per ontology.yml) legacy aggregate file,
#    2006-2015. Nine columns siscan_findings.yml explicitly left out ("the
#    abbreviation does not settle them"); CO_MAT_INS is the one that resolves
#    with real confidence (material insatisfatório), the rest stay
#    deliberately under-specified rather than guessing at a grid this catalog
#    already got wrong once (QTINST, per cnes_rest.yml).
#
# 2) The SISCAN_CITO_COLO_PACNT and SISCAN_CITO_COLO_2013..2018 yearly CSV
#    extracts (cervical cytology, request form and patient dimension) — these
#    have full, unabbreviated Portuguese field names, so they read directly.
#    Declared C(0,0) throughout: these are CSV opendatasus extracts, not
#    fixed-width DBFs, so the catalog has no header width for them.
system: SISCAN
asserted_by: pegasus_data

variables:

  # ---------------------------------------------------- HC file, 2006-2015

  CO_MAT_INS:
    official_name: Material insatisfatório
    translated_name: Unsatisfactory-material flag
    description: >
      Marks that the biopsy specimen was judged inadequate for diagnosis
      (material insatisfatório) — the histopathology counterpart of the
      "unsatisfactory sample" adequacy flag used throughout SISCAN cytology
      reporting.
    code_system: internal
    source: inferred
    reasoning: >
      MAT_INS is a transparent contraction of "material insatisfatório," a
      standard Brazilian pathology-reporting adequacy term; C(1) fits a
      flag, and HC is the cervical-histopathology series.
    notes: No observed values were captured to confirm the flag's exact coding.

  CO_COLP_PO:
    translated_name: Colposcopy-related field (HC file)
    description: >
      Likely records a colposcopy finding paired with this biopsy's
      histopathology result — COLP abbreviates colposcopia — but what "PO"
      narrows it to (positiva? pós?) is not established.
    code_system: none
    source: inferred
    reasoning: >
      COLP is a standard abbreviation for colposcopia, the procedure that
      guides where a cervical biopsy is taken from; C(8) matches this file's
      count-field convention (siscan_findings.yml), but "PO" does not
      resolve with confidence.
    notes: >
      DELIBERATELY UNDER-SPECIFIED — already flagged unresolved in
      siscan_findings.yml; no observed values or codelist exist for it.

  CCOLDEFAUL:
    translated_name: HC file field (meaning not established)
    description: >
      An 8-character field on the HC aggregate file. Its abbreviation does
      not resolve to a specific finding with confidence; by this file's
      convention its C(8) width suggests a count rather than a flag.
    code_system: none
    source: inferred
    reasoning: >
      Sits among the confirmed C(8) count fields on the same HC file
      (siscan_findings.yml's CNODCALD cluster), whose header states these
      files "aggregate exams" so C(8) columns are counts — but the name
      itself does not decompose cleanly.
    notes: >
      DELIBERATELY UNDER-SPECIFIED — already flagged unresolved in
      siscan_findings.yml ("the abbreviation does not settle them").

  CO_CTRL_BL:
    translated_name: Control code (HC file, "BL")
    description: >
      A 2-character control code on the HC file, paired with CO_CTRL_FR —
      CTRL abbreviates controle, but what BL and FR each track (block or
      fragment numbering, or something else) is not established.
    code_system: none
    source: inferred
    reasoning: >
      CTRL is DATASUS's standard "controle" abbreviation; C(2) fits a short
      code rather than a count; sits directly beside CO_CTRL_FR.
    notes: >
      DELIBERATELY UNDER-SPECIFIED — no observed values, dictionary entry
      or documentation resolves BL/FR.

  CO_CTRL_FR:
    translated_name: Control code (HC file, "FR")
    description: >
      The counterpart of CO_CTRL_BL on the same HC file — a 2-character
      control code whose specific referent is not established.
    code_system: none
    source: inferred
    reasoning: Same CTRL_ pairing as CO_CTRL_BL; C(2), sits directly beside it.
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_CTRL_BL.

  CO_EXTEN_C:
    translated_name: Extensão field, HC file (variant C)
    description: >
      One of four EXTEN-stem fields on the HC file (C/L/P/V variants);
      EXTEN plausibly abbreviates extensão, but which specific attribute
      each of the four single-letter variants records is not established.
    code_system: none
    source: inferred
    reasoning: >
      EXTEN is a plausible abbreviation of extensão; C(1) width, shared
      stem with CO_EXTEN_L/P/V.
    notes: >
      DELIBERATELY UNDER-SPECIFIED — the four variants' widths differ (C1,
      C8, C4, C1), so they are not simple parallel flags; no observed
      values exist for any of them.

  CO_EXTEN_L:
    translated_name: Extensão field, HC file (variant L)
    description: >
      The C(8)-wide variant of the EXTEN-stem cluster (see CO_EXTEN_C) —
      wide enough to be a count or a short code, unlike its C(1)/C(4)
      siblings.
    code_system: none
    source: inferred
    reasoning: Same EXTEN_ stem as CO_EXTEN_C/P/V; widest of the four (C8).
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_EXTEN_C.

  CO_EXTEN_P:
    translated_name: Extensão field, HC file (variant P)
    description: The C(4)-wide variant of the EXTEN-stem cluster (see CO_EXTEN_C).
    code_system: none
    source: inferred
    reasoning: Same EXTEN_ stem as CO_EXTEN_C/L/V; C(4) width.
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_EXTEN_C.

  CO_EXTEN_V:
    translated_name: Extensão field, HC file (variant V)
    description: >
      The second C(1)-wide variant of the EXTEN-stem cluster (see
      CO_EXTEN_C), alongside CO_EXTEN_C.
    code_system: none
    source: inferred
    reasoning: Same EXTEN_ stem as CO_EXTEN_C/L/P; C(1) width like CO_EXTEN_C.
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_EXTEN_C.

  # ---------------------------------------- SISCAN_CITO_COLO, 2013-2018/2019

  CO_PERIODO_PREVENTIVO:
    official_name: Período preventivo
    translated_name: Preventive-exam periodicity/interval code
    description: >
      Code for the recommended screening-interval category applied to this
      cervical cytology exam (e.g. routine annual/triennial screening vs.
      an earlier-than-routine repeat) — part of the request form's
      screening-history section.
    code_system: internal
    source: inferred
    reasoning: >
      Full-word Portuguese field name (período preventivo, "preventive[-
      exam] period"), on the SISCAN_CITO_COLO yearly extracts alongside
      TP_MOTIVO_EXAME (exam reason).
    notes: >
      Declared C(0,0) — a CSV yearly-extract column, not a fixed-width DBF
      field; no observed values were captured.

  ST_DENTRO_LIMITE_NORMALIDADE:
    official_name: Dentro dos limites da normalidade
    translated_name: Result within normal limits (DLN) flag
    description: >
      Whether the cytology result was classified "dentro dos limites da
      normalidade" (DLN) — the standard category for a normal, non-atypical
      smear, as opposed to any abnormal-finding category.
    code_system: internal
    source: inferred
    reasoning: >
      "Dentro do limite de normalidade" is the standard nomenclature
      category for a normal Pap result in Brazilian cervical cytology; ST_
      is this dataset's status-flag prefix.
    notes: Declared C(0,0); no observed values captured.

  ST_REPRESENTATI_ZONA_TRANSFORM:
    official_name: Representatividade da zona de transformação
    translated_name: Transformation-zone representativity flag
    description: >
      Whether the transformation zone — where most cervical lesions arise —
      is represented in the collected sample, a standard specimen-adequacy
      criterion reported alongside DLN status.
    code_system: internal
    source: inferred
    reasoning: >
      "Representatividade da zona de transformação" (ZT/JEC representation)
      is standard Brazilian cytology-adequacy terminology; ST_ status-flag
      prefix.
    notes: Declared C(0,0); no observed values captured.

  ST_SCREENING_REALIZADO:
    official_name: Screening realizado
    translated_name: Automated screening performed flag
    description: >
      Whether the slide underwent computer-assisted ("automated")
      pre-screening before manual review — a lab-process flag, not a
      clinical finding.
    code_system: internal
    source: inferred
    reasoning: >
      "Screening realizado" reads literally; ST_ status-flag prefix
      consistent with its siblings in this batch.
    notes: Declared C(0,0); no observed values captured.

  ST_SINAL_SUGESTIVO_DST:
    official_name: Sinal sugestivo de DST
    translated_name: Sign suggestive of an STD flag
    description: >
      Whether the cytology specimen showed cellular changes suggestive of a
      sexually transmitted disease (e.g. Chlamydia, Trichomonas, HSV) — a
      finding category distinct from the neoplastic/pre-neoplastic ones.
    code_system: internal
    source: inferred
    reasoning: >
      "Sinal sugestivo de DST" reads literally as a standard cytology
      finding category; ST_ status-flag prefix.
    notes: Declared C(0,0); no observed values captured.

  TP_MOTIVO_EXAME:
    official_name: Motivo do exame
    translated_name: Reason for the exam (type)
    description: >
      Why this cervical cytology exam was requested — e.g. routine
      screening versus a repeat after a prior unsatisfactory or abnormal
      result. A standard field on the SISCAN cytology request form.
    code_system: internal
    source: inferred
    reasoning: Full-word Portuguese decomposition (tipo + motivo do exame); TP_ type-code prefix.
    notes: Declared C(0,0); no observed values captured.

  TP_RESP_EXAME_PREVENTIVO_REALI:
    official_name: Responsável pelo exame preventivo realizado
    translated_name: Type of professional who collected the exam
    description: >
      Category of health professional (e.g. physician, nurse) who performed
      the specimen collection for this preventive (cytology) exam — REALI
      is "realizado" truncated to the field-name limit.
    code_system: internal
    source: inferred
    reasoning: >
      Full-word decomposition (tipo + responsável + exame preventivo
      realizado); pairs with TP_MOTIVO_EXAME on the same request-form
      section.
    notes: Declared C(0,0); no observed values captured.

  NU_EXAME_ALTERADO:
    official_name: Número de exames alterados
    translated_name: Count of altered (abnormal) exam results
    description: >
      Count of cytology exams in this row's aggregation with an abnormal
      ("alterado") result — the complement of the normal category recorded
      in ST_DENTRO_LIMITE_NORMALIDADE.
    code_system: none
    source: inferred
    reasoning: NU_ is this dataset's count prefix; "exame alterado" is standard for an abnormal result.
    notes: Declared C(0,0); no observed values captured.

  CO_SEQ_SISCAN_CITO_COLO_PACNT:
    official_name: Sequencial SISCAN citopatologia colo (paciente)
    translated_name: Record sequence number (cervical-cytology patient extract)
    description: >
      Row-sequence identifier on the SISCAN_CITO_COLO_PACNT (patient-
      dimension) yearly extract — this table's own row number, not a
      national patient identifier.
    code_system: none
    source: inferred
    reasoning: >
      CO_SEQ_SISCAN_* is this catalog's recurring row-identifier pattern
      across every SISCAN yearly extract (six near-identical PACNT/RESID
      variants across this fill batch alone); PACNT marks the patient-
      dimension table per SISCAN.PACNT in ontology.yml.
    notes: Declared C(0,0); no observed values captured.

  IDADE:
    official_name: Idade
    translated_name: Patient age
    description: >
      Patient's age, in years, at the time of this cervical cytology exam —
      on the patient-dimension extract.
    code_system: none
    source: inferred
    reasoning: IDADE is the plain, unabbreviated Portuguese word for age.

  TP_INSPECAO_COLO:
    official_name: Tipo de inspeção do colo
    translated_name: Type of cervical (visual) inspection
    description: >
      Category of visual cervical inspection performed alongside the
      cytology collection — e.g. whether the cervix appeared normal,
      altered, or was not visualised.
    code_system: internal
    source: inferred
    reasoning: Full-word decomposition (tipo + inspeção do colo); TP_ type-code prefix.
    notes: Declared C(0,0); no observed values captured.
