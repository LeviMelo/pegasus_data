system: SINAN
asserted_by: pegasus_data

variables:

  CS_LIQUOR:
    official_name: Coleta - líquor
    translated_name: Specimen collected - CSF
    description: >
      Sim/Não flag for whether a cerebrospinal fluid (líquor) sample was
      collected for laboratory testing, part of a specimen-collection
      checklist alongside CS_SECRECA and CS_URINA.
    code_system: none
    source: inferred
    reasoning: >
      LIQUOR is CSF; the CS_ prefix here marks specimen collection rather
      than the classificação/situação sense it carries in CS_MENING, and it
      clusters with two other named-specimen flags of identical shape.

  CS_SECRECA:
    official_name: Coleta - secreção
    translated_name: Specimen collected - secretion
    description: >
      Sim/Não flag for whether a secretion sample was collected, sibling of
      CS_LIQUOR and CS_URINA in the same specimen-collection checklist.
    code_system: none
    source: inferred
    reasoning: Same evidence as CS_LIQUOR.

  CS_URINA:
    official_name: Coleta - urina
    translated_name: Specimen collected - urine
    description: >
      Sim/Não flag for whether a urine sample was collected, sibling of
      CS_LIQUOR and CS_SECRECA.
    code_system: none
    source: inferred
    reasoning: Same evidence as CS_LIQUOR.

  CS_VACINAL:
    official_name: Situação vacinal
    translated_name: Vaccination status
    description: >
      Code/flag for the patient's vaccination status against the disease
      under investigation, distinct from the specimen-collection CS_ fields
      (CS_LIQUOR/CS_SECRECA/CS_URINA) — here CS_ carries its usual
      classificação/situação sense.
    code_system: none
    source: inferred
    reasoning: VACINAL reads vacinal; 1-character width matches a short status code.

  DG_OUT_N:
    official_name: Diagnóstico outro (nome)
    translated_name: Other diagnosis (name)
    description: >
      Free-text name of a diagnosis not covered by the form's standard
      diagnosis codelist.
    code_system: none
    source: inferred
    reasoning: >
      DG abbreviates diagnóstico; OUT_N matches SINAN's "other, name it"
      free-text pattern, at 30-character width.

  DIAS:
    official_name: Dias
    translated_name: Days
    description: >
      Numeric day-count field (e.g. days of symptoms, incubation, or
      hospitalization); the exact reference period is not resolved from
      available evidence.
    code_system: none
    source: inferred
    reasoning: DIAS reads days; 2-character width fits a small day count.

  DISFAGIA:
    official_name: Disfagia
    translated_name: Dysphagia
    description: >
      Sim/Não flag for dysphagia (difficulty swallowing), a symptom common
      to neurological/toxin-mediated agravo forms such as Botulismo, Tétano
      or Raiva Humana.
    code_system: none
    source: inferred
    reasoning: DISFAGIA is a direct clinical term; 1-character width matches a binary flag.

  DSALIMENTO:
    official_name: Descrição do alimento
    translated_name: Food description
    description: >
      Free-text description of a food item implicated in a foodborne-illness
      investigation, part of the same block as DSCAUSALIM and the DS_ALI1/2
      food-item fields.
    code_system: none
    source: inferred
    reasoning: >
      DS abbreviates descrição and ALIMENTO is food; 30-character width fits
      free text.

  DSCARDIOP:
    official_name: Descrição - cardiopatia
    translated_name: Description - cardiac condition
    description: >
      Free-text description of a cardiac comorbidity (cardiopatia) recorded
      for the patient.
    code_system: none
    source: inferred
    reasoning: DSCARDIOP contracts descrição + cardiopatia; 30-character free text.

  DSCAUSALIM:
    official_name: Descrição - causa alimentar
    translated_name: Description - food-related cause
    description: >
      Free-text description of the suspected food-related cause of illness,
      sibling of DSALIMENTO in the same foodborne-illness investigation
      block.
    code_system: none
    source: inferred
    reasoning: DSCAUSALIM contracts descrição + causa + alimentar; 30-character free text.

  DS_ALI1:
    official_name: Descrição - alimento (1)
    translated_name: Description - food item (1)
    description: >
      Free-text name of the first food item suspected in a foodborne-illness
      outbreak; DS_ALI1OUT holds an "other" elaboration for this same slot,
      and DS_ALI2/DS_ALI2OUT are the parallel second-item fields.
    code_system: none
    source: inferred
    reasoning: >
      ALI abbreviates alimento; the 1/2 numbering and paired OUT suffix match
      SINAN's repeated-instance "other, specify" pattern.

  DS_ALI1OUT:
    official_name: Descrição - alimento (1), outro
    translated_name: Description - food item (1), other
    description: >
      Free-text "other" detail for the first food item, used when DS_ALI1's
      standard entry does not cover the case; see DS_ALI1.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_ALI1.

  DS_ALI2:
    official_name: Descrição - alimento (2)
    translated_name: Description - food item (2)
    description: >
      Free-text name of the second suspected food item; parallel to DS_ALI1,
      with DS_ALI2OUT as its own "other" detail field.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_ALI1; distinguished only by item number.

  DS_ALI2OUT:
    official_name: Descrição - alimento (2), outro
    translated_name: Description - food item (2), other
    description: >
      Free-text "other" detail for the second food item; see DS_ALI2.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_ALI1.

  DS_FIM_GES:
    official_name: Descrição - fim da gestação
    translated_name: Description - end of pregnancy
    description: >
      Short code for how a recorded pregnancy ended (e.g. delivery,
      miscarriage), sibling of DS_INI_GES which marks its start.
    code_system: none
    source: inferred
    reasoning: >
      FIM_GES contracts fim + gestação; 4-character width matches a short
      coded category rather than a date or free text.

  DS_FORMA:
    official_name: Descrição da forma
    translated_name: Description of form/manner
    description: >
      Free-text description of the form or manner of a condition or exposure
      recorded on the case; the exact sub-question is not resolved from
      available evidence.
    code_system: none
    source: inferred
    reasoning: DS_FORMA contracts descrição + forma; 30-character free text.

  DS_INDUS:
    official_name: Descrição - indústria
    translated_name: Description - industry
    description: >
      Free-text name of the industry or workplace sector, likely from an
      occupational-disease (Doença Relacionada ao Trabalho) investigation.
    code_system: none
    source: inferred
    reasoning: INDUS abbreviates indústria; 30-character free text.

  DS_INGEST:
    official_name: Descrição - ingestão
    translated_name: Description - ingestion
    description: >
      Short code recording ingestion as an exposure route (e.g. of a food,
      toxin or medication), distinct from the free-text DS_ fields around
      it by its narrow 4-character width.
    code_system: none
    source: inferred
    reasoning: INGEST abbreviates ingestão; 4-character width fits a coded route rather than free text.

  DS_INI_GES:
    official_name: Descrição - início da gestação
    translated_name: Description - start of pregnancy
    description: >
      Short code marking the start of a recorded pregnancy; see DS_FIM_GES
      for its end-of-pregnancy sibling.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_FIM_GES.

  DS_LOCAL1:
    official_name: Descrição - local (1)
    translated_name: Description - location (1)
    description: >
      Free-text description of a first exposure/consumption location, wider
      (30 characters) than the coded location fields (e.g. DS_TRANS1) seen
      elsewhere, so it holds a place description rather than a place code.
    code_system: none
    source: inferred
    reasoning: >
      30-character width rules out an IBGE code; paired with DS_LOCAL2 as a
      second slot.

  DS_LOCAL2:
    official_name: Descrição - local (2)
    translated_name: Description - location (2)
    description: >
      Free-text description of a second exposure/consumption location; see
      DS_LOCAL1.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_LOCAL1; distinguished only by ordinal position.

  DS_OUTRO:
    official_name: Descrição - outro
    translated_name: Description - other
    description: >
      Generic free-text "other, specify" field not tied to a specific
      checklist item elsewhere on the form.
    code_system: none
    source: inferred
    reasoning: DS_OUTRO is the plainest form of SINAN's recurring other/specify pattern.

  DS_OUTROSI:
    official_name: Descrição - outros
    translated_name: Description - others
    description: >
      Another free-text "other, specify" field distinct from DS_OUTRO; the
      trailing "SI" does not resolve to a clear sub-category from available
      evidence.
    code_system: none
    source: inferred
    reasoning: Same free-text width and outro/descrição pattern as DS_OUTRO, but a separate field name.

  DS_OUTR_LO:
    official_name: Descrição - outro local
    translated_name: Description - other location
    description: >
      Free-text field for a location not covered by the form's standard
      location options.
    code_system: none
    source: inferred
    reasoning: OUTR_LO contracts outro + local; 30-character free text.

  DS_PARES:
    official_name: Descrição - pares cranianos
    translated_name: Description - cranial nerve pairs
    description: >
      Free-text note on cranial-nerve-pair involvement from a neurological
      exam, plausible on a Raiva Humana, Botulismo or Guillain-Barré related
      investigation.
    code_system: none
    source: inferred
    reasoning: >
      PARES most plausibly abbreviates "pares cranianos", a standard
      neurological-exam term; 30-character width fits a short free-text note.
