      0 Ignorado, 1 Sim, 2 Não. In the 1979–1995-vintage layout; part of the same maternal
      death concept the 1996+ layout splits across OBITOGRAV/OBITOPARTO/OBITOPUERP.
    code_system: internal
    codelists: [OBITOFE1]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 36 "OBITOFE1 | C 8 | Para óbitos femininos em idade fertil, indica
      se estava gravida no momento da morte, conforme a tabela: 0: Ignorado 1: Sim 2: Não |
      1979 (C 8)"

  OBITOFE2:
    official_name: Óbito e gravidez (12 meses antes)
    translated_name: Pregnant within 12 months before death (women of fertile age)
    description: >
      For a female decedent of fertile age, whether she had been pregnant at any point in the
      12 months before death: 0 Ignorado, 1 Sim, 2 Não. In the 1979–1995-vintage layout — the
      companion field to OBITOFE1, capturing maternal deaths up to a year post-partum rather
      than only deaths during pregnancy itself.
    code_system: internal
    codelists: [OBITOFE2]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 37 "OBITOFE2 | C 8 | Para óbitos femininos em idade fertil, indica
      se esteve gravida nos 12 meses anteriores a morte, conforme a tabela: 0: Ignorado
      1: Sim 2: Não | 1979 (C 8)"

  # ------------------------------------------------------------ investigation & data-quality

  FONTE:
    official_name: Fonte de informação
    translated_name: Information source for accident/violence details
    description: >
      Where the information used to fill in the accident/violence-circumstance fields on the
      DO came from: 1 Ocorrência policial (police report/Boletim de Ocorrência), 2 Hospital,
      3 Família, 4 Outra, 9 Ignorado. Introduced 1996, superseding FONTINFO.
    code_system: internal
    codelists: [FONTINFO, FONTE]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 75 "FONTE | C 5 | fonte de informação utilizada para o
      preenchimento dos campos 48 e 49. (1 – ocorrência policial; 2 – hospital; 3 – família;
      4 – outra; 9 – ignorado) | 1996 (C 5)"
    notes: >
      "Campos 48 e 49" refers to the paper DO form's own field numbers, not this table's
      column layout — do not confuse with UFINFORM or any other position-48/49 column here.

  ALTCAUSA:
    official_name: Alteração da causa
    translated_name: Cause of death altered after investigation
    description: >
      Whether the recorded cause of death was corrected or changed as a result of a formal
      death investigation: 1 Sim, 2 Não. Introduced 2014, part of SIM's investigation
      workflow.
    code_system: internal
    codelists: [SIMNAO1]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 132 "ALTCAUSA | C 8 | Indica se houve correção ou alteração da
      causa do óbito após investigação. (1- Sim; 2 – Não) | 2014 (C 8)"

  ESCFALAGR1:
    official_name: Escolaridade do falecido agregada
    translated_name: Deceased's education level (aggregated, 2010+ form)
    description: >
      Highest school level completed by the deceased, under the aggregated categories used
      on the DO form from 2010 onward: 00 Sem Escolaridade, 01 Fundamental I Incompleto,
      02 Fundamental I Completo, 03 Fundamental II Incompleto, 04 Fundamental II Completo,
      05 Ensino Médio Incompleto, 06 Ensino Médio Completo, 07 Superior Incompleto,
      08 Superior Completo, 09 Ignorado, 10 Fundamental I Incompleto ou Inespecífico,
      11 Fundamental II Incompleto ou Inespecífico, 12 Ensino Médio Incompleto ou
      Inespecífico.
    code_system: internal
    codelists: [ESCAGR1, ESCAGR2]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 108 "ESCFALAGR1 | C 10 | Escolaridade do falecido agregada
      (formulário a partir de 2010). (00 – Sem Escolaridade; 01 – Fundamental I Incompleto;
      02 – Fundamental I Completo; 03 – Fundamental II Incompleto; 04 – Fundamental II
      Completo; 05 – Ensino Médio Incompleto; 06 – Ensino Médio Completo; 07 – Superior
      Incompleto; 08 – Superior Completo; 09 – Ignorado; 10 – Fundamental I Incompleto ou
      Inespecífico; 11 – Fundamental II Incompleto ou Inespecífico; 12 – Ensino Médio
      Incompleto ou Inespecífico) | 2012 (C 10)"
    notes: >
      Codes 10–12 are "incomplete-or-unspecified" catch-alls added alongside the clean
      complete/incomplete pairs (01–08) — a record coded 10 could be either "incomplete" or
      simply "level unspecified," so 10–12 are not directly comparable to the matching
      01/03/05 "incomplete" codes as a clean ordinal scale.

  SERIESCFAL:
    official_name: Série escolar do falecido
    translated_name: Deceased's last completed school grade/series
    description: >
      Last school grade ("série") the deceased completed, as a single digit 1–8, collected
      from 2012 alongside ESCFALAGR1. DATASUS's own layout does not spell out what each of
      1–8 corresponds to (e.g. which grade "5" is) beyond "número de 1 a 8" — treat it as an
      ordinal position within schooling, not a decoded label.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 106 "SERIESCFAL | C 10 | Última série escolar concluída pelo
      falecido. (Números de 1 a 8) | 2012 (C 10)"; corroborated by [PCDAS-SIM]: "Série
      escolar do falecido. Valores de 1 a 8."

  NUDIASOBIN:
    official_name: Número de dias óbito-investigação
    translated_name: Days from death to investigation opening
    description: >
      A day-count field in SIM's investigation-timeliness family, alongside the documented
      NUDIASOBCO ("Diferença entre a data óbito e a data conclusão da investigação, em
      dias"). By the parallel naming (…OBIN vs …OBCO), this measures days between the date of
      death and when the investigation began, rather than when it concluded. Introduced 2012.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists NUDIASOBIN at position 116 with a blank description (2012, C 10),
      but its documented sibling NUDIASOBCO (position 126, same 2012 vintage) is described as
      the death-to-investigation-conclusion day count, and the catalog's bound codelist
      DIASINVEST1 labels values around 110–120 as "Até 120 dias (invest oportuna)" — "up to
      120 days = timely investigation" — which fits a days-to-investigation measure and
      matches the observed value range (097–120 dominating the top values) closely.
    notes: >
      The DIASINVEST1 binding is a timeliness banding derived from this day count for
      tabulation, not an independent code system — see spurious_bindings; keep the number.

  FONTESINF:
    official_name: Fontes de investigação (combinado)
    translated_name: Combined investigation-source flags
    description: >
      A fixed-width string of S/X flags, one per investigation-source sub-field (interview,
      ambulatory record, hospital chart, SVO, IML, professional record, etc.) — "S" if that
      source was used, "X" if it was left blank. Introduced 2014.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists FONTESINF at position 131 with a blank description (2014, C 9),
      but its documented sibling FONTES (position 127, same 2014 vintage) is described
      exactly this way: "Combinado de caracteres conforme o preenchimento dos campos de
      fontes (FONTENTREV, FONTEAMBUL, FONTEPRONT, FONTESVO, FONTEIML, FONTEPROF): se
      preenchido caractere 'S', se o campo estiver vazio caractere 'X'." Observed FONTESINF
      values in this batch are 7-character strings built entirely from S and X (e.g.
      "XXXXXXX", "SXSSXXX"), the same construction FONTES describes, just one character
      longer than FONTES's documented 6.
    notes: >
      Which seventh source the extra character represents is not confirmed here — treat the
      string positionally rather than assuming it maps one-for-one onto the six sources named
      for FONTES.

  ESTABDESCR:
    official_name: Descrição do estabelecimento
    translated_name: Health facility name (free text)
    description: >
      Free-text name of the health establishment associated with the death (e.g. "HOSPITAL
      DAS CLINICAS DA FMUSP"), introduced 2014. A textual fallback/supplement alongside the
      coded CODESTAB field, useful when no CNES match was available.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists ESTABDESCR at position 118 with a blank description (2014, widths
      10→19→40), but the name decomposes plainly as ESTAB(elecimento) + DESCR(ição), and
      every observed value in the evidence is a plausible free-text hospital/facility name.

  # -------------------------------------------------- CID-10 lines, original (pre-recoding)
  # ESTRUTURA-SIM documents LINHAA/LINHAB/LINHAC/LINHAD/LINHAII directly (the DO's cause-of-
  # death lines A–D plus Part II). This batch instead carries the "_O" variants. The "_O =
  # original" suffix is independently confirmed elsewhere in the same document: CAUSABAS_O is
  # documented as "Causa básica informada antes da resseleção" — the value *before* DATASUS's
  # automatic cause-of-death reselection logic runs. By the same convention, LINHA*_O holds
  # what was actually typed on each line before recoding, as opposed to any recoded value.

  LINHAA_O:
    official_name: Linha A (original)
    translated_name: Death certificate line A cause, as originally entered
    description: >
      CID-10 code(s) entered on Line A of the death certificate (the direct/terminal cause of
      death) as originally recorded, before any automatic recoding/reselection. Seen only in
      DOFET files in this batch, where the observed codes are almost entirely ICD-10 Chapter
      XVI "P" perinatal codes (e.g. "P20.9", written with the ICD dagger-asterisk "*" prefix)
      — expected for fetal deaths.
    code_system: external
    codelists: [CID1017]
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] documents the base field LINHAA (no suffix) at position 69 as "CIDs
      informados na Linha A da DO ... (causa terminal - doença ou estado mórbido que causou
      diretamente a morte). (Códigos CID 10)." The "_O" suffix is not itself documented for
      LINHAA, but the same document confirms "_O = original, pre-reselection" for CAUSABAS_O
      at position 83 ("Causa básica informada antes da resseleção"), and observed LINHAA_O
      values are well-formed asterisk-prefixed CID-10 codes.
    notes: >
      The leading "*" is ICD-10's own dagger-asterisk notation for an asterisk (manifestation)
      code, not a data artefact — do not strip it before treating the rest as a plain CID-10
      code.

  LINHAB_O:
    official_name: Linha B (original)
    translated_name: Death certificate line B cause, as originally entered
    description: >
      CID-10 code(s) entered on Line B of the death certificate (the antecedent/consequential
      cause that produced the Line A condition) as originally recorded, before recoding. Same
      "_O = original" pattern as LINHAA_O; seen only in DOFET files.
    code_system: external
    codelists: [CID1017]
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Same basis as LINHAA_O: base field LINHAB is documented at [ESTRUTURA-SIM] position 70
      ("CIDs informados na Linha B da DO ... (Códigos CID 10)"), and the "_O" suffix follows
      the CAUSABAS_O "original, pre-reselection" pattern documented elsewhere in the same
      layout.

  LINHAC_O:
    official_name: Linha C (original)
    translated_name: Death certificate line C cause, as originally entered
    description: >
      CID-10 code(s) entered on Line C of the death certificate as originally recorded,
      before recoding. Same "_O = original" pattern as LINHAA_O; seen only in DOFET files.
    code_system: external
    codelists: [CID1017]
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Same basis as LINHAA_O: base field LINHAC is documented at [ESTRUTURA-SIM] position 71
      ("CIDs informados na Linha C da DO ... (Códigos CID 10)"), with the same "_O" suffix
      pattern.

