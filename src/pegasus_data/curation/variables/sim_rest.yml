# SIM — remaining columns (batch: files-descending, offset 0, limit 80; 66 columns returned).
#
# SIM = Sistema de Informações sobre Mortalidade, DATASUS's national death-registration
# system. The record is the Declaração de Óbito (DO), Brazil's death certificate. Series
# seen in this batch: DO (general), DOEXT (external-cause deaths), DOFET (fetal deaths),
# DOINF (infant deaths), DOMAT (maternal deaths), DOREXT (a 2021+ extension carrying
# cartório/alteration audit-trail fields), DOR/DORIG (the legacy 1979–1995 file format).
#
# A recurring shape in this batch: SIM was restructured in 1996, and again around
# 2010–2014 (when a formal death-investigation workflow was added). Several columns here
# are the *pre-1996* names for concepts that were renamed at that restructuring — e.g.
# TIPOGRAV/TIPOPARTO/ESTCIVIL/INSTRUCAO/SEMANGEST/PESONASC/FILHVIVOS/FILHMORT/FONTINFO
# (1979-vintage) versus GRAVIDEZ/PARTO/ESTCIV/ESC/GESTACAO/PESO/QTDFILVIVO/QTDFILMORT/FONTE
# (1996-vintage, mostly outside this batch). The legacy names live only in the DOR/DOEXT/
# DOFET/DOINF/DORIG files spanning 1979–1995 (or occasionally later where a series kept the
# old name for backward compatibility). This is noted per-field rather than asserted once,
# since it is exactly the kind of thing a naive coalesce gets wrong.
#
# Provenance shorthand used in source_ref below:
#   [ESTRUTURA-SIM]  CGIAE/DASNT/SVS, Ministério da Saúde, "Estrutura do SIM" — the
#                     official field-by-field layout (position, name, type/width across
#                     vintages, description), homologated by CGIAE's technical area.
#                     https://diaad.s3.sa-east-1.amazonaws.com/sim/Mortalidade_Geral+-+Estrutura.pdf
#                     Quoted lines below give the field's stated position and description.
#   [PCDAS-SIM]       Fiocruz/ICICT PCDaS, "Sistema de Informação sobre Mortalidade – SIM",
#                     dicionário de variáveis (corroborating web source, used alongside
#                     ESTRUTURA-SIM for SERIESCFAL).
#                     https://pcdas.icict.fiocruz.br/conjunto-de-dados/sistema-de-informacoes-de-mortalidade-sim/dicionario-de-variaveis/
#
# Columns left out of this file (evidence too thin to describe honestly — see report):
#   TPASSINA, CB_ALT, NUDIASINF, TP_ALTERA.
system: SIM
asserted_by: pegasus_data
variables:

  # -------------------------------------------------------------- technical / bookkeeping

  CONTADOR:
    official_name: Contador
    translated_name: Record counter
    description: >
      A sequential counter DATASUS attaches to each row of a SIM extract. It is the first
      field in the record layout and carries no epidemiological content — it exists to give
      every row a position within its own file, not to identify a death across files or over
      time.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists CONTADOR at position 1 of the DO layout with no description text
      at all (1979, C 8) — the only field in the whole layout with a completely blank
      description. Two structurally similar undocumented fields sitting a few positions away,
      CRITICA and NUMEXPORT, are both explicitly described there as "Dado para controle
      interno" (data for internal control), which is the same category position-1-blank-name
      pattern points to. It is also the single most common field in this batch (1,524 of the
      files carrying any of these 66 columns), consistent with a boilerplate technical column
      DATASUS stamps onto essentially every extract rather than a substantive DO field.
    notes: >
      Do not use this as a cross-file or cross-vintage identifier for a specific death —
      nothing in the layout or the observed values (small integers that reset in range from
      file to file) supports that. The catalog's MUNICBR binding on this column is a
      semantic-match false positive, not a real relationship — see spurious_bindings.

  CRITICA:
    official_name: Crítica
    translated_name: Internal edit/QA flag
    description: >
      An internal data-quality control code from the 1979–1995 legacy layout — DATASUS's own
      documentation gives it no further meaning than "data for internal control." Present
      only in DOR-era files (1979–1995/1998 depending on series).
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 44 "CRITICA | C 7 | Dado para controle interno | 1979 (C 7)"
    notes: >
      DATASUS never documents what the individual codes mean, so do not attempt to decode
      specific values (e.g. "001", "002") — the source itself treats this as opaque.

  NUMEXPORT:
    official_name: Número de exportação
    translated_name: Export batch control number
    description: >
      Another internal-control field from the 1979–1995 legacy layout, alongside CRITICA —
      DATASUS's own documentation describes it only as "data for internal control," most
      likely an export/batch marker from whatever process produced the historical file.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 45 "NUMEXPORT | C 9 | Dado para controle interno | 1979 (C 9)"
    notes: >
      As with CRITICA, no table of value meanings is documented anywhere consulted; treat
      individual codes as opaque.

  UFINFORM:
    official_name: UF informante
    translated_name: Reporting state (UF) code
    description: >
      IBGE/UF code of the state health department that transmitted this record to DATASUS.
      This is the *reporting* jurisdiction, which is administrative and does not have to
      match the state where the death occurred or where the deceased lived — a record can be
      reprocessed and resubmitted by a UF other than either of those.
    code_system: external
    codelists: [UF, BR_UF, UFC]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 48 "UFINFORM | C 8 | Código da UF que informou o registro. |
      1979 (C 8)"

  # ----------------------------------- locally-assigned codes ("não faz parte da base nacional")
  # These share one documented caveat in ESTRUTURA-SIM: each is assigned independently by the
  # reporting state/municipality, and none of them is standardized at national level. Only
  # present in the 1979–1995/1996–2010-vintage legacy files.

  AREARES:
    official_name: Área de residência
    translated_name: Residence sub-area code
    description: >
      A locally-assigned code for a residence area/district finer than the municipality,
      carried only in the 1979–1995-vintage files. Positioned immediately next to BAIRES
      (neighborhood of residence) in the record layout and almost certainly shares its
      caveat — assigned independently by each state/municipality, with no national lookup.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists AREARES at position 16 with a blank description (1979, C 7), but
      it sits immediately after BAIRES (position 15), which IS documented: "Bairro de
      residencia. Este codigo e atribuido por cada estado e/ou municipio, nao fazendo parte
      da base nacional." The area/bairro name pairing and adjacent layout position are the
      basis for treating this the same way.
    notes: >
      No codelist survives for this column in the catalog; treat any code value as
      uninterpretable outside the municipality that assigned it.

  BAIRES:
    official_name: Bairro de residência
    translated_name: Neighbourhood of residence (locally coded)
    description: >
      Neighbourhood/district of the deceased's residence, in the 1979–1995-vintage layout.
      The code is assigned independently by each state or municipality — it is not a
      national code and has no single national lookup table. Superseded from 1996 by
      CODBAIRES under a different (also locally-assigned) numbering.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 15 "BAIRES | C 6 | Bairro de residencia. Este codigo e atribuido
      por cada estado e/ou municipio, nao fazendo parte da base nacional | 1979 (C 6)"
    vintage_note: >
      1979–1995-vintage legacy field. Renamed/re-coded as CODBAIRES from 1996.

  CODIGO:
    official_name: Código do estabelecimento de ocorrência
    translated_name: Facility code where the death occurred (locally coded)
    description: >
      Code of the health establishment where the death occurred, filled only when the death
      happened at a health facility (place-of-occurrence = hospital/other health
      establishment). Locally assigned by each state/municipality in this 1979–1995 layout,
      not a national registry code.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 12 "CODIGO | C 6→7 | Codigo do estabelecimento onde ocorreu o
      obito, se LOCOCOR = 1. Este codigo e atribuido por cada estado e/ou municipio, nao
      fazendo parte da base nacional | 1979 (C 6), 1995 (C 7)"
    notes: >
      Because it is a locally-assigned identifier rather than a national registry code, the
      catalog's TCNESBR (CNES facility registry) binding on this column is a false-positive
      semantic match, not a real relationship — see spurious_bindings. From 2001 the DO
      layout instead carries CODESTAB, which IS a real CNES code.

  CRSOCOR:
    official_name: CRS de ocorrência
    translated_name: Health-region code of occurrence (locally coded)
    description: >
      Code of the health region (Regional de Saúde) where the death occurred, in the
      1979–1995-vintage layout. Assigned independently by each state/municipality, not
      standardized nationally.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 46 "CRSOCOR | C 7 | Regional de Saude de ocorrencia. Este codigo
      e atribuido por cada estado e/ou municipio, nao fazendo parte da base nacional |
      1979 (C 7)"

  CRSRES:
    official_name: CRS de residência
    translated_name: Health-region code of residence (locally coded)
    description: >
      Code of the health region (Regional de Saúde) of the deceased's residence, in the
      1979–1995-vintage layout. Assigned independently by each state/municipality, not
      standardized nationally.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 47 "CRSRES | C 6 | Regional de Saude de residencia. Este codigo e
      atribuido por cada estado e/ou municipio, nao fazendo parte da base nacional |
      1979 (C 6)"

  CODBAIRES:
    official_name: Código do bairro de residência
    translated_name: Neighbourhood-of-residence code
    description: >
      Neighbourhood/district code of the deceased's residence, in the 1996–2010-vintage
      layout — the successor to BAIRES under the post-1996 field-naming scheme. Still a
      locally-assigned code without a single national lookup.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 56 "CODBAIRES | C 9 | Código do Bairro de residência |
      1996 (C 9)"
    vintage_note: >
      Present 1996–2010 (per the observed series range); BAIRES carries the same concept for
      1979–1995. The two do not share a coding scheme, so do not coalesce codes across the
      boundary without a crosswalk.
    notes: >
      The catalog's TPROC10 (procedure-type table) binding on this column is unrelated — a
      semantic-match false positive; see spurious_bindings.

  CODBAIOCOR:
    official_name: Código do bairro de ocorrência
    translated_name: Neighbourhood-of-occurrence code
    description: >
      Neighbourhood/district code of where the death occurred (as opposed to CODBAIRES,
      which is the deceased's residence). Same locally-assigned, non-national numbering
      pattern.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 78 "CODBAIOCOR | C 10 | Código do bairro de ocorrência. |
      2006 (C 10)"
    notes: >
      The catalog's TPROC10 binding here is the same false-positive semantic match seen on
      CODBAIRES — see spurious_bindings.

  # --------------------------------------------------------------- civil registry (cartório)

  CARTORIO:
    official_name: Cartório
    translated_name: Civil registry office code
    description: >
      Code of the cartório (civil registry office) where the death was formally registered,
      in the 1979–1995-vintage layout. An identifier into a local registry, not a decodable
      category.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 2 "CARTORIO | C 8 | Código do cartório onde o óbito foi
      registrado | 1979 (C 8)"
    vintage_note: >
      1979–1995-vintage legacy field. The 2012+ layout carries the same concept as CODCART,
      alongside a fuller cartório-registration cluster (CODMUNCART, DTREGCART, NUMREGCART).

  REGISTRO:
    official_name: Registro
    translated_name: Death registration number
    description: >
      The death's own registration number, in the 1979–1995-vintage layout — distinct from
      CARTORIO (which identifies the registry office itself). An identifier, not a category.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 3 "REGISTRO | C 8 | Numero de registro do óbito | 1979 (C 8)"

  DATAREG:
    official_name: Data de registro
    translated_name: Registration receipt date
    description: >
      Date DATASUS/the health department received this death record, in the 1979–1995-vintage
      layout ddmmaaaa format. The successor concept from 1996 is DTRECEBIM/DTRECORIG.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 4 "DATAREG | C 7 | Data do recebimento. (Data no padrão ddmmaaaa) |
      1979 (C 7)"
    notes: >
      The declared width is 7 and the doc claims ddmmaaaa (8-digit) format, but observed
      values in this batch are inconsistent in length — some are a bare 2-digit year (e.g.
      "95") and others are 6 digits (e.g. "950417"). Do not assume every value carries a full
      date; a nontrivial share of DOR-era records appear to have only year, or year+month.

  DATANASC:
    official_name: Data de nascimento
    translated_name: Deceased's date of birth
    description: >
      Birth date of the deceased, ddmmaaaa, in the 1979–1995-vintage layout. For a fetal
      death the layout instructs that this equal the date of death (DATAOBITO), since a
      stillbirth's "birth" and "death" are the same event.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 9 "DATANASC | C 8 | Data do nascimento do falecido. Em caso de
      óbito fetal as datas de óbito e nascimento deverão ser iguais.(Data no padrão
      ddmmaaaa) | 1979 (C 8)"
    notes: >
      "00000000" is the observed sentinel for unknown, and a nontrivial share of records
      (e.g. "1995") carry only a 4-digit year rather than a full date — treat those as
      partial, not as January-something dates.

  DATAOBITO:
    official_name: Data do óbito
    translated_name: Date of death
    description: >
      Date the death occurred, in the 1979–1995-vintage layout. From 1996 the same concept
      is carried by DTOBITO.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 6 "DATAOBITO | C 9 | Data em que occoreu o óbito.(Data no padrão
      ddmmaaaa) | 1979 (C 9)"
    notes: >
      The doc's stated format is 8-digit ddmmaaaa, but the observed values in this batch are
      6 characters and end in "00" (e.g. "790300", "790100" — read as YY, MM, and a fixed
      "00"), and the catalog binds this column to ANO7995/MESES/ANO — year/month tabulation
      axes rather than a codelist, mirroring the well-known "date bound to a
      year-and-month grouping table" pattern (see spurious_bindings). Day-level date
      arithmetic on this field for pre-1996 records is likely unsafe; treat it as
      month/year-resolution for that vintage rather than a full calendar date.

  CODCART:
    official_name: Código do cartório
    translated_name: Civil registry office code
    description: >
      Code of the cartório (civil registry office) where the death was registered, in the
      2012+ cartório-detail cluster (alongside CODMUNCART, DTREGCART, NUMREGCART) — the
      modern counterpart of the legacy CARTORIO field.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists CODCART at position 103 with a blank description (2012, C 7), but
      it appears alongside three fully-documented siblings introduced the same year —
      CODMUNCART ("Código do município do cartório"), DTREGCART ("Data do registro do
      cartório") and NUMREGCART ("Número do registro do cartório") — all naming the same
      cartório-registration event, plus the pre-existing 1979-vintage CARTORIO field
      documents the identical concept under an earlier name.

  CODMUNCART:
    official_name: Código do município do cartório
    translated_name: Municipality code of the registry office
    description: >
      IBGE municipality code of the cartório (civil registry office) that recorded the
      death — part of the 2012+ cartório-detail cluster. Not necessarily the municipality
      of death or residence; it is where the paperwork was filed.
    code_system: external
    codelists: [MUNICBR]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 102 "CODMUNCART | C 10 | Código do município do cartório |
      2012 (C 10)"

  DTREGCART:
    official_name: Data do registro do cartório
    translated_name: Civil registry filing date
    description: >
      Date the death was registered at the cartório (civil registry office), ddmmaaaa —
      part of the 2012+ cartório-detail cluster. This is the civil-registration date, and
      can lag the date of death.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 105 "DTREGCART | C 9 | Data do registro do cartório (Data no
      padrão ddmmaaaa) | 2012 (C 9)"

  NUMREGCART:
    official_name: Número do registro do cartório
    translated_name: Civil registry entry number
    description: >
      The cartório's own registration/entry number for this death, part of the 2012+
      cartório-detail cluster. An identifier, not a category.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 104 "NUMREGCART | C 10 | Número do registro do cartório |
      2012 (C 10)"

  DTRECORIG:
    official_name: Data do recebimento original
    translated_name: Original receipt date
    description: >
      Date DATASUS first received this DO, before any later correction/reprocessing —
      introduced in 2011 as the field that anchors reporting-timeliness measures (compare
      against DATAOBITO/DTOBITO to see reporting lag).
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 95 "DTRECORIG | C 9 | Data do recebimento original. (Data no
      padrão ddmmaaaa) | 2011 (C 9)"
    notes: >
      The catalog's MESANO0020 binding is a year/month tabulation grouping derived from this
      date, not an independent codelist — see spurious_bindings.

  DTRECORIGA:
    official_name: Data do recebimento original (tratada)
    translated_name: Original receipt date (processing-cleaned copy)
    description: >
      A cleaned/derived copy of DTRECORIG created during DATASUS's own data treatment
      pipeline, same ddmmaaaa date. Use DTRECORIG for the as-received value and this one only
      if the raw field is missing or malformed for a given record.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 96 "DTRECORIGA | C 10 | Campo Criado no Tratamento para Data do
      recebimento original. (Data no padrão ddmmaaaa) | 2011 (C 10)"

  EXPDIFDATA:
    official_name: Diferença de datas (exportação)
    translated_name: Death-to-receipt lag in days (export copy)
    description: >
      A day-count field carrying the same concept as DATASUS's documented sibling field
      DIFDATA's: the gap, in days, between a person's death and DATASUS first receiving the
      DO, appearing only in a 2012 export. A larger value means the record took longer to
      reach DATASUS.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      No entry for EXPDIFDATA exists in [ESTRUTURA-SIM] (blank description, 2012, C 10), but
      the immediately neighbouring field DIFDATA (position 113) is documented as "Diferença
      entre a data de óbito e data do recebimento original da DO ([DTOBITO] – [DTRECORIG]).
      (Números)" — the same 2012 vintage and the "EXP" (export) prefix on an otherwise
      identical name is the basis for treating this as a copy of that same lag measure.
      Observed values (small positive integers, 12–32 in the top values) are consistent with
      a day-count.
    notes: >
      Only carried by 2012-dated records in this batch; do not expect it in other years.

  # --------------------------------------------------------- deceased & family demographics

  ESTCIVIL:
    official_name: Estado civil
    translated_name: Deceased's marital status
    description: >
      Marital status of the deceased as reported by family, in the 1979–1995-vintage layout:
      1 Solteiro, 2 Casado, 3 Viúvo, 4 Separado judicialmente, 5 União consensual (earlier
      versions only), 9 Ignorado.
    code_system: internal
    codelists: [ESTCIV]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 7 "ESTCIVIL | C 8 | Estado civil, conforme a tabela: 1: Solteiro
      2: Casado 3: Viúvo 4: Separado judicialmente 5: União consensual (versões anteriores)
      9: Ignorado | 1979 (C 8)"
    vintage_note: >
      1979-vintage legacy field. Renamed ESTCIV from 1996 with a revised category set
      (adds "União estável", merges separado/divorciado).

  INSTRUCAO:
    official_name: Instrução
    translated_name: Deceased's education level
    description: >
      Educational attainment of the deceased, in the 1979–1995-vintage layout:
      0 Ignorado, 1 Nenhuma, 2 Primeiro grau, 3 Segundo grau, 4 Superior.
    code_system: internal
    codelists: [INSTRUC]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 19 "INSTRUCAO | C 9 | Instrução, conforme a tabela: 0: Ignorado
      1: Nenhuma 2: Primeiro grau 3: Segundo grau 4: Superior | 1979 (C 9)"
    vintage_note: >
      1979-vintage legacy field, renamed ESC from 1996 (finer-grained years-of-schooling
      bands) and further refined into ESC2010/ESCFALAGR1 from 2011–2012.

  INSTRMAE:
    official_name: Instrução da mãe
    translated_name: Mother's education level
    description: >
      Educational attainment of the deceased's mother, coded on the same 0–4 scale as
      INSTRUCAO. Relevant chiefly for fetal/infant deaths, where the mother's own record is
      part of the DO.
    code_system: internal
    codelists: [INSTRUC]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 24 "INSTRMAE | C 8 | Instrução da mae, conforme codificação de
      INSTRUCAO | 1979 (C 8)"

  INSTRPAI:
    official_name: Instrução do pai
    translated_name: Father's education level
    description: >
      Educational attainment of the deceased's father, coded on the same 0–4 scale as
      INSTRUCAO. Relevant chiefly for fetal/infant deaths.
    code_system: internal
    codelists: [INSTRUC]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 21 "INSTRPAI | C 8 | Instrução do pai, conforme codificação de
      INSTRUCAO | 1979 (C 8)"

  OCUPACAO:
    official_name: Ocupação
    translated_name: Deceased's occupation (CBO)
    description: >
      Occupation of the deceased under the Classificação Brasileira de Ocupações (CBO), in
      the 1979–1995-vintage layout. Observed codes are 3-digit CBO family groups from the
      pre-2002 classification, not the 6-digit CBO-2002 codes used by the later OCUP field.
    code_system: external
    codelists: [OCUPACAO, GRUPOCUP, SGRPOCUP]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 17 "OCUPACAO | C 8 | Ocupação, conforme a Classificação Brasileira
      de Ocupações (CBO) | 1979 (C 8)"
    vintage_note: >
      1979-vintage legacy field, using an older 3-digit CBO scheme. From 1996 the OCUP field
      carries occupation under CBO-2002 (6-digit); the two are not directly comparable
      without a CBO crosswalk.

  OCUPPAI:
    official_name: Ocupação do pai
    translated_name: Father's occupation (CBO)
    description: >
      Father's occupation, coded per the same (pre-2002, 3-digit) CBO scheme as OCUPACAO.
    code_system: external
    codelists: [OCUPACAO, GRUPOCUP, SGRPOCUP]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 20 "OCUPPAI | C 7 | Ocupação do pai, conforme codificação de
      OCUPACAO | 1979 (C 7)"

  MUNIOCOR:
    official_name: Município de ocorrência
    translated_name: Municipality where the death occurred
    description: >
      IBGE code of the municipality where the death occurred, in the 1979–1995-vintage
      layout — the predecessor of the modern CODMUNOCOR.
    code_system: external
    codelists: [AC_MUNICIP, AL_MUNICIP, AM_MUNICIP, AP_MUNICIP, BA_MUNICIP, BAIRROS]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 13 "MUNIOCOR | C 8 | Municipio de ocorrencia do obito, conforme
      codificação do IBGE. | 1979 (C 8)"

  MUNIRES:
    official_name: Município de residência
    translated_name: Municipality of residence
    description: >
      IBGE code of the deceased's municipality of residence, in the 1979–1995-vintage
      layout — the predecessor of the modern CODMUNRES. For a fetal death, residence is the
      mother's, per the layout's own convention (documented on the modern field, and
      presumed to carry over).
    code_system: external
    codelists: [AC_MUNICIP, AL_MUNICIP, AM_MUNICIP, AP_MUNICIP, BA_MUNICIP, BR_AMAZLEGAL]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 14 "MUNIRES | C 7 | Municipio de residencia, em codificação
      identica a de MUNIOCOR. Os óbitos de residentes no exterior ou de residencia
      completamente ignorada foram desprezados nos anos de 1979 a 1992 | 1979 (C 7)"
    notes: >
      For 1979–1992, deaths of people who lived abroad or whose residence was entirely
      unknown were dropped from the file rather than coded — a real undercount, not a
      data-entry gap, for cross-border or unknown-residence mortality in that period.

  CODPAISRES:
    official_name: Código do país de residência
    translated_name: Country-of-residence code
    description: >
      Code for the nation the deceased resided in, seen only in the DOREXT extension
      (2013+ per this batch) — the module that carries additional detail for deaths with an
      international dimension.
    code_system: external
    codelists: [PAIS]
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Not itself listed in [ESTRUTURA-SIM]. The CO_/CD_...RES naming pattern (código +
      domain + "residência") mirrors MUNIRES/CODMUNRES ("residência" fields already
      documented there), the catalog binds it to a PAIS (country) codelist with high
      confidence from the .def files, and it appears exclusively in the DOREXT series, which
      is where a country-of-residence-abroad concept would belong.

  ETNIA:
    official_name: Etnia
    translated_name: Ethnicity (likely Indigenous ethnicity)
    description: >
      A short numeric code under the field name "etnia" (ethnicity), present only in
      1995–1998 files. By the naming convention DATASUS uses elsewhere (e.g. SINASC's own
      ETNIA field), this almost certainly records Indigenous ethnic group, filled when
      RACACOR/race-colour = Indígena.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists ETNIA at position 50 with a blank description (1995, C 5), and no
      codelist for it survives in the catalog, so the specific coding table cannot be
      confirmed here — hence code_system 'none' rather than a claimed internal/external
      classification. The field name and its co-introduction with RACACOR (also 1995) are
      the basis for the ethnicity reading.
    notes: >
      Extremely sparse in this batch (2 distinct values observed, single digits of records)
      — do not treat as a usable indicator at this vintage.

  CRM:
    official_name: CRM do médico atestante
    translated_name: Certifying physician's medical license number
    description: >
      Registration number of the certifying physician at their regional medical council
      (Conselho Regional de Medicina), introduced 2014. This identifies the doctor who
      signed the death certificate, not the deceased.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 119 "CRM | C 15 | Número de inscrição do Médico atestante no
      Conselho Regional de Medicina | 2014 (C 8→9→15)"
    notes: >
      This is a personal identifier for the certifying physician — a real, traceable
      professional license number, not an internal DATASUS code. Present in only 160 files in
      this batch (2014–2018), so coverage is far from universal.

  MEDICO:
    official_name: Médico
    translated_name: Certifying physician's name
    description: >
      Free-text name of the certifying/attending physician, seen only in DOFET files
      (2014+). A personal identifier of the doctor, not of the deceased.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Not listed by this name in [ESTRUTURA-SIM]. The field name is literally the Portuguese
      word for "doctor," and every observed value in the evidence is a plausible human
      first-name/partial-name string (e.g. "FRANCISCO", "ANA MARIA", "LUCIANO MO..." —
      several truncated, consistent with a fixed-width name field), which is what settles it
      rather than the name alone.
    notes: >
      This is a personal identifier (a named individual, the certifying physician) — flagged
      here, not masked. Handle it with the same care as any other directly-identifying field.

  # --------------------------------------- birth-circumstance fields (fetal/infant deceased)
  # These describe the *deceased's own birth* — they only make sense when the deceased was
  # a fetus or infant (DOFET/DOINF), since the same person's birth and death are both on
  # record.

  PESONASC:
    official_name: Peso ao nascer
    translated_name: Deceased's birth weight (grams)
    description: >
      Birth weight of the deceased in grams, in the 1979–1995-vintage layout. Meaningful for
      fetal/infant deaths, where the deceased's own birth weight is recorded on the DO. The
      1996+ layout carries the same concept as PESO.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 30 "PESONASC | C 8 | Peso ao nascer, em gramas | 1979 (C 8)"
    notes: >
      "0000"/all-zero is the observed sentinel for unknown — it is not a real birth weight.
      The catalog's PESO codelist binding here is a weight-band lookup (e.g. "1kg a 1,4kg")
      derived from this number for tabulation, not an independent code system — see
      spurious_bindings; keep the raw gram value rather than substituting the band label.

  SEMANGEST:
    official_name: Semanas de gestação
    translated_name: Gestational age at birth (banded)
    description: >
      Banded gestational age of the deceased at their own birth, in the 1979–1995-vintage
      layout — meaningful for fetal/infant deaths. The band definitions changed in 1995: for
      1979–1994, 0 Ignorado/1 <20 semanas/2 20–27/3 28+ semanas; from 1995, 0 Ignorado/
      4 <21 semanas/5 22–27/6 28–36/7 37–41/8 42+ semanas. The 1996+ layout carries the same
      concept as GESTACAO with its own (similar but not identical) bands.
    code_system: internal
    codelists: [SEMANAS]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 27 "SEMANGEST | C 9 | Semanas de gestação, conforme as tabelas:
      Para os anos de 1979 a 1994: 0 Ignorado, 1 Menos de 20 semanas, 2 20 a 27 semanas,
      3 28 e mais semanas. Para os anos a partir de 1995: 0 Ignorado, 4 Menos de 21 semanas,
      5 22 a 27 semanas, 6 28 a 36 semanas, 7 37 a 41 semanas, 8 42 semanas e mais |
      1979 (C 9)"
    vintage_note: >
      The same numeric codes (e.g. "3") mean different bands before and after 1995 — do not
      pool codes across that boundary without applying the correct year's table.

  TIPOGRAV:
    official_name: Tipo de gravidez
    translated_name: Type of pregnancy (deceased's own birth)
    description: >
      Whether the pregnancy that produced the deceased was single or multiple, in the
      1979–1995-vintage layout: 0 Ignorado, 1 Única, 2 Dupla, 3 Tríplice, 4 Mais de 3.
      Meaningful for fetal/infant deaths. The 1996+ layout carries the same concept as
      GRAVIDEZ.
    code_system: internal
    codelists: [GRAVIDEZ]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 28 "TIPOGRAV | C 8 | Tipo de gravidez, conforme a tabela:
      0: Ignorado 1: Unica 2: Dupla 3: Triplice 4: Mais de 3 | 1979 (C 8)"

  TIPOPARTO:
    official_name: Tipo de parto
    translated_name: Type of delivery (deceased's own birth)
    description: >
      How the deceased was delivered, in the 1979–1995-vintage layout: 0 Ignorado,
      1 Espontâneo, 2 Operatório, 3 Fórceps, 4 Outro. Meaningful for fetal/infant deaths. The
      1996+ layout carries the same concept as PARTO (collapsed to vaginal/cesáreo/ignorado).
    code_system: internal
    codelists: [PARTO]
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 29 "TIPOPARTO | C 9 | Tipo de parto, conforme a tabela:
      0: Ignorado 1: Espontaneo 2: Operatorio 3: Forceps 4: Outro | 1979 (C 9)"

  FILHVIVOS:
    official_name: Filhos vivos
    translated_name: Mother's number of living children
    description: >
      Number of the mother's living children, not counting the deceased if the deceased is
      themself the child this DO reports, in the 1979–1995-vintage layout. Coded with a
      quirk: 0 (or "00") means unknown/ignorado, and "no living children" is instead coded
      as the literal string "XX" — a naive numeric cast will misread 0 as a real zero-child
      count. The 1996+ layout replaces this with QTDFILVIVO, which uses plain numbers with 9
      = ignorado and no XX sentinel.
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 25 "FILHVIVOS | C 9 | Numero de filhos vivos. O valor zero
      corresponde a ignorado. Nenhum filho vivo esta codificado como XX. | 1979 (C 9)";
      QTDFILVIVO pos. 60 clarifies the exclusion: "Número de filhos vivos. (Número; 9 -
      igonorado)" 1996 (C 10).

  FILHMORT:
    official_name: Filhos mortos
    translated_name: Mother's number of children who have died
    description: >
      Number of the mother's children who have died, not counting the deceased if the
      deceased is themself the child this DO reports, in the 1979–1995-vintage layout. Shares
      FILHVIVOS's coding quirk — 0/"00" reads as unknown, and "no dead children" is coded as
      the literal "XX." The 1996+ layout replaces this with QTDFILMORT (plain numbers, 9 =
      ignorado, no XX sentinel).
    code_system: none
    source: layout_doc
    source_ref: >
      [ESTRUTURA-SIM] pos. 26 "FILHMORT | C 8 | Numero de filhos morto[s] ... O valor zero
      corresponde a Nenhum filho morto e está codificado como XX. | 1979 (C 8)" (the doc's
      own phrasing here is compressed/ambiguous about which value is which; read together
      with the mirror-image FILHVIVOS entry and QTDFILMORT pos. 61 — "Número de filhos
      mortos. Não incluir a criança cujo óbito se notifica na respectiva DO." — the exclusion
      rule is confirmed even though the exact zero-vs-XX wording for this field alone is not
      fully clean.
    notes: >
      Treat 0/"00" as "unknown" and "XX" as the real zero, mirroring FILHVIVOS, rather than
      trusting a literal reading of this field's own garbled doc line in isolation.

  FONTINFO:
    official_name: Fonte de informação
    translated_name: Information source (legacy field name)
    description: >
      The pre-1996 name for the same "where did the accident/violence-circumstance
      information come from" concept later renamed FONTE: 0/9 Ignorado, 1 Boletim de
      Ocorrência, 2 Hospital, 3 Família, 4 Outro.
    code_system: internal
    codelists: [FONTINFO]
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      [ESTRUTURA-SIM] lists FONTINFO at position 41 with a blank description (1979, C 8), one
      field before FONTE's fully documented 1996 entry ("fonte de informação utilizada para o
      preenchimento dos campos 48 e 49"). The catalog's own FONTINFO codelist (0.9 confidence,
      sourced from the .def files) carries exactly the same code set and labels DATASUS shows
      for FONTE (1/2/3/4/9, Boletim de Ocorrência/Hospital/Família/Outro/Ignorado), which is
      the basis for reading FONTINFO as FONTE's earlier name rather than a different concept.

