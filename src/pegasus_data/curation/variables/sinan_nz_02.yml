system: SINAN
asserted_by: pegasus_data

variables:
  TIREOIDITE:
    official_name: Doença associada - Tireoidite
    translated_name: Associated disease - thyroiditis
    description: >
      Whether the pneumoconiosis (PNEU) patient has thyroiditis, one of the
      form's named associated-disease checkboxes, distinct from the
      free-text "other disease" captured by OUTRO_DOE/OUT_DOE_DE.
    code_system: none
    source: inferred
    reasoning: >
      PNEU form comorbidity checklist; TIREOIDITE = tireoidite; width 1
      checkbox.

  TOMOGRAFIA:
    official_name: Realização de tomografia
    translated_name: CT scan performed (flag)
    description: >
      Whether a chest CT scan was performed to support the pneumoconiosis
      diagnosis, one of the form's named-exam checkboxes, distinct from the
      unnamed "other exam" flagged by OUT_EXAME.
    code_system: none
    source: inferred
    reasoning: PNEU form; TOMOGRAFIA = tomografia; width 1 checkbox.

  TONTURA:
    official_name: Sinais e sintomas - Tontura
    translated_name: Dizziness
    description: >
      Whether the noise-induced hearing loss (PAIR) patient reports
      dizziness/vertigo, a vestibular symptom checkbox recorded alongside
      tinnitus (ZUMBIDO).
    code_system: none
    source: inferred
    reasoning: PAIR form; TONTURA = tontura; width 1 checkbox.

  TPATENDE:
    official_name: Tipo de atendimento
    translated_name: Type of care provided
    description: >
      Coded type of medical care the poisoning (IEXO) patient received
      (e.g. outpatient, hospital admission, emergency-only), a single-digit
      classification distinct from TPEXP, which codes how exposure
      occurred.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo, ATENDE = atendimento; IEXO form; width 1.

  TPEXP:
    official_name: Tipo de exposição
    translated_name: Type of exposure
    description: >
      How the patient came into contact with the toxic agent - e.g.
      occupational, accidental, suicide attempt, or other circumstance -
      the core exposure-circumstance classification on the poisoning form.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo, EXP = exposição; IEXO form; width 1.

  TPRUIDO:
    official_name: Tipo de ruído
    translated_name: Type of noise
    description: >
      Pattern of the occupational noise exposure behind the hearing loss -
      e.g. continuous, intermittent, or impact/impulse noise - distinct
      from TONTURA and ZUMBIDO, which record symptoms rather than exposure
      type.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo, RUIDO = ruído; PAIR form; width 1.

  TRAB_DESC:
    official_name: Trabalho - descrição
    translated_name: Occupation description
    description: >
      Free-text description of the poisoning (IEXO) patient's job or work
      activity, used to characterize occupational exposure when the case's
      circumstance is work-related.
    code_system: none
    source: inferred
    reasoning: TRAB_DESC = trabalho + descreva; width 30 free text.

  TRA_NUM_PA:
    official_name: Tratamento anterior
    translated_name: Prior treatment (flag)
    description: >
      Whether the person bitten/exposed to a suspect animal had already
      started anti-rabies treatment before this visit, one of the intake
      fields on the ANTR (human anti-rabies care) form alongside the five
      scheduled vaccine-dose dates.
    code_system: none
    source: inferred
    reasoning: >
      ANTR series is the human anti-rabies exposure/treatment form (bite
      fields like ANT_MORDED, DT_VAC_1-5 confirm this, not a work-accident
      form despite the TRA_ prefix); width 1 fits a Sim/Não flag.

  UTILIZACAO:
    official_name: Utilização do produto
    translated_name: Product in use at exposure (flag)
    description: >
      Whether the toxic product was in active use (being applied, mixed, or
      handled) at the moment of exposure, as opposed to accidental contact
      with a stored or discarded product. Paired with UTIL_DESC for detail.
    code_system: none
    source: inferred
    reasoning: IEXO form; UTILIZACAO = utilização; width 1 checkbox.

  UTIL_DESC:
    official_name: Utilização do produto - descrição
    translated_name: Product use - description
    description: >
      Free-text detail of how the toxic product was being used when the
      poisoning occurred, filled in alongside the UTILIZACAO checkbox.
    code_system: none
    source: inferred
    reasoning: UTIL_DESC = utilização + descreva; width 30 free text.

  VAC_HEP_B:
    official_name: Vacinação contra Hepatite B
    translated_name: Hepatitis B vaccination status
    description: >
      Whether the worker exposed to biological material (ACBI) had already
      been vaccinated against Hepatitis B, used to assess infection risk
      and the need for post-exposure prophylaxis after the accident.
    code_system: none
    source: inferred
    reasoning: VAC_HEP_B = vacina + hepatite B; ACBI form; width 1 checkbox.

  VIA_1:
    official_name: Via de exposição (1ª)
    translated_name: Exposure route (1st)
    description: >
      First recorded route by which the toxic agent entered the body (e.g.
      oral, dermal, respiratory, ocular) - the IEXO form allows up to three
      routes since a single exposure can involve more than one.
    code_system: none
    source: inferred
    reasoning: VIA_ = via, numbered 1-3; width 1 code.

  VIA_2:
    official_name: Via de exposição (2ª)
    translated_name: Exposure route (2nd)
    description: >
      Second exposure route recorded when the poisoning involved more than
      one route of entry, alongside VIA_1.
    code_system: none
    source: inferred
    reasoning: Second of three same-pattern fields; see VIA_1.

  VIA_3:
    official_name: Via de exposição (3ª)
    translated_name: Exposure route (3rd)
    description: >
      Third exposure route, completing the up-to-three-route record
      alongside VIA_1 and VIA_2.
    code_system: none
    source: inferred
    reasoning: Third of three same-pattern fields; see VIA_1.

  VINC_ESP:
    official_name: Vínculo empregatício - especifique
    translated_name: Employment bond - specify
    description: >
      Free-text detail of the pneumoconiosis patient's employment
      relationship (e.g. contract type or employer) when the form's
      standard employment-bond categories don't fit.
    code_system: none
    source: inferred
    reasoning: >
      PNEU form; VINC_ESP = vínculo + especifique; width 30 free text.

  ZUMBIDO:
    official_name: Sinais e sintomas - Zumbido
    translated_name: Tinnitus
    description: >
      Whether the noise-induced hearing loss patient reports tinnitus
      (ringing in the ears), the symptom most closely tied to PAIR
      alongside dizziness (TONTURA).
    code_system: none
    source: inferred
    reasoning: PAIR form; ZUMBIDO = zumbido; width 1 checkbox.

  NAO_IONIZA:
    official_name: Exposição a radiação não ionizante
    translated_name: Non-ionizing radiation exposure
    description: >
      Whether the work-related cancer (CANC) patient had occupational
      exposure to non-ionizing radiation (e.g. UV, radiofrequency), one of
      the carcinogen-exposure checkboxes alongside nickel (NIQUEL) and oils
      (OLEOS).
    code_system: none
    source: inferred
    reasoning: >
      NAO_IONIZA = não ionizante; CANC form exposure checklist; width 1.

  NEOPLASICO:
    official_name: Confirmação de doença neoplásica
    translated_name: Neoplastic disease confirmed (flag)
    description: >
      Whether the case's diagnosis has been confirmed as a neoplastic
      (cancer) disease, the core case-definition flag on the work-related
      cancer form, distinct from the specific carcinogen-exposure
      checkboxes.
    code_system: none
    source: inferred
    reasoning: CANC form; NEOPLASICO = neoplásico; width 1 checkbox.

  NIQUEL:
    official_name: Exposição a níquel
    translated_name: Nickel exposure
    description: >
      Whether the work-related cancer patient had occupational exposure to
      nickel, a recognized carcinogen and one of the named exposure-agent
      checkboxes on the CANC form.
    code_system: none
    source: inferred
    reasoning: CANC form; NIQUEL = níquel; width 1 checkbox.

  NM_OUT_COM:
    official_name: Nome do outro comunicante
    translated_name: Other contact's name
    description: >
      Free-text name of an additional close contact of the pertussis
      (COQU) case, recorded when contact-tracing finds someone beyond the
      household contacts already listed by name.
    code_system: none
    source: inferred
    reasoning: >
      COQU = Coqueluche; NM = nome, OUT = outro, COM = comunicante; width
      30 fits a person's name.
