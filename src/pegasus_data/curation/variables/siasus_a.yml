system: SIASUS
asserted_by: pegasus_data
variables:

  AP_ALTA:
    official_name: Indicador de Alta
    translated_name: Discharge indicator
    description: >
      Flags whether the APAC episode ended in the patient's discharge from the treatment programme
      (e.g. finishing a chemo/radiotherapy or dialysis course). Bound to the ALTA codelist; the column
      itself is the flag, not the discharge date - AP_DTOCOR carries when it happened.

    codelists: ["ALTA"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_AUTORIZ:
    official_name: Numero da APAC
    translated_name: APAC authorization number
    description: >
      The authorization number DATASUS assigns to the APAC record itself, built as
      UF+AA+T+sequential+check digit (e.g. state, year, laudo type, a sequence, a check digit) per the
      layout's own formation rule. It identifies one authorization, not one procedure line - an APAC
      with several procedures repeats this number across the corresponding PA-file rows (see
      PA_AUTORIZ).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CATEND:
    official_name: Carater do Atendimento
    translated_name: Type of care episode
    description: >
      Codes the legal/administrative character of the care episode behind the APAC (e.g. elective vs
      urgent vs follow-up), drawn from the CARAT_AT codelist shared with the production file's
      PA_CATEND/CATEND.

    codelists: ["CARAT_AT"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CEPPCN:
    official_name: CEP do endereco do paciente
    translated_name: Patient's postal code (CEP)
    description: >
      The 8-digit Brazilian postal code of the patient's address as recorded on the APAC. In dense
      urban CEPs this can resolve to a single street or building, so it is a fine-grained locator even
      though it carries no lookup label of its own.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      Combined with age/sex/CNS this narrows re-identification risk considerably; handle with the same
      care as a direct identifier even though it is not one.


  AP_CIDCAS:
    official_name: CID Causas Associadas
    translated_name: Associated-cause ICD-10 code
    description: >
      ICD-10 code for a condition associated with (but not the primary reason for) the APAC, drawn
      from the S_CID codelist. Distinct from AP_CIDPRI (primary) and AP_CIDSEC (secondary).

    codelists: ["S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CMP:
    official_name: Data de Atendimento ao paciente / Competencia
    translated_name: Care competence month
    description: >
      The AAAAMM competence (year-month) the APAC's care refers to, as opposed to AP_MVM which is when
      DATASUS processed the batch. The two can diverge by weeks or months when a unit submits late or
      a record is reprocessed, so aggregating by AP_CMP reflects when care happened while AP_MVM
      reflects when it was recorded.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: the catalog binds ANOMES2008/ANO_2008/SEME2008 to this column. Those are
      TabNet's auto-derived Ano/Ano-mes/Semester tabulation axes for a date field, not a coded
      vocabulary of AP_CMP's own values - the binding belongs to the catalog's axis-detection, not to
      this column.


  AP_CNPJCPF:
    official_name: CNPJ do Estabelecimento executante
    translated_name: Executing establishment's CNPJ/CPF
    description: >
      Tax ID of the establishment that executed the APAC procedure. The field name (CNPJ**CPF**)
      signals that when the executant is an individual professional rather than a legal entity, this
      can hold a personal CPF instead of a company CNPJ.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      May hold a personal CPF rather than an establishment CNPJ - treat as a personal identifier when
      11 digits (CPF length) rather than 14 (CNPJ length).


  AP_CNPJMNT:
    official_name: CNPJ da Mantenedora do estabelecimento
    translated_name: Establishment's parent-organization CNPJ
    description: >
      CNPJ of the legal entity that maintains/owns the executing establishment (its "mantenedora"), or
      all zeros when the establishment has none (i.e. it is not part of a maintained network).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CNSPCN:
    official_name: Numero do CNS do paciente
    translated_name: Patient's CNS (national health card) number
    description: >
      The patient's Cartao Nacional de Saude number - Brazil's unique per-person health-system
      identifier.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      Direct personal identifier (CNS). Passed through unmodified per project policy; propose no
      masking, but treat it as sensitive.


  AP_CODEMI:
    official_name: Codigo do Orgao emissor
    translated_name: Issuing-body code
    description: >
      Code of the body that emitted/authorized the APAC. The layout gives only the label; no codelist
      is bound in this catalog, so which registry the code numbers refer to cannot be confirmed from
      the evidence available here.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CODUNI:
    official_name: Codigo do Estabelecimento no CNES
    translated_name: Executing establishment's CNES code
    description: >
      The 7-digit CNES (Cadastro Nacional de Estabelecimentos de Saude) code of the facility that
      executed the APAC - a real, independently-maintained national facility registry, not a DATASUS-
      only invention.

    codelists: ["CADGERAC", "CADGERAL (per-state CNES facility registries)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_COIDADE:
    official_name: Codigo da Idade do paciente
    translated_name: Patient age-unit code
    description: >
      Codes which unit AP_NUIDADE is expressed in (years vs. months vs. days for very young patients)
      rather than the age value itself.

    codelists: ["IDADE18", "IDADEDET"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CONDIC:
    official_name: Sigla do Tipo de Gestao
    translated_name: Management-type code
    description: >
      Marks the SUS management arrangement (state-managed vs. municipality-managed, full vs. partial)
      under which the establishment or municipality is accredited for this APAC.

    codelists: ["TPGEST_C", "TP_GESTAO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_DTAUT:
    official_name: Data da Autorizacao
    translated_name: Authorization date
    description: >
      AAAAMMDD date the APAC was authorized by the regulating body - normally on or after AP_DTSOLIC
      (request date) and at or before AP_DTINIC (validity start).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 (TabNet's auto date axes), not a real
      value codelist for this column.


  AP_DTFIM:
    official_name: Data de FIM validade
    translated_name: Validity end date
    description: >
      AAAAMMDD date the APAC's authorization period ends. AP_DTOCOR overrides this when the episode
      closes early (discharge, transfer, death).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists, not a real
      vocabulary for this field.


  AP_DTINIC:
    official_name: Data de INICIO validade
    translated_name: Validity start date
    description: >
      AAAAMMDD date the APAC's authorization period begins - the start of the window during which the
      procedures it authorizes may be billed.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists, not a real
      vocabulary for this field.


  AP_DTSOLIC:
    official_name: Data da Solicitacao
    translated_name: Request date
    description: >
      AAAAMMDD date the requesting unit (AP_UNISOL) asked for the APAC, upstream of AP_DTAUT
      (authorization) and AP_DTINIC (validity start).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists, not a real
      vocabulary for this field.


  AP_ENCERR:
    official_name: Indicador de Encerramento
    translated_name: Closure indicator
    description: >
      Flags that the APAC episode was formally closed/terminated (as opposed to remaining open under
      AP_PERMAN or ending in AP_ALTA/AP_OBITO/AP_TRANSF).

    codelists: ["ENCERRAM"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_ETNIA:
    official_name: Etnia do paciente
    translated_name: Patient's indigenous ethnicity
    description: >
      Code for the patient's specific indigenous ethnicity (e.g. Guarani, Kaingang), drawn from the
      DATASUS/FUNAI ethnicity table. Only meaningful, and normally only filled, when AP_RACACOR = 05
      (Indigena).

    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      Populated only when AP_RACACOR is 05-Indigena; blank/zero for every other race/color value is
      expected, not missingness.


  AP_GESTAO:
    official_name: Codigo da UF+Municipio de Gestao
    translated_name: Managing UF+municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of the manager (gestor) responsible for the establishment, or
      UF0000 when management sits with the state rather than a municipality. This is the
      payer/regulator location, not where care happened (AP_UFMUN) or where the patient lives
      (AP_MUNPCN).

    codelists: ["BR_MUNICGESTOR", "MUNICBR"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_MNDIF:
    official_name: Municipio de residencia diferente do estabelecimento
    translated_name: Patient-vs-establishment municipality mismatch flag
    description: >
      Derived flag for whether the patient's home municipality (AP_MUNPCN) differs from the
      establishment's municipality (AP_UFMUN) - i.e. whether the patient left their home municipality
      for this care.

    codelists: ["INVASAO", "SIMNAO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      Value encoding is not consistent across APAC sub-layouts in the same document: 0/1
      (same/different) in the Laudos Diversos (AD) layout, but N/S (nao/sim) in Nefrologia (AN),
      Quimioterapia (AQ), Radioterapia (AR) and other laudo types. Declared width also drifts between
      C(1) and C(2) across sub-layouts.


  AP_MN_IND:
    official_name: Estabelecimento Mantido / Individual
    translated_name: Maintained-vs-individual establishment flag
    description: >
      Marks whether the executing establishment operates under a parent "mantenedora" organization or
      stands alone.

    codelists: ["MANT_IND"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_MOTSAI:
    official_name: Motivo de Saida e Permanencia
    translated_name: Exit/continuation reason code
    description: >
      Codes why the patient's APAC episode ended or continued in this competence (discharge, transfer,
      death, ongoing treatment, etc.), shared with the AB/AN/AQ/AR chronic-care laudo files.

    codelists: ["MOTSAIPE"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_MUNPCN:
    official_name: UF+Municipio de Residencia do paciente
    translated_name: Patient's home municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of where the patient lives, as declared on the APAC - not where
      the establishment (AP_UFMUN) or the managing authority (AP_GESTAO) is located.

    codelists: ["AC_MUNICIP", "AL_MUNICIP", "..._MUNICIP (per-UF IBGE municipality lists)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_MVM:
    official_name: Data de Processamento / Movimento
    translated_name: Processing (movimento) month
    description: >
      AAAAMM competence in which DATASUS processed this record - the file's own "movimento" batch
      month. Lags AP_CMP (the actual care month) whenever a unit submits late or a record is
      corrected/reprocessed in a later batch; aggregating by AP_MVM reflects processing timing, not
      when care occurred.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather than a real
      vocabulary of AP_MVM values.


  AP_NUIDADE:
    official_name: Numero da Idade
    translated_name: Patient age (number)
    description: >
      The patient's age as a plain number, in the unit given by AP_COIDADE (years, months or days) -
      the two fields together form one age value.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_OBITO:
    official_name: Indicador de Obito
    translated_name: Death indicator
    description: >
      Flags that the patient died during the episode covered by this APAC.

    codelists: ["OBITO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_PERMAN:
    official_name: Indicador de Permanencia
    translated_name: Continuation (still-in-treatment) indicator
    description: >
      Flags that the patient remains in the treatment programme at the end of this competence, i.e.
      the APAC episode is still open rather than closed by AP_ALTA/AP_OBITO/AP_TRANSF/AP_ENCERR.

    codelists: ["PERMANEN"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_PRIPAL:
    official_name: Procedimento Principal da APAC
    translated_name: APAC's main procedure code
    description: >
      The 10-digit SIGTAP procedure code that is the main/authorized procedure of this APAC (SIGTAP is
      the SUS's national unified procedures, medicines and OPM/materials table - a real classification
      maintained outside DATASUS's own invention).

    codelists: ["TB_SIGTAW"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_RACACOR:
    official_name: Raca/Cor do paciente
    translated_name: Patient's race/color
    description: >
      Self-declared race/color per the standard Brazilian categories: 01-Branca (White), 02-Preta
      (Black), 03-Parda (Mixed), 04-Amarela (East Asian-descent), 05-Indigena (Indigenous), 99-Sem
      informacao (Not informed). Value meanings come directly from the layout table, not inferred.

    codelists: ["RACA_COR"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_SEXO:
    official_name: Sexo do paciente
    translated_name: Patient's sex
    description: >
      The patient's sex as recorded for the APAC, coded per the shared SEXO codelist used throughout
      SIASUS/SIA files.

    codelists: ["SEXO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_TPAPAC:
    official_name: Tipo de APAC
    translated_name: APAC episode-stage type
    description: >
      Marks whether this APAC is 1-inicial (first authorization for this episode), 2-continuidade (a
      renewal continuing prior treatment) or 3-unica (a one-off, non-renewable authorization).
      Distinguishing these matters when tallying new vs. ongoing treatment episodes, so renewals are
      not mistaken for new starts.

    codelists: ["TPAPAC", "TP_APAC"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_TPUPS:
    official_name: Tipo de Estabelecimento
    translated_name: Establishment type code
    description: >
      Codes the kind of health facility executing the APAC (hospital, clinic, outpatient unit, etc.)
      per the CNES establishment-type table.

    codelists: ["TP_ESTAB"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_TRANSF:
    official_name: Indicador de Transferencia
    translated_name: Transfer indicator
    description: >
      Flags that the patient's APAC episode ended in a transfer to another establishment.

    codelists: ["TRANSFER"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_UFDIF:
    official_name: UF de residencia diferente da UF do estabelecimento
    translated_name: Patient-vs-establishment UF (state) mismatch flag
    description: >
      Derived flag for whether the patient's home state (from AP_MUNPCN) differs from the
      establishment's state (from AP_UFMUN) - i.e. cross-state care-seeking.

    codelists: ["INVASAO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      Same encoding inconsistency as AP_MNDIF: 0/1 in the Laudos Diversos (AD) layout, N/S in several
      other laudo sub-layouts, and declared width drifts between C(1) and C(2) across them.


  AP_UFMUN:
    official_name: UF+Municipio do Estabelecimento
    translated_name: Establishment's municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of where the executing establishment is physically located -
      the place of care, not the patient's residence (AP_MUNPCN) or the managing authority
      (AP_GESTAO).

    codelists: ["AC_MUNICIP", "..._MUNICIP (per-UF IBGE municipality lists)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_UFNACIO:
    official_name: Codigo da Nacionalidade do paciente
    translated_name: Patient's nationality code
    description: >
      Codes the patient's declared nationality per DATASUS's own UFNACIO table (Brazilian vs. specific
      foreign nationalities).

    codelists: ["UFNACIO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_UNISOL:
    official_name: Codigo CNES do Estabelecimento Solicitante
    translated_name: Requesting establishment's CNES code
    description: >
      CNES code of the facility that requested/originated the APAC, which can differ from the
      executing facility (AP_CODUNI) when a patient is referred elsewhere for the authorized
      procedure.

    codelists: ["CADGERAC", "CADGERAL (per-state CNES facility registries)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_VL_AP:
    official_name: Valor Total da APAC Aprovado
    translated_name: APAC's total approved value (BRL)
    description: >
      Total approved monetary value of the whole APAC (all its procedure lines combined), in reais.
      The narrative text of the layout is explicit that this is a per-APAC total, not a per-procedure-
      line value - summing it across the several PA rows one APAC generates would overcount.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      Per-APAC total, not per procedure line. An APAC that produced several rows in the production
      (PA) file repeats this same total value on each of them; do not sum across those rows.


  AP_APACANT:
    official_name: Numero APAC Anterior
    translated_name: Previous APAC number
    description: >
      The AP_AUTORIZ number of the prior APAC this one continues, letting an analyst chain successive
      renewals (AP_TPAPAC=2) of one long-running treatment episode into a single patient history.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CIDPRI:
    official_name: CID Principal
    translated_name: Primary ICD-10 code
    description: >
      ICD-10 code for the main diagnosis justifying the APAC, from the S_CID codelist.

    codelists: ["S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_CIDSEC:
    official_name: CID Secundario
    translated_name: Secondary ICD-10 code
    description: >
      ICD-10 code for a secondary diagnosis on the APAC, alongside AP_CIDPRI (primary) and AP_CIDCAS
      (associated cause).

    codelists: ["S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_DTOCOR:
    official_name: Data de Ocorrencia
    translated_name: Occurrence date (overrides validity end)
    description: >
      AAAAMMDD date an early-closing event (discharge, transfer, death) happened; when populated it
      replaces AP_DTFIM as the episode's real end date.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather than a real
      vocabulary for this field.


  AP_TIPPRE:
    official_name: Tipo de Prestador
    translated_name: Provider-type code
    description: >
      Codes the legal sphere/type of the executing provider (public federal/state/ municipal vs.
      private contracted, etc.).

    codelists: ["ESFERA", "ESFERA_C", "TIPOPRES"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_TPATEN:
    official_name: Tipo de Atendimento de APAC
    translated_name: APAC care-type code
    description: >
      Codes the type/modality of care the APAC authorizes.

    codelists: ["TP_ATEND"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  AP_NATJUR:
    official_name: Codigo da Natureza Juridica
    translated_name: Legal-nature code
    description: >
      The establishment's legal-nature (natureza juridica) code, sourced by CNES from the
      establishment's CNPJ registration at Receita Federal - a real, externally-governed
      classification (grouped into public administration, for-profit entities, non-profits,
      individuals, and extraterritorial bodies), not a code DATASUS invented for SIASUS.

    codelists: ["NATJUR", "NATJURC"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections 3.4.2-3.4.8"

  PA_QTDAPR:
    official_name: Quantidade Aprovada
    translated_name: Approved quantity
    description: >
      Quantity of the procedure actually approved after auditing, which can be lower than PA_QTDPRO
      (submitted quantity) when part of the claim is rejected. Production/volume statistics should
      normally use PA_QTDAPR, not PA_QTDPRO, to avoid counting work that was billed but not paid for.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_QTDPRO:
    official_name: Quantidade Produzida (APRESENTADA)
    translated_name: Submitted (presented) quantity
    description: >
      Quantity of the procedure as originally submitted/claimed by the provider, before auditing. See
      PA_QTDAPR for the quantity actually approved.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      This is the pre-audit submitted volume, not the paid volume; PA_QTDAPR is usually the right
      column for production statistics.


  PA_PROC_ID:
    official_name: Codigo do Procedimento Ambulatorial
    translated_name: Outpatient procedure code (SIGTAP)
    description: >
      10-digit SIGTAP procedure code identifying what was done, with catalog evidence showing it also
      resolves against SIGTAP's group/subgroup/form hierarchy tables.

    codelists: ["TB_FORMA", "TB_GRUPO", "TB_SIGTAW", "TB_SUBGR"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  CATEND:
    official_name: Carater de Atendimento
    translated_name: Type of care episode
    description: >
      Same CARAT_AT-coded care-character field as AP_CATEND/PA_CATEND, but on the unprefixed BPA-I
      (and RAAS SAD/PS) layouts, which share this exact field name and definition in the source
      document.

    codelists: ["CARAT_AT"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  CIDPRI:
    official_name: CID Principal
    translated_name: Primary ICD-10 code
    description: >
      ICD-10 code for the main diagnosis on a BPA-Individualizado record.

    codelists: ["S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  CNPJCPF:
    official_name: CNPJ do Estabelecimento executante
    translated_name: Executing establishment's CNPJ/CPF
    description: >
      Tax ID of the executing establishment on the unprefixed BPA-I/RAAS layouts; same CNPJ-or-CPF
      ambiguity as AP_CNPJCPF when the executant is an individual professional.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"
    notes: >
      May hold a personal CPF (11 digits) instead of an establishment CNPJ (14 digits) - treat short
      values as a personal identifier.


  CNPJMNT:
    official_name: CNPJ da Mantenedora
    translated_name: Establishment's parent-organization CNPJ
    description: >
      CNPJ of the establishment's maintaining organization, or zeros if it has none, on the unprefixed
      BPA-I/RAAS layouts.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  CNS_PAC:
    official_name: Numero do CNS do paciente
    translated_name: Patient's CNS number
    description: >
      The patient's Cartao Nacional de Saude number on the BPA-I/RAAS layouts.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"
    notes: >
      Direct personal identifier (CNS). Passed through unmodified per project policy; propose no
      masking, but treat it as sensitive.


  CONDIC:
    official_name: Sigla do Tipo de Gestao
    translated_name: Management-type code
    description: >
      Same management-arrangement code as AP_CONDIC/PA_CONDIC, on the unprefixed BPA-I/RAAS layouts.

    codelists: ["TP_GESTAO", "TP_GEST_C"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  DT_ATEND:
    official_name: Ano e mes do Atendimento
    translated_name: Care month (competence)
    description: >
      AAAAMM month the care was delivered, on the BPA-I/RAAS layouts - the equivalent of AP_CMP/PA_CMP
      for these instruments.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather than a real
      vocabulary for this field.


  DT_PROCESS:
    official_name: Ano e mes de Processamento
    translated_name: Processing month
    description: >
      AAAAMM month DATASUS processed this record - the BPA-I/RAAS equivalent of AP_MVM/PA_MVM. Can lag
      DT_ATEND when submission or reprocessing is late.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather than a real
      vocabulary for this field.


  IDADEPAC:
    official_name: Idade do Paciente
    translated_name: Patient's age
    description: >
      Patient's age as a plain number, in the unit given by TPIDADEPAC (years, months or days).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  MN_IND:
    official_name: Estabelecimento Mantido / Individual
    translated_name: Maintained-vs-individual establishment flag
    description: >
      Same maintained-vs-standalone establishment flag as AP_MN_IND, on the unprefixed BPA-I/RAAS
      layouts.

    codelists: ["MANT_IND"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  MUNPAC:
    official_name: UF+Municipio de residencia do paciente
    translated_name: Patient's home municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of the patient's residence - or, per the layout's own note, of
      the establishment instead whenever the instrument does not capture patient identity (as happens
      on BPA-Consolidado-sourced rows). Do not assume every value here is a true residence.

    codelists: ["AC_MUNICIP", "..._MUNICIP (per-UF IBGE municipality lists)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"
    notes: >
      Falls back to the establishment's own municipality when the source instrument (e.g. BPA-C) does
      not identify the patient - check the originating instrument before treating this as residence.


  SEXOPAC:
    official_name: Sexo do paciente
    translated_name: Patient's sex
    description: >
      Patient's sex on the BPA-I/RAAS layouts, coded per the same SEXO codelist used across SIASUS.

    codelists: ["SEXO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  TPIDADEPAC:
    official_name: Tipo da Idade do paciente
    translated_name: Age-unit code
    description: >
      Codes whether IDADEPAC is expressed in years, months or days, computed from the patient's date
      of birth - the BPA-I/RAAS analogue of AP_COIDADE.

    codelists: ["IDADE18", "IDADEDET"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  TPUPS:
    official_name: Tipo de Estabelecimento
    translated_name: Establishment type code
    description: >
      Same CNES establishment-type code as AP_TPUPS, on the unprefixed BPA-I/RAAS layouts.

    codelists: ["TP_ESTAB"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  UFMUN:
    official_name: UF+Municipio do estabelecimento
    translated_name: Establishment's municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of where the establishment is located, on the unprefixed
      BPA-I/RAAS layouts - the place of care, not the patient's residence (MUNPAC).

    codelists: ["AC_MUNICIP", "..._MUNICIP (per-UF IBGE municipality lists)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  PA_CODOCO:
    official_name: Codigo de Ocorrencia
    translated_name: Occurrence code
    description: >
      Processing-occurrence code recorded against the production-file row (e.g. flags applied during
      the audit/critique pipeline).

    codelists: ["CODOCO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CODUNI:
    official_name: Codigo do Estabelecimento no CNES
    translated_name: Establishment's CNES code
    description: >
      7-digit CNES code of the establishment on the production file - the same national facility
      registry as AP_CODUNI.

    codelists: ["CADGERAC", "CADGERAL (per-state CNES facility registries)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CONDIC:
    official_name: Sigla do Tipo de Gestao
    translated_name: Management-type code
    description: >
      Management-arrangement code of the establishment/municipality on the production file, same
      vocabulary as AP_CONDIC.

    codelists: ["TPGESTAO", "TPGEST_C", "TP_GESTAO", "TP_GEST_C"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_DOCORIG:
    official_name: Instrumento de Registro
    translated_name: Source-instrument code
    description: >
      The single most load-bearing column in the production file: it says which registration
      instrument generated this row, and therefore how to read every other column on it. Per the
      layout's own text: P = APAC main procedure, S = APAC secondary procedure, C = BPA-Consolidado, A
      = RAAS-Atencao Domiciliar, B = RAAS-Psicossocial, I = BPA-Individualizado. Patient-identifying
      fields (PA_CNSMED aside, PA_MUNPCN etc.) are only reliably about the patient for P/S/A/B/I rows
      - C-origin (BPA-C) rows carry no patient identity and fall back to the establishment's own
      municipality per the layout's note on PA_MUNPCN.

    codelists: ["DOCORIG", "DOC_ORIG", "DO_ORIGC", "PA_DOCORIG"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      Read this column before trusting any patient-level field on the same row: BPA-C-origin (C) rows
      do not identify a real patient.


  PA_GESTAO:
    official_name: Codigo da UF+Municipio de Gestao
    translated_name: Managing UF+municipality IBGE code
    description: >
      7-char IBGE code of the managing authority (gestor), or UF0000 under state management - the
      payer/regulator location, distinct from PA_UFMUN (place of care) and PA_MUNPCN (patient
      residence).

    codelists: ["BR_MUNICGESTOR", "MUNICBR"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_INDICA:
    official_name: Indicativo de situacao da producao
    translated_name: Approval-status indicator
    description: >
      Whether the claimed production on this row was approved: 0 = nao aprovado (rejected), 5 =
      aprovado total (fully approved), 6 = aprovado parcial (partially approved). Value meanings are
      given verbatim in the layout table. Filtering to 5/6 is usually the right choice for "what
      actually happened" analyses; including 0 mixes in rejected claims.

    codelists: ["INDICA", "PA_INDICA"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_TIPPRE:
    official_name: Tipo de Prestador
    translated_name: Provider-type code
    description: >
      Legal sphere/type of the executing provider on the production file, same concept as AP_TIPPRE.

    codelists: ["ESFERA", "ESFERA_C", "PUBLPRIV", "PUBPRCOL", "RETENCAO", "RETENC_C"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_UFMUN:
    official_name: UF+Municipio do estabelecimento
    translated_name: Establishment's municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of where the establishment is located, on the production file -
      the place of care, not the patient's residence (PA_MUNPCN).

    codelists: ["AC_MUNICIP", "..._MUNICIP (per-UF IBGE municipality lists)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_VALAPR:
    official_name: Valor Aprovado do procedimento
    translated_name: Approved value (BRL)
    description: >
      Monetary value actually approved for this procedure line, in reais - the production-file
      analogue of PA_QTDAPR for money rather than quantity.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_VALPRO:
    official_name: Valor Produzido (APRESENTADO)
    translated_name: Submitted value (BRL)
    description: >
      Monetary value as originally submitted/claimed for this procedure line, before auditing - see
      PA_VALAPR for the approved value.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      Pre-audit submitted value; PA_VALAPR is usually the right column for spend actually paid.


  TIPPRE:
    official_name: Tipo de Prestador
    translated_name: Provider-type code
    description: >
      Same provider-type concept as AP_TIPPRE/PA_TIPPRE, on the unprefixed BPA-I/ RAAS-Psicossocial
      layouts. No codelist is bound to this exact unprefixed field name in this catalog build, unlike
      its AP_/PA_-prefixed siblings.

    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF"

  PA_CIDPRI:
    official_name: CID Principal (APAC ou BPA-I)
    translated_name: Primary ICD-10 code
    description: >
      ICD-10 code for the main diagnosis on the production-file row, populated for rows originating
      from an APAC or a BPA-I (see PA_DOCORIG).

    codelists: ["CID", "CID10GRUPOC", "S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CIDSEC:
    official_name: CID Secundario (APAC)
    translated_name: Secondary ICD-10 code
    description: >
      ICD-10 code for a secondary diagnosis on the production-file row, populated for APAC-originated
      rows.

    codelists: ["CID", "S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CNPJ_CC:
    official_name: CNPJ do Orgao que recebeu por cessao de credito
    translated_name: Credit-assignment recipient's CNPJ
    description: >
      CNPJ of the organization that received payment through a "cessao de credito" (credit assignment)
      arrangement, or zeros when the production was not assigned. Unlike the raw executant/mantenedora
      CNPJ fields, the catalog binds this one to lookup codelists, suggesting it resolves against a
      bounded list of registered recipient organizations rather than being an open-ended identifier.

    codelists: ["CESSAO", "S_FORNEC"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  IDADEMAX:
    official_name: Idade maxima do paciente para o procedimento
    translated_name: Procedure's maximum eligible age
    description: >
      Upper bound of the patient age range SIGTAP allows for PA_PROC_ID, used together with IDADEMIN
      to compute PA_FLIDADE. It describes the procedure's rule, not the patient who was actually
      treated.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  IDADEMIN:
    official_name: Idade minima do paciente para o procedimento
    translated_name: Procedure's minimum eligible age
    description: >
      Lower bound of the patient age range SIGTAP allows for PA_PROC_ID, paired with IDADEMAX.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  NU_PA_TOT:
    official_name: Valor Unitario do Procedimento da Tabela SIGTAP
    translated_name: SIGTAP unit price (BRL)
    description: >
      Unit price of the procedure per the national SIGTAP table, independent of what the managing
      authority actually pays (compare NU_VPA_TOT and PA_DIF_VAL).

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  NU_VPA_TOT:
    official_name: Valor Unitario do Procedimento da Tabela VPA
    translated_name: VPA unit price (BRL)
    description: >
      Unit price of the procedure per the VPA (Valor de Procedimento Ambulatorial) table used by the
      managing authority, which can differ from the SIGTAP price (NU_PA_TOT); PA_DIF_VAL captures that
      gap times the approved quantity.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_ALTA:
    official_name: Indicador de Alta (APAC)
    translated_name: Discharge indicator
    description: >
      Same discharge flag as AP_ALTA, carried onto the production-file row for APAC-originated
      records.

    codelists: ["ALTA", "PA_ALTA"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_AUTORIZ:
    official_name: Numero da APAC ou autorizacao do BPA-I
    translated_name: APAC/BPA-I authorization number
    description: >
      Authorization number carried onto the production file: the APAC number for APAC-originated rows,
      or the (non-mandatory, uncritiqued) BPA-I authorization number for BPA-I rows - so it can
      legitimately repeat across several BPA-I visits for the same patient and should not be treated
      as a unique key.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      Not mandatory and not validated on BPA-I-origin rows; the same number can legitimately repeat
      across unrelated BPA-I records.


  PA_CATEND:
    official_name: Carater de Atendimento (APAC ou BPA-I)
    translated_name: Type of care episode
    description: >
      Same CARAT_AT-coded care-character field as AP_CATEND, carried onto the production file for
      APAC- and BPA-I-originated rows.

    codelists: ["CARAT_AT", "PA_CATEND"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CBOCOD:
    official_name: Codigo da Ocupacao (CBO)
    translated_name: Executing professional's CBO occupation code
    description: >
      Occupation code of the professional who executed the procedure, per the Classificacao Brasileira
      de Ocupacoes maintained by the Ministry of Labour - a real national classification independent
      of DATASUS.

    codelists: ["CBO"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CIDCAS:
    official_name: CID Causas Associadas (APAC)
    translated_name: Associated-cause ICD-10 code
    description: >
      ICD-10 code for an associated cause on the production-file row, mirroring AP_CIDCAS for APAC-
      originated records.

    codelists: ["S_CID"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CMP:
    official_name: Data da Realizacao do Procedimento / Competencia
    translated_name: Care competence month
    description: >
      AAAAMM competence month the procedure was carried out, as opposed to PA_MVM (when DATASUS
      processed it). The production-file equivalent of AP_CMP.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather than a real
      vocabulary for this field.


  PA_CNPJCPF:
    official_name: CNPJ do Estabelecimento executante
    translated_name: Executing establishment's CNPJ/CPF
    description: >
      Tax ID of the executing establishment on the production file, with the same CNPJ-or-CPF
      ambiguity as AP_CNPJCPF for individual-professional executants.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      May hold a personal CPF (11 digits) instead of an establishment CNPJ (14 digits) - treat short
      values as a personal identifier.


  PA_CNPJMNT:
    official_name: CNPJ da Mantenedora
    translated_name: Establishment's parent-organization CNPJ
    description: >
      CNPJ of the establishment's maintaining organization on the production file, or zeros when it
      has none.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_CNSMED:
    official_name: Numero do CNS do profissional executante
    translated_name: Executing professional's CNS number
    description: >
      CNS (Cartao Nacional de Saude) number of the health professional who executed the procedure - a
      personal identifier of the provider, not the patient.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      Direct personal identifier (CNS) of the executing professional, not the patient. Passed through
      unmodified per project policy; propose no masking, but treat it as sensitive.


  PA_DIF_VAL:
    official_name: Diferenca do Valor Unitario
    translated_name: Unit-price gap x approved quantity (BRL)
    description: >
      Difference between the unified-table unit value and the value actually practiced by the
      production's managing authority, multiplied by the approved quantity (PA_QTDAPR) - a derived
      reconciliation figure, not an independently observed price.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_ENCERR:
    official_name: Indicador de Encerramento (APAC)
    translated_name: Closure indicator
    description: >
      Same episode-closure flag as AP_ENCERR, carried onto the production file for APAC-originated
      rows.

    codelists: ["ENCERRAM", "PA_ENCERR"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_ETNIA:
    official_name: Etnia do paciente
    translated_name: Patient's indigenous ethnicity
    description: >
      Code for the patient's specific indigenous ethnicity on the production file, from the
      DATASUS/FUNAI ethnicity table. As documented for the equivalent BPA-I field, it is only
      meaningful, and normally only filled, when the race/color field is 05-Indigena.

    codelists: ["PA_ETNIA"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      Populated only when the paired race/color field is 05-Indigena; blank/zero otherwise is
      expected, not missingness.


  PA_FLER:
    official_name: Indicador de erro de corpo da APAC
    translated_name: APAC body-error flag
    description: >
      Flag set by the processing pipeline when the body of the APAC record failed a structural check.
      No codelist is bound in this catalog build, so the specific code values cannot be decoded from
      the evidence available here.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_FLIDADE:
    official_name: Compatibilidade com a faixa de idade do procedimento
    translated_name: Age-eligibility compatibility flag
    description: >
      Whether the patient's age (PA_IDADE) fits the procedure's SIGTAP-allowed range (IDADEMIN-
      IDADEMAX). Value meanings are given verbatim in the layout: 0 = idade nao exigida (age not
      required by the procedure), 1 = compativel (age within range), 2 = fora da faixa (age outside
      range), 3 = idade inexistente (no age recorded), 4 = idade em branco (age left blank).

    codelists: ["FL_IDADE", "PA_FLIDADE"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_FLQT:
    official_name: Indicador de erro de Quantidade Produzida
    translated_name: Submitted-quantity error flag
    description: >
      Flag set by the processing pipeline when PA_QTDPRO failed a validation check. No codelist is
      bound in this catalog build.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_IDADE:
    official_name: Idade do paciente em anos
    translated_name: Patient's age in years
    description: >
      The patient's age in years at the time of the procedure, as a plain count - not a coded
      category, despite the catalog binding described below.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      SPURIOUS-BINDING: the catalog binds an 'IDADE' codelist to this column, but the layout describes
      it as a plain age-in-years count. This looks like the same TabNet auto-derived-tabulation-axis
      pattern seen on the date columns, applied here to a numeric column instead.


  PA_INCOUT:
    official_name: Incremento Outros
    translated_name: Other-increment code
    description: >
      Code for a non-urgency payment increment/adjustment applied to the procedure's value; the layout
      gives only the field's label, not the increment schedule itself.

    codelists: ["INCREMENTO", "PA_INCOUT"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_INCURG:
    official_name: Incremento Urgencia
    translated_name: Urgency-increment code
    description: >
      Code for an urgency-related payment increment/adjustment applied to the procedure's value,
      alongside PA_INCOUT.

    codelists: ["INCREMENTO", "PA_INCURG"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_MNDIF:
    official_name: Municipio de residencia diferente do estabelecimento
    translated_name: Patient-vs-establishment municipality mismatch flag
    description: >
      Same derived cross-municipality flag as AP_MNDIF, on the production file: 0 = mesmo municipio, 1
      = municipio diferente, per the layout table.

    codelists: ["INVASAO", "PA_MNDIF"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_MN_IND:
    official_name: Estabelecimento Mantido / Individual
    translated_name: Maintained-vs-individual establishment flag
    description: >
      Same maintained-vs-standalone establishment flag as AP_MN_IND, on the production file.

    codelists: ["MANT_IND", "PA_MN_IND"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_MOTSAI:
    official_name: Motivo de saida
    translated_name: Exit-reason code
    description: >
      Exit/continuation reason code on the production file, or zeros when the row has none (e.g. non-
      APAC-originated rows) - same vocabulary as AP_MOTSAI.

    codelists: ["MOTSAIPE", "PA_MOTSAI"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_MUNPCN:
    official_name: UF+Municipio de residencia do paciente
    translated_name: Patient's home municipality IBGE code
    description: >
      7-char IBGE UF+municipality code of the patient's residence, or of the establishment instead
      when the row's source instrument does not identify the patient (BPA-C-originated rows - check
      PA_DOCORIG). This same caveat is stated directly in the layout document.

    codelists: ["AC_MUNICIP", "..._MUNICIP (per-UF IBGE municipality lists)"]
    code_system: external
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      Falls back to the establishment's own municipality on BPA-C-originated rows (PA_DOCORIG='C'),
      which carry no patient identity - check PA_DOCORIG before treating this as a true residence.


  PA_MVM:
    official_name: Data de Processamento / Movimento
    translated_name: Processing (movimento) month
    description: >
      AAAAMM competence in which DATASUS processed this production-file row - the same processing-vs-
      care-month distinction as AP_MVM/PA_CMP.

    code_system: none
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
    notes: >
      SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather than a real
      vocabulary for this field.


  PA_NIVCPL:
    official_name: Complexidade do Procedimento
    translated_name: Procedure complexity level
    description: >
      Codes the procedure's complexity tier (e.g. basic/medium/high complexity) per SUS's care-
      complexity classification.

    codelists: ["COMPLEX", "PA_NIVCPL"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_OBITO:
    official_name: Indicador de Obito (APAC)
    translated_name: Death indicator
    description: >
      Same death flag as AP_OBITO, carried onto the production file for APAC-originated rows.

    codelists: ["OBITO", "PA_OBITO"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_PERMAN:
    official_name: Indicador de Permanencia (APAC)
    translated_name: Continuation indicator
    description: >
      Same still-in-treatment flag as AP_PERMAN, carried onto the production file for APAC-originated
      rows.

    codelists: ["PERMANEN", "PA_PERMAN"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_RACACOR:
    official_name: Raca/Cor do paciente
    translated_name: Patient's race/color
    description: >
      Same standard race/color categories as AP_RACACOR (01-Branca, 02-Preta, 03-Parda, 04-Amarela,
      05-Indigena, 99-Sem informacao), on the production file.

    codelists: ["RACA_COR", "PA_RACACOR"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"

  PA_REGCT:
    official_name: Codigo da Regra Contratual
    translated_name: Contract-rule code
    description: >
      Code identifying the contractual rule under which the establishment's production is financed;
      the layout gives only the field's label.

    codelists: ["REGRA_C", "PA_REGCT"]
    code_system: internal
    source: layout_doc
    source_ref: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf, section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5"
