system: SINAN
asserted_by: pegasus_data

variables:

  ID_LIQUOR:
    official_name: Amostra clínica coletada - Liquor
    translated_name: Clinical sample collected - CSF
    description: >
      Whether cerebrospinal fluid was collected for viral isolation in a
      measles/rubella (exanthematous-disease) investigation, one of four
      specimen-collection flags (with ID_SANGUE, ID_URINA, ID_SECRECA).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 49 "Isolamento viral - Amostra clínica coletada"

  ID_SANGUE:
    official_name: Amostra clínica coletada - Sangue total
    translated_name: Clinical sample collected - whole blood
    description: >
      Whether whole blood was collected for viral isolation in a
      measles/rubella investigation; sibling specimen flag to ID_LIQUOR,
      ID_URINA and ID_SECRECA. If all four are Não/Ignorado, the form skips
      straight to vaccination ring-blocking.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 49 "Isolamento viral - Amostra clínica coletada"

  ID_SECRECA:
    official_name: Amostra clínica coletada - Secreção nasofaríngea
    translated_name: Clinical sample collected - nasopharyngeal secretion
    description: >
      Whether nasopharyngeal secretion was collected for viral isolation in a
      measles/rubella investigation; sibling specimen flag to ID_LIQUOR,
      ID_SANGUE and ID_URINA.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 49 "Isolamento viral - Amostra clínica coletada"

  ID_URINA:
    official_name: Amostra clínica coletada - Urina
    translated_name: Clinical sample collected - urine
    description: >
      Whether urine was collected for viral isolation in a measles/rubella
      investigation; sibling specimen flag to ID_LIQUOR, ID_SANGUE and
      ID_SECRECA.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 49 "Isolamento viral - Amostra clínica coletada"

  INTOX_CHUM:
    official_name: Agente Tóxico - Chumbo
    translated_name: Toxic agent - lead
    description: >
      Whether lead (chumbo) was the metal identified as the poisoning agent
      in an exogenous-poisoning (Intoxicação Exógena) case, one item of the
      form's metals checklist alongside INTOX_MERC.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and IEXO series
      membership. "INTOX_CHUM" decomposes to "intoxicação por chumbo"; the
      Intoxicação Exógena form is known to break its toxic-agent question
      into a checklist by substance class, with metals as one class.

  INTOX_MERC:
    official_name: Agente Tóxico - Mercúrio
    translated_name: Toxic agent - mercury
    description: >
      Whether mercury was the metal identified as the poisoning agent,
      sibling checklist item to INTOX_CHUM on the same metals sub-list.
    code_system: internal
    source: inferred
    reasoning: >
      Same basis as INTOX_CHUM: C1 width, IEXO series, and unambiguous name
      decomposition ("intoxicação por mercúrio").

  INTOX_META:
    official_name: Agente Tóxico - Outro metal
    translated_name: Toxic agent - other metal
    description: >
      Whether a metal other than lead or mercury was the identified poisoning
      agent. DBF names are capped at 10 characters, so "INTOX_META" most
      likely truncates "INTOX_METAL" rather than naming one specific metal.
    code_system: internal
    source: inferred
    reasoning: >
      Same C1/IEXO basis as INTOX_CHUM and INTOX_MERC. Read as the
      checklist's catch-all "outro metal" item rather than a third named
      metal, since no other common heavy-metal name fits the 10-character
      DBF limit as cleanly.

  INT_TEMPO:
    official_name: Em caso afirmativo, especifique intervalo de tempo
    translated_name: Vaccine ring-blocking response time
    description: >
      How quickly the vaccination ring-block (bloqueio vacinal) was carried
      out after notification of a measles/rubella case: within 72 hours or
      after. Only filled in when a ring-block was actually done
      (CS_VACINAL = Sim).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 53 "Em caso afirmativo, especifique intervalo de tempo"

  IONIZANTES:
    official_name: Agentes de Exposição - Radiações Ionizantes
    translated_name: Occupational exposure - ionizing radiation
    description: >
      Whether the patient was ever occupationally exposed to ionizing
      radiation, sibling item to HIDROCARBO and HORMONIO on the
      work-related-cancer form's lifetime carcinogen-exposure checklist.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Cancer_v5.pdf, campo 49 "Houve exposição nos locais de trabalho"

  LAB_AGLIQU:
    official_name: LATEX líquor
    translated_name: Latex agglutination test - CSF
    description: >
      Etiologic-agent code from the latex particle agglutination test on CSF,
      part of the meningitis form's four-test-by-four-specimen laboratory
      grid; sibling to LAB_AGSANG (same test on blood/serum).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "LATEX líquor"

  LAB_AGSANG:
    official_name: LATEX Sangue/soro
    translated_name: Latex agglutination test - blood/serum
    description: >
      Same latex-agglutination test as LAB_AGLIQU, run on blood/serum instead
      of CSF.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "LATEX Sangue/soro"

  LAB_BCESCA:
    official_name: Bacterioscopia escarro
    translated_name: Gram stain (bacterioscopy) - sputum
    description: >
      Etiologic-agent code from Gram-stain microscopy of sputum, one specimen
      in the meningitis form's bacterioscopy row alongside LAB_BCLESA (skin
      lesion), LAB_BCLIQU (CSF) and LAB_BCSANG (blood).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Bacterioscopia escarro"

  LAB_BCLESA:
    official_name: Bacterioscopia lesão petequial
    translated_name: Gram stain (bacterioscopy) - petechial lesion
    description: >
      Same Gram-stain test as LAB_BCESCA, run on material from a petechial
      skin lesion rather than sputum.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Bacterioscopia lesão petequial"

  LAB_BCLIQU:
    official_name: Bacterioscopia líquor
    translated_name: Gram stain (bacterioscopy) - CSF
    description: >
      Same Gram-stain test as LAB_BCESCA, run on cerebrospinal fluid — the
      specimen most central to a meningitis diagnosis.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Bacterioscopia líquor"

  LAB_BCSANG:
    official_name: Bacterioscopia Sangue/soro
    translated_name: Gram stain (bacterioscopy) - blood/serum
    description: >
      Same Gram-stain test as LAB_BCESCA, run on blood/serum.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Bacterioscopia Sangue/soro"

  LAB_CILIQU:
    official_name: CIE líquor
    translated_name: Counterimmunoelectrophoresis - CSF
    description: >
      Etiologic-agent code from counterimmunoelectrophoresis (CIE) on CSF, a
      second antigen-detection test alongside the latex-agglutination pair
      (LAB_AGLIQU/LAB_AGSANG); sibling to LAB_CISANG on blood/serum.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "CIE líquor"

  LAB_CISANG:
    official_name: CIE Sangue/soro
    translated_name: Counterimmunoelectrophoresis - blood/serum
    description: >
      Same CIE test as LAB_CILIQU, run on blood/serum.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "CIE Sangue/soro"

  LAB_CLOR:
    official_name: Exame Quimiocitológico - Cloreto
    translated_name: CSF chemocytology - chloride
    description: >
      Chloride concentration measured in the meningitis patient's CSF, one
      value in the quimiocitológico panel alongside LAB_HEMA, LAB_GLICO,
      LAB_PROT and the cell counts. A plain numeric lab value, not a coded
      field.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, "Exame Quimiocitológico Cloreto"

  LAB_COLHEU:
    official_name: Colheu material (amostra)
    translated_name: Biological sample collected (flag)
    description: >
      Whether a biological sample was collected from the Hantavirose patient
      for laboratory testing, gating the serology/RT-PCR result fields that
      follow.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond C1 declared type and HANT series membership;
      the confirmed Hantavirose layout uses the analogous AM_SANGUE flag
      ("Colheu amostra de sangue para exames clínicos/bioquímicos") to gate
      its own lab block, and LAB_COLHEU's name and role match that same
      "did collection happen" pattern for a different lab step in the same
      form family.

  LAB_CTESCA:
    official_name: Cultura escarro
    translated_name: Culture - sputum
    description: >
      Etiologic-agent code from microbial culture of sputum, one specimen in
      the meningitis form's culture row alongside LAB_CTLESA (skin lesion),
      LAB_CTLIQU (CSF) and LAB_CTSANG (blood).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Cultura escarro"

  LAB_CTLESA:
    official_name: Cultura lesão petequial
    translated_name: Culture - petechial lesion
    description: >
      Same culture test as LAB_CTESCA, run on material from a petechial skin
      lesion.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Cultura lesão petequial"

  LAB_CTLIQU:
    official_name: Cultura Líquor
    translated_name: Culture - CSF
    description: >
      Same culture test as LAB_CTESCA, run on cerebrospinal fluid — the
      reference specimen for confirming bacterial meningitis.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Cultura Líquor"

  LAB_CTSANG:
    official_name: Cultura Sangue/soro
    translated_name: Culture - blood/serum
    description: >
      Same culture test as LAB_CTESCA, run on blood/serum.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "Cultura Sangue/soro"

  LAB_DERRAM:
    official_name: Alterações radiológicas - Derrame Pleural
    translated_name: Chest X-ray finding - pleural effusion
    description: >
      Whether the Hantavirose patient's chest X-ray showed pleural effusion,
      one of three imaging findings (with LAB_DIFUSO and LAB_LOCAL) checked
      only when a chest X-ray was actually done.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 41 "Se sim, apresentou alguma destas alterações?"

  LAB_DIFUSO:
    official_name: Alterações radiológicas - Infiltrado Pulmonar Difuso
    translated_name: Chest X-ray finding - diffuse pulmonary infiltrate
    description: >
      Whether the Hantavirose patient's chest X-ray showed a diffuse
      pulmonary infiltrate, the classic early radiographic sign of hantavirus
      cardiopulmonary syndrome; sibling finding to LAB_LOCAL (localized
      infiltrate) and LAB_DERRAM (pleural effusion).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 41 "Se sim, apresentou alguma destas alterações?"
