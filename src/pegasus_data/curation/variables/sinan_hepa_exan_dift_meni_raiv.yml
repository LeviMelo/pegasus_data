# Five SINAN forms: viral hepatitis, exanthematous disease, diphtheria,
# meningitis and anti-rabies prophylaxis.
#
# Each is a self-contained investigation form and they share almost nothing but
# the notification header, so each block below is read on its own terms:
#
#   HEPA  exposure history, then the serology panel that names the virus
#   EXAN  measles/rubella surveillance: paired sera, weeks apart
#   DIFT  the pseudomembrane, its spread, and the toxin's late complications
#   MENI  vaccination history, comorbidity, and the CSF appearance
#   RAIV  what the animal did, where, how deep, and what prophylaxis followed
#
# A caution on RAIV. Most of its columns describe an ANTI-RABIES ATTENDANCE —
# a person exposed to an animal and treated to prevent rabies — not a human
# rabies case. Human rabies is nearly always fatal and vanishingly rare;
# attendances number in the hundreds of thousands. Counting rows here as cases
# of rabies overstates the disease by orders of magnitude.
system: SINAN
asserted_by: pegasus_data

variables:

  # ============================================ HEPA, viral hepatitis
  HEPATITA:
    official_name: Vacinação contra hepatite A
    translated_name: Hepatitis A vaccination
    description: >
      Whether hepatitis A vaccination is complete, incomplete, or absent.
      Susceptibility is the point: a fully vaccinated patient with hepatitis is
      unlikely to have A.
    code_system: internal
    source: def
    source_ref: HEPNAOVA.CNV
    reasoning: >
      Bound to HEPNAOVA, whose values are completa, incompleta and não vacinado.

  HEPATITB:
    official_name: Vacinação contra hepatite B
    translated_name: Hepatitis B vaccination
    description: >
      Hepatitis B vaccination status. Read with ANTIHBS, which shows whether the
      vaccination actually produced immunity.
    code_system: internal
    source: def
    source_ref: HEPNAOVA.CNV
    reasoning: Bound to HEPNAOVA, the same completa/incompleta/não vacinado list.

  SEXUAL:
    official_name: Exposição sexual
    translated_name: Sexual exposure
    description: >
      Sexual exposure, and whether it was within the last six months or earlier.
      The exposure block is not a yes/no: the six-month split is what makes an
      exposure plausible as the source of an acute infection.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: >
      Bound to HEPA6MES, whose values are sim há menos de 6 meses, sim há mais
      de seis meses, and não.

  DOMICILI:
    official_name: Contato domiciliar
    translated_name: Household contact
    description: >
      Contact with a case in the household, with the same six-month split.
      Household transmission is the dominant route for hepatitis A.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; DOMICILI reads domiciliar.

  OCUPACIO:
    official_name: Exposição ocupacional
    translated_name: Occupational exposure
    description: >
      Occupational exposure to blood or body fluids. The route that makes
      hepatitis B an occupational disease for health workers.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; OCUPACIO reads ocupacional.

  TRANSFUSAO:
    official_name: Transfusão de sangue
    translated_name: Blood transfusion
    description: >
      Transfusion in the exposure window. Historically the major route for
      hepatitis C, and now rare enough that a positive answer is investigated.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; TRANSFUSAO reads transfusão.

  HEMODIALIS:
    official_name: Hemodiálise
    translated_name: Haemodialysis
    description: >
      Haemodialysis exposure. Dialysis units have transmitted hepatitis B and C
      through the blood circuit, which is why dialysis patients are screened
      repeatedly.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; HEMODIALIS reads hemodiálise.

  TRANSPLA:
    official_name: Transplante
    translated_name: Transplant
    description: Transplant exposure, another route through donated tissue.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; TRANSPLA reads transplante.

  CIRURGICO:
    official_name: Procedimento cirúrgico
    translated_name: Surgical procedure
    description: Surgery in the exposure window, a parenteral route.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; CIRURGICO reads cirúrgico.

  DENTARIO:
    official_name: Tratamento dentário
    translated_name: Dental treatment
    description: >
      Dental treatment, recorded separately from surgery because instrument
      sterilisation in dentistry has its own transmission history.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; DENTARIO reads dentário.

  INJETAVEIS:
    official_name: Uso de drogas injetáveis
    translated_name: Injecting drug use
    description: >
      Injecting drug use. The highest-risk route for hepatitis C, and the reason
      INAL_CRACK is asked beside it.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; INJETAVEIS reads injetáveis.

  INAL_CRACK:
    official_name: Uso de drogas inaladas
    translated_name: Inhaled drug use
    description: >
      Inhaled drug use. Recorded because shared straws transmit hepatitis C
      through nasal mucosa, so the route is not confined to injecting.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; INAL_CRACK reads inalação de crack.

  TATU_PIER:
    official_name: Tatuagem ou piercing
    translated_name: Tattoo or piercing
    description: Tattooing or piercing, a percutaneous route through shared equipment.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; TATU_PIER reads tatuagem/piercing.

  ACUPUNTURA:
    official_name: Acupuntura
    translated_name: Acupuncture
    description: Acupuncture, another percutaneous route through reused needles.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; ACUPUNTURA reads acupuntura.

  TRESMAIS:
    official_name: Três ou mais parceiros sexuais
    translated_name: Three or more sexual partners
    description: >
      Three or more sexual partners in the exposure window, a quantified
      companion to the SEXUAL flag.
    code_system: internal
    source: def
    source_ref: HEPA6MES.CNV
    reasoning: Bound to HEPA6MES; TRESMAIS reads três ou mais.

  OUTRA_DST:
    official_name: Outra DST
    translated_name: Other sexually transmitted infection
    description: >
      Another sexually transmitted infection. Its presence corroborates a sexual
      route where the exposure history is uncertain.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; DST reads doença sexualmente transmissível.

  BANCOSANGU:
    official_name: Local de detecção
    translated_name: Where the infection was detected
    description: >
      Whether the infection was found at a blood bank or a testing centre. Cases
      found at a blood bank are asymptomatic donors, so they represent a quite
      different population from those found clinically.
    code_system: internal
    source: def
    source_ref: BANCOSAN.CNV
    reasoning: >
      Bound to BANCOSAN, whose values are banco de sangue, centro de testagem
      and não se aplica.

  DT_ACIDENT:
    official_name: Data do acidente
    translated_name: Date of the exposure incident
    description: Date of the exposure incident, where one specific event is identifiable.
    code_system: none
    source: inferred
    reasoning: D(8) date; DT_ACIDENT reads data do acidente.

  CO_UF_EXP:
    official_name: UF da exposição
    translated_name: State of exposure
    description: >
      State where the exposure happened. Three exposure locations can be
      recorded, since the source is often not where the patient lives.
    code_system: internal
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: C(2) state code bound to the UF codelists; EXP reads exposição.

  CO_MUN_EXP:
    official_name: Município da exposição
    translated_name: Municipality of exposure
    description: Municipality where the exposure happened, the finer companion to CO_UF_EXP.
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: C(6) IBGE code bound to the municipality codelists.

  CO_UF_EX2:
    official_name: UF da segunda exposição
    translated_name: State of second exposure
    description: State of a second exposure location. See CO_UF_EXP.
    code_system: internal
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: The second slot of the three exposure-location pairs.

  CO_MUN_EX2:
    official_name: Município da segunda exposição
    translated_name: Municipality of second exposure
    description: Municipality of the second exposure location.
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: The second slot of the exposure municipality series.

  CO_UF_EX3:
    official_name: UF da terceira exposição
    translated_name: State of third exposure
    description: State of a third exposure location.
    code_system: internal
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: The third slot of the exposure state series.

  CO_MUN_EX3:
    official_name: Município da terceira exposição
    translated_name: Municipality of third exposure
    description: Municipality of the third exposure location.
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: The third slot of the exposure municipality series.

  # --- the serology panel: which virus, and which stage --------------------
  AGHBS:
    official_name: HBsAg
    translated_name: Hepatitis B surface antigen
    description: >
      Hepatitis B surface antigen. Its presence means current infection, acute or
      chronic; the rest of the B panel decides which.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: >
      Bound to HEPREAG, whose values are reagente, não reagente, inconclusivo
      and não realizado. AGHBS is the surface antigen.

  RES_HBSAG:
    official_name: Resultado do HBsAg
    translated_name: HBsAg result
    description: >
      The HBsAg result as carried in a second field, beside AGHBS. Schema
      generations of this form record the same marker twice, so read whichever
      is populated.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; a duplicate of the AGHBS marker.

  ANTIHBS:
    official_name: Anti-HBs
    translated_name: Anti-HBs antibody
    description: >
      Antibody to the surface antigen. Means immunity — from vaccination if
      anti-HBc is absent, from resolved infection if it is present. The pair is
      what distinguishes the two.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; ANTIHBS is the surface antibody.

  ANTIHBCIGM:
    official_name: Anti-HBc IgM
    translated_name: Anti-HBc IgM
    description: >
      IgM against the core antigen. The marker of ACUTE hepatitis B: with HBsAg
      present, IgM says the infection is recent rather than chronic.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the IgM class of the core antibody.

  HBC_TOTAL:
    official_name: Anti-HBc total
    translated_name: Anti-HBc total
    description: >
      Total core antibody, IgM and IgG together. Persists for life after any
      infection, so it separates a vaccinated person from one who was infected
      and recovered.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the total core antibody.

  RE_ANTIHBC:
    official_name: Resultado do anti-HBc
    translated_name: Anti-HBc result
    description: The core antibody result in a second field, beside HBC_TOTAL.
    code_system: none
    source: inferred
    reasoning: C(1) duplicate of the core antibody marker in another generation.

  AGHBE:
    official_name: HBeAg
    translated_name: Hepatitis B e antigen
    description: >
      The e antigen. Marks active viral replication and high infectivity, so it
      matters for whether contacts need prophylaxis.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; AGHBE is the e antigen.

  ANTIHBE:
    official_name: Anti-HBe
    translated_name: Anti-HBe antibody
    description: >
      Antibody to the e antigen. Its appearance as HBeAg disappears marks
      seroconversion and falling infectivity.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the e antibody.

  ANTIHAVIGM:
    official_name: Anti-HAV IgM
    translated_name: Anti-HAV IgM
    description: >
      IgM against hepatitis A. The single test that diagnoses acute hepatitis A,
      which has no chronic form.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the hepatitis A IgM marker.

  RE_ANTIHCV:
    official_name: Resultado do anti-HCV
    translated_name: Anti-HCV result
    description: >
      Antibody to hepatitis C. Screening only: it stays positive after cure, so
      it does not distinguish current from past infection.
    code_system: none
    source: inferred
    reasoning: C(1) hepatitis C antibody result, paired with TP_SOROHCV.

  TP_SOROHCV:
    official_name: Sorologia para hepatite C
    translated_name: Hepatitis C serology
    description: >
      The hepatitis C serology result on the coded scale. Confirming current
      infection needs the genotype or a viral load, which is why GEN_VHC exists.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the coded hepatitis C serology.

  GEN_VHC:
    official_name: Genótipo do HCV
    translated_name: Hepatitis C genotype
    description: >
      Which of genotypes 1 to 6 the virus is. It determined treatment choice and
      duration in the interferon era, and detecting it at all confirms current
      rather than past infection.
    code_system: internal
    source: def
    source_ref: GENOTIPO.CNV
    reasoning: Bound to GENOTIPO, whose values are genótipo 1 through 6.

  ANTIHDV:
    official_name: Anti-HDV
    translated_name: Anti-HDV antibody
    description: >
      Antibody to hepatitis D. Delta only infects alongside hepatitis B, and it
      is endemic in the western Amazon, so this marker matters regionally far
      more than nationally.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the hepatitis D antibody.

  ANTIHDVIGM:
    official_name: Anti-HDV IgM
    translated_name: Anti-HDV IgM
    description: >
      IgM against hepatitis D, marking recent delta infection as against the
      past exposure ANTIHDV shows.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the IgM class of the delta antibody.

  ANTIHEVIGM:
    official_name: Anti-HEV IgM
    translated_name: Anti-HEV IgM
    description: >
      IgM against hepatitis E. Rare in Brazil, tested to exclude it in acute
      cases where A and B are negative.
    code_system: internal
    source: def
    source_ref: HEPREAG.CNV
    reasoning: Bound to HEPREAG; the hepatitis E IgM marker.

  COLETAMARC:
    official_name: Data da coleta dos marcadores
    translated_name: Date markers were collected
    description: >
      When the serology sample was taken. Marker interpretation depends on
      timing — IgM windows open and close — so the date is what makes the panel
      readable.
    code_system: none
    source: inferred
    reasoning: D(8) date for the marker collection.

  # ================================= EXAN, measles and rubella surveillance
  CS_VACINA:
    official_name: Vacinado
    translated_name: Vaccinated
    description: >
      Whether the patient had been vaccinated against measles or rubella.
      Vaccine can itself cause a rash and a positive IgM, so this field is what
      raises that alternative explanation.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no vaccination flag opening the EXAN antecedent block.

  DT_DOSE_N:
    official_name: Data da última dose
    translated_name: Date of last dose
    description: >
      Date of the last vaccine dose. A rash within about two weeks of a dose is
      likely vaccine-associated, so the interval decides the interpretation.
    code_system: none
    source: inferred
    reasoning: D(8) date following CS_VACINA.

  CS_FONTE:
    official_name: Local provável de contágio
    translated_name: Probable place of infection
    description: >
      Where the infection was probably acquired — home, neighbourhood, work,
      school or nursery, a health facility, or another state or country. Import
      is the key question in a country that has eliminated measles.
    code_system: internal
    source: def
    source_ref: LOCALCONNET.CNV
    reasoning: >
      Bound to LOCALCONNET, whose values run from domicílio through outra UF and
      outro país.

  DT_INICIO_:
    official_name: Data do início do exantema
    translated_name: Date the rash began
    description: >
      When the rash started. Serology timing is measured from rash onset, not
      from fever, so this is the anchor for the whole laboratory sequence.
    code_system: none
    source: inferred
    reasoning: D(8) date; the rash onset that dates the sample intervals.

  ID_TOSSE:
    official_name: Tosse
    translated_name: Cough
    description: >
      Cough. With coryza and conjunctivitis it forms the triad that distinguishes
      measles from rubella clinically, before any laboratory result.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag; TOSSE reads tosse.

  ID_CORIZA:
    official_name: Coriza
    translated_name: Coryza
    description: Runny nose, the second element of the measles triad. See ID_TOSSE.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag; CORIZA reads coriza.

  ID_CONJUNT:
    official_name: Conjuntivite
    translated_name: Conjunctivitis
    description: Conjunctivitis, the third element of the measles triad. See ID_TOSSE.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag; CONJUNT reads conjuntivite.

  ID_ARTRALG:
    official_name: Artralgia
    translated_name: Joint pain
    description: >
      Joint pain. Points to rubella rather than measles, especially in adult
      women, so it pulls the differential the other way from the triad.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag; ARTRALG reads artralgia.

  ID_GANGLIO:
    official_name: Linfadenopatia
    translated_name: Swollen lymph nodes
    description: Swollen lymph nodes, characteristic of rubella.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag; GANGLIO reads gânglios.

  ID_RETRO:
    official_name: Linfadenopatia retroauricular
    translated_name: Retroauricular nodes
    description: >
      Nodes behind the ears specifically. The classic rubella sign, recorded
      apart from general lymphadenopathy because the site is what makes it
      diagnostic.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag; RETRO reads retroauricular.

  ID_HOSPIT:
    official_name: Hospitalização
    translated_name: Hospitalised
    description: >
      Whether the patient was admitted. Measles complications — pneumonia,
      encephalitis — are what drive admission in a rash illness.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; HOSPIT reads hospitalização.

  NM_MUN_HOS:
    official_name: Município de hospitalização
    translated_name: Municipality of hospitalisation
    description: Where the patient was admitted, by IBGE code.
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: C(6) IBGE code bound to the municipality codelists.

  DT_COL_1:
    official_name: Data da coleta da primeira amostra
    translated_name: Date first sample collected
    description: >
      When the first serum was taken. Taken too early it misses IgM, which is
      why a second sample exists.
    code_system: none
    source: inferred
    reasoning: D(8) date; the first of the paired sera.

  DT_COL_2:
    official_name: Data da coleta da segunda amostra
    translated_name: Date second sample collected
    description: >
      When the second serum was taken, weeks after the first. The pair is what
      shows a rising titre, which confirms recent infection where a single
      sample cannot.
    code_system: none
    source: inferred
    reasoning: D(8) date; the second of the paired sera.

  ID_S1_IGM:
    official_name: IgM na primeira amostra
    translated_name: IgM, first sample
    description: >
      IgM on the first serum. Marks recent infection. The S1, S2 and RE groups
      repeat the same antibody panel for the first sample, the second, and a
      re-test.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: >
      Bound to REAGENTE; S1 is the first sample and the parallel S2 and RE
      prefixes carry the same markers at later points.

  ID_S1_IGG:
    official_name: IgG na primeira amostra
    translated_name: IgG, first sample
    description: >
      IgG on the first serum. Past infection or vaccination on its own; the rise
      between samples is what makes it informative.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the IgG marker of the first sample.

  ID_S1_IGM_:
    official_name: IgM na primeira amostra, segundo agente
    translated_name: IgM, first sample, second agent
    description: >
      IgM for the second agent on the first serum. Each sample is tested against
      measles and rubella in parallel, because the form is a syndrome channel
      rather than a single-disease one.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: >
      Bound to REAGENTE; the trailing underscore and the _1/_2 suffixes mark
      further agents tested on the same sample.

  ID_S1_IGG_:
    official_name: IgG na primeira amostra, segundo agente
    translated_name: IgG, first sample, second agent
    description: IgG for the second agent on the first serum. See ID_S1_IGM_.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the second agent's IgG on sample 1.

  ID_S1_IG_1:
    official_name: Imunoglobulina adicional, primeira amostra
    translated_name: Additional immunoglobulin, first sample
    description: A further antibody result on the first serum, for an additional agent tested.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; a further marker slot on sample 1.

  ID_S1_IG_2:
    official_name: Segunda imunoglobulina adicional, primeira amostra
    translated_name: Second additional immunoglobulin, first sample
    description: A second further antibody result on the first serum.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; another marker slot on sample 1.

  ID_S2_IGM:
    official_name: IgM na segunda amostra
    translated_name: IgM, second sample
    description: IgM on the second serum, the paired counterpart of ID_S1_IGM.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the S2 sample's IgM.

  ID_S2_IGG:
    official_name: IgG na segunda amostra
    translated_name: IgG, second sample
    description: >
      IgG on the second serum. Compared with ID_S1_IGG, a fourfold rise confirms
      recent infection.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the S2 sample's IgG.

  ID_S2_IGM_:
    official_name: IgM na segunda amostra, segundo agente
    translated_name: IgM, second sample, second agent
    description: IgM for the second agent on the second serum.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the second agent's IgM on sample 2.

  ID_S2_IGG_:
    official_name: IgG na segunda amostra, segundo agente
    translated_name: IgG, second sample, second agent
    description: IgG for the second agent on the second serum.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the second agent's IgG on sample 2.

  ID_S2_IG_1:
    official_name: Imunoglobulina adicional, segunda amostra
    translated_name: Additional immunoglobulin, second sample
    description: A further antibody result on the second serum.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; a further marker slot on sample 2.

  ID_S2_IG_2:
    official_name: Segunda imunoglobulina adicional, segunda amostra
    translated_name: Second additional immunoglobulin, second sample
    description: A second further antibody result on the second serum.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; another marker slot on sample 2.

  ID_RE_IGM:
    official_name: IgM no reexame
    translated_name: IgM, re-test
    description: >
      IgM on a re-tested sample. Re-testing happens when the paired results were
      discordant or the first was inconclusive.
