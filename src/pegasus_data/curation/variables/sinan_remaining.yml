# The remaining SINAN forms, and the last CNES columns.
#
# Grouped by agravo, because that is the only order in which they mean anything.
#
# One correction worth recording. SINAN.ANTR is NOT anthrax, despite the
# abbreviation looking like one. Its columns settle it: CONDIC_ANI grades the
# animal sadio/suspeito/raivoso, FIM_ANIMAL reports whether the animal tested
# positive for rabies, and TRAT_ATUAL offers "observação do animal (se cão ou
# gato)" and "soro + vacina". ANTR is ATendimento aNTiRrábico — human
# anti-rabies care — which is also how DATASUS files it in its open-data tree.
# SINAN.RAIV covers the same ground in an earlier form generation.
system: SINAN
asserted_by: pegasus_data

variables:

  # ================================================ FTIF, typhoid fever
  ATENDIMENT:
    official_name: Local de atendimento
    translated_name: Care setting
    description: >
      Whether the patient was treated in hospital, as an outpatient, at home, or
      not at all. Typhoid needing admission is a different severity from typhoid
      treated at a clinic.
    code_system: internal
    source: def
    source_ref: HOSPAMB.CNV
    reasoning: >
      Bound to HOSPAMB, whose values are hospitalar, ambulatorial, domiciliar
      and nenhum.

  ENTERO:
    official_name: Enterorragia
    translated_name: Intestinal bleeding
    description: >
      Intestinal bleeding. One of the two classic complications of typhoid, both
      arising in the third week as the ulcerated Peyer's patches erode.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ENTERO reads enterorragia; a yes/no complication flag.

  PERFURA:
    official_name: Perfuração intestinal
    translated_name: Intestinal perforation
    description: >
      Intestinal perforation. The other classic complication, and a surgical
      emergency with high mortality.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PERFURA reads perfuração; a yes/no complication flag.

  COMP_OUT:
    official_name: Outra complicação
    translated_name: Other complication
    description: Any complication the named items do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the complications block.

  ANTIBIOTIC:
    official_name: Uso prévio de antibiótico
    translated_name: Prior antibiotic use
    description: >
      Whether antibiotics were taken before the samples. Prior antibiotics
      sterilise the cultures, so this field is what a negative result has to be
      read against.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag preceding the culture block.

  SANGUE:
    official_name: Coleta de sangue
    translated_name: Blood collected
    description: >
      Whether blood was taken for culture. Blood culture is most sensitive in
      the first week of illness, before stool culture becomes useful.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: SANGUE reads sangue; a specimen flag.

  FEZES:
    official_name: Coleta de fezes
    translated_name: Stool collected
    description: >
      Whether stool was taken. More useful later in the illness than blood, and
      the specimen that identifies chronic carriers.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: FEZES reads fezes; a specimen flag.

  DT_HEMO1:
    official_name: Data da hemocultura
    translated_name: Date of blood culture
    description: When blood was taken for culture, which bounds how sensitive the result can be.
    code_system: none
    source: inferred
    reasoning: D(8) date; HEMO reads hemocultura.

  HEMO_R1:
    official_name: Resultado da hemocultura
    translated_name: Blood culture result
    description: >
      What the blood culture grew: Salmonella Typhi, another Salmonella,
      nothing, or a different agent. Only S. Typhi confirms typhoid — other
      Salmonella means a different illness entirely.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: >
      Bound to SALMONELA, whose values are Salmonella Typhi, Salmonella SPP,
      negativo and outro agente.

  DT_URO:
    official_name: Data da primeira urocultura
    translated_name: Date of first urine culture
    description: When the first urine sample was taken for culture.
    code_system: none
    source: inferred
    reasoning: D(8) date; URO reads urocultura.

  URO_R1:
    official_name: Resultado da primeira urocultura
    translated_name: First urine culture result
    description: >
      What the first urine culture grew, on the same Salmonella scale as the
      blood culture. Three urine samples are taken because shedding is
      intermittent.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the first of three urine cultures.

  DT_URO2:
    official_name: Data da segunda urocultura
    translated_name: Date of second urine culture
    description: When the second urine sample was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the second urine culture.

  URO_R2:
    official_name: Resultado da segunda urocultura
    translated_name: Second urine culture result
    description: What the second urine culture grew. See URO_R1.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the second of three urine cultures.

  DT_URO3:
    official_name: Data da terceira urocultura
    translated_name: Date of third urine culture
    description: When the third urine sample was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the third urine culture.

  URO_R3:
    official_name: Resultado da terceira urocultura
    translated_name: Third urine culture result
    description: What the third urine culture grew. See URO_R1.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the third of three urine cultures.

  DT_COPRO1:
    official_name: Data da primeira coprocultura
    translated_name: Date of first stool culture
    description: When the first stool sample was taken for culture.
    code_system: none
    source: inferred
    reasoning: D(8) date; COPRO reads coprocultura.

  COPRO_R1:
    official_name: Resultado da primeira coprocultura
    translated_name: First stool culture result
    description: >
      What the first stool culture grew. Three are taken; persistent growth
      after recovery identifies a chronic carrier, who is the source that keeps
      typhoid circulating.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the first of three stool cultures.

  DT_COPRO2:
    official_name: Data da segunda coprocultura
    translated_name: Date of second stool culture
    description: When the second stool sample was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the second stool culture.

  COPRO_R2:
    official_name: Resultado da segunda coprocultura
    translated_name: Second stool culture result
    description: What the second stool culture grew. See COPRO_R1.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the second of three stool cultures.

  DT_COPRO3:
    official_name: Data da terceira coprocultura
    translated_name: Date of third stool culture
    description: When the third stool sample was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the third stool culture.

  COPRO_R3:
    official_name: Resultado da terceira coprocultura
    translated_name: Third stool culture result
    description: What the third stool culture grew. See COPRO_R1.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the third of three stool cultures.

  DT_OUTR1:
    official_name: Data da primeira outra cultura
    translated_name: Date of first other culture
    description: >
      When another specimen was taken — bone marrow or bile, which outperform
      blood when antibiotics have already started.
    code_system: none
    source: inferred
    reasoning: D(8) date; the first of three other-specimen cultures.

  OUTR_R1:
    official_name: Resultado da primeira outra cultura
    translated_name: First other culture result
    description: What the other specimen grew, on the same Salmonella scale.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the first other-specimen culture.

  DT_OUTR2:
    official_name: Data da segunda outra cultura
    translated_name: Date of second other culture
    description: When a second other specimen was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the second other-specimen culture.

  OUTR_R2:
    official_name: Resultado da segunda outra cultura
    translated_name: Second other culture result
    description: What the second other specimen grew.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the second other-specimen culture.

  DT_OUTR3:
    official_name: Data da terceira outra cultura
    translated_name: Date of third other culture
    description: When a third other specimen was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the third other-specimen culture.

  OUTR_R3:
    official_name: Resultado da terceira outra cultura
    translated_name: Third other culture result
    description: What the third other specimen grew.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the third other-specimen culture.

  # ================================================= COQU, whooping cough
  ANT_SENTIN:
    official_name: Unidade sentinela
    translated_name: Sentinel unit
    description: >
      Whether the case came from a sentinel unit. Sentinel surveillance samples
      deliberately rather than exhaustively, so sentinel cases must not be
      pooled with routine notifications as though they were one population.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: SENTIN reads sentinela; a yes/no flag.

  CS_VAC_N:
    official_name: Doses de vacina recebidas
    translated_name: Vaccine doses received
    description: >
      Doses of pertussis vaccine received, from one through three plus two
      boosters, or never. Protection wanes, so adolescents and adults are
      susceptible again and become the source for unvaccinated infants.
    code_system: internal
    source: def
    source_ref: DOSES.CNV
    reasoning: Bound to DOSES, whose values run uma through nunca vacinado.

  DT_CATARRA:
    official_name: Data do início da fase catarral
    translated_name: Date the catarrhal phase began
    description: >
      When the catarrhal phase began — the first stage, which looks like an
      ordinary cold and is when the patient is most infectious. Antibiotics only
      alter the course if started here.
    code_system: none
    source: inferred
    reasoning: D(8) date; CATARRA reads catarral.

  CS_TOSSE_E:
    official_name: Tosse em acessos
    translated_name: Paroxysmal cough
    description: >
      Cough in paroxysms — the fits of coughing that define the second stage and
      give the disease its Portuguese name, coqueluche.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: TOSSE_E reads tosse em acessos; a yes/no clinical flag.

  CS_TOSSE_P:
    official_name: Guincho inspiratório
    translated_name: Inspiratory whoop
    description: >
      The whoop drawn on breathing in after a paroxysm. Absent in infants, who
      are the ones at real risk, so its absence does not exclude the diagnosis.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no clinical flag paired with CS_TOSSE_E.

  CS_CIANOSE:
    official_name: Cianose
    translated_name: Cyanosis
    description: >
      Going blue during a paroxysm. In infants this marks the episodes that
      become life-threatening.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CIANOSE reads cianose; a yes/no clinical flag.

  CS_APNEIA:
    official_name: Apneia
    translated_name: Apnoea
    description: >
      Pauses in breathing. In young infants apnoea can be the ONLY sign of
      pertussis, with no cough at all, and it is what kills them.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: APNEIA reads apneia; a yes/no clinical flag.

  CS_TEMP37:
    official_name: Febre até 37 graus
    translated_name: Temperature up to 37
    description: >
      Little or no fever. Pertussis characteristically runs without fever, which
      distinguishes it from other causes of persistent cough.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: TEMP37 names the sub-38 band; paired with CS_TEMP_38.

  CS_TEMP_38:
    official_name: Febre acima de 38 graus
    translated_name: Temperature above 38
    description: >
      Fever above 38. Unusual in pertussis itself and usually means a secondary
      infection, most often the pneumonia in CS_PNEUMON.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: TEMP_38 names the above-38 band; paired with CS_TEMP37.

  CS_OUT_SIN:
    official_name: Outro sinal ou sintoma
    translated_name: Other sign, pertussis
    description: >
      A sign outside the pertussis list of paroxysms, whoop, cyanosis and
      apnoea.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the clinical block.

  CS_PNEUMON:
    official_name: Pneumonia
    translated_name: Pneumonia
    description: >
      Pneumonia as a complication. The commonest cause of death in pertussis,
      and the reason infants are admitted.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PNEUMON reads pneumonia; a complication flag.

  CS_ENCEFAL:
    official_name: Encefalopatia
    translated_name: Encephalopathy
    description: >
      Encephalopathy, from the hypoxia of repeated paroxysms. Rare and
      frequently leaves permanent damage.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ENCEFAL reads encefalopatia; a complication flag.

  CS_DESITRA:
    official_name: Desidratação
    translated_name: Dehydration
    description: >
      Dehydration, usually because the paroxysms make feeding and keeping food
      down impossible.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DESITRA reads desidratação; a complication flag.

  CS_OTITE:
    official_name: Otite
    translated_name: Otitis
    description: Middle ear infection as a secondary complication.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: OTITE reads otite; a complication flag.

  CS_DESNUTR:
    official_name: Desnutrição
    translated_name: Malnutrition
    description: >
      Malnutrition, from weeks of impaired feeding. It also worsens the
      prognosis, so cause and consequence run both ways.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DESNUTR reads desnutrição; a complication flag.

  CS_OUT_COM:
    official_name: Outra complicação
    translated_name: Other complication
    description: Any complication the named items do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the complications block.

  CS_ANTIBIO:
    official_name: Uso de antibiótico
    translated_name: Antibiotic given
    description: >
      Whether antibiotics were given. They shorten infectiousness even when they
      no longer alter the illness, which is the main reason to give them late.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ANTIBIO reads antibiótico; a yes/no treatment flag.

  DT_ADM_ANT:
    official_name: Data de início do antibiótico
    translated_name: Date antibiotic started
    description: >
      When antibiotics began. Read against DT_CATARRA: started in the catarrhal
      phase they change the course, later they only stop transmission.
    code_system: none
    source: inferred
    reasoning: D(8) date; ADM_ANT reads administração de antibiótico.

  CS_COLETA:
    official_name: Coleta de material
    translated_name: Specimen collected
    description: >
      Whether a nasopharyngeal specimen was taken. Culture yield falls sharply
      after the catarrhal phase and after antibiotics.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: COLETA reads coleta; a specimen flag.

  CS_CULTURA:
    official_name: Resultado da cultura
    translated_name: Culture result
    description: >
      Whether Bordetella grew. A negative culture is common in a genuine case,
      so most confirmation is clinical or epidemiological rather than
      laboratory.
    code_system: internal
    source: def
    source_ref: POSNEGNR.CNV
    reasoning: Bound to POSNEGNR, positive/negative/not done.

  COLET_COMU:
    official_name: Coleta em comunicantes
    translated_name: Contacts sampled
    description: Whether specimens were taken from contacts as part of the investigation.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: COMU reads comunicantes; a yes/no flag.

  QUAN_COMUN:
    official_name: Quantidade de comunicantes
    translated_name: Contacts identified
    description: >
      How many contacts were identified. Pertussis is highly transmissible
      within households, so this is usually the household size.
    code_system: none
    source: inferred
    reasoning: N(4) tally of comunicantes.

  QUAN_POSIT:
    official_name: Comunicantes positivos
    translated_name: Contacts testing positive
    description: >
      How many contacts tested positive. Against QUAN_COMUN it gives the
      secondary attack rate, which is what makes household transmission
      measurable.
    code_system: none
    source: inferred
    reasoning: N(4) tally; the positive subset of QUAN_COMUN.

  MED_BLOQUE:
    official_name: Medida preventiva adotada
    translated_name: Preventive measure taken
    description: >
      What was done around the case — a vaccination sweep, chemoprophylaxis,
      both, or nothing. The control response, and the field that says whether
      one happened at all.
    code_system: internal
    source: def
    source_ref: MEDPREV.CNV
    reasoning: >
      Bound to MEDPREV, whose values are bloqueio vacinal, quimioprofilaxia,
      ambos and não.

  # ============================================ SIFC, congenital syphilis
  ANT_IDADE:
    official_name: Idade da mãe
    translated_name: Mother's age
    description: >
      The mother's age, banded. Congenital syphilis concentrates in young
      mothers with poor antenatal access, so this is a marker of the failure
      rather than of biology.
    code_system: internal
    source: def
    source_ref: FXID10MAENET.CNV
    reasoning: Bound to FXID10MAENET, whose labels are ten-year maternal age bands.

  ANT_RACA:
    official_name: Raça ou cor da mãe
    translated_name: Mother's race
    description: >
      The mother's self-declared race or colour. Recorded because congenital
      syphilis rates differ sharply by race in Brazil, which is a measure of
      unequal antenatal care.
    code_system: internal
    source: def
    source_ref: RAÇA.CNV
    reasoning: Bound to RAÇA, whose values are branca, preta, amarela, parda and indígena.

  ESCOLMAE:
    official_name: Escolaridade da mãe
    translated_name: Mother's schooling
    description: >
      The mother's education, from illiterate upward. The strongest social
      predictor of whether antenatal syphilis was caught and treated.
    code_system: internal
    source: def
    source_ref: ESCOLARNET.CNV
    reasoning: Bound to ESCOLARNET, the schooling codelist.

  ANT_PRE_NA:
    official_name: Realizou pré-natal
    translated_name: Attended antenatal care
    description: >
      Whether the mother attended antenatal care. Congenital syphilis in a woman
      who did attend is a different failure from one in a woman who did not: the
      first means the system missed it, the second that it never had the chance.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PRE_NA reads pré-natal; a yes/no flag.

  ANT_TRATAD:
    official_name: Parceiro tratado
    translated_name: Partner treated
    description: >
      Whether the mother's partner was treated. An untreated partner reinfects
      the mother, which is the commonest reason adequate maternal treatment
      still ends in a congenital case.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: TRATAD reads tratado, in the antecedent block about the partner.

  LAB_PARTO:
    official_name: Teste não treponêmico no parto
    translated_name: Non-treponemal test at delivery
    description: >
      The mother's VDRL at delivery. The last chance to detect maternal syphilis
      before the baby is exposed.
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE, reagente/não reagente/não realizado.

  LAB_TITU_2:
    official_name: Titulação no parto
    translated_name: Titre at delivery
    description: >
      The numeric titre at delivery. The titre, not merely reactivity, is what
      distinguishes active infection from a serological scar, and comparing it
      with the infant's is the core of the diagnosis.
    code_system: none
    source: inferred
    reasoning: N(4) numeric titre paired with LAB_PARTO.

  LAB_DT3:
    official_name: Data do exame no parto
    translated_name: Date of test at delivery
    description: When the delivery-time test was done.
    code_system: none
    source: inferred
    reasoning: D(8) date in the maternal laboratory block.

  LAB_CONF:
    official_name: Teste treponêmico
    translated_name: Treponemal test
    description: >
      The confirmatory treponemal test. Stays reactive for life, so it confirms
      that infection occurred but says nothing about whether it is active.
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE; the confirmatory test beside the non-treponemal one.

  TRA_DT:
    official_name: Data do tratamento
    translated_name: Date of treatment
    description: >
      When the mother was treated. Treatment must be complete more than thirty
      days before delivery to be judged adequate, so this date against the birth
      is what decides that.
    code_system: none
    source: inferred
    reasoning: D(8) date in the maternal treatment block.

  LABC_SANGU:
    official_name: Teste não treponêmico do sangue da criança
    translated_name: Infant blood non-treponemal test
    description: >
      The infant's VDRL on blood. Maternal antibody crosses the placenta, so a
      reactive result alone does not diagnose the baby — the titre comparison
      does.
    code_system: internal
    source: def
    source_ref: REATIVO.CNV
    reasoning: >
      Bound to REATIVO; LABC_ marks the criança block against the maternal LAB_
      one.

  LABC_TIT_1:
    official_name: Titulação do sangue da criança
    translated_name: Infant blood titre
    description: >
      The infant's blood titre. A titre more than fourfold the mother's
      indicates the baby's own infection rather than transferred antibody.
    code_system: none
    source: inferred
    reasoning: N(4) numeric titre paired with LABC_SANGU.

  LABC_DT_1:
    official_name: Data do exame de sangue da criança
    translated_name: Date of infant blood test
    description: When the infant's blood test was done.
    code_system: none
    source: inferred
    reasoning: D(8) date in the infant laboratory block.

  LABC_LIQUO:
    official_name: Teste no líquor da criança
    translated_name: Infant CSF test
    description: >
      The infant's CSF test. A reactive CSF means neurosyphilis, which requires
      ten days of intravenous penicillin rather than a single injection — so
      this field changes the treatment.
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE; LIQUO reads líquor in the infant block.

  LABC_TIT_2:
    official_name: Titulação do líquor
    translated_name: CSF titre
    description: The infant's CSF titre, beside the reactivity in LABC_LIQUO.
    code_system: none
    source: inferred
    reasoning: N(4) numeric titre paired with LABC_LIQUO.

  LABC_DT_2:
    official_name: Data do exame de líquor
    translated_name: Date of CSF test
    description: When the infant's CSF was examined.
    code_system: none
    source: inferred
    reasoning: D(8) date in the infant laboratory block.

  LABC_IGG:
    official_name: IgG da criança
    translated_name: Infant IgG
    description: >
      The infant's IgG. Crosses the placenta, so it reflects the mother as much
      as the child and is the least decisive of the infant tests.
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE; the infant IgG marker.

  LABC_DT:
    official_name: Data do exame IgG
    translated_name: Date of IgG test
    description: When the infant's IgG was measured.
    code_system: none
    source: inferred
    reasoning: D(8) date paired with LABC_IGG.

  LABC_TITUL:
    official_name: Titulação realizada
    translated_name: Titration performed
    description: Whether a titration was carried out at all, as against simple reactivity.
    code_system: internal
    source: def
    source_ref: SIM_NAONRE.CNV
    reasoning: Bound to SIM_NAONRE, sim/não/não realizado.

  LABC_EVIDE:
    official_name: Evidência radiológica
    translated_name: Radiological evidence
    description: >
      Whether long-bone X-rays show the changes of congenital syphilis. Often
