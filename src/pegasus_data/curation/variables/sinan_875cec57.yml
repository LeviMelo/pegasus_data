system: SINAN
asserted_by: pegasus_data
variables:
  CS_ESCOLAR:
    official_name: Escolaridade
    translated_name: Education level
    description: >
      Highest school grade the patient had completed at notification: 0
      illiterate, 1-8 successive grade levels through completed higher
      education, 9 ignored, 10 not applicable for children under 7.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_NET---Notificacao_Individual_rev.pdf, campo 14
  NU_IDADE:
    official_name: Idade
    translated_name: Age
    description: >
      Patient's age as a composite code: first digit is the time unit
      (1=hour, 2=day, 3=month, 4=year) and the rest is the value, so 3009
      means nine months and 4018 means eighteen years.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_NET---Notificacao_Individual_rev.pdf, campo 10
  NDUPLIC:
    official_name: Não Listar/Não Contar
    translated_name: Duplicate-record flag
    description: >
      Data-quality flag set when staff review possible duplicate
      notifications: blank/0 not yet reviewed, 1 confirmed not a duplicate
      (keep it), 2 confirmed duplicate (drop it from case counts).
    code_system: internal
    source: layout_doc
    source_ref: >
      DIC_DADOS_NET---Notificacao_Individual_rev.pdf, "Não Listar/Não Contar"
      (documented DBF NDUPLIC_N; NDUPLIC is the equivalent field observed)
  CON_CRITER:
    official_name: Critério de confirmação
    translated_name: Confirmation criterion
    description: >
      How the notified case was confirmed or discarded: typically laboratory
      testing, clinical-epidemiological link to a known case, or clinical
      judgment alone; the exact code set differs by the disease notified.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_NET---Notificacao_Individual_rev.pdf, campo 33 and Anexo I
  TRATAMENTO:
    official_name: Data do início do tratamento
    translated_name: Treatment start date
    description: >
      Date the patient began treatment for the notified disease (visceral
      leishmaniasis or tuberculosis), required to fall on or after the
      notification date.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 38 (DBF TRATAMENTO)
  HOSPITAL:
    official_name: Ocorreu Hospitalização
    translated_name: Hospitalized
    description: >
      Whether the patient was hospitalized for the notified condition: 1
      yes, 2 no, 9 ignored; a yes opens further fields recording the
      hospital, admission date and discharge date.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Maculosa_v5.pdf, campo 36
  INSTITUCIO:
    official_name: Institucionalizado em
    translated_name: Institution type
    description: >
      Type of institution the patient was confined to or attended at
      notification: daycare, school, nursing home, workplace, prison,
      hospital/clinic, other, not institutionalized, or ignored.
    code_system: internal
    source: web
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hepatites%20Virais/DIC_DADOS_Hepatite_v5.pdf,
      campo 35 "Institucionalizado em"
  METAL:
    official_name: Agentes de Exposição - Metais duros
    translated_name: Hard-metal dust exposure
    description: >
      Whether the worker was exposed to hard-metal dusts (cobalt, titanium,
      tungsten), one of eight occupational exposure-agent checkboxes on the
      pneumoconiosis investigation form: 1 yes, 2 no, 9 ignored.
    code_system: internal
    source: layout_doc
    source_ref: DRT_Pneumoconioses.pdf, campo 51 "Agentes de Exposição"
  ASBESTO:
    official_name: Agentes de Exposição - Asbesto
    translated_name: Asbestos exposure
    description: >
      Whether the worker was exposed to asbestos dust, one of the
      occupational exposure-agent checkboxes on the pneumoconiosis and
      work-related-cancer investigation forms: 1 yes, 2 no, 9 ignored.
    code_system: internal
    source: layout_doc
    source_ref: DRT_Pneumoconioses.pdf, campo 51 "Agentes de Exposição"
  CLICDCCA_N:
    official_name: Critério CDC adaptado
    translated_name: Adapted CDC criterion met
    description: >
      Whether the child's case met the CDC-adapted pediatric AIDS clinical
      case definition, based on the mild/moderate/severe diseases and signs
      recorded in the CLI_ fields below: 1 yes, 2 no, 9 ignored.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_CANDIA:
    official_name: Candidose oral resistente ao tratamento
    translated_name: Oral candidiasis resistant to treatment
    description: >
      Whether the child had oral candidiasis (thrush) that failed to
      respond to standard antifungal treatment, one moderate/severe
      condition on the pediatric AIDS clinical checklist.
    code_system: internal
    source: inferred
    reasoning: >
      Field abbreviation matches "candidíase" with no esophagus/trachea
      qualifier unlike its siblings on the same checklist; the form lists
      oral candidiasis as its own moderate/severe item.
    asserted_by: pegasus_data
  CLI_HERPEG:
    official_name: Gengivo-estomatite herpética recorrente
    translated_name: Recurrent herpetic gingivostomatitis
    description: >
      Whether the child had two or more distinct episodes of herpetic
      gingivostomatitis (mouth-and-gum herpes sores) within one year, a
      moderate/severe item on the pediatric AIDS checklist.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_HERPES:
    official_name: Herpes simples (mucocutâneo/visceral)
    translated_name: Herpes simplex infection
    description: >
      Whether the child had a herpes simplex infection other than the
      gum/mouth pattern captured by CLI_HERPEG: mucocutaneous lasting over
      a month, or in the lungs/gut, a moderate/severe checklist item.
    code_system: internal
    source: inferred
    reasoning: >
      "HERPES" is the residual herpes-simplex field once CLI_HERPEG claims
      the gengivo-estomatite-specific item; the checklist's remaining
      herpes-simplex entries (mucocutaneous >1 month, bronchial/pulmonary/GI)
      are the candidates left for it.
    asserted_by: pegasus_data
  CLI_NOCAR:
    official_name: Nocardiose
    translated_name: Nocardiosis
    description: >
      Whether the child was diagnosed with nocardiosis, a bacterial
      infection usually of the lungs or skin, one moderate/severe condition
      on the pediatric AIDS clinical checklist.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_OTITE:
    official_name: Infecções persistentes ou recorrentes de VAS (Otite ou Sinusite)
    translated_name: Recurrent ear/sinus infection
    description: >
      Whether the child had persistent or recurrent upper-airway infection,
      ear infection (otitis) or sinusitis, one of the mild-severity items on
      the pediatric AIDS clinical checklist.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_PAROTI:
    official_name: Aumento crônico de parótida
    translated_name: Chronic parotid enlargement
    description: >
      Whether the child had chronic swelling of the parotid (salivary)
      gland, one of the mild-severity conditions on the pediatric AIDS
      clinical checklist.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_PULMAO:
    official_name: Pneumonia linfóide intersticial
    translated_name: Lymphoid interstitial pneumonia
    description: >
      Whether the child had lymphoid interstitial pneumonia (LIP), a
      chronic lung disease seen mainly in pediatric HIV, one moderate/severe
      condition on the pediatric AIDS clinical checklist.
    code_system: internal
    source: inferred
    reasoning: >
      Among the checklist's several lung-related items (LIP, Pneumocystis
      pneumonia, tracheobronchial candidiasis, pulmonary herpes), the bare
      noun "pulmão" (lung) best matches LIP, the item most specific to
      pediatric HIV.
    asserted_by: pegasus_data
  CLI_TOX1M:
    official_name: Toxoplasmose iniciada antes de 1 mês de idade
    translated_name: Toxoplasmosis before 1 month old
    description: >
      Whether the child's toxoplasmosis infection began before one month of
      age, a moderate/severe condition distinguished on the checklist from
      toxoplasmosis diagnosed after that age.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_TUBERC:
    official_name: Tuberculose disseminada ou extrapulmonar
    translated_name: Disseminated/extrapulmonary tuberculosis
    description: >
      Whether the child had tuberculosis outside the lungs or spread
      through the body, the more severe of the checklist's two tuberculosis
      items, distinct from pulmonary-only CLI_TUPULM.
    code_system: internal
    source: inferred
    reasoning: >
      The checklist has exactly two tuberculosis checkboxes; CLI_TUPULM's
      name clearly claims the pulmonary one, leaving the unqualified
      CLI_TUBERC for the disseminated/extrapulmonary item.
    asserted_by: pegasus_data
  CLI_TUPULM:
    official_name: Tuberculose pulmonar
    translated_name: Pulmonary tuberculosis
    description: >
      Whether the child had tuberculosis confined to the lungs, one of the
      checklist's two tuberculosis items, distinguished from disseminated
      or extrapulmonary disease recorded in CLI_TUBERC.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CLI_VARICE:
    official_name: Varicela disseminada
    translated_name: Disseminated chickenpox
    description: >
      Whether the child had chickenpox (varicella) that spread beyond the
      skin to internal organs, one moderate/severe condition on the
      pediatric AIDS clinical checklist.
    code_system: internal
    source: layout_doc
    source_ref: Aids_crianca_v5.pdf, campo 45
  CONFIRMA:
    official_name: Confirmação
    translated_name: Case confirmed flag
    description: >
      A simple case-confirmation flag on early pediatric AIDS/HIV records,
      predating the multi-category Classificação Final (CLASSI_FIN) field
      that later replaced it as the standard outcome variable.
    code_system: internal
    source: inferred
    reasoning: >
      Naming grammar: "CONFIRMA" reads directly as confirmação; the field
      appears only in AIDC/HIVC with no bound codelist, consistent with a
      legacy simple flag predating CLASSI_FIN's richer classification.
    asserted_by: pegasus_data
