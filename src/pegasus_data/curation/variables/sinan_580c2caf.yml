system: SINAN
asserted_by: pegasus_data
variables:
  RAIOX:
    official_name: Confirmação Diagnóstica - Radiografia de tórax
    translated_name: Diagnostic confirmation - chest X-ray
    description: >
      Whether a chest X-ray was performed and used to confirm a work-related
      pneumoconiosis (silicosis, asbestosis, and similar occupational lung
      diseases); the same field name was reused earlier by the Doença de
      Chagas Aguda form. 1=Sim, 2=Não, 9=Ignorado.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 54
  TRA_ANTIVI:
    official_name: Suporte Terapêutico - Usou Medicamento Antiviral (Ribavirina)
    translated_name: Therapeutic support - used antiviral drug (Ribavirin)
    description: >
      Whether the hospitalized Hantavirose patient received ribavirin, the
      antiviral historically tried against hantavirus pulmonary syndrome, as
      part of supportive treatment. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 52
  TRA_DT_INT:
    official_name: Data da internação
    translated_name: Hospital admission date
    description: >
      Calendar date the Hantavirose patient was admitted to hospital, filled
      in only when hospitalization occurred; must fall on or after both the
      date of first symptoms and the date of first medical care.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 48
  TRA_ESPECI:
    official_name: Suporte Terapêutico - Outro Tipo de Tratamento (Especificar)
    translated_name: Therapeutic support - other treatment type (specify)
    description: >
      Free-text description of an unlisted therapeutic support given to the
      Hantavirose patient, filled in only when TRA_TRATAM records that some
      treatment beyond the standard options (ventilator, antiviral,
      corticoid, vasoactive drugs, antibiotics) was used.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 52
  TRA_HOSP:
    official_name: Ocorreu Hospitalização
    translated_name: Hospitalization occurred
    description: >
      Whether the Hantavirose patient was hospitalized. 1=Sim opens the
      internment and therapeutic-support block; 2=Não or 9=Ignorado skip
      straight past hospital details to the case-classification questions.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 47
  TRA_MECANI:
    official_name: Suporte Terapêutico - Ficou no Respirador mecânico
    translated_name: Therapeutic support - placed on mechanical ventilator
    description: >
      Whether the hospitalized Hantavirose patient was put on a mechanical
      ventilator, reflecting respiratory failure severe enough to need
      artificial breathing support. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 52
  TRA_TRATAM:
    official_name: Suporte Terapêutico - Outro tipo de tratamento
    translated_name: Therapeutic support - other treatment type
    description: >
      Whether the Hantavirose patient received a therapeutic support beyond
      the listed options (ventilator, antiviral, corticosteroid, vasoactive
      drugs, antibiotics); 1=Sim unlocks the free-text TRA_ESPECI field
      naming it.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 52
  ANT_ANIMAI:
    official_name: Casos Anteriores de Leptospirose... Casos Animais
    translated_name: Prior leptospirosis at the probable infection site - animal cases
    description: >
      Whether animals were known to have had leptospirosis at the site where
      the patient was probably infected, in the two months before the
      investigation — a local-outbreak indicator, not the patient's own
      medical history.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 34
  ANT_CB_COR:
    official_name: Situação de Risco - Rio, córrego, lagoa ou represa
    translated_name: Risk exposure - river, stream, lagoon, or dam
    description: >
      Whether the patient had contact with water from a river, stream,
      lagoon, or dam in the 30 days before symptom onset — a classic
      leptospirosis exposure route via Leptospira-contaminated fresh water.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_CRI:
    official_name: Situação de Risco - Criação de animais
    translated_name: Risk exposure - raising or keeping animals
    description: >
      Whether the patient kept or worked with livestock or other domestic
      animals in the 30 days before symptoms began, since animal urine is a
      common source of Leptospira contamination.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_FOS:
    official_name: Situação de Risco - Fossa, caixa de gordura ou esgoto
    translated_name: Risk exposure - septic tank, grease trap, or sewage
    description: >
      Whether the patient had contact with a septic tank, grease trap, or
      open sewage in the 30 days before symptoms, a known leptospirosis
      exposure route through rodent-contaminated waste water.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_LAM:
    official_name: Situação de Risco - Água ou lama de enchente
    translated_name: Risk exposure - flood water or mud
    description: >
      Whether the patient waded through or contacted flood water or mud in
      the 30 days before symptom onset — the single most common leptospirosis
      exposure recorded in Brazilian urban outbreaks.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_LIX:
    official_name: Situação de Risco - Lixo/Entulho
    translated_name: Risk exposure - garbage or rubble
    description: >
      Whether the patient had contact with uncollected garbage or
      construction rubble in the 30 days before symptoms — sites that
      attract the rodents whose urine spreads Leptospira bacteria.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_OUT:
    official_name: Situação de Risco - Outras
    translated_name: Risk exposure - other
    description: >
      Whether the patient reported a leptospirosis risk exposure not covered
      by the listed categories (water, animals, sewage, rodents, garbage);
      1=Sim enables a free-text field naming the exposure.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_ROE:
    official_name: Situação de Risco - Roedores diretamente
    translated_name: Risk exposure - direct contact with rodents
    description: >
      Whether the patient had direct contact with rodents (rats, mice) in
      the 30 days before symptom onset, the primary animal reservoir that
      sheds Leptospira in its urine.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_HUMANO:
    official_name: Casos Anteriores de Leptospirose... Casos Humanos
    translated_name: Prior leptospirosis at the probable infection site - human cases
    description: >
      Whether other people were known to have had leptospirosis at the site
      where the patient was probably infected, in the two months before the
      investigation began.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 34
  ATE_DT_ALT:
    official_name: Data de Alta
    translated_name: Hospital discharge date
    description: >
      Calendar date the Leptospirose patient was discharged from hospital,
      recorded only when an admission date is present; must fall on or
      after that admission date.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 39
  CLI_CONGES:
    official_name: Sinais e sintomas - Congestão conjuntival
    translated_name: Signs and symptoms - conjunctival congestion
    description: >
      Whether the patient showed conjunctival congestion — visibly reddened,
      engorged eyes without discharge — a clinical sign distinctive enough to
      help separate leptospirosis from other febrile illnesses.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 36
  CLI_MENING:
    official_name: Sinais e sintomas - Meningismo
    translated_name: Signs and symptoms - meningismus
    description: >
      Whether the patient showed meningismus — meningitis-like signs such as
      neck stiffness and headache without confirmed central-nervous-system
      infection — a recognized complication of severe leptospirosis.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 36
  DT_FEBRE:
    official_name: Data do início da febre
    translated_name: Date fever began
    description: >
      Calendar date fever started in a patient under investigation for
      measles or rubella; must fall on or before the notification date, and
      is tracked alongside the separate rash-onset date to trace disease
      progression.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 39
  LAB_DT_1:
    official_name: Sorologia IgM - Elisa - Data da Coleta - 1ª amostra
    translated_name: IgM ELISA serology - collection date, 1st sample
    description: >
      Calendar date the first blood sample was drawn for ELISA IgM antibody
      testing against leptospirosis; must fall on or after the date the
      patient's symptoms began.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 43
  LAB_DT_2:
    official_name: Sorologia IgM - Elisa - Data da Coleta - 2ª amostra
    translated_name: IgM ELISA serology - collection date, 2nd sample
    description: >
      Calendar date a second, convalescent blood sample was drawn for ELISA
      IgM leptospirosis testing, taken to catch seroconversion when the
      first sample tested negative; must postdate the first sample.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 45
  LAB_TGO:
    official_name: Resultado A - TGO
    translated_name: Result A - AST/SGOT liver enzyme
    description: >
      Whether a blood test for TGO (AST), a liver enzyme, came back elevated
      in a hospitalized Hantavirose patient; elevated transaminases signal
      the liver involvement seen in severe hantavirus disease. 3=exam not
      performed.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 38
  LAB_TGP:
    official_name: Resultado A - TGP
    translated_name: Result A - ALT/SGPT liver enzyme
    description: >
      Whether a blood test for TGP (ALT), a liver enzyme, came back elevated
      in a hospitalized Hantavirose patient; elevated transaminases signal
      the liver involvement seen in severe hantavirus disease. 3=exam not
      performed.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 38
