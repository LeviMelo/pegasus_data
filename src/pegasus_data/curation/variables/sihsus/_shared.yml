    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 26'
  VAL_SP_FED:
    official_name: Valor do complemento federal de serviços profissionais
    translated_name: Federal professional-services top-up
    description: Federal top-up to the professional-services payment. Already included in
