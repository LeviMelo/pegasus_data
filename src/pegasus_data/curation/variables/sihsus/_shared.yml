    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 32'
  VAL_SANGUE:
    official_name: Valor sangue
    translated_name: Blood value
    description: Payment for blood and blood products transfused during the stay. Zeroed from
