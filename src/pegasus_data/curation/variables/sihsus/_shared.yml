    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 94'
  VAL_UTI:
    official_name: Valor de UTI
    translated_name: ICU value
    description: Amount paid for intensive care on this AIH. Included in VAL_TOT, so adding
      the two double-counts.
    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 37'
  VINCPREV:
    official_name: Vínculo com a Previdência
    translated_name: Social-security status
    description: The patient's relationship to social security — employed, self-employed,
      retired and so on.
    code_system: internal
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 70'
