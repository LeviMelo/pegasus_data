      Jan/2008 onward, so it measures the file rather than the care. The month's usable ICU
      total is UTI_MES_TO.
    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 12'
  UTI_MES_TO:
    official_name: Quantidade de dias de UTI no mês
    translated_name: ICU days in the month
    description: How many intensive-care days were billed on this AIH within the competência;
      the IN/AN/AL companions are zeroed, so this is the usable one. A .DEF binds it to the
      DIARIASUTI band table, which buckets the value — the column itself is the raw number
      of days.
    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 15'
