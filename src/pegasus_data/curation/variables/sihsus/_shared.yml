    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 33'
  VAL_UCI:
    official_name: Valor de UCI
    translated_name: Intermediate care unit value
    description: Amount paid for care in an intermediate care unit (UCI), distinct from the
