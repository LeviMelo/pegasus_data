    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 31'
  VAL_SH:
    official_name: Valor de serviços hospitalares
    translated_name: Hospital services value
    description: 'Amount paid for hospital services — the facility component: bed, nursing,
