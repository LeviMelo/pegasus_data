# SIHSUS — columns carried by more than one dataset.
#
# The notification header and other cross-dataset fields. Described once
# against the system, because that is the scope on which they are the
# same column.
system: SIHSUS
asserted_by: pegasus_data

variables:
  CEP:
    official_name: CEP do paciente
    translated_name: Postal code
    description: Brazilian postal code (CEP) of the patient's address, 8 digits.
    code_system: none
    source: layout_doc
    notes: 'There is no CEP table anywhere on the FTP tree, and there is no reason
      to expect one: CEP is Correios'' property, not the Ministry''s. It is a postal
      code, not a health classification, and it stays unlabelled.

      '
  CNES:
    official_name: Código CNES do estabelecimento
    translated_name: Establishment CNES code
    code_system: internal
    source: layout_doc
  COD_IDADE:
    official_name: Unidade de medida da idade
    translated_name: Age unit
    description: The unit in which IDADE is expressed.
    code_system: internal
    modifies: IDADE
    source: layout_doc
    notes: 'DELIBERATELY UNBOUND. Six distinct values are observed (0,1,2,3,4,5 — the
      instruction expected five), and no codelist of time units exists in the 4.0M
      dictionary rows ingested so far. The .DEF files bind this column to IDADEPUB,
      IDADEBAS, IDADEDET and IDADE18, all of which are TabNet age-BAND axes with 3-character
      codes labelled ''< 1 ano'' — they decode a tabulation axis, not this column.
      Guessing the unit mapping is the one error with clinical consequence here, so
      it is recorded as the open question semantics.cod_idade_units instead. IDADE_anos
      will not be produced until it is closed, which is the correct failure: no derived
      age is better than a wrong one.

      '
  DIAG_PRINC:
    official_name: Código do diagnóstico principal
    translated_name: Principal diagnosis
    description: 'CID-10 code for the condition that motivated the admission. Stored
      without the dot: J18.9 is written J189. Older records carry CID-9 instead.

      '
    code_system: external
    codelists:
    - CID10
    - CID9_01
    - CID9_02
    - CID9_03
    - CID9_04
    - CID9_05
    - CID9_06
    - CID9_07
    - CID9_08
    - CID9_09
    - CID9_10
    - CID9_11
    - CID9_12
    - CID9_13
    - CID9_14
    - CID9_15
    - CID9_16
    - CID9_17
    vintage_note: 'SIH spans the CID-9/CID-10 changeover and the older era is still
      in the data: 426 of the 1,590 distinct values observed for this column are 6-digit
      numeric CID-9 codes, not malformed CID-10. They decode already — 065099 is "650
      - Parto normal" — but the kit ships CID-9 as seventeen CHAPTER files rather than
      one table, so all seventeen are bound alongside CID10. Safe: the seventeen chapters
      share zero contradicting labels across 7,681 codes, and the CID-9 and CID-10
      code spaces overlap in exactly zero codes, so exact matching picks the right
      classification per row without anything needing to know the row''s vintage.

      '
    multi_valued: false
    token_rule:
      width: 4
    source: layout_doc
    notes: 'The admission is billed for the reason it was authorised, which for chronic
      disease is usually the acute consequence rather than the underlying disease.
      Counting DIAG_PRINC counts episodes of care, not people and not prevalence.

      '
  DIAG_SECUN:
    official_name: Código do diagnóstico secundário
    translated_name: Secondary diagnosis
    description: CID-10 code for a secondary diagnosis, without the dot.
    code_system: external
    codelists:
    - CID10
    - CID9_01
    - CID9_02
    - CID9_03
    - CID9_04
    - CID9_05
    - CID9_06
    - CID9_07
    - CID9_08
    - CID9_09
    - CID9_10
    - CID9_11
    - CID9_12
    - CID9_13
    - CID9_14
    - CID9_15
    - CID9_16
    - CID9_17
    vintage_note: 'Same CID-9/CID-10 span as DIAG_PRINC; both classifications are bound
      and exact matching selects per row. See that entry for the measurement.

      '
    source: layout_doc
    notes: 'Present but dead from the 113-column generation onward: the column is still
      emitted and is filled with the literal ''0000'' rather than being dropped. A
      query that treats it as missing-when-absent will silently read zeros as a diagnosis.
      The DIAGSEC1..DIAGSEC9 columns carry the real secondary diagnoses in that generation.

      '
  DT_INTER:
    official_name: Data de internação
    translated_name: Admission date
    description: Date of admission, stored as AAAAMMDD.
    code_system: none
    source: layout_doc
  DT_SAIDA:
    official_name: Data de saída
    translated_name: Discharge date
    description: Date of discharge, stored as AAAAMMDD.
    code_system: none
    source: layout_doc
  FONTE_ORC:
    official_name: Fonte Orçamentária
    translated_name: Budget source code
    description: 'DATASUS code for which budget line funded this admission''s payment.
      Every value observed in this batch is ''00'', so this batch alone gives no information
      about what the other codes mean.

      '
    code_system: internal
    codelists:
    - FONTEREM
    source: def
    source_ref: '[DEF-RD2008] display_name "Fonte Orçamentária" for FONTE_ORC, lookup
      FONTEREM.CNV.'
    notes: 'No label was observed for the value seen (''00'' is unlabelled in the dictionary
      rows collected so far) — do not assume ''00'' means "no source"; it may simply
      be the modal funding source with no captured label.

      '
  GESTAO:
    official_name: Gestão
    translated_name: Type of health-system management
    description: 'Which sphere of government held "gestão plena" (full management authority)
      over the SUS network that processed this AIH at the time of billing: 0 Estadual,
      1 Municipal plena, 2 Estadual plena. Describes the administrative arrangement
      the payer operated under, not the hospital''s own ownership.

      '
    code_system: internal
    codelists:
    - GESTAO
    source: web
    source_ref: '[GEOCOD-AIH] p.7: "GESTÃO - Indica o tipo de gestão do hospital: 0
      = Gestão estadual; 1 = Gestão plena municipal; 2 = Gestão plena estadual" — matches
      the catalog''s own GESTAO codelist labels exactly (''2'' Estadual plena, ''0''
      Estadual, ''1'' Municipal plena assist).

      '
    notes: 'SEMIPLEN (below) carries this same concept for 1995–1997 records under
      the older "gestão semi-plena" era name; the two are not automatically the same
      code space across that boundary even though SEMIPLEN is bound to the GESTAO codelist
      too.

      '
  IDADE:
    official_name: Idade
    translated_name: Age
    description: Age of the patient, in the unit given by COD_IDADE.
    code_system: none
    depends_on:
    - COD_IDADE
    derived:
    - name: IDADE_anos
      from:
      - IDADE
      - COD_IDADE
      rule: convert to years using COD_IDADE as the unit
    source: layout_doc
    notes: 'NOT interpretable alone. IDADE=030 with COD_IDADE meaning months is thirty
      months, not thirty years. Averaging this column across a population mixes units
      and produces a number that is not an age.

      '
  MES_CMPT:
    official_name: Mês processamento
    translated_name: Processing month (competência)
    description: 'Two-digit month (01–12) of the "competência" — the billing/processing
      period this AIH was settled under. For a stay that crosses a month boundary it
      reflects the hospital''s payment cycle, not necessarily the calendar month the
      patient was actually admitted or discharged.

      '
    code_system: none
    codelists:
    - MESES
    source: def
    source_ref: '[DEF-RD9297]/[DEF-RD2008] display_name "Mês processamento" for MES_CMPT;
      labelled with the twelve month names via MESES.CNV.

      '
    notes: 'A time series built from MES_CMPT counts billing/payment activity, not
      admission activity — use the admission-date column (DT_INTER, documented in sihsus_rd.yml)
      for the latter.

      '
  MUNIC_MOV:
    official_name: Município do Estabelecimento
    translated_name: Municipality of the establishment
    description: IBGE municipality code of the hospital that billed the admission.
    code_system: internal
    codelist: MUNICBR
    source: inferred
    reasoning: Same 6-character IBGE coding as MUNIC_RES; see that entry.
  MUNIC_RES:
    official_name: Município de Residência do Paciente
    translated_name: Municipality of residence
    description: IBGE municipality code of where the patient lives.
    code_system: internal
    codelist: MUNICBR
    source: inferred
    reasoning: 'The column holds 6-character IBGE codes. CADMUN as shipped in the kits
      parses to 5,579 four-character codes, so it is not the municipality table despite
      the name; MUNICBR holds 280,002 six-character codes labelled ''120001 Acrelandia''.
      Bound by measured width and label shape.

      '
    notes: 'MUNIC_RES and MUNIC_MOV answer different questions and are routinely confused.
      Rates per population must use MUNIC_RES, because the denominator is residents;
      describing hospital activity must use MUNIC_MOV.

      '
  N_AIH:
    official_name: Número da AIH
    translated_name: Hospital admission authorisation number
    description: 'Identifier of the AIH (Autorização de Internação Hospitalar) — the
      billing authorisation, which is what a row of this dataset is.

      '
    code_system: none
    source: layout_doc
  SEXO:
    official_name: Sexo do paciente
    translated_name: Sex
    code_system: internal
    source: layout_doc
    notes: 'DELIBERATELY UNBOUND. The kits ship contradictory mappings for the same
      code: the merged SEXO table contains both ''1 -> Masculino'' and ''1 -> Feminino'',
      and both ''3 -> Feminino'' and ''3 -> Ignorado'', because different systems encoded
      sex differently over time. Choosing between them without a per-generation source
      would label a large share of admissions with the wrong sex and show nothing in
      the output. The renderer refuses to label a column whose codelist disagrees with
      itself; see the open question semantics.sexo_contradictory_coding.

      '
  VAL_TOT:
    official_name: Valor total da AIH
    translated_name: Total value
    description: Total amount billed for the admission, in Brazilian reais.
    code_system: none
    source: layout_doc
    notes: 'Nominal reais at the time of billing, never deflated. Summing across years
      adds together currency of different value.

      '
