    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 27'
  VAL_SADTSR:
    official_name: Valor SADT sem registro
    translated_name: Unregistered diagnostic services value
