    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §3
      Layout dos arquivos SP*.dbf, SEQ 18'
  TOT_PT_SP:
    official_name: Total de pontos SP
    translated_name: Total professional points
    description: Total points under the old points-based professional remuneration. Zeroed
