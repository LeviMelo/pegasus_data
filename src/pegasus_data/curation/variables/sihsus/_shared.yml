    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 91'
  VAL_SP_GES:
    official_name: Valor do complemento do gestor de serviços profissionais
    translated_name: Manager professional-services top-up
    description: State or municipal top-up to the professional-services payment. Already included
      in VAL_TOT.
    code_system: none
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 93'
  VAL_TOT:
    official_name: Valor total da AIH
    translated_name: Total value
    description: Total amount billed for the admission, in Brazilian reais.
    code_system: none
    source: layout_doc
    notes: 'Nominal reais at the time of billing, never deflated. Summing across years adds
      together currency of different value.

      '
  VAL_TRANSP:
    official_name: Valor transporte
    translated_name: Transport value
    description: Payment for transporting the patient between establishments. Zeroed from
