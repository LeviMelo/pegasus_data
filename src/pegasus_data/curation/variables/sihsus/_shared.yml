    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 13'
  UTI_MES_IN:
    official_name: UTI mês - início
    translated_name: ICU days in month, opening
