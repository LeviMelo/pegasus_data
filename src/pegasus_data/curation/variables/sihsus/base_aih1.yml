    codelists:
    - ICD10
    - S_CID
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 97 DIAGSEC2.'
  CO_DIAG_SECUNDARIO_3:
    official_name: Diagnóstico secundário 3
    translated_name: Secondary diagnosis 3
    description: ICD-10 code of secondary diagnosis 3. Corresponds to RD*.dbf's DIAGSEC3.
    code_system: external
    # The kit's S_CID after the canonical table: it names 0000 "CID NAO
    # INFORMADO", which ICD-10 cannot (as for SIA's CID fields).
    codelists:
    - ICD10
    - S_CID
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 98 DIAGSEC3.'
  CO_DIAG_SECUNDARIO_4:
    official_name: Diagnóstico secundário 4
    translated_name: Secondary diagnosis 4
    description: ICD-10 code of secondary diagnosis 4. Corresponds to RD*.dbf's DIAGSEC4.
    code_system: external
    # The kit's S_CID after the canonical table: it names 0000 "CID NAO
