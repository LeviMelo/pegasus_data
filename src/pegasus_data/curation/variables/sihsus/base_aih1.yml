    codelists:
    - ICD10
    - S_CID
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 99 DIAGSEC4.'
  CO_DIAG_SECUNDARIO_5:
    official_name: Diagnóstico secundário 5
    translated_name: Secondary diagnosis 5
    description: ICD-10 code of secondary diagnosis 5. Corresponds to RD*.dbf's DIAGSEC5.
    code_system: external
    # The kit's S_CID after the canonical table: it names 0000 "CID NAO
    # INFORMADO", which ICD-10 cannot (as for SIA's CID fields).
    codelists:
    - ICD10
    - S_CID
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 100 DIAGSEC5.'
  CO_DIAG_SECUNDARIO_6:
    official_name: Diagnóstico secundário 6
    translated_name: Secondary diagnosis 6
    description: ICD-10 code of secondary diagnosis 6. Corresponds to RD*.dbf's DIAGSEC6.
    code_system: external
    # The kit's S_CID after the canonical table: it names 0000 "CID NAO
    # INFORMADO", which ICD-10 cannot (as for SIA's CID fields).
    codelists:
    - ICD10
    - S_CID
    source: layout_doc
    source_ref: '[IT-SIHSUS] IT_SIHSUS_1603.pdf (DATASUS, Informe Técnico SIH 2016-03), §2
      Layout dos arquivos RD*.dbf, SEQ 101 DIAGSEC6.'
  CO_DIAG_SECUNDARIO_7:
    official_name: Diagnóstico secundário 7
    translated_name: Secondary diagnosis 7
    description: ICD-10 code of secondary diagnosis 7. Corresponds to RD*.dbf's DIAGSEC7.
    code_system: external
    # The kit's S_CID after the canonical table: it names 0000 "CID NAO
    # INFORMADO", which ICD-10 cannot (as for SIA's CID fields).
    codelists:
    - ICD10
