# SIH.ER — AIH rejected with error
# AIH Rejeitada com erro
#
# Rejections carried with the error that caused them — the diagnostic
# companion to RJ rather than a separate population.
system: SIHSUS
asserted_by: pegasus_data

variables:
  AIH:
    translated_name: AIH number (error file)
    description: 'The AIH billing-authorisation number the ER (Motivo de Erro) record
      reports an error against — the same identifier documented as N_AIH in the RD
      series (sihsus_rd.yml), carried here so an errored record can be traced to its
      AIH.

      '
    code_system: none
    source: inferred
    reasoning: 'No .DEF binds a display name to this column, but its 13-digit values
      match the AIH numbering already documented for N_AIH, and it sits in a file whose
      other columns (ANO, MES, CO_ERRO below) route through [DEF-MOTERRO] — an AIH-number
      column is exactly what a per-error record needs to identify which admission the
      error is about.

      '
    notes: 'Do not assume this joins 1:1 to N_AIH in RD — an AIH that errored out may
      never reach RD.

      '
  ANO:
    official_name: Ano processamento
    translated_name: Processing year (error file)
    description: Four-digit year of the processing/competência period this ER record
      belongs to, paired with MES.
    code_system: none
    codelists:
    - ANO
    - ANOMES
    - ANOMESC
    source: def
    source_ref: '[DEF-MOTERRO] display_name "Ano processamento" for ANO; also bound
      as "Ano/Mês processamento" via ANOMES.CNV/ANOMESC.CNV.

      '
  CO_ERRO:
    official_name: Motivo da Rejeição
    translated_name: Rejection/error reason code
    description: 'DATASUS''s numeric code for why this AIH failed processing critique
      — a large enumerated list, e.g. 060109 "PROFISSIONAL NÃO VINCULADO AO CNES COM
      O CBO INFORMADO", 020008 "AIH BLOQUEADA POR SOLICITAÇÃO DE LIBERAÇÃO". This is
      the field that gives the ER file its name.

      '
    code_system: internal
    codelists:
    - MOTERRO
    source: def
    source_ref: '[DEF-MOTERRO] display_name "Motivo da Rejeição" for CO_ERRO, lookup
      MOTERRO.CNV.

      '
    notes: 'A different code space from ST_MOT_BLO — that is RJ''s block-reason table
      (MOTBLOQUEIO); this is ER''s validation-error table (MOTERRO). The two files
      record different stages of rejection and their codes are not interchangeable.

      '
  MES:
    official_name: Mês processamento
    translated_name: Processing month (error file)
    description: Two-digit month of the processing/competência period; ER's equivalent
      of MES_CMPT in RD/RJ.
    code_system: none
    codelists:
    - MESES
    source: def
    source_ref: '[DEF-MOTERRO] display_name "Mês processamento" for MES, lookup MESES.CNV.

      '
  MUN_MOV:
    translated_name: Municipality of the establishment (error file)
    description: 'IBGE 6-digit municipality code of the hospital that generated this
      ER record — the error file''s equivalent of MUNIC_MOV in RD (sihsus_rd.yml).

      '
    code_system: external
    codelists:
    - MUNICBR
    source: inferred
    reasoning: 'No .DEF display name is bound, but the detector matches this column''s
      values to MUNICBR (six-character IBGE codes) with high confidence, the observed
      values are real Acre-state municipalities, and MUN_MOV pairs directly with the
      already-documented MUNIC_MOV concept.

      '
    notes: 'MUN_MOV and MUN_RES answer different questions, exactly as MUNIC_MOV and
      MUNIC_RES do in RD (see sihsus_rd.yml) — the same caution applies here.

      '
  MUN_RES:
    translated_name: Municipality of the patient's residence (error file)
    description: 'IBGE 6-digit municipality code of where the patient lives, for this
      ER record — the error file''s equivalent of MUNIC_RES in RD (sihsus_rd.yml).

      '
    code_system: external
    codelists:
    - MUNICBR
    source: inferred
    reasoning: Same basis as MUN_MOV — detector-matched to MUNICBR, and the name pairs
      with the documented MUNIC_RES concept.
  UF_RES:
    translated_name: State of residence (error file)
    description: 'IBGE 2-digit state (UF) code of the patient''s residence — a coarser,
      redundant echo of MUN_RES (the UF is already the first two digits of MUN_RES).
      Observed values in this batch are 12 (Acre) and 13 (Amazonas).

      '
    code_system: external
    source: inferred
    reasoning: 'The 2-digit values match the IBGE UF numeric codes for the two states
      this batch''s error files cover (Acre, Amazonas), and the name follows the UF_
      prefix paired directly with MUN_RES in the same file.

      '
