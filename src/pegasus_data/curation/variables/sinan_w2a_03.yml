system: SINAN
asserted_by: pegasus_data

variables:
  # --- LEPT (leptospirosis) exposure-site conditions and lab panel ---
  ANT_CB_LAV:
    official_name: Contato com água/lavagem em local de risco nos últimos 30 dias
    translated_name: Contact with contaminated water for washing (flag)
    description: >
      Whether the patient washed clothes/items or otherwise had washing
      contact with potentially contaminated water in the 30 days before
      symptoms - one of several leptospirosis exposure-history checkboxes
      alongside flood water and rodent-contact items.
    code_system: none
    source: inferred
    reasoning: >
      ANT_CB_ = antecedente (30-day risk-history block, same naming family
      as the flood/rodent/agriculture items in the LEPT form); LAV = lavagem
      (washing); lower confidence on the exact activity.

  CON_ESGOTO:
    official_name: Esgoto no local provável de infecção
    translated_name: Sewage present at likely infection site (flag)
    description: >
      Whether open sewage or a septic/grease trap was present at the site
      investigators identified as the likely infection location - an
      environmental-conditions field, distinct from the patient's own
      30-day exposure history (ANT_CB_*).
    code_system: none
    source: inferred
    reasoning: >
      CON_ = condições do local provável de infecção; ESGOTO = esgoto;
      leptospirosis's classic environmental risk factor.

  CON_ROEDOR:
    official_name: Sinais de roedores no local provável de infecção
    translated_name: Signs of rodents at likely infection site (flag)
    description: >
      Whether the site identified as the likely infection location showed
      signs of rodent presence - an environmental finding recorded by
      investigators, paired with CON_ESGOTO in the same site-conditions
      block.
    code_system: none
    source: inferred
    reasoning: CON_ = condições do local; ROEDOR = roedor; sibling of CON_ESGOTO.

  LAB_BI:
    official_name: Bilirrubina
    translated_name: Bilirubin (test result)
    description: >
      Bilirubin test result for the leptospirosis patient, relevant because
      jaundice (Weil's disease) is the hallmark of severe leptospirosis.
    code_system: none
    source: inferred
    reasoning: LAB_ = laboratorial; BI = bilirrubina; width 4 fits a short coded/numeric value.

  LAB_MACRO:
    official_name: Soroaglutinação macroscópica
    translated_name: Macroscopic agglutination test (flag)
    description: >
      Whether the rapid macroscopic agglutination screening test was
      performed for leptospirosis - a bedside screen distinct from the
      reference microscopic agglutination test (LAB_SOROAG).
    code_system: none
    source: inferred
    reasoning: LAB_ = laboratorial; MACRO = macroscópica; pairs with LAB_SOROAG.

  LAB_PLAQUE:
    official_name: Plaquetas
    translated_name: Platelet count
    description: >
      Platelet count for the leptospirosis patient; thrombocytopenia is a
      common finding and contributes to the bleeding risk seen in severe
      cases.
    code_system: none
    source: inferred
    reasoning: LAB_ = laboratorial; PLAQUE = plaquetas; width 6 fits a numeric count.

  LAB_SOROAG:
    official_name: Soroaglutinação microscópica
    translated_name: Microscopic agglutination test - MAT (flag or result)
    description: >
      Whether/how the microscopic agglutination test (MAT), the reference
      serologic standard for leptospirosis, was performed - distinct from
      the rapid macroscopic screen (LAB_MACRO).
    code_system: none
    source: inferred
    reasoning: LAB_ = laboratorial; SOROAG = soroaglutinação; MAT is leptospirosis's gold-standard serology.

  LAB_S_4:
    official_name: Sorologia - amostra 4
    translated_name: Serology - sample/reading 4
    description: >
      A serology titer or sample-sequence value in the leptospirosis lab
      workup, numbered as a fourth reading/collection; exact position in
      the testing sequence is not certain from the field name alone.
    code_system: none
    source: inferred
    reasoning: LAB_S = sorologia; "_4" suggests a numbered sample/titer in a series; width 6 fits a titer-like value.

  # --- BOTU (botulism) - descending flaccid paralysis workup ---
  STSOROMAT:
    official_name: Situação - material de soro enviado
    translated_name: Serum material sent for testing (flag)
    description: >
      Whether a blood serum sample was collected and sent as material for
      botulinum toxin testing - one of several "material sent" flags for
      botulism's different specimen types (serum, stool, suspect food).
    code_system: none
    source: inferred
    reasoning: ST = situação; SORO = soro; MAT = material; BOTU series has parallel STBROMATO (food) and STFEZESMAT (stool) flags.

  STVENTILA:
    official_name: Necessidade de ventilação mecânica
    translated_name: Mechanical ventilation required (flag)
    description: >
      Whether the botulism patient required mechanical ventilation - the
      respiratory failure from descending flaccid paralysis that makes
      botulism life-threatening, and the reason cases are hospitalized in
      intensive care.
    code_system: none
    source: inferred
    reasoning: ST = situação; VENTILA = ventilação; classic botulism severity marker.

  ST_ALI2COL:
    official_name: Situação - alimento suspeito 2 coletado
    translated_name: Suspect food item 2 sample collected (flag)
    description: >
      Whether a sample of the second suspect food item was collected for
      laboratory testing, paired with DS_ALI2 (that item's description) and
      DT_ALI2COL (collection date); ST_ALI1COL covers the first item.
    code_system: none
    source: inferred
    reasoning: ST_ALI2 = alimento 2; COL = coletado; BOTU series numbers suspect foods 1 and 2 throughout.

  TPNEURO:
    official_name: Tipo de comprometimento neurológico
    translated_name: Type of neurological involvement
    description: >
      Classifies the pattern of neurological involvement in the botulism
      case (e.g. cranial-nerve vs. peripheral), distinct from TPBOTULISM
      (which classifies foodborne/wound/infant botulism) and TP_MOTORA
      (motor-deficit pattern specifically).
    code_system: none
    source: inferred
    reasoning: TP = tipo; NEURO = neurológico; BOTU's cranial-nerve-sign checklist (ptosis, diplopia, dysphagia) supports a neurologic-pattern classification field.

  TP_MOTORA:
    official_name: Tipo de comprometimento motor
    translated_name: Type of motor involvement
    description: >
      Classifies the pattern of motor deficit in the botulism case - used
      with TP_SENSITI (sensory involvement) to characterize the neurologic
      exam; botulism causes pure motor paralysis with sensation spared,
      which helps distinguish it from Guillain-Barré syndrome.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo; MOTORA = motora; BOTU series pairs it with TP_SENSITI.

  TP_TOXOUTR:
    official_name: Tipo de toxina - outra
    translated_name: Toxin type - other
    description: >
      Records the toxin/serotype identified when it falls outside the
      standard botulinum serotype classification (TPBOTULISM) - an "other,
      specify" field for atypical lab findings.
    code_system: none
    source: inferred
    reasoning: TP_TOXOUTR = tipo de toxina + outra; BOTU's toxin-typing fields (TPSOROTOX, TPFEZESTOX) support this reading.

  UF_ING:
    official_name: UF de ingestão
    translated_name: State (UF) where food was ingested
    description: >
      State where the patient ate the suspect food, distinct from their
      state of residence (SG_UF) and state of hospitalization (UF_HOSP);
      paired with MUN_ING for the municipality of ingestion.
    code_system: none
    source: inferred
    reasoning: UF_ING = UF + ingestão; BOTU series carries the matching MUN_ING field.

  # --- CHAG (acute Chagas disease) ---
  CONFIRMAD:
    official_name: Caso confirmado
    translated_name: Case confirmed (flag)
    description: >
      Whether the Chagas case was confirmed, an early/legacy confirmation
      flag that predates the more granular CLASSI_FIN (final
      classification) and CRITERIO (confirmation criterion) fields also on
      this form.
    code_system: none
    source: inferred
    reasoning: >
      CONFIRMAD = confirmado; not found in the 2010 CHAG data dictionary,
      consistent with the low file-count schema this field belongs to
      (an older/rarer layout).

  CON_LOCAL:
    official_name: Local provável de infecção (no período de 90 dias)
    translated_name: Probable infection site (type)
    description: >
      Type of place where the patient most likely acquired acute Chagas
      infection in the 90 days before symptoms - blood-transfusion unit,
      household, laboratory, or other - central to classifying vectorial
      vs. transfusional transmission.
    code_system: internal
    source: layout_doc
    source_ref: >
      SINAN data dictionary (Chagas aguda, revised July 2010): field 62,
      values 1-unidade de hemoterapia, 2-domicílio, 3-laboratório, 4-outro.
    reasoning: Confirmed by the CHAG data dictionary text and by the catalog's own value list.

  ECG:
    official_name: Eletrocardiograma
    translated_name: Electrocardiogram (flag or result)
    description: >
      Whether an electrocardiogram was performed on the Chagas patient - a
      standard exam for detecting acute myocarditis, a hallmark cardiac
      complication of acute Chagas disease.
    code_system: none
    source: inferred
    reasoning: ECG = eletrocardiograma; not in the 2010 dictionary excerpt found, but fits the acute-Chagas cardiac workup context.

  HEMO:
    official_name: Hemocultura
    translated_name: Blood culture (flag or result)
    description: >
      Blood culture result for T. cruzi, one of the parasitological
      detection methods on the Chagas form alongside direct blood exam
      (PARASITO) and xenodiagnosis.
    code_system: none
    source: inferred
    reasoning: >
      HEMO likely abbreviates hemocultura; the dictionary documents a
      full "Hemocultivo" field (DBF code HEMOCULT) in the same
      parasitological-exam block.

  PARASITO:
    official_name: Data do encontro dos vestígios do parasito
    translated_name: Date parasite found on direct exam
    description: >
      Date T. cruzi trypomastigotes were seen on direct parasitological
      examination of the Chagas patient's blood - the definitive
      confirmatory finding for acute infection.
    code_system: none
    source: layout_doc
    source_ref: "SINAN data dictionary (Chagas aguda, revised July 2010): field 35, dt_encontro_parasito."
    reasoning: >
      Declared as a date (D8), matching the dictionary's
      "dt_encontro_parasito" field exactly.

  RECEMNASC:
    official_name: Recém-nascido - mãe com infecção chagásica
    translated_name: Newborn with Chagas-infected mother (flag)
    description: >
      For patients aged 9 months or under, whether the mother has chagasic
      infection - the question used to investigate congenital transmission
      as the case's probable infection route.
    code_system: none
    source: layout_doc
    source_ref: "SINAN data dictionary (Chagas aguda, revised July 2010): field 39, DBF code MAECHAGA."
    reasoning: >
      Dictionary field 39 asks exactly this ("Menor ou igual a 9 meses de
      idade: Mãe com infecção chagásica"); RECEMNASC = recém-nascido names
      the same concept from the notification-form side.

  RES_HIST:
    official_name: Resultado do exame histopatológico
    translated_name: Histopathology result
    description: >
      Result of histopathological examination for the Chagas patient
      (positive/negative/not performed) - one of the confirmatory lab
      methods alongside direct parasite exam and hemoculture.
    code_system: internal
    source: layout_doc
    source_ref: >
      SINAN data dictionary (Chagas aguda, revised July 2010): field 52,
      values 1-positivo, 2-negativo, 3-não realizado, 9-ignorado.
    reasoning: Confirmed by the CHAG data dictionary text and by the catalog's own value list.
