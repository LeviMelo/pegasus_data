    translated_name: Conventional (slide) collection method flag
    description: 'Reads as the companion flag to MEIOLIQU, marking that the sample
      was collected as a conventional (dry-slide) Papanicolaou smear rather than liquid-based
      cytology.

      '
    code_system: none
    source: inferred
    reasoning: 'Decomposes to an abbreviation of ''convencional'', paired with the neighbouring
      field MEIOLIQU (''meio liquido''). Liquid-based cervical cytology became a billable
      SUS procedure alongside the conventional smear, so a binary collection-method pair is
      the natural DATASUS-style encoding, but neither field name is confirmed against a written
      source - the paper form on file predates the liquid-based option and does not show either
      checkbox. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). Form 415 has no collection-method
      item.'
    notes: 'Moderate confidence only; treat as a working hypothesis, not a citation.

      '
  C_EPI_ESCA:
    official_name: Epitelio escamoso representado na amostra
    translated_name: Squamous epithelium present in sample
    description: 'Whether squamous epithelium is present in the smear - one of the
      ADEQUABILIDADE DO MATERIAL checkboxes (''Epitelios representados na amostra:
      Escamoso / Glandular / Metaplasico'') used to judge whether the sample is technically
      adequate. This is a presence flag, distinct from O_CIT_ESCA, which carries the
      actual squamous-abnormality diagnosis.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
  C_EPI_GLAN:
    official_name: Epitelio glandular representado na amostra
    translated_name: Glandular epithelium present in sample
    description: 'Glandular counterpart of C_EPI_ESCA: whether glandular epithelium
      is present in the smear, from the same ''Epitelios representados na amostra''
      adequacy checkboxes.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
  DENCARCINV:
    official_name: Carcinoma epidermoide invasor (citologia)
    translated_name: Invasive squamous carcinoma flag (cytology)
    description: 'Flag for the ''Carcinoma epidermoide invasor'' checkbox at the foot
      of the ATIPIAS EM CELULAS ESCAMOSAS block on the cytology result - cytologic
      evidence of frankly invasive squamous carcinoma, not a histologically confirmed
      diagnosis.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
  DT_ANM_PRE:
    official_name: Ano do exame preventivo anterior informado na anamnese
    translated_name: Year of previously reported Pap smear
    description: 'The 4-digit year the patient reported for her last Pap smear on anamnese
      question 2 (''ano ___''). Declared C(4,0), matching a bare year rather than a
      full DD/MM/AAAA date.

      '
    code_system: none
    source: inferred
    reasoning: 'DT_ is DATASUS''s date-field prefix; a declared width of 4 characters only
      fits a bare year, which matches the ''ano ___'' blank on anamnese question 2 rather
      than any full-date field on the form. Reviewed 2026-09-28: no documentation found (searched
      TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas Tecnicas 1-14,
      INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP DOC folders
      and the web). Form 415 item 2 ("Sim. Quando fez o último exame? ano") has the year blank
      this reading assumes.'
    notes: 'Do not expect day/month precision from this column - it is a year only.

      '
  INSATSFAC:
    official_name: Amostra insatisfatoria para avaliacao oncotica
    translated_name: Unsatisfactory sample flag (cytology)
    description: 'Flags that the smear was judged unsatisfactory for oncotic evaluation.
      The form lists six specific reasons (acellular/hypocellular material, >75% blood,
      >75% pus cells, drying artefact, external contaminants, cell overlap) under this
      heading; this column carries the overall insatisfatoria verdict, not which specific
      reason applied.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
  LAGRAU:
    official_name: Lesao intraepitelial de alto grau (familia)
    translated_name: High-grade squamous lesion family flag
    description: 'Ties to the ''alto grau'' squamous-lesion family on the cytology
      result, which appears more than once on the form: as ''nao se pode afastar lesao
      de alto grau'' (ASC-H-type wording, under celulas atipicas de significado indeterminado)
      and as the definitive ''Lesao intra-epitelial de alto grau'' (HSIL) checkbox.
      Which exact checkbox this column encodes could not be pinned down from the form
      alone.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
    notes: 'Confidently in the high-grade squamous family; the exact checkbox (ASC-H
      vs HSIL) is not independently confirmed. Do not treat as interchangeable with
      LAGRAUMI, which is unambiguous.

      '
  LAGRAUMI:
    official_name: Lesão intra-epitelial de alto grau, não podendo excluir microinvasão
      (citologia)
    translated_name: Count of high-grade lesion cytology results that cannot exclude
      microinvasion
    description: Count of cytology exams reporting a high-grade squamous intra-epithelial
      lesion where microinvasion could not be excluded — the escalation category between
      LAGRAU and an outright invasive carcinoma diagnosis.
    code_system: none
    source: layout_doc
    source_ref: http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf
      — Nota Técnica 2 SISCAN, 'Les IE AG Mic. Inv'
  LBGRAU:
    official_name: Lesao intraepitelial de baixo grau
    translated_name: Low-grade squamous intraepithelial lesion (LSIL) flag
    description: 'Flag for ''Lesao intra-epitelial de baixo grau (compreendendo efeito
      citopatico pelo HPV e neoplasia intra-epitelial cervical grau I)'' - LSIL - under
      ATIPIAS EM CELULAS ESCAMOSAS.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
  LESALTGRA:
    official_name: 'Células escamosas atípicas de significado indeterminado: não se pode afastar
