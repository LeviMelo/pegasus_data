    source_ref: Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Exames Alterados"
    notes: Declared C(0,0); no observed values captured.
  OUTNEO:
