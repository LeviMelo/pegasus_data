      p.2 "Células atípicas de significado indeterminado - Glandulares: Não se pode afastar
      lesão de alto grau"; Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "At.Glan.Ind. Alto Grau"'
  NU_EXAME_ALTERADO:
    official_name: Exames Alterados
    translated_name: Count of altered (abnormal) exam results
    description: Number of cytology exams in the row with at least one atypia result (atypical
