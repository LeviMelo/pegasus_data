# SISCAN.CC — Cervical cytology
# Citopatológico do Colo do Útero
#
# One cervical cytology (Pap) exam and its result.
system: SISCAN
asserted_by: pegasus_data

variables:
  ALTERADO:
    official_name: Exames Alterados
    translated_name: Abnormal exams (count)
    description: 'Number of exams in the row with at least one atypia result: atypical squamous,
      glandular or undefined-origin cells, a low- or high-grade squamous lesion, invasive
      squamous carcinoma, or adenocarcinoma. Benign changes are not counted. A roll-up of
      the specific findings, so adding it to them double-counts.'
    code_system: none
    source: layout_doc
    source_ref: TabWin definition CColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo ALTERADO "Exames Alterados"; Nota Técnica 2 SISCAN - Citopatológico do colo do
      útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Exames Alterados"
  AMOSREJALH:
    official_name: Amostra rejeitada por causas alheias ao laboratório
    translated_name: Rejected, causes outside the laboratory
    description: Number of samples rejected before reading for causes outside the laboratory's
      control.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition CColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo AMOSREJALH "Rejeit.alheias lab"; INCA, Requisição de Exame Citopatológico - Colo
      do Útero (formulário nº 415) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.2 "Amostra rejeitada por: Causas alheias ao laboratório"; Nota Técnica 2 SISCAN -
      Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Rej. causas alheias"'
  AMOSREJAUS:
    official_name: Amostra rejeitada por ausência ou erro na identificação da lâmina, frasco
      ou formulário
    translated_name: Rejected, missing or wrong identification
    description: Number of samples rejected because the slide, vial or form was missing its
      identification or was wrongly identified.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition CColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
