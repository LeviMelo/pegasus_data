  CO_ADEQ_MA:
    official_name: Adequabilidade do material
    translated_name: Specimen adequacy
    description: 'Whether the smear was satisfactory, unsatisfactory, or rejected outright.
      The first question asked of any cytology: an unsatisfactory slide has no result
      at all and the woman must be recalled, so this field is the denominator problem
      for every screening indicator.

      '
    code_system: internal
    source: def
    source_ref: ADEQMAT.CNV
    reasoning: 'Bound to ADEQMAT, whose values are rejeitada, satisfatória and insatisfatória.

      '
  CO_AMOSTRA:
    official_name: Adequabilidade da amostra
    translated_name: Sample adequacy
    description: 'Whether the collected material was adequate to report on. An inadequate
      sample means the woman must be recalled, so this is the first thing a cytology
      report settles.

      '
    code_system: internal
    source: inferred
    reasoning: 'AMOSTRA is the sample; C(1) admits the small enumerated set the Brazilian
      nomenclature defines for adequacy. Reviewed 2026-09-28: no documentation found (searched
      TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas Tecnicas 1-14,
      INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP DOC folders
      and the web). CColo4.def binds adequacy to CO_ADEQ_MA, not to this column.'
  CO_ANM_PRE:
    official_name: Exame citopatológico anterior alterado
    translated_name: Previous cytology abnormal
    description: 'Whether a previous smear was abnormal. Sets the context for the current
      result: a second abnormal smear means something different from a first.

      '
    code_system: internal
    source: def
    source_ref: CITOANT.CNV
    reasoning: 'Bound to CITOANT, whose values are sim, não, não sabe and sem informação
      na ficha.

      '
  CO_ATI_ESC:
    official_name: Atipias em células escamosas
    translated_name: Atypical squamous cells
    description: 'Squamous atypia of undetermined significance, split into ASC-US (possibly
      non-neoplastic) and ASC-H (cannot exclude a high-grade lesion). The distinction
      decides between repeat screening and immediate colposcopy.

      '
    code_system: internal
    source: def
    source_ref: ATIPINDESC.CNV
    reasoning: 'Bound to ATIPINDESC, whose values are the Bethesda ASC-US and ASC-H
      categories.

      '
  CO_ATI_GLA:
    official_name: Atipias em células glandulares
    translated_name: Atypical glandular cells
    description: 'Glandular atypia, again split by whether a high-grade lesion can
      be excluded. Rarer than squamous atypia and carries a higher risk of underlying
      disease, so it is referred more readily.

      '
    code_system: internal
    source: def
    source_ref: ATIPINDGLA.CNV
    reasoning: Bound to ATIPINDGLA, the glandular counterpart of ATIPINDESC.
  CO_ATI_IND:
    official_name: Atipias de origem indefinida
