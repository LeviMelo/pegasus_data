      "Ori. Indef. Não Neo"'
  REJEITADA:
    official_name: Amostra rejeitada
    translated_name: Rejected sample flag (cytology)
    description: 'Flags that the slide was rejected before analysis - the AMOSTRA REJEITADA
      POR section (missing/wrong slide identification, damaged or absent slide, cause
      outside the lab''s control, or another stated cause). A rejected sample carries
      no cytologic result at all.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Colo do Utero
      (formulario no.415), p.1-2
    notes: 'Do not confuse with INSATSFAC, which covers samples that WERE read but
      judged technically inadequate.

      '
  REPREZT:
