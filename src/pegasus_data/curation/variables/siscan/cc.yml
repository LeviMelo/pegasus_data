    translated_name: Other malignant neoplasm flag (cytology, alternate encoding)
    description: 'Flag for the same ''OUTRAS NEOPLASIAS MALIGNAS'' checkbox as CO_NEO_MAL.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
