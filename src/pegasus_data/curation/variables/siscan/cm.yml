# SISCAN.CM — Breast cytology
# Citopatológico de Mama
#
# One breast cytology exam and its result.
system: SISCAN
asserted_by: pegasus_data

variables:
  CCLIMATDPC:
    official_name: Material enviado - tipo de coleta
    translated_name: Specimen collection-method code
    description: 'Ties to the ''5. Material enviado:'' checkboxes (descarga papilar
      / puncao aspirativa / conteudo cistico) - which of the three specimen types accompanies
      the request.

      '
    codelists:
    - CCLIMATDPC
    code_system: internal
    source: inferred
    reasoning: 'CCLI (caracteristica clinica) + MAT (material) + DPC reads as an abbreviation
      of descarga papilar / conteudo (cistico), the specimen-source checkboxes under
      ''Material enviado'' once CCLIMATMAM (laterality) is set aside.

      '
    notes: 'Moderate confidence; the exact option wording per code value is not confirmed.

      '
  CCLIMATMAM:
    official_name: Lateralidade da mama (material enviado)
    translated_name: Breast laterality of specimen
    description: 'From ''Mama direita / Mama esquerda'' under ''Material enviado''
      - which breast the specimen came from.

      '
    codelists:
    - CCLIMATMAM
    code_system: internal
    source: inferred
    reasoning: 'CCLI+MAT+MAM reads as caracteristica-material-mama; laterality is the
      remaining checkbox in that section once CCLIMATDPC accounts for the collection-method
      options.

      '
    notes: 'Moderate confidence.

      '
  CNPJ_MANT:
    official_name: CNPJ da mantenedora
    translated_name: Maintaining entity's CNPJ
    description: 'Brazilian company-registry number (CNPJ) of the legal entity that
      administers the health facility in this SISMAMA provider-registration record;
      passes through unmodified, an identifier not a label.

      '
    code_system: none
    source: inferred
    reasoning: 'Follows CNES-style cadastro naming (CNPJ_MAN identifies the mantenedora
      entity); the sampled file path CMAC*.dbc under SISMAMA/Dados matches the Cadastro
      Mantenedora registration-file pattern used elsewhere in DATASUS.

      '
    source_ref: naming grammar + strata sampled_path SISMAMA/Dados/CMAC0907.dbc
  COMPET:
    official_name: Competência
    translated_name: Reference period
    description: 'Reference month and year (YYYYMM) this SISMAMA provider-registration
