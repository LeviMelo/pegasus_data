# SISCAN.CM — Breast cytology
# Citopatológico de Mama
#
# One breast cytology exam and its result.
system: SISCAN
asserted_by: pegasus_data

variables:
  CCLIMATDPC:
    official_name: Material enviado
    translated_name: Specimen collection-method code
    description: 'Type of material sent (CCLIMATDPC.CNV): 01 nipple discharge, 02 fine-needle
      aspiration, 03 cyst content.'
    codelists:
    - CCLIMATDPC
    code_system: internal
    source: layout_doc
    source_ref: TabWin definition CMAMA4.def (SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CCLIMATDPC "Material Enviado" (CCLIMATDPC.CNV); INCA, Requisição de Exame Citopatológico
      - Mama (formulário nº 416) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-mama.pdf,
      p.1 item 5 "Material enviado"
  CCLIMATMAM:
    official_name: Mama
    translated_name: Breast laterality of specimen
    description: 'Which breast the material came from (CCLIMATMAM.CNV): 01 right, 02 left.'
    codelists:
    - CCLIMATMAM
    code_system: internal
    source: layout_doc
    source_ref: 'TabWin definition CMAMA4.def (SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CCLIMATMAM "Mama" (CCLIMATMAM.CNV); INCA, Requisição de Exame Citopatológico -
      Mama (formulário nº 416) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-mama.pdf,
      p.1 item 5 "Material enviado: Mama direita / Mama esquerda"'
  CNPJ_MANT:
    official_name: CNPJ da mantenedora
    translated_name: Maintaining entity's CNPJ
    description: 'Brazilian company-registry number (CNPJ) of the legal entity that
      administers the health facility in this SISMAMA provider-registration record;
      passes through unmodified, an identifier not a label.

      '
    code_system: external
    codelist: CNPJ_BR
    source: inferred
    reasoning: 'Follows CNES-style cadastro naming (CNPJ_MAN identifies the mantenedora entity);
      the sampled file path CMAC*.dbc under SISMAMA/Dados matches the Cadastro Mantenedora
      registration-file pattern used elsewhere in DATASUS. Reviewed 2026-09-28: no documentation
      found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas
      Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP
      DOC folders and the web).'
    source_ref: naming grammar + strata sampled_path SISMAMA/Dados/CMAC0907.dbc
  COMPET:
    official_name: Competência
    translated_name: Reference period
    description: 'Reference month and year (YYYYMM) this SISMAMA provider-registration
      snapshot describes, the same competência convention SISCAN uses to date its exam
      records.

      '
    code_system: none
    source: inferred
    reasoning: '6-digit declared width matches YYYYMM; SISCAN''s technical notes define competência
      as the month/year a record is released, and this cadastro file reuses that same DATASUS
      convention. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
    source_ref: naming grammar + SISCAN Nota Tecnica 8 competência field
  CO_CLI_DES:
    official_name: Descarga papilar (achado clínico)
    translated_name: Nipple discharge characteristic (clinical finding)
    description: 'Characteristic of nipple discharge reported on clinical exam of the
      breast — Cristalina or Hemorrágica — from question 4 (EXAME CLÍNICO DAS MAMAS)
      on the breast cytology requisition. Bound to CCLIDESC.

      '
    codelists:
    - CCLIDESC
    code_system: internal
    source: layout_doc
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf,
      page 1, EXAME CLÍNICO DAS MAMAS — Descarga papilar
  CO_CLI_NOD:
    official_name: Nódulo/tumor (achado clínico)
    translated_name: Palpable nodule characteristic (clinical finding)
    description: 'Characteristic of a palpable breast nodule found on clinical exam
      — Sólido, Cístico, or Sólido-cístico — from the same EXAME CLÍNICO DAS MAMAS
      section. Bound to CCLINODU.

      '
    codelists:
    - CCLINODU
    code_system: internal
    source: layout_doc
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf,
      page 1, EXAME CLÍNICO DAS MAMAS — Nódulo (tumor)
  CO_SEQ_SISCAN_CITO_MAMA_RESID:
    official_name: Sequencial SISCAN citopatologia mama (resultado)
    translated_name: Record sequence number (breast-cytology result)
    description: Row-sequence identifier on the main SISCAN_CITO_MAMA result/exam-record
      table, distinct from the _PACNT patient-dimension sequence.
    code_system: none
    source: inferred
    reasoning: 'Same PACNT-vs-RESID split documented for CO_SEQ_SISCAN_HISTO_COLO_RESID in
      siscan_fill_02.yml. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  CRESBENIG:
    official_name: Resultado da puncao aspirativa - Processos Benignos. Negativo para
      malignidade
    translated_name: 'PAAF result category: Processos Benignos. Negativo para malignidade'
    description: 'One of the four fine-needle-aspiration (PAAF) result categories the
      SISMAMA 2010 informe itself charts by name in Figura 9 (''Processos Benignos.
      Negativo para malignidade'' among them) - the top-level classification of a breast
      FNA cytology result. Bound to a self-named internal codelist enumerating the
      specific findings within the category (see the PBEN*/PMALIN*/PSUS*/PPOSMAC* entries).

      '
    codelists:
    - CRESBENIG
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle
      do cancer de mama no Brasil (2010)'
  CRESDERPAP:
    official_name: Resultado — descarga papilar / conteúdo cístico
    translated_name: Nipple-discharge / cystic-content specimen result flag
    description: 'Flags that the specimen examined was nipple discharge or cystic content
      rather than a fine-needle aspirate of a solid nodule — the form gives this its
      own result section (RESULTADO DA DESCARGA PAPILAR / CONTEÚDO CÍSTICO) with its
      own six-category outcome set (see DEMATACELU/DENEGMALIG/DEMALIINDT/DEPOSMALIG/DELESMALIG/DEPROCINFL).

      '
    codelists:
    - CRESDERPAP
    code_system: internal
    source: layout_doc
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf,
      page 2, RESULTADO DA DESCARGA PAPILAR / CONTEÚDO CÍSTICO
  CRESMALIIN:
    official_name: Resultado da puncao aspirativa - Malignidade Indeterminada Compativel
    translated_name: 'PAAF result category: Malignidade Indeterminada Compativel'
    description: 'One of the four fine-needle-aspiration (PAAF) result categories the
      SISMAMA 2010 informe itself charts by name in Figura 9 (''Malignidade Indeterminada
      Compativel'' among them) - the top-level classification of a breast FNA cytology
      result. Bound to a self-named internal codelist enumerating the specific findings
      within the category (see the PBEN*/PMALIN*/PSUS*/PPOSMAC* entries).

      '
    codelists:
    - CRESMALIIN
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle
      do cancer de mama no Brasil (2010)'
  CRESPOSMAL:
    official_name: Resultado da puncao aspirativa - Positivo para Malignidade
    translated_name: 'PAAF result category: Positivo para Malignidade'
    description: 'One of the four fine-needle-aspiration (PAAF) result categories the
      SISMAMA 2010 informe itself charts by name in Figura 9 (''Positivo para Malignidade''
      among them) - the top-level classification of a breast FNA cytology result. Bound
      to a self-named internal codelist enumerating the specific findings within the
      category (see the PBEN*/PMALIN*/PSUS*/PPOSMAC* entries).

      '
    codelists:
    - CRESPOSMAL
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle
      do cancer de mama no Brasil (2010)'
  CRESSUSMAL:
    official_name: Resultado da puncao aspirativa - Suspeito para Malignidade
    translated_name: 'PAAF result category: Suspeito para Malignidade'
    description: 'One of the four fine-needle-aspiration (PAAF) result categories the
      SISMAMA 2010 informe itself charts by name in Figura 9 (''Suspeito para Malignidade''
      among them) - the top-level classification of a breast FNA cytology result. Bound
      to a self-named internal codelist enumerating the specific findings within the
      category (see the PBEN*/PMALIN*/PSUS*/PPOSMAC* entries).

      '
    codelists:
    - CRESSUSMAL
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle
      do cancer de mama no Brasil (2010)'
  C_ANM_TCAN:
    official_name: Risco Elevado (anamnese)
    translated_name: Known elevated breast cancer risk
    description: 'Whether the patient reported a known elevated risk for breast cancer,
      such as a personal history of breast cancer or a first-degree relative diagnosed
      before age 50.

      '
    code_system: internal
    source: inferred
    reasoning: 'Shares the ANM (anamnese) + TCAN (câncer) pattern with CANMPACANC (MMAMA4.def)
      and C_CLI_TCAN (HMAMA4.def), both labeled "Risco Elevado" and defined in Nota Tecnica
      8. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). The requisition asks
      "3. Apresenta risco elevado para câncer de mama?" (form 416) and CMAMA4.def tabulates
      "Risco Elevado" from CANMPACANC (RiscoElevado.CNV), but no document names C_ANM_TCAN.'
    source_ref: 'naming grammar + Nota Tecnica 8 SISCAN - Mamografia, campo Risco elevado

      '
  DELESMALIG:
    official_name: Consistente com lesão papilar
    translated_name: Nipple-discharge/cystic result — consistent with papillary lesion
    description: Number of nipple-discharge or cyst-content specimens whose cytology pattern
      was consistent with a papillary lesion.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition CMAMA4.def (SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo DELESMALIG "Desc Les Papilar"; INCA, Requisição de Exame Citopatológico - Mama
      (formulário nº 416) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-mama.pdf,
      p.2 "Resultado da descarga papilar / conteúdo cístico: Consistente com lesão papilar"'
  DEMALIINDT:
    official_name: Descarga papilar - Padrao citopatologico de malignidade indeterminada
    translated_name: 'Nipple-discharge finding: Padrao citopatologico de malignidade
      indeterminada'
    description: 'One of the checkboxes for ''Padrao citopatologico de malignidade
      indeterminada'' under ''Padrao citopatologico da amostra'' in RESULTADO DA DESCARGA
      PAPILAR / CONTEUDO CISTICO.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-mama.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Citopatologico - Mama (formulario
      no.416), p.1-2
    depends_on:
    - CRESDERPAP
  DEMATACELU:
    official_name: Descarga papilar - Material acelular
    translated_name: 'Nipple-discharge finding: Material acelular'
    description: 'One of the checkboxes for ''Material acelular'' under ''Padrao citopatologico
