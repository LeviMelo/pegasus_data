  CRADPELED:
    official_name: Pele, mama direita
    translated_name: Skin, right breast
    description: 'Whether the skin of the right breast is normal, thickened or retracted.
      Skin change is a late sign, so an abnormality here rarely accompanies an early lesion.

      '
    code_system: internal
    source: def
    source_ref: CRADPELE.CNV
    reasoning: 'Bound to CRADPELE, whose values are normal, espessada and retraída.

      '
