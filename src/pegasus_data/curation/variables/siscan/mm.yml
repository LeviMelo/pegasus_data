    source: def
    source_ref: CRADPELE.CNV
    reasoning: Bound to CRADPELE, the left-side field of the pair.
  DINTSOLICT:
    official_name: Intervalo entre solicitação e coleta
    translated_name: Interval, request to examination
    description: 'How long the woman waited, banded 0 to 10 days, 11 to 20, 21 to 30 and over
      30. A measure of access, banded rather than exact, so it will not give a mean wait.

      '
    code_system: internal
    source: def
    source_ref: INTCOLETA.CNV
    reasoning: Bound to INTCOLETA, whose values are the day-interval bands.
  INDICLINIC:
    official_name: Indicação clínica da mamografia
    translated_name: Clinical indication
    description: 'Whether the mammogram was for screening or for diagnosis. Diagnostic mammograms
      are done because something was already found, so their abnormality rate is far higher;
      mixing the two ruins any screening indicator.

