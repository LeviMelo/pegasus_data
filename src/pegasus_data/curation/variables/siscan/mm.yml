# SISCAN.MM — Mammography
# Mamografia
#
# One mammogram, with its BI-RADS classification.
system: SISCAN
asserted_by: pegasus_data
variables:
  CANMEXAPR:
    official_name: Exame clínico anterior
    translated_name: Prior clinical breast exam
    description: 'Whether the patient had her breasts examined by a health professional before
      the consultation that requested the mammogram (CANMEXAPR.CNV: 3 yes, 2 never examined,
      9 inconsistent). Not the prior-mammogram question, which is CANMMAMOGR.'
    code_system: internal
    source: layout_doc
    source_ref: TabWin definition MMAMA4.def (SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CANMEXAPR "Exam Clín Ant" (CANMEXAPR.CNV); INCA, Orientações para elaboração de
      laudo utilizando o SISMAMA (2010) — https://bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      Campo 3; Nota Técnica 7 SISCAN - Mamografia — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica7_mamografia_residente.pdf,
      "Ex Clin Ant"
  CANMMAMOGR:
    official_name: Risco elevado para cancer de mama
    translated_name: Elevated breast-cancer risk flag
    description: Flag on the request form for whether the woman is at elevated risk of breast
      cancer. It drives the recommended screening interval — annual rather than biennial mammography.
    codelists:
    - RISCOELEVADO
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do
      cancer de mama no Brasil (2010)'
    notes: 'Elevated risk is defined verbatim on the citologia-mama form and the SISMAMA informe
      as: a first-degree relative diagnosed before 50; bilateral breast or any-age ovarian
      cancer in a first-degree relative; a male relative with breast cancer; or a personal
      history of proliferative lesion with atypia or lobular neoplasia in situ. The interval
      rule is Quadro 1 of the informe.'
  CATBIRADS:
    official_name: Categoria BI-RADS
    translated_name: BI-RADS category
    description: 'The mammography report''s BI-RADS category (0 through 6), the American College
      of Radiology''s standardised reporting scale that SISMAMA/INCA adopted for every mammogram.
      Category 0 = inconclusive (needs further imaging); 1 = no findings; 2 = benign findings;
      3 = probably benign; 4(A/B/C) = suspicious; 5 = highly suggestive of malignancy; 6 =
      biopsy-proven malignancy, with escalating recommended follow-up from routine screening
      through biopsy at each step. Bound to codelist CATBIRADS.

      '
    codelists:
    - CATBIRADS
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do
      cancer de mama no Brasil (2010)'
    reasoning: 'Tabela 1 of the SISMAMA informe (''Categoria BI-RADS no laudo mamografico
      e recomendacoes de conduta'') gives the category scale and interpretation verbatim.

      '
  CCALCASPBD:
    official_name: 'Outros achados: Calcificações de aspecto benigno, mama direita'
    translated_name: Benign-appearing calcifications, right breast
    description: Number of mammograms reporting, among the typically benign "other findings",
      benign-appearing calcifications (skin, eggshell, dystrophic) in the right breast.
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Orientações para elaboração de laudo utilizando o SISMAMA (2010) —
      https://bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf, p.30-31
      "Outros achados": "Calcificações de aspecto benigno"'
  CCALCASPBE:
    official_name: 'Outros achados: Calcificações de aspecto benigno, mama esquerda'
    translated_name: Benign-appearing calcifications, left breast
    description: Number of mammograms reporting, among the typically benign "other findings",
      benign-appearing calcifications (skin, eggshell, dystrophic) in the left breast.
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Orientações para elaboração de laudo utilizando o SISMAMA (2010) —
      https://bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf, p.30-31
