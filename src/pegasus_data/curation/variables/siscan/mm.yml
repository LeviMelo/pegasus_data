      flag rather than free text. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). Nota Técnica 7 describes
      "Nódulo_requis" (nodule reported on the requisition: right, left, both) and the SISMAMA
      laudo guide Campo 1 asks "Tem nódulo ou caroço na mama?", which fit this reading, but
      no document names PRESNOD.'
    source_ref: naming grammar + Nota Tecnica 8 SISCAN - Mamografia, campo Nódulo_requis
