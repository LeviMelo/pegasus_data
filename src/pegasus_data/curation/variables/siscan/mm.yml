# SISCAN.MM — Mammography
# Mamografia
#
# One mammogram, with its BI-RADS classification.
system: SISCAN
asserted_by: pegasus_data
variables:
  CANMEXAPR:
    official_name: Mamografia anterior
    translated_name: Prior mammogram flag
    description: 'Sim/Não/Não sabe flag for whether the patient reports having had a mammogram
      before, from the requisition anamnesis. Nota Técnica 7 uses this to compute Periodicidade
      (years since the previous mammogram) and to classify screening-type mammograms.

      '
    code_system: internal
    source: inferred
    reasoning: 'Sits alongside CANMMAMOGR (same CANM prefix, same MM series, same C(1,0) width)
      and "EXAPR" decomposes as "EXAme PRévio" (prior exam). Nota Técnica 7 names exactly
      this concept as "Mamog. Anterior — refere-se à informação dada pelo(a) paciente de já
      haver realizado alguma mamografia anteriormente", which is the only anamnesis item in
      the document this field could be.

      '
    asserted_by: pegasus_data
    source_ref: http://tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica7_mamografia_residente.pdf
      — Nota Técnica 7 SISCAN, 'Mamog. Anterior'
  CANMMAMOGR:
    official_name: Risco elevado para cancer de mama
    translated_name: Elevated breast-cancer risk flag
    description: Flag on the request form for whether the woman is at elevated risk of breast
      cancer. It drives the recommended screening interval — annual rather than biennial mammography.
    codelists:
    - RISCOELEVADO
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do
      cancer de mama no Brasil (2010)'
    notes: 'Elevated risk is defined verbatim on the citologia-mama form and the SISMAMA informe
      as: a first-degree relative diagnosed before 50; bilateral breast or any-age ovarian
      cancer in a first-degree relative; a male relative with breast cancer; or a personal
      history of proliferative lesion with atypia or lobular neoplasia in situ. The interval
      rule is Quadro 1 of the informe.'
  CATBIRADS:
    official_name: Categoria BI-RADS
    translated_name: BI-RADS category
    description: 'The mammography report''s BI-RADS category (0 through 6), the American College
      of Radiology''s standardised reporting scale that SISMAMA/INCA adopted for every mammogram.
      Category 0 = inconclusive (needs further imaging); 1 = no findings; 2 = benign findings;
      3 = probably benign; 4(A/B/C) = suspicious; 5 = highly suggestive of malignancy; 6 =
      biopsy-proven malignancy, with escalating recommended follow-up from routine screening
      through biopsy at each step. Bound to codelist CATBIRADS.

      '
    codelists:
    - CATBIRADS
    code_system: internal
    source: web
    source_ref: 'https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/informe_sismama_2010.pdf,
      INCA/Ministerio da Saude, SISMAMA: Informacao para o avanco das acoes de controle do
      cancer de mama no Brasil (2010)'
    reasoning: 'Tabela 1 of the SISMAMA informe (''Categoria BI-RADS no laudo mamografico
      e recomendacoes de conduta'') gives the category scale and interpretation verbatim.

      '
  CCALCASPBD:
    official_name: Calcificações de aspecto benigno, mama direita
    translated_name: Benign-appearing calcifications, right breast
    description: 'Number of reports finding calcifications of benign appearance in the right
      breast. Their morphology is what separates them from the suspicious microcalcifications
      that prompt biopsy.

      '
    code_system: none
    source: inferred
    reasoning: CALC ASP B reads calcificações aspecto benigno; D for direita, C(8).
  CCALCASPBE:
    official_name: Calcificações de aspecto benigno, mama esquerda
    translated_name: Benign-appearing calcifications, left breast
    description: 'The benign-calcification count for the left breast.

      '
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.
  CCALCVASCD:
    official_name: Calcificações vasculares, mama direita
    translated_name: Vascular calcifications, right breast
    description: 'Calcifications following the line of a blood vessel in the right breast.
      Recorded apart from other benign calcifications because their cause is arterial rather
      than glandular.

      '
    code_system: none
    source: inferred
    reasoning: CALC VASC is calcificações vasculares; D for direita, C(8).
  CCALCVASCE:
    official_name: Calcificações vasculares, mama esquerda
    translated_name: Vascular calcifications, left breast
    description: 'Vascular calcifications in the left breast.

      '
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.
  CCONRECOM:
    official_name: Conduta recomendada
    translated_name: Recommended follow-up
    description: 'What the radiologist recommends next — ultrasound, routine mammography in
      one or two years, radiological control at six months, or cytology. The action the exam
      produces, and what the screening programme is judged on.

      '
    code_system: internal
    source: def
    source_ref: CCONRECOM.CNV
    reasoning: 'Bound to CCONRECOM, whose values enumerate the follow-up options from ultrasound
      through repeat imaging intervals.

      '
  CCONRECOMD:
    official_name: Conduta recomendada, mama direita
    translated_name: Recommended management, right breast
    description: 'What the radiologist recommends next for the right breast — routine recall,
