      https://bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf, p.30-31
      "Outros achados": "Calcificações vasculares"'
  CCONRECOM:
    official_name: Conduta recomendada
    translated_name: Recommended follow-up
    description: 'What the radiologist recommends next — ultrasound, routine mammography in
      one or two years, radiological control at six months, or cytology. The action the exam
      produces, and what the screening programme is judged on.

      '
    code_system: internal
    source: def
    source_ref: CCONRECOM.CNV
    reasoning: 'Bound to CCONRECOM, whose values enumerate the follow-up options from ultrasound
      through repeat imaging intervals.

      '
  CCONRECOMD:
    official_name: Recomendação de conduta, mama direita
    translated_name: Recommended management, right breast
    description: 'Management recommended for the right breast (CCONRECOM.CNV): 1 ultrasound
      complement, 2 mammography in 2 years, 3 mammography in 1 year, 4 radiological control
      in 6 months, 5 radiological control in 1 year, 6 cyto/histopathology, 7 specific therapy.'
    code_system: internal
    source: layout_doc
    source_ref: INCA, Orientações para elaboração de laudo utilizando o SISMAMA (2010) — https://bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      Quadro 10 "Recomendação de conduta"; TabWin definition MMAMA4.def (SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CCONRECOM "Recomendações" (CCONRECOM.CNV)
  CCONRECOME:
    official_name: Recomendação de conduta, mama esquerda
    translated_name: Recommended management, left breast
    description: 'Management recommended for the left breast (CCONRECOM.CNV): 1 ultrasound
      complement, 2 mammography in 2 years, 3 mammography in 1 year, 4 radiological control
