# SISCAN.HC — Cervical histopathology
# Histopatológico do Colo do Útero
#
# One cervical biopsy and its result — the confirmatory step after an abnormal
# cytology.
system: SISCAN
asserted_by: pegasus_data

variables:
  ADENOINSUT:
    official_name: Adenocarcinoma in situ
    translated_name: Adenocarcinoma in situ
    description: 'Glandular carcinoma confined to the epithelium. Precancerous rather
      than invasive, and the glandular counterpart of a high-grade squamous lesion.

      '
    code_system: none
    source: inferred
    reasoning: ADENO IN SITU; C(8), values unobserved.
  CBENALTER:
    official_name: Alterações benignas
    translated_name: Benign alterations
    description: 'Benign alteration on the cervical biopsy. The commonest histopathology
      result, and the one that closes the episode.

      '
    code_system: none
    source: inferred
    reasoning: CBEN reads células benignas; C(8), values unobserved.
  CBENCERVI:
    official_name: Cervicite
    translated_name: Cervicitis
    description: Cervicitis — inflammation of the cervix, benign and treatable.
    code_system: none
    source: inferred
    reasoning: CERVI reads cervicite in the benign block; C(8), values unobserved.
  CCOLANORMA:
    official_name: Colpocitologia anormal
    translated_name: Cytology abnormal
    description: 'Number of cytology reports showing an abnormality — the complement
      of CCOLNORMAL, and what the screening programme is measured on finding.

      '
    code_system: none
    source: inferred
    reasoning: ANORMA is anormal, truncated; C(8) count in the CCOL block.
  CCOLDEFAUL:
    translated_name: HC file field (meaning not established)
    description: 'An 8-character field on the HC aggregate file. Its abbreviation does
      not resolve to a specific finding with confidence; by this file''s convention
      its C(8) width suggests a count rather than a flag.

      '
    code_system: none
    source: inferred
    reasoning: 'Sits among the confirmed C(8) count fields on the same HC file (siscan_findings.yml''s
      CNODCALD cluster), whose header states these files "aggregate exams" so C(8)
      columns are counts — but the name itself does not decompose cleanly.

      '
    notes: 'DELIBERATELY UNDER-SPECIFIED — already flagged unresolved in siscan_findings.yml
      ("the abbreviation does not settle them").

      '
  CCOLINSATI:
    official_name: Colpocitologia insatisfatória
    translated_name: Cytology unsatisfactory
    description: 'Number of reports the laboratory could not read — obscured, scant
      or badly fixed material. A high rate here is a collection-quality problem, not
      a disease signal.

      '
    code_system: none
    source: inferred
    reasoning: INSATI is insatisfatória truncated; C(8) count.
  CCOLNORMAL:
    official_name: Colpocitologia normal
    translated_name: Cytology within normal limits
    description: 'Number of cytology reports within normal limits — no epithelial lesion
      and no malignancy.

      '
    code_system: none
    source: inferred
    reasoning: 'CCOL is the cytology prefix of this block and NORMAL its outcome; C(8)
      count, like its ANORMA and INSATI siblings.

      '
  CDIEXAMINS:
    official_name: Exame insatisfatório
    translated_name: Examination unsatisfactory
    description: 'Count of examinations reported as unsatisfactory in the diagnostic
      block, recorded apart from the sample-level CCOLINSATI.

      '
    code_system: none
    source: inferred
    reasoning: EXAM INS reads exame insatisfatório; C(8) count.
  CDIFGRAU:
    official_name: Grau de diferenciação
    translated_name: Degree of differentiation
    description: 'Count of reports stating the tumour''s degree of differentiation
      — how closely the malignant cells still resemble the tissue they arose from,
      which is a determinant of prognosis.

      '
    code_system: none
    source: inferred
    reasoning: DIF GRAU reads grau de diferenciação; C(8) count in the histopathology
      block.
  CDIFINDFER:
    official_name: Indiferenciado
    translated_name: Undifferentiated
    description: 'Reports of tumour so undifferentiated that the tissue of origin can
      no longer be told from its appearance.

      '
    code_system: none
    source: inferred
    reasoning: INDFER is indiferenciado truncated; C(8) count in the same grading block.
  CDIFMODDIF:
    official_name: Moderadamente diferenciado
    translated_name: Moderately differentiated
    description: 'Reports grading the tumour moderately differentiated — the middle
      of the three grades this block enumerates.

      '
    code_system: none
    source: inferred
    reasoning: MOD DIF is moderadamente diferenciado; C(8) count.
  CDIFPOUDIF:
    official_name: Pouco diferenciado
    translated_name: Poorly differentiated
    description: 'Reports grading the tumour poorly differentiated — the grade carrying
      the worst prognosis of the three.

      '
    code_system: none
    source: inferred
    reasoning: POU DIF is pouco diferenciado; C(8) count.
  CITINDALGR:
    official_name: Citologia indicando lesão de alto grau
    translated_name: Cytology indicated a high-grade lesion
    description: 'Whether the referring cytology had indicated a high-grade lesion.
      Carried here so the biopsy result can be scored against what the smear predicted.

      '
    code_system: none
    source: inferred
    reasoning: CIT IND AL GR reads citologia indicando alto grau; C(8), values unobserved.
  CIT_OUTNEO:
    official_name: Citologia, outra neoplasia
    translated_name: Cytology, other neoplasia
    description: Any other neoplasm reported on the referring cytology.
    code_system: none
    source: inferred
    reasoning: The residual neoplasia item of the referring-cytology block; C(8), values
      unobserved.
  CLABCID:
    official_name: Descrição do diagnóstico
    translated_name: Diagnosis, free text
    description: 'Free-text diagnosis as the laboratory wrote it, in forty characters
      — alongside rather than instead of the coded findings.

      '
    code_system: none
    source: inferred
    reasoning: 'C(40) is far too wide for a CID-10 code and is the only free-text field
      in the block, so it carries the wording rather than the code.

      '
    notes: 'Free text, uncoded. Do not tabulate without reading it.

      '
  CMARCOMPRO:
    official_name: Margens comprometidas
    translated_name: Surgical margins involved
    description: 'Reports in which disease reached the surgical margin, meaning the
      excision was incomplete and further treatment follows.

      '
    code_system: none
    source: inferred
    reasoning: COMPRO is comprometidas truncated; the counterpart of CMARLIVRE. C(8).
  CMARIMPAVA:
    official_name: Margens impossíveis de avaliar
    translated_name: Surgical margins not assessable
    description: 'Reports where the margins could not be assessed — fragmented or cauterised
      specimens. Distinct from involved margins, and neither reassuring nor conclusive.

      '
    code_system: none
    source: inferred
    reasoning: 'IMP AVA reads impossível avaliar, the third state alongside livre and
      comprometida. C(8) count.

      '
  CMARLIVRE:
    official_name: Margens livres
    translated_name: Surgical margins clear
    description: 'Reports in which the surgical margins were free of disease — the
      finding that says the excision took all of the lesion.

      '
    code_system: none
    source: inferred
    reasoning: MAR LIVRE is margens livres; C(8) count.
  CO_ANO_COMPETENCIA:
    official_name: Ano de competência
    translated_name: Reference year
    description: Calendar year this row's aggregated biopsy counts are attributed to.
    code_system: none
    source: inferred
    reasoning: ANO_COMPETENCIA is DATASUS's standard reference-period naming across
      systems.
  CO_ANO_MES_COMPETENCIA:
    official_name: Ano/mês de competência
    translated_name: Reference year-month
    description: 'Combined year-month reference period this row''s aggregated biopsy
      counts are attributed to — a finer breakdown than CO_ANO_COMPETENCIA.

      '
    code_system: none
    source: inferred
    reasoning: ANO_MES_COMPETENCIA compounds the same reference-period naming as CO_ANO_COMPETENCIA.
  CO_BEN_ALT:
    official_name: Alteração benigna
    translated_name: Benign change present
    description: 'Whether any benign reactive change was recorded at all — the header
      of the block whose individual categories are the ATR, INF, RAD, REP and CER fields.

      '
    code_system: internal
    source: inferred
    reasoning: ALT is alteração, the general case of the block; C(1) flag.
  CO_BEN_CER:
    official_name: Alteração benigna — cervicite
    translated_name: 'Benign change: cervicitis'
    description: 'Cervicitis, chronic inflammation of the cervix, recorded among the
      benign changes.

      '
    code_system: internal
    source: inferred
    reasoning: 'CER is cervicite in the BEN block; C(2) here where its siblings are
      C(1), so it admits more than a plain flag.

      '
  CO_BEN_POL:
    official_name: Pólipo
    translated_name: Polyp
    description: A cervical polyp, benign and usually removed at the same visit.
    code_system: none
    source: inferred
    reasoning: BEN_POL reads benigno pólipo; C(8), values unobserved.
  CO_CIT_ESC:
    official_name: Citologia anterior, atipias escamosas
    translated_name: Prior cytology, squamous atypia
    description: 'The squamous atypia found on the cytology that led to this biopsy.
      Carried onto the histopathology form so the two can be compared — the comparison
      is what measures the screening test.

      '
    code_system: internal
    source: def
    source_ref: ATIPINDESC.CNV
    reasoning: Bound to ATIPINDESC, the same Bethesda categories used on the cytology
      form.
  CO_CIT_GLA:
    official_name: Citologia anterior, atipias glandulares
    translated_name: Prior cytology, glandular atypia
    description: The glandular atypia found on the referring cytology. See CO_CIT_ESC.
    code_system: internal
    source: def
    source_ref: ATIPINDGLA.CNV
    reasoning: Bound to ATIPINDGLA, carried from the cytology form.
  CO_CIT_IND:
    official_name: Citologia anterior, atipias de origem indefinida
    translated_name: Prior cytology, atypia of undefined origin
    description: The undefined-origin atypia found on the referring cytology. See CO_CIT_ESC.
    code_system: internal
    source: def
    source_ref: ATIPINDIND.CNV
    reasoning: Bound to ATIPINDIND, carried from the cytology form.
  CO_COLP:
    official_name: Achado colposcópico
    translated_name: Colposcopy finding
    description: 'What the colposcopy showed — normal, minor (low-grade) changes, major
      (high-grade) changes, or suspicion of invasion. The step between an abnormal
      smear and a biopsy, and what directs where the biopsy is taken.

      '
    code_system: internal
    source: def
    source_ref: COLPOSCO.CNV
    reasoning: 'Bound to COLPOSCO, whose values are normal, alterações menores, alterações
      maiores and sugestivo de invasão.

      '
  CO_COLP_BI:
    official_name: Colposcopia, biópsia
    translated_name: Colposcopy, biopsy taken
    description: 'Whether a biopsy was taken at colposcopy. The CO_COLP_ items record
      what was done at the examination, as against CO_COLP which records what was seen.

      '
    code_system: none
    source: inferred
    reasoning: BI reads biópsia in the colposcopy block; C(8), values unobserved.
  CO_COLP_CU:
    official_name: Colposcopia, curetagem endocervical
    translated_name: Colposcopy, endocervical curettage
    description: 'Whether endocervical curettage was done — sampling the canal, which
      colposcopy cannot see, and the step that catches glandular disease.

      '
    code_system: none
    source: inferred
    reasoning: CU reads curetagem in the colposcopy block; C(8), values unobserved.
  CO_COLP_EX:
    official_name: Colposcopia, exérese da zona de transformação
    translated_name: Colposcopy, transformation zone excision
    description: 'Whether the transformation zone was excised. Both diagnostic and
      treatment, which is why a high-grade lesion can be resolved in one visit.

      '
    code_system: none
    source: inferred
    reasoning: EX reads exérese in the colposcopy block; C(8), values unobserved.
  CO_COLP_PO:
    translated_name: Colposcopy-related field (HC file)
    description: 'Likely records a colposcopy finding paired with this biopsy''s histopathology
      result — COLP abbreviates colposcopia — but what "PO" narrows it to (positiva?
      pós?) is not established.

      '
    code_system: none
    source: inferred
    reasoning: 'COLP is a standard abbreviation for colposcopia, the procedure that
      guides where a cervical biopsy is taken from; C(8) matches this file''s count-field
      convention (siscan_findings.yml), but "PO" does not resolve with confidence.

      '
    notes: 'DELIBERATELY UNDER-SPECIFIED — already flagged unresolved in siscan_findings.yml;
      no observed values or codelist exist for it.

      '
  CO_COLP_RE:
    official_name: Colposcopia, resultado
    translated_name: Colposcopy, result
    description: The result recorded for the colposcopy procedure block.
    code_system: none
    source: inferred
    reasoning: RE reads resultado in the colposcopy block; C(8), values unobserved.
  CO_CTRL_BL:
    translated_name: Control code (HC file, "BL")
    description: 'A 2-character control code on the HC file, paired with CO_CTRL_FR
      — CTRL abbreviates controle, but what BL and FR each track (block or fragment
      numbering, or something else) is not established.

      '
    code_system: none
    source: inferred
    reasoning: 'CTRL is DATASUS''s standard "controle" abbreviation; C(2) fits a short
      code rather than a count; sits directly beside CO_CTRL_FR.

      '
    notes: 'DELIBERATELY UNDER-SPECIFIED — no observed values, dictionary entry or
      documentation resolves BL/FR.

      '
  CO_CTRL_FR:
    translated_name: Control code (HC file, "FR")
    description: 'The counterpart of CO_CTRL_BL on the same HC file — a 2-character
      control code whose specific referent is not established.

      '
    code_system: none
    source: inferred
    reasoning: Same CTRL_ pairing as CO_CTRL_BL; C(2), sits directly beside it.
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_CTRL_BL.
  CO_DIF_GRA:
    official_name: Grau de diferenciação
    translated_name: Differentiation grade
    description: 'How well differentiated the tumour is, from well differentiated (grade
      I) to undifferentiated (grade IV). A prognostic grading applied only where malignancy
      was found.

      '
    code_system: internal
    source: def
    source_ref: DIFGRAU.CNV
    reasoning: 'Bound to DIFGRAU, whose values run bem diferenciado through indiferenciado.

      '
  CO_EXTEN_C:
    translated_name: Extensão field, HC file (variant C)
    description: 'One of four EXTEN-stem fields on the HC file (C/L/P/V variants);
      EXTEN plausibly abbreviates extensão, but which specific attribute each of the
      four single-letter variants records is not established.

      '
    code_system: none
    source: inferred
    reasoning: 'EXTEN is a plausible abbreviation of extensão; C(1) width, shared stem
      with CO_EXTEN_L/P/V.

      '
    notes: 'DELIBERATELY UNDER-SPECIFIED — the four variants'' widths differ (C1, C8,
      C4, C1), so they are not simple parallel flags; no observed values exist for
      any of them.

      '
  CO_EXTEN_L:
    translated_name: Extensão field, HC file (variant L)
    description: 'The C(8)-wide variant of the EXTEN-stem cluster (see CO_EXTEN_C)
      — wide enough to be a count or a short code, unlike its C(1)/C(4) siblings.

      '
    code_system: none
    source: inferred
    reasoning: Same EXTEN_ stem as CO_EXTEN_C/P/V; widest of the four (C8).
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_EXTEN_C.
  CO_EXTEN_P:
    translated_name: Extensão field, HC file (variant P)
    description: The C(4)-wide variant of the EXTEN-stem cluster (see CO_EXTEN_C).
    code_system: none
    source: inferred
    reasoning: Same EXTEN_ stem as CO_EXTEN_C/L/V; C(4) width.
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_EXTEN_C.
  CO_EXTEN_V:
    translated_name: Extensão field, HC file (variant V)
    description: 'The second C(1)-wide variant of the EXTEN-stem cluster (see CO_EXTEN_C),
      alongside CO_EXTEN_C.

      '
    code_system: none
    source: inferred
    reasoning: Same EXTEN_ stem as CO_EXTEN_C/L/P; C(1) width like CO_EXTEN_C.
    notes: DELIBERATELY UNDER-SPECIFIED — see CO_EXTEN_C.
  CO_FAIXA_ETARIA:
    official_name: Faixa etária
    translated_name: Age bracket
    description: Age bracket of the patients this row's biopsy counts are aggregated
      over.
    code_system: internal
    source: inferred
    reasoning: FAIXA_ETARIA is the standard Brazilian age-bracket field name, used
      the same way elsewhere in this catalog (e.g. PNI's FX_ETARIA).
  CO_MARG:
    official_name: Margens cirúrgicas
    translated_name: Surgical margin status
    description: 'Reports whether the edges of a cervical cone/LEEP specimen are free
      of lesion or still show abnormal tissue at the cut margin, from the histopathology
      report; a compromised margin means disease may remain in the patient.

      '
    code_system: internal
    codelists:
    - MARGEM
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo CO_MARG "Margens cirúrgicas", lookup cnvdbf\margem.cnv.

      '
  CO_MAT_INS:
    official_name: Material insatisfatório
    translated_name: Unsatisfactory-material flag
    description: 'Marks that the biopsy specimen was judged inadequate for diagnosis
      (material insatisfatório) — the histopathology counterpart of the "unsatisfactory
      sample" adequacy flag used throughout SISCAN cytology reporting.

      '
    code_system: internal
    source: inferred
    reasoning: 'MAT_INS is a transparent contraction of "material insatisfatório,"
      a standard Brazilian pathology-reporting adequacy term; C(1) fits a flag, and
      HC is the cervical-histopathology series.

      '
    notes: No observed values were captured to confirm the flag's exact coding.
  CO_NEO_ADE:
    official_name: Codigo de adenocarcinoma (histopatologia)
    translated_name: Adenocarcinoma category code (histopathology)
    description: 'Coded field selecting which adenocarcinoma category applies in the
      MICROSCOPIA block of the histopathology result - ''Adenocarcinoma in situ'' vs
      ''Adenocarcinoma invasor'' - when the diagnosis is glandular rather than squamous.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero
      (formulario no.414), p.1-2
  CO_NEO_NIC:
    official_name: Codigo de grau da neoplasia intraepitelial cervical (NIC)
    translated_name: NIC grade code
    description: 'Coded field selecting the cervical intraepithelial neoplasia (NIC)
      grade - I, II or III - from the histopathology microscopy list.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero
      (formulario no.414), p.1-2
    notes: 'Likely redundant with the individual per-grade flags carried elsewhere
      in the same file (NICDLEVE/NICDMODE/NICDACENT) - both a single coded field and
      separate booleans appear to exist for the same finding.

      '
  CO_RES_FRA:
    official_name: Número de fragmentos (biópsia)
    translated_name: Number of biopsy fragments received
    description: 'Count of tissue fragments received for a biopsy specimen, from the
      "Tipo de material recebido: Biópsia, número de fragmentos ___" field on the histopathology
      result. Only meaningful when the specimen type is biópsia rather than peça cirúrgica.

      '
    code_system: none
    source: layout_doc
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      page 2, MACROSCOPIA — Tipo de material recebido
  CO_RES_LOC:
    official_name: Localizacao do tumor no colo
    translated_name: Tumour location on the cervix
    description: 'Where on the cervix the tumour is located - ectocervice, endocervice,
      or juncao escamo-colunar - from the MACROSCOPIA ''localizacao do tumor'' checkboxes.
      Bound to codelist LOCALIZACAO.

      '
    codelists:
    - LOCALIZACAO
    code_system: internal
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero
      (formulario no.414), p.1-2
  CO_RES_MAR:
    official_name: Distância da margem mais próxima
    translated_name: Distance to the nearest surgical margin (mm)
    description: 'Distance in millimetres from the tumour to the nearest resection
      margin, as recorded on the histopathology macroscopy section. A measurement,
      not a code — do not confuse with the separate "Margens cirúrgicas: Livres/Comprometidas/Impossível
      de avaliar" categorical field.

      '
    code_system: none
    source: layout_doc
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      page 2, MACROSCOPIA — Distância da margem mais próxima ___ mm
  CO_RES_NEOPL_OUTRAS:
    official_name: Resultado — outras neoplasias
    translated_name: Other-neoplasm result subtype code
    description: 'Identifies which specific diagnosis the catch-all NU_OUTRAS_NEOPL_MALIG
      count refers to, when that count is non-zero — a residual-category breakdown
      rather than a count itself.

      '
    code_system: internal
    source: inferred
    reasoning: 'CO_ (not NU_) marks it a code/dimension in this table''s convention;
      RES_NEOPL_OUTRAS reads as "resultado, outras neoplasias," a natural breakdown
      code for the "outras" bucket beside the named NIC/ adenocarcinoma/carcinoma counts
      in this same batch.

      '
    notes: No observed values or codelist were captured for this column.
  CO_RES_TAM:
    official_name: Tamanho do tumor (histopatologia colo) — dimensão 1
    translated_name: Cervical tumour size, first dimension (mm)
    description: 'First of two size dimensions recorded for a surgical specimen ("Peça
      cirúrgica, tamanho do tumor ___ x ___ cm"). See O_RES_TAM2 for the second dimension;
      only present when the specimen is a peça cirúrgica, not a biópsia.

      '
    code_system: none
    source: layout_doc
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      page 2, MACROSCOPIA — Peça cirúrgica, tamanho do tumor
  CO_RES_TIP:
    official_name: Tipo de procedimento cirurgico
    translated_name: Surgical procedure type code
    description: 'Coded field for ''Tipo de procedimento cirurgico*'': biopsia, exerese
      da zona de transformacao, conizacao, histerectomia simples, histerectomia com
      anexectomia uni/bilateral, or outros.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero
      (formulario no.414), p.1-2
    notes: 'Genuinely a small fixed-list coded field even though the catalog carries
      no codelist for it - SISCAN is catalogued from file headers only here, so the
      binder had nothing to attach; that is a gap in the catalog, not evidence the
      column is free text.

      '
  CO_SEQ_SISCAN_HISTO_COLO_RESID:
    official_name: Sequencial SISCAN histopatologia colo (resultado)
    translated_name: Record sequence number (cervical-histopathology result)
    description: 'Row-sequence identifier on this HISTO_COLO result/exam-record table
      — distinct from the _PACNT patient-dimension sequence and from CO_SEQ_SISCAN_CITO_COLO_RESID''s
      cross-dataset reference.

      '
    code_system: none
    source: inferred
    reasoning: 'RESID reads as resultado; the same PACNT-vs-RESID split recurs for
      CITO_MAMA, HISTO_MAMA and MAMOGRAFIA elsewhere in this batch, always as this
      table''s own id rather than a patient id.

      '
  CRESBIOPSI:
    official_name: Tipo de procedimento cirurgico - biopsia
    translated_name: 'Surgical procedure flag: biopsia'
    description: 'Individual checkbox flag for ''biopsia'' under ''Tipo de procedimento
      cirurgico*'' on the histopathology result - the same checkbox group CO_RES_TIP
      encodes as a single code.

      '
    code_system: none
    source: web
    source_ref: https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      Ministerio da Saude/INCA, Requisicao de Exame Histopatologico - Colo do Utero
      (formulario no.414), p.1-2
    depends_on:
