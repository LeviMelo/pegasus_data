# SISCAN.HC — Cervical histopathology
# Histopatológico do Colo do Útero
#
# One cervical biopsy and its result — the confirmatory step after an abnormal
# cytology.
system: SISCAN
asserted_by: pegasus_data

variables:
  ADENOINSUT:
    official_name: Adenocarcinoma "in situ" (citopatológico de encaminhamento)
    translated_name: 'Referring cytology: adenocarcinoma in situ'
    description: Number of cervical histopathology exams whose referring cytology result was
      adenocarcinoma in situ.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo ADENOINSUT "Adenocarc.in situ"; INCA, Requisição de Exame Histopatológico - Colo
      do Útero (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.1 "Resultado do exame citopatológico / encaminhamento: Atipias em células glandulares
      - Adenocarcinoma in situ"'
  CBENALTER:
    official_name: 'Lesões de caráter benigno: Alterações citoarquiteturais compatíveis com
      ação viral (HPV)'
    translated_name: 'Benign: HPV-compatible cyto-architectural changes'
    description: Number of biopsies with cyto-architectural changes compatible with viral
      (HPV) action, a benign result.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CBENALTER "Ben.alt.cit.com.HPV"; INCA, Requisição de Exame Histopatológico - Colo
      do Útero (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Lesões de caráter benigno: Alterações citoarquiteturais compatíveis com ação viral
      (HPV)"'
  CBENCERVI:
    official_name: 'Lesões de caráter benigno: Cervicite crônica inespecífica'
    translated_name: 'Benign: chronic non-specific cervicitis'
    description: Number of biopsies showing chronic non-specific cervicitis, a benign result.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CBENCERVI "Ben.Cervic.cron.esp"; INCA, Requisição de Exame Histopatológico - Colo
      do Útero (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Lesões de caráter benigno: Cervicite crônica inespecífica"'
  CCOLANORMA:
    official_name: Colposcopia anormal
    translated_name: Colposcopy abnormal
    description: Number of exams whose colposcopy was abnormal (apparently the "Anormal" value
      of the HC colposcopy axis).
    code_system: none
    source: inferred
    reasoning: 'ANORMA is anormal, truncated; C(8) count in the CCOL block. Reviewed 2026-09-28:
      no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files,
      SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide,
      the DATASUS FTP DOC folders and the web). SISCOLO4 COLPOSCO.CNV (the HColo4.def "Colposcopia"
      axis) has exactly three values, Insatisfatório / Anormal / Normal, so CCOL* reads as
      colposcopia, not colpocitologia; no document names the column.'
  CCOLDEFAUL:
    translated_name: HC file field (meaning not established)
    description: 'An 8-character field on the HC aggregate file. Its abbreviation does
      not resolve to a specific finding with confidence; by this file''s convention
      its C(8) width suggests a count rather than a flag.

      '
    code_system: none
    source: inferred
    reasoning: 'Sits among the confirmed C(8) count fields on the same HC file (siscan_findings.yml''s
      CNODCALD cluster), whose header states these files "aggregate exams" so C(8) columns
      are counts — but the name itself does not decompose cleanly. Reviewed 2026-09-28: no
      documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files,
      SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide,
      the DATASUS FTP DOC folders and the web). SISCOLO4 COLPOSCO.CNV (the HColo4.def "Colposcopia"
      axis) has exactly three values, Insatisfatório / Anormal / Normal, so CCOL* reads as
      colposcopia, not colpocitologia; no document names the column. DEFAUL may be the residual/unfilled
      value.'
    notes: 'DELIBERATELY UNDER-SPECIFIED — already flagged unresolved in siscan_findings.yml
      ("the abbreviation does not settle them").

      '
  CCOLINSATI:
    official_name: Colposcopia insatisfatória
    translated_name: Colposcopy unsatisfactory
    description: Number of exams whose colposcopy was unsatisfactory (apparently the "Insatisfatório"
      value of the HC colposcopy axis).
    code_system: none
    source: inferred
    reasoning: 'INSATI is insatisfatória truncated; C(8) count. Reviewed 2026-09-28: no documentation
      found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas
      Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP
      DOC folders and the web). SISCOLO4 COLPOSCO.CNV (the HColo4.def "Colposcopia" axis)
      has exactly three values, Insatisfatório / Anormal / Normal, so CCOL* reads as colposcopia,
      not colpocitologia; no document names the column.'
  CCOLNORMAL:
    official_name: Colposcopia normal
    translated_name: Colposcopy normal
    description: Number of exams whose colposcopy was normal (apparently the "Normal" value
      of the HC colposcopy axis).
    code_system: none
    source: inferred
    reasoning: 'CCOL is the cytology prefix of this block and NORMAL its outcome; C(8) count,
      like its ANORMA and INSATI siblings. Reviewed 2026-09-28: no documentation found (searched
      TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas Tecnicas 1-14,
      INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP DOC folders
      and the web). SISCOLO4 COLPOSCO.CNV (the HColo4.def "Colposcopia" axis) has exactly
      three values, Insatisfatório / Anormal / Normal, so CCOL* reads as colposcopia, not
      colpocitologia; no document names the column.'
  CDIEXAMINS:
    official_name: Exame insatisfatório
    translated_name: Examination unsatisfactory
    description: 'Count of examinations reported as unsatisfactory in the diagnostic
      block, recorded apart from the sample-level CCOLINSATI.

      '
    code_system: none
    source: inferred
    reasoning: 'EXAM INS reads exame insatisfatório; C(8) count. Reviewed 2026-09-28: no documentation
      found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas
      Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP
      DOC folders and the web).'
  CDIFGRAU:
    official_name: Grau de diferenciação
    translated_name: Degree of differentiation
    description: A count on the HC differentiation-grade block, probably the well-differentiated
      (grade I) or not-applicable category left over by CDIFMODDIF, CDIFPOUDIF and CDIFINDFER.
    code_system: none
    source: inferred
    reasoning: 'DIF GRAU reads grau de diferenciação; C(8) count in the histopathology block.
      Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). difgrau.CNV lists Não
      se aplica, Bem, Moderadamente, Pouco diferenciado and Indiferenciado; the three other
      CDIF* columns take Moderadamente, Pouco and Indiferenciado, so this one is probably
      Bem diferenciado (grau I) or Não se aplica.'
  CDIFINDFER:
    official_name: 'Grau de diferenciação: Indiferenciado (Grau IV)'
    translated_name: Undifferentiated
    description: Number of reports grading the tumour undifferentiated (grade IV).
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário nº
      414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Grau de diferenciação: Indiferenciado (Grau IV)"; SISCOLO4 difgrau.CNV'
  CDIFMODDIF:
    official_name: 'Grau de diferenciação: Moderadamente diferenciado (Grau II)'
    translated_name: Moderately differentiated
    description: Number of reports grading the tumour moderately differentiated (grade II).
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário nº
      414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Grau de diferenciação: Moderadamente diferenciado (Grau II)"; SISCOLO4 difgrau.CNV'
  CDIFPOUDIF:
    official_name: 'Grau de diferenciação: Pouco diferenciado (Grau III)'
    translated_name: Poorly differentiated
    description: Number of reports grading the tumour poorly differentiated (grade III).
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário nº
      414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Grau de diferenciação: Pouco diferenciado (Grau III)"; SISCOLO4 difgrau.CNV'
  CITINDALGR:
    official_name: 'Células atípicas de origem indefinida: não se pode afastar lesão de alto
      grau (citopatológico de encaminhamento)'
    translated_name: 'Referring cytology: undefined-origin atypia, cannot exclude high grade'
    description: Number of histopathology exams whose referring cytology reported atypical
      cells of undefined origin where a high-grade lesion cannot be excluded.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CITINDALGR "Ori.Indet alto grau"; INCA, Requisição de Exame Histopatológico -
      Colo do Útero (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.1 "Resultado do exame citopatológico / encaminhamento: De origem indefinida - Não
      se pode afastar lesão de alto grau"'
  CIT_OUTNEO:
    official_name: Outras neoplasias malignas (citopatológico de encaminhamento)
    translated_name: 'Referring cytology: other malignant neoplasm'
    description: Number of histopathology exams whose referring cytology reported another
      malignant neoplasm.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CIT_OUTNEO "Outras Neoplasias"; INCA, Requisição de Exame Histopatológico - Colo
      do Útero (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.1 "Resultado do exame citopatológico / encaminhamento: Outras neoplasias malignas"'
  CLABCID:
    official_name: Descrição do diagnóstico
    translated_name: Diagnosis, free text
    description: 'Free-text diagnosis as the laboratory wrote it, in forty characters
      — alongside rather than instead of the coded findings.

      '
    code_system: none
    source: inferred
    reasoning: 'C(40) is far too wide for a CID-10 code and is the only free-text field in
      the block, so it carries the wording rather than the code. Reviewed 2026-09-28: no documentation
      found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas
      Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP
      DOC folders and the web).'
    notes: 'Free text, uncoded. Do not tabulate without reading it.

      '
  CMARCOMPRO:
    official_name: 'Margens cirúrgicas: Comprometidas'
    translated_name: Surgical margins involved
    description: Number of reports with surgical margins involved by the lesion, meaning the
      excision was incomplete.
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário nº
      414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Margens cirúrgicas: Comprometidas"; SISCOLO4 Margem.cnv'
  CMARIMPAVA:
    official_name: 'Margens cirúrgicas: Impossível de serem avaliadas'
    translated_name: Surgical margins not assessable
    description: Number of reports where the surgical margins could not be assessed.
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário nº
      414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Margens cirúrgicas: Impossível de serem avaliadas"; SISCOLO4 Margem.cnv'
  CMARLIVRE:
    official_name: 'Margens cirúrgicas: Livres'
    translated_name: Surgical margins clear
    description: Number of reports with surgical margins free of lesion.
    code_system: none
    source: layout_doc
    source_ref: 'INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário nº
      414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Margens cirúrgicas: Livres"; SISCOLO4 Margem.cnv'
  CO_ANO_COMPETENCIA:
    official_name: Ano de competência
    translated_name: Reference year
    description: Year of the competência, the period in which the provider released and billed
      the exam.
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Mês/Ano competência"
  CO_ANO_MES_COMPETENCIA:
    official_name: Mês/Ano competência
    translated_name: Reference year-month
    description: Month and year of the competência, the period in which the provider released
      and billed the exam.
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Mês/Ano competência"
  CO_BEN_ALT:
    official_name: Alteração benigna
    translated_name: Benign change present
    description: 'Whether any benign reactive change was recorded at all — the header
      of the block whose individual categories are the ATR, INF, RAD, REP and CER fields.

      '
    code_system: internal
    source: inferred
    reasoning: 'ALT is alteração, the general case of the block; C(1) flag. Reviewed 2026-09-28:
      no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files,
      SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide,
      the DATASUS FTP DOC folders and the web).'
  CO_BEN_CER:
    official_name: Alteração benigna — cervicite
    translated_name: 'Benign change: cervicitis'
    description: 'Cervicitis, chronic inflammation of the cervix, recorded among the
      benign changes.

      '
    code_system: internal
    source: inferred
    reasoning: 'CER is cervicite in the BEN block; C(2) here where its siblings are C(1),
      so it admits more than a plain flag. Reviewed 2026-09-28: no documentation found (searched
      TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas Tecnicas 1-14,
      INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP DOC folders
      and the web). Form 414 lists "Cervicite crônica inespecífica" among benign lesions;
      the C(2) column itself is not named anywhere.'
  CO_BEN_POL:
    official_name: 'Lesões de caráter benigno: Pólipo Endocervical'
    translated_name: 'Benign: endocervical polyp'
    description: Number of biopsies showing an endocervical polyp, a benign result.
    code_system: none
    source: layout_doc
    source_ref: 'TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CO_BEN_POL "Ben.Pólipo Endocerv"; INCA, Requisição de Exame Histopatológico -
      Colo do Útero (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Lesões de caráter benigno: Pólipo Endocervical"'
  CO_CIT_ESC:
    official_name: Citologia anterior, atipias escamosas
    translated_name: Prior cytology, squamous atypia
    description: 'The squamous atypia found on the cytology that led to this biopsy.
      Carried onto the histopathology form so the two can be compared — the comparison
      is what measures the screening test.

      '
    code_system: internal
    source: def
    source_ref: ATIPINDESC.CNV
    reasoning: Bound to ATIPINDESC, the same Bethesda categories used on the cytology
      form.
  CO_CIT_GLA:
    official_name: Citologia anterior, atipias glandulares
    translated_name: Prior cytology, glandular atypia
    description: The glandular atypia found on the referring cytology. See CO_CIT_ESC.
    code_system: internal
    source: def
    source_ref: ATIPINDGLA.CNV
    reasoning: Bound to ATIPINDGLA, carried from the cytology form.
  CO_CIT_IND:
    official_name: Citologia anterior, atipias de origem indefinida
    translated_name: Prior cytology, atypia of undefined origin
    description: The undefined-origin atypia found on the referring cytology. See CO_CIT_ESC.
    code_system: internal
    source: def
    source_ref: ATIPINDIND.CNV
    reasoning: Bound to ATIPINDIND, carried from the cytology form.
  CO_COLP:
    official_name: Achado colposcópico
    translated_name: Colposcopy finding
    description: 'What the colposcopy showed — normal, minor (low-grade) changes, major
      (high-grade) changes, or suspicion of invasion. The step between an abnormal
      smear and a biopsy, and what directs where the biopsy is taken.

      '
    code_system: internal
    source: def
    source_ref: COLPOSCO.CNV
    reasoning: 'Bound to COLPOSCO, whose values are normal, alterações menores, alterações
      maiores and sugestivo de invasão.

      '
  CO_COLP_BI:
    official_name: 'Procedimento: Biópsia a frio'
    translated_name: 'Procedure: cold-knife biopsy'
    description: Number of exams whose material was obtained by cold-knife biopsy.
    code_system: none
    source: def
    source_ref: TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CO_COLP_BI "Proc.Biópsia a frio"
  CO_COLP_CU:
    official_name: 'Procedimento: Curetagem'
    translated_name: 'Procedure: curettage'
    description: Number of exams whose material was obtained by (endocervical) curettage.
    code_system: none
    source: def
    source_ref: TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CO_COLP_CU "Proc.Curetagem"
  CO_COLP_EX:
    official_name: 'Procedimento: CAF alargada'
    translated_name: 'Procedure: extended LEEP (CAF) excision'
    description: Number of exams whose material came from an extended high-frequency (LEEP/CAF)
      excision.
    code_system: none
    source: def
    source_ref: TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CO_COLP_EX "Proc.CAF alarg"
  CO_COLP_PO:
    translated_name: Colposcopy-related field (HC file)
    description: 'Likely records a colposcopy finding paired with this biopsy''s histopathology
      result — COLP abbreviates colposcopia — but what "PO" narrows it to (positiva?
      pós?) is not established.

      '
    code_system: none
    source: inferred
    reasoning: 'COLP is a standard abbreviation for colposcopia, the procedure that guides
      where a cervical biopsy is taken from; C(8) matches this file''s count-field convention
      (siscan_findings.yml), but "PO" does not resolve with confidence. Reviewed 2026-09-28:
      no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files,
      SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide,
      the DATASUS FTP DOC folders and the web).'
    notes: 'DELIBERATELY UNDER-SPECIFIED — already flagged unresolved in siscan_findings.yml;
      no observed values or codelist exist for it.

      '
  CO_COLP_RE:
    official_name: 'Procedimento: CAF com retirada do canal'
    translated_name: 'Procedure: LEEP (CAF) excision including the canal'
    description: Number of exams whose material came from a high-frequency (LEEP/CAF) excision
      that removed the endocervical canal. A procedure count, not a colposcopy result.
    code_system: none
    source: def
    source_ref: TabWin definition HColo4.def (SISCOLO4) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip,
      campo CO_COLP_RE "Proc.CAF ret Canal"
  CO_CTRL_BL:
    official_name: 'Controle de representação histológica: Blocos'
    translated_name: 'Histological representation control: blocks'
    description: Apparently the number of paraffin blocks in the "Controle de representação
      histológica" box of the result form.
    code_system: none
    source: inferred
    reasoning: 'CTRL is DATASUS''s standard "controle" abbreviation; C(2) fits a short code
      rather than a count; sits directly beside CO_CTRL_FR. Reviewed 2026-09-28: no documentation
      found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def and .cnv files, SISCAN Notas
      Tecnicas 1-14, INCA requisition/result forms, the SISMAMA laudo guide, the DATASUS FTP
      DOC folders and the web). Form 414 p.2 has "Controle de representação histológica*:
      [__] Fragmentos [__] Blocos", two 2-digit boxes that match these two C(2) columns; the
      mapping rests on that match.'
  CO_CTRL_FR:
    official_name: 'Controle de representação histológica: Fragmentos'
    translated_name: 'Histological representation control: fragments'
    description: Apparently the number of tissue fragments in the "Controle de representação
      histológica" box of the result form.
    code_system: none
    source: inferred
    reasoning: 'Same CTRL_ pairing as CO_CTRL_BL; C(2), sits directly beside it. Reviewed
      2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN .def
      and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the SISMAMA
      laudo guide, the DATASUS FTP DOC folders and the web). Form 414 p.2 has "Controle de
      representação histológica*: [__] Fragmentos [__] Blocos", two 2-digit boxes that match
      these two C(2) columns; the mapping rests on that match.'
