    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Composicao da mama, p.20

      '
  TP_MAMA_ESQ:
    official_name: Composição da mama esquerda
    translated_name: Left breast composition
    description: 'Same breast-density classification as TP_MAMA_DIR (dense, fatty,
      predominantly dense, or predominantly fatty) but describing the left breast''s
      mammogram.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Composicao da mama, p.20

      '
