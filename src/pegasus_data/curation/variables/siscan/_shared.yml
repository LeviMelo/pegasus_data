      '7': 'Terapêutica específica'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!CCONRECOM.CNV, Recomendações (SISCAN-vintage table, seven categories; not bound in a .def); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
