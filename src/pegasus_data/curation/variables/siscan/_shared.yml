  CO_FAIXA_ETARIA_PACIENTE:
    official_name: Faixa etária
    translated_name: Age bracket (exam file) / age in years (patient files)
    description: 'In SISCAN_CITO_MAMA, the patient''s age in five-year bands (Fetaria2.CNV: 01 up to 9, 02 10-14 ... 15 75-79, 16 80 or over). In SISCAN_CITO_MAMA_PACNT and SISCAN_MAMOGRAFIA_PACNT the same name holds the age in years, three digits (016, 050).'
    code_system: internal
    codes:
      '01': 'Até 9 anos'
      '02': 'Entre 10 a 14 anos'
      '03': 'Entre 15 a 19 anos'
      '04': 'Entre 20 a 24 anos'
      '05': 'Entre 25 a 29 anos'
      '06': 'Entre 30 a 34 anos'
      '07': 'Entre 35 a 39 anos'
      '08': 'Entre 40 a 44 anos'
      '09': 'Entre 45 a 49 anos'
      '10': 'Entre 50 a 54 anos'
      '11': 'Entre 55 a 59 anos'
      '12': 'Entre 60 a 64 anos'
      '13': 'Entre 65 a 69 anos'
      '14': 'Entre 70 a 74 anos'
      '15': 'Entre 75 a 79 anos'
      '16': 'Acima de 79 anos'
    derived:
    - name: IDADE_faixa_anos
      from:
      - CO_FAIXA_ETARIA_PACIENTE
      age: {form: band}
      lookup:
        '01': 0
        '02': 10
        '03': 15
        '04': 20
        '05': 25
        '06': 30
        '07': 35
        '08': 40
        '09': 45
        '10': 50
        '11': 55
        '12': 60
        '13': 65
        '14': 70
        '15': 75
        '16': 80
      rule: 'the lower edge, in whole years, of the band a two-digit code names (TAB_SISCAN Fetaria2.CNV); a three-digit value (the patient files, where the column is the age) is no code and gives null. A lower bound, never a guess inside the band.'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!Fetaria2.CNV; Nota Tecnica 12 SISCAN (sources/docs/nota_tecnica12_cito_mama_residencia.pdf), Faixa etária, classes de 5 anos'
    notes: 'Measured: in CITO_MAMA 2013 the kit''s ages (IDADE_PAC) binned by these edges equal the CSV''s band counts in every band in 13 of 14 states (SP aside). In the patient files the column is the age (CITO_MAMA_PACNT 016-087 in 2013, MAMOGRAFIA_PACNT 000-113): its role is patient.age there.'
  CO_FX_ETAR:
    official_name: Faixa Etária
    translated_name: Age band
    description: 'Age band of the person examined (fetaria.cnv): up to 11, 12-14, 15-19, then
      five-year classes up to 60-64, and 65 or over.'
    code_system: internal
    codelists:
    - FETARIA
    source: layout_doc
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_FX_ETAR "Faixa Etária"; Nota Técnica 2 SISCAN - Citopatológico do colo do útero
      — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf, "Faixa
      etária"
    notes: 'A banding of CO_PAC_IDA, not an independent fact. Use one or the other.

      '
    derived:
    - name: IDADE_faixa_anos
      from:
      - CO_FX_ETAR
      age: {form: band}
      lookup:
        '00': 0
        '61': 11
        '62': 15
        '63': 20
        '64': 25
        '65': 30
        '66': 35
        '67': 40
        '68': 45
        '69': 50
        '70': 55
        '71': 60
        '72': 65
        '73': 70
      rule: 'the lower edge, in whole years, of the band a code names in SISMAMA''s Fetaria.CNV (00 up to 10, 61 11-14, 62 15-19 ... 72 65-69, 73 70 or over; 99 inconsistent is no age). Made for CM, HM and MM, which carry no age in years. SISCOLO4''s table (CC, HC) differs at 61 (12-14) and 72 (65 or over), and those two carry CO_PAC_IDA, the age itself.'
  CO_IDADE_PACIENTE:
    official_name: Idade
    translated_name: Patient age
    description: Patient's age in years at the cervical cytology exam, from the requisition
      form; the Faixa etária bands are built from it.
    code_system: none
    source: layout_doc
    source_ref: INCA, Requisição de Exame Citopatológico - Colo do Útero (formulário nº 415)
      — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.1 "Idade"; Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Faixa etária"
  CO_IND_CLINICA:
    official_name: Indicação clínica
    translated_name: Clinical indication
    description: 'Whether the mammogram was ordered as screening, on a patient with
      no breast-cancer signs or symptoms, or as diagnostic, on a patient who has them.

      '
    code_system: internal
    codes:
      '01': 'Mamog. Diagnostica'
      '02': 'Mamog. Rastreamento'
    source: def
    source_ref: 'TAB_SISCAN.rar!mamografia.def campo Ind Clinica (IND_CLIN, INDICLINIC.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  CO_INS_ARTEF_DES:
    official_name: Ins. pres.art.desec.
    translated_name: Unsatisfactory - drying artifact
    description: 'Marks the sample unsatisfactory because drying artifact before fixation
      distorted cells over more than 75 percent of the smear, preventing reliable reading.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres.art.desec.
  CO_INS_CONTAM_EXTERNOS:
    official_name: Ins. pres.cont.exte
    translated_name: Unsatisfactory - external contaminants
    description: 'Marks the sample unsatisfactory because external contaminants, such
      as lubricant or foreign material, obscure more than 75 percent of the smear.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres.cont.exte
  CO_INS_INTENSA_SUPER:
    official_name: Ins. pres.sup.celul
    translated_name: Unsatisfactory - cell overlap
    description: 'Marks the sample unsatisfactory because intense cellular overlap
      covers more than 75 percent of the smear, hiding the individual cells needed
      for reading.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres.sup.celul
  CO_INS_MAT_CELULAR:
    official_name: Ins. mat. acelular
    translated_name: Unsatisfactory - scanty cellular material
    description: 'Marks the sample unsatisfactory because it is acellular or hypocellular,
      with epithelial cells covering less than 10 percent of the smear.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. mat. acelular
  CO_INS_OUTROS:
    official_name: Ins. Outros
    translated_name: Unsatisfactory - other cause
    description: 'Marks the sample unsatisfactory for a reason other than blood, pus
      cells, drying artifact, contaminants, or cell overlap, each recorded as a separate
      cause on the same report.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. Outros
  CO_INS_PIOCITOS:
    official_name: Ins. pres. piócitos
    translated_name: Unsatisfactory - pus cells
    description: 'Marks the sample unsatisfactory because pus cells from inflammation
      cover more than 75 percent of the smear, obscuring the epithelial cells needed
      for reading.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres. piócitos
  CO_INS_SANGUE:
    official_name: Ins. pres. sangue
    translated_name: Unsatisfactory - blood
    description: 'Marks the sample unsatisfactory because blood covers more than 75
      percent of the smear, obscuring the epithelial cells needed for reading.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres. sangue
  CO_INTERVALO_COLETA:
    official_name: Intervalo de coleta
    translated_name: Collection interval
    description: 'Days elapsed between the date the exam sample was collected and the
      date it arrived at the analysis laboratory.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatológico Colo, campo Intervalo de coleta
  CO_INTERVALO_EXAME:
    official_name: Intervalo de resultado
    translated_name: Result interval
    description: 'Days elapsed between the sample''s arrival at the analysis laboratory
      and the release of its report, the second half of total turnaround alongside
      the collection interval.

      '
    code_system: none
    source: inferred
    reasoning: 'Nota Tecnica 2 names three time metrics for this dataset (Intervalo de coleta,
      Intervalo de resultado, Tempo Exame); CO_INTERVALO_COLETA and CO_TEMPO_EXAME already
      match two by name, leaving Intervalo de resultado as the remaining match for this field.
      Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). Supporting hint: TAB_SISCAN
      cito_colo.def labels its own field INT_EXAME "Interv Resultado", which matches this
      reading, but that is a different file.'
    source_ref: 'naming grammar + Nota Tecnica 2 SISCAN - Citopatológico Colo, campo
      Intervalo de resultado

      '
  CO_INTERVALO_RESULTADO:
    official_name: Intervalo do resultado
    translated_name: Result-turnaround interval
    description: 'Days elapsed between the mammogram being performed and the imaging
      service releasing its report, DATASUS''s timeliness indicator for result delivery.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 8 SISCAN - Mamografia, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf

      '
  CO_INTERVALO_SOLICITACAO:
    official_name: Intervalo da solicitação
    translated_name: Scheduling-wait interval
    description: 'Days elapsed between the mammogram being requested and actually performed,
      DATASUS''s timeliness indicator for exam scheduling.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 8 SISCAN - Mamografia, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf

      '
  CO_LAUDO_CITOPATOLOGICO:
    official_name: Laudo citopatológico
    translated_name: Overall cytopathology result
    description: 'The exam''s overall diagnostic conclusion: one code, for the most serious finding, from invasive squamous carcinoma (01) to negative (13); 00 where the sample was rejected or unsatisfactory and has no result.'
    code_system: internal
    codes:
      '00': 'Sem laudo (amostra rejeitada ou insatisfatória)'
      '01': 'Carcinoma epidermoide invasor'
      '02': 'Adenocarcinoma invasor'
      '03': 'Adenocarcinoma in situ'
      '04': 'Lesão intraepitelial de alto grau'
      '05': 'Células glandulares atípicas, não se pode afastar lesão de alto grau'
      '06': 'Células escamosas atípicas, não se pode afastar lesão de alto grau (ASC-H)'
      '07': 'Células atípicas de origem indefinida, não se pode afastar lesão de alto grau'
      '08': 'Lesão intraepitelial de baixo grau'
      '09': 'Células glandulares atípicas, possivelmente não neoplásicas'
      '10': 'Células escamosas atípicas, possivelmente não neoplásicas (ASC-US)'
      '11': 'Células atípicas de origem indefinida, possivelmente não neoplásicas'
      '12': 'Outras neoplasias'
      '13': 'Negativo'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!laudo_citopatologico.cnv (13 categories; no .def binds it to the column), expanded by Nota Técnica 3 SISCAN (sources/docs/nota_tecnica_3_cito_colo_resid.pdf, pp. 4-6); code 00 is in no table'
    notes: 'Bound by the counters, not by a .def: in SISCAN_CITO_COLO 2013 each code 01-13 has exactly the NU_ counter of its finding on its rows (08 on 1,129 rows = NU_LESAO_IE_BAIXO_GRAU 1,129; 10 on 1,908 = ASC-US; 04 on 383 = 337 high-grade + 46 high-grade with micro-invasion not excluded). 00 (1,141 rows) is the 56 rejected plus 1,085 unsatisfactory samples of TP_AVALIACAO_AMOSTRA, and Nota Técnica 1 calls the laudo of such women ignorado.'
  CO_MIC_ACTINOMYCES:
    official_name: Mic.actinomyces sp (inferido)
    translated_name: Microbiology - Actinomyces sp.
    description: 'Marks that the sample''s microbiology assessment found organisms
      morphologically consistent with Actinomyces sp., a bacterium associated with
      long-term IUD use.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_BACILOS_SUPRA:
    official_name: Mic.bacil supracit. (inferido)
    translated_name: Microbiology - supracytoplasmic bacilli
    description: 'Marks that the sample''s microbiology assessment found supracytoplasmic
      bacilli, a morphotype suggestive of Gardnerella vaginalis or Mobiluncus and bacterial
      vaginosis.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_CANDIDA:
    official_name: Mic.CANDIDA sp (inferido)
    translated_name: Microbiology - Candida sp.
    description: 'Marks that the sample''s microbiology assessment found Candida sp.,
      the yeast responsible for vaginal candidiasis.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_COCOS:
    official_name: Mic.cocos (inferido)
    translated_name: Microbiology - cocci
    description: 'Marks that the sample''s microbiology assessment found coccus-shaped
      bacteria, a nonspecific vaginal flora finding distinct from the other named organisms.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_EFEITO_CITOPATICO:
    official_name: Mic.vir gr.herpes (inferido)
    translated_name: Microbiology - Herpes-group viral effect
    description: 'Marks that the sample''s microbiology assessment found cytopathic
      cell changes compatible with infection by a virus of the Herpes group, distinct
      from the HPV effect reported under squamous lesion findings.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_LACTOBACILLUS:
    official_name: Mic.lactobacillus (inferido)
    translated_name: Microbiology - Lactobacillus sp.
    description: 'Marks that the sample''s microbiology assessment found Lactobacillus
      sp., the normal, protective bacterium of healthy vaginal flora.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_OUTROS:
    official_name: Mic.outros (inferido)
    translated_name: Microbiology - other organism
    description: 'Marks that the sample''s microbiology assessment found an organism
      or flora finding not covered by Lactobacillus, cocci, supracytoplasmic bacilli,
      Candida, Actinomyces, or the herpes-group viral effect.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_OUTROS_BACILOS:
    official_name: Outros bacilos
    translated_name: Microbiology - other bacilli
    description: 'Marks that the sample''s microbiology assessment found bacillus-shaped
      organisms not matching Lactobacillus or the Gardnerella/Mobiluncus- suggestive
      supracytoplasmic pattern, a residual bacterial-flora category on the same report.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_SUGEST_CHLAMYDIA:
    official_name: Sugestivo de Chlamydia sp.
    translated_name: Microbiology - suggestive of Chlamydia sp.
    description: 'Marks that the smear''s cell changes were read as suggestive of Chlamydia
      sp. infection, a cytologic impression rather than a confirmed laboratory diagnosis
      of chlamydia.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MIC_TRICHOMONAS:
    official_name: Trichomonas vaginalis
    translated_name: Microbiology - Trichomonas vaginalis
    description: 'Marks that the sample''s microbiology assessment found Trichomonas
      vaginalis, a motile protozoan parasite transmitted sexually, distinct from the
      bacterial and fungal organisms in sibling microbiology fields.

      '
    code_system: none
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  CO_MUN_PREST_SERVICO:
    official_name: Município do prestador de serviço
    translated_name: Provider's municipality
    description: 'IBGE code of the municipality where the laboratory or clinic that
      performed the exam is located, distinct from the requesting unit''s municipality.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: 'Nota Tecnica 8 SISCAN - Mamografia, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf

      '
  CO_MUN_RESIDENCIA:
    official_name: Munic. de residência
    translated_name: Municipality of residence
    description: 'IBGE code for the patient''s municipality of residence, as registered
      on the Cartão Nacional de Saúde, ordered by state code and then municipality.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Nota Tecnica 1 SISCAN - Pacientes, campo Munic. de residência
  CO_MUN_UNIDADE_SAUDE:
    official_name: Município da unidade de saúde
    translated_name: Requesting unit's municipality
    description: 'IBGE code of the municipality where the health unit that requested
      the exam is located, as registered on the patient''s Cartão SUS.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: 'Nota Tecnica 8 SISCAN - Mamografia, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf

      '
  CO_PAC_ESC:
    official_name: Escolaridade
    translated_name: Patient schooling
    description: Schooling level of the person examined, from the requisition form (analfabeta,
      ensino fundamental incompleto/completo, médio completo, superior completo).
    code_system: internal
    codelists:
    - ESCOLARIDADE
    source: layout_doc
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_PAC_ESC "Escolaridade"; INCA, Requisição de Exame Citopatológico - Colo do
      Útero (formulário nº 415) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.1 "Escolaridade"
  CO_PAC_IBG:
    official_name: Município de residência
    translated_name: Patient municipality of residence
    description: IBGE code of the municipality where the person examined lives. Not where
      the exam was collected (CO_US_IBGE) and not where it was read (CLABIBGE).
    codelist: BR_MUNICIPALFA
    codelists:
    - MUNICBR
    code_system: external
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_PAC_IBG "Mun.residência"
    notes: 'Screening is often collected away from home. Counting exams by the unit''s
      municipality and calling it coverage of that municipality''s women is the standard
      mistake these three columns exist to let you avoid.

      '
  CO_PAC_IDA:
    official_name: Idade do paciente
    translated_name: Patient age
    description: 'Age of the person examined, in completed years, as a three-digit
      number. Unlike SIH and SIM this carries no unit code beside it — the value is
      always years.

      '
    code_system: none
    source: inferred
    reasoning: 'Declared C(3), no codelist bound, and the sibling CO_FX_ETAR holds the banded
      form of the same quantity. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). CColo4.def and HColo4.def
      tabulate age only through CO_FX_ETAR.'
  CO_PAC_RAC:
    official_name: Cor/raça
    translated_name: Patient race or colour
    description: Race or colour of the person examined, on the IBGE categories (branca, preta,
      parda, amarela, indígena).
    code_system: internal
    codelists:
    - RACACOR
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_PAC_RAC "Cor/raça"
    notes: 'Missing and "ignorado" are common and not distributed evenly by region,
      so race-stratified rates from this column understate some groups.

      '
  CO_PAC_SEX:
    official_name: Sexo
    translated_name: Patient sex
    description: Sex of the person examined. Present on the breast datasets (CM, HM, MM),
      which include men.
    code_system: internal
    codelists:
    - SEXO
    source: def
    source_ref: TabWin definitions CMAMA4.def, HMAMA4.def, MMAMA4.def (SISCOLO4/SISMAMA) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_PAC_SEX "Sexo"
  CO_PAC_UF:
    official_name: UF de residência
    translated_name: Patient state of residence
    description: State (UF) code where the person examined lives.
    code_system: external
    codelist: UF_BR
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_PAC_UF "UF residência"
  CO_PERIODO_PREVENTIVO:
    official_name: Período do preventivo
    translated_name: Time since previous Pap test
    description: 'Time since the woman''s previous Pap test, in years, derived from the year
      she reported on requisition item 2 (tempo.CNV: same year, 1, 2, 3, 4 or more years,
      ignored/blank, inconsistent). Not a recommended screening interval.'
    code_system: internal
    source: layout_doc
    source_ref: TabWin definition cito_colo.def (TAB_SISCAN) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar,
      variável "Periodo do preventivo" (tempo.CNV; removed from TabNet 02/04/2018); INCA,
      Requisição de Exame Citopatológico - Colo do Útero (formulário nº 415) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.1 item 2 "Fez o exame preventivo (Papanicolaou) alguma vez? ... ano"
    notes: 'Declared C(0,0) — a CSV yearly-extract column, not a fixed-width DBF field;
      no observed values were captured.

      '
  CO_PREST_SERVICO:
    official_name: Prestador do serviço
    translated_name: Service provider
    description: CNES code of the service provider (the laboratory) that issued the exam report,
      as opposed to the unit that collected it.
    code_system: external
    codelist: CADGERBR
    source: layout_doc
    source_ref: Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Prestador do serviço"
  CO_RACA_COR:
    official_name: Raça/Cor
    translated_name: Race/color
    description: 'The patient''s self-identified race or color, imported from the Cartão
      Nacional de Saúde and coded to IBGE''s classification (Branca, Preta, Parda,
      Amarela, Indígena).

      '
    code_system: external
    codes:
      '01': 'Branca'
      '02': 'Negra'
      '03': 'Amarela'
      '04': 'Parda'
      '05': 'Indígena'
      '99': 'Sem informação'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!Racacor.CNV, Raça e Cor (não vinculada em nenhum .def); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
    notes: 'The CNV labels code 02 "Negra" (the INCA requisition form says Preta). Unpadded 1 and 3 appear in a handful of 2013 rows and stay undecoded.'
  CO_RECOMENDACAO:
    official_name: Recomendação de conduta
    translated_name: Recommended follow-up action
    description: 'Follow-up action tied to the mammogram''s BI-RADS category: repeat
      mammography in 2 years for categories 1-2, radiological control in 6-12 months
      for category 3, biopsy for categories 4-5, or specific treatment for category
      6.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      Quadro 10 - Recomendacao de conduta

      '
  CO_REJ_AUSENCIA:
    official_name: Rejeitada id. lâmin
    translated_name: Rejected - slide/vial identification missing
    description: 'Rejection-reason code marking that the slide or specimen vial arrived
      with no patient identification, or an identification error, so the lab could
      not link it to a request and never read it.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Rejeitada id.
      lâmin

      '
  CO_REJ_CAUSA_ALHEIA:
    official_name: Rej. causas alheias
    translated_name: Rejected - cause external to the laboratory
    description: 'Rejection-reason code marking a slide turned away for a cause outside
      the laboratory''s own responsibility, arising before or at receipt rather than
      from its collection, staining, or reading process.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Rej. causas alheias

      '
  CO_REJ_LAMINA:
    official_name: Rej. lâmina danif
    translated_name: Rejected - slide damaged or missing
    description: 'Rejection-reason code marking that the physical slide itself was
      damaged or absent when it reached the laboratory, so no material was available
      to read at all.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Rej. lâmina danif

      '
  CO_REJ_OUT_CAUSAS:
    official_name: 'Rejeitada: Outros'
    translated_name: Rejected - other cause
    description: 'Rejection-reason code marking a slide rejected for a cause not covered
      by the identification, physical-damage, or external-cause categories recorded
      on the same report.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida "Rejeitada: Outros"

      '
  CO_RES_ADE:
    official_name: Adequabilidade do resultado
    translated_name: Result adequacy
    description: 'Whether the breast specimen was satisfactory. The breast counterpart
      of CO_ADEQ_MA on the cervical form.

      '
    code_system: internal
    source: def
    source_ref: CRESADEQ.CNV
    reasoning: 'Bound to CRESADEQ, whose values are satisfatório and insatisfatório.
      Declared C(70), far wider than the code needs.

      '
  CO_RISCO_ELEVADO:
    official_name: Risco elevado
    translated_name: Elevated breast-cancer risk
    description: 'Whether the patient meets INCA''s high-risk criteria for breast cancer:
      a first-degree relative diagnosed before 50, bilateral or ovarian cancer, male
      breast cancer, an atypical proliferative lesion, or the patient''s own prior
      breast cancer.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      Campo 2

      '
  CO_TEMPO_EXAME:
    official_name: Tempo Exame
    translated_name: Total exam turnaround
    description: 'Total days from sample collection to release of the exam report,
      equal to the sum of the collection interval and the result interval.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatológico Colo, campo Tempo Exame
  CO_TEMPO_MAMO_ANTERIOR:
    official_name: Fez mamografia alguma vez
    translated_name: Prior mammogram history
    description: 'Whether the patient ever had a mammogram before this request and,
      if so, the year of the last one; the other options are "never" and "does not
      know".

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      Campo 4

      '
  CO_TEM_NODULO:
    official_name: Tem nódulo ou caroço na mama
    translated_name: Reported breast lump
    description: 'Whether the patient reports a palpable lump in the breast at the
      time of the request, recorded separately for the right breast, the left breast,
      or marked absent.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      Campo 1

      '
  CO_UF_PREST_SERVICO:
    official_name: UF do prest.serviço
    translated_name: Provider's state
    description: State (UF) code of the service provider (laboratory) that issued the report.
    code_system: external
    codelist: UF_BR
    source: layout_doc
    source_ref: Nota Técnica 11 SISCAN - Citopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica11_cito_mama_atend.pdf,
      "UF do prest.serviço"
  CO_UF_RESIDENCIA:
    official_name: UF de residência
    translated_name: State of residence
    description: State (UF) code of the patient's residence, as registered in the Cartão Nacional
      de Saúde (Cartão SUS).
    code_system: external
    codelist: UF_BR
    source: layout_doc
    source_ref: Nota Técnica 7 SISCAN - Mamografia — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica7_mamografia_residente.pdf,
      "Munic.de residência" (registered in the Cartão Nacional de Saúde)
  CO_UF_UNIDADE_SAUDE:
    official_name: UF da un.saúde
    translated_name: Collecting unit's state
    description: State (UF) code of the health unit where the exam was collected.
    code_system: external
    codelist: UF_BR
    source: layout_doc
    source_ref: Nota Técnica 11 SISCAN - Citopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica11_cito_mama_atend.pdf,
      "UF da un.saúde"
  CO_UNIDADE_SAUDE:
    official_name: Unidade de saúde
    translated_name: Collecting health unit
    description: CNES code of the health unit where the sample was collected (typically primary
      care), as opposed to the laboratory that read it.
    code_system: external
    codelist: CADGERBR
    source: layout_doc
    source_ref: Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Unidade de saúde"
  CO_US:
    official_name: Unidade de coleta (CNES)
    translated_name: Health unit code
    description: CNES code of the health unit that collected the sample or requested the exam.
      The point of contact with the patient, distinct from the provider that read it.
    code_system: external
    # The kit binds it to 29 per-state UnidSaude tables; 16,238 of 16,582 of their codes
    # (AC, SP, BA, RJ) are CADGERBR codes of the same establishments (2026-10-03).
    codelist: CADGERBR
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_US "Unid.Coleta"
  CO_US_IBGE:
    official_name: Município da unidade de coleta
    translated_name: Health unit municipality
    description: IBGE code of the municipality of the collecting unit, which is where the
      exam happened rather than where the patient lives.
    codelist: BR_MUNICIPALFA
    codelists:
    - MUNICBR
    code_system: external
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_US_IBGE "Mun.Unid.Coleta"
  CO_US_UF:
    official_name: UF da unidade de coleta
    translated_name: Health unit state
    description: State (UF) code of the collecting unit.
    code_system: external
    codelist: UF_BR
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CO_US_UF "UF Unid.Coleta"
  DINTCOLETA:
    official_name: Intervalo de coleta
    translated_name: Collection-to-laboratory interval, banded
    description: 'Days between collection of the sample and its arrival at the laboratory,
      banded (IntColeta.CNV): 1 = 0-10 days, 2 = 11-20, 3 = 21-30, 4 = over 30, 9 = inconsistent.'
    code_system: internal
    codelists:
    - INTCOLETA
    source: layout_doc
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def (SISCOLO4/SISMAMA)
      — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo DINTCOLETA "Interv Coleta"; Nota Técnica 2 SISCAN - Citopatológico do colo do
      útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Intervalo de coleta"
    notes: 'Banded, so it cannot be averaged. Treat it as ordered categories.

      '
  DINTRESULT:
    official_name: Intervalo de resultado
    translated_name: Interval to result, banded
    description: 'Days between the sample entering the laboratory (or, for mammography, the
      exam being performed) and release of the report, banded (IntResultado.CNV): 1 = 0-10
      days, 2 = 11-20, 3 = 21-30, 4 = over 30, 9 = inconsistent.'
    code_system: internal
    codelists:
    - INTRESULTADO
    source: layout_doc
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo DINTRESULT "Interv Resultado"; Nota Técnica 2 SISCAN - Citopatológico do colo
      do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Intervalo de resultado"; Nota Técnica 7 SISCAN - Mamografia — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica7_mamografia_residente.pdf,
      "Interv Resultado"
    notes: 'Banded, not a day count. Averaging the code numbers produces a number with
      no meaning.

      '
  DINTTEMPEX:
    official_name: Tempo exame
    translated_name: Exam turnaround, banded
    description: 'Total days from collection (mammography: from request) to release of the
      report, the sum of the two intervals, banded differently from them (IntTempoExame.CNV):
      1 = 0-30 days, 2 = 31-60, 3 = over 60, 9 = inconsistent.'
    code_system: internal
    codelists:
    - INTTEMPOEXAME
    source: layout_doc
    source_ref: TabWin definitions CColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def (SISCOLO4/SISMAMA)
      — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo DINTTEMPEX "Tempo Exame"; Nota Técnica 2 SISCAN - Citopatológico do colo do útero
      — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf, "Tempo
      Exame"
    notes: HColo4.def spells it DINTTEMPEXAME, which a dBase file stores as DINTTEMPEX. Banded,
      not a day count.
  DT_ID_COMP:
    official_name: Mês/Ano de Competência
    translated_name: Competence year-month
    description: 'Competência as AAAAMM: the month in which the provider released and billed
      the exam.'
    code_system: none
    source: layout_doc
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo DT_ID_COMP "MêsAno Competência"; Nota Técnica 2 SISCAN - Citopatológico do colo
      do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Mês/Ano competência"
    notes: 'Counting by competência counts reporting, not screening activity.

      '
  NU_ADENOCAR_INS_SITU:
    official_name: Adenocarc in situ
    translated_name: Adenocarcinoma in situ count
    description: 'Count of exams diagnosed with adenocarcinoma in situ: malignant glandular
      (endocervical) cells confined within the gland, not yet invading the underlying
      stroma.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Adenocarc in situ

      '
  NU_ADENOCAR_INVASOR:
    official_name: Adenocarc invasor
    translated_name: Invasive adenocarcinoma count
    description: 'Count of exams diagnosed with invasive adenocarcinoma, malignant
      glandular cells that breached the basement membrane; covers cervical, endometrial,
      or unspecified-site reports alike.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Adenocarc invasor

      '
  NU_AMOSTRA_REJEITADA:
    official_name: Adequabilidade - Rejeitada
    translated_name: Sample rejected count
    description: 'Count of exams whose slide was turned away outright at the laboratory,
      before any cytologic reading, for identification, damage, or other rejection
      reasons captured elsewhere on the same report.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, campo Adequabilidade
      (categoria Rejeitada)

      '
  NU_AMOSTRA_SATISFATORIA:
    official_name: Adequabilidade - Satisfatória
    translated_name: Sample satisfactory count
    description: 'Count of exams whose sample was judged satisfactory: enough well-preserved,
      visible cervical cells to support a reliable cytologic reading, per the Nomenclatura
      Brasileira adequacy criteria.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, campo Adequabilidade
      (categoria Satisfatória)

      '
  NU_ANO_COMPETENCIA:
    official_name: Ano de competência
    translated_name: Year of competência (billing period)
    description: 'Calendar year in which the exam was released and billed by the service
      provider, the period SISCAN uses to group exams for reporting, not the year of
      collection.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 1 SISCAN - Pacientes, campo Ano de competência
  NU_ANO_MES_COMPETENCIA:
    official_name: Mês/Ano competência
    translated_name: Year-month of competência (billing period)
    description: 'Year and month in which the exam was released and billed by the service
      provider, the month-level counterpart to NU_ANO_COMPETENCIA used to group exams
      for reporting.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatológico Colo, campo Mês/Ano competência
  NU_CARC_EPIDERM_INV:
    official_name: Carc. Epiderm. Inv
    translated_name: Invasive squamous carcinoma count
    description: 'Count of exams diagnosed with invasive squamous cell (epidermoid)
      carcinoma: malignant squamous cells that have invaded the cervical stroma beyond
      high-grade intraepithelial disease.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Carc. Epiderm.
      Inv

      '
  NU_CA_ESCAMOSA_N_AF_LESAO_AG:
    official_name: ASC-H
    translated_name: Atypical squamous cells, cannot exclude high-grade lesion
    description: 'Count of exams reporting ASC-H: atypical squamous cells of undetermined
      significance where the reader could not rule out an underlying high-grade intraepithelial
      lesion, the more concerning of the two squamous-atypia categories.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida ASC-H
  NU_CA_ESCAMOSA_P_NAO_NEOPLAST:
    official_name: ASC-US
    translated_name: Atypical squamous cells, probably non-neoplastic
    description: 'Count of exams reporting ASC-US: atypical squamous cells of undetermined
      significance judged probably non-neoplastic, the milder counterpart to NU_CA_ESCAMOSA_N_AF_LESAO_AG''s
      ASC-H finding.

      '
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida ASC-US
  NU_CA_GLANDULAR_NAO_NEOPL:
    official_name: At. Glan.Ind.Não Neo
    translated_name: Atypical glandular cells, probably non-neoplastic
    description: 'Count of exams reporting atypical glandular cells of undetermined
      significance judged probably non-neoplastic, the glandular-cell analogue of ASC-US
      rather than a squamous finding.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida At. Glan.Ind.Não
      Neo

      '
  NU_CA_GLANDULA_N_AF_LESAO_AG:
    official_name: At.Glan.Ind. Alto Grau
    translated_name: Atypical glandular cells, cannot exclude high-grade lesion
    description: 'Count of exams reporting atypical glandular cells of undetermined
      significance where a high-grade lesion could not be excluded, more concerning
      than NU_CA_GLANDULAR_NAO_NEOPL''s probably-benign counterpart.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida At.Glan.Ind. Alto
      Grau

      '
  NU_CA_IND_NAO_LESAO:
    official_name: Ori. Indef. Alto Grau
    translated_name: Atypical cells of indefinite origin, cannot exclude high-grade
      lesion
    description: Number of exams reporting atypical cells of undefined origin where a high-grade
      lesion cannot be excluded.
    code_system: none
    source: layout_doc
    depends_on:
    - NU_CA_ORIGEM_IND_NAO_NEOPLAST
    source_ref: 'Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Ori. Indef. Alto Grau"; INCA, Requisição de Exame Citopatológico - Colo do Útero (formulário
      nº 415) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.2 "Células atípicas de significado indeterminado - De origem indefinida: Não se pode
      afastar lesão de alto grau"'
  NU_CA_ORIGEM_IND_NAO_NEOPLAST:
    official_name: Ori. Indef. Não Neo
    translated_name: Atypical cells of indefinite origin, probably non-neoplastic
    description: 'Count of exams reporting atypical cells that could not be classified
      as squamous or glandular, judged probably non-neoplastic; the milder of the two
      origin-indefinite atypia categories.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ori. Indef. Não
      Neo

      '
  NU_LESAO_IE_ALTO_GRAU:
    official_name: Les IEp Alto Grau
    translated_name: High-grade squamous intraepithelial lesion count
    description: 'Count of exams reporting a high-grade squamous intraepithelial lesion
      (HSIL): cervical intraepithelial neoplasia grades II and III, more severe than
      NU_LESAO_IE_BAIXO_GRAU''s low-grade finding.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Les IEp Alto Grau

      '
  NU_LESAO_IE_BAIXO_GRAU:
    official_name: Les IE Baixo Grau
    translated_name: Low-grade squamous intraepithelial lesion count
    description: 'Count of exams reporting a low-grade squamous intraepithelial lesion
      (LSIL): HPV cytopathic effect together with cervical intraepithelial neoplasia
      grade I.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Les IE Baixo Grau

      '
  NU_LES_IE_ALTO_GRAU_N_MIC_INV:
    official_name: Les IE AG Mic. Inv
    translated_name: High-grade lesion, cannot exclude microinvasion
    description: 'Count of exams reporting a high-grade squamous intraepithelial lesion
      where microinvasion could not be excluded, a step beyond plain HSIL and short
      of the confirmed NU_CARC_EPIDERM_INV diagnosis.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Les IE AG Mic.
      Inv

      '
  NU_LIMITE_NORMALIDADE:
    official_name: Dentro da Normalidade
    translated_name: Within normal limits count
    description: 'Count of exams read as within normal limits: no cellular atypia of
      oncogenic interest and no benign reactive or reparative change recorded on the
      report.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, campo Dentro da Normalidade

      '
  NU_OUTRAS_NEOPLASIAS:
    official_name: Outras Neoplasias
    translated_name: Other malignant neoplasms count
    description: 'Count of exams reporting a malignant cervical neoplasm that does
      not fit any of the named squamous or glandular carcinoma categories tallied in
      the sibling NU_ fields.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Outras Neoplasias

      '
  NU_TAMANHO_NODULO:
    official_name: Tamanho do nódulo
    translated_name: Nodule size band
    description: 'Banded size of the largest mammographic nodule, measured as its longest
      axis: under 10mm, 11-20mm, 21-50mm, or over 50mm.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Nodulo, campo Tamanho, p.22

      '
  PRESTMUN:
    official_name: Município do prestador de serviço
    translated_name: Provider municipality
    description: IBGE code of the municipality of the laboratory that read the breast cytology
      or histopathology. Not the patient's municipality.
    codelist: BR_MUNICIPALFA
    code_system: external
    source: def
    source_ref: TabWin definitions CMAMA4.def, HMAMA4.def (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo PRESTMUN "Mun.prest.serviço"
  PRESTUF:
    official_name: UF do prestador
    translated_name: Provider state
    description: State of the service that performed the exam, the coarser companion
      to PRESTMUN.
    code_system: internal
    codelist: UF_BR
    source: def
    source_ref: ESTADO.CNV
    reasoning: C(2) bound to ESTADO, the state codelist.
  QTDEXA:
    official_name: Quantidade de exames
    translated_name: Number of exams
    description: Number of exams the row accounts for, in the cervical files (CC, HC); QUANTEXAME
      is the same measure in the breast files.
    code_system: none
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo QTDEXA "Quant. Exames"
  QUANTEXAME:
    official_name: Quantidade de exames
    translated_name: Number of exams
    description: Number of exams the row accounts for, in the breast files (CM, HM, MM). Sum
      this column rather than counting rows.
    code_system: none
    source: def
    source_ref: TabWin definitions CMAMA4.def, HMAMA4.def, MMAMA4.def (SISCOLO4/SISMAMA) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo QUANTEXAME "Quant Exames"
    notes: 'Rows are not necessarily one exam each. Sum this column rather than counting
      rows.

      '
  REGLAB:
    official_name: Região do laboratório
    translated_name: Laboratory region
    description: 'Macro-region of the reading laboratory or service provider (regiao.CNV):
      1 North, 2 Northeast, 3 Southeast, 4 South, 5 Centre-West.'
    code_system: internal
    codelists:
    - REGIAO
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo REGLAB "Reg.Laboratório / Reg prest.serviço"
  REGRESID:
    official_name: Região de residência
    translated_name: Region of residence
    description: 'Macro-region of the patient''s residence (regiao.CNV): 1 North, 2 Northeast,
      3 Southeast, 4 South, 5 Centre-West.'
    code_system: internal
    codelists:
    - REGIAO
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo REGRESID "Reg.residência"
  REGUS:
    official_name: Região da unidade de coleta
    translated_name: Health unit region
    description: 'Macro-region of the collecting unit (regiao.CNV): 1 North, 2 Northeast,
      3 Southeast, 4 South, 5 Centre-West.'
    code_system: internal
    codelists:
    - REGIAO
    source: def
    source_ref: TabWin definitions CColo4.def, HColo4.def, CMAMA4.def, HMAMA4.def, MMAMA4.def
      (SISCOLO4/SISMAMA) — ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      and ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo REGUS "Reg.Unid.Coleta"
  SG_SEXO:
    official_name: Sexo
    translated_name: Sex
    description: 'The patient''s sex, masculine or feminine, imported from the Cartão
      Nacional de Saúde; a small share of breast-exam records are male since men can
      also be diagnosed.

      '
    code_system: internal
    codes:
      'M': 'Masculino'
      'F': 'Feminino'
    source: def
    source_ref: 'TAB_SISCAN.rar!mamografia.def campo Sexo (SEXO, Sexo.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
    notes: 'Sexo.CNV lists only M and F; the I seen in 6 rows of the 2013 CSV is not documented and stays undecoded.'
  SG_UF_RESIDENCIA:
    official_name: UF de residência (sigla)
    translated_name: State of residence (abbreviation)
    description: Two-letter abbreviation (sigla) of the patient's state of residence, the
      letter counterpart of CO_UF_RESIDENCIA.
    code_system: external
    codelist: UF_BR
    source: layout_doc
    source_ref: Nota Técnica 7 SISCAN - Mamografia — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica7_mamografia_residente.pdf,
      "Munic.de residência" (registered in the Cartão Nacional de Saúde)
  ST_CELULA_ENDOMETRIAL_PRESENTE:
    official_name: Presença de células endometriais
    translated_name: Endometrial cells present
    description: 'Flags whether endometrial cells were seen in the collected material;
      their presence outside menses or in a woman over 40 can prompt further gynecologic
      work-up.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Nota Tecnica 2 SISCAN - Citopatologico Colo, campo Presença de células
      endometriais

      '
  ST_DENTRO_LIMITE_NORMALIDADE:
    official_name: Dentro dos limites da normalidade no material examinado
    translated_name: Result within normal limits (DLN) flag
    description: 'Whether the result was "within normal limits in the material examined":
      no atypia of oncotic interest and no benign change.'
    code_system: internal
    codes:
      'S': 'Sim'
      'N': 'Não'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Dentro da Normalidade (D_NORMALID, simnao.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  ST_MICROCALCIFICACAO:
    official_name: Microcalcificações
    translated_name: Microcalcifications present
    description: Whether microcalcifications were present in the breast tissue examined by
      the pathologist.
    code_system: none
    source: layout_doc
    source_ref: 'Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Microcalcificações"; INCA, Requisição de Exame Histopatológico - Mama (formulário nº
      335) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.2 "Microcalcificações: Sim/Não"'
  ST_OUTRA_NEOPLASIA_MALIGNA:
    official_name: Outras neoplasias malignas
    translated_name: Other malignant neoplasm
    description: Whether the cervical cytology reported another malignant neoplasm not classified
      under the squamous or glandular categories.
    code_system: internal
    codes:
      'S': 'Sim'
      'N': 'Não'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Out.Neoplas.malig (OUT_NEOP_M, simnao.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  ST_REPRESENTATI_ZONA_TRANSFORM:
    official_name: Representatividade da Zona de Transformação
    translated_name: Transformation-zone representativity flag
    description: Whether the transformation zone was represented in the smear, defined as
      metaplastic and/or glandular (endocervical) epithelium being present.
    code_system: internal
    codes:
      'S': 'Sim'
      'N': 'Não'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Represent. ZT (REPRES_ZT, simnao.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  ST_SCREENING_REALIZADO:
    official_name: Screening pelo citotécnico
    translated_name: Screening done by cytotechnician
    description: Whether the laboratory screening of the slide was done by a cytotechnician
      (as opposed to directly by the pathologist). A lab-process flag, not a clinical finding.
    code_system: internal
    codes:
      'S': 'Sim'
      'N': 'Não'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Screening pelo citotécnico (SCREEN_REA, simnao.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  ST_SINAL_SUGESTIVO_DST:
    official_name: Sinais sugestivos de doenças sexualmente transmissíveis
    translated_name: Sign suggestive of an STD flag
    description: Whether the clinician saw signs suggestive of a sexually transmitted disease
      during the clinical exam at collection (requisition item 12). A clinical observation,
      not a cytology finding.
    code_system: internal
    codes:
      'S': 'Sim'
      'N': 'Não'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!SIMNAO.CNV (S = Sim, N = Não), the Sim/Não lookup the kit binds to the other S/N status columns (for example D_NORMALID, SCREEN_REA in cito_colo.def); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
    notes: 'The SISCAN CSV stores this status as S/N; no .def binds this particular column, so the S/N lookup is the kit''s own convention for the same value form.'
  TP_ACHADO_COLPOSCOPICO:
    official_name: Achado colposcópico
    translated_name: Colposcopic finding
    description: 'Colposcopy classification under the Brazilian/IFCPC 2011 nomenclature:
      normal findings, minor (grade 1) or major (grade 2) abnormal findings, suspicion
      of invasive cancer, or an unsatisfactory exam.

      '
    code_system: none
    source: web
    source_ref: 'Achados colposcopicos anormais: grau 1 (menor), Revista Brasileira
      de Patologia do Trato Genital Inferior, rbptgi.emnuvens.com.br/revista/article/view/113
      (IFCPC Rio de Janeiro 2011 nomenclature)

      '
  TP_ADEQUABILIDAD_MATERIAL:
    official_name: Adequabilidade do material
    translated_name: Material adequacy
    description: 'Whether the breast fine-needle or nipple-discharge sample was adequate
      for cytological reading: satisfactory or unsatisfactory, per the SISCAN breast-cytology
      result form.

      '
    code_system: internal
    codes:
      '01': 'Satisfatório'
      '02': 'Insatisfatório'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_mama.def campo Adequabilidade (ADEQ_MATER, CRESADEQ.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar); histo_mama.def ADEQ_MATER (same CNV); typo "insatistatório" corrected'
  TP_ATIPIA_CELULAR_ESCAMOS:
    official_name: Atipias em células escamosas
    translated_name: Squamous cell atypia
    description: 'Type of abnormal squamous cell finding in the cervical cytology report:
      ASC-US, ASC-H, low-grade lesion (LSIL/HPV effect), high-grade lesion (HSIL),
      or squamous carcinoma.

      '
    code_system: internal
    codes:
      '01': 'Lesão de baixo grau(HPV e NIC I)'
      '02': 'Lesão de alto grau(NIC II e NIC III)'
      '03': 'Lesão alto grau, não podendo excluir micro-invasão'
      '04': 'Carcinoma epidermoide invasor'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Atip.cel.escamosas (ATC_ESCAMOS, aticelesc.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_ATIPIA_CELULAR_GLANDUL:
    official_name: Atipias em células glandulares
    translated_name: Glandular cell atypia
    description: 'Type of abnormal glandular cell finding in the cervical cytology
      report: atypical glandular cells (AGC), adenocarcinoma in situ, or invasive adenocarcinoma.

      '
    code_system: internal
    source: web
    source_ref: 'Nomenclatura Brasileira para Laudos Cervicais, bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

      '
  TP_AVALIACAO_AMOSTRA:
    official_name: Adequabilidade da amostra
    translated_name: Sample evaluation
    description: 'Quality classification of the cervical cytology sample: rejected,
      satisfactory, or unsatisfactory for evaluation, per the Nomenclatura Brasileira
      para Laudos Citopatológicos Cervicais.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'Nota Tecnica 1 SISCAN - Pacientes, tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_1_cito_colo_paciente.pdf

      '
  TP_CEL_ESCAM_SIGN_INDETER:
    official_name: Células escamosas atípicas de significado indeterminado
    translated_name: Squamous cells of undetermined significance
    description: 'Subtype of squamous atypia of undetermined significance: possibly
      non-neoplastic (ASC-US) versus cannot rule out a high-grade lesion (ASC-H).

      '
    code_system: internal
    codes:
      '01': 'Escamosas - possivelmente não neoplasicas (ASC-US)'
      '02': 'Escamosas - não se pode afastar lesão alto grau(ASC-H)'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Cél.Escamosa.Sign.Indeterm (C_ESCSIG_I, atipindesc.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar); histo_colo.def CESC_INDET (same CNV)'
  TP_CEL_GLAND_SIGNIF_INDET:
    official_name: Células glandulares atípicas de significado indeterminado
    translated_name: Glandular cells of undetermined significance
    description: 'Subtype of atypical glandular cell finding: possibly non-neoplastic
      versus cannot rule out a neoplastic or high-grade glandular lesion.

      '
    code_system: internal
    codes:
      '01': 'Glandulares-possivelmente não neoplasicas'
      '02': 'Glandulares-não se pode afastar lesão de alto grau'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Cél.Glandular.Sign.Indeterm (C_GL_SIG_I, atipindgla.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar); histo_colo.def CGLA_INDET (same CNV)'
  TP_CEL_ORIG_INF_SIGN_INDE:
    official_name: Células de origem indefinida, de significado indeterminado
    translated_name: Cells of undetermined origin
    description: 'Subtype for atypical cells the cytologist could not classify as squamous
      or glandular: possibly non-neoplastic versus cannot rule out a high-grade lesion.

      '
    code_system: internal
    codes:
      '01': 'Indefinida-possivelmente não neoplasicas'
      '02': 'Indefinida-não se pode afastar lesão de alto grau'
    source: def
