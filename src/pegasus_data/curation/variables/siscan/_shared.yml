      '
    code_system: internal
    source: layout_doc
    source_ref: 'Nota Tecnica 12 SISCAN - Citopatologico de Mama, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Malignid Indeterm

      '
  TP_PADR_CITO_POSI_MALIG:
    official_name: Positivo malignid
    translated_name: Positive-for-malignancy pattern
    description: 'When an FNA breast sample''s cytology is positive for malignancy,
      which cancer type it is consistent with: ductal carcinoma, lobular carcinoma,
      or another.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'Nota Tecnica 12 SISCAN - Citopatologico de Mama, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Positivo malignid

      '
  TP_PADR_CITO_SUSP_MALIG:
    official_name: Suspeito malignid
    translated_name: Suspicious-for-malignancy pattern
    description: 'When an FNA breast sample''s cytology is suspicious but not positive
