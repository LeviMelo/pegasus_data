    codes:
      '01': 'Carcinoma ductal'
      '02': 'Carcinoma lobular'
      '03': 'Outros'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_mama.def campo Positivo malignid (POSI_MALIG, CRESPOSMAL.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_PADR_CITO_SUSP_MALIG:
    official_name: Suspeito malignid
    translated_name: Suspicious-for-malignancy pattern
