      '
  TP_DETECCAO_LESAO:
    official_name: Detecção da lesão
    translated_name: How the lesion was detected
    description: 'How the biopsied breast lesion was detected: by clinical breast exam (palpable
      lesion) or by imaging (non-palpable lesion).'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Detecção da Lesão"; INCA, Requisição de Exame Histopatológico - Mama (formulário nº
      335) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.1 item 5 "Detecção da lesão"
  TP_DIAGNOSTICO_IMAGEM:
    official_name: Diagnóstico de imagem
    translated_name: Imaging finding
    description: 'Type of imaging abnormality reported on the breast histopathology request:
      microcalcification, distortion, nodule or asymmetry. Not the imaging modality.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Diagn_imagem"; INCA, Requisição de Exame Histopatológico - Mama (formulário nº 335)
      — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.1 item 5a "Diagnóstico de Imagem"
  TP_ENCAMINHAMENTO:
    official_name: Tipo de encaminhamento
    translated_name: Referral reason
    description: 'Why the woman was referred for cervical histopathology: abnormal cytology
      result, lesion suggestive of cancer without prior cytology, or normal/benign cytology
      result.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Tipo de encaminhamento"; INCA, Requisição de Exame Histopatológico - Colo do Útero
      (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.1 "Resultado do exame citopatológico / encaminhamento"
  TP_EXAME_HISTOPATOLOGICO:
    official_name: Tipo de exame histopatológico
    translated_name: Type of histopathology exam
    description: 'Type of breast histopathology exam requested: slide review, immunohistochemistry,
      or biopsy/surgical specimen.'
    code_system: none
    source: layout_doc
    source_ref: INCA, Requisição de Exame Histopatológico - Mama (formulário nº 335) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.1 item 1 "Tipo de Exame histopatológico"; TabWin definition HMAMA4.def (SISMAMA) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISMAMA/Auxiliar/TAB_SISMAMA.zip,
      campo CCLITPEXA "Tipo Exame Histopatológico"
  TP_GRAU_DIFERENCIACAO:
    official_name: Grau de diferenciação
    translated_name: Tumor differentiation grade
    description: 'Differentiation grade of the cervical tumour: well (grade I), moderately
      (II), poorly (III) differentiated, undifferentiated (IV), or not applicable.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Grau de diferenciação"; INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário
      nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Grau de diferenciação"
  TP_GRAU_HISTOLOGICO:
    official_name: Grau histológico
    translated_name: Histological grade
    description: 'Histological grade of the breast tumour: I, II, III, or not assessable.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Grau Histológico"; INCA, Requisição de Exame Histopatológico - Mama (formulário nº
      335) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.2 "Grau histológico"
  TP_LATERALIDADE_LESAO:
    official_name: Mama
    translated_name: Lesion laterality
    description: 'Which breast the material sent for histopathology came from: right or left.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Mama"; INCA, Requisição de Exame Histopatológico - Mama (formulário nº 335) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.1 item 6 "Mama direita / Mama esquerda"
  TP_LATERALIDADE_MAMA:
    official_name: Mama
    translated_name: Breast side sampled
    description: 'Which breast the cytology material came from: right or left.'
    code_system: none
    source: layout_doc
    depends_on:
    - TP_LATERALIDADE_LESAO
    source_ref: 'Nota Técnica 11 SISCAN - Citopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica11_cito_mama_atend.pdf,
      "Mama"; INCA, Requisição de Exame Citopatológico - Mama (formulário nº 416) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-mama.pdf,
      p.1 item 5 "Material enviado: Mama direita / Mama esquerda"'
  TP_LESAO:
    official_name: Tipo lesão
    translated_name: Lesion type
    description: 'Overall result class of the breast histopathology: benign, indeterminate core biopsy, suspicious core biopsy, or malignant neoplastic lesion; blank where the result is unsatisfactory.'
    code_system: internal
    codes:
      '01': 'Caráter benigno'
      '02': 'Core biopsy indeterminada'
      '03': 'Core biopsy suspeita'
      '04': 'Caráter neoplásico maligno'
    source: def
    source_ref: 'TAB_SISCAN.rar!histo_mama.def campo Tipo Lesão (TP_LESAO, TP_LESAO.CNV); Nota Técnica 13 SISCAN (sources/docs/nota_tecnica13_histo_mama_atend.pdf)'
    notes: 'Measured (2014): 04 is on 4,441 rows; the malignant subtype TP_LESAO_CARAT_NEOPL_MALI is filled on 4,440 of them and on no row of another class. The class counts equal the patient file''s laudo class for class, in reversed code order (LAUDO_HISTOP.CNV has 01 malignant, 04 benign). Blank (98 rows) is the laudo não informado, an unsatisfactory result (73 rows in the patient file).'
  TP_LESAO_CARAT_NEOPL_MALI:
    official_name: Lesão de caráter neoplásico maligno
    translated_name: Malignant neoplasia subtype
    description: 'Predominant type of malignant breast lesion, filled only where TP_LESAO is malignant: ductal carcinoma in situ of low, intermediate or high grade, lobular carcinoma in situ, Paget disease without tumour, invasive ductal carcinoma (with or without predominant intraductal component), invasive lobular, tubular, mucinous, medullary carcinoma, or other.'
    code_system: internal
    codes:
      '01': 'Carcinoma intraductal (in situ) de baixo grau histológico'
      '02': 'Carcinoma intraductal (in situ) de grau intermediário'
      '03': 'Carcinoma intraductal (in situ) de alto grau histológico'
      '04': 'Carcinoma lobular in situ'
      '05': 'Doença de Paget do mamilo sem tumor associado'
      '06': 'Carcinoma ductal infiltrante'
      '07': 'Carcinoma ductal infiltrante com componente intraductal predominante'
      '08': 'Carcinoma lobular invasivo'
      '09': 'Carcinoma tubular'
      '10': 'Carcinoma mucinoso'
      '11': 'Carcinoma medular'
      '12': 'Outros'
    depends_on:
    - TP_LESAO
    source: def
    source_ref: 'TAB_SISCAN.rar!histo_mama.def campo Les carat neo mal (LESAO_CNM, CNEOMALIG.CNV); INCA, Requisição de Exame Histopatológico - Mama (formulário nº 335), p.2, Lesão de caráter neoplásico maligno (tipo predominante)'
    notes: 'Measured (2014): filled on 4,440 exams with TP_LESAO 04 and on 3,877 of the patient file''s 3,878 malignant laudos, and on no other.'
  TP_LESAO_CARAT_NEOP_PRENEO:
    official_name: Res_Neopl_Preneo_Escam
    translated_name: Squamous neoplastic/pre-neoplastic result
    description: 'Squamous neoplastic or pre-neoplastic result on cervical histopathology:
      CIN I, CIN II, CIN III (including carcinoma in situ), microinvasive, invasive, or invasion-not-assessable
      squamous carcinoma.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Res_Neopl_Preneo_Escam"; INCA, Requisição de Exame Histopatológico - Colo do Útero
      (formulário nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Lesões de caráter neoplásico ou pré-neoplásico"
    notes: 'The two names are swapped in the patient file SISCAN_HISTO_COLO_PACNT: there TP_LESAO_CARAT_NEOP_PRENEO holds the glandular codes (01 adenocarcinoma in situ, 02 invasive; 2014 - 46 and 83 rows, on NU_LAUDO_HISTOP 03 for 43 and 02 for 83) and TP_LESAO_CARAT_NEOP_PREN_AD the squamous codes 01-06 (4,705, 2,287, 2,667, 116, 653 and 109 rows, on NU_LAUDO_HISTOP 06, 05, 04 and, for 04-06, 01). In the exam file SISCAN_HISTO_COLO the names are as documented (squamous 01 NIC I, 02 NIC II, 03 NIC III, 04 micro-invasive, 05 invasive, 06 not assessable = RES_NEOPL_PRENEO_ESCAM.CNV, equal to the NU_ counters: 4,951, 2,653, 2,894, 117, 660, 109 rows in 2014). No code table is bound, because one table would be wrong in one of the two files.'
  TP_LESAO_CARAT_NEOP_PREN_AD:
    official_name: Res_Neopl_Glandular
    translated_name: Glandular neoplastic result
    description: 'Glandular neoplastic result on cervical histopathology: adenocarcinoma in
      situ or invasive adenocarcinoma.'
    code_system: none
    source: layout_doc
    depends_on:
    - TP_LESAO_CARAT_NEOP_PRENEO
    source_ref: Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Res_Neopl_Glandular"; INCA, Requisição de Exame Histopatológico - Colo do Útero (formulário
      nº 414) — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-colo-do-utero.pdf,
      p.2 "Adenocarcinoma in situ / Adenocarcinoma invasor"
    notes: 'Glandular in the exam file SISCAN_HISTO_COLO (01 adenocarcinoma in situ on 52 rows, 02 invasive on 85 in 2014, = RES_NEOPLl_GLANDULAR.CNV and the NU_ counters) but squamous in SISCAN_HISTO_COLO_PACNT (see TP_LESAO_CARAT_NEOP_PRENEO); no code table is bound, because one table would be wrong in one of the two files.'
  TP_LINFONODO_AXILAR_PALPAVEL:
    official_name: Linfonodo axilar palpável
    translated_name: Palpable axillary lymph node
    description: 'Whether a palpable axillary lymph node was reported on the breast histopathology
      request: yes or no.'
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Linf axil palp"; INCA, Requisição de Exame Histopatológico - Mama (formulário nº 335)
      — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-histopatologico-mama.pdf,
      p.1 item 7 "Linfonodo axilar palpável?"
  TP_LINFONODO_DIR:
    official_name: Linfonodo axilar mama direita
    translated_name: Right axillary lymph node finding
    description: 'Mammography reading of the right axillary lymph nodes: normal, not
      visualized, enlarged (over 20mm without a fatty hilum), dense, or confluent/grouped.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Linfonodos axilares, p.30

      '
  TP_LINFONODO_ESQ:
    official_name: Linfonodo axilar mama esquerda
    translated_name: Left axillary lymph node finding
    description: 'Same mammographic lymph-node classification as TP_LINFONODO_DIR (normal,
      not visualized, enlarged, dense, or confluent) but read on the left breast''s
      axilla.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Linfonodos axilares, p.30

      '
  TP_MAMA_DIR:
    official_name: Composição da mama direita
    translated_name: Right breast composition
    description: 'Density category of the right breast on mammography: dense, fatty
      ("adiposa"), predominantly dense, or predominantly fatty, describing how much
      glandular tissue was replaced by fat.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Composicao da mama, p.20

      '
  TP_MAMA_ESQ:
    official_name: Composição da mama esquerda
    translated_name: Left breast composition
    description: 'Same breast-density classification as TP_MAMA_DIR (dense, fatty,
      predominantly dense, or predominantly fatty) but describing the left breast''s
      mammogram.

      '
    code_system: none
    source: web
    source_ref: 'Orientacoes para elaboracao de laudo no SISMAMA (INCA, 2011), bvsms.saude.gov.br/bvs/publicacoes/inca/Orientacoes_no_laudo_sismama.pdf,
      secao Composicao da mama, p.20

      '
  TP_MAMA_PELE_DIR:
    official_name: Mama dir pele
    translated_name: Right breast skin appearance
    description: 'Whether the right breast''s skin appeared normal or altered on the
      mammogram, one of the imaging findings recorded per breast in the SISCAN mammography
