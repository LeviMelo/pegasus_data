      '
    code_system: internal
    codes:
      '01': 'Normal'
      '02': 'Alterada'
    source: def
    source_ref: 'TAB_SISCAN.rar!mamografia.def campo Mama dir pele (MAMA_PELE_D, CRADPELE.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_MAMA_PELE_ESQ:
    official_name: Mama esq pele
    translated_name: Left breast skin appearance
    description: 'Whether the left breast''s skin appeared normal or altered on the
      mammogram, the same imaging finding as TP_MAMA_PELE_DIR reported for the opposite
      breast.

      '
    code_system: internal
    codes:
      '01': 'Normal'
      '02': 'Alterada'
    source: def
    source_ref: 'TAB_SISCAN.rar!mamografia.def campo Mama esq pele (MAMA_PELE_E, CRADPELE.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_MAMOGRAFIA_RASTREAMENT:
    official_name: Tipo Mamo rast
    translated_name: Screening mammogram type
    description: 'Why a screening mammogram (no symptoms) was ordered: routine target-population
      screening (ages 50-69), screening for elevated familial risk, or follow-up in
      a patient already treated for breast cancer.

      '
    code_system: internal
    codes:
      '01': 'População alvo'
      '02': 'População de risco elevado (história familiar)'
      '03': 'Paciente já tratado de câncer de mama'
    source: def
    source_ref: 'TAB_SISCAN.rar!mamografia.def campo Tipo Mamo rast (TP_MAMRAST, TIPMAMRAST.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_MARGEM_CIRURGICA:
    official_name: Margens cirúrgicas
    translated_name: Surgical margin
    description: 'Assessment of the surgical margins on the cervical histopathology: free,
      involved, or impossible to assess.'
    code_system: internal
    codes:
      '01': 'Livres'
      '02': 'Comprometidas'
      '03': 'Impossível de serem avaliadas'
      '04': 'Livres (Sem Tumor Detectável)'
      '05': 'Não avaliável'
    source: def
    source_ref: 'TAB_SISCAN.rar!histo_mama.def campo Margens Cirúrgicas (MARGEM_CIR, CHISMARG.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar); histo_colo.def MARGEM_CIR margem.CNV (Livres, Comprometidas, Impossível de serem avaliadas = 1, 2, 3, the same labels as CHISMARG 01-03; the CSV and DBF data write them 2-digit); typo "Comprometedidas" corrected'
  TP_MATERIAL:
    official_name: Material Enviado
    translated_name: Material submitted
    description: 'Source of the specimen sent for breast cytology: nipple discharge,
      fine-needle aspiration, or fluid drained from a cyst.

      '
    code_system: internal
    codes:
      '01': 'Descarga papilar'
      '02': 'Punção aspirativa'
      '03': 'Conteúdo cístico'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_mama.def campo Material Enviado (M_ENVIADO, CCLIMATDPC.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_MATER_ENVIA_PROCEDENTE:
    official_name: Proc. Material
    translated_name: Material's procedural origin
    description: 'On the breast-histopathology requisition, the broad category the
      tissue sample came from, e.g. a percutaneous needle biopsy versus a surgical
      specimen, recorded before the pathologist''s own procedure field.

      '
    code_system: internal
    codes:
      '01': 'Biópsia incisional'
      '02': 'Biópsia excisional'
      '03': 'Biópsia por agulha grossa'
      '04': 'Biópsia estereotáxica'
      '05': 'Ressecção segmentar'
      '06': 'Excisão de ductos principais'
      '07': 'Mastectomia glandular'
      '08': 'Ressecção segmentar com esvaziamento axilar'
      '09': 'Mastectomia simples'
      '10': 'Mastectomia radical e radical modificada'
    source: def
    source_ref: 'TAB_SISCAN.rar!histo_mama.def campo Proc. Material (PROC_MAT, CCLIMATPROC.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_MOTIVO_EXAME:
    official_name: Motivo do exame
    translated_name: Reason for the exam (type)
    description: 'Reason for the cervical cytology exam: screening (rastreamento), repeat
      after an ASC-US or low-grade result, or follow-up after colposcopic diagnosis or treatment.'
    code_system: internal
    codes:
      '01': 'Rastreamento'
      '02': 'Repetição (Exame Alterado ASCUS/Baixo Grau)'
      '03': 'Seguimento'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_colo.def campo Motivo do exame (MOT_EXAME, motivo_exame.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_NODULO:
    official_name: Tipo Nódulo
    translated_name: Nodule type
    description: 'Consistency of a palpable breast lump found on clinical exam before
      cytology: solid, mixed solid-cystic, or purely cystic.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'Nota Tecnica 12 SISCAN - Citopatologico de Mama, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Tipo Nódulo

      '
  TP_NODULO_CAROCO_MAMA:
    official_name: Nódulo_requis
    translated_name: Reported lump on requisition
    description: 'Whether the mammography requisition reports a palpable lump noticed
      by the patient or clinician, and if so in the right breast, the left, or both.

      '
    code_system: internal
    codes:
      '01': 'Sim, mama direita'
      '02': 'Sim, mama esquerda'
      '03': 'Sim, ambas'
      '04': 'Não'
    source: def
    source_ref: 'TAB_SISCAN.rar!mamografia.def campo Nódulo_requis (NODULO_REQ, TP_NODULO_CAROCO_MAMA.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_PADRAO_CITOPATOL_AMOST:
    official_name: Padrão citopatológico da amostra
    translated_name: Cytology pattern for discharge/cyst material
    description: 'Cytology pattern of nipple-discharge or cyst-content material: acellular,
      negative for malignancy, indeterminate malignancy, positive for malignancy, consistent
      with a papillary lesion, or consistent with an inflammatory process.'
    code_system: internal
    codes:
      '01': 'Material acelular'
      '02': 'Negativo para malignidade'
      '03': 'Padrão citopatológico de malig. indeterminada'
      '04': 'Positivos para malignidade'
      '05': 'Consistente com lesão papilar'
      '06': 'Consistente com processo inflamatório.'
    source: def
    source_ref: 'TAB_SISCAN.rar!cito_mama.def campo Result Desc/císt (RESULT_DC, CRESDERPAP.CNV); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar); Nota Tecnica 11 SISCAN, "Result Desc/císt - resultado do padrão citopatológico de material da descarga papilar ou de conteúdo cístico"'
    notes: 'Matched to RESULT_DC by the Nota Tecnica definition (cytopathological pattern of nipple-discharge or cystic-content material) and by the six-code set observed.'
  TP_PADR_CITO_MALIG_INDET:
    official_name: Malignid Indeterm
    translated_name: Indeterminate-malignancy pattern
    description: 'When an FNA breast sample''s cytology reads as indeterminate for
      malignancy, which lesion it is consistent with: a papillary tumor, a phyllodes
      tumor, or another.

      '
    code_system: internal
    codes:
      '01': 'Tumor papilar'
      '02': 'Tumor filóide'
      '03': 'Outros'
    source: def
