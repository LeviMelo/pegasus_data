      '
    code_system: internal
    source: layout_doc
    source_ref: 'Nota Tecnica 12 SISCAN - Citopatologico de Mama, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Suspeito malignid

      '
  TP_PROCEDIMENTO:
    official_name: Tipo de procedimento (mat. enviado)
    translated_name: Cervical specimen procedure type
    description: 'How the cervical tissue sent for histopathology was obtained: e.g.
      a directed biopsy, an excisional procedure such as conization or LEEP, or a hysterectomy
      specimen.

      '
