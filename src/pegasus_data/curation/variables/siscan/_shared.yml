    codes:
      '01': 'Mastite'
      '02': 'Abscesso'
      '03': 'Fibroadenoma'
      '04': 'Necrose'
      '05': 'Condição Fibrocística'
      '06': 'Lesão epitelial'
      '07': 'Outras'
