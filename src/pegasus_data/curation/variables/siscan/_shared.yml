      '02': 'Não'
      '03': 'Não Sabe'
    source: def
    source_ref: 'TAB_SISCAN.rar!histo_mama.def campo Risco elevado (RISCO_ELEV, RiscoElevado.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
