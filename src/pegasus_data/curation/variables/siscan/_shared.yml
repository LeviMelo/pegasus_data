    source_ref: 'TAB_SISCAN.rar!histo_colo.def campo Adequab Zona de Transformação (ADEQ_ZT, adequib_zt.cnv); TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'