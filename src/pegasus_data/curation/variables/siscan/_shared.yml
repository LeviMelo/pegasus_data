    source_ref: 'Nota Tecnica 8 SISCAN - Mamografia, tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Mama dir pele

      '
  TP_MAMA_PELE_ESQ:
    official_name: Mama esq pele
    translated_name: Left breast skin appearance
    description: 'Whether the left breast''s skin appeared normal or altered on the
