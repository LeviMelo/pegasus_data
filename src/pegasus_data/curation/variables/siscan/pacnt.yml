    code_system: none
    source: inferred
    reasoning: 'Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
