# SISCAN.PACNT — Patients
# Pacientes
#
# The patient dimension published beside each exam dataset in the open-data
# tree, joined to the exam records rather than repeated on them.
system: SISCAN
asserted_by: pegasus_data

variables:
  CO_LAUDO:
    official_name: Código do laudo
    translated_name: Mammography report identifier
    description: Identifying number of the mammography report (laudo), on the patient-dimension
      extract.
    code_system: none
    source: inferred
    reasoning: LAUDO is the standard Portuguese word for a diagnostic report, unabbreviated.
  CO_PACIENTE:
    official_name: Código do paciente
    translated_name: Patient code
    description: 'SISCAN''s internal identifier for a woman, distinct from her CNS
      number, used to link her cytopathology exams across years so DATASUS can count
      distinct patients rather than exams.

      '
    code_system: none
    source: inferred
    reasoning: 'CO_=codigo, PACIENTE=patient by naming grammar; SISCAN''s technical
      notes state tabulations count women, not exams, which requires a per-patient
      linking key such as this one.

      '
    source_ref: naming grammar + SISCAN Nota Tecnica 1 measures section
  CO_SEQ_SISCAN_CITO_COLO_PACNT:
    official_name: Sequencial SISCAN citopatologia colo (paciente)
    translated_name: Record sequence number (cervical-cytology patient extract)
    description: 'Row-sequence identifier on the SISCAN_CITO_COLO_PACNT (patient- dimension)
      yearly extract — this table''s own row number, not a national patient identifier.

      '
    code_system: none
    source: inferred
    reasoning: 'CO_SEQ_SISCAN_* is this catalog''s recurring row-identifier pattern
      across every SISCAN yearly extract (six near-identical PACNT/RESID variants across
      this fill batch alone); PACNT marks the patient- dimension table per SISCAN.PACNT
      in ontology.yml.

      '
    notes: Declared C(0,0); no observed values captured.
  CO_SEQ_SISCAN_CITO_MAMA_PACNT:
    official_name: Sequencial SISCAN citopatologia mama (paciente)
    translated_name: Record sequence number (breast-cytology patient extract)
    description: Row-sequence identifier on the SISCAN_CITO_MAMA_PACNT (patient-dimension)
      yearly extract.
    code_system: none
    source: inferred
    reasoning: Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml.
  CO_SEQ_SISCAN_HISTO_COLO_PACNT:
    official_name: Sequencial SISCAN histopatologia colo (paciente)
    translated_name: Record sequence number (cervical-histopathology patient extract)
    description: 'Row-sequence identifier on the SISCAN_HISTO_COLO_PACNT (patient-
      dimension) yearly extract — this table''s own row number.

      '
    code_system: none
    source: inferred
    reasoning: Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml.
  CO_SEQ_SISCAN_HISTO_MAMA_PACNT:
    official_name: Sequencial SISCAN histopatologia mama (paciente)
    translated_name: Record sequence number (breast-histopathology patient extract)
    description: Row-sequence identifier on the SISCAN_HISTO_MAMA_PACNT (patient-dimension)
