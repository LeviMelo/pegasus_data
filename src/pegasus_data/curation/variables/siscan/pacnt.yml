    code_system: none
    source: inferred
    reasoning: Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml.
  CO_SEQ_SISCAN_MAMOGRAFIA_PACNT:
    official_name: Sequencial SISCAN mamografia (paciente)
    translated_name: Record sequence number (mammography patient extract)
    description: Row-sequence identifier on the SISCAN_MAMOGRAFIA_PACNT (patient-dimension)
