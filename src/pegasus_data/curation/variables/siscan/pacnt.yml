      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  IDADE:
    official_name: Idade
    translated_name: Patient age
    description: Patient's age in years, as recorded on the exam requisition, on the patient-dimension
      extract.
    code_system: none
    source: layout_doc
    source_ref: INCA, Requisição de Exame Citopatológico - Colo do Útero (formulário nº 415)
      — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.1 "Idade"; Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Faixa etária"
  NU_ANO_RESULTADO:
    official_name: Ano Resultado
    translated_name: Year of the result
    description: Year in which the exam received its result from the service provider (laboratory),
      on the patient-dimension extract.
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Ano Resultado"; Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Mês/Ano Resultado"
  NU_LAUDO_HISTOP:
    official_name: Número do laudo histopatológico
    translated_name: Histopathology report number
    description: Identifying number of the histopathology report (laudo) this patient-dimension
      row refers to.
    code_system: none
    source: inferred
    reasoning: 'LAUDO_HISTOP unambiguously abbreviates laudo histopatológico (histopathology
      report). Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  REQ:
    official_name: Requisição
    translated_name: Exam request (order) number
    description: Identifying number of the mammography exam request/order this report
      was issued against.
    code_system: none
    source: inferred
    reasoning: 'REQ is the standard abbreviation for requisição (request), on the patient-dimension
      extract alongside CO_LAUDO. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  TP_INSPECAO_COLO:
    official_name: Inspeção do colo
    translated_name: Type of cervical (visual) inspection
    description: 'Result of the visual inspection of the cervix at collection (form item 11):
      normal, absent (congenital anomaly or surgically removed), altered, or cervix not visualised.'
    code_system: internal
    source: layout_doc
    source_ref: INCA, Requisição de Exame Citopatológico - Colo do Útero (formulário nº 415)
      — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.1 Exame clínico, item 11 "Inspeção do colo"; TAB_SISCAN insp_colo.CNV
    notes: Declared C(0,0); no observed values captured.
  TP_LAUDO_CITOP:
    official_name: Tipo de laudo citopatológico
    translated_name: Type of cytology report
    description: 'Overall category of the breast cytology report, apparently on the LAUDO_CITOP.CNV
      scale: positive for malignancy, suspicious, indeterminate malignancy, benign, no alteration,
      or unsatisfactory.'
    code_system: internal
    source: inferred
    reasoning: 'Full-word decomposition (tipo de laudo citopatológico); TP_ type-code prefix.
      Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web). TAB_SISCAN ships LAUDO_CITOP.CNV
      (01 positivo para malignidade, 02 suspeito, 03 malignidade indeterminada, 04 benigno,
      05 sem alteração, 06 insatisfatório) but no .def binds it to this column; description
      rewritten to that reading, which replaces the earlier collection-method guess.'
    notes: No observed values or codelist were captured.
  TP_LAUDO_HISTOPATOLOGICO:
    official_name: Tipo de laudo histopatológico
    translated_name: Type of histopathology report
    description: 'Overall category of the breast histopathology report, apparently on the
      LAUDO_HISTOP.CNV scale: malignant neoplastic lesion, suspicious, indeterminate, benign,
      or not informed.'
    code_system: internal
    source: inferred
    reasoning: 'Full-word decomposition (tipo de laudo histopatológico); TP_ type-code prefix.
      Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
