# SISCAN *_PACNT — Patients
# Pacientes
#
# The patient view published beside each exam dataset in the open-data tree: one
# row per patient and competence year with the worst exam's result (SISCAN Notas
# Técnicas 1, 4, 9, 10, 14), not a dimension joined to the exams (datasets/siscan.yml).
system: SISCAN
asserted_by: pegasus_data

variables:
  CO_LAUDO:
    official_name: Código do laudo
    translated_name: Mammography report identifier
    description: Identifying number of the mammography report (laudo), on the patient-dimension
      extract.
    code_system: none
    source: inferred
    reasoning: 'LAUDO is the standard Portuguese word for a diagnostic report, unabbreviated.
      Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  CO_PACIENTE:
    official_name: Código do paciente
    translated_name: Patient code
    description: 'SISCAN''s internal identifier for a woman, distinct from her CNS
      number, used to link her cytopathology exams across years so DATASUS can count
      distinct patients rather than exams.

      '
    code_system: none
    source: inferred
    reasoning: 'CO_=codigo, PACIENTE=patient by naming grammar; SISCAN''s technical notes
      state tabulations count women, not exams, which requires a per-patient linking key such
      as this one. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
    source_ref: naming grammar + SISCAN Nota Tecnica 1 measures section
  CO_SEQ_SISCAN_CITO_COLO_PACNT:
    official_name: Sequencial SISCAN citopatologia colo (paciente)
    translated_name: Record sequence number (cervical-cytology patient extract)
    description: 'Row-sequence identifier on the SISCAN_CITO_COLO_PACNT (patient- dimension)
      yearly extract — this table''s own row number, not a national patient identifier.

      '
    code_system: none
    source: inferred
    reasoning: 'CO_SEQ_SISCAN_* is this catalog''s recurring row-identifier pattern across
      every SISCAN yearly extract (six near-identical PACNT/RESID variants across this fill
      batch alone); PACNT marks the patient- dimension table per SISCAN.PACNT in ontology.yml.
      Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
    notes: Declared C(0,0); no observed values captured.
  CO_SEQ_SISCAN_CITO_MAMA_PACNT:
    official_name: Sequencial SISCAN citopatologia mama (paciente)
    translated_name: Record sequence number (breast-cytology patient extract)
    description: Row-sequence identifier on the SISCAN_CITO_MAMA_PACNT (patient-dimension)
      yearly extract.
    code_system: none
    source: inferred
    reasoning: 'Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  CO_SEQ_SISCAN_HISTO_COLO_PACNT:
    official_name: Sequencial SISCAN histopatologia colo (paciente)
    translated_name: Record sequence number (cervical-histopathology patient extract)
    description: 'Row-sequence identifier on the SISCAN_HISTO_COLO_PACNT (patient-
      dimension) yearly extract — this table''s own row number.

      '
    code_system: none
    source: inferred
    reasoning: 'Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  CO_SEQ_SISCAN_HISTO_MAMA_PACNT:
    official_name: Sequencial SISCAN histopatologia mama (paciente)
    translated_name: Record sequence number (breast-histopathology patient extract)
    description: Row-sequence identifier on the SISCAN_HISTO_MAMA_PACNT (patient-dimension)
      yearly extract.
    code_system: none
    source: inferred
    reasoning: 'Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  CO_SEQ_SISCAN_MAMOGRAFIA_PACNT:
    official_name: Sequencial SISCAN mamografia (paciente)
    translated_name: Record sequence number (mammography patient extract)
    description: Row-sequence identifier on the SISCAN_MAMOGRAFIA_PACNT (patient-dimension)
      yearly extract.
    code_system: none
    source: inferred
    reasoning: 'Same CO_SEQ_SISCAN_*_PACNT row-identifier pattern documented for CITO_COLO_PACNT
      in siscan_fill_01.yml. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  IDADE:
    official_name: Idade
    translated_name: Patient age
    description: Patient's age in years, as recorded on the exam requisition, on the patient-dimension
      extract.
    code_system: none
    source: layout_doc
    source_ref: INCA, Requisição de Exame Citopatológico - Colo do Útero (formulário nº 415)
      — https://www.inca.gov.br/sites/ufu.sti.inca.local/files/media/document/formulario-colorido-exame-citopatologico-colo-do-utero.pdf,
      p.1 "Idade"; Nota Técnica 2 SISCAN - Citopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf,
      "Faixa etária"
  NU_ANO_RESULTADO:
    official_name: Ano Resultado
    translated_name: Year of the result
    description: Year in which the exam received its result from the service provider (laboratory),
      on the patient-dimension extract.
    code_system: none
    source: layout_doc
    source_ref: Nota Técnica 13 SISCAN - Histopatológico de mama — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica13_histo_mama_atend.pdf,
      "Ano Resultado"; Nota Técnica 5 SISCAN - Histopatológico do colo do útero — http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_5_histo_colo_atend.pdf,
      "Mês/Ano Resultado"
  NU_LAUDO_HISTOP:
    official_name: Número do laudo histopatológico
    translated_name: Histopathology report number
    description: Identifying number of the histopathology report (laudo) this patient-dimension
      row refers to.
    code_system: none
    source: inferred
    reasoning: 'LAUDO_HISTOP unambiguously abbreviates laudo histopatológico (histopathology
      report). Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  REQ:
    official_name: Requisição
    translated_name: Exam request (order) number
    description: Identifying number of the mammography exam request/order this report
      was issued against.
    code_system: none
    source: inferred
    reasoning: 'REQ is the standard abbreviation for requisição (request), on the patient-dimension
      extract alongside CO_LAUDO. Reviewed 2026-09-28: no documentation found (searched TAB_SISCOLO4/TAB_SISMAMA/TAB_SISCAN
      .def and .cnv files, SISCAN Notas Tecnicas 1-14, INCA requisition/result forms, the
      SISMAMA laudo guide, the DATASUS FTP DOC folders and the web).'
  TP_INSPECAO_COLO:
    official_name: Inspeção do colo
    translated_name: Type of cervical (visual) inspection
    description: 'Result of the visual inspection of the cervix at collection (form item 11):
      normal, absent (congenital anomaly or surgically removed), altered, or cervix not visualised.'
    code_system: internal
    codes:
      '01': 'Normal'
      '02': 'Ausente (Anomalias Congênitas ou Retirados Cirur)'
      '03': 'Alterado'
      '04': 'Colo de Útero Não Visualizado'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!insp_colo.CNV, Inspeção do colo (not bound in a .def); same four options and order as item 11 of INCA requisition form nº 415; TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
  TP_LAUDO_CITOP:
    official_name: Tipo de laudo citopatológico
    translated_name: Type of cytology report
    description: 'Overall category of the breast cytology report, apparently on the LAUDO_CITOP.CNV
      scale: positive for malignancy, suspicious, indeterminate malignancy, benign, no alteration,
      or unsatisfactory.'
    code_system: internal
    codes:
      '01': 'Positivo para malignidade'
      '02': 'Suspeito de malignidade'
      '03': 'Malignidade indeterminada'
      '04': 'Benigno'
      '05': 'Sem alteração'
      '06': 'Insatisfatório'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!LAUDO_CITOP.CNV (not bound in a .def); Nota Tecnica 10 SISCAN, "Laudo Citopatológico - resultado positivo para malignidade, suspeito de malignidade, malignidade indeterminada, benigno, sem alteração ou insatisfatório"; TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
    notes: 'No observed values or codelist were captured. The six categories of Nota Tecnica 10 are the six entries of LAUDO_CITOP.CNV in the same order.'
  TP_LAUDO_HISTOPATOLOGICO:
    official_name: Tipo de laudo histopatológico
    translated_name: Type of histopathology report
    description: 'Overall category of the breast histopathology report, apparently on the
      LAUDO_HISTOP.CNV scale: malignant neoplastic lesion, suspicious, indeterminate, benign,
      or not informed.'
    code_system: internal
    codes:
      '01': 'Lesão neoplásica maligna'
      '02': 'Lesão suspeita'
      '03': 'Lesão indeterminada'
      '04': 'Lesão benigna'
      '06': 'Não informado'
    source: layout_doc
    source_ref: 'TAB_SISCAN.rar!LAUDO_HISTOP.CNV (not bound in a .def); Nota Tecnica 14 SISCAN, "Laudo Histopatológico ... Lesão benigna, Lesão indeterminada, Lesão suspeita ou Lesão neoplásica maligna. A categoria não informado corresponde a resultados insatisfatório"; TAB_SISCAN.rar (ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/TAB_SISCAN.rar)'
    notes: 'No observed values or codelist were captured. Nota Tecnica 14 names the same four lesion categories plus "não informado" (code 06 in the CNV).'