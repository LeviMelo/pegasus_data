  IDADE:
    official_name: Idade
    translated_name: Patient age
    description: 'Patient''s age, in years, at the time of this cervical cytology exam
      — on the patient-dimension extract.

      '
    code_system: none
    source: inferred
    reasoning: IDADE is the plain, unabbreviated Portuguese word for age.
  NU_ANO_RESULTADO:
    official_name: Ano do resultado
    translated_name: Year of the result
    description: Year the histopathology result was issued, on the patient-dimension
      extract.
    code_system: none
    source: inferred
    reasoning: Full-word decomposition (ano do resultado); NU_ prefix shared with this
      table's other numeric fields despite not being a count here.
  NU_LAUDO_HISTOP:
    official_name: Número do laudo histopatológico
    translated_name: Histopathology report number
    description: Identifying number of the histopathology report (laudo) this patient-dimension
      row refers to.
    code_system: none
    source: inferred
    reasoning: LAUDO_HISTOP unambiguously abbreviates laudo histopatológico (histopathology
      report).
  REQ:
    official_name: Requisição
    translated_name: Exam request (order) number
    description: Identifying number of the mammography exam request/order this report
      was issued against.
    code_system: none
    source: inferred
    reasoning: REQ is the standard abbreviation for requisição (request), on the patient-dimension
      extract alongside CO_LAUDO.
  TP_INSPECAO_COLO:
    official_name: Tipo de inspeção do colo
    translated_name: Type of cervical (visual) inspection
    description: 'Category of visual cervical inspection performed alongside the cytology
      collection — e.g. whether the cervix appeared normal, altered, or was not visualised.

      '
    code_system: internal
    source: inferred
    reasoning: Full-word decomposition (tipo + inspeção do colo); TP_ type-code prefix.
    notes: Declared C(0,0); no observed values captured.
  TP_LAUDO_CITOP:
    official_name: Tipo de laudo citopatológico
    translated_name: Type of cytology report
    description: Category of this breast cytology report — e.g. which collection method
