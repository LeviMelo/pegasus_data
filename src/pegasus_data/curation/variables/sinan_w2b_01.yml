system: SINAN
asserted_by: pegasus_data

variables:

  CON_OUTRA:
    official_name: Outra forma de contágio
    translated_name: Other route of transmission (specify)
    description: >
      Free-text field on the acute Chagas disease form used when the suspected
      transmission route is not one of the standard options (vectorial,
      transfusional, oral, vertical) — the investigator writes in the
      alternative route here.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is CHAG (Chagas); CON_ prefix pairs with an "outra" free-text
      slot (C30) typical of DATASUS forms where a fixed-option field has an
      "other, specify" companion.

  DOSAGEM:
    official_name: Dosagem do medicamento
    translated_name: Drug dosage
    description: >
      Recorded dose of the antitrypanosomal treatment (benznidazole or
      nifurtimox) given for acute Chagas disease, stored as a short numeric
      code rather than free text.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; narrow width (C3) fits a coded dose amount/range rather than
      a description, alongside the treatment-scheme fields on the same form.

  DT_COL_DIR:
    official_name: Data da coleta do exame direto
    translated_name: Date of direct parasitological exam collection
    description: >
      Date blood was drawn for the direct parasitological exam (thick smear /
      fresh blood exam) used to confirm acute Chagas disease, when
      parasitemia is high enough to be seen directly rather than by serology.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; DT_ date prefix, COL_DIR reads "coleta direta" (direct-exam
      collection), the standard parasitological confirmation test for the
      acute phase.

  ECG_RESULT:
    official_name: Resultado do ECG
    translated_name: ECG result
    description: >
      Short coded summary of the electrocardiogram result for a suspected
      acute Chagas case, flagging the myocarditis and conduction
      abnormalities the acute phase can produce.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; name directly reads "resultado do ECG"; width C20 fits a
      short result code/phrase rather than a raw tracing.

  GANGLIOS:
    official_name: Gânglios (adenomegalia localizada)
    translated_name: Lymphadenopathy (localized)
    description: >
      Clinical-signs checklist item for acute Chagas disease: localized
      lymph-node enlargement near the site of inoculation. Distinct from
      POLIADENO, the same list's item for widespread node enlargement.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; C1 width matches the other single-character sign checkboxes
      (HEPAESPLE, INESPECIF) on the same clinical-signs section.

  HEPAESPLE:
    official_name: Hepatoesplenomegalia
    translated_name: Hepatosplenomegaly
    description: >
      Clinical-signs checklist item for acute Chagas disease flagging
      enlargement of liver and spleen, a common finding in the acute phase.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; name is a direct contraction of hepatoesplenomegalia; C1
      width matches sibling sign checkboxes on the same form section.

  INESPECIF:
    official_name: Sinais e sintomas inespecíficos
    translated_name: Nonspecific signs and symptoms
    description: >
      Clinical-signs checklist item for acute Chagas disease marking
      nonspecific complaints (malaise, fever without a more specific sign)
      that don't fit the form's named clinical findings.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; name reads "inespecífico"; C1 width matches the other
      checklist sign fields on the same clinical section.

  MED_CONTR:
    official_name: Medidas de controle adotadas
    translated_name: Control measures taken
    description: >
      Whether vector-control measures (e.g. insecticide spraying of the
      dwelling) were carried out in response to a suspected acute Chagas
      case, part of the outbreak-response section of the form.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; MED_CONTR reads "medida[s] de controle"; C1 width fits a
      yes/no field alongside SUSPEITOS in the same outbreak-response block.

  POLIADENO:
    official_name: Poliadenomegalia
    translated_name: Generalized lymphadenopathy
    description: >
      Clinical-signs checklist item for acute Chagas disease: widespread
      (multi-site) lymph-node enlargement, as opposed to GANGLIOS, which
      marks localized node enlargement near the inoculation site.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; name reads "poliadenomegalia" (multiple enlarged nodes);
      pairs with GANGLIOS as the localized/generalized split of the same sign.

  SUSPEITOS:
    official_name: Existem outros casos suspeitos
    translated_name: Other suspected cases exist
    description: >
      Whether other suspected acute Chagas cases are known from the same
      exposure (shared meal, same rural site), relevant because Brazil's
      acute Chagas outbreaks are often oral (contaminated food) and cluster.
    code_system: none
    source: inferred
    reasoning: >
      CHAG form; SUSPEITOS reads "suspeitos"; C1 width fits a yes/no flag in
      the outbreak-context section alongside MED_CONTR.

  ANT_CORTE:
    official_name: Antecedente de corte de mato/roçagem
    translated_name: History of brush-cutting activity
    description: >
      Whether the hantavirus patient cut grass, brush, or grain before
      symptom onset — a recognized rural exposure that stirs up
      rodent-contaminated dust and aerosolizes the virus.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; ANT_ is the antecedente/exposure-history prefix, CORTE reads
      "corte" (cutting); numeric N1 fits a coded yes/no exposure item.

  ANT_LIMPEZ:
    official_name: Antecedente de limpeza de local fechado
    translated_name: History of cleaning an enclosed structure
    description: >
      Whether the hantavirus patient cleaned a shed, barn, or other closed
      rural structure before symptom onset, a classic aerosol-exposure
      activity distinct from ANT_CORTE's outdoor brush-cutting.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; ANT_ prefix plus LIMPEZ ("limpeza"); pairs with ANT_CORTE as
      one of several exposure-history checkboxes on the same form.

  CLI_ANGUST:
    official_name: Angústia respiratória
    translated_name: Respiratory distress
    description: >
      Clinical-signs checklist item marking respiratory distress, the
      hallmark of the cardiopulmonary phase of Hantavirus Pulmonary Syndrome
      that this notification form exists to catch early.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; CLI_ is the clinical-sign prefix, ANGUST reads "angústia";
      numeric N1 matches the coded checkbox pattern of the sign list.

  CLI_MUNICI:
    official_name: Município do atendimento clínico
    translated_name: Municipality of clinical care
    description: >
      IBGE code of the municipality where the hantavirus patient received
      clinical care, which can differ from the patient's home municipality
      when severe cases are transferred to a referral hospital.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; numeric width N7 matches the standard 7-digit IBGE
      municipality code rather than a 1-character clinical-sign flag, despite
      the CLI_ prefix shared with the sign checkboxes.

  CON_DIAGNO:
    official_name: Critério de confirmação diagnóstica
    translated_name: Diagnostic confirmation criterion
    description: >
      Coded basis on which a hantavirus case was confirmed — laboratory
      evidence versus clinical-epidemiological grounds alone.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; CON_ + DIAGNO reads "critério/condição de diagnóstico";
      numeric N1 fits a small enumerated criterion code.

  LAB_IGG:
    official_name: Resultado da sorologia IgG
    translated_name: IgG serology result
    description: >
      Result of the IgG antibody test for hantavirus, distinguished from
      LAB_OUTRO (any additional test) by targeting this specific serologic
      marker used to confirm past or current infection.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; LAB_ prefix plus explicit IGG; numeric N1 matches a coded
      reagent/non-reagent/inconclusive result.

  LAB_L_C_DE:
    official_name: Resultado de exame laboratorial complementar
    translated_name: Supplementary laboratory test result
    description: >
      Result of a second, named confirmatory laboratory test for hantavirus
      (e.g. RT-PCR or immunohistochemistry) beyond the IgG serology captured
      in LAB_IGG.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; LAB_ prefix and N1 coded-result width match the sibling
      LAB_IGG and LAB_OUTRO fields; exact test the truncated name refers to
      could not be confirmed from evidence available.

  LAB_OUTRO:
    official_name: Resultado de outro exame laboratorial
    translated_name: Other laboratory test result
    description: >
      Result of a laboratory test for hantavirus that isn't one of the named
      test fields on the form (e.g. not IgG or the supplementary test in
      LAB_L_C_DE) — a catch-all lab result slot.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; LAB_OUTRO reads "outro" (other); numeric N1 matches the
      coded-result pattern of the other LAB_ fields on the same form.

  TRA_CPAP:
    official_name: Uso de CPAP
    translated_name: CPAP used
    description: >
      Whether the hantavirus patient required CPAP (continuous positive
      airway pressure) respiratory support, reflecting the severe respiratory
      failure that Hantavirus Pulmonary Syndrome can cause.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; TRA_ is the treatment prefix, CPAP is the named respiratory
      device; C1 width fits a yes/no treatment flag.

  TRA_DT_ALT:
    official_name: Data de alta
    translated_name: Discharge date
    description: >
      Date the hospitalized hantavirus patient was discharged, closing out
      the treatment/outcome section of the form.
    code_system: none
    source: inferred
    reasoning: >
      HANT form; TRA_ treatment prefix with DT_ALT reading "data de alta";
      declared N8 width matches an AAAAMMDD date stored as a numeric field.

  C_M:
    official_name: Contato com mordedura
    translated_name: Contact by bite
    description: >
      Sporotrichosis-form field recording whether the patient's exposure to
      an infected cat was through a bite, part of the form's contact-type
      breakdown for this cat-transmitted fungal disease.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is ESPO (esporotricose, typically cat-transmitted); short
      numeric (N1) code fits a categorical contact-type field; exact label
      inferred from the abbreviation and disease context rather than
      confirmed documentation.

  G_D:
    official_name: Gatos doentes no domicílio
    translated_name: Sick cats in the household
    description: >
      Sporotrichosis-form field recording how many cats in the patient's
      household were visibly ill, since household cats are the main source
      of human infection.
    code_system: none
    source: inferred
    reasoning: >
      ESPO form; N2 numeric width suggests a small count rather than a
      yes/no flag, consistent with "quantity of sick cats"; exact label not
      confirmed by documentation.

  URINA:
    official_name: Coleta de urina
    translated_name: Urine sample collected
    description: >
      Whether a urine sample was collected from the suspected typhoid fever
      patient, used for urine culture to help isolate Salmonella Typhi.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is FTIF (febre tifoide); name reads "urina"; C1 width matches a
      yes/no/pending sample-collection flag.

  VINC_OUT:
    official_name: Outro vínculo epidemiológico
    translated_name: Other epidemiological link (specify)
    description: >
      Free-text field for describing an epidemiological link to another
      typhoid fever case or shared exposure (e.g. water source, event) that
      isn't covered by the form's standard link categories.
    code_system: none
    source: inferred
    reasoning: >
      FTIF form; VINC_ reads "vínculo" and OUT reads "outro"; C30 width fits
      a free-text "other, specify" companion field.
