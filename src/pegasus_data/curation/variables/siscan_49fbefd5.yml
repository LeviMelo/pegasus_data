system: SISCAN
asserted_by: pegasus_data
variables:
  TP_MAMA_PELE_DIR:
    official_name: Mama dir pele
    translated_name: Right breast skin appearance
    description: >
      Whether the right breast's skin appeared normal or altered on the
      mammogram, one of the imaging findings recorded per breast in the
      SISCAN mammography report.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Mama dir pele

  TP_MAMA_PELE_ESQ:
    official_name: Mama esq pele
    translated_name: Left breast skin appearance
    description: >
      Whether the left breast's skin appeared normal or altered on the
      mammogram, the same imaging finding as TP_MAMA_PELE_DIR reported for
      the opposite breast.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Mama esq pele

  TP_MAMOGRAFIA_RASTREAMENT:
    official_name: Tipo Mamo rast
    translated_name: Screening mammogram type
    description: >
      Why a screening mammogram (no symptoms) was ordered: routine
      target-population screening (ages 50-69), screening for elevated
      familial risk, or follow-up in a patient already treated for breast
      cancer.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Tipo Mamo rast

  TP_MATERIAL:
    official_name: Material Enviado
    translated_name: Material submitted
    description: >
      Source of the specimen sent for breast cytology: nipple discharge,
      fine-needle aspiration, or fluid drained from a cyst.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Material Enviado

  TP_MATER_ENVIA_PROCEDENTE:
    official_name: Proc. Material
    translated_name: Material's procedural origin
    description: >
      On the breast-histopathology requisition, the broad category the
      tissue sample came from, e.g. a percutaneous needle biopsy versus a
      surgical specimen, recorded before the pathologist's own procedure
      field.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_mama.def, campo Proc. Material (PROC_MAT,
      CCLIMATPROC.CNV)

  TP_NODULO:
    official_name: Tipo Nódulo
    translated_name: Nodule type
    description: >
      Consistency of a palpable breast lump found on clinical exam before
      cytology: solid, mixed solid-cystic, or purely cystic.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Tipo Nódulo

  TP_NODULO_CAROCO_MAMA:
    official_name: Nódulo_requis
    translated_name: Reported lump on requisition
    description: >
      Whether the mammography requisition reports a palpable lump noticed
      by the patient or clinician, and if so in the right breast, the left,
      or both.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Nódulo_requis

  TP_PADRAO_CITOPATOL_AMOST:
    official_name: Result Desc/cist
    translated_name: Cytology pattern for discharge/cyst material
    description: >
      For breast material from nipple discharge or cyst fluid rather than a
      needle aspirate, the cytology pattern: acellular, negative,
      indeterminate, positive for malignancy, consistent with a papillary
      lesion, or inflammatory.
    code_system: internal
    source: inferred
    reasoning: >
      TP_ plus PADRAO_CITOPATOL_AMOST names a cytology-pattern-of-the-sample
      field. The sibling TP_RESULTA_PUNCAO_ASPIRATIVA already matches
      cito_mama.def's PAAF-specific "Resultado PAAF" field, leaving this
      column to match the def's separate "Result Desc/cist" field
      (RESULT_DC, CRESDERPAP.CNV), whose six categories Nota Tecnica 12
      lists for discharge/cystic-content material specifically.
    source_ref: >
      TAB_SISCAN.rar!cito_mama.def campo Result Desc/cist (RESULT_DC) +
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf

  TP_PADR_CITO_MALIG_INDET:
    official_name: Malignid Indeterm
    translated_name: Indeterminate-malignancy pattern
    description: >
      When an FNA breast sample's cytology reads as indeterminate for
      malignancy, which lesion it is consistent with: a papillary tumor, a
      phyllodes tumor, or another.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Malignid Indeterm

  TP_PADR_CITO_POSI_MALIG:
    official_name: Positivo malignid
    translated_name: Positive-for-malignancy pattern
    description: >
      When an FNA breast sample's cytology is positive for malignancy,
      which cancer type it is consistent with: ductal carcinoma, lobular
      carcinoma, or another.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Positivo malignid

  TP_PADR_CITO_SUSP_MALIG:
    official_name: Suspeito malignid
    translated_name: Suspicious-for-malignancy pattern
    description: >
      When an FNA breast sample's cytology is suspicious but not positive
      for malignancy, which finding it shows: a proliferative epithelial
      lesion with atypia, or another.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Suspeito malignid

  TP_PROCEDIMENTO:
    official_name: Tipo de procedimento (mat. enviado)
    translated_name: Cervical specimen procedure type
    description: >
      How the cervical tissue sent for histopathology was obtained: e.g. a
      directed biopsy, an excisional procedure such as conization or LEEP,
      or a hysterectomy specimen.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_colo.def, campo Tipo de procedimento (mat.
      enviado) (TP_PROCED, tpproced.CNV)

  TP_PROCEDIMENTO_CIRURGICO:
    official_name: Proc. Cirúrgico
    translated_name: Breast surgical procedure type
    description: >
      Which surgical procedure produced the breast tissue examined by
      histopathology, reported with the result: e.g. core-needle biopsy,
      incisional or excisional biopsy, or mastectomy.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_mama.def, campo Proc. Cirúrgico (PROC_CIR,
      TP_PROCEDIMENTO_CIRURGICO_HISTO.CNV)

  TP_PROC_BENI_NEGA_MALI_COMPATI:
    official_name: Proc Ben Neg mal
    translated_name: Benign-negative pattern, compatible diagnosis
    description: >
      When an FNA breast sample reads as benign and negative for
      malignancy, which process it matches: mastitis, recurrent subareolar
      abscess, fibroadenoma, fat necrosis, fibrocystic change, or another.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Proc Ben Neg mal

  TP_RECOMENDACAO_DIREITA:
    official_name: Recomendação - mama direita
    translated_name: Right-breast follow-up recommendation
    description: >
      Follow-up action recommended for the right breast in the mammography
      report, e.g. routine annual screening, additional imaging, six-month
      follow-up, or biopsy, tied to its BI-RADS category.
    code_system: internal
    source: inferred
    reasoning: >
      TP_=tipo, RECOMENDACAO=recommendation, DIREITA=the laterality suffix
      already used by sibling fields TP_MAMA_PELE_DIR and TP_RECOMENDACAO_ESQUERDA
      in the same mammography series; BI-RADS mammography reporting assigns a
      management recommendation per breast, independently for each side.
    source_ref: naming grammar + BI-RADS per-breast recommendation convention

  TP_RECOMENDACAO_ESQUERDA:
    official_name: Recomendação - mama esquerda
    translated_name: Left-breast follow-up recommendation
    description: >
      Follow-up action recommended for the left breast in the mammography
      report, the counterpart to TP_RECOMENDACAO_DIREITA reported for the
      opposite breast.
    code_system: internal
    source: inferred
    reasoning: >
      Same laterality-suffix pattern as TP_RECOMENDACAO_DIREITA and
      TP_MAMA_PELE_ESQ; BI-RADS mammography reporting assigns a management
      recommendation per breast, independently for each side.
    source_ref: naming grammar + BI-RADS per-breast recommendation convention

  TP_RESP_ANT_MAMA_EXA_PROF_SAUD:
    official_name: Ex Clin Ant
    translated_name: Prior clinical breast exam
    description: >
      Whether the patient reports having had her breasts examined by a
      health professional before this mammography request, self-reported on
      the requisition.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Ex Clin Ant

  TP_RESP_APRES_RISC_ELEV_CANCER:
    official_name: Risco elevado
    translated_name: Elevated breast-cancer risk
    description: >
      Self-reported elevated breast-cancer risk (Sim/Não/Não sabe): personal
      history of breast cancer, an atypical proliferative lesion, a
      first-degree relative diagnosed before 50, bilateral breast cancer, or
      ovarian cancer.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Risco elevado

  TP_RESP_FEZ_MAMOGRA_ALGUMA_VEZ:
    official_name: Mamog. Anterior
    translated_name: Ever had a mammogram before
    description: >
      Whether the patient reports having ever had a mammogram before this
      one, self-reported when the current exam is requested.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 8 SISCAN - Mamografia,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica8_mamografia_atend.pdf,
      campo Mamog. Anterior

  TP_RESULTA_PUNCAO_ASPIRATIVA:
    official_name: Resultado PAAF
    translated_name: Fine-needle-aspiration result
    description: >
      Overall cytology classification of a breast fine-needle-aspiration
      sample: benign and negative for malignancy, indeterminate, suspicious,
      or positive for malignancy.
    code_system: internal
    source: layout_doc
    source_ref: >
      Nota Tecnica 12 SISCAN - Citopatologico de Mama,
      tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica12_cito_mama_residencia.pdf,
      campo Resultado PAAF

  TP_RISCO_ELEVADO:
    official_name: Risco elevado (histopatológico de mama)
    translated_name: Elevated breast-cancer risk (histopathology form)
    description: >
      Same elevated-breast-cancer-risk flag (Sim/Não/Não sabe) as the
      mammography and cytology forms, recorded here on the breast
      histopathology requisition.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_mama.def campo Risco elevado (RISCO_ELEV,
      RiscoElevado.cnv - same lookup file as the mammography Risco elevado
      field documented in Nota Tecnica 8)

  TP_TAMANHO_LESAO:
    official_name: Tam_lesão_req
    translated_name: Lesion size on requisition
    description: >
      Size of the breast lesion, grouped into bands, as estimated on the
      histopathology requisition from clinical exam or imaging, before the
      specimen itself is examined.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_mama.def, campo Tam_lesão_req (TAM_LESREQ,
      CCLITAM.CNV)

  TP_TAMANHO_TUMOR:
    official_name: Tamanho_tumor
    translated_name: Pathologic tumor size
    description: >
      Size of the tumor as measured by the pathologist on the excised
      breast specimen, grouped into bands, distinct from the pre-exam
      TP_TAMANHO_LESAO estimate.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_mama.def, campo Tamanho_tumor (TAM_TUMOR,
      TP_TAMANHO_TUMOR.CNV)

  TP_ZONA_TRANSF_ADEQUABILIDADE:
    official_name: Adequab Zona de Transformação
    translated_name: Transformation-zone adequacy
    description: >
      Whether an excised cervical specimen (conization or LEEP) adequately
      included the squamocolumnar transformation zone, the area where most
      precancerous lesions arise.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!histo_colo.def, campo Adequab Zona de Transformação
      (ADEQ_ZT, adequib_zt.cnv)

  CO_ALT_CEL_ATROFIA:
    official_name: Alt. ben:Atr. inflam
    translated_name: Benign atrophic cellular change
    description: >
      Flags an atrophic cellular change with inflammation on the cervical
      Pap smear, a benign reactive finding common in postmenopausal women,
      one of the standard benign-alteration categories.
    code_system: internal
    source: def
    source_ref: >
      TAB_SISCAN.rar!cito_colo.def, campo Alt. ben:Atr. inflam (A_B_ATROF)
