system: SINAN
asserted_by: pegasus_data

variables:

  MED_DT_QUI:
    official_name: Se sim, data (Quimioprofilaxia)
    translated_name: Chemoprophylaxis date
    description: >
      Date chemoprophylaxis was given to a confirmed meningitis case's close
      contacts, filled in only when MED_QUIMIO is Sim.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 56 "Se sim, data"

  MED_MATERI:
    official_name: Coleta de material (swab)
    translated_name: Specimen (swab) collection flag
    description: >
      Whether a nasopharyngeal/oropharyngeal swab was collected for culture
      in a diphtheria investigation, the specimen diagnosis for
      Corynebacterium diphtheriae depends on.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1, consistent with Sim/Não)
      and DIFT series membership. Diphtheria confirmation is culture-based,
      so a swab-collection flag is a standard companion to the culture-result
      field; "MATERI" reads as a truncation of "material" (the collected
      specimen), paralleling how other SINAN forms name their
      specimen-collected flags (e.g. ID_SANGUE, ID_URINA).

  MED_PREVEN:
    official_name: Medicação preventiva (contatos)
    translated_name: Preventive medication given to contacts
    description: >
      Whether antibiotic chemoprophylaxis was given to a diphtheria case's
      close contacts, paired with MED_QUAN_P for how many contacts received
      it.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and DIFT series
      membership. Contact chemoprophylaxis is a standard control measure
      recorded on SINAN's diphtheria and meningitis forms alike (see the
      confirmed MED_QUIMIO on the Meningite form for the same concept under a
      different field name).

  MED_QUAN_P:
    official_name: Quantidade de pessoas (medicação preventiva)
    translated_name: Number of contacts given preventive medication
    description: >
      Count of contacts who received chemoprophylaxis, companion numeric
      field to the MED_PREVEN flag.
    code_system: none
    source: inferred
    reasoning: >
      Declared as N3 (three-digit numeric) with DIFT series membership,
      matching a headcount rather than a coded flag; "QUAN_P" reads as
      "quantidade de pessoas", the natural pairing to a Sim/Não prophylaxis
      flag.

  MED_QUIMIO:
    official_name: Realizada Quimioprofilaxia dos Comunicantes
    translated_name: Chemoprophylaxis given to contacts
    description: >
      Whether chemoprophylaxis was given to a confirmed meningitis case's
      close contacts, only asked when the case was confirmed as
      meningococcal, pneumococcal or Haemophilus meningitis.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 55 "Realizada Quimioprofilaxia dos Comunicantes"

  MICRO1_S1:
    official_name: Micro 1ª Amostra - 1º Sorovar
    translated_name: MAT 1st sample - 1st serovar
    description: >
      Leptospira serovar identified by the microscopic agglutination test on
      the first sample, paired with the titer in MICRO1_T_1; a second serovar
      can be recorded in the sibling pair MICRO1_S_2/MICRO1_T_2.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 48 "Micro 1ª Amostra 1º Sorovar"

  MICRO1_S_2:
    official_name: Micro 1ª Amostra - 2º Sorovar
    translated_name: MAT 1st sample - 2nd serovar
    description: >
      Second Leptospira serovar identified on the same first-sample MAT test
      as MICRO1_S1, paired with its own titer in MICRO1_T_2.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 49 "Micro 1ª Amostra 2º Sorovar"

  MICRO1_T_1:
    official_name: Micro 1ª Amostra - título (1º sorovar)
    translated_name: MAT 1st sample - titer (1st serovar)
    description: >
      Agglutination titer for the serovar named in MICRO1_S1; required
      whenever that field is filled in.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 48 "Micro 1ª Amostra título"

  MICRO1_T_2:
    official_name: Micro 1ª Amostra - título (2º sorovar)
    translated_name: MAT 1st sample - titer (2nd serovar)
    description: >
      Agglutination titer for the serovar named in MICRO1_S_2.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 49 "Micro 1ª Amostra título"

  MICRO2_S1:
    official_name: Resultado 2ª Amostra - 1º Sorovar
    translated_name: MAT 2nd sample - 1st serovar
    description: >
      Leptospira serovar identified by the MAT test on the second, later
      sample — used to confirm titer rise against MICRO1_S1 — paired with
      titer MICRO2_T_1.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 52 "Resultado 2ª Amostra 1º Sorovar"

  MICRO2_S_2:
    official_name: Resultado 2ª Amostra - 2º Sorovar
    translated_name: MAT 2nd sample - 2nd serovar
    description: >
      Second serovar identified on the same second-sample MAT test as
      MICRO2_S1, paired with titer MICRO2_T_2.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 53 "Resultado 2ª Amostra 2º Sorovar"

  MICRO2_T_1:
    official_name: Micro 2ª Amostra - título (1º sorovar)
    translated_name: MAT 2nd sample - titer (1st serovar)
    description: >
      Agglutination titer for the serovar named in MICRO2_S1.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 52 "Micro 2ª Amostra título"

  MICRO2_T_2:
    official_name: Micro 2ª Amostra - título (2º sorovar)
    translated_name: MAT 2nd sample - titer (2nd serovar)
    description: >
      Agglutination titer for the serovar named in MICRO2_S_2.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 53 "Micro 2ª Amostra título"

  MUN_ING:
    official_name: Município de ingestão do alimento suspeito
    translated_name: Municipality where the suspect food was eaten
    description: >
      IBGE code of the municipality where the patient ate the food suspected
      of causing botulism, which can differ from the residence or notifying
      municipality when the meal was eaten while travelling.
    code_system: none
    source: inferred
    reasoning: >
      Declared as C6 (matching an IBGE six-digit municipality code) with BOTU
      series membership. "MUN_ING" decomposes to "município de ingestão", and
      pinpointing where a suspect meal was eaten is the central
      epidemiological question of a foodborne-botulism investigation.

  ELISA1:
    official_name: Resultado ELISA - 1ª amostra
    translated_name: ELISA result - 1st sample
    description: >
      Result of the first ELISA serology sample in a plague (Peste)
      investigation, paired with ELISA2 for a second sample and with the
      separate IGM_T1/IGG_T2 titer fields.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and PEST series
      membership. The name and paired-sample pattern mirror the confirmed
      LAB_ELIS_1/LAB_ELIS_2 ELISA fields on the Leptospirose form, the same
      style of paired-sample serology SINAN uses across its zoonosis forms.

  ELISA2:
    official_name: Resultado ELISA - 2ª amostra
    translated_name: ELISA result - 2nd sample
    description: >
      Second-sample result paired with ELISA1 in the same plague-investigation
      ELISA pair.
    code_system: internal
    source: inferred
    reasoning: >
      Same basis as ELISA1: C1 width, PEST series, and the paired-sample
      ELISA pattern confirmed elsewhere in SINAN (Leptospirose's
      LAB_ELIS_1/2).

  ELI_IGG_S1:
    official_name: Sorologia ELISA IgG - amostra 1
    translated_name: ELISA IgG serology - sample 1
    description: >
      IgG-ELISA result for the first serum sample in a Chagas Aguda
      investigation, one test in a three-method serology panel (ELISA,
      hemaglutinação HEM_*, imunofluorescência IMU_*) each split into
      IgG/IgM and sample 1/2.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and CHAG series
      membership. The IGG/IGM x S1/S2 naming exactly parallels the confirmed
      sample-pairing pattern on the Leptospirose and exanthematous-disease
      forms, and acute Chagas disease is confirmed serologically with paired
      IgM/IgG samples by design.

  ELI_IGG_S2:
    official_name: Sorologia ELISA IgG - amostra 2
    translated_name: ELISA IgG serology - sample 2
    description: >
      Second-sample ELISA IgG result, paired with ELI_IGG_S1 to track
      antibody-titer change across the two draws.
    code_system: internal
    source: inferred
    reasoning: Same basis as ELI_IGG_S1.

  ELI_IGM_S1:
    official_name: Sorologia ELISA IgM - amostra 1
    translated_name: ELISA IgM serology - sample 1
    description: >
      IgM-ELISA result for the first serum sample, the acute-phase antibody
      test in the same Chagas serology panel as ELI_IGG_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as ELI_IGG_S1.

  ELI_IGM_S2:
    official_name: Sorologia ELISA IgM - amostra 2
    translated_name: ELISA IgM serology - sample 2
    description: >
      Second-sample ELISA IgM result, paired with ELI_IGM_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as ELI_IGG_S1.

  ENTRADA:
    official_name: Tipo de entrada do caso
    translated_name: Case-entry type
    description: >
      Coded classification of how the visceral leishmaniasis case entered
      surveillance — e.g. new case, relapse or transfer from another
      notifying unit.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and LEIV series
      membership. "Entrada" (entry/admission type) is a category SINAN forms
      for chronic or relapsing conditions typically carry to distinguish a
      genuinely new case from a returning one; the single-character width
      fits a small coded list rather than free text.

  EPI_PESTE:
    official_name: Epizootia
    translated_name: Epizootic (rodent die-off) flag
    description: >
      Whether an epizootic — an abnormal die-off among local rodents — was
      reported in the area before the human plague case, a classic
      early-warning sign used in plague surveillance.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and PEST (Peste) series
      membership. Rodent epizootics are the standard sentinel event plague
      surveillance protocols look for before human cases appear, making an
      epizootic flag a plausible fit for a field literally named "epi_peste".

  EQUINOS:
    official_name: Contato com equinos
    translated_name: Contact with horses
    description: >
      Whether the Brazilian spotted fever (Febre Maculosa) patient had
      contact with horses, a recognized amplifying host for the Amblyomma
      ticks that transmit Rickettsia rickettsii.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and FMAC series
      membership. Horse contact is a documented epidemiological risk factor
      for Brazilian spotted fever, and the field sits among other
      exposure/clinical-sign flags (FOI_MATA, HEMORRAG, HIPEREMIA, LINFADENO)
      confirmed to share this series.

  FEN_HEMORR:
    official_name: Fenômeno Hemorrágico
    translated_name: Hemorrhagic phenomenon
    description: >
      Whether the visceral leishmaniasis patient showed a hemorrhagic
      manifestation (e.g. bleeding gums, epistaxis), a marker of
      severe/complicated disease.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and LEIV series
      membership. "FEN_HEMORR" decomposes directly to "fenômeno hemorrágico",
      and hemorrhagic complications are a recognized severity marker in
      visceral leishmaniasis.

  FOI_MATA:
    official_name: Esteve em área de mata
    translated_name: Was in forest/woodland area
    description: >
      Whether the Brazilian spotted fever patient had been in a
      forest/woodland area before onset, an exposure-history item alongside
      EQUINOS given the disease's tick-vector ecology.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and FMAC series
      membership. "FOI_MATA" reads as "foi à mata" (went to the woods);
      woodland/pasture exposure is the standard risk-history question on
      Brazilian spotted fever investigation forms, alongside animal-contact
      items like EQUINOS.
