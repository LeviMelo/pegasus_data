    code_system: none
    source: inferred
    reasoning: CEN abbreviates central in a block of laboratory routing dates; D(8).
  LAB_DT_NLE:
    official_name: Data de envio ao laboratório de referência nacional
    translated_name: Date sent to the national reference laboratory
    description: >
      Date the specimen reached the national reference laboratory. Intratypic
