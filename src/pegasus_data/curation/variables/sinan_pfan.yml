    code_system: none
    source: inferred
    reasoning: E for envio, numbered 1; D(8) date in the routing block.
  LAB_DT_R1:
    official_name: Data do resultado da primeira amostra
    translated_name: Date of first result
    description: >
      Date the first result was issued. Against the collection date it measures
      the laboratory turnaround the certification standard also monitors.
    code_system: none
    source: inferred
    reasoning: R for resultado, numbered 1; D(8) date.
  LAB_DT_RE1:
    official_name: Data de recebimento do resultado
    translated_name: Date result received
    description: >
      Date the result reached the notifying service, which is later than
      LAB_DT_R1 and is the date the investigation could actually act on.
    code_system: none
    source: inferred
    reasoning: >
      RE1 distinguishes recebimento from the R1 result date; D(8). The pair
