  # ------------------------------------------------- stool virology

  LAB_DT_F1:
    official_name: Data da coleta da primeira amostra de fezes
    translated_name: Date first stool sample collected
    description: >
      Date the first stool sample was taken. The single most important date in
      polio surveillance: two samples within 14 days of onset is the adequacy
      standard, and a case sampled late cannot be discarded on laboratory
      grounds however negative the culture.
    code_system: none
    source: inferred
    reasoning: LAB_ with F for fezes and a D(8) date; the 1 numbers the sample.
  LAB_Q_F:
    official_name: Quantidade da amostra de fezes
    translated_name: Stool sample quantity adequate
    description: >
      Whether enough stool was collected. An undersized sample fails the
      adequacy criteria even when it was taken on time.
    code_system: internal
    source: def
    source_ref: SUFINSUF.CNV
    reasoning: Q for quantidade with the F fezes suffix; C(1) flag.
  LAB_CON_F:
    official_name: Condição de conservação da amostra de fezes
    translated_name: Stool sample cold chain intact
    description: >
      Whether the sample arrived at an adequate temperature or an altered one.
      Poliovirus does not survive a broken cold chain, so a sample that warmed in
      transit yields a false negative and the case cannot be discarded on it.
    code_system: internal
    source: def
    source_ref: TEMPADEQ.CNV
    reasoning: >
      Bound in the catalog to TEMPADEQ, whose two values are temperatura
      adequada and temperatura alterada — a cold-chain check, not a yes/no.
  LAB_RES_F1:
    official_name: Resultado da primeira amostra de fezes
    translated_name: First stool result
    description: >
      Result of virus isolation from the first stool sample: 1, 2 and 3 name the
      poliovirus serotype recovered, 4 is negative, 5 a non-polio enterovirus, 7
      a sample lost in transit. This is the test the whole investigation exists
      to obtain — a serotype here is the difference between a discarded case and
      a national emergency.
    code_system: internal
    source: def
    source_ref: P1P2P3NE.CNV
    reasoning: >
      Bound in the catalog to P1P2P3NE, whose values are P1, P2, P3, Negativo,
      Não pólio, Outros and Perdida — stool virology for poliovirus.
  LAB_RES_F2:
    official_name: Resultado da segunda amostra de fezes
    translated_name: Second stool result
    description: >
      Result from the second stool sample, on the same serotype codelist as
      LAB_RES_F1. Two samples are required because poliovirus is shed
      intermittently and one negative culture does not exclude infection.
    code_system: internal
    source: def
    source_ref: P1P2P3NE.CNV
    reasoning: Same P1P2P3NE binding as LAB_RES_F1, numbered 2.
  LAB_RES_F3:
    official_name: Resultado da terceira amostra de fezes
    translated_name: Third stool result
    description: >
      Result from a third stool sample, on the same serotype codelist. Collected
      when the first two were inadequate or discordant rather than as routine.
    code_system: internal
    source: def
    source_ref: P1P2P3NE.CNV
    reasoning: Same P1P2P3NE binding, numbered 3, beyond the two-sample standard.
  LAB_INTEST:
    official_name: Coleta de conteúdo intestinal
    translated_name: Intestinal content collected
    description: >
      Whether intestinal content was collected rather than a passed stool. The
      fallback when the child has died or cannot produce a sample, since the
      virus is still recoverable from the gut.
    code_system: internal
    source: def
    reasoning: >
      INTEST reads intestinal, in the specimen block; the catalog binds it to
      the SIM_NAO yes/no codelist.

  # ----------------------------------------------------- CSF chemistry

  LAB_DT_L_1:
    official_name: Data da primeira coleta de líquor
    translated_name: Date first CSF sample taken
    description: >
      Date of the first lumbar puncture. CSF findings change over the first
      fortnight, so the date is what makes the cell and protein values
      interpretable.
    code_system: none
    source: inferred
    reasoning: LAB_DT with L for líquor, numbered 1; D(8) date.
  LAB_DT_L_2:
    official_name: Data da segunda coleta de líquor
    translated_name: Date second CSF sample taken
    description: >
      Date of a repeat lumbar puncture. Repeated because the protein rise that
      distinguishes Guillain-Barré often appears only in the second week.
    code_system: none
    source: inferred
    reasoning: Same LAB_DT_L pattern numbered 2.
  LAB_L_CEL1:
    official_name: Celularidade do primeiro líquor
    translated_name: CSF cell count, first sample
    description: >
      White cell count in the first CSF sample. The core of the differential:
      poliomyelitis raises the cell count, while Guillain-Barré leaves it normal
      despite a high protein — the albuminocytological dissociation.
    code_system: none
    source: inferred
    reasoning: L for líquor and CEL for células; N(7) numeric, numbered by sample.
  LAB_L_CEL2:
    official_name: Celularidade do segundo líquor
    translated_name: CSF cell count, second sample
    description: >
      White cell count in the second CSF sample. The fall from the first sample
      is itself informative, since the pleocytosis of poliomyelitis settles
      within days.
    code_system: none
    source: inferred
    reasoning: Same L_CEL pattern numbered 2.
  LAB_L_LIN1:
    official_name: Linfócitos no primeiro líquor
    translated_name: CSF lymphocytes, first sample
    description: >
      Lymphocyte proportion in the first CSF sample. A lymphocytic predominance
      indicates a viral process; a neutrophilic one points to bacterial
      meningitis instead.
    code_system: none
    source: inferred
    reasoning: LIN is linfócitos; N(7) numeric within the líquor block.
  LAB_L_LIN2:
    official_name: Linfócitos no segundo líquor
    translated_name: CSF lymphocytes, second sample
    description: >
      Lymphocyte proportion in the second CSF sample. The shift towards
      lymphocytes over days is characteristic of enteroviral infection.
    code_system: none
    source: inferred
    reasoning: Same L_LIN pattern numbered 2.
  LAB_L_PRO1:
    official_name: Proteínas no primeiro líquor
    translated_name: CSF protein, first sample
    description: >
      Protein concentration in the first CSF sample. Read against LAB_L_CEL1:
      high protein with a normal cell count is the Guillain-Barré pattern and
      the main alternative diagnosis to exclude.
    code_system: none
    source: inferred
    reasoning: PRO is proteínas; N(7) numeric within the líquor block.
  LAB_L_PRO2:
    official_name: Proteínas no segundo líquor
    translated_name: CSF protein, second sample
    description: >
      Protein in the second CSF sample. The rise between samples is what
      confirms Guillain-Barré when the first puncture was done too early.
    code_system: none
    source: inferred
    reasoning: Same L_PRO pattern numbered 2.
  LAB_L_GLI1:
    official_name: Glicose no primeiro líquor
    translated_name: CSF glucose, first sample
    description: >
      Glucose in the first CSF sample. Normal in viral processes and low in
      bacterial or tuberculous meningitis, so it is the field that rules those
      out rather than ruling polio in.
    code_system: none
    source: inferred
    reasoning: GLI is glicose; N(7) numeric within the líquor block.
  LAB_L_GLI2:
    official_name: Glicose no segundo líquor
    translated_name: CSF glucose, second sample
    description: Glucose in the second CSF sample; the comparator for LAB_L_GLI1.
    code_system: none
    source: inferred
    reasoning: Same L_GLI pattern numbered 2.
  LAB_L_CL1:
    official_name: Cloretos no primeiro líquor
    translated_name: CSF chloride, first sample
    description: >
      Chloride in the first CSF sample. A traditional part of the Brazilian CSF
      panel, low in tuberculous meningitis, and reported here mainly to complete
      that panel.
    code_system: none
    source: inferred
    reasoning: CL is cloretos; N(7) numeric completing the líquor panel.
  LAB_L_CL2:
    official_name: Cloretos no segundo líquor
    translated_name: CSF chloride, second sample
    description: Chloride in the second CSF sample; the comparator for LAB_L_CL1.
    code_system: none
    source: inferred
    reasoning: Same L_CL pattern numbered 2.
  LAB_CELEBR:
    official_name: Coleta de tecido cerebral
    translated_name: Brain tissue collected
    description: >
      Whether brain tissue was collected, which happens only at autopsy. Recorded
      because a fatal case is the one where confirming or excluding poliovirus
      matters most and the usual specimens are no longer obtainable.
    code_system: internal
    source: def
    reasoning: >
      CELEBR is a misspelling of cerebral, in a specimen block beside LAB_MEDULA
      and LAB_INTEST, and bound to SIM_NAO. The typo is in the column name as
      DATASUS published it.
  LAB_MEDULA:
    official_name: Coleta de medula espinhal
    translated_name: Spinal cord tissue collected
    description: >
      Whether spinal cord tissue was collected. The anterior horn of the cord is
      where poliovirus destroys motor neurons, so it is the definitive post
      mortem specimen.
    code_system: internal
    source: def
    reasoning: >
      MEDULA is the spinal cord, beside the other autopsy specimens, and bound
      to SIM_NAO.

  # ----------------------------------------- other laboratory dates and text

  LAB_DT_C1:
    official_name: Data da primeira coleta
    translated_name: Date of first collection
    description: >
      Collection date for the first specimen of the general laboratory block,
