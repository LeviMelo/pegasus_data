  LAB_E_D_1:
    official_name: Especificação do exame
    translated_name: Examination detail
    description: >
      Free text naming a test not covered by the coded fields. Thirty characters
      of uncontrolled vocabulary, so it must be read case by case and never
      grouped as though it were a code.
    code_system: none
    source: inferred
    reasoning: C(30) free text in the laboratory block, the only wide text field there.

  # -------------------------------------------------------- classification

  CON_DESCAR:
    official_name: Motivo do descarte
    translated_name: Reason the case was discarded
    description: >
      The alternative diagnosis the case was discarded to, as a CID-10 code from
      a 40-entry list: Guillain-Barré (G610), acute transverse myelitis (G373),
      neuralgic amyotrophy (G122), post-immunisation encephalitis (G040) and the
      rest of the differential. Almost every notification is discarded — that is
      the design, since the system deliberately casts wide — so this field, not
      the diagnosis, is what most rows actually carry.
    code_system: internal
    source: def
    source_ref: DIAGNOS.CNV
    reasoning: >
      Bound in the catalog to DIAGNOS, 40 CID-10 codes covering the causes of
      acute flaccid paralysis other than poliomyelitis.
