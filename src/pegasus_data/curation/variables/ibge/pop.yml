# IBGE.POP — Resident population
# População Residente
#
# Resident population by municipality — the denominator for most rates
# computed against the health systems.
system: IBGE
asserted_by: pegasus_data

variables:
  COD_MUN:
    translated_name: Municipality code (7-digit)
    description: '7-digit IBGE municipality code, including the verification digit,
      used by newer wide population-estimate tables in place of the 6-digit MUNIC_RES/
      MUNCOD form.

      '
    code_system: external
    codelist: BR_MUNICIPALFA
    source: def
    source_ref: 'TabWin DEF POPSVSBR.DEF ''População Residente - Estudo de Estimativas
      Populacionais por Município, Idade e Sexo 2000-2024'' (DATASUS TAB_POP kit) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/IBGE/Auxiliar/TAB_POP.zip, lines
      ''LMunicípio, COD_MUN, 1, CNV\br_municip.cnv'' (and region/UF/health-region axes
      on COD_MUN)'
    asserted_by: pegasus_data
  FXETARIA:
    official_name: Faixa Etária detalhada
    translated_name: Detailed age band
    description: '4-digit age-band code: 0000 = under 1 year, individual single years
      through 19, 5-year bands from 20 onward (2024 = 20 a 24 anos), 8099 = 80 anos
      ou mais, I000 = idade ignorada.

      '
    code_system: internal
    source: layout_doc
    source_ref: tabnet.datasus.gov.br/cgi/Ibge/popdescr.htm
  MUNIC_RES:
    official_name: código do município
    translated_name: Municipality of residence
    description: '6-digit IBGE municipality code, without the verification digit, identifying
      where the tallied population resides — the geography key of the population table''s
      rows.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: tabnet.datasus.gov.br/cgi/Ibge/popdescr.htm
  POP:
    translated_name: Resident population
    description: 'Estimated resident population of the row''s cell — municipality
      (COD_MUN), sex, age (IDADE) and year (ANO) — in the SVS population-estimate files,
      which are published one file per year (POP<yy>.dbf). It is a single count column,
      not one column per year.'
    code_system: none
    source: def
    source_ref: 'TabWin DEF POPSVSBR.DEF ''População Residente - Estudo de Estimativas
      Populacionais por Município, Idade e Sexo 2000-2024'' (DATASUS TAB_POP kit) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/IBGE/Auxiliar/TAB_POP.zip, line
      ''EPopulação residente, POP, ANO, Ano'' over files IBGE\bases\PopSVS\POP??.dbf'
    asserted_by: pegasus_data
