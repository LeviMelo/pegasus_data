system: SINAN
asserted_by: pegasus_data
variables:

  CHOQUE:
    official_name: Choque/Hipotensão
    translated_name: Shock/hypotension sign
    description: >
      Whether the patient presented shock or hypotension, a systemic sign of
      severe illness: 1-Sim, 2-Não, 9-Ignorado. Field on the febre maculosa
      notification form, reused on the pre-2007 dengue form for the same sign.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Maculosa_v5.pdf, campo 33 (Choque/Hipotensão)

  CLASSATUAL:
    official_name: Classificação operacional atual
    translated_name: Current operational classification (leprosy)
    description: >
      Current operational classification of the leprosy case, used to pick
      the treatment scheme: 1-PB paucibacilar, 2-MB multibacilar. Seeded from
      the diagnosis classification but updatable during follow-up visits.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 12 (Tela de Acompanhamento, Classificação operacional atual)

  CLASSOPERA:
    official_name: Classificação Operacional
    translated_name: Operational classification at diagnosis (leprosy)
    description: >
      Operational classification of the leprosy case at diagnosis, used to
      select the multidrug therapy scheme: 1-PB paucibacilar, 2-MB
      multibacilar. Distinct from CLASSATUAL, which tracks it during follow-up.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 35 (Classificação Operacional)

  CLAS_FORMA:
    official_name: Forma Clínica
    translated_name: Clinical form (leishmaniasis)
    description: >
      Clinical form established for a tegumentary leishmaniasis case:
      1-Cutânea (skin ulcer), 2-Mucosa (destructive nose/mouth/throat
      lesion), 9-Ignorada. Auto-filled from CLI_CUTANE/CLI_MUCOSA, mucosa wins.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LTA_v5.pdf, campo 40 (Forma Clínica)

  CLINC_CHIK:
    official_name: Apresentação clínica Chikungunya
    translated_name: Chikungunya clinical presentation
    description: >
      Clinical presentation of a confirmed chikungunya case: 1-Aguda (acute,
      active joint pain), 2-Crônica (chronic, symptoms persisting past the
      acute phase). Recorded only once lab or clinical-epi confirmation is set.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 64 (Apresentação clínica Chikungunya)

  CLI_CICATR:
    official_name: Presença de cicatrizes cutâneas
    translated_name: Cutaneous scarring present (leishmaniasis)
    description: >
      Whether cutaneous scarring is present alongside a mucosal lesion in a
      leishmaniasis case, suggesting an earlier untreated skin lesion that
      preceded the mucosal spread. 1-Sim, 2-Não; only asked when CLI_MUCOSA=1.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LTA_v5.pdf, campo 34 (presença de cicatrizes cutâneas)
    depends_on: [CLI_MUCOSA]

  CLI_CUTANE:
    official_name: Presença de lesão Cutânea
    translated_name: Cutaneous lesion present (leishmaniasis)
    description: >
      Whether the patient has a cutaneous (skin) leishmaniasis lesion,
      typically a painless round ulcer with raised borders: 1-Sim, 2-Não. At
      least one of CLI_CUTANE or CLI_MUCOSA must be Sim for a valid LTA case.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LTA_v5.pdf, campo 33 (Presença de lesão Cutânea)

  CLI_MUCOSA:
    official_name: Presença de lesão mucosa
    translated_name: Mucosal lesion present (leishmaniasis)
    description: >
      Whether the patient has a mucosal leishmaniasis lesion, a destructive
      process usually in the nose, mouth, or throat: 1-Sim, 2-Não. Marking
      Sim auto-sets CLAS_FORMA to 2 (Mucosa) regardless of the skin field.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LTA_v5.pdf, campo 33 (Presença de lesão mucosa)

  CONJUNTVIT:
    official_name: Sinais clínicos - Conjuntivite
    translated_name: Conjunctivitis sign
    description: >
      Whether the patient showed conjunctivitis (red, inflamed eyes) during a
      dengue or chikungunya episode: 1-Sim, 2-Não. One item on the shared
      signs/symptoms checklist collected for both diseases on one form.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 33 (Sinais clínicos - Conjuntivite)

  CONTEXAM:
    official_name: Número de contatos examinados
    translated_name: Contacts examined (leprosy)
    description: >
      Count of the leprosy patient's household contacts who actually
      underwent a dermatoneurological exam, capped at the number recorded in
      CONTREG. Used to monitor how much contact tracing was completed.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 18 (Número de contatos examinados)
    depends_on: [CONTREG]

  CONTREG:
    official_name: Número de contatos registrados
    translated_name: Contacts registered (leprosy)
    description: >
      Count of people who lived, or had lived, with the leprosy patient
      during the five years before diagnosis: the household contacts flagged
      as needing dermatoneurological examination for the disease.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 43 (Número de contatos registrados)

  CONTROLE:
    official_name: Existência de controle sorológico na Unidade de Hemoterapia
    translated_name: Blood-bank serological screening existed
    description: >
      Whether the blood/hemoderivative unit the Chagas patient used performs
      serological screening of donors for T. cruzi: 1-Sim, 2-Não, 3-Não se
      aplica, 9-Ignorado. Only asked when a transfusion history is reported.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 37 (Existência de controle sorológico na Unidade de Hemoterapia)

  CON_PROVAV:
    official_name: Modo Provável da Infecção
    translated_name: Probable Chagas transmission route
    description: >
      Probable route by which a confirmed Chagas case was infected:
      1-transfusional, 2-vetorial (triatomine bug), 3-transplacentária,
      4-acidental (lab exposure), 5-oral (contaminated food), 6-outra, 9-ignorada.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 61 (Modo Provável da Infecção)

  DOR_COSTAS:
    official_name: Sinais clínicos - Dor nas costas
    translated_name: Back pain sign
    description: >
      Whether the patient reported back pain during a dengue or chikungunya
      episode: 1-Sim, 2-Não. One item on the shared signs/symptoms checklist
      collected for both diseases on the combined notification form.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 33 (Sinais clínicos - Dor nas costas)

  DOR_RETRO:
    official_name: Sinais clínicos - Dor retroorbital
    translated_name: Retro-orbital pain sign
    description: >
      Whether the patient reported retro-orbital pain, pain felt behind the
      eyes, during a dengue or chikungunya episode: 1-Sim, 2-Não. A classic
      dengue symptom kept on the shared checklist for both diseases.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 33 (Sinais clínicos - Dor retroorbital)

  DOSE_RECEB:
    official_name: Número de doses supervisionadas
    translated_name: Supervised doses received (leprosy)
    description: >
      Number of directly-observed multidrug-therapy doses the leprosy
      patient has actually received under supervision, tracked during
      follow-up rather than the number of doses merely prescribed.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 15 (Número de doses supervisionadas)

  DTALTA_N:
    official_name: Data da alta
    translated_name: Discharge date (leprosy)
    description: >
      Date the leprosy patient was discharged from treatment, whether by
      cure, transfer, death, or abandonment (the type is recorded in
      TPALTA_N); required whenever a discharge type has been entered.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 20 (Data da alta)
    depends_on: [TPALTA_N]

  DTINICTRAT:
    official_name: Data do início do tratamento
    translated_name: Treatment start date (leprosy)
    description: >
      Date the patient began multidrug therapy for leprosy, required to fall
      on or after the diagnosis date. Its first entry auto-seeds the
      follow-up field DTULTCOMP, Date of the last health-unit visit.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 41 (Data do início do tratamento)

  DTMUDESQ:
    official_name: Data de mudança do Esquema
    translated_name: Treatment-scheme change date (leprosy)
    description: >
      Date the leprosy patient's multidrug therapy scheme was changed, for
      example switched between paucibacillar and multibacillar regimens or
      to a substitute drug; filled only when such a change occurred.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 17 (Data de mudança do Esquema)

  DTULTCOMP:
    official_name: Data do último comparecimento
    translated_name: Last follow-up visit date (leprosy)
    description: >
      Date of the leprosy patient's most recent visit to the health unit, or
      contact with a health agent, during treatment follow-up; must fall on
      or after the treatment start date, DTINICTRAT.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 11 (Tela de Acompanhamento, Data do último comparecimento)
    depends_on: [DTINICTRAT]

  DT_ALRM:
    official_name: Dengue com sinais de alarme - Data de início dos sintomas
    translated_name: Dengue warning-sign onset date
    description: >
      Date the first dengue warning sign appeared, such as hypotension,
      plasma leakage, or persistent vomiting. Recorded only when the case is
      classified as dengue with warning signs or as severe dengue.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 69 (Dengue com sinais de alarme, Data de início dos sintomas)

  DT_CHIK_S1:
    official_name: Exame sorológico (IgM) Chikungunya Soro 1 - Data da Coleta
    translated_name: Chikungunya IgM first-sample collection date
    description: >
      Date blood was drawn for the first IgM serology sample testing for
      chikungunya, required to fall on or after the date of first symptoms.
      The second draw's date is recorded separately as DT_CHIK_S2.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 35 (Exame sorológico IgM Chikungunya Soro 1, Data da Coleta)

  DT_CHIK_S2:
    official_name: Exame sorológico (IgM) Chikungunya Soro 2 - Data da Coleta
    translated_name: Chikungunya IgM second-sample collection date
    description: >
      Date blood was drawn for the second, follow-up IgM serology sample
      testing for chikungunya, required to be later than the first sample's
      collection date recorded in DT_CHIK_S1.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 36 (Exame sorológico IgM Chikungunya Soro 2, Data da Coleta)
    depends_on: [DT_CHIK_S1]

  DT_GRAV:
    official_name: Dengue grave - Data de início dos sintomas
    translated_name: Severe dengue onset date
    description: >
      Date the first sign of severe dengue appeared, such as shock, severe
      bleeding, or organ impairment. Recorded only when the case is
      classified as dengue grave with laboratory or clinical-epi confirmation.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 71 (Dengue grave, Data de início dos sintomas)

  DT_PRNT:
    official_name: Exame PRNT - Data da Coleta
    translated_name: PRNT sample collection date
    description: >
      Date blood was drawn for the PRNT (plaque reduction neutralization
      test) sample, used to confirm chikungunya; enabled only when the
      notified suspicion on the form is chikungunya rather than dengue.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 37 (Exame PRNT, Data da Coleta)
