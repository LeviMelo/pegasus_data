system: SINAN
asserted_by: pegasus_data
variables:
  TRA_MUNICI:
    official_name: Município onde se realiza o tratamento
    translated_name: Treatment municipality
    description: >
      IBGE code of the municipality where the patient is undergoing treatment
      for the confirmed disease — antiretroviral care for AIDS, or hospital
      care for hantavirose — separate from the residence municipality
      captured earlier on the form.
    code_system: external
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 45; DIC_DADOS_Hantavirose_v5.pdf, campo 50
  TRA_UF:
    official_name: UF onde se realiza o tratamento
    translated_name: Treatment state
    description: >
      Abbreviation of the state where the patient is being treated — the
      hospital's state for a Hantavirose admission, or the clinic's state for
      ongoing AIDS antiretroviral care — not the state of residence.
    code_system: external
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 44; DIC_DADOS_Hantavirose_v5.pdf, campo 49
  ANT_ACIDEN:
    official_name: Acidente com material biológico com posterior soroconversão até 6 meses
    translated_name: Occupational biological-material accident with seroconversion
    description: >
      Whether the patient's probable route of HIV infection was a workplace
      accident involving biological material — a needlestick or similar
      exposure — followed by seroconversion within six months. 1=Sim,
      2=Não, 9=Ignorado.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 34
  LAB_TRIAGE:
    official_name: Evidência laboratorial de infecção pelo HIV (Teste de triagem)
    translated_name: HIV screening test result
    description: >
      Result of the patient's first-line HIV screening test: 1=Positivo/Reagente,
      2=Negativo, 3=Inconclusivo, 4=Não realizado, 9=Ignorado. A reactive result
      triggers the confirmatory test recorded in a separate field.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 40
  TPRAPIDO1:
    official_name: Teste rápido 1
    translated_name: Rapid HIV test 1
    description: >
      Result of the first of up to three rapid HIV tests, an alternative
      diagnostic path to the lab-based screening/confirmatory pair; a reactive
      result alone can establish the diagnosis. 1=Positivo, 2=Negativo,
      3=Inconclusivo, 4=Não realizado, 9=Ignorado.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 40
  TPRAPIDO2:
    official_name: Teste rápido 2
    translated_name: Rapid HIV test 2
    description: >
      Result of a second rapid HIV test, run with a different reagent to
      corroborate TPRAPIDO1 under Brazil's two-test rapid algorithm; same
      value scale as TPRAPIDO1.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 40
  TPRAPIDO3:
    official_name: Teste rápido 3
    translated_name: Rapid HIV test 3
    description: >
      Result of a third rapid HIV test, performed only as a tiebreaker when
      TPRAPIDO1 and TPRAPIDO2 disagree; same value scale as the first two.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 40
  AGENTE:
    official_name: Agente
    translated_name: Injuring instrument
    description: >
      The sharp or piercing object that caused a health worker's occupational
      exposure to biological material — hollow needle, solid needle,
      intracath, broken glass, blade/lancet, or other — not the pathogen
      involved.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 49
  OUTRO:
    official_name: Outro (Exames Realizados - Parasitológico Direto)
    translated_name: Other direct-parasitology result
    description: >
      Result of an extra, unnamed direct parasitological method used beyond
      the fresh exam and Strout/microhematocrit tests to look for
      Trypanosoma cruzi in a Chagas disease case: 1=positivo, 2=negativo,
      3=não realizado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 43
  OUTROS:
    official_name: Outros
    translated_name: Other stool-exam result
    description: >
      Result of a parasitological stool exam for schistosomiasis beyond the
      standard Kato-Katz egg-detection method and Hoffman sedimentation test
      named in the two preceding fields: 1=Positivo, 2=Negativo, 3=Não
      realizado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Esquistossomose_v5.pdf, campo 36
  OUTRAS:
    official_name: Drogas - Outras
    translated_name: Non-standard TB drug used
    description: >
      Whether the tuberculosis patient's regimen included a drug beyond the
      six first-line drugs itemized just before it (rifampicin, isoniazid,
      pyrazinamide, ethambutol, streptomycin, ethionamide). 1=Sim, 2=Não; Sim
      opens a free-text field naming it.
    code_system: internal
    source: layout_doc
    source_ref: DICIONARIO DE DADOS - SINAN NET - VERSAO 4.0 (Tuberculose), campo 47
  DROGA:
    official_name: Droga utilizada no tratamento específico
    translated_name: Chagas drug used
    description: >
      The antiparasitic drug prescribed for confirmed Chagas disease's
      specific treatment: 1=benznidazol, 2=outro. Distinct from
      Leishmaniose's own drug field, which names antimonial, amphotericin B,
      or pentamidine.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 54
  TRA_PESO:
    official_name: Peso
    translated_name: Patient weight (kg)
    description: >
      The leishmaniasis patient's body weight in kilograms, recorded only
      when meglumine antimoniate is the chosen initial drug, because the
      prescribed mg/kg/day dose and total ampoule count are calculated from
      it.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_LTA_v5.pdf, campo 43
  CON_AMBIEN:
    official_name: Ambiente da infecção
    translated_name: Setting of infection
    description: >
      Where the confirmed Hantavirose or Leptospirose patient most likely
      picked up the infection: 1=Domiciliar, 2=Trabalho, 3=Lazer, 4=Outro,
      9=Ignorado. Filled in only once the case is laboratory-confirmed.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 63; DIC_DADOS_Leptospirose_v5.pdf, campo 70
  DT_COLETA:
    official_name: Data da coleta
    translated_name: Sample collection date
    description: >
      The date a laboratory specimen was drawn from the patient for the test
      named in the neighboring field — blood, stool or serum depending on
      the disease form it appears in.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      SINAN's naming grammar pairs a dt_coleta_<test> field immediately
      before its matching lab-result field in every disease dictionary
      reviewed (AIDS, Chagas, Hantavirose, Leptospirose, LTA); DT_ = data and
      coleta = sample collection are two of its most regular tokens.
  ANT_DT_INV:
    official_name: Data da investigação (bloco de conclusão legado)
    translated_name: Original investigation start date
    description: >
      The date a case investigation began, recorded under this discontinued
      2000-2006 field name shared by several diseases before SINAN NET's
      2006-2007 reform gave each disease its own DT_INVEST field.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Appears only in CHAG, DENG, LEIV, LEPT, LTAN and MALA in 2000-2006,
      alongside CON_CLASSI/CON_DOENCA/CON_DT_ENC/CON_DT_OBI/CON_EVOLUC — the
      same discontinued set. Every later per-disease dictionary reviewed
      places an equivalent DT_INVEST field right after the notification
      block, matching ANT_'s prior-record naming pattern.
  CON_CLASSI:
    official_name: Classificação (bloco de conclusão legado)
    translated_name: Final case classification (legacy)
    description: >
      The investigation's concluding classification of the case, recorded
      under this discontinued 2000-2006 field name — predecessor to the
      CLASSI_FIN field (Confirmado/Descartado) present in every later
      per-disease SINAN NET dictionary.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Shares the identical 2000-2006 CHAG/DENG/LEIV/LEPT/LTAN/MALA series
      footprint as five CON_/ANT_ siblings; CLASSI_FIN plays this exact
      role — final Confirmado/Descartado classification — in every
      current-generation dictionary checked (AIDS, Chagas, Meningite, LTA,
      Hantavirose, Leptospirose).
  CON_DOENCA:
    official_name: Doença (bloco de conclusão legado)
    translated_name: Final diagnosed disease (legacy)
    description: >
      The disease the investigation actually concluded the patient had,
      letting a case first notified under one suspected agravo be closed out
      under a different one within this shared legacy conclusion block.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Grouped with CON_CLASSI/CON_EVOLUC/ANT_DT_INV under the identical
      2000-2006 CHAG/DENG/LEIV/LEPT/LTAN/MALA footprint; naming it "doença"
      alongside a classification and outcome field fits the same
      reclassification-on-closure pattern seen in CO_CID_DIAGNOSTICO in the
      outbreak-investigation dictionary. No evidence pins its coding to
      CID-10 specifically, hence code_system none rather than external.
  CON_DT_ENC:
    official_name: Data de encerramento (bloco de conclusão legado)
    translated_name: Final case-closure date (legacy)
    description: >
      The date this legacy conclusion block closed the case out, playing the
      same role DT_ENCERRA fills in every later per-disease SINAN NET
      investigation form.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Same 2000-2006 CHAG/DENG/LEIV/LEPT/LTAN/MALA series footprint as its
      CON_/ANT_ siblings; DT_ENCERRA is the closure-date field observed
      filling this role in every current dictionary reviewed (AIDS, Chagas,
      Esquistossomose, Hantavirose, Leptospirose, LTA, Meningite).
  CON_DT_OBI:
    official_name: Data do óbito (bloco de conclusão legado)
    translated_name: Final recorded death date (legacy)
    description: >
      The date of death as recorded in this legacy 2000-2006 conclusion
      block, predecessor to the DT_OBITO field that plays the same role in
      every later per-disease SINAN NET form.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Same 2000-2006 series footprint as CON_CLASSI and CON_EVOLUC; DT_OBITO
      is the death-date field observed in this exact role across every
      current dictionary checked, always paired with an outcome field the
      way this one is paired with CON_EVOLUC.
  CON_EVOLUC:
    official_name: Evolução (bloco de conclusão legado)
    translated_name: Final case outcome (legacy)
    description: >
      The concluding outcome of the case — cure, death, or other — recorded
      in this legacy 2000-2006 block, predecessor to the EVOLUCAO field used
      in every later per-disease SINAN NET form.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Same 2000-2006 CHAG/DENG/LEIV/LEPT/LTAN/MALA footprint as its five
      CON_/ANT_ siblings; EVOLUCAO is the outcome field (cure/death/other, an
      internal code) observed filling this exact role in every current
      dictionary reviewed.
