system: SINAN
asserted_by: pegasus_data

variables:

  ANO:
    official_name: Ano
    translated_name: Year
    description: >
      Four-digit epidemiological year associated with this dengue record,
      used to group cases by season/year independently of the full
      notification date fields.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is DENG (dengue); name reads "ano" and C4 width matches a
      4-digit year rather than a full date.

  DT_COL_PL2:
    official_name: Data da 2ª coleta de plaquetas
    translated_name: Date of second platelet count
    description: >
      Date of the second platelet-count blood draw for a dengue patient,
      used to track the falling platelet trend that signals progression to
      severe dengue. Distinct from DT_SORO2, the paired serology sample date.
    code_system: none
    source: inferred
    reasoning: >
      DENG form; DT_COL reads "data coleta" and PL2 reads "plaquetas 2"; D8
      width fits a clinical monitoring date, paired conceptually with
      DT_SORO2 but tracking a different lab value.

  DT_SORO2:
    official_name: Data da 2ª sorologia
    translated_name: Date of second serology sample
    description: >
      Collection date of the second (convalescent-phase) dengue serology
      sample, paired with an earlier acute-phase sample to confirm infection
      by rising antibody titer.
    code_system: none
    source: inferred
    reasoning: >
      DENG form; SORO2 reads "sorologia 2"; D8 width fits a date, and pairs
      with S2_TIT1, the titer result from this same sample.

  OUTRO_S:
    official_name: Outro sinal/sintoma
    translated_name: Other sign/symptom
    description: >
      Flag for an additional dengue sign or symptom present that isn't
      covered by the form's named clinical-signs fields (e.g. PLEURAL).
    code_system: none
    source: inferred
    reasoning: >
      DENG form; OUTRO_S reads "outro s[inal/intoma]"; C1 width fits a coded
      yes/no flag alongside the form's other named sign checkboxes.

  PLEURAL:
    official_name: Derrame pleural
    translated_name: Pleural effusion
    description: >
      Clinical-signs checklist item marking pleural effusion, a warning sign
      of plasma leakage that flags progression toward severe dengue.
    code_system: none
    source: inferred
    reasoning: >
      DENG form; name reads "derrame pleural" directly; C1 width matches the
      coded sign-checklist pattern used elsewhere on the dengue form.

  RESUL_OUT:
    official_name: Resultado de outro exame
    translated_name: Other test result
    description: >
      Result of an additional dengue-related laboratory test not captured by
      the form's named result fields — a catch-all lab-result slot.
    code_system: none
    source: inferred
    reasoning: >
      DENG form; RESUL_OUT reads "resultado outro"; C1 width fits a coded
      result flag, the same catch-all pattern seen elsewhere (e.g. LAB_OUTRO
      on the hantavirus form).

  S2_TIT1:
    official_name: Título da 2ª sorologia
    translated_name: Second serology titer
    description: >
      Antibody titer from the second (convalescent-phase) dengue serology
      sample, collected on the date recorded in DT_SORO2.
    code_system: none
    source: inferred
    reasoning: >
      DENG form; S2 reads "sorologia 2" and TIT1 reads "título"; C4 width
      fits a short numeric titer value, and it pairs directly with DT_SORO2.

  ACONDIC:
    official_name: Acondicionamento da vacina
    translated_name: Vaccine storage/packaging condition
    description: >
      Coded assessment of how the vaccine dose was stored and packaged
      (cold-chain condition) at the time of administration, recorded when
      investigating a suspected vaccine problem or adverse event.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is ROTA; this and its siblings (VOP_VORH, LOTE2, LAB_PROD2)
      read as an oral-vaccine (polio/rotavirus) batch-investigation form
      rather than a disease-case form; name reads "acondicionamento".

  BACTERIA:
    official_name: Contaminação bacteriana
    translated_name: Bacterial contamination
    description: >
      Flag for whether bacterial contamination was found or suspected in the
      vaccine dose under investigation, part of the vaccine-quality
      assessment alongside ACONDIC.
    code_system: none
    source: inferred
    reasoning: >
      ROTA (oral-vaccine investigation) form; name reads "bactéria"; C1
      width fits a coded yes/no contamination flag.

  LAB_PROD2:
    official_name: Laboratório produtor 2
    translated_name: Second manufacturer/lab
    description: >
      Name or code of a second vaccine manufacturer/laboratory referenced in
      the investigation, when more than one product or lot is implicated.
    code_system: none
    source: inferred
    reasoning: >
      ROTA form; LAB_PROD reads "laboratório produtor"; C15 width fits a
      manufacturer name/code, paired with LOTE2 for the corresponding batch.

  LOTE2:
    official_name: Lote 2
    translated_name: Second batch/lot number
    description: >
      Batch or lot number of a second vaccine dose or product referenced in
      the investigation, paired with LAB_PROD2's manufacturer for that lot.
    code_system: none
    source: inferred
    reasoning: >
      ROTA form; name reads "lote 2"; C10 width fits an alphanumeric batch
      number.

  NOME_VIRUS:
    official_name: Nome do vírus/cepa vacinal
    translated_name: Virus/vaccine strain name
    description: >
      Name of the virus or vaccine strain involved in the investigation
      (e.g. the specific oral rotavirus or polio vaccine strain).
    code_system: none
    source: inferred
    reasoning: >
      ROTA form; name reads "nome do vírus"; C10 width fits a short strain
      name/code, consistent with the vaccine-batch context of sibling fields.

  VOP_VORH:
    official_name: Tipo de vacina oral (VOP/VORH)
    translated_name: Oral vaccine type (OPV/rotavirus)
    description: >
      Coded flag distinguishing which oral vaccine is implicated in the
      investigation — VOP (oral polio vaccine) or VORH (oral rotavirus
      vaccine).
    code_system: none
    source: inferred
    reasoning: >
      ROTA form; name directly concatenates the two oral-vaccine
      abbreviations VOP and VORH; C1 width fits a two-way coded flag.

  CS_BUSCAAT:
    official_name: Busca ativa realizada
    translated_name: Active case search performed
    description: >
      Whether active case-finding (busca ativa) was carried out for this
      neonatal tetanus case, standard practice given how underreported the
      disease is in areas with poor birth-registration coverage.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is TETN (tétano neonatal); CS_ characteristic prefix with
      BUSCAAT reading "busca ativa"; C1 width fits a coded yes/no flag.

  CS_NASCIDO:
    official_name: Local de nascimento
    translated_name: Birth setting
    description: >
      Coded setting where the baby was born (e.g. hospital versus home
      delivery), a key risk factor for neonatal tetanus since unsanitary
      umbilical cord care during home births is the classic transmission
      route.
    code_system: none
    source: inferred
    reasoning: >
      TETN form; CS_NASCIDO reads "característica - nascido"; C1 width fits
      a small enumerated birth-setting code.

  CS_VACTETA:
    official_name: Mãe vacinada contra tétano
    translated_name: Mother vaccinated against tetanus
    description: >
      Whether the mother received tetanus toxoid vaccination before or
      during pregnancy, the primary measure that prevents neonatal tetanus
      by passive antibody transfer to the newborn.
    code_system: none
    source: inferred
    reasoning: >
      TETN form; CS_VACTETA reads "característica - vacinação tetânica"; C1
      width fits a coded yes/no immunization flag.

  ESCOLMAE_N:
    official_name: Escolaridade da mãe (código numérico)
    translated_name: Mother's education level (numeric code)
    description: >
      Mother's education level recorded on the neonatal tetanus form as a
      short numeric code, distinct from any text-labeled schooling field
      used elsewhere in SINAN.
    code_system: none
    source: inferred
    reasoning: >
      TETN form; ESCOLMAE reads "escolaridade da mãe"; the _N suffix and C2
      width indicate a numeric-coded variant of the schooling field.

  NO_OUTRAS:
    official_name: Nome de outras informações
    translated_name: Other information (free text)
    description: >
      Free-text field for naming an additional detail on the neonatal
      tetanus form not captured by the standard coded fields (e.g. another
      risk factor or birth attendant).
    code_system: none
    source: inferred
    reasoning: >
      TETN form; NO_ reads "nome" and OUTRAS reads "outras"; C30 width fits
      a free-text "other, specify" field.

  STSORORES:
    official_name: Situação do resultado sorológico
    translated_name: Serology result status
    description: >
      Status of the botulism serology/toxin-antibody test result
      (e.g. pending, reactive, non-reactive), part of the laboratory
      confirmation section of the form.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is BOTU (botulismo); ST_SORO_RES reads "situação sorologia
      resultado"; C1 width fits a coded status.

  STVISAO:
    official_name: Alteração visual
    translated_name: Visual disturbance
    description: >
      Clinical-signs checklist item marking visual disturbance (blurred or
      double vision), an early symptom of botulism from the cranial-nerve
      palsies the toxin causes.
    code_system: none
    source: inferred
    reasoning: >
      BOTU form; ST_VISAO reads "situação - visão"; C1 width fits a coded
      sign checkbox in the botulism clinical-signs section.

  ST_ALI2RES:
    official_name: Resultado do 2º alimento
    translated_name: Second food sample result
    description: >
      Result status of laboratory testing on a second suspect food sample in
      a foodborne botulism investigation (commonly home-canned or preserved
      foods).
    code_system: none
    source: inferred
    reasoning: >
      BOTU form; ST_ALI2RES reads "situação alimento 2 resultado"; C1 width
      fits a coded result status, numbered as the second of possibly several
      food samples.

  TPSOROTOX:
    official_name: Tipo de sorotoxina
    translated_name: Botulinum toxin serotype
    description: >
      Botulinum toxin serotype (A, B, E, etc.) identified in laboratory
      testing of the causative agent, determining which antitoxin is
      appropriate for treatment.
    code_system: none
    source: inferred
    reasoning: >
      BOTU form; TP_SOROTOX reads "tipo sorotoxina"; C1 width fits a small
      enumerated serotype code.
