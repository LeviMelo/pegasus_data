system: SINAN
asserted_by: pegasus_data

variables:
  # --- HIVG (HIV in pregnant women) ---
  PAR_ANTIDU:
    official_name: Parceiro em uso de antirretroviral
    translated_name: Partner on antiretroviral therapy (flag)
    description: >
      Whether the pregnant woman's sexual partner was on antiretroviral
      therapy at the time of her HIV diagnosis - part of the partner-status
      block (PAR_TIPO, PAR_EVOLUC) that parallels the mother's own prenatal
      ARV field, PRE_ANTRET.
    code_system: none
    source: inferred
    reasoning: PAR_ = parceiro; the form's PRE_ANTRET (mother's prenatal ARV use) gives a direct parallel for reading ANTIDU as antirretroviral-related.

  PAR_UFPART:
    official_name: UF do parceiro
    translated_name: State (UF) associated with the partner
    description: >
      State associated with the sexual partner recorded on the HIV-in-
      pregnancy notification (e.g. where he was tested or resides) -
      distinct from the mother's own UF fields.
    code_system: none
    source: inferred
    reasoning: PAR_ = parceiro; UFPART = UF + parceiro; HIVG's partner-detail block.

  # --- NTRA (trachoma batch/lot surveillance) ---
  NU_LOTE:
    official_name: Número do lote
    translated_name: Screening batch/lot number
    description: >
      Sequential batch (lote) number for a group of individuals - typically
      students at one school - examined together in a trachoma active-search
      screening round, distinct from a case-level notification number.
    code_system: none
    source: inferred
    reasoning: >
      NTRA's schema carries NU_CASOEXA (cases examined) and NU_CASOPOS
      (cases positive) alongside NU_LOTE/NU_LOTE_H/NU_LOTE_V, consistent
      with aggregate trachoma school-screening surveillance rather than
      individual case notification.

  NU_SEMA_EP:
    official_name: Semana epidemiológica
    translated_name: Epidemiological week
    description: >
      Epidemiological week in which this trachoma screening batch's results
      were recorded/notified - the standard SINAN time-unit field applied
      to this aggregate surveillance series.
    code_system: none
    source: inferred
    reasoning: NU_SEMA_EP = número da semana epidemiológica; standard SINAN aggregate-reporting field.

  # --- PEST (plague) ---
  CO_RISCO:
    official_name: Condição de risco
    translated_name: Risk condition code
    description: >
      Coded risk classification (e.g. occupational or environmental
      exposure category) for the plague case, distinct from CO_FOCAL, which
      flags whether the case falls within a recognized endemic natural
      focus.
    code_system: none
    source: inferred
    reasoning: CO_ = condição; RISCO = risco; PEST series carries the related CO_FOCAL field.

  TRATADO:
    official_name: Tratado
    translated_name: Treated (flag)
    description: >
      Whether the plague patient received treatment (typically
      streptomycin or doxycycline).
    code_system: none
    source: inferred
    reasoning: TRATADO = tratado; plain treatment-given flag on the PEST form.

  # --- AIDA/AIDC (AIDS, adult and pediatric) ---
  ORIGEM:
    official_name: Origem do registro
    translated_name: Record origin
    description: >
      Flags which source system the AIDS notification record came from -
      current SINAN entry versus a case migrated from Brazil's earlier,
      separate AIDS surveillance database (SI-AIDS), reflecting that
      historical system merger. Shared identically across the adult and
      pediatric AIDS forms.
    code_system: none
    source: inferred
    reasoning: >
      ORIGEM = origem; values skew overwhelmingly to one code with two rare
      alternates, consistent with "current system" vs. legacy-migration
      flags; the field appears identically in both AIDA and AIDC schemas.

  # --- COLE (cholera) ---
  CS_DESIT:
    official_name: Situação de desidratação
    translated_name: Dehydration status
    description: >
      Classifies the patient's dehydration severity (e.g. none/some/severe)
      - the key clinical staging for cholera, which causes severe watery
      diarrhea, and the field that guides oral vs. IV rehydration therapy
      (CS_REIDRAT).
    code_system: none
    source: inferred
    reasoning: >
      CS_ is COLE's clinical-signs prefix (CS_DIARRE, CS_VOMITO, CS_CHOQUE);
      DESIT reads as desidratação, matching the classic cholera severity
      assessment.

  # --- RAIV (human rabies) ---
  VARIA_VIR:
    official_name: Variante viral identificada
    translated_name: Viral variant identified
    description: >
      Antigenic/genetic variant of rabies virus identified through
      laboratory characterization (e.g. a variant associated with a
      hematophagous bat vs. a canine reservoir) - important for tracing
      which animal population transmitted the case.
    code_system: none
    source: inferred
    reasoning: >
      VARIA_VIR = variante viral; RAIV's lab block includes
      IMUNO_DIRE/IMUNO_INDI and PROVA_BIOL, consistent with viral
      characterization following diagnostic confirmation.

  # --- SIFG (syphilis in pregnant woman) ---
  TPESQUEMA:
    official_name: Tipo de esquema de tratamento
    translated_name: Treatment regimen type
    description: >
      Treatment regimen (e.g. benzathine penicillin protocol by disease
      stage) prescribed for the pregnant woman's syphilis - distinct from
      TPESQPAR, the same classification for her partner's treatment.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo; ESQUEMA = esquema; SIFG carries the parallel partner-facing field TPESQPAR.

  # --- TETA (accidental tetanus) ---
  TP_ANALISE:
    official_name: Tipo de ferimento analisado
    translated_name: Wound type classification
    description: >
      Classifies the wound's type/severity (e.g. clean minor wound vs.
      contaminated major wound) to assess tetanus risk and guide
      prophylaxis - grouped with the form's other wound-description fields
      (TP_CAUSA for cause, TP_LOCALLE for body site, TP_ORIGEM for origin).
    code_system: none
    source: inferred
    reasoning: >
      TP_ = tipo; sits among TETA's wound-characteristic fields
      (TP_CAUSA/TP_LOCALLE/TP_ORIGEM), so ANALISE more likely classifies
      the wound examined than the case-review status seen in TETN's
      differently-purposed CS_ANALISE.
