system: SINAN
asserted_by: pegasus_data

variables:

  # --- MALA (malária): treatment drugs, exposure activity, transfusion ---

  ARTEM:
    official_name: Artemeter/Artesunato
    translated_name: Artemisinin-based drug used (flag)
    description: >
      Whether an artemisinin derivative (artemeter or artesunato) was used
      to treat the malaria case — first-line for P. falciparum in Brazil's
      protocol, one of several drug checkboxes alongside CLOROQI, PRIMAQ
      and QUININOI.
    code_system: none
    source: inferred
    reasoning: C1 flag; ARTEM names the drug class directly, grouped with other treatment-drug flags in the same MALA stratum.

  AT_ATIVIDA:
    official_name: Atividade exercida no momento da provável infecção
    translated_name: Activity being performed at likely infection
    description: >
      What the patient was doing when likely exposed to malaria —
      agriculture, ranching, domestic work, tourism, gold-mining
      (garimpo), plant harvesting, hunting/fishing, road/dam construction,
      mining, traveling, or other — profiling occupational/environmental
      transmission risk.
    code_system: internal
    codelists: [AT_ATIVIDA]
    source: web
    source_ref: "https://github.com/rfsaldanha/microdatasus/blob/7109ec2c42cf/R/process_sinan_malaria.R#AT_ATIVIDA"

  CD_OUTRO:
    official_name: Outro medicamento - descrição
    translated_name: Other drug used, description
    description: >
      Free-text name of an antimalarial drug used in treatment that isn't
      one of the form's fixed checkboxes (ARTEM, CLOROQI, PRIMAQ,
      QUININOI) — the write-in detail for an "other drug" option.
    code_system: none
    source: inferred
    reasoning: C30 text field, wide enough for a drug name, sitting with the other MALA treatment-drug flags.

  CLOROQI:
    official_name: Cloroquina
    translated_name: Chloroquine used (flag)
    description: >
      Whether chloroquine was used to treat the case — historically
      standard for P. vivax in Brazil's protocol, one of the drug
      checkboxes alongside ARTEM, PRIMAQ and QUININOI.
    code_system: none
    source: inferred
    reasoning: C1 flag; CLOROQI is cloroquina truncated.

  DTTRANSFU:
    official_name: Data da transfusão
    translated_name: Date of blood transfusion
    description: >
      Date of a blood transfusion linked to the case, relevant to
      classifying transfusion-acquired malaria rather than mosquito-borne
      infection. Paired with TRANSFU (whether it happened) and MTRANSFU
      (where).
    code_system: none
    source: inferred
    reasoning: D8 date; DT_+TRANSFU, grouped with the transfusion flags in this stratum.

  MTRANSFU:
    official_name: Município da transfusão
    translated_name: Municipality where transfusion occurred
    description: >
      IBGE code of the municipality where the transfusion took place —
      used to trace the geographic source when malaria is suspected to be
      transfusion-transmitted rather than mosquito-borne.
    code_system: none
    source: inferred
    reasoning: C7 matches a 7-digit IBGE municipality code; M_+TRANSFU reads município da transfusão, grouped with TRANSFU/DTTRANSFU.

  PRIMAQ:
    official_name: Primaquina
    translated_name: Primaquine used (flag)
    description: >
      Whether primaquine was used in treatment — clears P. vivax liver
      hypnozoites and P. falciparum gametocytes, given alongside
      chloroquine or an artemisinin combination per protocol.
    code_system: none
    source: inferred
    reasoning: C1 flag; PRIMAQ is primaquina truncated.

  QUININOI:
    official_name: Quinino
    translated_name: Quinine used (flag)
    description: >
      Whether quinine was used to treat the case — reserved mainly for
      severe or treatment-resistant malaria, completing the drug checklist
      with ARTEM, CLOROQI and PRIMAQ.
    code_system: none
    source: inferred
    reasoning: C1 flag; QUININOI reads quinino.

  TRANSFU:
    official_name: Transfusão
    translated_name: Blood transfusion (flag)
    description: >
      Whether the patient had a blood transfusion associated with the case
      — flags a possible transfusion-transmitted malaria infection,
      investigated further via DTTRANSFU (when) and MTRANSFU (where).
    code_system: none
    source: inferred
    reasoning: C1 flag, root of the DTTRANSFU/MTRANSFU trio.

  # --- CHAG (doença de Chagas aguda): transmission route, symptoms, entomology ---

  AFIRMATIVO:
    official_name: Resposta afirmativa (antecedentes epidemiológicos)
    translated_name: Affirmative response (epidemiological antecedents)
    description: >
      Marks which epidemiological-antecedent question(s) for the
      acute-Chagas investigation were answered "yes" (vector contact,
      food-borne exposure, transfusion, etc.) — a rollup of the
      transmission-route questions rather than one plain flag.
    code_system: none
    source: inferred
    reasoning: >
      C5, wider than a plain flag, suggesting it can hold more than one
      code; AFIRMATIVO reads literally "affirmative," fitting a summary of
      which antecedent items (CON_TRIAT, CON_INFECC, etc.) were marked yes.

  ANOREXIA:
    official_name: Anorexia
    translated_name: Anorexia / loss of appetite (symptom)
    description: >
      Whether the patient had complete loss of appetite during acute
      Chagas disease — a distinct, more severe checklist item than
      HIPOREXIA (reduced appetite); both come from the acute-phase symptom
      list.
    code_system: none
    source: inferred
    reasoning: C1 flag named directly for the symptom.

  CON_INFECC:
    official_name: Condição/via provável de infecção
    translated_name: Probable route of infection
    description: >
      How the patient was likely infected with T. cruzi — vectorial
      (triatomine contact), oral (contaminated food/juice), transfusional,
      congenital, or accidental — investigated alongside CON_TRIAT, the
      specific vector-contact question.
    code_system: none
    source: inferred
    reasoning: C1 coded field; CON_=condição per prefix convention, INFECC=infecção.

  CON_TRIAT:
    official_name: Contato com triatomíneo
    translated_name: Contact with triatomine bug (vector)
    description: >
      Whether the patient had contact with a triatomine ("barbeiro") bug,
      the classic Chagas disease vector, before symptom onset.
    code_system: internal
    codelists: [CON_TRIAT]
    source: web
    source_ref: "https://github.com/rfsaldanha/microdatasus/blob/7109ec2c42cf/R/process_sinan_chagas.R#CON_TRIAT"
    notes: "Coded 1=Sim, 2=Não, 3=Não se aplica."

  DT_COL_IND:
    official_name: Data de coleta - exame indireto
    translated_name: Date sample collected for indirect diagnostic test
    description: >
      Date a specimen was collected for an indirect parasitological method
      (e.g. xenodiagnosis or hemoculture) used to confirm acute Chagas when
      direct blood-smear microscopy is negative or unavailable.
    code_system: none
    source: inferred
    reasoning: >
      D8 date; COL=coleta, IND read as indireto, fitting the
      confirmatory-testing theme of this stratum; exact expansion not
      independently confirmed.

  HIPOREXIA:
    official_name: Hiporexia
    translated_name: Reduced appetite (symptom)
    description: >
      Whether the patient had diminished but not absent appetite — the
      milder counterpart to ANOREXIA on the acute-Chagas symptom
      checklist, recorded as a separate item.
    code_system: none
    source: inferred
    reasoning: C1 flag named directly for the symptom.

  IMPLANTA:
    official_name: Implantação de colônia de triatomíneos
    translated_name: Household triatomine colonization found (flag)
    description: >
      Whether the entomological investigation found an established
      triatomine colony in or near the patient's household — evidence of
      local, rather than imported, vector-borne transmission risk.
    code_system: none
    source: inferred
    reasoning: C1 flag; IMPLANTA reads implantação, fitting the entomological-investigation theme shared with CON_TRIAT and QUANTOS.

  QUANTOS:
    official_name: Quantos exemplares capturados
    translated_name: Number of triatomine specimens captured
    description: >
      Count of triatomine bugs collected during the household
      entomological investigation — recorded with IMPLANTA (whether a
      colony was found) to gauge infestation level.
    code_system: none
    source: inferred
    reasoning: C5; QUANTOS="how many," fitting the entomological-count theme paired with IMPLANTA.

  # --- CHAG/LEIV shared serology ---

  ELISA:
    official_name: ELISA
    translated_name: ELISA serology test result
    description: >
      Result of the ELISA immunoassay for antibodies (reactive,
      non-reactive, inconclusive, or not done) — used in serologic
      confirmation for both acute Chagas and visceral leishmaniasis.
    code_system: none
    source: inferred
    reasoning: C1 coded field named directly for the test; shared between the CHAG and LEIV strata rather than exclusive to one.

  # --- COLE (cólera): treatment ---

  NM_ANTIBIO:
    official_name: Nome do antibiótico
    translated_name: Name of antibiotic (treatment)
    description: >
      Name of the antibiotic used to treat the cholera case (e.g.
      doxiciclina, azitromicina, ciprofloxacino) — shortens V. cholerae
      shedding and illness duration, though rehydration is what actually
      prevents death.
    code_system: none
    source: inferred
    reasoning: C30 text; NM_=nome, ANTIBIO=antibiótico, in the treatment section of the cholera investigation form.

  # --- HEPA (hepatites virais): hepatitis C testing and exposure source ---

  ANTIHCV:
    official_name: Anti-HCV
    translated_name: Anti-HCV antibody test result
    description: >
      Result of the anti-HCV serology screening test (reactive,
      non-reactive, not done) — the antibody test that first flags
      possible hepatitis C, distinct from HCV, the case's final etiologic
      classification.
    code_system: none
    source: inferred
    reasoning: C1 coded field; ANTI+HCV names the antibody test directly.

  DSFONTE:
    official_name: Descrição da fonte de infecção
    translated_name: Source of infection, description
    description: >
      Free-text note on the suspected source or route of hepatitis
      exposure (blood transfusion, injection drug use, sexual contact,
      vertical transmission, etc.) gathered during the epidemiological
      investigation.
    code_system: none
    source: inferred
    reasoning: C30 text; DS_=descrição, FONTE=fonte (source).

  HCV:
    official_name: Hepatite C
    translated_name: Case classified as hepatitis C (flag)
    description: >
      Whether the case's final etiologic classification is hepatitis C —
      one checkbox among the virus-type classification (A/B/C/D/E) on the
      viral-hepatitis form, distinct from the ANTIHCV screening-test
      result that feeds into it.
    code_system: none
    source: inferred
    reasoning: C1 flag named for the virus itself rather than the antibody test (compare ANTIHCV).
