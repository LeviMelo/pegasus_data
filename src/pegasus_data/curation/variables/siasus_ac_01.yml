# SIASUS — SIA.AC, the 2002 renal replacement therapy (Terapia Renal
# Substitutiva) registry. This file covers the first 25 of 95 AC columns
# assigned to this batch: the APAC-body constant flags, the exam block's
# undecoded index codes, the OPC block's AIH/transfer/outcome fields, and the
# patient blocks' (PAC_/PAF_) inscription dates, prior-TRS dates, transplant
# flags and demographics. See siasus_apac_registry.yml for the fields already
# documented (PAC_NUM, PAC_NASCPC, PAC_INITRA, EXA_HIV etc.) and for the join
# structure and privacy notes that apply to this whole archive.
#
# Evidence is drawn from variable_profiles for
# /dissemin/publicos/SIASUS/APAC/2002/acac0201.exe (Acre, Jan 2002), the same
# file the task brief measured directly. Several fields here are entirely
# null in this file (0 non-null of the row count) — that is itself measured
# fact, not a gap in the curation.
system: SIASUS
asserted_by: pegasus_data

variables:

  APA_CONTN:
    official_name: Indicador de continuidade
    translated_name: Continuity flag
    description: >
      Single-character flag on every APAC authorisation record, constant at
      "1" across all 305 rows in this file. CONTN reads continu[idade];
      consistent with a dialysis registry where almost every authorisation
      renews an ongoing therapy rather than opening a first-time request.
    code_system: none
    source: inferred
    reasoning: >
      Measured constant "1" across 305/305 rows in ACAC0201.DBF; CONTN is
      readable as an abbreviation of continuidade. No codelist is bound.

  COB_CONDIC:
    official_name: Condição do registro
    translated_name: Record condition flag
    description: >
      Two-letter processing-status code on every billing (cobrança) record,
      constant at "EC" across all 485 rows. The identical code and width
      recur on EXA_CONDIC and UDI_CONDIC elsewhere in this archive, so it
      reads as a DATASUS-internal control flag rather than something a
      biller enters by hand.
    code_system: none
    source: inferred
    reasoning: >
      Measured constant "EC" across 485/485 rows in COAC0201.DBF, matching
      the same value on EXA_CONDIC (52/52) and UDI_CONDIC (2/2) in the same
      archive.

  EXA_CONDIC:
    official_name: Condição do registro (bloco de exames)
    translated_name: Record condition flag, examinations block
    description: >
      The same two-letter "EC" processing-status flag as COB_CONDIC, here on
      the examination block. Constant across all 52 rows in this file.
    code_system: none
    source: inferred
    reasoning: Same CONDIC stem and identical constant value as COB_CONDIC.

  EXA_INDCRE:
    official_name: Índice de referência (CRE)
    translated_name: Exam reference index (CRE)
    description: >
      Three-digit numeric code on each exam entry (e.g. 124, 046, 083),
      nearly as varied as the rows themselves — 44 distinct values across 52
      records — so it behaves as a near-unique per-record index rather than
      a small category. Distinct from the decoded serology fields (EXA_HIV,
      EXA_HBSAG) beside it.
    code_system: none
    source: inferred
    reasoning: >
      IND reads indicador/índice; distinct_count 44 of 52 non-null rows rules
      out a small enumerated domain. No codelist is bound in the catalog.

  EXA_INDUPR:
    official_name: Índice de referência (UPR)
    translated_name: Exam reference index (UPR)
    description: >
      Four-digit sibling of EXA_INDCRE, one digit wider and reaching higher
      values (up to the 1800s in this file) with 43 distinct values across
      52 records — again closer to a per-record index than a coded category.
    code_system: none
    source: inferred
    reasoning: >
      Same IND-prefixed family as EXA_INDCRE, distinct_count 43 of 52
      non-null rows, four-character width versus INDCRE's three.

  EXA_INDUPS:
    official_name: Índice de referência (UPS)
    translated_name: Exam reference index (UPS)
    description: >
      Four-digit sibling of EXA_INDUPR, somewhat less varied — 37 distinct
      values across 52 records rather than 43 — but drawn from the same
      value range (three- and four-digit codes below 2000).
    code_system: none
    source: inferred
    reasoning: >
      Same IND-prefixed family as EXA_INDCRE/INDUPR, distinct_count 37 of 52
      non-null rows.

  OPC_AIHPRO:
    official_name: Procedimento da AIH (bloco OPC)
    translated_name: AIH procedure code, OPC block
    description: >
      Eight-character field for a linked hospital-admission (AIH) procedure
      code. Present in the OPC schema but empty in every one of the 155 rows
      here — this Acre file's dialysis episodes generated no linked hospital
      admission that month.
    code_system: none
    source: inferred
    reasoning: >
      AIHPRO reads procedimento da AIH, paralleling the already-documented
      OPC_AIHNUM; 0 of 155 rows are non-null in this file.

  OPC_DTTRAN:
    official_name: Data de transferência (bloco OPC)
    translated_name: Transfer date, OPC block
    description: >
      Eight-character date field for a patient transfer between dialysis
      units, entirely empty in this file (0 of 155 rows) — none of these
      episodes recorded an inter-clinic transfer.
    code_system: none
    source: inferred
    reasoning: DTTRAN reads data de transferência; 0 of 155 rows are non-null.

  OPC_RESULT:
    official_name: Resultado (bloco OPC)
    translated_name: Outcome code, OPC block
    description: >
      Three-way outcome code on the OPC authorisation record — values 1, 2
      and 3, split roughly 31/67/51 across the 149 filled rows — most likely
      distinguishing whether the episode continued, ended or transferred,
      alongside the "situação" style codes used elsewhere in this registry.
    code_system: none
    source: inferred
    reasoning: >
      RESULT reads resultado; distinct_count 3 with observed values {1,2,3}
      over 149 of 155 rows. No codelist confirms the specific mapping.

  PAC_DTINSC:
    official_name: Data de inscrição
    translated_name: Enrolment date
    description: >
      Six-character enrolment/registration date on the patient block,
      entirely empty in this file (0 of 52 rows). DTINSC reads data de
      inscrição — when the patient enrolled in the dialysis programme.
    code_system: none
    source: inferred
    reasoning: DTINSC decomposes to data de inscrição; 0 of 52 rows are non-null.

  PAC_DTTRS1:
    official_name: Data da 1ª terapia renal substitutiva anterior
    translated_name: Start date, 1st prior renal-replacement episode
    description: >
      Six-character year-month marking the start of the patient's first
      previous stint on renal replacement therapy (TRS) — the same TRS stem
      that names this whole subsystem — tracking dialysis history predating
      this authorisation. Entirely empty in this file (0 of 52 rows).
    code_system: none
    source: inferred
    reasoning: >
      DTTRS decomposes to data de [início da] TRS (Terapia Renal
      Substitutiva); the sibling field PAF_DTTRS1 in the PAF block carries
      real six-digit year-month values (e.g. 200106, 197309), confirming the
      format and the TRS reading even though PAC_DTTRS1 itself is null here.

  PAC_DTTRS2:
    official_name: Data da 2ª terapia renal substitutiva anterior
    translated_name: Start date, 2nd prior renal-replacement episode
    description: >
      The second slot in the same DTTRS1-DTTRS3 series as PAC_DTTRS1, for a
      patient's second previous TRS episode. Entirely empty in this file (0
      of 52 rows).
    code_system: none
    source: inferred
    reasoning: Same DTTRS stem as PAC_DTTRS1, one position later; 0 of 52 non-null.

  PAC_DTTRS3:
    official_name: Data da 3ª terapia renal substitutiva anterior
    translated_name: Start date, 3rd prior renal-replacement episode
    description: >
      The third slot in the same DTTRS1-DTTRS3 series, for a patient's third
      previous TRS episode. Entirely empty in this file (0 of 52 rows).
    code_system: none
    source: inferred
    reasoning: Same DTTRS stem as PAC_DTTRS1, two positions later; 0 of 52 non-null.

  PAC_INDTRA:
    official_name: Indicador de transplante
    translated_name: Transplant indicator
    description: >
      One-character transplant flag on the patient block, constant at "N"
      across all 52 rows — consistent with a file of active dialysis
      patients rather than post-transplant patients.
    code_system: internal
    source: inferred
    reasoning: >
      INDTRA reads indicador de transplante; measured constant "N" across
      52/52 rows.

  PAC_INSTRA:
    official_name: Inscrito para transplante
    translated_name: Enrolled for transplant
    description: >
      One-character flag for whether the patient is enrolled on a
      transplant waiting list (the CNCDO list referenced elsewhere in this
      registry family), constant at "N" across all 52 rows in this file.
    code_system: internal
    source: inferred
    reasoning: >
      INSTRA reads inscrito [para] transplante; measured constant "N" across
      52/52 rows; parallels the CNCDO enrolment flag documented in later
      APAC dialysis layouts.

  PAC_SITTRA:
    official_name: Situação de transplante
    translated_name: Transplant status
    description: >
      One-character transplant-status code, constant at "0" across all 52
      rows. Later APAC dialysis layouts use a 1-4 domain for this same
      SITTRA stem (fit/unfit/declined/not-applicable); the catalog's own
      profiling flags this constant "0" as a likely retired placeholder
      value predating that scheme.
    code_system: none
    source: inferred
    reasoning: >
      SITTRA reads situação de transplante; measured constant "0" across
      52/52 rows, and the catalog's semantic profile marks it
      looks_like_retired_placeholder=true.

  PAF_DTINSC:
    official_name: Data de inscrição (bloco PAF)
    translated_name: Enrolment date, PAF block
    description: >
      The PAF-block sibling of PAC_DTINSC, same six-character enrolment-date
      field. Entirely empty in this file (0 of 98 rows).
    code_system: none
    source: inferred
    reasoning: Same DTINSC stem as PAC_DTINSC; 0 of 98 rows are non-null.

  PAF_DTTRS1:
    official_name: Data da 1ª terapia renal substitutiva anterior (bloco PAF)
    translated_name: Start date, 1st prior renal-replacement episode, PAF block
    description: >
      The PAF-block sibling of PAC_DTTRS1: year-month start of the patient's
      first previous TRS episode. Filled for 11 of 98 rows here, with values
      spanning 1973 to 2001 — evidence this tracks a patient's real dialysis
      history, not just the current competência.
    code_system: none
    source: inferred
    reasoning: >
      Matched DATASUS's yyyymm competência pattern (10 distinct values,
      100% month-valid) over 11 of 98 non-null rows, including 197309 and
      200106.

  PAF_DTTRS2:
    official_name: Data da 2ª terapia renal substitutiva anterior (bloco PAF)
    translated_name: Start date, 2nd prior renal-replacement episode, PAF block
    description: >
      The second slot in the PAF-block DTTRS series, paralleling
      PAF_DTTRS1. Entirely empty in this file (0 of 98 rows).
    code_system: none
    source: inferred
    reasoning: Same DTTRS stem as PAF_DTTRS1, one position later; 0 of 98 non-null.

  PAF_DTTRS3:
    official_name: Data da 3ª terapia renal substitutiva anterior (bloco PAF)
    translated_name: Start date, 3rd prior renal-replacement episode, PAF block
    description: >
      The third slot in the PAF-block DTTRS series. Entirely empty in this
      file (0 of 98 rows).
    code_system: none
    source: inferred
    reasoning: Same DTTRS stem as PAF_DTTRS1, two positions later; 0 of 98 non-null.

  PAF_INDTRA:
    official_name: Indicador de transplante (bloco PAF)
    translated_name: Transplant indicator, PAF block
    description: >
      The PAF-block sibling of PAC_INDTRA, constant at "N" across all 98
      rows in this file.
    code_system: internal
    source: inferred
    reasoning: Same INDTRA stem as PAC_INDTRA; measured constant "N" across 98/98 rows.

  PAF_INITRA:
    official_name: Início do tratamento (bloco PAF)
    translated_name: Treatment start, year-month, PAF block
    description: >
      The PAF-block sibling of the already-documented PAC_INITRA: the
      competência in which the patient began renal replacement therapy, as
      AAAAMM. Filled for all 98 rows, 40 distinct year-months observed.
    code_system: none
    source: inferred
    reasoning: >
      Same INITRA stem as PAC_INITRA; matched the yyyymm competência pattern
      over 98/98 non-null rows (e.g. 200111, 200012, 200201).

  PAF_INSTRA:
    official_name: Inscrito para transplante (bloco PAF)
    translated_name: Enrolled for transplant, PAF block
    description: >
      The PAF-block sibling of PAC_INSTRA, constant at "N" across all 98
      rows in this file.
    code_system: internal
    source: inferred
    reasoning: Same INSTRA stem as PAC_INSTRA; measured constant "N" across 98/98 rows.

  PAF_MUNPCN:
    official_name: Município de residência do paciente (bloco PAF)
    translated_name: Patient's municipality of residence, PAF block
    description: >
      IBGE municipality code of the patient's residence, on the PAF block.
      All 8 distinct values observed carry the 12 (Acre) state prefix,
      matching where these files originate.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: >
      Bound to MUNICBR in the catalog at 0.9 confidence; all 98 non-null
      values match the 6-digit IBGE code pattern with an Acre (12xxxx)
      prefix.

  PAF_NASCPC:
    official_name: Data de nascimento do paciente (bloco PAF)
    translated_name: Patient date of birth, PAF block
    description: >
      The PAF-block sibling of the already-documented PAC_NASCPC: patient
      date of birth as AAAAMMDD, real and unobfuscated. Filled for all 98
      rows, spanning births from 1921 to 1993.
    code_system: none
    source: inferred
    reasoning: >
      Matched DATASUS's date8/YYYYMMDD pattern at 0.95 confidence over 98/98
      non-null rows.
    notes: >
      Identifying in combination, on a row that also carries PAF_CPFPCN,
      PAF_CEPPCN and PAF_MUNPCN. See PAC_CPFPCN in siasus_apac_registry.yml.
