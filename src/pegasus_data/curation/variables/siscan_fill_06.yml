# SISCAN — SISCAN_MAMOGRAFIA, 2013-2018 yearly extracts, concluding the
# mammography cluster begun in siscan_fill_04.yml/siscan_fill_05.yml: prior-
# surgery history, exam-reason (screening vs. diagnostic) breakdowns, and
# management-recommendation counts. All declared C(0,0) — CSV opendatasus
# extracts, not fixed-width DBFs.
system: SISCAN
asserted_by: pegasus_data

variables:

  NU_DIS_ARQ_POR_CIR_MD:
    official_name: Distorção de arquitetura por cirurgia, mama direita
    translated_name: Count of surgery-related architectural distortion, right breast
    description: >
      Count of right-breast mammograms showing architectural distortion
      attributed to a prior surgical scar, rather than the concerning
      distortion tracked in ST_DISTORCAO_FOCAL (siscan_fill_04.yml).
    code_system: none
    source: inferred
    reasoning: DIS_ARQ_POR_CIR abbreviates distorção de arquitetura por cirurgia; MD is mama direita.

  NU_DIS_ARQ_POR_CIR_ME:
    official_name: Distorção de arquitetura por cirurgia, mama esquerda
    translated_name: Count of surgery-related architectural distortion, left breast
    description: The left-breast counterpart of NU_DIS_ARQ_POR_CIR_MD.
    code_system: none
    source: inferred
    reasoning: Same DIS_ARQ_POR_CIR stem; ME is mama esquerda.

  NU_FEZ_CIRURGIA_DIR:
    official_name: Fez cirurgia, mama direita
    translated_name: Count of patients with prior right-breast surgery
    description: >
      Count of mammograms where the patient reported prior surgery on the
      right breast — relevant clinical history for reading the exam. Uses
      DIR/ESQ rather than this batch's usual MD/ME laterality suffix.
    code_system: none
    source: inferred
    reasoning: FEZ_CIRURGIA is fez cirurgia (had surgery); DIR is direita.

  NU_FEZ_CIRURGIA_ESQ:
    official_name: Fez cirurgia, mama esquerda
    translated_name: Count of patients with prior left-breast surgery
    description: The left-breast counterpart of NU_FEZ_CIRURGIA_DIR.
    code_system: none
    source: inferred
    reasoning: Same FEZ_CIRURGIA stem; ESQ is esquerda.

  NU_NAO_FEZ_CIRURGIAS:
    official_name: Não fez cirurgias
    translated_name: Count of patients with no prior breast surgery
    description: >
      Count of mammograms where the patient reported no prior breast
      surgery in either breast — the complement of NU_FEZ_CIRURGIA_DIR/ESQ,
      not itself split by laterality.
    code_system: none
    source: inferred
    reasoning: NAO_FEZ_CIRURGIAS is não fez cirurgias (did not have surgery), unabbreviated.

  NU_CONTROLE_CATEGORIA3:
    official_name: Controle, categoria 3
    translated_name: Count of BI-RADS category-3 follow-up exams
    description: >
      Count of mammograms classified BI-RADS category 3 (probably benign)
      and returned for short-interval follow-up ("controle") rather than
      biopsy.
    code_system: none
    source: inferred
    reasoning: CONTROLE_CATEGORIA3 is controle categoria 3, unabbreviated — literal BI-RADS category-3 terminology.

  NU_DIAG_ACHADOS:
    official_name: Diagnóstico, achados
    translated_name: Count of diagnostic exams performed for clinical/imaging findings
    description: >
      Count of exams performed as a diagnostic mammogram (not routine
      screening) because of a clinical or prior-imaging finding — as
      opposed to NU_DIAG_AVAL_QT's treatment-response reason.
    code_system: none
    source: inferred
    reasoning: >
      DIAG_ACHADOS is diagnóstico [por] achados; SISCAN mammography splits
      exams into rastreamento (screening) and diagnóstico, with diagnóstico
      further split by reason.

  NU_DIAG_AVAL_QT:
    official_name: Diagnóstico, avaliação de quimioterapia
    translated_name: Count of diagnostic exams performed to evaluate chemotherapy response
    description: >
      Count of exams performed as a diagnostic mammogram specifically to
      assess response to chemotherapy — the treatment-monitoring
      counterpart of NU_DIAG_ACHADOS.
    code_system: none
    source: inferred
    reasoning: DIAG_AVAL_QT abbreviates diagnóstico avaliação de quimioterapia (QT is the standard Brazilian abbreviation for chemotherapy).

  NU_LES_BIOSPIA_PAAF:
    official_name: Lesão — biópsia/PAAF
    translated_name: Count of lesions recommended for biopsy or fine-needle aspiration
    description: >
      Count of lesions whose BI-RADS management recommendation was tissue
      sampling — either core biopsy or PAAF (punção aspirativa por agulha
      fina, fine-needle aspiration).
    code_system: none
    source: inferred
    reasoning: LES_BIOSPIA_PAAF is lesão, biópsia/PAAF; PAAF is the standard Brazilian abbreviation for fine-needle aspiration.

  NU_LES_DIAG_CANCER:
    official_name: Lesão — diagnóstico de câncer
    translated_name: Count of lesions with a cancer diagnosis
    description: Count of lesions whose result was a cancer diagnosis (BI-RADS categories 5/6 or a confirmed malignant biopsy).
    code_system: none
    source: inferred
    reasoning: LES_DIAG_CANCER is lesão, diagnóstico de câncer, unabbreviated.

  NU_REV_MAMOGRAFIA:
    official_name: Revisão de mamografia
    translated_name: Count of mammograms undergoing a quality-control review read
    description: >
      Count of mammograms that received a second, review read — a routine
      quality-control step in screening mammography programmes, distinct
      from the original report.
    code_system: none
    source: inferred
    reasoning: REV_MAMOGRAFIA is revisão de mamografia, unabbreviated.
