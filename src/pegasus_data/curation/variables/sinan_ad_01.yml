system: SINAN
asserted_by: pegasus_data

variables:

  CS_MENING:
    official_name: Classificação da meningite
    translated_name: Meningitis classification
    description: >
      Single-character classification code on the SINAN Meningite form,
      distinguishing the disease subtype (e.g. bacterial vs viral vs other).
      Distinct from CLASSI_FIN, the final-diagnosis field shared across every
      SINAN agravo.
    code_system: none
    source: inferred
    reasoning: >
      CS_ is the classificação/situação prefix and MENING reads meningite;
      1-character width matches a short enumerated code rather than free text.

  DS_TRANS1:
    official_name: Município de transmissão (1)
    translated_name: Municipality of transmission (1)
    description: >
      IBGE municipality code for a candidate place where transmission or
      infection occurred. First of up to three parallel slots (DS_TRANS1-3),
      following the same repeated-instance pattern as DS_MUN_1-3 and
      CO_UF_1-3 elsewhere in SINAN.
    code_system: none
    source: inferred
    reasoning: >
      Declared width C6 matches the standard 6-digit IBGE municipality code,
      not free text; the 1/2/3 suffix mirrors other SINAN "up to three
      locations" field families.

  DS_TRANS2:
    official_name: Município de transmissão (2)
    translated_name: Municipality of transmission (2)
    description: >
      Second of the three DS_TRANS slots; see DS_TRANS1 for what the field
      holds. Used only when a second candidate transmission municipality is
      recorded for the same case.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_TRANS1; distinguished only by ordinal position.

  DS_TRANS3:
    official_name: Município de transmissão (3)
    translated_name: Municipality of transmission (3)
    description: >
      Third of the three DS_TRANS slots; see DS_TRANS1 for what the field
      holds. Used only when a third candidate transmission municipality is
      recorded for the same case.
    code_system: none
    source: inferred
    reasoning: Same evidence as DS_TRANS1; distinguished only by ordinal position.

  CON_INF_PA:
    official_name: País de infecção
    translated_name: Country of infection
    description: >
      Country code for the "local provável de infecção" (probable place of
      infection) block, used when the case may have been acquired outside
      Brazil. Sibling of CON_INF_BA/CON_INF_DI/CON_INF_MUNICI, which give the
      state, district and municipality components of the same block.
    code_system: none
    source: inferred
    reasoning: >
      CON_INF_ prefix recurs across several probable-infection-location
      fields; PA plus the 3-character width matches a country-code slot
      rather than a place name.

  DT_TRNASRM:
    official_name: Data de transmissão (RM)
    translated_name: Transmission-route date (RM)
    description: >
      Date tied to one specific suspected exposure route in an epidemiological
      antecedents block (compare DTTRANSDM, DT_TRNASRS, DTTRANSSE, DTTRANSSM,
      DTTRANSUS — a family of per-route dates, likely from a Hepatites Virais
      investigation). AAAAMMDD. Which exact route "RM" denotes is not resolved.
    code_system: none
    source: inferred
    reasoning: >
      DT_ prefix is the date convention; the field is one of several
      near-identically-named DT_TRANS*/DTTRANS* siblings that differ only by a
      2-letter route suffix, consistent with a per-exposure-route date block.

  DT_DOSE_1:
    official_name: Data da 1ª dose
    translated_name: Date of 1st dose
    description: >
      Date the patient received the first dose of a vaccine series recorded
      on this form (paired with DT_VENCIM, the batch expiry date, in the same
      vaccination-history block). AAAAMMDD; siblings DT_DOSE_2-5 record later
      doses in the same series.
    code_system: none
    source: inferred
    reasoning: >
      DT_DOSE_N is a numbered date series alongside DT_VENCIM; declared width
      (C5) is narrower than a full AAAAMMDD date, suggesting inconsistent
      formatting across the source files that carry it.

  DT_DOSE_2:
    official_name: Data da 2ª dose
    translated_name: Date of 2nd dose
    description: >
      Date of the second dose in the same vaccination series as DT_DOSE_1;
      see that entry for what the field represents.
    code_system: none
    source: inferred
    reasoning: Same evidence as DT_DOSE_1; distinguished only by dose number.

  DT_DOSE_3:
    official_name: Data da 3ª dose
    translated_name: Date of 3rd dose
    description: >
      Date of the third dose in the same vaccination series as DT_DOSE_1;
      see that entry for what the field represents.
    code_system: none
    source: inferred
    reasoning: Same evidence as DT_DOSE_1; distinguished only by dose number.

  DT_DOSE_4:
    official_name: Data da 4ª dose
    translated_name: Date of 4th dose
    description: >
      Date of the fourth dose in the same vaccination series as DT_DOSE_1;
      see that entry for what the field represents.
    code_system: none
    source: inferred
    reasoning: Same evidence as DT_DOSE_1; distinguished only by dose number.

  DT_DOSE_5:
    official_name: Data da 5ª dose
    translated_name: Date of 5th dose
    description: >
      Date of the fifth dose in the same vaccination series as DT_DOSE_1; see
      that entry for what the field represents.
    code_system: none
    source: inferred
    reasoning: Same evidence as DT_DOSE_1; distinguished only by dose number.

  DT_VENCIM:
    official_name: Data de vencimento
    translated_name: Expiry date
    description: >
      Expiry date of the vaccine batch/dose recorded in the DT_DOSE_1-5
      vaccination-history block. AAAAMMDD.
    code_system: none
    source: inferred
    reasoning: >
      VENCIM reads vencimento (expiry); it sits alongside the DT_DOSE_N series
      and D8 width matches a full date.

  DURACAO:
    official_name: Duração
    translated_name: Duration
    description: >
      Numeric duration (likely days) of a clinical episode or incubation
      period recorded on the form the field belongs to. The exact reference
      period is not resolved from available evidence.
    code_system: none
    source: inferred
    reasoning: >
      DURACAO reads duração; declared as a 2-character numeric-like code,
      consistent with a small day/week count rather than a coded category.

  AEROFOBIA:
    official_name: Aerofobia
    translated_name: Aerophobia
    description: >
      Sim/Não flag for aerofobia (fear of air currents on the face), a
      hallmark symptom of furious-form human rabies. Part of the Raiva
      Humana clinical symptom checklist alongside AGITACAO and AGRESSIVI.
    code_system: none
    source: inferred
    reasoning: >
      1-character width matches a binary flag; aerofobia is a named clinical
      sign specific to rabies, and it co-occurs at the same rarity tier as
      other rabies-checklist and animal-exposure fields (AGITACAO, AGRESSIVI,
      ANI_TIPO_1).

  AGENTE_OUT:
    official_name: Agente etiológico (outro)
    translated_name: Etiologic agent (other)
    description: >
      Free-text field naming the causative agent when it is not covered by
      the form's standard etiologic-agent codelist. "Outro, especifique" style
      field.
    code_system: none
    source: inferred
    reasoning: >
      AGENTE + OUT(ro) is SINAN's standard pattern for an open-text overflow
      field paired with a coded agent list; 30-character width fits a short
      free-text entry.

  AGITACAO:
    official_name: Agitação
    translated_name: Agitation
    description: >
      Sim/Não flag for psychomotor agitation, a neuropsychiatric symptom on
      the same clinical checklist as AEROFOBIA and AGRESSIVI (consistent with
      Raiva Humana's furious-form presentation).
    code_system: none
    source: inferred
    reasoning: Same clustering and width evidence as AEROFOBIA.

  AGRESSIVI:
    official_name: Agressividade
    translated_name: Aggressiveness
    description: >
      Sim/Não flag for aggressive behavior, a neuropsychiatric symptom on the
      same clinical checklist as AEROFOBIA and AGITACAO.
    code_system: none
    source: inferred
    reasoning: Same clustering and width evidence as AEROFOBIA.

  ALCATRAO:
    official_name: Alcatrão
    translated_name: Tar
    description: >
      Sim/Não flag for occupational exposure to tar, one item in a chemical
      carcinogen exposure checklist alongside AMINA, BENZENO, CADMIO and
      CROMO (work-related cancer investigation).
    code_system: none
    source: inferred
    reasoning: >
      ALCATRAO names a specific chemical; it shares its rarity tier and
      1-character width with several other named-substance flags, matching
      SINAN's per-substance occupational-exposure checklist pattern.

  AMINA:
    official_name: Amina aromática
    translated_name: Aromatic amine
    description: >
      Sim/Não flag for occupational exposure to aromatic amines, part of the
      same chemical-agent checklist as ALCATRAO, BENZENO, CADMIO and CROMO.
    code_system: none
    source: inferred
    reasoning: Same clustering and width evidence as ALCATRAO.

  AMPICILINA:
    official_name: Ampicilina
    translated_name: Ampicillin
    description: >
      Sim/Não flag for whether ampicillin was the antibiotic used to treat
      the case, one item in a per-drug treatment checklist alongside
      CLORAFEN, SULFA and QUINOLONA — most plausibly on the bacterial
      meningitis (Meningite) investigation form.
    code_system: none
    source: inferred
    reasoning: >
      Ampicillin, chloranfenicol, sulfa and quinolone are classic bacterial-
      meningitis antibiotics; the field is a single-character flag matching
      a per-drug-used checklist rather than a dosage or free-text field.

  AM_SANGUE:
    official_name: Amostra de sangue
    translated_name: Blood sample
    description: >
      Sim/Não flag for whether a blood sample was collected from the patient
      for laboratory testing.
    code_system: none
    source: inferred
    reasoning: >
      AM_ abbreviates amostra (sample) and SANGUE is blood; 1-character width
      matches a collection-flag rather than a lab result.

  ANI_TIPO_1:
    official_name: Tipo de animal (1)
    translated_name: Animal type (1)
    description: >
      Free-text species/type of the animal involved in the case (e.g. the
      biting animal in a rabies exposure), first of a possible numbered
      series of animal entries.
    code_system: none
    source: inferred
    reasoning: >
      ANI_TIPO reads tipo de animal; 30-character width fits free text, and
      it clusters with AEROFOBIA/AGITACAO/AGRESSIVI, consistent with a Raiva
      Humana (rabies) exposure-history block.
