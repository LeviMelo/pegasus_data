system: SINAN
asserted_by: pegasus_data

variables:

  HEMOCULT:
    official_name: Hemocultura
    translated_name: Blood culture (for T. cruzi)
    description: >
      Result of blood culture attempted to recover Trypanosoma cruzi in an
      acute Chagas disease investigation, one of the panel's direct
      parasitological tests alongside MICRO_HEMA (microhematocrit).
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and CHAG series
      membership. Hemocultura is a standard, if low-sensitivity, direct
      method for confirming acute Chagas disease, and the single-character
      width matches the positivo/negativo/não realizado coding used elsewhere
      on this form's lab fields.

  HEMORRAG:
    official_name: Manifestações hemorrágicas
    translated_name: Hemorrhagic manifestations
    description: >
      Whether the Brazilian spotted fever (Febre Maculosa) patient showed
      hemorrhagic signs, one item of a clinical-signs checklist alongside
      HIPEREMIA and LINFADENO. HEMORRAGI is a closely related item on the
      same form; the catalog does not preserve enough of the original layout
      to say how the two differ.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and FMAC series
      membership. Petechiae, purpura and gastrointestinal bleeding are
      recognized severity markers of Brazilian spotted fever, making a
      hemorrhagic-manifestation flag a natural checklist item; two
      similarly-named fields (HEMORRAG/HEMORRAGI) could not be told apart
      from the evidence available.

  HEMORRAGI:
    official_name: Manifestações hemorrágicas (item associado)
    translated_name: Hemorrhagic manifestations (related item)
    description: >
      Sibling checklist flag to HEMORRAG on the same Febre Maculosa form; see
      HEMORRAG for what the pair jointly captures. The precise distinction
      between the two (e.g. site or severity) is not recoverable from the
      evidence here.
    code_system: internal
    source: inferred
    reasoning: >
      Same basis as HEMORRAG: C1 width, FMAC series, no further catalog
      evidence to separate the two similarly-named fields.

  HEMO_IGG:
    official_name: Resultado Hemaglutinação IgG
    translated_name: Hemagglutination inhibition test - IgG result
    description: >
      IgG result of the hemagglutination-inhibition serology test for plague
      (Yersinia pestis), a single-sample test alongside the paired-sample
      ELISA fields (ELISA1/ELISA2) on the same form.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and PEST series
      membership. Hemagglutination inhibition is a classic plague serology
      method, and running it alongside an ELISA panel matches how other SINAN
      zoonosis forms (e.g. Chagas) run multiple serology methods side by
      side.

  HEMO_IGM:
    official_name: Resultado Hemaglutinação IgM
    translated_name: Hemagglutination inhibition test - IgM result
    description: >
      IgM half of the same hemagglutination-inhibition test as HEMO_IGG, for
      plague.
    code_system: internal
    source: inferred
    reasoning: Same basis as HEMO_IGG.

  HEM_IGG_S1:
    official_name: Sorologia Hemaglutinação IgG - amostra 1
    translated_name: Hemagglutination IgG serology - sample 1
    description: >
      IgG hemagglutination-inhibition result for the first serum sample in a
      Chagas Aguda investigation, one of three serology methods on this form
      (with ELI_IGG_S1 for ELISA and IMU_IGG_S1 for immunofluorescence).
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and CHAG series
      membership. The IGG/IGM x S1/S2 naming mirrors the confirmed ELI_*
      fields on the same form, and hemagglutination inhibition is a standard
      third method run alongside ELISA and IFI in Chagas serology panels.

  HEM_IGG_S2:
    official_name: Sorologia Hemaglutinação IgG - amostra 2
    translated_name: Hemagglutination IgG serology - sample 2
    description: >
      Second-sample result matching HEM_IGG_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as HEM_IGG_S1.

  HEM_IGM_S1:
    official_name: Sorologia Hemaglutinação IgM - amostra 1
    translated_name: Hemagglutination IgM serology - sample 1
    description: >
      IgM hemagglutination-inhibition result for the first sample, the
      acute-phase test matching HEM_IGG_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as HEM_IGG_S1.

  HEM_IGM_S2:
    official_name: Sorologia Hemaglutinação IgM - amostra 2
    translated_name: Hemagglutination IgM serology - sample 2
    description: >
      Second-sample result matching HEM_IGM_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as HEM_IGG_S1.

  HIPEREMIA:
    official_name: Hiperemia
    translated_name: Skin hyperemia/flushing
    description: >
      Whether the Brazilian spotted fever patient showed hyperemia (skin
      redness/flushing), a clinical-signs checklist item alongside
      LINFADENO.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and FMAC series
      membership. Skin hyperemia is a recognized early clinical finding in
      Brazilian spotted fever, fitting alongside the confirmed-series
      siblings EQUINOS, HEMORRAG and LINFADENO on the same checklist.

  IGG_T2:
    official_name: Título IgG - 2ª amostra
    translated_name: IgG titer - 2nd sample
    description: >
      IgG antibody titer from the plague hemagglutination-inhibition test on
      the second sample, a companion field to the qualitative HEMO_IGG
      result.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C2, two digits — a titer
      dilution step rather than a Sim/Não flag) and PEST series membership.
      "T2" reads as "titer, 2nd sample", quantifying how strong the reaction
      was on top of the qualitative HEMO_IGG/HEMO_IGM results.

  IGM_T1:
    official_name: Título IgM - 1ª amostra
    translated_name: IgM titer - 1st sample
    description: >
      IgM antibody titer from the same plague hemagglutination-inhibition
      test, read on the first sample; sibling field to IGG_T2.
    code_system: internal
    source: inferred
    reasoning: Same basis as IGG_T2, C2 width and PEST series membership.

  IMU_IGG_S1:
    official_name: Sorologia Imunofluorescência IgG - amostra 1
    translated_name: Immunofluorescence IgG serology - sample 1
    description: >
      IgG immunofluorescence (IFI) result for the first sample in a Chagas
      Aguda investigation, the third serology method on this form alongside
      ELISA (ELI_IGG_S1) and hemagglutination (HEM_IGG_S1).
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and CHAG series
      membership. Immunofluorescence is the standard third leg of a Chagas
      serology panel run with ELISA and hemagglutination inhibition, and the
      naming mirrors the confirmed pattern of the other two methods on this
      same form.

  IMU_IGG_S2:
    official_name: Sorologia Imunofluorescência IgG - amostra 2
    translated_name: Immunofluorescence IgG serology - sample 2
    description: >
      Second-sample result matching IMU_IGG_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as IMU_IGG_S1.

  IMU_IGM_S1:
    official_name: Sorologia Imunofluorescência IgM - amostra 1
    translated_name: Immunofluorescence IgM serology - sample 1
    description: >
      IgM immunofluorescence result for the first sample, the acute-phase
      test matching IMU_IGG_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as IMU_IGG_S1.

  IMU_IGM_S2:
    official_name: Sorologia Imunofluorescência IgM - amostra 2
    translated_name: Immunofluorescence IgM serology - sample 2
    description: >
      Second-sample result matching IMU_IGM_S1.
    code_system: internal
    source: inferred
    reasoning: Same basis as IMU_IGG_S1.

  INFECCIOSO:
    official_name: Quadro infeccioso associado
    translated_name: Associated infectious condition (flag)
    description: >
      Whether the visceral leishmaniasis patient had a concurrent infectious
      condition complicating the clinical picture (e.g. a secondary
      bacterial infection), recorded as a single coded flag.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and LEIV series
      membership. Secondary bacterial infection is a well-known complication
      driving mortality in visceral leishmaniasis, making a general
      infectious-complication flag a plausible fit for the name and width,
      though no document confirms the exact wording.

  LAB_ESFR:
    official_name: Esfregaço
    translated_name: Smear microscopy result
    description: >
      Result of direct smear microscopy (e.g. of bubo aspirate or blood) for
      Yersinia pestis in a plague investigation, a rapid bedside test
      distinct from the culture result in LAB_HEMO.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and PEST series
      membership. "Esfregaço" (smear) is standard plague-diagnosis
      terminology for direct microscopy of bubo aspirate, one of the fastest
      confirmatory tests available and a natural companion to the culture and
      serology fields confirmed elsewhere on this form.

  LAB_HEMO:
    official_name: Hemocultura
    translated_name: Blood/bubo culture result
    description: >
      Result of microbial culture (blood or bubo aspirate) for Yersinia
      pestis, the plague form's culture-based confirmation test, distinct
      from the Chagas HEMOCULT field on a different agravo.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and PEST series
      membership. Culture is the reference standard for confirming plague,
      and pairing it with the confirmed LAB_ESFR (smear) and
      ELISA/hemagglutination serology fields on the same form fits the
      standard plague diagnostic workup.

  LINFADENO:
    official_name: Linfadenopatia
    translated_name: Lymphadenopathy
    description: >
      Whether the Brazilian spotted fever patient had swollen lymph nodes, a
      clinical-signs checklist item alongside HIPEREMIA and HEMORRAG.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and FMAC series
      membership. Lymphadenopathy is a documented clinical finding in
      rickettsial spotted fevers, fitting the same checklist as the
      confirmed-series siblings EQUINOS, FOI_MATA and HIPEREMIA.

  MICRO_HEMA:
    official_name: Micro-hematócrito
    translated_name: Microhematocrit concentration test
    description: >
      Result of the microhematocrit technique, a direct parasitological
      method for finding circulating Trypanosoma cruzi in acute Chagas
      disease; sibling direct-detection test to HEMOCULT on the same form.
    code_system: internal
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C1) and CHAG series
      membership. Microhematocrit concentration is a standard, widely used
      parasitological test specifically for acute Chagas disease, and its
      pairing with HEMOCULT (also CHAG, also a direct-detection method)
      supports the reading.

  EXTRAPUL_O:
    official_name: Forma extrapulmonar - Outra
    translated_name: Extrapulmonary site - other, specified
    description: >
      Free-text name of the extrapulmonary tuberculosis site when it is not
      one of the form's named options (e.g. pleural, ganglionar, óssea,
      miliar), on the tuberculosis investigation form.
    code_system: none
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C30, a free-text width) and
      TUBE series membership. TUBE forms code the extrapulmonary site from a
      fixed list with an "outra" escape hatch, matching the standard
      coded-field-plus-free-text-specify pattern confirmed repeatedly
      elsewhere in SINAN (e.g. MAT_ORG_DE, ESP_OUT).

  FC_CONT_DE:
    official_name: Fonte de contaminação - descrição
    translated_name: Contamination source, described
    description: >
      Free-text description of the suspected contamination source (e.g. a
      specific water supply or food item) in a cholera investigation, likely
      the free-text half of a coded contamination-source field.
    code_system: none
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C30, a free-text width) and
      COLE (Cólera) series membership. "FC" plausibly abbreviates "fonte de
      contaminação" (contamination source) and "DE" the
      "descrição/especificar" suffix SINAN uses throughout for the free-text
      half of a coded-plus-specify field pair.

  GENOT_G:
    official_name: Genótipo G
    translated_name: Rotavirus G genotype
    description: >
      Rotavirus G-genotype (VP7 glycoprotein) identified by molecular typing,
      the first half of the standard G/P rotavirus strain nomenclature (e.g.
      G1P[8]); paired with GENOT_P.
    code_system: none
    source: inferred
    reasoning: >
      No catalog evidence beyond declared type (C4) and ROTA (Rotavírus)
      series membership. G/P genotyping is the universal molecular
      classification scheme for rotavirus strains, making this pairing
      essentially unambiguous from the field names and agravo alone.

  GENOT_P:
    official_name: Genótipo P
    translated_name: Rotavirus P genotype
    description: >
      Rotavirus P-genotype (VP4 protease-sensitive protein) identified by
      molecular typing, the second half of the G/P strain nomenclature;
      sibling field to GENOT_G.
    code_system: none
    source: inferred
    reasoning: >
      Same basis as GENOT_G: C4 width and ROTA series membership, with the
      universal G/P rotavirus genotyping scheme making the pairing
      unambiguous.
