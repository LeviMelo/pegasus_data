  SERAP01P:
    official_name: Servico de apoio S.A.M.E. ou S.P.P. proprio
    translated_name: Medical-records service (SAME/SPP) provided in-house
    description: >-
      Flag (1-sim, 0-nao) for whether the establishment provides its 'S.A.M.E. ou S.P.P.'
      support service with its own in-house staff/structure, as opposed to outsourcing it
      (see SERAP01T). A 0 does not mean the service is absent - it may still be delivered
      on an outsourced basis.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
