  SERAP01T:
    official_name: Servico de apoio S.A.M.E. ou S.P.P. terceirizado
    translated_name: Medical-records service (SAME/SPP) outsourced
    description: >-
      Flag (1-sim, 0-nao) for whether the establishment's 'S.A.M.E. ou S.P.P.' support service
      is delivered by an outsourced/third-party provider rather than in-house staff (see SERAP01P).
      The two flags are not mutually exclusive in principle (a service could be partly own,
      partly contracted) and neither records volume or contract value.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
