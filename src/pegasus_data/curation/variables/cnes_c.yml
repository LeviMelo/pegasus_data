system: CNES
asserted_by: pegasus_data
variables:
  QTLEITP1:
    official_name: Quantidade de leitos tipo 1 (cirurgico) existentes
    translated_name: Existing surgical beds (legacy rollup)
    description: >-
      Count of hospital beds of the broad legacy category 'tipo 1 (cirurgico)' reported by
      the establishment on the Estabelecimentos (ST) record. This is a coarse, establishment-level
      rollup that predates the specialty-level bed breakdown carried in the Leitos (LT) file,
      where the same beds are instead split by TP_LEITO/CODLEITO/QT_EXIST/QT_SUS.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 54
    notes: >-
      Legacy field. For current, specialty-level bed counts (and the SUS-available subset),
      use the LT*.dbf file instead - QTLEITP1-3 can disagree with LT because they are not
      always refreshed on the same cadence.
  QTLEITP2:
    official_name: Quantidade de leitos tipo 2 (clinico) existentes
    translated_name: Existing clinical beds (legacy rollup)
    description: >-
      Count of hospital beds of the broad legacy category 'tipo 2 (clinico)' reported on the
      Estabelecimentos (ST) record; sibling field to QTLEITP1 and QTLEITP3.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 55
    notes: >-
      See QTLEITP1 note on preferring LT*.dbf for current specialty-level bed counts.
  QTLEITP3:
    official_name: Quantidade de leitos tipo 3 (complementar) existentes
    translated_name: Existing complementary beds (legacy rollup)
    description: >-
      Count of hospital beds of the broad legacy category 'tipo 3 (complementar)' (e.g. ICU/intermediate-care
      type beds bundled together) reported on the Estabelecimentos (ST) record; sibling field
      to QTLEITP1 and QTLEITP2.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 56
    notes: >-
      See QTLEITP1 note on preferring LT*.dbf for current specialty-level bed counts.
  RES_BIOL:
    official_name: Existe coleta de residuo biologico
    translated_name: Biological waste collection exists
    description: >-
      Flag for whether the establishment declared having a collection circuit for biological
      waste (1-sim, 0-nao). It records the declared existence of a segregated biological-waste
      collection arrangement, not a volume, a provider, or verified regulatory compliance
      (Brazil's ANVISA RDC waste-management rules require segregated biological/chemical/radioactive/common
      streams for health establishments).
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 139
    codelists:
    - RES_BIOL
