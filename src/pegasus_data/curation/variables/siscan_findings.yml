# SISCAN — the findings themselves: what the slide and the mammogram showed.
#
# Two blocks, and the naming tells them apart.
#
# The mammography fields come in D/E pairs — direita and esquerda — because a
# mammogram reports each breast separately and a finding on one says nothing
# about the other. CNODCALD and CNODCALE are the same finding on the right and
# the left, and collapsing them loses the laterality that makes the report
# clinically usable.
#
# The cytology and histopathology fields follow the Brazilian nomenclature for
# cervical reporting: adequacy of the sample, benign reactive changes, then the
# lesion itself, then the surgical margins. The abbreviations are truncated to
# the ten characters a DBF field name allows, which is why they read as they do.
#
# All the C(8) fields are counts, not flags: these files aggregate exams, so a
# row carries how many reports carried each finding.
#
# Left out because the abbreviation does not settle them: CCOLDEFAUL,
# CO_EXTEN_C/L/P/V, CO_CTRL_BL, CO_CTRL_FR, CO_COLP_PO, CO_MAT_INS.
system: SISCAN
asserted_by: pegasus_data

variables:

  # =================================================== mammography, per breast

  CNODCALD:
    official_name: Nódulo calcificado, mama direita
    translated_name: Calcified nodule, right breast
    description: >
      Number of reports finding a calcified nodule in the right breast.
      Calcification within a nodule is generally the reassuring finding, as
      against the dense nodules recorded separately.
    code_system: none
    source: inferred
    reasoning: >
      NOD is nódulo and CAL calcificado, with the D suffix that marks direita
      throughout this block; C(8), a count like every finding field here.

  CNODCALE:
    official_name: Nódulo calcificado, mama esquerda
    translated_name: Calcified nodule, left breast
    description: >
      The same calcified-nodule count for the left breast. Paired with CNODCALD
      because a mammogram reports the two sides separately.
    code_system: none
    source: inferred
    reasoning: E marks esquerda, the counterpart of the D suffix.

  CNODDEND:
    official_name: Nódulo denso, mama direita
    translated_name: Dense nodule, right breast
    description: >
      Number of reports finding a dense nodule in the right breast — the finding
      that ordinarily prompts further investigation rather than routine recall.
    code_system: none
    source: inferred
    reasoning: NOD DEN is nódulo denso; D for direita, C(8) count.

  CNODDENE:
    official_name: Nódulo denso, mama esquerda
    translated_name: Dense nodule, left breast
    description: >
      Dense nodules found in the left breast, the counterpart of CNODDEND.
    code_system: none
    source: inferred
    reasoning: E for esquerda, sibling of CNODDEND.

  CNODDENHED:
    official_name: Nódulo denso heterogêneo, mama direita
    translated_name: Heterogeneous dense nodule, right breast
    description: >
      Dense nodules of heterogeneous appearance in the right breast — a
      subdivision of the dense-nodule finding, heterogeneity being the feature
      that raises concern.
    code_system: none
    source: inferred
    reasoning: >
      HE extends the NODDEN stem with heterogêneo before the D laterality
      suffix; C(8) count.

  CNODDENHEE:
    official_name: Nódulo denso heterogêneo, mama esquerda
    translated_name: Heterogeneous dense nodule, left breast
    description: >
      The heterogeneous dense-nodule count for the left breast.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same NODDENHE stem.

  CCALCASPBD:
    official_name: Calcificações de aspecto benigno, mama direita
    translated_name: Benign-appearing calcifications, right breast
    description: >
      Number of reports finding calcifications of benign appearance in the right
      breast. Their morphology is what separates them from the suspicious
      microcalcifications that prompt biopsy.
    code_system: none
    source: inferred
    reasoning: CALC ASP B reads calcificações aspecto benigno; D for direita, C(8).

  CCALCASPBE:
    official_name: Calcificações de aspecto benigno, mama esquerda
    translated_name: Benign-appearing calcifications, left breast
    description: >
      The benign-calcification count for the left breast.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.

  CCALCVASCD:
    official_name: Calcificações vasculares, mama direita
    translated_name: Vascular calcifications, right breast
    description: >
      Calcifications following the line of a blood vessel in the right breast.
      Recorded apart from other benign calcifications because their cause is
      arterial rather than glandular.
    code_system: none
    source: inferred
    reasoning: CALC VASC is calcificações vasculares; D for direita, C(8).

  CCALCVASCE:
    official_name: Calcificações vasculares, mama esquerda
    translated_name: Vascular calcifications, left breast
    description: >
      Vascular calcifications in the left breast.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.

  CDISARQCID:
    official_name: Distorção arquitetural, mama direita
    translated_name: Architectural distortion, right breast
    description: >
      Distortion of the breast's normal architecture on the right, with no
      discrete mass — a subtle finding that can be the only sign of a malignancy.
    code_system: none
    source: inferred
    reasoning: >
      DIS ARQ reads distorção arquitetural; the trailing D is the laterality
      suffix used by every field in this block. C(8) count.

  CDISARQCIE:
    official_name: Distorção arquitetural, mama esquerda
    translated_name: Architectural distortion, left breast
    description: >
      Architectural distortion on the left.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.

  CLINFINTRD:
    official_name: Linfonodo intramamário, mama direita
    translated_name: Intramammary lymph node, right breast
    description: >
      An intramammary lymph node seen on the right. Normally an incidental and
      benign finding, recorded so that it is not mistaken for a mass.
    code_system: none
    source: inferred
    reasoning: LINF INTR is linfonodo intramamário; D for direita, C(8).

  CLINFINTRE:
    official_name: Linfonodo intramamário, mama esquerda
    translated_name: Intramammary lymph node, left breast
    description: >
      An intramammary lymph node seen on the left.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.

  CIMPINTEGD:
    official_name: Implante íntegro, mama direita
    translated_name: Implant intact, right breast
    description: >
      Whether a breast implant on the right appears intact. Present because an
      implant changes both how the mammogram is taken and how it is read.
    code_system: none
    source: inferred
    reasoning: IMP INTEG is implante íntegro; D for direita, C(8) count.

  CIMPINTEGE:
    official_name: Implante íntegro, mama esquerda
    translated_name: Implant intact, left breast
    description: >
      Whether the left implant appears intact.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.

  CIMPSINRUD:
    official_name: Implante com sinais de rotura, mama direita
    translated_name: Implant with signs of rupture, right breast
    description: >
      Signs of rupture in a right-side implant — the finding CIMPINTEGD exists
      to be contrasted with.
    code_system: none
    source: inferred
    reasoning: >
      IMP SIN RU reads implante sinais de rotura, the negative counterpart of
      the IMPINTEG stem. C(8).

  CIMPSINRUE:
    official_name: Implante com sinais de rotura, mama esquerda
    translated_name: Implant with signs of rupture, left breast
    description: >
      Signs of rupture in a left-side implant.
    code_system: none
    source: inferred
    reasoning: E laterality suffix on the same stem.

  CCONRECOMD:
    official_name: Conduta recomendada, mama direita
    translated_name: Recommended management, right breast
    description: >
      What the radiologist recommends next for the right breast — routine
      recall, short-interval follow-up, further imaging or biopsy. The
      actionable end of the report.
    code_system: internal
    source: inferred
    reasoning: >
      CON RECOM is conduta recomendada; unlike the findings around it this is
      C(1), a single coded decision rather than a count.

  CCONRECOME:
    official_name: Conduta recomendada, mama esquerda
    translated_name: Recommended management, left breast
    description: >
      The recommendation for the left breast, which can differ from the right.
    code_system: internal
    source: inferred
    reasoning: E laterality suffix, same C(1) coded decision.

  # ============================================ cervical cytology: the sample

  CO_AMOSTRA:
    official_name: Adequabilidade da amostra
    translated_name: Sample adequacy
    description: >
      Whether the collected material was adequate to report on. An inadequate
      sample means the woman must be recalled, so this is the first thing a
      cytology report settles.
    code_system: internal
    source: inferred
    reasoning: >
      AMOSTRA is the sample; C(1) admits the small enumerated set the Brazilian
      nomenclature defines for adequacy.

  CCOLNORMAL:
    official_name: Colpocitologia normal
    translated_name: Cytology within normal limits
    description: >
      Number of cytology reports within normal limits — no epithelial lesion and
      no malignancy.
    code_system: none
    source: inferred
    reasoning: >
      CCOL is the cytology prefix of this block and NORMAL its outcome; C(8)
      count, like its ANORMA and INSATI siblings.

  CCOLANORMA:
    official_name: Colpocitologia anormal
    translated_name: Cytology abnormal
    description: >
      Number of cytology reports showing an abnormality — the complement of
      CCOLNORMAL, and what the screening programme is measured on finding.
    code_system: none
    source: inferred
    reasoning: ANORMA is anormal, truncated; C(8) count in the CCOL block.

  CCOLINSATI:
    official_name: Colpocitologia insatisfatória
    translated_name: Cytology unsatisfactory
    description: >
      Number of reports the laboratory could not read — obscured, scant or badly
      fixed material. A high rate here is a collection-quality problem, not a
      disease signal.
    code_system: none
    source: inferred
    reasoning: INSATI is insatisfatória truncated; C(8) count.

  CDIEXAMINS:
    official_name: Exame insatisfatório
    translated_name: Examination unsatisfactory
    description: >
      Count of examinations reported as unsatisfactory in the diagnostic block,
      recorded apart from the sample-level CCOLINSATI.
    code_system: none
    source: inferred
    reasoning: EXAM INS reads exame insatisfatório; C(8) count.

  CO_CEL_ESC:
    official_name: Células escamosas
    translated_name: Squamous cells present
    description: >
      Whether squamous epithelial cells were present in the sample. Their
      presence, with the endocervical cells, is what makes a smear
      representative of the transformation zone.
    code_system: internal
    source: inferred
    reasoning: CEL ESC is células escamosas; C(1) flag.

  # ==================================== benign reactive changes, per category

  CO_BEN_ATR:
    official_name: Alteração benigna — atrofia
    translated_name: "Benign change: atrophy"
    description: >
      Atrophy recorded as a benign reactive change. Common after the menopause
      and not a lesion, but it makes a smear harder to read.
    code_system: internal
    source: inferred
    reasoning: >
      BEN is the benign-changes block and ATR atrofia; C(1) flag, matching its
      INF, RAD and REP siblings.

  CO_BEN_INF:
    official_name: Alteração benigna — inflamação
    translated_name: "Benign change: inflammation"
    description: >
      Inflammation recorded as a benign reactive change — by far the commonest
      finding on a cervical smear and not in itself a reason to treat.
    code_system: internal
    source: inferred
    reasoning: INF is inflamação in the BEN block; C(1) flag.

  CO_BEN_RAD:
    official_name: Alteração benigna — radiação
    translated_name: "Benign change: radiation effect"
    description: >
      Cell changes attributable to previous radiotherapy. Recorded so they are
      not mistaken for dysplasia, which they can resemble.
    code_system: internal
    source: inferred
    reasoning: RAD is radiação in the BEN block; C(1) flag.

  CO_BEN_REP:
    official_name: Alteração benigna — reparação
    translated_name: "Benign change: repair"
    description: >
      Reparative change, the appearance of epithelium healing after injury.
      Benign, and another pattern that can be over-read as a lesion.
    code_system: internal
    source: inferred
    reasoning: REP is reparação in the BEN block; C(1) flag.

  CO_BEN_CER:
    official_name: Alteração benigna — cervicite
    translated_name: "Benign change: cervicitis"
    description: >
      Cervicitis, chronic inflammation of the cervix, recorded among the benign
      changes.
    code_system: internal
    source: inferred
    reasoning: >
      CER is cervicite in the BEN block; C(2) here where its siblings are C(1),
      so it admits more than a plain flag.

  CO_BEN_ALT:
    official_name: Alteração benigna
    translated_name: Benign change present
    description: >
      Whether any benign reactive change was recorded at all — the header of the
      block whose individual categories are the ATR, INF, RAD, REP and CER
      fields.
    code_system: internal
    source: inferred
    reasoning: ALT is alteração, the general case of the block; C(1) flag.

  CO_BEN_OUT:
    official_name: Alteração benigna — outras
    translated_name: "Benign change: other"
    description: >
      A benign change the block's named categories do not cover. The catch-all
      that closes the enumeration.
    code_system: internal
    source: inferred
    reasoning: >
      OUT is outras, and an OUT/OUTRO suffix is how DATASUS closes an enumerated
      checklist throughout; C(1) flag.

  # ====================================== the lesion, and how far it goes

  CDIFGRAU:
    official_name: Grau de diferenciação
    translated_name: Degree of differentiation
    description: >
      Count of reports stating the tumour's degree of differentiation — how
      closely the malignant cells still resemble the tissue they arose from,
      which is a determinant of prognosis.
    code_system: none
    source: inferred
    reasoning: DIF GRAU reads grau de diferenciação; C(8) count in the histopathology block.

  CDIFMODDIF:
    official_name: Moderadamente diferenciado
    translated_name: Moderately differentiated
    description: >
      Reports grading the tumour moderately differentiated — the middle of the
      three grades this block enumerates.
    code_system: none
    source: inferred
    reasoning: MOD DIF is moderadamente diferenciado; C(8) count.

  CDIFPOUDIF:
    official_name: Pouco diferenciado
    translated_name: Poorly differentiated
    description: >
      Reports grading the tumour poorly differentiated — the grade carrying the
      worst prognosis of the three.
    code_system: none
    source: inferred
    reasoning: POU DIF is pouco diferenciado; C(8) count.

  CDIFINDFER:
    official_name: Indiferenciado
    translated_name: Undifferentiated
    description: >
      Reports of tumour so undifferentiated that the tissue of origin can no
      longer be told from its appearance.
    code_system: none
    source: inferred
    reasoning: INDFER is indiferenciado truncated; C(8) count in the same grading block.

  CMARLIVRE:
    official_name: Margens livres
    translated_name: Surgical margins clear
    description: >
      Reports in which the surgical margins were free of disease — the finding
      that says the excision took all of the lesion.
    code_system: none
    source: inferred
    reasoning: MAR LIVRE is margens livres; C(8) count.

  CMARCOMPRO:
    official_name: Margens comprometidas
    translated_name: Surgical margins involved
    description: >
      Reports in which disease reached the surgical margin, meaning the excision
      was incomplete and further treatment follows.
    code_system: none
    source: inferred
    reasoning: COMPRO is comprometidas truncated; the counterpart of CMARLIVRE. C(8).

  CMARIMPAVA:
    official_name: Margens impossíveis de avaliar
    translated_name: Surgical margins not assessable
    description: >
      Reports where the margins could not be assessed — fragmented or
      cauterised specimens. Distinct from involved margins, and neither
      reassuring nor conclusive.
    code_system: none
    source: inferred
    reasoning: >
      IMP AVA reads impossível avaliar, the third state alongside livre and
      comprometida. C(8) count.

  CLABCID:
    official_name: Descrição do diagnóstico
    translated_name: Diagnosis, free text
    description: >
      Free-text diagnosis as the laboratory wrote it, in forty characters —
      alongside rather than instead of the coded findings.
    code_system: none
    source: inferred
    reasoning: >
      C(40) is far too wide for a CID-10 code and is the only free-text field in
      the block, so it carries the wording rather than the code.
    notes: >
      Free text, uncoded. Do not tabulate without reading it.
