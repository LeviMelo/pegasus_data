# PAINEL_ONCOLOGIA.PO — Oncology panel
# Painel de Oncologia
#
# One cancer patient followed from diagnosis to first treatment, which is what
# makes the sixty-day interval measurable.
system: PAINEL_ONCOLOGIA
asserted_by: pegasus_data

variables:
  ANOMES_DIA:
    official_name: Ano e mês do diagnóstico
    translated_name: Year and month of diagnosis
    description: 'Diagnosis month as AAAAMM, the finer companion to ANO_DIAGN. Month
      is as precise as the panel goes; the exact date is not published.

      '
    code_system: internal
    source: def
    source_ref: PERIODO_DIAGNOSTICO.CNV
    reasoning: C(6) AAAAMM bound to PERIODO_DIAGNOSTICO.
  ANOMES_TRA:
    official_name: Ano e mês do tratamento
    translated_name: Year and month treatment began
    description: Treatment month as AAAAMM, the counterpart of ANOMES_DIA.
    code_system: internal
    source: def
    source_ref: PERIODO_TRATAMENTO.CNV
    reasoning: C(6) AAAAMM bound to PERIODO_TRATAMENTO.
  ANO_DIAGN:
    official_name: Ano do diagnóstico
    translated_name: Year of diagnosis
    description: 'Year the cancer was diagnosed. The cohort year: a patient belongs
      to the year they were diagnosed, not the year they were treated, and mixing the
      two makes the sixty-day indicator uninterpretable.

      '
    code_system: internal
    source: def
    source_ref: ANO_DIAGNOSTICO.CNV
    reasoning: C(4) year bound to ANO_DIAGNOSTICO.
  ANO_TRATAM:
    official_name: Ano do tratamento
    translated_name: Year treatment began
    description: 'Year the first treatment began. Later than ANO_DIAGN, and different
      for any patient diagnosed near a year end — which is why the cohort must be built
      on the diagnosis year.

      '
    code_system: internal
    source: def
    source_ref: ANO_TRATAMENTO.CNV
    reasoning: C(4) year bound to ANO_TRATAMENTO.
  CNES_DIAG:
    official_name: CNES do estabelecimento de diagnóstico
    translated_name: CNES of the diagnosing establishment
    description: 'The establishment that made the diagnosis, by CNES code. Joins to
      the CNES register, which is how the diagnosing service''s type and size can be
      brought into the analysis.

      '
    code_system: internal
    source: def
    source_ref: CNES_DIAGNOSTICO.CNV
    reasoning: C(7) CNES establishment code bound to CNES_DIAGNOSTICO.
  CNES_TRAT:
    official_name: CNES do estabelecimento de tratamento
    translated_name: CNES of the treating establishment
    description: 'The establishment that gave the first treatment. Frequently a different
      one from CNES_DIAG, and the referral between them is where much of the sixty
      days is spent.

      '
    code_system: internal
    source: def
    source_ref: CNES_TRATAMENTO.CNV
    reasoning: C(7) CNES establishment code bound to CNES_TRATAMENTO.
  CNS_PAC:
    official_name: Cartão Nacional de Saúde do paciente
    translated_name: Patient national health card number
    description: 'The patient''s CNS — the national health card number that identifies
      a person across every SUS system. It is what makes this panel able to follow
      one patient from diagnosis to treatment.

      '
    code_system: none
    source: inferred
    reasoning: 'CNS is the national health card and PAC paciente; declared C(15), which
      is the CNS length.

      '
    notes: 'UNVERIFIED whether this holds a readable CNS. The equivalent SIASUS column
      (AP_CNSPCN) was measured and is obfuscated — fifteen non-numeric bytes, not a
      CNS — but that result is SIASUS''s and has not been tested here, so do not assume
      it either way. Whatever it holds, it passes through this module unmodified: no
      masking, hashing or dropping, because that decision belongs to the Ministry and
      not to a library. Beside DT_NASC and a diagnosis the row is re-identifying regardless
      of whether this column is readable.

      '
  DIAGNOSTIC:
    official_name: Grupo diagnóstico
    translated_name: Diagnosis group
    description: 'Which group the tumour falls in: malignant neoplasms covered by Lei
      12.732/12, in situ neoplasms, neoplasms of uncertain behaviour, or the C44 and
      C73 exclusions. Only the first group is subject to the sixty-day rule, so this
      field decides who the indicator applies to.

      '
    code_system: internal
    source: def
    source_ref: DIAGNOSTICO_AGR.CNV
    reasoning: 'Bound to DIAGNOSTICO_AGR, whose first value names Lei 12.732/12 explicitly.

      '
  DIAG_DETH:
    official_name: Diagnóstico detalhado
    translated_name: Detailed diagnosis
    description: 'The tumour site in more detail than DIAGNOSTIC, on a CID-10 derived
      grouping. Use it when the question is about a particular cancer rather than about
      the legal obligation.

      '
    code_system: internal
    source: def
    source_ref: DIAGNOSTICO.CNV
    reasoning: C(3) code bound to DIAGNOSTICO, a finer split than DIAGNOSTICO_AGR.
  DT_DIAG:
    official_name: Data do diagnóstico
    translated_name: Date of diagnosis
    description: 'Date the cancer was diagnosed. The start of the interval the sixty-day
      treatment law is measured over, so it decides whether a case counts as treated
      in time.

      '
    code_system: none
    source: inferred
    reasoning: 'DT_ is the date prefix and DIAG diagnóstico; C(10) is a formatted date
      with separators rather than the bare AAAAMMDD used elsewhere.

      '
    notes: 'Ten characters, so it carries separators — unlike the C(8) dates in SIH
      and SIM. Parse it as formatted text, not as AAAAMMDD.

      '
  DT_NASC:
    official_name: Data de nascimento
    translated_name: Date of birth
    description: 'Patient''s date of birth, from which age at diagnosis is computed
      rather than being stored.

      '
    code_system: none
    source: inferred
    reasoning: NASC is nascimento; same C(10) formatted-date shape.
    notes: 'A date of birth beside a national health-card number is identifying. Handle
      it as such.

      '
  DT_TRAT:
    official_name: Data do início do tratamento
    translated_name: Date treatment began
    description: 'Date the first cancer treatment began. With DT_DIAG it forms the
      interval the panel reports, and the gap between them is the number the policy
      is judged on.

      '
    code_system: none
    source: inferred
    reasoning: TRAT is tratamento; same C(10) formatted-date shape as DT_DIAG.
  ESTADIAM:
    official_name: Estadiamento
    translated_name: Stage at diagnosis
    description: 'Stage 0 to 4 at diagnosis, with values for not applicable and unknown.
      The single most important prognostic variable, and the one that makes treatment
      delay meaningful: late stage may reflect the delay before diagnosis rather than
      after it.

      '
    code_system: internal
    source: def
    source_ref: ESTADIAMENTO.CNV
    reasoning: 'Bound to ESTADIAMENTO, whose values are 0 through 4 plus não se aplica
      and ignorado.

      '
  IDADE:
    official_name: Idade
    translated_name: Age
    description: 'Age at diagnosis, also offered banded into age groups. Unlike SIM
      and SIH, the unit here is years and is not packed with a separate unit code.

      '
    code_system: internal
    source: def
    source_ref: IDADE.CNV
    reasoning: C(3) bound to IDADE and to FAIXA_ETARIA for the banded form.
  MUN_DIAG:
    official_name: Município do diagnóstico
    translated_name: Municipality of diagnosis
    description: Municipality where the diagnosis was made, by IBGE code.
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: C(6) IBGE municipality code bound to BR_MUNICIP.
  MUN_RESID:
    official_name: Município de residência
    translated_name: Municipality of residence
    description: 'Where the patient lives. The only one of the three municipality columns
      that supports a population rate, because it is the only one that matches the
      denominator.

      '
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: C(6) IBGE municipality code bound to BR_MUNICIP.
  MUN_TRATAM:
    official_name: Município do tratamento
    translated_name: Municipality of treatment
    description: 'Municipality where treatment began. Oncology is concentrated in a
      small number of accredited centres, so this is heavily clustered and is not a
      measure of where patients come from.

      '
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: C(6) IBGE municipality code bound to BR_MUNICIP.
  TEMPO_TRAT:
    official_name: Tempo até o tratamento
    translated_name: Time to treatment
    description: 'Days from diagnosis to first treatment, banded up to 30, 31 to 60,
      and more than 60. The last band is the legal breach the panel exists to count.
      Negative bands also occur, meaning treatment was recorded before the diagnosis
      date — a data problem, not a fast service.

      '
    code_system: internal
    source: def
    source_ref: TEMPO_TRATAMENTO.CNV
    reasoning: 'Bound to TEMPO_TRATAMENTO, whose bands are até 30 dias, 31-60 and mais
      de 60, plus negative ranges and a sem informação value.

      '
  TRATAMENTO:
    official_name: Tipo de tratamento
    translated_name: Treatment type
    description: 'What the first treatment was — surgery, chemotherapy, radiotherapy,
      or a combination. The no-information value is a real category here rather than
      a missing value, since the panel keeps patients whose treatment it could not
      identify.

      '
    code_system: internal
    source: def
    source_ref: TP_TRATAMENTO.CNV
    reasoning: 'Bound to TP_TRATAMENTO, whose values are cirurgia, quimioterapia, radioterapia,
      ambos and sem informação de tratamento.

      '
  UF_DIAGN:
    official_name: UF do diagnóstico
    translated_name: State of diagnosis
    description: State where the diagnosis was made, the coarser companion to MUN_DIAG.
    code_system: internal
    source: def
    source_ref: BR_UF.CNV
    reasoning: C(2) state code bound to BR_UF.
  UF_RESID:
    official_name: UF de residência
    translated_name: State of residence
    description: State the patient lives in, the coarser companion to MUN_RESID.
    code_system: internal
    source: def
    source_ref: BR_UF.CNV
    reasoning: C(2) state code bound to BR_UF.
  UF_TRATAM:
    official_name: UF do tratamento
    translated_name: State of treatment
    description: 'State where treatment began. Differs from UF_RESID often enough that
      cross-state travel for cancer treatment is measurable from this pair.

      '
    code_system: internal
    source: def
    source_ref: BR_UF.CNV
    reasoning: C(2) state code bound to BR_UF.
