system: SINAN
asserted_by: pegasus_data

variables:

  # --- DENG (dengue): fatal/severe-case clinical review ---

  ASCITE:
    official_name: Ascite
    translated_name: Ascites
    description: >
      Whether the patient had ascites (fluid in the abdominal cavity), one of
      the plasma-leakage warning signs checked when reviewing a severe or
      fatal dengue case, alongside MIOCARDI and INSUFICIEN.
    code_system: none
    source: inferred
    reasoning: >
      C1 flag in a low-coverage DENG stratum; ASCITE directly names the
      clinical sign, a recognized severe-dengue plasma-leakage marker.

  DT_CHOQUE:
    official_name: Data do choque
    translated_name: Date of shock onset
    description: >
      Calendar date the patient developed dengue shock syndrome, if it
      occurred — the point of hemodynamic decompensation from plasma
      leakage. Recorded with DT_COL_PLQ and DT_SOROR1 to reconstruct the
      clinical timeline of a severe case.
    code_system: none
    source: inferred
    reasoning: >
      D8 date field named CHOQUE (shock); DT_ is the date prefix, grouped
      with other timeline dates in the same DENG stratum.

  DT_COL_PLQ:
    official_name: Data de coleta de plaquetas
    translated_name: Date platelet-count sample was collected
    description: >
      Date blood was drawn to count platelets, tracking thrombocytopenia — a
      core severe-dengue marker. Distinct from DT_SOROR1, which dates the
      serology sample instead.
    code_system: none
    source: inferred
    reasoning: D8 date; COL=coleta, PLQ=plaquetas, matches the lab-timeline fields in this stratum.

  DT_SOROR1:
    official_name: Data da 1ª sorologia
    translated_name: Date of first serology sample collection
    description: >
      Date the first blood sample for dengue serology (IgM/IgG) was drawn.
      Distinct from DT_COL_PLQ (platelet count) — used to judge whether
      serology was collected within the diagnostic window.
    code_system: none
    source: inferred
    reasoning: D8 date; SOROR=sorologia, trailing 1 marks it as the first of a possible series.

  HEMA_MAIOR:
    official_name: Maior valor de hematócrito
    translated_name: Highest hematocrit value recorded
    description: >
      Peak hematocrit percentage observed during the case, tracking
      hemoconcentration — a rise signals plasma leakage and impending severe
      dengue, independent of the shock and platelet dates recorded
      separately.
    code_system: none
    source: inferred
    reasoning: >
      C6 fits a percentage value rather than a flag; HEMA=hematócrito,
      MAIOR=highest, a standard severe-dengue marker.

  INSUFICIEN:
    official_name: Insuficiência de órgãos
    translated_name: Organ insufficiency (complication)
    description: >
      Whether the case involved failure of an organ system (e.g. hepatic or
      renal) as a complication — one of the fatal-case complication
      checkboxes alongside MIOCARDI and ASCITE.
    code_system: none
    source: inferred
    reasoning: C1 flag; name reads as insuficiência (insufficiency), grouped with other complication flags in the DENG stratum.

  MIOCARDI:
    official_name: Miocardite
    translated_name: Myocarditis (complication)
    description: >
      Whether myocarditis or cardiac involvement was recorded as a
      complication — a recognized severe-dengue cardiac complication,
      distinguished from the organ-failure flag INSUFICIEN and the
      fluid-accumulation sign ASCITE.
    code_system: none
    source: inferred
    reasoning: C1 flag; MIOCARDI directly names the clinical complication.

  OUTRO_S_D:
    official_name: Outro tecido - descrição
    translated_name: Other tissue collected, description
    description: >
      Free-text name of a tissue type sampled at autopsy that falls outside
      the standard checklist (heart, liver, spleen, kidney, lung, brain) —
      the write-in detail paired with the TECIDOS collection flag.
    code_system: none
    source: inferred
    reasoning: >
      C20 text sitting alongside TECIDOS in the same stratum; OUTRO=other,
      read as the specify-field for an "other tissue" checkbox rather than
      a clinical-sign field like SIN_OUT.

  RESUL_PCR:
    official_name: Resultado do PCR
    translated_name: RT-PCR test result
    description: >
      Outcome of the dengue RT-PCR molecular test (e.g. positive, negative,
      inconclusive, not done) — the direct-detection lab confirmation used
      alongside the serology dated by DT_SOROR1.
    code_system: none
    source: inferred
    reasoning: C1 coded field; RESUL_ is the lab-result prefix, PCR names the test.

  SIN_OUT:
    official_name: Outros sinais e sintomas
    translated_name: Other signs/symptoms (free text)
    description: >
      Free-text note of clinical signs or symptoms the case presented beyond
      the form's fixed checklist (ascites, myocarditis, etc.) — captured as
      a summary note rather than as individual checkboxes.
    code_system: none
    source: inferred
    reasoning: C20 text; SIN_=sinal/sintoma, OUT=outro, distinct from the tissue-specific OUTRO_S_D.

  TECIDOS:
    official_name: Coleta de tecidos
    translated_name: Tissue samples collected (flag)
    description: >
      Whether tissue samples were collected at autopsy for histopathological
      or immunohistochemical confirmation of dengue — relevant only to
      fatal cases under investigation. Paired with the free-text OUTRO_S_D.
    code_system: none
    source: inferred
    reasoning: C1 flag named directly for the action (tecidos=tissues) in the DENG death-review stratum.

  # --- HANT (hantavirose): exposure history, prodrome signs, labs, treatment ---

  ANO_DT_SIN:
    official_name: Ano da data dos primeiros sintomas
    translated_name: Year of first-symptoms date
    description: >
      Four-digit calendar year derived from DT_SIN_PRI (date of first
      symptoms) — a convenience field for tabulating cases by year of onset
      rather than year of notification, which can lag by weeks.
    code_system: none
    source: inferred
    reasoning: N4 numeric field; name reads ANO (year) + DT_SIN (first-symptoms date), a derived rollup.

  ANT_ARAGEM:
    official_name: Antecedente de aragem
    translated_name: "Exposure: plowing/tilling soil"
    description: >
      Whether the patient plowed or tilled soil before symptom onset, a
      rural-exposure question on the hantavirose form since tilling can
      aerosolize rodent excreta. Distinct from ANT_DESMAT (land clearing)
      and ANT_MOAGEM (grain milling).
    code_system: none
    source: inferred
    reasoning: N1 flag; ANT_=antecedente per prefix convention, ARAGEM=aração/aragem (plowing).

  ANT_DESMAT:
    official_name: Antecedente de desmatamento
    translated_name: "Exposure: clearing forest/brush"
    description: >
      Whether the patient cleared forest or brush before symptom onset,
      disturbing rodent habitat — one of three rural-activity exposure
      checkboxes alongside ANT_ARAGEM and ANT_MOAGEM.
    code_system: none
    source: inferred
    reasoning: N1 flag; DESMAT=desmatamento (deforestation/clearing).

  ANT_MOAGEM:
    official_name: Antecedente de moagem de grãos
    translated_name: "Exposure: grain milling/threshing"
    description: >
      Whether the patient handled or milled stored grain before symptom
      onset — the classic hantavirus exposure route via rodent-contaminated
      grain dust, completing the trio with ANT_ARAGEM and ANT_DESMAT.
    code_system: none
    source: inferred
    reasoning: N1 flag; MOAGEM=moagem (milling/grinding).

  CLI_GARGAN:
    official_name: Dor de garganta
    translated_name: Sore throat (clinical sign)
    description: >
      Whether the patient reported sore throat — checked on the hantavirose
      symptom list because its flu-like prodrome typically lacks
      upper-respiratory signs like this and CLI_RINORR, helping rule the
      case in or out.
    code_system: none
    source: inferred
    reasoning: N1 flag; CLI_=clínico prefix, GARGAN=garganta (throat).

  CLI_RINORR:
    official_name: Rinorreia
    translated_name: Runny nose / rhinorrhea (clinical sign)
    description: >
      Whether the patient had nasal discharge — recorded with CLI_GARGAN as
      a differential-diagnosis clue, since hantavirus's febrile-myalgic
      prodrome usually lacks the coryza typical of common respiratory
      infections.
    code_system: none
    source: inferred
    reasoning: N1 flag; RINORR=rinorreia (runny nose).

  CON_DIAG_D:
    official_name: Confirmação diagnóstica (nome truncado)
    translated_name: Diagnosis-confirmation flag (truncated field name)
    description: >
      Single-character flag from the hantavirose form's diagnosis section;
      DBF's 10-character limit truncated the original label. Best read as
      marking how the diagnosis was confirmed (e.g. lab vs.
      clinical-epidemiological), though the exact question isn't fully
      recoverable from the evidence available.
    code_system: none
    source: inferred
    reasoning: >
      Name is exactly 10 characters (the DBF field-name limit); CON_/DIAG_
      read as condição/diagnóstico but no dictionary or codelist entry
      survives to confirm the precise question.

  LAB_IGG_R:
    official_name: Resultado de sorologia IgG
    translated_name: IgG serology result
    description: >
      Result of the IgG antibody test for hantavirus (e.g. reactive,
      non-reactive, inconclusive) — the convalescent/later-phase serology
      marker, paired with the broader lab work in LAB_L_OUT and LAB_OUT_D.
    code_system: none
    source: inferred
    reasoning: N1 coded field; LAB_ is the lab prefix, IGG names the antibody class, R=resultado.

  LAB_L_OUT:
    official_name: Local de outro exame
    translated_name: Site of an additional lab test performed
    description: >
      Flag indicating an additional laboratory test was performed beyond
      the routine IgG panel — the yes/no companion to the free-text detail
      recorded in LAB_OUT_D.
    code_system: none
    source: inferred
    reasoning: N1 flag; LAB_=lab prefix, L_OUT reads local/outro (site/other test).

  LAB_OUT_D:
    official_name: Outro exame - descrição
    translated_name: Additional lab test, description
    description: >
      Free-text name of an extra laboratory test performed for hantavirus
      confirmation beyond routine serology (e.g. PCR, immunohistochemistry)
      — the write-in detail behind the LAB_L_OUT flag.
    code_system: none
    source: inferred
    reasoning: C18 text; OUT_D reads outro/descrição, pairing with LAB_L_OUT.

  TRA_VASOAT:
    official_name: Uso de droga vasoativa
    translated_name: Vasoactive drug treatment
    description: >
      Whether the patient received vasoactive medication (e.g.
      norepinephrine) to treat shock — relevant to hantavirus pulmonary
      syndrome's cardiogenic-shock phase, though the same field recurs on
      other severe-illness forms with a shock/ICU section.
    code_system: none
    source: inferred
    reasoning: >
      TRA_=tratamento per prefix convention, VASOAT=vasoativa; its file
      count (20) far exceeds the rest of this HANT batch (8), indicating
      it is shared with other severe-case forms rather than HANT-exclusive.
