system: SINAN
asserted_by: pegasus_data

variables:
  # --- MALA (malaria) treatment drugs and case detail ---
  AMALARIA:
    official_name: Resultado de exame para Plasmodium malariae
    translated_name: P. malariae test result
    description: >
      Result of a diagnostic test for Plasmodium malariae, one of several
      species-specific malaria result fields; likely records a different
      test method than the companion field PMALARIA (which also targets
      this species) rather than a different species.
    code_system: none
    source: inferred
    reasoning: >
      "MALARIA" names the species; MALA series carries a matching field
      PMALARIA, so the "A" vs "P" prefixes most plausibly mark different
      test methods (e.g. antigen vs. blood-smear) for the same species.

  ARTESU:
    official_name: Uso de artesunato
    translated_name: Artesunate used (flag)
    description: >
      Whether artesunate was part of the malaria treatment regimen -
      commonly combined with mefloquine (MEFLOQ) as an ACT regimen against
      P. falciparum, one drug on the form's treatment checklist.
    code_system: none
    source: inferred
    reasoning: ARTESU = artesunato; MALA series' drug-given checklist (with MEFLOQ, CLINDI).

  AT_SINTOMA:
    official_name: Atendimento com sintomas
    translated_name: Attended with symptoms (flag)
    description: >
      Whether the patient was symptomatic at the visit that generated this
      malaria notification, as opposed to being found through active
      case-search while asymptomatic (see ASSINTOM).
    code_system: internal
    source: inferred
    reasoning: >
      Catalog dictionary confirms values 1=Com sintomas, 2=Sem sintomas for
      this field in the MALA series.

  CLINDI:
    official_name: Uso de clindamicina
    translated_name: Clindamycin used (flag)
    description: >
      Whether clindamycin was given as part of malaria treatment - typically
      combined with quinine for severe cases or in pregnancy, when some
      standard antimalarials are avoided; one item on the drug checklist
      alongside ARTESU and MEFLOQ.
    code_system: none
    source: inferred
    reasoning: CLINDI = clindamicina; a companion field CLIND (not owned here) suggests a schema-revision variant of the same drug flag.

  DINTERNA:
    official_name: Data de internação
    translated_name: Date of hospital admission
    description: >
      Date the malaria patient was admitted to hospital, recorded for
      severe cases; paired with MINTERNA and UFINTERNA giving the
      municipality and state of that hospitalization.
    code_system: none
    source: inferred
    reasoning: D = data, INTERNA = internação; declared as a date; MALA series has matching M/UF variants.

  DSTRAESQUE:
    official_name: Descrição do esquema de tratamento
    translated_name: Treatment regimen - free-text description
    description: >
      Free-text description of the antimalarial regimen actually given,
      used when it doesn't match a standard coded scheme; complements the
      coded field TRA_ESQUEM.
    code_system: none
    source: inferred
    reasoning: >
      DS_TRA_ESQUE = descrição + tratamento + esquema; width 30 fits free
      text; MALA series also carries the coded sibling TRA_ESQUEM.

  MEFLOQ:
    official_name: Uso de mefloquina
    translated_name: Mefloquine used (flag)
    description: >
      Whether mefloquine was part of the malaria treatment regimen, usually
      paired with artesunate (ARTESU) as an ACT combination against P.
      falciparum.
    code_system: none
    source: inferred
    reasoning: MEFLOQ = mefloquina; MALA drug-checklist sibling of ARTESU/CLINDI.

  PUSUARIO:
    official_name: Peso do usuário
    translated_name: Patient's body weight
    description: >
      Patient's body weight, recorded to support weight-based dosing of
      antimalarial drugs (e.g. artesunate-mefloquine), which are dosed by
      mg/kg especially in children.
    code_system: none
    source: inferred
    reasoning: >
      P_USUARIO read as peso do usuário; no direct textual confirmation
      found, but fits the treatment-dosing context of the surrounding
      drug-checklist fields.

  SUDORESE:
    official_name: Sudorese
    translated_name: Sweating (flag)
    description: >
      Whether the patient reported sweating - the diaphoretic phase of the
      classic malaria paroxysm (chills, then fever, then drenching sweats),
      alongside CALAFRIO (chills) and FEBRE on the symptom checklist.
    code_system: none
    source: inferred
    reasoning: SUDORESE = sudorese; MALA symptom-checklist field.

  UFTRANSFU:
    official_name: UF da transfusão
    translated_name: State (UF) of the transfusion
    description: >
      State where a blood transfusion linked to this malaria case took
      place - one of a location set (with MTRANSFU for municipality,
      PTRANSFU for country, UTRANSFU for facility) recorded when
      transfusional, not vector-borne, transmission is investigated.
    code_system: none
    source: inferred
    reasoning: >
      UF + TRANSFU = transfusão; MALA series carries the full
      DTTRANSFU/MTRANSFU/PTRANSFU/UTRANSFU location-and-date set for a
      transfusion-transmission workup.

  # --- SDTA (foodborne/waterborne disease outbreak, aggregate) ---
  AGENTE_ETI:
    official_name: Agente etiológico
    translated_name: Etiologic agent
    description: >
      Causative agent identified for a foodborne/waterborne disease
      outbreak (e.g. Salmonella, Staphylococcus, norovirus) - the summary
      field alongside numbered variants (AGENTE_ET0-3) for outbreaks with
      more than one suspected agent.
    code_system: none
    source: inferred
    reasoning: AGENTE_ETI = agente etiológico; SDTA is an outbreak (surto), aggregate-level series.

  DTTRANSDM:
    official_name: Data de transferência - nível distrital/municipal
    translated_name: Data transfer date - municipal level
    description: >
      Internal SINAN dataflow timestamp marking when this outbreak record
      synced to the municipal-level database - bookkeeping, not a case
      date. One of a family (DM/RM/RS/SE/SM/US) tracking the record up the
      municipal-to-federal reporting chain.
    code_system: none
    source: inferred
    reasoning: >
      DT_TRANS + DM; the same six-suffix family recurs across nearly every
      SINAN series as standard database-sync metadata, not clinical data.

  DTTRANSSM:
    official_name: Data de transferência - nível da secretaria municipal
    translated_name: Data transfer date - municipal secretariat level
    description: >
      Internal SINAN dataflow timestamp for this outbreak record, distinct
      from DTTRANSDM by administrative level within the same
      municipal-to-federal sync chain - bookkeeping, not a case date.
    code_system: none
    source: inferred
    reasoning: DT_TRANS + SM; sibling of DTTRANSDM in the same six-field transfer-timestamp family.

  NU_A_NUM_1:
    official_name: Número de casos associados ao alimento/agente 1
    translated_name: Case count for suspect item 1
    description: >
      Count of outbreak cases linked to the first of several numbered
      suspect foods or agents in a multi-vehicle foodborne outbreak
      investigation; NU_A_NUM_3 is the same count for the third item.
    code_system: none
    source: inferred
    reasoning: >
      NU_ = número; SDTA carries a matching NU_A_ALIM (cases by food) and
      NU_A_CLINI (cases by clinical picture); the "_1/_3" numbering
      parallels AGENTE_ET0-3's multiple suspect items.

  NU_A_NUM_3:
    official_name: Número de casos associados ao alimento/agente 3
    translated_name: Case count for suspect item 3
    description: >
      Count of outbreak cases linked to the third numbered suspect food or
      agent, completing the set with NU_A_NUM_1 (and an unlisted _2) for
      outbreaks with multiple implicated items.
    code_system: none
    source: inferred
    reasoning: Third of a numbered case-count series; see NU_A_NUM_1.

  NU_RESU_3:
    official_name: Número de resultados - item 3
    translated_name: Result count for suspect item 3
    description: >
      Count of laboratory results returned for the third numbered suspect
      food/agent item in the outbreak investigation, paired with that
      item's case count (NU_A_NUM_3).
    code_system: none
    source: inferred
    reasoning: NU_RESU = número de resultados; "_3" follows the same numbered-item convention as NU_A_NUM_3.

  ST_IMPRO_:
    official_name: Situação - alimento impróprio
    translated_name: Food deemed improper (flag)
    description: >
      Whether inspectors found the implicated food improper for consumption
      (spoiled or mishandled) during the outbreak investigation; a
      near-duplicate field ST_IMPRO (without the trailing underscore) also
      exists, likely from a schema-version rename.
    code_system: none
    source: inferred
    reasoning: >
      ST_IMPRO(_) = situação impróprio; both spellings appear across SDTA
      schema years, consistent with a DBF field-name collision/rename.

  ST_INAD:
    official_name: Situação - conservação inadequada
    translated_name: Inadequate storage/conservation (flag)
    description: >
      Whether the suspect food's storage or conservation conditions were
      found inadequate - a food-safety inspection finding distinct from
      ST_IMPRO (food already spoiled) and ST_MANIP (handling practices).
    code_system: none
    source: inferred
    reasoning: ST_INAD = situação inadequada; SDTA outbreak-inspection field set.

  TP_LOCAL:
    official_name: Tipo de local
    translated_name: Venue type
    description: >
      Type of venue where the outbreak-linked meal was served or consumed
      (e.g. home, restaurant, school, event) - a standard classification on
      foodborne outbreak investigation forms.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo, LOCAL = local; SDTA outbreak-context field.
