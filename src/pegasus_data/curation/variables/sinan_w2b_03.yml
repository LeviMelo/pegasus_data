system: SINAN
asserted_by: pegasus_data

variables:

  ARTEI:
    official_name: Uso de arteméter
    translated_name: Artemether given
    description: >
      Whether artemether (an artemisinin-based antimalarial) was given as
      treatment, one of several single-drug yes/no flags on the malaria
      treatment section alongside CLOROQ, QUININO, DOXOCI, and TETRAC.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is MALA (malária); name abbreviates "artemeter"; C1 width
      matches the sibling per-drug treatment flags on the same form.

  ASSINTOM:
    official_name: Caso assintomático
    translated_name: Asymptomatic case
    description: >
      Whether the malaria case was asymptomatic, detected through active
      case-finding or routine blood screening rather than because the
      patient sought care for symptoms.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name reads "assintomático"; C1 width fits a coded yes/no
      case-detection flag.

  CLOROQ:
    official_name: Uso de cloroquina
    translated_name: Chloroquine given
    description: >
      Whether chloroquine was given as antimalarial treatment, a companion
      flag to ARTEI, QUININO, DOXOCI, and TETRAC in the same per-drug
      treatment checklist.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name abbreviates "cloroquina"; C1 width matches the sibling
      per-drug flags.

  DOXOCI:
    official_name: Uso de doxiciclina
    translated_name: Doxycycline given
    description: >
      Whether doxycycline was given as antimalarial treatment (often paired
      with quinine for chloroquine-resistant P. falciparum), a companion
      flag to CLOROQ, QUININO, and TETRAC.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name abbreviates "doxiciclina"; C1 width matches the
      sibling per-drug treatment flags.

  MINTERNA:
    official_name: Unidade de internação (CNES)
    translated_name: Hospitalization facility (CNES code)
    description: >
      CNES code, stored as text, of the health facility where the malaria
      patient was hospitalized, when the case required admission.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; C7 width matches the standard 7-digit CNES facility-code
      length rather than a single yes/no flag; name reads "internação".

  PMALARIA:
    official_name: Plasmodium malariae identificado
    translated_name: Plasmodium malariae identified
    description: >
      Flag marking Plasmodium malariae as the species found on the blood
      smear, called out separately from the more common P. vivax and
      P. falciparum species codes recorded elsewhere on the form.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name directly reads "P. malariae"; C1 width fits a species
      flag distinct from the general species-code field owned elsewhere.

  QUININO:
    official_name: Uso de quinino
    translated_name: Quinine given
    description: >
      Whether quinine was given as antimalarial treatment, typically for
      chloroquine-resistant cases, alongside the other per-drug flags CLOROQ,
      DOXOCI, ARTEI, and TETRAC.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name reads "quinino"; C1 width matches the sibling per-drug
      treatment flags.

  TETRAC:
    official_name: Uso de tetraciclina
    translated_name: Tetracycline given
    description: >
      Whether tetracycline was given as antimalarial treatment, a companion
      drug flag to DOXOCI, QUININO, CLOROQ, and ARTEI on the same treatment
      checklist.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name abbreviates "tetraciclina"; C1 width matches the
      sibling per-drug flags.

  UTRANSFU:
    official_name: Unidade da transfusão (CNES)
    translated_name: Transfusion facility (CNES code)
    description: >
      CNES code, stored as text, of the facility where a blood transfusion
      was given to the patient, recorded to help trace transfusion-associated
      malaria transmission.
    code_system: none
    source: inferred
    reasoning: >
      MALA form; name reads "unidade transfusão"; C7 width matches the
      standard CNES facility-code length, the same pattern as MINTERNA.

  CLAS_TIPO_:
    official_name: Classificação do tipo clínico
    translated_name: Clinical type classification
    description: >
      Coded clinical form of American cutaneous leishmaniasis for this case
      — localized cutaneous, disseminated cutaneous, or mucosal — determining
      the treatment protocol.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is LTAN (leishmaniose tegumentar); CLAS_TIPO reads
      "classificação do tipo"; C12 width fits a short coded/text category.

  CON_IMPORT:
    official_name: Caso importado
    translated_name: Imported case
    description: >
      Whether the leishmaniasis case is classified as imported — infection
      likely acquired outside the notifying municipality — distinguishing it
      from locally (autochthonous) transmitted cases.
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; CON_IMPORT reads "caso importado"; C13 width fits a coded
      flag with room for a short qualifier.

  CON_MUNICI:
    official_name: Município provável de infecção
    translated_name: Likely municipality of infection
    description: >
      Municipality considered the likely place of infection for this
      leishmaniasis case, distinct from the patient's residence municipality
      when the two differ (relevant given CON_IMPORT).
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; CON_ context prefix with MUNICI reading "município"; C12
      text width, wider than a plain IBGE numeric code, fits a name/context
      field.

  ENTO_CAPTU:
    official_name: Captura entomológica
    translated_name: Entomological capture description
    description: >
      Free-text description of the vector-capture activity carried out
      during the entomological survey (where and how sandflies were
      trapped), part of the LTA form's vector-investigation section.
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; ENTO_ reads "entomológico" and CAPTU reads "captura"; wide
      C50 width fits free-text description rather than a coded field.

  ENTO_EXI_2:
    official_name: Exame entomológico 2
    translated_name: Entomological finding 2
    description: >
      Second entry in a numbered series of entomological survey findings for
      this leishmaniasis investigation, alongside the sandfly- and
      other-vector-specific fields ENTO_FLEBO and ENTO_OUTRO.
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; ENTO_ prefix with numeric suffix indicating a repeated
      finding slot; C11 width fits a coded/short-text entry.

  ENTO_FLEBO:
    official_name: Flebotomíneos capturados
    translated_name: Sandflies captured
    description: >
      Entomological finding recording the sandfly (Phlebotominae, the LTA
      vector) species or counts identified during the vector survey,
      distinct from ENTO_OUTRO's non-sandfly findings.
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; ENTO_FLEBO reads "entomológico - flebotomíneo", the
      leishmaniasis vector; C13 width fits a short species/count entry.

  ENTO_OUTRO:
    official_name: Outro vetor capturado
    translated_name: Other vector captured
    description: >
      Entomological finding for a vector or insect species collected during
      the survey other than the sandflies recorded in ENTO_FLEBO.
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; ENTO_OUTRO reads "entomológico - outro"; C13 width matches
      the sibling ENTO_FLEBO field.

  ID_OCUPACA:
    official_name: Ocupação do paciente
    translated_name: Patient occupation
    description: >
      Patient's occupation, recorded on the leishmaniasis form because
      cutaneous leishmaniasis risk is strongly tied to rural, agricultural,
      or forest-related work.
    code_system: none
    source: inferred
    reasoning: >
      LTAN form; ID_OCUPACA reads "identificação/ocupação"; C13 width fits a
      short occupation code or abbreviation.

  HBV:
    official_name: Marcador de hepatite B
    translated_name: Hepatitis B marker
    description: >
      Coded result flag for hepatitis B virus serologic markers, one of the
      per-virus result fields on the viral hepatitis form alongside HEV.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is HEPA (hepatites virais); name is the standard HBV
      abbreviation; C1 width fits a coded reactive/non-reactive result.

  HEV:
    official_name: Marcador de hepatite E
    translated_name: Hepatitis E marker
    description: >
      Coded result flag for hepatitis E virus serologic markers, the
      companion field to HBV for a different hepatitis virus on the same
      form.
    code_system: none
    source: inferred
    reasoning: >
      HEPA form; name is the standard HEV abbreviation; C1 width matches the
      sibling HBV result flag.

  MATBIOLOGI:
    official_name: Material biológico coletado
    translated_name: Biological specimen type
    description: >
      Coded type of biological specimen collected for hepatitis testing
      (e.g. blood/serum), recorded once per case regardless of which virus
      markers (HBV, HEV, etc.) were tested.
    code_system: none
    source: inferred
    reasoning: >
      HEPA form; name reads "material biológico"; C1 width fits a small
      enumerated specimen-type code.

  ANT_UF_CRI:
    official_name: UF de residência da criança
    translated_name: Child's state of residence
    description: >
      Two-letter state (UF) abbreviation for the child's residence, recorded
      on the congenital syphilis form separately from the mother's own
      residence data.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is SIFC (sífilis congênita); ANT_UF_CRI reads
      "[cadastro] UF criança"; C2 width matches the standard 2-letter Brazilian
      state abbreviation.

  DS_ESQUEMA:
    official_name: Descrição do esquema de tratamento
    translated_name: Treatment scheme description
    description: >
      Free-text description of the antibiotic treatment scheme given for
      congenital syphilis (drug, dose, duration), complementing the coded
      scheme category in TRA_ESQU_1.
    code_system: none
    source: inferred
    reasoning: >
      SIFC form; DS_ description prefix with ESQUEMA reading "esquema"; C30
      free-text width fits a written treatment description.

  TRA_ESQU_1:
    official_name: Esquema de tratamento (1)
    translated_name: Treatment scheme (1)
    description: >
      Coded category for the treatment scheme used for congenital syphilis,
      the structured counterpart to the free-text DS_ESQUEMA description.
    code_system: none
    source: inferred
    reasoning: >
      SIFC form; TRA_ treatment prefix with ESQU reading "esquema"; C1 width
      fits a small enumerated scheme code, paired with the free-text
      DS_ESQUEMA field.
