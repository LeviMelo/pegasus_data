system: SIHSUS
asserted_by: pegasus_data
variables:
  SP_PTSP_NF:
    translated_name: Professional-service points (1997 SP file)
    description: >
      Point count used to remunerate the professional act billed on this line,
      in the 1992-2007 SP (Servicos Profissionais) file. Point-based payment,
      later converted to a monetary amount via SP_VALATO on the same row.
    code_system: none
    source: inferred
    reasoning: >
      Not bound by any .DEF in the TAB_SIH auxiliary tree, but its declared
      width (6) and its position - immediately after SP_QTD_ATO and before
      SP_VALATO - match SP_PTSP exactly in the January-2008-forward SP*.dbf
      layout (DATASUS Informe Tecnico IT_SIHSUS_1603.pdf: field 16 SP_PTSP
      char(6) "Quantidade de pontos"). This 1997-era file has one field in
      that slot rather than the later SP_PTSP/SP_NF pair, so the name appears
      to be this vintage's own label for what the point-count field became.
    notes: >
      The neighbouring 2008+ field SP_NF (Nota fiscal) is a separate char(8)
      field with no counterpart here - do not read this column as carrying
      invoice/date information as well, only the point count.
