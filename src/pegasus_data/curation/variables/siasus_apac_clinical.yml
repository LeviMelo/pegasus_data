# SIASUS — the clinical fields of the specialised APAC sub-records.
#
# An APAC (Autorização de Procedimento de Alta Complexidade) carries a common
# header, AP_*, plus a block specific to the therapy being authorised. The
# prefix names the block:
#
#   ATD_  terapia dialítica — dialysis
#   ACF_  confecção de fístula — arteriovenous fistula creation
#   AMP_  acompanhamento do paciente em diálise
#   AB_   cirurgia bariátrica
#   AR_   radioterapia
#   AN_   nefrologia
#
# None of these columns is named by a .DEF: TabNet never offered them as
# tabulation axes, so DATASUS's own naming is silent and the abbreviation is all
# there is. Where the abbreviation is a standard clinical term the reading is
# not in doubt — Kt/V, PTH, hemoglobina, fósforo, albumina are what they are,
# and the declared widths agree. Where it is not, the column is left out: this
# file describes what can be grounded and no more.
#
# Deliberately absent, because nothing here settles them: AB_PONTBAR,
# AB_T_PRC2..6, PA_RCB, PA_RCBDF, AMP_SEAPTO, ATD_SEPERI, AP_TPPRE, APA_CONTN
# and the UDI_* family.
system: SIASUS
asserted_by: pegasus_data

variables:

  # ------------------------------------------- dialysis: how well it worked

  ATD_KTVSEM:
    official_name: Kt/V semanal
    translated_name: Weekly Kt/V
    description: >
      Weekly Kt/V for this patient: the standard measure of how much of the
      blood's urea a dialysis prescription actually clears. The number the
      programme is judged on, since inadequate clearance predicts mortality.
    code_system: none
    source: inferred
    reasoning: >
      Kt/V is the universal name for dialysis adequacy and SEM is semanal; the
      column is C(4), which fits a value like 1.20 recorded without a separator.
    notes: >
      Stored without a decimal point. Read the width before scaling it.

  ATD_TRU:
    official_name: Taxa de redução de ureia
    translated_name: Urea reduction ratio
    description: >
      Percentage by which the session reduced the patient's blood urea — the
      URR, the other standard adequacy measure alongside Kt/V.
    code_system: none
    source: inferred
    reasoning: >
      TRU is the Portuguese initialism for taxa de redução de ureia, and it sits
      in the same C(4) dialysis block as ATD_KTVSEM.

  ATD_HB:
    official_name: Hemoglobina
    translated_name: Haemoglobin
    description: >
      Patient's haemoglobin at the time of the authorisation, in g/dL. Anaemia
      management is part of what a dialysis APAC is monitored for.
    code_system: none
    source: inferred
    reasoning: HB is haemoglobina; C(4) fits a value such as 11.2 without a separator.

  ATD_FOSFOR:
    official_name: Fósforo
    translated_name: Serum phosphorus
    description: >
      Serum phosphorus, in mg/dL. Raised phosphorus is the marker of the mineral
      and bone disorder that dialysis patients are followed for.
    code_system: none
    source: inferred
    reasoning: FOSFOR is fósforo; C(4), the same shape as the other lab values here.

  ATD_PTH:
    official_name: Paratormônio (PTH)
    translated_name: Parathyroid hormone
    description: >
      Parathyroid hormone, in pg/mL. Together with phosphorus it is what
      secondary hyperparathyroidism is tracked by in chronic kidney disease.
    code_system: none
    source: inferred
    reasoning: PTH is the universal abbreviation and needs no expansion.

  ATD_HIV:
    official_name: Sorologia para HIV
    translated_name: HIV serology
    description: >
      Whether the patient's HIV serology is positive, negative or not done.
      Recorded because it determines which machine and shift a haemodialysis
      patient can be treated on.
    code_system: internal
    source: inferred
    reasoning: >
      A single character beside the other serology and lab fields of the
      dialysis block; C(1) admits only a flag, not a titre.
    notes: >
      A serostatus on an individual record. Handle as the identifying
      information it is, and do not publish it disaggregated.

  ATD_DTPDR:
    official_name: Data de início em diálise
    translated_name: Dialysis start date
    description: >
      Date this patient began renal replacement therapy, which is what dialysis
      vintage — time on treatment — is computed from.
    code_system: none
    source: inferred
    reasoning: >
      Declared C(8), the width of every AAAAMMDD date in this system, and DT is
      the prefix DATASUS uses for a date throughout.

  # ------------------------------------------ fistula: the vessels measured

  ACF_ARTDIA:
    official_name: Diâmetro da artéria
    translated_name: Artery diameter
    description: >
      Diameter of the artery assessed before creating an arteriovenous fistula,
      in millimetres. Below roughly 2 mm a fistula is unlikely to mature, so
      this is the number the authorisation turns on.
    code_system: none
    source: inferred
    reasoning: >
      ART is artéria and DIA is diâmetro; C(4) fits a millimetre measurement
      with an implied decimal.

  ACF_VEIDIA:
    official_name: Diâmetro da veia
    translated_name: Vein diameter
    description: >
      Diameter of the vein assessed for the same fistula, in millimetres. The
      companion measurement to ACF_ARTDIA; both are taken before deciding
      whether and where to construct the access.
    code_system: none
    source: inferred
    reasoning: VEI is veia and DIA is diâmetro, matching ACF_ARTDIA's C(4) shape.

  ACF_FREMIT:
    official_name: Frêmito
    translated_name: Thrill
    description: >
      Whether a thrill — the palpable vibration of blood crossing the
      anastomosis — is present. Its presence is the bedside sign that a fistula
      is patent and working.
    code_system: internal
    source: inferred
    reasoning: >
      Frêmito is the clinical term, and C(1) admits a presence flag rather than
      a measurement.

  AMP_ALBUMI:
    official_name: Albumina
    translated_name: Serum albumin
    description: >
      Serum albumin, in g/dL, recorded at the dialysis follow-up. The routine
      marker of nutritional status in patients on chronic dialysis.
    code_system: none
    source: inferred
    reasoning: ALBUMI is albumina; C(4) matches the other lab values in the APAC blocks.

  AMP_ACEVAS:
    official_name: Acesso vascular
    translated_name: Vascular access type
    description: >
      Which kind of vascular access the patient is dialysing through — fistula,
      graft or catheter. Catheter use is the quality indicator here, since it
      carries the highest infection risk.
    code_system: internal
    source: inferred
    reasoning: >
      ACE VAS reads as acesso vascular, and C(1) admits a small enumerated set
      rather than free text.

  # ------------------------------------------------- bariatric surgery

  AB_IMC:
    official_name: Índice de massa corporal
    translated_name: Body mass index
    description: >
      Patient's BMI, which is the criterion bariatric surgery is authorised
      against — the thresholds in the Ministry's own protocol are stated in it.
    code_system: none
    source: inferred
    reasoning: >
      IMC is the Portuguese initialism for body mass index; C(3) fits a value in
      whole units, which is how the authorisation thresholds are written.

  AB_NUMAIH:
    official_name: Número da AIH
    translated_name: Hospital admission authorisation number
    description: >
      AIH number of the hospital admission the bariatric procedure was performed
      under. This is the join back to SIH: the outpatient follow-up recorded
      here and the operation itself are two different systems' records of one
      episode.
    code_system: none
    source: inferred
    reasoning: >
      Declared C(13), which is exactly the AIH number width in SIHSUS, and
      NUMAIH names it.
    notes: >
      A real key into SIHSUS, and one of the few explicit cross-system links
      DATASUS publishes. Worth using rather than matching on patient attributes.

  AB_NUMAIH2:
    official_name: Número da segunda AIH
    translated_name: Second admission authorisation number
    description: >
      AIH number of a second admission attached to the same bariatric follow-up,
      where the treatment involved more than one hospital stay.
    code_system: none
    source: inferred
    reasoning: >
      Same C(13) AIH width as AB_NUMAIH, with the numeric suffix DATASUS uses
      for a repeated field.

  AB_ANOACOM:
    official_name: Ano do acompanhamento
    translated_name: Follow-up year
    description: >
      Year of the post-operative follow-up this record reports. Bariatric
      surgery is authorised with follow-up attached, so a patient generates
      several of these after one operation.
    code_system: none
    source: inferred
    reasoning: >
      C(4) with ANO in the name; ACOM is acompanhamento, which is what the
      bariatric APAC exists to record.

  AB_MESACOM:
    official_name: Mês do acompanhamento
    translated_name: Follow-up month
    description: >
      Month of the follow-up, paired with AB_ANOACOM. Together they place the
      visit relative to the date of surgery.
    code_system: none
    source: inferred
    reasoning: C(2) with MES in the name, the companion of AB_ANOACOM.

  # ------------------------------------------------------- APAC header

  AP_COMORB:
    official_name: Comorbidade
    translated_name: Comorbidity present
    description: >
      Whether the patient has a comorbidity recorded against this
      authorisation — a flag, not a diagnosis. The condition itself, where it is
      given, is in the CID columns.
    code_system: internal
    source: inferred
    reasoning: >
      COMORB is comorbidade and the column is C(1), which cannot hold a
      diagnosis code and so must be a flag.

  AP_CID_CO:
    official_name: CID de comorbidade
    translated_name: Comorbidity ICD-10 code
    description: >
      CID-10 code of the comorbidity, where one is recorded. Stored without the
      dot, as everywhere else in DATASUS: J18.9 is written J189.
    code_system: external
    source: inferred
    reasoning: >
      Declared C(4), the CID-10 subcategory width, and CID_CO names it as the
      comorbidity's code alongside the AP_COMORB flag.
    notes: >
      Sparse. Absence means nothing was recorded, not that no comorbidity
      exists.

  AP_APACAN:
    official_name: Número da APAC anterior
    translated_name: Previous APAC number
    description: >
      Number of the APAC this one continues. Continuing therapies — dialysis,
      radiotherapy — are authorised in successive APACs, and this is the link
      that chains them into one course of treatment.
    code_system: none
    source: inferred
    reasoning: >
      Declared C(13), the APAC number width, with ANT/AN naming the previous
      one.
    notes: >
      Following this chain is how a course of treatment is reconstructed. Rows
      are authorisations, not patients or episodes.

  PA_EQUIPE:
    official_name: Equipe
    translated_name: Health team identifier
    description: >
      Identifier of the health team credited with the production record, for
      procedures delivered by a registered team rather than an individual
      professional.
    code_system: external
    source: inferred
    reasoning: >
      Declared C(12), which is the INE team-code width used in CNES, and EQUIPE
      names it.

  AR_SMRD:
    official_name: Sessões/dose de radioterapia
    translated_name: Radiotherapy sessions
    description: >
      Count in the radiotherapy block of the APAC, at three digits. Radiotherapy
      is authorised as a course of a stated number of fractions, which is what a
      three-digit count in this block records.
    code_system: none
    source: inferred
    reasoning: >
      C(3) in the AR_ radiotherapy block, whose other fields are counts of
      fractions and fields. The expansion of SMRD itself is not attested.
    notes: >
      The abbreviation is not resolved by any source found. Treat the exact
      quantity as unconfirmed and check against AR_ siblings before using it.
