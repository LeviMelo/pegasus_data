system: SINAN
asserted_by: pegasus_data

variables:
  # --- DENG (dengue) fatal-case / lab-confirmation block ---
  AMOS_PCR:
    official_name: Amostra para RT-PCR
    translated_name: Sample collected for RT-PCR
    description: >
      Whether a specimen was collected for RT-PCR molecular testing of dengue
      virus, the direct-detection method used early in illness (viremic
      phase), before antibodies appear and serology (DT_SORO1/SORO2) becomes
      useful.
    code_system: none
    source: inferred
    reasoning: >
      AMOS_ = amostra, PCR = the molecular test; DENG series; distinguishes
      the molecular-diagnosis path from the paired-serology path also on
      this form.

  DT_COL_HEM:
    official_name: Data da coleta de sangue
    translated_name: Date blood sample collected
    description: >
      Date a blood specimen was drawn from the dengue patient for
      laboratory workup, generically capturing collection timing rather
      than tying to one specific test (unlike DT_SORO1, which is dated
      serology collection specifically).
    code_system: none
    source: inferred
    reasoning: DT_ = data, COL = coleta, HEM = sangue; declared as a date (D8).

  DT_SORO1:
    official_name: Data da coleta do 1º soro
    translated_name: Date of 1st serum sample collection
    description: >
      Collection date of the first (acute-phase) blood serum sample in
      dengue's paired-serology protocol, read against S1_TIT1's titer and
      against the second sample (SORO2) to confirm infection by a rise in
      antibody titer.
    code_system: none
    source: inferred
    reasoning: >
      DT_SORO1 pairs with SORO2/S1_TIT1 in the same DENG series; "1" marks
      it as the first of two paired serum draws, the classic
      acute/convalescent dengue serology design.

  HISTOPA:
    official_name: Resultado do exame histopatológico
    translated_name: Histopathology exam result
    description: >
      Result of tissue histopathology examination in a dengue case,
      typically run post-mortem to confirm organ involvement (e.g. liver,
      lung) in fatal or severe dengue investigations; paired with IMUNOH
      for antigen confirmation on the same tissue.
    code_system: none
    source: inferred
    reasoning: HISTOPA = histopatologia; DENG series with other autopsy-style fields.

  IMUNOH:
    official_name: Resultado da imuno-histoquímica
    translated_name: Immunohistochemistry result
    description: >
      Result of immunohistochemical staining for dengue viral antigen in
      collected tissue - a more specific confirmatory test than plain
      histopathology (HISTOPA), used in the same fatal/severe-case workup.
    code_system: none
    source: inferred
    reasoning: IMUNOH = imuno-histoquímica; sits alongside HISTOPA in the DENG series.

  MATERIAL:
    official_name: Material coletado
    translated_name: Specimen material collected
    description: >
      Type of biological specimen collected for dengue lab testing (e.g.
      blood, tissue, cerebrospinal fluid), the general specimen-type field
      that OUTROS_M_D extends when the type isn't on the standard list.
    code_system: none
    source: inferred
    reasoning: Plain "material" field name; paired with the "outro material" free-text sibling.

  OUTROS_M_D:
    official_name: Outro material - descrição
    translated_name: Other specimen material - description
    description: >
      Free-text name of the specimen type collected when it falls outside
      MATERIAL's standard options, e.g. an unusual tissue or fluid sampled
      during a dengue death investigation.
    code_system: none
    source: inferred
    reasoning: >
      OUTROS_M_D = outros materiais + descrição, the standard "outro -
      especifique" pairing with MATERIAL; width 20 fits free text.

  PERICARDI:
    official_name: Derrame pericárdico
    translated_name: Pericardial effusion
    description: >
      Whether pericardial effusion was found - a serositis/plasma-leakage
      finding that marks severe dengue, where increased vascular
      permeability lets fluid collect around the heart as well as in the
      pleural and abdominal cavities.
    code_system: none
    source: inferred
    reasoning: PERICARDI = pericárdico; classic severe-dengue plasma-leakage sign.

  S1_TIT1:
    official_name: Título do 1º soro
    translated_name: Titer of 1st serum sample
    description: >
      Antibody titer measured on the first (acute-phase) serum sample,
      collected on DT_SORO1; compared against the second sample's titer to
      confirm dengue by a diagnostic rise between paired sera.
    code_system: none
    source: inferred
    reasoning: S1 = soro 1, TIT1 = título 1; pairs with DT_SORO1 in the same series.

  SORO2:
    official_name: Coleta do 2º soro
    translated_name: 2nd serum sample collected (flag)
    description: >
      Whether the second (convalescent-phase) serum sample was collected,
      completing the paired-sera protocol begun with DT_SORO1/S1_TIT1 for
      confirming dengue by antibody titer rise.
    code_system: none
    source: inferred
    reasoning: SORO2 = soro 2, second of the acute/convalescent pair.

  # --- HANT (hantavirus) exposure-history, labs, and treatment ---
  ANT_COLHEI:
    official_name: Atividade de colheita nos últimos 30 dias
    translated_name: Harvesting activity in the last 30 days (flag)
    description: >
      Whether the patient did crop harvesting (colheita) in the 30 days
      before symptoms - a rural occupational exposure to rodent-contaminated
      grain and dust that is a classic hantavirus risk factor.
    code_system: none
    source: inferred
    reasoning: >
      ANT_ = antecedente (30-day exposure history block); COLHEI = colheita;
      HANT series clusters several such rural-activity risk checkboxes
      (ANT_LAZER, ANT_ROEDOR among them).

  ANT_LAZER:
    official_name: Atividade de lazer em área de risco nos últimos 30 dias
    translated_name: Recreational activity in risk area (flag)
    description: >
      Whether the patient did recreational activity (camping, hiking,
      fishing) in rural or wild terrain in the 30 days before symptoms - a
      non-occupational hantavirus exposure route, distinct from work-related
      ones like ANT_COLHEI.
    code_system: none
    source: inferred
    reasoning: ANT_ = antecedente; LAZER = lazer; HANT 30-day risk-history block.

  ANT_ROEDOR:
    official_name: Contato com roedores nos últimos 30 dias
    translated_name: Rodent contact in the last 30 days (flag)
    description: >
      Whether the patient had direct contact with or sighted rodents in the
      30 days before symptoms - the most direct exposure marker for
      hantavirus, which spreads via inhaling aerosolized rodent excreta.
    code_system: none
    source: inferred
    reasoning: ANT_ = antecedente; ROEDOR = roedor; same 30-day risk-history block.

  CLI_MIAL_D:
    official_name: Mialgia - detalhamento
    translated_name: Myalgia - additional detail
    description: >
      Supplementary free-text detail on the myalgia (muscle pain) reported
      by the hantavirus patient, elaborating the base CLI_MIALGI Sim/Não
      flag rather than duplicating it.
    code_system: none
    source: inferred
    reasoning: >
      CLI_ = clínico; MIAL = mialgia, truncated to fit DBF's 10-character
      field-name limit alongside base flag CLI_MIALGI; width 30 fits free
      text rather than a checkbox. Exact suffix meaning ("D") uncertain.

  CONF_INF_U:
    official_name: UF provável de infecção
    translated_name: State (UF) of probable infection
    description: >
      State where the patient most likely acquired hantavirus infection,
      the UF-level component of the probable-infection-site investigation;
      a sibling municipality-level field (not owned here) narrows it
      further.
    code_system: none
    source: inferred
    reasoning: >
      CONF_INF_ = (local de) confirmação/infecção; U = UF, paralleling the
      CON_INF_* municipality/UF/country pattern used elsewhere in SINAN for
      likely-infection-site fields.

  LAB_HEMATO:
    official_name: Hematócrito
    translated_name: Hematocrit (result category)
    description: >
      Categorized hematocrit finding (elevated/normal/low) from the
      hantavirus patient's blood count - hemoconcentration is a classic
      early marker of the vascular leak in hantavirus cardiopulmonary
      syndrome.
    code_system: none
    source: inferred
    reasoning: >
      LAB_ = laboratorial; HEMATO = hematócrito; width suggests a coded
      category rather than a raw lab value.

  LAB_LEUC_N:
    official_name: Leucócitos
    translated_name: Leukocyte count (result category)
    description: >
      Categorized white-blood-cell finding for the hantavirus patient;
      leukocytosis with immature forms is part of the classic hematologic
      triad (with hemoconcentration and thrombocytopenia) supporting a
      hantavirus cardiopulmonary syndrome diagnosis.
    code_system: none
    source: inferred
    reasoning: LAB_ = laboratorial; LEUC = leucócitos; sits beside LAB_HEMATO.

  LAB_MICRON:
    official_name: Achado laboratorial microscópico
    translated_name: Microscopic lab finding
    description: >
      A categorized hematologic/blood-smear finding recorded in the
      hantavirus lab workup, alongside hematocrit and leukocyte fields; the
      precise finding the name targets is not certain from the field name
      alone.
    code_system: none
    source: inferred
    reasoning: >
      LAB_ = laboratorial; sits in the same HANT lab block as LAB_HEMATO and
      LAB_LEUC_N; "MICRON" does not map cleanly to a standard term, so this
      is a lower-confidence read.

  LAB_REALIZ:
    official_name: Exame laboratorial realizado
    translated_name: Laboratory exam performed (flag)
    description: >
      Whether laboratory testing (blood count, serology) was carried out at
      all for the hantavirus patient - the gating flag the specific result
      fields (LAB_HEMATO, LAB_LEUC_N, etc.) depend on.
    code_system: none
    source: inferred
    reasoning: LAB_ = laboratorial; REALIZ = realizado; standard gating-flag pattern.

  TRA_CORTIC:
    official_name: Uso de corticoide
    translated_name: Corticosteroid used (flag)
    description: >
      Whether the hantavirus patient received corticosteroid treatment,
      one item on the therapy checklist (alongside vasoactive drugs and
      mechanical ventilation) used to manage hantavirus cardiopulmonary
      syndrome's shock and respiratory failure.
    code_system: none
    source: inferred
    reasoning: >
      TRA_ = tratamento; CORTIC = corticoide; HANT series' treatment block
      also lists TRA_VASOAT, TRA_MECANI, TRA_CPAP.
