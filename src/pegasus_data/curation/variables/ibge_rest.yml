# IBGE — the three population columns left.
#
# These sit in the census-derived population tables, alongside the age and sex
# breakdowns already documented. They are counts of people in a municipality,
# not rates: divide before comparing places.
system: IBGE
asserted_by: pegasus_data

variables:

  POPALFAB:
    official_name: População alfabetizada
    translated_name: Literate population
    description: >
      Number of people counted as literate in the area. Literacy in the census
      is self-declared ability to read and write a simple note, which is a lower
      bar than functional literacy.
    code_system: none
    source: inferred
    reasoning: >
      POP is população and ALFAB alfabetizada, in a table whose other columns
      are population counts.
    notes: >
      A count, not a rate. The denominator is the total population column, not
      POPALFAB plus POPNALFAB, which exclude the age groups the question is not
      asked of.

  POPNALFAB:
    official_name: População não alfabetizada
    translated_name: Illiterate population
    description: >
      Number of people counted as not literate — the complement of POPALFAB
      within the population the literacy question is asked of.
    code_system: none
    source: inferred
    reasoning: >
      N prefixed to ALFAB is the negation DATASUS uses elsewhere (HOSP_NSUS for
      não-SUS); a population count in the same table.

  POPDEPEND:
    official_name: População dependente
    translated_name: Dependent-age population
    description: >
      Number of people in the dependent age groups — the young and the old,
      those outside working age. The numerator of the dependency ratio, which is
      what this column exists to let you compute.
    code_system: none
    source: inferred
    reasoning: >
      DEPEND is dependente; a count in the population table, and the dependency
      ratio is the standard use of such a split.
