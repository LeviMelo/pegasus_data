    official_name: Nódulo/tumor (achado clínico)
    translated_name: Palpable nodule characteristic (clinical finding)
    description: >
      Characteristic of a palpable breast nodule found on clinical exam — Sólido, Cístico, or
      Sólido-cístico — from the same EXAME CLÍNICO DAS MAMAS section. Bound to CCLINODU.
    codelists: ["CCLINODU"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 1, EXAME CLÍNICO DAS MAMAS — Nódulo (tumor)"

  CRESBENIG:
    official_name: Resultado PAAF — processo benigno
    translated_name: Fine-needle aspiration result flag — benign process
    description: >
      Flags an FNA (punção aspirativa) result classified under "Processos Benignos —
      Negativo para malignidade", the umbrella category for the six named benign patterns
      (mastite, abscesso subareolar, fibroadenoma, necrose gordurosa, condição fibrocística,
      lesão epitelial proliferativa sem atipias) plus "outros exclusivamente benignos".
    codelists: ["CRESBENIG"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 2, RESULTADO DA PUNÇÃO ASPIRATIVA — Processos Benignos"

  CRESDERPAP:
    official_name: Resultado — descarga papilar / conteúdo cístico
    translated_name: Nipple-discharge / cystic-content specimen result flag
    description: >
      Flags that the specimen examined was nipple discharge or cystic content rather than a
      fine-needle aspirate of a solid nodule — the form gives this its own result section
      (RESULTADO DA DESCARGA PAPILAR / CONTEÚDO CÍSTICO) with its own six-category outcome
      set (see DEMATACELU/DENEGMALIG/DEMALIINDT/DEPOSMALIG/DELESMALIG/DEPROCINFL).
    codelists: ["CRESDERPAP"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 2, RESULTADO DA DESCARGA PAPILAR / CONTEÚDO CÍSTICO"

  CRESMALIIN:
    official_name: Resultado PAAF — malignidade indeterminada
    translated_name: Fine-needle aspiration result flag — indeterminate malignancy pattern
    description: >
      Flags an FNA result classified "Padrão citopatológico de malignidade indeterminada" —
      tumor papilar, tumor filóide, or outros (see PMALINTUMP/PMALINTUMF/PMALINOUTR) — where
      the cytology cannot itself decide benign vs malignant.
    codelists: ["CRESMALIIN"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 2, RESULTADO DA PUNÇÃO ASPIRATIVA — Padrão citopatológico de malignidade indeterminada"

  CRESPOSMAL:
    official_name: Resultado PAAF — positivo para malignidade
    translated_name: Fine-needle aspiration result flag — positive for malignancy
    description: Flags an FNA result classified "Padrão citopatológico positivo para malignidade compatível com" ductal carcinoma, lobular carcinoma, or outros exclusivamente malignos (PPOSMACDUC/PPOSMACLOB/PPOSMACOUT).
    codelists: ["CRESPOSMAL"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 2, RESULTADO DA PUNÇÃO ASPIRATIVA — Padrão citopatológico positivo para malignidade"

  CRESSUSMAL:
    official_name: Resultado PAAF — suspeito para malignidade
    translated_name: Fine-needle aspiration result flag — suspicious for malignancy
    description: Flags an FNA result classified "Padrão citopatológico suspeito para malignidade" — lesão epitelial proliferativa com atipias, or outros (PSUSLEJPCA/PSUSOUTROS) — the middle tier between indeterminate and positive.
    codelists: ["CRESSUSMAL"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 2, RESULTADO DA PUNÇÃO ASPIRATIVA — Padrão citopatológico suspeito para malignidade"

