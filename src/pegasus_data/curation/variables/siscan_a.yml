    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 2, Padrão citopatológico suspeito para malignidade"

  # ----------------------------------------------------------------------- MM: mammography

  CANMMAMOGR:
    official_name: Risco elevado (mamografia)
    translated_name: Elevated breast-cancer risk flag (mammography record)
    description: >
      Sim/Não/Não sabe flag for whether the patient reports a known elevated risk of breast
      cancer — personal history of breast cancer, a first-degree relative diagnosed before
      age 50 or with bilateral/ovarian cancer, a male relative with breast cancer, or a
      histopathological diagnosis of proliferative lesion with atypia or lobular carcinoma
      in situ. Bound to RISCOELEVADO, whose definition Nota Técnica 7 spells out in full.
    codelists: ["RISCOELEVADO"]
    code_system: internal
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica7_mamografia_residente.pdf — Nota Técnica 7 SISCAN, 'Risco elevado'"

  CANMEXAPR:
    official_name: Mamografia anterior
    translated_name: Prior mammogram flag
    description: >
      Sim/Não/Não sabe flag for whether the patient reports having had a mammogram before,
      from the requisition anamnesis. Nota Técnica 7 uses this to compute Periodicidade (years
      since the previous mammogram) and to classify screening-type mammograms.
    code_system: internal
    source: inferred
    reasoning: >
      Sits alongside CANMMAMOGR (same CANM prefix, same MM series, same C(1,0) width) and
      "EXAPR" decomposes as "EXAme PRévio" (prior exam). Nota Técnica 7 names exactly this
      concept as "Mamog. Anterior — refere-se à informação dada pelo(a) paciente de já haver
      realizado alguma mamografia anteriormente", which is the only anamnesis item in the
      document this field could be.
    asserted_by: pegasus_data
    source_ref: "http://tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica7_mamografia_residente.pdf — Nota Técnica 7 SISCAN, 'Mamog. Anterior'"

  CATBIRADS:
    official_name: Categoria BI-RADS
    translated_name: BI-RADS assessment category
    description: >
      The mammogram's BI-RADS (Breast Imaging Reporting and Data System) category: 0 -
      Indefinido, 1 - Negativo, 2 - Benigno, 3 - Provavelmente benigno, 4 - Suspeito,
      5 - Altamente suspeito, 6 - Já com diagnóstico de câncer. BI-RADS is an external,
      internationally recognised classification (ACR), not a DATASUS-invented code — category
      4+ is the threshold Brazil's own screening guidance uses to trigger specialist referral.
    codelists: ["CATBIRADS"]
    code_system: external
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/siscan/doc/nota_tecnica7_mamografia_residente.pdf — Nota Técnica 7 SISCAN, 'BI-RADS'"

