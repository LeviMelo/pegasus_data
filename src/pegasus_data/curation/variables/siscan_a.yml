      requisition. Bound to CCLIDESC.
    codelists: ["CCLIDESC"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-mama.pdf, page 1, EXAME CLÍNICO DAS MAMAS — Descarga papilar"

