  CBENHIPSAT:
    official_name: Lesão benigna — hiperplasia ductal sem atipias
    translated_name: Benign lesion count — ductal hyperplasia without atypia
    description: >
      Count of breast histopathology exams reporting "Hiperplasia ductal sem atipias".
      "Sem atipias" only appears as a ductal category on the form (the lobular checkbox is
      "com atipias" only), so this field is unambiguous despite the abbreviated name.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-mama.pdf, page 2, LESÃO DE CARÁTER BENIGNO — Hiperplasia ductal sem atipias"

  CBENHIPCAT:
    official_name: Lesão benigna — hiperplasia com atipias
    translated_name: Benign lesion count — hyperplasia with atypia
    description: >
      Count of breast histopathology exams reporting hyperplasia "com atipias". The form
      lists this as two separate checkboxes, ductal and lobular ("Hiperplasia ductal com
      atipias" / "Hiperplasia lobular com atipias"), and this field's name does not disclose
      which one it counts.
    code_system: none
    source: inferred
    reasoning: >
      "HIPCAT" reads as hiperplasia + com atipias, pairing with CBENHIPSAT ("sem atipias").
      Nota Técnica 13 names both a ductal-com-atipia measure (Les B_Hip duc.c/at) and a
      lobular-com-atipia measure (Les B_Hip lob.c/at) separately, so there should be two
      distinct fields here; only one appears in this column range, and nothing in the field
      name or the catalog distinguishes which histological type it counts.
    asserted_by: pegasus_data
    notes: >
      Ductal-vs-lobular is unresolved — treat this as "hyperplasia with atypia, subtype
      unknown" rather than assuming ductal. If a sibling field appears elsewhere in the
      system carrying the other subtype, that would resolve which one this is by elimination.
