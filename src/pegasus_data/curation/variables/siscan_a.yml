# SISCAN — Sistema de Informação do Câncer (cervical + breast cancer screening/diagnosis).
#
# This batch covers the columns still undescribed after offset 0/limit 120 on the
# evidence-ordering script; because SISCAN is catalogued from file headers only
# (no observed values), every entry here is grounded in either the two DATASUS
# TabNet "Nota Técnica" documents per exam type or the actual Ministério da
# Saúde requisition/result forms published by INCA — both fetched and read
# verbatim (see source_ref on each variable), not inferred from the field name
# alone. Two structural things worth stating once instead of on every row:
#
# 1. Every field in this batch comes from files with declared width C(8,0) or
#    less, at file counts (2858 for cervix, 1675/1674 for breast) far lower than
#    the record-level demographic columns (10739 files) documented elsewhere in
#    this system. The C(1,0)/C(2,0)/C(4,0) fields here are per-record diagnostic
#    flags; the C(8,0) fields are pre-aggregated COUNTS from a tabulated export
#    that mirrors TabNet's own cross-tabs (one row per stratum, not one row per
#    exam). Treat the two kinds differently: a C(8,0) field is never a code to
#    join against a codelist, whatever its name suggests.
# 2. SISCAN unified two predecessor systems in 2013: SISCOLO (cervical cancer
#    screening) and SISMAMA (breast cancer screening). Series CC/HC (cito/histo
#    colo do útero) are cervical; series CM/MM/HM (cito/mamografia/histo mama)
#    are breast. A handful of fields (e.g. CCLIMATDPC, CCLIMATMAM) look like
#    leftover SISMAMA-era duplicates of concepts SISCAN's own CO_CLI_DES/
#    CO_CLI_NOD already cover under a cleaner name — those are left out rather
#    than guessed at twice.
system: SISCAN
asserted_by: pegasus_data

variables:

  # ---------------------------------------------------------------- CC: cytology, cervix

  CO_MIC_TRI:
    official_name: Trichomonas vaginalis
    translated_name: Trichomonas vaginalis flag (cervical cytology microbiology)
    description: >
      Flags whether the cervical cytology (Pap smear) report recorded Trichomonas vaginalis
      under the MICROBIOLOGIA section of the result. One of ten organism/finding checkboxes
      on the requisition/result form (Lactobacillus sp, Cocos, Chlamydia sp, Actinomyces sp,
      Candida sp, Trichomonas vaginalis, herpes-group cytopathic effect, Gardnerella/Mobiluncus
      bacilli, other bacilli, other) — this column is the Trichomonas one specifically.
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf — Ministério da Saúde, Requisição/Resultado de Exame Citopatológico - Colo do Útero (form n.415), page 2, MICROBIOLOGIA section"

  CO_NEO_MAL:
    official_name: Outras neoplasias malignas (citologia)
    translated_name: Other malignant neoplasm flag (cervical cytology)
    description: >
      Flags a cervical cytology diagnosis that does not fit any of the form's named atypia/
      lesion categories and was instead written into the free-text "Outras neoplasias
      malignas: quais?" line. The column is the flag that a value was entered there, not
      the diagnosis text itself.
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 2, DIAGNÓSTICO DESCRITIVO — OUTRAS NEOPLASIAS MALIGNAS"

  CO_RES_NOR:
    official_name: Dentro dos limites da normalidade
    translated_name: Within normal limits flag (cytology)
    description: >
      Sim/Não flag for the cytology result question "Dentro dos limites da normalidade no
      material examinado?" — a negative cytology with no atypia and no benign reactive
      change recorded either. Bound to the LIMITENORM codelist (name itself is the giveaway).
    codelists: ["LIMITENORM"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 2, DIAGNÓSTICO DESCRITIVO — DENTRO DOS LIMITES DA NORMALIDADE NO MATERIAL EXAMINADO?"

  DT_ANM_PRE:
    official_name: Ano da citologia anterior
    translated_name: Year of the patient's previous Pap smear
    description: >
      Four-digit year the patient reported for her last cytology exam, from anamnesis
      question 2 on the requisition ("Fez o exame preventivo alguma vez? Sim. Quando fez o
      último exame? ano ____"). Patient-recalled, not looked up in SISCAN — do not treat a
      blank/absent value as "never screened" without checking the accompanying Sim/Não/Não
      sabe answer, which this column does not carry.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 1, DADOS DA ANAMNESE, question 2"

  INSATSFAC:
    official_name: Exames insatisfatórios (citologia)
    translated_name: Count of unsatisfactory cytology exams
    description: >
      Count of exams in the stratum whose ADEQUABILIDADE DO MATERIAL was classified
      Insatisfatória — the umbrella total that the seven itemised rejection/insufficiency
      reasons (material acelular, sangue, piócitos, artefatos de dessecamento, contaminantes
      externos, superposição celular, outros) sum into.
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_1_cito_colo_paciente.pdf — Nota Técnica 1 SISCAN, 'Adequabilidade'"

  SATISFACT:
    official_name: Exames satisfatórios (citologia)
    translated_name: Count of satisfactory cytology exams
    description: Count of exams in the stratum whose ADEQUABILIDADE DO MATERIAL was classified Satisfatória. Pairs with INSATSFAC and REJEITADA as the three adequacy outcomes.
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_1_cito_colo_paciente.pdf — Nota Técnica 1 SISCAN, 'Adequabilidade'"

  REJEITADA:
    official_name: Amostras rejeitadas (citologia)
    translated_name: Count of rejected cytology samples
    description: >
      Count of exams in the stratum whose sample was REJEITADA before any oncotic
      evaluation — slide/frasco missing or mislabelled, slide damaged, causes external to the
      lab, or other — the third adequacy outcome alongside SATISFACT/INSATSFAC. A rejected
      sample never reaches the microbiology/atypia sections, so those columns are absent for
      these exams, not "negative".
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 2, AVALIAÇÃO PRÉ-ANALÍTICA — AMOSTRA REJEITADA POR"

  RESNORM:
    official_name: Exames dentro dos limites da normalidade (citologia)
    translated_name: Count of cytology exams within normal limits
    description: The aggregate count counterpart of CO_RES_NOR — number of exams in the stratum reported as within normal limits, no atypia and no benign reactive change.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 2, DIAGNÓSTICO DESCRITIVO"

  C_EPI_ESCA:
    official_name: Epitélio escamoso representado
    translated_name: Count of exams with squamous epithelium represented
    description: Count of cytology exams whose slide showed representation of the squamous epithelium, one of the three EPITÉLIOS REPRESENTADOS NA AMOSTRA checkboxes (escamoso/glandular/metaplásico).
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 2, EPITÉLIOS REPRESENTADOS NA AMOSTRA"

  C_EPI_GLAN:
    official_name: Epitélio glandular representado
    translated_name: Count of exams with glandular epithelium represented
    description: Count of cytology exams whose slide showed representation of the glandular epithelium, the second of the three EPITÉLIOS REPRESENTADOS NA AMOSTRA checkboxes.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-citopatologico-colo-do-utero.pdf, page 2, EPITÉLIOS REPRESENTADOS NA AMOSTRA"

  DENCARCINV:
    official_name: Adenocarcinoma invasor (citologia)
    translated_name: Count of cytology exams reporting invasive adenocarcinoma
    description: >
      Count of cytology exams whose diagnosis was invasive adenocarcinoma (cervical,
      endometrial, or unspecified site — Nota Técnica 2 folds all three sub-sites into this
      one measure).
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf — Nota Técnica 2 SISCAN, 'Adenocarc invasor'"

  LAGRAU:
    official_name: Lesão intra-epitelial de alto grau (citologia)
    translated_name: Count of high-grade squamous intraepithelial lesion cytology results
    description: Count of cytology exams reporting a high-grade squamous intra-epithelial lesion (CIN II/III equivalent), one of the graded atipia-em-células-escamosas outcomes.
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf — Nota Técnica 2 SISCAN, 'Les IEp Alto Grau'"

  LAGRAUMI:
    official_name: Lesão intra-epitelial de alto grau, não podendo excluir microinvasão (citologia)
    translated_name: Count of high-grade lesion cytology results that cannot exclude microinvasion
    description: Count of cytology exams reporting a high-grade squamous intra-epithelial lesion where microinvasion could not be excluded — the escalation category between LAGRAU and an outright invasive carcinoma diagnosis.
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf — Nota Técnica 2 SISCAN, 'Les IE AG Mic. Inv'"

  LBGRAU:
    official_name: Lesão intra-epitelial de baixo grau (citologia)
    translated_name: Count of low-grade squamous intraepithelial lesion cytology results
    description: Count of cytology exams reporting a low-grade squamous intra-epithelial lesion (HPV cytopathic effect and CIN I).
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf — Nota Técnica 2 SISCAN, 'Les IE Baixo Grau'"

  OUTNEO:
    official_name: Outras neoplasias malignas (contagem, citologia)
    translated_name: Count of cytology exams reporting other malignant neoplasms
    description: The aggregate count counterpart of CO_NEO_MAL — number of cytology exams in the stratum diagnosed with a malignant neoplasm outside the form's named categories.
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_2_cito_colo_atend.pdf — Nota Técnica 2 SISCAN, 'Outras Neoplasias'"

  REPREZT:
    official_name: Representatividade da Zona de Transformação
    translated_name: Count of exams with transformation-zone representation
    description: >
      Count of exams whose slide is considered to have representatividade da Zona de
      Transformação — defined by DATASUS as showing metaplastic and/or glandular
      (endocervical) epithelium. Low representativeness is a recognised limitation of a
      screening round, not a diagnostic finding, and is tracked separately from adequacy.
    code_system: none
    source: layout_doc
    source_ref: "http://tabnet.datasus.gov.br/cgi/SISCAN/doc/nota_tecnica_1_cito_colo_paciente.pdf — Nota Técnica 1 SISCAN, 'Representatividade da Zona de Transformação'"

  # ------------------------------------------------------------ HC: histopathology, cervix

  CO_RES_FRA:
    official_name: Número de fragmentos (biópsia)
    translated_name: Number of biopsy fragments received
    description: >
      Count of tissue fragments received for a biopsy specimen, from the "Tipo de material
      recebido: Biópsia, número de fragmentos ___" field on the histopathology result. Only
      meaningful when the specimen type is biópsia rather than peça cirúrgica.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MACROSCOPIA — Tipo de material recebido"

  CO_RES_LOC:
    official_name: Localização do tumor (histopatologia colo)
    translated_name: Cervical tumour location
    description: >
      Site of the specimen within the cervix: Ectocérvice, Endocérvice, or Junção
      escamo-colunar. DATASUS-internal category, bound to the LOCALIZACAO codelist.
    codelists: ["LOCALIZACAO"]
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MACROSCOPIA — localização do tumor"

  CO_RES_MAR:
    official_name: Distância da margem mais próxima
    translated_name: Distance to the nearest surgical margin (mm)
    description: >
      Distance in millimetres from the tumour to the nearest resection margin, as recorded on
      the histopathology macroscopy section. A measurement, not a code — do not confuse with
      the separate "Margens cirúrgicas: Livres/Comprometidas/Impossível de avaliar" categorical
      field.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MACROSCOPIA — Distância da margem mais próxima ___ mm"

  CO_RES_TAM:
    official_name: Tamanho do tumor (histopatologia colo) — dimensão 1
    translated_name: Cervical tumour size, first dimension (mm)
    description: >
      First of two size dimensions recorded for a surgical specimen ("Peça cirúrgica,
      tamanho do tumor ___ x ___ cm"). See O_RES_TAM2 for the second dimension; only present
      when the specimen is a peça cirúrgica, not a biópsia.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MACROSCOPIA — Peça cirúrgica, tamanho do tumor"

  O_RES_TAM2:
    official_name: Tamanho do tumor (histopatologia colo) — dimensão 2
    translated_name: Cervical tumour size, second dimension (mm)
    description: Second of the two "x"-separated tumour-size dimensions on the surgical-specimen macroscopy field; see CO_RES_TAM for the first.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MACROSCOPIA — Peça cirúrgica, tamanho do tumor"

  CO_RES_TIP:
    official_name: Tipo de procedimento cirúrgico (histopatologia colo)
    translated_name: Type of surgical procedure (cervical histopathology)
    description: >
      How the tissue was obtained: Biópsia, Exérese da Zona de Transformação, Conização,
      Histerectomia Simples, Histerectomia com anexectomia uni ou bilateral, or Outros.
      DATASUS-internal category code.
    code_system: internal
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, RESULTADO DO EXAME HISTOPATOLÓGICO — Tipo de procedimento cirúrgico"

  CRESBIOPSI:
    official_name: Material recebido — biópsia (contagem)
    translated_name: Count of specimens received as biopsy
    description: Count of histopathology exams whose "Tipo de material recebido" checkbox was Biópsia, as opposed to peça cirúrgica.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MACROSCOPIA — Tipo de material recebido"

  CRESCONIZA:
    official_name: Procedimento — conização (contagem)
    translated_name: Count of specimens obtained by conisation
    description: Count of histopathology exams whose surgical procedure was Conização.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, Tipo de procedimento cirúrgico"

  CRESECTO:
    official_name: Localização — ectocérvice (contagem)
    translated_name: Count of specimens located in the ectocervix
    description: Count of histopathology exams whose tumour location was recorded as Ectocérvice.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, localização do tumor"

  CRESENDO:
    official_name: Localização — endocérvice (contagem)
    translated_name: Count of specimens located in the endocervix
    description: Count of histopathology exams whose tumour location was recorded as Endocérvice.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, localização do tumor"

  CRESJUNC:
    official_name: Localização — junção escamo-colunar (contagem)
    translated_name: Count of specimens located at the squamocolumnar junction
    description: Count of histopathology exams whose tumour location was recorded as Junção escamo-colunar.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, localização do tumor"

  CRESHISSIM:
    official_name: Procedimento — histerectomia simples (contagem)
    translated_name: Count of specimens from simple hysterectomy
    description: Count of histopathology exams whose surgical procedure was Histerectomia Simples.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, Tipo de procedimento cirúrgico"

  CRESPANHIS:
    official_name: Procedimento — histerectomia com anexectomia (contagem)
    translated_name: Count of specimens from hysterectomy with adnexectomy
    description: >
      Count of histopathology exams whose surgical procedure was Histerectomia com
      anexectomia uni ou bilateral (a "pan-hysterectomy" that removes the adnexa along with
      the uterus).
    code_system: none
    source: inferred
    reasoning: >
      CRES* is the count-field family for "Tipo de procedimento cirúrgico" (paired 1:1 with
      CRESBIOPSI, CRESCONIZA and CRESHISSIM, which map cleanly onto three of the form's six
      procedure checkboxes). PANHIS reads as "pan-histerectomia", the only remaining named
      procedure — Histerectomia com anexectomia uni ou bilateral — that has not already been
      claimed by another field in this family.
    asserted_by: pegasus_data

  CRESOUTROS:
    official_name: Material/procedimento — outros (contagem, histopatologia colo)
    translated_name: Count of specimens recorded under "other" material or procedure
    description: Count of histopathology exams whose material/procedure was checked as Outros rather than one of the named categories.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2"

  DT_HIS_EXA:
    official_name: Data da coleta (histopatologia colo)
    translated_name: Cervical histopathology collection date
    description: Date the specimen was collected, from "Data da coleta*" on the requisition. DD/MM/AAAA, stored as a 10-character string.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 1, Data da coleta"

  DT_HIS_REC:
    official_name: Data de recebimento no laboratório (histopatologia colo)
    translated_name: Date the cervical specimen was received by the laboratory
    description: Date the specimen was logged in at the laboratory, from "Recebido em:*" under IDENTIFICAÇÃO DO LABORATÓRIO. Used with DT_HIS_EXA to compute the collection-to-lab interval that Nota Técnica 4 reports as a turnaround measure.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, IDENTIFICAÇÃO DO LABORATÓRIO — Recebido em"

  DT_PAC_NAS:
    official_name: Data de nascimento da paciente (histopatologia colo)
    translated_name: Patient date of birth (cervical histopathology record)
    description: >
      The patient's date of birth as entered on the requisition. This is a direct personal
      identifier (combined with residence and exam date it can re-identify a patient) and is
      passed through unmodified in this catalog; no masking is proposed here.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 1, Data de Nascimento"
    notes: Direct personal identifier (date of birth). Pass through unmodified; do not publish alongside fine-grained geography without considering re-identification risk.

  NICCARCMIN:
    official_name: Carcinoma epidermóide microinvasivo (histopatologia)
    translated_name: Count of microinvasive squamous carcinoma diagnoses
    description: Count of cervical histopathology exams diagnosed as Carcinoma epidermóide microinvasivo — invasion present but not yet meeting the threshold for the fully invasive category (NICEPIINVA).
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MICROSCOPIA — Lesões de caráter neoplásico ou pré-neoplásico"

  NICDACENT:
    official_name: NIC III / displasia acentuada / carcinoma in situ (histopatologia)
    translated_name: Count of NIC III / severe dysplasia / carcinoma-in-situ diagnoses
    description: Count of cervical histopathology exams diagnosed NIC III (displasia acentuada / carcinoma in situ) — the highest grade of cervical intraepithelial neoplasia before invasion.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MICROSCOPIA"

  NICDLEVE:
    official_name: NIC I / displasia leve (histopatologia)
    translated_name: Count of NIC I / mild dysplasia diagnoses
    description: Count of cervical histopathology exams diagnosed NIC I (displasia leve), the lowest grade of cervical intraepithelial neoplasia.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MICROSCOPIA"

  NICDMODE:
    official_name: NIC II / displasia moderada (histopatologia)
    translated_name: Count of NIC II / moderate dysplasia diagnoses
    description: Count of cervical histopathology exams diagnosed NIC II (displasia moderada), the middle grade of cervical intraepithelial neoplasia.
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MICROSCOPIA"

  NICEPIINVA:
    official_name: Carcinoma epidermóide invasivo (histopatologia)
    translated_name: Count of invasive squamous carcinoma diagnoses
    description: Count of cervical histopathology exams diagnosed Carcinoma epidermóide invasivo — the fully invasive squamous carcinoma category, one step past NICCARCMIN (microinvasive).
    code_system: none
    source: layout_doc
    source_ref: "https://www.inca.gov.br/sites/ufu.sti.inca.local/files//media/document//formulario-colorido-exame-histopatologico-colo-do-utero.pdf, page 2, MICROSCOPIA"

  NICIMPAVAL:
    official_name: Carcinoma epidermóide, impossível avaliar invasão (histopatologia)
    translated_name: Count of squamous carcinoma diagnoses where invasion could not be assessed
