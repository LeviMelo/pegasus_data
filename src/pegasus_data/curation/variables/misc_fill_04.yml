# ESUSNOTIFICA / DCCR — the one straggler column left in this dataset.
# esus.yml already documents the ficha's own CNES field (notifying
# establishment); LAB_CNES is that field's laboratory-side counterpart.
system: ESUSNOTIFICA
asserted_by: pegasus_data

variables:

  LAB_CNES:
    official_name: CNES do laboratório
    translated_name: Testing laboratory (CNES) flag
    description: >
      Meant to identify, by CNES code, the laboratory that ran the exam for
      this Chagas-disease notification (DCCR ficha) — paired with the
      exam-result columns (EIE_IGG, PCR, etc). Declared N(1,0), far too
      narrow for a real 7-digit CNES code.
    code_system: external
    source: inferred
    reasoning: >
      LAB_ + CNES decomposition, alongside the ficha's own CNES field
      (notifying establishment, esus.yml) which likewise carries an
      establishment identifier despite a declared width mismatched to a real
      CNES code — the same kind of DCCR data-quality gap already flagged
      there.
    notes: >
      Only 3 files and no observed values for this column in the catalog;
      whether it actually holds a code, a boolean flag, or is functionally
      unused could not be confirmed.
