system: SISCAN
asserted_by: pegasus_data
variables:
  CO_ALT_CEL_INFLAMACAO:
    official_name: Alt.ben.inflamação
    translated_name: Benign changes - inflammation
    description: >
      Exam negative for cervical cancer, with benign reactive or reparative
      cellular changes tied to inflammation, one of several non-neoplastic
      causes distinguished on the same cytopathology report.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Alt.ben.inflamação

  CO_ALT_CEL_METAPLASIA:
    official_name: Alt.ben.metap.esca
    translated_name: Benign changes - immature squamous metaplasia
    description: >
      Exam negative for cervical cancer, with benign reactive cellular changes
      from immature squamous metaplasia, normal epithelial regrowth rather
      than a precancerous finding.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Alt.ben.metap.esca

  CO_ALT_CEL_OUT:
    official_name: Alt.ben.outros
    translated_name: Benign changes - other cause
    description: >
      Exam negative for cervical cancer, with benign reactive or reparative
      cellular changes from a cause other than inflammation, metaplasia,
      radiation, or repair reported on the same exam.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Alt.ben.outros

  CO_ALT_CEL_RADIACAO:
    official_name: Alt.ben.radiação
    translated_name: Benign changes - radiation
    description: >
      Exam negative for cervical cancer, with benign reactive cellular changes
      attributed to prior radiation exposure, distinguished from
      inflammation- or repair-related changes on the same report.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Alt.ben.radiação

  CO_ALT_CEL_REPARACAO:
    official_name: Alt.ben.reparação
    translated_name: Benign changes - repair
    description: >
      Exam negative for cervical cancer, with benign cellular changes
      associated with tissue repair, the healing response following prior
      injury to the cervical epithelium.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Alt.ben.reparação

  CO_ANO_LIBERACAO:
    official_name: Ano de liberação (inferido)
    translated_name: Year of report release
    description: >
      Calendar year the laboratory released the cytopathology report to the
      requesting service, the release event underlying but distinct from
      Mês/Ano competência, which also folds in billing.
    code_system: none
    source: inferred
    reasoning: >
      CO_ANO + LIBERACAO by naming grammar; Nota Tecnica 2 defines Mês/Ano
      competência as "o mês/ano em que o exame foi liberado e faturado",
      showing liberação is a distinct dated event this field isolates.
    source_ref: >
      naming grammar + Nota Tecnica 2 SISCAN - Citopatologico Colo, campo
      Mês/Ano competência

  CO_ANO_MES_LIBERACAO:
    official_name: Mês/Ano de liberação (inferido)
    translated_name: Year-month of report release
    description: >
      Year and month the laboratory released the cytopathology report, the
      month-level counterpart to CO_ANO_LIBERACAO for the same release
      event.
    code_system: none
    source: inferred
    reasoning: >
      Same reasoning as CO_ANO_LIBERACAO, applied at month grain; mirrors
      the ANO/ANO_MES pairing already documented for CO_ANO_RESULTADO and
      CO_ANO_MES_RESULTADO elsewhere in SISCAN.
    source_ref: >
      naming grammar + Nota Tecnica 2 SISCAN - Citopatologico Colo, campo
      Mês/Ano competência

  CO_EPIT_ESCAMOSO:
    official_name: Epitélio escamoso
    translated_name: Squamous epithelium present
    description: >
      Flags that squamous epithelial cells are represented on the examined
      slide, one of three epithelium types recorded to judge whether the
      sample adequately covers the cervix.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Epitélio escamoso

  CO_EPIT_GLANDULAR:
    official_name: Epitélio glandular
    translated_name: Glandular epithelium present
    description: >
      Flags that endocervical glandular epithelial cells are represented on
      the examined slide; together with metaplastic cells this marks the
      sample as reaching the transformation zone.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Epitélio glandular

  CO_EPIT_METAPLAS:
    official_name: Epitélio metaplas.
    translated_name: Metaplastic epithelium present
    description: >
      Flags that metaplastic epithelial cells are represented on the
      examined slide; together with glandular cells this marks the sample
      as reaching the cervix's transformation zone.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Epitélio metaplas.

  CO_INS_ARTEF_DES:
    official_name: Ins. pres.art.desec.
    translated_name: Unsatisfactory - drying artifact
    description: >
      Marks the sample unsatisfactory because drying artifact before
      fixation distorted cells over more than 75 percent of the smear,
      preventing reliable reading.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres.art.desec.

  CO_INS_CONTAM_EXTERNOS:
    official_name: Ins. pres.cont.exte
    translated_name: Unsatisfactory - external contaminants
    description: >
      Marks the sample unsatisfactory because external contaminants, such
      as lubricant or foreign material, obscure more than 75 percent of
      the smear.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres.cont.exte

  CO_INS_INTENSA_SUPER:
    official_name: Ins. pres.sup.celul
    translated_name: Unsatisfactory - cell overlap
    description: >
      Marks the sample unsatisfactory because intense cellular overlap
      covers more than 75 percent of the smear, hiding the individual
      cells needed for reading.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres.sup.celul

  CO_INS_MAT_CELULAR:
    official_name: Ins. mat. acelular
    translated_name: Unsatisfactory - scanty cellular material
    description: >
      Marks the sample unsatisfactory because it is acellular or
      hypocellular, with epithelial cells covering less than 10 percent of
      the smear.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. mat. acelular

  CO_INS_OUTROS:
    official_name: Ins. Outros
    translated_name: Unsatisfactory - other cause
    description: >
      Marks the sample unsatisfactory for a reason other than blood, pus
      cells, drying artifact, contaminants, or cell overlap, each recorded
      as a separate cause on the same report.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. Outros

  CO_INS_PIOCITOS:
    official_name: Ins. pres. piócitos
    translated_name: Unsatisfactory - pus cells
    description: >
      Marks the sample unsatisfactory because pus cells from inflammation
      cover more than 75 percent of the smear, obscuring the epithelial
      cells needed for reading.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres. piócitos

  CO_INS_SANGUE:
    official_name: Ins. pres. sangue
    translated_name: Unsatisfactory - blood
    description: >
      Marks the sample unsatisfactory because blood covers more than 75
      percent of the smear, obscuring the epithelial cells needed for
      reading.
    code_system: none
    source: layout_doc
    source_ref: Nota Tecnica 2 SISCAN - Citopatologico Colo, medida Ins. pres. sangue

  CO_LAUDO_CITOPATOLOGICO:
    official_name: Laudo citopatológico (inferido)
    translated_name: Overall cytopathology result
    description: >
      Single code carrying the exam's overall diagnostic conclusion,
      spanning normal, ASC-US/ASC-H, low- or high-grade squamous or
      glandular lesions, and invasive carcinoma categories.
    code_system: none
    source: inferred
    reasoning: >
      CO_ + LAUDO_CITOPATOLOGICO by naming grammar; Nota Tecnica 2 lists
      the full set of mutually exclusive diagnostic-result categories
      (Dentro da Normalidade through Outras Neoplasias) this single field
      is the code for.
    source_ref: >
      naming grammar + Nota Tecnica 2 SISCAN - Citopatologico Colo,
      resultado categories section

  CO_MIC_ACTINOMYCES:
    official_name: Mic.actinomyces sp (inferido)
    translated_name: Microbiology - Actinomyces sp.
    description: >
      Marks that the sample's microbiology assessment found organisms
      morphologically consistent with Actinomyces sp., a bacterium
      associated with long-term IUD use.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

  CO_MIC_BACILOS_SUPRA:
    official_name: Mic.bacil supracit. (inferido)
    translated_name: Microbiology - supracytoplasmic bacilli
    description: >
      Marks that the sample's microbiology assessment found
      supracytoplasmic bacilli, a morphotype suggestive of Gardnerella
      vaginalis or Mobiluncus and bacterial vaginosis.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

  CO_MIC_CANDIDA:
    official_name: Mic.CANDIDA sp (inferido)
    translated_name: Microbiology - Candida sp.
    description: >
      Marks that the sample's microbiology assessment found Candida sp.,
      the yeast responsible for vaginal candidiasis.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

  CO_MIC_COCOS:
    official_name: Mic.cocos (inferido)
    translated_name: Microbiology - cocci
    description: >
      Marks that the sample's microbiology assessment found coccus-shaped
      bacteria, a nonspecific vaginal flora finding distinct from the
      other named organisms.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

  CO_MIC_EFEITO_CITOPATICO:
    official_name: Mic.vir gr.herpes (inferido)
    translated_name: Microbiology - Herpes-group viral effect
    description: >
      Marks that the sample's microbiology assessment found cytopathic
      cell changes compatible with infection by a virus of the Herpes
      group, distinct from the HPV effect reported under squamous lesion
      findings.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

  CO_MIC_LACTOBACILLUS:
    official_name: Mic.lactobacillus (inferido)
    translated_name: Microbiology - Lactobacillus sp.
    description: >
      Marks that the sample's microbiology assessment found Lactobacillus
      sp., the normal, protective bacterium of healthy vaginal flora.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf

  CO_MIC_OUTROS:
    official_name: Mic.outros (inferido)
    translated_name: Microbiology - other organism
    description: >
      Marks that the sample's microbiology assessment found an organism
      or flora finding not covered by Lactobacillus, cocci,
      supracytoplasmic bacilli, Candida, Actinomyces, or the herpes-group
      viral effect.
    code_system: none
    source: web
    source_ref: >
      Nomenclatura Brasileira para Laudos Cervicais,
      bvsms.saude.gov.br/bvs/publicacoes/Nomenclaturas_2_1705.pdf
