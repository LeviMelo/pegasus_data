system: SINAN
asserted_by: pegasus_data

variables:
  STDISPNEIA:
    official_name: Sinais e sintomas - Dispneia
    translated_name: Dyspnea (shortness of breath)
    description: >
      Whether the botulism (BOTU) patient reports shortness of breath, an
      early warning of the respiratory-muscle weakness that can progress to
      the respiratory failure recorded in STRESPIRA.
    code_system: none
    source: inferred
    reasoning: BOTU form; STDISPNEIA = dispneia; width 1 checkbox.

  STDOMICILI:
    official_name: Local de exposição - Domicílio
    translated_name: Home exposure setting
    description: >
      Whether the suspect food was eaten at the patient's own home, one of
      several exposure-location checkboxes - alongside school, restaurant,
      and party - used to trace where a shared contaminated food was
      served.
    code_system: none
    source: inferred
    reasoning: BOTU form; STDOMICILI = domicílio; width 1 checkbox.

  STELETRO:
    official_name: Eletroneuromiografia realizada
    translated_name: Electroneuromyography performed
    description: >
      Whether an electroneuromyography (ENMG) test was performed, the
      neurophysiological exam used to support a botulism diagnosis by
      showing the toxin's characteristic effect on neuromuscular
      transmission.
    code_system: none
    source: inferred
    reasoning: BOTU form; STELETRO = eletro(neuromiografia); width 1.

  STESCOLA:
    official_name: Local de exposição - Escola
    translated_name: School exposure setting
    description: >
      Whether the suspect food was eaten at a school, one of the
      exposure-location checkboxes used alongside home, restaurant, and
      party settings to trace a shared-meal botulism outbreak.
    code_system: none
    source: inferred
    reasoning: BOTU form; STESCOLA = escola; width 1 checkbox.

  STEXPALIM:
    official_name: Exposição alimentar
    translated_name: Food exposure (flag)
    description: >
      Whether this botulism case is linked to a food-exposure event at
      all, the umbrella flag preceding the specific location checkboxes
      (home, school, restaurant, party) recording where that food was
      eaten.
    code_system: none
    source: inferred
    reasoning: BOTU form; STEXPALIM = exposição alimentar; width 1.

  STFACIAL:
    official_name: Sinais e sintomas - Paralisia facial
    translated_name: Facial paralysis
    description: >
      Whether the botulism patient shows facial-muscle weakness or
      paralysis, one of the cranial-nerve signs marking the descending
      paralysis pattern, alongside ptosis and the bulbar signs.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFACIAL = facial; width 1 checkbox.

  STFEBRE:
    official_name: Sinais e sintomas - Febre
    translated_name: Fever
    description: >
      Whether the botulism patient had fever, a nonspecific sign checked
      mainly to help rule out other causes since classic botulism
      typically presents afebrile.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFEBRE = febre; width 1 checkbox.

  STFERIMENT:
    official_name: Tipo de botulismo - Por ferimento
    translated_name: Wound botulism (flag)
    description: >
      Whether this case is classified as wound botulism - toxin produced
      by bacteria infecting a wound rather than ingested in food - distinct
      from the foodborne classification in STALIMENTO.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFERIMENT = ferimento; width 1 checkbox.

  STFESTA:
    official_name: Local de exposição - Festa/evento
    translated_name: Party/event exposure setting
    description: >
      Whether the suspect food was eaten at a party or social event, one of
      the exposure-location checkboxes used to identify other people who
      may have shared the same contaminated food.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFESTA = festa; width 1 checkbox.

  STFEZESMAT:
    official_name: Coleta de amostra - Fezes (material)
    translated_name: Stool sample collected
    description: >
      Whether a stool sample was collected from the botulism patient for
      lab testing, tracked separately from STFEZESRES, which records what
      that test found.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFEZESMAT = fezes + material; width 1.

  STFEZESRES:
    official_name: Resultado do exame de fezes
    translated_name: Stool test result
    description: >
      Result of the stool sample tested for botulinum toxin or C.
      botulinum, filled in once STFEZESMAT confirms a sample was
      collected.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFEZESRES = fezes + resultado; width 1.

  STFLACIDEZ:
    official_name: Sinais e sintomas - Flacidez muscular
    translated_name: Muscle flaccidity
    description: >
      Whether the patient shows flaccid muscle weakness, the defining
      motor sign of botulism's descending symmetric paralysis, distinct
      from the specific limb locations recorded in STMEMSUP/STMEMINF.
    code_system: none
    source: inferred
    reasoning: BOTU form; STFLACIDEZ = flacidez; width 1 checkbox.

  STMEMINF:
    official_name: Sinais e sintomas - Paralisia de membros inferiores
    translated_name: Lower-limb paralysis
    description: >
      Whether paralysis has reached the lower limbs, marking a later stage
      of botulism's descending pattern than the upper-limb involvement
      recorded in STMEMSUP.
    code_system: none
    source: inferred
    reasoning: BOTU form; STMEMINF = membros inferiores; width 1.

  STMEMSUP:
    official_name: Sinais e sintomas - Paralisia de membros superiores
    translated_name: Upper-limb paralysis
    description: >
      Whether paralysis has reached the upper limbs, occurring earlier in
      botulism's head-to-toe descending pattern than the lower-limb
      involvement recorded in STMEMINF.
    code_system: none
    source: inferred
    reasoning: BOTU form; STMEMSUP = membros superiores; width 1.

  STMIDRIASE:
    official_name: Sinais e sintomas - Midríase
    translated_name: Mydriasis (dilated pupils)
    description: >
      Whether the patient's pupils are dilated and poorly reactive, one of
      the earliest ocular cranial-nerve signs of botulism alongside ptosis
      (STPTOSE) and double vision (STDIPLOPIA).
    code_system: none
    source: inferred
    reasoning: BOTU form; STMIDRIASE = midríase; width 1 checkbox.

  STNAUSEA:
    official_name: Sinais e sintomas - Náusea
    translated_name: Nausea
    description: >
      Whether the botulism patient reports nausea, an early
      gastrointestinal symptom recorded alongside diarrhea that can
      precede the disease's neurological signs.
    code_system: none
    source: inferred
    reasoning: BOTU form; STNAUSEA = náusea; width 1 checkbox.

  STOFTALMO:
    official_name: Sinais e sintomas - Oftalmoplegia
    translated_name: Ophthalmoplegia
    description: >
      Whether the patient shows ophthalmoplegia (paralysis of the eye
      muscles), a cranial-nerve sign grouped with the other ocular findings
      (ptosis, mydriasis, diplopia) that typically appear first in
      botulism.
    code_system: none
    source: inferred
    reasoning: BOTU form; STOFTALMO = oftalmoplegia; width 1 checkbox.

  STOUTROLOC:
    official_name: Local de exposição - Outro
    translated_name: Other exposure setting
    description: >
      Whether the suspect food was eaten somewhere other than home,
      school, restaurant, or party - the catch-all exposure-location
      checkbox completing that group.
    code_system: none
    source: inferred
    reasoning: BOTU form; STOUTROLOC = outro local; width 1 checkbox.

  STOUTROSIN:
    official_name: Outro sinal ou sintoma
    translated_name: Other sign or symptom (flag)
    description: >
      Whether the botulism patient presented a clinical sign or symptom
      not covered by the form's many named checkboxes (ptosis, diplopia,
      dysphagia, etc.).
    code_system: none
    source: inferred
    reasoning: BOTU form; STOUTROSIN = outro sinal; width 1 checkbox.

  STOUTROTRA:
    official_name: Outro tratamento
    translated_name: Other treatment (flag)
    description: >
      Whether the botulism patient received a treatment other than
      antitoxin serum (STANTIBOTU) or antibiotics (STANTIBIO), the
      catch-all checkbox completing that treatment group.
    code_system: none
    source: inferred
    reasoning: BOTU form; STOUTROTRA = outro tratamento; width 1.

  STPARESTES:
    official_name: Sinais e sintomas - Parestesia
    translated_name: Paresthesia
    description: >
      Whether the botulism patient reports paresthesia (abnormal tingling
      sensation), distinct from STSENSIVEL, which flags impaired
      sensitivity rather than an abnormal sensation.
    code_system: none
    source: inferred
    reasoning: BOTU form; STPARESTES = parestesia; width 1 checkbox.

  STPTOSE:
    official_name: Sinais e sintomas - Ptose palpebral
    translated_name: Ptosis (drooping eyelid)
    description: >
      Whether the patient shows ptosis (drooping eyelid), typically the
      earliest and most classic cranial-nerve sign of botulism, appearing
      alongside diplopia and mydriasis.
    code_system: none
    source: inferred
    reasoning: BOTU form; STPTOSE = ptose; width 1 checkbox.

  STRESPIRA:
    official_name: Insuficiência respiratória
    translated_name: Respiratory failure
    description: >
      Whether the botulism patient developed respiratory failure requiring
      ventilatory support, the most severe systemic consequence of the
      toxin's progressive paralysis, more advanced than the breathlessness
      recorded in STDISPNEIA.
    code_system: none
    source: inferred
    reasoning: BOTU form; STRESPIRA = respiratória; width 1 checkbox.

  STRESTAURA:
    official_name: Local de exposição - Restaurante
    translated_name: Restaurant exposure setting
    description: >
      Whether the suspect food was eaten at a restaurant, one of the
      exposure-location checkboxes used to trace a shared contaminated
      meal alongside home, school, and party settings.
    code_system: none
    source: inferred
    reasoning: BOTU form; STRESTAURA = restaurante; width 1 checkbox.

  STSENSIVEL:
    official_name: Sinais e sintomas - Alteração de sensibilidade
    translated_name: Sensory impairment
    description: >
      Whether the botulism patient shows reduced or altered sensitivity to
      touch, distinct from STPARESTES, which flags an abnormal tingling
      sensation rather than a loss of normal sensation.
    code_system: none
    source: inferred
    reasoning: BOTU form; STSENSIVEL = sensibilidade; width 1 checkbox.
