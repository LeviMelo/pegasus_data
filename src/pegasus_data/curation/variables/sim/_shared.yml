      are disjoint — measured: 9,740 CID-9 codes and 14,198 CID-10 codes for SIM share
      exactly ZERO codes, CID-9 being numeric and CID-10 letter-prefixed — so exact
      matching selects the right classification per row without anything having to
      know the row''s vintage.

