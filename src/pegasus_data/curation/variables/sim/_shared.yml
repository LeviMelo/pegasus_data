    description: 'Banded gestational age of the deceased at their own birth, in the
      1979–1995-vintage layout — meaningful for fetal/infant deaths. The band definitions
      changed in 1995: for 1979–1994, 0 Ignorado/1 <20 semanas/2 20–27/3 28+ semanas;
      from 1995, 0 Ignorado/ 4 <21 semanas/5 22–27/6 28–36/7 37–41/8 42+ semanas. The
      1996+ layout carries the same concept as GESTACAO with its own (similar but not
      identical) bands.

      '
    code_system: internal
    codelists:
    - SEMANAS
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 27 "SEMANGEST | C 9 | Semanas de gestação, conforme
      as tabelas: Para os anos de 1979 a 1994: 0 Ignorado, 1 Menos de 20 semanas, 2
      20 a 27 semanas, 3 28 e mais semanas. Para os anos a partir de 1995: 0 Ignorado,
      4 Menos de 21 semanas, 5 22 a 27 semanas, 6 28 a 36 semanas, 7 37 a 41 semanas,
      8 42 semanas e mais | 1979 (C 9)"

      '
    vintage_note: 'The same numeric codes (e.g. "3") mean different bands before and
      after 1995 — do not pool codes across that boundary without applying the correct
      year''s table.

      '
  SERIESCFAL:
    official_name: Série escolar do falecido
    translated_name: Deceased's last completed school grade/series
    description: 'Last school grade ("série") the deceased completed, as a single digit
      1–8, collected from 2012 alongside ESCFALAGR1. DATASUS''s own layout does not
      spell out what each of 1–8 corresponds to (e.g. which grade "5" is) beyond "número
      de 1 a 8" — treat it as an ordinal position within schooling, not a decoded label.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 106 "SERIESCFAL | C 10 | Última série escolar
      concluída pelo falecido. (Números de 1 a 8) | 2012 (C 10)"; corroborated by [PCDAS-SIM]:
      "Série escolar do falecido. Valores de 1 a 8."

      '
