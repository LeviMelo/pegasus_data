  TPASSINA:
    official_name: Tipo de assinatura
    translated_name: Signature type on the death-certificate attestation
    description: 'A flag introduced in 2006 alongside DTATESTADO (date of the atestado),
      almost certainly recording the type or method of signature on the death certificate''s
      medical attestation. Which values it takes is not documented anywhere consulted.

      '
    code_system: none
    source: inferred
    reasoning: '"TP" is DATASUS''s standard tipo prefix and "ASSINA" abbreviates assinatura
      (signature); [ESTRUTURA-SIM] lists TPASSINA at position 79, introduced the same
      year (2006) as DTATESTADO at position 80, with its description cell blank rather
      than absent.

      '
    notes: 'DELIBERATELY UNDER-SPECIFIED — distinct from the older ATESTANTE field
      (position 32, 1979 vintage, "condição do médico atestante"); no coded values
      were captured for TPASSINA itself.

      '
  UFINFORM:
    official_name: UF informante
    translated_name: Reporting state (UF) code
    description: 'IBGE/UF code of the state health department that transmitted this
      record to DATASUS. This is the *reporting* jurisdiction, which is administrative
      and does not have to match the state where the death occurred or where the deceased
      lived — a record can be reprocessed and resubmitted by a UF other than either
      of those.

      '
    code_system: external
    codelists:
    - UF
    - BR_UF
    - UFC
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 48 "UFINFORM | C 8 | Código da UF que informou
      o registro. | 1979 (C 8)"

      '
