  STDONOVA:
    official_name: Status de DO nova
    translated_name: New-form certificate flag
    description: Whether the record came in on the newer certificate form. It marks which
      set of education and gestation fields to expect.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo STDONOVA'
  TIPOACID:
    official_name: Tipo de acidente
    translated_name: Type of accident
    description: 'Kind of accident, when applicable, in the 1979–1995-vintage layout: 0 Ignorado,
      1 Atropelamento, 2 Demais acidentes de trânsito, 3 Queda, 4 Afogamento, 5 Outros tipos
      de acidente.

      '
    code_system: internal
    codelists:
    - TIPOACID
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 40 "TIPOACID | C 8 | Indica o tipo de acidente, se cabivel:
      0: Ignorado 1: Atropelamento 2: Demais acidentes de transito 3: Queda 4: Afogamento
      5: Outros tipos de acidente | 1979 (C 8)"

      '
  TIPOBITO:
    official_name: Tipo do óbito
    translated_name: Death type
    description: Whether the death was foetal or non-foetal.
    code_system: internal
    source: layout_doc
  TIPOGRAV:
    official_name: Tipo de gravidez
    translated_name: Type of pregnancy (deceased's own birth)
    description: 'Whether the pregnancy that produced the deceased was single or multiple,
      in the 1979–1995-vintage layout: 0 Ignorado, 1 Única, 2 Dupla, 3 Tríplice, 4 Mais de
      3. Meaningful for fetal/infant deaths. The 1996+ layout carries the same concept as
      GRAVIDEZ.

      '
    code_system: internal
    codelists:
    - GRAVIDEZ
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 28 "TIPOGRAV | C 8 | Tipo de gravidez, conforme a tabela:
      0: Ignorado 1: Unica 2: Dupla 3: Triplice 4: Mais de 3 | 1979 (C 8)"

      '
  TIPOPARTO:
    official_name: Tipo de parto
    translated_name: Type of delivery (deceased's own birth)
    description: 'How the deceased was delivered, in the 1979–1995-vintage layout: 0 Ignorado,
      1 Espontâneo, 2 Operatório, 3 Fórceps, 4 Outro. Meaningful for fetal/infant deaths.
      The 1996+ layout carries the same concept as PARTO (collapsed to vaginal/cesáreo/ignorado).

      '
    code_system: internal
    codelists:
    - PARTO
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 29 "TIPOPARTO | C 9 | Tipo de parto, conforme a tabela:
      0: Ignorado 1: Espontaneo 2: Operatorio 3: Forceps 4: Outro | 1979 (C 9)"

      '
  TIPOVIOL:
    official_name: Tipo de violência
    translated_name: Type of violent death
    description: 'Kind of violent/non-natural death, when applicable, in the 1979–1995-vintage
      layout: 0 Ignorado, 1 Homicídio, 2 Suicídio, 3 Acidente, 4 Outros tipos de violência.

      '
    code_system: internal
    codelists:
    - TIPOVIOL
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 39 "TIPOVIOL | C 8 | Indica o tipo de violencia, se
      cabivel, conforme a tabela: 0: Ignorado 1: Homicidio 2: Suicidio 3: Acidente 4: Outros
      tipos de violencia | 1979 (C 8)"

      '
  TPASSINA:
    official_name: Tipo de assinatura
    translated_name: Signature type on the death-certificate attestation
    description: 'A flag introduced in 2006 alongside DTATESTADO (date of the atestado), almost
      certainly recording the type or method of signature on the death certificate''s medical
      attestation. Which values it takes is not documented anywhere consulted.

      '
    code_system: none
    source: inferred
    reasoning: '"TP" is DATASUS''s standard tipo prefix and "ASSINA" abbreviates assinatura
      (signature); [ESTRUTURA-SIM] lists TPASSINA at position 79, introduced the same year
      (2006) as DTATESTADO at position 80, with its description cell blank rather than absent.

      '
    notes: 'DELIBERATELY UNDER-SPECIFIED — distinct from the older ATESTANTE field (position
      32, 1979 vintage, "condição do médico atestante"); no coded values were captured for
      TPASSINA itself.

      '
  TPMORTEOCO:
    official_name: A morte ocorreu
    translated_name: Gestational moment of death
    description: The gestational or post-gestational moment of death — in pregnancy, in delivery,
      in abortion, within 42 days, or 43 days to a year. Filled for deaths of women of fertile
      age.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo TPMORTEOCO'
  TPNIVELINV:
    official_name: Tipo de nível investigador
    translated_name: Investigating level
    description: 'Which level of government carried out the investigation: state, regional
      or municipal.'
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo TPNIVELINV'
  TPOBITOCOR:
    official_name: Momento do óbito após investigação
    translated_name: Moment of death, post-investigation
    description: The gestational moment of death as established by investigation, with finer
      categories than TPMORTEOCO and an explicit code for an investigation that could not
      establish it. Blank means not investigated.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo TPOBITOCOR'
  TPPOS:
    official_name: Óbito investigado
    translated_name: Death investigated
    description: Whether this death went through the investigation process. The gate on every
      DTCADINV, DTCONINV and post-investigation field.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo TPPOS'
  TPRESGINFO:
    official_name: Tipo de resgate de informação
    translated_name: Investigation outcome
    description: Whether the investigation added nothing, recovered new causes, or corrected
      causes originally reported. The measure of what investigation is worth on this record.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo TPRESGINFO'
  UFINFORM:
    official_name: UF informante
    translated_name: Reporting state (UF) code
    description: 'IBGE/UF code of the state health department that transmitted this record
      to DATASUS. This is the *reporting* jurisdiction, which is administrative and does not
      have to match the state where the death occurred or where the deceased lived — a record
      can be reprocessed and resubmitted by a UF other than either of those.

      '
    code_system: external
    codelists:
    - UF
    - BR_UF
    - UFC
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 48 "UFINFORM | C 8 | Código da UF que informou o registro.
      | 1979 (C 8)"

      '
  VERSAOSCB:
    official_name: Versão do seletor de causa básica
    translated_name: Cause-selector version
    description: Version of the underlying-cause selector that chose CAUSABAS. Two records
      with the same certificate can differ here, and therefore in the selected cause.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo VERSAOSCB'
  VERSAOSIST:
    official_name: Versão do sistema
    translated_name: System version
    description: Version of the SIM software that produced the record. Useful for explaining
      why a field changed shape between files.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo VERSAOSIST'
