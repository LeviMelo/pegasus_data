  LINHAA:
    official_name: Linha A da declaração de óbito
    translated_name: Certificate line A
    description: 'The immediate cause of death, as written by the certifying physician. Several
      CID-10 codes may appear in one cell.

      '
    code_system: external
    codelists:
    - CID10
    - CID9WHO
    vintage_note: 'SIM ran on CID-9 until the CID-10 changeover and the FTP tree still carries
      both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so they OVERLAP for 1996-1998
      and a year threshold would mis-assign three years of deaths. Both classifications are
      bound instead. That is safe because their code spaces are disjoint — measured: 9,740
      CID-9 codes and 14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right classification per
      row without anything having to know the row''s vintage.

      '
    multi_valued: true
    token_rule:
      delimiter: '*'
      width: 4
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'The record layout gives the field a width of 20 and does not state the packing.
      Measured over 7,823 distinct observed values of LINHAA-D: values are ''*''-prefixed
      and ''*''-separated, and 10,196 of ~12,000 inter-''*'' segments are exactly 4 characters,
      matching CID-10 without the dot. Examples: ''*I10X*I429*I219'', ''*R092*I509*I10X''.
      Width 20 therefore holds up to four codes. The delimiter is the primary rule and the
      width is the corroborating check.

      '
    notes: 'Order is meaningful — it is the causal sequence as the physician wrote it, running
      from the immediate cause (A) to the underlying one (D). Preserve it when rendering,
      and do not sort or deduplicate the tokens.

      '
  LINHAB:
    official_name: Linha B da declaração de óbito
    translated_name: Certificate line B
    description: Antecedent cause leading to the condition in line A.
    code_system: external
    codelists:
    - CID10
    - CID9WHO
    vintage_note: 'SIM ran on CID-9 until the CID-10 changeover and the FTP tree still carries
      both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so they OVERLAP for 1996-1998
      and a year threshold would mis-assign three years of deaths. Both classifications are
      bound instead. That is safe because their code spaces are disjoint — measured: 9,740
      CID-9 codes and 14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right classification per
      row without anything having to know the row''s vintage.

      '
    multi_valued: true
    token_rule:
      delimiter: '*'
      width: 4
    source: inferred
    asserted_by: pegasus_data
    reasoning: Same packing as LINHAA, measured over the same 7,823 values.
    notes: Order is the causal sequence. Preserve it.
  LINHAC:
    official_name: Linha C da declaração de óbito
    translated_name: Certificate line C
    description: Antecedent cause leading to the condition in line B.
    code_system: external
    codelists:
    - CID10
    - CID9WHO
    vintage_note: 'SIM ran on CID-9 until the CID-10 changeover and the FTP tree still carries
      both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so they OVERLAP for 1996-1998
      and a year threshold would mis-assign three years of deaths. Both classifications are
      bound instead. That is safe because their code spaces are disjoint — measured: 9,740
      CID-9 codes and 14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right classification per
      row without anything having to know the row''s vintage.

      '
    multi_valued: true
    token_rule:
      delimiter: '*'
      width: 4
    source: inferred
    asserted_by: pegasus_data
    reasoning: Same packing as LINHAA, measured over the same 7,823 values.
    notes: Order is the causal sequence. Preserve it.
