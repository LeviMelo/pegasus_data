# SIM — columns shared across the mortality datasets
#
# Sourced from sources/sim2025.txt, "Estrutura do SIM" (CGIAE / DASNT / SVS,
# updated 07/2025), which gives each field's valid values and meaning.
#
# SIM dates are DDMMAAAA — day first — where SIH and CNES are AAAAMMDD.
# Parsing one with the other's order silently reorders every date.
system: SIM
asserted_by: pegasus_data
variables:
  ACIDTRAB:
    official_name: Acidente do trabalho
    translated_name: Work-related accident
    description: Whether the event that caused the death was related to the deceased's work.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo ACIDTRAB'
  ALTCAUSA:
    official_name: Alteração da causa
    translated_name: Cause of death altered after investigation
    description: 'Whether the recorded cause of death was corrected or changed as a result
      of a formal death investigation: 1 Sim, 2 Não. Introduced 2014, part of SIM''s investigation
      workflow.

      '
    code_system: internal
    codelists:
    - SIMNAO1
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 132 "ALTCAUSA | C 8 | Indica se houve correção ou alteração
      da causa do óbito após investigação. (1- Sim; 2 – Não) | 2014 (C 8)"

      '
  AREARES:
    official_name: Área de residência
    translated_name: Residence sub-area code
    description: 'A locally-assigned code for a residence area/district finer than the municipality,
      carried only in the 1979–1995-vintage files. Positioned immediately next to BAIRES (neighborhood
      of residence) in the record layout and almost certainly shares its caveat — assigned
      independently by each state/municipality, with no national lookup.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: '[ESTRUTURA-SIM] lists AREARES at position 16 with a blank description (1979,
      C 7), but it sits immediately after BAIRES (position 15), which IS documented: "Bairro
      de residencia. Este codigo e atribuido por cada estado e/ou municipio, nao fazendo parte
      da base nacional." The area/bairro name pairing and adjacent layout position are the
      basis for treating this the same way.

      '
    notes: 'No codelist survives for this column in the catalog; treat any code value as uninterpretable
      outside the municipality that assigned it.

      '
  ASSISTMED:
    official_name: Recebeu assistência médica
    translated_name: Received medical assistance
    description: Whether the deceased received continued medical care during the illness that
      caused the death. A death without assistance is one the certifier had less evidence
      about.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo ASSISTMED'
  ATESTADO:
    official_name: CIDs informados no atestado
    translated_name: Certificate ICD codes
    description: The ICD codes as written on the certificate, in one 70-character string.
      Raw text; CAUSABAS holds the selected underlying cause.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo ATESTADO'
  ATESTANTE:
    official_name: Condição do médico atestante
    translated_name: Certifying physician's relationship
    description: 'Whether the certifying physician was the attending doctor, a substitute,
      the IML (medico-legal institute) or the SVO (verification-of-death service).

      '
    code_system: internal
    source: layout_doc
    notes: 'IML and SVO certification indicate external or unclarified causes respectively,
      so this field conditions how much to trust CAUSABAS.

      '
  BAIRES:
    official_name: Bairro de residência
    translated_name: Neighbourhood of residence (locally coded)
    description: 'Neighbourhood/district of the deceased''s residence, in the 1979–1995-vintage
      layout. The code is assigned independently by each state or municipality — it is not
      a national code and has no single national lookup table. Superseded from 1996 by CODBAIRES
      under a different (also locally-assigned) numbering.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 15 "BAIRES | C 6 | Bairro de residencia. Este codigo
      e atribuido por cada estado e/ou municipio, nao fazendo parte da base nacional | 1979
      (C 6)"

      '
    vintage_note: '1979–1995-vintage legacy field. Renamed/re-coded as CODBAIRES from 1996.

      '
  CARTORIO:
    official_name: Cartório
    translated_name: Civil registry office code
    description: 'Code of the cartório (civil registry office) where the death was formally
      registered, in the 1979–1995-vintage layout. An identifier into a local registry, not
      a decodable category.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 2 "CARTORIO | C 8 | Código do cartório onde o óbito
      foi registrado | 1979 (C 8)"

      '
    vintage_note: '1979–1995-vintage legacy field. The 2012+ layout carries the same concept
      as CODCART, alongside a fuller cartório-registration cluster (CODMUNCART, DTREGCART,
      NUMREGCART).

      '
  CAUSABAS:
    official_name: Causa básica do óbito
    translated_name: Underlying cause of death
    description: 'The underlying cause, as a CID-10 code without the dot. This is the code
      selected by the coder from the certificate''s causal chain — it is the cause mortality
      statistics are built on.

      '
    code_system: external
    codelists:
    - CID10
    - CID9WHO
    vintage_note: 'SIM ran on CID-9 until the CID-10 changeover and the FTP tree still carries
      both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so they OVERLAP for 1996-1998
      and a year threshold would mis-assign three years of deaths. Both classifications are
      bound instead. That is safe because their code spaces are disjoint — measured: 9,740
      CID-9 codes and 14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right classification per
      row without anything having to know the row''s vintage.

      '
    multi_valued: false
    token_rule:
      width: 4
    source: layout_doc
    notes: 'One death has exactly one underlying cause by construction. The LINHAA-D fields
      hold what the physician wrote; CAUSABAS holds what was selected from it, and the two
      disagree often enough that using LINHAA as a cause of death is a different analysis,
      not a more detailed one.

      '
  CAUSABAS_O:
    official_name: Causa básica original
    translated_name: Original underlying cause
    description: 'The underlying cause before recoding, where the record was investigated
      and the cause revised.

      '
    code_system: external
    codelists:
    - CID10
    - CID9WHO
    vintage_note: 'SIM ran on CID-9 until the CID-10 changeover and the FTP tree still carries
      both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so they OVERLAP for 1996-1998
      and a year threshold would mis-assign three years of deaths. Both classifications are
      bound instead. That is safe because their code spaces are disjoint — measured: 9,740
      CID-9 codes and 14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right classification per
      row without anything having to know the row''s vintage.

      '
    source: layout_doc
  CAUSAMAT:
    official_name: Causa externa associada a causa materna
    translated_name: Associated maternal external cause
    description: ICD-10 code of an external cause associated with a maternal death, which
      is how a maternal death from violence or accident is distinguished from an obstetric
      one.
    code_system: external
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo CAUSAMAT'
  CB_PRE:
    official_name: Causa básica pré-investigação
    translated_name: Underlying cause before investigation
    description: ICD-10 underlying cause held before the death was investigated. Compare with
      CAUSABAS to see what the investigation changed.
    code_system: external
    source: inferred
    reasoning: Named in SIM extracts alongside CAUSABAS_O and the post-investigation fields,
      and not listed in the 07/2025 Estrutura do SIM. The CB prefix and its position beside
      the investigation fields identify it as the pre-investigation underlying cause; the
      reading is not confirmed by a published layout.
    asserted_by: pegasus_data
  CIRCOBITO:
    official_name: Tipo de morte violenta
    translated_name: Manner of violent death
    description: For non-natural deaths, whether the manner was accident, suicide, homicide,
      or other. The field that separates the three, and 'other' includes deaths under investigation.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo CIRCOBITO'
  CIRURGIA:
    official_name: Realização de cirurgia
    translated_name: Surgery performed
    description: Whether surgery was performed before the death.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo CIRURGIA'
  CODBAIOCOR:
    official_name: Código do bairro de ocorrência
    translated_name: Neighbourhood-of-occurrence code
    description: 'Neighbourhood/district code of where the death occurred (as opposed to CODBAIRES,
      which is the deceased''s residence). Same locally-assigned, non-national numbering pattern.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 78 "CODBAIOCOR | C 10 | Código do bairro de ocorrência.
      | 2006 (C 10)"

      '
    notes: 'The catalog''s TPROC10 binding here is the same false-positive semantic match
      seen on CODBAIRES — see spurious_bindings.

      '
  CODBAIRES:
    official_name: Código do bairro de residência
    translated_name: Neighbourhood-of-residence code
    description: 'Neighbourhood/district code of the deceased''s residence, in the 1996–2010-vintage
      layout — the successor to BAIRES under the post-1996 field-naming scheme. Still a locally-assigned
      code without a single national lookup.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 56 "CODBAIRES | C 9 | Código do Bairro de residência
      | 1996 (C 9)"

      '
    vintage_note: 'Present 1996–2010 (per the observed series range); BAIRES carries the same
      concept for 1979–1995. The two do not share a coding scheme, so do not coalesce codes
      across the boundary without a crosswalk.

      '
    notes: 'The catalog''s TPROC10 (procedure-type table) binding on this column is unrelated
      — a semantic-match false positive; see spurious_bindings.

      '
  CODCART:
    official_name: Código do cartório
    translated_name: Civil registry office code
    description: 'Code of the cartório (civil registry office) where the death was registered,
      in the 2012+ cartório-detail cluster (alongside CODMUNCART, DTREGCART, NUMREGCART) —
      the modern counterpart of the legacy CARTORIO field.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: '[ESTRUTURA-SIM] lists CODCART at position 103 with a blank description (2012,
      C 7), but it appears alongside three fully-documented siblings introduced the same year
      — CODMUNCART ("Código do município do cartório"), DTREGCART ("Data do registro do cartório")
      and NUMREGCART ("Número do registro do cartório") — all naming the same cartório-registration
      event, plus the pre-existing 1979-vintage CARTORIO field documents the identical concept
      under an earlier name.

      '
  CODESTAB:
    official_name: Estabelecimento
    translated_name: Establishment
    description: CNES code of the establishment where the death occurred.
    code_system: internal
    source: layout_doc
  CODIFICADO:
    official_name: Informa se formulário foi codificado
    translated_name: Coded flag
    description: Whether the form was coded — S or N, not a numeric flag.
    code_system: internal
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo CODIFICADO'
  CODIGO:
    official_name: Código do estabelecimento de ocorrência
    translated_name: Facility code where the death occurred (locally coded)
    description: 'Code of the health establishment where the death occurred, filled only when
      the death happened at a health facility (place-of-occurrence = hospital/other health
      establishment). Locally assigned by each state/municipality in this 1979–1995 layout,
      not a national registry code.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 12 "CODIGO | C 6→7 | Codigo do estabelecimento onde
      ocorreu o obito, se LOCOCOR = 1. Este codigo e atribuido por cada estado e/ou municipio,
      nao fazendo parte da base nacional | 1979 (C 6), 1995 (C 7)"

      '
    notes: 'Because it is a locally-assigned identifier rather than a national registry code,
      the catalog''s TCNESBR (CNES facility registry) binding on this column is a false-positive
      semantic match, not a real relationship — see spurious_bindings. From 2001 the DO layout
      instead carries CODESTAB, which IS a real CNES code.

      '
  CODMUNCART:
    official_name: Código do município do cartório
    translated_name: Municipality code of the registry office
    description: 'IBGE municipality code of the cartório (civil registry office) that recorded
      the death — part of the 2012+ cartório-detail cluster. Not necessarily the municipality
      of death or residence; it is where the paperwork was filed.

      '
    code_system: external
    codelists:
    - MUNICBR
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 102 "CODMUNCART | C 10 | Código do município do cartório
      | 2012 (C 10)"

      '
  CODMUNNATU:
    official_name: Código do município de naturalidade
    translated_name: Municipality of birth
    description: IBGE code of the municipality the deceased was born in. Distinct from where
      they lived (CODMUNRES) and where they died (CODMUNOCOR); migration makes all three differ.
    code_system: external
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo CODMUNNATU'
  CODMUNOCOR:
    official_name: Município de ocorrência
    translated_name: Municipality of occurrence
    code_system: internal
    codelist: MUNICBR
    source: inferred
    reasoning: 'Not CADMUN despite the name. CADMUN as ingested is a DBF lookup whose label
      column resolved to OBSERV, which is blank for 5,517 of its 5,579 rows, so it decodes
      no municipality at all. MUNICBR holds 25,733 six-character IBGE codes labelled ''120001
      Acrelandia''.

      '
    notes: 'Residence and occurrence differ systematically for deaths in referral hospitals,
      which concentrate in capitals. Mapping deaths by CODMUNOCOR draws a map of where hospitals
      are.

      '
  CODMUNRES:
    official_name: Município de residência
    translated_name: Municipality of residence
    code_system: internal
    codelist: MUNICBR
    source: inferred
    reasoning: 'Not CADMUN despite the name. CADMUN as ingested is a DBF lookup whose label
      column resolved to OBSERV, which is blank for 5,517 of its 5,579 rows, so it decodes
      no municipality at all. MUNICBR holds 25,733 six-character IBGE codes labelled ''120001
      Acrelandia''.

      '
  COMUNSVOIM:
    official_name: Município do SVO ou IML
    translated_name: SVO/IML municipality
    description: IBGE code of the municipality of the death-verification service or medico-legal
      institute, filled only where the certifier was one of those. Blank otherwise by design.
    code_system: external
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo COMUNSVOIM'
  CONTADOR:
    official_name: Contador
    translated_name: Record counter
    description: 'A sequential counter DATASUS attaches to each row of a SIM extract. It is
      the first field in the record layout and carries no epidemiological content — it exists
      to give every row a position within its own file, not to identify a death across files
      or over time.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: '[ESTRUTURA-SIM] lists CONTADOR at position 1 of the DO layout with no description
      text at all (1979, C 8) — the only field in the whole layout with a completely blank
      description. Two structurally similar undocumented fields sitting a few positions away,
      CRITICA and NUMEXPORT, are both explicitly described there as "Dado para controle interno"
      (data for internal control), which is the same category position-1-blank-name pattern
      points to. It is also the single most common field in this batch (1,524 of the files
      carrying any of these 66 columns), consistent with a boilerplate technical column DATASUS
      stamps onto essentially every extract rather than a substantive DO field.

      '
    notes: 'Do not use this as a cross-file or cross-vintage identifier for a specific death
      — nothing in the layout or the observed values (small integers that reset in range from
      file to file) supports that. The catalog''s MUNICBR binding on this column is a semantic-match
      false positive, not a real relationship — see spurious_bindings.

      '
  CRITICA:
    official_name: Crítica
    translated_name: Internal edit/QA flag
    description: 'An internal data-quality control code from the 1979–1995 legacy layout —
      DATASUS''s own documentation gives it no further meaning than "data for internal control."
      Present only in DOR-era files (1979–1995/1998 depending on series).

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 44 "CRITICA | C 7 | Dado para controle interno | 1979
      (C 7)"

      '
    notes: 'DATASUS never documents what the individual codes mean, so do not attempt to decode
      specific values (e.g. "001", "002") — the source itself treats this as opaque.

      '
  CRM:
    official_name: CRM do médico atestante
    translated_name: Certifying physician's medical license number
    description: 'Registration number of the certifying physician at their regional medical
      council (Conselho Regional de Medicina), introduced 2014. This identifies the doctor
      who signed the death certificate, not the deceased.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 119 "CRM | C 15 | Número de inscrição do Médico atestante
      no Conselho Regional de Medicina | 2014 (C 8→9→15)"

      '
    notes: 'This is a personal identifier for the certifying physician — a real, traceable
      professional license number, not an internal DATASUS code. Present in only 160 files
      in this batch (2014–2018), so coverage is far from universal.

      '
  CRSOCOR:
    official_name: CRS de ocorrência
    translated_name: Health-region code of occurrence (locally coded)
    description: 'Code of the health region (Regional de Saúde) where the death occurred,
      in the 1979–1995-vintage layout. Assigned independently by each state/municipality,
      not standardized nationally.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 46 "CRSOCOR | C 7 | Regional de Saude de ocorrencia.
      Este codigo e atribuido por cada estado e/ou municipio, nao fazendo parte da base nacional
      | 1979 (C 7)"

      '
  CRSRES:
    official_name: CRS de residência
    translated_name: Health-region code of residence (locally coded)
    description: 'Code of the health region (Regional de Saúde) of the deceased''s residence,
      in the 1979–1995-vintage layout. Assigned independently by each state/municipality,
      not standardized nationally.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 47 "CRSRES | C 6 | Regional de Saude de residencia.
      Este codigo e atribuido por cada estado e/ou municipio, nao fazendo parte da base nacional
      | 1979 (C 6)"

      '
  DATANASC:
    official_name: Data de nascimento
    translated_name: Deceased's date of birth
    description: 'Birth date of the deceased, ddmmaaaa, in the 1979–1995-vintage layout. For
      a fetal death the layout instructs that this equal the date of death (DATAOBITO), since
      a stillbirth''s "birth" and "death" are the same event.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 9 "DATANASC | C 8 | Data do nascimento do falecido.
      Em caso de óbito fetal as datas de óbito e nascimento deverão ser iguais.(Data no padrão
      ddmmaaaa) | 1979 (C 8)"

      '
    notes: '"00000000" is the observed sentinel for unknown, and a nontrivial share of records
      (e.g. "1995") carry only a 4-digit year rather than a full date — treat those as partial,
      not as January-something dates.

      '
  DATAOBITO:
    official_name: Data do óbito
    translated_name: Date of death
    description: 'Date the death occurred, in the 1979–1995-vintage layout. From 1996 the
      same concept is carried by DTOBITO.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 6 "DATAOBITO | C 9 | Data em que occoreu o óbito.(Data
      no padrão ddmmaaaa) | 1979 (C 9)"

      '
    notes: 'The doc''s stated format is 8-digit ddmmaaaa, but the observed values in this
      batch are 6 characters and end in "00" (e.g. "790300", "790100" — read as YY, MM, and
      a fixed "00"), and the catalog binds this column to ANO7995/MESES/ANO — year/month tabulation
      axes rather than a codelist, mirroring the well-known "date bound to a year-and-month
      grouping table" pattern (see spurious_bindings). Day-level date arithmetic on this field
      for pre-1996 records is likely unsafe; treat it as month/year-resolution for that vintage
      rather than a full calendar date.

      '
  DATAREG:
    official_name: Data de registro
    translated_name: Registration receipt date
    description: 'Date DATASUS/the health department received this death record, in the 1979–1995-vintage
      layout ddmmaaaa format. The successor concept from 1996 is DTRECEBIM/DTRECORIG.

      '
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] pos. 4 "DATAREG | C 7 | Data do recebimento. (Data no padrão
      ddmmaaaa) | 1979 (C 7)"

      '
    notes: 'The declared width is 7 and the doc claims ddmmaaaa (8-digit) format, but observed
      values in this batch are inconsistent in length — some are a bare 2-digit year (e.g.
      "95") and others are 6 digits (e.g. "950417"). Do not assume every value carries a full
      date; a nontrivial share of DOR-era records appear to have only year, or year+month.

      '
  DIFDATA:
    official_name: Diferença entre data do óbito e recebimento
    translated_name: Death-to-receipt days
    description: Days between the death and the original receipt of the certificate, computed
      by DATASUS. The standard measure of reporting timeliness.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo DIFDATA'
  DTATESTADO:
    official_name: Data do atestado
    translated_name: Certificate date
    description: Date the certificate was signed, as DDMMAAAA text. Note the day-first order
      — SIH and CNES use AAAAMMDD, and mixing them silently reorders the date.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo DTATESTADO'
  DTCADASTRO:
    official_name: Data do cadastro
    translated_name: Registration date
    description: Date the death was entered into SIM, as DDMMAAAA text. Later than the death,
      and the gap is the reporting delay.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo DTCADASTRO'
  DTCADINF:
    official_name: Data do cadastro da investigação de óbito infantil
    translated_name: Infant investigation date
    description: When filled, indicates the infant-death investigation was carried out, as
      DDMMAAAA text. Blank means no such investigation.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo DTCADINF'
  DTCADINV:
    official_name: Data do cadastro de investigação
    translated_name: Investigation registration date
    description: Date the investigation record was created, as DDMMAAAA text.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo DTCADINV'
  DTCONCASO:
    official_name: Data de conclusão do caso
    translated_name: Case conclusion date
    description: Date the case was closed, as DDMMAAAA text.
    code_system: none
    source: layout_doc
    source_ref: '[ESTRUTURA-SIM] sim2025.txt — Estrutura do SIM (CGIAE/DASNT/SVS, atualizado
      07/2025), campo DTCONCASO'
  DTCONINV:
    official_name: Data da conclusão da investigação
    translated_name: Investigation conclusion date
