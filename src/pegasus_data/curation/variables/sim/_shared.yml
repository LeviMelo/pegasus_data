      width: 4
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'The record layout gives the field a width of 20 and does not state
      the packing. Measured over 7,823 distinct observed values of LINHAA-D: values
      are ''*''-prefixed and ''*''-separated, and 10,196 of ~12,000 inter-''*'' segments
      are exactly 4 characters, matching CID-10 without the dot. Examples: ''*I10X*I429*I219'',
      ''*R092*I509*I10X''. Width 20 therefore holds up to four codes. The delimiter
      is the primary rule and the width is the corroborating check.

      '
    notes: 'Order is meaningful — it is the causal sequence as the physician wrote
      it, running from the immediate cause (A) to the underlying one (D). Preserve
      it when rendering, and do not sort or deduplicate the tokens.

