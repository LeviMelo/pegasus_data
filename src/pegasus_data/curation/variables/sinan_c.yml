  ANT_CAT_EX:
    official_name: >
      Categoria de Exposição (Campo Interno)
    translated_name: >
      Computed HIV-exposure category (child form)
    description: >
      System-computed classification of how the child probably acquired HIV, the
      child-form analogue of the adult form's ANT_REL_CA, assigned from the
      hierarchy of ANT_PERINA, ANT_REL_N, ANT_TRANS_, ANT_T_HEMO and the
      biological-accident item — not entered directly. Uses its own child-specific
      code list (e.g. 10 Homossexual, 40 Drogas, 50 Hemofílico, 60 Transfusão, 62
      Transfusão/Homosexual), different from the adult form's ANT_REL_CA list.
    code_system: internal
    codelists: [CATHIERN, CLASCATN]
    source: layout_doc
    source_ref: >
      [AIDS-CR]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/AidsCrianca/DIC_DADOS_Aids_crianca_v5.pdf
      — "Categoria de exposição | tp_categoria_exposicao | varchar(2) | 10 –
      Homossexual 11 – Homo/Drogas ... 40 – Drogas 41 – Drogas/Hemofílico 42 –
      Drogas/Transfusão 50 – Hemofilico 60 – Transfusão 61 – Transfusão/Drogas 62
      – Transfusão/Homosexual | ANT_CAT_EX"
    depends_on: [ANT_PERINA, ANT_REL_N, ANT_TRANS_, ANT_T_HEMO]
    notes: >
      The source PDF's own "Descrição" column for this row is a copy-paste
      artifact from an unrelated field ("Data da digitação da ficha ... Essa data
      não deve ser alterada") — the field label, DBF name and code list for THIS
      row are unambiguous from the field number and neighbouring rows; only the
      Descrição cell is unreliable.

