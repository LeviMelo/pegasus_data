  ANT_DIARRE:
    official_name: >
      41. RJ/Caracas — Diarréia ≥1 Mês (2 pts)
    translated_name: >
      RJ/Caracas criterion: diarrhoea ≥1 month
    description: >
      RJ/Caracas score item: diarrhoea lasting one month or longer (1 Sim, 2 Não,
      9 Ignorado), worth 2 points.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Diarréia igual ou maior a 1 mês (2) |
      st_diarreia | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Pontuação (2) |
      ANT_DIARRE"

  ANT_FEBRE:
    official_name: >
