    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Herpes Zoster em indivíduo menor ou
      igual a 60 anos (5) | st_herpes_zoster | varchar(1) | 1 – Sim 2 – Não 9 –
      Ignorado | Pontuação (5) | ANT_HERPES"

  ANT_DISFUN:
    official_name: >
      41. RJ/Caracas — Disfunção do Sistema Nervoso Central (5 pts)
    translated_name: >
      RJ/Caracas criterion: central-nervous-system dysfunction
    description: >
      RJ/Caracas score item: central nervous system dysfunction (1 Sim, 2 Não, 9
      Ignorado), worth 5 points.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Disfunção do sistema nervoso central
      (5) | st_disfuncao | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Pontuação
