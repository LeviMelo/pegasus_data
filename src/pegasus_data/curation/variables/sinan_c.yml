# SINAN — batch: files-descending, offset 120, limit 120 (columns 120-240).
#
# Two clusters dominate this batch:
#
# (1) 71 of 114 written columns belong to the two adult/child AIDS
#     investigation forms (agravo AIDS ADULTO / AIDS CRIANCA, series
#     AIDA/HIVA and AIDC/HIVC). ANT_* fields (adult transmission-category
#     block, fields 32-39, and the field-41 Rio de Janeiro/Caracas
#     expanded case-definition score) and CLI_* fields (both forms' field-45
#     CDC-adapted opportunistic-disease checklist) are each ONE ITEM of a
#     fixed, form-printed clinical checklist — not free classification,
#     a literal transcription of "does this specific condition apply:
#     Sim/Nao/Ignorado". HIVA/HIVC are the parallel "Notificacao de
#     Infeccao pelo HIV" agravo (mandatory nationally from 2014) that
#     mirrors AIDA/AIDC's field set; inferred from the shared DBF/field
#     structure and the HIVA*.dbc / HIVC*.dbc file-prefix pattern, not
#     from a dedicated layout document (none was found on the tree).
#
# (2) A generic "Dados Complementares / Hospitalizacao / Contato" block
#     (DT_ATENDE, MUN_HOSP, UF_HOSP, ATE_HOSPIT, ATE_INTERN, DTALTA, ...)
#     that many unrelated agravo-specific forms print with the SAME field
#     name and, mostly, the SAME meaning — confirmed by reading the
#     equivalent row on two independent forms per field wherever
#     possible. Several columns instead turned out to be REAL NAME
#     COLLISIONS: the same DBF name reused by two forms for two different
#     questions (FONTE, CS_RESULTA, CS_SANGUE, CLI_PSEUDO, MUCOSA,
#     CONTATO, ISOLAMENTO, TIT_IGG/IGM_S1/S2, PESO). These are documented
#     with both meanings and a notes: trap, not merged into one guess.
#
# Provenance shorthand used in source_ref below: bracketed keys like
# [AIDS-AD], [MENI], [DEF] name a source, and each source_ref carries the
# literal fetch URL right after the key. All are portalsinan.saude.gov.br
# SINAN NET v5.0 "Dicionario de Dados" PDFs (Ministerio da Saude/SVS/
# GT-SINAN) unless marked [DEF], which is the TAB_SINANNET.zip
# dictionary/.CNV tables on the FTP tree.
#
# SKIPPED, on purpose (evidence too thin to trust):
#   NDUPLIC     - a "not a duplicate / duplicate" tabulation flag is confirmed
#                 under DBF name NDUPLIC_N on the Violencia form (values 0/1/2)
#                 and nowhere else in the four other series (CHAG, DENG, LEPT,
#                 MALA) that carry a column literally named NDUPLIC — the name
#                 mismatch (NDUPLIC vs NDUPLIC_N) is close enough to guess but
#                 not close enough to assert.
#   CON_INF_PA  - declared width swings from C(3) to C(12) to N(3) across its
#                 six series (CHAG/DENG/HANT/LEIV/LEPT/MALA) with no dictionary
#                 label and no layout-document row found under this name.
#   CLICDCCA_N  - no dictionary or layout-document row found under this DBF
#                 name in either AIDS dictionary; a plausible but unconfirmed
#                 guess is that it is a later renaming of the confirmed item
#                 CLI_CDC_CA (Candidose de esofago, AIDS Crianca field 45).
#   CLI_CANDIA  - no dictionary or layout-document row found under this DBF
#                 name in either AIDS dictionary.
#   CLI_HERPES,
#   CLI_HERPEG  - the AIDS Crianca dictionary assigns the SAME DBF name
#                 (CLI_HERPES) to two different field-45 checklist rows
#                 ("Herpes Simples em bronquios/pulmoes/trato gastrintestinal"
#                 and "Herpes zoster"), and CLI_HERPEG does not appear in the
#                 document at all, while the catalog holds both CLI_HERPES and
#                 CLI_HERPEG as distinct columns. Cannot tell which catalog
#                 column is which source-document row, so neither is written.
#
# spurious_bindings expected on validate (dates bound to TabNet year/month
# tabulation axes, not a coded value): DT_ATENDE, ATE_INTERN, DTALTA,
# DT_ULT_DOS -> ANOS/MESES/MESESC/TRIME.
#
# Also expected (not spurious, a genuine catalog gap, kept honest rather
# than gamed): several Sim/Nao/Ignorado or IBGE-code columns confirmed
# coded in the layout document have NO codelist bound in this catalog
# build (ANTTRANS_M, ANT_CONTAG, ANT_ESOF_N, ANT_HEMOLF, ANT_TRASMI,
# ANT_TRANS_, ANT_T_HEMO, UF_HOSP, BERILIO, SILICA, CLI_CDC_SI) — each
# is noted individually below.
system: SINAN
asserted_by: pegasus_data

variables:

  BERILIO:
    official_name: >
      Agentes de Exposição — Berílio
    translated_name: >
      Occupational exposure to beryllium
    description: >
      Whether the patient was occupationally exposed to beryllium at any point in
      their working life (1 Sim, 2 Não, 9 Ignorado). One item of a fixed
      lifetime-exposure checklist (with SILICA and the OUTRO_EXP/OUT_EXP_DE pair)
      that both the pneumoconiosis and the work-related-cancer investigation forms
      ask, since beryllium is both a pneumoconiosis (berylliosis) agent and an
      IARC Group 1 occupational carcinogen (lung cancer).
    code_system: internal
    source: layout_doc
    source_ref: >
      [PNEU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf
      — "51. Agentes de Exposição berilio | st_agente_berilio | varchar2(1) | 1 –
      Sim 2 – Não 9 – Ignorado | O paciente esteve exposto a berilio | Campo
      obrigatório | BERILIO"; confirmed with the same item and codes on [CANC]
      http://www.portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf
      — "49. Houve exposição... a algum dos itens abaixo relacionados? ... |
      st_exp_berilio | ... 1 – Sim ... | BERILIO"
    notes: >
      No codelist is bound to this column in the catalog even though the value set
      (1/2/9) is confirmed verbatim in both source documents — treat the missing
      binding as a catalog gap, not evidence the field is free-form.

  SILICA:
    official_name: >
      Agentes de Exposição — Sílica
    translated_name: >
      Occupational exposure to free silica
    description: >
      Whether the patient was occupationally exposed to free silica (sílica livre)
      at any point in their working life (1 Sim, 2 Não, 9 Ignorado). Same
      lifetime-exposure checklist as BERILIO; silica is the classic cause of
      silicosis and, on the DRT Câncer form, is asked alongside arsenic as a lung
      carcinogen.
    code_system: internal
    source: layout_doc
    source_ref: >
      [PNEU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf
      — "51. Agentes de Exposição Sílica | st_agente_silica | varchar2(1) | 1 –
      Sim 2 – Não 9 – Ignorado | O paciente esteve exposto à Sílica | Campo
      obrigatório | SILICA"; CANC form asks the same item as "Sílica livre,
      arsênico e seus compostos arsenicais", DBF SILICA.
    notes: >
      No codelist is bound to this column in the catalog; see the BERILIO note —
      the value set is confirmed in the layout document regardless.

  OUTRO_EXP:
    official_name: >
      Agentes de Exposição — Outro
    translated_name: >
      Occupational exposure to an unlisted agent (flag)
    description: >
      Sim/Não/Ignorado flag marking that the patient's occupational exposure
      history included an agent not covered by the form's fixed checklist items
      (BERILIO, SILICA and, on the biological-accident form, the specific
      exposure-route items). Paired with OUT_EXP_DE, which holds the free-text
      name of that other agent — only filled in when this flag is Sim. The exact
      checklist context (route of biological exposure on the Acidente com Material
      Biológico form, or occupational carcinogen/pneumoconiosis agent on the
      Pneumoconiose/Câncer forms) depends on which agravo the record belongs to.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [CANC]
      http://www.portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf
      — "49. Houve exposição nos locais de trabalho... Outros | st_exp_outro |
      varchar2(1) | 1 – Sim 2 – Não 9 – Ignorado | ... | OUTRO_EXP"; matching item
      confirmed on [ACBI]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "46. Tipo de exposição ... Outro | st_exp_outro | varchar2(1) | 1. Sim 2.
      Não 9. Ignorado | OUTRO_EXP"

  OUT_EXP_DE:
    official_name: >
      Agentes de Exposição — Outro (Especificar)
    translated_name: >
      Occupational exposure — other agent, free text
    description: >
      Free-text (30-char) description of the exposure named when OUTRO_EXP = 1
      (Sim). Unstructured — the specific agent or exposure route is whatever the
      notifier typed, not a coded value.
    code_system: none
    source: layout_doc
    source_ref: >
      [CANC]
      http://www.portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf
      — "49. ... Outros (especificar) | ds_exp_outro | varchar2(30) | ...
      Habilitar se campo ... Outros=1(sim) | OUT_EXP_DE"; matching free-text pair
      confirmed on [ACBI]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "46. Tipo de exposição Outro (especificar) | ds_exp_outro | varchar2(30) |
      OUT_EXP_DE"
    depends_on: [OUTRO_EXP]

  DT_ATENDE:
    official_name: >
      Data do Atendimento
    translated_name: >
      Date of first medical care
    description: >
      Date the patient first received medical care for the notified condition,
      distinct from DT_NOTIFIC (when the case was reported) and DT_SIN_PRI
      (symptom onset). Confirmed with an identical field on the grave
      workplace-accident and typhoid-fever forms; the generic "Dados de
      Atendimento" complementary block reuses this field name across most agravo
      forms.
    code_system: none
    source: layout_doc
    source_ref: >
      [ACGR]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20Acidente%20Trabalho%20Grave/DIC_DADOS_DRT_Acidente_Trabalho_grave_v5.pdf
      — "59. Data do Atendimento | dt_atendimento | date | Campo Essencial
      Habilitar se campo 58 Ocorreu Atendimento Médico? =1(sim) | DT_ATENDE";
      matching item on [FTIF]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf
      — "40. Data do atendimento | dt_atendimento | date | Dd/mm/aaaa | Campo
      Obrigatório se campo 39 (Tipo de atendimento) = 1, 2 ou 3. Data do
      atendimento deve ser maior ou igual à Data de Primeiros Sintomas |
      DT_ATENDE"

  MUN_HOSP:
    official_name: >
      Município do Hospital
    translated_name: >
      Municipality of hospitalization
    description: >
      IBGE 6-digit code of the municipality where the patient was hospitalized for
      this case — distinct from the municipality of residence or of notification.
      Confirmed identically on the botulism and exogenous-poisoning forms; part of
      the generic hospitalisation block many agravo forms share.
    code_system: external
    codelists: [MUNICAC, MUNICAL, MUNICAM, MUNICAP, MUNICBA, MUNICBR]
    source: layout_doc
    source_ref: >
      [BOTU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf
      — "40. Município do Hospital | co_municipio_hospital | varchar(6) | Informe
      Nome do município onde o paciente foi internado | Campo essencial Habilitado
      se campo 36 (Ocorreu hospitalização) =1(sim) | MUN_HOSP"; matching item on
      [IEXO]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/iexog/DIC_DADOS_Intoxicacao_Exogena_v5.pdf
      — "63. Município de hospitalização | co_municipio_hospital | varchar2(6) |
      Informar o município do hospitalização Código do IBGE | MUN_HOSP"

  UF_HOSP:
    official_name: >
      UF do Hospital
    translated_name: >
      State (UF) of hospitalization
    description: >
      Two-letter/two-digit UF code of the state where the patient was hospitalized
      for this case, paired with MUN_HOSP.
    code_system: external
    source: layout_doc
    source_ref: >
      [BOTU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf
      — "39. UF de internação | co_uf_hospital | varchar(2) | Informe a sigla da
      UF onde o paciente foi internado | Campo essencial Habilitado se campo 36
      (Ocorreu hospitalização) =1(sim) | UF_HOSP"; matching item on [IEXO]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/iexog/DIC_DADOS_Intoxicacao_Exogena_v5.pdf
      — "62. UF | co_uf_hospital | varchar2(2) | Informar a UF do hospital |
      UF_HOSP"
    notes: >
      No codelist is bound to this column in the catalog even though it is plainly
      a UF code (paired one-for-one with MUN_HOSP, which is bound) — catalog gap,
      not an uncoded field.

  NM_MUNIC_H:
    official_name: >
      Município do Hospital (nome)
    translated_name: >
      Municipality of hospitalization, name field
    description: >
      Same referent as MUN_HOSP — the municipality where the patient was
      hospitalized — but on the cholera and accidental-tetanus forms this is the
      field's own DBF name rather than MUN_HOSP; both source documents describe it
      as an IBGE-coded field despite the "nome" (name) wording in the field label.
    code_system: external
    codelists: [MUNICAC, MUNICAL, MUNICAM, MUNICAP, MUNICBA, MUNICBR]
    source: layout_doc
    source_ref: >
      [COLE]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "48. Município do hospital | co_municipio_hospital | varchar(6) | Nome
      completo do município onde o paciente foi internado | NM_MUNIC_H"; matching
      item on [TETA]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf
      — "43. Município de hospitalização | co_municipio_hospital | varchar2(6) |
      Nome do município onde o paciente foi internado | NM_MUNIC_H"

  ATE_HOSPIT:
    official_name: >
      Ocorreu Hospitalização
    translated_name: >
      Hospitalization flag
    description: >
      Whether the patient was hospitalized because of the notified condition (1
      Sim, 2 Não, 9 Ignorado) — the gate that, when Sim, makes ATE_INTERN
      (admission date) and the rest of the hospitalisation block mandatory.
      Confirmed identically on the diphtheria and meningitis forms.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "42-Ocorreu Hospitalização | st_ocorreu_hospitalizacao | varchar(1) | 1-
      Sim 2- Não 9 Ignorado | Informa se o paciente foi internado devido ao agravo
      que está sendo notificado | ATE_HOSPIT"; matching item on [MENI]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      — "41. Ocorreu Hospitalização | st_ocorreu_hospitalizacao | varchar2(1) |
      1-sim 2-não 9-Ignorado | ATE_HOSPIT"
    depends_on: [ATE_INTERN]

  ATE_INTERN:
    official_name: >
      Data da Internação
    translated_name: >
      Hospital admission date
    description: >
      Date the patient was admitted to hospital for this case, filled only when
      ATE_HOSPIT = 1 (Sim); must be on or after the symptom-onset date.
    code_system: none
    source: layout_doc
    source_ref: >
      [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "43-Data da Internação | dt_internacao | date | Data de internação, caso
      tenha ocorrido | Campo Essencial se campo 42 (ocorreu
      hospitalização)=1(sim). Data de Internação deve ser maior ou igual à Data de
      Primeiros Sintomas | ATE_INTERN"; matching item on [MENI]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      — "42. Data da Internação | date | A Data da Internação deve ser maior ou
      igual à Data dos Primeiros Sintomas | ATE_INTERN"
    depends_on: [ATE_HOSPIT]

  DTALTA:
    official_name: >
      Data da Alta
    translated_name: >
      Hospital discharge date
    description: >
      Date the patient was discharged from hospital and returned home, filled only
      when hospitalization occurred; must be on or after the admission date.
    code_system: none
    source: layout_doc
    source_ref: >
      [BOTU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf
      — "38. Data da alta hospitalar | dt_alta | date | Data em que o paciente
      teve alta hospitalar e retornou ao domicílio | Campo essencial Habilitado se
      campo 36 (Ocorreu hospitalização) =1(sim). Data da alta hospitalar >= Data
      de Internação | DTALTA"; matching item on [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "38. Data da alta | dt_alta | date | dd/mm/aaaa | DTALTA"

  CLI_ESPECI:
    official_name: >
      Sinais e Sintomas / Complicações — Outros (Especificar)
    translated_name: >
      Other signs/symptoms or complications, free text
    description: >
      Free-text (30-char) elaboration paired with an "outro/outras" checkbox
      elsewhere on the form. The specific referent differs by agravo: on the
      diphtheria form it specifies an unlisted sign/symptom; on the meningitis
      form it specifies an unlisted complication. Content is unstructured and only
      meaningful alongside the checkbox that enables it.
    code_system: none
    source: layout_doc
    source_ref: >
      [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "40. Sinais e Sintomas (Outras: Especificar) | ds_sinais_outro |
      varchar2(30) | Especificação de outros sinais e/ou sintomas não listados na
      ficha | Habilitar se campo 40 – sinais e sintomas (outros) = 1 (sim) |
      CLI_ESPECI"; on the meningitis form the same DBF field is "41-Outras
      Complicações Especificar | ds_complicacao_outro | varchar(30) | Especifica
      outro tipo de complicação além das referidas acima | CLI_ESPECI"
    notes: >
      Do not merge across series naively: on DIFT files this is "other symptom",
      on MENI files it is "other complication" — different questions sharing one
      column name.

  OUTRO_ESP:
    official_name: >
      Sinais e Sintomas — Outros (Especificar)
    translated_name: >
      Other signs/symptoms, free text
    description: >
      Free-text (30-char) name of an unlisted sign/symptom, paired with a
      same-numbered "outros" Sim/Não checkbox. Confirmed with the identical
      referent (signs and symptoms, not complications) on both the acute-Chagas-
      disease and spotted-fever (febre maculosa) forms, unlike CLI_ESPECI which
      shifts meaning between forms.
    code_system: none
    source: layout_doc
    source_ref: >
      [CHAG]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      — "41. Sinais e sintomas OUTROS especificar | ds-sinal_outro | varchar (30)
      | Especificar qual outro sinais e sintomas | Campo Essencial se campo Sinais
      e sintomas OUTROS=1(sim) | OUTRO_ESP"; matching item on [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "33. Sinais e Sintomas Outros Especificar | ds_sinais_outro | varchar2(30)
      | Especificar outros sinais/sintomas | OUTRO_ESP"

  MUCOSA:
    official_name: >
      Mucosa
    translated_name: >
      Mucosal involvement flag
    description: >
      A Sim/Não(/Ignorado) flag whose referent depends on the agravo: on the
      biological-accident form (ACBI) it marks that the exposure route was mucosal
      (oral/ocular) contact with the biological material; on the human- rabies
      form (RAIV) it marks that the animal-bite wound's location was mucosal. Same
      code shape, unrelated clinical questions.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [ACBI]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "46. Tipo de exposição Mucosa (oral / ocular) | st_exp_mucosa |
      varchar2(1) | 1. Sim 2. Não 9. Ignorado | Campo Essencial | MUCOSA"; on the
      rabies form, [RAIV]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf
      — "34. Localização Mucosa | st_localizacao_mucosa | varchar(1) | 1. Sim 2.
      Não | Localização do ferimento | MUCOSA"
    notes: >
      Do not pool across series: "exposure route was mucosal" (ACBI) and "bite
      wound was on a mucosal surface" (RAIV) are different clinical facts that
      happen to share a column name and a binary code.

  CLI_KERNIG:
    official_name: >
      Sinais e Sintomas — Kernig/Brudzinski
    translated_name: >
      Kernig/Brudzinski sign
    description: >
      Whether the patient presented Kernig's and/or Brudzinski's sign (1 Sim, 2
      Não, 9 Ignorado) — the classic bedside tests for meningeal irritation, on
      the meningitis investigation form's signs-and-symptoms checklist.
    code_system: internal
    codelists: [AUSEPRES]
    source: layout_doc
    source_ref: >
      [MENI]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      — "40. Sinais e Sintomas (Kernig/ Brudzinski) | st_sinais_kenirg |
      varchar2(1) | 1-sim 2-não 9-Ignorado | informa se esta manifestação clínica
      ocorreu com o paciente | CLI_KERNIG"

  CLI_PETEQU:
    official_name: >
      Sinais e Sintomas — Petéquias/Sufusões Hemorrágicas
    translated_name: >
      Petechiae / hemorrhagic skin spots sign
    description: >
      Whether the patient presented petéquias (petechiae) or sufusões hemorrágicas
      — small hemorrhagic skin spots — (1 Sim, 2 Não, 9 Ignorado). Confirmed with
      the same referent on both the meningitis and hantavirosis signs-and-symptoms
      checklists, so it can be pooled safely across those two series.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [MENI]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      — "40. Sinais e Sintomas (Petéquias/ Sufusões Hemorrágicas) |
      st_sinais_petequias | varchar2(1) | 1-sim 2-não 9-Ignorado | CLI_PETEQU";
      matching item on [HANT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf
      — "36. Manifestações clínicas Petéquias (manchas de sangue sob a pele) |
      st_manifestacao_petequias | varchar2(1) | 1-Sim 2-Não 9-Ignorado |
      CLI_PETEQU"

  TRA_ANTIBI:
    official_name: >
      Tratamento com Antibiótico
    translated_name: >
      Antibiotic treatment flag
    description: >
      Whether the patient was treated with antibiotics for this case (1 Sim, 2
      Não, 9 Ignorado). Confirmed identically on the diphtheria and hantavirosis
      forms.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "52- Antibiótico | st_antibiotico | varchar(1) | 1. Sim 2. Não 9. Ignorado
      | Informa se o paciente foi tratado com antibiótico | TRA_ANTIBI"; matching
      item on [HANT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf
      — "52. Suporte Terapêutico Usou Antibióticos | st_terapeutico_antibiotico |
      varchar2(1) | 1-Sim 2-Não 9-Ignorado | TRA_ANTIBI"

  CONTATO:
    official_name: >
      Contato
    translated_name: >
      Contact-with-case / exposure-type flag
    description: >
      A field name reused for two unrelated questions with different value spaces:
      on the typhoid-fever form it is a 9-way location code for where the patient
      had contact with a similar suspected/confirmed case in the days before
      symptom onset (1 Domicilio ... 8 Sem historico de contato, 9 Ignorado); on
      the human-rabies form it is a plain Sim/Nao/Ignorado flag for "indirect
      contact" as one item of the type-of-exposure-to-the-virus checklist. Do not
      compare CONTATO values across FTIF and RAIV files.
    code_system: internal
    source: layout_doc
    source_ref: >
      [FTIF]
      https://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf
      — "33. Contato compatível com caso de febre tifóide (até 45 dias antes do
      início dos sinais e sintomas) | tp_contato_caso_febre | varchar2(1) | 1.
      Domicílio 2. Vizinhança 3. Trabalho 4. Creche/escola 5. Posto de
      saúde/hospital 6. Outro Estado/Município 7. Outros 8. Sem história de
      contato 9. Ignorado | CONTATO"; on the rabies form, [RAIV]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf
      — "33. Tipo de exposição ao vírus rábico Contato Indireto |
      st_exposicao_contato_indireto | varchar(1) | 1. Sim 2. Não 9. Ignorado |
      Forma de exposição ao vírus da raiva | CONTATO"
    notes: >
      Genuine cross-form collision, not a data-quality issue: width is C(1) in
      both series, but the code 1 means "household contact" in FTIF and "yes,
      indirect exposure" in RAIV. Treat CONTATO as two different columns that
      happen to share a name.

  FC_CONTATO:
    official_name: >
      Local do Contato
    translated_name: >
      Location of contact with a similar case
    description: >
      Where the patient had contact with a similar suspected/ confirmed case in
      the days before symptom onset (1 Domicilio, 2 Vizinhanca, 3 Trabalho, 4
      Creche/escola, 5 Posto de saude/hospital, 6 Outro Estado/Municipio, 7
      Outros, 8 Sem historico de contato, 9 Ignorado). Confirmed with the same
      9-way code on both the cholera and pertussis (coqueluche) forms — this is
      the same question CONTATO asks on the typhoid form, under a different DBF
      name.
    code_system: internal
    codelists: [LOCALCONCNET]
    source: layout_doc
    source_ref: >
      [COLE]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "33. Contato com caso suspeito ou confirmado de cólera (até 10 dias antes
      do início dos sinais e sintomas) | tp_contato_caso_suspeito | varchar(1) |
      1. Domicílio 2. Vizinhança 3. Trabalho 4. Creche/escola 5. Posto de
      saúde/hospital 6. Outro estado/município 7. Outros 8. Sem história de
      contato 9. Ignorado | FC_CONTATO"; matching item on [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "34. Contato Com Caso Suspeito Ou Confirmado De Coqueluche (Até 14 Dias
      Antes) | tp_contato_coqueluche | Varchar(1) | mesmas categorias |
      FC_CONTATO"

  MED_IDEN_C:
    official_name: >
      Realizada Identificação dos Comunicantes Íntimos
    translated_name: >
      Intimate/close contacts traced (flag)
    description: >
      Whether close ("intimate") contacts of the case were identified for contact
      tracing — household, daycare, school, barracks or similar settings that
      allow close contact (1 Sim, 2 Não, 9 Ignorado). Gates MED_QUAN_C and
      MED_CASO_S. Confirmed identically on the pertussis and diphtheria
      contact-tracing blocks.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "52. Realizada Identificação Dos Comunicantes Íntimos |
      st_identificacao_comunicante | varchar(1) | 1- Sim 2- Não 9. Ignorado |
      MED_IDEN_C"; matching item on [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "54-Realizada Identificação dos Comunicantes Íntimos |
      st_comunicante_intimo | varchar(1) | 1. Sim 2. Não 9. Ignorado | MED_IDEN_C"
    depends_on: [MED_QUAN_C, MED_CASO_S]

  MED_QUAN_C:
    official_name: >
      Se Sim, Quantos? (Comunicantes Íntimos)
    translated_name: >
      Number of intimate contacts identified
    description: >
      Count of close/"intimate" contacts identified, filled only when MED_IDEN_C =
      1 (Sim). A bare count, not a coded value.
    code_system: none
    source: layout_doc
    source_ref: >
      [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "53. Se Sim, Quantos? | qt_identificacao | numeric(3) | Número de
      comunicantes íntimos | MED_QUAN_C"; matching item on [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "55-Se Sim, Quantos? | qt_comunicante_intimo | numeric(3) | número de
      comunicantes íntimos identificados | MED_QUAN_C"
    depends_on: [MED_IDEN_C]

  MED_CASO_S:
    official_name: >
      Quantos Casos Secundários Foram Confirmados entre os Comunicantes
    translated_name: >
      Secondary cases confirmed among contacts
    description: >
      How many secondary cases were confirmed among the traced close contacts,
      filled only when MED_IDEN_C = 1 (Sim). Categorical on both source forms
      rather than a bare tally: the pertussis form codes it 0 Nenhum/1 Um/2 Dois
      ou mais, the diphtheria form 1 Nenhum/2 Um/3 Dois ou mais/9 Ignorado — the
      code-to-label mapping differs between the two series even though the
      underlying question is the same.
    code_system: internal
    codelists: [012IGN]
    source: layout_doc
    source_ref: >
      [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "54. Quantos Casos Secundários Foram Confirmados Entre Os Comunicantes |
      tp_caso_confirmado | varchar(1) | 0. Nenhum 1. Um 2. Dois ou mais |
      MED_CASO_S"; on the diphtheria form, [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "56-Quantos casos secundários foram confirmados entre os comunicantes |
      tp_comunicante_confirmado | varchar(1) | 1. Nenhum 2. Um 3. Dois ou mais 9.
      Ignorado | MED_CASO_S"
    depends_on: [MED_IDEN_C]
    notes: >
      The 0/1/2 vs 1/2/3/9 code offset between COQU and DIFT is a real
      cross-series trap for anyone decoding this column with one fixed lookup
      table.

  DT_ULT_DOS:
    official_name: >
      Data da Última Dose
    translated_name: >
      Date of last vaccine dose
    description: >
      Date of the last dose the patient received of the vaccine relevant to the
      notified condition — the DTP/DTP+Hib (tríplice/ tetravalente) vaccine on the
      pertussis form, the tetanus-toxoid- containing vaccine (DPT, DT, dT, Tetra)
      on the accidental-tetanus form. Same field shape (a bare date), different
      specific vaccine depending on the agravo.
    code_system: none
    source: layout_doc
    source_ref: >
      [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "38. Data Da Ultima Dose | dt_ultima_dose | date | Data da última dose da
      vacina tríplice (DTP) que o paciente recebeu | DT_ULT_DOS"; on the tetanus
      form, [TETA]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf
      — "36. Data da última dose | dt_ultima_dose | date | Data da última dose da
      vacina contra tétano (DPT,DT,dT,TT Tetra) | DT_ULT_DOS"

  CS_VOMITOS:
    official_name: >
      Sinais e Sintomas — Vômitos
    translated_name: >
      Vomiting sign
    description: >
      Whether the patient had vomiting (1 Sim, 2 Não, 9 Ignorado). Confirmed with
      the same referent on the cholera form (a core diarrheal- disease sign) and
      the pertussis form (post-cough vomiting specifically).
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [COLE]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "38. Sinais e Sintomas Vômitos | st_sinais_vomito | varchar(1) | 1-sim
      2-não 9-ignorado | O paciente teve vômitos | CS_VOMITOS"; on the pertussis
      form, [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "40. Sinais e Sintomas (Vômitos) | st_sinais_vomito | varchar(1) | 1- Sim
      2- Não 9 - Ignorado | Informa se o paciente apresentou vômitos pós-tosse |
      CS_VOMITOS"

  VACINA:
    official_name: >
      Situação Vacinal
    translated_name: >
      Vaccination status flag
    description: >
      Whether the patient had been vaccinated against the pathogen relevant to the
      exposure — hepatitis B, on the biological-accident form (status of the
      accidented worker's own hepatitis-B vaccination); or rotavirus, on the
      rotavirus-diarrhea form (whether the child had received the rotavirus
      vaccine). Same Sim/Não/Ignorado shape, different specific vaccine.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [ACBI]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "51. Situação vacinal do acidentado em relação a hepatite B (3 Doses) |
      st_situacao_vacinal | varchar2(1) | 1- Vacinado 2- Não vacinado 9 - Ignorado
      | VACINA"; on the rotavirus (ROTA) form, TAB_SINANNET dictionary: "36.
      Vacina contra Rotavírus | st_vacina_rotavirus | varchar2(1) | 1. Sim 2. Não
      9. Ignorado | O paciente recebeu a vacina contra rotavírus | VACINA"

  ISOLAMENTO:
    official_name: >
      Isolamento
    translated_name: >
      Isolation flag / isolation-test result
    description: >
      Two unrelated meanings under one name: on the spotted-fever (febre maculosa)
      form it is the RESULT of an agent-isolation laboratory test (1 Detectado, 2
      Não Detectado, 3 Não realizado); on the congenital- rubella-syndrome form it
      is whether the NEWBORN was kept in isolation in the maternity ward, an
      infection-control measure (1 Sim, 2 Não, 9 Ignorado). Do not treat "1" as
      the same fact across the two series.
    code_system: internal
    codelists: [RESULTADO1, SIM_NAO]
    source: layout_doc
    source_ref: >
      [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "45. Resultado Isolamento | tp_outro_exame_isolamento | varchar(1) | 1–
      Detectado 2- Não Detectado 3- Não realizado | Informar o Resultado o
      Isolamento | ISOLAMENTO"; on the SRC form, [SRC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "43. Isolamento de Recém-Nascido na Maternidade |
      st_isolamento_recem_nascido | varchar(1) | 1- Sim 2- Não 9- Ignorado |
      ISOLAMENTO"
    notes: >
      Genuine semantic collision: a laboratory result on FMAC files, an
      infection-control action on SRC files. Pooling ISOLAMENTO across series
      without checking which agravo the record belongs to will silently mix a lab
      finding with a ward-management decision.

  CS_RESULTA:
    official_name: >
      Resultado
    translated_name: >
      Test-result flag / virus-type result
    description: >
      Two unrelated code systems under one name: on the cholera form it is a
      binary lab-result flag (1 Positivo, 2 Negativo) for the stool/rectal-swab
      culture; on the congenital-rubella-syndrome (SRC) form it is a 4-way
      virus-type classification (1 Vírus rubéola selvagem, 2 Vírus rubéola
      vacinal, 3 Outros vírus, 4 Não detectado) from viral detection tests. Do not
      assume 1 = "positivo" across all SINAN series — on SRC files 1 means "wild
      rubella virus detected", not merely "positive".
    code_system: internal
    codelists: [POSNEGIG]
    source: layout_doc
    source_ref: >
      [COLE]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "54. Resultado | st_resultado | varchar(1) | 1. Positivo 2. Negativo |
      Informar se o exame foi positivo ou negativo | CS_RESULTA"; on the SRC form,
      [SRC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "41. Resultado | tp_resultado | varchar(1) | 1 - Vírus rubéola selvagem 2
      - Vírus rubéola vacinal 3 - Outros vírus 4 - Não detectado | CS_RESULTA"
    notes: >
      Genuine cross-series collision in the value space itself, not just the
      referent — code "1" carries a different meaning on COLE files than on SRC
      files. Never decode this column with a single fixed lookup table.

  CS_SANGUE:
    official_name: >
      Sangue
    translated_name: >
      Blood-related sign or specimen flag
    description: >
      A Sim/Não/Ignorado flag whose referent differs by agravo: on the cholera
      form it marks presence of blood in the patient's stool (a clinical sign); on
      the congenital-rubella-syndrome form it marks whether a whole-blood specimen
      was collected for viral detection (a laboratory-workflow fact, not a
      symptom). Same code shape, different kind of fact.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [COLE]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "42. Presença de sangue | st_presenca_sangue | varchar(1) | 1. Sim 2. Não
      9. Ignorado | Se há presença de sangue nas fezes do paciente | CS_SANGUE";
      on the SRC form, [SRC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "40. Detecção Viral Amostra Clínica - Sangue total |
      st_amostra_sangue_total | varchar(1) | 1- Sim 2- Não 9- Ignorado |
      CS_SANGUE"
    notes: >
      Do not read a "Sim" on an SRC file as a clinical sign — it means a blood
      sample was drawn for testing, not that the patient bled.

  CLI_PSEUDO:
    official_name: >
      Sinais e Sintomas — Pseudo
    translated_name: >
      Pseudomembrane / pseudoparalysis sign
    description: >
      Two different classic signs under one name: on the diphtheria form it marks
      presence of a pseudomembrane (the throat membrane diphtheria is named for);
      on the congenital-syphilis form it marks "pseudoparalisia" (Parrot's
      pseudoparalysis — painful periostitis that makes an infant hold a limb
      still, a classic congenital-syphilis sign). The congenital-syphilis source
      document explicitly confirms the DBF name is unchanged from the older
      SINAN-W system.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [DIFT]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "38-Sinais e Sintomas (Pseudomembrana) | st_sinais_pseudomenbrana |
      varchar(1) | 1. Sim 2. Não 9. Ignorado | Informa se o paciente apresentou
      pseudomembranas | CLI_PSEUDO"; on the congenital-syphilis form, [SIFC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf
      — "Presença de sinais e sintomas Pseudoparalisia | st_sinal_sintoma_pseudo |
      varchar2(1) | 1 sim 2. não 3. não se aplica 9. ignorado | Presença de
      \"paralisia\" antálgica, observada principalmente à manipulação da criança |
      NOME DA VARIÁVEL NO SINAN-W: CLI_PSEUDO. Manter o nome do SINAN-W."
    notes: >
      Pseudomembrana (diphtheria, a throat sign) and pseudoparalisia de Parrot
      (congenital syphilis, a limb sign) are clinically unrelated; pooling
      CLI_PSEUDO across DIFT and SIFC without checking the agravo conflates two
      different diseases' physical signs.

  FONTE:
    official_name: >
      Fonte/Mecanismo de Infecção
    translated_name: >
      Infection source/mechanism, or known-source flag
    description: >
      Two different columns share this name and even the same declared width
      pattern the catalog observed (1-char vs 2-char): on the viral-hepatitis form
      it is a 2-digit probable source/mechanism of infection code (1 Sexual, 2
      Transfusional, 3 Uso de Drogas, 4 Vertical, 5 Acidente de Trabalho, 6
      Hemodiálise, 7 Domiciliar, 8 Tratamento cirúrgico, 9 Tratamento dentário, 10
      Pessoa/pessoa, 11 Alimento/água contaminada, 12 Outros, 99 Ignorado); on the
      biological-accident form it is a 1-char Sim/Não/Ignorado flag for whether
      the source patient of the biological material is known. These are not
      compatible value spaces.
    code_system: internal
    codelists: [HEPFONTENET]
    source: layout_doc
    source_ref: >
      [HEPA]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Hepatite/DIC_DADOS_Hepatite_v5.pdf
      — "51. Provável Fonte/ Mecanismo de infecção | tp_provavel_infeccao |
      varchar2(2) | 1-Sexual 2-Transfusional 3-Uso de Drogas 4-Vertical 5-Acidente
      de Trabalho 6-Hemodiális 7-Domiciliar 8-Tratamento cirúrgico 9-Tratamento
      dentário 10-Pessoa/pessoa 11-Alimento/água contaminad 12-Outros 99-Ignorado
      | FONTE"; on the biological-accident form, [ACBI]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "53. Paciente fonte conhecida | st_dado_paciente | varchar2(1) | 1- Sim 2-
      Não 9- Ignorado | FONTE"
    notes: >
      The catalog's own header facts show FONTE declared as both C(1) and C(2)
      width across strata, which is the fingerprint of exactly this collision — a
      1-char Sim/Não flag on ACBI files, a 2-char mechanism code on HEPA files.
      Never decode FONTE with one lookup table.

  TIT_IGG_S1:
    official_name: >
      Resultado IFI/Sorologia — Título IgG, Amostra 1
    translated_name: >
      IgG serology titer/result, sample 1 (S1)
    description: >
      First-sample (S1) IgG serology result. On the acute-Chagas- disease form
      this is a CATEGORICAL result of the indirect immunofluorescence (IFI) test
      (1 reagente, 2 não-reagente, 3 inconclusivo, 4 não realizado); on the
      spotted-fever (febre maculosa) form it is the NUMERIC antibody titer itself
      (e.g. 1:80), filled only when the test was performed. Same field name,
      different kind of value — a code on CHAG files, a raw titer number on FMAC
      files.
    code_system: internal
    codelists: [TIT_IGG_S1]
    source: layout_doc
    source_ref: >
      [CHAG]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      — "50. EXAMES REALIZADOS Resultado da Imunofluorescência Indireta - IFI
      Título IgG S1 | tp_resultado_igg_s1 | varchar (5) | 1-reagente;
      2-não-reagente; 3-inconclusivo 4-não realizado | TIT_IGG_S1"; on the
      spotted-fever form, [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "43. Resultados sorologia S1 IgG títulos | nu_sorologia_igg_titulos1 |
      number(5) | Informar títulos da S1 IgG | Campo Essencial se campo Resultado
      sorologia S1 IgG for diferente de 4(não realizado) | TIT_IGG_S1"
    notes: >
      The catalog observes this column declared as both C(5) (CHAG, a categorical
      code string) and N(5) (FMAC, a numeric titer) — treat as two different
      columns sharing a name; casting to a single type across series will corrupt
      one of the two.

  TIT_IGG_S2:
    official_name: >
      Resultado IFI/Sorologia — Título IgG, Amostra 2
    translated_name: >
      IgG serology titer/result, sample 2 (S2)
    description: >
      Second-sample (S2) analogue of TIT_IGG_S1, taken later to check for
      seroconversion/rising titer between paired sera. Same CHAG-categorical-code
      vs FMAC-numeric-titer duality applies.
    code_system: internal
    codelists: [TIT_IGG_S2]
    source: layout_doc
    source_ref: >
      [CHAG]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      — "50. EXAMES REALIZADOS ... Título IgG S2 | ds_resultado_titulo_igg_s2 |
      varchar (5) | 1-reagente; 2-não-reagente; 3-inconclusivo 4-não realizado |
      TIT_IGG_S2"; on the spotted-fever form, [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "43.Resultados sorologia IGG S2 títulos | nu_sorologia_igg_titulos2 |
      number(5) | Informar títulos da S2 IgG | TIT_IGG_S2"
    depends_on: [TIT_IGG_S1]

  TIT_IGM_S1:
    official_name: >
      Resultado IFI/Sorologia — Título IgM, Amostra 1
    translated_name: >
      IgM serology titer/result, sample 1 (S1)
    description: >
      First-sample (S1) IgM serology result, the acute-phase antibody analogue of
      TIT_IGG_S1. Same categorical-code (CHAG) vs numeric-titer (FMAC) duality.
    code_system: internal
    codelists: [TIT_IGM_S1]
    source: layout_doc
    source_ref: >
      [CHAG]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      — "50. EXAMES REALIZADOS Resultado da Imunofluorescência Indireta - IFI
      Título IgM S1 | ds_resultado_titulo_igm_s1 | varchar (5) | 1-reagente;
      2-não-reagente; 3-inconclusivo 4-não realizado | TIT_IGM_S1"; on the
      spotted-fever form, [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "43. Resultados sorologia S1 IGM títulos | nu_sorologia_igm_titulos1 |
      varchar(5) | Informar títulos da S1 IgM | TIT_IGM_S1"

  TIT_IGM_S2:
    official_name: >
      Resultado IFI/Sorologia — Título IgM, Amostra 2
    translated_name: >
      IgM serology titer/result, sample 2 (S2)
    description: >
      Second-sample (S2) analogue of TIT_IGM_S1.
    code_system: internal
    codelists: [TIT_IGM_S2]
    source: layout_doc
    source_ref: >
      [CHAG]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      — "50. EXAMES REALIZADOS ... Título IgM S2 | ds_resultado_titulo_igm_s2 |
      varchar (5) | 1-reagente; 2-não-reagente; 3-inconclusivo 4-não realizado |
      TIT_IGM_S2"; on the spotted-fever form, [FMAC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "43. Resultados sorologia IgM S2 títulos | nu_sorologia_igm_titulos2 |
      number(5) | Informar títulos da S2 IgM | TIT_IGM_S2"
    depends_on: [TIT_IGM_S1]

  PESO:
    official_name: >
      Peso
    translated_name: >
      Weight (unit varies by form)
    description: >
      Patient weight, but on two different scales depending on the agravo: on the
      visceral-leishmaniasis form it is the patient's current body weight in
      KILOGRAMS (a 3-digit integer); on the congenital-rubella- syndrome form it
      is the newborn's BIRTH WEIGHT IN GRAMS. Reading this column with one fixed
      unit across series will be wrong by three orders of magnitude for one of the
      two.
    code_system: none
    source: layout_doc
    source_ref: >
      [LEIV]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf
      — "40. Peso | nu_peso | number(3) | Informar o peso do paciente em Kg |
      PESO"; on the SRC form, [SRC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "33. Peso ao nascer (em gramas) | nu_peso_nascido | Varchar2(5) | Peso ao
      nascer (em gramas) | PESO"
    notes: >
      Hard unit/scale trap: kilograms (adult/child body weight, LEIV) vs grams
      (newborn birth weight, SRC). Never aggregate PESO across series without
      checking which agravo produced the row.

  CS_LOCAL:
    official_name: >
      Local Provável da Fonte de Infecção
    translated_name: >
      Probable location of the source of infection
    description: >
      Where the infection was probably acquired, on the accidental-tetanus (TETA)
      form specifically: 1 Domicílio, 2 Trabalho, 3 Via pública, 4 Escola, 5
      Campo, 6 Unidade de saúde, 7 Outro local, 9 Ignorado. Cleared automatically
      when the case is discarded. This description is scoped to TETA — the same
      column name is also declared on the DTA/foodborne-outbreak form (SDTA) at a
      different width (2 or 8 characters there, versus 1 here), which this run did
      not verify and is almost certainly a different, wider field.
    code_system: internal
    codelists: [OCORRENCIA]
    source: layout_doc
    source_ref: >
      [TETA]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf
      — "46. Local provável da fonte de infecção | tp_local_infeccao | varchar2(1)
      | 1- Domicílio 2- Trabalho 3- Via pública 4- Escola 5- Campo 6- Unidade de
      saúde 7- Outro local 9- Ignorado | Campo Essencial se o campo Classificação
      final = 1 | CS_LOCAL"
    notes: >
      Scoped to the TETA series only. On SDTA (surto de doença transmitida por
      alimentos) files the catalog's own header facts show CS_LOCAL declared at
      width 2 and width 8, not 1 — a different, unverified field reusing this
      name. Do not apply this description to SDTA rows.

  CON_FHD:
    official_name: >
      Classificação/Conduta — Grau da FHD
    translated_name: >
      Dengue haemorrhagic fever (DHF) severity grade
    description: >
      WHO 1997 four-grade severity classification of Dengue Hemorrágico (Grau I
      through Grau IV), used on the legacy (pre-2014) Dengue investigation form
      alongside the individual hemorrhagic-sign flags (EPISTAXE, GENGIVO,
      HEMATURA, METRO, SANGRAM). Not present on the current combined
      Dengue/Chikungunya form, which replaced this WHO grading with the
      Dengue/Dengue com sinais de alarme/Dengue grave classification.
    code_system: internal
    codelists: [CON_FHD]
    source: def
    source_ref: >
      [DEF]
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field
      CON_FHD: value labels 1=Grau I, 2=Grau II, 3=Grau III, 4=Grau IV (legacy
      Dengue/DENG and Chikungunya/CHIK series only)

  EPISTAXE:
    official_name: >
      Sinais e Sintomas — Epistaxe
    translated_name: >
      Nosebleed (epistaxis) sign
    description: >
      Whether the patient had epistaxis (nosebleed), one of the legacy
      dengue-hemorrhagic-manifestations checklist items (1 Sim, 2 Não, 9
      Ignorado); see CON_FHD.
    code_system: internal
    codelists: [EPISTAXE]
    source: def
    source_ref: >
      [DEF]
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field
      EPISTAXE: value labels 1=Sim, 2=Não, 9=Ignorado

  GENGIVO:
    official_name: >
      Sinais e Sintomas — Gengivorragia
    translated_name: >
      Bleeding gums (gingivorrhagia) sign
    description: >
      Whether the patient had gengivorragia (bleeding gums), one of the legacy
      dengue-hemorrhagic-manifestations checklist items (1 Sim, 2 Não, 9
      Ignorado); see CON_FHD.
    code_system: internal
    codelists: [GENGIVO]
    source: def
    source_ref: >
      [DEF]
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field
      GENGIVO: value labels 1=Sim, 2=Não, 9=Ignorado

  HEMATURA:
    official_name: >
      Sinais e Sintomas — Hematúria
    translated_name: >
      Blood in urine (haematuria) sign
    description: >
      Whether the patient had hematúria (blood in the urine), one of the legacy
      dengue-hemorrhagic-manifestations checklist items (1 Sim, 2 Não, 9
      Ignorado); see CON_FHD.
    code_system: internal
    codelists: [HEMATURA]
    source: def
    source_ref: >
      [DEF]
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field
      HEMATURA: value labels 1=Sim, 2=Não, 9=Ignorado

  METRO:
    official_name: >
      Sinais e Sintomas — Metrorragia
    translated_name: >
      Abnormal uterine bleeding (metrorrhagia) sign
    description: >
      Whether the patient had metrorragia (abnormal/heavy uterine bleeding outside
      menstruation), one of the legacy dengue-hemorrhagic- manifestations
      checklist items (1 Sim, 2 Não, 9 Ignorado); see CON_FHD. The current
      combined Dengue/Chikungunya form keeps an analogous but separately-named
      severity item ("Dengue grave — Metrorragia volumosa", DBF GRAV_METRO) — do
      not conflate GRAV_METRO with this legacy METRO column; they are different
      DBF fields on different form generations.
    code_system: internal
    codelists: [METRO]
    source: def
    source_ref: >
      [DEF]
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field
      METRO: value labels 1=Sim, 2=Não, 9=Ignorado

  SANGRAM:
    official_name: >
      Sinais e Sintomas — Sangramento
    translated_name: >
      Bleeding (generic) sign
    description: >
      Whether the patient had any bleeding manifestation not broken out into its
      own item, the catch-all of the legacy dengue- hemorrhagic-manifestations
      checklist (1 Sim, 2 Não, 9 Ignorado); see CON_FHD.
    code_system: internal
    codelists: [SANGRAM]
    source: def
    source_ref: >
      [DEF]
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field
      SANGRAM: value labels 1=Sim, 2=Não, 9=Ignorado

  PLAQ_MENOR:
    official_name: >
      Menor Contagem de Plaquetas
    translated_name: >
      Lowest platelet count observed
    description: >
      The lowest platelet count recorded during the illness episode, part of the
      same legacy dengue-hemorrhagic monitoring block as CON_FHD/SANGRAM/HEMATURA
      (PLAQ = plaqueta, MENOR = lowest/minimum). No dictionary entry or observed
      value confirms an exact unit or format.
    code_system: none
    source: inferred
    reasoning: >
      PLAQ_/MENOR is a standard DATASUS abbreviation pair (plaqueta, menor) and
      the field sits alongside CON_FHD, SANGRAM, HEMATURA, EPISTAXE and GENGIVO in
      the same DENG/CHIK legacy hemorrhagic block confirmed via TAB_SINANNET;
      platelet-count nadir is exactly the lab value that classic WHO
      dengue-hemorrhagic-fever monitoring tracks. No layout document or dictionary
      label was found for this specific field, so the reading rests on name and
      context, not a verbatim source.
    notes: >
      The catalog's own header facts show this column declared inconsistently
      across strata — C(6), C(7) and one outlier N(18,9) — with no observed values
      sampled. Treat any parse of this column as low- confidence; the type
      inconsistency itself suggests messy legacy data entry (a free-text lab value
      field, not a clean numeric column).

  ANT_TRASMI:
    official_name: >
      32. Transmissão Vertical
    translated_name: >
      Probable transmission: vertical (mother-to-child)
    description: >
      Whether vertical (mother-to-child) transmission is the probable mode of HIV
      acquisition for this adult case (1 Sim, 2 Não foi transmissão vertical, 9
      Ignorado). Part of the mutually-exclusive exposure-category block (with
      ANTRELSE_N/sexual, ANTTRANS_M/transfusion, ANT_DROGA/drug use,
      ANT_HEMOLF/hemophilia treatment) that ANT_REL_CA computes a hierarchy code
      from. A "Sim" for a patient born on or before 1980 (Brazil's first notified
      AIDS case) triggers a confirmation warning in the SINAN NET application.
    code_system: internal
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "32. Transmissão Vertical | st_transmissao_vertical | varchar(1) | 1 – Sim
      2 – Não foi transmissão vertical 9 – Ignorado | Provável modo de transmissão
      do HIV: de mãe para filho | Campo Obrigatório. Aceitar apenas códigos
      listados | ANT_TRASMI"
    notes: >
      No codelist is bound to this column in the catalog despite the confirmed
      1/2/9 value set — catalog gap, not evidence of free text.

  ANTRELSE_N:
    official_name: >
      33. Sexual
    translated_name: >
      Probable transmission: sexual, with partner-sex category
    description: >
      Probable mode of HIV transmission via sexual contact, coding five mutually
      exclusive categories that also record the partner's sex relative to the
      patient: 1 Relações sexuais com Homens, 2 com Mulheres, 3 com homens e
      mulheres, 4 Não foi transmissão sexual, 9 Ignorado. If the patient is female
      and category 2 is marked, the SINAN NET application raises an alert (a
      same-sex/female-female transmission flag is unusual enough to prompt
      double-checking the notification).
    code_system: internal
    codelists: [ANTRELN]
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "33. Sexual | tp_sexual | varchar(1) | 1 – Relações sexuais com Homens 2 –
      Relações sexuais com Mulheres 3 – Relações sexuais com homens e mulheres 4 –
      Não foi transmissão sexual 9 – Ignorado | Provável modo de transmissão do
      HIV: sexual | ANTRELSE_N"

  ANTTRANS_M:
    official_name: >
      34. Sanguínea — Transfusão Sanguínea
    translated_name: >
      Probable transmission: blood transfusion
    description: >
      Whether blood transfusion is a probable mode of HIV transmission for this
      adult case (1 Sim, 2 Não, 9 Ignorado). A "Sim" makes the transfusion event
      date, UF and municipality fields mandatory elsewhere on the form.
    code_system: internal
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "34. Sanguínea Transfusão sanguínea | st_sanguinea_transfusao | varchar(1)
      | 1 – Sim 2 – Não 9 – Ignorado | Provável modo de transmissão: transfusão
      sanguínea | Campo Obrigatório. Se campo = 1 o sistema deve exigir a
      obrigatoriedade do preenchimento do campo (Data do evento), (UF de
      transfusão), (Município onde foi realizada transfusão) | ANTTRANS_M"
    notes: >
      No codelist is bound to this column in the catalog despite the confirmed
      1/2/9 value set — catalog gap.

  ANT_HEMOLF:
    official_name: >
      34. Sanguínea — Tratamento/Hemotransfusão para Hemofilia
    translated_name: >
      Probable transmission: haemophilia treatment/transfusion
    description: >
      Whether treatment for haemophilia (including the blood products it requires)
      is a probable mode of HIV transmission for this adult case (1 Sim, 2 Não, 9
      Ignorado). Auto-filled with 2 (Não) when the patient's sex is female, since
      haemophilia is essentially X-linked and overwhelmingly affects males.
    code_system: internal
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "34. Sanguínea Tratamento/hemotransfusão para hemofilia |
      st_sanguinea_hemofilia | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado |
      Provável modo de transmissão do HIV: tratamento para
      hemofilia/hemotransfusão | Campo Obrigatório. Quando paciente do sexo
      feminino, preencher automaticamente com a categoria 2 (não) | ANT_HEMOLF"
    notes: >
      No codelist is bound to this column in the catalog despite the confirmed
      1/2/9 value set — catalog gap.

  ANT_REL_CA:
    official_name: >
      Categoria de Exposição (Campo Interno)
    translated_name: >
      Computed HIV-exposure category
    description: >
      System-computed classification of how the adult patient probably acquired
      HIV, assigned automatically from the answers to ANTRELSE_N (sexual),
      ANTTRANS_M (transfusion), ANT_DROGA (injecting drug use) and ANT_HEMOLF
      (haemophilia treatment) by a fixed hierarchy — not entered directly. Coded
      e.g. 10 Homossexual, 20 Bissexual, 30 Heterossexual, with sub-codes
      combining these with drug use, haemophilia or transfusion history (e.g. 21
      Bi/Drogas, 33 Hetero/Transfusão).
    code_system: internal
    codelists: [CATHIERN, CLASCATN]
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "Categoria de exposição (Campo interno) | tp_categoria_exposição |
      varchar(2) | 10-Homossexual 11-Homo/Drogas 12-Homo/Hemofilico
      13-Homo/transfusão 14-Homo/Droga/Hemof 15-Homo/Droga/Transf 20-Bissexual
      21-Bi/Drogas 22-Bi/Hemofílico 23-Bi/Transfusão 24-Bi/Droga/Hemofílico
      25-Bi/Droga/Transfusão 30-Heterossexual 31-Hetero/Droga 32-Hetero/Hemofílico
      33-Hetero/Transfusão 34-Hetero/Droga/Hemofílico | O sistema atribui à
      categoria de acordo com dados e hierarquia de outros campos relacionados |
      ANT_REL_CA"
    depends_on: [ANTRELSE_N, ANTTRANS_M]

  ANT_SARCOM:
    official_name: >
      41. Critério Rio de Janeiro/Caracas — Sarcoma de Kaposi (10 pts)
    translated_name: >
      RJ/Caracas criterion: Kaposi's sarcoma
    description: >
      One item of the Rio de Janeiro/Caracas expanded adult-AIDS case-definition
      score: whether the patient had Kaposi's sarcoma (1 Sim, 2 Não, 9 Ignorado),
      worth 10 of the points toward that case definition.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      [AIDS-AD]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Sarcoma de Kaposi (10) | st_sarcoma |
      varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Sarcoma de Kaposi Pontuação (10)
      | Campo Obrigatório Aceitar apenas códigos listados | ANT_SARCOM"

  ANT_TUBERC:
    official_name: >
      41. RJ/Caracas — Tuberculose Disseminada/Extrapulmonar/Não Cavitária (10
      pts)
    translated_name: >
      RJ/Caracas criterion: disseminated/extrapulmonary TB
    description: >
      RJ/Caracas score item: disseminated, extra-pulmonary or non-cavitary
