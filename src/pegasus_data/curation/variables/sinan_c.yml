  ANT_PULMON:
    official_name: >
      41. RJ/Caracas — Tuberculose Pulmonar Cavitária ou Não Especificada (5 pts)
    translated_name: >
      RJ/Caracas criterion: cavitary/unspecified pulmonary TB
    description: >
      RJ/Caracas score item: cavitary or unspecified pulmonary tuberculosis (1
      Sim, 2 Não, 9 Ignorado), worth 5 points. Distinct from ANT_PULM_N, a
