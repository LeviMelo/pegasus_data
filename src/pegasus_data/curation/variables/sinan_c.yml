      — "41. Critério Rio de Janeiro/Caracas Tuberculose pulmonar cavitária ou não
      especificada (5) | st_tuberculose_pulmonar | varchar(1) | 1 – Sim 2 – Não 9
      – Ignorado | Pontuação | ANT_PULMON"

  ANT_HERPES:
    official_name: >
      41. RJ/Caracas — Herpes Zoster em Indivíduo ≤60 Anos (5 pts)
    translated_name: >
      RJ/Caracas criterion: herpes zoster, age ≤60
    description: >
