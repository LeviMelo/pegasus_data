system: SINAN
asserted_by: pegasus_data
variables:
  MANI_HEMOR:
    official_name: Manifestações Hemorrágicas
    translated_name: Hemorrhagic manifestations
    description: >
      Whether the patient showed bleeding signs such as petechiae, gum
      bleeding, or epistaxis during the dengue/chikungunya illness: 1 Sim, 2
      Não, 9 Ignorado; a warning sign used in dengue severity classification.
    code_system: internal
    source: web
    source_ref: >
      github.com/rfsaldanha/microdatasus, R/process_sinan_chikungunya.R,
      field MANI_HEMOR
  NM_OUT_SIN:
    official_name: Outros Sinais e Sintomas (Especificar)
    translated_name: Other sign/symptom, specify
    description: >
      Free-text description of a sign or symptom the patient had that is not
      on the checklist, filled in only when the "other symptoms" checkbox
      above it is marked yes.
    code_system: none
    source: layout_doc
    source_ref: >
      saude.df.gov.br DICIONARIO_DADOS_Coqueluche.pdf (Sinan NET v5.0,
      Agravo: Coqueluche), campo 40 "Outros Sinais e Sintomas (Especificar)"
  PLASMATICO:
    official_name: Extravasamento Plasmático
    translated_name: Plasma leakage
    description: >
      Whether clinical or lab evidence of plasma leakage (hemoconcentration,
      pleural effusion, ascites) was present, a marker of vascular
      permeability used to flag severe dengue: 1 Sim, 2 Não, 9 Ignorado.
    code_system: internal
    source: web
    source_ref: >
      github.com/rfsaldanha/microdatasus, R/process_sinan_chikungunya.R,
      field PLASMATICO
  RESUL_NS1:
    official_name: Exame NS1 - Resultado
    translated_name: NS1 antigen test result
    description: >
      Result of the dengue NS1 antigen ELISA test drawn during the acute
      illness: 1 Positivo, 2 Negativo, 3 Inconclusivo, 4 Não realizado.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 42
  RESUL_PCR_:
    official_name: RT-PCR - Resultado
    translated_name: RT-PCR result
    description: >
      Result of the RT-PCR molecular test for dengue or chikungunya virus
      RNA: 1 Positivo, 2 Negativo, 3 Inconclusivo, 4 Não realizado.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 46
  RESUL_SORO:
    official_name: Exame Sorológico (IgM) Dengue - Resultado
    translated_name: Dengue IgM serology result
    description: >
      Result of the IgM antibody serology test for dengue, run on a blood
      sample collected during the illness: 1 Reagente, 2 Não Reagente, 3
      Inconclusivo, 4 Não realizado.
    code_system: internal
    codelists: [RESULTADO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 40
  RESUL_VI_N:
    official_name: Isolamento Viral - Resultado
    translated_name: Viral isolation result
    description: >
      Result of viral culture/isolation attempted from a blood sample, used
      to confirm active dengue or chikungunya infection: 1 Positivo, 2
      Negativo, 3 Inconclusivo, 4 Não realizado.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 43
  SOROTIPO:
    official_name: Sorotipo
    translated_name: Dengue serotype
    description: >
      Which dengue virus serotype (DEN 1-4) was identified by viral
      isolation or RT-PCR; filled in only when one of those two tests comes
      back positive.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 47
  CON_INF_MU:
    official_name: Município provável de infecção (nome de campo legado)
    translated_name: Probable municipality of infection
    description: >
      IBGE code of the municipality where the patient was probably
      infected, filled only when that differs from the residence
      municipality; the pre-2007 field name for what later became COMUNINF.
    code_system: external
    source: inferred
    reasoning: >
      CON_INF_MU/CON_INF_UF appear only in 2000-2006 records of CHAG, DENG,
      LEIV, LEPT and MALA, diseases where SINAN tracks probable place of
      infection apart from residence. The 2012 Hantavirose dictionary
      documents the surviving version of this concept (campos 57-59,
      COUFINF/COMUNINF = "UF/Município provável da fonte de infecção");
      CON_INF_MU/UF are the retired pre-2007 names for the same pair,
      dropped when SINAN NET standardized field naming.
    asserted_by: pegasus_data
  CON_INF_UF:
    official_name: UF provável de infecção (nome de campo legado)
    translated_name: Probable state of infection
    description: >
      UF sigla of the state where the patient was probably infected,
      recorded when infection did not occur in the residence municipality;
      the pre-2007 field name for what later became COUFINF.
    code_system: external
    source: inferred
    reasoning: >
      Same evidence as CON_INF_MU: paired UF/município fields appearing
      only in 2000-2006 CHAG/DENG/LEIV/LEPT/MALA records, predating the
      COUFINF/COMUNINF pair documented in the 2012 Hantavirose dictionary
      for the identical "provável fonte de infecção" concept.
    asserted_by: pegasus_data
  ANT_CONTAT:
    official_name: Tratamento anti-rábico anterior
    translated_name: Prior antirabic treatment
    description: >
      Whether the patient had already undergone rabies post-exposure
      treatment before this attendance: Sim/Não/Ignorado. In pre-2007
      Hantavirose records the same field name carried a related question
      before the forms diverged.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Atendimento%20Anti-rabico/anti_rabico_v5_instr.pdf,
      campo 37
  DT_NASC:
    official_name: Data de Nascimento
    translated_name: Date of birth
    description: >
      Patient's full date of birth as recorded on the notification form,
      used to compute age when the age field itself is left blank.
    code_system: none
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/Hantavirose_v5_instr.pdf,
      campo 9 (shared "Notificação Individual" block used across SINAN NET
      forms)
  CLI_ABDOMI:
    official_name: Manifestações clínicas - Dor Abdominal
    translated_name: Abdominal pain
    description: >
      Whether the hantavirus-suspect patient reported abdominal pain, one
      item on the clinical-signs checklist: 1 Sim, 2 Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Dor Abdominal"
  CLI_DISPNE:
    official_name: Manifestações clínicas - Dispnéia
    translated_name: Dyspnea
    description: >
      Whether the patient had dyspnea (difficulty breathing) at
      presentation, one of the checklist signs used to flag hantavirus
      cardiopulmonary syndrome: 1 Sim, 2 Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Dispnéia"
  CLI_H_DESC:
    official_name: Outras manifestações Hemorrágicas (especificar)
    translated_name: Other hemorrhagic manifestation, specify
    description: >
      Free-text description of the bleeding manifestation the patient
      showed, filled in only when the "other hemorrhagic manifestations"
      checkbox above it is marked yes.
    code_system: none
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 (DBF ds_manifestacao_hemor_outro)
  CLI_NEUROL:
    official_name: Manifestações clínicas - Sintomas Neurológicos
    translated_name: Neurological symptoms
    description: >
      Whether the patient presented neurological symptoms, one item in the
      hantavirus clinical-signs checklist: 1 Sim, 2 Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Sintomas Neurológicos"
  CLI_OUT_D:
    official_name: Manifestações clínicas / Outros (especificar)
    translated_name: Other clinical manifestation, specify
    description: >
      Free-text description of an additional clinical manifestation the
      patient had that is not covered by the named checklist items, enabled
      only when that "other" flag is Sim.
    code_system: none
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 (DBF ds_manifestacao_outro)
  CLI_TONTUR:
    official_name: Manifestações clínicas - Tontura/Vertigem
    translated_name: Dizziness/vertigo
    description: >
      Whether the patient experienced dizziness or vertigo, one of the
      checklist signs recorded for a suspected hantavirus case: 1 Sim, 2
      Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Tontura/Vertigem"
  CLI_TORACI:
    official_name: Manifestações clínicas - Dor Torácica
    translated_name: Chest pain
    description: >
      Whether the patient reported chest pain among the checklist of
      clinical signs used to work up a suspected hantavirus case: 1 Sim, 2
      Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Dor Torácica"
  CLI_TOSSE:
    official_name: Manifestações clínicas - Tosse Seca
    translated_name: Dry cough
    description: >
      Whether the patient had a dry cough, one of the earliest clinical
      signs checked for suspected hantavirus cardiopulmonary syndrome: 1
      Sim, 2 Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Tosse Seca"
  CON_AUTOPS:
    official_name: Se óbito, realizou autópsia
    translated_name: Autopsy performed
    description: >
      Whether an autopsy was performed, asked only when the case's outcome
      field records death from hantavirus or from another cause: 1 Sim, 2
      Não, 9 Ignorado.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 67 "Se óbito, realizou autópsia"
  DOSES:
    official_name: Número de doses de vacina anti-rábica recebidas no tratamento anterior
    translated_name: Prior rabies vaccine doses
    description: >
      Total number of anti-rabies vaccine doses the patient already
      received in an earlier post-exposure treatment course, asked only
      when ANT_CONTAT records that a prior treatment happened.
    code_system: none
    depends_on: [ANT_CONTAT]
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Atendimento%20Anti-rabico/anti_rabico_v5_instr.pdf,
      campo 39
  LAB_ATIPIC:
    official_name: Resultado A - Linfócitos Atípicos
    translated_name: Atypical lymphocytes result
    description: >
      Whether atypical lymphocytes were seen on the blood exam drawn for a
      suspected hantavirus case: 1 Sim, 2 Não, 3 Não realizado, 9 Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 38 "Linfócitos Atípicos"
  LAB_IGM_R:
    official_name: Resultado IgM
    translated_name: IgM serology result
    description: >
      Result of the hantavirus IgM antibody serology test on blood
      collected after symptom onset: 1 reagente, 2 não reagente, 3
      inconclusivo, 4 não realizado.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 43 "Resultado IgM"
  LAB_TROMBO:
    official_name: Resultado A - Trombocitopenia
    translated_name: Thrombocytopenia result
    description: >
      Whether the blood exam showed thrombocytopenia (a low platelet
      count), a lab finding checked for suspected hantavirus cardiopulmonary
      syndrome: 1 Sim, 2 Não, 3 Não realizado, 9 Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: >
      portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 38 "Trombocitopenia"
