# SIHSUS — remaining columns (batch: files-descending, offset 0, limit 60; catalog
# returned 43 undocumented columns in that range).
#
# sihsus_rd.yml already covers the core RD (Reduzida) billing columns (N_AIH,
# DIAG_PRINC, IDADE, SEXO, MUNIC_RES, MUNIC_MOV, CNES, DT_INTER, DT_SAIDA,
# VAL_TOT, ...). This batch is everything else the catalog surfaced: control/
# processing fields, the RJ (rejeitadas) and ER (Motivo de Erro) rejection
# files, the SP (Serviços Profissionais) file, an early-1990s Real/US-dollar
# value split inside RD itself, a CH (hospital-registry) snapshot, and a
# 1995–1997 professional-acts table (file prefix "MT" in this catalog — NOT
# verified as either a distinct SIH file type or the state Mato Grosso; left
# unresolved, see notes on that cluster below).
#
# Provenance shorthand used in source_ref below:
#   [DEF-RD9297]   the catalog's def_variables binding for this field, drawn from
#                  RD.DEF / RJ.DEF inside
#                  /dissemin/publicos/SIHSUS/199201_200712/Auxiliar/TAB_SIH_199201-199712.zip
#                  (also re-shipped verbatim under .../200801_/Auxiliar/ with the same
#                  filenames)
#   [DEF-RD2008]   RD2008.DEF / RJ2008.DEF inside
#                  /dissemin/publicos/SIHSUS/200801_/Auxiliar/TAB_SIH.zip
#   [DEF-MOTERRO]  Motivo_de_Erro.DEF inside
#                  /dissemin/publicos/SIHSUS/200801_/Auxiliar/TAB_SIH.zip — the ER
#                  ("Motivo de Erro") file's own .DEF, confirming ER = rejected-by-
#                  validation-error records
#   [DEF-SP]       "Servico Profissional SP.def" / "...SPXX.def" inside
#                  /dissemin/publicos/SIHSUS/200801_/Auxiliar/TAB_SIH_200308-200712.zip —
#                  the SP ("Serviços Profissionais") file's own .DEF
#   [DEF-AIHMA]    AIH_MA.DEF inside
#                  /dissemin/publicos/SIHSUS/199201_200712/Auxiliar/TAB_SIH_199201-199712.zip
#   [GEOCOD-AIH]   CEBRAP/CEM, "Dicionário da Base de Dados Geocodificados AIH – SUS
#                  2000–2001–2002–2003, Região Metropolitana de São Paulo"
#                  https://centrodametropole.fflch.usp.br/en/file/16304/download?token=Vu7TK488
#                  — an independently published field dictionary for the RD(SP) file,
#                  cited here for fields the SIHSUS .DEF files in this tree do not name
#                  (COD_ARQ, GESTAO's exact code labels, and the VAL_*/US_TOT pairing
#                  used to reason about the US_* columns below)
system: SIHSUS
asserted_by: pegasus_data
variables:

  # ------------------------------------------------------- processing period

  MES_CMPT:
    official_name: Mês processamento
    translated_name: Processing month (competência)
    description: >
      Two-digit month (01–12) of the "competência" — the billing/processing period
      this AIH was settled under. For a stay that crosses a month boundary it
      reflects the hospital's payment cycle, not necessarily the calendar month
      the patient was actually admitted or discharged.
    code_system: none
    codelists: [MESES]
    source: def
    source_ref: >
      [DEF-RD9297]/[DEF-RD2008] display_name "Mês processamento" for MES_CMPT;
      labelled with the twelve month names via MESES.CNV.
    notes: >
      A time series built from MES_CMPT counts billing/payment activity, not
      admission activity — use the admission-date column (DT_INTER, documented in
      sihsus_rd.yml) for the latter.

  # ------------------------------------------------------------ management type

  GESTAO:
    official_name: Gestão
    translated_name: Type of health-system management
    description: >
      Which sphere of government held "gestão plena" (full management authority)
      over the SUS network that processed this AIH at the time of billing:
      0 Estadual, 1 Municipal plena, 2 Estadual plena. Describes the administrative
      arrangement the payer operated under, not the hospital's own ownership.
    code_system: internal
    codelists: [GESTAO]
    source: web
    source_ref: >
      [GEOCOD-AIH] p.7: "GESTÃO - Indica o tipo de gestão do hospital: 0 = Gestão
      estadual; 1 = Gestão plena municipal; 2 = Gestão plena estadual" — matches the
      catalog's own GESTAO codelist labels exactly ('2' Estadual plena, '0' Estadual,
      '1' Municipal plena assist).
    notes: >
      SEMIPLEN (below) carries this same concept for 1995–1997 records under the
      older "gestão semi-plena" era name; the two are not automatically the same
      code space across that boundary even though SEMIPLEN is bound to the GESTAO
      codelist too.

  SEMIPLEN:
    official_name: Gestão (95-97)
    translated_name: Management type (1995–1997 predecessor of GESTAO)
    description: >
      Predecessor of GESTAO, present only in 1995–1997 files and bound to the same
      GESTAO codelist ('0' Estadual is the only value observed in this batch).
      DATASUS's own .DEF label for this column is literally "Gestão (95-97)" — the
      field was renamed GESTAO from 1998 on.
    code_system: internal
    codelists: [GESTAO]
    source: def
    source_ref: >
      [DEF-RD9297] display_name "Gestão (95-97)" for SEMIPLEN, lookup GESTAO.CNV —
      the same CNV bound to GESTAO itself.
    vintage_note: >
      1995–1997 only. GESTAO is the field carrying this concept for every other
      year in this tree; a management-type series spanning 1995–1997 has to read
      SEMIPLEN for those years, not GESTAO.
    notes: >
      The name echoes "gestão semi-plena," the transitional SUS management category
      used before NOB-96's fuller "gestão plena" framework — but because the bound
      codelist is GESTAO's own 0/1/2 table, treat the values as GESTAO's three
      categories rather than assume a distinct semi-plena-specific code space.

  # --------------------------------------------- RJ (rejeitadas / rejected AIH)

  ST_BLOQ:
    official_name: Situação bloqueio
    translated_name: AIH block status
    description: >
      Whether this AIH, in the RJ (rejeitadas) file, is under an administrative
      block: 0 AIH autorizada, 2 Bloqueio AIH, 5 Liberação bloqueio AIH. The flag
      that ST_MOT_BLO then gives a reason for.
    code_system: internal
    codelists: [SITBLOQUEIO]
    source: def
    source_ref: >
      [DEF-RD9297]/[DEF-RD2008] (RJ.DEF/RJ2008.DEF) display_name "Situação
      bloqueio", lookup SITBLOQUEIO.CNV.
    notes: >
      Present only in RJ — a record only carries this field once it has already
      failed to pass straight through to payment.

  ST_MOT_BLO:
    official_name: Motivo bloqueio
    translated_name: Reason for the AIH block
    description: >
      DATASUS's numeric reason code for why ST_BLOQ shows this AIH blocked — a
      long enumerated list mixing audit holds ("PARA AUDITORIA NO PRONTUÁRIO"),
      duplicate-billing holds ("DUPL.INTERNAÇÃO C/INTERSERCÇÃO DE PERÍODOS") and
      unexplained holds.
    code_system: internal
    codelists: [MOTBLOQUEIO]
    depends_on: [ST_BLOQ]
    source: def
    source_ref: >
      [DEF-RD9297]/[DEF-RD2008] (RJ.DEF/RJ2008.DEF) display_name "Motivo
      bloqueio", lookup MOTBLOQUEIO.CNV.
    notes: >
      "NÃO ESPECIFICADO" (code 00) is itself the single most common value observed
      — this column under-explains more often than it explains.

  ST_SITUAC:
    official_name: Situação rejeição
    translated_name: Rejection status
    description: >
      Flags that this AIH was rejected during processing. The only value observed
      in this batch, 1 "AIH rejeitada", is consistent with every row of the RJ
      file being a rejection by construction.
    code_system: internal
    codelists: [SITREJEICAO]
    source: def
    source_ref: >
      [DEF-RD9297]/[DEF-RD2008] (RJ.DEF/RJ2008.DEF) display_name "Situação
      rejeição", lookup SITREJEICAO.CNV.
    notes: >
      Near-constant within RJ, since every row there is already a rejection; it
      likely exists to distinguish rejection from other statuses in a record
      layout shared with other files rather than to carry information on its own.

  # -------------------------------------------------- ER (Motivo de Erro file)

  AIH:
    translated_name: AIH number (error file)
    description: >
      The AIH billing-authorisation number the ER (Motivo de Erro) record reports
      an error against — the same identifier documented as N_AIH in the RD series
      (sihsus_rd.yml), carried here so an errored record can be traced to its AIH.
    code_system: none
    source: inferred
    reasoning: >
      No .DEF binds a display name to this column, but its 13-digit values match
      the AIH numbering already documented for N_AIH, and it sits in a file whose
      other columns (ANO, MES, CO_ERRO below) route through [DEF-MOTERRO] — an
      AIH-number column is exactly what a per-error record needs to identify which
      admission the error is about.
    notes: >
      Do not assume this joins 1:1 to N_AIH in RD — an AIH that errored out may
      never reach RD.

  ANO:
    official_name: Ano processamento
    translated_name: Processing year (error file)
    description: Four-digit year of the processing/competência period this ER record belongs to, paired with MES.
    code_system: none
    codelists: [ANO, ANOMES, ANOMESC]
    source: def
    source_ref: >
      [DEF-MOTERRO] display_name "Ano processamento" for ANO; also bound as
      "Ano/Mês processamento" via ANOMES.CNV/ANOMESC.CNV.

  MES:
    official_name: Mês processamento
    translated_name: Processing month (error file)
    description: Two-digit month of the processing/competência period; ER's equivalent of MES_CMPT in RD/RJ.
    code_system: none
    codelists: [MESES]
    source: def
    source_ref: >
      [DEF-MOTERRO] display_name "Mês processamento" for MES, lookup MESES.CNV.

  CO_ERRO:
    official_name: Motivo da Rejeição
    translated_name: Rejection/error reason code
    description: >
      DATASUS's numeric code for why this AIH failed processing critique — a large
      enumerated list, e.g. 060109 "PROFISSIONAL NÃO VINCULADO AO CNES COM O CBO
      INFORMADO", 020008 "AIH BLOQUEADA POR SOLICITAÇÃO DE LIBERAÇÃO". This is the
      field that gives the ER file its name.
    code_system: internal
    codelists: [MOTERRO]
    source: def
    source_ref: >
      [DEF-MOTERRO] display_name "Motivo da Rejeição" for CO_ERRO, lookup
      MOTERRO.CNV.
    notes: >
      A different code space from ST_MOT_BLO — that is RJ's block-reason table
      (MOTBLOQUEIO); this is ER's validation-error table (MOTERRO). The two files
      record different stages of rejection and their codes are not interchangeable.

  MUN_MOV:
    translated_name: Municipality of the establishment (error file)
    description: >
      IBGE 6-digit municipality code of the hospital that generated this ER
      record — the error file's equivalent of MUNIC_MOV in RD (sihsus_rd.yml).
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: >
      No .DEF display name is bound, but the detector matches this column's
      values to MUNICBR (six-character IBGE codes) with high confidence, the
      observed values are real Acre-state municipalities, and MUN_MOV pairs
      directly with the already-documented MUNIC_MOV concept.
    notes: >
      MUN_MOV and MUN_RES answer different questions, exactly as MUNIC_MOV and
      MUNIC_RES do in RD (see sihsus_rd.yml) — the same caution applies here.

  MUN_RES:
    translated_name: Municipality of the patient's residence (error file)
    description: >
      IBGE 6-digit municipality code of where the patient lives, for this ER
      record — the error file's equivalent of MUNIC_RES in RD (sihsus_rd.yml).
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: Same basis as MUN_MOV — detector-matched to MUNICBR, and the name pairs with the documented MUNIC_RES concept.

  UF_RES:
    translated_name: State of residence (error file)
    description: >
      IBGE 2-digit state (UF) code of the patient's residence — a coarser,
      redundant echo of MUN_RES (the UF is already the first two digits of
      MUN_RES). Observed values in this batch are 12 (Acre) and 13 (Amazonas).
    code_system: external
    source: inferred
    reasoning: >
      The 2-digit values match the IBGE UF numeric codes for the two states this
      batch's error files cover (Acre, Amazonas), and the name follows the UF_
      prefix paired directly with MUN_RES in the same file.

  # ---------------------------------------------------------- RD control field

  COD_ARQ:
    translated_name: Reduced-AIH record-type code
    description: >
      A low-cardinality flag; only two values (1, 2) are observed across the
      1992–2006 RD files in this tree, which is a record-type marker rather than
      a per-record unique identifier.
    code_system: internal
    source: web
    source_ref: >
      [GEOCOD-AIH] p.7: "COD_ARQ - Código identificador do registro reduzido de
      AIH".
    notes: >
      The source naming this field does not say what 1 vs 2 means, and no lookup
      table for it was found in the tree — treat the split as unexplained rather
      than safe to filter on.

  # -------------------------------------------------------- SP (Serviços Profissionais)

  SP_CGCHOSP:
    official_name: Hospital BR(CNPJ)
    translated_name: Hospital's CNPJ
    description: >
      CNPJ (federal taxpayer registry number) of the hospital, in the SP
      (Serviços Profissionais — itemised professional-service) file. Same concept
      as CGC_HOSP in the geocoded RD extract, using the post-1998 CNPJ term rather
      than the older CGC.
    code_system: none
    source: def
    source_ref: >
      [DEF-SP] display_name "Hospital BR(CNPJ)" for SP_CGCHOSP (DATASUS also ships
      the identical binding per state, e.g. "Hospital AC(CNPJ)", "Hospital
      SP(CNPJ)" — one CNPJ lookup table per UF under the same field).
    notes: >
      Values include both 13- and 14-digit numbers in the sample; CNPJ is formally
      14 digits, so shorter values are almost certainly missing a leading zero
      rather than naming a different identifier scheme.

  # -------------------------------------------------- RD: real/dollar value split

  UTI_TOTAL:
    official_name: Diárias de UTI
    translated_name: ICU days
    description: >
      Count of ICU (UTI) days billed for this admission — how many days of the
      stay were spent in an intensive-care bed, not how many separate ICU stays
      occurred.
    code_system: none
    source: def
    source_ref: '[DEF-AIHMA] display_name "Diárias de UTI" for UTI_TOTAL.'
    notes: >
      Present in RD 1992–1999 in this tree. The large majority of admissions carry
      0 (no ICU use), so this is a sparse, right-skewed count, not something to
      average without acknowledging the mass at zero.

  US_SH:
    translated_name: Hospital-services value, in US dollars
    description: >
      Portion of this admission's bill attributed to "serviços hospitalares"
      (hospital services: bed, nursing, ward costs) expressed in US dollars.
    code_system: none
    source: inferred
    reasoning: >
      No .DEF binds a display name to US_SH, but the same RD layout documents
      US_TOT as "Valor total da AIH (VAL_TOT) em dólares" [GEOCOD-AIH p.5] — the
      dollar-denominated twin of the Real-valued VAL_TOT — and separately
      documents VAL_SH as "Valor de serviços hospitalares" [GEOCOD-AIH p.5].
      US_SH follows the identical VAL_*/US_* pairing for the SH component; the
      catalog's own detector independently classifies this column as money-shaped.
    notes: >
      The catalog's automatic unit detector labels this column BRL — that is
      wrong. Brazil ran three currencies across 1992–1997 (cruzeiro, cruzeiro
      real, then the real from July 1994), and DATASUS carried a dollar-pegged
      shadow value through that instability so figures would compare across the
      changeovers; US_SH is that dollar value, not reais. The Real-denominated
      VAL_SH is not yet curated in this project.

  US_SP:
    translated_name: Professional-services value, in US dollars
    description: >
      Portion of this admission's bill attributed to "serviços profissionais"
      (professional/physician fees) expressed in US dollars.
    code_system: none
    source: inferred
    reasoning: Same VAL_*/US_* pairing basis as US_SH; VAL_SP is documented as "Valor de serviços profissionais" [GEOCOD-AIH p.5].
    notes: Same currency caveat as US_SH — this is US dollars, not reais, despite the detector's BRL label.

  US_SADT:
    translated_name: SADT-services value, in US dollars
    description: >
      Portion of this admission's bill for SADT (serviços auxiliares de
      diagnóstico e terapia — auxiliary diagnostic/therapy services such as labs
      and imaging), expressed in US dollars.
    code_system: none
    source: inferred
    reasoning: Same VAL_*/US_* pairing basis as US_SH; VAL_SADT is documented as "Valor de SADT (serviços auxiliares de diagnose e terapia)" [GEOCOD-AIH p.5].
    notes: Same currency caveat as US_SH.

  US_SANGUE:
    translated_name: Blood/hemoderivatives value, in US dollars
    description: >
      Portion of this admission's bill for blood and blood products, expressed in
      US dollars. In 1992 files this cost is instead folded into US_SADT rather
      than broken out separately.
    code_system: none
    source: inferred
    reasoning: >
      Same VAL_*/US_* pairing basis as US_SH; VAL_SANG (the Real-valued sibling)
      is documented as "Valor gasto com sangue; nos arquivos de 1992, este valor
      está somado em VAL_SADT" [GEOCOD-AIH p.5].
    vintage_note: 1992 files fold this value into the SADT component; only from 1993 is it broken out.
    notes: Same currency caveat as US_SH.

  US_ORTP:
    translated_name: Orthotics/prosthetics value, in US dollars
    description: Portion of this admission's bill for órteses e próteses (orthotic and prosthetic devices), expressed in US dollars.
    code_system: none
    source: inferred
    reasoning: Same VAL_*/US_* pairing basis as US_SH; VAL_ORTP is documented as "Valor de órtese e prótese" [GEOCOD-AIH p.5].
    notes: Same currency caveat as US_SH.

  US_RN:
    translated_name: Newborn-nursery value, in US dollars
    description: >
      Portion of this admission's bill for the newborn (recém-nato) nursery
      component, expressed in US dollars. Only exists for admissions from
      December 1994 on.
    code_system: none
    source: inferred
    reasoning: Same VAL_*/US_* pairing basis as US_SH; VAL_RN is documented as "Valor de recém-nato (a partir de dezembro de 1994)" [GEOCOD-AIH p.5].
    vintage_note: Not present before December 1994 — its Real-valued sibling VAL_RN did not exist before then either.
    notes: Same currency caveat as US_SH.

  # ------------------------------------------------------------- RD budget/diagnosis

  FONTE_ORC:
    official_name: Fonte Orçamentária
    translated_name: Budget source code
    description: >
      DATASUS code for which budget line funded this admission's payment. Every
      value observed in this batch is '00', so this batch alone gives no
      information about what the other codes mean.
    code_system: internal
    codelists: [FONTEREM]
    source: def
    source_ref: '[DEF-RD2008] display_name "Fonte Orçamentária" for FONTE_ORC, lookup FONTEREM.CNV.'
    notes: >
      No label was observed for the value seen ('00' is unlabelled in the
      dictionary rows collected so far) — do not assume '00' means "no source";
      it may simply be the modal funding source with no captured label.

  DIAG_SEC:
    translated_name: Secondary diagnosis (1997 CID-9 predecessor of DIAG_SECUN)
    description: >
      Secondary-diagnosis code recorded on this admission in the 1997 RD files,
      using CID-9 rather than CID-10 — the predecessor of the DIAG_SECUN column
      documented in sihsus_rd.yml. '000000' "Código inválido - fora da CID" is
      itself the most common observed value.
    code_system: external
    codelists: [CID9X01, CID9X02, CID9X03, CID9X04, CID9X05, CID9X06]
    source: def
    source_ref: >
      [DEF-RD9297] binds DIAG_SEC to seventeen CID-9 chapter lookups ("DSec CID9
      cap 01" .. "cap 17D") plus "(capit)", "(categ)" and "inválido" tables. The
      general concept (secondary diagnosis) is confirmed independently for this
      column name in [GEOCOD-AIH] p.6, "DIAG_SEC - Diagnóstico secundário, segundo
      a CID-10" — the CID-9 vs CID-10 wording difference is exactly the vintage
      boundary this column sits on.
    vintage_note: >
      Confined to RD 1997 in this tree — the CID-9/CID-10 changeover year, sitting
      between the CID-9 era and the CID-10-coded DIAG_SECUN that follows. Do not
      concatenate DIAG_SEC and DIAG_SECUN into one series without converting
      CID-9 codes to CID-10 first.
    notes: >
      The catalog surfaces only 6 of the 17 CID-9 chapter codelists the .DEF
      actually binds to this field (CID9X01–06 of a full CID9X01–17 set).

  # ------------------------------------------------------ CH (hospital registry)

  CMPT:
    translated_name: Reference period of the hospital-registry snapshot
    description: >
      Year-month (YYYYMM, e.g. 202208) identifying which competência this row of
      the CH (hospital-registry) file is a snapshot for — the establishment-
      cadastre analogue of MES_CMPT/ANO_CMPT on billing records.
    code_system: none
    source: inferred
    reasoning: >
      Six-digit YYYYMM values match the CMPT (competência) naming convention used
      throughout SIH, and this column has no def_path in the billing-record .DEF
      files queried, consistent with it belonging to a separate establishment-
      registry file rather than an AIH.
    notes: >
      Only one value (202208) is observed in this batch's sample — this looks
      like a single monthly snapshot rather than a maintained time series.

  MUNIC_LOC:
    translated_name: Municipality where the establishment is located
    description: >
      IBGE 6-digit municipality code of the hospital/establishment this
      hospital-registry row describes — e.g. 355030 São Paulo, 330455 Rio de
      Janeiro dominate the values observed, i.e. this sample skews toward
      state-capital hospitals.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: >
      Detector-matched to MUNICBR with high confidence; MUNIC_LOC ("localização")
      is standard DATASUS naming for an establishment's own municipality, distinct
      from the patient-geography columns elsewhere in this system.
    notes: >
      Not the same thing as MUNIC_MOV (sihsus_rd.yml) — MUNIC_MOV is a per-
      admission billing column naming the establishment's municipality on an AIH
      row; MUNIC_LOC is the establishment registry's own address, one row per
      hospital rather than one per admission.

  NOMEFANT:
    translated_name: Establishment trade name
    description: >
      The hospital's "nome fantasia" — its commonly used trade name, as opposed
      to the legal registered name in RAZAO. Observed values are literal hospital
      names (HOSPITAL SAO JOSE, HOSPITAL SAO VICENTE DE PAULO, ...).
    code_system: none
    source: inferred
    reasoning: >
      "Nome fantasia" is standard Brazilian business terminology for the trade
      name a CNPJ-registered entity operates under, as distinct from its razão
      social; the observed values are exactly that kind of free-text hospital
      name, in a file this catalog's series naming and column cluster identify
      as an establishment registry.
    notes: >
      Free text with no controlled vocabulary — the same hospital can appear
      under slightly different spellings across snapshots, so exact-string joins
      across periods will undercount.

  RAZAO:
    translated_name: Establishment legal name (razão social)
    description: >
      The establishment's legal registered name — often the state/municipal
      health secretariat or the legal entity that holds the CNPJ, rather than the
      hospital's public-facing name (NOMEFANT). Observed values include entries
      like "SECRETARIA DE ESTADO DA SAUDE" and "EMPRESA BRASILEIRA DE SERVICOS
      HOSPITALARES EBSERH".
    code_system: none
    source: inferred
    reasoning: >
      "Razão social" is the standard Brazilian legal-name counterpart to "nome
      fantasia," and the observed values are legal-entity names rather than
      hospital brand names — several are clearly a state Secretaria de Saúde
      acting as the CNPJ holder for many public hospitals at once.
    notes: >
      Because one Secretaria de Saúde can be the RAZAO for many physically
      distinct hospitals, RAZAO does not uniquely identify a hospital — CNES or
      the establishment's own code does that; RAZAO only identifies who legally
      holds it.

  # ---------------------------------------------- 1995–1997 professional-acts table
  # These twelve columns carry the file-prefix "MT" in this catalog. Web search
  # turned up conflicting signals for what that prefix means: one source describes
  # a legacy CD-ROM structured by state with secondary file types "MA, MT e PA";
  # another confirms MA/MT/PA are also plain Brazilian state abbreviations
  # (Maranhão/Mato Grosso/Pará). Neither was solid enough to cite. What is
  # documented here is the columns' likely role, from name and position alone —
  # NOT what "MT" stands for, which is left unresolved.

  ANO_MES:
    translated_name: Processing year-month (professional-acts file)
    description: >
      Competência period this professional-act record belongs to — most likely
      YYMM given the declared 4-character width — this file's counterpart to
      ANO_CMPT/MES_CMPT.
    code_system: none
    source: inferred
    reasoning: >
      ANO_MES is a transparent contraction of ANO ("year") and MES ("month"), the
      convention used explicitly elsewhere in this system (ANO_CMPT/MES_CMPT, and
      ANO/MES in the ER file above); a 4-character width fits a 2+2 digit YYMM
      encoding.
    notes: >
      No observed values were captured for this column, so the exact digit split
      (YYMM vs MMAA) is unverified.

  ATO_PROF:
    translated_name: Professional-act (procedure) code
    description: >
      Code of the professional medical act/procedure performed, in this
      1995–1997 professional-acts record.
    code_system: external
    source: inferred
    reasoning: >
      "Ato profissional" is standard SUS billing terminology for a procedure a
      health professional performs and is remunerated for by point value (see
      SP_PONTO below); ATO_PROF sits directly beside QTD_ATO, TIPO_ATO and
      VAL_ATO — the cluster expected around one billed procedure.
    notes: >
      No observed values or bound codelist exist in the catalog for this column —
      which procedure table (a pre-SIGTAP, era-specific table) it draws codes
      from is not established here.

  TIPO_ATO:
    translated_name: Type of professional act
    description: DATASUS code for the type/category of the professional act recorded in ATO_PROF.
    code_system: internal
    modifies: ATO_PROF
    source: inferred
    reasoning: TIPO_ATO pairs directly with ATO_PROF in the same billing cluster; TIPO_ prefixing a preceding noun is standard DATASUS naming grammar.
    notes: No codelist or observed values were captured — the categories this code distinguishes are unknown.

  QTD_ATO:
    translated_name: Quantity of the act
    description: How many times this professional act (ATO_PROF) was performed/billed within the record.
    code_system: none
    source: inferred
    reasoning: >
      QTD_ is DATASUS's standing abbreviation for "quantidade" (see QTDGESTANT
      etc. in SINASC), paired here with ATO_PROF, TIPO_ATO and VAL_ATO in a
      one-billed-procedure-per-row cluster.

  SP_PONTO:
    translated_name: Professional-service points
    description: >
      Number of remuneration "points" (pontos) assigned to this professional
      service — SUS's older point-based method of valuing professional acts,
      later converted to a monetary amount (VAL_ATO) by multiplying by a point
      value.
    code_system: none
    source: inferred
    reasoning: >
      "SP" is this system's established abbreviation for Serviços Profissionais
      (confirmed by SP_CGCHOSP / [DEF-SP] above), and DATASUS documentation
      describes AIH professional-service remuneration as a "rateio de pontos de
      serviços profissionais" (apportionment of points among the professionals on
      a case) — SP_PONTO is that point count.
    notes: A remuneration unit, not currency — do not sum it as if it were reais.

  RATEIO:
    translated_name: Apportionment flag/code
    description: >
      Appears to mark how this professional act's points/value were apportioned
      when more than one professional participated in the same procedure (SUS's
      "rateio de pontos" mechanism for shared procedures). The specific coding is
      not established.
    code_system: internal
    source: inferred
    reasoning: >
      "Rateio" (apportionment/pro-rating) is the documented SUS billing term for
      splitting a procedure's professional-service value among multiple
      participating professionals; the column's single-character width and
      position in the ATO_PROF/QTD_ATO/VAL_ATO cluster fit a per-professional
      share code or flag.
    notes: >
      DELIBERATELY UNDER-SPECIFIED. No observed values, .DEF label or bound
      codelist exist for this column anywhere consulted — only the general
      concept (apportionment among professionals) is asserted here, not any
      specific code's meaning.

  CGC_CPF:
    translated_name: Professional's or entity's CGC/CPF
    description: >
      Either the CGC (Cadastro Geral de Contribuintes — the pre-1998 name for
      what became CNPJ) of a legal entity, or the CPF of an individual
      professional, associated with this record. ID_CGC_CPF is the flag that says
      which.
    code_system: none
    source: inferred
    reasoning: >
      CGC and CPF are Brazil's two taxpayer-registry identifiers (entity and
      individual respectively); the declared width, C(14), exactly fits a
      14-digit CGC/CNPJ with an 11-digit CPF left-padded into the same field —
      the same CNPJ-width pattern already seen in SP_CGCHOSP.
    notes: An identifier of a real-world person or organisation, not a classification code.

  ID_CGC_CPF:
    translated_name: CGC-vs-CPF indicator
    description: One-character flag on CGC_CPF saying whether that field holds a CGC (legal entity) or a CPF (individual professional).
    code_system: internal
    modifies: CGC_CPF
    source: inferred
    reasoning: >
      The ID_ prefix is DATASUS's standard indicator naming, and it sits
      immediately after CGC_CPF — the position a type-discriminator flag for the
      preceding field would occupy.
    notes: No observed values were captured, so which character means CGC and which means CPF is not established here.

  UF_DOM:
    translated_name: State of the professional's domicile
    description: IBGE 2-digit state code of the professional's declared residence (domicílio).
    code_system: external
    source: inferred
    reasoning: >
      DOM is DATASUS's standard abbreviation for domicílio (residence), C(2)
      matches an IBGE UF code's width, and it sits beside UF_VINC, distinguishing
      residence from institutional linkage.
    notes: No observed values were captured to confirm the code space is the standard IBGE UF table.

  UF_VINC:
    translated_name: State of the professional's institutional link
    description: >
      IBGE 2-digit state code of where the professional is registered/linked
      (vínculo) for billing purposes — conceptually distinct from UF_DOM, which is
      where they live.
    code_system: external
    source: inferred
    reasoning: >
      VINC is DATASUS's standard abbreviation for vínculo (a professional's
      registered link to an establishment/CNES), paired directly with UF_DOM in
      the same record.
    notes: Same caveat as UF_DOM — no observed values were captured.

  VAL_ATO:
    translated_name: Value of the act
    description: Monetary amount (reais) paid for this professional act — the endpoint of the ATO_PROF/QTD_ATO/SP_PONTO billing chain.
    code_system: none
    source: inferred
    reasoning: >
      VAL_ is DATASUS's standing prefix for a monetary amount throughout SIH
      (VAL_TOT, VAL_SH, VAL_SP, ...); N(14,2) is a money-shaped declared type, and
      it closes out the ATO_PROF/QTD_ATO/SP_PONTO cluster.
