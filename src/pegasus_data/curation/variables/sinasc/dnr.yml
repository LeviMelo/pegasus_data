# SINASC.DNR — Live births, corrected base
# Nascidos Vivos, base retificada
#
# The corrected republication of DN.
system: SINASC
asserted_by: pegasus_data

variables:
  CODIGO:
    official_name: Número da DN
    translated_name: Live-birth certificate (DN) number
    description: 'Number of the live-birth declaration (DN) in the 1994-1995 layout: the
      record identifier of the birth, not a facility code (the establishment of
      occurrence is ESTAB_OCOR).'
    code_system: none
    source: layout_doc
    asserted_by: pegasus_data
    source_ref: 'NASC98.HLP, help file for the SINASC 1994-1995 files (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SINASC/1994_1995/Doc/NASC98.HLP,
      ''Definição dos registros de nascidos vivos'', CODIGO C(08) ''Número da DN''
      (first field of the record layout)'
    notes: 'Not a CNES registry code — CNES numbering for the facility of birth arrives
      later as CODESTAB (SINASC''s 1996+ layout, from year 2000).

      '
