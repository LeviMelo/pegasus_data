      management (regulacao) to patients covered by the establishment's own company health
      plan/insurance (plano-seguro proprio). It is one cell of a 7x6 grid on the Estabelecimentos (ST)
      record that crosses 7 broad service categories (AP01 internacao .. AP07 regulacao) with 6
      payer/coverage arrangements (CV01 SUS .. CV06 plano de saude privado); a facility can and often
      does tick more than one CVxx for the same APxx. The seven per-service any-payer flags roll up
      into a single establishment-level summary flag, ATEND_PR, which sits outside this batch (ST SEQ
      199).
