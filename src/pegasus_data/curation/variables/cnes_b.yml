# CNES - columns 0-120, ordered by file count (batch "cnes_b").
#
# Most columns in this batch are grounded against the DATASUS CNES layout document
# (IT_CNES_1706.pdf, "CNES - Informe Tecnico 2017-06", Sec 2.1 Layout dos arquivos de
# Estabelecimentos, ST*.dbf), fetched from ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/
# 200508_/doc/IT_CNES_1706.pdf; source_ref cites the SEQ row for each such field.
#
# Three families needed more than the layout PDF, which only prints one generic label for
# every position in a numbered grid (QTINST01-37 "Quantidade de salas/consultorios";
# GESPRG3E/M "programa cod. 03"; CLASAVAL with no value list at all). DATASUS's own FTP
# auxiliary bundle - ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Auxiliar/
# TAB_CNES.zip - carries the TabWin tabulation definitions and value-label tables that spell
# these out, and each of the three families is sourced from there instead (source: def):
#   - QTINST01-31: Estabelecimento.def lists a distinct room/office label at each fixed grid
#     position (e.g. QTINST01 = "Sala Atendimento Pediatria"), grouped into three physical
#     blocks - urgencia/emergencia (01-14), ambulatorio (15-30), and the hospital centro
#     cirurgico (31). QTINST32-37 continue the same grid (centro obstetrico / neonatal) but
#     fall outside this batch's column range.
#   - GESPRG3E/GESPRG3M: Estabelecimento.def labels these "Internacao Estadual (ANTIGO)" /
#     "Internacao Municipal (ANTIGO)" - a legacy general-inpatient management indicator,
#     marked ANTIGO (old) because GESPRG5/GESPRG6 later split hospital management by
#     complexity level. CNV/GESPROG3.CNV confirms the same reading.
#   - CLASAVAL: CNV/CLASAVAL.CNV gives the value list (1/2/3 = accredited level 1/2/3, 0 = did
#     not meet minimum standards) that the layout PDF omits entirely.
#
# code_system for LEITHOSP, CENTRCIR and CO_BANCO is set from what the column IS (a DATASUS
# 1-sim/0-nao flag; a Febraban/COMPE bank code) even though the catalog currently has zero
# codelist bound to those three specific fields, per the task rule to set code_system from
# what the column is rather than from what the catalog happens to bind.
#
# The catalog's evidence run (scripts/evidence.py) returned empty top_values for every column
# in this batch - all 120 are CHAR/NUMERIC flag or count fields catalogued from file headers,
# consistent with the note that some CNES columns carry no distinct observed-value sample.
# Series evidence (which of ST/DC/EP each field appears in) is cited inline where it adds
# information, e.g. the AP0#CV0# grid and most of the GESPRG#/NIVATE_# fields are mirrored,
# field-for-field, onto the Dados Complementares (DC) and Equipes (EP) files.

system: CNES
asserted_by: pegasus_data
variables:
  AP01CV01:
    official_name: >-
      Atendimento prestado INTERNACAO/Convenio SUS
    translated_name: >-
      Inpatient admission (internacao) offered under the SUS public system
    description: >-
      SUS-covered patients: flag (1=yes/0=no) for whether the establishment offers inpatient
      admission (internacao), self-declared on its service/payer grid.
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1
      Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 157
    codelists:
    - ATPRES01
    notes: >-
      This same 7x6 grid (7 services x 6 payers) is also carried, field-for-field, on the Dados
      Complementares (DC) record and, from Apr/2007 onward, on the Equipes (EP) record - confirm
      which file an extract's AP0#CV0# column actually came from. The seven per-service any-
      payer flags roll up into a single establishment-level summary flag, ATEND_PR, which sits
      outside this batch (ST SEQ 199).
