# CNES - columns 0-120, ordered by file count (batch "cnes_b").
#
# All 120 columns in this batch were grounded against the DATASUS CNES layout document
# (IT_CNES_1706.pdf, self-titled "CNES - Informe Tecnico 2017-06", Sec 2.1 Layout dos arquivos
# de Estabelecimentos, ST*.dbf). DATASUS's own ftp.datasus.gov.br / ftp2.datasus.gov.br hosts
# were unreachable from this environment on both HTTPS and the WebFetch tool (connection
# timeouts / ECONNREFUSED); the document was instead retrieved, byte-identical in content, via
# a municipal open-data mirror (Fortaleza CE, dados.fortaleza.ce.gov.br/dataset/cnes_fortaleza,
# resource "layout_cnes.pdf"), and read as text with pdfplumber. Every column in this batch
# (the AP0#CV0# service/payer grid, the GESPRG#E/#M management-sphere grid, NIVATE_A/H,
# accreditation/PNASS fields, physical-installation flags incl. the QTINST0# count grid,
# waste-collection and commission flags, and the contract/banking/date block) maps to a
# specific SEQ row in that document's ST*.dbf layout table; source_ref below cites the SEQ
# number for each.
#
# Two honest gaps are flagged inline rather than guessed shut:
#   - GESPRG3E/GESPRG3M: the source table names programs 1, 2, 4, 5 and 6 (atencao basica /
#     media complexidade / alta complexidade, ambulatorial and hospitalar) but never names what
#     "programa cod. 03" is - see notes on those two fields.
#   - QTINST01-QTINST31: the source table repeats the identical generic label "Quantidade de
#     salas/consultorios" for all 31 of them (and beyond, to QTINST37); which physical-
#     installation type each numbered position counts is not given in this document.
#
# code_system for LEITHOSP, CENTRCIR and CO_BANCO is set from what the column IS (a DATASUS
# 1-sim/0-nao flag; a Febraban/COMPE bank code) even though the catalog currently has zero
# codelist bound to those three specific fields, per the task rule to set code_system from
# what the column is rather than from what the catalog happens to bind.
#
# The catalog's evidence run (scripts/evidence.py) returned empty top_values for every column
# in this batch - all 120 are CHAR/NUMERIC flag or count fields catalogued from file headers,
# consistent with the note that some CNES columns carry no distinct observed-value sample.
# Series evidence (which of ST/DC/EP each field appears in) is cited inline where it adds
# information, e.g. the AP0#CV0# grid and most of the GESPRG#/NIVATE_# fields are mirrored,
# field-for-field, onto the Dados Complementares (DC) and Equipes (EP) files.

system: CNES
asserted_by: pegasus_data
variables:
  AP01CV01:
    official_name: >-
      Atendimento prestado INTERNACAO/Convenio SUS
    translated_name: >-
      Inpatient admission (internacao) offered under the SUS public system
    description: >-
      Flag (1-sim, 0-nao) for whether the establishment declares offering inpatient admission
      (internacao) to patients covered by the SUS public system. It is one cell of a 7x6 grid on the
      Estabelecimentos (ST) record that crosses 7 broad service categories (AP01 internacao .. AP07
      regulacao) with 6 payer/coverage arrangements (CV01 SUS .. CV06 plano de saude privado); a
      facility can and often does tick more than one CVxx for the same APxx. The seven per-service
      any-payer flags roll up into a single establishment-level summary flag, ATEND_PR, which sits
      outside this batch (ST SEQ 199).
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 157
    codelists:
    - ATPRES01
    notes: >-
      This same 7x6 grid is also carried, field-for-field, on the Dados Complementares (DC) record
      (DC*.dbf Sec 2.2, e.g. AP01CV01 at DC SEQ 112) and on the Equipes (EP) record from Apr/2007
      onward - the catalog's series evidence shows AP01CV01 present in DC (2005-2026), EP (2007-2026)
      and ST (2005-2026) alike. Confirm which file a given extract's AP0#CV0# column actually came
      from before comparing establishment- vs team-level counts across files.
