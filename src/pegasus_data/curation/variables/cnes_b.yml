    official_name: >-
      Indica se o estabelecimento foi avaliado segundo o Manual de Acreditacao Hospitalar do MS
    translated_name: >-
      Evaluated under the Ministry of Health Hospital Accreditation Manual
    description: >-
      Flag for whether the establishment has been evaluated under the Ministry of Health's Manual de
      Acreditacao Hospitalar, on the Estabelecimentos (ST) record. Records only that an evaluation
      took place, not the resulting grade (see CLASAVAL) or its date (DT_ACRED).
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 35
    codelists:
    - AVALIADO
    notes: >-
      Coded 1-Sim / 2-Nao in this layout table - note the 2, not the 0 used by most other CNES sim/nao
      flags in this batch (e.g. LEITHOSP, COMISS01-12 all use 1-sim/0-nao). Do not assume 0/1
      semantics for this field.
  CLASAVAL:
    official_name: >-
      Classificacao da avaliacao do estabelecimento segundo o Manual de Acreditacao Hospitalar do MS
    translated_name: >-
      Hospital accreditation classification/grade
    description: >-
      Single-character accreditation grade assigned under the Ministry of Health's Manual de
      Acreditacao Hospitalar, on the Estabelecimentos (ST) record, applicable when AV_ACRED marks the
      establishment as evaluated. The layout table gives no value list for the grade codes themselves;
      the catalog binds a codelist named CLASAVAL to this column but this curation entry does not
      assert what each code means, since the source layout document does not spell it out.
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 36
