      Municipal SUS contract/agreement number
    description: >-
      Contract/agreement number of the establishment's municipal-level (MUNICIPAL) linkage to the SUS,
      on the Estabelecimentos (ST) record. A free-form identifier, not a coded classification; paired
      with its publication year-month in DT_PUBLM.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 28
  CONTRATE:
    official_name: >-
      Numero do contrato/convenio ESTADUAL do vinculo com o SUS
    translated_name: >-
      State SUS contract/agreement number
    description: >-
      Contract/agreement number of the establishment's state-level (ESTADUAL) linkage to the SUS, on
      the Estabelecimentos (ST) record; the state-level sibling of CONTRATM. A free-form identifier,
      not a coded classification; paired with its publication year-month in DT_PUBLE.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 30
    notes: >-
      The layout table documents this field as CHAR(20), but the declared width actually observed on
      the CNES file headers in this catalog is 11 characters - the same width as CONTRATM. Do not size
      buffers or validate on the documented 20-character width.
  CO_BANCO:
    official_name: >-
      Codigo do Banco do Estabelecimento
    translated_name: >-
      Bank code (Febraban/COMPE) of the establishment's account
    description: >-
      The Febraban/COMPE bank-identification code (e.g. 001 Banco do Brasil, 341 Itau Unibanco) of the
      bank holding the establishment's account, on the Estabelecimentos (ST) record. A nationally
      standardized bank code, kept beside CO_AGENC and C_CORREN.
    code_system: external
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 25
  CO_AGENC:
    official_name: >-
      Codigo da Agencia do Estabelecimento
    translated_name: >-
      Bank branch/agency number of the establishment's account
    description: >-
      Branch/agency number, at the bank identified by CO_BANCO, of the establishment's bank account,
      on the Estabelecimentos (ST) record. An identifying number specific to that bank, not a
      classification code.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 26
  C_CORREN:
    official_name: >-
      Codigo da Conta Corrente do Estabelecimento
    translated_name: >-
      Checking-account number of the establishment
    description: >-
      Checking-account number, at the branch identified by CO_AGENC, of the establishment's bank
      account, on the Estabelecimentos (ST) record. Free-form banking identifier.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 27
  DT_PUBLM:
    official_name: >-
      Ano e Mes de publicacao do contrato/convenio MUNICIPAL (AAAAMM)
    translated_name: >-
      Year-month the municipal SUS contract was published
    description: >-
      Year and month (AAAAMM, 8-character field) the CONTRATM municipal contract/agreement was
      published, on the Estabelecimentos (ST) record.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 29
    codelists:
    - ANO_MES
  DT_PUBLE:
    official_name: >-
      Ano e Mes de publicacao do contrato/convenio ESTADUAL (AAAAMM)
    translated_name: >-
      Year-month the state SUS contract was published
    description: >-
      Year and month (AAAAMM, 8-character field) the CONTRATE state contract/agreement was published,
      on the Estabelecimentos (ST) record.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 31
    codelists:
    - ANO_MES
  DT_EXPED:
    official_name: >-
      Ano e Mes de da expedicao do alvara (AAAAMM)
    translated_name: >-
      Year-month the operating license (alvara) was issued
    description: >-
      Year and month (AAAAMM, 8-character field) the establishment's operating license (alvara) was
      issued, on the Estabelecimentos (ST) record; paired with ORGEXPED.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 33
    codelists:
    - ANO_MES
  ORGEXPED:
    official_name: >-
      Orgao expedidor do alvara: 1-SES 2-SMS
    translated_name: >-
      Issuing body of the operating license (state or municipal health secretariat)
    description: >-
      Code for which body issued the establishment's operating license (alvara): 1 = SES (state health
      secretariat) or 2 = SMS (municipal health secretariat), on the Estabelecimentos (ST) record.
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 34
    codelists:
    - ORGEXPED
  DT_ATUAL:
    official_name: >-
      Ano e Mes de competencia da atualizacao da informacao pelo estabelecimento (AAAAMM)
    translated_name: >-
      Year-month the establishment last updated its registration data
    description: >-
      Year and month (AAAAMM, 6 digits) of the competencia in which the establishment itself last
      updated its registration information, on the Estabelecimentos (ST) record - distinct from
      COMPETEN, the competencia of the CNES snapshot/extract itself (ST SEQ 202, outside this batch).
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 201
    codelists:
    - ANO_MES
    notes: >-
      Printed in the source PDF as 'DT_ATUA' (the table cell appears to drop the trailing letter); the
      catalogued/actual field name is DT_ATUAL, matched here by its CHAR(6)/AAAAMM description and its
      position right after MOTDESAB in the SEQ order.
