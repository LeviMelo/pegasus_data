      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 46
  NIVATE_H:
    official_name: >-
      Indica a existencia de Nivel de Atencao HOSPITALAR, de gestao Municipal/Estadual, para este CNES
    translated_name: >-
      Inpatient (hospitalar) care tier exists for this establishment
    description: >-
      Flag (1-sim, 0-nao) for whether this establishment has an inpatient (hospitalar) care tier at
      all, under either municipal or state management, on the Estabelecimentos (ST) record. Sibling of
      NIVATE_A for the hospital side; a coarse existence flag, not a breakdown by GESPRG5E/M vs
      GESPRG6E/M.
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 53
  AV_ACRED:
    official_name: >-
      Indica se o estabelecimento foi avaliado segundo o Manual de Acreditacao Hospitalar do MS
    translated_name: >-
      Evaluated under the Ministry of Health Hospital Accreditation Manual
    description: >-
      Flag for whether the establishment has been evaluated under the Ministry of Health's Manual de
      Acreditacao Hospitalar, on the Estabelecimentos (ST) record. Records only that an evaluation
      took place, not the resulting grade (see CLASAVAL) or its date (DT_ACRED).
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 35
    codelists:
    - AVALIADO
    notes: >-
      Coded 1-Sim / 2-Nao in this layout table - note the 2, not the 0 used by most other CNES sim/nao
      flags in this batch (e.g. LEITHOSP, COMISS01-12 all use 1-sim/0-nao). Do not assume 0/1
      semantics for this field.
  CLASAVAL:
    official_name: >-
      Classificacao da avaliacao do estabelecimento segundo o Manual de Acreditacao Hospitalar do MS
    translated_name: >-
      Hospital accreditation classification/grade
    description: >-
      Grade from the Ministry of Health's Manual de Acreditacao Hospitalar, applying when AV_ACRED
      marks the establishment evaluated: 1/2/3 = accredited at level 1/2/3, 0 = did not meet the
      minimum standards, -9 = grade not informed.
    code_system: internal
    source: def
    source_ref: >-
      CNV/CLASAVAL.CNV, from
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Auxiliar/TAB_CNES.zip (TabWin
      value-label table bound to the CLASAVAL codelist)
    codelists:
    - CLASAVAL
  DT_ACRED:
    official_name: >-
      Ano e Mes da Acreditacao (AAAAMM)
    translated_name: >-
      Year-month of the hospital accreditation evaluation
    description: >-
      Year and month (AAAAMM, 6 digits) the AV_ACRED/CLASAVAL hospital accreditation evaluation was
      recorded, on the Estabelecimentos (ST) record.
    code_system: none
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 37
  AV_PNASS:
    official_name: >-
      Indica se o estabelecimento foi avaliado segundo o Programa Nacional de Avaliacao de Servicos de
      Saude - PNASS
    translated_name: >-
      Evaluated under PNASS (National Health-Services Evaluation Program)
    description: >-
      Flag for whether the establishment has been evaluated under PNASS (Programa Nacional de
