      CNES
    translated_name: >-
      Surgical center (centro cirurgico) installation exists
    description: >-
      Flag (1-sim, 0-nao) for whether the establishment has a physical surgical-center installation,
      on the Estabelecimentos (ST) record's facilities block. Physical infrastructure only, not a
      count of operating rooms or a statement that surgery is an authorized/offered activity (that is
      tracked separately via the AP0#CV0# service flags).
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
