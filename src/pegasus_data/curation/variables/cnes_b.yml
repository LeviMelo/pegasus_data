  COLETRES:
    official_name: >-
      Indica a existencia de alguma coleta de residuo para este CNES
    translated_name: >-
      Any waste-collection arrangement exists
    description: >-
      Aggregate flag (1-sim, 0-nao): true if the establishment declared at least one of the four
      waste-collection streams - biological, chemical, radioactive, common (RES_BIOL, RES_QUIM,
      RES_RADI, RES_COMU) - on the Estabelecimentos (ST) record. It is a derived any-of indicator over
      those four fields, not an independently collected fact; the four component flags themselves fall
      outside this batch (ST SEQ 139-142).
    code_system: internal
    source: layout_doc
    source_ref: >-
      IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06),
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf, Sec 2.1 Layout dos
      arquivos de Estabelecimentos (ST*.dbf), SEQ 143
    depends_on:
    - RES_BIOL
    - RES_QUIM
    - RES_RADI
    - RES_COMU
