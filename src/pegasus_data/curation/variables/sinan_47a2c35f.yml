system: SINAN
asserted_by: pegasus_data
variables:
  FO_ANT_HBC:
    official_name: Se sim, qual o resultado dos testes sorológicos - Anti-HBc
    translated_name: Source patient's Anti-HBc result
    description: >
      Anti-HBc serology result of the identified SOURCE PATIENT, not the
      injured worker, after a biological-material accident: positive,
      negative, inconclusive, in progress, not performed, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 54
  FO_ANT_HCV:
    official_name: Se sim, qual o resultado dos testes sorológicos - Anti-HCV
    translated_name: Source patient's Anti-HCV result
    description: >
      Anti-HCV serology result of the identified source patient after a
      biological-material accident, used to judge whether the injured worker
      faces hepatitis C risk: positive, negative, inconclusive, in progress,
      not performed, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 54
  FO_ANT_HIV:
    official_name: Se sim, qual o resultado dos testes sorológicos - Anti-Hiv
    translated_name: Source patient's Anti-HIV result
    description: >
      Anti-HIV serology result of the identified source patient after a
      biological-material accident, the key test for judging the injured
      worker's HIV exposure risk: positive, negative, inconclusive, in
      progress, not performed, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 54
  FO_HBSAG:
    official_name: Se sim, qual o resultado dos testes sorológicos - HbsAg
    translated_name: Source patient's HBsAg result
    description: >
      HBsAg (hepatitis B surface antigen) serology result of the identified
      source patient after a biological-material accident: positive,
      negative, inconclusive, in progress, not performed, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 54
  GASES:
    official_name: Exposição Concomitante a Ruído e Gases Tóxicos
    translated_name: Concurrent toxic-gas exposure
    description: >
      Whether the worker being investigated for noise-induced hearing loss
      was also exposed to toxic gases at the same time as the workplace
      noise: yes, no, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_PAIR_v5.pdf, campo 50
  HBSAG:
    official_name: Resultados de exame do acidentado (Data Zero) - HbsAg
    translated_name: Worker's own HBsAg result at time zero
    description: >
      HBsAg test result of the INJURED WORKER, not the source patient, drawn
      at the moment of the biological-material accident (data zero):
      positive, negative, inconclusive, not performed, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 52
  HERBIV_DES:
    official_name: Espécie do animal agressor - Herbívoro doméstico (Especificar)
    translated_name: Domestic herbivore species
    description: >
      Free text naming which domestic herbivore -- horse, mule, ox, or
      similar -- attacked or exposed the patient to rabies virus; filled in
      only when the animal-species field is coded "herbívoro doméstico".
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 40
  HORA_ACID:
    official_name: Hora do Acidente
    translated_name: Hour of accident
    description: >
      Hour of the day, 0 through 23, at which the reported work accident
      occurred, paired with a separate minutes field to give the accident's
      clock time.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_grave_v5.pdf, campo 50
  HORA_JOR:
    official_name: Horas após início da jornada
    translated_name: Hours into work shift at accident
    description: >
      Number of whole hours elapsed since the worker's shift began when the
      accident happened, used to study whether fatigue late in a shift
      raises accident risk.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_grave_v5.pdf, campo 51
  IMU_HEP_B:
    official_name: Conduta no momento do acidente - Imunoglobulina humana contra hepatite B (HBIG)
    translated_name: HBIG given as prophylaxis
    description: >
      Whether human hepatitis B immunoglobulin (HBIG) was given to the
      exposed worker as post-exposure prophylaxis right after the
      biological-material accident: yes, no, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 55
  LAB_SORO:
    official_name: Laboratório produtor do soro anti-rábico
    translated_name: Rabies antiserum manufacturer
    description: >
      Manufacturer of the rabies antiserum (soro anti-rábico) given to the
      patient: Instituto Butantan, Instituto Vital Brasil, Aventis Pasteur,
      or another producer named in the companion field LAB_SOR_DE.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 57
  LAB_SOR_DE:
    official_name: Laboratório produtor do soro anti-rábico - Outros (especificar)
    translated_name: Other rabies antiserum manufacturer
    description: >
      Free-text name of the rabies-antiserum manufacturer, filled in only
      when LAB_SORO is coded "outro" because the producer is not Instituto
      Butantan, Instituto Vital Brasil, or Aventis Pasteur.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 57
  LAB_VACINA:
    official_name: Laboratório produtor (Vacina)
    translated_name: Rabies vaccine manufacturer
    description: >
      Manufacturer of the rabies vaccine given to the patient: Instituto
      Butantan, Instituto Vital Brasil, Aventis Pasteur, or another producer
      named in the companion field LAB_VAC_DE.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 44
  LAB_VAC_DE:
    official_name: Laboratório produtor da vacina - Outro (especificar)
    translated_name: Other rabies vaccine manufacturer
    description: >
      Free-text name of the rabies-vaccine manufacturer, filled in only when
      LAB_VACINA is coded "outro" because the producer is not Instituto
      Butantan, Instituto Vital Brasil, or Aventis Pasteur.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 44
  LAVOURA:
    official_name: Se agrotóxico de uso agrícola, qual a cultura / lavoura
    translated_name: Crop treated with the pesticide
    description: >
      Name of the crop or plantation -- soybean, coffee, sugarcane, and so
      on, drawn from a fixed list -- being treated with the agricultural
      pesticide that caused the poisoning.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026.pdf, campo 53
  LESAO:
    official_name: Localização da lesão (parte do corpo atingida)
    translated_name: Body part with occupational skin lesion
    description: >
      Body part where the occupational dermatosis lesion appears: hand,
      upper limb, head, neck, thorax, abdomen, lower limb, foot, whole body,
      another part, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Dermatoses_v5.pdf, campo 50
  LESAO_DES:
    official_name: Localização da lesão - Se Outro Especificar
    translated_name: Other lesion location
    description: >
      Free text naming the specific body part carrying the occupational
      dermatosis lesion, filled in only when LESAO is coded "outro" because
      it is not on the fixed body-part list.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Dermatoses_v5.pdf, campo 50
  LOCAL_ACID:
    official_name: Local onde ocorreu o acidente
    translated_name: Where the accident happened
    description: >
      Where the reported work accident physically took place: the
      employer's own premises, a public street, a third party's premises,
      the worker's own home, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_grave_v5.pdf, campo 34
  LOC_EXPO:
    official_name: Local de ocorrência da exposição
    translated_name: Setting of poisoning exposure
    description: >
      Setting where the poisoning exposure occurred: the patient's
      residence, workplace, commute route, a health facility, a school or
      daycare, an outdoor public area, another setting, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026.pdf, campo 34
  LOC_EXP_DE:
    official_name: Local de ocorrência da exposição (outro) especificar
    translated_name: Other exposure setting
    description: >
      Free text naming the exposure setting, filled in only when LOC_EXPO is
      coded "outro" because the poisoning happened somewhere off the fixed
      residence/workplace/school list.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026.pdf, campo 34
  LOTE_VAC:
    official_name: Número do lote
    translated_name: Rabies vaccine lot number
    description: >
      Lot (batch) number printed on the first dose of rabies vaccine given
      to the patient, letting a specific manufacturing batch be traced if a
      problem later turns up.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 45
  LUVA:
    official_name: Uso de EPI - LUVA
    translated_name: Gloves worn during accident
    description: >
      Whether the worker was wearing gloves at the moment of the
      biological-material accident, one of several personal-protective-
      equipment items asked about individually: yes, no, or unknown.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 50
  MAIS_TRAB:
    official_name: Houve Outros Trabalhadores Atingidos?
    translated_name: Other workers also affected
    description: >
      Whether other workers, besides the one being notified, were also
      injured in the same work accident: yes, no, or unknown; a following
      field records how many if yes.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_grave_v5.pdf, campo 56
  MASCARA:
    official_name: Uso de EPI - Máscara
    translated_name: Mask worn during accident
    description: >
      Whether the worker was wearing a face mask at the moment of the
      biological-material accident, one of several personal-protective-
      equipment items asked about individually: yes, no, or unknown.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 50
  MAT_ORG:
    official_name: Material orgânico
    translated_name: Organic material involved
    description: >
      Type of organic or biological material the worker was exposed to in
      the accident: blood, cerebrospinal fluid, pleural fluid, ascitic
      fluid, amniotic fluid, blood-tinged fluid, serum/plasma, other, or
      unknown.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 47
