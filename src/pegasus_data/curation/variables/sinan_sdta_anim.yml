# SINAN.SDTA and SINAN.ANIM — two forms that are not like the others.
#
# SDTA — Surto de Doença Transmitida por Alimentos — is AGGREGATE. One row is an
# outbreak, and its columns are counts of people within that outbreak: how many
# were interviewed, how many fell ill, how many by age and sex, how many had each
# symptom. Nothing here is a person. Adding SDTA rows to individual-case counts
# from any other agravo mixes events with people.
#
# The age-by-sex grid repeats one age banding four times over — male, female,
# unknown sex, and total — under names truncated to ten characters, which is why
# NU_1_M_NU, NU_1_F_NU, NU_1_IGN and NU_1_TOT_N are the same age band four ways.
#
# ANIM is individual, and is a decision chain: which animal, how long until care,
# how severe, how much antivenom. The time-to-care band is the field that most
# determines the outcome, because antivenom works far better early.
system: SINAN
asserted_by: pegasus_data

variables:

  # ===================================== SDTA, the outbreak's own counts
  CS_TRANS:
    official_name: Modo de transmissão
    translated_name: Transmission mode
    description: >
      Whether transmission was direct, person to person, or indirect through a
      vehicle. Indirect is the ordinary foodborne case and TP_INDIRET then names
      the vehicle.
    code_system: internal
    source: def
    source_ref: MODOTRANS.CNV
    reasoning: Bound to MODOTRANS, whose values are direta and indireta.

  TP_INDIRET:
    official_name: Tipo de transmissão indireta
    translated_name: Indirect transmission vehicle
    description: >
      What carried the agent — food, water, a vector, a product, or a fomite.
      The distinction between food and water changes the whole investigation and
      the intervention that follows it.
    code_system: internal
    source: def
    source_ref: MODOIND.CNV
    reasoning: >
      Bound to MODOIND, whose values are alimento, recursos hídricos, vetor,
      produto and fômite.

  NU_ENTR:
    official_name: Número de pessoas entrevistadas
    translated_name: People interviewed
    description: >
      How many people were interviewed in the investigation. The denominator for
      the attack rate, and the field that says how thorough the investigation
      was.
    code_system: none
    source: inferred
    reasoning: NU_ENTR reads número de entrevistados; N(7) count on the outbreak record.

  NU_ENT_DOE:
    official_name: Número de entrevistados doentes
    translated_name: Interviewed who fell ill
    description: >
      How many of those interviewed were ill. With NU_ENTR this gives the attack
      rate, which is the primary measure of an outbreak's severity.
    code_system: none
    source: inferred
    reasoning: ENT_DOE reads entrevistados doentes; the numerator to NU_ENTR.

  NU_TOT:
    official_name: Número total de doentes
    translated_name: Total cases
    description: >
      Total people ill in the outbreak, including those never interviewed. Larger
      than NU_ENT_DOE, and the figure to report as the outbreak's size.
    code_system: none
    source: inferred
    reasoning: NU_TOT reads número total; N(7) count on the outbreak record.

  NU_TOT_HOS:
    official_name: Número de hospitalizados
    translated_name: Hospitalised
    description: >
      How many were admitted to hospital. The severity marker for the outbreak,
      since most foodborne illness resolves without care.
    code_system: none
    source: inferred
    reasoning: TOT_HOS reads total hospitalizados.

  NU_OBITO:
    official_name: Número de óbitos
    translated_name: Deaths
    description: Deaths in the outbreak. Rare, and what turns an investigation into an urgent one.
    code_system: none
    source: inferred
    reasoning: NU_OBITO reads número de óbitos.

  # --- the age by sex grid: male ------------------------------------------
  NU_1_M_NU:
    official_name: Doentes masculinos menores de 1 ano
    translated_name: Male cases under 1
    description: >
      Male cases under one year old. The first cell of an age-by-sex grid
      repeated for male, female, unknown and total; only one of the four sets
      should be used at a time.
    code_system: none
    source: inferred
    reasoning: >
      NU_1 is the under-1 band and M masculino; the parallel _F_, _IGN and _TOT
      names give the same band for the other sex categories.

  NU_1_4_NU:
    official_name: Doentes masculinos de 1 a 4 anos
    translated_name: Male cases 1 to 4
    description: Male cases aged 1 to 4. See NU_1_M_NU for the grid.
    code_system: none
    source: inferred
    reasoning: The 1-4 band of the male series.

  NU_5_9_NU:
    official_name: Doentes masculinos de 5 a 9 anos
    translated_name: Male cases 5 to 9
    description: Male cases aged 5 to 9. See NU_1_M_NU.
    code_system: none
    source: inferred
    reasoning: The 5-9 band of the male series.

  NU_10_19_M:
    official_name: Doentes masculinos de 10 a 19 anos
    translated_name: Male cases 10 to 19
    description: Male cases aged 10 to 19. See NU_1_M_NU.
    code_system: none
    source: inferred
    reasoning: The 10-19 band of the male series.

  NU_20_49_N:
    official_name: Doentes masculinos de 20 a 49 anos
    translated_name: Male cases 20 to 49
    description: >
      Male cases aged 20 to 49. The widest band, and usually the largest, which
      is a property of the banding rather than of risk.
    code_system: none
    source: inferred
    reasoning: The 20-49 band of the male series.

  NU_50_M_NU:
    official_name: Doentes masculinos de 50 anos e mais
    translated_name: Male cases 50 and over
    description: Male cases aged 50 or more. See NU_1_M_NU.
    code_system: none
    source: inferred
    reasoning: The 50-and-over band of the male series.

  NU_IGRA_NU:
    official_name: Doentes masculinos de idade ignorada
    translated_name: Male cases, age unknown
    description: >
      Male cases whose age was not recorded. Must be added back before any age
      distribution is computed, or the distribution silently excludes them.
    code_system: none
    source: inferred
    reasoning: IGRA marks idade ignorada in the male series.

  # --- female --------------------------------------------------------------
  NU_1_F_NU:
    official_name: Doentes femininas menores de 1 ano
    translated_name: Female cases under 1
    description: Female cases under one year. The female series of the same grid; see NU_1_M_NU.
    code_system: none
    source: inferred
    reasoning: F marks feminino in the under-1 band.

  NU1_4_F_NU:
    official_name: Doentes femininas de 1 a 4 anos
    translated_name: Female cases 1 to 4
    description: Female cases aged 1 to 4.
    code_system: none
    source: inferred
    reasoning: The 1-4 band of the female series.

  NU5_9_F_NU:
    official_name: Doentes femininas de 5 a 9 anos
    translated_name: Female cases 5 to 9
    description: Female cases aged 5 to 9.
    code_system: none
    source: inferred
    reasoning: The 5-9 band of the female series.

  NU10_19_N:
    official_name: Doentes femininas de 10 a 19 anos
    translated_name: Female cases 10 to 19
    description: Female cases aged 10 to 19.
    code_system: none
    source: inferred
    reasoning: The 10-19 band of the female series.

  NU_20_49_F:
    official_name: Doentes femininas de 20 a 49 anos
    translated_name: Female cases 20 to 49
    description: Female cases aged 20 to 49.
    code_system: none
    source: inferred
    reasoning: The 20-49 band of the female series.

  NU_50_F_NU:
    official_name: Doentes femininas de 50 anos e mais
    translated_name: Female cases 50 and over
    description: Female cases aged 50 or more.
    code_system: none
    source: inferred
    reasoning: The 50-and-over band of the female series.

  NU_IG_F_NU:
    official_name: Doentes femininas de idade ignorada
    translated_name: Female cases, age unknown
    description: Female cases whose age was not recorded. See NU_IGRA_NU.
    code_system: none
    source: inferred
    reasoning: IG marks idade ignorada in the female series.

  NU_TO_F_NU:
    official_name: Total de doentes femininas
    translated_name: Female cases, total
    description: >
      All female cases. Should equal the female age bands summed, and a mismatch
      is a data-quality check rather than a finding.
    code_system: none
    source: inferred
    reasoning: TO_F reads total feminino; the row total of the female series.

  # --- unknown sex ---------------------------------------------------------
  NU_1_IGN:
    official_name: Doentes de sexo ignorado menores de 1 ano
    translated_name: Cases of unknown sex under 1
    description: >
      Cases under one year whose sex was not recorded. The third series of the
      grid; without it the male and female series do not sum to the total.
    code_system: none
    source: inferred
    reasoning: IGN marks sexo ignorado in the under-1 band.

  NU_1_4_IGN:
    official_name: Doentes de sexo ignorado de 1 a 4 anos
    translated_name: Cases of unknown sex, 1 to 4
    description: Cases aged 1 to 4 whose sex was not recorded.
    code_system: none
    source: inferred
    reasoning: The 1-4 band of the unknown-sex series.

  NU_5_9_IGN:
    official_name: Doentes de sexo ignorado de 5 a 9 anos
    translated_name: Cases of unknown sex, 5 to 9
    description: Cases aged 5 to 9 whose sex was not recorded.
    code_system: none
    source: inferred
    reasoning: The 5-9 band of the unknown-sex series.

  NU_10_19IG:
    official_name: Doentes de sexo ignorado de 10 a 19 anos
    translated_name: Cases of unknown sex, 10 to 19
    description: Cases aged 10 to 19 whose sex was not recorded.
    code_system: none
    source: inferred
    reasoning: The 10-19 band of the unknown-sex series.

  NU_20_49IG:
    official_name: Doentes de sexo ignorado de 20 a 49 anos
    translated_name: Cases of unknown sex, 20 to 49
    description: Cases aged 20 to 49 whose sex was not recorded.
    code_system: none
    source: inferred
    reasoning: The 20-49 band of the unknown-sex series.

  NU_50_IGN:
    official_name: Doentes de sexo ignorado de 50 anos e mais
    translated_name: Cases of unknown sex, 50 and over
    description: Cases aged 50 or more whose sex was not recorded.
    code_system: none
    source: inferred
    reasoning: The 50-and-over band of the unknown-sex series.

  NU_IG_IGN:
    official_name: Doentes de sexo e idade ignorados
    translated_name: Cases of unknown sex and age
    description: >
      Cases where neither sex nor age was recorded. The cell that quantifies how
      incomplete the outbreak's demography is.
    code_system: none
    source: inferred
    reasoning: Both IG and IGN, the doubly-unknown cell of the grid.

  NU_TOT_IGN:
    official_name: Total de doentes de sexo ignorado
    translated_name: Cases of unknown sex, total
    description: All cases whose sex was not recorded.
    code_system: none
    source: inferred
    reasoning: The row total of the unknown-sex series.

  # --- totals --------------------------------------------------------------
  NU_1_TOT_N:
    official_name: Total de doentes menores de 1 ano
    translated_name: Total cases under 1
    description: >
      All cases under one year, across the sexes. The total series is the sum of
      the other three, so adding it to them double-counts.
    code_system: none
    source: inferred
    reasoning: TOT marks the totals series in the under-1 band.

  NU_1_4_TOT:
    official_name: Total de doentes de 1 a 4 anos
    translated_name: Total cases 1 to 4
    description: All cases aged 1 to 4.
    code_system: none
    source: inferred
    reasoning: The 1-4 band of the totals series.

  NU_5_9_TOT:
    official_name: Total de doentes de 5 a 9 anos
    translated_name: Total cases 5 to 9
    description: All cases aged 5 to 9.
    code_system: none
    source: inferred
    reasoning: The 5-9 band of the totals series.

  NU_10_19:
    official_name: Total de doentes de 10 a 19 anos
    translated_name: Total cases 10 to 19
    description: All cases aged 10 to 19.
    code_system: none
    source: inferred
    reasoning: The 10-19 band of the totals series.

  NU_20_49:
    official_name: Total de doentes de 20 a 49 anos
    translated_name: Total cases 20 to 49
    description: All cases aged 20 to 49.
    code_system: none
    source: inferred
    reasoning: The 20-49 band of the totals series.

  NU_50_TOT:
    official_name: Total de doentes de 50 anos e mais
    translated_name: Total cases 50 and over
    description: All cases aged 50 or more.
    code_system: none
    source: inferred
    reasoning: The 50-and-over band of the totals series.

  NU_IGN_NU:
    official_name: Total de doentes de idade ignorada
    translated_name: Total cases, age unknown
    description: All cases whose age was not recorded, across the sexes.
    code_system: none
    source: inferred
    reasoning: The idade ignorada cell of the totals series.

  NU_F_TOT_N:
    official_name: Total geral de doentes
    translated_name: Grand total of cases
    description: >
      The grand total across the whole grid. Should agree with NU_TOT, and a
      disagreement means the grid was filled inconsistently.
    code_system: none
    source: inferred
    reasoning: The grand total closing the age-by-sex grid.

  QT_TOTAL_C:
    official_name: Quantidade total de casos
    translated_name: Total case count
    description: >
      Total cases as carried in a later generation of the form, beside rather
      than instead of NU_TOT.
    code_system: none
    source: inferred
    reasoning: QT_TOTAL_C reads quantidade total de casos; C(10).

  # --- symptoms, counted across the outbreak ------------------------------
  NU_DIARR_N:
    official_name: Número de doentes com diarreia
    translated_name: Cases with diarrhoea
    description: >
      How many cases had diarrhoea. The symptom counts describe the outbreak's
      clinical picture, which is what narrows the likely agent before any
      laboratory result arrives.
    code_system: none
    source: inferred
    reasoning: DIARR reads diarreia; a per-symptom count across the outbreak.

  NU_VOMTO_N:
    official_name: Número de doentes com vômito
    translated_name: Cases with vomiting
    description: >
      How many had vomiting. Vomiting predominating over diarrhoea, with a short
      incubation, points to a preformed toxin rather than an infection.
    code_system: none
    source: inferred
    reasoning: VOMTO reads vômito; a per-symptom count.

  NU_NAUSE_P:
    official_name: Número de doentes com náusea
    translated_name: Cases with nausea
    description: How many had nausea, recorded apart from vomiting.
    code_system: none
    source: inferred
    reasoning: NAUSE reads náusea; a per-symptom count.

  NU_ABDOM_N:
    official_name: Número de doentes com dor abdominal
    translated_name: Cases with abdominal pain
    description: How many had abdominal pain.
    code_system: none
    source: inferred
    reasoning: ABDOM reads abdominal; a per-symptom count.

  NU_FEBRE_N:
    official_name: Número de doentes com febre
    translated_name: Cases with fever
    description: >
      How many had fever. Fever separates an invasive infection from a toxin,
      which is the main branch in identifying the agent.
    code_system: none
    source: inferred
    reasoning: FEBRE reads febre; a per-symptom count.

  NU_CEFAL_N:
    official_name: Número de doentes com cefaleia
    translated_name: Cases with headache
    description: How many had headache.
    code_system: none
    source: inferred
    reasoning: CEFAL reads cefaleia; a per-symptom count.

  NU_NEURO_N:
    official_name: Número de doentes com sintomas neurológicos
    translated_name: Cases with neurological symptoms
    description: >
      How many had neurological symptoms. Rare in foodborne illness and alarming
      when present, since it raises botulism and marine toxins.
    code_system: none
    source: inferred
    reasoning: NEURO reads neurológico; a per-symptom count.

  NU_OUTRO_N:
    official_name: Número de doentes com outros sintomas
    translated_name: Cases with other symptoms
    description: How many had symptoms outside the named list.
    code_system: none
    source: inferred
    reasoning: The residual item of the symptom counts.

  NU_CLI_NUM:
    official_name: Número de doentes com quadro clínico registrado
    translated_name: Cases with a clinical picture recorded
    description: >
      How many cases had any clinical detail recorded at all — the denominator
      the symptom counts should be read against.
    code_system: none
    source: inferred
    reasoning: CLI_NUM reads clínico número; the base for the symptom counts.

  NU_A_ALIM:
    official_name: Número de amostras de alimento
    translated_name: Food samples taken
    description: >
      How many food samples were collected. Without samples the vehicle can only
      be inferred epidemiologically, so this is what separates a suspected
      vehicle from a confirmed one.
    code_system: none
    source: inferred
    reasoning: A_ALIM reads amostras de alimento.

  # ============================= ANIM, venomous animal accidents
  ANT_DT_ACI:
    official_name: Data do acidente
    translated_name: Date of the accident
    description: >
      When the bite or sting happened. With the notification date it gives the
      delay, but ANT_TEMPO_ carries the clinically decisive interval directly.
    code_system: internal
    source: def
    source_ref: SEMANAEP.CNV
    reasoning: DT_ACI reads data do acidente; D(8) date.

  ANT_MUNIC_:
    official_name: Município do acidente
    translated_name: Municipality of the accident
    description: >
      Where the accident happened, by IBGE code. Often not where the patient was
      treated, since antivenom is held at designated centres.
    code_system: external
    codelist: ibge_municipio
    source: inferred
    reasoning: C(6) IBGE code bound to the municipality codelists.

  ANT_TEMPO_:
    official_name: Tempo entre o acidente e o atendimento
    translated_name: Time from accident to care
    description: >
      How long until care, banded from under an hour to over 24 hours. The most
      important field on this form: antivenom neutralises circulating venom, so
      its effect falls sharply with delay.
    code_system: internal
    source: def
    source_ref: FXHORAS.CNV
    reasoning: >
      Bound to FXHORAS, whose bands run 0 to 1 hour, 1 to 3, 3 to 6, 6 to 12, 12
      to 24 and 24 or more.

  ANT_LOCA_1:
    official_name: Local da picada
    translated_name: Bite site
    description: >
      Where on the body the bite or sting was — head, arm, hand, finger, trunk,
      leg, foot, toe. Hands and feet dominate, which is what makes the accident
      an occupational and rural problem.
    code_system: internal
    source: def
    source_ref: LOCALPIC.CNV
    reasoning: >
      Bound to LOCALPIC, whose values enumerate body sites from cabeça to dedo
      do pé.

  TP_ACIDENT:
    official_name: Tipo de acidente
    translated_name: Type of animal
    description: >
      Which animal — snake, spider, scorpion, caterpillar, bee, or other. The
      first branch of the form: everything downstream depends on it, and each
      type has its own antivenom.
    code_system: internal
    source: def
    source_ref: SERARAESNET.CNV
    reasoning: >
      Bound to SERARAESNET, whose values are serpente, aranha, escorpião,
      lagarta, abelha and outros.

  ANI_SERPEN:
    official_name: Gênero da serpente
    translated_name: Snake genus
    description: >
      Which snake group — bothropic, crotalic, elapidic, lachetic, or
      non-venomous. This chooses the antivenom, and the four venomous groups
      need different ones, so getting it wrong wastes the only treatment there
      is.
    code_system: internal
    source: def
    source_ref: SERPESPNET.CNV
    reasoning: >
      Bound to SERPESPNET, whose values are botrópico, crotálico, elapídico,
      laquético and não peçonhenta.

  ANI_ARANHA:
    official_name: Gênero da aranha
    translated_name: Spider genus
    description: >
      Which spider syndrome — phoneutrism, loxoscelism, latrodectism, or another
      spider. Loxoscelism causes the slow necrotic lesion; phoneutrism causes
      immediate severe pain. Quite different presentations and antivenoms.
    code_system: internal
    source: def
    source_ref: ARAESPNET.CNV
    reasoning: >
      Bound to ARAESPNET, whose values are foneutrismo, loxoscelismo,
      latrodectismo and outra aranha.

  ANI_LAGART:
    official_name: Gênero da lagarta
    translated_name: Caterpillar genus
    description: >
      Whether the caterpillar was Lonomia or another. The distinction matters
      more than any other on this form's animal branch: Lonomia causes a
      haemorrhagic syndrome that kills, while other caterpillars cause local
      pain.
    code_system: internal
    source: def
    source_ref: LAGARTA.CNV
    reasoning: Bound to LAGARTA, whose values are Lonomia and outra lagarta.

  MCLI_LOCAL:
    official_name: Manifestações clínicas locais
    translated_name: Local signs present
    description: >
      Whether local signs are present at all. The gate for the CLI_ local block
      that follows.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MCLI reads manifestações clínicas, LOCAL the local group.

  CLI_DOR:
    official_name: Dor local
    translated_name: Local pain
    description: >
      Pain at the bite site. Immediate and severe pain with little swelling
      suggests phoneutrism or a scorpion; pain developing slowly suggests
      loxoscelism.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DOR reads dor, a local sign in the CLI_ block.

  CLI_EDEMA:
    official_name: Edema local
    translated_name: Local swelling
    description: >
      Swelling at the site. Its extent is part of how bothropic accidents are
      graded, so it feeds directly into TRA_CLASSI.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: EDEMA reads edema, a local sign in the CLI_ block.

  CLI_EQUIMO:
    official_name: Equimose local
    translated_name: Local bruising
    description: >
      Bruising at the site, from the local haemorrhage bothropic venom causes.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: EQUIMO reads equimose, a local sign in the CLI_ block.

  CLI_NECROS:
    official_name: Necrose local
    translated_name: Local necrosis
    description: >
      Tissue death at the site. The characteristic late lesion of loxoscelism
      and of severe bothropic envenoming, and the sign that most often leads to
      amputation.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: NECROS reads necrose, a local sign in the CLI_ block.

  CLI_LOCAL_:
    official_name: Outra manifestação local
    translated_name: Other local sign
    description: Any local sign the named items do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item closing the local-signs block.

  MCLI_SIST:
    official_name: Manifestações clínicas sistêmicas
    translated_name: Systemic signs present
    description: >
      Whether systemic signs are present. Systemic involvement is what moves an
      accident from moderate to severe, and it is the indication for antivenom
      regardless of local appearance.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MCLI with SIST for sistêmicas; the gate for the systemic block.

  CLI_NEURO:
    official_name: Manifestações neurológicas
    translated_name: Neurological signs
    description: >
      Neurological signs. Characteristic of crotalic and elapidic envenoming —
      drooping eyelids and blurred vision — rather than of bothropic.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: NEURO reads neurológicas, a systemic sign in the CLI_ block.

  CLI_VAGAIS:
    official_name: Manifestações vagais
    translated_name: Vagal signs
    description: >
      Vagal signs — sweating, nausea, slow pulse, hypotension. Typical of
      phoneutrism and scorpion stings, especially in children.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: VAGAIS reads vagais, a systemic sign in the CLI_ block.

  CLI_MIOLIT:
    official_name: Mioanálise ou mialgia
    translated_name: Muscle breakdown
    description: >
      Muscle breakdown. The hallmark of crotalic envenoming, and the mechanism
      by which it destroys the kidneys — which is why COM_RENAL sits downstream.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MIOLIT reads miólise, a systemic sign in the CLI_ block.

  CLI_OUTR_2:
    official_name: Outra manifestação sistêmica
    translated_name: Other systemic sign
    description: Any systemic sign the named items do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item closing the systemic-signs block.

  CLI_TEMPO_:
    official_name: Tempo de coagulação
    translated_name: Coagulation time
    description: >
      Whether clotting time is normal, altered, or was not done. The single most
      useful test in snakebite: an unclottable sample confirms bothropic or
      lachetic envenoming even when the snake was never seen.
    code_system: internal
    source: def
    source_ref: TEMPCOA.CNV
    reasoning: >
      Bound to TEMPCOA, whose values are normal, alterado and não realizado.

  TRA_CLASSI:
    official_name: Classificação do caso
    translated_name: Severity classification
    description: >
      Mild, moderate, severe, or inconclusive. This decides how much antivenom
      is given, so NU_AMPOLAS follows from it.
    code_system: internal
