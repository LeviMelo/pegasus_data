# SINAN — the long tail: fields specific to one notification form.
#
# These appear in 20-60 files each because they belong to a single agravo's
# form rather than the shared notification block. No .DEF names them: TabNet
# never offered them as tabulation axes, so DATASUS's own naming is silent and
# the abbreviation plus the form's context is the evidence.
#
# Which form a column belongs to is readable from the company it keeps. AVENTAL,
# BOTA and LUVA sit together, which is the personal protective equipment
# checklist of the occupational biological-accident form. AZT3TC and its
# variants are antiretroviral regimens on the same form's prophylaxis block.
# CARVAO and the coagulation measures belong to the poisoning and snakebite
# forms.
#
# Left out, because the abbreviation alone does not settle them: DS_TRANS1..3,
# ID_DG_NOT, ID_EV_NOT, CON_INF_PA, DT_TRNASRM, CS_MENING.
system: SINAN
asserted_by: pegasus_data

variables:

  # ------------------- occupational exposure: protective equipment worn

  AVENTAL:
    official_name: Uso de avental
    translated_name: Gown or apron worn
    description: >
      Whether the worker was wearing a gown or apron when the exposure happened.
      One item of the protective-equipment checklist the occupational
      biological-accident notification records.
    code_system: internal
    source: inferred
    reasoning: >
      Avental is a gown or apron; the column is C(1), a checklist flag, and sits
      beside BOTA and the other equipment items on the same form.

  BOTA:
    official_name: Uso de bota
    translated_name: Boots worn
    description: >
      Whether the worker was wearing protective boots at the moment of exposure.
      The companion checklist item to AVENTAL on the same accident form.
    code_system: internal
    source: inferred
    reasoning: Bota is a boot; C(1) flag in the same protective-equipment block.

  # ------------------------- occupational exposure: prophylaxis given

  AZT3TC:
    official_name: Quimioprofilaxia AZT + 3TC
    translated_name: Post-exposure prophylaxis, AZT + 3TC
    description: >
      Whether the exposed worker was started on zidovudine plus lamivudine — the
      two-drug backbone of HIV post-exposure prophylaxis — after the accident.
    code_system: internal
    source: inferred
    reasoning: >
      AZT is zidovudine and 3TC lamivudine, both standard abbreviations; C(1)
      admits a prescribed/not-prescribed flag rather than a dose.

  AZT3TC_IND:
    official_name: Quimioprofilaxia AZT + 3TC + indinavir
    translated_name: Prophylaxis, AZT + 3TC + indinavir
    description: >
      Whether the two-drug backbone was given with indinavir added — the
      three-drug regimen used for higher-risk exposures.
    code_system: internal
    source: inferred
    reasoning: >
      IND is indinavir, a protease inhibitor of the era these forms date from,
      appended to the AZT3TC backbone in the field name.

  AZT3TC_NFV:
    official_name: Quimioprofilaxia AZT + 3TC + nelfinavir
    translated_name: Prophylaxis, AZT + 3TC + nelfinavir
    description: >
      Whether the backbone was given with nelfinavir instead — the alternative
      third drug to indinavir in the same protocol.
    code_system: internal
    source: inferred
    reasoning: NFV is the standard abbreviation for nelfinavir; sibling of AZT3TC_IND.

  IN_AIDS:
    official_name: Indicação de AIDS
    translated_name: AIDS indicated
    description: >
      Whether the source patient of the exposure was known to have AIDS, which
      is what determines the prophylaxis regimen offered to the worker.
    code_system: internal
    source: inferred
    reasoning: >
      IN_ is the flag prefix and AIDS needs no expansion; C(1), and it sits with
      the prophylaxis fields it governs.

  # ---------------------------------------- what the person was doing

  ATIVIDA_1:
    official_name: Atividade exercida (1)
    translated_name: Activity being performed, first
    description: >
      What the person was doing when the event happened, as the first of up to
      three coded activities. More than one is recorded because an exposure can
      occur during a task made of several.
    code_system: internal
    source: inferred
    reasoning: >
      ATIVIDA is atividade truncated to the ten characters DBF allows; C(2)
      admits a code, and the numbered siblings admit up to three.

  ATIVIDA_2:
    official_name: Atividade exercida (2)
    translated_name: Activity being performed, second
    description: >
      The second activity recorded for the same event, where one was not enough
      to describe what was being done.
    code_system: internal
    source: inferred
    reasoning: Numbered sibling of ATIVIDA_1, same C(2) width.

  ATIVIDA_3:
    official_name: Atividade exercida (3)
    translated_name: Activity being performed, third
    description: >
      The third and last activity slot. Beyond three the form has nowhere to put
      an activity, so a complex task is truncated rather than continued.
    code_system: internal
    source: inferred
    reasoning: Last numbered sibling of the ATIVIDA_* group.

  CIRCUNSTAN:
    official_name: Circunstância
    translated_name: Circumstance
    description: >
      Coded circumstance in which the event occurred — accidental, occupational,
      intentional and so on. The distinction that separates an exposure at work
      from one at home, and an accident from an attempt.
    code_system: internal
    source: inferred
    reasoning: >
      Circunstância truncated to ten characters, C(2) for a code; the free-text
      elaboration is in CIRCUN_DES.

  CIRCUN_DES:
    official_name: Descrição da circunstância
    translated_name: Circumstance, free text
    description: >
      Free text elaborating the coded circumstance, where the code did not
      capture it. Thirty characters, so it is a phrase and not an account.
    code_system: none
    source: inferred
    reasoning: >
      DES is descrição and C(30) is too wide for a code and too narrow for
      prose; it is the text companion of CIRCUNSTAN.
    notes: >
      Free text, uncoded and unvalidated. Do not tabulate it without reading it.

  # ------------------------------------------------ clinical findings

  SINAIS:
    official_name: Sinais clínicos
    translated_name: Clinical signs present
    description: >
      Whether clinical signs were present at examination, as a flag. The signs
      themselves, where the form records them, are in separate columns.
    code_system: internal
    source: inferred
    reasoning: Sinais is clinical signs; C(1) admits a flag, not a list.

  BIOPSIA:
    official_name: Biópsia realizada
    translated_name: Biopsy performed
    description: >
      Whether a biopsy was taken as part of investigating the case.
    code_system: internal
    source: inferred
    reasoning: Biópsia without its accent; C(1) flag.

  CANCER:
    official_name: Câncer
    translated_name: Cancer present
    description: >
      Whether cancer was identified in the person notified. On the occupational
      forms this is the outcome being notified; elsewhere it is a comorbidity.
    code_system: internal
    source: inferred
    reasoning: Câncer without its accent; C(1) flag.

  CLI_OUTRO:
    official_name: Outro achado clínico
    translated_name: Other clinical finding
    description: >
      Whether a clinical finding was present that the form's own list does not
      name. The catch-all that closes a checklist of specific findings.
    code_system: internal
    source: inferred
    reasoning: >
      CLI is clínico and OUTRO is other; C(1), and the OUTRO suffix is how
      DATASUS closes an enumerated checklist throughout.

  DIAG_CONF:
    official_name: Diagnóstico confirmado
    translated_name: Confirmed diagnosis
    description: >
      CID-10 code of the diagnosis once investigation confirmed it, as opposed
      to what was suspected at notification. Stored without the dot.
    code_system: external
    source: inferred
    reasoning: >
      Declared C(4), the CID-10 subcategory width, and CONF is confirmado — the
      confirmed counterpart of the notified suspicion.

  CONDUTA_DE:
    official_name: Descrição da conduta
    translated_name: Management, free text
    description: >
      Free text describing what was done for the patient, where the coded
      management fields did not cover it. Thirty characters.
    code_system: none
    source: inferred
    reasoning: >
      Conduta with a DE (descrição) suffix truncated to ten characters; C(30),
      the same shape as CIRCUN_DES.

  # ------------------------------------------------ poisoning and envenoming

  CARVAO:
    official_name: Carvão ativado
    translated_name: Activated charcoal given
    description: >
      Whether activated charcoal was administered — the first-line
      decontamination for many ingested poisons, and one of the treatment
      options the exogenous-intoxication form asks about.
    code_system: internal
    source: inferred
    reasoning: >
      Carvão without its accent, on the poisoning form; C(1) admits a
      given/not-given flag.

  COAGTOXMA1:
    official_name: Tempo de coagulação (1)
    translated_name: Coagulation time, first measurement
    description: >
      First coagulation-time measurement taken after a venomous bite. Clotting
      time is what determines whether antivenom is working, so it is measured
      repeatedly.
    code_system: none
    source: inferred
    reasoning: >
      COAG is coagulação and the column is N(4) — numeric, unlike the C(1) flags
      around it — with three numbered repeats, which is how a serial measurement
      is recorded.

  COAGTOXMA2:
    official_name: Tempo de coagulação (2)
    translated_name: Coagulation time, second measurement
    description: >
      Second coagulation-time measurement, taken after the first to see whether
      clotting is recovering.
    code_system: none
    source: inferred
    reasoning: Numbered sibling of COAGTOXMA1, same N(4).

  COAGTOXMA3:
    official_name: Tempo de coagulação (3)
    translated_name: Coagulation time, third measurement
    description: >
      Third and last coagulation-time slot on the form. A case still not
      clotting by this point has nowhere further to be recorded.
    code_system: none
    source: inferred
    reasoning: Last numbered sibling of the COAGTOXMA group.

  # ------------------------------------------------------ vaccination

  DT_VAC_1:
    official_name: Data da 1ª dose
    translated_name: Date of first dose
    description: >
      Date the first dose of the relevant vaccine was given. On the rabies and
      tetanus forms this begins the schedule that the remaining dose dates
      complete.
    code_system: none
    source: inferred
    reasoning: >
      DT_ is the date prefix and the column is declared D(8); the numbered
      siblings run to five, the length of a rabies schedule.

  DT_VAC_2:
    official_name: Data da 2ª dose
    translated_name: Date of second dose
    description: >
      Date of the second dose. The interval from DT_VAC_1 is what says whether
      the schedule was kept to.
    code_system: none
    source: inferred
    reasoning: Numbered sibling of DT_VAC_1, same D(8).

  DT_VAC_3:
    official_name: Data da 3ª dose
    translated_name: Date of third dose
    description: >
      Date of the third dose, which completes the primary series for most of the
      schedules these forms cover.
    code_system: none
    source: inferred
    reasoning: Numbered sibling of DT_VAC_1.

  DT_VAC_4:
    official_name: Data da 4ª dose
    translated_name: Date of fourth dose
    description: >
      Date of the fourth dose, given where the schedule extends beyond three.
    code_system: none
    source: inferred
    reasoning: Numbered sibling of DT_VAC_1.

  DT_VAC_5:
    official_name: Data da 5ª dose
    translated_name: Date of fifth dose
    description: >
      Date of the fifth and last dose the form has room for — the full
      post-exposure rabies schedule.
    code_system: none
    source: inferred
    reasoning: Last numbered sibling of the DT_VAC_* group.
