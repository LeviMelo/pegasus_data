# SIM — two rare CAUSABAS-reprocessing fields (series DOREXT, year 2021 only, 1 file
# each). NUDIASINF and TPASSINA are left out: neither the "Estrutura do SIM" layout
# tables nor the CGIAE/SVS data dictionary (dicionario-de-dados-SIM-tabela-DO.pdf) give
# either field a description, and the PCDaS variable dictionary confirms both are blank
# there too. No meaning was found, so they are not asserted.
system: SIM
asserted_by: pegasus_data

variables:

  TP_ALTERA:
    official_name: Tipo de alteração da causa básica
    translated_name: Type of underlying-cause alteration
    description: >
      System flag from the automatic cause-of-death reviewer (SCB) recording why
      CAUSABAS was rejected or changed: for instance code 06 marks a cause invalid for a
      female decedent, 12 marks a non-fetal death carrying a fetal-only cause.
    code_system: none
    source: web
    source_ref: dicionario-de-dados-SIM-tabela-DO.pdf (svs.aids.gov.br), campo TP_ALTERA

  CB_ALT:
    translated_name: System-generated altered cause code
    description: >
      Holds the CID-10 code the automatic cause-selector (SCB) substitutes for CAUSABAS
      after finding a problem flagged by TP_ALTERA, replacing the certifying physician's
      originally reported underlying cause with the system-corrected one.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      CB_ALT appears only alongside TP_ALTERA in the same SIM DOREXT 2021 file; the
      CB_ prefix matches CB_PRE (causa básica antes da resseleção), and DATASUS's own
      note calls it a "variável de sistema" with no value list, consistent with a
      system-written CID-10 output rather than a form field.
