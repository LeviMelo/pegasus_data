system: SINAN
asserted_by: pegasus_data

variables:
  # --- ROTA (rotavirus/acute diarrheal disease sentinel surveillance) ---
  LAB_PROD1:
    official_name: Produto/laboratório fabricante da 1ª dose de vacina
    translated_name: Vaccine product/manufacturer - dose 1
    description: >
      Product name or manufacturer of the first rotavirus vaccine dose the
      child received, recorded alongside its lot number (LOTE1) and
      administration date (DT_1VAC) to support vaccine-effectiveness and
      safety surveillance by product/batch.
    code_system: none
    source: inferred
    reasoning: >
      LAB_ = laboratório (manufacturer); PROD1 = produto, dose 1; ROTA
      series carries the matching LOTE1/LOTE2 and DT_1VAC/DT_2VAC fields.

  LOTE1:
    official_name: Lote da 1ª dose de vacina
    translated_name: Vaccine lot number - dose 1
    description: >
      Batch/lot number of the first rotavirus vaccine dose the child
      received - paired with LAB_PROD1 (product) and DT_1VAC (date) for
      tracing vaccine effectiveness or safety issues to a specific batch.
    code_system: none
    source: inferred
    reasoning: LOTE1 = lote (batch), dose 1; ROTA series pairs it with LAB_PROD1 and DT_1VAC.

  NOME_PARAS:
    official_name: Nome do parasito identificado
    translated_name: Name of identified parasite
    description: >
      Free-text name of the specific parasite found on stool exam (e.g.
      Giardia lamblia), recorded when the PARASITA flag is positive - this
      diarrheal-disease sentinel form screens for viral, bacterial, and
      parasitic causes together.
    code_system: none
    source: inferred
    reasoning: NOME_ = nome; PARAS = parasito; ROTA series carries the matching Sim/Não flag PARASITA and analogous NOME_BACT/NOME_VIRUS fields.

  N_VOMITO:
    official_name: Número de episódios de vômito
    translated_name: Number of vomiting episodes
    description: >
      Count of vomiting episodes reported for the acute diarrheal disease
      case, paired with D_VOMITO (days with vomiting) and the analogous
      N_DIAR/D_DIAR pair for diarrhea - clinical severity markers for
      rotavirus gastroenteritis.
    code_system: none
    source: inferred
    reasoning: N_ = número; VOMITO = vômito; ROTA series carries the matching VOMITO flag and D_VOMITO duration field.

  # --- VIOL (interpersonal/self-inflicted violence) ---
  AG_ESPEC:
    official_name: Outro meio de agressão - especifique
    translated_name: Other means of aggression - specify
    description: >
      Free-text name of the weapon or means of aggression used, filled in
      when the standard checklist (firearm, blade, blunt force, etc.) is
      marked "other" (AG_OUTROS).
    code_system: none
    source: layout_doc
    source_ref: "SINAN Violência data dictionary: field 57 (Outro meio de agressão), DBF code AG_ESPEC."
    reasoning: Confirmed directly in the violence data dictionary text.

  CONS_ESPEC:
    official_name: Outra consequência - especifique
    translated_name: Other consequence - specify
    description: >
      Free-text description of the violence's consequence when it falls
      outside the standard checklist (pregnancy, STI, abortion, mental
      disorder, suicide attempt, etc.) and the "other" box (CONS_OUTR) is
      checked.
    code_system: none
    source: inferred
    reasoning: >
      CONS_ = consequência (a checklist block: CONS_GRAV, CONS_DST,
      CONS_SUIC, CONS_OUTR); ESPEC = especifique, the same "other, specify"
      pattern confirmed for AG_ESPEC and LOCAL_ESPE on this same form.

  LOCAL_ESPE:
    official_name: Outro local de ocorrência - especifique
    translated_name: Other occurrence location - specify
    description: >
      Free-text name of the location where the violence occurred, filled
      in when the standard venue checklist (bar, school, workplace, etc.)
      doesn't apply.
    code_system: none
    source: layout_doc
    source_ref: "SINAN Violência data dictionary: field 52 (Local de ocorrência - Especificar outro local), DBF code LOCAL_ESPE."
    reasoning: Confirmed directly in the violence data dictionary text.

  SG_UF_OCOR:
    official_name: UF de ocorrência
    translated_name: State (UF) where the violence occurred
    description: >
      State where the violent event took place, distinguished from the
      victim's state of residence (SG_UF) and state of notification
      (SG_UF_NOT).
    code_system: none
    source: layout_doc
    source_ref: "SINAN Violência data dictionary: field 40 (UF de ocorrência), DBF code SG_UF_OCOR."
    reasoning: Confirmed directly in the violence data dictionary text.

  # --- ESPO (sporotrichosis) ---
  C_D:
    official_name: Coordenada geográfica - graus
    translated_name: Geographic coordinate - degrees
    description: >
      Degrees component of one geographic coordinate used to locate the
      likely animal-contact/exposure site for the sporotrichosis case
      (paired with a minutes component, C_M, not owned here).
    code_system: none
    source: inferred
    reasoning: >
      ESPO's field set includes C_D/C_M and G_D/G_M alongside TP_ZN_OCO and
      TP_AMB_OCO (zone/environment of occurrence), consistent with a
      degrees/minutes geocoordinate pair for the exposure site.

  ESPECIE:
    official_name: Espécie do animal envolvido
    translated_name: Animal species involved
    description: >
      Species of the animal involved in transmitting sporotrichosis to the
      patient - almost always a cat (the main reservoir/vector in Brazil's
      sporotrichosis epidemic), but the field allows other species.
    code_system: none
    source: inferred
    reasoning: ESPECIE = espécie; sporotrichosis is predominantly a zoonosis transmitted by cat scratches/bites.

  TP_ZN_OCO:
    official_name: Tipo de zona de ocorrência
    translated_name: Occurrence zone type
    description: >
      Urban/rural/peri-urban classification of the zone where the
      sporotrichosis exposure occurred - a standard geographic
      classification alongside the environment-type field TP_AMB_OCO.
    code_system: none
    source: inferred
    reasoning: TP_ = tipo; ZN = zona; OCO = ocorrência; ESPO's site-classification field.

  # --- SIFC (congenital syphilis) ---
  ANTSIFIL_N:
    official_name: Antecedente de sífilis materna (normalizado)
    translated_name: Maternal syphilis history (normalized code)
    description: >
      A recoded/normalized version of the mother's syphilis-history flag,
      following DATASUS's convention of adding a "_N" companion field with
      cleaned numeric codes alongside the original for easier tabulation.
    code_system: none
    source: inferred
    reasoning: >
      ANTSIFIL = antecedente de sífilis; the "_N" suffix matches DATASUS's
      normalized-field convention seen elsewhere in SINAN (e.g. NU_IDADE_N,
      CS_ESCOL_N).

  TRA_DIAG_C:
    official_name: Tratamento no diagnóstico - completo
    translated_name: Treatment at diagnosis completed (flag)
    description: >
      Whether the mother's syphilis treatment, given at/after her
      diagnosis, was completed per the recommended regimen - a key field
      for judging maternal-treatment adequacy, distinct from TRA_DIAG_T
      (which records the regimen type).
    code_system: none
    source: inferred
    reasoning: TRA_DIAG_ = tratamento no diagnóstico; SIFC carries the matching TRA_DIAG_T sibling.

  UF_PRE_NAT:
    official_name: UF do pré-natal
    translated_name: State (UF) of prenatal care
    description: >
      State where the mother received prenatal care - relevant to tracing
      whether and where prenatal syphilis screening occurred; paired with
      MUN_PRE_NA for the municipality.
    code_system: none
    source: inferred
    reasoning: UF_PRE_NAT = UF + pré-natal; SIFC carries the matching MUN_PRE_NA field.

  # --- FTIF (typhoid fever) ---
  TIFICA:
    official_name: Forma tífica
    translated_name: Typhoidal clinical form (flag)
    description: >
      Classifies whether the case presented the typical typhoidal (tífica)
      clinical picture of enteric fever, as opposed to an atypical
      presentation - a clinical-form field distinct from the confirmation
      criterion (CRITERIO) and final classification (CLASSI_FIN).
    code_system: none
    source: inferred
    reasoning: TIFICA directly echoes "tífica"; typhoid fever's clinical presentation can be typical or atypical.

  URO_D_3:
    official_name: Urocultura - dia (3ª coleta)
    translated_name: Urine culture - day marker (3rd collection)
    description: >
      Day-of-illness/treatment marker for the third of three serial urine
      culture (urocultura) samples taken to confirm or monitor S. Typhi
      urinary shedding, distinct from its calendar date (DT_URO3) and its
      lab result (URO_R3).
    code_system: none
    source: inferred
    reasoning: >
      FTIF series carries URO_D/URO_D_2/URO_D_3 alongside matching
      DT_URO/DT_URO2/DT_URO3 and URO_R1/R2/R3 - a serial three-sample
      protocol mirrored by the form's COPRO (stool) and HEMO (blood)
      culture triads.

  # --- HEPA (viral hepatitis) ---
  HAV:
    official_name: Sorologia para hepatite A (Anti-HAV)
    translated_name: Hepatitis A serology result
    description: >
      Result of anti-HAV serology confirming Hepatitis A virus infection -
      one of several virus-specific serology flags on the viral hepatitis
      notification form.
    code_system: none
    source: inferred
    reasoning: HAV = the standard abbreviation for Hepatitis A Virus; HEPA series tests multiple hepatitis viruses.

  HEPATITE_N:
    official_name: Tipo de hepatite (normalizado)
    translated_name: Hepatitis type (normalized code)
    description: >
      Recoded/normalized classification of which hepatitis virus (A/B/C/D/E)
      was identified, derived from the individual virus-specific serology
      flags (like HAV) for easier tabulation - the DATASUS "_N" companion
      pattern.
    code_system: none
    source: inferred
    reasoning: HEPATITE = hepatite; the "_N" suffix matches DATASUS's normalized-field convention seen across SINAN.
