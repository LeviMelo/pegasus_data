system: SINAN
asserted_by: pegasus_data
variables:
  STRESS:
    official_name: O paciente está exposto em seu local de trabalho à ambiente estressante
    translated_name: Exposed to a stressful work environment
    description: >
      Whether the patient's workplace is judged to be a stressful environment,
      one of several occupational risk factors assessed when investigating a
      LER/DORT (repetitive strain injury) case. 1 yes, 2 no, 9 ignored.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, campo 51
  TAREFAS:
    official_name: Limitação e incapacidade para o exercício de tarefas
    translated_name: Limitation/incapacity to perform work tasks
    description: >
      Whether the patient became incapacitated or limited in performing job
      tasks because of the LER/DORT condition under investigation. 1 yes, 2
      no, 9 ignored.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, campo 50
  AFAST_DESG:
    official_name: "Conduta geral: afastamento da situação de desgaste mental"
    translated_name: Removed from the mentally-straining work situation
    description: >
      Whether, as a treatment measure for a work-related mental disorder, the
      patient was withdrawn from the specific work situation causing the
      psychological strain. 1 yes, 2 no.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_TranstornosMentais_v5.pdf, campo 52
  AGENTE_1:
    official_name: Agente tóxico (nome comercial/popular) 1
    translated_name: Toxic agent name, 1st substance
    description: >
      Free-text commercial or popular name of the first toxic substance
      recorded in a poisoning case, entered next to AGENTE_TOX's coded
      classification of the substance group.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 50
  AGENTE_2:
    official_name: Agente tóxico (nome comercial/popular) 2
    translated_name: Toxic agent name, 2nd substance
    description: >
      Free-text commercial or popular name of the second toxic substance
      recorded when a poisoning case involves exposure to more than one
      agent.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 50
  AGENTE_3:
    official_name: Agente tóxico (nome comercial/popular) 3
    translated_name: Toxic agent name, 3rd substance
    description: >
      Free-text commercial or popular name of the third toxic substance
      recorded when a poisoning case involves exposure to three or more
      agents.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 50
  AGENTE_DES:
    official_name: Principal agente causador da dermatose, se outro (especificar)
    translated_name: Causative agent of the skin disease, when "other"
    description: >
      Free-text name of the substance or material that caused the patient's
      occupational skin disease, filled in only when the coded
      causative-agent field is answered 12-Outros (other).
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Dermatoses_v5.pdf, campo 49
  AGENTE_TOX:
    official_name: Grupo do agente tóxico / classificação geral
    translated_name: Toxic agent group classification
    description: >
      Broad category of the substance that poisoned the patient, e.g. 01
      medication, 02 agricultural pesticide, 05 rodenticide, 10 metal, 13
      food or beverage, 14 other, 99 ignored.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 49
  ALCOOL:
    official_name: "Hábitos: Álcool"
    translated_name: Alcohol use habit
    description: >
      Whether the patient has a habitual pattern of alcohol consumption,
      recorded among personal habits when investigating a work-related
      mental disorder. 1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_DRT_TranstornosMentais_v5.pdf, campo 49
  ANIMAL:
    official_name: Espécie do animal agressor
    translated_name: Species of the attacking animal
    description: >
      Species of the animal that bit, scratched, or licked the patient in a
      suspected rabies exposure: 1 dog, 2 cat, 3 bat, 4 monkey, 5 fox, 6
      domestic herbivore, 7 other.
    code_system: internal
    codelists: [CANFELQUNET]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 40
  ANTI_HBS:
    official_name: "Resultados de exame do acidentado (Data Zero): Anti-HBs"
    translated_name: Anti-HBs test result at time of accident
    description: >
      Hepatitis B surface-antibody test result drawn from the exposed worker
      at the moment of a workplace biological-material accident. 1 positive,
      2 negative, 3 inconclusive, 4 not done, 9 ignored.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 52
  ANTI_HCV:
    official_name: "Resultados de exame do acidentado (Data Zero): Anti-HCV"
    translated_name: Anti-HCV test result at time of accident
    description: >
      Hepatitis C antibody test result drawn from the exposed worker at the
      moment of a workplace biological-material accident. 1 positive, 2
      negative, 3 inconclusive, 4 not done, 9 ignored.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 52
  ANTI_HIV:
    official_name: "Resultados de exame do acidentado (Data Zero): Anti-HIV"
    translated_name: Anti-HIV test result at time of accident
    description: >
      HIV antibody test result drawn from the exposed worker at the moment
      of a workplace biological-material accident. 1 positive, 2 negative, 3
      inconclusive, 4 not done, 9 ignored.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 52
  ANT_ARRANH:
    official_name: "Tipo de exposição ao vírus rábico: Arranhadura"
    translated_name: Rabies exposure via scratch
    description: >
      Whether the patient's suspected rabies exposure occurred through a
      scratch from the animal, one of several exposure-route checkboxes on
      the same investigation form. 1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 32
  ANT_CABECA:
    official_name: "Localização do ferimento: Cabeça/pescoço"
    translated_name: "Wound location: head/neck"
    description: >
      Whether the bite or scratch wound from the suspected rabies exposure
      is located on the patient's head or neck. 1 yes, 2 no, 3 unknown.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 33
  ANT_DILACE:
    official_name: "Tipo de ferimento: Dilacerante"
    translated_name: "Wound type: lacerating"
    description: >
      Whether the wound from the animal attack is a lacerating, tearing
      injury, one of several wound-type checkboxes recorded alongside its
      depth and extent. 1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 35
  ANT_DT_EXP:
    official_name: Data da exposição
    translated_name: Date of exposure
    description: >
      Calendar date the animal attack (bite, scratch, or lick) that
      triggered this rabies post-exposure workup actually occurred; must
      fall on or before the visit date.
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 36
  ANT_LAMBED:
    official_name: "Tipo de exposição ao vírus rábico: Lambedura"
    translated_name: Rabies exposure via licking
    description: >
      Whether the suspected rabies exposure occurred through the animal
      licking the patient's skin or a wound, rather than a bite or scratch.
      1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 32
  ANT_MAOS:
    official_name: "Localização do ferimento: Mãos/pés"
    translated_name: "Wound location: hands/feet"
    description: >
      Whether the animal-attack wound is located on the patient's hands or
      feet, one of several body-region checkboxes on the rabies exposure
      form. 1 yes, 2 no, 3 unknown.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 33
  ANT_MEMBRO:
    official_name: "Localização do ferimento: Membros superiores"
    translated_name: "Wound location: upper limbs"
    description: >
      Whether the animal-attack wound is located on the patient's arms
      (upper limbs), distinct from ANT_MEMB_1 which records wounds on the
      legs. 1 yes, 2 no, 3 unknown.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 33
  ANT_MEMB_1:
    official_name: "Localização do ferimento: Membros inferiores"
    translated_name: "Wound location: lower limbs"
    description: >
      Whether the animal-attack wound is located on the patient's legs
      (lower limbs), distinct from ANT_MEMBRO which records wounds on the
      arms. 1 yes, 2 no, 3 unknown.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 33
  ANT_MORDED:
    official_name: "Tipo de exposição ao vírus rábico: Mordedura"
    translated_name: Rabies exposure via bite
    description: >
      Whether the suspected rabies exposure occurred through the animal
      biting the patient, the most frequently recorded route of exposure on
      this form. 1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 32
  ANT_MUCOSA:
    official_name: "Localização do ferimento: Mucosa"
    translated_name: "Wound location: mucosa"
    description: >
      Whether the animal contact reached a mucous membrane (eyes, mouth, or
      nose) rather than intact skin, which raises the rabies
      exposure-risk classification. 1 yes, 2 no, 3 unknown.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 33
  ANT_OUTRO_:
    official_name: "Tipo de exposição ao vírus rábico: Outro"
    translated_name: Rabies exposure via other route
    description: >
      Whether the suspected rabies exposure happened through a route other
      than direct contact, scratch, lick, or bite, such as handling material
      from the animal. 1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 32
  ANT_PROFUN:
    official_name: "Tipo de ferimento: Profundo"
    translated_name: "Wound type: deep"
    description: >
      Whether the animal-attack wound is classified as deep, a depth
      category that raises rabies exposure risk compared with a superficial
      wound. 1 yes, 2 no, 9 ignored.
    code_system: internal
    codelists: [SIM_NAO]
    source: layout_doc
    source_ref: DIC_DADOS_anti_rabico_v5.1.pdf, campo 35
