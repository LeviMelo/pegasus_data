# SIASUS — the dialysis and transplant APAC registry blocks.
#
# These columns come from the 2002 APAC archives that ship as self-extracting
# .exe files — the ones dropped entirely by the earlier scan, and recovered here
# because readers dispatch on content rather than on a file extension. They
# carry a renal-replacement registry: the patient (PAC_), a second patient block
# (PAF_), the examinations (EXA_), and the billing (COB_).
#
# READ THE NOTES ON THE IDENTIFIER FIELDS BEFORE USING ANY OF THIS. These files
# publish CPF numbers, postcodes, dates of birth and HIV and hepatitis serology
# results against one another, in an open FTP directory. That combination
# re-identifies people. This module passes every one of these columns through
# unmodified — masking is not a decision a library makes — and documents them
# plainly so the disclosure is visible rather than buried. See docs/FINDINGS.md.
#
# Left out because nothing found settles them: ATD_SEPERI, AB_PONTBAR,
# AB_T_PRC2..6, AP_TPPRE, AMP_SEAPTO, PA_RCB, PA_RCBDF, APA_CONTN, AN_DTPDR,
# OPC_RESULT, PAC_SITTRA, PAC_INDTRA, PAC_INSTRA, and the EXA_IND* family.
system: SIASUS
asserted_by: pegasus_data

variables:

  # ================================================== direct identifiers

  PAC_CPFPCN:
    official_name: CPF do paciente
    translated_name: Patient CPF
    description: >
      An eleven-digit patient pseudonym. The name reads CPF do paciente, but the
      values are NOT valid CPFs: all 52 in the reference file fail the CPF check
      digit, as do every patient CPF column in the archive (0 of 1,147). Treat it
      as a per-patient key, not as a taxpayer number.
    code_system: none
    source: inferred
    reasoning: >
      CPF PCN reads CPF do paciente and the values are eleven digits, but the CPF
      check digit rejects 100% of them, so the field does not carry a real CPF.
      Measured on SIASUS/APAC/2002/acac0201.exe; see FINDINGS.md 3j.
    notes: >
      A PSEUDONYMOUS identifier, not a direct one — an earlier note here claimed
      it was a CPF in the clear and that was wrong. It remains sensitive: it is
      highly distinct, so it links a patient's records to each other, and it sits
      on a row carrying a real date of birth, postcode, municipality and CID-10
      diagnosis, with HIV serology joinable through PAC_NUM. Passed through
      unmodified deliberately: masking is the Ministry's decision, and a library
      that silently altered it would destroy the evidence of what is published.

  PAF_CPFPCN:
    official_name: CPF do paciente (bloco PAF)
    translated_name: Patient CPF, second block
    description: >
      The same eleven-digit patient pseudonym in the second patient block. All
      98 values fail the CPF check digit.
    code_system: none
    source: inferred
    reasoning: Same CPFPCN stem under the PAF_ prefix; 0 of 98 pass the CPF check digit.
    notes: A PSEUDONYMOUS identifier, not a real CPF. See PAC_CPFPCN.

  EXA_CPFPCN:
    official_name: CPF do paciente (bloco de exames)
    translated_name: Patient CPF, examinations block
    description: >
      The patient pseudonym carried on the examination records — the block that
      also holds EXA_HIV, EXA_HBSAG, EXA_HEPAT and EXA_HLA. All 52 values fail
      the CPF check digit.
    code_system: none
    source: inferred
    reasoning: Same CPFPCN stem under the EXA_ prefix; 0 of 52 pass the CPF check digit.
    notes: >
      A PSEUDONYMOUS identifier sharing a table with HIV and hepatitis serology.
      It does not name anyone by itself. The re-identification risk lies in the
      patient block it joins to (PAC_NUM to EXA_NUM, measured 52/52 one-to-one),
      which carries a real date of birth, sex, municipality and postcode.

  OPC_CPFPCN:
    official_name: CPF do paciente (bloco OPC)
    translated_name: Patient CPF, OPC block
    description: >
      The patient pseudonym in the third block. All 155 rows carry a single
      distinct value, so this column identifies nobody.
    code_system: none
    source: inferred
    reasoning: Same CPFPCN stem under the OPC_ prefix; 0 of 155 pass the CPF check digit, 1 distinct value.
    notes: A PSEUDONYMOUS identifier, effectively constant here. See PAC_CPFPCN.

  PAC_NASCPC:
    official_name: Data de nascimento do paciente
    translated_name: Patient date of birth
    description: >
      Patient's date of birth as AAAAMMDD, real and unobfuscated. This is the
      column that actually carries re-identification risk here: with sex,
      municipality and an eight-digit postcode on the same row, a date of birth
      is the classic quasi-identifier triple, and no direct identifier is needed
      to single someone out.
    code_system: none
    source: inferred
    reasoning: >
      NASC PC reads nascimento do paciente, and the observed values are
      eight-digit dates such as 19350610.
    notes: >
      Identifying in combination. See PAC_CPFPCN.

  OPC_NASCPC:
    official_name: Data de nascimento do paciente (bloco OPC)
    translated_name: Patient date of birth, OPC block
    description: >
      Date of birth on the OPC records, in the same AAAAMMDD form.
    code_system: none
    source: inferred
    reasoning: Same NASCPC stem, same eight-digit date values.
    notes: Identifying in combination. See PAC_CPFPCN.

  PAC_CEPPCN:
    official_name: CEP do paciente
    translated_name: Patient postcode
    description: >
      The patient's postcode, eight digits. Brazilian CEPs resolve to a street
      or a block in urban areas, so this locates a household rather than a
      district.
    code_system: none
    source: inferred
    reasoning: >
      CEP PCN reads CEP do paciente; the observed values are eight-digit codes
      in the Acre range, which is where these files come from.
    notes: >
      Identifying in combination, and more precisely so than most people expect
      — a CEP is not a coarse geography.

  PAF_CEPPCN:
    official_name: CEP do paciente (bloco PAF)
    translated_name: Patient postcode, second block
    description: >
      The patient's postcode on the PAF records.
    code_system: none
    source: inferred
    reasoning: Same CEPPCN stem under the PAF_ prefix.
    notes: Identifying in combination. See PAC_CEPPCN.

  OPC_CEPPCN:
    official_name: CEP do paciente (bloco OPC)
    translated_name: Patient postcode, OPC block
    description: >
      The patient's postcode on the OPC records.
    code_system: none
    source: inferred
    reasoning: Same CEPPCN stem under the OPC_ prefix.
    notes: Identifying in combination. See PAC_CEPPCN.

  PAC_UFNASC:
    official_name: UF de nascimento do paciente
    translated_name: Patient state of birth
    description: >
      Two-letter abbreviation of the state where the patient was born, recorded
      as the postal abbreviation rather than the IBGE numeric code.
    code_system: internal
    source: inferred
    reasoning: >
      UF NASC reads UF de nascimento, and the observed values are letter pairs
      (AC, CE, PA) rather than digits.

  OPC_UFNASC:
    official_name: UF de nascimento do paciente (bloco OPC)
    translated_name: Patient state of birth, OPC block
    description: >
      State of birth on the OPC records, again as a two-letter abbreviation.
    code_system: internal
    source: inferred
    reasoning: Same UFNASC stem under the OPC_ prefix.

  # ======================================= serology: the sensitive results

  EXA_HIV:
    official_name: Resultado do exame de HIV
    translated_name: HIV test result
    description: >
      Result of the patient's HIV test, recorded as positive or negative.
      Dialysis units test for it because it determines which machine and shift a
      patient can use.
    code_system: internal
    source: inferred
    reasoning: >
      HIV needs no expansion, and the observed values are exactly N and P —
      negativo and positivo.
    notes: >
      HIV STATUS ON AN IDENTIFIABLE INDIVIDUAL. This column shares its rows with
      EXA_CPFPCN. Publishing the two together is a disclosure of the most
      sensitive category of health data there is, and it is why these files are
      the subject of a finding rather than merely a column description.

  EXA_HBSAG:
    official_name: Resultado do HBsAg
    translated_name: Hepatitis B surface antigen result
    description: >
      Hepatitis B surface antigen result, positive or negative. A positive HBsAg
      means active infection and, in a dialysis unit, isolation.
    code_system: internal
    source: inferred
    reasoning: >
      HBsAg is the universal abbreviation for the hepatitis B surface antigen;
      observed values are N and P.
    notes: Infection status on an identifiable individual. See EXA_HIV.

  EXA_HEPAT:
    official_name: Resultado do exame de hepatite
    translated_name: Hepatitis test result
    description: >
      Hepatitis test result alongside the specific HBsAg column, positive or
      negative.
    code_system: internal
    source: inferred
    reasoning: HEPAT is hepatite; observed values are N and P.
    notes: Infection status on an identifiable individual. See EXA_HIV.

  EXA_HLA:
    official_name: Tipagem HLA realizada
    translated_name: HLA typing done
    description: >
      Whether HLA tissue typing was carried out — the compatibility test that
      places a dialysis patient on a transplant waiting list.
    code_system: internal
    source: inferred
    reasoning: >
      HLA is the human leukocyte antigen system; the observed values are the
      same N/P flags as the serology fields beside it.

  # ========================================= the clinical record itself

  PAC_DIAGSE:
    official_name: Diagnóstico secundário do paciente
    translated_name: Patient secondary diagnosis
    description: >
      CID-10 code of the condition underlying the renal failure. The observed
      values are dominated by N18.9, chronic kidney disease unspecified, which
      is what a dialysis registry would be expected to hold.
    code_system: external
    codelists: [CID10]
    source: inferred
    reasoning: >
      Bound to CID10 in the catalog, and the observed values (N189, N19) are
      valid CID-10 renal codes.

  PAF_DIAGSE:
    official_name: Diagnóstico secundário do paciente (bloco PAF)
    translated_name: Patient secondary diagnosis, second block
    description: >
      CID-10 code on the PAF records. Its observed values range wider than
      PAC_DIAGSE's — hepatitis, schizophrenia, nutritional codes — so this block
      records comorbidity rather than the renal diagnosis alone.
    code_system: external
    codelists: [CID10]
    source: inferred
    reasoning: >
      Bound to CID10, with observed values (N189, B182, E611, F205) spanning
      several chapters rather than clustering on renal codes.

  PAC_INITRA:
    official_name: Início do tratamento
    translated_name: Treatment start, year-month
    description: >
      Competência in which the patient began renal replacement therapy, as
      AAAAMM. What time on dialysis is counted from.
    code_system: none
    source: inferred
    reasoning: >
      INI TRA reads início do tratamento, and the observed values are six-digit
      year-months (200012, 200103).

  # ================================================ administrative keys

  PAC_NUM:
    official_name: Número da APAC
    translated_name: APAC number
    description: >
      Number of the authorisation this record belongs to. Eleven digits, and the
      key that ties the patient, examination and billing blocks of the archive
      to one another.
    code_system: none
    source: inferred
    reasoning: >
      NUM under the patient prefix, with observed values (00012053965) matching
      those of EXA_NUM row for row — which is what makes it the join key.

  EXA_NUM:
    official_name: Número da APAC (bloco de exames)
    translated_name: APAC number, examinations block
    description: >
      The same authorisation number on the examination records, which is how a
      serology result is attached to a patient.
    code_system: none
    source: inferred
    reasoning: Same eleven-digit values as PAC_NUM.

  OPC_NUM:
    official_name: Número da APAC (bloco OPC)
    translated_name: APAC number, OPC block
    description: >
      The authorisation number on the OPC records.
    code_system: none
    source: inferred
    reasoning: Same eleven-digit APAC number format.

  OPC_AIHNUM:
    official_name: Número da AIH
    translated_name: Hospital admission authorisation number
    description: >
      AIH number where the episode also generated a hospital admission — a link
      out of SIASUS into SIHSUS for the same patient.
    code_system: none
    source: inferred
    reasoning: AIHNUM names the AIH, the hospital authorisation, in an outpatient file.

  EXA_DATREF:
    official_name: Data de referência
    translated_name: Reference year-month
    description: >
      Competência the examination is reported under, as AAAAMM.
    code_system: none
    source: inferred
    reasoning: DAT REF reads data de referência; observed value 200201 is a year-month.

  EXA_CODUNI:
    official_name: Código da unidade
    translated_name: Establishment code
    description: >
      Code of the establishment that performed the examination, in the
      six-character form these 2002-era files use rather than the seven-digit
      CNES that replaced it.
    code_system: external
    source: inferred
    reasoning: >
      COD UNI reads código da unidade, and the observed value (000240) is six
      characters, predating the CNES numbering.

  EXA_GESTAO:
    official_name: Gestão
    translated_name: Managing authority
    description: >
      Which authority manages the establishment — the municipality or the state.
      Recorded as a municipality code, where 9999 in the last four digits marks
      state rather than municipal management.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: >
      Bound to MUNICBR, and the observed value 129999 is the Acre state code
      with the 9999 suffix that DATASUS uses for state-level management.

  COB_VALAP:
    official_name: Valor aprovado
    translated_name: Approved value
    description: >
      Amount approved for payment on the authorisation, in nominal reais at the
      time of billing.
    code_system: none
    source: inferred
    reasoning: >
      COB is cobrança and VAL AP reads valor aprovado; the observed values are
      decimal amounts (86.7600, 1.8500).
    notes: >
      Nominal reais, never deflated. Comparing 2002 to 2020 without an index
      compares two different currencies.

  COB_VALPR:
    official_name: Valor apresentado
    translated_name: Presented value
    description: >
      Amount the establishment presented for payment, before approval. Where it
      differs from COB_VALAP, the difference is what was refused.
    code_system: none
    source: inferred
    reasoning: >
      VAL PR reads valor apresentado, the counterpart of valor aprovado, with
      the same decimal shape.
