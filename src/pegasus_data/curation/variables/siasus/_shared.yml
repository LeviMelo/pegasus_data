    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
    notes: 'Direct personal identifier (CNS). Passed through unmodified per project policy;
      propose no masking, but treat it as sensitive.

      '
  COB_ESF:
    official_name: Indica se a região de atendimento do paciente tem cobertura de Estratégia
      Saúde da Família
    translated_name: ESF coverage indicator
    description: Whether the patient's home area is covered by an Estratégia Saúde da Família
      team, as recorded on the RAAS line.
    code_system: internal
    codelists:
    - COBERTURA
  COMPLEX:
    official_name: Complexidade
    translated_name: Care complexity
    description: Complexity tier of the procedure — basic, medium or high — which governs
      the funding stream and which establishments may perform it.
    code_system: internal
    source: layout_doc
    source_ref: '[APAC-LAYOUT] SIA APAC layout, campo COMPLEX, campo COMPLEX'
  CONDIC:
    official_name: Sigla do Tipo de Gestao
    translated_name: Management-type code
    description: 'Same management-arrangement code as AP_CONDIC/PA_CONDIC, on the unprefixed
      BPA-I/RAAS layouts.

      '
    codelists:
    - TP_GESTAO
    - TP_GEST_C
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  DESTINOPAC:
    official_name: Destino do paciente
    translated_name: Patient destination
    description: DATASUS code for where the patient was routed at the end of this RAAS episode
      (e.g. discharged, referred onward, remained in the same service).
    code_system: internal
    codelists:
    - DESTINO
    - DEST_PSI
    notes: The RAAS home-care (AD) layout prints this field as DESTINO_PAC in the PDF table,
      but 11 characters exceeds the classic DBF field-name limit; the catalogued header, matching
      the RAAS-Psychosocial layout, is DESTINOPAC.
  DTNASC:
    official_name: Data de nascimento
    translated_name: Patient date of birth
    description: Patient's date of birth as text. Combined with the procedure date it gives
      age at treatment, which SIA does not carry directly.
    code_system: none
    source: layout_doc
    source_ref: '[APAC-LAYOUT] SIA APAC layout, campo DTNASC, campo DTNASC'
  DT_ATEND:
    official_name: Ano e mes do Atendimento
    translated_name: Care month (competence)
    description: 'AAAAMM month the care was delivered, on the BPA-I/RAAS layouts - the equivalent
      of AP_CMP/PA_CMP for these instruments.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather
      than a real vocabulary for this field.

      '
  DT_FIM:
    official_name: Data de Fim
    translated_name: Record end date
    description: End of the validity/reference period this RAAS record covers, AAAAMMDD —
      the record's own period, not the date of a specific attendance (which is FIM, when present).
    code_system: none
  DT_INICIO:
    official_name: Data de Início
    translated_name: Record start date
    description: Start of the validity/reference period this RAAS record covers, AAAAMMDD
      — the record's own period, not the date of a specific attendance (which is INICIO, when
      present).
    code_system: none
  DT_MOTCOB:
    official_name: Data da ocorrência no caso de alta, transferência ou óbito
    translated_name: Date of discharge/transfer/death
    description: Date, AAAAMMDD, the event named in MOT_COB (discharge, transfer, or death)
      actually occurred.
    code_system: none
  DT_PROCESS:
    official_name: Ano e mes de Processamento
    translated_name: Processing month
    description: 'AAAAMM month DATASUS processed this record - the BPA-I/RAAS equivalent of
      AP_MVM/PA_MVM. Can lag DT_ATEND when submission or reprocessing is late.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather
      than a real vocabulary for this field.

      '
  ETNIA:
    official_name: Etnia
    translated_name: Indigenous ethnicity
    description: Indigenous ethnic group, recorded only where race/colour is indígena. Blank
      elsewhere by design rather than missing.
    code_system: internal
    source: layout_doc
    source_ref: '[APAC-LAYOUT] SIA APAC layout, campo ETNIA, campo ETNIA'
  FIM:
    official_name: Data de Fim do Atendimento (DDMMAAAA)
    translated_name: Attendance end date
    description: End date of one specific attendance recorded on this RAAS line — distinct
      from DT_FIM, the whole record's reference-period end.
    code_system: none
    notes: Documented in DDMMAAAA order (day-month-year), unlike the AAAAMMDD order almost
      every other SIASUS date field uses — sort or parse it accordingly.
  GESTAO:
    official_name: Gestão
    translated_name: Managing authority
    description: IBGE code of the municipality managing the establishment's contract, or the
      state where management is state-level. The MANAGER, which is not where care happened
      or where the patient lives.
    code_system: external
    source: layout_doc
    source_ref: '[APAC-LAYOUT] SIA APAC layout, campo GESTAO, campo GESTAO'
  IDADEPAC:
    official_name: Idade do Paciente
    translated_name: Patient's age
    description: 'Patient''s age as a plain number, in the unit given by TPIDADEPAC (years,
      months or days).

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  INICIO:
    official_name: Data de Início do Atendimento (DDMMAAAA)
    translated_name: Attendance start date
    description: Start date of one specific attendance recorded on this RAAS line — distinct
      from DT_INICIO, the whole record's reference-period start.
    code_system: none
    notes: Documented in DDMMAAAA order (day-month-year), unlike the AAAAMMDD order almost
      every other SIASUS date field uses — sort or parse it accordingly.
  MN_IND:
    official_name: Estabelecimento Mantido / Individual
    translated_name: Maintained-vs-individual establishment flag
    description: 'Same maintained-vs-standalone establishment flag as AP_MN_IND, on the unprefixed
      BPA-I/RAAS layouts.

      '
    codelists:
    - MANT_IND
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  MOT_COB:
    official_name: Motivo de Saída/Permanência
    translated_name: Reason for discharge/continuation
    description: DATASUS code for why the patient left or remained in the RAAS program (e.g.
      discharge, transfer, death, continued care).
    code_system: internal
    codelists:
    - MOTSAIPE
  MUNPAC:
    official_name: UF+Municipio de residencia do paciente
    translated_name: Patient's home municipality IBGE code
    description: '7-char IBGE UF+municipality code of the patient''s residence - or, per the
      layout''s own note, of the establishment instead whenever the instrument does not capture
      patient identity (as happens on BPA-Consolidado-sourced rows). Do not assume every value
      here is a true residence.

      '
    codelists:
    - AC_MUNICIP
    - '..._MUNICIP (per-UF IBGE municipality lists)'
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
    notes: 'Falls back to the establishment''s own municipality when the source instrument
      (e.g. BPA-C) does not identify the patient - check the originating instrument before
      treating this as residence.

      '
  NACION_PAC:
    official_name: Nacionalidade do paciente
    translated_name: Patient nationality
    description: DATASUS nationality code of the patient on the RAAS record.
    code_system: internal
    codelists:
    - UFNACIO
  NAT_JUR:
    official_name: Natureza jurídica
    translated_name: Establishment legal nature (CONCLA)
    description: Legal nature of the executing establishment under CONCLA, carried onto the
      production record so the payer mix can be read without joining CNES.
    code_system: internal
    source: layout_doc
    source_ref: '[APAC-LAYOUT] SIA APAC layout, campo NAT_JUR, campo NAT_JUR'
  ORIGEM_PAC:
    official_name: Origem do paciente
    translated_name: Patient origin
    description: DATASUS code for where the patient came from into this RAAS episode (e.g.
      spontaneous demand, referral from another service).
    code_system: internal
    codelists:
    - ORIGEM
    - ORIG_PSI
  PA_CLASS_S:
    official_name: Classificação do Serviço
    translated_name: Service classification
    description: CNES classification code that refines PA_SRV, the specialised-service code
      on the same RAAS line — the pair (service, classification) together identifies the exact
      CNES service offered.
    code_system: external
    notes: The layout document prints this field as PA_CLAS_S (one S); the catalogued header
      is PA_CLASS_S (two), 10 characters, matching the classic DBF field-name limit — almost
      certainly the same field.
  PA_PROC_ID:
    official_name: Codigo do Procedimento Ambulatorial
    translated_name: Outpatient procedure code (SIGTAP)
    description: '10-digit SIGTAP procedure code identifying what was done, with catalog evidence
      showing it also resolves against SIGTAP''s group/subgroup/form hierarchy tables.

      '
    codelists:
    - TB_FORMA
    - TB_GRUPO
    - TB_SIGTAW
    - TB_SUBGR
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5'
  PA_QTDAPR:
    official_name: Quantidade Aprovada
    translated_name: Approved quantity
    description: 'Quantity of the procedure actually approved after auditing, which can be
      lower than PA_QTDPRO (submitted quantity) when part of the claim is rejected. Production/volume
      statistics should normally use PA_QTDAPR, not PA_QTDPRO, to avoid counting work that
      was billed but not paid for.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5'
  PA_QTDPRO:
    official_name: Quantidade Produzida (APRESENTADA)
    translated_name: Submitted (presented) quantity
    description: 'Quantity of the procedure as originally submitted/claimed by the provider,
      before auditing. See PA_QTDAPR for the quantity actually approved.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 2.3 (Layout do arquivo de Producao Ambulatorial: PAUFAAMM.DBF), p.3-5'
    notes: 'This is the pre-audit submitted volume, not the paid volume; PA_QTDAPR is usually
      the right column for production statistics.

      '
  PA_SRV:
    official_name: Serviço Especializado
    translated_name: Specialised service
    description: CNES specialised-service code identifying the kind of service (e.g. a specific
      outpatient clinic type) that produced this RAAS record; paired with PA_CLASS_S for the
      full CNES service/classification code.
    code_system: external
    codelists:
    - S_CLASSEN
  PERMANEN:
    official_name: Permanência em Atendimento
    translated_name: Time in attendance
    description: Length of time the patient remained under this RAAS service (unit set by
      the reporting instrument, not spelled out in the layout excerpt covering this batch).
    code_system: none
  QTDATE:
    official_name: Quantidade de Atendimentos
    translated_name: Number of attendances
    description: Count of individual attendances/contacts this RAAS record aggregates.
    code_system: none
  QTDPCN:
    official_name: Quantidade de pacientes
    translated_name: Number of patients
    description: Count of distinct patients this RAAS record aggregates (relevant for group/collective
      activities).
    code_system: none
  RACACOR:
    official_name: Raça/Cor
    translated_name: Race/colour
    description: Patient's self-declared colour or race on the IBGE categories. SIA, SIH and
      SINASC each code these differently, so never pool without recoding.
    code_system: internal
    source: layout_doc
    source_ref: '[APAC-LAYOUT] SIA APAC layout, campo RACACOR, campo RACACOR'
  SEXOPAC:
    official_name: Sexo do paciente
    translated_name: Patient's sex
    description: 'Patient''s sex on the BPA-I/RAAS layouts, coded per the same SEXO codelist
      used across SIASUS.

      '
    codelists:
    - SEXO
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  TIPPRE:
    official_name: Tipo de Prestador
    translated_name: Provider-type code
    description: 'Same provider-type concept as AP_TIPPRE/PA_TIPPRE, on the unprefixed BPA-I/
      RAAS-Psicossocial layouts. No codelist is bound to this exact unprefixed field name
      in this catalog build, unlike its AP_/PA_-prefixed siblings.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  TPIDADEPAC:
    official_name: Tipo da Idade do paciente
    translated_name: Age-unit code
    description: 'Codes whether IDADEPAC is expressed in years, months or days, computed from
      the patient''s date of birth - the BPA-I/RAAS analogue of AP_COIDADE.

      '
    codelists:
    - IDADE18
    - IDADEDET
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  TPUPS:
    official_name: Tipo de Estabelecimento
    translated_name: Establishment type code
    description: 'Same CNES establishment-type code as AP_TPUPS, on the unprefixed BPA-I/RAAS
      layouts.

      '
    codelists:
    - TP_ESTAB
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
  UFMUN:
    official_name: UF+Municipio do estabelecimento
    translated_name: Establishment's municipality IBGE code
    description: '7-char IBGE UF+municipality code of where the establishment is located,
      on the unprefixed BPA-I/RAAS layouts - the place of care, not the patient''s residence
      (MUNPAC).

      '
    codelists:
    - AC_MUNICIP
    - '..._MUNICIP (per-UF IBGE municipality lists)'
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 5.2 (Layout do arquivo de BPA-I: BIUFAAMM.DBF), p.17-18 — same field names/definitions
      appear in section 4.1 SAD*.DBF and 4.2 PS*.DBF'
