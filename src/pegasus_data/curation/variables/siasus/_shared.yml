# SIASUS — columns carried by more than one dataset.
#
# The notification header and other cross-dataset fields. Described once
# against the system, because that is the scope on which they are the
# same column.
system: SIASUS
asserted_by: pegasus_data
variables:
  AB_ANOACOM:
    official_name: Ano do acompanhamento
    translated_name: Follow-up year
    description: 'Year of the post-operative follow-up this record reports. Bariatric surgery
      is authorised with follow-up attached, so a patient generates several of these after
      one operation.

      '
    code_system: none
    source: inferred
    reasoning: 'C(4) with ANO in the name; ACOM is acompanhamento, which is what the bariatric
      APAC exists to record.

      '
  AB_DTCIRG2:
    official_name: Data da segunda cirurgia
    translated_name: Date of second surgery
    description: 'Date of a second operation, whether a revision or a reconstructive procedure
      after weight loss.

      '
    code_system: internal
    source: def
    source_ref: ANOMES2008.CNV
    reasoning: C(8) date bound to ANOMES2008; the second surgery date.
  AB_DTCIRUR:
    official_name: Data da cirurgia bariátrica
    translated_name: Date of bariatric surgery
    description: 'When the operation was performed. Follow-up authorisations are measured
      from here, so it anchors the whole post-surgical series.

      '
    code_system: internal
    source: def
    source_ref: ANOMES2008.CNV
    reasoning: C(8) date bound to ANOMES2008; DTCIRUR reads data da cirurgia.
  AB_IMC:
    official_name: Índice de massa corporal
    translated_name: Body mass index
    description: 'Patient''s BMI, which is the criterion bariatric surgery is authorised against
      — the thresholds in the Ministry''s own protocol are stated in it.

      '
    code_system: none
    source: inferred
    reasoning: 'IMC is the Portuguese initialism for body mass index; C(3) fits a value in
      whole units, which is how the authorisation thresholds are written.

      '
  AB_MESACOM:
    official_name: Mês do acompanhamento
    translated_name: Follow-up month
    description: 'Month of the follow-up, paired with AB_ANOACOM. Together they place the
      visit relative to the date of surgery.

      '
    code_system: none
    source: inferred
    reasoning: C(2) with MES in the name, the companion of AB_ANOACOM.
  AB_NUMAIH:
    official_name: Número da AIH
    translated_name: Hospital admission authorisation number
    description: 'AIH number of the hospital admission the bariatric procedure was performed
      under. This is the join back to SIH: the outpatient follow-up recorded here and the
      operation itself are two different systems'' records of one episode.

      '
    code_system: none
    source: inferred
    reasoning: 'Declared C(13), which is exactly the AIH number width in SIHSUS, and NUMAIH
      names it.

      '
    notes: 'A real key into SIHSUS, and one of the few explicit cross-system links DATASUS
      publishes. Worth using rather than matching on patient attributes.

      '
  AB_NUMAIH2:
    official_name: Número da segunda AIH
    translated_name: Second admission authorisation number
    description: 'AIH number of a second admission attached to the same bariatric follow-up,
      where the treatment involved more than one hospital stay.

      '
    code_system: none
    source: inferred
    reasoning: 'Same C(13) AIH width as AB_NUMAIH, with the numeric suffix DATASUS uses for
      a repeated field.

      '
  AB_PONTBAR:
    official_name: Pontuação de Barros
    translated_name: Barros score
    description: 'Single-digit Barros score entered on the bariatric-surgery follow-up authorisation,
      from a scale used in Brazilian bariatric practice to grade a patient''s post-operative
      weight-loss outcome against expectation.

      '
    code_system: none
    source: web
    reasoning: 'The same 2014 DATASUS layout documents APA_PONTBARR, one character, as "Pontuacao
      de Barros" in the pre-2013 post-bariatric-surgery follow-up block, next to a companion
      "Tabela de Barros" field. AB_PONTBAR is one character under the bariatric AB_ prefix,
      matching that field; it is flagged shared because both the pre- and post-op bariatric
      tables carry it.

      '
  AB_PRCAIH2:
    official_name: Segundo procedimento da AIH
    translated_name: AIH procedure 2
    description: 'A second hospital procedure on the same admission. The numbered slots exist
      because a bariatric admission often carries several billed procedures.

      '
    code_system: internal
    source: def
    source_ref: PROC_AIH.CNV
    reasoning: C(10) SIGTAP procedure code bound to PROC_AIH, slot 2.
  AB_PRCAIH3:
    official_name: Terceiro procedimento da AIH
    translated_name: AIH procedure 3
    description: A third hospital procedure on the same admission. See AB_PRCAIH2.
    code_system: internal
    source: def
    source_ref: PROC_AIH.CNV
    reasoning: C(10) SIGTAP procedure code bound to PROC_AIH, slot 3.
  AB_PROCAIH:
    official_name: Procedimento principal da AIH
    translated_name: Principal AIH procedure
    description: 'The hospital procedure code for the bariatric operation itself, carried
      on the outpatient authorisation so the surgery and its follow-up can be joined across
      SIH and SIA.

      '
    code_system: internal
    source: def
    source_ref: PROC_CB.CNV
    reasoning: C(10) SIGTAP procedure code bound to PROC_CB and the SIGTAP table.
  AB_TABBARR:
    official_name: Classificação BAROS
    translated_name: BAROS outcome score
    description: 'The BAROS outcome band — insufficient, acceptable, good, very good or excellent.
      A composite of weight loss, comorbidity resolution and quality of life, and the standard
      way bariatric surgery is judged to have worked.

      '
    code_system: internal
    source: def
    source_ref: TAB_BAROS.CNV
    reasoning: 'Bound to TAB_BAROS, whose values are insuficiente, aceitável, bom, muito bom
      and excelente — the BAROS bands.

      '
  AP_ALTA:
    official_name: Indicador de Alta
    translated_name: Discharge indicator
    description: 'Flags whether the APAC episode ended in the patient''s discharge from the
      treatment programme (e.g. finishing a chemo/radiotherapy or dialysis course). Bound
      to the ALTA codelist; the column itself is the flag, not the discharge date - AP_DTOCOR
      carries when it happened.

      '
    codelists:
    - ALTA
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_APACANT:
    official_name: Numero APAC Anterior
    translated_name: Previous APAC number
    description: 'The AP_AUTORIZ number of the prior APAC this one continues, letting an analyst
      chain successive renewals (AP_TPAPAC=2) of one long-running treatment episode into a
      single patient history.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_AUTORIZ:
    official_name: Numero da APAC
    translated_name: APAC authorization number
    description: 'The authorization number DATASUS assigns to the APAC record itself, built
      as UF+AA+T+sequential+check digit (e.g. state, year, laudo type, a sequence, a check
      digit) per the layout''s own formation rule. It identifies one authorization, not one
      procedure line - an APAC with several procedures repeats this number across the corresponding
      PA-file rows (see PA_AUTORIZ).

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CATEND:
    official_name: Carater do Atendimento
    translated_name: Type of care episode
    description: 'Codes the legal/administrative character of the care episode behind the
      APAC (e.g. elective vs urgent vs follow-up), drawn from the CARAT_AT codelist shared
      with the production file''s PA_CATEND/CATEND.

      '
    codelists:
    - CARAT_AT
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CEPPCN:
    official_name: CEP do endereco do paciente
    translated_name: Patient's postal code (CEP)
    description: 'The 8-digit Brazilian postal code of the patient''s address as recorded
      on the APAC. In dense urban CEPs this can resolve to a single street or building, so
      it is a fine-grained locator even though it carries no lookup label of its own.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'Combined with age/sex/CNS this narrows re-identification risk considerably; handle
      with the same care as a direct identifier even though it is not one.

      '
  AP_CIDCAS:
    official_name: CID Causas Associadas
    translated_name: Associated-cause ICD-10 code
    description: 'ICD-10 code for a condition associated with (but not the primary reason
      for) the APAC, drawn from the S_CID codelist. Distinct from AP_CIDPRI (primary) and
      AP_CIDSEC (secondary).

      '
    codelists:
    - S_CID
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CIDPRI:
    official_name: CID Principal
    translated_name: Primary ICD-10 code
    description: 'ICD-10 code for the main diagnosis justifying the APAC, from the S_CID codelist.

      '
    codelists:
    - S_CID
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CIDSEC:
    official_name: CID Secundario
    translated_name: Secondary ICD-10 code
    description: 'ICD-10 code for a secondary diagnosis on the APAC, alongside AP_CIDPRI (primary)
      and AP_CIDCAS (associated cause).

      '
    codelists:
    - S_CID
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CMP:
    official_name: Data de Atendimento ao paciente / Competencia
    translated_name: Care competence month
    description: 'The AAAAMM competence (year-month) the APAC''s care refers to, as opposed
      to AP_MVM which is when DATASUS processed the batch. The two can diverge by weeks or
      months when a unit submits late or a record is reprocessed, so aggregating by AP_CMP
      reflects when care happened while AP_MVM reflects when it was recorded.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'SPURIOUS-BINDING: the catalog binds ANOMES2008/ANO_2008/SEME2008 to this column.
      Those are TabNet''s auto-derived Ano/Ano-mes/Semester tabulation axes for a date field,
      not a coded vocabulary of AP_CMP''s own values - the binding belongs to the catalog''s
      axis-detection, not to this column.

      '
  AP_CNPJCPF:
    official_name: CNPJ do Estabelecimento executante
    translated_name: Executing establishment's CNPJ/CPF
    description: 'Tax ID of the establishment that executed the APAC procedure. The field
      name (CNPJ**CPF**) signals that when the executant is an individual professional rather
      than a legal entity, this can hold a personal CPF instead of a company CNPJ.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'May hold a personal CPF rather than an establishment CNPJ - treat as a personal
      identifier when 11 digits (CPF length) rather than 14 (CNPJ length).

      '
  AP_CNPJMNT:
    official_name: CNPJ da Mantenedora do estabelecimento
    translated_name: Establishment's parent-organization CNPJ
    description: 'CNPJ of the legal entity that maintains/owns the executing establishment
      (its "mantenedora"), or all zeros when the establishment has none (i.e. it is not part
      of a maintained network).

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CNSPCN:
    official_name: Numero do CNS do paciente
    translated_name: Patient's CNS (national health card) number
    description: 'The patient''s Cartao Nacional de Saude number - Brazil''s unique per-person
      health-system identifier.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'Direct personal identifier (CNS). Passed through unmodified per project policy;
      propose no masking, but treat it as sensitive.

      '
  AP_CODEMI:
    official_name: Codigo do Orgao emissor
    translated_name: Issuing-body code
    description: Code of the body that emitted and authorised the APAC. No codelist is bound,
      so which registry the numbers belong to is unconfirmed and the values are returned as
      filed.
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: The layout gives the field's label and nothing further; the emitting-body registry
      it draws on is not named there.
  AP_CODUNI:
    official_name: Codigo do Estabelecimento no CNES
    translated_name: Executing establishment's CNES code
    description: 'The 7-digit CNES (Cadastro Nacional de Estabelecimentos de Saude) code of
      the facility that executed the APAC - a real, independently-maintained national facility
      registry, not a DATASUS- only invention.

      '
    codelists:
    - CADGERAC
    - CADGERAL (per-state CNES facility registries)
    code_system: external
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_COIDADE:
    official_name: Codigo da Idade do paciente
    translated_name: Patient age-unit code
    description: 'Codes which unit AP_NUIDADE is expressed in (years vs. months vs. days for
      very young patients) rather than the age value itself.

      '
    codelists:
    - IDADE18
    - IDADEDET
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_CONDIC:
    official_name: Sigla do Tipo de Gestao
    translated_name: Management-type code
    description: 'Marks the SUS management arrangement (state-managed vs. municipality-managed,
      full vs. partial) under which the establishment or municipality is accredited for this
      APAC.

      '
    codelists:
    - TPGEST_C
    - TP_GESTAO
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_DTAUT:
    official_name: Data da Autorizacao
    translated_name: Authorization date
    description: 'AAAAMMDD date the APAC was authorized by the regulating body - normally
      on or after AP_DTSOLIC (request date) and at or before AP_DTINIC (validity start).

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 (TabNet''s auto date axes),
      not a real value codelist for this column.

      '
  AP_DTFIM:
    official_name: Data de FIM validade
    translated_name: Validity end date
    description: 'AAAAMMDD date the APAC''s authorization period ends. AP_DTOCOR overrides
      this when the episode closes early (discharge, transfer, death).

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists, not
      a real vocabulary for this field.

      '
  AP_DTINIC:
    official_name: Data de INICIO validade
    translated_name: Validity start date
    description: 'AAAAMMDD date the APAC''s authorization period begins - the start of the
      window during which the procedures it authorizes may be billed.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists, not
      a real vocabulary for this field.

      '
  AP_DTOCOR:
    official_name: Data de Ocorrencia
    translated_name: Occurrence date (overrides validity end)
    description: 'AAAAMMDD date an early-closing event (discharge, transfer, death) happened;
      when populated it replaces AP_DTFIM as the episode''s real end date.

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists rather
      than a real vocabulary for this field.

      '
  AP_DTSOLIC:
    official_name: Data da Solicitacao
    translated_name: Request date
    description: 'AAAAMMDD date the requesting unit (AP_UNISOL) asked for the APAC, upstream
      of AP_DTAUT (authorization) and AP_DTINIC (validity start).

      '
    code_system: none
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
    notes: 'SPURIOUS-BINDING: bound to ANOMES2008/ANO_2008/SEME2008 date-axis codelists, not
      a real vocabulary for this field.

      '
  AP_ENCERR:
    official_name: Indicador de Encerramento
    translated_name: Closure indicator
    description: 'Flags that the APAC episode was formally closed/terminated (as opposed to
      remaining open under AP_PERMAN or ending in AP_ALTA/AP_OBITO/AP_TRANSF).

      '
    codelists:
    - ENCERRAM
    code_system: internal
    source: layout_doc
    source_ref: 'ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      section 3.4.1 (Layout do arquivo de Laudos Diversos: ADUFAAMM.DBF), p.6 — identical
      field block repeated across all APAC sub-layouts (AM/AN/AQ/AR/AB/ACF/ATD), sections
      3.4.2-3.4.8'
  AP_ETNIA:
    official_name: Etnia do paciente
    translated_name: Patient's indigenous ethnicity
    description: 'Code for the patient''s specific indigenous ethnicity (e.g. Guarani, Kaingang),
      drawn from the DATASUS/FUNAI ethnicity table. Only meaningful, and normally only filled,
      when AP_RACACOR = 05 (Indigena).

      '
    code_system: external
    source: layout_doc
