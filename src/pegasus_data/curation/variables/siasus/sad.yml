# SIA.SAD — RAAS, home care
# RAAS Atenção Domiciliar
#
# Home-care actions under the Melhor em Casa programme.
system: SIASUS
asserted_by: pegasus_data

variables:
  CO_INE:
    official_name: Identificador Nacional de Equipe
    translated_name: National care-team identifier
    description: 'National ID number of the primary-care or home-care team (e.g. Estratégia
      Saúde da Família) attending the case, assigned once per team so its history can
      be tracked across CNES facility changes.

      '
    code_system: external
    # The team registry in the SIA kit (DBF/INE_EQUIPE_BR: 107,438 teams, CHAVE ->
    # name), 10 digits as the column (ADR-0100).
    codelist: INE_EQUIPE_BR
    source: web
    source_ref: 'wiki.saude.gov.br/cnes "Cadastro de Equipes" - INE defined as the
      team''s national identification code

      '
  PA_CID:
    official_name: CID do atendimento
    translated_name: Diagnosis
    description: CID-10 diagnosis recorded on the home care action.
    code_system: external
    codelists:
    - ICD10
    - S_CID  # SIA's own table: 0000 CID NAO INFORMADO, 000 CID NÃO IDENTIFICADO
    source: layout_doc
    source_ref: 'Informe Técnico SIASUS 2019-07 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      §4.1 Atenção Domiciliar (SAD*.DBF) SEQ 38 ''CID do Procedimento'''
  PA_EQUIPE:
    official_name: Equipe
    translated_name: Health team identifier
    description: 'Identifier of the health team credited with the production record,
      for procedures delivered by a registered team rather than an individual professional.

      '
    code_system: external
    source: layout_doc
    source_ref: 'Informe Técnico SIASUS 2019-07 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      §4.1 Atenção Domiciliar (SAD*.DBF) SEQ 36 CHAR(12) ''Código da Equipe (somente
      para o Instrumento de registro RAAS)'''
  PA_TP_EQP:
    official_name: Tipo de equipe
    translated_name: Team type
    description: 'Which kind of team delivered the home care action, on the same team
      codelist CNES uses. Home care is delivered by designated multiprofessional teams
      rather than by individuals.

      '
    code_system: internal
    source: def
    source_ref: EQUIPE.CNV
    reasoning: Bound to EQUIPE, the CNES team-type codelist.
