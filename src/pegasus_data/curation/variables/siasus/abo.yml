  AB_T_PRC2:
    official_name: Campo AB_T_PRC2 (rótulo não documentado)
    translated_name: Post-bariatric follow-up field 2 (probably months since surgery)
    description: 'Three-character field of the post-bariatric follow-up APAC, one of
      five (AB_T_PRC2-AB_T_PRC6). The documented post-2013 follow-up layout carries five
      N(3) fields ''Tempo pós cirurgia bariátrica (meses)'', each paired with a flag for
      a post-bariatric plastic procedure (abdominal, breast, arm, thigh and
      circumferential dermolipectomy), which makes this most likely the months since
      surgery for one of those procedures rather than a procedure-type code. The pairing
      of each column with a procedure is not documented.'
    code_system: none
    source: inferred
    reasoning: 'AB_ is the bariatric-surgery block prefix and T_PRC reads tipo de
      procedimento; the trailing 2 matches its position in the numbered follow-up family
      (T_PRC2 through T_PRC6). No value evidence is present in the catalog to confirm
      the exact codes used. Reviewed 2026-09-28: no documentation found (the DBF column
      is not named in Informe Técnico SIASUS 2019-07; ''Layout da interface texto do
      APAC e do SIA - layout INTERNO'' (DATASUS/SIA, 11/04/2014) — local:
      sources/layout_interno.pdf (text: sources/apac_layout.txt), ''Acompanh. PÓS
      CIRURGIA BARIATRICA'' part (after 03/2013), seq 27-35, lists five ''Tempo pós
      cirugia bariátrica (meses)'' N(3) fields, which contradicts the earlier
      procedure-type reading).'
