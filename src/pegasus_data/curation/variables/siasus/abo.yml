  AP_ADESAO:
    official_name: Adesão ao tratamento
    translated_name: Adherence to treatment
    description: 'Whether the patient is following the post-surgical programme. Bariatric
      outcomes depend on adherence, so it is recorded alongside the clinical measures
      rather than treated as a soft factor.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; ADESAO reads adesão.
  AP_APACAN:
    official_name: Número da APAC anterior
    translated_name: Previous APAC number
    description: 'Number of the APAC this one continues. Continuing therapies — dialysis,
      radiotherapy — are authorised in successive APACs, and this is the link that
      chains them into one course of treatment.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Informe Técnico SIASUS 2019-07 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      common APAC header (e.g. §3.4.6 SEQ 38) AP_APACANT CHAR(13) ''Número APAC
      Anterior''; this ABO column is the same field under a 9-character name'
    notes: 'Following this chain is how a course of treatment is reconstructed. Rows
      are authorisations, not patients or episodes.

      '
  AP_ATV_FIS:
    official_name: Prática de atividade física
    translated_name: Physical activity
    description: Whether the patient takes regular physical activity, part of the follow-up
      assessment.
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; ATV_FIS reads atividade física.
  AP_CID_C1:
    official_name: CID de comorbidade 1
    translated_name: Comorbidity 1
    description: 'First comorbidity, as a CID-10 code. Bariatric surgery is indicated
      partly by comorbidity, and their resolution is how it is judged, so the five
      slots are both the indication and the outcome.

      '
    code_system: external
    codelists:
    - ICD10
    - S_CID  # SIA's own table: 0000 CID NAO INFORMADO, 000 CID NÃO IDENTIFICADO
    source: inferred
    reasoning: 'C(4) CID-10 code bound to CID_COM, whose labels are conditions such as
      hipertensão arterial sistêmica and diabetes mellitus. Reviewed 2026-09-28: no
      documentation found (searched Informe Técnico SIASUS 2019-07 and the APAC internal
      layout, whose bariatric parts carry S/N flags for five named comorbidities plus a
      single ''Outros (CID10)'' field, not five comorbidity CIDs).'
  AP_CID_C2:
    official_name: CID de comorbidade 2
    translated_name: Comorbidity 2
    description: Second comorbidity, as a CID-10 code. See AP_CID_C1.
