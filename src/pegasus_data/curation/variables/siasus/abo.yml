# SIA.ABO — APAC, post-bariatric follow-up
# APAC de Acompanhamento pós Cirurgia Bariátrica
#
# One authorisation for follow-up care after bariatric surgery.
system: SIASUS
asserted_by: pegasus_data

variables:
  AB_PRCAIH4:
    official_name: Quarto procedimento da AIH
    translated_name: AIH procedure 4
    description: A fourth hospital procedure, on the follow-up dataset. See AB_PRCAIH2.
    code_system: internal
    source: def
    source_ref: PROC_AIH.CNV
    reasoning: C(10) SIGTAP procedure code bound to PROC_AIH, slot 4.
  AB_PRCAIH5:
    official_name: Quinto procedimento da AIH
    translated_name: AIH procedure 5
    description: A fifth hospital procedure. See AB_PRCAIH2.
    code_system: internal
    source: def
    source_ref: PROC_AIH.CNV
    reasoning: C(10) SIGTAP procedure code bound to PROC_AIH, slot 5.
  AB_PRCAIH6:
    official_name: Sexto procedimento da AIH
    translated_name: AIH procedure 6
    description: A sixth hospital procedure. See AB_PRCAIH2.
    code_system: internal
    source: def
    source_ref: PROC_AIH.CNV
    reasoning: C(10) SIGTAP procedure code bound to PROC_AIH, slot 6.
  AB_T_PRC2:
    official_name: Tipo de procedimento (2ª consulta de acompanhamento)
    translated_name: Procedure type, 2nd follow-up visit
    description: 'Three-character procedure-type code for the second scheduled post-bariatric
      follow-up visit on this ABO authorisation. Follow-up after bariatric surgery
      is billed across a fixed multi-visit schedule; this column and its T_PRC3-T_PRC6
      siblings record each visit''s procedure classification in turn.

      '
    code_system: none
    source: inferred
    reasoning: 'AB_ is the bariatric-surgery block prefix and T_PRC reads tipo de procedimento;
      the trailing 2 matches its position in the numbered follow-up family (T_PRC2
      through T_PRC6). No value evidence is present in the catalog to confirm the exact
      codes used.

      '
  AB_T_PRC3:
    official_name: Tipo de procedimento (3ª consulta de acompanhamento)
    translated_name: Procedure type, 3rd follow-up visit
    description: 'Three-character procedure-type code for the third scheduled post-bariatric
      follow-up visit on this ABO authorisation, the next entry after AB_T_PRC2 in
      the same numbered family.

      '
    code_system: none
    source: inferred
    reasoning: Same T_PRC stem as AB_T_PRC2, one position later in the sequence.
  AB_T_PRC4:
    official_name: Tipo de procedimento (4ª consulta de acompanhamento)
    translated_name: Procedure type, 4th follow-up visit
    description: 'Three-character procedure-type code for the fourth scheduled post-bariatric
      follow-up visit on this ABO authorisation, continuing the AB_T_PRC2/T_PRC3 series.

      '
    code_system: none
    source: inferred
    reasoning: Same T_PRC stem as AB_T_PRC2, two positions later in the sequence.
  AB_T_PRC5:
    official_name: Tipo de procedimento (5ª consulta de acompanhamento)
    translated_name: Procedure type, 5th follow-up visit
    description: 'Three-character procedure-type code for the fifth scheduled post-bariatric
      follow-up visit on this ABO authorisation, continuing the AB_T_PRC2-T_PRC4 series.

      '
    code_system: none
    source: inferred
    reasoning: Same T_PRC stem as AB_T_PRC2, three positions later in the sequence.
  AB_T_PRC6:
    official_name: Tipo de procedimento (6ª consulta de acompanhamento)
    translated_name: Procedure type, 6th follow-up visit
    description: 'Three-character procedure-type code for the sixth scheduled post-bariatric
      follow-up visit on this ABO authorisation, the last in the AB_T_PRC2-T_PRC6 series
      recorded on this form.

      '
    code_system: none
    source: inferred
    reasoning: Same T_PRC stem as AB_T_PRC2, four positions later in the sequence.
  AP_ADESAO:
    official_name: Adesão ao tratamento
    translated_name: Adherence to treatment
    description: 'Whether the patient is following the post-surgical programme. Bariatric
      outcomes depend on adherence, so it is recorded alongside the clinical measures
      rather than treated as a soft factor.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; ADESAO reads adesão.
  AP_APACAN:
    official_name: Número da APAC anterior
    translated_name: Previous APAC number
    description: 'Number of the APAC this one continues. Continuing therapies — dialysis,
      radiotherapy — are authorised in successive APACs, and this is the link that
      chains them into one course of treatment.

      '
    code_system: none
    source: inferred
    reasoning: 'Declared C(13), the APAC number width, with ANT/AN naming the previous
      one.

      '
    notes: 'Following this chain is how a course of treatment is reconstructed. Rows
      are authorisations, not patients or episodes.

      '
  AP_ATV_FIS:
    official_name: Prática de atividade física
    translated_name: Physical activity
    description: Whether the patient takes regular physical activity, part of the follow-up
      assessment.
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; ATV_FIS reads atividade física.
  AP_CID_C1:
    official_name: CID de comorbidade 1
    translated_name: Comorbidity 1
    description: 'First comorbidity, as a CID-10 code. Bariatric surgery is indicated
      partly by comorbidity, and their resolution is how it is judged, so the five
      slots are both the indication and the outcome.

      '
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: 'C(4) CID-10 code bound to CID_COM, whose labels are conditions such
      as hipertensão arterial sistêmica and diabetes mellitus.

      '
  AP_CID_C2:
    official_name: CID de comorbidade 2
    translated_name: Comorbidity 2
    description: Second comorbidity, as a CID-10 code. See AP_CID_C1.
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: C(4) CID-10 code bound to CID_COM, slot 2 of five.
  AP_CID_C3:
    official_name: CID de comorbidade 3
    translated_name: Comorbidity 3
    description: Third comorbidity, as a CID-10 code. See AP_CID_C1.
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: C(4) CID-10 code bound to CID_COM, slot 3 of five.
  AP_CID_C4:
    official_name: CID de comorbidade 4
    translated_name: Comorbidity 4
    description: Fourth comorbidity, as a CID-10 code. See AP_CID_C1.
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: C(4) CID-10 code bound to CID_COM, slot 4 of five.
  AP_CID_C5:
    official_name: CID de comorbidade 5
    translated_name: Comorbidity 5
    description: Fifth comorbidity, as a CID-10 code. See AP_CID_C1.
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: C(4) CID-10 code bound to CID_COM, slot 5 of five.
  AP_CID_CO:
    official_name: CID de comorbidade
    translated_name: Comorbidity ICD-10 code
    description: 'CID-10 code of the comorbidity, where one is recorded. Stored without
      the dot, as everywhere else in DATASUS: J18.9 is written J189.

      '
    code_system: external
    source: inferred
    reasoning: 'Declared C(4), the CID-10 subcategory width, and CID_CO names it as
      the comorbidity''s code alongside the AP_COMORB flag.

      '
    notes: 'Sparse. Absence means nothing was recorded, not that no comorbidity exists.

      '
  AP_COMORB:
    official_name: Comorbidade
    translated_name: Comorbidity present
    description: 'Whether the patient has a comorbidity recorded against this authorisation
      — a flag, not a diagnosis. The condition itself, where it is given, is in the
      CID columns.

      '
    code_system: internal
    source: inferred
    reasoning: 'COMORB is comorbidade and the column is C(1), which cannot hold a diagnosis
      code and so must be a flag.

      '
  AP_DTOOCOR:
    official_name: Data da ocorrência
    translated_name: Date of the event
    description: Date of the event recorded on the follow-up authorisation.
    code_system: internal
    source: def
    source_ref: ANO_2008.CNV
    reasoning: C(8) date bound to ANOMES2008 and ANO_2008.
  AP_MEDICAM:
    official_name: Uso de medicamentos
    translated_name: Taking medication
    description: 'Whether the patient is on medication. After bariatric surgery the
      interesting change is usually medication stopped, as diabetes and hypertension
      resolve.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; MEDICAM reads medicamentos.
  AP_POLIVIT:
    official_name: Uso de polivitamínico
    translated_name: Taking multivitamins
    description: 'Whether the patient takes multivitamins. Lifelong supplementation
      is mandatory after bariatric surgery because the operation deliberately impairs
      absorption, so a "no" here is a clinical problem.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; POLIVIT reads polivitamínico.
  AP_REG_PES:
    official_name: Reganho de peso
    translated_name: Weight regain
    description: 'Whether the patient has regained weight. The principal late failure
      of bariatric surgery, and what the follow-up programme exists to catch.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; REG_PES reads reganho de peso.
  AP_TPATEND:
    official_name: Tipo de atendimento da APAC
    translated_name: APAC type
    description: 'Which APAC programme this authorisation belongs to — general, medicines,
      nephrology, chemotherapy, radiotherapy or bariatric surgery. It says which clinical
      block on the record is populated.

      '
    code_system: internal
    source: def
    source_ref: TP_ATEND.CNV
    reasoning: 'Bound to TP_ATEND, whose values name the APAC programmes from laudo
      geral through cirurgia bariátrica.

      '
  AP_TPPRE:
    official_name: Tipo de prestador
    translated_name: Provider type
    description: 'Two-digit code on the shared APAC header classifying the issuing
      establishment''s ownership — public, philanthropic, union-run or private/contracted
      — the same provider-type axis SUS billing uses elsewhere. Repeated on every laudo
      type a record belongs to, including the bariatric follow-up (ABO) file it appears
      in here.

      '
    code_system: none
    source: inferred
    reasoning: 'TP PRE reads tipo de prestador, the standard SIA/APAC header field
      for the billing establishment''s ownership/contract type; its two-character width
      matches DATASUS''s small numeric type-code convention. No value evidence is present
      in the catalog to confirm the exact codes.

      '
  CO_CIDPRIM:
    official_name: CID primário
    translated_name: Primary diagnosis
    description: The principal CID-10 diagnosis on the follow-up authorisation.
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: C(4) CID-10 code bound to S_CID.
  CO_CIDSEC:
    official_name: CID secundário
    translated_name: Secondary diagnosis
    description: The secondary CID-10 diagnosis, beside CO_CIDPRIM.
    code_system: external
    codelist: cid10
    source: inferred
    reasoning: C(4) CID-10 code bound to S_CID.
