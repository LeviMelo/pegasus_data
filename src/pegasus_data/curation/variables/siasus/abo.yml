  AP_CID_CO:
    official_name: CID de comorbidade
    translated_name: Comorbidity ICD-10 code
    description: 'CID-10 code of the comorbidity, where one is recorded. Stored without
      the dot, as everywhere else in DATASUS: J18.9 is written J189.

      '
    code_system: external
    codelists:
    - ICD10
    - S_CID  # SIA's own table: 0000 CID NAO INFORMADO, 000 CID NÃO IDENTIFICADO
    source: inferred
    reasoning: 'Declared C(4), the CID-10 subcategory width, and CID_CO names it as the
      comorbidity''s code alongside the AP_COMORB flag. Reviewed 2026-09-28: no
      documentation found (searched Informe Técnico SIASUS 2019-07 and the APAC internal
      layout; the nearest documented field is APA_OUTROS ''Outros (CID10)'' in the
      bariatric parts).'
    notes: 'Sparse. Absence means nothing was recorded, not that no comorbidity exists.

      '
  AP_COMORB:
    official_name: Comorbidade
    translated_name: Comorbidity present
    description: 'Whether the patient has comorbidities recorded on this authorisation:
      S = Sim, N = Não. A flag, not a diagnosis.'
    code_system: internal
    codes: {"S": "Sim", "N": "Não"}
    source: layout_doc
