  AP_DTOOCOR:
    official_name: Data da ocorrência
    translated_name: Date of the event
    description: Date of the event recorded on the follow-up authorisation.
    # A date. The .DEF tabulates it on a year/month axis (ANOMES, COMPT,
    # SEMANAEP), which is a way to group dates, not a codelist for them.
    code_system: none
    source: def
    source_ref: ANO_2008.CNV
    reasoning: C(8) date bound to ANOMES2008 and ANO_2008.
  AP_MEDICAM:
    official_name: Uso de medicamentos
    translated_name: Taking medication
    description: 'Whether the patient is on medication. After bariatric surgery the
      interesting change is usually medication stopped, as diabetes and hypertension
      resolve.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; MEDICAM reads medicamentos.
  AP_POLIVIT:
    official_name: Uso de polivitamínico
    translated_name: Taking multivitamins
    description: 'Whether the patient takes multivitamins. Lifelong supplementation
      is mandatory after bariatric surgery because the operation deliberately impairs
      absorption, so a "no" here is a clinical problem.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; POLIVIT reads polivitamínico.
  AP_REG_PES:
    official_name: Reganho de peso
    translated_name: Weight regain
    description: 'Whether the patient has regained weight. The principal late failure
      of bariatric surgery, and what the follow-up programme exists to catch.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; REG_PES reads reganho de peso.
  AP_TPATEND:
    official_name: Tipo de atendimento da APAC
    translated_name: APAC type
    description: 'Which APAC programme this authorisation belongs to — general, medicines,
      nephrology, chemotherapy, radiotherapy or bariatric surgery. It says which clinical
      block on the record is populated.

      '
    code_system: internal
    source: def
    source_ref: TP_ATEND.CNV
    reasoning: 'Bound to TP_ATEND, whose values name the APAC programmes from laudo
      geral through cirurgia bariátrica.

      '
  AP_TPPRE:
    official_name: Tipo de prestador
    translated_name: Provider type
    description: 'Two-digit code on the shared APAC header classifying the issuing
      establishment''s ownership — public, philanthropic, union-run or private/contracted
      — the same provider-type axis SUS billing uses elsewhere. Repeated on every laudo
      type a record belongs to, including the bariatric follow-up (ABO) file it appears
      in here.

      '
    code_system: none
    source: inferred
    reasoning: 'TP PRE reads tipo de prestador, the standard SIA/APAC header field for
      the billing establishment''s ownership/contract type; its two-character width
      matches DATASUS''s small numeric type-code convention. No value evidence is
      present in the catalog to confirm the exact codes. Reviewed 2026-09-28: no
      documentation found (searched Informe Técnico SIASUS 2019-07 and the APAC
      interface layouts; the CNES layout has a TP_PREST ''Tipo de Prestador'', but no
      SIA document lists AP_TPPRE).'
