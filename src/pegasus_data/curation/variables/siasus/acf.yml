# SIA.ACF — APAC, arteriovenous fistula creation
# APAC de Confecção de Fístula Arteriovenosa
#
# One authorisation for creating the vascular access a haemodialysis patient
# needs. Upstream of the dialysis datasets.
system: SIASUS
asserted_by: pegasus_data

variables:
  ACF_ARTDIA:
    official_name: Diâmetro da artéria
    translated_name: Artery diameter
    description: 'Diameter of the artery assessed before creating an arteriovenous
      fistula, in millimetres. Below roughly 2 mm a fistula is unlikely to mature,
      so this is the number the authorisation turns on.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Informe Técnico SIASUS 2019-07 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      §3.4.7 APAC de Confecção de Fístula Arteriovenosa (ACF*.DBF) SEQ 54 NUMERIC(4)
      ''Diâmetro da artéria (em mm)'''
  ACF_DUPLEX:
    official_name: Ultrassom duplex scan
    translated_name: Duplex ultrasound done
    description: 'Whether duplex ultrasound was used to map the vessels. Imaging rather
      than palpation, and it finds usable veins that examination misses.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; DUPLEX names the duplex scan.
  ACF_FLEBIT:
    official_name: Flebite
    translated_name: Phlebitis
    description: 'Whether phlebitis is present. Inflamed veins scar and become unusable,
      so this records why a limb may be unsuitable.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; FLEBIT reads flebite.
  ACF_FREMIT:
    official_name: Frêmito
    translated_name: Thrill
    description: 'Thrill (frêmito, the vibration felt by touch) along the arteriovenous
      fistula path, graded 1 to 4 in the capture layout rather than a yes/no flag.'
    code_system: internal
    source: layout_doc
    source_ref: 'Informe Técnico SIASUS 2019-07 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      §3.4.7 APAC de Confecção de Fístula Arteriovenosa (ACF*.DBF) SEQ 55 CHAR(1)
      ''Frêmito - Vibração perceptível pelo tato''; ''Layout da interface texto do APAC
      e do SIA - layout INTERNO'' (DATASUS/SIA, 11/04/2014) — local:
      sources/layout_interno.pdf (text: sources/apac_layout.txt), Confecção de Fístula
      part, APA_FREMIT ''Presença de frêmito no trajeto da FAV (1 a 4)'''
  ACF_HEMATO:
    official_name: Hematoma
    translated_name: Haematoma
    description: 'Whether a haematoma is present, typically from repeated venepuncture
      — the other common reason a limb''s veins are no longer usable.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; HEMATO reads hematoma.
  ACF_PREFAV:
    official_name: Fístula arteriovenosa prévia
    translated_name: Previous fistula
    description: 'Whether the patient has had a fistula before. The ACF_ block assesses
      the limb before surgery, and a previous fistula limits where a new one can go.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; PREFAV reads prévia fístula arteriovenosa.
  ACF_PULSO:
    official_name: Pulso arterial palpável
    translated_name: Palpable arterial pulse
    description: 'Whether the arterial pulse is palpable. A fistula needs adequate
      arterial inflow as well as a usable vein, so this is the arterial half of the
      assessment that ACF_VEIAVI covers venously.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; PULSO reads pulso.
  ACF_USOCAT:
    official_name: Uso de cateter
    translated_name: Catheter in use
    description: 'Whether the patient is currently dialysing through a catheter. Catheters
      are the temporary bridge a fistula is meant to replace, and time on one is time
      at raised infection risk.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; USOCAT reads uso de cateter.
  ACF_VEIAVI:
    official_name: Veia visível
    translated_name: Visible vein
    description: 'Whether a suitable vein is visible on examination. The simplest predictor
      of whether a fistula can be created at all.

      '
    code_system: internal
    source: def
    source_ref: SIMNAO2.CNV
    reasoning: Bound to SIMNAO2; VEIAVI reads veia visível.
  ACF_VEIDIA:
    official_name: Diâmetro da veia
    translated_name: Vein diameter
    description: 'Diameter of the vein assessed for the same fistula, in millimetres.
      The companion measurement to ACF_ARTDIA; both are taken before deciding whether
      and where to construct the access.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Informe Técnico SIASUS 2019-07 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf,
      §3.4.7 APAC de Confecção de Fístula Arteriovenosa (ACF*.DBF) SEQ 53 NUMERIC(4)
      ''Diâmetro da veia (em mm)'''
