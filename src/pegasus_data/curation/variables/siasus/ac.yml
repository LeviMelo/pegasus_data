# SIA.AC — APAC, registry follow-up
# APAC de Acompanhamento
#
# The 2002-era renal replacement registry, published as self-extracting
# archives carrying seven linked datasets rather than as one flat table. See
# FINDINGS.md 3j — its patient block carries date of birth, postcode and
# diagnosis, and joins one-to-one to a serology block.
system: SIASUS
asserted_by: pegasus_data

variables:
  APA_CODUNI:
    official_name: Código da Unidade
    translated_name: Provider unit CNES code
    description: 'CNES code (with check digit) of the health facility billing this
      APAC; the observed value 000240 resolves to FUNDHACRE, an Acre state hospital
      foundation, via the bound CNES codelist.

      '
    code_system: external
    source: inferred
    reasoning: 'CODUNI mirrors the documented general-layout field apa_codcnes, "Código
      da Unidade Prestadora de Serviços (c/ dígito verificador)"; the catalog''s CNES
      codelist binding and the FUNDHACRE label on the top observed value confirm it.

      '
    source_ref: 'fehosp.com.br "Layout da interface texto do APAC e do SIA", página
      2 (campo apa_codcnes)

      '
  APA_CONDIC:
    official_name: Condição de Gestão
    translated_name: Management arrangement code
    description: 'Code for the administrative management arrangement of the health
      system under which the reporting unit operates; value EC (Estado Convencional)
      means the state government manages it directly, not the municipality.

      '
    code_system: internal
    source: def
    source_ref: TPGESTAO/TPGEST_C domain tables bound to this field in the catalog
  APA_CONTN:
    official_name: Indicador de continuidade
    translated_name: Continuity flag
    description: 'Single-character flag on every APAC authorisation record, constant
      at "1" across all 305 rows in this file. CONTN reads continu[idade]; consistent
      with a dialysis registry where almost every authorisation renews an ongoing therapy
      rather than opening a first-time request.

      '
    code_system: none
    source: inferred
    reasoning: 'Measured constant "1" across 305/305 rows in ACAC0201.DBF; CONTN is
      readable as an abbreviation of continuidade. No codelist is bound.

      '
  APA_CPFDIR:
    official_name: CPF do Autorizador/Diretor
    translated_name: Authorizing physician CPF
    description: 'CPF of the physician or clinical director who authorized the APAC,
      passed through unmodified with no masking; nearly constant per facility since
      one director signs most of a unit''s authorizations.

      '
    code_system: none
    source: inferred
    reasoning: 'Parallels the documented sibling field APA_CNSDIR ("CNS do Autorizador
      Responsável") in the same layout, where DIR abbreviates the authorizing director/responsible
      signer.

      '
  APA_CPFPCN:
    official_name: CPF do Paciente
    translated_name: Patient CPF
    description: 'The patient''s Brazilian taxpayer ID (CPF), passed through unmodified
      with no masking; the repeating-digit value 33333333374 seen for many records
      is a placeholder used when the real CPF was unavailable.

      '
    code_system: none
    source: inferred
    reasoning: '"CPF" is the Brazilian tax-ID abbreviation and "PCN" parallels "PCT"
      in the documented sibling field APA_CNSPCT ("Cartão Nacional de Saúde Paciente");
      the placeholder pattern is directly observed in the catalog.

      '
  APA_CPFRES:
    official_name: CPF do Médico Responsável
    translated_name: Responsible physician CPF
    description: 'CPF of the physician responsible for the patient''s ongoing treatment
      named on the APAC, passed through unmodified with no masking; distinct from APA_CPFDIR,
      the authorizing physician''s CPF.

      '
    code_system: none
    source: inferred
    reasoning: 'Parallels the documented sibling field APA_CNSRES ("CNS Médico Responsável")
      in the same layout, where RES abbreviates "responsável" for the treating physician.

      '
  APA_DATEM:
    official_name: Data de emissão
    translated_name: Emission month
    description: 'Year-month (AAAAMM) the APAC authorization was first issued; a continuation
      APAC (APA_TIPAPA=2) keeps this original month even as later batches process it
      under a newer APA_DATREF.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'DAT=data, EM=emissão follows the regular DATASUS abbreviation grammar;
      distinguishing it from the co-located competência field APA_DATREF matches how
      APA_TIPAPA''s inicial/continuidade distinction is normally carried in APAC records.

      '
  APA_DATREF:
    official_name: Data de referência
    translated_name: Reference month (competência)
    description: 'Year-month (AAAAMM) of the processing batch this record belongs to
      — the competência this extract covers, e.g. 200201 for a January 2002 file.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'DAT=data, REF=referência follows the regular DATASUS abbreviation grammar;
      the field is bound to year-month codelists (ANOMES03, AM_0803) and its one observed
      value (200201) matches the file''s own extraction month exactly, as a competência
      field would.

      '
  APA_DTFIMV:
    official_name: Data final de validade
    translated_name: Validity end date
    description: 'Calendar date (AAAAMMDD) on which this APAC authorization stops being
      valid — the last day of the covered treatment period, generally the last day
      of the competência month.

      '
    code_system: none
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 006 (apa_dtfimval, "Data final da validade da
      APAC")

      '
  APA_DTINIV:
    official_name: Data inicial de validade
    translated_name: Validity start date
    description: 'Calendar date (AAAAMMDD) from which this APAC authorization is valid
      — the first day of the treatment period it covers, typically the 1st of the competência
      month.

      '
    code_system: none
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 005 (apa_dtiinval, "Data inicial da validade
      da APAC")

      '
  APA_DTOCOR:
    official_name: Data de ocorrência
    translated_name: Occurrence date
    description: 'Date the outcome named in APA_MOTCOB happened — the discharge, transfer,
      or death that ended this segment of care — not necessarily the same day the batch
      itself was processed.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'Immediately follows APA_MOTCOB in the record layout, exactly where
      APAC_JUL07.doc places apa_dtobitoalta/APA_DTOBAL ("date of the discharge-or-death
      event") in its older and newer APAC layouts; observed dates fall within the same
      competência month as APA_DTINIV/APA_DTFIMV, consistent with an event date rather
      than a processing date.

      '
  APA_GESTAO:
    official_name: Código de gestão
    translated_name: Managing authority code
    description: 'IBGE code of the municipality (or UF) holding SUS administrative
      and financial responsibility for the facility that issued this APAC; 129999-style
      codes mark the managing municipality as unrecorded.

      '
    codelist: BR_MUNICGESTOR
    code_system: external
    source: inferred
    asserted_by: pegasus_data
    reasoning: '"Gestão" is the standard SIA/SUS field naming a record''s managing
      municipality/state under decentralised financing, confirmed here by the bound
      MUNICBR/UF/UFGESTAO codelists and by the observed value 129999 labelled "Município
      ignorado - AC".

      '
  APA_MOTCOB:
    official_name: Motivo da cobrança
    translated_name: Billing/closing reason
    description: 'Code for why this APAC segment closed this month: e.g. 69=discharge
      on completing treatment, 71=stayed at the same facility on the same procedure,
      81=transferred elsewhere, 91=death.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 053 (apa_motcobra, "conforme tabela do Anexo
      VII da PT/MS/SAS 205/96")

      '
  APA_NOMEDI:
    official_name: Nome do diretor
    translated_name: Facility director's name
    description: 'Full name of the director of the health facility that provided the
      service, entered as free text and passed through unmodified — a personal identifier,
      not a coded field.

      '
    code_system: none
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 056 (apa_nomediretor, "Nome do Diretor da Unidade
      Prestadora do Serviço"), truncated to 10 characters as the DBF field name

      '
  APA_NOMERE:
    official_name: Nome do médico responsável
    translated_name: Responsible physician's name
    description: 'Full name of the physician responsible for the patient''s treatment
      under this APAC, entered as free text and passed through unmodified — a personal
      identifier, not a coded field.

      '
    code_system: none
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 022 (apa_nomeresp, "Nome do médico responsável"),
      truncated to 10 characters as the DBF field name

      '
  APA_NUM:
    official_name: Número da APAC
    translated_name: APAC number
    description: 'The APAC''s own control number: an 11-digit sequence plus a check
      digit assigned when the authorization is issued, used to link every later billing
      record back to this authorization.

      '
    code_system: none
    source: layout_doc
    source_ref: APAC_JUL07.doc, campo 003 (apa_num)
  APA_PRIPAL:
    official_name: Procedimento principal
    translated_name: Main procedure code
    description: 'SIA/SUS procedure code for the main treatment this APAC authorizes,
      e.g. hemodiálise, tomografia computadorizada or a named medication — the code
      that drives what care and quantities get billed.

      '
    code_system: external
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'Bound to procedure codelists (PROC1199, PROCSIAV, DIALISE7) and every
      observed value is a SIGTAP-style procedure code matching a real DATASUS procedure
      name (hemodiálise, tomografia, calcitriol); "PRIPAL" reads as the truncated DBF
      form of "procedimento principal", which APAC_JUL07.doc''s layout describes as
      the authorization''s main billed procedure.

      '
  APA_TIPAPA:
    official_name: Tipo de APAC
    translated_name: APAC type
    description: 'Marks whether this authorization is the first month of a treatment
      (1=Inicial), a later month continuing the same course (2=Continuidade), or a
      one-off procedure needing no renewal (3=Única).

      '
    code_system: none
    source: layout_doc
    source_ref: APAC_JUL07.doc, campo 008 (apa_tipapac)
  APA_TIPATE:
    official_name: Tipo de atendimento
    translated_name: Type of care
    description: 'Code for the broad care category this APAC authorizes: observed values
      include 27 (renal replacement therapy/dialysis), 35 (diagnostic imaging or tests)
      and 36 (dispensed medications), which sets which of the record''s variable fields
      apply.

      '
    code_system: none
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 007 (apa_tipate); values cross-checked against
      the procedure codes carried in APA_PRIPAL for the same records

      '
  COB_CODESP:
    official_name: Código da especialidade
    translated_name: Specialty code
    description: 'Code identifying the medical specialty under which the billed procedure
      was performed or billed, e.g. codes 26, 40, 65 and 66 recurring for this facility''s
      APAC production.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'CO_=código, ESP=especialidade follows the regular grammar; two-digit
      values are consistent with SIA/SUS''s specialty-code range, though the catalog
      carries no codelist for this table to confirm labels.

      '
  COB_CODPR:
    official_name: Código do procedimento
    translated_name: Procedure code
    description: 'SIA/SUS code of the specific procedure being billed on this line,
      e.g. tomografia or hemodiálise — the same code space as APA_PRIPAL''s authorization-level
      main procedure, but at the level of one billed item.

      '
    code_system: external
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'CO_=código, PR=procedimento follows the regular grammar, and every
      observed value matches a real SIGTAP-style procedure code also seen in APA_PRIPAL
      for the same records.

      '
  COB_CODUNI:
    official_name: Código da unidade
    translated_name: Facility identifier
    description: 'Identifier of the health establishment that carried out the billed
      procedure; only a handful of distinct facility codes recur across this UF''s
      records.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'CO_=código, UNI=unidade follows the regular grammar; values are short
      numeric facility codes consistent with the pre-7-digit CNES unit identifiers
      used in this era of SIA/SUS files.

      '
  COB_CONDIC:
    official_name: Condição do registro
    translated_name: Record condition flag
    description: 'Two-letter processing-status code on every billing (cobrança) record,
      constant at "EC" across all 485 rows. The identical code and width recur on EXA_CONDIC
      and UDI_CONDIC elsewhere in this archive, so it reads as a DATASUS-internal control
      flag rather than something a biller enters by hand.

      '
    code_system: none
    source: inferred
    reasoning: 'Measured constant "EC" across 485/485 rows in COAC0201.DBF, matching
      the same value on EXA_CONDIC (52/52) and UDI_CONDIC (2/2) in the same archive.

      '
  COB_CPFPCN:
    official_name: CPF do paciente
    translated_name: Patient's CPF
    description: 'The patient''s Brazilian taxpayer ID (CPF), an 11-digit personal
      identifier that passes through unmodified from the source file with no masking
      applied.

      '
    code_system: none
    source: layout_doc
    source_ref: 'APAC_JUL07.doc, campo 009 (apa_cpfpcnte, "Número de registro do paciente
      no Cadastro de Pessoas Físicas... CPF"), same identifier carried in the paired
      COB_ billing record

      '
  COB_DATREF:
    official_name: Data de referência
    translated_name: Reference month (competência)
    description: 'Year-month (AAAAMM) of the billing batch this line belongs to, matching
      APA_DATREF in the paired APAC header file for the same UF and competência.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'Shares the value 200201 and the DAT=data, REF=referência grammar with
      APA_DATREF in the sibling "AC" file for the same competência.

      '
  COB_GESTAO:
    official_name: Código de gestão
    translated_name: Managing authority code
    description: 'IBGE code of the municipality (or UF) holding administrative and
      financial responsibility for the billed procedure, the same role APA_GESTAO plays
      in the paired APAC record.

      '
    codelist: BR_MUNICGESTOR
    code_system: external
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'Bound to MUNICBR and shares the same "129999 Município ignorado" value
      as APA_GESTAO in the sibling APAC file; "gestão" is the standard SIA/SUS field
      naming the managing municipality/state.

      '
  COB_NUM:
    official_name: Número da APAC
    translated_name: APAC number
    description: 'The 11-digit control number of the parent APAC this billed procedure
      belongs to, letting each line in the billing file be joined back to its APA_NUM
      header record.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'Same 11-digit value format as APA_NUM in the paired "AC" header file
      for the same UF and competência; COB records are the itemised billing lines generated
      from each APAC and link back to it by this number.

      '
  COB_QTAP:
    official_name: Quantidade apresentada
    translated_name: Quantity presented
    description: 'Number of units of this procedure the provider submitted for payment
      on this billing line, before any reduction by the payer''s approval.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'QT_=quantidade, AP=apresentada follows the regular grammar and the
      standard SIA/SUS BPA distinction between quantity presented (QTAP) and quantity
      approved/produced (QTPR).

      '
  COB_QTPR:
    official_name: Quantidade produzida
    translated_name: Quantity approved/produced
    description: 'Number of units of this procedure actually approved and counted for
      payment on this billing line, the paid counterpart to the requested COB_QTAP.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'QT_=quantidade, PR=produzida follows the regular grammar and the standard
      SIA/SUS BPA distinction between apresentada (requested) and produzida/aprovada
      (paid) quantities.

      '
  COB_SEQ:
    official_name: Sequência
    translated_name: Line sequence number
    description: 'Sequential position of this procedure line within its parent APAC''s
      set of billed items, starting at 1; higher numbers mean more procedures were
      billed under the same authorization.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'SEQ=sequência follows the regular grammar; values run upward from 1
      and repeat alongside the same COB_NUM, consistent with numbering multiple billing
      lines under one APAC.

      '
  COB_TIPATE:
    official_name: Tipo de atendimento
    translated_name: Type of care
    description: 'Code for the care category of the billed procedure — the same value
      set (27 renal therapy, 35 imaging/tests, 36 medications) seen in APA_TIPATE for
      the linked APAC header.

      '
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: 'Identical value distribution (27, 35, 36, 08, 38) to APA_TIPATE in
      the paired "AC" file for the same competência, and TIPATE=tipo de atendimento
      follows the regular DATASUS abbreviation grammar.

      '
  COB_VALAP:
    official_name: Valor aprovado
    translated_name: Approved value
    description: 'Amount approved for payment on the authorisation, in nominal reais
      at the time of billing.

      '
    code_system: none
    source: inferred
    reasoning: 'COB is cobrança and VAL AP reads valor aprovado; the observed values
      are decimal amounts (86.7600, 1.8500).

      '
    notes: 'Nominal reais, never deflated. Comparing 2002 to 2020 without an index
      compares two different currencies.

      '
  COB_VALPR:
    official_name: Valor apresentado
    translated_name: Presented value
    description: 'Amount the establishment presented for payment, before approval.
      Where it differs from COB_VALAP, the difference is what was refused.

      '
    code_system: none
    source: inferred
    reasoning: 'VAL PR reads valor apresentado, the counterpart of valor aprovado,
      with the same decimal shape.

      '
  EXA_CODUNI:
    official_name: Código da unidade
    translated_name: Establishment code
    description: 'Code of the establishment that performed the examination, in the
      six-character form these 2002-era files use rather than the seven-digit CNES
      that replaced it.

      '
    code_system: external
    source: inferred
    reasoning: 'COD UNI reads código da unidade, and the observed value (000240) is
      six characters, predating the CNES numbering.

      '
  EXA_CONDIC:
    official_name: Condição do registro (bloco de exames)
    translated_name: Record condition flag, examinations block
    description: 'The same two-letter "EC" processing-status flag as COB_CONDIC, here
      on the examination block. Constant across all 52 rows in this file.

      '
    code_system: none
    source: inferred
    reasoning: Same CONDIC stem and identical constant value as COB_CONDIC.
  EXA_CPFPCN:
    official_name: CPF do paciente (bloco de exames)
    translated_name: Patient CPF, examinations block
    description: 'The patient pseudonym carried on the examination records — the block
      that also holds EXA_HIV, EXA_HBSAG, EXA_HEPAT and EXA_HLA. All 52 values fail
      the CPF check digit.

      '
    code_system: none
    source: inferred
    reasoning: Same CPFPCN stem under the EXA_ prefix; 0 of 52 pass the CPF check digit.
    notes: 'A PSEUDONYMOUS identifier sharing a table with HIV and hepatitis serology.
      It does not name anyone by itself. The re-identification risk lies in the patient
      block it joins to (PAC_NUM to EXA_NUM, measured 52/52 one-to-one), which carries
      a real date of birth, sex, municipality and postcode.

      '
  EXA_DATREF:
    official_name: Data de referência
    translated_name: Reference year-month
    description: 'Competência the examination is reported under, as AAAAMM.

      '
    code_system: none
    source: inferred
    reasoning: DAT REF reads data de referência; observed value 200201 is a year-month.
  EXA_GESTAO:
    official_name: Gestão
    translated_name: Managing authority
    description: 'Which authority manages the establishment — the municipality or the
      state. Recorded as a municipality code, where 9999 in the last four digits marks
      state rather than municipal management.

      '
    codelist: BR_MUNICGESTOR
    codelists:
    - MUNICBR
    code_system: external
    source: inferred
    reasoning: 'Bound to MUNICBR, and the observed value 129999 is the Acre state code
      with the 9999 suffix that DATASUS uses for state-level management.

      '
  EXA_HBSAG:
    official_name: Resultado do HBsAg
    translated_name: Hepatitis B surface antigen result
    description: 'Hepatitis B surface antigen result, positive or negative. A positive
      HBsAg means active infection and, in a dialysis unit, isolation.

      '
    code_system: internal
    source: inferred
    reasoning: 'HBsAg is the universal abbreviation for the hepatitis B surface antigen;
      observed values are N and P.

      '
    notes: Infection status on an identifiable individual. See EXA_HIV.
  EXA_HEPAT:
    official_name: Resultado do exame de hepatite
    translated_name: Hepatitis test result
    description: 'Hepatitis test result alongside the specific HBsAg column, positive
      or negative.

      '
    code_system: internal
    source: inferred
    reasoning: HEPAT is hepatite; observed values are N and P.
    notes: Infection status on an identifiable individual. See EXA_HIV.
  EXA_HIV:
    official_name: Resultado do exame de HIV
    translated_name: HIV test result
    description: 'Result of the patient''s HIV test, recorded as positive or negative.
      Dialysis units test for it because it determines which machine and shift a patient
      can use.

      '
    code_system: internal
    source: inferred
    reasoning: 'HIV needs no expansion, and the observed values are exactly N and P
      — negativo and positivo.

      '
    notes: 'HIV STATUS ON AN IDENTIFIABLE INDIVIDUAL. This column shares its rows with
      EXA_CPFPCN. Publishing the two together is a disclosure of the most sensitive
      category of health data there is, and it is why these files are the subject of
      a finding rather than merely a column description.

      '
  EXA_HLA:
    official_name: Tipagem HLA realizada
    translated_name: HLA typing done
    description: 'Whether HLA tissue typing was carried out — the compatibility test
      that places a dialysis patient on a transplant waiting list.

      '
    code_system: internal
    source: inferred
    reasoning: 'HLA is the human leukocyte antigen system; the observed values are
      the same N/P flags as the serology fields beside it.

      '
  EXA_INDCRE:
    official_name: Índice de referência (CRE)
    translated_name: Exam reference index (CRE)
    description: 'Three-digit numeric code on each exam entry (e.g. 124, 046, 083),
      nearly as varied as the rows themselves — 44 distinct values across 52 records
      — so it behaves as a near-unique per-record index rather than a small category.
      Distinct from the decoded serology fields (EXA_HIV, EXA_HBSAG) beside it.

      '
    code_system: none
    source: inferred
    reasoning: 'IND reads indicador/índice; distinct_count 44 of 52 non-null rows rules
      out a small enumerated domain. No codelist is bound in the catalog.

      '
  EXA_INDUPR:
    official_name: Índice de referência (UPR)
    translated_name: Exam reference index (UPR)
    description: 'Four-digit sibling of EXA_INDCRE, one digit wider and reaching higher
      values (up to the 1800s in this file) with 43 distinct values across 52 records
      — again closer to a per-record index than a coded category.

      '
    code_system: none
    source: inferred
    reasoning: 'Same IND-prefixed family as EXA_INDCRE, distinct_count 43 of 52 non-null
      rows, four-character width versus INDCRE''s three.

      '
  EXA_INDUPS:
    official_name: Índice de referência (UPS)
    translated_name: Exam reference index (UPS)
    description: 'Four-digit sibling of EXA_INDUPR, somewhat less varied — 37 distinct
      values across 52 records rather than 43 — but drawn from the same value range
      (three- and four-digit codes below 2000).

      '
    code_system: none
    source: inferred
    reasoning: 'Same IND-prefixed family as EXA_INDCRE/INDUPR, distinct_count 37 of
      52 non-null rows.

      '
  EXA_NUM:
    official_name: Número da APAC (bloco de exames)
    translated_name: APAC number, examinations block
    description: 'The same authorisation number on the examination records, which is
      how a serology result is attached to a patient.

      '
    code_system: none
    source: inferred
    reasoning: Same eleven-digit values as PAC_NUM.
  OPC_AIHNUM:
    official_name: Número da AIH
    translated_name: Hospital admission authorisation number
    description: 'AIH number where the episode also generated a hospital admission
      — a link out of SIASUS into SIHSUS for the same patient.

      '
    code_system: none
    source: inferred
    reasoning: AIHNUM names the AIH, the hospital authorisation, in an outpatient file.
  OPC_AIHPRO:
    official_name: Procedimento da AIH (bloco OPC)
    translated_name: AIH procedure code, OPC block
    description: 'Eight-character field for a linked hospital-admission (AIH) procedure
      code. Present in the OPC schema but empty in every one of the 155 rows here —
      this Acre file''s dialysis episodes generated no linked hospital admission that
      month.

      '
