# SIA.AN — APAC, nephrology
# APAC de Nefrologia
#
# One authorisation for nephrology care short of dialysis.
system: SIASUS
asserted_by: pegasus_data

variables:
  AN_ACEVAS:
    official_name: Acesso vascular
    translated_name: Vascular access present
    description: 'Whether the patient already has vascular access. Starting dialysis
      without it means a temporary catheter, which carries far more infection risk,
      so this field marks the difference between planned and unplanned starts.

      '
    code_system: internal
    source: def
    source_ref: ACES_VASC.CNV
    reasoning: Bound to ACES_VASC, an S/N flag; ACEVAS reads acesso vascular.
  AN_ALBUMI:
    official_name: Albumina
    translated_name: Albumin
    description: 'Serum albumin in g%. The standard nutritional marker in dialysis,
      and a strong predictor of survival on it.

      '
    code_system: internal
    source: def
    source_ref: ALBINA.CNV
    reasoning: Bound to ALBINA, whose labels are g% values.
  AN_ALTURA:
    official_name: Altura
    translated_name: Height
    description: 'Height in centimetres. Recorded with weight because dialysis dose
      is scaled to body size, so neither is useful alone.

      '
    code_system: internal
    source: def
    source_ref: ALTURA.CNV
    reasoning: Bound to ALTURA, whose labels are centimetre values.
  AN_CNCDO:
    official_name: Inscrição na CNCDO
    translated_name: Registered with the transplant centre
    description: 'Whether the patient is registered with the state transplant notification
      centre. Registration is what puts a patient on the transplant waiting list, so
      this is the field that distinguishes waiting from not being considered.

      '
    code_system: internal
    source: def
    source_ref: CNCDO.CNV
    reasoning: 'Bound to CNCDO, an S/N flag. CNCDO is the Central de Notificação, Captação
      e Distribuição de Órgãos.

      '
  AN_DIURES:
    official_name: Diurese
    translated_name: Urine output
    description: 'Residual urine output. Retaining some output makes dialysis easier
      to manage and predicts better outcomes, so its loss is a milestone in the disease.

      '
    code_system: internal
    source: def
    source_ref: DIURESE.CNV
    reasoning: Bound to DIURESE, a four-digit numeric field.
  AN_DTPDR:
    official_name: Data da primeira diálise realizada
    translated_name: Date of first dialysis performed
    description: 'Date, AAAAMMDD, of the patient''s first-ever dialysis session. Filled
      once, on the record documenting that first session, not repeated on every subsequent
      monthly renewal of the authorisation.

      '
    code_system: none
    source: web
    reasoning: 'The same 2014 DATASUS layout documents the equivalent field, there
      named APA_DTPDR in the Nefrologia laudo block, as "Data (AAAAMMDD) da primeira
      dialise realizada", filled only at the first dialysis. AN_DTPDR is eight characters,
      matching an AAAAMMDD date.

      '
  AN_GLICOS:
    official_name: Glicose
    translated_name: Glucose
    description: 'Blood glucose. Diabetes is the commonest cause of kidney failure
      in Brazil, so this is both a comorbidity marker and a cause.

      '
    code_system: internal
    source: def
    source_ref: GLICOSE.CNV
    reasoning: Bound to GLICOSE, a four-digit numeric field.
  AN_HB:
    official_name: Hemoglobina
    translated_name: Haemoglobin
    description: 'Haemoglobin in g%. Anaemia is near universal in kidney failure because
      the failing kidney stops making erythropoietin, and this value is what justifies
      prescribing it.

      '
    code_system: internal
    source: def
    source_ref: HB.CNV
    reasoning: Bound to HB, whose labels are g% values.
  AN_HBSAG:
    official_name: HBsAg
    translated_name: Hepatitis B surface antigen
    description: 'Hepatitis B surface antigen. A positive patient must be dialysed
      on a dedicated machine in a separate room, which is why this single field changes
      how a unit is organised.

      '
    code_system: internal
    source: def
    source_ref: HBSAG.CNV
    reasoning: Bound to HBSAG, whose values are positivo and negativo.
  AN_HCV:
    official_name: Sorologia para hepatite C
    translated_name: Hepatitis C serology
    description: 'Hepatitis C serology. Historically transmitted within dialysis units
      through the blood circuit, which is why it is screened repeatedly rather than
      once.

      '
    code_system: internal
    source: def
    source_ref: HCV.CNV
    reasoning: Bound to HCV, whose values are positivo and negativo.
  AN_HIV:
    official_name: Sorologia para HIV
    translated_name: HIV serology
    description: 'HIV serology. Screened because dialysis involves repeated blood-circuit
      exposure and shared machines, so the result determines isolation practice.

      '
    code_system: internal
    source: def
    source_ref: HIV.CNV
    reasoning: Bound to HIV, whose values are positivo and negativo.
  AN_INTFIS:
    official_name: Quantidade de fístulas
    translated_name: Number of fistulas
    description: 'How many arteriovenous fistulas the patient has had, as a banded
      code rather than a bare number. Each failed access makes the next harder to create,
      so it measures how far the patient''s vascular options are used up.

      '
    code_system: internal
    source: def
    source_ref: QT_FISTOLA.CNV
    reasoning: 'Bound to QT_FISTOLA, whose labels spell out a fistula count.

      '
  AN_PESO:
    official_name: Peso
    translated_name: Weight
    description: 'Weight in kilograms. In kidney failure weight also tracks fluid overload,
      so a change between authorisations is not necessarily nutritional.

      '
    code_system: internal
    source: def
    source_ref: PESO.CNV
    reasoning: Bound to PESO, whose labels are kilogram values.
  AN_TRU:
    official_name: Taxa de redução de ureia
    translated_name: Urea reduction ratio
    description: 'Urea reduction ratio — how much urea one dialysis session removes.
      The standard adequacy measure: below about 65% the session is judged insufficient,
      so this is the field that says whether the treatment works.

      '
    code_system: internal
    source: def
    source_ref: TRU.CNV
    reasoning: 'Bound to TRU, whose labels spell out a numeric urea reduction value.
      TRU abbreviates taxa de redução de ureia.

      '
  AN_ULSOAB:
    official_name: Ultrassonografia abdominal
    translated_name: Abdominal ultrasound done
    description: 'Whether abdominal ultrasound was performed. Part of the work-up that
      establishes why the kidneys failed and whether they are small and scarred or
      obstructed.

      '
    code_system: internal
    source: def
    source_ref: ULTRA_AB.CNV
    reasoning: Bound to ULTRA_AB, an S/N flag; ULSOAB reads ultrassonografia abdominal.
