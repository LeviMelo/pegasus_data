system: SINAN
asserted_by: pegasus_data

variables:
  RES_ISOL:
    official_name: Resultado do isolamento (cultura)
    translated_name: Culture/isolation result
    description: >
      Whether Leptospira was successfully isolated by culture from the
      patient, one of three parallel confirmatory lab-method flags on the
      leptospirosis (LEPT) form alongside RES_PCR and RES_IMUNO.
    code_system: none
    source: inferred
    reasoning: LEPT form; RES_ISOL = resultado + isolamento; width 1.

  RES_PCR:
    official_name: Resultado do PCR
    translated_name: PCR result
    description: >
      Whether a PCR test for Leptospira DNA came back positive, the
      molecular counterpart to the culture-based RES_ISOL and
      serology-based RES_IMUNO results on the same form.
    code_system: none
    source: inferred
    reasoning: LEPT form; RES_PCR = resultado + PCR; width 1.

  SG_UF_INTE:
    official_name: Sigla da UF de internação
    translated_name: State of hospitalization (abbreviation)
    description: >
      Two-letter abbreviation of the state where the accidental-tetanus
      (TETA) patient was hospitalized, which can differ from the state of
      residence or notification when the patient is treated elsewhere.
    code_system: none
    source: inferred
    reasoning: >
      TETA form; SG_ = sigla, UF_INTE = UF de internação; width 2 matches a
      state abbreviation.

  STALIMENTO:
    official_name: Tipo de botulismo - Alimentar
    translated_name: Foodborne botulism (flag)
    description: >
      Whether this case is classified as foodborne botulism - toxin
      ingested in contaminated food - the most common of the BOTU form's
      botulism-type categories, distinct from the wound-related
      classification in STFERIMENT.
    code_system: none
    source: inferred
    reasoning: BOTU form; STALIMENTO = alimentar; width 1 checkbox.

  STANTIBIO:
    official_name: Uso de antibiótico
    translated_name: Antibiotic given (flag)
    description: >
      Whether the botulism patient received antibiotic treatment, tracked
      separately from the antitoxin serum (STANTIBOTU) because antibiotics
      address secondary infection or wound botulism rather than neutralize
      circulating toxin.
    code_system: none
    source: inferred
    reasoning: BOTU form; STANTIBIO = antibiótico; width 1 checkbox.

  STANTIBOTU:
    official_name: Uso de soro antibotulínico
    translated_name: Botulinum antitoxin given (flag)
    description: >
      Whether the patient received botulinum antitoxin serum, the specific
      treatment that neutralizes circulating toxin, distinct from the
      general antibiotic flag STANTIBIO.
    code_system: none
    source: inferred
    reasoning: BOTU form; STANTIBOTU = soro antibotulínico; width 1.

  STBOCA:
    official_name: Sinais e sintomas - Boca seca
    translated_name: Dry mouth
    description: >
      Whether the botulism patient reports dry mouth, one of the
      autonomic symptom checkboxes recorded alongside constipation
      (STCONSTIPA), caused by the toxin's effect on smooth muscle.
    code_system: none
    source: inferred
    reasoning: BOTU form; STBOCA = boca (seca); width 1 checkbox.

  STBROMATO:
    official_name: Exame bromatológico realizado
    translated_name: Food (bromatological) lab analysis performed
    description: >
      Whether the suspect food was sent for bromatological (food
      chemistry) laboratory analysis to detect botulinum toxin or the
      causative bacteria, distinct from the patient-sample lab flags
      (STFEZESMAT, STFEZESRES) elsewhere on the form.
    code_system: none
    source: inferred
    reasoning: BOTU form; STBROMATO = bromatológico; width 1 checkbox.

  STBULBAR:
    official_name: Sinais e sintomas - Paralisia bulbar
    translated_name: Bulbar palsy
    description: >
      Whether the patient shows bulbar palsy (weakness of the lower
      cranial-nerve muscles controlling swallowing and speech), marking
      progression of botulism's descending paralysis pattern.
    code_system: none
    source: inferred
    reasoning: BOTU form; STBULBAR = bulbar; width 1 checkbox.

  STCARDIACA:
    official_name: Alteração cardíaca
    translated_name: Cardiac abnormality
    description: >
      Whether the botulism patient shows a cardiac abnormality (e.g.
      arrhythmia), a systemic-complication checkbox distinct from the
      cranial-nerve and limb-paralysis signs recorded elsewhere on the
      form.
    code_system: none
    source: inferred
    reasoning: BOTU form; STCARDIACA = cardíaca; width 1 checkbox.

  STCASEIRA:
    official_name: Fonte alimentar - Alimento caseiro
    translated_name: Home-made food source
    description: >
      Whether the suspect food was home-made/home-preserved (e.g.
      home-canned vegetables), the classic source for foodborne botulism,
      tracked alongside commercial (STCOMERCIO) and restaurant
      (STRESTAURA) sources.
    code_system: none
    source: inferred
    reasoning: BOTU form; STCASEIRA = caseira; width 1 checkbox.

  STCEFALEIA:
    official_name: Sinais e sintomas - Cefaleia
    translated_name: Headache
    description: >
      Whether the botulism patient reports headache, a general/nonspecific
      symptom checkbox recorded alongside the disease's more distinctive
      cranial-nerve signs.
    code_system: none
    source: inferred
    reasoning: BOTU form; STCEFALEIA = cefaleia; width 1 checkbox.

  STCLINICA:
    official_name: Classificação clínica
    translated_name: Clinical classification (flag)
    description: >
      Whether the botulism case is being classified based on clinical
      criteria (signs and symptoms) rather than a confirmed lab test, part
      of the form's case-classification basis alongside its various
      lab-result fields.
    code_system: none
    source: inferred
    reasoning: BOTU form; STCLINICA = clínica; width 1 checkbox.

  STCOMA:
    official_name: Sinais e sintomas - Coma
    translated_name: Coma
    description: >
      Whether the botulism patient progressed to coma, marking the most
      severe end of the disease's descending paralysis and a key indicator
      of respiratory/neurological failure.
    code_system: none
    source: inferred
    reasoning: BOTU form; STCOMA = coma; width 1 checkbox.

  STCOMERCIO:
    official_name: Fonte alimentar - Produto comercial
    translated_name: Commercial food source
    description: >
      Whether the suspect food was a commercially produced/packaged
      product, as opposed to home-made or restaurant food, used to target
      product recalls alongside STCASEIRA and STRESTAURA.
    code_system: none
    source: inferred
    reasoning: BOTU form; STCOMERCIO = comércio; width 1 checkbox.

  STCONSTIPA:
    official_name: Sinais e sintomas - Constipação
    translated_name: Constipation
    description: >
      Whether the botulism patient reports constipation, an
      autonomic-nervous-system symptom caused by the toxin's effect on
      smooth muscle, recorded alongside dry mouth (STBOCA).
    code_system: none
    source: inferred
    reasoning: BOTU form; STCONSTIPA = constipação; width 1 checkbox.

  STCURA1:
    official_name: Cura - Critério 1
    translated_name: Cure criterion (1st)
    description: >
      Whether the first of the schistosomiasis (ESQU) form's
      cure-confirmation criteria (e.g. negative follow-up stool exam) was
      met, one of several checkboxes (STCURA2, STCURA3) tracking different
      evidence of parasitological cure.
    code_system: none
    source: inferred
    reasoning: ESQU form; STCURA1/2/3 = situação de cura, numbered; width 1.

  STCURA2:
    official_name: Cura - Critério 2
    translated_name: Cure criterion (2nd)
    description: >
      Second cure-confirmation criterion tracked on the schistosomiasis
      follow-up form, alongside STCURA1 and STCURA3.
    code_system: none
    source: inferred
    reasoning: Second of three same-pattern fields; see STCURA1.

  STCURA3:
    official_name: Cura - Critério 3
    translated_name: Cure criterion (3rd)
    description: >
      Third cure-confirmation criterion, completing the set alongside
      STCURA1 and STCURA2.
    code_system: none
    source: inferred
    reasoning: Third of three same-pattern fields; see STCURA1.

  STDESCENDE:
    official_name: Sinais e sintomas - Paralisia descendente
    translated_name: Descending paralysis
    description: >
      Whether the patient shows the descending pattern of paralysis
      (starting cranial, progressing to limbs) that is the hallmark
      clinical course of botulism, unlike the ascending paralysis of
      Guillain-Barré syndrome.
    code_system: none
    source: inferred
    reasoning: BOTU form; STDESCENDE = descendente; width 1 checkbox.

  STDIARREIA:
    official_name: Sinais e sintomas - Diarreia
    translated_name: Diarrhea
    description: >
      Whether the botulism patient reports diarrhea, an early
      gastrointestinal symptom that can precede the disease's
      characteristic neurological signs.
    code_system: none
    source: inferred
    reasoning: BOTU form; STDIARREIA = diarreia; width 1 checkbox.

  STDIPLOPIA:
    official_name: Sinais e sintomas - Diplopia
    translated_name: Double vision (diplopia)
    description: >
      Whether the patient reports double vision, one of the earliest
      cranial-nerve signs of botulism, typically appearing with ptosis
      (STPTOSE) and mydriasis (STMIDRIASE).
    code_system: none
    source: inferred
    reasoning: BOTU form; STDIPLOPIA = diplopia; width 1 checkbox.

  STDISARTRI:
    official_name: Sinais e sintomas - Disartria
    translated_name: Dysarthria (slurred speech)
    description: >
      Whether the botulism patient shows dysarthria (difficulty
      articulating speech), a bulbar sign recorded alongside dysphagia
      (STDISFAGIA) and dysphonia (STDISFONIA).
    code_system: none
    source: inferred
    reasoning: BOTU form; STDISARTRI = disartria; width 1 checkbox.

  STDISFAGIA:
    official_name: Sinais e sintomas - Disfagia
    translated_name: Dysphagia (difficulty swallowing)
    description: >
      Whether the patient has difficulty swallowing, a bulbar sign of
      botulism recorded alongside dysarthria and dysphonia as the toxin
      affects the cranial nerves controlling the throat.
    code_system: none
    source: inferred
    reasoning: BOTU form; STDISFAGIA = disfagia; width 1 checkbox.

  STDISFONIA:
    official_name: Sinais e sintomas - Disfonia
    translated_name: Dysphonia (voice change)
    description: >
      Whether the patient's voice is altered (hoarse or weak), the third
      bulbar cranial-nerve sign recorded together with dysarthria and
      dysphagia in botulism's symptom checklist.
    code_system: none
    source: inferred
    reasoning: BOTU form; STDISFONIA = disfonia; width 1 checkbox.
