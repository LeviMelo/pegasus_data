system: SISCAN
asserted_by: pegasus_data
variables:
  CO_INSA_AC:
    official_name: Insatisf.Mat.Acelul
    translated_name: Unsatisfactory - acellular/hypocellular material
    description: >
      Flags a cervical cytology (Pap smear) sample rejected as unsatisfactory
      because it is acellular or hypocellular: too few epithelial cells present
      to allow reliable microscopic evaluation.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_AC "Insatisf.Mat.Acelul".

  CO_INSA_AR:
    official_name: Insatisf.dessecam.
    translated_name: Unsatisfactory - drying artifact
    description: >
      Flags a cervical cytology sample rejected as unsatisfactory because
      drying artifact (dessecamento) before fixation distorted the cells over
      most of the slide, making them unreadable.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_AR "Insatisf.dessecam.".

  CO_INSA_CO:
    official_name: Insatisf.cont.ext.
    translated_name: Unsatisfactory - external contaminants
    description: >
      Flags a cervical cytology sample rejected as unsatisfactory because
      external contaminants (lubricant, foreign material) cover most of the
      smear and obscure the cells.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_CO "Insatisf.cont.ext.".

  CO_INSA_OU:
    official_name: Insatisf.outras
    translated_name: Unsatisfactory - other reason
    description: >
      Flags a cervical cytology sample rejected as unsatisfactory for a reason
      other than the specific ones listed elsewhere (blood, drying, pus cells,
      contaminants, cell overlap, acellularity).
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_OU "Insatisf.outras".

  CO_INSA_PI:
    official_name: Insatisf.pres.pióc.
    translated_name: Unsatisfactory - pus cells present
    description: >
      Flags a cervical cytology sample rejected as unsatisfactory because
      pus cells (piócitos) from inflammation cover most of the smear,
      obscuring the epithelial cells needed for reading.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_PI "Insatisf.pres.pióc.".

  CO_INSA_SA:
    official_name: Insatisf.pres.sang.
    translated_name: Unsatisfactory - blood present
    description: >
      Flags a cervical cytology sample rejected as unsatisfactory because
      blood covers most of the smear, obscuring the epithelial cells needed
      for reading.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_SA "Insatisf.pres.sang.".

  CO_INSA_SU:
    official_name: Insatisf.superp.cel
    translated_name: Unsatisfactory - cell overlap
    description: >
      Flags a cervical cytology sample rejected as unsatisfactory because
      intense cell superposition (thick, overlapping layers of cells) prevents
      individual cells from being evaluated.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CO_INSA_SU "Insatisf.superp.cel".

  CO_MARG:
    official_name: Margens cirúrgicas
    translated_name: Surgical margin status
    description: >
      Reports whether the edges of a cervical cone/LEEP specimen are free of
      lesion or still show abnormal tissue at the cut margin, from the
      histopathology report; a compromised margin means disease may remain
      in the patient.
    code_system: internal
    codelists: [MARGEM]
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo CO_MARG "Margens cirúrgicas", lookup cnvdbf\margem.cnv.

  CO_MIC_ACT:
    official_name: Mic.actinomyces sp
    translated_name: Microbiology - Actinomyces sp.
    description: >
      Marks that the cervical Pap smear's microbiology assessment found
      organisms morphologically consistent with Actinomyces sp., a bacterium
      linked to IUD use and pelvic infection.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      CColo4.def has no entry for CO_MIC_ACT, but its microbiology block lists
      CMICACTI = "Mic.actinomyces sp" at the position matching this field's
      ACT suffix; DATASUS's CO_/CD_ = codigo naming grammar and the shared
      3-letter organism abbreviations across the CO_MIC_* set support the link.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICACTI "Mic.actinomyces sp".

  CO_MIC_BAC:
    official_name: Mic.outros bacilos
    translated_name: Microbiology - other bacilli
    description: >
      Marks that the cervical Pap smear's microbiology assessment found
      bacilli of a type not covered by the other named organisms (not
      Lactobacillus, not the Gardnerella/Mobiluncus-suggestive morphotype).
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICBACI = "Mic.outros bacilos", the same
      naming correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICBACI "Mic.outros bacilos".

  CO_MIC_CAN:
    official_name: Mic.CANDIDA sp
    translated_name: Microbiology - Candida sp.
    description: >
      Marks that the cervical Pap smear's microbiology assessment found
      Candida sp., the yeast that causes vaginal candidiasis, on the sample.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICCAND = "Mic.CANDIDA sp", the same naming
      correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICCAND "Mic.CANDIDA sp".

  CO_MIC_CHL:
    official_name: Mic.sug.chlamydia
    translated_name: Microbiology - suggestive of Chlamydia
    description: >
      Marks that the cervical Pap smear's microbiology assessment found cell
      changes suggestive of Chlamydia sp. infection, a presumptive cytology
      finding rather than a confirmed lab diagnosis.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICCHLA = "Mic.sug.chlamydia", the same
      naming correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICCHLA "Mic.sug.chlamydia".

  CO_MIC_COC:
    official_name: Mic.cocos
    translated_name: Microbiology - cocci
    description: >
      Marks that the cervical Pap smear's microbiology assessment found
      coccus-shaped bacteria on the sample, a nonspecific flora finding.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICCOCO = "Mic.cocos", the same naming
      correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICCOCO "Mic.cocos".

  CO_MIC_GAR:
    official_name: Mic.bacil supracit.
    translated_name: Microbiology - bacilli suggestive of Gardnerella/Mobiluncus
    description: >
      Marks that the cervical Pap smear's microbiology assessment found the
      bacterial morphotype associated with bacterial vaginosis (Gardnerella
      vaginalis / Mobiluncus sp.).
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICGARD = "Mic.bacil supracit." (bacilos
      supracitados, i.e. suggestive of Gardnerella/Mobiluncus), the same
      naming correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICGARD "Mic.bacil supracit.".

  CO_MIC_HER:
    official_name: Mic.vir gr.herpes
    translated_name: Microbiology - Herpes-group viral effect
    description: >
      Marks that the cervical Pap smear's microbiology assessment found a
      cytopathic effect (cell changes) compatible with infection by a virus
      of the Herpes group.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICHERP = "Mic.vir gr.herpes", the same
      naming correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICHERP "Mic.vir gr.herpes".

  CO_MIC_LAC:
    official_name: Mic.lactobacillus
    translated_name: Microbiology - Lactobacillus sp.
    description: >
      Marks that the cervical Pap smear's microbiology assessment found
      Lactobacillus sp., the normal, protective vaginal flora bacterium.
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICLACT = "Mic.lactobacillus", the same
      naming correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICLACT "Mic.lactobacillus".

  CO_MIC_OUT:
    official_name: Mic.outros
    translated_name: Microbiology - other organism
    description: >
      Marks that the cervical Pap smear's microbiology assessment found an
      organism or flora finding not covered by any of the other named
      categories (Lactobacillus, cocci, Candida, Chlamydia, herpes, etc.).
    code_system: none
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Matched via CColo4.def's CMICOUT = "Mic.outros", the same naming
      correspondence used for the other CO_MIC_* organism flags.
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> CColo4.def, campo CMICOUT "Mic.outros".

  ESCAMOSA:
    official_name: Esc.Indet não neop
    translated_name: Squamous atypia, undetermined, favor non-neoplastic
    description: >
      Marks a cervical biopsy diagnosis of squamous cell atypia of
      undetermined significance, classified by the pathologist as probably
      not a neoplastic (precancerous) lesion.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo ESCAMOSA "Esc.Indet não neop".

  ESCIEMCINV:
    official_name: Les.IEAG mic.inv
    translated_name: High-grade squamous lesion, cannot exclude microinvasion
    description: >
      Marks a cervical biopsy diagnosis of high-grade squamous intraepithelial
      lesion (HSIL) in which the pathologist cannot rule out early invasion
      (microinvasion) into the underlying stroma.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo ESCIEMCINV "Les.IEAG mic.inv".

  ESCINALT:
    official_name: Les.IE Alto Grau
    translated_name: High-grade squamous intraepithelial lesion
    description: >
      Marks a cervical biopsy diagnosis of high-grade squamous intraepithelial
      lesion (HSIL, roughly CIN II/III), a precancerous change confined to
      the epithelium that has not invaded the stroma.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo ESCINALT "Les.IE Alto Grau".

  ESCLIPBX:
    official_name: Les.IE Baixo Grau
    translated_name: Low-grade squamous intraepithelial lesion (biopsy)
    description: >
      Marks a cervical biopsy diagnosis of low-grade squamous intraepithelial
      lesion (LSIL, roughly CIN I), a mild precancerous change usually linked
      to HPV infection that often regresses on its own.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo ESCLIPBX "Les.IE Baixo Grau".

  GNALTGRAU:
    official_name: Gla.Indet alto grau
    translated_name: Glandular atypia, undetermined, favor high-grade
    description: >
      Marks a cervical biopsy diagnosis of glandular cell atypia of
      undetermined significance, classified by the pathologist as unable to
      rule out a high-grade (precancerous) glandular lesion.
    code_system: none
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/SISCAN/SISCOLO4/Auxiliar/TAB_SISCOLO4.zip
      -> HColo4.def, campo GNALTGRAU "Gla.Indet alto grau".
