# SIASUS — SIA.AC, the 2002 renal replacement therapy registry. Second batch
# of 25 columns: the rest of the PAF (second patient) block, then the start
# of UDI_ — the dialysis UNIT's own registration record (UDAC0201.DBF, 2
# rows for the 2 dialysis units operating in Acre in Jan 2002). See
# siasus_apac_registry.yml for the join structure and privacy notes.
#
# UDI_ fields mostly come in CGC/MN/RZ triples (tax id / municipality /
# legal name) naming an institution the dialysis unit is linked to — a
# backup hospital, a referral lab, an equipment vendor. Values were read
# directly off the two Acre rows: both units' AP/PC/RD/US "entity 1" is the
# same CNPJ, "FUNDHACRE" (Fundação Hospitalar do Acre, the state hospital
# foundation, Rio Branco/120040) — evidently the entity operating the unit
# itself rather than a distinct service partner. HG names a Rio Branco
# general hospital; HTP and LHC both resolve to the same institution,
# "HOSP. DE BASE DO DISTRITO FEDERAL" in Brasília (530010) — the out-of-state
# hospital Acre's dialysis units refer patients to for transplant workup and
# tissue typing. MED resolves to Baxter Hospitalar and a São Paulo equipment
# vendor; MTA to specialised maintenance contractors, one from outside Acre.
system: SIASUS
asserted_by: pegasus_data

variables:

  PAF_NUM:
    official_name: Número da APAC (bloco PAF)
    translated_name: APAC number, PAF block
    description: >
      The same eleven-digit APAC authorisation number as PAC_NUM, on the
      second patient block — the join key tying this row to the other six
      blocks of the archive. Unique across all 98 rows here.
    code_system: none
    source: inferred
    reasoning: >
      Same NUM stem as the already-documented PAC_NUM/EXA_NUM/OPC_NUM, all
      confirmed as the APAC join key; eleven digits, distinct on every row
      (98 of 98). The catalog's generic profiler flags this shape as
      "looks like a CPF", but an eleven-digit unique row key under the NUM
      stem, in a family where every other NUM column is the established
      join key, is read as the APAC number here, not a patient identifier.

  PAF_SEXOPC:
    official_name: Sexo do paciente (bloco PAF)
    translated_name: Patient sex, PAF block
    description: >
      Patient sex on the PAF block, M or F. 64 of the 98 rows are male, 34
      female.
    code_system: internal
    source: inferred
    reasoning: SEXOPC reads sexo do paciente; observed values are exactly M and F.

  PAF_SITTRA:
    official_name: Situação de transplante (bloco PAF)
    translated_name: Transplant status, PAF block
    description: >
      Transplant-status flag on the PAF block: 0 for 87 of the 98 rows, 1
      for the other 11. A simpler two-way version of the same SITTRA stem
      that later APAC dialysis layouts expand into a four-way fit/unfit/
      declined/not-applicable code.
    code_system: none
    source: inferred
    reasoning: >
      Same SITTRA stem as PAC_SITTRA (constant "0" there); here it varies
      between "0" and "1" across 98 rows, unlike PAC_SITTRA's single
      retired-looking placeholder value.

  PAF_UFNASC:
    official_name: UF de nascimento do paciente (bloco PAF)
    translated_name: Patient state of birth, PAF block
    description: >
      The PAF-block sibling of the already-documented PAC_UFNASC/OPC_UFNASC:
      two-letter state-of-birth abbreviation. 5 distinct states observed
      across the 98 rows.
    code_system: internal
    source: inferred
    reasoning: >
      Same UFNASC stem; matched DATASUS's two-letter UF pattern
      (alpha_rate 1.0) over all 98 non-null rows.

  UDI_APCGC1:
    official_name: CNPJ da entidade (1)
    translated_name: Linked-entity tax id, slot 1
    description: >
      Tax id (CNPJ) of the first entity linked to this dialysis unit's
      registration. Identical on both of the two Acre units in this file —
      63602940000170, the CNPJ of FUNDHACRE, the state hospital foundation —
      reading as the unit's own operating entity rather than a distinct
      backup-service partner.
    code_system: none
    source: inferred
    reasoning: >
      Measured constant "63602940000170" across both non-null rows in
      UDAC0201.DBF; the same CNPJ recurs as entity 1 of the UDI_PC, UDI_RD
      and UDI_US triples in this file, and as UDI_APRZ1's paired name,
      "FUNDHACRE".

  UDI_APCGC2:
    official_name: CNPJ da entidade (2)
    translated_name: Linked-entity tax id, slot 2
    description: >
      Tax id for a second linked entity in the same AP category as
      UDI_APCGC1. Unfilled in this file — both rows carry the all-zero
      placeholder, so no second entity was recorded.
    code_system: none
    source: inferred
    reasoning: >
      Measured constant "00000000000000" across both non-null rows, the
      standard DATASUS zero-fill for an empty CNPJ slot.

  UDI_APMN1:
    official_name: Município da entidade (1)
    translated_name: Linked-entity municipality, slot 1
    description: >
      Municipality of the entity named in UDI_APCGC1/APRZ1 — 120040 (Rio
      Branco, Acre) on both rows here, matching FUNDHACRE's home city.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: >
      Bound to MUNICBR at 0.9 confidence; both non-null rows read 120040,
      the IBGE code for Rio Branco.

  UDI_APMN2:
    official_name: Município da entidade (2)
    translated_name: Linked-entity municipality, slot 2
    description: >
      Municipality of the second AP entity. Never filled in this file —
      both rows are null, matching UDI_APCGC2 and UDI_APRZ2's empty slot 2.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: 0 of 2 rows non-null, consistent with an unfilled slot 2 across the AP triple.

  UDI_APRZ1:
    official_name: Razão social da entidade (1)
    translated_name: Linked-entity legal name, slot 1
    description: >
      Legal name of the entity in UDI_APCGC1/APMN1 — "FUNDHACRE" on both
      rows, the Fundação Hospitalar do Acre, the state authority operating
      this dialysis unit.
    code_system: none
    source: inferred
    reasoning: Measured constant "FUNDHACRE" across both non-null rows.

  UDI_APRZ2:
    official_name: Razão social da entidade (2)
    translated_name: Linked-entity legal name, slot 2
    description: >
      Legal name for the second AP entity. Never filled here, matching
      UDI_APCGC2 and UDI_APMN2's empty slot 2.
    code_system: none
    source: inferred
    reasoning: 0 of 2 rows non-null.

  UDI_CODUNI:
    official_name: Código da unidade
    translated_name: Establishment code, dialysis unit
    description: >
      Code of the dialysis unit itself, in the six-character form these
      2002-era files use rather than the seven-digit CNES that replaced it —
      the same convention already documented on EXA_CODUNI. The two rows
      here read 000002 and 000240, one per Acre dialysis unit.
    code_system: external
    source: inferred
    reasoning: >
      Same CODUNI stem as the already-documented EXA_CODUNI; two distinct
      six-character values, one per row.

  UDI_CONDIC:
    official_name: Condição do registro (bloco UDI)
    translated_name: Record condition flag, dialysis unit block
    description: >
      The same two-letter "EC" processing-status flag documented on
      COB_CONDIC and EXA_CONDIC, here on the dialysis unit's own record.
      Constant across both rows.
    code_system: none
    source: inferred
    reasoning: Same CONDIC stem, same constant "EC" value, as COB_CONDIC/EXA_CONDIC.

  UDI_DATREF:
    official_name: Data de referência (bloco UDI)
    translated_name: Reference year-month, dialysis unit block
    description: >
      Competência this dialysis unit registration is reported under, as
      AAAAMM — the same DATREF stem already documented on EXA_DATREF.
      Constant at 200201 (January 2002) across both rows.
    code_system: none
    source: inferred
    reasoning: Same DATREF stem as EXA_DATREF; constant "200201" across both rows.

  UDI_DIRCPF:
    official_name: CPF do diretor
    translated_name: Clinic director's CPF
    description: >
      The dialysis unit director's CPF — a real taxpayer number, unlike the
      patient CPFPCN columns elsewhere in this archive. One distinct value
      per unit (2 rows, 2 CPFs), paired with the director's name in
      UDI_DIRNM.
    code_system: none
    source: inferred
    reasoning: >
      DIR CPF reads CPF do diretor; per the task brief's check-digit survey
      this column passes the CPF check digit 100% of the time, unlike the
      *_CPFPCN patient-pseudonym columns.
    notes: >
      A genuine direct identifier, but of a facility director acting in a
      professional capacity, not of a patient — a materially different
      privacy posture from the patient CPFPCN/serology combination flagged
      in siasus_apac_registry.yml.

  UDI_DIRNM:
    official_name: Nome do diretor
    translated_name: Clinic director's name
    description: >
      Full name of the dialysis unit's director, paired with UDI_DIRCPF.
      Two distinct names observed, one per Acre unit in this file.
    code_system: none
    source: inferred
    reasoning: DIR NM reads nome do diretor; paired one-to-one with UDI_DIRCPF.

  UDI_GESTAO:
    official_name: Gestão (bloco UDI)
    translated_name: Managing authority, dialysis unit block
    description: >
      Which authority manages the dialysis unit, recorded as a municipality
      code — the same GESTAO convention already documented on EXA_GESTAO.
      Both rows read 129999, the Acre state code with the 9999 suffix
      DATASUS uses for state-level rather than municipal management.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: >
      Same GESTAO stem as EXA_GESTAO; bound to MUNICBR; both rows read
      129999.

  UDI_HGCGC1:
    official_name: CNPJ do hospital geral de apoio (1)
    translated_name: Backup general hospital tax id, slot 1
    description: >
      Tax id of the general hospital this dialysis unit relies on for
      emergencies and admissions it cannot handle itself — constant
      04034526000224 across both rows, one branch of the Rio Branco general
      hospital group named in UDI_HGRZ1.
    code_system: none
    source: inferred
    reasoning: >
      HG reads Hospital Geral; the paired UDI_HGRZ1 values ("HOSP.DE
      CLINICAS DE RIO BRANCO", "HOSP.GERAL DE CLINICAS DE R BRANCO") are
      general-hospital names, confirming the reading. Constant CNPJ across
      both rows.

  UDI_HGCGC2:
    official_name: CNPJ do hospital geral de apoio (2)
    translated_name: Backup general hospital tax id, slot 2
    description: >
      Tax id for a second backup-hospital slot. Both rows read
      63602940000170 — FUNDHACRE's own CNPJ again, rather than a distinct
      second hospital.
    code_system: none
    source: inferred
    reasoning: >
      Constant "63602940000170" across both rows, matching UDI_APCGC1's
      value and UDI_HGRZ2's paired "FUNDHACRE".

  UDI_HGMN1:
    official_name: Município do hospital geral de apoio (1)
    translated_name: Backup general hospital municipality, slot 1
    description: >
      Municipality of the first backup hospital — 120040, Rio Branco, on
      both rows.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: Bound to MUNICBR; both non-null rows read 120040.

  UDI_HGMN2:
    official_name: Município do hospital geral de apoio (2)
    translated_name: Backup general hospital municipality, slot 2
    description: >
      Municipality of the second backup-hospital slot — also 120040, Rio
      Branco, consistent with UDI_HGCGC2 pointing back to the local
      FUNDHACRE entity rather than an outside hospital.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: Bound to MUNICBR; both non-null rows read 120040.

  UDI_HGRZ1:
    official_name: Razão social do hospital geral de apoio (1)
    translated_name: Backup general hospital legal name, slot 1
    description: >
      Legal name of the first backup hospital: "HOSP.DE CLINICAS DE RIO
      BRANCO" on one Acre unit's row and "HOSP.GERAL DE CLINICAS DE R
      BRANCO" on the other — the same Rio Branco general hospital, spelled
      slightly differently between the two units' submissions.
    code_system: none
    source: inferred
    reasoning: Two distinct values observed, both naming the same Rio Branco general hospital.

  UDI_HGRZ2:
    official_name: Razão social do hospital geral de apoio (2)
    translated_name: Backup general hospital legal name, slot 2
    description: >
      Legal name for the second backup-hospital slot — "FUNDHACRE" on both
      rows, again the unit's own operating foundation rather than a named
      hospital.
    code_system: none
    source: inferred
    reasoning: Constant "FUNDHACRE" across both rows.

  UDI_HTPCGC:
    official_name: CNPJ do hospital para transplante renal
    translated_name: Renal-transplant referral hospital tax id
    description: >
      Tax id of the hospital this dialysis unit refers patients to for
      kidney transplantation. Constant 00054015000213 across both rows —
      the CNPJ of the Hospital de Base do Distrito Federal in Brasília,
      outside Acre entirely, since the state has no transplant centre of
      its own.
    code_system: none
    source: inferred
    reasoning: >
      HTP reads Hospital para Transplante; the paired UDI_HTPRZ value,
      "HOSP. DE BASE DO DISTRITO FEDERAL", and UDI_HTPMN's municipality code
      530010 (Brasília), confirm an out-of-state transplant-referral
      hospital rather than a local one.

  UDI_HTPMN:
    official_name: Município do hospital para transplante renal
    translated_name: Renal-transplant referral hospital municipality
    description: >
      Municipality of the transplant-referral hospital — 530010, Brasília/
      Distrito Federal, on both rows, not a municipality in Acre at all.
    code_system: external
    codelists: [MUNICBR]
    source: inferred
    reasoning: Bound to MUNICBR; both non-null rows read 530010, the Distrito Federal code.

  UDI_HTPRZ:
    official_name: Razão social do hospital para transplante renal
    translated_name: Renal-transplant referral hospital legal name
    description: >
      Legal name of the transplant-referral hospital: "HOSP. DE BASE DO
      DISTRITO FEDERAL", constant across both Acre units in this file.
    code_system: none
    source: inferred
    reasoning: Measured constant "HOSP. DE BASE DO DISTRITO FEDERAL" across both rows.
