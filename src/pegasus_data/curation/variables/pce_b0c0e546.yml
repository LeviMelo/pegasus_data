system: PCE
asserted_by: pegasus_data
variables:

  QT_17:
    official_name: Positivos, 17 ou mais ovos
    translated_name: Positives, 17+ eggs
    description: >
      Número de pessoas cujo exame de lâmina identificou 17 ou mais ovos de
      Schistosoma mansoni na coproscopia - a faixa de maior carga parasitária,
      a terceira parcela cuja soma com QT_1A4 e QT_5A16 dá QT_POS.
    code_system: none
    source: layout_doc
    source_ref: >
      DIC_DADOS_SISPCE_PCE-DG.pdf, página 1 (campo QT_17), revisado em
      novembro/2021; confirmado na nota técnica do PCE no TabNet ("17 mais
      ovos"), http://tabnet.datasus.gov.br/cgi/sinan/pce/PCE-nota-tecnica.pdf
    depends_on: [QT_POS]

  CS_FASE:
    official_name: Fase da atividade (categoria)
    translated_name: Program phase (category)
    description: >
      Marca se a localidade está na fase ativa de inquérito/tratamento do PCE
      ou já foi reclassificada para "fase de vigilância" - positividade abaixo
      de 5% em dois ciclos consecutivos, reavaliada a cada 4 anos.
    code_system: internal
    source: inferred
    reasoning: >
      Prefixo CS_ é o padrão DATASUS para característica/categoria. "Fase"
      corresponde ao conceito operacional das Diretrizes Técnicas Nacionais
      para a Vigilância da Esquistossomose Mansoni (2024, Ministério da
      Saúde) - localidades transitam de fase ativa de controle para "fase de
      vigilância" conforme critérios de positividade e número de ciclos. O
      campo só aparece nos arquivos de 2024-2026 (33 arquivos), mesma leva em
      que surge ID_DRS, coerente com a publicação dessa diretriz em nov/2024.
    notes: >
      Inferência de confiança moderada: nenhum dicionário de dados lista este
      campo nem seus códigos; a largura declarada (1 caractere) é compatível
      com poucas categorias de fase, mas os valores específicos não foram
      confirmados em nenhuma fonte.

  NU_FASE:
    official_name: Número do ciclo de trabalho
    translated_name: Work cycle number
    description: >
      Contador numérico do ciclo de inquérito coproscópico ao qual o registro
      pertence - as diretrizes do PCE exigem rastrear pelo menos dois ciclos
      consecutivos (incluindo o Levantamento Inicial) antes de mudar a fase
      da localidade.
    code_system: none
    source: inferred
    reasoning: >
      Prefixo NU_ é o padrão DATASUS para número/contador. As Diretrizes
      Técnicas Nacionais para a Vigilância da Esquistossomose Mansoni (2024)
      descrevem explicitamente o "número de ciclos de trabalho" (pelo menos
      dois, inclusive o LI) como critério operacional do programa - conceito
      que corresponde ao nome do campo. Aparece na mesma leva de arquivos
      (2024-2026) que CS_FASE e ID_DRS.
    notes: >
      Inferência de confiança moderada: não há dicionário de dados nem lista
      de valores para este campo; a correspondência com "ciclo de trabalho" é
      dedução a partir do nome e do contexto operacional documentado, não
      confirmação direta.
