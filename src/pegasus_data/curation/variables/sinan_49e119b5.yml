system: SINAN
asserted_by: pegasus_data
variables:
  EMAGRA:
    official_name: Sinais e Sintomas - Emagrecimento
    translated_name: Weight loss
    description: >
      Whether the visceral leishmaniasis patient showed weight loss at diagnosis,
      one of the disease's defining wasting signs alongside fever and weakness.
      1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas - Emagrecimento)
  FRAQUEZA:
    official_name: Sinais e Sintomas - Fraqueza
    translated_name: Weakness
    description: >
      Whether the visceral leishmaniasis patient reported weakness (asthenia) at
      diagnosis, recorded alongside fever and weight loss as one of the disease's
      core presenting symptoms. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas - Fraqueza)
  FIGADO:
    official_name: Sinais e Sintomas - Aumento do Fígado
    translated_name: Enlarged liver
    description: >
      Whether the visceral leishmaniasis patient showed liver enlargement
      (hepatomegaly) at diagnosis, one of the disease's classic organomegaly
      signs alongside splenomegaly. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas - Aumento do Fígado)
  FALENCIA:
    official_name: Outra droga utilizada, na falência do tratamento inicial
    translated_name: Drug used after initial treatment failure
    description: >
      Second-line drug given when the visceral leishmaniasis patient's first-line
      antimonial treatment failed. 1=Anfotericina B, 2=Anfotericina B lipossomal,
      3=Outras, 4=Não se aplica (no failure occurred).
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 43
  EPIS_RACIO:
    official_name: Episódio Reacional Durante o Tratamento
    translated_name: Reactional episode during treatment
    description: >
      Type of leprosy immune-reaction episode the patient had during multidrug
      therapy. 1=Reação tipo 1 (reversal reaction), 2=Reação tipo 2 (erythema
      nodosum leprosum), 3=both types occurred during treatment.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 16
  FORMACLINI:
    official_name: Forma Clínica
    translated_name: Clinical form
    description: >
      Leprosy's clinical form at diagnosis per the Madrid classification, which
      reflects the patient's immune response to M. leprae. 1=Indeterminada,
      2=Tuberculóide, 3=Dimorfa, 4=Virchowiana, 5=Não classificado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 34
  ESQ_INI_N:
    official_name: Esquema terapêutico inicial
    translated_name: Initial therapeutic regimen
    description: >
      Multidrug therapy regimen prescribed at diagnosis, chosen from the
      operational classification (paucibacillary/multibacillary) made at that
      time. 1=PQT/PB/6 doses, 2=PQT/MB/12 doses, 3=Outros Esquemas Substitutos.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 42
  ESQ_ATU_N:
    official_name: Esquema terapêutico atual
    translated_name: Current therapeutic regimen
    description: >
      Multidrug therapy regimen the leprosy patient is currently on; auto-filled
      from the initial regimen at first entry but editable if the scheme changes
      during follow-up. 1=PQT/PB/6 doses, 2=PQT/MB/12 doses, 3=Outros Substitutos.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hanseniase_v5.pdf, campo 14 (Tela de Acompanhamento)
  ESPECIFICO:
    official_name: Tipo de Tratamento - Específico
    translated_name: Specific antiparasitic treatment given
    description: >
      Whether the acute Chagas disease patient received specific antiparasitic
      drug treatment (benznidazole or an alternative) rather than only
      symptomatic care. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 53
  ESPLENOM:
    official_name: Sinais e sintomas - Esplenomegalia
    translated_name: Enlarged spleen
    description: >
      Whether the acute Chagas disease patient presented an enlarged spleen on
      exam, one of the acute-phase clinical signs recorded alongside
      hepatomegaly and fever. 1=Sim, 2=Não, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 41
  EXAME:
    official_name: Exames Realizados - Parasitológico Direto, Exame a Fresco
    translated_name: Fresh blood smear exam result
    description: >
      Result of the fresh-blood-smear direct parasitological exam looking for
      T. cruzi parasites in a suspected acute Chagas disease case.
      1=Positivo, 2=Negativo, 3=Não realizado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 43
  FISCALIZA:
    official_name: Fiscalização Sanitária em Unidade de Hemoterapia
    translated_name: Blood bank sanitary inspection
    description: >
      Whether health authorities inspected the blood transfusion service tied to
      a transfusion-suspected Chagas case, as a control measure after the case
      was investigated. 1=Sim, 2=Não, 3=Não se aplica, 9=Ignorado.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Chagas_v5.pdf, campo 56
  GRAV_PULSO:
    official_name: Dengue grave - Pulso débil ou indetectável
    translated_name: Weak or undetectable pulse
    description: >
      Whether the dengue patient, once classified as severe dengue, had a weak
      or undetectable pulse, a classic sign of hypovolemic shock in dengue
      shock syndrome. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_CONV:
    official_name: Dengue grave - PA convergente
    translated_name: Convergent blood pressure
    description: >
      Whether the severe-dengue patient's systolic and diastolic pressures
      converged to within 20mmHg of each other, a shock warning sign; despite
      the DBF field name, it records convergent pressure, not convulsion.
      1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_ENCH:
    official_name: Dengue grave - Tempo de enchimento capilar
    translated_name: Capillary refill time
    description: >
      Whether the severe-dengue patient had a prolonged capillary refill time,
      a bedside sign of poor peripheral circulation used to flag impending
      shock. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_EXTRE:
    official_name: Dengue grave - Extremidades frias
    translated_name: Cold extremities
    description: >
      Whether the severe-dengue patient's hands and feet were cold to the
      touch, a sign of poor peripheral perfusion consistent with dengue shock
      syndrome. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_HEMAT:
    official_name: Dengue grave - Hematêmese
    translated_name: Vomiting blood
    description: >
      Whether the severe-dengue patient vomited blood, a severe hemorrhagic
      manifestation recorded only for cases the investigator classified as
      severe dengue. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_HIPOT:
    official_name: Dengue grave - Hipotensão arterial em fase tardia
    translated_name: Late-phase hypotension
    description: >
      Whether the severe-dengue patient developed low blood pressure in the
      late, critical phase of illness, marking decompensated dengue shock.
      1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_INSUF:
    official_name: Dengue grave - Acúmulo de líquidos com insuficiência respiratória
    translated_name: Fluid accumulation with respiratory distress
    description: >
      Whether the severe-dengue patient had fluid buildup, such as pleural
      effusion or ascites, severe enough to cause respiratory distress.
      1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_MELEN:
    official_name: Dengue grave - Melena
    translated_name: Blood in stool
    description: >
      Whether the severe-dengue patient passed melena, black tarry stool from
      digested blood, indicating gastrointestinal hemorrhage. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_METRO:
    official_name: Dengue grave - Metrorragia volumosa
    translated_name: Heavy vaginal bleeding
    description: >
      Whether the severe-dengue patient had heavy abnormal vaginal bleeding
      outside the menstrual cycle, one of the severe hemorrhagic manifestations
      tracked for severe dengue. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_MIOC:
    official_name: Dengue grave - Miocardite
    translated_name: Myocarditis
    description: >
      Whether the severe-dengue patient developed myocarditis, heart-muscle
      inflammation treated as severe organ involvement. Recorded only for
      cases classified as severe dengue. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_AST:
    official_name: Dengue grave - AST/ALT >1.000
    translated_name: Severe liver enzyme elevation
    description: >
      Whether the severe-dengue patient's liver transaminases (AST/ALT) rose
      above 1,000, marking severe hepatic injury. Recorded only when the case
      is classified as severe dengue. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_CONSC:
    official_name: Dengue grave - Alteração da consciência
    translated_name: Altered consciousness
    description: >
      Whether the severe-dengue patient showed altered level of consciousness,
      one of the organ-involvement signs defining severe dengue. Recorded only
      for cases classified as severe dengue. 1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
  GRAV_ORGAO:
    official_name: Dengue grave - Outros órgãos
    translated_name: Other organ involvement
    description: >
      Whether the severe-dengue patient had severe involvement of an organ not
      covered by the other GRAV_ fields, such as kidneys, CNS, or pancreas.
      1=Sim, 2=Não.
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya), campo 70
