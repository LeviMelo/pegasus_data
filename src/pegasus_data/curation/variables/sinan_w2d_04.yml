system: SINAN
asserted_by: pegasus_data

variables:
  AUMENTO:
    official_name: Aumento de órgão (hepatoesplenomegalia)
    translated_name: Organ enlargement (flag)
    description: >
      Whether the acute Chagas disease patient showed organ enlargement
      (hepatomegaly/splenomegaly), a classic sign of the systemic
      inflammation and myocarditis seen in the acute phase.
    code_system: none
    source: inferred
    reasoning: >
      AUMENTO = aumento (enlargement); hepatosplenomegaly is a named
      clinical sign on the Chagas (CHAG) investigation form's exam
      checklist, C1 width fits a checkbox.

  DT_COL_S2:
    official_name: Data da coleta - sorologia 2
    translated_name: Date of second serology sample
    description: >
      Collection date of the second (convalescent) serology sample for
      Chagas disease confirmation, paired with a first-sample draw to show
      antibody titer change over time.
    code_system: none
    source: inferred
    reasoning: >
      DT_ = data, COL = coleta, S2 = segunda sorologia; D8 date type
      matches, and paired-sample serology is standard practice for
      Chagas confirmation.

  IMUNO:
    official_name: Método imunológico utilizado
    translated_name: Immunological test method used (flag)
    description: >
      Whether an immunological/serological method (ELISA, indirect
      immunofluorescence, indirect hemagglutination) was used to confirm
      the Chagas disease case, one of several confirmatory method
      categories alongside parasitological and histopathological tests.
    code_system: none
    source: inferred
    reasoning: >
      IMUNO = imunológico; C1 width fits a checkbox, and serology is a
      standard confirmatory route for Chagas disease alongside the direct
      parasitological methods.

  RAI_RESULT:
    official_name: Resultado - reação de aglutinação indireta
    translated_name: Indirect agglutination test result
    description: >
      Free-text result of an indirect hemagglutination/agglutination
      serology test for Chagas disease, one of the named confirmatory
      antibody assays alongside indirect immunofluorescence and ELISA.
    code_system: none
    source: inferred
    reasoning: >
      RAI = reação de aglutinação indireta, RESULT = resultado; C20 width
      fits a free-text or titer-style result rather than a single code.

  RESUL_HIS:
    official_name: Resultado - exame histopatológico
    translated_name: Histopathology exam result
    description: >
      Date/result of histopathological examination for Chagas disease
      confirmation (e.g. tissue biopsy showing amastigotes), a less
      common confirmatory method than serology or direct parasitology.
    code_system: none
    source: inferred
    reasoning: >
      RESUL_ = resultado, HIS = histopatológico; D8 declared type suggests
      the field actually stores the exam date rather than a result code.

  TEMPO:
    official_name: Tempo entre exposição e sintomas
    translated_name: Days from exposure to symptom onset
    description: >
      Number of days between the suspected Chagas exposure (or symptom
      onset) and diagnosis/notification, an interval used to characterize
      the case timeline.
    code_system: none
    source: inferred
    reasoning: >
      TEMPO = tempo (time interval); N3 numeric width fits a day count up
      to a few hundred days.

  COUNIDINF:
    official_name: Código da unidade de infecção
    translated_name: Facility code where infection occurred
    description: >
      Code of the health facility where a neonatal tetanus infection
      likely occurred (e.g. site of unhygienic cord care or delivery),
      distinct from the unit that notified the case.
    code_system: none
    source: inferred
    reasoning: >
      CO_ = código, UNID = unidade, INF = infecção; C7 width fits a
      facility code, consistent with SINAN's practice of tracking the
      infection site's own facility on the neonatal tetanus (TETN) form.

  CS_COBERTU:
    official_name: Cobertura vacinal da mãe
    translated_name: Maternal tetanus vaccination coverage (flag)
    description: >
      Whether the mother had adequate tetanus toxoid vaccination coverage
      at the time of delivery - the key preventable risk factor tracked on
      the neonatal tetanus investigation form.
    code_system: none
    source: inferred
    reasoning: >
      CS_ = cobertura, COBERTU = cobertura (vacinal); maternal
      immunization status is the central risk factor for neonatal
      tetanus, C1 fits a checkbox.

  CS_OUTRAS:
    official_name: Cobertura - outras características
    translated_name: Other coverage-related factor (flag)
    description: >
      Whether another vaccine-coverage-related factor, beyond the standard
      checklist, applied to the mother - paired with the free-text detail
      field NO_COBOUTR.
    code_system: none
    source: inferred
    reasoning: >
      CS_ = cobertura, OUTRAS = outras; shares the "coverage" root with
      CS_COBERTU and pairs with NO_COBOUTR's free-text detail, matching
      the flag+detail pattern.

  DS_INF_OUT:
    official_name: Descrição de outra circunstância de infecção
    translated_name: Other infection circumstance (free text)
    description: >
      Free-text description of an unlisted circumstance of neonatal
      tetanus infection (e.g. a non-standard cord-care practice), filled
      in when the standard checklist doesn't capture it.
    code_system: none
    source: inferred
    reasoning: >
      DS_ = descrição, INF = infecção, OUT = outro; C30 width fits free
      text, matching the "other, specify" pattern used across SINAN forms.

  NO_COBOUTR:
    official_name: Nome - outra cobertura
    translated_name: Other vaccine-coverage detail (free text)
    description: >
      Free-text name/detail of another maternal vaccine-coverage item not
      captured by the standard checklist, paired with the CS_OUTRAS flag
      that marks it applies.
    code_system: none
    source: inferred
    reasoning: >
      NO_ = nome, COB = cobertura, OUTR = outro; C30 width fits free text,
      and it shares the "cobertura" root with CS_COBERTU/CS_OUTRAS.

  NU_GESTA:
    official_name: Número de gestações
    translated_name: Number of pregnancies (parity)
    description: >
      Coded count of the mother's pregnancies (parity), recorded on the
      neonatal tetanus form to characterize her obstetric history and
      prior exposure to antenatal care/vaccination opportunities.
    code_system: none
    source: inferred
    reasoning: >
      NU_ = número, GESTA = gestação(ões); C1 width fits a short coded
      count rather than free text.

  CIRC_LESAO:
    official_name: Circunstância da lesão
    translated_name: Circumstance of the injury (code)
    description: >
      Coded circumstance under which the injury occurred (e.g.
      intentional vs. accidental context), part of the injury-description
      section on the interpersonal/self-inflicted violence (VIOL)
      notification form.
    code_system: none
    source: inferred
    reasoning: >
      CIRC_ = circunstância, LESAO = lesão; C5 width fits a short coded
      value rather than free text.

  ENC_MPU:
    official_name: Encaminhamento ao Ministério Público
    translated_name: Referred to the Public Prosecutor's Office (flag)
    description: >
      Whether the violence case was referred to the Ministério Público
      (public prosecutor's office), one of several mandatory-referral
      network flags alongside the Conselho Tutelar and police on the VIOL
      form.
    code_system: none
    source: inferred
    reasoning: >
      ENC_ = encaminhamento, MPU = Ministério Público; referral tracking
      to protective/legal bodies is a standard section of the violence
      notification form.

  LESAO_ESPE:
    official_name: Especificação da lesão
    translated_name: Injury specification (free text)
    description: >
      Free-text specification of the type of injury/lesion suffered by the
      violence victim, filled in when the form's standard injury checklist
      doesn't cover the case.
    code_system: none
    source: inferred
    reasoning: >
      LESAO_ = lesão, ESPE = especifique; C30 width fits free text,
      following the "specify" pattern paired with a checkbox list.

  SEX_ESPEC:
    official_name: Especificação da violência sexual
    translated_name: Sexual violence detail (free text)
    description: >
      Free-text detail specifying the type of sexual violence experienced,
      filled in when the case involves sexual violence beyond the form's
      standard checkbox categories.
    code_system: none
    source: inferred
    reasoning: >
      SEX_ = sexual, ESPEC = especifique; C30 width fits free text, and
      sexual-violence detail is a distinct section on the VIOL form.

  VIOL_INFAN:
    official_name: Violência infantil
    translated_name: Child-victim violence (flag)
    description: >
      Whether the notified violence case specifically involves a child
      victim (violência infantil), a classification flag distinguishing
      child-focused cases within the broader violence surveillance form.
    code_system: none
    source: inferred
    reasoning: >
      VIOL_ = violência, INFAN = infantil; C1 width fits a checkbox
      distinguishing this population subgroup within the VIOL series.

  CON_INF_BA:
    official_name: Bairro provável de infecção
    translated_name: Probable-infection neighborhood
    description: >
      Reference to the neighborhood (bairro) associated with the probable
      infection location for visceral leishmaniasis, part of the local
      location-tracing fields alongside CO_UF_3 and DS_MUN_2.
    code_system: none
    source: inferred
    reasoning: >
      CON_ = condição/local, INF = infecção, BA = bairro; sits with the
      LEIV series' other location fields tracking where infection likely
      occurred.

  CO_UF_3:
    official_name: Código UF (local 3)
    translated_name: State code (location field 3)
    description: >
      Two-letter Brazilian state code for a third location field on the
      visceral leishmaniasis form - e.g. a probable-infection state
      distinct from the residence state - paired with DS_MUN_2's
      municipality name.
    code_system: none
    source: inferred
    reasoning: >
      CO_ = código, UF = unidade federativa, "3" marks it as a third
      location slot in a numbered series; C2 width matches a state
      abbreviation.

  DS_MUN_2:
    official_name: Descrição do município (local 2)
    translated_name: Municipality name (location field 2)
    description: >
      Free-text municipality name for a second location field on the
      visceral leishmaniasis form (e.g. probable infection site), distinct
      from the coded residence municipality, paired with CO_UF_3's state
      code.
    code_system: none
    source: inferred
    reasoning: >
      DS_ = descrição, MUN = município, "2" marks the second location
      slot; C60 width fits a free-text place name rather than an IBGE
      code.

  PALIDEZ:
    official_name: Palidez
    translated_name: Pallor (flag)
    description: >
      Whether the visceral leishmaniasis patient showed pallor, the
      clinical sign of the anemia caused by bone-marrow suppression that
      is characteristic of this disease: 1=Sim, 2=Não.
    code_system: internal
    source: inferred
    reasoning: >
      Catalog dictionary gives values 1=Sim, 2=Não; pallor from anemia is
      a textbook visceral leishmaniasis (kala-azar) clinical finding.
