system: PNI
asserted_by: pegasus_data
variables:

  ANO:
    official_name: Ano
    translated_name: Year (reference/competency year)
    description: >
      Calendar year the row's doses-applied total or coverage percentage is
      attributed to (ano de competência) — not necessarily the exact
      vaccination date. Spans every PNI coverage and doses-applied series.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf
    notes: >
      1994-1996 rows are structurally missing several UFs (e.g. all of 1994
      lacks Alagoas, Amapá, DF, MS, MG, Paraíba, Paraná, RJ, RS, SP, Sergipe
      and Tocantins) because the system was still rolling out there — an
      absent row is not a zero. Also spuriously bound to codelists ANO/MESC
      even though it is a plain year, not a category.

  UF:
    official_name: Unidade da Federação
    translated_name: State (UF) of vaccine application
    description: >
      IBGE code, letter code, or name (depending on the resolving table) of
      the state where the vaccine was administered — the administration
      site, not the patient's state of residence.
    code_system: external
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf
    notes: >
      Shares the 1994-1996 rollout gaps documented under ANO: an absent UF
      in an early year means not-yet-rolled-out, not a real zero.

  MUNIC:
    official_name: Município
    translated_name: Municipality of vaccine application
    description: >
      IBGE municipality code (6 or 7 digits, depending on the file) of
      where the vaccine was administered — administration site, not the
      patient's home municipality.
    code_system: external
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf

  IMUNO:
    official_name: Imunobiológico
    translated_name: Immunobiologic (vaccine, serum or immunoglobulin) type
    description: >
      Which immunobiologic the row's dose total or coverage figure refers
      to — BCG, Hepatite A/B, Tríplice Viral, Pentavalente, VOP/VIP,
      Toxóide Tetânico, an antivenom serum, an immunoglobulin, etc. — coded
      per DATASUS's Tabela de Imunobiológicos.
    code_system: internal
    codelists: [IMUNO, IMUNOC, COBIMUNO, COBIMUC, IMUNOCOB]
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf
    notes: >
      Vaccines enter and leave the PNI calendar over time (e.g. monovalent
      Sarampo only through 2002, replaced by Tríplice Viral in 2003; Penta
      only from mid-2012), and which DOSE/FX_ETARIA values apply to a given
      IMUNO code depends on its active period.

  DOSE:
    official_name: Dose
    translated_name: Dose type / sequence within the scheme
    description: >
      Which dose in the multidose schedule a row reports: dose única,
      1ª-4ª dose, 1º/2º reforço (booster), revacinação, dose inicial, dose
      adicional, or a generic "dose"/"tratamento" code, per DOSE.CNV.
    code_system: internal
    codelists: [DOSE]
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf
    notes: >
      The same DOSE code marks a different point in the schedule depending
      on IMUNO — "3ª dose" of Hepatite B and "3ª dose" of Poliomielite oral
      are different clinical events.

  FX_ETARIA:
    official_name: Faixa Etária
    translated_name: Age bracket of the vaccinated individual
    description: >
      Age bracket of the vaccinated individual (e.g. menor de 1 ano, 1 ano,
      5 a 9 anos, 60 anos e mais) — the specific set of brackets collected
      differs by immunobiologic.
    code_system: internal
    codelists: [FXET]
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf
    notes: >
      BCG's brackets stop at "7 a 14 anos"/"15 a 59 anos"/"60 anos e mais"
      and never use "5 a 9 anos", unlike vaccines such as Febre Amarela —
      querying BCG against a bracket outside its own scheme returns zero
      rows. FXET.CNV also groups several raw codes under one bracket label
      (e.g. "6 meses a 1 ano" groups "--, G1, H2"), so a bracket's meaning
      is not guaranteed stable across the dataset's history.

  QT_DOSE:
    official_name: Quantidade de Doses Aplicadas
    translated_name: Number of doses applied
    description: >
      Number of vaccine doses administered for the row's year × location ×
      immunobiologic × dose × age-bracket combination — a raw
      administrative total, not a rate or percentage.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Doses_aplicadas_desde_1994.pdf
    notes: >
      Declared as Character with widths 8, 10 or 40 across different .DEF
      files despite holding a numeric total — a DEF-authoring quirk, not
      evidence the column is textual. Also spuriously bound to a codelist
      named "100".

  COBERT:
    official_name: Cobertura Vacinal
    translated_name: Vaccination coverage (percent)
    description: >
      Vaccination coverage percentage: doses applied of the vaccine's
      reference dose (D1, D2, D3, DU, or D, depending on the vaccine)
      divided by target population (POP), times 100.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Cobertura_desde_1994.pdf
    notes: >
      Which dose counts as "the indicated dose" is vaccine-specific (e.g.
      BCG sums dose-única, Hepatite B sums D3 pooled across
      HB+PENTA+HEXA). Values above 100% occur because POP is an estimate,
      not a census of who actually presented for vaccination.

  POP:
    official_name: População Alvo
    translated_name: Target population (coverage denominator)
    description: >
      Target population used as COBERT's denominator, by
      municipality/UF, year and age bracket — IBGE census/estimate data
      through 2005, then SINASC live births for the infant brackets from
      2006 onward.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/Nota_Tecnica_Imunizacoes_Cobertura_desde_1994.pdf
    notes: >
      Not the same series as "população residente" published elsewhere on
      DATASUS: CGPNI deliberately kept each year's first preliminary IBGE
      estimate even after later revisions. SINASC-sourced infant counts lag
      and get backfilled with the prior year's figure when not yet
      available.

  DOSE1:
    official_name: Doses D1 (dose inicial do esquema)
    translated_name: First-dose (D1) count for a dropout-rate scheme
    description: >
      Count of first-dose (D1) applications for a vaccine's schedule — the
      base figure of PNI's dropout-rate (taxa de abandono) calculation,
      produced only for the handful of multidose vaccines the report covers.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/notatecnicaTx.pdf
    notes: >
      Covers Hepatite B, Rotavírus (VORH), Pneumocócica 10/13V,
      Meningocócica C, VIP/VOP sequential, Pentavalente, Tríplice Viral,
      combined Poliomielite and Tetravalente only.

  DOSEN:
    official_name: Doses Dn (dose final do esquema)
    translated_name: Final-dose count for a dropout-rate scheme
    description: >
      Count of applications of whichever dose closes a vaccine's primary
      series — D3 for most of the covered vaccines, but D2 for Rotavírus,
      Meningocócica C, and (from 2013) Tríplice Viral.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/notatecnicaTx.pdf
    notes: >
      Which literal dose (D2 vs D3) a DOSEN value represents depends on
      IMUNO and is not itself recorded in this column.

  DIFER:
    official_name: Diferença D1-Dn
    translated_name: Dose difference (D1 minus the closing dose)
    description: >
      DOSE1 minus DOSEN: the count of people who received a vaccine's
      first dose but never received its closing dose — the numerator of
      the PNI dropout-rate formula.
    code_system: none
    source: layout_doc
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/DOCS/notatecnicaTx.pdf
    notes: >
      Divided by DOSE1 and multiplied by 100 to get the published dropout
      rate for most vaccines; for Meningocócica C, VIP/VOP sequential,
      Pentavalente, combined Poliomielite and Tetravalente the denominator
      is already folded into DIFER itself.

  MES:
    official_name: Mês
    translated_name: Month
    description: >
      Calendar month of the reference period: 1=Janeiro through
      12=Dezembro, plus code 13 "não discriminado" for rows not broken
      out by month, per MES.CNV.
    code_system: none
    source: def
    source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/PNI/AUXILIARES/MES.CNV
    notes: >
      Code 13 is not a real calendar month; filter it out before treating
      MES as an ordinary 1-12 index.

  ANOMES:
    official_name: Ano/Mês
    translated_name: Year-month reference period (YYYYMM)
    description: >
      Combined 6-digit year+month reference period (YYYYMM, e.g.
      "201401") — the time axis in PNI's monthly dropout-rate tabulations,
      matching the ranges in ANOMES.CNV (e.g. code "001" = "199400-199412").
    code_system: none
    source: inferred
    reasoning: >
      ANO+MES compound field name; declared width C(6,0) matches a 4-digit
      year plus 2-digit month; ANOMES.CNV/ANOMESC.CNV map short codes to
      year-month ranges rather than a free-standing category list.
    notes: >
      Spuriously bound to codelists ANOMES, ANOMESC and MES even though it
      is a period value, not a category.
