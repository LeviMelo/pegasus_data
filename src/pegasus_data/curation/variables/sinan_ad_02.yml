system: SINAN
asserted_by: pegasus_data

variables:

  ANTEC_POS:
    official_name: Antecedente pós-exposição
    translated_name: Prior post-exposure prophylaxis
    description: >
      Sim/Não flag for whether the patient had a prior post-exposure rabies
      prophylaxis scheme, paired with ANTEC_PRE (pre-exposure). Part of the
      Raiva Humana vaccination-antecedents block together with the ANT_DOSE_*
      and ANT_DTUL_8 fields.
    code_system: none
    source: inferred
    reasoning: >
      ANTEC_PRE/ANTEC_POS is a pré/pós (before/after) pair; it clusters with a
      variable-length dose series (ANT_DOSE_4/5/7/C/T) that matches the
      day-based Essen and Zagreb antirábica regimens.

  ANTEC_PRE:
    official_name: Antecedente pré-exposição
    translated_name: Prior pre-exposure prophylaxis
    description: >
      Sim/Não flag for whether the patient had a prior pre-exposure rabies
      prophylaxis scheme; see ANTEC_POS for the paired post-exposure flag.
    code_system: none
    source: inferred
    reasoning: Same evidence as ANTEC_POS.

  ANT_DOSE_4:
    official_name: Antecedente - dose 4 (dia)
    translated_name: Prior regimen - dose 4 (day)
    description: >
      Day-count on which the 4th dose of a prior antirábica prophylaxis
      regimen was given (rabies schedules are dosed by day-since-bite: 0, 3,
      7, 14, 28). Sibling of ANT_DOSE_5/7/C/T for other doses in the same
      regimen.
    code_system: none
    source: inferred
    reasoning: >
      Declared as 2-digit numeric (N2), which fits a day number but not a
      full date; it belongs to the ANTEC_PRE/POS prior-vaccination block.

  ANT_DOSE_5:
    official_name: Antecedente - dose 5 (dia)
    translated_name: Prior regimen - dose 5 (day)
    description: >
      Day-count for the 5th dose of the same prior antirábica regimen; see
      ANT_DOSE_4.
    code_system: none
    source: inferred
    reasoning: Same evidence as ANT_DOSE_4; distinguished only by dose number.

  ANT_DOSE_7:
    official_name: Antecedente - dose 7 (dia)
    translated_name: Prior regimen - dose 7 (day)
    description: >
      Day-count for the 7th dose of the same prior antirábica regimen; see
      ANT_DOSE_4.
    code_system: none
    source: inferred
    reasoning: Same evidence as ANT_DOSE_4; distinguished only by dose number.

  ANT_DOSE_C:
    official_name: Antecedente - dose complementar
    translated_name: Prior regimen - booster dose
    description: >
      Flag/day-count for a complementary or booster ("reforço") dose in the
      same prior antirábica regimen as ANT_DOSE_4/5/7, rather than a
      numbered dose in the primary series.
    code_system: none
    source: inferred
    reasoning: >
      The C suffix breaks the numeric 4/5/7 pattern, consistent with
      "complementar" marking a booster rather than an ordinal dose.

  ANT_DOSE_T:
    official_name: Antecedente - total de doses
    translated_name: Prior regimen - total doses
    description: >
      Total count of doses the patient received in the prior antirábica
      regimen summarized by ANT_DOSE_4/5/7/C.
    code_system: none
    source: inferred
    reasoning: T suffix (total) fits a summary count closing out the same dose series.

  ANT_DTUL_8:
    official_name: Antecedente - data da última dose
    translated_name: Prior regimen - date of last dose
    description: >
      Date of the last dose in the prior antirábica prophylaxis regimen
      described by ANT_DOSE_4/5/7/C/T. AAAAMMDD.
    code_system: none
    source: inferred
    reasoning: >
      DTUL reads data última (last date); D8 width matches a full date, and
      it closes the same antecedent-vaccination block as the ANT_DOSE_* series.

  ANT_OUTR:
    official_name: Antecedente outro
    translated_name: Other antecedent
    description: >
      Sim/Não flag marking that some antecedent not covered by the form's
      standard options applies, opening the free-text "outro, especifique"
      fields (ANT_OUTROS, ANT_OUTR_D, ANT_OUT_D, ANT_OU_DES) in the same
      block.
    code_system: none
    source: inferred
    reasoning: >
      1-character width matches a binary flag; OUTR(o) is SINAN's standard
      "other" marker paired with free-text overflow fields.

  ANT_OUTROS:
    official_name: Antecedente outro (especificar)
    translated_name: Other antecedent (specify)
    description: >
      Free-text field for the antecedent named when ANT_OUTR is marked. One
      of several parallel "other, specify" text fields in the same
      antecedents block (see also ANT_OUTR_D, ANT_OUT_D, ANT_OU_DES); which
      exact sub-question each answers is not resolved from available evidence.
    code_system: none
    source: inferred
    reasoning: >
      30-character width fits free text; the near-duplicate naming
      (ANT_OUTROS/ANT_OUTR_D/ANT_OUT_D/ANT_OU_DES) matches SINAN's pattern of
      one specify-field per antecedent sub-category.

  ANT_OUT_D:
    official_name: Antecedente outro - dados
    translated_name: Other antecedent - detail
    description: >
      Another of the "other, specify" text fields sharing ANT_OUTROS's
      antecedents block; the sub-category it answers is not resolved beyond
      that shared pattern. See ANT_OUTROS.
    code_system: none
    source: inferred
    reasoning: Same evidence as ANT_OUTROS.

  ANT_OUTR_D:
    official_name: Antecedente outro - descrição
    translated_name: Other antecedent - description
    description: >
      A third parallel "other, specify" text field in the ANT_OUTROS
      antecedents block, likely for yet another antecedent sub-category. See
      ANT_OUTROS.
    code_system: none
    source: inferred
    reasoning: Same evidence as ANT_OUTROS.

  ANT_OU_DES:
    official_name: Antecedente outro - descrição
    translated_name: Other antecedent - description
    description: >
      A fourth parallel "other, specify" text field alongside ANT_OUTROS,
      ANT_OUTR_D and ANT_OUT_D, none of which can be tied to a specific
      sub-category from available evidence.
    code_system: none
    source: inferred
    reasoning: Same evidence as ANT_OUTROS.

  ANT_PAIS:
    official_name: Antecedente - país
    translated_name: Prior event - country
    description: >
      Country code for where an antecedent event (e.g. a prior vaccination or
      exposure) took place, in the same antecedents block as ANTEC_PRE/POS.
      Distinct from CON_INF_PA, which codes the country of the current case's
      probable infection.
    code_system: none
    source: inferred
    reasoning: >
      PAIS is country; the 4-character width differs from CON_INF_PA's
      3-character country field, indicating a separate field in a different
      part of the form.

  ANT_UF:
    official_name: Antecedente - UF
    translated_name: Prior event - state
    description: >
      Brazilian state (UF) code for where an antecedent event took place;
      paired with ANT_PAIS for the country-level version of the same
      antecedent-location field.
    code_system: none
    source: inferred
    reasoning: 2-character width matches the standard UF code; sits alongside ANT_PAIS.

  AN_QUALI:
    official_name: Análise - resultado qualitativo
    translated_name: Analysis - qualitative result
    description: >
      Qualitative result (e.g. reagente/não reagente) of a laboratory
      analysis, paired with AN_QUANT which records the same analysis's
      numeric/quantitative result.
    code_system: none
    source: inferred
    reasoning: >
      AN_QUALI/AN_QUANT is a qualitative/quantitative pair; 1-character width
      fits a short reagent-style result code.

  AN_QUANT:
    official_name: Análise - resultado quantitativo
    translated_name: Analysis - quantitative result
    description: >
      Numeric result (e.g. a titer) of the same laboratory analysis described
      qualitatively by AN_QUALI.
    code_system: none
    source: inferred
    reasoning: 6-digit numeric width fits a titer or measured value, unlike AN_QUALI's 1-character code.

  ASSINTOMAT:
    official_name: Assintomático
    translated_name: Asymptomatic
    description: >
      Sim/Não flag for whether the case presented no symptoms at the time
      recorded on the form.
    code_system: none
    source: inferred
    reasoning: ASSINTOMAT reads assintomático; 1-character width matches a binary flag.

  ATE_HIPOTE:
    official_name: Atendimento - hipótese diagnóstica
    translated_name: Encounter - diagnostic hypothesis
    description: >
      Coded diagnostic hypothesis recorded at the medical encounter
      (atendimento), before laboratory confirmation. Short code, plausibly
      CID-10-shaped given its 5-character width.
    code_system: none
    source: inferred
    reasoning: >
      ATE_ abbreviates atendimento and HIPOTE hipótese; C5 width matches a
      CID-10 code with subcategory (e.g. A00.0).

  ATE_UF_HOS:
    official_name: Atendimento - UF do hospital
    translated_name: Encounter - hospital state
    description: >
      UF (state) code of the hospital where the patient was first attended.
      Distinct from ATE_UF_INT, the state of inpatient admission, which may
      differ when a patient is transferred.
    code_system: none
    source: inferred
    reasoning: >
      HOS abbreviates hospital and INT internação; both are 2-character UF
      fields under the same ATE_ (atendimento) prefix.

  ATE_UF_INT:
    official_name: Atendimento - UF de internação
    translated_name: Encounter - admission state
    description: >
      UF (state) code of the facility where the patient was admitted
      (internado); see ATE_UF_HOS for the state of the initial encounter.
    code_system: none
    source: inferred
    reasoning: Same evidence as ATE_UF_HOS.

  BENZENO:
    official_name: Benzeno
    translated_name: Benzene
    description: >
      Sim/Não flag for occupational exposure to benzene, one item in the same
      chemical-carcinogen checklist as ALCATRAO, AMINA, CADMIO and CROMO.
    code_system: none
    source: inferred
    reasoning: >
      Named-substance field with 1-character width, matching the other
      per-chemical occupational-exposure flags at the same rarity tier.

  CADMIO:
    official_name: Cádmio
    translated_name: Cadmium
    description: >
      Sim/Não flag for occupational exposure to cadmium, part of the same
      chemical-agent checklist as BENZENO, ALCATRAO and AMINA.
    code_system: none
    source: inferred
    reasoning: Same evidence as BENZENO.

  CLA_ME_ASS:
    official_name: Classificação meningite - associada
    translated_name: Meningitis classification - associated condition
    description: >
      Short code for a condition or classification associated with the
      meningitis case (e.g. a concurrent diagnosis). Sibling of CLA_ME_BAC
      (bacterial subtype) and CLA_ME_ETI (etiological classification) in the
      same Meningite classification block.
    code_system: none
    source: inferred
    reasoning: >
      CLA_ME_ is classificação meningite; ASS/BAC/ETI are three parallel
      4-character coded sub-classifications of the same case.

  CLA_ME_BAC:
    official_name: Classificação meningite - bacteriana
    translated_name: Meningitis classification - bacterial subtype
    description: >
      Short code identifying the specific bacterial agent/subtype when the
      case is classified as bacterial meningitis; see CLA_ME_ASS for the
      sibling associated-condition code.
    code_system: none
    source: inferred
    reasoning: Same evidence as CLA_ME_ASS; BAC specifically abbreviates bacteriana.
