# SINAN.IEXO —
#
# one notification of exogenous intoxication (poisoning)
system: SINAN
asserted_by: pegasus_data

variables:
  AGENTE_1:
    official_name: Agente tóxico (nome comercial/popular) 1
    translated_name: Toxic agent name, 1st substance
    description: 'Free-text commercial or popular name of the first toxic substance
      recorded in a poisoning case, entered next to AGENTE_TOX''s coded classification
      of the substance group.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 50
  AGENTE_2:
    official_name: Agente tóxico (nome comercial/popular) 2
    translated_name: Toxic agent name, 2nd substance
    description: 'Free-text commercial or popular name of the second toxic substance
      recorded when a poisoning case involves exposure to more than one agent.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 50
  AGENTE_3:
    official_name: Agente tóxico (nome comercial/popular) 3
    translated_name: Toxic agent name, 3rd substance
    description: 'Free-text commercial or popular name of the third toxic substance
      recorded when a poisoning case involves exposure to three or more agents.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 50
  AGENTE_TOX:
    official_name: Grupo do agente tóxico / classificação geral
    translated_name: Toxic agent group classification
    description: 'Broad category of the substance that poisoned the patient, e.g. 01
      medication, 02 agricultural pesticide, 05 rodenticide, 10 metal, 13 food or beverage,
      14 other, 99 ignored.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v5.pdf, campo 49
  ATIVIDA_1:
    official_name: 'Se agrotóxico, quais as atividades exercidas na exposição atual (1ª opção)'
    translated_name: 'Pesticide activity at exposure, first option'
    description: 'For pesticide poisonings, the first activity being carried out at the exposure (e.g. dilution, spraying, seed treatment, storage, harvest, transport).'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 52 (Se agrotóxico, quais as atividades exercidas na exposição atual – 1ª opção)'
  ATIVIDA_2:
    official_name: 'Se agrotóxico, quais as atividades exercidas na exposição atual (2ª opção)'
    translated_name: 'Pesticide activity at exposure, second option'
    description: 'For pesticide poisonings, the second activity being carried out at the exposure; see ATIVIDA_1.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 52 (Se agrotóxico, quais as atividades exercidas na exposição atual – 2ª opção)'
  ATIVIDA_3:
    official_name: 'Se agrotóxico, quais as atividades exercidas na exposição atual (3ª opção)'
    translated_name: 'Pesticide activity at exposure, third option'
    description: 'For pesticide poisonings, the third activity being carried out at the exposure; see ATIVIDA_1.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 52 (Se agrotóxico, quais as atividades exercidas na exposição atual – 3ª opção)'
  CIRCUNSTAN:
    official_name: 'Circunstância da exposição / contaminação'
    translated_name: Circumstance
    description: 'Circumstance of the exposure, e.g. habitual use, accidental, environmental, therapeutic use, self-medication, abuse, food or drink ingestion, suicide attempt, violence.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 55 (Circunstância da exposição / contaminação)'
  CIRCUN_DES:
    official_name: 'Circunstância da exposição / contaminação - Outro (especificar)'
    translated_name: Circumstance, free text
    description: 'Free-text description of the circumstance when CIRCUNSTAN is 13 (other).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 55 (Circunstância da exposição / contaminação – Outro, especificar)'
    notes: 'Free text, uncoded and unvalidated. Do not tabulate it without reading
      it.

      '
  COAGTOXMA1:
    official_name: 'Agente tóxico (código) 1'
    translated_name: 'Toxic agent code, first'
    description: 'Code of the first toxic agent (commercial product/brand) involved in the poisoning; its active ingredient is P_ATIVO_1.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Agente tóxico (código) 1, co_ag_tox_marca)'
  COAGTOXMA2:
    official_name: 'Agente tóxico (código) 2'
    translated_name: 'Toxic agent code, second'
    description: 'Code of the second toxic agent (commercial product/brand) involved; see COAGTOXMA1.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Agente tóxico (código) 2)'
  COAGTOXMA3:
    official_name: 'Agente tóxico (código) 3'
    translated_name: 'Toxic agent code, third'
    description: 'Code of the third toxic agent (commercial product/brand) involved; see COAGTOXMA1.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Agente tóxico (código) 3)'
  DIAG_CONF:
    official_name: 'Se intoxicação confirmada, qual o diagnóstico (CID-10)'
    translated_name: Confirmed diagnosis
    description: 'CID-10 code of the diagnosis once investigation confirmed it, as
      opposed to what was suspected at notification. Stored without the dot.

      '
    code_system: external
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 66 (Se intoxicação confirmada, qual o diagnóstico (CID-10))'
  INTOX_CHUM:
    official_name: 'Intoxicação exógena por chumbo'
    translated_name: Toxic agent - lead
    description: 'Flag set to 1 when the chemical product was classified as lead; blank means no or unknown.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), derived field (Intoxicação exógena por chumbo)'
  INTOX_MERC:
    official_name: 'Intoxicação exógena por mercúrio'
    translated_name: Toxic agent - mercury
    description: 'Flag set to 1 when the chemical product was classified as mercury; blank means no or unknown.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), derived field (Intoxicação exógena por mercúrio)'
  INTOX_META:
    official_name: 'Intoxicação exógena por metanol'
    translated_name: 'Exogenous poisoning by methanol'
    description: 'Flag set to 1 when the chemical product was classified as methanol; blank means no or unknown.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), derived field (Intoxicação exógena por metanol)'
  LAVOURA:
    official_name: Se agrotóxico de uso agrícola, qual a cultura / lavoura
    translated_name: Crop treated with the pesticide
    description: 'Name of the crop or plantation -- soybean, coffee, sugarcane, and
      so on, drawn from a fixed list -- being treated with the agricultural pesticide
      that caused the poisoning.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026.pdf, campo 53
  LOC_EXPO:
    official_name: Local de ocorrência da exposição
    translated_name: Setting of poisoning exposure
    description: 'Setting where the poisoning exposure occurred: the patient''s residence,
      workplace, commute route, a health facility, a school or daycare, an outdoor
      public area, another setting, or unknown.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026.pdf, campo 34
  LOC_EXP_DE:
    official_name: Local de ocorrência da exposição (outro) especificar
    translated_name: Other exposure setting
    description: 'Free text naming the exposure setting, filled in only when LOC_EXPO
      is coded "outro" because the poisoning happened somewhere off the fixed residence/workplace/school
      list.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026.pdf, campo 34
  OUT_AGENTE:
    official_name: 'Grupo do agente tóxico - Outro (especificar)'
    translated_name: Other toxic agent (specify)
    description: 'Free-text name of the toxic agent group when the general classification (campo 49) is 14 (other).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Grupo do agente tóxico / classificação geral – Outro, especificar)'
  PAIS_EXP:
    official_name: 'País (se estabelecimento fora do Brasil)'
    translated_name: Country of exposure
    description: 'Country of the place of exposure when it lies outside Brazil.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 48 (País, se estabelecimento fora do Brasil)'
  P_ATIVO_1:
    official_name: 'Agente tóxico (princípio ativo) 1'
    translated_name: Active ingredient (1st)
    description: 'Free-text name of the toxic substance''s active ingredient (e.g.
      a pesticide''s chemical name) involved in the poisoning - first of up to three
      the IEXO form records when more than one agent was involved.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Agente tóxico (princípio ativo) 1)'
  P_ATIVO_2:
    official_name: 'Agente tóxico (princípio ativo) 2'
    translated_name: Active ingredient (2nd)
    description: 'Second active-ingredient name recorded when the poisoning involved
      more than one toxic substance, alongside P_ATIVO_1.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Agente tóxico (princípio ativo) 2)'
  P_ATIVO_3:
    official_name: 'Agente tóxico (princípio ativo) 3'
    translated_name: Active ingredient (3rd)
    description: 'Third active-ingredient name, completing the up-to-three-substance
      record alongside P_ATIVO_1 and P_ATIVO_2.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 50 (Agente tóxico (princípio ativo) 3)'
  TPATENDE:
    official_name: Tipo de atendimento
    translated_name: Type of care provided
    description: 'Type of care the patient received: hospital, outpatient, home, or none.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 59 (Tipo de atendimento)'
  TPEXP:
    official_name: Tipo de exposição
    translated_name: Type of exposure
    description: 'Temporal pattern of the exposure: acute single, acute repeated, chronic, or acute on chronic.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 57 (Tipo de exposição)'
  TRAB_DESC:
    official_name: 'Situação no mercado de trabalho - Se outro, especificar'
    translated_name: 'Labour-market situation, other - specify'
    description: 'Free-text labour-market situation when campo 33 (situação no mercado de trabalho) is 12 (other).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 33 (Situação no mercado de trabalho – Se outro especificar)'
  UTILIZACAO:
    official_name: 'Se agrotóxico, qual a finalidade da utilização'
    translated_name: 'Pesticide purpose of use'
    description: 'For pesticide poisonings, what the product is used for: insecticide, herbicide, tick killer, rodenticide, fungicide, wood preservative, or other.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 51 (Se agrotóxico, qual a finalidade da utilização)'
  UTIL_DESC:
    official_name: 'Se agrotóxico, qual a finalidade da utilização - Outro (especificar)'
    translated_name: 'Pesticide purpose of use, other - specify'
    description: 'Free-text purpose of the pesticide when UTILIZACAO is 7 (other).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 51 (Finalidade da utilização – Outro, especificar)'
  VIA_1:
    official_name: 'Via de exposição / contaminação (1ª opção)'
    translated_name: Exposure route (1st)
    description: 'First recorded route by which the toxic agent entered the body (e.g.
      oral, dermal, respiratory, ocular) - the IEXO form allows up to three routes
      since a single exposure can involve more than one.

      '
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 54 (Via de exposição / contaminação – 1ª opção)'
  VIA_2:
    official_name: 'Via de exposição / contaminação (2ª opção)'
    translated_name: Exposure route (2nd)
    description: 'Second exposure route recorded when the poisoning involved more than
      one route of entry, alongside VIA_1.

      '
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 54 (Via de exposição / contaminação – 2ª opção)'
  VIA_3:
    official_name: 'Via de exposição / contaminação (3ª opção)'
    translated_name: Exposure route (3rd)
    description: 'Third exposure route, completing the up-to-three-route record alongside
      VIA_1 and VIA_2.

      '
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET – Intoxicação Exógena v6 (26/02/2026) — sources/txt/intoxicacao-exogena__DIC_DADOS_Intoxicacao_Exogena_v6_26.02.2026_tables.txt (DIC_DADOS_Intoxicacao_Exogena_v6, portalsinan.saude.gov.br), campo 54 (Via de exposição / contaminação – 3ª opção)'
