# SINAN.VIOL — Interpersonal and self-inflicted violence
# Violência interpessoal e autoprovocada
#
# One notification of violence — domestic, sexual, or self-inflicted.
# Notifiable universally since 2011, and heavily under-notified, so counts
# track reporting practice as much as incidence.
