# SINAN.HIVG — Pregnant woman with HIV
# Gestante com HIV
#
# One pregnancy in a woman with HIV, notified so that vertical transmission
# prophylaxis can be tracked.
system: SINAN
asserted_by: pegasus_data

variables:
  ANT_EVLABO:
    official_name: Momento do diagnóstico
    translated_name: When HIV was diagnosed
    description: 'Whether the diagnosis came before antenatal care, during it, during
      delivery, or after. Diagnosis before or during antenatal care allows full prophylaxis;
      at delivery allows only part; after allows none.

      '
    code_system: internal
    source: def
    source_ref: EVIHIV.CNV
    reasoning: 'Bound to EVIHIV, whose values are antes do pré-natal, durante o pré-natal,
      durante o parto and após o parto.

      '
  PAR_ANTIDU:
    official_name: 'Fez uso de profilaxia anti-retroviral durante o parto'
    translated_name: 'Antiretroviral prophylaxis during delivery'
    description: 'Whether antiretroviral prophylaxis was given to the woman during delivery.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 45 (Fez uso de profilaxia anti-retroviral durante o parto)'
  PAR_DT_PAR:
    official_name: Data do parto
    translated_name: Date of delivery
    description: 'When the birth happened. With the antiretroviral start date it gives
      how long the mother was treated before delivery.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 43 (Data do parto)'
  PAR_EVOLUC:
    official_name: 'Evolução da gravidez'
    translated_name: 'Pregnancy outcome'
    description: 'Outcome of the pregnancy: live birth, stillbirth, abortion, or not applicable.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 46 (Evolução da gravidez)'
  PAR_INICPR:
    official_name: 'Início da profilaxia com anti-retroviral na criança (horas)'
    translated_name: 'Start of antiretroviral prophylaxis in the newborn'
    description: 'When antiretroviral prophylaxis began in the newborn, banded as within the first 24 hours or after 24 hours of birth (or not applicable / not done).'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 47 (Início da profilaxia com anti-retroviral na criança (horas))'
  PAR_TIPO:
    official_name: 'Tipo do parto'
    translated_name: 'Type of delivery'
    description: 'Type of delivery: vaginal, elective caesarean, emergency caesarean, or not applicable.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 44 (Tipo do parto)'
  PAR_UFPART:
    official_name: 'UF do local do parto'
    translated_name: 'State where delivery took place'
    description: 'State (UF) where the delivery took place.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 40 (UF do local do parto)'
  PRE_ANTRET:
    official_name: Antirretroviral no pré-natal
    translated_name: Antiretrovirals in pregnancy
    description: 'Whether antiretrovirals were given during pregnancy. The single intervention
      that cuts vertical transmission from around a quarter to under two per cent.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ANTRET reads antirretroviral; a yes/no flag in the antenatal block.
  PRE_DT_RET:
    official_name: 'Data do início do uso de anti-retroviral para profilaxia'
    translated_name: 'Date antiretroviral prophylaxis started'
    description: 'When antiretrovirals began. Started early in pregnancy they suppress
      the viral load before delivery, which is what the protection depends on.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 39 (Data do início do uso de anti-retroviral para profilaxia)'
  PRE_MUNIPA:
    official_name: 'Município do local do parto'
    translated_name: 'Municipality where delivery took place'
    description: 'Municipality (IBGE code) where the delivery took place; despite the PRE_ prefix it belongs to the delivery block, not antenatal care.'
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 41 (Município do local do parto)'
  PRE_PRENAT:
    official_name: 'Fez/Faz pré-natal'
    translated_name: Received prenatal care
    description: 'Whether the HIV-positive pregnant woman had or is having antenatal care.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Gestante HIV — sources/dic_text/gestante-hiv__DIC_DADOS_Gestante_HIV_v5.txt (DIC_DADOS_Gestante_HIV_v5.pdf, portalsinan.saude.gov.br), campo 33 (Fez/Faz pré-natal)'
