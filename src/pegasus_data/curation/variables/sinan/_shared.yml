    reasoning: 'DT_ prefix is the date convention; the field is one of several near-identically-named
      DT_TRANS*/DTTRANS* siblings that differ only by a 2-letter route suffix, consistent
      with a per-exposure-route date block.

      '
  DT_ULT_DOS:
    official_name: 'Data da Última Dose

      '
    translated_name: 'Date of last vaccine dose

      '
    description: 'Date of the last dose the patient received of the vaccine relevant to the
      notified condition — the DTP/DTP+Hib (tríplice/ tetravalente) vaccine on the pertussis
      form, the tetanus-toxoid- containing vaccine (DPT, DT, dT, Tetra) on the accidental-tetanus
      form. Same field shape (a bare date), different specific vaccine depending on the agravo.

      '
    code_system: none
    source: layout_doc
    source_ref: '[COQU] http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "38. Data Da Ultima Dose | dt_ultima_dose | date | Data da última dose da vacina tríplice
      (DTP) que o paciente recebeu | DT_ULT_DOS"; on the tetanus form, [TETA] http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf
      — "36. Data da última dose | dt_ultima_dose | date | Data da última dose da vacina contra
      tétano (DPT,DT,dT,TT Tetra) | DT_ULT_DOS"

      '
  DT_VIRAL:
    official_name: Data da coleta para isolamento viral
    translated_name: Viral isolation sample-collection date
    description: 'Date the sample was drawn for viral isolation culture, one of the confirmatory
      laboratory tests on the dengue/chikungunya form alongside NS1, serology, and RT-PCR.

      '
    code_system: none
    source: layout_doc
    source_ref: Dengue/Chikungunya ficha de investigação (prefeitura.pbh.gov.br), campo "ISOLAMENTO
      - DATA DA COLETA"
  DURACAO:
    official_name: Duração
    translated_name: Duration
    description: 'Numeric duration (likely days) of a clinical episode or incubation period
      recorded on the form the field belongs to. The exact reference period is not resolved
      from available evidence.

      '
    code_system: none
    source: inferred
    reasoning: 'DURACAO reads duração; declared as a 2-character numeric-like code, consistent
      with a small day/week count rather than a coded category.

      '
  EDEMA:
    official_name: Sinais clínicos – Edema
    translated_name: Clinical sign — edema (swelling)
    description: 'Clinical-sign-present flag for edema, in this batch''s doença de Chagas
      aguda and leishmaniose visceral symptom checklists.

      '
    code_system: internal
    source: inferred
    reasoning: 'C(1,0), bound to SIM_NAO, and "edema" is the unambiguous Portuguese/ medical
      term for swelling.

      '
  ELISA:
    official_name: ELISA
    translated_name: ELISA serology test result
    description: 'Result of the ELISA immunoassay for antibodies (reactive, non-reactive,
      inconclusive, or not done) — used in serologic confirmation for both acute Chagas and
      visceral leishmaniasis.

      '
    code_system: none
    source: inferred
    reasoning: C1 coded field named directly for the test; shared between the CHAG and LEIV
      strata rather than exclusive to one.
  EPISTAXE:
    official_name: 'Sinais e Sintomas — Epistaxe

      '
    translated_name: 'Nosebleed (epistaxis) sign

      '
    description: 'Whether the patient had epistaxis (nosebleed), one of the legacy dengue-hemorrhagic-manifestations
      checklist items (1 Sim, 2 Não, 9 Ignorado); see CON_FHD.

      '
    code_system: internal
    codelists:
    - EPISTAXE
    source: def
    source_ref: '[DEF] ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field EPISTAXE: value
      labels 1=Sim, 2=Não, 9=Ignorado

      '
  ESC_MAE_N:
    official_name: Escolaridade da mãe
    translated_name: Mother's education level
    description: 'Mother''s highest school level completed at the time her child''s AIDS case
      was notified. Codes run 0=analfabeto through 8=educação superior completa, 9=ignorada.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 32 (documented DBF ESC_MAE; ESC_MAE_N
      is the equivalent field observed in the data)
  EVIDENCIA:
    official_name: Evidência de extravasamento de plasma
    translated_name: Plasma-leakage evidence
    description: 'Which laboratory finding evidenced plasma leakage under the older dengue
      hemorrhagic fever criteria: hemoconcentration, cavity effusions, or hypoproteinemia.

      '
    code_system: internal
    source: web
    source_ref: github.com/rfsaldanha/microdatasus, process_sinan_chikungunya.R#EVIDENCIA
  EVOLUCAO:
    official_name: Evolução do Caso
    translated_name: Case outcome
    description: 'Clinical outcome of the case — cure, death from the notified agravo, death
      from another cause, or (for some agravos) a disability grade. The option set again varies
      by agravo (Anexo I); death is not allowed to be selected unless CLASSI_FIN indicates
      a confirmed case.

      '
    code_system: internal
    codelists:
    - ALTAOBIT
    - CURAOBIT
    - EVOACBIO
    - EVOACGRA
    - EVOCANCE
    - EVODENG
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "41-Evolução do caso | tp_evolucao_caso | varchar2(1) | Anexo
      I | Evolução do caso | Campo habilitado se Classificação final=1, 2 ou null; Não permite
      a opção óbito pelo agravo notificado se classificação final= 2 ou null | EVOLUCAO"

      '
    depends_on:
    - CLASSI_FIN
    - ID_AGRAVO
  EVOL_AFAST:
    official_name: Evolução da situação de saúde do paciente com afastamento do trabalho
    translated_name: Health outcome while on work leave
    description: 'Outcome of the patient''s health status specifically during the period of
      work leave recorded via AFASTAMENT/NU_AFAST/TP_AFAST. Value set is Melhora/Piora/9-Ignorado
      — not the generic Sim/Não/Ignorado used by most other flags in this ficha. Only populated
      when the leave duration (NU_AFAST/TP_AFAST) is greater than zero.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 54 'Com afastamento do trabalho' (Evolução), values Melhora/Piora/9-Ignorado,
      DBF=EVOL_AFAST
    notes: 'Do not confuse with EVOLUCAO (the case-level outcome used elsewhere in SINAN,
      e.g. cura/óbito) — this column is scoped narrowly to the work-leave episode and uses
      a different two-category-plus-ignored value set.

      '
  EVO_DIAG:
    official_name: Critério óbito
    translated_name: Death-certificate case criterion
    description: 'Pediatric counterpart of DEF_DIAGNO: 1=Sim means the death certificate mentions
      aids or HIV with death cause tied to immunodeficiency and no other criterion classified
      the case after investigation. 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 46
  EVO_DT_OBI:
    official_name: Data do óbito
    translated_name: Date of death
    description: 'Date the patient died. If the death criterion (EVO_DIAG) equals Sim, this
      date must equal the case''s diagnosis date under the AIDS investigation rules.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 51
  EXANTEMA:
    official_name: Sinais clínicos – Exantema
    translated_name: Clinical sign — rash (exanthema)
    description: 'Clinical-sign-present flag in the dengue/chikungunya presenting-symptoms
      checklist: whether a rash was observed. 1=Sim, 2=Não in the source table (the catalog''s
      SIM_NAO binding suggests some files also carry a 9=Ignorado).

      '
    code_system: internal
    source: layout_doc
    source_ref: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf
      — campo 27 'Sinais clínicos (Exantema)', DBF=EXANTEMA
  FC_CONTATO:
    official_name: 'Local do Contato

      '
    translated_name: 'Location of contact with a similar case

      '
    description: 'Where the patient met a similar suspected or confirmed case before symptom
      onset: 1 Domicílio, 2 Vizinhança, 3 Trabalho, 4 Creche/escola, 5 Posto de saúde/hospital,
      6 Outro Estado/Município, 7 Outros, 8 Sem histórico de contato, 9 Ignorado.'
    code_system: internal
    codelists:
    - LOCALCONCNET
    source: layout_doc
    source_ref: '[COLE] http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "33. Contato com caso suspeito ou confirmado de cólera (até 10 dias antes do início
      dos sinais e sintomas) | tp_contato_caso_suspeito | varchar(1) | 1. Domicílio 2. Vizinhança
      3. Trabalho 4. Creche/escola 5. Posto de saúde/hospital 6. Outro estado/município 7.
      Outros 8. Sem história de contato 9. Ignorado | FC_CONTATO"; matching item on [COQU]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "34. Contato Com Caso Suspeito Ou Confirmado De Coqueluche (Até 14 Dias Antes) | tp_contato_coqueluche
      | Varchar(1) | mesmas categorias | FC_CONTATO"

      '
    notes: Confirmed with the same nine-way code on both the cholera and pertussis forms.
      It is the question CONTATO asks on the typhoid form, under a different DBF name.
  FEBRE:
    official_name: Febre
    translated_name: Fever (symptom present)
    description: Whether the patient reported fever, on the febrile-illness investigation
      forms (dengue, chikungunya, febre maculosa, febre tifóide, leishmaniose visceral, ...).
    code_system: internal
    codelists:
    - SIM_NAO
    source: inferred
    reasoning: 'FEBRE is the plain Portuguese word for fever; the column is C(1) bound to
      the SIM_NAO codelist, matching the shape of every other named yes/no symptom field in
      this dictionary.

      '
  FLOGISTICO:
    official_name: Sinais e sintomas - Sinais flogísticos
    translated_name: Inflammatory signs present
    description: 'Local inflammatory signs — redness, heat, swelling, or tenderness — observed
      at the affected site when screening a work-related musculoskeletal disorder case: 1=Sim,
      2=Não, 9=Ignorado.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 49 (Sinais Flogísticos)
  FLXRECEBI:
    official_name: Recebida por Fluxo de Retorno
    translated_name: Received via return-flow
    description: 'Internal flag marking a record that arrived at this database through the
      fluxo de retorno mechanism (CS_FLXRET) — used to recover cases notified outside the
      patient''s home municipality.

      '
    code_system: internal
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Recebida por fluxo de retorno (campo interno) | tp_fluxo_retorno
      | varchar2(1) | Identifica se o registro foi recebido pelo fluxo de retorno | Atribuído
      pelo sistema na rotina de recebimento do fluxo de retorno, utilizada para resgatar casos
      notificados fora do município de residência | FLXRECEBI"

      '
    depends_on:
    - CS_FLXRET
  FONTE:
    official_name: 'Fonte/Mecanismo de Infecção

      '
    translated_name: 'Infection source/mechanism, or known-source flag

      '
    description: 'Probable source or mechanism of infection on the viral-hepatitis form, as
      a two-digit code: 1 Sexual, 2 Transfusional, 3 Uso de Drogas, 4 Vertical, 5 Acidente
      de Trabalho, 6 Hemodiálise, 7 Domiciliar, 8 Tratamento cirúrgico, 9 Tratamento dentário,
      10 Pessoa/pessoa, 11 Alimento/água contaminada, 12 Outros, 99 Ignorado.'
    code_system: internal
    codelists:
    - HEPFONTENET
    source: layout_doc
    source_ref: '[HEPA] http://portalsinan.saude.gov.br/images/documentos/Agravos/Hepatite/DIC_DADOS_Hepatite_v5.pdf
      — "51. Provável Fonte/ Mecanismo de infecção | tp_provavel_infeccao | varchar2(2) |
      1-Sexual 2-Transfusional 3-Uso de Drogas 4-Vertical 5-Acidente de Trabalho 6-Hemodiális
      7-Domiciliar 8-Tratamento cirúrgico 9-Tratamento dentário 10-Pessoa/pessoa 11-Alimento/água
      contaminad 12-Outros 99-Ignorado | FONTE"; on the biological-accident form, [ACBI] http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "53. Paciente fonte conhecida | st_dado_paciente | varchar2(1) | 1- Sim 2- Não 9-
      Ignorado | FONTE"

      '
    notes: The catalog's own header facts show FONTE declared as both C(1) and C(2) width
      across strata, which is the fingerprint of exactly this collision — a 1-char Sim/Não
      flag on ACBI files, a 2-char mechanism code on HEPA files. Never decode FONTE with one
      lookup table. A different column shares the name on the biological-accident form, where
      it is a one-character Sim/Não/Ignorado flag for whether the source patient is known.
      The declared widths overlap, so width alone will not tell them apart; the value spaces
      are not compatible.
  FORMA:
    official_name: Forma clínica
    translated_name: Clinical form/presentation
    description: 'Records the clinical form/presentation of the case (e.g. acute vs. chronic
      for hepatitis), in this batch''s esquistossomose, hepatites virais and tuberculose forms.
      The value set is disease-specific and drawn from a dedicated codelist per agravo.

      '
    code_system: internal
    source: inferred
    reasoning: 'Bound to codelists FORMA and, for hepatitis specifically, HEPAGCRNET (both
      at 0.9 confidence from the DEF/CNV files), plus the unambiguous Portuguese name; the
      actual code labels were not inspected here.

      '
    notes: 'Declared width varies between 1 and 2 characters across files/agravos, so the
      category count likely differs by disease.

      '
  FUMA:
    official_name: Fuma?
    translated_name: Current smoker?
    description: 'Smoking-history flag in the occupational-cancer, work-related-mental-health
      and pneumoconiosis fichas (series CANC/MENT/PNEU): whether the patient smokes. 1=Sim,
      2=Não, 9=Ignorado. Pairs with TEMPO_FUMA (duration) and TP_TEMP_FU (duration unit).

      '
    code_system: internal
    source: inferred
    reasoning: 'C(1,0), bound to the SIM_NAO codelist, and "fuma" is the unambiguous Portuguese
      verb for "smokes"; smoking history is a standard risk-factor field for lung cancer and
      pneumoconiosis case investigation.

      '
  GENGIVO:
