      final-diagnosis field shared across every SINAN agravo.

      '
    code_system: none
    source: inferred
    reasoning: 'CS_ is the classificação/situação prefix and MENING reads meningite; 1-character
      width matches a short enumerated code rather than free text.

      '
  CS_NUCA:
    official_name: Rigidez de Nuca
    translated_name: Neck stiffness
    description: 'Whether the patient had nuchal (neck) rigidity, an early muscular sign of
      tetanus, recorded yes, no, or unknown on the investigation form.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br Tetano_Acidental_v5.pdf, campo 38 "Rigidez de Nuca"
  CS_OPISTOT:
    official_name: Opistótono
    translated_name: Opisthotonus
    description: 'Whether the patient showed opisthotonus, the severe backward-arching spasm
      of the back and neck characteristic of advanced tetanus, recorded yes, no, or unknown.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br Tetano_Acidental_v5.pdf, campo 38 "Opistótono"
  CS_RACA:
    official_name: Raça/Cor
    translated_name: Race/skin colour
    description: 'Self-declared race/colour: 1 branca, 2 preta, 3 amarela, 4 parda, 5 indígena,
      9 Ignorado — the same five-category self-declaration scheme IBGE uses (parda covers
