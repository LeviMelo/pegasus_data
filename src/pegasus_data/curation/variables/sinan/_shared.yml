    reasoning: 'Same reasoning as PA_DES1, numbered slot 2.

      '
  PA_DES3:
    official_name: País de destino/deslocamento (3)
    translated_name: Country of travel/exposure location — 3rd episode
    description: 'Third slot of the travel/exposure-history block described under CO_UF_DES1/PA_DES1.

      '
    code_system: external
    source: inferred
    reasoning: 'Same reasoning as PA_DES1, numbered slot 3.

      '
  PESO:
    official_name: 'Peso

      '
    translated_name: 'Weight (unit varies by form)

      '
    description: 'Patient weight, but on two different scales depending on the agravo: on
      the visceral-leishmaniasis form it is the patient''s current body weight in KILOGRAMS
      (a 3-digit integer); on the congenital-rubella- syndrome form it is the newborn''s BIRTH
      WEIGHT IN GRAMS. Reading this column with one fixed unit across series will be wrong
      by three orders of magnitude for one of the two.

      '
    code_system: none
    source: layout_doc
    source_ref: '[LEIV] http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf
      — "40. Peso | nu_peso | number(3) | Informar o peso do paciente em Kg | PESO"; on the
      SRC form, [SRC] http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "33. Peso ao nascer (em gramas) | nu_peso_nascido | Varchar2(5) | Peso ao nascer (em
      gramas) | PESO"

      '
    notes: 'Hard unit/scale trap: kilograms (adult/child body weight, LEIV) vs grams (newborn
      birth weight, SRC). Never aggregate PESO across series without checking which agravo
      produced the row.

      '
  PETEQUIAS:
    official_name: Manifestações hemorrágicas – Petéquias
    translated_name: Hemorrhagic manifestations — petechiae
    description: 'Within the dengue hemorrhagic-manifestations checklist, flags whether petechiae
      were among the manifestations observed. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf
      — campo 107 'Petéquias' ('Se Sim, Quais? — Petéquias'), DBF=PETEQUIAS
  PETEQUIA_N:
    official_name: Sinais clínicos - Petéquias
    translated_name: Petechiae
    description: 'Whether a Dengue/Chikungunya patient showed petechiae, small spontaneous
      skin hemorrhages, one of the clinical signs recorded at notification alongside fever,
      rash, and joint pain.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya Sinan Online), campo 33.
  PLAQ_MENOR:
    official_name: 'Menor Contagem de Plaquetas

      '
    translated_name: 'Lowest platelet count observed

      '
    description: 'The lowest platelet count recorded during the illness episode, part of the
      same legacy dengue-hemorrhagic monitoring block as CON_FHD/SANGRAM/HEMATURA (PLAQ =
      plaqueta, MENOR = lowest/minimum). No dictionary entry or observed value confirms an
      exact unit or format.

      '
    code_system: none
    source: inferred
    reasoning: 'PLAQ_/MENOR is a standard DATASUS abbreviation pair (plaqueta, menor) and
      the field sits alongside CON_FHD, SANGRAM, HEMATURA, EPISTAXE and GENGIVO in the same
      DENG/CHIK legacy hemorrhagic block confirmed via TAB_SINANNET; platelet-count nadir
      is exactly the lab value that classic WHO dengue-hemorrhagic-fever monitoring tracks.
      No layout document or dictionary label was found for this specific field, so the reading
      rests on name and context, not a verbatim source.

      '
    notes: 'The catalog''s own header facts show this column declared inconsistently across
      strata — C(6), C(7) and one outlier N(18,9) — with no observed values sampled. Treat
      any parse of this column as low- confidence; the type inconsistency itself suggests
      messy legacy data entry (a free-text lab value field, not a clean numeric column).

      '
  PLASMATICO:
    official_name: Extravasamento Plasmático
    translated_name: Plasma leakage
    description: 'Whether clinical or lab evidence of plasma leakage (hemoconcentration, pleural
      effusion, ascites) was present, a marker of vascular permeability used to flag severe
      dengue: 1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    source: web
    source_ref: 'github.com/rfsaldanha/microdatasus, R/process_sinan_chikungunya.R, field
      PLASMATICO

      '
  PREMIOS:
    official_name: Exposto no trabalho a prêmios de produção
    translated_name: Production bonus exposure
    description: 'Job ties bonuses or incentives to meeting or exceeding production targets,
      an ergonomic risk factor recorded when investigating a LER/DORT case.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 51 (Prêmios de produção)
  PRE_MUNIRE:
    official_name: Município de realização do pré-natal
    translated_name: Prenatal-care municipality
    description: 'IBGE code of the municipality where the health facility that provided the
      pregnant woman''s prenatal care is located, recorded on the syphilis/HIV-in-pregnancy
      investigation form.

      '
    code_system: external
    source: layout_doc
    source_ref: DIC_DADOS_Gestante_Sifilis_v5.pdf, campo 33
  PRE_UFREL:
    official_name: UF de realização do pré-natal
    translated_name: Prenatal-care state
    description: 'Abbreviation of the state (UF) where the pregnant woman received prenatal
      care, recorded on the syphilis/HIV-in-pregnancy investigation form.

      '
    code_system: external
    source: layout_doc
    source_ref: DIC_DADOS_Gestante_Sifilis_v5.pdf, campo 32
  PROSTACAO:
    official_name: Sinais e Sintomas - Prostração
    translated_name: Prostration
    description: 'Whether the patient showed prostration (marked physical weakness), one of
      the clinical signs recorded for Febre Maculosa (spotted fever) cases from 2007 onward,
      after the field was dropped from the Dengue form.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Maculosa_v5.pdf, campo 33.
  RACA_MAE:
    official_name: Raça/cor da mãe
    translated_name: Mother's race/color
    description: 'Race or color the mother self-declared at the time of her child''s AIDS
      case notification. 1=branca, 2=preta, 3=amarela, 4=parda, 5=indígena, 9=ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 33
  RAIOX:
    official_name: Confirmação Diagnóstica - Radiografia de tórax
    translated_name: Diagnostic confirmation - chest X-ray
    description: 'Whether a chest X-ray was performed and used to confirm a work-related pneumoconiosis
      (silicosis, asbestosis, and similar occupational lung diseases); the same field name
      was reused earlier by the Doença de Chagas Aguda form. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 54
  REGIME:
    official_name: Regime de Tratamento
    translated_name: Treatment setting
    description: 'How the case was treated: 1 Hospitalar, 2 Ambulatório, 3 Ambos, 9 Ignorado.'
    code_system: internal
    source: layout_doc
    source_ref: '[DIC-DRT-ATG] "65. Regime de Tratamento | tp_regime_tratamento | varchar2(1)
      | 1 – Hospitalar; 2 – Ambulatório; 3 – Ambos; 9 – Ignorado | Campo Essencial | REGIME"

      '
  RENAL:
    official_name: Doenças pré-existentes - Doença renal crônica
    translated_name: Pre-existing chronic kidney disease
    description: 'Whether the patient had pre-existing chronic kidney disease noted at Dengue/Chikungunya
      notification, distinct from any acute kidney injury recorded later among that illness''s
      severity signs.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya Sinan Online), campo 34.
  REPETITIVO:
    official_name: Exposto no trabalho a movimentos repetitivos
    translated_name: Repetitive movement exposure
    description: 'Job requires repetitive hand or arm movements to perform tasks, the defining
      ergonomic exposure investigated in a repetitive strain injury case.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 51 (Movimentos repetitivos)
  RESUL_NS1:
    official_name: Exame NS1 - Resultado
    translated_name: NS1 antigen test result
    description: 'Result of the dengue NS1 antigen ELISA test drawn during the acute illness:
      1 Positivo, 2 Negativo, 3 Inconclusivo, 4 Não realizado.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 42

      '
  RESUL_PCR_:
    official_name: RT-PCR - Resultado
    translated_name: RT-PCR result
    description: 'Result of the RT-PCR molecular test for dengue or chikungunya virus RNA:
      1 Positivo, 2 Negativo, 3 Inconclusivo, 4 Não realizado.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 46

      '
  RESUL_PRNT:
    official_name: Resultado do Exame Sorológico (IgM) PRNT
    translated_name: PRNT test result (Chikungunya)
    description: 'Result of the plaque-reduction neutralization test drawn for a Chikungunya
      notification: reagent, non-reagent, inconclusive, or not performed. Used to confirm/rule
      out chikungunya when IgM is ambiguous.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 38-Exame PRNT
  RESUL_SORO:
    official_name: Exame Sorológico (IgM) Dengue - Resultado
    translated_name: Dengue IgM serology result
    description: 'Result of the IgM antibody serology test for dengue, run on a blood sample
      collected during the illness: 1 Reagente, 2 Não Reagente, 3 Inconclusivo, 4 Não realizado.

      '
    code_system: internal
    codelists:
    - RESULTADO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 40

      '
  RESUL_VI_N:
    official_name: Isolamento Viral - Resultado
    translated_name: Viral isolation result
    description: 'Result of viral culture/isolation attempted from a blood sample, used to
      confirm active dengue or chikungunya infection: 1 Positivo, 2 Negativo, 3 Inconclusivo,
      4 Não realizado.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 43

      '
  RES_CHIKS1:
    official_name: Resultado do Exame Sorológico (IgM) soro 1 para Chikungunya
    translated_name: Chikungunya IgM serology result, sample 1
    description: 'Result of the first-sample IgM serology for Chikungunya: reagent, non-reagent,
      inconclusive, or not performed. First (acute-phase) blood draw, paired with RES_CHIKS2
      from a later sample.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 38-Exame sorológico IgM soro 1
  RES_CHIKS2:
    official_name: Resultado do Exame Sorológico (IgM) soro 2 para Chikungunya
    translated_name: Chikungunya IgM serology result, sample 2
    description: 'Result of the second-sample IgM serology for Chikungunya, same reagent/non-reagent/inconclusive/not-performed
      scale as RES_CHIKS1; convalescent-phase sample taken later to confirm a negative or
      weak first result.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 38-Exame sorológico IgM soro 2
  S1_IGG:
    official_name: Resultado sorologia IgG - 1ª amostra
    translated_name: IgG result, first sample
    description: 'IgG antibody result from the same first sample; on this early sample IgG
      mostly reflects past exposure or vaccination rather than the current acute infection
      being investigated.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 1)
  S1_IGM:
    official_name: Resultado sorologia IgM - 1ª amostra
    translated_name: IgM result, first sample
    description: 'IgM antibody result from the first blood sample drawn during a suspected
      measles/rubella investigation (also carried by the pre-2007 dengue form): a reagent
      result signals recent infection, since IgM appears early.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 1)
  S2_IGG:
    official_name: Resultado sorologia IgG - 2ª amostra
    translated_name: IgG result, second sample
    description: 'IgG result from the second sample; comparing it against the first sample''s
      IgG shows a rising titer, the classic laboratory sign of a recent measles or rubella
      infection.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 2)
  S2_IGM:
    official_name: Resultado sorologia IgM - 2ª amostra
    translated_name: IgM result, second sample
    description: 'IgM result from the second, convalescent sample, drawn later than S1 to
      catch a case whose first sample tested falsely negative or inconclusive for the antibody.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Exantematica_v5.pdf, campo 48 (Resultados sorologia amostra 2)
  SANGRAM:
    official_name: 'Sinais e Sintomas — Sangramento

      '
    translated_name: 'Bleeding (generic) sign

      '
    description: 'Whether the patient had any bleeding manifestation not broken out into its
      own item, the catch-all of the legacy dengue- hemorrhagic-manifestations checklist (1
      Sim, 2 Não, 9 Ignorado); see CON_FHD.

      '
    code_system: internal
    codelists:
    - SANGRAM
    source: def
    source_ref: '[DEF] ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field SANGRAM: value
      labels 1=Sim, 2=Não, 9=Ignorado

      '
  SEM_ACID:
    official_name: Semana epidemiológica do acidente
    translated_name: Epidemiological week of the accident
    description: 'Epidemiological week (AAAASS format) of the workplace accident, in this
      batch''s biological-material and severe work-accident forms — the accident-specific
      equivalent of the SEM_NOT/SEM_PRI internal fields confirmed in the base notification
      dictionary.

      '
    code_system: none
    source: inferred
    reasoning: 'C(6,0) matching the AAAASS epidemiological-week width used by SEM_NOT/ SEM_PRI
      in the base notification dictionary; SEM_ prefix plus ACID (acidente) on a workplace-accident
      ficha.

      '
  SEM_DIAG:
    official_name: Semana Epidemiológica do Diagnóstico
    translated_name: Epidemiological week of diagnosis
    description: Epi-week (6-digit AAAASS) corresponding to DT_DIAG.
    code_system: none
    source: inferred
    reasoning: 'SEM_ is SINAN''s epi-week prefix (see SEM_NOT, SEM_PRI, both C(6-7) AAAASS
      strings derived from a sibling date field); DIAG mirrors DT_DIAG, which this field co-occurs
      with in the same agravo forms.

      '
    depends_on:
    - DT_DIAG
  SEM_NOT:
    official_name: Semana Epidemiológica da Notificação
    translated_name: Epidemiological week of notification
    description: 'The epidemiological week DT_NOTIFIC falls in, filled in automatically as
      a 6-digit AAAASS string (4-digit year + 2-digit epi-week). Epidemiological weeks follow
      the CDC/EPI-WEEK convention DATASUS uses system-wide, not the ISO calendar week, so
      week boundaries will not line up with ISO-week aggregations done elsewhere.

      '
    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Semana epidemiológica da notificação (campo interno) | ds_semana_notificacao
      | varchar2(6) | Semana epidemiológica que o caso foi notificado | Preenchida automaticamente,
      a partir da data de notificação (AAAASS) | SEM_NOT"

      '
    depends_on:
    - DT_NOTIFIC
    notes: 'SEMANAEP is a TabNet tabulation-week table bound to this and several other fields;
      likely a SPURIOUS-BINDING? for a column that is already a formatted week number, not
      a coded value needing a label.

      '
  SEM_PRI:
    official_name: Semana Epidemiológica dos Primeiros Sintomas/Diagnóstico
    translated_name: Epidemiological week of onset/diagnosis
    description: 'Epi-week (AAAASS) of DT_SIN_PRI, filled in automatically — inherits the
      same acute-vs-chronic ambiguity as DT_SIN_PRI.

      '
    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Semana epidemiológica dos primeiros sintomas/ diagnósticos
      (campo interno) | ds_semana_sintoma | varchar2(6) | Semana epidemiológica dos primeiros
      sintomas ... data do diagnostico | SEM_PRI"

      '
    depends_on:
    - DT_SIN_PRI
  SENSIBILI:
    official_name: Sinais e sintomas - Alteração de sensibilidade
    translated_name: Altered sensitivity
    description: 'Patient reported altered sensation — numbness or tingling — in the affected
      limb, one of the signs and symptoms screened for a work-related musculoskeletal disorder.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 49 (Alteração de sensibilidade)
  SG_UF:
    official_name: UF de Residência
    translated_name: State of residence
    description: 'Two-letter sigla of the state where the patient lived at notification. Mandatory
      only for patients resident in Brazil — the system defaults it to blank and instead asks
      for a foreign nation when no Brazilian UF is chosen.

      '
    code_system: external
    codelists:
    - UF
    - UFCCODIG
    - UFCODIGO
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "17. UF | co_uf_residencia | varchar2(2) | Sigla da Unidade
      Federada de residência do paciente por ocasião da notificação | Campo Obrigatório se
      residente no Brasil | SG_UF"

      '
  SG_UF_NOT:
    official_name: UF de Notificação
    translated_name: State of the notifying unit
    description: 'Two-letter sigla of the state where the notifying health establishment sits
      — the administrative location of the report, not the patient''s home state (SG_UF) or
      place of probable infection (COUFINF). A patient treated in a referral hospital in another
      state will show that hospital''s state here.

      '
    code_system: external
    codelists:
    - UFCCODIG
    - UFCODIGO
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "4. UF de Notificação | co_uf_notificacao | varchar2(2) |
      Sigla da Unidade Federativa onde está localizada a unidade de saúde (ou outra fonte
      notificadora) que realizou a notificação | Campo Obrigatório | SG_UF_NOT"

      '
  SILICA:
    official_name: 'Agentes de Exposição — Sílica

      '
    translated_name: 'Occupational exposure to free silica

      '
    description: 'Whether the patient was occupationally exposed to free silica (sílica livre)
      at any point in their working life (1 Sim, 2 Não, 9 Ignorado). Same lifetime-exposure
      checklist as BERILIO; silica is the classic cause of silicosis and, on the DRT Câncer
      form, is asked alongside arsenic as a lung carcinogen.

      '
    code_system: internal
    source: layout_doc
    source_ref: '[PNEU] http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf
      — "51. Agentes de Exposição Sílica | st_agente_silica | varchar2(1) | 1 – Sim 2 – Não
      9 – Ignorado | O paciente esteve exposto à Sílica | Campo obrigatório | SILICA"; CANC
      form asks the same item as "Sílica livre, arsênico e seus compostos arsenicais", DBF
      SILICA.

      '
    notes: 'No codelist is bound to this column in the catalog; see the BERILIO note — the
      value set is confirmed in the layout document regardless.

      '
  SINAIS:
    official_name: Sinais clínicos
    translated_name: Clinical signs present
    description: 'Whether clinical signs were present at examination, as a flag. The signs
      themselves, where the form records them, are in separate columns.

      '
    code_system: internal
    source: inferred
    reasoning: Sinais is clinical signs; C(1) admits a flag, not a list.
  SINTO_DES:
    official_name: Sinais e sintomas - Se outro, especificar
    translated_name: Other symptom, specified
    description: 'Free-text name of an additional sign or symptom, filled in only when the
      "other symptom" checkbox on the same block is marked yes.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 49 (Se Outro especificar)
  SIT_TRAB:
    official_name: Situação no Mercado de Trabalho
    translated_name: Labour-market status
    description: 'Employment status of the person at the time of the work-related case: 01
      empregado c/carteira, 02 empregado s/carteira, 03 autônomo, 04/05 servidor público (estatutário/celetista),
      06 aposentado, 07 desempregado, 08 trabalho temporário, 09 cooperativado, 10 trabalhador
      avulso, 11 empregador, 12 outros, 99 ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: '[DIC-DRT-ATG] "32. Situação no mercado de trabalho | tp_mercado_trabalho
      | varchar2(2) | 01. Empregado registrado com carteira assinada; 02. Empregado não registrado;
      03. Autônomo/conta própria; 04. Servidor público estatuário; 05. Servidor público celetista;
      06. Aposentado; 07. Desempregado; 08. Trabalho temporário; 09. Cooperativado; 10. Trabalhador
      avulso; 11. Empregador; 12. Outros; 99. Ignorado | Situação de trabalho do indivíduo
      que sofreu o agravo | Campo Essencial | SIT_TRAB"

      '
  SOROTIPO:
    official_name: Sorotipo
    translated_name: Dengue serotype
    description: 'Which dengue virus serotype (DEN 1-4) was identified by viral isolation
      or RT-PCR; filled in only when one of those two tests comes back positive.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Dengue/DIC_DADOS_ONLINE.pdf,
      campo 47

      '
  STRESS:
    official_name: O paciente está exposto em seu local de trabalho à ambiente estressante
    translated_name: Exposed to a stressful work environment
    description: 'Whether the patient''s workplace is judged to be a stressful environment,
      one of several occupational risk factors assessed when investigating a LER/DORT (repetitive
      strain injury) case. 1 yes, 2 no, 9 ignored.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, campo 51
  TAREFAS:
    official_name: Limitação e incapacidade para o exercício de tarefas
    translated_name: Limitation/incapacity to perform work tasks
    description: 'Whether the patient became incapacitated or limited in performing job tasks
      because of the LER/DORT condition under investigation. 1 yes, 2 no, 9 ignored.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, campo 50
  TEMPO_FUMA:
    official_name: Tempo de fumo (número)
    translated_name: Smoking duration — magnitude
    description: 'Numeric magnitude of how long the patient has smoked, paired with the unit
      code in TP_TEMP_FU. Only meaningful when FUMA=1.

      '
    code_system: none
    source: inferred
    reasoning: 'TEMPO_ prefix on a C(2,0) field immediately adjacent to FUMA and TP_TEMP_FU
      mirrors the confirmed NU_AFAST+TP_AFAST magnitude+unit pattern documented for this same
      system''s DRT fichas (see NU_AFAST).

      '
  TERCEIRIZA:
    official_name: Empregador é Empresa Terceirizada?
    translated_name: Is the employer a subcontractor?
    description: 'Whether the immediate employer is itself a subcontracted (terceirizada)
      firm working for a principal company: 01 Sim, 02 Não, 03 Não se aplica, 09 Ignorado.'
