    source: layout_doc
    source_ref: Dengue/Chikungunya ficha de investigação (prefeitura.pbh.gov.br), campo "EXAME
      NS1 - DATA DA COLETA"
  DT_OBITO:
    official_name: Data de Óbito
    translated_name: Date of death
    description: 'Date of death, filled in only when EVOLUCAO records a death (by the notified
      agravo or by another cause). Must be on or after the onset date (DT_SIN_PRI), or after
      the accident date on occupational-accident forms.

      '
    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "42-Data de óbito | dt_obito | Date | Dd/mm/aaaa | Data de
      óbito | Campo habilitado se campo evolução= 2 ou 3; Campo> = data dos primeiros sintomas
      | DT_OBITO"

      '
    depends_on:
    - EVOLUCAO
    notes: 'Present but null for the large majority of records — only fill rate among EVOLUCAO
      deaths is meaningful; a raw null-count is not a data-quality signal by itself.

      '
  DT_PCR:
    official_name: RT-PCR – Data da Coleta
    translated_name: RT-PCR sample collection date
    description: 'Date the sample used for the RT-PCR laboratory test was collected, for dengue/chikungunya
