      '
    code_system: none
    source: layout_doc
    source_ref: Dengue/Chikungunya ficha de investigação (prefeitura.pbh.gov.br), campo "SOROLOGIA
      (IgM) - DATA DA COLETA"
  DT_TRANSDM:
