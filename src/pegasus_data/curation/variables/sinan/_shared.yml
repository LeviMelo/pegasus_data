      '
    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Data de transferência da secretaria estadual de saúde |
      dt_transf_se | date Dd/mm/aaaa | Data de Transferência do registro da Secretaria Estadual
      para do nível superior do sistema | DT_TRANSSE"

      '
  DT_TRANSSM:
    official_name: Data de Transferência da Secretaria Municipal de Saúde
    translated_name: Transfer date — municipal health department level
    description: Same internal-replication control, at the secretaria municipal de saúde level.
