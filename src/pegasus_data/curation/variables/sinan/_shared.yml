      '
    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Data de transferência da unidade de saúde | dt_transf_us
      | date Dd/mm/aaaa | Data de Transferência do registro da Unidade de Saúde para do nível
