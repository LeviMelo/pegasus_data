      '
    code_system: none
    source: inferred
    reasoning: 'Shared between FMAC and a related rickettsial/tick-borne agravo; name reads
      "identificação microbiológica"; wide C50 width fits a written species identification
      rather than a coded field.

      '
  ID_AGRAVO:
    official_name: Agravo/doença
    translated_name: Notifiable disease/condition
    description: 'The notifiable condition this record reports, coded from SINAN''s own catalogue
      of compulsorily-notifiable agravos, which is anchored to CID-10 for classifiable diseases
      but also carries codes for aggregated syndromes (febre hemorrágica aguda, diarreia aguda
      sanguinolenta, etc.) that are not single CID-10 codes. This is the field that tells
      you which agravo-specific form (and which agravo-specific CRITERIO/CLASSI_FIN/EVOLUCAO
      codelist) applies to the rest of the record.

      '
    code_system: external
    codelists:
    - AGRAVNET
    - AGRAVOSSURTO
    - AGRAVSURT
    - AGUDOSNET
    - COMPNAC
    - CRONICASNET
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "2. Agravo | co_cid | varchar2(4) | Nome e código do agravo
      notificado segundo CID-10 (Centro Colaborador da OMS para a Classificação de Doenças
      em Português) ... classificados como notificação compulsória (nacional, estadual ou
      municipal) e as síndromes | Campo Chave"

      '
    notes: 'A single physical file (a "série") is usually already filtered to one ID_AGRAVO
      family — the catalog''s per-series codelist proliferation (AGRAVNET, AGRAVOSSURTO, ...)
      reflects that different agravo groups use different sub-tables of the same underlying
      agravo catalogue.

      '
  ID_DG_NOT:
    official_name: Identificador de notificação (bloco Dados Gerais)
    translated_name: Notification-record control code
    description: 'Short internal code tied to the notification''s "Dados Gerais" block, present
      on Chagas Aguda, Dengue, Leptospirose and Malária forms as a 1-character code, on Leishmaniose
      forms as 11 characters, and as a number on Hantavirose. The width swings across agravos
      rather than holding one stable shape, pointing to a record-management artifact rather
      than a clinical answer.

      '
    code_system: none
    source: inferred
    reasoning: 'No def_variables, dictionary, or field_documentation row exists for this name
      in the catalog. Its declared type/width is inconsistent across the seven agravos that
      carry it (C1 vs C11 vs N1), unlike genuine clinical fields which keep a stable shape
      across forms; that instability, plus the ID_ prefix SINAN uses for both identifiers
      and internal control codes, is the basis for treating it as a record-control field rather
      than guessing a specific clinical meaning.

      '
  ID_EV_NOT:
    official_name: Identificador de notificação (bloco Evolução/Notificação)
    translated_name: Notification-record control code (evolution block)
    description: 'Sibling of ID_DG_NOT on the same seven agravo forms, with the same cross-agravo
      width instability (1 character on Chagas/Dengue/ Leptospirose/Malária, 11 on the Leishmaniose
      forms, numeric on Hantavirose). "EV" suggests a tie to the case''s evolução/outcome
      block rather than Dados Gerais, but nothing confirms a meaning distinct from ID_DG_NOT.

      '
    code_system: none
    source: inferred
    reasoning: 'Same absence of evidence as ID_DG_NOT: no def_variables, dictionary or field_documentation
      row, and a declared width that changes by agravo. Recorded separately because the catalog
      treats it as a distinct column, but the real distinction between the two beyond the
      DG/EV naming is not verifiable here.

      '
