    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Data de transferência da regional de saúde | dt_transf_rs
      | date Dd/mm/aaaa | Data de Transferência do registro da Regional de Saúde para do nível
