      what later became COMUNINF.

      '
    code_system: external
    source: inferred
    reasoning: 'CON_INF_MU/CON_INF_UF appear only in 2000-2006 records of CHAG, DENG, LEIV,
      LEPT and MALA, diseases where SINAN tracks probable place of infection apart from residence.
      The 2012 Hantavirose dictionary documents the surviving version of this concept (campos
      57-59, COUFINF/COMUNINF = "UF/Município provável da fonte de infecção"); CON_INF_MU/UF
      are the retired pre-2007 names for the same pair, dropped when SINAN NET standardized
      field naming.

      '
    asserted_by: pegasus_data
  CON_INF_OU:
    official_name: Outra condição de imunossupressão
    translated_name: Other immunosuppressive condition
    description: 'Free-text/coded field noting another immunosuppressive condition (beyond
