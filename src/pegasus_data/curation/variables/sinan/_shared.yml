      '
    notes: 'Declared width varies between 1 and 4 characters across files, so the category
      count likely differs by agravo (e.g. a simple positivo/negativo pair on some forms vs.
      an extra "em andamento"/"não realizado" category on others) — the exact set is not verified
      here.

      '
  HOSPITAL:
