    - REGIONET
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Regional de saúde (campo interno) | varchar2(4) | Regional
      de saúde onde está localizado o município de residência do paciente por ocasião da notificação
      | ID_RG_RESI"

      '
    depends_on:
    - ID_MN_RESI
  ID_UNIDADE:
    official_name: Unidade de Saúde Notificadora
    translated_name: Notifying health facility
    description: 'CNES code of the health establishment (or other notifying source) that attended
      and reported the case — the facility, not the municipality or state it sits in.

      '
    code_system: external
    codelists:
    - AB
    - NHE
    - NHENIVEL
    - NHEUNIDADE
    - NHE_NIVEL_MUN
    - UNIDANET
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "6. Unidade de saúde ou outra fonte notificadora | co_unidade_notificacao
      | number(8,0) | Nome completo e código da unidade de saúde (ou outra fonte notificadora)
      que realizou o atendimento e notificação do caso | Códigos e nomes da tabela do Cadastro
      Nacional de Estabelecimento de Saúde (CNES) | Campo Obrigatório | ID_UNIDADE"

      '
  IMUNOH_N:
    official_name: Imunohistoquímica (resultado)
    translated_name: Immunohistochemistry result
    description: 'Result of an immunohistochemistry test on autopsy tissue used to confirm
      dengue as the cause of death: positive, negative, inconclusive, or not performed.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dengue/Chikungunya ficha de investigação (prefeitura.pbh.gov.br), campo "IMUNOHISTOQUÍMICA"
  INDIVIDUAL:
    official_name: Conduta geral – adoção de proteção individual
    translated_name: General response taken — individual protection measures adopted
    description: 'One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one records whether individual protective equipment/measures were adopted for the
      worker. 1=Sim, 2=Não.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 57 'Conduta geral – adoção de proteção individual', DBF=INDIVIDUAL
  INSTITUCIO:
    official_name: Institucionalizado em
    translated_name: Institution type
    description: 'Type of institution the patient was confined to or attended at notification:
      daycare, school, nursing home, workplace, prison, hospital/clinic, other, not institutionalized,
      or ignored.

      '
    code_system: internal
    source: web
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hepatites%20Virais/DIC_DADOS_Hepatite_v5.pdf,
      campo 35 "Institucionalizado em"

      '
  IN_AIDS:
    official_name: Indicação de AIDS
    translated_name: AIDS indicated
    description: 'Whether the source patient of the exposure was known to have AIDS, which
      is what determines the prophylaxis regimen offered to the worker.

      '
    code_system: internal
    source: inferred
    reasoning: 'IN_ is the flag prefix and AIDS needs no expansion; C(1), and it sits with
      the prophylaxis fields it governs.

      '
  IN_VINCULA:
    official_name: Vinculação
    translated_name: Linked-record flag
    description: 'Whether this notification was linked (vinculada) to a hanseníase or tuberculose
      follow-up (acompanhamento) record: 0/blank not linked, 1 linked. Set by the system after
      the linking routine runs, not typed by a user.

      '
    code_system: internal
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Vinculação | st_vincula | varchar2(1) | 0 ou branco – Não
      Vinculado; 1 – Vinculado | Indica se a notificação foi vinculada | Categoria 1 atribuída
      pelo sistema após vinculação de notificações de hanseníase ou tuberculose | IN_VINCULA"

      '
  ISOLAMENTO:
    official_name: 'Isolamento

      '
    translated_name: 'Isolation flag / isolation-test result

      '
    description: 'Two unrelated meanings under one name: on the spotted-fever (febre maculosa)
      form it is the RESULT of an agent-isolation laboratory test (1 Detectado, 2 Não Detectado,
      3 Não realizado); on the congenital- rubella-syndrome form it is whether the NEWBORN
      was kept in isolation in the maternity ward, an infection-control measure (1 Sim, 2
      Não, 9 Ignorado). Do not treat "1" as the same fact across the two series.

      '
    code_system: internal
    codelists:
    - RESULTADO1
    - SIM_NAO
    source: layout_doc
    source_ref: '[FMAC] http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre%20Maculosa/DIC_DADOS_Febre_Maculosa_v5.pdf
      — "45. Resultado Isolamento | tp_outro_exame_isolamento | varchar(1) | 1– Detectado
      2- Não Detectado 3- Não realizado | Informar o Resultado o Isolamento | ISOLAMENTO";
      on the SRC form, [SRC] http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "43. Isolamento de Recém-Nascido na Maternidade | st_isolamento_recem_nascido | varchar(1)
      | 1- Sim 2- Não 9- Ignorado | ISOLAMENTO"

      '
    notes: 'Genuine semantic collision: a laboratory result on FMAC files, an infection-control
      action on SRC files. Pooling ISOLAMENTO across series without checking which agravo
      the record belongs to will silently mix a lab finding with a ward-management decision.

      '
  LAB_CONFIR:
    official_name: Evidência laboratorial de infecção pelo HIV (Teste confirmatório)
    translated_name: Confirmatory HIV test result
    description: 'Result of the confirmatory anti-HIV laboratory test in an adult AIDS investigation.
      1=Positivo/Reagente, 2=Negativo, 3=Inconclusivo, 4=Não realizado, 5=Indeterminado, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 40
  LAB_HISTOP:
    official_name: Histopatologia
    translated_name: Histopathology
    description: 'Result of a skin-biopsy histopathology exam: parasite found, compatible,
      not compatible, or not performed; used to help confirm cutaneous leishmaniasis when
      parasitological tests are negative.

      '
    code_system: internal
    source: web
    source_ref: github.com/rfsaldanha/microdatasus, process_sinan_leishmaniose_tegumentar.R#LAB_HISTOP
  LAB_PCR_1:
    official_name: Evidência laboratorial de infecção pelo HIV (1o teste de detecção de ácido
      nucléico)
    translated_name: First nucleic-acid test result
    description: 'Result of the first PCR/nucleic-acid detection test used to diagnose HIV
      in a child under 18 months. 6=Detectável, 7=Indetectável, 4=Não realizado, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  LAB_PCR_2:
    official_name: Evidência laboratorial de infecção pelo HIV (2o teste de detecção de ácido
      nucléico)
    translated_name: Second nucleic-acid test result
    description: 'Result of the second PCR/nucleic-acid detection test in the same pediatric
      diagnostic sequence as LAB_PCR_1, using the same value codes.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  LAB_PCR_3:
    official_name: Evidência laboratorial de infecção pelo HIV (3o teste de detecção de ácido
      nucléico)
    translated_name: Third nucleic-acid test result
    description: 'Result of the third PCR/nucleic-acid detection test completing the same
      pediatric diagnostic sequence as LAB_PCR_1 and LAB_PCR_2.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  LAB_TGO:
    official_name: Resultado A - TGO
    translated_name: Result A - AST/SGOT liver enzyme
    description: 'Whether a blood test for TGO (AST), a liver enzyme, came back elevated in
      a hospitalized Hantavirose patient; elevated transaminases signal the liver involvement
      seen in severe hantavirus disease. 3=exam not performed.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 38
  LAB_TGP:
    official_name: Resultado A - TGP
    translated_name: Result A - ALT/SGPT liver enzyme
    description: 'Whether a blood test for TGP (ALT), a liver enzyme, came back elevated in
      a hospitalized Hantavirose patient; elevated transaminases signal the liver involvement
      seen in severe hantavirus disease. 3=exam not performed.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Hantavirose_v5.pdf, campo 38
  LAB_TRIAGE:
    official_name: Evidência laboratorial de infecção pelo HIV (Teste de triagem)
    translated_name: HIV screening test result
    description: 'Result of the patient''s first-line HIV screening test: 1=Positivo/Reagente,
      2=Negativo, 3=Inconclusivo, 4=Não realizado, 9=Ignorado. A reactive result triggers
      the confirmatory test recorded in a separate field.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 40
  LAB_UREIA:
    official_name: Ureia
    translated_name: Blood urea
    description: 'Result of a blood-urea test, a biochemistry marker monitored to detect the
      acute kidney injury that hantavirus pulmonary syndrome and severe leptospirosis (Weil
      disease) can cause.

      '
    code_system: none
    source: web
    source_ref: scielo.iec.gov.br/scieloOrg S1679-49742011000400013, hantavirus laboratory
      monitoring
  LACO:
    official_name: Prova do laço positiva
    translated_name: Tourniquet test positive
    description: 'Whether the tourniquet test (Prova do Laço) — inflating an arm cuff to check
      for petechiae — came back positive, one of the dengue/ chikungunya sinais-clínicos checkboxes:
      yes or no.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dengue/Chikungunya ficha de investigação (prefeitura.pbh.gov.br), sinais clínicos
      "PROVA DO LAÇO POSITIVA"
  LACO_N:
    official_name: Prova do laço (revisão anterior)
    translated_name: Tourniquet test, earlier revision
    description: 'Same tourniquet-test result as LACO but from an earlier form revision that
      also allowed "ignorado": positive/yes, negative/no, or unknown, versus LACO''s yes/no-only
      coding.

      '
    code_system: internal
    source: web
    source_ref: github.com/rfsaldanha/microdatasus, process_sinan_chikungunya.R#LACO_N
  LEUCOPENIA:
    official_name: Sinais clínicos - Leucopenia
    translated_name: Leucopenia (low white-cell count)
    description: 'Whether a Dengue/Chikungunya patient''s blood tested with an abnormally
      low white-cell level (leucopenia), one lab finding listed alongside clinical signs like
      fever or rash on the notification form.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf (Dengue/Chikungunya Sinan Online), campo 33.
  LIMITA_MOV:
    official_name: Sinais e sintomas - Limitação de movimentos
    translated_name: Movement limitation
    description: 'Range of movement in the affected limb or joint was limited at diagnosis,
      one of the clinical signs recorded for a work-related musculoskeletal disorder case.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 49 (Limitação de movimentos)
  MAIS_6HS:
    official_name: Exposto a jornada de trabalho de mais de 6 horas
    translated_name: Workday over 6 hours
    description: 'Daily workday exceeds six hours, an ergonomic exposure factor recorded when
      investigating a work-related repetitive strain injury (LER/DORT) case.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 51 (jornada superior a 6 horas)
  MANI_HEMOR:
    official_name: Manifestações Hemorrágicas
    translated_name: Hemorrhagic manifestations
    description: 'Whether the patient showed bleeding signs such as petechiae, gum bleeding,
      or epistaxis during the dengue/chikungunya illness: 1 Sim, 2 Não, 9 Ignorado; a warning
      sign used in dengue severity classification.

      '
    code_system: internal
    source: web
    source_ref: 'github.com/rfsaldanha/microdatasus, R/process_sinan_chikungunya.R, field
      MANI_HEMOR

      '
  MEDICAMENT:
    official_name: Medicamentos Injetáveis
    translated_name: Injectable medications
    description: 'Whether the patient was exposed to injectable medications, and if so within
      six months of symptom onset or longer ago; a bloodborne-hepatitis exposure-risk item
      on the epidemiological antecedents block.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br Hepatites Virais ficha, Hepatite_v5.pdf, campo 38
      "Medicamentos Injetáveis"
  MED_CASO_S:
    official_name: 'Quantos Casos Secundários Foram Confirmados entre os Comunicantes

      '
    translated_name: 'Secondary cases confirmed among contacts

      '
    description: 'How many secondary cases were confirmed among the traced close contacts,
      filled only when MED_IDEN_C = 1 (Sim). Categorical on both source forms rather than
      a bare tally: the pertussis form codes it 0 Nenhum/1 Um/2 Dois ou mais, the diphtheria
      form 1 Nenhum/2 Um/3 Dois ou mais/9 Ignorado — the code-to-label mapping differs between
      the two series even though the underlying question is the same.

      '
    code_system: internal
    codelists:
    - 012IGN
    source: layout_doc
    source_ref: '[COQU] http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "54. Quantos Casos Secundários Foram Confirmados Entre Os Comunicantes | tp_caso_confirmado
      | varchar(1) | 0. Nenhum 1. Um 2. Dois ou mais | MED_CASO_S"; on the diphtheria form,
      [DIFT] http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "56-Quantos casos secundários foram confirmados entre os comunicantes | tp_comunicante_confirmado
      | varchar(1) | 1. Nenhum 2. Um 3. Dois ou mais 9. Ignorado | MED_CASO_S"

      '
    depends_on:
    - MED_IDEN_C
    notes: 'The 0/1/2 vs 1/2/3/9 code offset between COQU and DIFT is a real cross-series
      trap for anyone decoding this column with one fixed lookup table.

      '
  MED_IDEN_C:
    official_name: 'Realizada Identificação dos Comunicantes Íntimos

      '
    translated_name: 'Intimate/close contacts traced (flag)

      '
    description: 'Whether close ("intimate") contacts of the case were identified for contact
      tracing — household, daycare, school, barracks or similar settings that allow close
      contact (1 Sim, 2 Não, 9 Ignorado). Gates MED_QUAN_C and MED_CASO_S. Confirmed identically
      on the pertussis and diphtheria contact-tracing blocks.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[COQU] http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "52. Realizada Identificação Dos Comunicantes Íntimos | st_identificacao_comunicante
      | varchar(1) | 1- Sim 2- Não 9. Ignorado | MED_IDEN_C"; matching item on [DIFT] http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "54-Realizada Identificação dos Comunicantes Íntimos | st_comunicante_intimo | varchar(1)
      | 1. Sim 2. Não 9. Ignorado | MED_IDEN_C"

      '
    depends_on:
    - MED_QUAN_C
    - MED_CASO_S
  MED_QUAN_C:
    official_name: 'Se Sim, Quantos? (Comunicantes Íntimos)

      '
    translated_name: 'Number of intimate contacts identified

      '
    description: 'Count of close/"intimate" contacts identified, filled only when MED_IDEN_C
      = 1 (Sim). A bare count, not a coded value.

      '
    code_system: none
    source: layout_doc
    source_ref: '[COQU] http://portalsinan.saude.gov.br/images/documentos/Agravos/Coqueluche/DIC_DADOS_Coqueluche_v5.pdf
      — "53. Se Sim, Quantos? | qt_identificacao | numeric(3) | Número de comunicantes íntimos
      | MED_QUAN_C"; matching item on [DIFT] http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      — "55-Se Sim, Quantos? | qt_comunicante_intimo | numeric(3) | número de comunicantes
      íntimos identificados | MED_QUAN_C"

      '
    depends_on:
    - MED_IDEN_C
  MENOS_MOV:
    official_name: Sinais e sintomas - Diminuição do movimento
    translated_name: Reduced movement
    description: 'Movement of the affected limb or joint was reduced, a clinical sign recorded
      alongside pain and muscle weakness for a LER/DORT case.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_LERDORT_v5.pdf, item 49 (Diminuição do movimento)
  MENTAL:
    official_name: Agravos associados – Transtorno mental
    translated_name: Associated condition — mental disorder
    description: 'Pre-existing/associated-condition comorbidity flag: whether the patient
      has a diagnosed mental disorder, recorded alongside ASMA/HANSENIASE/HIPERTEN/ OUT_AGRAVO.
      1=Sim, 2=Não, 9=Ignorado. This is a comorbidity checkbox on any work-related-disease
      ficha (e.g. a hearing-loss or cancer notification) — it is not specific to the "Transtornos
      Mentais Relacionados ao Trabalho" notification itself, even though this batch''s series
      for the column includes that sub-system.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 46 'Agravos associados – transtorno mental', DBF=MENTAL
  METAL:
    official_name: Agentes de Exposição - Metais duros
    translated_name: Hard-metal dust exposure
    description: 'Whether the worker was exposed to hard-metal dusts (cobalt, titanium, tungsten),
      one of eight occupational exposure-agent checkboxes on the pneumoconiosis investigation
      form: 1 yes, 2 no, 9 ignored.

      '
    code_system: internal
    source: layout_doc
    source_ref: DRT_Pneumoconioses.pdf, campo 51 "Agentes de Exposição"
  METRO:
    official_name: 'Sinais e Sintomas — Metrorragia

      '
    translated_name: 'Abnormal uterine bleeding (metrorrhagia) sign

      '
    description: 'Whether the patient had metrorragia (abnormal/heavy uterine bleeding outside
      menstruation), one of the legacy dengue-hemorrhagic- manifestations checklist items
      (1 Sim, 2 Não, 9 Ignorado); see CON_FHD. The current combined Dengue/Chikungunya form
      keeps an analogous but separately-named severity item ("Dengue grave — Metrorragia volumosa",
      DBF GRAV_METRO) — do not conflate GRAV_METRO with this legacy METRO column; they are
      different DBF fields on different form generations.

      '
    code_system: internal
    codelists:
    - METRO
    source: def
    source_ref: '[DEF] ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
      (TAB_SINANNET dictionary/.CNV tables) — TAB_SINANNET dictionary, field METRO: value
      labels 1=Sim, 2=Não, 9=Ignorado

      '
  MIALGIA:
    official_name: Sinais clínicos – Mialgia
    translated_name: Clinical sign — muscle pain (myalgia)
    description: 'Clinical-sign-present flag in the dengue/chikungunya presenting-symptoms
      checklist: whether myalgia was observed. 1=Sim, 2=Não.

      '
    code_system: internal
    source: layout_doc
    source_ref: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf
      — campo 25 'Sinais clínicos (Mialgia)', DBF=MIALGIA
  MIGRADO_W:
    official_name: Migrado do SINAN Windows
    translated_name: Migrated-from-legacy flag
    description: 'Marks a record that originated in the old DOS/Windows-based SINAN and was
      carried over by the migration routine into SINAN NET, rather than entered directly in
      SINAN NET.

      '
    code_system: internal
    codelists:
    - MIGRADO
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Identifica migração (campo interno) | st_importado | varchar2(1)
      | 1- migrado do Sinan Windows | Identifica se o registro é oriundo da rotina de migração
      da base Windows | MIGRADO_W"

      '
  MUCOSA:
    official_name: 'Mucosa

      '
    translated_name: 'Mucosal involvement flag

      '
    description: 'A Sim/Não(/Ignorado) flag whose referent depends on the agravo: on the biological-accident
      form (ACBI) it marks that the exposure route was mucosal (oral/ocular) contact with
      the biological material; on the human- rabies form (RAIV) it marks that the animal-bite
      wound''s location was mucosal. Same code shape, unrelated clinical questions.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[ACBI] http://portalsinan.saude.gov.br/images/documentos/Agravos/drtmb/DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf
      — "46. Tipo de exposição Mucosa (oral / ocular) | st_exp_mucosa | varchar2(1) | 1. Sim
      2. Não 9. Ignorado | Campo Essencial | MUCOSA"; on the rabies form, [RAIV] http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf
      — "34. Localização Mucosa | st_localizacao_mucosa | varchar(1) | 1. Sim 2. Não | Localização
      do ferimento | MUCOSA"

      '
    notes: 'Do not pool across series: "exposure route was mucosal" (ACBI) and "bite wound
      was on a mucosal surface" (RAIV) are different clinical facts that happen to share a
      column name and a binary code.

      '
  MUDA_TRAB:
    official_name: Conduta geral – adoção de mudança na organização do trabalho
    translated_name: General response taken — change to work organization adopted
    description: 'One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one records whether the way work is organized (tasks, rotation, pace) was changed
      in response to the case. 1=Sim, 2=Não.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 57 'Conduta geral – adoção de mudança na organização do trabalho', DBF=MUDA_TRAB
  MUNICIPIO:
    official_name: Município (da hospitalização)
    translated_name: Municipality where the patient was hospitalized
    description: 'IBGE code and name of the municipality where the patient was hospitalized
      — only populated when HOSPITALIZ=1. Distinct from ID_MUNICIP (municipality of the notifying
      unit) and ID_MN_RESI (municipality of residence): a patient can be notified in one municipality,
      live in a second, and be hospitalized in a third.

      '
    code_system: external
    source: layout_doc
    source_ref: 'https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SINAN/Dengue/dic_dados_dengue.pdf
      — campo 65 ''Município'': ''Código e nome completo do município onde o paciente foi
      hospitalizado'', DBF=MUNICIPIO'
    notes: 'This batch also carries the column for febre tifóide (FTIF) and raiva (RAIV) files,
      where the same "hospitalization municipality" meaning is inferred by name/series match
      rather than separately confirmed.

      '
  MUN_DES1:
    official_name: Município de destino/deslocamento (1)
    translated_name: Municipality of travel/exposure location — 1st episode
    description: 'IBGE municipality code for the first slot of the travel/exposure-history
      block described under CO_UF_DES1.

      '
    code_system: external
    source: inferred
    reasoning: 'C(6,0) bound to the MUNICBR-family codelists, part of the same numbered block
      as CO_UF_DES1/PA_DES1/DT_DESC1 (identical series and file count).

      '
