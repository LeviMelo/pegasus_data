      '
  IDENT_MICR:
    official_name: Identificação microbiológica
    translated_name: Microbiological identification
    description: 'Free-text description of the pathogen species identified by laboratory testing
      (e.g. the Rickettsia species found), used when the causative organism needs to be recorded
