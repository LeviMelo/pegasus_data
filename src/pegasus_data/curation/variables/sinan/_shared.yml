      I through Grau IV), used on the legacy (pre-2014) Dengue investigation form alongside
      the individual hemorrhagic-sign flags (EPISTAXE, GENGIVO, HEMATURA, METRO, SANGRAM).
      Not present on the current combined Dengue/Chikungunya form, which replaced this WHO
      grading with the Dengue/Dengue com sinais de alarme/Dengue grave classification.

      '
    code_system: internal
    codelists:
    - CON_FHD
    source: def
    source_ref: '[DEF] ftp://ftp.datasus.gov.br/dissemin/publicos/SINAN/AUXILIAR/TAB_SINANNET.zip
