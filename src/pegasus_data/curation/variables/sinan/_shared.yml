      '
    code_system: internal
    codelists:
    - RAÇA
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "13. Raça/Cor | tp_raca_cor | varchar2(1) | 1- branca; 2-
      preta; 3- amarela; 4- parda; 5- indígena; 9 Ignorado | Considera-se cor ou raça declarada
      pela pessoa | Campo Essencial | CS_RACA"

      '
  CS_RESULTA:
    official_name: 'Resultado

      '
    translated_name: 'Test-result flag / virus-type result

      '
    description: A laboratory result whose code space depends on the form. On cholera it is
      a binary culture flag, 1 Positivo / 2 Negativo; on congenital rubella syndrome it is
      a four-way virus classification.
    code_system: internal
    codelists:
    - POSNEGIG
    source: layout_doc
    source_ref: '[COLE] http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "54. Resultado | st_resultado | varchar(1) | 1. Positivo 2. Negativo | Informar se
      o exame foi positivo ou negativo | CS_RESULTA"; on the SRC form, [SRC] http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      — "41. Resultado | tp_resultado | varchar(1) | 1 - Vírus rubéola selvagem 2 - Vírus
      rubéola vacinal 3 - Outros vírus 4 - Não detectado | CS_RESULTA"

      '
    notes: 'Genuine cross-series collision in the value space itself, not just the referent
      — code "1" carries a different meaning on COLE files than on SRC files. Never decode
      this column with a single fixed lookup table. SRC values: 1 Vírus rubéola selvagem,
      2 Vírus rubéola vacinal, 3 Outros vírus, 4 Não detectado. So 1 does not mean ''positivo''
      everywhere — on SRC it means wild rubella virus detected, which is a narrower claim.'
  CS_RISO:
    official_name: Riso Sardônico
    translated_name: Sardonic smile
    description: 'Whether the patient displayed risus sardonicus, the facial-muscle spasm
      producing a fixed grimace-like smile typical of tetanus, recorded yes, no, or unknown.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br Tetano_Acidental_v5.pdf, campo 38 "Riso Sardônico"
  CS_SANGUE:
    official_name: 'Sangue

      '
    translated_name: 'Blood-related sign or specimen flag

      '
    description: 'A Sim/Não/Ignorado flag whose referent differs by agravo: on the cholera
      form it marks presence of blood in the patient''s stool (a clinical sign); on the congenital-rubella-syndrome
      form it marks whether a whole-blood specimen was collected for viral detection (a laboratory-workflow
      fact, not a symptom). Same code shape, different kind of fact.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[COLE] http://portalsinan.saude.gov.br/images/documentos/Agravos/Colera/DIC_DADOS_Colera_v5.pdf
      — "42. Presença de sangue | st_presenca_sangue | varchar(1) | 1. Sim 2. Não 9. Ignorado
      | Se há presença de sangue nas fezes do paciente | CS_SANGUE"; on the SRC form, [SRC]
      http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf —
      "40. Detecção Viral Amostra Clínica - Sangue total | st_amostra_sangue_total | varchar(1)
      | 1- Sim 2- Não 9- Ignorado | CS_SANGUE"

      '
    notes: 'Do not read a "Sim" on an SRC file as a clinical sign — it means a blood sample
      was drawn for testing, not that the patient bled.

      '
  CS_SEXO:
    official_name: Sexo
    translated_name: Sex
    description: 'Patient''s sex: M Masculino, F Feminino, I Ignorado. Gates CS_GESTANT —
      the system auto-disables the pregnancy field whenever this is Masculino.

      '
    code_system: internal
    codelists:
    - SEXO
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "11. Sexo | tp_sexo | varchar2(1) | M- Masculino; F- Feminino;
      I- Ignorado | Sexo do paciente | Campo Obrigatório | CS_SEXO"

      '
  CS_SUSPEIT:
    official_name: Suspeita do agravo
    translated_name: Type of suspected case
    description: A disease-specific sub-classification recorded at notification, before laboratory
