      — campo 57 'RT-PCR Data da Coleta', DBF=DT_PCR
    notes: 'This batch also carries the column for leptospirose (LEPT) files, where PCR is
      likewise used diagnostically but the field''s use there is not separately confirmed
      by this document.

      '
  DT_PCR_1:
    official_name: Data da coleta do 1o Teste de detecção de ácido nucléico
    translated_name: First nucleic-acid test collection date
    description: 'Date the first PCR/nucleic-acid detection test was collected, used to diagnose
      HIV in a child under 18 months old whose maternal antibodies make antibody tests unreliable.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  DT_PCR_2:
    official_name: Data da coleta do 2o Teste de detecção de ácido nucléico
    translated_name: Second nucleic-acid test collection date
    description: 'Date the second PCR/nucleic-acid detection test was collected, part of the
      same pediatric HIV diagnostic sequence as DT_PCR_1.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  DT_PCR_3:
    official_name: Data da coleta do 3o Teste de detecção de ácido nucléico
    translated_name: Third nucleic-acid test collection date
    description: 'Date the third PCR/nucleic-acid detection test was collected, completing
      the same pediatric HIV diagnostic sequence as DT_PCR_1 and DT_PCR_2.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  DT_PRNT:
    official_name: Exame PRNT - Data da Coleta
    translated_name: PRNT sample collection date
    description: 'Date blood was drawn for the PRNT (plaque reduction neutralization test)
