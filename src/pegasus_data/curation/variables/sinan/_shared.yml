      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 44
  DT_TRNASRM:
    official_name: Data de transmissão (RM)
    translated_name: Transmission-route date (RM)
    description: 'Date tied to one specific suspected exposure route in an epidemiological
      antecedents block (compare DTTRANSDM, DT_TRNASRS, DTTRANSSE, DTTRANSSM, DTTRANSUS —
