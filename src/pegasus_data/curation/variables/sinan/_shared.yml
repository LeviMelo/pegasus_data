      which give the state, district and municipality components of the same block.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_INF_ prefix recurs across several probable-infection-location fields;
      PA plus the 3-character width matches a country-code slot rather than a place name.

      '
  CON_INF_UF:
    official_name: UF provável de infecção (nome de campo legado)
    translated_name: Probable state of infection
    description: 'UF sigla of the state where the patient was probably infected, recorded
      when infection did not occur in the residence municipality; the pre-2007 field name
      for what later became COUFINF.

      '
    code_system: external
    source: inferred
    reasoning: 'Same evidence as CON_INF_MU: paired UF/município fields appearing only in
      2000-2006 CHAG/DENG/LEIV/LEPT/MALA records, predating the COUFINF/COMUNINF pair documented
      in the 2012 Hantavirose dictionary for the identical "provável fonte de infecção" concept.

      '
    asserted_by: pegasus_data
  COPAISINF:
    official_name: País Provável da Fonte de Infecção
    translated_name: Country of probable infection
    description: 'Nation where the patient is judged to have probably been infected, from
