      '
    code_system: none
    source: inferred
    reasoning: 'Shared between CHAG and LEIV agravos; CON_INF_OU reads "condição/contexto
      de infecção - outra"; C12 width fits a short coded or abbreviated entry, and both diseases
      share an immunosuppression risk factor.

      '
  CON_INF_PA:
    official_name: País de infecção
    translated_name: Country of infection
    description: 'Country code for the "local provável de infecção" (probable place of infection)
