    - CLASSI_FIN
    - SG_UF
  CO_UF_DES1:
    official_name: UF de destino/deslocamento (1)
    translated_name: State (UF) of travel/exposure location — 1st episode
    description: 'Part of a repeated three-slot travel/exposure-history block (see also MUN_DES1,
      PA_DES1, DT_DESC1) recording up to three prior locations or episodes relevant to the
      case: this column is the UF of the first one. Carried in this batch by cólera, doenças
      exantemáticas, febre tifóide and leishmaniose tegumentar americana forms — all diseases
      where travel or displacement history to another place matters for source-tracing.

      '
    code_system: external
    source: inferred
    reasoning: 'C(2,0) bound to UF codelists (UFCCODIG/UFCODIGO), numbered 1 alongside three
      sibling location fields (MUN_DES1, PA_DES1) and a matching date field (DT_DESC1), all
      sharing the identical file set and count (77) — a coherent repeated sub-block for recording
      prior locations/episodes.

      '
    notes: 'The exact ficha section this block belongs to (e.g. "local provável de infecção
      anterior" vs. a travel-history question) was not read directly; the "travel/exposure"
      framing is inferred from the disease mix and the repeated UF+município+país+data shape.

      '
  CO_UF_DES2:
    official_name: UF de destino/deslocamento (2)
    translated_name: State (UF) of travel/exposure location — 2nd episode
    description: 'Second slot of the travel/exposure-history block described under CO_UF_DES1.

      '
    code_system: external
    source: inferred
    reasoning: 'Same reasoning as CO_UF_DES1, numbered slot 2.

      '
  CO_UF_DES3:
    official_name: UF de destino/deslocamento (3)
    translated_name: State (UF) of travel/exposure location — 3rd episode
    description: 'Third slot of the travel/exposure-history block described under CO_UF_DES1.

      '
    code_system: external
    source: inferred
    reasoning: 'Same reasoning as CO_UF_DES1, numbered slot 3.

      '
  CRITERIO:
    official_name: Critério de Confirmação
    translated_name: Confirmation/discard criterion
    description: 'How the case was confirmed or discarded — typically laboratorial / clínico-epidemiológico
      / clínico, but the exact code set (and which numbers mean what) is defined per agravo
      in SINAN''s Anexo I, not globally; a code of "1" means something different for dengue
      than for tuberculose. Read it together with ID_AGRAVO.

      '
    code_system: internal
    codelists:
    - CONFDESC
    - CONFDESCA
    - CONFDESCB
    - CONFDESCC
    - CONFDESCDENG2011
    - CONFDESCDIF
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "33-Critério confirmação | tp_criterio_confirmacao | varchar2(2)
      | Anexo I | Critério utilizado para confirmação ou descarte do caso notificado | Campo
      Essencial | CRITERIO"

      '
    depends_on:
    - ID_AGRAVO
  CRI_1000:
    official_name: Achados laboratoriais - CD4+ < 1000 células/mm3
    translated_name: CD4 count under 1000 cells/mm3
    description: 'Marks that the child''s CD4+ T-lymphocyte count was below 1000 cells/mm3
      (<25%), the immunodeficiency threshold used only when the child''s age is 1 to 5 years.
      1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 45 (Tabela Achados Laboratoriais)
  CRI_1500:
    official_name: Achados laboratoriais - CD4+ < 1500 células/mm3
    translated_name: CD4 count under 1500 cells/mm3
    description: 'Marks that the child''s CD4+ T-lymphocyte count was below 1500 cells/mm3
      (<25%), the immunodeficiency threshold used only when the child is under 12 months old.
      1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 45 (Tabela Achados Laboratoriais)
  CRI_500:
    official_name: Achados laboratoriais - CD4+ < 500 células/mm3
    translated_name: CD4 count under 500 cells/mm3
    description: 'Marks that the child''s CD4+ T-lymphocyte count was below 500 cells/mm3
      (<25%), the pediatric AIDS immunodeficiency threshold used only when the child''s age
      is 6 to 12 years. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Aids_crianca_v5.pdf, campo 45 (Tabela Achados Laboratoriais)
  CS_CRISE:
    official_name: Crises de Contraturas
    translated_name: Contracture crises
    description: 'Whether the patient had episodes of muscle-contracture crises, one of the
      six clinical-sign checkboxes on the tetanus investigation form: yes, no, or unknown.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br Tetano_Acidental_v5.pdf, campo 38 "Crises de Contraturas"
  CS_ESCOLAR:
    official_name: Escolaridade
    translated_name: Education level
    description: 'Highest school grade the patient had completed at notification: 0 illiterate,
      1-8 successive grade levels through completed higher education, 9 ignored, 10 not applicable
      for children under 7.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_NET---Notificacao_Individual_rev.pdf, campo 14
  CS_ESCOL_N:
    official_name: Escolaridade
    translated_name: Education level
    description: 'Highest school grade completed or being attended at notification, on a 10-point
      scale from 1 (1ª-4ª série incompleta) to 8 (educação superior completa), plus 9 Ignorado
      and 10 Não se aplica. The system auto-fills 10 for patients under 7 — so "não se aplica"
      mixes real too-young-for-school cases with the system default, and it cannot legitimately
      appear for an older patient.

      '
    code_system: internal
    codelists:
    - ESCOLARNET
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "14. Escolaridade | tp_escolaridade | varchar2(2) | 43 Analfabeto;
      1. 1ª a 4ª série incompleta do EF ... 9. Ignorado; 10. Não se aplica | grau de instrução
      do paciente por ocasião da notificação | Campo Essencial | CS_ESCOL_N"

      '
    depends_on:
    - NU_IDADE_N
  CS_FLXRET:
    official_name: Fluxo de Retorno
    translated_name: Return-flow flag
    description: 'Marks whether a record notified outside the patient''s home municipality
      is queued to be sent back to that home municipality''s database: 0 not enabled, 1 enabled
      for sending, 2 sent. An artefact of SINAN''s distributed architecture, not a case attribute.

      '
    code_system: internal
    codelists:
    - CS_FLXRET
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "Fluxo de retorno | tp_fluxo_retorno | varchar2(1) | 0 -
      Não habilitado; 1 - habilitado para envio; 2 - enviado | Identifica se o registro está
      ou foi enviado pelo fluxo de retorno para o município de residência | CS_FLXRET"

      '
  CS_GESTANT:
    official_name: Gestante
    translated_name: Pregnancy status/trimester
    description: 'Gestational status at notification: 1/2/3 first/second/third trimester,
      4 idade gestacional ignorada, 5 Não (not pregnant), 6 Não se aplica (male, or an agravo
      whose form doesn''t ask), 9 Ignorado. Auto-filled by the system — 6 for every male record,
      5 for females 10 or younger — so a "5 Não" for an adult woman is a real assertion but
      a "6" mixes true not-applicable cases with every male record.

      '
    code_system: internal
    codelists:
    - GESTANTE
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "12. Gestante | tp_gestante | varchar2(1) | 1. 1º Trimestre;
      2. 2º Trimestre; 3. 3º Trimestre; 4. Idade gestacional ignorada; 5. Não; 6. Não se aplica;
      9. Ignorado | Idade gestacional da paciente | CS_GESTANT"

      '
    depends_on:
    - CS_SEXO
    - NU_IDADE_N
  CS_HOSPITA:
    official_name: Característica – Hospitalização
    translated_name: Hospitalization status
    description: 'Hospitalization-status flag, in this batch''s coqueluche, tétano acidental
      and tétano neonatal forms. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: inferred
    reasoning: 'CS_ prefix (característica) bound to the SIM_NAO codelist, consistent with
      other CS_-prefixed status flags in this system (CS_SUSPEIT, and the base dictionary''s
      CS_SEXO/CS_RACA/CS_ZONA family).

      '
  CS_INQUERI:
    official_name: Tipo de inquérito
    translated_name: Survey type
    description: 'Which kind of trachoma prevalence survey produced the record: a school examination
      of students (inquérito escolar) or a house-to-house survey of a locality (inquérito
      domiciliar).

      '
    code_system: internal
    source: web
    source_ref: dive.sc.gov.br, Ficha 1 - Inquérito/Busca Ativa (Boletim de Inquérito Tracoma)
  CS_LOCAL:
    official_name: 'Local Provável da Fonte de Infecção

      '
    translated_name: 'Probable location of the source of infection

      '
    description: 'Where the infection was probably acquired, on the accidental-tetanus form:
      1 Domicílio, 2 Trabalho, 3 Via pública, 4 Escola, 5 Campo, 6 Unidade de saúde, 7 Outro
      local, 9 Ignorado. Cleared automatically when a case is discarded.'
    code_system: internal
    codelists:
    - OCORRENCIA
    source: layout_doc
    source_ref: '[TETA] http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf
      — "46. Local provável da fonte de infecção | tp_local_infeccao | varchar2(1) | 1- Domicílio
      2- Trabalho 3- Via pública 4- Escola 5- Campo 6- Unidade de saúde 7- Outro local 9-
      Ignorado | Campo Essencial se o campo Classificação final = 1 | CS_LOCAL"

      '
    notes: Scoped to the TETA series only. On SDTA (surto de doença transmitida por alimentos)
      files the catalog's own header facts show CS_LOCAL declared at width 2 and width 8,
      not 1 — a different, unverified field reusing this name. Do not apply this description
      to SDTA rows. Scoped to TETA. The same name is declared on the foodborne-outbreak form
      (SDTA) at a different width — 2 or 8 characters against 1 here — and is almost certainly
      a different, wider field. That has not been verified.
  CS_MEMBROS:
    official_name: Rigidez de Membros
    translated_name: Limb rigidity
    description: 'Whether the patient''s limbs showed muscular rigidity, one of the tetanus
      investigation form''s clinical-sign checkboxes: yes, no, or unknown.

      '
    code_system: internal
    source: layout_doc
    source_ref: portalsinan.saude.gov.br Tetano_Acidental_v5.pdf, campo 38 "Rigidez de Membros"
  CS_MENING:
    official_name: Classificação da meningite
    translated_name: Meningitis classification
    description: 'Single-character classification code on the SINAN Meningite form, distinguishing
