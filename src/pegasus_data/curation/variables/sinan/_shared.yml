      '
    code_system: none
    source: layout_doc
    source_ref: '[DIC-NOTIF-IND] "7. Data dos primeiros sintomas / Diagnóstico | dt_diagnostico_sintoma
      | date dd/mm/aaaa | Data dos primeiros sintomas do caso de agravo agudo. Data do diagnostico
