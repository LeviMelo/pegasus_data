# SINAN — columns carried by more than one dataset.
#
# The notification header and other cross-dataset fields. Described once
# against the system, because that is the scope on which they are the
# same column.
system: SINAN
asserted_by: pegasus_data
variables:
  ABDOMINAL:
    official_name: Dor Abdominal
    translated_name: Abdominal pain
    description: 'Whether the patient reported abdominal pain (1=Sim, 2=Não, 9=Ignorado),
      one item on the spotted fever (Febre Maculosa) sign/symptom checklist alongside fever,
      headache and myalgia; the same field name is reused on the pre-2007 dengue form.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Maculosa_v5.pdf, campo 33 (Sinais e Sintomas)
  ACIDO_PEPT:
    official_name: Doença ácido-péptica
    translated_name: Pre-existing peptic acid disease
    description: 'Whether the patient has a pre-existing peptic acid disease such as a gastric
      or duodenal ulcer, recorded as a comorbidity on the dengue/chikungunya form because
      it raises bleeding risk as dengue progresses.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 34 (Doenças pré-existentes)
  AFASTAMENT:
    official_name: Houve afastamento do Trabalho para tratamento
    translated_name: Work leave taken for treatment
    description: 'Flags whether the worker was given leave from work for treatment of the
      condition. 1=Sim, 2=Não, 9=Ignorado. Gates the following block: when 2, 9 or blank,
      the ficha skips straight to the "other workers affected" question (TRAB_DOE) — the leave-duration
      fields NU_AFAST/TP_AFAST and the outcome field EVOL_AFAST are only meaningful when this
      is 1.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 53 'Houve afastamento do Trabalho para tratamento', DBF=AFASTAMENT
  AFAST_RISC:
    official_name: Conduta geral – afastamento do agente do risco com mudança de função e/ou
      posto de trabalho
    translated_name: General response taken — hazard removed via role/station change
    description: 'One of the six "conduta geral" response flags described under AFAST_TRAB;
      this one specifically records whether the risk-generating exposure was removed by changing
      the worker''s function or workstation (as opposed to removing the worker from the workplace,
      which is AFAST_TRAB). 1=Sim, 2=Não.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 56 'Conduta geral – afastamento do agente do risco com mudança de função e/ou
      posto de trabalho', DBF=AFAST_RISC
  AFAST_TRAB:
    official_name: Conduta geral – afastamento do local de trabalho
    translated_name: General response taken — removal from the workplace
    description: 'One of six "what was done about it" flags recorded after a work-related-disease
      diagnosis (see also COLETIVA, CONDUTA, INDIVIDUAL, MUDA_TRAB, NENHUM, AFAST_RISC — each
      records a distinct possible response as its own yes/no column rather than one multi-select
      field). This one flags whether the worker was removed from the workplace itself. 1=Sim,
      2=Não.

      '
    code_system: internal
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 57 'Conduta geral – Afastamento do local de trabalho', DBF=AFAST_TRAB (Ministério
      da Saúde/SVS/GT-SINAN, revisado março/2012)
  AGENTE:
    official_name: Agente
    translated_name: Injuring instrument
    description: 'The sharp or piercing object that caused a health worker''s occupational
      exposure to biological material — hollow needle, solid needle, intracath, broken glass,
      blade/lancet, or other — not the pathogen involved.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Acidente_Trabalho_Biologico_v5.pdf, campo 49
  AGRAVO_DES:
    official_name: Agravos associados, se outros – especificar
    translated_name: Associated conditions — free-text detail when "other" was checked
    description: 'Free-text elaboration (up to 30 characters) for a pre-existing/associated
      condition not covered by the named comorbidity flags (ASMA, HANSENIASE, HIPERTEN, MENTAL
      and, outside this batch, TUBE/DIABETES). Only meaningful when OUT_AGRAVO=1 (Sim).

      '
    code_system: none
    source: layout_doc
    source_ref: http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20LER%20DORT/DIC_DADOS_DRT_LERDORT_v5.pdf
      — campo 46 'Agravos associados, se outros especificar', DBF=AGRAVO_DES, varchar2(30)
  ALRM_ABDOM:
    official_name: Dor abdominal (sinal de alarme)
    translated_name: Abdominal pain warning sign
    description: 'Whether the patient developed intense, continuous abdominal pain, one of
      the dengue warning signs that flags progression toward severe dengue and prompts closer
      monitoring or hospitalization.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_HEMAT:
    official_name: Aumento do hematócrito
    translated_name: Rising hematocrit
    description: 'Whether the patient''s hematocrit rose, a dengue warning sign of plasma
      leaking from blood vessels as the disease worsens; a rising hematocrit with falling
      platelets signals impending severe dengue.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_HEPAT:
    official_name: Hepatomegalia
    translated_name: Enlarged liver warning sign
    description: 'Whether the patient''s liver was found enlarged on physical exam, one of
      the dengue warning signs recorded when the case is being classified as dengue with warning
      signs or severe dengue.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_HIPOT:
    official_name: Hipotensão postural/lipotimia
    translated_name: Postural hypotension warning sign
    description: 'Whether the patient had postural hypotension or a fainting spell, a dengue
      warning sign reflecting early circulatory compromise from plasma leakage, before frank
      shock sets in.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_LETAR:
    official_name: Letargia ou irritabilidade
    translated_name: Lethargy or irritability warning sign
    description: 'Whether the patient showed lethargy or irritability, a dengue warning sign
      of reduced perfusion or early neurological involvement that prompts closer clinical
      monitoring.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_LIQ:
    official_name: Acúmulo de líquidos
    translated_name: Fluid accumulation warning sign
    description: 'Whether fluid accumulated clinically, such as ascites or a pleural/pericardial
      effusion, a dengue warning sign of vascular leakage that can progress to respiratory
      or circulatory compromise.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_PLAQ:
    official_name: Queda abrupta de plaquetas
    translated_name: Abrupt platelet drop warning sign
    description: 'Whether the patient''s platelets fell abruptly, a dengue warning sign reflecting
      the marrow suppression and consumption that typically precede bleeding complications.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_SANG:
    official_name: Sangramento de mucosa/outras hemorragias
    translated_name: Mucosal bleeding warning sign
    description: 'Whether the patient bled from a mucosal surface or had another hemorrhage,
      a dengue warning sign distinct from the more severe bleeding recorded separately under
      the dengue-grave fields.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ALRM_VOM:
    official_name: Vômitos persistentes
    translated_name: Persistent vomiting warning sign
    description: 'Whether the patient had persistent vomiting, a dengue warning sign that
      both signals disease progression and risks dehydration, worsening the plasma-leakage
      picture.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_ONLINE.pdf, campo 68 (Dengue com sinais de alarme)
  ANO_NASC:
    official_name: Ano de Nascimento
    translated_name: Birth year
    description: '4-digit birth year. A coarser sibling of NU_IDADE_N/DT_NASC used on some
      agravo forms — likely a fallback for when the exact birth date isn''t known but the
      year is.

      '
    code_system: none
    source: inferred
    reasoning: 'ANO_ is SINAN/DATASUS''s prefix for a plain calendar year, NASC is nascimento
      (birth); the declared width (4 characters, occasionally 8) and no codelist binding are
      consistent with a bare year rather than a coded category.

      '
    notes: 'Not documented in the two SINAN dictionaries checked for this batch (the generic
      Notificação Individual header uses DT_NASC, a full date, not this field) — treat the
      "year only" reading as a naming-convention inference, not a confirmed layout definition.

      '
  ANTDTTRANS:
    official_name: Antecedente – Data da transfusão
    translated_name: Prior history — date of blood transfusion
    description: 'Date of a prior blood transfusion, recorded as an epidemiological antecedent
      on this batch''s AIDS-adulto, AIDS-criança, HIV-adulto and HIV-criança investigation
      forms — paired with ANTMUNTRAN and ANTUFTRANS for where the transfusion occurred.

      '
    code_system: none
    source: inferred
    reasoning: 'D(8,0) date field; ANT_ (antecedente) + DT (data) + TRANS (transfusão) compressed
      to fit the 10-character DBF name limit, sharing the identical series and file count
      (72) with ANTMUNTRAN/ANTUFTRANS; blood-transfusion history is a standard epidemiological
      antecedent on AIDS/HIV investigation forms.

      '
  ANTMUNTRAN:
    official_name: Antecedente – Município da transfusão
    translated_name: Prior history — municipality of blood transfusion
    description: 'IBGE municipality of the prior blood transfusion described alongside ANTDTTRANS/ANTUFTRANS.

      '
    code_system: external
    source: inferred
    reasoning: 'C(6,0) bound to the MUNICBR-family codelists, same series/file-count group
      as ANTDTTRANS; ANT_+MUN(icípio)+TRAN(sfusão) compressed to 10 characters.

      '
  ANTRELSE_N:
    official_name: '33. Sexual

      '
    translated_name: 'Probable transmission: sexual, with partner-sex category

      '
    description: 'Probable sexual mode of HIV transmission, in five mutually exclusive categories
      that also record the partner''s sex relative to the patient: 1 com Homens, 2 com Mulheres,
      3 com homens e mulheres, 4 Não foi transmissão sexual, 9 Ignorado.'
    code_system: internal
    codelists:
    - ANTRELN
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "33. Sexual | tp_sexual | varchar(1) | 1 – Relações sexuais com Homens 2 – Relações
      sexuais com Mulheres 3 – Relações sexuais com homens e mulheres 4 – Não foi transmissão
      sexual 9 – Ignorado | Provável modo de transmissão do HIV: sexual | ANTRELSE_N"

      '
    notes: SINAN NET raises an alert when a female patient is marked category 2, since female-to-female
      transmission is unusual enough to warrant re-checking the notification.
  ANTTRANS_M:
    official_name: '34. Sanguínea — Transfusão Sanguínea

      '
    translated_name: 'Probable transmission: blood transfusion

      '
    description: 'Whether blood transfusion is a probable mode of HIV transmission for this
      adult case (1 Sim, 2 Não, 9 Ignorado). A "Sim" makes the transfusion event date, UF
      and municipality fields mandatory elsewhere on the form.

      '
    code_system: internal
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "34. Sanguínea Transfusão sanguínea | st_sanguinea_transfusao | varchar(1) | 1 – Sim
      2 – Não 9 – Ignorado | Provável modo de transmissão: transfusão sanguínea | Campo Obrigatório.
      Se campo = 1 o sistema deve exigir a obrigatoriedade do preenchimento do campo (Data
      do evento), (UF de transfusão), (Município onde foi realizada transfusão) | ANTTRANS_M"

      '
    notes: 'No codelist is bound to this column in the catalog despite the confirmed 1/2/9
      value set — catalog gap.

      '
  ANTUFTRANS:
    official_name: Antecedente – UF da transfusão
    translated_name: Prior history — state (UF) of blood transfusion
    description: 'State of the prior blood transfusion described alongside ANTDTTRANS/ANTMUNTRAN.

      '
    code_system: external
    source: inferred
    reasoning: 'C(2,0) bound to UF codelists, same series/file-count group as ANTDTTRANS;
      ANT_+UF+TRANS compressed to 10 characters.

      '
  ANT_ACIDEN:
    official_name: Acidente com material biológico com posterior soroconversão até 6 meses
    translated_name: Occupational biological-material accident with seroconversion
    description: 'Whether the patient''s probable route of HIV infection was a workplace accident
      involving biological material — a needlestick or similar exposure — followed by seroconversion
      within six months. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Aids_adulto_v5.pdf, campo 34
  ANT_ANEMIA:
    official_name: '41. RJ/Caracas — Anemia e/ou Linfopenia e/ou Trombocitopenia (2 pts)

      '
    translated_name: 'RJ/Caracas criterion: anaemia and/or lymphopenia and/or thrombocytopenia

      '
    description: 'RJ/Caracas score item: anaemia and/or lymphopenia and/or thrombocytopenia
      (1 Sim, 2 Não, 9 Ignorado), worth 2 points.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Anemia e/ou linfopenia e/ou trombocitopenia (2)
      | st_anemia | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Pontuação (2) | ANT_ANEMIA"

      '
  ANT_ASTERI:
    official_name: '41. RJ/Caracas — Astenia ≥1 Mês (2 pts)

      '
    translated_name: 'RJ/Caracas criterion: asthenia ≥1 month

      '
    description: 'RJ/Caracas score item: asthenia (weakness/fatigue) lasting one month or
      longer, tuberculosis excluded as the cause (1 Sim, 2 Não, 9 Ignorado), worth 2 points.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Astenia maior ou igual a 1 mês (2) | st_astenia_mes_1
      | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Pontuação (2) Excluída a tuberculose como
      causa | ANT_ASTERI"

      '
  ANT_CANCER:
    official_name: '42. Critério CDC Adaptado — Câncer Cervical Invasivo

      '
    translated_name: 'CDC criterion: invasive cervical cancer

      '
    description: 'CDC-adapted criterion item: invasive cervical cancer (1 Sim, 2 Não, 9 Ignorado).
      Auto-filled with 2 (Não) when the patient''s sex is recorded as male.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "42. Critério CDC adaptado Câncer cervical invasivo | st_cancer | varchar(1) | 1 –
      Sim 2 – Não 9 – Ignorado | Câncer cervical invasivo | Campo Obrigatório Crítica: se
      sexo=masculino, preencher automaticamente com o código 2 | ANT_CANCER"

      '
  ANT_CANDID:
    official_name: '41. RJ/Caracas — Candidose Oral ou Leucoplasia Pilosa (5 pts)

      '
    translated_name: 'RJ/Caracas criterion: oral candidiasis or hairy leukoplakia

      '
    description: 'RJ/Caracas score item: oral candidiasis or oral hairy leukoplakia (1 Sim,
      2 Não, 9 Ignorado), worth 5 points.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Candidose oral ou leucoplasia pilosa (5) | st_candidose_oral
      | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Pontuação (5) | ANT_CANDID"

      '
  ANT_CAQUEX:
    official_name: '41. RJ/Caracas — Caquexia ou Perda de Peso >10% (2 pts)

      '
    translated_name: 'RJ/Caracas criterion: cachexia or >10% weight loss

      '
    description: 'RJ/Caracas score item: cachexia or weight loss greater than 10% (1 Sim,
      2 Não, 9 Ignorado), worth 2 points.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "41. Critério Rio de Janeiro/Caracas Caquexia ou perda de peso maior que 10% (2) |
      st_caquexia | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Pontuação (2) | ANT_CAQUEX"

      '
  ANT_CAT_EX:
    official_name: 'Categoria de Exposição (Campo Interno)

      '
    translated_name: 'Computed HIV-exposure category (child form)

      '
    description: 'System-computed classification of how the child probably acquired HIV, the
      child-form analogue of the adult form''s ANT_REL_CA, assigned from the hierarchy of
      ANT_PERINA, ANT_REL_N, ANT_TRANS_, ANT_T_HEMO and the biological-accident item — not
      entered directly. Uses its own child-specific code list (e.g. 10 Homossexual, 40 Drogas,
      50 Hemofílico, 60 Transfusão, 62 Transfusão/Homosexual), different from the adult form''s
      ANT_REL_CA list.

      '
    code_system: internal
    codelists:
    - CATHIERN
    - CLASCATN
    source: layout_doc
    source_ref: '[AIDS-CR] https://portalsinan.saude.gov.br/images/documentos/Agravos/AidsCrianca/DIC_DADOS_Aids_crianca_v5.pdf
      — "Categoria de exposição | tp_categoria_exposicao | varchar(2) | 10 – Homossexual 11
      – Homo/Drogas ... 40 – Drogas 41 – Drogas/Hemofílico 42 – Drogas/Transfusão 50 – Hemofilico
      60 – Transfusão 61 – Transfusão/Drogas 62 – Transfusão/Homosexual | ANT_CAT_EX"

      '
    depends_on:
    - ANT_PERINA
    - ANT_REL_N
    - ANT_TRANS_
    - ANT_T_HEMO
    notes: 'The source PDF''s own "Descrição" column for this row is a copy-paste artifact
      from an unrelated field ("Data da digitação da ficha ... Essa data não deve ser alterada")
      — the field label, DBF name and code list for THIS row are unambiguous from the field
      number and neighbouring rows; only the Descrição cell is unreliable.

      '
  ANT_CHAGAS:
    official_name: '42. Critério CDC — Reativação de Doença de Chagas

      '
    translated_name: 'CDC criterion: Chagas disease reactivation

      '
    description: 'CDC-adapted criterion item: reactivation of Chagas disease presenting as
      meningoencephalitis and/or myocarditis (1 Sim, 2 Não, 9 Ignorado).

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "42. Critério CDC/ adaptado Reativação de doença de Chagas (meningoencefalite e/ou
      miocardite) | st_reativacao_chagas | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | ANT_CHAGAS"

      '
  ANT_CITO:
    official_name: '42. Critério CDC — Citomegalovirose (Exceto Fígado, Baço ou Linfonodos)

      '
    translated_name: 'CDC criterion: cytomegalovirus disease (excluding liver/spleen/nodes)

      '
    description: 'CDC-adapted criterion item: cytomegalovirus disease at a site other than
      liver, spleen or lymph nodes (1 Sim, 2 Não, 9 Ignorado).

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "42. Critério CDC/ adaptado Citomegalovirose (exceto fígado, baço ou linfonodos) |
      st_citomegalovirose | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | Citomegalovirose |
      ANT_CITO"

      '
  ANT_CONTAG:
    official_name: '42. Critério CDC — Contagem de Linfócitos T CD4+ <350 cel/mm3

      '
    translated_name: 'CDC criterion: CD4+ T-lymphocyte count below 350 cells/mm3

      '
    description: 'CDC-adapted criterion item: whether the patient''s CD4+ T-lymphocyte count
      was below 350 cells/mm3 (1 Sim, 2 Não, 9 Ignorado) — an immunologic (laboratory-derived)
      criterion rather than a clinical sign, unlike the other items on this checklist.

      '
    code_system: internal
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "42. Critério CDC/ adaptado Contagem de linfócitos T CD4+ menor que 350 cel/mm3 |
      st_contagem_lifocitos | varchar(1) | 1 – Sim 2 – Não 9 – Ignorado | ANT_CONTAG"

      '
    notes: 'No codelist is bound to this column in the catalog despite the confirmed 1/2/9
      value set — catalog gap.

      '
  ANT_CONTAT:
    official_name: Tratamento anti-rábico anterior
    translated_name: Prior antirabic treatment
    description: 'Whether the patient had already undergone rabies post-exposure treatment
      before this attendance: Sim/Não/Ignorado. In pre-2007 Hantavirose records the same field
      name carried a related question before the forms diverged.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Atendimento%20Anti-rabico/anti_rabico_v5_instr.pdf,
      campo 37

      '
  ANT_CRIPTO:
    official_name: '42. Critério CDC — Criptococose (Extra-Pulmonar)

      '
    translated_name: 'CDC criterion: extra-pulmonary cryptococcosis

      '
    description: 'CDC-adapted criterion item: cryptococcosis outside the lungs (1 Sim, 2 Não,
      9 Ignorado).

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: '[AIDS-AD] http://portalsinan.saude.gov.br/images/documentos/Agravos/AidsAdulto/DIC_DADOS_Aids_adulto_v5.pdf
      — "42. Critério CDC/ adaptado Criptococose | st_criptococose | varchar(1) | 1 – Sim
      2 – Não 9 – Ignorado | Criptococose (Extra-Pulmonar) | ANT_CRIPTO"

      '
  ANT_CRIP_1:
    official_name: '42. Critério CDC — Criptosporidiose Intestinal Crônica >1 Mês

      '
    translated_name: 'CDC criterion: chronic intestinal cryptosporidiosis >1 month

      '
    description: 'CDC-adapted criterion item: chronic intestinal cryptosporidiosis lasting
      more than one month (1 Sim, 2 Não, 9 Ignorado).

      '
    code_system: internal
    codelists:
