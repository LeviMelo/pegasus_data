# SINAN.PNEU —
#
# one notification of pneumoconiose trabalho
system: SINAN
asserted_by: pegasus_data

variables:
  BIOPSIA:
    official_name: 'Confirmação diagnóstica - Biópsia pulmonar'
    translated_name: 'Diagnosis confirmed by lung biopsy'
    description: 'Whether the pneumoconiosis diagnosis was confirmed by lung biopsy.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 54 (Confirmação diagnóstica – Biópsia pulmonar)'
  CANCER:
    official_name: 'Agravos associados - Câncer'
    translated_name: 'Associated condition: cancer'
    description: 'Whether cancer is present as a condition associated with the pneumoconiosis.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 46 (Agravos associados – Câncer)'
  CARVAO:
    official_name: 'Agentes de exposição - Poeiras de carvão mineral'
    translated_name: 'Exposure agent: mineral coal dust'
    description: 'Whether the worker was exposed to mineral coal dust, one of the exposure agents listed on the pneumoconiosis form.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 51 (Agentes de exposição – Poeiras de carvão mineral)'
  FLUXO_AERE:
    official_name: 'Agravos associados - Limitação crônica ao fluxo aéreo'
    translated_name: 'Associated condition: chronic airflow limitation'
    description: 'Whether chronic airflow limitation is present as a condition associated with the pneumoconiosis.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 46 (Agravos associados – Limitação crônica ao fluxo aéreo)'
  OUTRO_DOE:
    official_name: 'Agravos associados - Outros'
    translated_name: Other associated disease (flag)
    description: 'Whether a condition other than the listed ones is associated with the pneumoconiosis; if so it is named in OUT_DOE_DE.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 46 (Agravos associados – Outros)'
  OUT_DOE_DE:
    official_name: 'Agravos associados - se Outros, especificar'
    translated_name: Other associated disease - description
    description: 'Free-text name of the associated disease recorded when OUTRO_DOE
      flags a comorbidity outside the pneumoconiosis form''s standard checklist.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 46 (Agravos associados – se Outros, especificar)'
  OUT_EXAME:
    official_name: 'Confirmação diagnóstica - Outro'
    translated_name: 'Diagnosis confirmed by another exam'
    description: 'Whether the diagnosis was confirmed by an exam or test other than biopsy or high-resolution chest CT.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 54 (Confirmação diagnóstica – Outro)'
  POEIRAS:
    official_name: 'A exposição a poeiras e minerais ocorreu em um ou mais vínculos distintos da empresa'
    translated_name: 'Dust exposure in other employment bonds'
    description: 'Whether exposure to dusts and minerals also occurred in one or more employment bonds other than the current company; details go in VINC_ESP.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 49 (A exposição a poeiras e minerais ocorreu em um ou mais vínculos distintos da empresa)'
  POE_ABRASI:
    official_name: 'Agentes de exposição - Poeiras de abrasivos'
    translated_name: 'Exposure agent: abrasive dust'
    description: 'Whether the worker was exposed to abrasive dust, one of the exposure agents listed on the pneumoconiosis form.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 51 (Agentes de exposição – Poeiras de abrasivos)'
  POE_MISTA:
    official_name: 'Agentes de exposição - Poeira mista (silicato, talco)'
    translated_name: 'Exposure agent: mixed dust (silicate, talc)'
    description: 'Whether the worker was exposed to mixed dust such as silicates or talc, one of the exposure agents listed on the form.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 51 (Agentes de exposição – Poeira mista (silicato, talco))'
  POE_ORGANI:
    official_name: 'Agentes de exposição - Poeiras orgânicas'
    translated_name: 'Exposure agent: organic dust'
    description: 'Whether the worker was exposed to organic dust, one of the exposure agents listed on the form.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 51 (Agentes de exposição – Poeiras orgânicas)'
  STAVALIA:
    official_name: 'Avaliação funcional (prova de função pulmonar)'
    translated_name: 'Functional evaluation (pulmonary function test) done'
    description: 'Whether a functional evaluation by pulmonary function test was performed.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 57 (Avaliação funcional – prova de função pulmonar)'
  STRESULTA:
    official_name: 'Resultado da avaliação funcional'
    translated_name: 'Functional evaluation result'
    description: 'Result of the pulmonary function test, normal or altered; filled when STAVALIA is 1 (yes).'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 58 (Resultado da avaliação funcional)'
  TIREOIDITE:
    official_name: 'Agravos associados - Tireoidite'
    translated_name: Associated disease - thyroiditis
    description: 'Whether the pneumoconiosis (PNEU) patient has thyroiditis, one of
      the form''s named associated-disease checkboxes, distinct from the free-text
      "other disease" captured by OUTRO_DOE/OUT_DOE_DE.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 46 (Agravos associados – Tireoidite)'
  TOMOGRAFIA:
    official_name: 'Confirmação diagnóstica - Tomografia de tórax de alta resolução'
    translated_name: 'Diagnosis confirmed by high-resolution chest CT'
    description: 'Whether the pneumoconiosis diagnosis was confirmed by high-resolution chest CT.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 54 (Confirmação diagnóstica – Tomografia de tórax de alta resolução)'
  VINC_ESP:
    official_name: 'Especificar (vínculos distintos com exposição a poeiras)'
    translated_name: 'Other employment bonds with dust exposure - specify'
    description: 'Free-text detail of the other employment bonds in which dust or mineral exposure occurred; enabled when POEIRAS is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – DRT Pneumoconioses — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtpneumo/DIC_DADOS_DRT_Pneumoconioses_v5.pdf, campo 50 (Especificar)'
