      '
    code_system: none
    source: inferred
    reasoning: 'Agravo is ESPO (esporotricose, typically cat-transmitted); short numeric
      (N1) code fits a categorical contact-type field; exact label inferred from the
      abbreviation and disease context rather than confirmed documentation.

      '
  DS_OUT_AMB:
    official_name: Outro ambiente de exposição
    translated_name: Other exposure setting, description
    description: 'Free-text description of a setting, other than the patient''s own
