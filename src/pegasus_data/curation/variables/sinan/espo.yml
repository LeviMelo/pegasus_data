# SINAN.ESPO — Sporotrichosis
# Esporotricose
#
# One notified case of sporotrichosis, the fungal infection transmitted
# largely by cats, notifiable in some states before it was nationally.
system: SINAN
asserted_by: pegasus_data

variables:
  C_D:
    official_name: Coordenada geográfica - graus
    translated_name: Geographic coordinate - degrees
    description: 'Degrees component of one geographic coordinate used to locate the
      likely animal-contact/exposure site for the sporotrichosis case (paired with
      a minutes component, C_M, not owned here).

      '
    code_system: none
    source: inferred
    reasoning: 'ESPO''s field set includes C_D/C_M and G_D/G_M alongside TP_ZN_OCO and TP_AMB_OCO
      (zone/environment of occurrence), consistent with a degrees/minutes geocoordinate pair
      for the exposure site. Reviewed 2026-09-28: no documentation found (searched portalsinan.saude.gov.br,
      the SINAN NET Epizootia dictionary DIC_DADOS_EPIZOO_NET_v5.pdf, TAB_SINANNET .DEF files,
      state sporotrichosis notes from RJ/SP/SC). The C_D/C_M/G_D/G_M quartet parallels the
      epizootia form''s sick/dead animal counts (NU_ANIDO/NU_ANIMO), so cães doentes / cães
      mortos / gatos doentes / gatos mortos is a more likely reading than coordinates or contact
      type.'
  C_M:
    official_name: Contato com mordedura
    translated_name: Contact by bite
    description: 'Sporotrichosis-form field recording whether the patient''s exposure
      to an infected cat was through a bite, part of the form''s contact-type breakdown
      for this cat-transmitted fungal disease.

      '
    code_system: none
    source: inferred
    reasoning: 'Agravo is ESPO (esporotricose, typically cat-transmitted); short numeric (N1)
      code fits a categorical contact-type field; exact label inferred from the abbreviation
      and disease context rather than confirmed documentation. Reviewed 2026-09-28: no documentation
      found (searched portalsinan.saude.gov.br, the SINAN NET Epizootia dictionary DIC_DADOS_EPIZOO_NET_v5.pdf,
      TAB_SINANNET .DEF files, state sporotrichosis notes from RJ/SP/SC). The C_D/C_M/G_D/G_M
      quartet parallels the epizootia form''s sick/dead animal counts (NU_ANIDO/NU_ANIMO),
      so C_M more likely reads cães mortos (dead dogs).'
  DS_OUT_AMB:
    official_name: Se outro ambiente, especificar
    translated_name: Other setting of occurrence (specify)
    description: 'Free-text setting where the occurrence took place, filled when TP_AMB_OCO
      is 5 (other).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Epizootia — http://portalsinan.saude.gov.br/images/documentos/Agravos/Epizootia/DIC_DADOS_EPIZOO_NET_v5.pdf
      (same DBF name; the ESPO form reuses the epizootia occurrence block, cf. TP_AMB_OCO →
      AMB_EPIZ.CNV), campo 23 (Se outro ambiente, especificar)
  DT_INI_EPI:
    official_name: Data do início da epizootia
    translated_name: Start date of the epizootic
    description: 'Date the animal outbreak (epizootic) began; it may not be later than the
      notification date.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Epizootia — http://portalsinan.saude.gov.br/images/documentos/Agravos/Epizootia/DIC_DADOS_EPIZOO_NET_v5.pdf
      (same DBF name; the ESPO form reuses the epizootia occurrence block, cf. TP_AMB_OCO →
      AMB_EPIZ.CNV), campo 7 (Data do início da epizootia)
  ESPECIE:
    official_name: Espécie do animal envolvido
    translated_name: Animal species involved
    description: 'Species of the animal involved in transmitting sporotrichosis to
      the patient - almost always a cat (the main reservoir/vector in Brazil''s sporotrichosis
      epidemic), but the field allows other species.

      '
    code_system: none
    source: inferred
    reasoning: 'ESPECIE = espécie; sporotrichosis is predominantly a zoonosis transmitted by
      cat scratches/bites. Reviewed 2026-09-28: no documentation found (searched portalsinan.saude.gov.br,
      the SINAN NET Epizootia dictionary DIC_DADOS_EPIZOO_NET_v5.pdf, TAB_SINANNET .DEF files,
      state sporotrichosis notes from RJ/SP/SC).'
  G_D:
    official_name: Gatos doentes no domicílio
    translated_name: Sick cats in the household
    description: 'Sporotrichosis-form field recording how many cats in the patient''s
      household were visibly ill, since household cats are the main source of human
      infection.

      '
    code_system: none
    source: inferred
    reasoning: 'ESPO form; N2 numeric width suggests a small count rather than a yes/no flag,
      consistent with "quantity of sick cats"; exact label not confirmed by documentation.
      Reviewed 2026-09-28: no documentation found (searched portalsinan.saude.gov.br, the SINAN
      NET Epizootia dictionary DIC_DADOS_EPIZOO_NET_v5.pdf, TAB_SINANNET .DEF files, state
      sporotrichosis notes from RJ/SP/SC). Likely gatos doentes (sick cats), paired with G_M
      gatos mortos.'
  G_M:
    official_name: Gatos (contagem/faixa)
    translated_name: Cats involved in suspected transmission
    description: 'Numeric count or category of cats implicated in the suspected sporotrichosis
      exposure — sporotrichosis in Brazil is overwhelmingly transmitted through scratches/bites
      from infected cats.

      '
    code_system: none
    source: inferred
    reasoning: 'N2 numeric field in the ESPO stratum; G read as gato (cat), though the exact
      unit (count vs. coded range) isn''t confirmed by the evidence available. Reviewed 2026-09-28:
      no documentation found (searched portalsinan.saude.gov.br, the SINAN NET Epizootia dictionary
      DIC_DADOS_EPIZOO_NET_v5.pdf, TAB_SINANNET .DEF files, state sporotrichosis notes from
      RJ/SP/SC). Likely gatos mortos (dead cats), by parallel with the epizootia form''s sick/dead
      counts.'
  ID_NOTIFIC:
    official_name: Identificador da notificação
    translated_name: Notification record identifier
    description: 'Sequential numeric identifier for a sporotrichosis (ESPO) notification
      record, distinguishing individual case entries within the dataset.

      '
    code_system: none
    source: inferred
    reasoning: 'ID_ = identificador, NOTIFIC = notificação; N5 numeric width fits a sequential
      record number rather than a coded value. Reviewed 2026-09-28: no documentation found
      (searched portalsinan.saude.gov.br, the SINAN NET Epizootia dictionary DIC_DADOS_EPIZOO_NET_v5.pdf,
      TAB_SINANNET .DEF files, state sporotrichosis notes from RJ/SP/SC).'
  TP_AMB_OCO:
    official_name: Ambiente de ocorrência
    translated_name: Setting of occurrence
    description: 'Where the case arose — home, park or zoo, wild area, ecological reserve,
      or other. On the sporotrichosis form, where the domestic setting dominates because
      cats transmit it.

      '
    code_system: internal
    source: def
    source_ref: AMB_EPIZ.CNV
    reasoning: 'Bound to AMB_EPIZ, whose values are domicílio, parque/praça/zoo, área
      silvestre and reserva ecológica.

      '
  TP_ZN_OCO:
    official_name: Zona
    translated_name: Occurrence zone type
    description: 'Zone where the occurrence took place: urban, rural or peri-urban.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Epizootia — http://portalsinan.saude.gov.br/images/documentos/Agravos/Epizootia/DIC_DADOS_EPIZOO_NET_v5.pdf
      (same DBF name; the ESPO form reuses the epizootia occurrence block, cf. TP_AMB_OCO →
      AMB_EPIZ.CNV), campo 22 (Zona)
