# SINAN.ESPO — Sporotrichosis epizootics
# Esporotricose (Epizootia)
#
# One notified animal epizootic of sporotrichosis (cats, dogs), from the Sinan Net
# epizootics base; not a human case (Dicionario_de_dados_Epizootias_Esporotricose.pdf).
system: SINAN
asserted_by: pegasus_data

variables:
  C_D:
    official_name: Número de cães doentes
    translated_name: Dogs sick
    description: 'Number of sick dogs, if the notification reports it. Corrects the earlier inferred reading (a coordinate).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados, Agravo: Esporotricose (Epizootia), Base de Dados Epizootias do Sinan Net (CGZV/DEDT/SVSA/MS) — ftp.datasus.gov.br/dissemin/publicos/SINAN/DOCS/Docs_TAB_SINAN.zip!Documentação/AGRAVOS/Dicionario_de_dados_Epizootias_Esporotricose.pdf'
  C_M:
    official_name: Número de cães mortos
    translated_name: Dogs dead
    description: 'Number of dead dogs, if the notification reports it. Corrects the earlier inferred reading (contact by bite).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados, Agravo: Esporotricose (Epizootia), Base de Dados Epizootias do Sinan Net (CGZV/DEDT/SVSA/MS) — ftp.datasus.gov.br/dissemin/publicos/SINAN/DOCS/Docs_TAB_SINAN.zip!Documentação/AGRAVOS/Dicionario_de_dados_Epizootias_Esporotricose.pdf'
  DS_OUT_AMB:
    official_name: Se outro ambiente, especificar
    translated_name: Other setting of occurrence (specify)
    description: 'Free-text setting where the occurrence took place, filled when TP_AMB_OCO
      is 5 (other).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Epizootia — http://portalsinan.saude.gov.br/images/documentos/Agravos/Epizootia/DIC_DADOS_EPIZOO_NET_v5.pdf
      (same DBF name; the ESPO form reuses the epizootia occurrence block, cf. TP_AMB_OCO →
      AMB_EPIZ.CNV), campo 23 (Se outro ambiente, especificar)
  DT_INI_EPI:
    official_name: Data do início da epizootia
    translated_name: Start date of the epizootic
    description: 'Date the animal outbreak (epizootic) began; it may not be later than the
      notification date.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Epizootia — http://portalsinan.saude.gov.br/images/documentos/Agravos/Epizootia/DIC_DADOS_EPIZOO_NET_v5.pdf
      (same DBF name; the ESPO form reuses the epizootia occurrence block, cf. TP_AMB_OCO →
      AMB_EPIZ.CNV), campo 7 (Data do início da epizootia)
  ESPECIE:
    official_name: Espécie reportada na notificação
    translated_name: Species reported
    description: 'The animal species the epizootic notification reports: 1 cat, 2 dog, 3 cat and dog.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados, Agravo: Esporotricose (Epizootia), Base de Dados Epizootias do Sinan Net (CGZV/DEDT/SVSA/MS) — ftp.datasus.gov.br/dissemin/publicos/SINAN/DOCS/Docs_TAB_SINAN.zip!Documentação/AGRAVOS/Dicionario_de_dados_Epizootias_Esporotricose.pdf'
  G_D:
    official_name: Número de gatos doentes
    translated_name: Cats sick
    description: 'Number of sick cats, if the notification reports it.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados, Agravo: Esporotricose (Epizootia), Base de Dados Epizootias do Sinan Net (CGZV/DEDT/SVSA/MS) — ftp.datasus.gov.br/dissemin/publicos/SINAN/DOCS/Docs_TAB_SINAN.zip!Documentação/AGRAVOS/Dicionario_de_dados_Epizootias_Esporotricose.pdf'
  G_M:
    official_name: Número de gatos mortos
    translated_name: Cats dead
    description: 'Number of dead cats, if the notification reports it.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados, Agravo: Esporotricose (Epizootia), Base de Dados Epizootias do Sinan Net (CGZV/DEDT/SVSA/MS) — ftp.datasus.gov.br/dissemin/publicos/SINAN/DOCS/Docs_TAB_SINAN.zip!Documentação/AGRAVOS/Dicionario_de_dados_Epizootias_Esporotricose.pdf'
  ID_NOTIFIC:
    official_name: Identificador da notificação
    translated_name: Notification record identifier
    description: 'Sequential numeric identifier for a sporotrichosis (ESPO) notification
      record, distinguishing individual case entries within the dataset.

      '
    code_system: none
    source: inferred
    reasoning: 'ID_ = identificador, NOTIFIC = notificação; N5 numeric width fits a sequential
      record number rather than a coded value. Reviewed 2026-09-28: no documentation found
      (searched portalsinan.saude.gov.br, the SINAN NET Epizootia dictionary DIC_DADOS_EPIZOO_NET_v5.pdf,
      TAB_SINANNET .DEF files, state sporotrichosis notes from RJ/SP/SC).'
  TP_AMB_OCO:
    official_name: Ambiente de ocorrência
    translated_name: Setting of occurrence
    description: 'Where the case arose — home, park or zoo, wild area, ecological reserve,
      or other. On the sporotrichosis form, where the domestic setting dominates because
      cats transmit it.

      '
    code_system: internal
    source: def
    source_ref: AMB_EPIZ.CNV
    reasoning: 'Bound to AMB_EPIZ, whose values are domicílio, parque/praça/zoo, área
      silvestre and reserva ecológica.

      '
  TP_ZN_OCO:
    official_name: Zona
    translated_name: Occurrence zone type
    description: 'Zone where the occurrence took place: urban, rural or peri-urban.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Epizootia — http://portalsinan.saude.gov.br/images/documentos/Agravos/Epizootia/DIC_DADOS_EPIZOO_NET_v5.pdf
      (same DBF name; the ESPO form reuses the epizootia occurrence block, cf. TP_AMB_OCO →
      AMB_EPIZ.CNV), campo 22 (Zona)
