      '
    code_system: none
    source: inferred
    reasoning: 'ESPO''s field set includes C_D/C_M and G_D/G_M alongside TP_ZN_OCO
      and TP_AMB_OCO (zone/environment of occurrence), consistent with a degrees/minutes
      geocoordinate pair for the exposure site.

      '
  C_M:
    official_name: Contato com mordedura
    translated_name: Contact by bite
    description: 'Sporotrichosis-form field recording whether the patient''s exposure
      to an infected cat was through a bite, part of the form''s contact-type breakdown
