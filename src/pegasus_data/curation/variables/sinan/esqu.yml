# SINAN.ESQU —
#
# one notification of schistosomiasis
system: SINAN
asserted_by: pegasus_data

variables:
  AN_QUALI:
    official_name: Análise qualitativa (Hoffman)
    translated_name: Qualitative analysis (Hoffman)
    description: 'Result of the qualitative Hoffman sedimentation stool exam for schistosome
      eggs: positive, negative, or not done.'
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 35 (Análise qualitativa – Hoffman)
  AN_QUANT:
    official_name: Análise quantitativa (Kato-Katz)
    translated_name: Quantitative analysis (Kato-Katz)
    description: Number of Schistosoma mansoni eggs found in the Kato-Katz stool exam.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 34 (Análise quantitativa – Kato-Katz)
  DS_FORMA:
    official_name: Forma clínica - Outra (especificar)
    translated_name: Other clinical form (specify)
    description: Free text naming the anatomo-clinical form of schistosomiasis when it
      is "outra" (not intestinal, hepato-intestinal, hepatosplenic or acute).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 43 (Especificar forma clínica, se outro especificar)
  DTTRAT:
    official_name: Data do tratamento
    translated_name: Treatment date
    description: Date the schistosomiasis treatment was given, filled when TRATAM = praziquantel
      or oxamniquine. AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 39 (Data do tratamento)
  DT_COPRO:
    official_name: Data da coproscopia
    translated_name: Date of stool examination
    description: 'When the stool was examined for schistosome eggs, on the schistosomiasis
      form.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 33 (Data da coproscopia)
  DT_RESU3:
    official_name: Data do resultado da 3ª amostra
    translated_name: Date of result of cure-verification sample 3
    description: Date of the result of the third cure-verification stool sample (STCURA3).
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 42 (Data do resultado da 3ª amostra)
  NOCOLINF:
    official_name: Nome da coleção hídrica
    translated_name: Name of infection water body
    description: 'Free-text name of the water body (stream, dam, irrigation canal)
      where the schistosomiasis (ESQU) patient likely had contact with contaminated
      water, used to target follow-up snail-control work at that site.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 51 (Nome da coleção hídrica)
  NOPROPIN:
    official_name: Nome da propriedade (se área rural)
    translated_name: Name of property/infection site
    description: 'Free-text name of the property or locality associated with the water
      contact that likely infected the schistosomiasis patient, complementing NOCOLINF''s
      record of the water body itself.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 50 (Nome da propriedade (se área rural))
  OUTRO_EX:
    official_name: Outros exames, especificar
    translated_name: Other exam (specify)
    description: Free-text name of another diagnostic exam performed (see the OUTROS result
      field).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 37 (Outros exames, especificar)
  STCURA1:
    official_name: Resultado da análise de verificação de cura - 1ª amostra
    translated_name: Cure-verification stool exam - sample 1
    description: 'Result of cure-verification stool sample 1 after treatment: zero eggs,
      one or more eggs, or not done.'
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 41 (Resultado da análise de verificação de cura – 1ª amostra)
  STCURA2:
    official_name: Resultado da análise de verificação de cura - 2ª amostra
    translated_name: Cure-verification stool exam - sample 2
    description: 'Result of cure-verification stool sample 2 after treatment: zero eggs,
      one or more eggs, or not done.'
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 41 (Resultado da análise de verificação de cura – 2ª amostra)
  STCURA3:
    official_name: Resultado da análise de verificação de cura - 3ª amostra
    translated_name: Cure-verification stool exam - sample 3
    description: 'Result of cure-verification stool sample 3 after treatment: zero eggs,
      one or more eggs, or not done.'
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 41 (Resultado da análise de verificação de cura – 3ª amostra)
  TRATAM:
    official_name: Fez tratamento?
    translated_name: Treatment given
    description: 'Whether the patient was treated and with which drug: praziquantel, oxamniquine,
      not treated, or unknown.'
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 38 (Fez tratamento?)
  TRATANAO:
    official_name: Caso não tenha feito tratamento, qual o motivo?
    translated_name: Reason treatment was not given
    description: 'Reason the patient was not treated: contraindication, refusal, absence,
      or unknown.'
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Esquistossomose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Esquistossomose/DIC_DADOS_Esquistossomose_v5.pdf,
      campo 40 (Caso não tenha feito tratamento, qual o motivo?)
