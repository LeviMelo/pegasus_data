# SINAN.LEIV —
#
# one notification of visceral leishmaniasis
system: SINAN
asserted_by: pegasus_data

variables:
  AMPOLAS:
    official_name: Nº total de ampolas prescritas
    translated_name: Total ampoules prescribed
    description: Total number of drug ampoules prescribed for the initial visceral leishmaniasis
      treatment.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 42 (Nº total de ampolas prescritas)
  BACO:
    official_name: Aumento do Baço
    translated_name: Enlarged spleen
    description: 'Whether the patient''s spleen was found enlarged on exam, one of
      the sign/symptom checkboxes on the visceral leishmaniasis (kala-azar) investigation
      form alongside fever, weakness and pallor.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas)
  CASO:
    official_name: Tipo de caso
    translated_name: Case type
    description: 'Classifies the visceral leishmaniasis case as new or a relapse (recidiva)
      - relapse after treatment is a recognized issue for this disease, distinct from
      CLASSI_FIN (confirmed/discarded) and EVOLUCAO (outcome).

      '
    code_system: none
    source: inferred
    reasoning: 'CASO sits alongside CLASSI_FIN/CRITERIO/EVOLUCAO in the LEIV series; relapse
      tracking is a known feature of VL surveillance. Reviewed 2026-09-28: no documentation
      found (searched the SINAN NET LV v5 data dictionary, LeishvisNET.def in TAB_SINANNET,
      and the web for a SINAN Windows 2000-2006 layout; the column occurs only in the
      2000-2006 files).'
  CON_INF_BA:
    official_name: Bairro provável de infecção
    translated_name: Probable-infection neighborhood
    description: 'Reference to the neighborhood (bairro) associated with the probable
      infection location for visceral leishmaniasis, part of the local location-tracing
      fields alongside CO_UF_3 and DS_MUN_2.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_ = condição/local, INF = infecção, BA = bairro; sits with the LEIV
      series'' other location fields tracking where infection likely occurred. Reviewed
      2026-09-28: no documentation found (searched the SINAN NET LV v5 data dictionary,
      LeishvisNET.def in TAB_SINANNET, and the web for a SINAN Windows 2000-2006 layout;
      the column occurs only in the 2000-2006 files).'
  CON_INF_DI:
    official_name: Distrito provável de infecção
    translated_name: District of probable infection
    description: 'District-level component of the address investigators identified
      as the likely infection site, sibling to CON_INF_BA (neighborhood) and CON_INF_MU
      (municipality) in the same address breakdown.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_INF_ = (local provável de) infecção; DI = distrito; LEIV carries the
      matching _BA/_MU/_UF/_PA siblings. Reviewed 2026-09-28: no documentation found (searched
      the SINAN NET LV v5 data dictionary, LeishvisNET.def in TAB_SINANNET, and the web
      for a SINAN Windows 2000-2006 layout; the column occurs only in the 2000-2006 files).'
  CO_PAIS_1:
    official_name: País de infecção 1
    translated_name: Country of infection 1
    description: 'A country where infection may have been acquired. Three slots exist
      because the incubation runs to months and travel history matters over that whole
      window.

      '
    code_system: internal
    source: def
    source_ref: PAISNET.CNV
    reasoning: N(3) country code bound to PAISNET; the first of three slots.
  CO_PAIS_2:
    official_name: País de infecção 2
    translated_name: Country of infection 2
    description: A second possible country of infection. See CO_PAIS_1.
    code_system: internal
    source: def
    source_ref: PAISNET.CNV
    reasoning: N(3) country code bound to PAISNET; the second slot.
  CO_PAIS_3:
    official_name: País de infecção 3
    translated_name: Country of infection 3
    description: A third possible country of infection. See CO_PAIS_1.
    code_system: internal
    source: def
    source_ref: PAISNET.CNV
    reasoning: N(3) country code bound to PAISNET; the third slot.
  CO_UF_1:
    official_name: Deslocamento - UF 1
    translated_name: Travel - state 1
    description: State (UF) of place 1 the patient visited in the six months before symptom
      onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), UF 1
  CO_UF_2:
    official_name: Deslocamento - UF 2
    translated_name: Travel - state 2
    description: State (UF) of place 2 the patient visited in the six months before symptom
      onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), UF 2
  CO_UF_3:
    official_name: Deslocamento - UF 3
    translated_name: Travel - state 3
    description: State (UF) of place 3 the patient visited in the six months before symptom
      onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), UF 3
  DIAG_PARA:
    official_name: Diagnóstico parasitológico
    translated_name: Parasitological diagnosis result
    description: 'Result of the parasitological/direct exam for Leishmania (e.g. bone
      marrow aspirate microscopy) - a companion numeric/detail field DIAG_PAR_N extends
      this result.

      '
    code_system: none
    source: inferred
    reasoning: 'DIAG_PARA = diagnóstico parasitológico; LEIV''s direct-exam confirmation
      method. Reviewed 2026-09-28: no documentation found (searched the SINAN NET LV v5
      data dictionary, LeishvisNET.def in TAB_SINANNET, and the web for a SINAN Windows
      2000-2006 layout; the column occurs only in the 2000-2006 files).'
  DIAG_PAR_N:
    official_name: Diagnóstico parasitológico
    translated_name: Parasitological exam result
    description: 'Result of the direct parasitological exam (e.g. bone-marrow or splenic
      aspirate microscopy) used to confirm visceral leishmaniasis: coded 1=Positivo,
      2=Negativo, 3=Não realizado.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 35 (Diagnóstico parasitológico)
  DOSE:
    official_name: Dose prescrita em mg/kg/dia Sb+5
    translated_name: Prescribed dose (mg/kg/day Sb+5)
    description: Band of the prescribed pentavalent antimonial dose in mg Sb+5/kg/day
      (10-<15, 15-<20, >=20); filled when the initial drug is a pentavalent antimonial.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 41 (Dose prescrita em mg/kg/dia Sb+5)
  DS_MUN_1:
    official_name: Deslocamento - Local/Município 1
    translated_name: Travel - place/municipality 1
    description: Free-text place and municipality 1 the patient visited in the six months
      before symptom onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Local/Município 1
  DS_MUN_2:
    official_name: Deslocamento - Local/Município 2
    translated_name: Travel - place/municipality 2
    description: Free-text place and municipality 2 the patient visited in the six months
      before symptom onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Local/Município 2
  DS_MUN_3:
    official_name: Deslocamento - Local/Município 3
    translated_name: Travel - place/municipality 3
    description: Free-text place and municipality 3 the patient visited in the six months
      before symptom onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Local/Município 3
  DS_TRANS_1:
    official_name: Deslocamento - Meio de transporte 1
    translated_name: Travel - means of transport 1
    description: Free-text means of transport used on trip 1. Not a transmission site
      despite the column name.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Meio de transporte 1
  DS_TRANS_2:
    official_name: Deslocamento - Meio de transporte 2
    translated_name: Travel - means of transport 2
    description: Free-text means of transport used on trip 2. Not a transmission site
      despite the column name.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Meio de transporte 2
  DT_DESLC1:
    official_name: Deslocamento - Data 1
    translated_name: Travel - date 1
    description: Date of trip 1 to a place visited in the six months before symptom onset.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Data 1
  DT_DESLC2:
    official_name: Deslocamento - Data 2
    translated_name: Travel - date 2
    description: Date of trip 2 to a place visited in the six months before symptom onset.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Data 2
  DT_DESLC3:
    official_name: Deslocamento - Data 3
    translated_name: Travel - date 3
    description: Date of trip 3 to a place visited in the six months before symptom onset.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      Informações complementares – Deslocamento (datas e locais frequentados nos seis
      meses anteriores ao início dos sinais e sintomas), Data 3
  EMAGRA:
    official_name: Sinais e Sintomas - Emagrecimento
    translated_name: Weight loss
    description: 'Whether the visceral leishmaniasis patient showed weight loss at
      diagnosis, one of the disease''s defining wasting signs alongside fever and weakness.
      1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas - Emagrecimento)
  ENDEMICO:
    official_name: Área endêmica
    translated_name: Case located in a recognized endemic area (flag)
    description: 'Whether the case''s residence or investigation area is classified
      as an established (autochthonous) visceral leishmaniasis transmission zone, as
      opposed to an imported or newly-affected area.

      '
    code_system: none
    source: inferred
    reasoning: 'C11; ENDEMICO=endêmico, a classification field on the LEIV epidemiological-investigation
      section. Reviewed 2026-09-28: no documentation found (searched the SINAN NET LV
      v5 data dictionary, LeishvisNET.def in TAB_SINANNET, and the web for a SINAN Windows
      2000-2006 layout; the column occurs only in the 2000-2006 files).'
  ENTRADA:
    official_name: Tipo de entrada
    translated_name: Case-entry type
    description: 'Coded classification of how the visceral leishmaniasis case entered
      surveillance — e.g. new case, relapse or transfer from another notifying unit.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 37 (Tipo de entrada)
  FALENCIA:
    official_name: Outra droga utilizada, na falência do tratamento inicial
    translated_name: Drug used after initial treatment failure
    description: 'Second-line drug given when the visceral leishmaniasis patient''s
      first-line antimonial treatment failed. 1=Anfotericina B, 2=Anfotericina B lipossomal,
      3=Outras, 4=Não se aplica (no failure occurred).

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 43
  FEN_HEMORR:
    official_name: Sinais e sintomas - Fenômenos hemorrágicos
    translated_name: Hemorrhagic phenomenon
    description: 'Whether the visceral leishmaniasis patient showed a hemorrhagic manifestation
      (e.g. bleeding gums, epistaxis), a marker of severe/complicated disease.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 33 (Sinais e sintomas – Fenômenos hemorrágicos)
  FIGADO:
    official_name: Sinais e Sintomas - Aumento do Fígado
    translated_name: Enlarged liver
    description: 'Whether the visceral leishmaniasis patient showed liver enlargement
      (hepatomegaly) at diagnosis, one of the disease''s classic organomegaly signs
      alongside splenomegaly. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas - Aumento do Fígado)
  FRAQUEZA:
    official_name: Sinais e Sintomas - Fraqueza
    translated_name: Weakness
    description: 'Whether the visceral leishmaniasis patient reported weakness (asthenia)
      at diagnosis, recorded alongside fever and weight loss as one of the disease''s
      core presenting symptoms. 1=Sim, 2=Não, 9=Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf, campo 33 (Sinais e Sintomas - Fraqueza)
  IFI:
    official_name: Diagnóstico Imunológico - IFI
    translated_name: Indirect immunofluorescence test result
    description: 'Result of the indirect immunofluorescence reaction against Leishmania
      run on a visceral leishmaniasis suspect; a positive result auto-fills the case
      as lab-confirmed, separately from the direct parasitological test.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_LV_v5.pdf (Leishmaniose Visceral), campo 36.
  INFECCIOSO:
    official_name: Sinais e sintomas - Quadro infeccioso
    translated_name: Associated infectious condition (flag)
    description: 'Whether the visceral leishmaniasis patient had a concurrent infectious
      condition complicating the clinical picture (e.g. a secondary bacterial infection),
      recorded as a single coded flag.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 33 (Sinais e sintomas – Quadro infeccioso)
  OUTROS_ESP:
    official_name: Sinais e sintomas - Outros (especificação)
    translated_name: Other signs and symptoms (specify)
    description: Free text naming other signs or symptoms the patient presents.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 33 (Sinais e sintomas – Outros, especificação)
  PALIDEZ:
    official_name: Sinais e sintomas - Palidez
    translated_name: Pallor (flag)
    description: 'Whether the visceral leishmaniasis patient showed pallor, the clinical
      sign of the anemia caused by bone-marrow suppression that is characteristic of
      this disease: 1=Sim, 2=Não.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leishmaniose Visceral v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leishmaniose%20Visceral/DIC_DADOS_LV_v5.pdf,
      campo 33 (Sinais e sintomas – Palidez)
