# SINAN.SDTA — Foodborne disease outbreak
# Surto de Doença Transmitida por Alimentos
#
# One outbreak, not one person — the unit here is the event, so these rows
# must never be added to individual-case counts.
system: SINAN
asserted_by: pegasus_data

variables:
