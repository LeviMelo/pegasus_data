    official_name: Agente etiológico (descrição)
    translated_name: Etiological agent (free text)
    description: 'Free-text name of the pathogen or toxin suspected or confirmed as
      the cause of a foodborne/waterborne disease outbreak (SDTA - Surto de Doença
      Transmitida por Água e Alimentos). The wide C41 field allows a full organism
      name.

      '
    code_system: none
    source: inferred
    reasoning: 'AGENTE_ET = agente etiológico, a core field on the SDTA outbreak investigation
      form; C41 width fits free text rather than a short code.

      '
  AGENTE_ET1:
    official_name: Agente etiológico 1
    translated_name: First identified/suspected etiologic agent
    description: 'Name of the first pathogen identified or suspected as the cause of
      the foodborne-disease outbreak (e.g. Salmonella, Staphylococcus aureus, Norovirus)
      — paired with AGENTE_ET2 when a second agent is also implicated.

      '
