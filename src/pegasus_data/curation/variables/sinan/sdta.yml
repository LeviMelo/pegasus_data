# SINAN.SDTA — Foodborne disease outbreak
# Surto de Doença Transmitida por Alimentos
#
# One outbreak, not one person — the unit here is the event, so these rows
# must never be added to individual-case counts.
system: SINAN
asserted_by: pegasus_data

variables:
  AGENTE_ET0:
    official_name: Agente etiológico (descrição)
    translated_name: Etiological agent (free text)
    description: 'Free-text name of the pathogen or toxin suspected or confirmed as
      the cause of a foodborne/waterborne disease outbreak (SDTA - Surto de Doença
      Transmitida por Água e Alimentos). The wide C41 field allows a full organism
      name.

      '
    code_system: none
    source: inferred
    reasoning: 'AGENTE_ET = agente etiológico, a core field on the SDTA outbreak investigation form; C41 width fits free text rather than a short code. Reviewed 2026-09-28: no documentation found (searched the SINAN NET Surto DTA v5 dictionary, which documents the etiological agent and causal food only as DS_ETIOLOG and DS_ALICAUS, plus local TabNet files and the web).'
  AGENTE_ET1:
    official_name: Agente etiológico 1
    translated_name: First identified/suspected etiologic agent
    description: 'Name of the first pathogen identified or suspected as the cause of
      the foodborne-disease outbreak (e.g. Salmonella, Staphylococcus aureus, Norovirus)
      — paired with AGENTE_ET2 when a second agent is also implicated.

      '
    code_system: none
    source: inferred
    reasoning: 'C40, wide enough for a pathogen name; AGENTE_ET=agente etiológico, trailing 1 implies a numbered series. Reviewed 2026-09-28: no documentation found (searched the SINAN NET Surto DTA v5 dictionary, which documents the etiological agent and causal food only as DS_ETIOLOG and DS_ALICAUS, plus local TabNet files and the web).'
  AGENTE_ET2:
    official_name: Agente etiológico 2
    translated_name: Second identified/suspected etiologic agent
    description: 'Name of a second pathogen implicated in the same outbreak, when more
      than one etiologic agent is identified — the companion field to AGENTE_ET1.

      '
    code_system: none
    source: inferred
    reasoning: 'C38, same pattern as AGENTE_ET1 with trailing 2. Reviewed 2026-09-28: no documentation found (searched the SINAN NET Surto DTA v5 dictionary, which documents the etiological agent and causal food only as DS_ETIOLOG and DS_ALICAUS, plus local TabNet files and the web).'
  AGENTE_ET3:
    official_name: Agente etiológico (código)
    translated_name: Etiological agent (coded)
    description: 'Shorter, coded alternative to AGENTE_ET0 for the suspected/confirmed
      outbreak pathogen, seen far less often (3 files vs 14) - likely a variant layout
      that used a code instead of free text.

      '
    code_system: none
    source: inferred
    reasoning: 'Same AGENTE_ET root as AGENTE_ET0 but C10 width and much lower file count suggest a distinct, less common schema variant of the same concept. Reviewed 2026-09-28: no documentation found (searched the SINAN NET Surto DTA v5 dictionary, which documents the etiological agent and causal food only as DS_ETIOLOG and DS_ALICAUS, plus local TabNet files and the web).'
  AGENTE_ETI:
    official_name: Agente etiológico
    translated_name: Etiologic agent
    description: 'Causative agent identified for a foodborne/waterborne disease outbreak
      (e.g. Salmonella, Staphylococcus, norovirus) - the summary field alongside numbered
      variants (AGENTE_ET0-3) for outbreaks with more than one suspected agent.

      '
    code_system: none
    source: inferred
    reasoning: 'AGENTE_ETI = agente etiológico; SDTA is an outbreak (surto), aggregate-level series. Reviewed 2026-09-28: no documentation found (searched the SINAN NET Surto DTA v5 dictionary, which documents the etiological agent and causal food only as DS_ETIOLOG and DS_ALICAUS, plus local TabNet files and the web).'
  ALIMENTO_C:
    official_name: Alimento consumido
    translated_name: Food item consumed
    description: 'Free-text name of the specific food item suspected of causing a foodborne-disease
      outbreak (surto de DTA), as reported by exposed people during the outbreak investigation.

      '
    code_system: none
    source: inferred
    reasoning: 'Agravo is SDTA (surto de doença transmitida por alimentos); ALIMENTO reads "alimento" (food); wide C49 free-text width fits a food description rather than a coded field. Reviewed 2026-09-28: no documentation found (searched the SINAN NET Surto DTA v5 dictionary, which documents the etiological agent and causal food only as DS_ETIOLOG and DS_ALICAUS, plus local TabNet files and the web).'
  CS_TRANS:
    official_name: Modo de transmissão
    translated_name: Transmission mode
    description: 'Whether transmission was direct, person to person, or indirect through
      a vehicle. Indirect is the ordinary foodborne case and TP_INDIRET then names
      the vehicle.

      '
    code_system: internal
    source: def
    source_ref: MODOTRANS.CNV
    reasoning: Bound to MODOTRANS, whose values are direta and indireta.
  DS_F_OUTRO:
    official_name: 'Fatores causais - Outros (especificar)'
    translated_name: Other contributing factor (free text)
    description: 'Free-text description of the other causal factor flagged in ST_F_OUTRO.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Surto de DTA (rev. fev/2012) — https://portalsinan.saude.gov.br/images/documentos/Agravos/DTA/DIC_DADOS_Surto_DTA_v5.pdf, campo 39 (Fatores causais – Outros, especificar)'
