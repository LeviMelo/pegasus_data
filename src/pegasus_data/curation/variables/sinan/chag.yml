      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Doença de Chagas Aguda — http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      (sources/dic_text/doenca-de-chagas-aguda__DIC_DADOS_Chagas_v5.txt), campo 49 (Resultado
      da sorologia para hemoaglutinação IgG S2)
  HEM_IGM_S1:
    official_name: Resultado da sorologia para hemoaglutinação IgM S1
    translated_name: Hemagglutination IgM serology - sample 1
    description: 'Indirect haemagglutination IgM result on serum sample 1: reactive, non-reactive,
      inconclusive, or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Doença de Chagas Aguda — http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      (sources/dic_text/doenca-de-chagas-aguda__DIC_DADOS_Chagas_v5.txt), campo 49 (Resultado
      da sorologia para hemoaglutinação IgM S1)
  HEM_IGM_S2:
    official_name: Resultado da sorologia para hemoaglutinação IgM S2
    translated_name: Hemagglutination IgM serology - sample 2
    description: 'Indirect haemagglutination IgM result on serum sample 2: reactive, non-reactive,
      inconclusive, or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Doença de Chagas Aguda — http://portalsinan.saude.gov.br/images/documentos/Agravos/Chagas/DIC_DADOS_Chagas_v5.pdf
      (sources/dic_text/doenca-de-chagas-aguda__DIC_DADOS_Chagas_v5.txt), campo 49 (Resultado
      da sorologia para hemoaglutinação IgM S2)
