# SINAN.TETA —
#
# one notification of tetano acidental
system: SINAN
asserted_by: pegasus_data

variables:
  CS_ABDOMIN:
    official_name: Rigidez abdominal
    translated_name: Abdominal rigidity
    description: Abdominal rigidity, the adult counterpart of the neonatal CS_ABDOMEN.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ABDOMIN reads abdominal; a clinical flag.
  CS_CRISES:
    official_name: Crises convulsivas
    translated_name: Spasms
    description: 'Generalised spasms. What distinguishes tetanus from simple muscle
      stiffness, and what makes airway management necessary.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CRISES reads crises; a clinical flag.
  CS_SIN_OUT:
    official_name: Outro sinal
    translated_name: Other sign, accidental tetanus
    description: 'A sign outside the accidental tetanus list of spasms and abdominal
      rigidity.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the clinical block.
  NM_SIN_OUT:
    official_name: 'Manifestações clínicas - Outros (especificar)'
    translated_name: Other signs/symptoms - specify
    description: 'Free-text name of any other clinical manifestation the patient presented; enabled only when the "other" manifestation flag (CS_SIN_OUT) is 1.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 38 (Manifestações clínicas – Outros)'
  NU_DOSE:
    official_name: Número de doses da vacina
    translated_name: Vaccine doses received
    description: 'Doses of tetanus vaccine received, banded from one through three
      plus two boosters, or never vaccinated.

      '
    code_system: internal
    source: def
    source_ref: DOSES.CNV
    reasoning: Bound to DOSES, the standard vaccine-dose banding.
  SG_UF_INTE:
    official_name: 'UF de hospitalização'
    translated_name: State of hospitalization (abbreviation)
    description: 'Two-letter abbreviation of the state where the accidental-tetanus
      (TETA) patient was hospitalized, which can differ from the state of residence
      or notification when the patient is treated elsewhere.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 42 (UF de hospitalização)'
  TP_ANALISE:
    official_name: 'Medidas de controle - Vacinação da população suscetível'
    translated_name: 'Control measure: vaccination of the susceptible population'
    description: 'Whether vaccination of the susceptible (unvaccinated or incompletely vaccinated) people around the case was carried out as a control measure.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 44 (Medidas de controle – Vacinação da população suscetível)'
  TP_CAUSA:
    official_name: Causa do ferimento
    translated_name: Cause of the wound
    description: 'What caused the wound — injection, laceration, burn, surgery, puncture,
      abrasion, septic abortion, or other. Puncture wounds are the classic cause, because
      the spores need low oxygen to germinate.

      '
    code_system: internal
    source: def
    source_ref: CAUSATET.CNV
    reasoning: 'Bound to CAUSATET, whose values run from injeção through abortamento
      séptico.

      '
  TP_CAUSOUT:
    official_name: 'Possível causa - Outros (descrição)'
    translated_name: Other injury cause (specify)
    description: 'Free-text description of the probable cause (portal of entry) of the infection when the coded possible-cause field TP_CAUSA is 8 (other).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 33 (Possível causa – Outros)'
  TP_IDENTFI:
    official_name: 'Medidas de controle - Identificar população suscetível'
    translated_name: 'Control measure: susceptible population identified'
    description: 'Whether people with an incomplete or absent tetanus vaccination schedule were identified around the case as a control measure.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 44 (Medidas de controle – Identificar população suscetível)'
  TP_LOCALLE:
    official_name: Local da lesão
    translated_name: Site of the wound
    description: 'Where the wound was — lower limbs, upper limbs, trunk, head and neck,
      or oral cavity. A wound closer to the head shortens the incubation and worsens
      the prognosis.

      '
    code_system: internal
    source: def
    source_ref: LOCALTET.CNV
    reasoning: 'Bound to LOCALTET, whose values enumerate the body sites from membros
      inferiores to cavidade oral.

      '
  TP_ORIGEM:
    official_name: 'Origem do caso'
    translated_name: 'Case origin'
    description: 'How the case came to the attention of surveillance: through notification, active case search, or a death certificate.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 39 (Origem do caso)'
  TP_PROFILA:
    official_name: Profilaxia realizada
    translated_name: Prophylaxis given
    description: 'What was given after the wound — antitetanus serum, immunoglobulin,
      vaccine, antibiotic, or nothing. Tetanus in a patient who received prophylaxis
      is a treatment failure worth investigating.

      '
    code_system: internal
    source: def
    source_ref: PROFILAC.CNV
    reasoning: 'Bound to PROFILAC, whose values are soro antitetânico, imunoglobulina,
      vacina, antibiótico and nenhum.

      '
  TP_VACINA:
    official_name: 'Medidas de controle - Análise de cobertura vacinal por faixa etária'
    translated_name: 'Control measure: vaccination coverage analysed by age group'
    description: 'Whether tetanus vaccination coverage, by age group, of the population of the case''s municipality of residence was analysed as a control measure.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Tétano Acidental — http://portalsinan.saude.gov.br/images/documentos/Agravos/tetanoacidental/DIC_DADOS_Tetano_Acidental_v5.pdf, campo 44 (Medidas de controle – Análise de cobertura vacinal por faixa etária)'
