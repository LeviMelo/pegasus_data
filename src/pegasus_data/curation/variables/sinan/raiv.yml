# SINAN.RAIV —
#
# one notification of raiva humana
system: SINAN
asserted_by: pegasus_data

variables:
  AEROFOBIA:
    official_name: 'Principais sinais/sintomas - Aerofobia'
    translated_name: Aerophobia
    description: 'Whether the patient presented aerophobia (fear of air currents), one of the main rabies signs listed on the form.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 48 (Principais sinais/sintomas – Aerofobia)'
  AGITACAO:
    official_name: 'Principais sinais/sintomas - Agitação psicomotora'
    translated_name: 'Psychomotor agitation'
    description: 'Whether the patient presented psychomotor agitation.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 48 (Principais sinais/sintomas – Agitação psicomotora)'
  AGRESSIVI:
    official_name: 'Principais sinais/sintomas - Agressividade'
    translated_name: Aggressiveness
    description: 'Whether the patient presented aggressiveness.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 48 (Principais sinais/sintomas – Agressividade)'
  ANTEC_POS:
    official_name: 'Tem antecedentes de tratamento anti-rábico? - Pós-exposição'
    translated_name: Prior post-exposure prophylaxis
    description: 'Whether the patient had previously received post-exposure anti-rabies treatment; paired with ANTEC_PRE.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 38 (Tem antecedentes de tratamento anti-rábico? – Pós-exposição)'
  ANTEC_PRE:
    official_name: 'Tem antecedentes de tratamento anti-rábico? - Pré-exposição'
    translated_name: Prior pre-exposure prophylaxis
    description: 'Whether the patient had previously received pre-exposure anti-rabies treatment; paired with ANTEC_POS.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 38 (Tem antecedentes de tratamento anti-rábico? – Pré-exposição)'
  ANTI_RAB:
    official_name: Vacina antirrábica indicada
    translated_name: Rabies vaccine given
    description: Whether rabies vaccine was given to the patient.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; ANTI_RAB reads antirrábica.
  ARRANHAO:
    official_name: Exposição por arranhão
    translated_name: Scratch
    description: 'Whether the exposure was a scratch. Lower risk than a bite but still
      an indication, since saliva on claws transmits the virus.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; ARRANHAO reads arranhão.
  CABECA:
    official_name: Exposição na cabeça ou pescoço
    translated_name: Head or neck exposure
    description: 'Exposure to the head or neck. The highest-risk site: the virus travels
      up nerves, so a short distance to the brain means a short incubation and less
      time for prophylaxis to work.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag opening the exposure-site block.
  DILACERANT:
    official_name: Ferimento dilacerante
    translated_name: Lacerating wound
    description: 'A lacerating wound. The most severe category, usually meaning both
      serum and vaccine.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; DILACERANT reads dilacerante.
  DISFAGIA:
    official_name: 'Principais sinais/sintomas - Disfagia'
    translated_name: Dysphagia
    description: 'Whether the patient presented dysphagia (difficulty swallowing).'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 48 (Principais sinais/sintomas – Disfagia)'
  DOSES_A:
    official_name: 'Número de doses aplicadas (tratamento atual)'
    translated_name: 'Vaccine doses applied in current treatment'
    description: 'Number of anti-rabies vaccine doses applied in the current treatment; NUM_DOSES instead counts doses of a previous treatment.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 51 (Número de doses aplicadas)'
  DT_APLI_SO:
    official_name: 'Data da aplicação do soro'
    translated_name: 'Date serum applied'
    description: 'Date the anti-rabies serum was applied.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 55 (Se sim, data da aplicação)'
  DT_EXPO:
    official_name: Data da exposição
    translated_name: Date of exposure
    description: 'Date the aggression (bite or other exposure) occurred. Prophylaxis started promptly is highly effective, while symptomatic rabies is almost always fatal.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 37 (Data da exposição)'
  DT_R_TRA:
    official_name: 'Data do início do tratamento'
    translated_name: 'Date current treatment started'
    description: 'Date the current anti-rabies treatment began, for patients receiving anti-rabies vaccine at the time of investigation.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 50 (Data do início do tratamento)'
  DT_TR_RAB:
    official_name: 'Data da última dose (tratamento anterior)'
    translated_name: 'Date of last dose of previous treatment'
    description: 'Date of the last dose of a previous anti-rabies treatment, in the antecedents block with ANTEC_PRE, ANTEC_POS and NUM_DOSES.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 40 (Data da última dose)'
  DT_VAC1:
    official_name: 'Data da 1ª dose da vacina'
    translated_name: Date of first dose
    description: 'Date of the first vaccine dose applied in the current treatment. With DT_EXPO it gives the delay to prophylaxis.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 52 (Data da 1ª dose da vacina)'
  DT_VAC_ULT:
    official_name: 'Data da última dose da vacina'
    translated_name: Date of last dose
    description: 'Date of the last vaccine dose applied in the current treatment.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 53 (Data da última dose da vacina)'
  ESPECIE_N:
    official_name: Espécie do animal agressor
    translated_name: Animal species
    description: 'Which animal — dog, cat, bat, monkey, fox, herbivore or other. Bats
      are the main rabies reservoir in Brazil now that canine rabies is largely controlled,
      so this field carries most of the risk assessment.

      '
    code_system: internal
    source: def
    source_ref: ANIMALAG.CNV
    reasoning: 'Bound to ANIMALAG, whose values are canina, felina, quiróptera, primata,
      raposa, herbívora and outra.

      '
  ESP_OUT:
    official_name: Espécie do animal agressor - Outra, especificar
    translated_name: Attacking animal species - other, specified
    description: 'Free-text name of the animal species that exposed the patient to
      rabies, filled in only when the coded species field (canina/felina/quiróptera/primata/raposa/herbívora/outra/ignorada)
      is "outra".

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Raiva_v5.pdf, campo 41 "Espécie do animal agressor"
  FERIMENT_N:
    official_name: Ferimento
    translated_name: Wound count category
    description: 'Coded category for how many bite/scratch wounds a rabies-exposure
      patient had: único (one), múltiplo (more than one), sem ferimento (indirect contact
      only, e.g. licking), or ignorado. Despite the "_N" suffix this is a coded category,
      not a raw count.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Raiva_v5.pdf, campo 35 "Ferimento"
  HIDROFOBI:
    official_name: Principais sinais/sintomas - Hidrofobia
    translated_name: Symptom - hydrophobia
    description: 'Whether the rabies patient showed hydrophobia (fear/spasm triggered
      by swallowing water), one of the classic-symptom checklist items (with aerofobia,
      disfagia, agressividade, paralisia) on the investigation form.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Raiva_v5.pdf, campo 48 "Principais sinais/sintomas"
  HISTOLOG_N:
    official_name: Histopatologia
    translated_name: Histopathology
    description: 'Histopathology looking for Negri bodies. The oldest rabies test,
      less sensitive than immunofluorescence and retained as a third line.

      '
    code_system: internal
    source: def
    source_ref: POSNEGINNRE.CNV
    reasoning: Bound to POSNEGINNRE; the histological rabies test.
  IMUNO_DIRE:
    official_name: Imunofluorescência direta
    translated_name: Direct immunofluorescence
    description: 'Direct immunofluorescence on animal brain tissue. The standard rabies
      test, and a positive result makes the exposed person''s full course mandatory.

      '
    code_system: internal
    source: def
    source_ref: POSNEGINNRE.CNV
    reasoning: Bound to POSNEGINNRE, positive/negative/inconclusive/not done.
  IMUNO_INDI:
    official_name: Prova biológica
    translated_name: Biological test
    description: 'The confirmatory test performed when immunofluorescence is negative
      or inconclusive, since it detects virus that direct testing can miss.

      '
    code_system: internal
    source: def
    source_ref: POSNEGINNRE.CNV
    reasoning: Bound to POSNEGINNRE; the indirect counterpart of IMUNO_DIRE.
  INFERIORES:
    official_name: Exposição em membros inferiores
    translated_name: Lower limb exposure
    description: Exposure to the legs, apart from the feet recorded in PES.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; INFERIORES reads membros inferiores.
  INFILTRA:
    official_name: Infiltração do soro na lesão
    translated_name: Immunoglobulin infiltrated into the wound
    description: 'Whether the immunoglobulin was infiltrated into the wound, fully
      or partly. Infiltrating it at the site is what neutralises virus before it enters
      the nerves, so partial infiltration is a real quality failure.

      '
    code_system: internal
    source: def
    source_ref: INFILTSOR.CNV
    reasoning: 'Bound to INFILTSOR, whose values are sim total, sim parcial and não.

      '
  LAMBEDURA:
    official_name: Exposição por lambedura
    translated_name: Lick
    description: 'Whether the exposure was a lick. Relevant only on broken skin or
      mucosa, which is why it is recorded apart from the other two.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; LAMBEDURA reads lambedura.
  MAOS_N:
    official_name: Exposição nas mãos
    translated_name: Hand exposure
    description: 'Exposure to the hands. High risk because the hands are densely innervated,
      and the commonest site in practice.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; MAOS reads mãos.
  MORDEDURA:
    official_name: Exposição por mordedura
    translated_name: Bite
    description: 'Whether the exposure was a bite. Bites carry the highest risk of
      the three exposure types and, with the site and depth, decide the prophylaxis
      regimen.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag opening the exposure-type block.
  NUM_DOSES:
    official_name: 'Número de doses aplicadas (tratamento anterior)'
    translated_name: 'Doses applied in previous treatment'
    description: 'Number of doses applied in a previous anti-rabies treatment, filled when the patient has pre- or post-exposure treatment antecedents; DOSES_A counts the current treatment.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 39 (Número de doses aplicadas)'
  PARALISIA:
    official_name: 'Principais sinais/sintomas - Paralisia'
    translated_name: Paralysis
    description: 'Whether the patient presented paralysis.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 48 (Principais sinais/sintomas – Paralisia)'
  PARESTESI:
    official_name: 'Principais sinais/sintomas - Parestesia'
    translated_name: Paresthesia
    description: 'Whether the patient presented paresthesia (abnormal tingling or burning sensations).'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 48 (Principais sinais/sintomas – Parestesia)'
  PES:
    official_name: Exposição nos pés
    translated_name: Foot exposure
    description: Exposure to the feet, also densely innervated.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PES reads pés.
  PROFUNDO:
    official_name: Ferimento profundo
    translated_name: Deep wound
    description: 'A deep wound, which carries virus further into innervated tissue
      and moves the case towards the fuller prophylaxis regimen.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PROFUNDO reads profundo.
  PROVA_BIOL:
    official_name: 'Diagnóstico laboratorial - Prova biológica'
    translated_name: 'Biological test (mouse inoculation) result'
    description: 'Result of the biological test (mouse inoculation) for rabies virus: positive, negative, inconclusive, or not done.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 58 (Diagnóstico laboratorial – Prova biológica)'
  QUANTID:
    official_name: 'Quantidade de soro aplicada'
    translated_name: 'Serum applied (ml)'
    description: 'Amount of anti-rabies serum applied, in millilitres.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 56 (Quantidade de soro aplicada)'
  SUPERFICIA:
    official_name: Ferimento superficial
    translated_name: Superficial wound
    description: 'A superficial wound. Depth is the third axis of the risk assessment,
      after exposure type and site.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag opening the wound-depth block.
  SUPERIORES:
    official_name: Exposição em membros superiores
    translated_name: Upper limb exposure
    description: Exposure to the arms, apart from the hands recorded in MAOS_N.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; SUPERIORES reads membros superiores.
  TRA_SORO:
    official_name: Soro antirrábico
    translated_name: Rabies immunoglobulin
    description: 'Whether rabies immunoglobulin was given. Indicated for severe exposures
      and provides immediate protection while the vaccine takes two weeks to work.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; TRA_SORO reads soro.
  TRONCO:
    official_name: Exposição no tronco
    translated_name: Trunk exposure
    description: Exposure to the trunk, a lower-risk site than the extremities or head.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; TRONCO reads tronco.
  VACINAD:
    official_name: Animal vacinado
    translated_name: Animal vaccinated
    description: 'Whether the animal had been vaccinated against rabies. A vaccinated,
      observable dog can make prophylaxis unnecessary; a bat never can.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag about the aggressor animal.
  VARIA_VIR:
    official_name: 'Variante'
    translated_name: Viral variant identified
    description: 'Numeric code of the rabies virus antigenic variant identified by the laboratory (which points to the animal reservoir); required when indirect immunofluorescence is positive.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Raiva Humana — http://portalsinan.saude.gov.br/images/documentos/Agravos/Raiva/DIC_DADOS_Raiva_v5.pdf, campo 59 (Variante)'
