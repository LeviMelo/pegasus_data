# SINAN.TETN —
#
# one notification of tetano neonatal
system: SINAN
asserted_by: pegasus_data

variables:
  COUNIDINF:
    official_name: Unidade (provável da fonte de infecção)
    translated_name: Facility code where infection occurred
    description: 'Health facility where the infection probably occurred, filled when the probable
      place of infection is a hospital or birth centre.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 57 (Unidade)
  CS_ABDOMEN:
    official_name: Abdome rígido
    translated_name: Rigid abdomen
    description: Abdominal rigidity from generalised muscle spasm.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ABDOMEN reads abdome; a clinical flag.
  CS_ANALISE:
    official_name: Medidas adotadas – análise da cobertura vacinal e vacinação discriminada
      em MIF contra o tétano
    translated_name: 'Measure taken: analysis of tetanus vaccine coverage in women of childbearing
      age'
    description: 'Whether, as a control measure, tetanus vaccination coverage among women of
      childbearing age was analysed and selective vaccination of them carried out (1 yes, 2
      no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – análise da cobertura vacinal de MIF e vacinação discriminada)
  CS_ATEND_N:
    official_name: Quem atendeu o parto
    translated_name: Who attended the birth
    description: 'Doctor, nurse, nursing auxiliary, trained or untrained traditional
      midwife, or other. Neonatal tetanus is a disease of unclean delivery, so this
      field is close to the cause.

      '
    code_system: internal
    source: def
    source_ref: RHSAUDENET.CNV
    reasoning: 'Bound to RHSAUDENET, whose values run from médico through parteira
      não treinada.

      '
  CS_BUSCAAT:
    official_name: Medidas adotadas – busca ativa de outros casos
    translated_name: Active case search performed
    description: 'Whether active search for other neonatal tetanus cases was done in the community,
      inpatient units and death records to gauge under-reporting (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – busca ativa de outros casos)
  CS_CADASTR:
    official_name: Medidas adotadas – cadastro e capacitação de parteiras atuantes
    translated_name: 'Measure taken: registration and training of midwives'
    description: 'Whether, as a control measure, the traditional midwives working in the area
      were registered and trained (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – cadastro e capacitação de parteiras atuantes)
  CS_CHORO:
    official_name: Choro excessivo
    translated_name: Excessive crying
    description: Constant crying, from the painful spasms.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CHORO reads choro; a clinical flag.
  CS_COBERTU:
    official_name: Local de residência coberto pelo
    translated_name: Residence covered by primary-care programme
    description: 'Primary-care programme covering the mother''s place of residence: PACS, PSF,
      both, none, or other.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 49 (Local de residência coberto pelo)
  CS_DIVULGA:
    official_name: Medidas adotadas – divulgação do problema para autoridades e profissionais
      de saúde
    translated_name: Case disclosed/reported (flag)
    description: 'Whether, as a control measure, the case was made known to authorities and
      health professionals (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – divulgação do problema para autoridades e profissionais
      de saúde)
  CS_INF_COT:
    official_name: Infecção do coto umbilical
    translated_name: Umbilical stump infection
    description: 'Whether the umbilical stump was infected. The entry point: the spores
      enter through the cut cord, usually from a contaminated instrument or dressing.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: INF_COT reads infecção do coto; a yes/no flag.
  CS_MAMAR:
    official_name: Dificuldade de mamar
    translated_name: Difficulty feeding
    description: 'Trouble suckling. Almost always the first sign, because the jaw muscles
      stiffen before anything else — a baby that fed well then stopped is the classic
      history.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MAMAR reads mamar; a clinical flag.
  CS_NASCIDO:
    official_name: Local de ocorrência do parto
    translated_name: Birth setting
    description: 'Where the birth took place: hospital, home, birth centre (casa de parto)
      or other.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 42 (Local de ocorrência do parto)
  CS_ORIENTA:
    official_name: Medidas adotadas – orientação às parturientes quanto aos cuidados com o
      coto umbilical
    translated_name: 'Measure taken: umbilical-stump care guidance'
    description: 'Whether, as a control measure, women giving birth were taught how to care
      for the umbilical stump (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – orientação às parturientes quanto aos cuidados com o coto
      umbilical)
  CS_ORIGEM:
    official_name: Origem da notificação
    translated_name: How the case was found
    description: 'Whether the case came from routine notification, active case-finding,
      or a death certificate. Neonatal tetanus is heavily under-notified, so case-finding
      and death certificates contribute a large share.

      '
    code_system: internal
    source: def
    source_ref: ORIGTET.CNV
    reasoning: 'Bound to ORIGTET, whose values are notificação, busca ativa and declaração
      de óbito.

      '
  CS_OUTRAS:
    official_name: Medidas adotadas – outras
    translated_name: Other control measures taken
    description: 'Whether control measures other than those listed were adopted (1 yes, 2 no,
      9 unknown); they are named in NO_OUTRAS.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – outras)
  CS_OUTROS:
    official_name: Outro sinal
    translated_name: Other sign, neonatal tetanus
    description: 'A sign outside the neonatal tetanus list of feeding difficulty, crying
      and abdominal rigidity.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the clinical block.
  CS_SUGOU:
    official_name: Sugou normalmente após o nascimento
    translated_name: Baby suckled normally at birth (flag)
    description: 'Whether the newborn suckled/breastfed normally right after birth
      - the classic early-warning question for neonatal tetanus, since loss of the
      ability to suckle (before trismus appears) is often the first sign parents notice.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 44 (Sugou normalmente após o nascimento)
  CS_VACINAC:
    official_name: Mãe vacinada
    translated_name: Mother vaccinated
    description: 'Whether the mother was vaccinated against tetanus. Maternal antibody
      crosses the placenta and protects the newborn, so a vaccinated mother makes neonatal
      tetanus nearly impossible.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: VACINAC reads vacinação, about the mother; a yes/no flag.
  CS_VACTETA:
    official_name: Antecedentes vacinais contra tétano (mãe)
    translated_name: Mother vaccinated against tetanus
    description: 'Mother''s tetanus vaccination history: vaccinated (proven by vaccination
      card), not vaccinated, or unknown.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 34 (Antecedentes vacinais contra tétano – mãe)
  DS_INF_LOC:
    official_name: Local provável da fonte de infecção
    translated_name: Site/type of infection location (flag)
    description: 'Probable place where the infection occurred: hospital, home, birth centre
      (casa de parto) or other.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 52 (Local provável da fonte de infecção)
  DS_INF_OUT:
    official_name: Local provável da fonte de infecção – outro, especificar
    translated_name: Other probable place of infection (specify)
    description: 'Free-text probable place of infection, filled when DS_INF_LOC is 4 (other
      place).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 52 (Local provável da fonte de infecção – outro, especificar)
  DT_1_DOSE:
    official_name: Data da 1ª dose
    translated_name: Date of mother's first dose
    description: When the mother received her first tetanus dose.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 35 (Data da 1ª dose)
  DT_2_DOSE:
    official_name: Data da 2ª dose
    translated_name: Date of mother's second dose
    description: 'When the mother received her second dose. Two doses more than fifteen
      days before birth is the minimum that protects the baby.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 36 (Data da 2ª dose)
  DT_3_DOSE:
    official_name: Data da 3ª dose
    translated_name: Date of mother's third dose
    description: When the mother received her third dose, completing the primary course.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 37 (Data da 3ª dose)
  DT_REFORCO:
    official_name: Data do último reforço
    translated_name: Date of mother's booster
    description: 'When the mother had her last tetanus booster. Immunity wanes over a decade,
      so a distant booster leaves the newborn unprotected.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 38 (Data do último reforço)
  DT_TRISMO:
    official_name: Data do trismo
    translated_name: Date trismus began
    description: 'Date the newborn developed trismus (lockjaw) - the pathognomonic
      sign of neonatal tetanus - more specific than the general first-symptoms date
      (DT_SIN_PRI) also on the form.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 46 (Data do trismo)
  ESCOLMAE_N:
    official_name: Escolaridade da mãe
    translated_name: Mother's education level (numeric code)
    description: 'Mother''s schooling, coded in the SINAN NET education bands (from illiterate
      through completed higher education, plus not applicable).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 41 (Escolaridade da mãe)
  NO_ATENOUT:
    official_name: Parto atendido por – se outro, especificar
    translated_name: Birth attended by other (specify)
    description: 'Free-text description of who attended the birth, filled when the birth attendant
      was coded as other.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 43 (Parto atendido por – se outro, especificar)
  NO_COBOUTR:
    official_name: Local de residência coberto pelo – se outros, especificar
    translated_name: Other primary-care programme (specify)
    description: 'Free-text name of the other primary-care programme covering the mother''s
      residence, filled when CS_COBERTU is 5 (other).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 49 (Local de residência coberto pelo – se outros, especificar)
  NO_OUPARTO:
    official_name: Local de ocorrência do parto – outro, especificar
    translated_name: Other birthplace - name/description
    description: 'Free-text place of birth, filled when CS_NASCIDO is 4 (other).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 42 (Local de ocorrência do parto – outro, especificar)
  NO_OUTRAS:
    official_name: Medidas adotadas – se outras, especificar
    translated_name: Other control measures (specify)
    description: 'Free-text description of the other control measures adopted, filled when
      CS_OUTRAS is yes.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 50 (Medidas adotadas – se outras, especificar)
  NUM_CON_N:
    official_name: Número de consultas de pré-natal
    translated_name: Prenatal visit-count category
    description: 'Number of prenatal visits in the last pregnancy, banded: one, two, three
      to five, six or more, none.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 33 (Número de consultas de pré-natal)
  NU_GESTA:
    official_name: Número de gestações
    translated_name: Number of pregnancies (parity)
    description: 'Number of pregnancies the mother has had, including abortions, banded one
      to five or more.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tétano Neonatal — portalsinan.saude.gov.br,
      DIC_DADOS_Tetano_NeoNatal_v5.pdf (sources/dic_text/tetano-neonatal__DIC_DADOS_Tetano_NeoNatal_v5.txt),
      campo 40 (Número de gestações)
