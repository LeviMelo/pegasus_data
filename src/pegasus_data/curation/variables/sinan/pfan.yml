    source_ref: DIMIAUSE.CNV
    reasoning: EVOR strength at membro superior esquerdo.
  EVOR_RC_ED:
    official_name: Reflexo na reavaliação, extremidade direita
    translated_name: Reflex at reassessment, right upper
    description: 'A reflex finding at reassessment for the right side of one extremity
