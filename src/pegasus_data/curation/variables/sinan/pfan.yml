    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 1 Líquor – Nº de células/mm³)'
  LAB_L_CEL2:
    official_name: 'Exame complementar 2 Líquor - Nº de células/mm³'
    translated_name: CSF cell count, second sample
    description: 'White cell count in the second CSF sample. The fall from the first
      sample is itself informative, since the pleocytosis of poliomyelitis settles
      within days.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 2 Líquor – Nº de células/mm³)'
  LAB_L_CL1:
    official_name: 'Exame complementar 1 Líquor - Cloreto mg%'
    translated_name: CSF chloride, first sample
    description: 'Chloride in the first CSF sample. A traditional part of the Brazilian
      CSF panel, low in tuberculous meningitis, and reported here mainly to complete
      that panel.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 1 Líquor – Cloreto mg%)'
  LAB_L_CL2:
    official_name: 'Exame complementar 2 Líquor - Cloreto mg%'
    translated_name: CSF chloride, second sample
    description: Chloride in the second CSF sample; the comparator for LAB_L_CL1.
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 2 Líquor – Cloreto mg%)'
  LAB_L_GLI1:
    official_name: 'Exame complementar 1 Líquor - Glicose mg%'
    translated_name: CSF glucose, first sample
    description: 'Glucose in the first CSF sample. Normal in viral processes and low
      in bacterial or tuberculous meningitis, so it is the field that rules those out
      rather than ruling polio in.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 1 Líquor – Glicose mg%)'
  LAB_L_GLI2:
    official_name: 'Exame complementar 2 Líquor - Glicose mg%'
    translated_name: CSF glucose, second sample
    description: Glucose in the second CSF sample; the comparator for LAB_L_GLI1.
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 2 Líquor – Glicose mg%)'
  LAB_L_LIN1:
    official_name: 'Exame complementar 1 Líquor - Linfócitos %'
    translated_name: CSF lymphocytes, first sample
    description: 'Lymphocyte proportion in the first CSF sample. A lymphocytic predominance
      indicates a viral process; a neutrophilic one points to bacterial meningitis
      instead.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 1 Líquor – Linfócitos %)'
  LAB_L_LIN2:
    official_name: 'Exame complementar 2 Líquor - Linfócitos %'
    translated_name: CSF lymphocytes, second sample
    description: 'Lymphocyte proportion in the second CSF sample. The shift towards
      lymphocytes over days is characteristic of enteroviral infection.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 2 Líquor – Linfócitos %)'
  LAB_L_PRO1:
    official_name: 'Exame complementar 1 Líquor - Proteínas mg%'
    translated_name: CSF protein, first sample
    description: 'Protein concentration in the first CSF sample. Read against LAB_L_CEL1:
      high protein with a normal cell count is the Guillain-Barré pattern and the main
      alternative diagnosis to exclude.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 1 Líquor – Proteínas mg%)'
  LAB_L_PRO2:
    official_name: 'Exame complementar 2 Líquor - Proteínas mg%'
    translated_name: CSF protein, second sample
    description: 'Protein in the second CSF sample. The rise between samples is what
      confirms Guillain-Barré when the first puncture was done too early.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 2 Líquor – Proteínas mg%)'
  LAB_MEDULA:
    official_name: Coleta de medula espinhal
    translated_name: Spinal cord tissue collected
    description: 'Whether spinal cord tissue was collected. The anterior horn of the
      cord is where poliovirus destroys motor neurons, so it is the definitive post
      mortem specimen.

      '
    code_system: internal
    source: def
    reasoning: 'MEDULA is the spinal cord, beside the other autopsy specimens, and
      bound to SIM_NAO.

      '
  LAB_Q_F:
    official_name: Quantidade da amostra de fezes
    translated_name: Stool sample quantity adequate
    description: 'Whether enough stool was collected. An undersized sample fails the
      adequacy criteria even when it was taken on time.

      '
    code_system: internal
    source: def
    source_ref: SUFINSUF.CNV
    reasoning: Q for quantidade with the F fezes suffix; C(1) flag.
  LAB_RESULT:
    official_name: 'Resultado (exame anatomopatológico)'
    translated_name: 'Anatomopathological result'
    description: 'Result of the anatomopathological exam: compatible or not compatible with poliomyelitis.'
    code_system: internal
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 73 (Resultado – anatomopatológico)'
  LAB_RES_F1:
    official_name: Resultado da primeira amostra de fezes
    translated_name: First stool result
    description: 'Result of virus isolation from the first stool sample: 1, 2 and 3
      name the poliovirus serotype recovered, 4 is negative, 5 a non-polio enterovirus,
      7 a sample lost in transit. This is the test the whole investigation exists to
      obtain — a serotype here is the difference between a discarded case and a national
      emergency.

      '
    code_system: internal
    source: def
    source_ref: P1P2P3NE.CNV
    reasoning: 'Bound in the catalog to P1P2P3NE, whose values are P1, P2, P3, Negativo,
      Não pólio, Outros and Perdida — stool virology for poliovirus.

      '
  LAB_RES_F2:
    official_name: Resultado da segunda amostra de fezes
    translated_name: Second stool result
    description: 'Result from the second stool sample, on the same serotype codelist
      as LAB_RES_F1. Two samples are required because poliovirus is shed intermittently
      and one negative culture does not exclude infection.

      '
    code_system: internal
    source: def
    source_ref: P1P2P3NE.CNV
    reasoning: Same P1P2P3NE binding as LAB_RES_F1, numbered 2.
  LAB_RES_F3:
