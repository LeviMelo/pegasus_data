# SINAN.PFAN —
#
# one notification of paralisia flacida aguda
system: SINAN
asserted_by: pegasus_data

variables:
  ANT_30_DIA:
    official_name: Recebeu vacina nos 30 dias anteriores
    translated_name: Vaccinated within 30 days before onset
    description: 'Whether a dose was given in the 30 days before paralysis began. This
      is the screening question for vaccine-associated paralytic poliomyelitis, the
      rare event caused by the live oral vaccine itself, and it is why the interval
      is asked separately from ANT_DT_VAC.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: '30_DIA is a 30-day window under the vaccination block; the 4-to-30-day
      window after OPV is the standard VAPP case definition.

      '
  ANT_DOSES:
    official_name: 'Número de doses válidas'
    translated_name: Number of polio doses received
    description: 'Number of valid doses of polio vaccine (Sabin/anti-polio) received; filled when ANT_VACINA is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 34 (Número de doses válidas)'
  ANT_DT_VAC:
    official_name: 'Data da última dose da vacina'
    translated_name: Date of last polio dose
    description: 'Date of the most recent polio dose. With the onset date it gives
      the interval that decides whether vaccine-associated paralysis is even possible.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 35 (Data da última dose da vacina)'
  ANT_PAIS:
    official_name: 'Se sim, país origem'
    translated_name: 'Country of travel or visitors from polio-endemic area'
    description: 'Country the patient travelled to, or visitors came from, when there was travel to or visits from a polio-endemic area in the 30 days before the motor deficit began (ANT_30_DIA = 1).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 37 (Se sim, país origem)'
  ANT_VACINA:
    official_name: Antecedente de vacina contra poliomielite
    translated_name: Received polio vaccine
    description: 'Whether the child had received polio vaccine before the paralysis.
      The first question the investigation asks, because an unvaccinated child with
      acute flaccid paralysis is the classic wild-poliovirus presentation.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: 'ANT_ marks antecedentes on SINAN forms and VACINA is the vaccine; a
      C(1) flag opening the vaccination block of the AFP form.

      '
  ATE_HIPOTE:
    official_name: 'Hipótese diagnóstica'
    translated_name: Encounter - diagnostic hypothesis
    description: 'Diagnostic hypothesis for the paralysis, coded (CID-10 style, 5 characters) from the table annexed to the dictionary.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 55 (Hipótese diagnóstica – vide tabela anexa)'
  CLI_AGUDA:
    official_name: Instalação aguda
    translated_name: Acute onset
    description: 'Whether the weakness came on acutely, over hours to days. Acute onset
      is part of the case definition; a deficit that developed over weeks is not acute
      flaccid paralysis and belongs to a different investigation.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: AGUDA is the acute qualifier in the case definition; C(1) flag.
  CLI_AQ_D_N:
    official_name: Reflexo aquileu direito
    translated_name: Right ankle reflex
    description: 'The right ankle reflex. The most distal of the four and usually the
      first to disappear in an ascending process, which is what makes it useful against
      the Guillain-Barré differential.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: AQ is aquileu with D direito.
  CLI_AQ_E_N:
    official_name: Reflexo aquileu esquerdo
    translated_name: Left ankle reflex
    description: The left ankle reflex; the comparator for CLI_AQ_D_N.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: AQ aquileu with E esquerdo.
  CLI_ASCEND:
    official_name: Progressão ascendente
    translated_name: Ascending progression
    description: 'Whether the weakness spread upward from the legs. Ascending progression
      points towards Guillain-Barré rather than polio.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ASCEND is ascendente; paired with CLI_DESCEN as the two directions.
  CLI_ASSIME:
    official_name: Assimetria da paralisia
    translated_name: Asymmetric paralysis
    description: 'Whether the weakness is asymmetric between the two sides. Poliomyelitis
      is characteristically asymmetric and Guillain-Barré characteristically symmetric,
      so this single flag carries much of the differential.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ASSIME reads assimetria; C(1) flag in the clinical block.
  CLI_A_FMID:
    official_name: Alteração de força no membro inferior direito
    translated_name: Strength altered, right leg
    description: Whether strength is abnormal in the right leg. See CLI_A_FMSD for
      the naming.
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: Same A_F strength pattern at membro inferior direito.
  CLI_A_FMIE:
    official_name: Alteração de força no membro inferior esquerdo
    translated_name: Strength altered, left leg
    description: Whether strength is abnormal in the left leg. See CLI_A_FMSD for the
      naming.
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: Same A_F strength pattern at membro inferior esquerdo.
  CLI_A_FMSD:
    official_name: Alteração de força no membro superior direito
    translated_name: Strength altered, right arm
    description: 'Whether strength is abnormal in the right arm. This is the yes/no
      companion to the graded CLI_F_MSD, and the two are recorded in different schema
      generations of the form.

      '
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: 'CLI_A_ marks alteração and the trailing letter selects the modality
      — F força, S sensibilidade, T tônus — followed by the site. The face and cervical
      fields exist only for S and T, which is consistent: neither has a limb strength
      grade.

      '
  CLI_A_FMSE:
    official_name: Alteração de força no membro superior esquerdo
    translated_name: Strength altered, left arm
    description: Whether strength is abnormal in the left arm. See CLI_A_FMSD for the
      naming.
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: Same A_F strength pattern at membro superior esquerdo.
  CLI_A_SMID:
    official_name: Alteração de sensibilidade no membro inferior direito
    translated_name: Sensation altered, right leg
    description: Whether sensation is abnormal in the right leg. See CLI_A_SMSD.
    code_system: internal
    source: def
    source_ref: DIMAUSPA.CNV
    reasoning: Same A_S sensation pattern at membro inferior direito.
  CLI_A_SMIE:
    official_name: Alteração de sensibilidade no membro inferior esquerdo
    translated_name: Sensation altered, left leg
    description: Whether sensation is abnormal in the left leg. See CLI_A_SMSD.
    code_system: internal
    source: def
    source_ref: DIMAUSPA.CNV
    reasoning: Same A_S sensation pattern at membro inferior esquerdo.
  CLI_A_SMSD:
    official_name: Alteração de sensibilidade no membro superior direito
    translated_name: Sensation altered, right arm
    description: 'Whether sensation is abnormal in the right arm. Sensation is the
      discriminator that matters most here: poliomyelitis attacks motor neurons and
      spares sensation, so preserved sensation with severe weakness argues for polio
      and sensory loss argues against it.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSPA.CNV
    reasoning: A_S is alteração de sensibilidade; see CLI_A_FMSD for the pattern.
  CLI_A_SMSE:
    official_name: Alteração de sensibilidade no membro superior esquerdo
    translated_name: Sensation altered, left arm
    description: Whether sensation is abnormal in the left arm. See CLI_A_SMSD for
      why sensation matters.
    code_system: internal
    source: def
    source_ref: DIMAUSPA.CNV
    reasoning: Same A_S sensation pattern at membro superior esquerdo.
  CLI_A_S_FA:
    official_name: Alteração de sensibilidade na face
    translated_name: Sensation altered, face
    description: 'Whether facial sensation is abnormal. The face has sensation and
      tone fields but no strength grade, because facial weakness is captured separately
      by CLI_FACE.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSPA.CNV
    reasoning: A_S with the FA face suffix; the face lacks an A_F counterpart.
  CLI_A_TMID:
    official_name: Alteração de tônus no membro inferior direito
    translated_name: Tone altered, right leg
    description: Whether tone is abnormal in the right leg. See CLI_A_TMSD.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: Same A_T tone pattern at membro inferior direito.
  CLI_A_TMIE:
    official_name: Alteração de tônus no membro inferior esquerdo
    translated_name: Tone altered, left leg
    description: Whether tone is abnormal in the left leg. See CLI_A_TMSD.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: Same A_T tone pattern at membro inferior esquerdo.
  CLI_A_TMSD:
    official_name: Alteração de tônus no membro superior direito
    translated_name: Tone altered, right arm
    description: 'Whether muscle tone is abnormal in the right arm. Reduced tone is
      what makes a paralysis flaccid, so this modality is the one that confirms the
      syndrome rather than narrowing its cause.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: A_T is alteração de tônus; see CLI_A_FMSD for the pattern.
  CLI_A_TMSE:
    official_name: Alteração de tônus no membro superior esquerdo
    translated_name: Tone altered, left arm
    description: Whether tone is abnormal in the left arm. See CLI_A_TMSD.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: Same A_T tone pattern at membro superior esquerdo.
  CLI_A_T_CE:
    official_name: Alteração de tônus cervical
    translated_name: Tone altered, neck
    description: 'Whether neck tone is abnormal. The neck has a tone field but no sensation
      field, and loss of neck tone is the sign that most often precedes respiratory
      involvement.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: A_T with the CE cervical suffix; no A_S counterpart exists for the neck.
  CLI_A_T_FA:
    official_name: Alteração de tônus na face
    translated_name: Tone altered, face
    description: Whether facial tone is abnormal; the tone counterpart of CLI_A_S_FA.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: A_T with the FA face suffix.
  CLI_BICD_N:
    official_name: Reflexo bicipital direito
    translated_name: Right biceps reflex
    description: 'The right biceps reflex at the first examination. Deep tendon reflexes
      are lost early in flaccid paralysis, and the four reflex pairs together localise
      the level of the lesion.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: 'BIC is bicipital and D direito; one of four reflexes recorded left
      and right, matching the REFR_ set used at reassessment.

      '
  CLI_BICE_N:
    official_name: Reflexo bicipital esquerdo
    translated_name: Left biceps reflex
    description: The left biceps reflex at the first examination; the comparator for
      CLI_BICD_N.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: BIC bicipital with E esquerdo.
  CLI_BRUDZ:
    official_name: Sinal de Brudzinski
    translated_name: Brudzinski sign
    description: 'The meningeal sign in which flexing the neck makes the hips and knees
      flex. Present with CLI_NUCA it argues for meningitis; poliomyelitis can produce
      both, since the virus inflames the meninges as well as the cord.

      '
    code_system: internal
    source: def
    source_ref: AUSEPRES.CNV
    reasoning: BRUDZ is Brudzinski, a named meningeal sign; C(1) flag.
  CLI_CERVIC:
    official_name: Comprometimento cervical
    translated_name: Neck involvement
    description: 'Whether the neck muscles are involved. Neck weakness is a warning
      sign for respiratory failure because the same segments serve the diaphragm.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CERVIC is cervical; C(1) sign flag beside the other sites.
  CLI_CONTAT:
    official_name: Contato com caso semelhante
    translated_name: Contact with a similar case
    description: 'Whether the child had contact with another paralysis case. Clustering
      is what turns single notifications into an outbreak investigation.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CONTAT reads contato; standard epidemiological-link flag.
  CLI_CON_ES:
    official_name: 'Contato ou ingestão de substâncias tóxicas - caso afirmativo, especifique'
    translated_name: 'Toxic substance contacted or ingested - specify'
    description: 'Free-text name of the toxic substance (pesticide, lead, mercury, medication) the patient contacted or ingested; filled when CLI_CONTAT is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 52 (Caso afirmativo, especifique)'
  CLI_DESCEN:
    official_name: Progressão descendente
    translated_name: Descending progression
    description: 'Whether the weakness spread downward. Descending progression raises
      botulism, which is why the AFP form asks the direction rather than merely recording
      that the deficit spread.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DESCEN is descendente; the counterpart flag to CLI_ASCEND.
  CLI_DORES:
    official_name: Dores musculares
    translated_name: Muscle pain
    description: 'Muscle pain. Prominent early in poliomyelitis and often the symptom
      that brings the child in before weakness is obvious.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DORES reads dores; C(1) symptom flag.
  CLI_DT:
    official_name: 'Data de início da deficiência motora'
    translated_name: Date motor deficit began
    description: 'Date the weakness itself started, which is not always the date the
      illness started — many cases begin with fever or diarrhoea days earlier. The
      clock for stool collection runs from here.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 39 (Data de início da deficiência motora)'
  CLI_DT_EXA:
    official_name: 'Data do exame'
    translated_name: Date of neurological examination
    description: 'Date of the neurological examination done in the acute phase.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 44 (Data do exame)'
  CLI_EXT_D:
    official_name: Comprometimento de extremidade direita
    translated_name: Right extremity involved
    description: 'Whether the right extremity is affected. A coarse side flag recorded
      alongside the limb-by-limb strength grading, and useful when the detailed grading
      is left blank.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: EXT_D reads extremidade direita; paired with CLI_EXT_E.
  CLI_EXT_E:
    official_name: Comprometimento de extremidade esquerda
    translated_name: Left extremity involved
    description: 'Whether the left extremity is affected. The left-side counterpart
      of CLI_EXT_D; the pair is what makes asymmetry visible.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: EXT_E reads extremidade esquerda.
  CLI_FACE:
    official_name: Paralisia facial
    translated_name: Facial paralysis
    description: 'Whether the face is involved. Cranial nerve involvement points to
      bulbar disease, which is the form of polio that threatens breathing and swallowing.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: FACE is the face; C(1) sign flag.
  CLI_FLACID:
    official_name: Paralisia flácida
    translated_name: Flaccid paralysis
    description: 'Whether the paralysis is flaccid — reduced tone and reflexes — rather
      than spastic. Flaccidity localises the lesion to the lower motor neuron, which
      is where poliovirus acts.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: FLACID is flácida, the defining qualifier of the syndrome; C(1) flag.
  CLI_FLE_D:
    official_name: Flexão à direita
    translated_name: Right-side flexion
    description: 'Flexion movement preserved on the right. Recorded because a limb
      that can still flex against gravity is graded differently from one that cannot.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: 'FLE_D reads flexão direita, paired with CLI_FLE_E and sitting beside
      the extremity flags. Lower confidence than the named signs on this form.

      '
  CLI_FLE_E:
    official_name: Flexão à esquerda
    translated_name: Left-side flexion
    description: Flexion movement preserved on the left; the counterpart of CLI_FLE_D.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: FLE_E reads flexão esquerda, paired with CLI_FLE_D.
  CLI_F_MID:
    official_name: Força muscular no membro inferior direito
    translated_name: Muscle strength, right leg
    description: 'Graded strength in the right leg. The legs are affected first and
      most severely in poliomyelitis, so these two fields carry the most signal.

      '
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: MID is membro inferior direito; parallel to the other three.
  CLI_F_MIE:
    official_name: Força muscular no membro inferior esquerdo
    translated_name: Muscle strength, left leg
    description: 'Graded strength in the left leg, and the comparator for CLI_F_MID
      that makes lower-limb asymmetry visible.

      '
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: MIE is membro inferior esquerdo; parallel to the other three.
  CLI_F_MSD:
    official_name: Força muscular no membro superior direito
    translated_name: Muscle strength, right arm
    description: 'Graded strength in the right arm. The four limb strength fields together
      are the core of the examination — their pattern, not any one of them, is what
      distinguishes the causes of acute flaccid paralysis.

      '
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: 'F is força and MSD membro superior direito, one of four parallel C(1)
      gradings covering the limbs.

      '
  CLI_F_MSE:
    official_name: Força muscular no membro superior esquerdo
    translated_name: Muscle strength, left arm
    description: 'Graded strength in the left arm. Compared against CLI_F_MSD it gives
      the left-right asymmetry that argues for poliomyelitis.

      '
    code_system: internal
    source: def
    source_ref: DIMIAUSE.CNV
    reasoning: MSE is membro superior esquerdo; parallel to CLI_F_MSD.
  CLI_INJECA:
    official_name: Injeção intramuscular prévia
    translated_name: Prior intramuscular injection
    description: 'Whether an intramuscular injection preceded the weakness. Injection
      into a limb during enteroviral infection can provoke paralysis in that limb,
      and it is also the mechanism of traumatic neuritis — a common non-polio cause
      that must be excluded.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: INJECA reads injeção; C(1) flag among the precipitating factors.
  CLI_LOCAL:
    official_name: 'Local de aplicação'
    translated_name: 'Site of intramuscular injection'
    description: 'Body site of the intramuscular injection in the patient''s history: left or right lower limb, left or right upper limb, or left or right buttock.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 54 (Local de aplicação)'
  CLI_NUCA:
    official_name: Rigidez de nuca
    translated_name: Neck stiffness
    description: 'Meningeal irritation. Distinct from CLI_CERVIC, which is weakness
      of the neck: this is stiffness, a sign of meningitis rather than of paralysis.
      Coded 1 absent, 2 present — the reverse of EVOR_A_*, which is 1 present, 2 absent.
      Two opposite conventions on one form.

      '
    code_system: internal
    source: def
    source_ref: AUSEPRES.CNV
    reasoning: 'NUCA with rigidez is the standard meningeal sign, and it sits beside
      CLI_BRUDZ, the other meningeal sign on the form.

      '
  CLI_OBSTIP:
    official_name: Obstipação intestinal
    translated_name: Constipation
    description: 'Constipation. Recorded because autonomic involvement accompanies
      several causes of acute flaccid paralysis and because severe constipation is
      a feature of infant botulism.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: OBSTIP is obstipação; C(1) symptom flag.
  CLI_PATD_N:
    official_name: Reflexo patelar direito
    translated_name: Right knee reflex
    description: 'The right knee-jerk reflex. The most reliably elicited reflex in
      a child, and its loss is often the first objective sign of the lower-limb weakness
      that dominates poliomyelitis.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: PAT is patelar with D direito.
  CLI_PATE_N:
    official_name: Reflexo patelar esquerdo
    translated_name: Left knee reflex
    description: The left knee-jerk reflex; compared with CLI_PATD_N it shows lower-limb
      asymmetry.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: PAT patelar with E esquerdo.
  CLI_PROGRE:
    official_name: Progressão da paralisia
    translated_name: Paralysis still progressing
    description: 'Whether the deficit was still worsening at examination. A progressing
      deficit means the exam is a snapshot of an unfinished process, and the 60-day
      reassessment is what settles the final extent.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PROGRE reads progressão; C(1) flag beside the direction flags.
  CLI_SINTOM:
    official_name: Sintomas prévios
    translated_name: Preceding symptoms
    description: 'Whether the paralysis was preceded by other symptoms. A prodrome
      of fever or gastrointestinal illness is typical of enteroviral infection and
      helps date the exposure.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: SINTOM is sintomas; a C(1) flag in the clinical history block.
  CLI_TRID_N:
    official_name: Reflexo tricipital direito
    translated_name: Right triceps reflex
    description: 'The right triceps reflex, which tests a different cervical segment
      from the biceps reflex and so helps place the level of the lesion in the arm.

      '
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: TRI is tricipital with D direito.
  CLI_TRIE_N:
    official_name: Reflexo tricipital esquerdo
    translated_name: Left triceps reflex
    description: The left triceps reflex; the comparator for CLI_TRID_N.
    code_system: internal
    source: def
    source_ref: DIMAUSAUN.CNV
    reasoning: TRI tricipital with E esquerdo.
  CON_DESCAR:
    official_name: Motivo do descarte
    translated_name: Reason the case was discarded
    description: 'The alternative diagnosis the case was discarded to, as a CID-10
      code from a 40-entry list: Guillain-Barré (G610), acute transverse myelitis (G373),
      neuralgic amyotrophy (G122), post-immunisation encephalitis (G040) and the rest
      of the differential. Almost every notification is discarded — that is the design,
      since the system deliberately casts wide — so this field, not the diagnosis,
      is what most rows actually carry.

      '
    code_system: internal
    source: def
    source_ref: DIAGNOS.CNV
    reasoning: 'Bound in the catalog to DIAGNOS, 40 CID-10 codes covering the causes
      of acute flaccid paralysis other than poliomyelitis.

      '
