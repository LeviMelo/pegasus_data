    code_system: internal
    source: def
    source_ref: DIMAUSPA.CNV
    reasoning: EVOR sensation at membro superior esquerdo.
  LAB_CELEBR:
    official_name: Coleta de tecido cerebral
    translated_name: Brain tissue collected
    description: 'Whether brain tissue was collected, which happens only at autopsy.
      Recorded because a fatal case is the one where confirming or excluding poliovirus
      matters most and the usual specimens are no longer obtainable.

      '
    code_system: internal
    source: def
    reasoning: 'CELEBR is a misspelling of cerebral, in a specimen block beside LAB_MEDULA
      and LAB_INTEST, and bound to SIM_NAO. The typo is in the column name as DATASUS
      published it.

      '
  LAB_CON_F:
    official_name: Condição de conservação da amostra de fezes
    translated_name: Stool sample cold chain intact
    description: 'Whether the sample arrived at an adequate temperature or an altered
      one. Poliovirus does not survive a broken cold chain, so a sample that warmed
      in transit yields a false negative and the case cannot be discarded on it.

      '
    code_system: internal
    source: def
    source_ref: TEMPADEQ.CNV
    reasoning: 'Bound in the catalog to TEMPADEQ, whose two values are temperatura
      adequada and temperatura alterada — a cold-chain check, not a yes/no.

      '
  LAB_DT_C1:
    official_name: 'Data da coleta (material anatomopatológico)'
    translated_name: 'Date anatomopathological material collected'
    description: 'Date anatomopathological material (brain, spinal cord or intestine) was collected, typically at autopsy.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 72 (Data da coleta – material anatomopatológico)'
  LAB_DT_CEN:
    official_name: 'Data do envio do nível estadual para LRR'
    translated_name: 'Date stool sample sent from state level to reference laboratory'
    description: 'Date the stool sample was sent from the state level to the regional reference laboratory (LRR).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 62 (Data do envio do nível estadual para LRR)'
  LAB_DT_E_1:
    official_name: 'Eletroneuromiografia - data da realização'
    translated_name: 'Date of electroneuromyography'
    description: 'Date the first electroneuromyography was performed.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 69 (Eletroneuromiografia – data da realização)'
  LAB_DT_F1:
    official_name: 'Data da coleta (amostra de fezes)'
    translated_name: Date first stool sample collected
    description: 'Date the first stool sample was taken. The single most important
      date in polio surveillance: two samples within 14 days of onset is the adequacy
      standard, and a case sampled late cannot be discarded on laboratory grounds however
      negative the culture.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 60 (Data da coleta)'
  LAB_DT_L_1:
    official_name: 'Exame complementar 1 Líquor - Data da coleta'
    translated_name: Date first CSF sample taken
    description: 'Date of the first lumbar puncture. CSF findings change over the first
      fortnight, so the date is what makes the cell and protein values interpretable.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 1 Líquor – data da coleta)'
  LAB_DT_L_2:
    official_name: 'Exame complementar 2 Líquor - Data da coleta'
    translated_name: Date second CSF sample taken
    description: 'Date of a repeat lumbar puncture. Repeated because the protein rise
      that distinguishes Guillain-Barré often appears only in the second week.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 68 (Exame complementar 2 Líquor – data da coleta)'
  LAB_DT_NLE:
    official_name: 'Data do envio do nível local para estadual'
    translated_name: 'Date stool sample sent from local to state level'
    description: 'Date the stool sample was sent from the local level to the state level.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 61 (Data do envio do nível local para estadual)'
  LAB_DT_R1:
    official_name: 'Data do recebimento no LRR'
    translated_name: 'Date stool sample received at reference laboratory'
    description: 'Date the stool sample was received at the regional reference laboratory (LRR).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 63 (Data do recebimento no LRR)'
  LAB_DT_RE1:
    official_name: 'Data do resultado'
    translated_name: 'Date of stool sample result'
    description: 'Date of the result of the stool sample; the result itself is LAB_RES_F1.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 66 (Data do resultado)'
  LAB_E_D_1:
    official_name: 'Diagnóstico sugestivo de (eletroneuromiografia)'
    translated_name: 'Diagnosis suggested by electroneuromyography'
    description: 'Diagnosis suggested by the electroneuromyography, from the table annexed to the dictionary; filled when LAB_DT_E_1 is filled.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Paralisia Flácida Aguda (rev. abr/2012) — sources/dic_text/pfa.txt (DIC_DADOS_PFA, portalsinan.saude.gov.br), campo 70 (Diagnóstico sugestivo de – tabela anexa)'
  LAB_INTEST:
    official_name: Coleta de conteúdo intestinal
    translated_name: Intestinal content collected
    description: 'Whether intestinal content was collected rather than a passed stool.
      The fallback when the child has died or cannot produce a sample, since the virus
      is still recoverable from the gut.

      '
    code_system: internal
    source: def
    reasoning: 'INTEST reads intestinal, in the specimen block; the catalog binds it
      to the SIM_NAO yes/no codelist.

      '
  LAB_L_CEL1:
    official_name: 'Exame complementar 1 Líquor - Nº de células/mm³'
    translated_name: CSF cell count, first sample
    description: 'White cell count in the first CSF sample. The core of the differential:
