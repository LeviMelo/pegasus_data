# SINAN.SIFG — Syphilis in pregnancy
# Sífilis em gestante
#
# One case of syphilis detected during pregnancy — the notification that
# should prevent a SINAN.SIFC case.
system: SINAN
asserted_by: pegasus_data

variables:
  DSMOTIVO:
    official_name: Outro motivo
    translated_name: Other reason partner was not treated
    description: 'Free-text reason the partner was not treated, filled when TPMOTPARC is 6
      (other reason).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 45 (Outro motivo)
  DSTITULO1:
    official_name: Título
    translated_name: First serology titer (free text)
    description: 'Titre of the non-treponemal test (VDRL/RPR) done in prenatal care, as free
      text such as "1:8"; filled when the test was reactive.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 38 (Título)
  DTTESTE1:
    official_name: Data do teste não treponêmico no pré-natal
    translated_name: Date of first test
    description: 'Date the non-treponemal test (VDRL/RPR) was done in prenatal care.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 39 (Data)
  TPCONFIRMA:
    official_name: Teste confirmatório
    translated_name: Confirmatory test
    description: 'The confirmatory treponemal test. Needed because non-treponemal screening
      produces false positives in pregnancy itself.

      '
    code_system: internal
    source: def
    source_ref: REATIVO.CNV
    reasoning: Bound to REATIVO; the confirmatory step after TPTESTE1.
  TPESQPAR:
    official_name: Esquema de tratamento prescrito ao parceiro
    translated_name: Partner's treatment regimen type
    description: 'Treatment regimen prescribed to the partner: benzathine penicillin G 2.4,
      4.8 or 7.2 million IU, another regimen, or not done.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 43 (Esquema de tratamento prescrito ao parceiro)
  TPESQUEMA:
    official_name: Esquema de tratamento
    translated_name: Treatment regimen type
    description: 'Treatment regimen of the pregnant woman: benzathine penicillin G 2.4, 4.8
      or 7.2 million IU, another regimen, or not done.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 41 (Esquema de tratamento)
  TPEVIDENCI:
    official_name: Classificação clínica
    translated_name: Clinical classification
    description: 'Clinical stage of syphilis in the pregnant woman: primary, secondary, tertiary
      or latent.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 36 (Classificação clínica)
  TPMOTPARC:
    official_name: Motivo para o não tratamento do parceiro
    translated_name: Reason partner wasn't treated (coded)
    description: 'Why the partner was not treated: no further contact with the woman, not summoned,
      summoned but did not come, refused, non-reactive serology, or other.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 44 (Motivo para o não tratamento do parceiro)
  TPTESTE1:
    official_name: Primeiro teste
    translated_name: First test
    description: 'The first syphilis test in pregnancy — reactive, non-reactive, or
      not done. Screening is meant to happen at least twice in a pregnancy, and a "not
      done" here is the failure that produces congenital cases.

      '
    code_system: internal
    source: def
    source_ref: REATIVO.CNV
    reasoning: Bound to REATIVO, reativo/não reativo/não realizado.
  TRATPARC:
    official_name: Parceiro tratado concomitantemente à gestante
    translated_name: Partner treated (flag)
    description: 'Whether the partner was treated at the same time as the pregnant woman.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Gestante com Sífilis — http://portalsinan.saude.gov.br/images/documentos/Agravos/Sifilis-Ges/DIC_DADOS_Gestante_Sifilis_v5.pdf,
      campo 42 (Parceiro tratado concomitantemente à gestante)
