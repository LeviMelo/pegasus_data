# SINAN.PEST —
#
# one notification of plague
system: SINAN
asserted_by: pegasus_data

variables:
  COM_PEST:
    official_name: Os sinais e sintomas são compatíveis com a definição de caso?
    translated_name: Signs and symptoms match the case definition
    description: 'Whether the patient''s signs and symptoms fit the plague case definition
      (1 yes, 2 no, 9 unknown). With CO_RISCO and EPI_PESTE all yes, the case is confirmed
      automatically.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 35
  CON_GRAVID:
    official_name: Gravidade
    translated_name: Severity
    description: 'Severity of a confirmed plague case: mild/outpatient, moderate, or severe.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 47 (Gravidade)
  CO_FOCAL:
    official_name: Instituído controle focal?
    translated_name: Focal control instituted
    description: 'Whether focal control measures (rodent and flea control around the case)
      were put in place (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 43
  CO_RISCO:
    official_name: A ocorrência cumpre condições básicas de risco?
    translated_name: Occurrence meets basic risk conditions
    description: 'Whether the occurrence meets the basic risk conditions for plague (1 yes,
      2 no, 9 unknown); one of the three criteria for confirming a case.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 33
  DT_S1:
    official_name: Data da coleta S1
    translated_name: Date of first sample
    description: When the first serum was taken, on the plague investigation form.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 38 (Data da coleta S1)
  DT_S2:
    official_name: Data da coleta S2
    translated_name: Date of second sample
    description: 'When the second serum was taken. The paired sample that confirms
      plague by a rising titre.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 39 (Data da coleta S2)
  ELISA1:
    official_name: Resultado da sorologia para ELISA – S1
    translated_name: ELISA result - 1st sample
    description: 'ELISA serology result on the first serum sample (S1): reactive, non-reactive,
      inconclusive, or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 40 (Resultado da sorologia para ELISA – S1)
  ELISA2:
    official_name: Resultado da sorologia para ELISA – S2
    translated_name: ELISA result - 2nd sample
    description: 'ELISA serology result on the second serum sample (S2), paired with ELISA1.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 41 (Resultado da sorologia para ELISA – S2)
  EPI_PESTE:
    official_name: O caso está associado a eventos positivos de importância epidemiológica
      para peste?
    translated_name: Case linked to epidemiologically important plague events
    description: 'Whether the case is associated with positive events of epidemiological importance
      for plague, such as rodent die-offs or positive animal findings (1 yes, 2 no, 9 unknown).

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 34
  HEMO_IGG:
    official_name: Resultado da hemoaglutinação – IgG
    translated_name: Hemagglutination result – IgG
    description: 'IgG result of the hemagglutination test for plague: reactive, non-reactive,
      inconclusive, or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 41 (Resultado da hemoaglutinação – IgG)
  HEMO_IGM:
    official_name: Resultado da hemoaglutinação – IgM
    translated_name: Hemagglutination result – IgM
    description: 'IgM result of the hemagglutination test for plague: reactive, non-reactive,
      inconclusive, or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 41 (Resultado da hemoaglutinação – IgM)
  IGG_T2:
    official_name: Resultado da hemoaglutinação – IgG título
    translated_name: Hemagglutination IgG titre
    description: 'Titre of the IgG hemagglutination test, filled when HEMO_IGG was done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 41 (Resultado da hemoaglutinação – IgG título)
  IGM_T1:
    official_name: Resultado da hemoaglutinação – IgM título
    translated_name: Hemagglutination IgM titre
    description: 'Titre of the IgM hemagglutination test, filled when HEMO_IGM was done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 41 (Resultado da hemoaglutinação – IgM título)
  LAB_ESFR:
    official_name: Exame bacteriológico – esfregaço
    translated_name: Smear microscopy result
    description: 'Result of the bacteriological smear for Yersinia pestis: positive, negative,
      inconclusive, or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 37 (Exame bacteriológico – esfregaço)
  LAB_HEMO:
    official_name: Exame bacteriológico – hemocultura
    translated_name: Blood/bubo culture result
    description: 'Result of the blood culture for Yersinia pestis: positive, negative, inconclusive,
      or not done.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 37 (Exame bacteriológico – hemocultura)
  SIN_GANG:
    official_name: Sintomatologia específica – ganglionar
    translated_name: Bubo (swollen lymph node)
    description: 'Clinical-signs checklist item marking presence of a bubo — a painful,
      swollen lymph node — the hallmark clinical sign of bubonic plague.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 36 (Sintomatologia específica – ganglionar)
  SIN_PULM:
    official_name: Sintomatologia específica – pulmonar
    translated_name: Pulmonary signs (flag)
    description: 'Whether the patient had pulmonary signs or symptoms — distinguishes
      the highly lethal, person-to-person-transmissible pneumonic form of plague from
      the bubonic and septicemic forms.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 36 (Sintomatologia específica – pulmonar)
  TRATADO:
    official_name: Caso tratado
    translated_name: Treated (flag)
    description: 'Whether the plague patient received treatment (typically streptomycin
      or doxycycline).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Peste — http://portalsinan.saude.gov.br/images/documentos/Agravos/Peste/DIC_DADOS_Peste_v5.pdf,
      campo 42 (Caso tratado)
