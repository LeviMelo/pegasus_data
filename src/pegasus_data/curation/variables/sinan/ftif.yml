    source: inferred
    reasoning: D(8) date; the second stool culture.
  DT_COPRO3:
    official_name: Data da terceira coprocultura
    translated_name: Date of third stool culture
    description: When the third stool sample was taken.
    code_system: none
    source: inferred
    reasoning: D(8) date; the third stool culture.
  DT_HEMO1:
    official_name: Data da hemocultura
    translated_name: Date of blood culture
    description: When blood was taken for culture, which bounds how sensitive the result
