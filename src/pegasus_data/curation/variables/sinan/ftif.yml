    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 46 "Hemocultura"
  HEMO_D_3:
    official_name: Hemocultura - Resultado da 3° coleta - Especificar
