      '
    code_system: none
    source: inferred
    reasoning: 'COPRO abbreviates coprocultura; 30-character width is free text despite
      the D suffix, unlike a true date field.

      '
  COPRO_D_2:
    official_name: Coprocultura - resultado (2)
    translated_name: Stool culture - result (2)
    description: 'Second of the COPRO_D_1-3 stool-culture result series; see COPRO_D_1.

      '
    code_system: none
    source: inferred
    reasoning: Same evidence as COPRO_D_1; distinguished only by ordinal position.
  COPRO_D_3:
    official_name: Coprocultura - resultado (3)
    translated_name: Stool culture - result (3)
    description: 'Third of the COPRO_D_1-3 stool-culture result series; see COPRO_D_1.

