      '
    code_system: none
    source: inferred
    reasoning: CONSTIPA abbreviates constipação; 1-character width matches a binary
      flag.
  CONT_OUT:
    official_name: Contato outro
    translated_name: Other contact type
    description: 'Free-text field for a type of contact/exposure not covered by the
      form''s standard contact-tracing options.

      '
    code_system: none
    source: inferred
    reasoning: CONT abbreviates contato; OUT plus 30-character width fits the "other,
