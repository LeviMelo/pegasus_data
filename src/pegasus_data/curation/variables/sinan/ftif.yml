# SINAN.FTIF —
#
# one notification of typhoid fever
system: SINAN
asserted_by: pegasus_data

variables:
  AMPICILINA:
    official_name: Antibióticos utilizados no tratamento - Ampicilina
    translated_name: Ampicillin
    description: 'Sim/Não flag for whether ampicillin was the antibiotic used to treat
      the case, one item in a per-drug treatment checklist alongside CLORAFEN, SULFA
      and QUINOLONA — most plausibly on the bacterial meningitis (Meningite) investigation
      form.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 47 (Antibióticos utilizados no tratamento – Ampicilina)
  ANTIBIOTIC:
    official_name: Uso prévio de antibiótico
    translated_name: Prior antibiotic use
    description: 'Whether antibiotics were taken before the samples. Prior antibiotics
      sterilise the cultures, so this field is what a negative result has to be read
      against.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag preceding the culture block.
  ANT_OUTR:
    official_name: Antibióticos utilizados no tratamento - Outro
    translated_name: Antibiotic used - other
    description: Whether the patient was treated with another antibiotic not listed on
      the form (named in ANT_OUT_D).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 47 (Antibióticos utilizados no tratamento – Outro)
  ANT_OUT_D:
    official_name: Antibióticos - Se outros, especificar
    translated_name: Other antibiotic (specify)
    description: Free-text name of the other antibiotic used in treatment (see ANT_OUTR).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 47 (Se outros, especificar)
  ASSINTOMAT:
    official_name: Sinais e sintomas - Assintomático
    translated_name: Asymptomatic
    description: 'Sim/Não flag for whether the case presented no symptoms at the time
      recorded on the form.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 37 (Sinais e sintomas – Assintomático)
  ATENDIMENT:
    official_name: Local de atendimento
    translated_name: Care setting
    description: 'Whether the patient was treated in hospital, as an outpatient, at
      home, or not at all. Typhoid needing admission is a different severity from typhoid
      treated at a clinic.

      '
    code_system: internal
    source: def
    source_ref: HOSPAMB.CNV
    reasoning: 'Bound to HOSPAMB, whose values are hospitalar, ambulatorial, domiciliar
      and nenhum.

      '
  CLORAFEN:
    official_name: Antibióticos utilizados no tratamento - Cloranfenicol
    translated_name: Chloramphenicol
    description: 'Sim/Não flag for whether chloramphenicol was the antibiotic used
      to treat the case, sibling of AMPICILINA in the same per-drug bacterial meningitis
      treatment checklist.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 47 (Antibióticos utilizados no tratamento – Cloranfenicol)
  COMP_OUT:
    official_name: Outra complicação
    translated_name: Other complication
    description: Any complication the named items do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the complications block.
  COMP_OUT_D:
    official_name: Complicações - Se outras, especificar
    translated_name: Other complication (description)
    description: 'Free-text field describing a clinical complication not covered by
      the form''s standard complication checklist.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 38 (Complicações – Se outras, especificar)
  CONSTIPA:
    official_name: Sinais e sintomas - Constipação
    translated_name: Constipation
    description: Whether the typhoid fever patient presented constipation.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 37 (Sinais e sintomas – Constipação)
  CONT_OUT:
    official_name: Contato compatível com caso de febre tifóide - Se outros, especificar
    translated_name: Other contact with a typhoid case (specify)
    description: Free text describing another type of contact with a similar case in the
      45 days before symptom onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 33 (Contato compatível com caso de febre tifóide – Se outros, especificar)
  COPRO_D_1:
    official_name: Coprocultura - Resultado da 1ª coleta (especificar)
    translated_name: Stool culture - result of collection 1 (specify)
    description: Free-text result of the stool culture from collection 1 (e.g. organism
      isolated).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 46 (Coprocultura – Resultado da 1ª coleta, especificar)
  COPRO_D_2:
    official_name: Coprocultura - Resultado da 2ª coleta (especificar)
    translated_name: Stool culture - result of collection 2 (specify)
    description: Free-text result of the stool culture from collection 2 (e.g. organism
      isolated).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 46 (Coprocultura – Resultado da 2ª coleta, especificar)
  COPRO_D_3:
    official_name: Coprocultura - Resultado da 3ª coleta (especificar)
    translated_name: Stool culture - result of collection 3 (specify)
    description: Free-text result of the stool culture from collection 3 (e.g. organism
      isolated).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 46 (Coprocultura – Resultado da 3ª coleta, especificar)
  COPRO_R1:
    official_name: Resultado da primeira coprocultura
    translated_name: First stool culture result
    description: 'What the first stool culture grew. Three are taken; persistent growth
      after recovery identifies a chronic carrier, who is the source that keeps typhoid
      circulating.

      '
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the first of three stool cultures.
  COPRO_R2:
    official_name: Resultado da segunda coprocultura
    translated_name: Second stool culture result
    description: What the second stool culture grew. See COPRO_R1.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the second of three stool cultures.
  COPRO_R3:
    official_name: Resultado da terceira coprocultura
    translated_name: Third stool culture result
    description: What the third stool culture grew. See COPRO_R1.
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: Bound to SALMONELA; the third of three stool cultures.
  DIAS:
    official_name: Tempo de uso (dias)
    translated_name: Duration of antibiotic use (days)
    description: Number of days the antibiotic was used in treatment.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 47 (Tempo de uso (dias))
