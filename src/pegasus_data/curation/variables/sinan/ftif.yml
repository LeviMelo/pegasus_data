      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: FEZES reads fezes; a specimen flag.
  HEMO_D_1:
    official_name: Hemocultura - Resultado da 1° coleta - Especificar
    translated_name: 1st blood culture - result, specified
    description: 'Free-text field naming the organism when the coded 1st blood-culture
