    source: inferred
    reasoning: DIAS reads days; 2-character width fits a small day count.
  DT_COPRO1:
    official_name: Data da primeira coprocultura
    translated_name: Date of first stool culture
    description: When the first stool sample was taken for culture.
    code_system: none
    source: inferred
    reasoning: D(8) date; COPRO reads coprocultura.
  DT_COPRO2:
    official_name: Data da segunda coprocultura
