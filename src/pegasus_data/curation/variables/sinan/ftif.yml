  COPRO_D_1:
    official_name: Coprocultura - resultado (1)
    translated_name: Stool culture - result (1)
    description: 'Free-text result/detail from a coprocultura (stool culture) exam,
      first of a numbered series (COPRO_D_1-3) mirroring SINAN''s HEMO_D_1-3 hemoculture
