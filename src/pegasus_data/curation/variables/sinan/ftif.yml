  PERFURA:
    official_name: Perfuração intestinal
    translated_name: Intestinal perforation
    description: 'Intestinal perforation. The other classic complication, and a surgical
      emergency with high mortality.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PERFURA reads perfuração; a yes/no complication flag.
  PULSO:
    official_name: Sinais e sintomas - Dissociação pulso/temperatura
    translated_name: Relative bradycardia (pulse-temperature dissociation)
    description: 'Whether the typhoid fever (FTIF) patient shows the classic relative
      bradycardia - pulse rate lower than expected for the fever - one of the clinical-sign
      checkboxes on the form.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 37 (Sinais e sintomas – Dissociação pulso/temperatura)
  QUINOLONA:
    official_name: Antibióticos utilizados no tratamento - Quinolona
    translated_name: Quinolone antibiotic used
    description: 'Whether a quinolone-class antibiotic (e.g. ciprofloxacin) was part
      of the typhoid fever patient''s treatment, a named-drug checkbox distinct from
      the free-text OUTR_D1-D3 fields for other antibiotics.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Febre Tifóide v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Febre-Tifoide/DIC_DADOS_Febre_Tifoide_v5.pdf,
      campo 47 (Antibióticos utilizados no tratamento – Quinolona)
  SANGUE:
    official_name: Coleta de sangue
    translated_name: Blood collected
    description: 'Whether blood was taken for culture. Blood culture is most sensitive
      in the first week of illness, before stool culture becomes useful.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: SANGUE reads sangue; a specimen flag.
  SUGE_VINCU:
