      '
    code_system: none
    source: inferred
    reasoning: 'COMP most plausibly abbreviates complicação; the OUT_D suffix matches
      SINAN''s recurring outro/descrição free-text pattern (compare ANT_OUT_D, DS_OUTR_LO).

      '
  CONSTIPA:
    official_name: Constipação
    translated_name: Constipation
    description: 'Sim/Não flag for constipation, a symptom on a gastrointestinal clinical-symptom
