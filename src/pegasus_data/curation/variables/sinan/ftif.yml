    code_system: none
    source: inferred
    reasoning: D(8) date; HEMO reads hemocultura.
  DT_HEMO2:
    official_name: Data - hemocultura (2)
    translated_name: Date - blood culture (2)
    description: 'Date the second hemoculture (blood culture) sample was collected;
