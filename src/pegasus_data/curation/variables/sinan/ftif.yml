      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ENTERO reads enterorragia; a yes/no complication flag.
  ESPLENO:
    official_name: Sinais e sintomas - Esplenomegalia
    translated_name: Symptom - splenomegaly
    description: 'Whether the typhoid fever patient had splenomegaly (enlarged spleen),
