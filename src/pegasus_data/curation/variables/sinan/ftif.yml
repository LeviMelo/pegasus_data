      campo 46 (Urocultura – Data da 3ª coleta)
  ENTERO:
    official_name: Enterorragia
    translated_name: Intestinal bleeding
    description: 'Intestinal bleeding. One of the two classic complications of typhoid,
      both arising in the third week as the ulcerated Peyer''s patches erode.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ENTERO reads enterorragia; a yes/no complication flag.
  ESPLENO:
    official_name: Sinais e sintomas - Esplenomegalia
    translated_name: Symptom - splenomegaly
    description: 'Whether the typhoid fever patient had splenomegaly (enlarged spleen),
      one item of a fixed symptom checklist (with febre, cefaléia, diarréia, roséola
      tífica and others) auto-filled "Não" for every item when ASSINTOMAT is Sim.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 37 "Sinais e sintomas"
  FEZES:
    official_name: Coleta de fezes
    translated_name: Stool collected
    description: 'Whether stool was taken. More useful later in the illness than blood,
      and the specimen that identifies chronic carriers.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: FEZES reads fezes; a specimen flag.
  HEMO_D_1:
    official_name: Hemocultura - Resultado da 1° coleta - Especificar
    translated_name: 1st blood culture - result, specified
    description: 'Free-text field naming the organism when the coded 1st blood-culture
      result (HEMO_R1) is not a plain Salmonella positive/negative call — e.g. an "outro
      agente" identified. Part of the typhoid fever form''s up-to-three-draw hemocultura
      block; sibling to HEMO_D_2 and HEMO_D_3.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 46 "Hemocultura"
  HEMO_D_2:
    official_name: Hemocultura - Resultado da 2° coleta - Especificar
    translated_name: 2nd blood culture - result, specified
    description: 'Same free-text role as HEMO_D_1 but for the patient''s second blood-culture
      draw, paired with the coded result HEMO_R2.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 46 "Hemocultura"
  HEMO_D_3:
    official_name: Hemocultura - Resultado da 3° coleta - Especificar
    translated_name: 3rd blood culture - result, specified
    description: 'Same free-text role as HEMO_D_1/HEMO_D_2 for the patient''s third
      blood-culture draw, paired with the coded result HEMO_R3.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 46 "Hemocultura"
  HEMO_R1:
    official_name: Resultado da hemocultura
    translated_name: Blood culture result
    description: 'What the blood culture grew: Salmonella Typhi, another Salmonella,
      nothing, or a different agent. Only S. Typhi confirms typhoid — other Salmonella
      means a different illness entirely.

      '
    code_system: internal
    source: def
    source_ref: SALMONELA.CNV
    reasoning: 'Bound to SALMONELA, whose values are Salmonella Typhi, Salmonella SPP,
      negativo and outro agente.

      '
  HEMO_R2:
    official_name: Hemocultura - Resultado da 2° coleta
    translated_name: 2nd blood culture result
    description: 'Coded result of the patient''s second blood culture: 1 Salmonella
      typhi, 2 Salmonella SPP, 3 Negativo, 4 Outro agente (specified in HEMO_D_2).
      Only collected if SANGUE (material coletado) is Sim.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 46 "Hemocultura Resultado da
      2° coleta"
  HEMO_R3:
    official_name: Hemocultura - Resultado da 3° coleta
    translated_name: 3rd blood culture result
    description: 'Same coding as HEMO_R2 (1 Salmonella typhi, 2 Salmonella SPP, 3 Negativo,
      4 Outro agente) for the patient''s third blood-culture draw.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Febre_Tifoide_v5.pdf, campo 46 "Hemocultura Resultado da
      3° coleta"
  OUTR_D1:
