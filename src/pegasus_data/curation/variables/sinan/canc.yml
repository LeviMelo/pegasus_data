# SINAN.CANC —
#
# one notification of work-related cancer
system: SINAN
asserted_by: pegasus_data

variables:
  ALCATRAO:
    official_name: Exposição ocupacional - Alcatrão, breu, betume, hulha mineral, parafina
    translated_name: Occupational exposure - Tar, pitch, bitumen, mineral coal, paraffin
      and their products or residues
    description: Whether the worker was exposed to tar, pitch, bitumen, mineral coal,
      paraffin and their products or residues at work at any time during their working
      life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Alcatrão, breu, betume, hulha mineral,
      parafina e produtos ou resíduos dessas substâncias
  AMINA:
    official_name: Exposição ocupacional - Aminas aromáticas
    translated_name: Occupational exposure - Aromatic amines
    description: Whether the worker was exposed to aromatic amines at work at any time
      during their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Aminas aromáticas
  BENZENO:
    official_name: Exposição ocupacional - Benzeno ou seus homólogos tóxicos
    translated_name: Occupational exposure - Benzene or its toxic homologues
    description: Whether the worker was exposed to benzene or its toxic homologues at
      work at any time during their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Benzeno ou seus homólogos tóxicos
  CADMIO:
    official_name: Exposição ocupacional - Cádmio ou seus compostos
    translated_name: Occupational exposure - Cadmium or its compounds
    description: Whether the worker was exposed to cadmium or its compounds at work at
      any time during their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Cádmio ou seus compostos
  CROMO:
    official_name: Exposição ocupacional - Cromo ou seus compostos tóxicos
    translated_name: Occupational exposure - Chromium or its toxic compounds
    description: Whether the worker was exposed to chromium or its toxic compounds at
      work at any time during their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Cromo ou seus compostos tóxicos
  HIDROCARBO:
    official_name: Agentes de Exposição - Hidrocarbonetos
    translated_name: Occupational exposure - hydrocarbons
    description: 'Whether the patient was ever occupationally exposed to aliphatic
      or aromatic hydrocarbons (or their halogenated derivatives), one item of a fixed
      lifetime-carcinogen-exposure checklist on the work-related-cancer form (with
      BERILIO, SILICA, CROMO, NIQUEL and others).

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Cancer_v5.pdf, campo 49 "Houve exposição nos locais de
      trabalho"
  HORMONIO:
    official_name: Agentes de Exposição - Hormônios
    translated_name: Occupational exposure - hormones
    description: 'Whether the patient was ever occupationally exposed to hormones as
      a suspected carcinogen, sibling item to HIDROCARBO on the same work-related-cancer
      lifetime-exposure checklist.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Cancer_v5.pdf, campo 49 "Houve exposição nos locais de
      trabalho"
  IONIZANTES:
    official_name: Agentes de Exposição - Radiações Ionizantes
    translated_name: Occupational exposure - ionizing radiation
    description: 'Whether the patient was ever occupationally exposed to ionizing radiation,
      sibling item to HIDROCARBO and HORMONIO on the work-related-cancer form''s lifetime
      carcinogen-exposure checklist.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_Cancer_v5.pdf, campo 49 "Houve exposição nos locais de
      trabalho"
  NAO_IONIZA:
    official_name: Exposição ocupacional - Radiações não ionizantes
    translated_name: Occupational exposure - Non-ionizing radiation
    description: Whether the worker was exposed to non-ionizing radiation at work at any
      time during their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Radiações não ionizantes
  NEOPLASICO:
    official_name: Exposição ocupacional - Antineoplásicos
    translated_name: Occupational exposure - Antineoplastic drugs
    description: Whether the worker was exposed to antineoplastic (chemotherapy) drugs
      at work at any time during their working life. Not a confirmation of the cancer
      diagnosis.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Antineoplásicos
  NIQUEL:
    official_name: Exposição ocupacional - Compostos de níquel
    translated_name: Occupational exposure - Nickel compounds
    description: Whether the worker was exposed to nickel compounds at work at any time
      during their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Composto de níquel
  OLEOS:
    official_name: Exposição ocupacional - Óleos minerais
    translated_name: Occupational exposure - Mineral oils
    description: Whether the worker was exposed to mineral oils at work at any time during
      their working life.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – DRT Câncer Relacionado ao Trabalho v5
      — http://portalsinan.saude.gov.br/images/documentos/Agravos/drtc/DIC_DADOS_DRT_Cancer_v5.pdf,
      campo 49 (Houve exposição nos locais de trabalho, durante toda a sua vida profissional,
      a algum dos itens abaixo relacionados?) – Óleos minerais
