# SINAN.LEPT —
#
# one notification of leptospirosis
system: SINAN
asserted_by: pegasus_data

variables:
  ANT_ANIMAI:
    official_name: Casos Anteriores de Leptospirose... Casos Animais
    translated_name: Prior leptospirosis at the probable infection site - animal cases
    description: 'Whether animals were known to have had leptospirosis at the site
      where the patient was probably infected, in the two months before the investigation
      — a local-outbreak indicator, not the patient''s own medical history.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 34
  ANT_CB_CAI:
    official_name: Contato com caixa d'água
    translated_name: Contact with a water tank
    description: 'Contact with a water tank. The ANT_CB_ block enumerates specific
      exposures, and a contaminated tank is a recognised urban source.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CB_CAI reads caixa d'água; a yes/no exposure flag.
  ANT_CB_CAR:
    official_name: Antecedente - contato com carcaça de animal
    translated_name: Contact with animal carcass (antecedent)
    description: 'Whether the leptospirosis patient had contact with an animal carcass
      in the 30 days before symptoms, one of several epidemiological-antecedent exposure
      checkboxes (alongside floodwater, mud, sewage, rodents) used to trace the contamination
      source.

      '
    code_system: none
    source: inferred
    reasoning: 'ANT_ = antecedente epidemiológico, a standard leptospirosis section; CB_CAR
      most plausibly abbreviates carcaça/cadáver de animal, a known exposure route for
      Leptospira; decode of CB_CAR is uncertain. Reviewed 2026-09-28: no documentation
      found (searched the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET,
      and the web for a SINAN Windows 2000-2006 leptospirosis layout; the column occurs
      only in the 2000-2006 files).'
  ANT_CB_COR:
    official_name: Situação de Risco - Rio, córrego, lagoa ou represa
    translated_name: Risk exposure - river, stream, lagoon, or dam
    description: 'Whether the patient had contact with water from a river, stream,
      lagoon, or dam in the 30 days before symptom onset — a classic leptospirosis
      exposure route via Leptospira-contaminated fresh water.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_CRI:
    official_name: Situação de Risco - Criação de animais
    translated_name: Risk exposure - raising or keeping animals
    description: 'Whether the patient kept or worked with livestock or other domestic
      animals in the 30 days before symptoms began, since animal urine is a common
      source of Leptospira contamination.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_FOS:
    official_name: Situação de Risco - Fossa, caixa de gordura ou esgoto
    translated_name: Risk exposure - septic tank, grease trap, or sewage
    description: 'Whether the patient had contact with a septic tank, grease trap,
      or open sewage in the 30 days before symptoms, a known leptospirosis exposure
      route through rodent-contaminated waste water.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_GRA:
    official_name: Contato com criação de animais
    translated_name: Contact with livestock
    description: 'Contact with livestock. Cattle and pigs shed leptospires in urine,
      making this an occupational exposure for farm and abattoir workers.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: An exposure flag in the ANT_CB_ block.
  ANT_CB_LAM:
    official_name: Situação de Risco - Água ou lama de enchente
    translated_name: Risk exposure - flood water or mud
    description: 'Whether the patient waded through or contacted flood water or mud
      in the 30 days before symptom onset — the single most common leptospirosis exposure
      recorded in Brazilian urban outbreaks.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_LAV:
    official_name: Contato com água/lavagem em local de risco nos últimos 30 dias
    translated_name: Contact with contaminated water for washing (flag)
    description: 'Whether the patient washed clothes/items or otherwise had washing
      contact with potentially contaminated water in the 30 days before symptoms -
      one of several leptospirosis exposure-history checkboxes alongside flood water
      and rodent-contact items.

      '
    code_system: none
    source: inferred
    reasoning: 'ANT_CB_ = antecedente (30-day risk-history block, same naming family as
      the flood/rodent/agriculture items in the LEPT form); LAV = lavagem (washing); lower
      confidence on the exact activity. Reviewed 2026-09-28: no documentation found (searched
      the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET, and
      the web for a SINAN Windows 2000-2006 leptospirosis layout; the column occurs only
      in the 2000-2006 files).'
  ANT_CB_LIM:
    official_name: Antecedente de limpeza de bueiro/córrego
    translated_name: History of cleaning a drain or ditch
    description: 'Whether the leptospirosis patient cleaned a storm drain, culvert,
      or ditch before symptom onset — a recognized urban exposure to rodent-urine-contaminated
      water.

      '
    code_system: none
    source: inferred
    reasoning: 'Agravo is LEPT; ANT_ is the antecedente/exposure prefix, CB/LIM read as
      "bueiro/limpeza"; C1 width fits a coded yes/no exposure item alongside CON_TERREN
      on the same form. Reviewed 2026-09-28: no documentation found (searched the SINAN
      NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET, and the web for
      a SINAN Windows 2000-2006 leptospirosis layout; the column occurs only in the 2000-2006
      files).'
  ANT_CB_LIX:
    official_name: Situação de Risco - Lixo/Entulho
    translated_name: Risk exposure - garbage or rubble
    description: 'Whether the patient had contact with uncollected garbage or construction
      rubble in the 30 days before symptoms — sites that attract the rodents whose
      urine spreads Leptospira bacteria.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_OUT:
    official_name: Situação de Risco - Outras
    translated_name: Risk exposure - other
    description: 'Whether the patient reported a leptospirosis risk exposure not covered
      by the listed categories (water, animals, sewage, rodents, garbage); 1=Sim enables
      a free-text field naming the exposure.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_PLA:
    official_name: Contato com plantação
    translated_name: Contact with crops
    description: 'Work or contact with planted land. The rural counterpart to the urban
      flooding exposures, and the route for cane and rice workers.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CB_PLA reads plantação; an exposure flag.
  ANT_CB_ROE:
    official_name: Situação de Risco - Roedores diretamente
    translated_name: Risk exposure - direct contact with rodents
    description: 'Whether the patient had direct contact with rodents (rats, mice)
      in the 30 days before symptom onset, the primary animal reservoir that sheds
      Leptospira in its urine.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 33
  ANT_CB_SIN:
    official_name: Contato com sinusite ou fossa
    translated_name: Contact with a cesspit
    description: Contact with a cesspit or septic system, a route through contaminated
      water.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: An exposure flag in the ANT_CB_ block.
  ANT_CB_TER:
    official_name: Contato com terreno baldio
    translated_name: Contact with waste ground
    description: 'Contact with waste ground. Rat habitat, and the exposure most associated
      with urban cases outside flood periods.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CB_TER reads terreno baldio; an exposure flag.
  ANT_HUMANO:
    official_name: Casos Anteriores de Leptospirose... Casos Humanos
    translated_name: Prior leptospirosis at the probable infection site - human cases
    description: 'Whether other people were known to have had leptospirosis at the
      site where the patient was probably infected, in the two months before the investigation
      began.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 34
  ANT_OU_DES:
    official_name: Situações de risco - Outras (especificar)
    translated_name: Other risk situation (specify)
    description: Free text naming another risk situation in the 30 days before symptom
      onset, filled when ANT_CB_OUT = Sim.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      campo 33 (Situações de risco – Outras, especificar)
  ATE_DT_ALT:
    official_name: Data de Alta
    translated_name: Hospital discharge date
    description: 'Calendar date the Leptospirose patient was discharged from hospital,
      recorded only when an admission date is present; must fall on or after that admission
      date.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 39
  CLI_CONGES:
    official_name: Sinais e sintomas - Congestão conjuntival
    translated_name: Signs and symptoms - conjunctival congestion
    description: 'Whether the patient showed conjunctival congestion — visibly reddened,
      engorged eyes without discharge — a clinical sign distinctive enough to help
      separate leptospirosis from other febrile illnesses.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 36
  CLI_DESC_O:
    official_name: Descrição de outro sinal/sintoma
    translated_name: Other clinical sign (free-text)
    description: 'Free-text description of a leptospirosis clinical sign or symptom
      not covered by the form''s itemized checkboxes, filled in when an "other" option
      in the clinical-findings section is marked.

      '
    code_system: none
    source: inferred
    reasoning: 'CLI_ = clínico, DESC = descrição, O = outro; C30 width supports free text
      rather than a coded value, matching the "other, specify" pattern used elsewhere
      on SINAN forms. Reviewed 2026-09-28: no documentation found (searched the SINAN
      NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET, and the web for
      a SINAN Windows 2000-2006 leptospirosis layout; the column occurs only in the 2000-2006
      files).'
  CLI_HEMOPU:
    official_name: Hemorragia pulmonar
    translated_name: Pulmonary haemorrhage
    description: 'Bleeding into the lungs. The most lethal form of leptospirosis, killing
      faster than the jaundice-and-kidney-failure presentation and often within hours.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: HEMOPU reads hemorragia pulmonar; a clinical flag.
  CLI_MENING:
    official_name: Sinais e sintomas - Meningismo
    translated_name: Signs and symptoms - meningismus
    description: 'Whether the patient showed meningismus — meningitis-like signs such
      as neck stiffness and headache without confirmed central-nervous-system infection
      — a recognized complication of severe leptospirosis.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Leptospirose_v5.pdf, campo 36
  CLI_OTRDES:
    official_name: Sinais e sintomas - Outros (especificar)
    translated_name: Other signs and symptoms (specify)
    description: Free text naming another sign or symptom, filled when CLI_OUTROS = Sim.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      campo 36 (Sinais e sintomas – Outros, se outras especificar)
  CLI_PANTUR:
    official_name: Sinais e sintomas - Dor na panturrilha
    translated_name: Clinical - calf pain
    description: 'Sim/Não flag for dor na panturrilha (calf pain/myalgia), a hallmark
      clinical sign of leptospirosis rather than the meningitis-oriented CLI_ fields
      around it.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      campo 36 (Sinais e sintomas – Dor na panturrilha)
  CLI_PROST:
    official_name: Prostração
    translated_name: Prostration
    description: Marked prostration, part of the severe systemic phase.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PROST reads prostração; a yes/no clinical flag.
  CON_ALIMEN:
    official_name: Contato com alimento contaminado
    translated_name: Contact with contaminated food/water
    description: 'Whether the leptospirosis patient consumed food or water suspected
      of contamination by rodent urine, one of several exposure-history items on the
      form.

      '
    code_system: none
    source: inferred
    reasoning: 'LEPT form; CON_ contexto/contact prefix, ALIMEN reads "alimento"; C1 width
      matches sibling exposure flags CON_TERREN and ANT_CB_LIM. Reviewed 2026-09-28: no
      documentation found (searched the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def
      in TAB_SINANNET, and the web for a SINAN Windows 2000-2006 leptospirosis layout;
      the column occurs only in the 2000-2006 files).'
  CON_ANIMAI:
    official_name: Contato com animais
    translated_name: Contact with animals (exposure flag)
    description: 'Whether the patient had contact with animals (rats, dogs, cattle,
      etc.) before symptom onset — an exposure question distinct from CON_ENCHEN, the
      flood-water contact question, on the leptospirosis antecedents checklist.

      '
    code_system: none
    source: inferred
    reasoning: 'C1 flag; CON_=contato per prefix convention, ANIMAI=animais. Reviewed
      2026-09-28: no documentation found (searched the SINAN NET Leptospirose v5 data
      dictionary, LeptoNET.def in TAB_SINANNET, and the web for a SINAN Windows 2000-2006
      leptospirosis layout; the column occurs only in the 2000-2006 files).'
  CON_CLAS_E:
    official_name: Classificação da exposição
    translated_name: Exposure classification
    description: 'Coded or short-text classification of how the leptospirosis patient
      was likely exposed (e.g. urban flooding, occupational, recreational water contact),
      summarizing the exposure-history section.

      '
    code_system: none
    source: inferred
    reasoning: 'LEPT form; CON_ prefix with CLAS_E reading "classificação"; wider C20
      width fits a short descriptive category rather than a single flag. Reviewed 2026-09-28:
      no documentation found (searched the SINAN NET Leptospirose v5 data dictionary,
      LeptoNET.def in TAB_SINANNET, and the web for a SINAN Windows 2000-2006 leptospirosis
      layout; the column occurs only in the 2000-2006 files).'
  CON_ENCHEN:
    official_name: Contato com enchente
    translated_name: Contact with flood water (exposure flag)
    description: 'Whether the patient had contact with flood water before symptom onset
      — the single most common leptospirosis exposure route in Brazil, recorded separately
      from general animal contact (CON_ANIMAI).

      '
    code_system: none
    source: inferred
    reasoning: 'C1 flag; ENCHEN=enchente (flood). Reviewed 2026-09-28: no documentation
      found (searched the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET,
      and the web for a SINAN Windows 2000-2006 leptospirosis layout; the column occurs
      only in the 2000-2006 files).'
  CON_ENTULH:
    official_name: Contato com entulho
    translated_name: Contact with rubble/debris
    description: 'Whether the patient had contact with rubble or debris (e.g. after
      flooding or demolition work) before symptom onset - a leptospirosis epidemiological-antecedent
      checkbox distinct from floodwater or sewage exposure.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_ = contato, ENTULH = entulho (rubble); a named exposure item on the
      standard leptospirosis antecedents checklist, C1 width fits a checkbox. Reviewed
      2026-09-28: no documentation found (searched the SINAN NET Leptospirose v5 data
      dictionary, LeptoNET.def in TAB_SINANNET, and the web for a SINAN Windows 2000-2006
      leptospirosis layout; the column occurs only in the 2000-2006 files).'
  CON_ESGOTO:
    official_name: Esgoto no local provável de infecção
    translated_name: Sewage present at likely infection site (flag)
    description: 'Whether open sewage or a septic/grease trap was present at the site
      investigators identified as the likely infection location - an environmental-conditions
      field, distinct from the patient''s own 30-day exposure history (ANT_CB_*).

      '
    code_system: none
    source: inferred
    reasoning: 'CON_ = condições do local provável de infecção; ESGOTO = esgoto; leptospirosis''s
      classic environmental risk factor. Reviewed 2026-09-28: no documentation found (searched
      the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET, and
      the web for a SINAN Windows 2000-2006 leptospirosis layout; the column occurs only
      in the 2000-2006 files).'
  CON_RIO:
    official_name: Contato com rio
    translated_name: Contact with river/stream
    description: 'Whether the patient had contact with a river, stream, or similar
      natural water body before symptoms began, distinguishing this exposure from floodwater,
      sewage, or standing water on the same leptospirosis antecedents checklist.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_ = contato, RIO = rio; matches the pattern of sibling exposure checkboxes
      (CON_ENTULH and others) on the leptospirosis form. Reviewed 2026-09-28: no documentation
      found (searched the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def in TAB_SINANNET,
      and the web for a SINAN Windows 2000-2006 leptospirosis layout; the column occurs
      only in the 2000-2006 files).'
  CON_ROEDOR:
    official_name: Sinais de roedores no local provável de infecção
    translated_name: Signs of rodents at likely infection site (flag)
    description: 'Whether the site identified as the likely infection location showed
      signs of rodent presence - an environmental finding recorded by investigators,
      paired with CON_ESGOTO in the same site-conditions block.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_ = condições do local; ROEDOR = roedor; sibling of CON_ESGOTO. Reviewed
      2026-09-28: no documentation found (searched the SINAN NET Leptospirose v5 data
      dictionary, LeptoNET.def in TAB_SINANNET, and the web for a SINAN Windows 2000-2006
      leptospirosis layout; the column occurs only in the 2000-2006 files).'
  CON_TERREN:
    official_name: Contato com terreno alagado/contaminado
    translated_name: Contact with flooded/contaminated ground
    description: 'Whether the patient had contact with flooded or rodent-infested ground/soil
      before symptom onset, distinct from CON_ALIMEN''s food/water contamination route.

      '
    code_system: none
    source: inferred
    reasoning: 'LEPT form; CON_ prefix, TERREN reads "terreno" (land/ground); C1 width
      matches the other coded exposure flags on the same form. Reviewed 2026-09-28: no
      documentation found (searched the SINAN NET Leptospirose v5 data dictionary, LeptoNET.def
      in TAB_SINANNET, and the web for a SINAN Windows 2000-2006 leptospirosis layout;
      the column occurs only in the 2000-2006 files).'
  CO_MUN_R1:
    official_name: Município 1 (situação de risco)
    translated_name: Municipality of risk situation 1
    description: IBGE code of the municipality where risk situation 1 (see DT_RISCO1)
      occurred in the 30 days before symptom onset. Not a previous residence.
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      Informações complementares, Município 1 (situação de risco)
  CO_MUN_R2:
    official_name: Município 2 (situação de risco)
    translated_name: Municipality of risk situation 2
    description: IBGE code of the municipality where risk situation 2 (see DT_RISCO2)
      occurred in the 30 days before symptom onset. Not a previous residence.
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      Informações complementares, Município 2 (situação de risco)
  CO_MUN_R3:
    official_name: Município 3 (situação de risco)
    translated_name: Municipality of risk situation 3
    description: IBGE code of the municipality where risk situation 3 (see DT_RISCO3)
      occurred in the 30 days before symptom onset. Not a previous residence.
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      Informações complementares, Município 3 (situação de risco)
  CO_MUN_R4:
    official_name: Município 4 (situação de risco)
    translated_name: Municipality of risk situation 4
    description: IBGE code of the municipality where risk situation 4 (see DT_RISCO4)
      occurred in the 30 days before symptom onset. Not a previous residence.
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      Informações complementares, Município 4 (situação de risco)
  CO_UF_R1:
    official_name: UF de residência anterior 1
    translated_name: Previous state of residence 1
    description: 'A state the patient lived in before notification. Four slots exist
      because the disease''s incubation can span years, so residence history is what
      locates the exposure rather than the diagnosis.

      '
    code_system: internal
    codelist: UF_BR
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: C(2) state code; the first of four residence-history slots.
  CO_UF_R2:
    official_name: UF de residência anterior 2
    translated_name: Previous state of residence 2
    description: A second previous state of residence. See CO_UF_R1.
    code_system: internal
    codelist: UF_BR
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: C(2) state code; the second residence-history slot.
  CO_UF_R3:
    official_name: UF de residência anterior 3
    translated_name: Previous state of residence 3
    description: A third previous state of residence. See CO_UF_R1.
    code_system: internal
    codelist: UF_BR
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: C(2) state code; the third residence-history slot.
  CO_UF_R4:
    official_name: UF de residência anterior 4
    translated_name: Previous state of residence 4
    description: A fourth previous state of residence, the last slot the form offers.
    code_system: internal
    codelist: UF_BR
    source: def
    source_ref: UFCCODIG.CNV
    reasoning: C(2) state code; the fourth residence-history slot.
  CS_ZONA:
    official_name: Zona de residência
    translated_name: Residence zone
    description: 'Urban, rural or periurban. Leptospirosis splits along this line:
      urban cases follow flooding and rats, rural ones follow livestock and fieldwork.

      '
    code_system: internal
    source: def
    source_ref: ZONA.CNV
    reasoning: Bound to ZONA, whose values are urbana, rural and periurbana.
  DTIMUNO:
    official_name: Imunohistoquímica - Data da coleta
    translated_name: Immunohistochemistry sample collection date
    description: Date the sample for immunohistochemistry was collected (usually post-mortem
      tissue). AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Leptospirose v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Leptospirose/DIC_DADOS_Leptospirose_v5.pdf,
      campo 57 (Imunohistoquímica – Data da coleta)
  DTISOLA:
    official_name: Isolamento - Data da coleta
    translated_name: Culture isolation sample collection date
    description: Date the sample for Leptospira isolation (culture) was collected. AAAAMMDD.
    code_system: none
