# SINAN.HANT —
#
# one notification of hantavirus infection
system: SINAN
asserted_by: pegasus_data

variables:
  AM_SANGUE:
    official_name: Amostra de sangue
    translated_name: Blood sample
    description: 'Sim/Não flag for whether a blood sample was collected from the patient
      for laboratory testing.

      '
    code_system: none
    source: inferred
    reasoning: 'AM_ abbreviates amostra (sample) and SANGUE is blood; 1-character width
      matches a collection-flag rather than a lab result.

      '
  ANO_DT_SIN:
    official_name: Ano da data dos primeiros sintomas
    translated_name: Year of first-symptoms date
    description: 'Four-digit calendar year derived from DT_SIN_PRI (date of first symptoms)
      — a convenience field for tabulating cases by year of onset rather than year
      of notification, which can lag by weeks.

      '
    code_system: none
    source: inferred
    reasoning: N4 numeric field; name reads ANO (year) + DT_SIN (first-symptoms date),
      a derived rollup.
  ANT_ARAGEM:
    official_name: Antecedente de aragem
    translated_name: 'Exposure: plowing/tilling soil'
    description: 'Whether the patient plowed or tilled soil before symptom onset, a
      rural-exposure question on the hantavirose form since tilling can aerosolize
      rodent excreta. Distinct from ANT_DESMAT (land clearing) and ANT_MOAGEM (grain
      milling).

      '
    code_system: none
    source: inferred
    reasoning: N1 flag; ANT_=antecedente per prefix convention, ARAGEM=aração/aragem
      (plowing).
  ANT_ARRUMO:
    official_name: Antecedente - arrumação de local fechado
    translated_name: Cleaned/tidied an enclosed space (antecedent)
    description: 'Whether the hantavirus patient had recently cleaned or tidied an
      enclosed space (shed, silo, storeroom) before symptoms - a key exposure route
      since disturbing such spaces aerosolizes dried rodent excreta.

      '
    code_system: none
    source: inferred
    reasoning: 'ANT_ = antecedente epidemiológico, ARRUMO = arrumação; cleaning closed
      rural structures is a named risk exposure on the SINAN hantavirose (HANT) investigation
      form.

      '
  ANT_COLHEI:
    official_name: Atividade de colheita nos últimos 30 dias
    translated_name: Harvesting activity in the last 30 days (flag)
    description: 'Whether the patient did crop harvesting (colheita) in the 30 days
      before symptoms - a rural occupational exposure to rodent-contaminated grain
      and dust that is a classic hantavirus risk factor.

      '
    code_system: none
    source: inferred
    reasoning: 'ANT_ = antecedente (30-day exposure history block); COLHEI = colheita;
      HANT series clusters several such rural-activity risk checkboxes (ANT_LAZER,
      ANT_ROEDOR among them).

      '
  ANT_CORTE:
    official_name: Antecedente de corte de mato/roçagem
    translated_name: History of brush-cutting activity
    description: 'Whether the hantavirus patient cut grass, brush, or grain before
      symptom onset — a recognized rural exposure that stirs up rodent-contaminated
      dust and aerosolizes the virus.

      '
    code_system: none
    source: inferred
    reasoning: 'HANT form; ANT_ is the antecedente/exposure-history prefix, CORTE reads
      "corte" (cutting); numeric N1 fits a coded yes/no exposure item.

      '
  ANT_DESMAT:
    official_name: Antecedente de desmatamento
    translated_name: 'Exposure: clearing forest/brush'
    description: 'Whether the patient cleared forest or brush before symptom onset,
      disturbing rodent habitat — one of three rural-activity exposure checkboxes alongside
      ANT_ARAGEM and ANT_MOAGEM.

      '
    code_system: none
    source: inferred
    reasoning: N1 flag; DESMAT=desmatamento (deforestation/clearing).
  ANT_EXPOSI:
    official_name: Antecedente - exposição em área de risco
    translated_name: Risk-area exposure (antecedent)
    description: 'Whether the hantavirus patient was present in a rural or wooded area
      known for rodent activity in the weeks before symptom onset - the general risk-area
      exposure checkbox among the epidemiological antecedents.

      '
    code_system: none
    source: inferred
    reasoning: 'ANT_ = antecedente, EXPOSI = exposição; a broad risk-area item alongside
      the more specific ANT_ARRUMO and ANT_PLANTI on the same hantavirus antecedents
      checklist.

      '
  ANT_LAZER:
    official_name: Atividade de lazer em área de risco nos últimos 30 dias
    translated_name: Recreational activity in risk area (flag)
    description: 'Whether the patient did recreational activity (camping, hiking, fishing)
      in rural or wild terrain in the 30 days before symptoms - a non-occupational
      hantavirus exposure route, distinct from work-related ones like ANT_COLHEI.

      '
    code_system: none
    source: inferred
    reasoning: ANT_ = antecedente; LAZER = lazer; HANT 30-day risk-history block.
  ANT_LIMPEZ:
    official_name: Antecedente de limpeza de local fechado
    translated_name: History of cleaning an enclosed structure
    description: 'Whether the hantavirus patient cleaned a shed, barn, or other closed
      rural structure before symptom onset, a classic aerosol-exposure activity distinct
      from ANT_CORTE''s outdoor brush-cutting.

      '
    code_system: none
    source: inferred
    reasoning: 'HANT form; ANT_ prefix plus LIMPEZ ("limpeza"); pairs with ANT_CORTE
      as one of several exposure-history checkboxes on the same form.

      '
  ANT_MOAGEM:
    official_name: Antecedente de moagem de grãos
    translated_name: 'Exposure: grain milling/threshing'
    description: 'Whether the patient handled or milled stored grain before symptom
      onset — the classic hantavirus exposure route via rodent-contaminated grain dust,
      completing the trio with ANT_ARAGEM and ANT_DESMAT.

      '
    code_system: none
    source: inferred
    reasoning: N1 flag; MOAGEM=moagem (milling/grinding).
  ANT_PLANTI:
    official_name: Antecedente - atividade de plantio
    translated_name: Farming/planting activity (antecedent)
    description: 'Whether the hantavirus patient engaged in planting or farming activity
      before symptoms began - an agricultural exposure route distinct from cleaning
      enclosed spaces (ANT_ARRUMO) on the same antecedents checklist.

      '
    code_system: none
    source: inferred
    reasoning: 'ANT_ = antecedente, PLANTI = plantio; farming/planting is a listed
      rural-exposure item on the SINAN hantavirose antecedents section.

      '
  ANT_ROEDOR:
    official_name: Contato com roedores nos últimos 30 dias
    translated_name: Rodent contact in the last 30 days (flag)
    description: 'Whether the patient had direct contact with or sighted rodents in
      the 30 days before symptoms - the most direct exposure marker for hantavirus,
      which spreads via inhaling aerosolized rodent excreta.

      '
    code_system: none
    source: inferred
    reasoning: ANT_ = antecedente; ROEDOR = roedor; same 30-day risk-history block.
  CLI_ABDOMI:
    official_name: Manifestações clínicas - Dor Abdominal
    translated_name: Abdominal pain
    description: 'Whether the hantavirus-suspect patient reported abdominal pain, one
      item on the clinical-signs checklist: 1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Dor Abdominal"

      '
  CLI_ANGUST:
    official_name: Angústia respiratória
    translated_name: Respiratory distress
    description: 'Clinical-signs checklist item marking respiratory distress, the hallmark
      of the cardiopulmonary phase of Hantavirus Pulmonary Syndrome that this notification
      form exists to catch early.

      '
    code_system: none
    source: inferred
    reasoning: 'HANT form; CLI_ is the clinical-sign prefix, ANGUST reads "angústia";
      numeric N1 matches the coded checkbox pattern of the sign list.

      '
  CLI_ASTENI:
    official_name: Astenia
    translated_name: Weakness
    description: 'Profound weakness in the prodrome. Hantavirus begins as an indistinguishable
      flu-like illness, which is why it is caught late.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ASTENI reads astenia; a yes/no clinical flag.
  CLI_CHOQUE:
    official_name: Choque
    translated_name: Shock
    description: Circulatory shock, the endpoint of the hypotension in CLI_HIPOTE.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CHOQUE reads choque; a clinical flag.
  CLI_DISPNE:
    official_name: Manifestações clínicas - Dispnéia
    translated_name: Dyspnea
    description: 'Whether the patient had dyspnea (difficulty breathing) at presentation,
      one of the checklist signs used to flag hantavirus cardiopulmonary syndrome:
      1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Dispnéia"

      '
  CLI_GARGAN:
    official_name: Dor de garganta
    translated_name: Sore throat (clinical sign)
    description: 'Whether the patient reported sore throat — checked on the hantavirose
      symptom list because its flu-like prodrome typically lacks upper-respiratory
      signs like this and CLI_RINORR, helping rule the case in or out.

      '
    code_system: none
    source: inferred
    reasoning: N1 flag; CLI_=clínico prefix, GARGAN=garganta (throat).
  CLI_H:
    official_name: Quadro clínico - sinal (H)
    translated_name: Clinical sign (H-coded)
    description: 'One of the itemized clinical-sign checkboxes on the hantavirus form,
      most plausibly a hemorrhagic manifestation given the "H" and the single-digit
      coded value; exact symptom not confirmed by other catalog evidence.

      '
    code_system: none
    source: inferred
    reasoning: 'CLI_ = clínico, a standard checkbox-series prefix; the trailing "H"
      most likely abbreviates "hemorragia," a recognized complication of severe hantavirus
      cardiopulmonary syndrome, but confidence is low.

      '
  CLI_HEMO:
    official_name: Manifestação hemorrágica
    translated_name: Bleeding
    description: Bleeding, more prominent in the renal form than the cardiopulmonary
      one.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: HEMO reads hemorrágica; a clinical flag.
  CLI_HIPOTE:
    official_name: Hipotensão
    translated_name: Hypotension
    description: 'Low blood pressure from the cardiogenic shock that accompanies the
      pulmonary phase.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: HIPOTE reads hipotensão; a clinical flag.
  CLI_H_DESC:
    official_name: Outras manifestações Hemorrágicas (especificar)
    translated_name: Other hemorrhagic manifestation, specify
    description: 'Free-text description of the bleeding manifestation the patient showed,
      filled in only when the "other hemorrhagic manifestations" checkbox above it
      is marked yes.

      '
    code_system: none
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 (DBF ds_manifestacao_hemor_outro)

      '
  CLI_LOMBAR:
    official_name: Dor lombar
    translated_name: Lower back pain
    description: 'Lower back pain. More characteristic of the haemorrhagic-with-renal
      form seen in the Old World than of the Brazilian cardiopulmonary form.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: LOMBAR reads lombar; a clinical flag.
  CLI_MIAL_D:
    official_name: Mialgia - detalhamento
    translated_name: Myalgia - additional detail
    description: 'Supplementary free-text detail on the myalgia (muscle pain) reported
      by the hantavirus patient, elaborating the base CLI_MIALGI Sim/Não flag rather
      than duplicating it.

      '
    code_system: none
    source: inferred
    reasoning: 'CLI_ = clínico; MIAL = mialgia, truncated to fit DBF''s 10-character
      field-name limit alongside base flag CLI_MIALGI; width 30 fits free text rather
      than a checkbox. Exact suffix meaning ("D") uncertain.

      '
  CLI_MIAL_G:
    official_name: Mialgia generalizada
    translated_name: Generalised muscle pain
    description: Generalised muscle pain, a prominent prodromal feature.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MIAL_G reads mialgia generalizada; a clinical flag.
  CLI_MUNICI:
    official_name: Município do atendimento clínico
    translated_name: Municipality of clinical care
    description: 'IBGE code of the municipality where the hantavirus patient received
      clinical care, which can differ from the patient''s home municipality when severe
      cases are transferred to a referral hospital.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: inferred
    reasoning: 'HANT form; numeric width N7 matches the standard 7-digit IBGE municipality
      code rather than a 1-character clinical-sign flag, despite the CLI_ prefix shared
      with the sign checkboxes.

      '
  CLI_NEUROL:
    official_name: Manifestações clínicas - Sintomas Neurológicos
    translated_name: Neurological symptoms
    description: 'Whether the patient presented neurological symptoms, one item in
      the hantavirus clinical-signs checklist: 1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Sintomas Neurológicos"

      '
  CLI_OUT_D:
    official_name: Manifestações clínicas / Outros (especificar)
    translated_name: Other clinical manifestation, specify
    description: 'Free-text description of an additional clinical manifestation the
      patient had that is not covered by the named checklist items, enabled only when
      that "other" flag is Sim.

      '
    code_system: none
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 (DBF ds_manifestacao_outro)

      '
  CLI_RESPI:
    official_name: Insuficiência respiratória
    translated_name: Respiratory failure
    description: 'Respiratory failure. The defining event of hantavirus cardiopulmonary
      syndrome: the lungs flood over hours and mortality approaches forty per cent.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: RESPI reads respiratória; a clinical flag.
  CLI_RINORR:
    official_name: Rinorreia
    translated_name: Runny nose / rhinorrhea (clinical sign)
    description: 'Whether the patient had nasal discharge — recorded with CLI_GARGAN
      as a differential-diagnosis clue, since hantavirus''s febrile-myalgic prodrome
      usually lacks the coryza typical of common respiratory infections.

      '
    code_system: none
    source: inferred
    reasoning: N1 flag; RINORR=rinorreia (runny nose).
  CLI_TONTUR:
    official_name: Manifestações clínicas - Tontura/Vertigem
    translated_name: Dizziness/vertigo
    description: 'Whether the patient experienced dizziness or vertigo, one of the
      checklist signs recorded for a suspected hantavirus case: 1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Tontura/Vertigem"

      '
  CLI_TORACI:
    official_name: Manifestações clínicas - Dor Torácica
    translated_name: Chest pain
    description: 'Whether the patient reported chest pain among the checklist of clinical
      signs used to work up a suspected hantavirus case: 1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Dor Torácica"

      '
  CLI_TOSSE:
    official_name: Manifestações clínicas - Tosse Seca
    translated_name: Dry cough
    description: 'Whether the patient had a dry cough, one of the earliest clinical
      signs checked for suspected hantavirus cardiopulmonary syndrome: 1 Sim, 2 Não,
      9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 36 "Tosse Seca"

      '
  CONF_INF_M:
    official_name: Município de confirmação da infecção
    translated_name: Municipality of infection confirmation
    description: 'IBGE code of the municipality where the hantavirus infection was
      confirmed or most likely acquired, distinct from the patient''s residence municipality
      - used to map the probable infection site.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: inferred
    reasoning: 'CONF_ = confirmação, INF = infecção, M = município; N7 numeric width
      matches an IBGE municipality code, and infection-site municipality is a standard
      field in zoonotic-disease investigation.

      '
  CONF_INF_U:
    official_name: UF provável de infecção
    translated_name: State (UF) of probable infection
    description: 'State where the patient most likely acquired hantavirus infection,
      the UF-level component of the probable-infection-site investigation; a sibling
      municipality-level field (not owned here) narrows it further.

      '
    code_system: none
    source: inferred
    reasoning: 'CONF_INF_ = (local de) confirmação/infecção; U = UF, paralleling the
      CON_INF_* municipality/UF/country pattern used elsewhere in SINAN for likely-infection-site
      fields.

      '
  CON_AMB_DE:
    official_name: Consulta ambulatorial (descrição)
    translated_name: Outpatient consultation (description)
    description: 'Free-text note tied to an ambulatory/outpatient consultation recorded
      for the case; the exact sub-question it answers is not resolved from available
      evidence.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_AMB plausibly abbreviates consulta ambulatorial; 30-character width
      fits a short free-text note.

      '
  CON_AREA:
    official_name: Área provável de infecção
    translated_name: Probable infection area
    description: 'Whether infection was probably acquired in an urban, rural or periurban
      area. Almost always rural for hantavirus, which is what distinguishes its geography
      from leptospirosis.

      '
    code_system: internal
    source: def
    source_ref: ZONA.CNV
    reasoning: Bound to ZONA, urbana/rural/periurbana.
  CON_AUTOPS:
    official_name: Se óbito, realizou autópsia
    translated_name: Autopsy performed
    description: 'Whether an autopsy was performed, asked only when the case''s outcome
      field records death from hantavirus or from another cause: 1 Sim, 2 Não, 9 Ignorado.

      '
    code_system: internal
    codelists:
    - SIM_NAO
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 67 "Se óbito, realizou autópsia"

      '
  CON_DIAGNO:
    official_name: Critério de confirmação diagnóstica
    translated_name: Diagnostic confirmation criterion
    description: 'Coded basis on which a hantavirus case was confirmed — laboratory
      evidence versus clinical-epidemiological grounds alone.

      '
    code_system: none
    source: inferred
    reasoning: 'HANT form; CON_ + DIAGNO reads "critério/condição de diagnóstico";
      numeric N1 fits a small enumerated criterion code.

      '
  CON_DIAG_D:
    official_name: Confirmação diagnóstica (nome truncado)
    translated_name: Diagnosis-confirmation flag (truncated field name)
    description: 'Single-character flag from the hantavirose form''s diagnosis section;
      DBF''s 10-character limit truncated the original label. Best read as marking
      how the diagnosis was confirmed (e.g. lab vs. clinical-epidemiological), though
      the exact question isn''t fully recoverable from the evidence available.

      '
    code_system: none
    source: inferred
    reasoning: 'Name is exactly 10 characters (the DBF field-name limit); CON_/DIAG_
      read as condição/diagnóstico but no dictionary or codelist entry survives to
      confirm the precise question.

      '
  CON_FORMA:
    official_name: Confirmação - forma clínica
    translated_name: Confirmation - clinical form
    description: 'Short code for the clinical form/presentation type used to confirm
      the case (e.g. which variant of the disease was diagnosed).

      '
    code_system: none
    source: inferred
    reasoning: 'FORMA reads forma (form/type); 1-character width matches a short enumerated
      code.

      '
  CON_LOCAL2:
    official_name: Contato - local (2)
    translated_name: Contact - location (2)
    description: 'Second instance of a contact/exposure location code, sibling of CON_LOCAL,
      whose observed values (Unidade de Hemoterapia, Domicílio, Laboratório, Outro)
      indicate a blood/procedure-related exposure setting.

      '
    code_system: none
    source: inferred
    reasoning: 'CON_LOCAL is bound to a codelist with exactly those four values in
      this catalog; CON_LOCAL2 shares the prefix and width, consistent with a second
      recorded location for the same case.

      '
  CON_LOCALI:
    official_name: Localidade provável de infecção
    translated_name: Probable infection locality
    description: The specific locality where infection was probably acquired.
    code_system: none
    source: inferred
    reasoning: C(2) locality code in the infection-source block.
  DESMATA_N:
    official_name: Desmatamento
    translated_name: Land clearing
    description: 'Whether the patient was clearing land. Disturbing vegetation raises
      dust from rodent nests, which is the classic exposure.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DESMATA reads desmatamento; an activity exposure flag.
  DORMIU_N:
    official_name: Dormiu em área de risco
    translated_name: Slept in a risk area
    description: 'Whether the patient slept in a risk area. Sleeping in a closed shed
      or hut is a high-exposure setting, since the aerosol concentrates indoors.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: DORMIU reads dormiu; an activity exposure flag.
  DTDIASINAC:
    official_name: Data de início da inatividade
    translated_name: Date incapacity/leave began
    description: 'Date a period of incapacity or work leave (afastamento) began, plausibly
      from an occupational-disease investigation. AAAAMMDD.

      '
    code_system: none
    source: inferred
    reasoning: 'DT + DIAS + INAC most plausibly contracts data + dias de inatividade;
      D8 width matches a full date rather than a day count.

      '
  DT_COL_IGM:
    official_name: Data da coleta de IgM
    translated_name: Date IgM sample taken
    description: 'When the IgM sample was taken. IgM is already present when symptoms
      appear, so unlike most serology a single early sample is diagnostic here.

      '
    code_system: none
    source: inferred
    reasoning: D(8) date in the laboratory block.
  DT_EVOLUC:
    official_name: Data da evolução
    translated_name: Date of outcome
    description: When the outcome was recorded, closing the case.
    code_system: none
    source: inferred
    reasoning: D(8) date in the outcome block.
  DT_RTPCR:
    official_name: Data do RT-PCR
    translated_name: Date of RT-PCR
    description: 'Date an RT-PCR molecular test was performed or resulted. AAAAMMDD.

      '
    code_system: none
    source: inferred
    reasoning: RTPCR is the standard abbreviation for the test.
  DT_TRNASRS:
    official_name: Data de transmissão (RS)
    translated_name: Transmission-route date (RS)
    description: 'Date tied to another suspected exposure route in the same per-route
      antecedents block as DT_TRNASRM (see that entry); the exact route "RS" denotes
      is not resolved.

      '
    code_system: none
    source: inferred
    reasoning: 'Same transposed-letter naming pattern and D8 width as DT_TRNASRM, one
      of several DT_TRANS*/DTTRANS* route-specific date fields.

      '
  EXPO_N:
    official_name: Houve exposição
    translated_name: Exposure occurred
    description: Whether any risk exposure occurred, the gate for the activity flags.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: EXPO reads exposição; the block's opening flag.
  LAB_ATIPIC:
    official_name: Resultado A - Linfócitos Atípicos
    translated_name: Atypical lymphocytes result
    description: 'Whether atypical lymphocytes were seen on the blood exam drawn for
      a suspected hantavirus case: 1 Sim, 2 Não, 3 Não realizado, 9 Ignorado.

      '
    code_system: internal
    source: layout_doc
    source_ref: 'portalsinan.saude.gov.br/images/documentos/Agravos/Hantavirose/DIC_DADOS_Hantavirose_v5.pdf,
      campo 38 "Linfócitos Atípicos"

      '
  LAB_BILATE:
    official_name: Radiografia - infiltrado bilateral
    translated_name: Bilateral pulmonary infiltrates (flag)
    description: 'Whether chest imaging showed bilateral pulmonary infiltrates, the
      radiological hallmark of hantavirus cardiopulmonary syndrome (HCPS), grouped
