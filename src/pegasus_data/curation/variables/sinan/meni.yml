  ANT_DTUL_8:
    official_name: Data da última dose (outra)
    translated_name: Date of last dose of other vaccine
    description: 'Date of the last dose of the other vaccine named in ANT_OU_DE.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – data
      da última dose, outra)
  ANT_DTUL_C:
    official_name: Data da última dose (conjugada meningo C)
    translated_name: Date of last conjugate C dose
    description: Date of the last conjugate meningococcal C dose.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – data
      da última dose, conjugada meningo C)
  ANT_DTUL_T:
    official_name: Data da última dose (hemófilo)
    translated_name: Date of last Hib dose
    description: 'Date of the last Haemophilus influenzae b vaccine dose (tetravalent or Hib).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – data
      da última dose, hemófilo)
  ANT_HEMO_T:
    official_name: Vacina contra Haemophilus influenzae b
    translated_name: Hib vaccine
    description: 'Whether Hib vaccine was given. Its introduction removed Haemophilus
      as a major cause of childhood meningitis, so this flag largely determines whether
      that agent is plausible.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; HEMO names Haemophilus influenzae b.
  ANT_IMUNO:
    official_name: Imunodepressão
    translated_name: Immunosuppression
    description: 'Immunosuppression from any other cause, widening the range of plausible
      organisms in the same way.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no comorbidity flag; IMUNO reads imunodepressão.
  ANT_INF_HO:
    official_name: Infecção hospitalar
    translated_name: Hospital-acquired infection
    description: 'Whether the meningitis was hospital-acquired, typically after neurosurgery.
      The organisms differ from community cases and so does the antibiotic choice.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no comorbidity flag; INF_HO reads infecção hospitalar.
  ANT_IRA:
    official_name: Infecção respiratória aguda
    translated_name: Acute respiratory infection
    description: 'A preceding acute respiratory infection — the usual route by which
      meningococcus and pneumococcus reach the meninges.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no comorbidity flag; IRA is infecção respiratória aguda.
  ANT_OUTRA:
    official_name: Outra vacina
    translated_name: Other vaccine
    description: Whether another relevant vaccine was given.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the vaccination block.
  ANT_OUTRO:
    official_name: Outra condição
    translated_name: Other condition
    description: Any other relevant condition the named flags do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual item of the comorbidity block.
  ANT_OUTR_D:
    official_name: Doenças pré-existentes (outro) – especificar
    translated_name: Other pre-existing disease (specify)
    description: 'Free-text name of another pre-existing disease, filled when ANT_OUTRO is
      yes.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 34 (Doenças pré-existentes
      – outro, especificar)
  ANT_OU_DE:
    official_name: Vacinação (outra) – especificar
    translated_name: Other vaccine, specified
    description: 'Free text naming the other vaccine. Thirty characters of uncontrolled
      vocabulary, so it must be read rather than grouped.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – outra,
      se outra especificar)
  ANT_SECUND:
    official_name: Caso secundário
    translated_name: Secondary case
    description: 'Whether this is a secondary case — someone who caught it from a known
      case. Secondary cases mean prophylaxis failed or was not given, so each is investigated.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; SECUND reads secundário.
  ANT_TRAUMA:
    official_name: Traumatismo craniano
    translated_name: Head injury
    description: 'Previous head injury. A skull fracture can leave a direct route from
      the nose to the meninges and cause recurrent bacterial meningitis.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no comorbidity flag; TRAUMA reads traumatismo.
  ANT_TRIPLI:
    official_name: Vacina tríplice
    translated_name: Triple vaccine
    description: Whether the triple vaccine was given.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; TRIPLI reads tríplice.
  ANT_TUBE:
    official_name: Tuberculose
    translated_name: Tuberculosis
    description: 'Whether the patient has tuberculosis. Tuberculous meningitis is slower
      and needs quite different treatment, so this flag redirects the whole management.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no comorbidity flag; TUBE reads tuberculose.
  ATE_UF_HOS:
    official_name: UF hospital
    translated_name: State of the hospital
    description: 'State (UF) of the hospital where the patient was admitted.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 43 (UF hospital)
  CLA_ME_ASS:
    official_name: Se confirmado, especifique (meningite asséptica)
    translated_name: Aseptic meningitis etiology
    description: 'Final diagnosis code (dictionary Quadro III) for a confirmed case classified
      as aseptic meningitis (CON_DIAGES = 7).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 51 (Se confirmado, especifique
      – 7 Meningite asséptica; Quadro III)
  CLA_ME_BAC:
    official_name: Se confirmado, especifique (meningite por outras bactérias)
    translated_name: Other bacterial meningitis agent
    description: 'Code of the bacterium (dictionary Quadro II) for a confirmed case classified
      as meningitis due to other bacteria (CON_DIAGES = 5).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 51 (Se confirmado, especifique
      – 5 Meningite por outras bactérias; Quadro II)
  CLA_ME_ETI:
    official_name: Se confirmado, especifique (meningite de outra etiologia)
    translated_name: Other-etiology meningitis diagnosis
    description: 'Final diagnosis code (dictionary Quadro IV) for a confirmed case classified
      as meningitis of other etiology (CON_DIAGES = 8).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 51 (Se confirmado, especifique
      – 8 Meningite de outra etiologia; Quadro IV)
  CLA_SOROGR:
    official_name: Se N. meningitidis, especificar sorogrupo
    translated_name: Classification - serogroup
    description: 'Serogroup of Neisseria meningitidis (dictionary Quadro VI), filled for meningococcal
      disease (CON_DIAGES 1–3).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 53 (Se N. meningitidis,
      especificar sorogrupo; Quadro VI)
  CLI_ABAULA:
    official_name: Sinais e sintomas – abaulamento de fontanela
    translated_name: Clinical - bulging fontanelle
    description: 'Sim/Não flag for abaulamento de fontanela (bulging fontanelle), a
      classic infant meningitis sign, part of the CLI_ clinical-symptom checklist alongside
      CLI_COMA, CLI_CONVUL and CLI_RIGIDE.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 40 (Sinais e sintomas
      – abaulamento de fontanela)
  CLI_COMA:
    official_name: Sinais e sintomas – coma
    translated_name: Clinical - coma
    description: 'Sim/Não flag for coma, part of the same meningitis clinical-symptom
      checklist as CLI_ABAULA, CLI_CONVUL and CLI_RIGIDE.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 40 (Sinais e sintomas
      – coma)
  CLI_CONVUL:
    official_name: Sinais e sintomas – convulsões
    translated_name: Clinical - seizure
    description: 'Whether the patient had seizures (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 40 (Sinais e sintomas
      – convulsões)
  CLI_RIGIDE:
    official_name: Sinais e sintomas – rigidez de nuca
    translated_name: Clinical - neck stiffness
    description: 'Sim/Não flag for rigidez de nuca (neck stiffness), a classic meningitis
      sign, part of the same checklist as CLI_ABAULA and CLI_COMA.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 40 (Sinais e sintomas
      – rigidez de nuca)
  CON_DIAGES:
    official_name: Se confirmado, especifique
    translated_name: 'Confirmed case: specific diagnosis'
    description: 'Specific form of a confirmed case: meningococcaemia, meningococcal meningitis
      (with or without meningococcaemia), tuberculous, other bacterial, unspecified, aseptic,
      other etiology, Haemophilus or pneumococcal meningitis.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 51 (Se confirmado, especifique)
  LAB_AGLIQU:
    official_name: LATEX líquor
    translated_name: Latex agglutination test - CSF
    description: 'Etiologic-agent code from the latex particle agglutination test on
      CSF, part of the meningitis form''s four-test-by-four-specimen laboratory grid;
      sibling to LAB_AGSANG (same test on blood/serum).

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "LATEX líquor"
  LAB_AGSANG:
    official_name: LATEX Sangue/soro
    translated_name: Latex agglutination test - blood/serum
    description: 'Same latex-agglutination test as LAB_AGLIQU, run on blood/serum instead
      of CSF.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_Meningite_v5.pdf, campo 49 "LATEX Sangue/soro"
  LAB_ASPECT:
    official_name: Aspecto do líquor
    translated_name: CSF appearance
    description: 'How the CSF looked — clear, purulent, haemorrhagic, cloudy, xanthochromic
      or other. Purulent means bacterial and directs immediate treatment; clear keeps
      viral and tuberculous causes open. Available at the bedside, hours before any
      culture.

      '
    code_system: internal
    source: def
    source_ref: LIQUOR.CNV
    reasoning: 'Bound to LIQUOR, whose values are límpido, purulento, hemorrágico,
      turvo and xantocrômico.

      '
  LAB_BCESCA:
