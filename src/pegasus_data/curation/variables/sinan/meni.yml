    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, pneumococo)
  ANT_DOSE_C:
    official_name: Número de doses (conjugada meningo C)
    translated_name: Meningococcal C conjugate doses
    description: 'Number of doses of the conjugate meningococcal C vaccine the patient received.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, conjugada meningo C)
  ANT_DOSE_T:
    official_name: Número de doses (hemófilo – tetravalente ou Hib)
    translated_name: Haemophilus vaccine doses
    description: 'Number of Haemophilus influenzae b vaccine doses (tetravalent or Hib) the
      patient received.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, hemófilo – tetravalente ou Hib)
  ANT_DTULT_:
    official_name: Data da última dose (polissacarídica B/C)
    translated_name: Date of last B and C dose
    description: Date of the last meningococcal B and C dose.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – data
      da última dose, polissacarídica B/C)
  ANT_DTUL_3:
    official_name: Data da última dose (polissacarídica A/C)
    translated_name: Date of last A and C dose
    description: Date of the last meningococcal A and C dose.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – data
      da última dose, polissacarídica A/C)
  ANT_DTUL_4:
    official_name: Data da última dose (BCG)
    translated_name: Date of BCG
    description: 'Date of the last BCG dose.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – data
