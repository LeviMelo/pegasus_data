# SINAN.MENI —
#
# one notification of meningitis
system: SINAN
asserted_by: pegasus_data

variables:
  ANT_AC:
    official_name: Vacina contra meningococo A e C
    translated_name: Meningococcal A and C vaccine
    description: 'Whether the patient received meningococcal A and C vaccine. The ANT_
      vaccine flags each pair with a date, and together they say which meningitis the
      patient could still get.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; AC names the meningococcal A/C vaccine.
  ANT_AIDS:
    official_name: Aids
    translated_name: AIDS
    description: 'Whether the patient has AIDS. The comorbidity block records what
      makes an unusual organism plausible; in AIDS that means cryptococcal and tuberculous
      meningitis.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag opening the comorbidity block.
  ANT_BC:
    official_name: Vacina contra meningococo B e C
    translated_name: Meningococcal B and C vaccine
    description: 'Whether the patient received the B and C vaccine, a different serogroup
      combination from ANT_AC.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; BC names the meningococcal B/C vaccine.
  ANT_BCG:
    official_name: Vacina BCG
    translated_name: BCG vaccine
    description: 'Whether BCG was given. Relevant because BCG protects specifically
      against tuberculous meningitis in young children.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; BCG names the vaccine.
  ANT_CONJ_C:
    official_name: Vacina meningocócica conjugada C
    translated_name: Conjugate meningococcal C vaccine
    description: 'Whether the conjugate C vaccine was given. Conjugate vaccines protect
      infants, whom the older polysaccharide vaccines do not, so this flag distinguishes
      real infant protection.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; CONJ_C names the conjugate C vaccine.
  ANT_CONT_N:
    official_name: Local do contato
    translated_name: Place of contact
    description: 'Where contact with a case occurred. Meningococcal disease clusters
      in households and nurseries, and this directs chemoprophylaxis.

      '
    code_system: internal
    source: def
    source_ref: LOCALCONMEN.CNV
    reasoning: 'Bound to LOCALCONMEN, whose values run from domicílio through sem história
      de contato.

      '
  ANT_DOSES_:
    official_name: Número de doses (polissacarídica B/C)
    translated_name: Meningococcal B and C doses
    description: 'Number of doses of the polysaccharide meningococcal B/C vaccine the patient
      received.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, polissacarídica B/C)
  ANT_DOSE_3:
    official_name: Número de doses (polissacarídica A/C)
    translated_name: Meningococcal A and C doses
    description: 'Number of doses of the polysaccharide meningococcal A/C vaccine the patient
      received.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, polissacarídica A/C)
  ANT_DOSE_4:
    official_name: Número de doses (BCG)
    translated_name: BCG doses
    description: 'Number of BCG doses the patient received.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, BCG)
  ANT_DOSE_5:
    official_name: Número de doses (tríplice viral)
    translated_name: MMR doses
    description: 'Number of MMR (measles, mumps, rubella) vaccine doses the patient received.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Meningite — https://portalsinan.saude.gov.br/images/documentos/Agravos/Meningite/DIC_DADOS_Meningite_v5.pdf
      (sources/dic_text/meningite__DIC_DADOS_Meningite_v5.txt), campo 33 (Vacinação – número
      de doses, tríplice viral)
  ANT_DOSE_7:
    official_name: Número de doses (pneumococo)
