# SINAN.PAIR —
#
# one notification of noise-induced hearing loss, work-related
system: SINAN
asserted_by: pegasus_data

variables:
  CONDUTA_DE:
    official_name: Conduta geral – se outro, especificar
    translated_name: Management, free text
    description: 'Free text describing what was done for the patient, where the coded
      management fields did not cover it. Thirty characters.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo Conduta geral – Se outro,
      especificar
  FALA:
    official_name: Sintomas - Dificuldade para compreensão da fala
    translated_name: Symptom - difficulty understanding speech
    description: 'Whether the worker reported difficulty understanding speech, one
      of four symptom checkboxes (with ZUMBIDO, TONTURA, CEFALEIA) on the noise-induced
      hearing loss (PAIR) investigation form.

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_PAIR_v5.pdf, campo 51 "Sintomas"
  GASES:
    official_name: Exposição Concomitante a Ruído e Gases Tóxicos
    translated_name: Concurrent toxic-gas exposure
    description: 'Whether the worker being investigated for noise-induced hearing loss
      was also exposed to toxic gases at the same time as the workplace noise: yes,
      no, or unknown.

      '
    code_system: none
    source: layout_doc
    source_ref: DIC_DADOS_DRT_PAIR_v5.pdf, campo 50
  MEDICA:
    official_name: Exposição Concomitante a Ruído e Medicamentos Ototóxicos
    translated_name: Concurrent exposure - noise and ototoxic drugs
    description: 'Whether the worker, alongside noise, was also exposed to ototoxic
      drugs (e.g. aminoglycoside antibiotics) that can compound noise-induced hearing
      loss; one of five concurrent-exposure checkboxes on the PAIR form (with SOLVENTE,
      METAL, GASES, RUIDO_OUT).

      '
    code_system: internal
    source: layout_doc
    source_ref: DIC_DADOS_DRT_PAIR_v5.pdf, campo 50 "Exposição Concomitante a Ruído"
  RUIDO_OUT:
    official_name: Exposição concomitante a ruído e outros
    translated_name: Concomitant exposure to noise and other agents
    description: 'Whether the worker was exposed to noise together with some other product
      or situation not listed on the form (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo 50 (Exposição concomitante
      a ruído e outros)
  RUI_OUTDES:
    official_name: Exposição concomitante a ruído e outros – especificar
    translated_name: Other concomitant exposure (specify)
    description: 'Free-text name of the other product or situation the worker was exposed to
      along with noise, filled when RUIDO_OUT is yes.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo 50 (Exposição concomitante
      a ruído e outros – especificar)
  SOLVENTE:
    official_name: Exposição concomitante a ruído e solvente a base de tolueno
    translated_name: Concomitant exposure to noise and toluene-based solvent
    description: 'Whether the worker was exposed to noise together with toluene-based solvents,
      which are ototoxic and add to the hearing damage (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo 50 (Exposição concomitante
      a ruído e solvente a base de tolueno)
  TONTURA:
    official_name: Sintomas – Tontura
    translated_name: Dizziness
    description: 'Whether the noise-induced hearing loss (PAIR) patient reports dizziness/vertigo,
      a vestibular symptom checkbox recorded alongside tinnitus (ZUMBIDO).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo 51 (Sintomas – Tontura)
  TPRUIDO:
    official_name: Tipo de ruído predominante
    translated_name: Predominant type of noise
    description: 'Predominant noise that caused the hearing loss: continuous, intermittent,
      or both.

      '
    code_system: internal
    codes: {'1': Ruído contínuo, '2': Ruído intermitente, '3': Ambos, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo 49 (Tipo de ruído predominante)
  ZUMBIDO:
    official_name: Sintomas – Zumbido
    translated_name: Tinnitus
    description: 'Whether the noise-induced hearing loss patient reports tinnitus (ringing
      in the ears), the symptom most closely tied to PAIR alongside dizziness (TONTURA).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – DRT PAIR — http://portalsinan.saude.gov.br/images/documentos/Agravos/DRT%20PAIR/DIC_DADOS_DRT_PAIR_v5.pdf
      (sources/dic_text/drt-pair__DIC_DADOS_DRT_PAIR_v5.txt), campo 51 (Sintomas – Zumbido)
