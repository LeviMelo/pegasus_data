# SINAN.NTRA — Work accident notification
# Notificação de acidente de trabalho
#
# One notified occupational accident. Sits alongside the more specific ACGR
# (severe) and ACBI (biological material) channels.
system: SINAN
asserted_by: pegasus_data

variables:
  NU_CASOEXA:
    official_name: Número de casos examinados
    translated_name: Cases examined
    description: 'Number of people examined in the trachoma survey (school or household inquiry).
      Must be non-zero.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tracoma — http://portalsinan.saude.gov.br/images/documentos/Agravos/Tracoma/DIC_DADOS_Tracoma_v5.pdf,
      campo 8 (Número de casos examinados)
  NU_CASOPOS:
    official_name: Número de casos positivos
    translated_name: Cases positive
    description: 'Number of people found positive for trachoma among those examined; with NU_CASOEXA
      it gives the survey prevalence.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Tracoma — http://portalsinan.saude.gov.br/images/documentos/Agravos/Tracoma/DIC_DADOS_Tracoma_v5.pdf,
      campo 9 (Número de casos positivos)
  NU_LOTE:
    official_name: Número do lote
    translated_name: Screening batch/lot number
    description: 'Sequential batch (lote) number for a group of individuals - typically
      students at one school - examined together in a trachoma active-search screening
      round, distinct from a case-level notification number.

      '
    code_system: none
    source: inferred
    reasoning: 'NTRA''s schema carries NU_CASOEXA (cases examined) and NU_CASOPOS (cases positive)
      alongside NU_LOTE/NU_LOTE_H/NU_LOTE_V, consistent with aggregate trachoma school-screening
      surveillance rather than individual case notification. Reviewed 2026-09-28: no documentation
      found (searched DIC_DADOS_Tracoma_v5.pdf, NotTracoNet.def and the local SINAN NET dictionaries).
      Caution: in the other SINAN NET dictionaries NU_LOTE_* fields are data-transfer batch
      numbers (lote de transferência horizontal/vertical), so this may be a transfer lot rather
      than a screening batch.'
  NU_SEMA_EP:
    official_name: Semana epidemiológica
    translated_name: Epidemiological week
    description: 'Epidemiological week in which this trachoma screening batch''s results
      were recorded/notified - the standard SINAN time-unit field applied to this aggregate
      surveillance series.

      '
    code_system: none
    source: inferred
    reasoning: 'NU_SEMA_EP = número da semana epidemiológica; standard SINAN aggregate-reporting
      field. Reviewed 2026-09-28: no documentation found (searched DIC_DADOS_Tracoma_v5.pdf,
      NotTracoNet.def and the local SINAN NET dictionaries; the dictionary documents SEM_NOT
      as the notification week).'
