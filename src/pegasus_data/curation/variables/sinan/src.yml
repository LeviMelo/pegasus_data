# SINAN.SRC — Congenital rubella syndrome
# Síndrome da Rubéola Congênita
#
# One case of congenital rubella syndrome.
system: SINAN
asserted_by: pegasus_data

variables:
  AUDITIVA:
    official_name: Deficiência auditiva
    translated_name: Hearing loss
    description: 'Sensorineural deafness. The commonest manifestation, and often the
      only one, which is why a baby who looks normal at birth still needs testing.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: AUDITIVA reads auditiva; a clinical flag.
  BLOQUEIO:
    official_name: Bloqueio vacinal
    translated_name: Vaccination sweep
    description: Whether a vaccination sweep was carried out around the case.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: BLOQUEIO reads bloqueio vacinal; a yes/no flag.
  CARDIOPATI:
    official_name: Cardiopatia congênita
    translated_name: Congenital heart disease
    description: 'Congenital heart disease, typically patent ductus arteriosus or pulmonary
      artery stenosis. The third element of the classic triad.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CARDIOPATI reads cardiopatia; a clinical flag.
  CATARATA:
    official_name: Catarata
    translated_name: Cataract
    description: 'Congenital cataract. One of the classic triad — cataract, deafness,
      heart defect — that defines congenital rubella syndrome.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CATARATA reads catarata; a yes/no clinical flag.
  CS_LIQUOR:
    official_name: Detecção viral – amostra clínica – líquor
    translated_name: Specimen collected - CSF
    description: 'Whether a cerebrospinal fluid sample was collected for rubella virus detection
      (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 40 (Detecção
      viral – amostra clínica – líquor)
  CS_SECRECA:
    official_name: Detecção viral – amostra clínica – secreção nasofaríngea
    translated_name: Nasopharyngeal secretion collected
    description: 'Whether a nasopharyngeal secretion sample was collected for rubella virus
      detection (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 40 (Detecção
      viral – amostra clínica – secreção nasofaríngea)
  CS_URINA:
    official_name: Detecção viral – amostra clínica – urina
    translated_name: Specimen collected - urine
    description: 'Whether a urine sample was collected for rubella virus detection (1 yes,
      2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 40 (Detecção
      viral – amostra clínica – urina)
  DG_OUT_N:
    official_name: Diagnóstico de descarte – outras (especificar)
    translated_name: Other discard diagnosis (specify)
    description: 'Free-text alternative diagnosis for a discarded case, filled when the discard
      diagnosis is 4 (other).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 52 (Diagnóstico
      de descarte – outras, especificar)
  DIAG_MAE:
    official_name: Critério do diagnóstico materno
    translated_name: How the mother was diagnosed
    description: 'Whether the mother''s rubella was confirmed by laboratory, by epidemiological
      link, or clinically. Clinical diagnosis is unreliable for rubella, so the criterion
      bounds the certainty of the whole case.

      '
    code_system: internal
    source: def
    source_ref: CONFSRC.CNV
    reasoning: 'Bound to CONFSRC, whose values are laboratório, vínculo epidemiológico
      and clínico.

      '
  DSCARDIOP:
    official_name: Especificar cardiopatia
    translated_name: Description - cardiac condition
    description: 'Free-text description of the congenital heart defect, filled when congenital
      heart disease (a major sign of congenital rubella) is marked.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 34 (Especificar
      cardiopatia)
  DS_RESU_OU:
    official_name: Resultado outros vírus – especificar
    translated_name: Other virus detected (specify)
    description: 'Free-text name of the other virus found in the viral-detection samples, filled
      when the result is 3 (other virus).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 41 (Resultado
      outros vírus – especificar)
  DT_COL1:
    official_name: Data da coleta da 1ª amostra
    translated_name: Date of first sample
    description: 'When the first serum was taken. Rubella IgM in a newborn is diagnostic
      because it cannot have crossed the placenta.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 36 (Data
      da coleta da 1ª amostra)
  DT_COL2:
    official_name: Data da coleta da 2ª amostra
    translated_name: Date of second sample
    description: When the second serum was taken.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 37 (Data
      da coleta da 2ª amostra)
  DT_COL3:
    official_name: Data da coleta da 3ª amostra
    translated_name: Date of third sample
    description: 'When the third serum was taken. Persisting IgG beyond about six months
      confirms the child''s own antibody rather than the mother''s.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 38 (Data
      da coleta da 3ª amostra)
  DT_VACINA:
    official_name: Data da última dose da vacina
    translated_name: Date mother was vaccinated
    description: 'Date of the mother''s last dose of rubella-containing vaccine. Rubella vaccine
      in early pregnancy is a theoretical concern, so this date against the pregnancy matters.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 46 (Data
      da última dose da vacina)
  GLAUCOMA:
    official_name: Glaucoma congênito
    translated_name: Congenital glaucoma
    description: Congenital glaucoma, the other major eye manifestation beside cataract.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: GLAUCOMA reads glaucoma; a clinical flag.
  HEPA_ESP:
    official_name: Hepatoesplenomegalia
    translated_name: Enlarged liver and spleen
    description: Enlarged liver and spleen, another sign of active infection at birth.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: HEPA_ESP reads hepatoesplenomegalia; a clinical flag.
  IDADEMAE:
    official_name: Idade da mãe
    translated_name: Mother's age
    description: 'Mother''s age in years (must be over 10) on the congenital rubella syndrome
      investigation.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 44 (Idade
      da mãe)
  ID_DG_DES:
    official_name: Diagnóstico diferencial
    translated_name: Differential diagnosis
    description: 'Which other congenital infection was considered — toxoplasmosis,
      congenital syphilis, cytomegalovirus, or another. These produce a nearly identical
      picture, so the differential is the point of the field.

      '
    code_system: internal
    source: def
    source_ref: CRITRUBENET.CNV
    reasoning: 'Bound to CRITRUBENET, whose values are toxoplasmose, sífilis congênita,
      citomegalovírus and outras.

      '
  MENINGO:
    official_name: Meningoencefalite
    translated_name: Meningoencephalitis
    description: Meningoencephalitis in the newborn, part of the acute infection.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MENINGO reads meningoencefalite; a clinical flag.
  MICROCEFA:
    official_name: Microcefalia
    translated_name: Microcephaly
    description: 'Small head circumference. Part of the central nervous system involvement
      that follows infection early in pregnancy.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: MICROCEFA reads microcefalia; a clinical flag.
  OSSEA:
    official_name: Alteração óssea
    translated_name: Bone abnormality
    description: 'Radiological bone changes, the "celery stalk" appearance of the long
      bone metaphyses.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: OSSEA reads óssea; a clinical flag.
  PERIODO:
    official_name: Período da gestação em que foi acometida/exposta
    translated_name: Gestational period of infection
    description: 'Trimester of pregnancy in which the mother had or was exposed to rubella;
      filled when she had rubella signs and symptoms.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 48 (Período
      da gestação em que foi acometida/exposta)
  PURPURA:
    official_name: Púrpura
    translated_name: Purpura
    description: 'The "blueberry muffin" purpura of congenital rubella, from low platelets
      and extramedullary haematopoiesis. Present at birth and transient.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PURPURA reads púrpura; a clinical flag.
  RECEM_NASC:
    official_name: Recém-nascido
    translated_name: Newborn gestational age
    description: 'Gestational age of the newborn: full term or premature (under 37 weeks).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 32 (Recém-nascido)
  RETAR_PM:
    official_name: Retardo do desenvolvimento
    translated_name: Developmental delay
    description: 'Delayed psychomotor development. A later finding than the birth defects,
      so it only appears where the child was followed up.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: RETAR_PM reads retardo psicomotor; a clinical flag.
  RETINOPA:
    official_name: Retinopatia
    translated_name: Retinopathy
    description: 'The pigmentary retinopathy of congenital rubella. Does not usually
      affect vision, but it is a durable marker long after the infection.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: RETINOPA reads retinopatia; a clinical flag.
  S3_IGG:
    official_name: IgG na terceira amostra
    translated_name: IgG, third sample
    description: 'IgG on the third serum. Maternal IgG has waned by then, so persisting
      IgG is the child''s own and confirms infection.

      '
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the third sample's IgG.
  S3_IGM:
    official_name: IgM na terceira amostra
    translated_name: IgM, third sample
    description: IgM on the third serum, completing the antibody sequence.
    code_system: internal
    source: def
    source_ref: REAGENTE.CNV
    reasoning: Bound to REAGENTE; the third sample's IgM.
  VACINACAO:
    official_name: Vacinação tríplice viral (sarampo, rubéola, caxumba)
    translated_name: Mother's MMR vaccination
    description: 'Whether the mother received the MMR (measles, rubella, mumps) vaccine (1
      yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 45 (Vacinação
      tríplice viral – sarampo, rubéola, caxumba)
  VACINADUPL:
    official_name: Vacinação dupla viral (sarampo e rubéola)
    translated_name: Measles-rubella (dupla viral) vaccination history
    description: 'Whether the mother had received the dupla viral (measles-rubella)
      vaccine before or during pregnancy — used on the congenital rubella syndrome
      form to assess maternal vaccination failure or gaps.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 45 (Vacinação
      dupla viral – sarampo e rubéola)
  VACINARUBE:
    official_name: Vacinação rubéola (monovalente)
    translated_name: Maternal rubella vaccination (flag)
    description: 'Whether the mother received the single-antigen (monovalent) rubella vaccine
      (1 yes, 2 no, 9 unknown).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Síndrome da Rubéola Congênita — http://portalsinan.saude.gov.br/images/documentos/Agravos/SRC/DIC_DADOS_SRC_v5.pdf
      (sources/dic_text/sindrome-da-rubeola-congenita__DIC_DADOS_SRC_v5.txt), campo 45 (Vacinação
      rubéola monovalente)
