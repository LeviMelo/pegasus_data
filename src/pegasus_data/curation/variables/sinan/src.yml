    source_ref: SIM_NAO.CNV
    reasoning: AUDITIVA reads auditiva; a clinical flag.
  BLOQUEIO:
    official_name: Bloqueio vacinal
    translated_name: Vaccination sweep
    description: Whether a vaccination sweep was carried out around the case.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: BLOQUEIO reads bloqueio vacinal; a yes/no flag.
  CARDIOPATI:
    official_name: Cardiopatia congênita
    translated_name: Congenital heart disease
    description: 'Congenital heart disease, typically patent ductus arteriosus or pulmonary
      artery stenosis. The third element of the classic triad.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CARDIOPATI reads cardiopatia; a clinical flag.
  CATARATA:
    official_name: Catarata
    translated_name: Cataract
    description: 'Congenital cataract. One of the classic triad — cataract, deafness,
      heart defect — that defines congenital rubella syndrome.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CATARATA reads catarata; a yes/no clinical flag.
  CS_LIQUOR:
    official_name: Coleta - líquor
    translated_name: Specimen collected - CSF
    description: 'Sim/Não flag for whether a cerebrospinal fluid (líquor) sample was
      collected for laboratory testing, part of a specimen-collection checklist alongside
      CS_SECRECA and CS_URINA.

      '
    code_system: none
    source: inferred
    reasoning: 'LIQUOR is CSF; the CS_ prefix here marks specimen collection rather
      than the classificação/situação sense it carries in CS_MENING, and it clusters
      with two other named-specimen flags of identical shape.

      '
  CS_SECRECA:
    official_name: Coleta - secreção
    translated_name: Specimen collected - secretion
    description: 'Sim/Não flag for whether a secretion sample was collected, sibling
      of CS_LIQUOR and CS_URINA in the same specimen-collection checklist.

      '
    code_system: none
    source: inferred
    reasoning: Same evidence as CS_LIQUOR.
  CS_URINA:
    official_name: Coleta - urina
    translated_name: Specimen collected - urine
    description: 'Sim/Não flag for whether a urine sample was collected, sibling of
