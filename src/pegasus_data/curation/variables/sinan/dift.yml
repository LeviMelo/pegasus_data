# SINAN.DIFT —
#
# one notification of diphtheria
system: SINAN
asserted_by: pegasus_data

variables:
  ANT_DOS_N:
    official_name: Número de doses da vacina
    translated_name: Vaccine doses received
    description: 'Doses of diphtheria vaccine received, banded from one through three
      plus two boosters, or never vaccinated. Diphtheria in a fully vaccinated person
      is rare enough to question the diagnosis.

      '
    code_system: internal
    source: def
    source_ref: DOSES.CNV
    reasoning: 'Bound to DOSES, whose values are uma, duas, três, três mais reforço,
      três mais dois reforços and nunca vacinado.

      '
  ANT_OUTROS:
    official_name: Se outro contato (especificar)
    translated_name: Other place of contact (specify)
    description: 'Free-text place where the patient had contact with a suspected or confirmed
      diphtheria case, when the place of contact was coded as other.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 33 (Se outro contato, especificar)
  ANT_TIPOCO:
    official_name: Local do contato
    translated_name: Place of contact
    description: 'Where contact with a case occurred — home, neighbourhood, work, school,
      health facility, or elsewhere. Diphtheria spreads in crowded settings, so the
      place directs the contact tracing.

      '
    code_system: internal
    source: def
    source_ref: LOCALCONCNET.CNV
    reasoning: 'Bound to LOCALCONCNET, whose values run from domicílio through sem
      história de contato.

      '
  ANT_ULTI_D:
    official_name: Data da última dose
    translated_name: Date of last dose
    description: 'Date of the last dose. Diphtheria immunity wanes, so a distant last
      dose leaves an adult susceptible despite a complete childhood schedule.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 37 (Data da última dose)
  ATE_UF_INT:
    official_name: UF do hospital
    translated_name: Encounter - admission state
    description: 'UF (state) code of the facility where the patient was admitted (internado);
      see ATE_UF_HOS for the state of the initial encounter.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 44 (UF do hospital)
  CLI_AMIGDA:
    official_name: Placas nas amígdalas
    translated_name: Membrane on the tonsils
    description: 'Pseudomembrane on the tonsils. The defining lesion of diphtheria,
      and the CLI_ site flags map how far it has spread.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; AMIGDA reads amígdalas.
  CLI_ARRITM:
    official_name: Arritmia cardíaca
    translated_name: Cardiac arrhythmia
    description: 'Arrhythmia from diphtheritic myocarditis, which appears one to two
      weeks in and is the commonest cause of death.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; ARRITM reads arritmia.
  CLI_CAVIDA:
    official_name: Placas na cavidade nasal
    translated_name: Membrane in the nasal cavity
    description: 'Pseudomembrane in the nose. Nasal diphtheria is milder and often
      missed, which makes it an efficient source of transmission.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; CAVIDA reads cavidade nasal.
  CLI_CONDUT:
    official_name: Placas no conduto auditivo
    translated_name: Membrane in the ear canal
    description: Pseudomembrane in the ear canal, an uncommon site.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; CONDUT reads conduto auditivo.
  CLI_CONJUN:
    official_name: Lesão conjuntival
    translated_name: Conjunctival lesion
    description: Diphtheritic lesion of the conjunctiva.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; CONJUN reads conjuntival.
  CLI_CORDAO:
    official_name: Adenomegalia cervical
    translated_name: Cervical lymph node enlargement
    description: Enlarged neck lymph nodes, the finding underlying the bull-neck appearance.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; CORDAO reads cordão ganglionar.
  CLI_EDEMAG:
    official_name: Edema generalizado
    translated_name: Generalised swelling
    description: Generalised oedema, beyond the cervical swelling in CLI_PESCOC.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; EDEMAG reads edema generalizado.
  CLI_FARING:
    official_name: Placas na faringe
    translated_name: Membrane on the pharynx
    description: Pseudomembrane on the pharynx, one step wider than the tonsils.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; FARING reads faringe.
  CLI_LARING:
    official_name: Placas na laringe
    translated_name: Membrane on the larynx
    description: 'Pseudomembrane on the larynx. The dangerous extension, because a
      membrane here obstructs the airway.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; LARING reads laringe.
  CLI_NEFRIT:
    official_name: Nefrite
    translated_name: Nephritis
    description: 'Kidney inflammation from the toxin. One of the three classic late
      toxic complications, with myocarditis and the paralyses.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; NEFRIT reads nefrite.
  CLI_ORGAOS:
    official_name: Lesão em outros órgãos
    translated_name: Lesion in other organs
    description: Diphtheritic lesion at a site the named flags do not cover.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: The residual site item of the lesion block.
  CLI_PALATO:
    official_name: Placas no palato
    translated_name: Membrane on the palate
    description: Pseudomembrane on the palate.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PALATO reads palato.
  CLI_PALIDE:
    official_name: Palidez
    translated_name: Pallor
    description: Pallor, part of the toxaemic picture.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PALIDE reads palidez.
  CLI_PARALB:
    official_name: Paralisia do palato mole
    translated_name: Palatal paralysis
    description: 'Paralysis of the soft palate. Typically the first of the diphtheritic
      neuropathies, causing a nasal voice and regurgitation.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: 'A yes/no flag; one of three CLI_PARAL items covering the toxic neuropathies
      at different sites.

      '
  CLI_PARALM:
    official_name: Paralisia de músculos respiratórios
    translated_name: Respiratory muscle paralysis
    description: 'Paralysis of the respiratory muscles. The late complication that
      kills after the throat has healed, and the reason recovery is watched for weeks.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; the respiratory member of the CLI_PARAL group.
  CLI_PARALP:
    official_name: Paralisia periférica
    translated_name: Peripheral paralysis
    description: 'Peripheral paralysis, appearing weeks after the acute illness as
      the toxin damages peripheral nerves.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; the peripheral member of the CLI_PARAL group.
  CLI_PELE:
    official_name: Lesão cutânea
    translated_name: Skin lesion
    description: 'Cutaneous diphtheria. Common in poor and crowded conditions, and
      a persistent reservoir even where respiratory disease has been controlled.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PELE reads pele.
  CLI_PESCOC:
    official_name: Edema cervical
    translated_name: Neck swelling
    description: 'Swelling of the neck — the "bull neck" of severe diphtheria, caused
      by massive lymph node enlargement and a marker of a large toxin burden.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PESCOC reads pescoço.
  CLI_PROSTR:
    official_name: Prostração
    translated_name: Prostration
    description: 'Marked prostration. Out of proportion to the local findings, because
      the illness is driven by circulating toxin rather than by the throat lesion.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; PROSTR reads prostração.
  CLI_TEMPER:
    official_name: Temperatura corporal
    translated_name: Temperature
    description: 'Body temperature. Diphtheria characteristically causes only modest
      fever despite a severe throat, which is itself a diagnostic clue.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 39 (Temperatura corporal)
  CLI_TRAQUE:
    official_name: Placas na traqueia
    translated_name: Membrane in the trachea
    description: 'Pseudomembrane in the trachea, the furthest extension down the airway
      and the point at which a tracheostomy may be needed.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: A yes/no flag; TRAQUE reads traqueia.
  LAB_CULTUR:
    official_name: Resultado da cultura
    translated_name: Culture result
    description: 'Whether the culture grew Corynebacterium diphtheriae. Confirmation,
      but a negative culture does not discard a clinically typical case.

      '
    code_system: internal
    source: def
    source_ref: POSNEGDI.CNV
    reasoning: 'Bound to POSNEGDI, whose values name positive and negative for C. diphtheriae.

      '
  LAB_DATA_C:
    official_name: Data da coleta
    translated_name: Date specimen collected
    description: 'When the swab was taken. Culture yield collapses once antibiotics
      start, so a swab taken after treatment cannot exclude the diagnosis.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 48 (Data da coleta)
  LAB_MATE_N:
    official_name: Material coletado
    translated_name: Specimen collected
    description: 'Whether the swab was from the oropharynx, the nasopharynx, both,
      or was not taken. Both sites raise the yield, so this bounds what a negative
      culture means.

      '
    code_system: internal
    source: def
    source_ref: MAT_COLE.CNV
    reasoning: 'Bound to MAT_COLE, whose values are orofaringe, nasofaringe, both,
      and não coletado.

      '
  LAB_PROVAS:
    official_name: Prova de toxigenicidade
    translated_name: Toxigenicity test
    description: 'Whether the isolate produces toxin. A non-toxigenic strain causes
      a sore throat and not diphtheria, so this distinguishes carriage from disease.

      '
    code_system: internal
    source: def
    source_ref: POSNEGNR.CNV
    reasoning: Bound to POSNEGNR, positive/negative/not done.
  MED_MATERI:
    official_name: Realizada coleta de material dos comunicantes
    translated_name: Material collected from contacts
    description: 'Whether swab material was collected from the case''s contacts to look for
      carriers.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 57 (Realizada coleta de
      material dos comunicantes)
  MED_PREVEN:
    official_name: Medidas de prevenção/controle
    translated_name: Prevention/control measures
    description: 'Control measure taken around the case: vaccination blockade, chemoprophylaxis,
      both, or none.

      '
    code_system: internal
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 60 (Medidas de prevenção/controle)
  MED_QUAN_M:
    official_name: Se sim, em quantos?
    translated_name: Contacts sampled
    description: 'Number of contacts from whom material was collected.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 58 (Se sim, em quantos?)
  MED_QUAN_P:
    official_name: Quantos portadores foram identificados entre os comunicantes?
    translated_name: Carriers identified among contacts
    description: 'Number of carriers of C. diphtheriae identified among the sampled contacts.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 59 (Quantos portadores
      foram identificados entre os comunicantes?)
  TRA_DATA_A:
    official_name: Data da administração do antibiótico
    translated_name: Date antibiotic started
    description: 'When antibiotics began. They stop transmission and halt further toxin
      production, but do nothing about toxin already circulating, which is why antitoxin
      is given as well.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 53 (Data da administração
      do antibiótico)
  TRA_DATA_S:
    official_name: Data da aplicação do soro
    translated_name: Date antitoxin given
    description: 'When diphtheria antitoxin was given. Antitoxin only neutralises toxin
      not yet bound to tissue, so every hour of delay costs effect — the single most
      time-critical treatment on this form.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET v5.0 – Difteria — http://portalsinan.saude.gov.br/images/documentos/Agravos/Difteria/DIC_DADOS_Difteria_v5.pdf
      (sources/dic_text/difteria__DIC_DADOS_Difteria_v5.txt), campo 51 (Data da aplicação do
      soro)
