# SINAN.BOTU — Botulism
# Botulismo
#
# One notified case of botulism.
system: SINAN
asserted_by: pegasus_data

variables:
  AGENTE_OUT:
    official_name: Se descartado, especificar outro agente
    translated_name: If discarded, other agent (specify)
    description: Free text naming the other agent or diagnosis when the case is discarded as botulism
      (final classification = discarded).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 70 (Se descartado, especificar outro agente)
  DSALIMENTO:
    official_name: Se sim, qual alimento suspeito
    translated_name: Suspected food
    description: Free-text name of the suspected food when foodborne transmission is suspected
      (field 45 = Sim).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 46 (Se sim, qual alimento suspeito)
  DSCAUSALIM:
    official_name: Qual a causa/ alimento incriminado/ alimento potencialmente suspeito
    translated_name: Cause / incriminated food
    description: Free text giving the cause of the botulism (e.g. a wound) and/or the incriminated
      or potentially suspected food.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 75 (Qual a causa/alimento incriminado/alimento potencialmente suspeito)
  DS_ALI1:
    official_name: Tipo de alimento 1
    translated_name: Food type 1
    description: Free text naming the first food potentially suspected of causing botulism, eaten
      in the 10 days before symptom onset (supplementary-information block).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      Informações complementares, Tipo de alimento 1
  DS_ALI1OUT:
    official_name: Material coletado - Especificar alimento 1
    translated_name: Material collected - specify food 1
    description: Free text specifying suspect food 1 that was sent for laboratory analysis.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Material coletado – Especificar alimento 1)
  DS_ALI2:
    official_name: Tipo de alimento 2
    translated_name: Food type 2
    description: Free text naming the second food potentially suspected of causing botulism, eaten
      in the 10 days before symptom onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      Informações complementares, Tipo de alimento 2
  DS_ALI2OUT:
    official_name: Material coletado - Especificar alimento 2
    translated_name: Material collected - specify food 2
    description: Free text specifying suspect food 2 that was sent for laboratory analysis.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Material coletado – Especificar alimento 2)
  DS_FIM_GES:
    official_name: Se múltipla, tempo decorrido entre a última ingestão e início dos sintomas
    translated_name: 'Multiple exposure: time from last ingestion to symptom onset'
    description: For multiple exposure to the suspect food, the time (hours) between the last
      ingestion and symptom onset. Not related to pregnancy despite the column name.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 52 (Se múltipla, tempo decorrido entre a última ingestão e início dos sintomas)
  DS_INDUS:
    official_name: Se Industrial/ Comercial, especificar marca, data de validade e lote
    translated_name: 'Industrial food: brand, expiry date and batch'
    description: Free text with the brand, expiry date and batch of the suspect food when it was
      industrially or commercially produced.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 48 (Se Industrial/Comercial, especificar marca, data de validade e lote)
  DS_INGEST:
    official_name: Se única, tempo decorrido entre ingestão e início dos sintomas
    translated_name: 'Single exposure: time from ingestion to symptom onset'
    description: For a single exposure, the time in hours between eating the suspect food and
      symptom onset.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 50 (Se única, tempo decorrido entre ingestão e início dos sintomas)
  DS_INI_GES:
    official_name: Se múltipla, tempo decorrido entre a primeira ingestão e início dos sintomas
    translated_name: 'Multiple exposure: time from first ingestion to symptom onset'
    description: For multiple exposure to the suspect food, the time (hours) between the first
      ingestion and symptom onset. Not related to pregnancy despite the column name.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 51 (Se múltipla, tempo decorrido entre a primeira ingestão e início dos sintomas)
  DS_LOCAL1:
    official_name: Local de consumo 1
    translated_name: Place of consumption 1
    description: Free text naming where the first potentially suspected food (DS_ALI1) was eaten.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      Informações complementares, Local de consumo 1
  DS_LOCAL2:
    official_name: Local de consumo 2
    translated_name: Place of consumption 2
    description: Free text naming where the second potentially suspected food (DS_ALI2) was eaten.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      Informações complementares, Local de consumo 2
  DS_OUTRO:
    official_name: Material coletado - Outros (especificar)
    translated_name: Other material collected (specify)
    description: Free text specifying another material collected for botulinum toxin testing (e.g.
      gastric lavage, wound tissue).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Material coletado – Outros, especificar)
  DS_OUTROSI:
    official_name: Sinais e sintomas - Outros (especificar)
    translated_name: Other signs and symptoms (specify)
    description: Free text naming another sign or symptom presented by the patient (see STOUTROSIN).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 42 (Sinais e sintomas – Outros, especificar)
  DS_OUTR_LO:
    official_name: Local da ingestão - Se outro, especificar
    translated_name: Place of ingestion - other (specify)
    description: Free text naming the place where the suspect food was eaten when it was not one
      of the listed options.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 53 (Local da ingestão – Se outro, especificar)
  DS_PARES:
    official_name: Sinais e sintomas - Parestesia (onde)
    translated_name: Paresthesia (where)
    description: Free text giving the body location of the paresthesia reported in STPARESTES.
      Not about cranial nerve pairs.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 42 (Sinais e sintomas – Parestesia (onde))
  DS_TRAT:
    official_name: Tratamento - Se outros, especificar
    translated_name: Other treatment (specify)
    description: Free text describing another treatment given to the patient (e.g. tracheostomy),
      see STOUTROTRA.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 57 (Tratamento – Se outros, especificar)
  DTATEND:
    official_name: Data do 1º atendimento
    translated_name: Date of first medical attendance
    description: 'When the patient was seen. Antitoxin only neutralises toxin not yet
      bound to nerve endings, so the delay from onset decides how much it can do.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 33 (Data do 1º atendimento)
  DTELETRO:
    official_name: Eletroneuromiografia - Data da realização
    translated_name: Electroneuromyography date
    description: Date the electroneuromyography (ENMG) exam was performed. AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 66 (Exames complementares – Data da realização)
  DTFEZESCOL:
    official_name: Data da coleta - Fezes
    translated_name: Stool collection date
    description: Date a stool sample was collected from the patient for botulinum toxin testing.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Data da coleta – Fezes)
  DTSORO:
    official_name: Se recebeu soro antibotulínico, data da administração
    translated_name: Antibotulinum serum administration date
    description: Date the botulinum antitoxin (soro antibotulínico) was given to the patient.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 58 (Se recebeu soro antibotulínico, data da administração)
  DTSOROCOL:
    official_name: Data da coleta - Soro
    translated_name: Serum collection date
    description: Date a serum sample was collected from the patient for botulinum toxin testing.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Data da coleta – Soro)
  DTSUSPEIC:
    official_name: Data da suspeição clínica
    translated_name: Date of clinical suspicion
    description: 'When botulism was first suspected. Against DTATEND it measures diagnostic
      delay — botulism is rare enough to be missed at first presentation.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 35 (Data da suspeição clínica)
  DT_ALI1COL:
    official_name: Data da coleta - Alimento 1
    translated_name: Collection date - food item (1)
    description: 'Date a sample of the first suspected food item (DS_ALI1) was collected
      for laboratory testing. AAAAMMDD.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Data da coleta – Alimento 1)
  DT_ALI2COL:
    official_name: Data da coleta - Alimento 2
    translated_name: Collection date - food item (2)
    description: 'Date a sample of the second suspected food item (DS_ALI2) was collected;
      see DT_ALI1COL.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Data da coleta – Alimento 2)
  DT_COLOUT:
    official_name: Data da coleta - Outro
    translated_name: Collection date - other
    description: Date the other material specified in DS_OUTRO was collected. AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Data da coleta – Outro)
  DT_LIQUOR:
    official_name: Líquor - Data da coleta
    translated_name: Collection date - CSF
    description: Date the cerebrospinal fluid (líquor) sample was collected. AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 62 (Exames complementares – Líquor, Data da coleta)
  MUN_ING:
    official_name: Município onde ingeriu o alimento suspeito
    translated_name: Municipality where the suspect food was eaten
    description: 'IBGE code of the municipality where the patient ate the food suspected
      of causing botulism, which can differ from the residence or notifying municipality
      when the meal was eaten while travelling.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 55 (Município onde ingeriu o alimento suspeito)
  NUATEND:
    official_name: Nº total de atendimentos até a suspeição clínica
    translated_name: Number of medical visits until clinical suspicion
    description: Total number of medical visits the patient had before botulism was clinically
      suspected (0 if none).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 34 (Nº total de atendimentos até a suspeição clínica)
  NUCONSOME:
    official_name: Número de pessoas (comensais) que consumiram o alimento suspeito
    translated_name: Number of people who ate the suspect food
    description: Number of people (diners) who ate the food suspected of causing the botulism.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 56 (Número de pessoas (comensais) que consumiram o alimento suspeito)
  NU_CELULA:
    official_name: Líquor - número de células/mm3
    translated_name: CSF cell count (cells/mm3)
    description: Cerebrospinal-fluid cell count in cells/mm3.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 63 (Exames complementares – número de células/mm3)
  NU_PROTEI:
    official_name: Líquor - Proteínas mg%
    translated_name: CSF protein (mg%)
    description: Cerebrospinal-fluid protein level in mg%.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 64 (Exames complementares – Proteínas mg%)
  RESALIM1:
    official_name: Resultado - Alimento 1
    translated_name: Result - food 1
    description: Result of the botulinum toxin analysis of suspect food 1 (toxin present, absent,
      inconclusive or not done).
    code_system: internal
    codes: {'1': Toxina presente, '2': Ausente, '3': Inconclusivo, '4': Não realizado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Resultado – Alimento 1)
  RESALIMOUT:
    official_name: Resultado - Outro
    translated_name: Result - other material
    description: Result of the botulinum toxin analysis of the other material collected (toxin
      present, absent, inconclusive or not done).
    code_system: internal
    codes: {'1': Toxina presente, '2': Ausente, '3': Inconclusivo, '4': Não realizado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 60 (Resultado – Outro)
  STALIMENTO:
    official_name: Suspeita de transmissão alimentar?
    translated_name: Suspected foodborne transmission
    description: Whether the botulism case is suspected to be of food origin; if not, the food-exposure
      block is skipped.
    code_system: internal
    codes: {'1': Sim, '2': Não, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 45 (Suspeita de transmissão alimentar?)
  STANTIBIO:
    official_name: Tratamento - Antibioticoterapia
    translated_name: Antibiotic given (flag)
    description: 'Whether the botulism patient received antibiotic treatment, tracked
      separately from the antitoxin serum (STANTIBOTU) because antibiotics address
      secondary infection or wound botulism rather than neutralize circulating toxin.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 57 (Tratamento – Antibioticoterapia)
  STANTIBOTU:
    official_name: Se recebeu soro antibotulínico, foi após a coleta do material clínico?
    translated_name: Antitoxin given after clinical sample collection
    description: For patients who received botulinum antitoxin, whether it was given after the
      clinical samples were collected (antitoxin can mask toxin detection).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 59 (Se recebeu soro antibotulínico, foi após a coleta do material clínico?)
  STBOCA:
    official_name: Sinais e sintomas - Boca seca
    translated_name: Dry mouth
    description: 'Whether the botulism patient reports dry mouth, one of the autonomic
      symptom checkboxes recorded alongside constipation (STCONSTIPA), caused by the
      toxin''s effect on smooth muscle.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 42 (Sinais e sintomas – Boca seca)
  STBROMATO:
    official_name: Presença de toxina botulínica na amostra bromatológica
    translated_name: Botulinum toxin in food (bromatological) sample
    description: Whether botulinum toxin was detected in the bromatological (food) sample.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 73 (Presença de toxina botulínica na amostra bromatológica)
  STBULBAR:
    official_name: Exame neurológico - Comprometimento da musculatura bulbar
    translated_name: Neurological exam - bulbar muscle involvement
    description: 'Whether the patient shows bulbar palsy (weakness of the lower cranial-nerve
      muscles controlling swallowing and speech), marking progression of botulism''s
      descending paralysis pattern.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 43 (Exame neurológico – Comprometimento da musculatura bulbar)
  STCARDIACA:
    official_name: Sinais e sintomas - Insuficiência cardíaca
    translated_name: Signs and symptoms - heart failure
    description: Whether the patient presented heart failure.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 42 (Sinais e sintomas – Insuficiência cardíaca)
  STCASEIRA:
    official_name: Produção do alimento suspeito - Caseira
    translated_name: Home-made food source
    description: 'Whether the suspect food was home-made/home-preserved (e.g. home-canned
      vegetables), the classic source for foodborne botulism, tracked alongside commercial
      (STCOMERCIO) and restaurant (STRESTAURA) sources.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 47 (Produção do alimento suspeito – Caseira)
  STCEFALEIA:
    official_name: Sinais e sintomas - Cefaleia
    translated_name: Headache
    description: 'Whether the botulism patient reports headache, a general/nonspecific
      symptom checkbox recorded alongside the disease''s more distinctive cranial-nerve
      signs.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Botulismo v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/Botulismo/DIC_DADOS_Botulismo_v5.pdf,
      campo 42 (Sinais e sintomas – Cefaléia)
  STCLINICA:
    official_name: Presença de toxina botulínica na amostra clínica
    translated_name: Botulinum toxin in clinical sample
    description: Whether botulinum toxin was detected in a clinical sample from the patient (serum,
      stool or other).
    code_system: none
    source: layout_doc
