# SINAN.ROTA —
#
# one notification of rotavirus
system: SINAN
asserted_by: pegasus_data

variables:
  ACONDIC:
    official_name: 'Acondicionamento da amostra'
    translated_name: 'Stool sample adequately packaged'
    description: 'Whether the stool sample was adequately packaged and stored for transport to the laboratory.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 58 (Acondicionamento da amostra)'
  BACTERIA:
    official_name: 'Bactéria identificada na amostra'
    translated_name: 'Bacterium identified in sample'
    description: 'Whether a bacterium was identified in the stool sample; its name goes in NOME_BACT.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 51 (Bactéria identificada na amostra)'
  CASO_ISOLA:
    official_name: Caso isolado
    translated_name: Isolated case
    description: Whether the case stands alone, the complement of SURTO.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: CASO_ISOLA reads caso isolado; the counterpart flag to SURTO.
  DT_1VAC:
    official_name: 'Data da aplicação 1ª dose'
    translated_name: Date of first rotavirus dose
    description: 'When the first rotavirus dose was given. The schedule is strictly
      age limited, because the vaccine raises intussusception risk if given late.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 37 (Data da aplicação 1ª dose)'
  DT_2VAC:
    official_name: 'Data da aplicação 2ª dose'
    translated_name: Date of second rotavirus dose
    description: When the second rotavirus dose was given, completing the schedule.
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 40 (Data da aplicação 2ª dose)'
  DT_ENVIO:
    official_name: 'Data de envio da amostra ao LACEN'
    translated_name: Date sent to laboratory
    description: 'Date the stool sample was sent to the state public-health laboratory (LACEN); with DT_FEZES it gives the transit delay.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 57 (Data de envio da amostra ao LACEN)'
  DT_FEZES:
    official_name: 'Data da coleta da amostra de fezes'
    translated_name: Date stool collected
    description: 'When the stool was collected. Rotavirus is shed heavily in the first
      days, so a sample taken then is almost always positive.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 45 (Data da coleta da amostra de fezes)'
  DT_VOP:
    official_name: 'Data da última dose de VOP'
    translated_name: 'Date of last oral polio vaccine dose'
    description: 'Date of the last dose of oral polio vaccine (VOP) the child received.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 44 (Data da última dose de VOP)'
  D_DIAR:
    official_name: 'Diarreia - Duração de dias com diarreia'
    translated_name: Diarrhea duration (days)
    description: 'Number of days with diarrhoea; filled when the diarrhoea sign is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 31 (Sinais e sintomas – Diarreia / Duração de dias com diarreia)'
  D_VOMITO:
    official_name: 'Vômito - Duração de dias com vômito'
    translated_name: Days of vomiting
    description: 'Number of days with vomiting; filled when the vomiting sign is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 31 (Sinais e sintomas – Vômito / Duração de dias com vômito)'
  GENOT_G:
    official_name: 'Qual o genótipo G'
    translated_name: Rotavirus G genotype
    description: 'Rotavirus G-genotype (VP7 glycoprotein) identified by molecular typing,
      the first half of the standard G/P rotavirus strain nomenclature (e.g. G1P[8]);
      paired with GENOT_P.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 47 (Qual o genótipo G)'
  GENOT_P:
    official_name: 'Qual o genótipo P'
    translated_name: Rotavirus P genotype
    description: 'Rotavirus P-genotype (VP4 protease-sensitive protein) identified
      by molecular typing, the second half of the G/P strain nomenclature; sibling
      field to GENOT_G.

      '
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 48 (Qual o genótipo P)'
  LAB_PROD1:
    official_name: 'Laboratório produtor 1ª dose'
    translated_name: 'Vaccine manufacturer - dose 1'
    description: 'Name of the laboratory that produced the first rotavirus vaccine dose.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 39 (Laboratório produtor 1ª dose)'
  LAB_PROD2:
    official_name: 'Laboratório produtor 2ª dose'
    translated_name: 'Vaccine manufacturer - dose 2'
    description: 'Name of the laboratory that produced the second rotavirus vaccine dose.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 42 (Laboratório produtor 2ª dose)'
  LEITE:
    official_name: Aleitamento
    translated_name: Breastfeeding
    description: 'Whether the child was breastfed. Breastfeeding is protective against
      rotavirus, so it is a confounder in any vaccine effectiveness estimate.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: LEITE reads leite; a yes/no flag.
  LOTE1:
    official_name: 'Lote da vacina 1ª dose'
    translated_name: Vaccine lot number - dose 1
    description: 'Lot number of the first rotavirus vaccine dose.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 38 (Lote da vacina 1ª dose)'
  LOTE2:
    official_name: 'Lote da vacina 2ª dose'
    translated_name: 'Vaccine lot number - dose 2'
    description: 'Lot number of the second rotavirus vaccine dose.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 41 (Lote da vacina 2ª dose)'
  NOME_BACT:
    official_name: 'Se sim, qual bactéria'
    translated_name: Bacteria name (free text)
    description: 'Free-text name of the bacterium identified in the stool sample; filled when BACTERIA is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 52 (Se sim, qual bactéria)'
  NOME_PARAS:
    official_name: 'Se sim, qual parasita'
    translated_name: Name of identified parasite
    description: 'Free-text name of the parasite identified in the stool sample; filled when PARASITA is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 54 (Se sim, qual parasita)'
  NOME_VIRUS:
    official_name: 'Outros vírus identificados na amostra - se sim, qual'
    translated_name: 'Other virus identified in sample'
    description: 'Free-text name of a virus other than rotavirus identified in the stool sample; filled when OUT_VIRUS is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 50 (Outros vírus – se sim, qual)'
  N_DIAR:
    official_name: 'Diarreia - Número de episódios de diarreia'
    translated_name: 'Number of diarrhoea episodes'
    description: 'Number of diarrhoea episodes; the duration in days is D_DIAR.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 31 (Sinais e sintomas – Diarreia / Número de episódios de diarreia)'
  N_VOMITO:
    official_name: 'Vômito - Número de episódios de vômito'
    translated_name: Number of vomiting episodes
    description: 'Number of vomiting episodes; the duration in days is D_VOMITO.'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 31 (Sinais e sintomas – Vômito / Número de episódios de vômito)'
  OUT_MEDIC:
    official_name: 'Uso de medicamento antes da coleta - se sim, qual?'
    translated_name: 'Medication used before sample collection'
    description: 'Free-text name of the medication the patient used before the stool sample was collected; filled when MEDICAMENT is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 56 (Uso de medicamento antes da coleta – se sim, qual?)'
  OUT_VIRUS:
    official_name: Outro vírus detectado
    translated_name: Other virus detected
    description: 'Whether another virus was found — norovirus and adenovirus cause
      the same illness and rise in importance as rotavirus vaccination reduces its
      share.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: OUT_VIRUS reads outro vírus; a yes/no flag.
  PARASITA:
    official_name: Parasita detectado
    translated_name: Parasite detected
    description: Whether a parasite was found as an alternative cause of the diarrhoea.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PARASITA reads parasita; a yes/no flag.
  ROTA_R:
    official_name: Resultado para rotavírus
    translated_name: Rotavirus result
    description: Whether rotavirus was detected in the stool.
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: ROTA_R names the rotavirus result; a yes/no flag.
  SANG:
    official_name: Sangue nas fezes
    translated_name: Blood in stool
    description: 'Blood in the stool. Argues against rotavirus, which causes watery
      diarrhoea, and towards a bacterial dysentery.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: SANG reads sangue; a clinical flag.
  SURTO:
    official_name: Caso associado a surto
    translated_name: Part of an outbreak
    description: 'Whether the case belongs to an outbreak. Rotavirus is highly transmissible
      in nurseries and wards, so clustering is common and changes the response.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: SURTO reads surto; a yes/no flag.
  TIPO_LEITE:
    official_name: Tipo de aleitamento
    translated_name: Feeding type
    description: 'Whether feeding was exclusively breast milk or mixed. Exclusivity
      is what the protective effect depends on, so the split matters more than the
      flag.

      '
    code_system: internal
    source: def
    source_ref: TIPO_LEITE.CNV
    reasoning: Bound to TIPO_LEITE, whose values are exclusivo and misto.
  T_FEBRE:
    official_name: 'Febre - Temperatura'
    translated_name: 'Fever temperature'
    description: 'Temperature reached during the fever (two digits, degrees Celsius); filled when FEBRE is 1 (yes).'
    code_system: none
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 31 (Sinais e sintomas – Febre / Temperatura)'
  VOP_VORH:
    official_name: 'Vacina VOP'
    translated_name: 'Oral polio vaccine on same day as rotavirus vaccine'
    description: 'Whether the child received oral polio vaccine (VOP) on the same day as the rotavirus vaccine.'
    code_system: 'internal'
    source: layout_doc
    source_ref: 'Dicionário de Dados SINAN NET v5.0 – Rotavírus (rev. jan/2015) — sources/dic_text/rotavirus__DIC_DADOS_ROTA_NET_v5.1.txt (DIC_DADOS_ROTA_NET_v5.1.pdf, portalsinan.saude.gov.br), campo 43 (Vacina VOP)'
