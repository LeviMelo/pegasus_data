# SINAN.SIFC — Congenital syphilis
# Sífilis congênita
#
# One case of syphilis transmitted in pregnancy. Treated as a sentinel
# indicator: a congenital case means antenatal screening or treatment failed.
system: SINAN
asserted_by: pegasus_data

variables:
  ANTSIFIL_N:
    official_name: Diagnóstico de sífilis materna
    translated_name: Timing of maternal syphilis diagnosis
    description: 'When the mother''s syphilis was diagnosed: during prenatal care, at
      delivery/curettage, after delivery, not done, or unknown.'
    code_system: internal
    codes: {'1': Pré-natal, '2': Parto/curetagem, '3': Após o parto, '4': Não realizado, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 39 (Diagnóstico de sífilis materna)
  ANT_IDADE:
    official_name: Idade da mãe
    translated_name: Mother's age
    description: 'The mother''s age, banded. Congenital syphilis concentrates in young
      mothers with poor antenatal access, so this is a marker of the failure rather
      than of biology.

      '
    code_system: internal
    source: def
    source_ref: FXID10MAENET.CNV
    reasoning: Bound to FXID10MAENET, whose labels are ten-year maternal age bands.
  ANT_MUNI_C:
    official_name: Município do nascimento/aborto/natimorto
    translated_name: Municipality of birth/abortion/stillbirth
    description: IBGE code of the municipality where the birth, abortion or stillbirth
      (or child death) occurred.
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 48 (Município do nascimento/aborto/natimorto)
  ANT_PRE_NA:
    official_name: Realizou pré-natal
    translated_name: Attended antenatal care
    description: 'Whether the mother attended antenatal care. Congenital syphilis in
      a woman who did attend is a different failure from one in a woman who did not:
      the first means the system missed it, the second that it never had the chance.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: PRE_NA reads pré-natal; a yes/no flag.
  ANT_RACA:
    official_name: Raça ou cor da mãe
    translated_name: Mother's race
    description: 'The mother''s self-declared race or colour. Recorded because congenital
      syphilis rates differ sharply by race in Brazil, which is a measure of unequal
      antenatal care.

      '
    code_system: internal
    source: def
    source_ref: RAÇA.CNV
    reasoning: Bound to RAÇA, whose values are branca, preta, amarela, parda and indígena.
  ANT_TRATAD:
    official_name: Parceiro tratado
    translated_name: Partner treated
    description: 'Whether the mother''s partner was treated. An untreated partner reinfects
      the mother, which is the commonest reason adequate maternal treatment still ends
      in a congenital case.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAO.CNV
    reasoning: TRATAD reads tratado, in the antecedent block about the partner.
  ANT_UF_CRI:
    official_name: UF do nascimento/aborto/natimorto
    translated_name: State of birth/abortion/stillbirth
    description: State (UF) where the birth, abortion or stillbirth (or child death) occurred.
      Not the child's residence.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 47 (UF do nascimento/aborto/natimorto)
  CLI_OSTEO:
    official_name: Presença de sinais e sintomas - Osteocondrite
    translated_name: Signs and symptoms - osteochondritis
    description: Whether the child presented osteochondritis (painful osteoarticular lesions
      on handling); "not applicable" for abortion or stillbirth.
    code_system: internal
    codes: {'1': Sim, '2': Não, '3': Não se aplica, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 63 (Presença de sinais e sintomas – Osteocondrite)
  CLI_RINITE:
    official_name: Presença de sinais e sintomas - Rinite muco-sanguinolenta
    translated_name: Signs and symptoms - mucosanguineous rhinitis
    description: Whether the child presented mucosanguineous (syphilitic) rhinitis; "not
      applicable" for abortion or stillbirth.
    code_system: internal
    codes: {'1': Sim, '2': Não, '3': Não se aplica, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 63 (Presença de sinais e sintomas – Rinite muco-sanguinolenta)
  DS_ESQUEMA:
    official_name: Esquema de tratamento - Outro esquema
    translated_name: Other treatment scheme (specify)
    description: Free text specifying the child's treatment scheme when it is not one
      of the listed penicillin regimens (TRA_ESQU_1 = 4).
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 64 (Esquema de tratamento – Outro esquema)
  ESCOLMAE:
    official_name: Escolaridade da mãe
    translated_name: Mother's schooling
    description: 'The mother''s education, from illiterate upward. The strongest social
      predictor of whether antenatal syphilis was caught and treated.

      '
    code_system: internal
    source: def
    source_ref: ESCOLARNET.CNV
    reasoning: Bound to ESCOLARNET, the schooling codelist.
  EVO_DIAG_N:
    official_name: Diagnóstico final
    translated_name: Final diagnosis
    description: 'How the case closed: recent congenital syphilis, late congenital
      syphilis, abortion, stillbirth, or discarded. Abortion and stillbirth are outcomes
      of the disease, so excluding them undercounts its burden.

      '
    code_system: internal
    source: def
    source_ref: DIAGSIFC.CNV
    reasoning: 'Bound to DIAGSIFC, whose values are sífilis congênita recente, tardia,
      aborto, natimorto and descartado.

      '
  LABC_DT:
    official_name: Teste treponêmico após 18 meses - Data
    translated_name: Treponemal test after 18 months - date
    description: Date of the child's treponemal test done after 18 months of age. AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 54 (Teste treponêmico após 18 meses – Data)
  LABC_DT_1:
    official_name: Teste não treponêmico - Sangue periférico - Data
    translated_name: Non-treponemal test (peripheral blood) - date
    description: Collection date of the child's non-treponemal test (e.g. VDRL) on peripheral
      blood. AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 52 (Teste não treponêmico – Sangue periférico, Data)
  LABC_DT_2:
    official_name: Teste não treponêmico - Líquor - Data
    translated_name: Non-treponemal test (CSF) - date
    description: Collection date of the child's non-treponemal test on cerebrospinal fluid.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 57 (Teste não treponêmico – Líquor, Data)
  LABC_EVIDE:
    official_name: Evidência radiológica
    translated_name: Radiological evidence
    description: 'Whether long-bone X-rays show the changes of congenital syphilis.
      Often the only objective sign in a baby who looks well at birth.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAONRE.CNV
    reasoning: Bound to SIM_NAONRE; EVIDE reads evidência.
  LABC_IGG:
    official_name: IgG da criança
    translated_name: Infant IgG
    description: 'The infant''s IgG. Crosses the placenta, so it reflects the mother
      as much as the child and is the least decisive of the infant tests.

      '
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE; the infant IgG marker.
  LABC_LIQUO:
    official_name: Teste no líquor da criança
    translated_name: Infant CSF test
    description: 'The infant''s CSF test. A reactive CSF means neurosyphilis, which
      requires ten days of intravenous penicillin rather than a single injection —
      so this field changes the treatment.

      '
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE; LIQUO reads líquor in the infant block.
  LABC_LIQ_1:
    official_name: Alteração liquórica
    translated_name: CSF abnormality
    description: 'Whether the CSF was abnormal on cells or protein, beside the serological
      result in LABC_LIQUO.

      '
    code_system: internal
    source: def
    source_ref: SIM_NAONRE.CNV
    reasoning: Bound to SIM_NAONRE; a second CSF item in the infant block.
  LABC_SANGU:
    official_name: Teste não treponêmico do sangue da criança
    translated_name: Infant blood non-treponemal test
    description: 'The infant''s VDRL on blood. Maternal antibody crosses the placenta,
      so a reactive result alone does not diagnose the baby — the titre comparison
      does.

      '
    code_system: internal
    source: def
    source_ref: REATIVO.CNV
    reasoning: 'Bound to REATIVO; LABC_ marks the criança block against the maternal
      LAB_ one.

      '
  LABC_TITUL:
    official_name: Titulação realizada
    translated_name: Titration performed
    description: Whether a titration was carried out at all, as against simple reactivity.
    code_system: internal
    source: def
    source_ref: SIM_NAONRE.CNV
    reasoning: Bound to SIM_NAONRE, sim/não/não realizado.
  LABC_TIT_1:
    official_name: Teste não treponêmico - Sangue periférico - Título
    translated_name: Infant blood titre
    description: 'The infant''s blood titre. A titre more than fourfold the mother''s
      indicates the baby''s own infection rather than transferred antibody.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 51 (Teste não treponêmico – Sangue periférico, Título)
  LABC_TIT_2:
    official_name: Teste não treponêmico - Líquor - Título
    translated_name: CSF titre
    description: The infant's CSF titre, beside the reactivity in LABC_LIQUO.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 56 (Teste não treponêmico – Líquor, Título)
  LAB_CONF:
    official_name: Teste treponêmico
    translated_name: Treponemal test
    description: 'The confirmatory treponemal test. Stays reactive for life, so it
      confirms that infection occurred but says nothing about whether it is active.

      '
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE; the confirmatory test beside the non-treponemal one.
  LAB_DT3:
    official_name: Data da coleta teste não treponêmico no parto/curetagem
    translated_name: Date of test at delivery
    description: Collection date of the mother's non-treponemal test (VDRL) at delivery/curettage.
      AAAAMMDD.
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 42 (Data da coleta teste não treponêmico no parto/curetagem)
  LAB_PARTO:
    official_name: Teste não treponêmico no parto
    translated_name: Non-treponemal test at delivery
    description: 'The mother''s VDRL at delivery. The last chance to detect maternal
      syphilis before the baby is exposed.

      '
    code_system: internal
    source: def
    source_ref: REAGE.CNV
    reasoning: Bound to REAGE, reagente/não reagente/não realizado.
  LAB_TITU_2:
    official_name: Resultado teste não treponêmico no parto/curetagem - Título
    translated_name: Titre at delivery
    description: 'The numeric titre at delivery. The titre, not merely reactivity,
      is what distinguishes active infection from a serological scar, and comparing
      it with the infant''s is the core of the diagnosis.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 41 (Resultado teste não treponêmico no parto/curetagem – Título)
  LESOES:
    official_name: Presença de sinais e sintomas - Lesões cutâneas
    translated_name: Skin/mucosal lesions (clinical sign)
    description: 'Whether the newborn had skin or mucosal lesions (e.g. palmoplantar
      pemphigus, condyloma lata) — another classic congenital syphilis sign, recorded
      separately from the bone findings in CLI_OSTEO.

      '
    code_system: internal
    codes: {'1': Sim, '2': Não, '3': Não se aplica, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 63 (Presença de sinais e sintomas – Lesões cutâneas)
  MUN_PRE_NA:
    official_name: Município do local da realização do pré-natal
    translated_name: Municipality of antenatal care
    description: 'Where the antenatal care was given. Frequently not the municipality
      of residence, since small municipalities refer pregnancies out — which is itself
      part of why antenatal screening fails.

      '
    codelist: BR_MUNICIPALFA
    code_system: external
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 37 (Município do local da realização do pré-natal)
  SIN_OUTR_E:
    official_name: Presença de sinais e sintomas - Outro (especificar)
    translated_name: Other clinical sign, specify (free text)
    description: 'Free-text name of a congenital syphilis sign not covered by the form''s
      fixed checklist (CLI_OSTEO, LESOES, hepatosplenomegaly, etc.).

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 63 (Presença de sinais e sintomas – Outro, especificar)
  TRA_DIAG_C:
    official_name: Diagnóstico clínico da criança
    translated_name: Child's clinical diagnosis
    description: Whether the child is asymptomatic or symptomatic for congenital syphilis
      on physical examination ("not applicable" for abortion or stillbirth). Not about
      maternal treatment.
    code_system: internal
    codes: {'1': Assintomático, '2': Sintomático, '3': Não se aplica, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 62 (Diagnóstico clínico da criança)
  TRA_DIAG_T:
    official_name: Tratamento da criança
    translated_name: Infant treated
    description: Whether the infant was treated.
    code_system: internal
    source: def
    source_ref: SIM_NAONRE.CNV
    reasoning: Bound to SIM_NAONRE, in the treatment block.
  TRA_DT:
    official_name: Data do início do tratamento
    translated_name: Date of treatment
    description: 'When the mother was treated. Treatment must be complete more than
      thirty days before delivery to be judged adequate, so this date against the birth
      is what decides that.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 45 (Data do início do tratamento)
  TRA_ESQU_1:
    official_name: Esquema de tratamento
    translated_name: Child's treatment scheme
    description: 'Treatment regimen given to the child: crystalline, procaine or benzathine
      penicillin G, another scheme, not done, or not applicable.'
    code_system: internal
    codes: {'1': Penicilina G cristalina, '2': Procaína, '3': Benzatina, '4': Outro esquema, '5': Não realizado, '6': Não se aplica, '9': Ignorado}
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 64 (Esquema de tratamento)
  UF_PRE_NAT:
    official_name: UF do local da realização do pré-natal
    translated_name: State (UF) of prenatal care
    description: 'State where the mother received prenatal care - relevant to tracing
      whether and where prenatal syphilis screening occurred; paired with MUN_PRE_NA
      for the municipality.

      '
    code_system: none
    source: layout_doc
    source_ref: Dicionário de Dados SINAN NET – Sífilis Congênita v5 — http://portalsinan.saude.gov.br/images/documentos/Agravos/SifilisCongenita/DIC_DADOS_Sifilis_Congenita_v5.pdf,
      campo 36 (UF do local da realização do pré-natal)
