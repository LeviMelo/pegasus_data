system: SINAN
asserted_by: pegasus_data

variables:
  NU_TRAB:
    official_name: Número de trabalhadores expostos ao mesmo risco
    translated_name: Number of workers exposed to the same risk
    description: >
      Count of workers at the establishment exposed to the same hazard that
      caused this severe work accident, recorded on the ACGR (Acidente de
      Trabalho Grave) form to gauge how many others were at risk, not just
      the injured worker.
    code_system: none
    source: inferred
    reasoning: >
      NU_ = número, TRAB = trabalhadores; the field belongs to the ACGR
      (severe occupational accident) series, whose form asks how many
      workers share the accident's risk; width 5 supports a headcount.

  OCULOS:
    official_name: Uso de óculos de proteção no momento do acidente
    translated_name: Protective eyewear worn during the accident
    description: >
      Whether the worker was wearing protective goggles when a biological
      material accident (needlestick, splash, etc.) occurred - one of the
      personal-protective-equipment checkboxes on the ACBI occupational
      biological-exposure form.
    code_system: none
    source: inferred
    reasoning: >
      ACBI = Acidente de Trabalho com Exposição a Material Biológico; OCULOS
      = óculos (goggles), a standard PPE item on such forms; width 1 matches
      a single checkbox.

  OUTRO_ARV:
    official_name: Uso de outro esquema antirretroviral
    translated_name: Other antiretroviral regimen used (flag)
    description: >
      Whether the exposed worker received an antiretroviral post-exposure
      prophylaxis regimen other than the standard first-choice combination,
      after a biological-material accident with HIV risk. Paired with
      OUT_ARV_ES, which names the drug.
    code_system: none
    source: inferred
    reasoning: >
      ACBI form documents post-exposure ARV prophylaxis; OUTRO = "outro",
      ARV = antirretroviral; width 1 matches a Sim/Não checkbox, and the
      companion free-text field confirms the checkbox+specify pattern.

  OUT_ARV_ES:
    official_name: Outro esquema antirretroviral - especifique
    translated_name: Other antiretroviral regimen - specify
    description: >
      Free-text name of the non-standard antiretroviral drug or regimen
      given as post-exposure prophylaxis, filled in only when OUTRO_ARV
      marks that an "other" scheme was used rather than the default
      combination.
    code_system: none
    source: inferred
    reasoning: >
      Width 30 fits a drug/regimen name; ES = "especifique", the standard
      SINAN pairing for an "outro" checkbox; pairs with OUTRO_ARV.

  OUTRO_DOE:
    official_name: Outra doença associada
    translated_name: Other associated disease (flag)
    description: >
      Whether the pneumoconiosis patient has a pre-existing or associated
      disease not covered by the form's named comorbidity checkboxes (e.g.
      tuberculosis, autoimmune conditions). Paired with OUT_DOE_DE, which
      names the disease.
    code_system: none
    source: inferred
    reasoning: >
      PNEU = Pneumoconioses; OUTRO_DOE = "outra doença"; companion free-text
      field OUT_DOE_DE confirms the checkbox+specify pattern; width 1.

  OUT_DOE_DE:
    official_name: Outra doença associada - descrição
    translated_name: Other associated disease - description
    description: >
      Free-text name of the associated disease recorded when OUTRO_DOE
      flags a comorbidity outside the pneumoconiosis form's standard
      checklist.
    code_system: none
    source: inferred
    reasoning: >
      DE = "descreva"; width 30 fits a disease name; pairs with OUTRO_DOE.

  OUT_EXAME:
    official_name: Realização de outro exame complementar
    translated_name: Other complementary exam performed (flag)
    description: >
      Whether a diagnostic test other than the pneumoconiosis form's named
      exams (e.g. chest X-ray, tomography as in TOMOGRAFIA) was performed,
      without identifying which one.
    code_system: none
    source: inferred
    reasoning: >
      PNEU form; OUT_ = outro, EXAME = exame; width 1 checkbox, no
      accompanying specify field found among this batch's columns.

  PAIS_EXP:
    official_name: País de exposição
    translated_name: Country of exposure
    description: >
      Country where the poisoning exposure took place, used for the
      minority of Intoxicação Exógena (IEXO) cases where contact with the
      toxic agent happened outside Brazil.
    code_system: none
    source: inferred
    reasoning: >
      IEXO = Intoxicação Exógena; PAIS = país, EXP = exposição; width 4
      short code, but no codelist is bound to it in the catalog.

  PART_CORP1:
    official_name: Parte do corpo atingida (1ª)
    translated_name: Body part injured (1st)
    description: >
      Coded body region injured in a severe (ACGR) work accident - first of
      up to three selections the form allows, since one accident can affect
      more than one body part (e.g. head, hand, trunk).
    code_system: none
    source: inferred
    reasoning: >
      PART_CORP = parte do corpo, numbered 1-3 for multiple selections;
      width 2 fits a short region code with no bound codelist in the
      catalog.

  PART_CORP2:
    official_name: Parte do corpo atingida (2ª)
    translated_name: Body part injured (2nd)
    description: >
      Second body region injured, recorded alongside PART_CORP1 when the
      severe work accident affected more than one part of the body; same
      coding scheme as PART_CORP1.
    code_system: none
    source: inferred
    reasoning: Second of three same-pattern fields; see PART_CORP1.

  PART_CORP3:
    official_name: Parte do corpo atingida (3ª)
    translated_name: Body part injured (3rd)
    description: >
      Third body region injured, completing the up-to-three-part injury
      record alongside PART_CORP1 and PART_CORP2.
    code_system: none
    source: inferred
    reasoning: Third of three same-pattern fields; see PART_CORP1.

  PMM:
    official_name: Parasitemia (parasitos por mm³)
    translated_name: Parasite density (parasites per mm³)
    description: >
      Quantitative parasite count from the malaria patient's blood smear,
      expressed as parasites per cubic millimeter of blood - a numeric lab
      value distinct from the qualitative species-positive checkboxes
      elsewhere on the form.
    code_system: none
    source: inferred
    reasoning: >
      MALA = Malária; declared character in some schema years and numeric
      (width 8) in later ones, consistent with a lab count rather than a
      code; "parasitos/mm3" is the standard unit for malaria parasitemia.

  POEIRAS:
    official_name: Exposição a poeiras
    translated_name: Dust exposure (general)
    description: >
      Whether the pneumoconiosis patient had occupational exposure to dust
      in general - the umbrella risk-factor checkbox above the form's
      specific dust-type items (abrasive, mixed, organic).
    code_system: none
    source: inferred
    reasoning: PNEU form; POEIRAS = poeiras (dusts); width 1 checkbox.

  POE_ABRASI:
    official_name: Exposição a poeira abrasiva
    translated_name: Exposure to abrasive dust
    description: >
      Whether exposure was specifically to abrasive dust (e.g. from
      sandblasting or grinding), one of three dust-type refinements -
      alongside mixed (POE_MISTA) and organic (POE_ORGANI) - of the general
      POEIRAS flag.
    code_system: none
    source: inferred
    reasoning: POE_ = poeira; ABRASI = abrasiva; width 1 checkbox.

  POE_MISTA:
    official_name: Exposição a poeira mista
    translated_name: Exposure to mixed dust
    description: >
      Whether exposure was to mixed dust, the second of the three dust-type
      refinements of POEIRAS, alongside abrasive (POE_ABRASI) and organic
      (POE_ORGANI).
    code_system: none
    source: inferred
    reasoning: POE_ = poeira; MISTA = mista; width 1 checkbox.

  POE_ORGANI:
    official_name: Exposição a poeira orgânica
    translated_name: Exposure to organic dust
    description: >
      Whether exposure was to organic dust (e.g. agricultural/biological
      material rather than mineral dust), the third refinement of POEIRAS
      alongside abrasive and mixed dust.
    code_system: none
    source: inferred
    reasoning: POE_ = poeira; ORGANI = orgânica; width 1 checkbox.

  P_ATIVO_1:
    official_name: Princípio ativo (1º)
    translated_name: Active ingredient (1st)
    description: >
      Free-text name of the toxic substance's active ingredient (e.g. a
      pesticide's chemical name) involved in the poisoning - first of up to
      three the IEXO form records when more than one agent was involved.
    code_system: none
    source: inferred
    reasoning: >
      IEXO form; P_ATIVO = princípio ativo; width 60 fits a chemical/product
      name; numbered 1-3 like PART_CORP and VIA below.

  P_ATIVO_2:
    official_name: Princípio ativo (2º)
    translated_name: Active ingredient (2nd)
    description: >
      Second active-ingredient name recorded when the poisoning involved
      more than one toxic substance, alongside P_ATIVO_1.
    code_system: none
    source: inferred
    reasoning: Second of three same-pattern fields; see P_ATIVO_1.

  P_ATIVO_3:
    official_name: Princípio ativo (3º)
    translated_name: Active ingredient (3rd)
    description: >
      Third active-ingredient name, completing the up-to-three-substance
      record alongside P_ATIVO_1 and P_ATIVO_2.
    code_system: none
    source: inferred
    reasoning: Third of three same-pattern fields; see P_ATIVO_1.

  RUIDO_OUT:
    official_name: Outra fonte de ruído
    translated_name: Other noise source (flag)
    description: >
      Whether the noise-induced hearing loss (PAIR) patient was exposed to
      a workplace noise source not covered by the form's standard list.
      Paired with RUI_OUTDES, which names it.
    code_system: none
    source: inferred
    reasoning: RUIDO_OUT = ruído + outro; width 1 checkbox.

  RUI_OUTDES:
    official_name: Outra fonte de ruído - descrição
    translated_name: Other noise source - description
    description: >
      Free-text description of the other noise source flagged by
      RUIDO_OUT.
    code_system: none
    source: inferred
    reasoning: >
      RUI_OUTDES = ruído + outro + descrição; width 30 fits free text;
      pairs with RUIDO_OUT.

  SOLVENTE:
    official_name: Exposição a solventes
    translated_name: Solvent exposure
    description: >
      Whether the hearing-loss (PAIR) patient was also exposed to ototoxic
      solvents at work, a chemical risk factor tracked alongside noise
      because solvents can worsen or mimic noise-induced hearing damage.
    code_system: none
    source: inferred
    reasoning: PAIR form; SOLVENTE = solvente; width 1 checkbox.

  STAVALIA:
    official_name: Situação da avaliação
    translated_name: Evaluation status
    description: >
      Status of the pneumoconiosis patient's clinical/functional evaluation
      (e.g. completed vs pending), tracked separately from STRESULTA, which
      records the outcome once an exam is done.
    code_system: none
    source: inferred
    reasoning: ST = situação, AVALIA = avaliação; PNEU form; width 1.

  STRESULTA:
    official_name: Situação do resultado
    translated_name: Result status
    description: >
      Outcome status of the pneumoconiosis diagnostic evaluation (e.g.
      normal vs altered), recorded once STAVALIA shows the assessment was
      completed.
    code_system: none
    source: inferred
    reasoning: ST = situação, RESULTA = resultado; PNEU form; width 1.
