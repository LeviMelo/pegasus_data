# SIA/SUS batch b: columns 110-220 by file coverage (see scripts/evidence.py).
#
# Grounded in the DATASUS SIASUS Informe Tecnico (2019-07) layout document,
# fetched from the FTP path listed by scripts/doc_files.py, covering the PA,
# APAC (AD/AM/AN/AQ/AR/ATD), RAAS (AD/PSI) and BPA-I record layouts. A small
# group of pre-2008 legacy PA_* fields not in that document are marked
# source: inferred, reasoned from DATASUS naming grammar and the catalog's
# own codelist bindings. Two fields (AR_SMRD, PA_TIPPRO) are left out: no
# grounded meaning could be established for either.
system: SIASUS
asserted_by: pegasus_data
source: layout_doc
source_ref: ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Doc/Informe_Tecnico_SIASUS_2019_07.pdf
variables:
  PA_SEXO:
    official_name: Sexo do paciente
    translated_name: Patient sex
    description: Sex of the patient the procedure was billed for, as recorded on the PA outpatient-production
      line. Bound to the SEXO codelist (1=Masculino, 2=Feminino, 9=Ignorado in the DATASUS convention
      used across SIA/SIH).
    code_system: internal
    codelists:
    - SEXO
  PA_SUBFIN:
    official_name: Subtipo de Financiamento da produção
    translated_name: Production financing subtype
    description: 'Sub-category of PA_TPFIN: a finer-grained DATASUS code for which federal budget line
      financed the procedure (e.g. a specific strategic-action or incentive program within the broader
      financing type).'
    code_system: internal
    notes: No codelist is bound to this exact field name in the catalog; only the paired PA_TPFIN carries
      one (FINANC/TP_FINAN). Read PA_SUBFIN together with PA_TPFIN.
  PA_TPFIN:
    official_name: Tipo de Financiamento da produção
    translated_name: Production financing type
    description: DATASUS code for which SUS budget block paid for the procedure (e.g. Atenção Básica,
      Média/Alta Complexidade, FAEC). Drives how spending is attributed across financing ceilings, not
      a clinical attribute of the case.
    code_system: internal
    codelists:
    - FINANC
    - TP_FINAN
  PA_TPUPS:
    official_name: Tipo de Estabelecimento
    translated_name: Establishment type
    description: DATASUS classification of the kind of health facility that executed the procedure (e.g.
      hospital, basic health unit, outpatient clinic), drawn from the CNES establishment-type table.
    code_system: internal
    codelists:
    - TP_ESTAB
  PA_TRANSF:
    official_name: Indicador de Transferência
    translated_name: Transfer indicator
    description: Flags whether the patient was transferred to another establishment in connection with
      this procedure line.
    code_system: internal
    codelists:
    - TRANSFER
  PA_UFDIF:
    official_name: Indica se a UF de residência do paciente é diferente da UF de localização do estabelecimento
    translated_name: Patient UF differs from facility UF
    description: 0 if the patient's state of residence (PA_MUNPCN) matches the state of the executing
      establishment (PA_UFMUN); 1 if they differ, i.e. the patient crossed a state line for care.
    code_system: internal
  PA_VL_CF:
    official_name: Valor do Complemento Federal
    translated_name: Federal supplement value
    description: Extra amount the federal government added on top of the SIGTAP table price for this procedure
      line, in reais.
    code_system: none
  PA_VL_CL:
    official_name: Valor do Complemento Local
    translated_name: Local supplement value
    description: Extra amount the state or municipal manager added on top of the SIGTAP table price for
      this procedure line, in reais.
    code_system: none
  PA_VL_INC:
    official_name: Valor do Incremento
    translated_name: Increment value
    description: Additional incentive/increment amount paid on top of the base procedure value, in reais
      (distinct from PA_VL_CF and PA_VL_CL, which are the federal and local complements).
    code_system: none
  PA_SRV_C:
    official_name: Código do Serviço Especializado / Classificação CBO (de acordo com o CNES)
    translated_name: Specialised service / CBO classification code
    description: Combined CNES service-and-classification code identifying the kind of specialised service
      the establishment used to render the procedure (the CNES 'Serviço/Classificação' pair packed into
      one 6-character field).
    code_system: external
    notes: The layout document names this field PA_SRC_C (Código do SeRviço-Classificação), but the catalogued
      file headers carry it as PA_SRV_C at the same width (6 chars) and file coverage — almost certainly
      the same column under two spellings; DATASUS's own documentation and its shipped files disagree
      on the name.
  PA_INE:
    official_name: Código de Identificação Nacional de Equipes
    translated_name: National team identification code
    description: CNES code of the specific care team (e.g. an ESF or NASF team) that carried out the action,
      used to attribute production to a team rather than just an establishment.
    code_system: external
  PA_NAT_JUR:
    official_name: Código da Natureza Jurídica
    translated_name: Legal nature code
    description: Legal-constitution category of the executing establishment, sourced from CNES, which
      in turn takes it from Receita Federal's CNPJ registration (public administration, business entity,
      non-profit, individual, or extraterritorial).
    code_system: external
    codelists:
    - NATJUR
    - NATJURC
  AUTORIZ:
    official_name: Número da APAC ou número de autorização do BPA-I
    translated_name: Authorization number
    description: APAC/authorization number on the BPA-I production line, formed as UF+AA+T+sssssss+d (state,
      year, type, 7-digit sequence, check digit).
    code_system: none
    notes: In BPA-I this field is optional and DATASUS does not validate it, unlike the mandatory APAC
      number it shares a format with — do not assume every non-blank value is a real, checked APAC.
  CBOPROF:
    official_name: Código da Ocupação do profissional na Classificação Brasileira de Ocupações
    translated_name: Professional's CBO occupation code
    description: CBO (Classificação Brasileira de Ocupações, Ministry of Labour) code of the professional
      who executed the procedure recorded on this BPA-I line.
    code_system: external
    codelists:
    - CBO
  CNPJ_CC:
    official_name: CNPJ do Órgão que recebeu pela produção por cessão de crédito
    translated_name: Credit-cession recipient CNPJ
    description: CNPJ of the organisation that received payment for this production line via credit cession
      (a different entity than the executing establishment), or all zeros when no cession applies.
    code_system: none
  CNSPROF:
    official_name: Número do CNS (Cartão Nacional de Saúde) do profissional de saúde executante
    translated_name: Executing professional's CNS
    description: National Health Card number (CNS) of the professional who performed the procedure on
      this BPA-I line.
    code_system: none
    notes: Personal identifier — this is the treating professional's own CNS, not the patient's. Passed
      through unmodified in the source files; no masking is applied here.
  CODUNI:
    official_name: Código do Estabelecimento no CNES
    translated_name: CNES establishment code
    description: CNES registry code of the health establishment that produced this BPA-I line.
    code_system: external
    codelists:
    - CNES
  MNDIF:
    official_name: Indica se o município de residência do paciente é diferente do município de localização
      do estabelecimento
    translated_name: Patient municipality differs from facility municipality
    description: 0 if the patient's municipality of residence matches the executing establishment's municipality;
      1 if they differ.
    code_system: internal
  PROC_ID:
    official_name: Código do Procedimento Ambulatorial
    translated_name: Outpatient procedure code
    description: SIGTAP procedure code billed on this BPA-I line — the same nomenclature the unified PA
      file carries as PA_PROC_ID, but under the BPA-I file's own unprefixed field name.
    code_system: external
    codelists:
    - TPROC10
  QT_APRES:
    official_name: Quantidade Produzida (APRESENTADA)
    translated_name: Quantity presented (produced)
    description: Number of units of the procedure the establishment reported having performed on this
      BPA-I line, before any approval/audit adjustment.
    code_system: none
  QT_APROV:
    official_name: Quantidade Aprovada do procedimento
    translated_name: Quantity approved
    description: Number of units of the procedure the manager actually approved for payment on this BPA-I
      line; may be lower than QT_APRES when part of the reported production is rejected.
    code_system: none
  SUBFIN:
    official_name: Subtipo de Financiamento da produção
    translated_name: Production financing subtype
    description: BPA-I file's own copy of the financing-subtype code — the same concept the unified PA
      file carries as PA_SUBFIN.
    code_system: internal
  TPFIN:
    official_name: Tipo de Financiamento da produção
    translated_name: Production financing type
    description: BPA-I file's own copy of the SUS financing-type code — the same concept the unified PA
      file carries as PA_TPFIN.
    code_system: internal
  UFDIF:
    official_name: Indica se a UF de residência do paciente é diferente da UF de localização do estabelecimento
    translated_name: Patient UF differs from facility UF
    description: 0 if the patient's state of residence matches the executing establishment's state; 1
      if they differ. BPA-I's own copy of the flag the unified PA file carries as PA_UFDIF.
    code_system: internal
  VL_APRES:
    official_name: Valor Produzido (APRESENTADO)
    translated_name: Value presented (produced)
    description: Monetary value of the production reported on this BPA-I line, before approval, in reais.
    code_system: none
  VL_APROV:
    official_name: Valor Aprovado do procedimento
    translated_name: Value approved
    description: Monetary value actually approved for payment on this BPA-I line, in reais; may be lower
      than VL_APRES.
    code_system: none
  AQ_CID10:
    official_name: CID 10 – Topografia
    translated_name: CID-10 topography
    description: ICD-10 code for the tumour's anatomical site (topography) that justifies this chemotherapy
      APAC.
    code_system: external
    codelists:
    - S_CID
  AQ_CIDINI1:
    official_name: CID 1º Tratamento anterior
    translated_name: CID of 1st prior treatment
    description: ICD-10 diagnosis associated with the patient's first previously-received cancer treatment
      (only filled when AQ_TRANTE=S), paired with the start date in AQ_DTINI1.
    code_system: external
    codelists:
    - S_CID
  AQ_CIDINI2:
    official_name: CID 2º Tratamento anterior
    translated_name: CID of 2nd prior treatment
    description: ICD-10 diagnosis associated with the patient's second previously-received cancer treatment,
      paired with the start date in AQ_DTINI2.
    code_system: external
    codelists:
    - S_CID
  AQ_CIDINI3:
    official_name: CID 3º Tratamento anterior
    translated_name: CID of 3rd prior treatment
    description: ICD-10 diagnosis associated with the patient's third previously-received cancer treatment,
      paired with the start date in AQ_DTINI3.
    code_system: external
    codelists:
    - S_CID
  AQ_CONTTR:
    official_name: Continuidade do tratamento (S = Sim; N = Não)
    translated_name: Treatment continuity
    description: Whether this APAC continues a chemotherapy regimen already under way, rather than starting
      a new one.
    code_system: internal
    codelists:
    - CONT_TRAT
  AQ_DTIDEN:
    official_name: Data da identificação patológica do caso (AAAAMMDD)
    translated_name: Date of pathological identification
    description: Date the cancer diagnosis was pathologically confirmed for this case, in AAAAMMDD format
      — the clinical starting point of the case, not the date this APAC was issued.
    code_system: none
    notes: The catalog binds this field to an ANOMES2008 (year-month) codelist. That is a TabNet tabulation
      axis derived from the date column, not a real classification of the data — the binding is spurious,
      not this field's description.
  AQ_DTINI1:
    official_name: Data de início (AAAAMMDD) 1º tratamento anterior
    translated_name: Start date of 1st prior treatment
    description: Start date, AAAAMMDD, of the patient's first previously-received cancer treatment, paired
      with the diagnosis in AQ_CIDINI1.
    code_system: none
  AQ_DTINI2:
    official_name: Data de início (AAAAMMDD) 2º tratamento anterior
    translated_name: Start date of 2nd prior treatment
    description: Start date, AAAAMMDD, of the patient's second previously-received cancer treatment, paired
      with the diagnosis in AQ_CIDINI2.
    code_system: none
  AQ_DTINI3:
    official_name: Data de início (AAAAMMDD) 3º tratamento anterior
    translated_name: Start date of 3rd prior treatment
    description: Start date, AAAAMMDD, of the patient's third previously-received cancer treatment, paired
      with the diagnosis in AQ_CIDINI3.
    code_system: none
  AQ_DTINTR:
    official_name: Data de INÍCIO do tratamento solicitado (AAAAMMDD)
    translated_name: Start date of the requested treatment
    description: Start date, AAAAMMDD, of the chemotherapy regimen this APAC itself is requesting/authorising
      — the current treatment, not one of the prior treatments recorded in AQ_DTINI1-3.
    code_system: none
  AQ_ESQU_P1:
    official_name: ESQUEMA (Sigla ou abrev.) - 5 primeiras posições
    translated_name: Regimen code, first 5 characters
    description: First 5 characters of the free-text abbreviation for the chemotherapy drug regimen prescribed;
      the remaining characters are in AQ_ESQU_P2.
    code_system: none
    notes: Split across two columns because the original form field was wider than one DBF CHAR field
      comfortably held. Concatenate AQ_ESQU_P1 + AQ_ESQU_P2 to recover the full regimen abbreviation.
  AQ_ESQU_P2:
    official_name: ESQUEMA (Sigla ou abrev.) - 10 últimas posições
    translated_name: Regimen code, last 10 characters
    description: Remaining characters of the free-text chemotherapy regimen abbreviation begun in AQ_ESQU_P1.
    code_system: none
    depends_on:
    - AQ_ESQU_P1
  AQ_ESTADI:
    official_name: Estádio - UICC (0; 1; 2; 3; 4)
    translated_name: UICC stage
    description: Cancer stage at diagnosis, on a single-digit 0-4 scale DATASUS derived from the UICC
      (Union for International Cancer Control) staging system.
    code_system: external
    codelists:
    - ESTADIO
  AQ_GRAHIS:
    official_name: Grau Histopatológico
    translated_name: Histopathological grade
    description: DATASUS code for the tumour's histopathological grade (degree of cell differentiation)
      as recorded on the chemotherapy APAC.
    code_system: internal
    codelists:
    - GRAU_HIS
  AQ_LINFIN:
    official_name: Linfonodos regionais invadidos (S = Sim; N = Não; 3 = Não Avaliáveis)
    translated_name: Regional lymph nodes invaded
    description: Whether regional lymph nodes were found invaded by the tumour, with a separate code for
      cases where nodes could not be assessed.
    code_system: internal
    codelists:
    - LINF_INV
  AQ_TOTMAU:
    official_name: Total de MESES Autorizados
    translated_name: Total months authorised
    description: Number of months of chemotherapy the manager authorised for this regimen; compare with
      AQ_TOTMPL, the number planned by the requesting physician.
    code_system: none
    notes: The catalog binds this field to a MESES2 codelist. That is a display lookup TabNet uses to
      label a small integer range, not a real classification — the binding is spurious, not this field's
      description.
  AQ_TOTMPL:
    official_name: Total de MESES Planejados
    translated_name: Total months planned
    description: Number of months of chemotherapy the requesting physician planned for this regimen; compare
      with AQ_TOTMAU, the number actually authorised.
    code_system: none
    notes: The catalog binds this field to a MESES2 codelist, a TabNet display lookup for a small integer
      range rather than a real classification — the binding is spurious, not this field's description.
  AQ_TRANTE:
    official_name: Tratamentos anteriores (S = Sim; N = Não)
    translated_name: Prior treatments indicator
    description: Whether the patient had already received cancer treatment before this APAC; when S, up
      to three prior treatments are detailed in the AQ_CIDINI*/AQ_DTINI* fields.
    code_system: internal
    codelists:
    - TRA_ANTE
  AM_ALTURA:
    official_name: Altura do paciente em cm
    translated_name: Patient height
    description: Patient's height in centimetres, recorded to compute drug dosing for the authorised medication.
    code_system: none
  AM_GESTANT:
    official_name: Indicador de Gestante (S = Sim; N = Não)
    translated_name: Pregnancy indicator
    description: Whether the patient was pregnant at the time this medication APAC was issued.
    code_system: internal
    codelists:
    - GESTANTE
  AM_PESO:
    official_name: Peso do paciente em kg
    translated_name: Patient weight
    description: Patient's weight in kilograms, recorded to compute drug dosing for the authorised medication.
    code_system: none
  AM_QTDTRAN:
    official_name: Quantidade de Transplantes
    translated_name: Number of transplants
    description: Number of organ/tissue transplants the patient has undergone, relevant context for the
      immunosuppressant or other medication this APAC authorises.
    code_system: none
    notes: The catalog binds this field to a QDT_TRAN codelist, likely a TabNet display lookup for a small
      integer range rather than a real classification.
  AM_TRANSPL:
    official_name: Indicador se o paciente fez transplante
    translated_name: Transplant indicator
    description: Whether the patient has had a transplant, gating whether AM_QTDTRAN is meaningful.
    code_system: internal
    codelists:
    - TRANSPL
  AR_CID10:
    official_name: CID-10 - Topografia
    translated_name: CID-10 topography
    description: ICD-10 code for the tumour's anatomical site (topography) that justifies this radiotherapy
      APAC.
    code_system: external
    codelists:
    - S_CID
  AR_CIDINI1:
    official_name: CID 1º Tratamento anterior
    translated_name: CID of 1st prior treatment
    description: ICD-10 diagnosis associated with the patient's first previously-received cancer treatment,
      paired with the start date in AR_DTINI1.
    code_system: external
    codelists:
    - S_CID
  AR_CIDINI2:
    official_name: CID 2º Tratamento anterior
    translated_name: CID of 2nd prior treatment
    description: ICD-10 diagnosis associated with the patient's second previously-received cancer treatment,
      paired with the start date in AR_DTINI2.
    code_system: external
    codelists:
    - S_CID
  AR_CIDINI3:
    official_name: CID 3º Tratamento anterior
    translated_name: CID of 3rd prior treatment
    description: ICD-10 diagnosis associated with the patient's third previously-received cancer treatment,
      paired with the start date in AR_DTINI3.
    code_system: external
    codelists:
    - S_CID
  AR_CIDTR1:
    official_name: CID Topográfico 1º
    translated_name: Topographic CID for radiation field 1
    description: ICD-10 topography code for the first radiation field/target planned on this APAC.
    code_system: external
    codelists:
    - S_CID
  AR_CIDTR2:
    official_name: CID Topográfico 2º
    translated_name: Topographic CID for radiation field 2
    description: ICD-10 topography code for the second radiation field/target planned on this APAC.
    code_system: external
    codelists:
    - S_CID
  AR_CIDTR3:
    official_name: CID Topográfico 3º
    translated_name: Topographic CID for radiation field 3
    description: ICD-10 topography code for the third radiation field/target planned on this APAC.
    code_system: external
    codelists:
    - S_CID
  AR_CONTTR:
    official_name: Continuidade do tratamento (S = Sim; N = Não)
    translated_name: Treatment continuity
    description: Whether this APAC continues a radiotherapy course already under way, rather than starting
      a new one.
    code_system: internal
    codelists:
    - CONT_TRAT
  AR_DTIDEN:
    official_name: Data da identificação patológica do caso (AAAAMMDD)
    translated_name: Date of pathological identification
    description: Date the cancer diagnosis was pathologically confirmed for this case, in AAAAMMDD format.
    code_system: none
    notes: Bound in the catalog to an ANOMES2008 year-month codelist, a TabNet tabulation axis rather
      than a real classification of the column — the binding is spurious, not this field's description.
  AR_DTINI1:
    official_name: Data de INÍCIO (AAAAMMDD) 1º tratamento anterior
    translated_name: Start date of 1st prior treatment
    description: Start date, AAAAMMDD, of the patient's first previously-received cancer treatment.
    code_system: none
  AR_DTINI2:
    official_name: Data de INÍCIO (AAAAMMDD) 2º tratamento anterior
    translated_name: Start date of 2nd prior treatment
    description: Start date, AAAAMMDD, of the patient's second previously-received cancer treatment.
    code_system: none
  AR_DTINI3:
    official_name: Data de início (AAAAMMDD) 3º tratamento anterior
    translated_name: Start date of 3rd prior treatment
    description: Start date, AAAAMMDD, of the patient's third previously-received cancer treatment.
    code_system: none
  AR_DTINTR:
    official_name: Data de INÍCIO do tratamento solicitado (AAAAMMDD)
    translated_name: Start date of the requested treatment
    description: Start date, AAAAMMDD, of the radiotherapy course this APAC itself is requesting/authorising,
      distinct from the prior-treatment dates in AR_DTINI1-3.
    code_system: none
  AR_ESTADI:
    official_name: Estádio - UICC (0; 1; 2; 3; 4)
    translated_name: UICC stage
    description: Cancer stage at diagnosis, on a single-digit 0-4 scale DATASUS derived from the UICC
      staging system.
    code_system: external
    codelists:
    - ESTADIO
  AR_FIMAR1:
    official_name: Data de Fim 1º (AAAAMMDD)
    translated_name: End date, radiation field 1
    description: Planned end date, AAAAMMDD, of the first radiation field/application on this APAC.
    code_system: none
  AR_FIMAR2:
    official_name: Data de FIM 2º (AAAAMMDD)
    translated_name: End date, radiation field 2
    description: Planned end date, AAAAMMDD, of the second radiation field/application on this APAC.
    code_system: none
  AR_FIMAR3:
    official_name: Data de Fim 3º (AAAAMMDD)
    translated_name: End date, radiation field 3
    description: Planned end date, AAAAMMDD, of the third radiation field/application on this APAC.
    code_system: none
  AR_FINALI:
    official_name: Finalidade do Tratamento
    translated_name: Treatment purpose
    description: Clinical intent of the radiotherapy course, coded 1=Radical, 2=Adjuvante, 3=Antiálgica,
      4=Paliativa, 5=Prévia, 6=Antihemorrágica — these six meanings are spelled out explicitly in the
      DATASUS layout document itself.
    code_system: internal
    codelists:
    - FINALID
  AR_GRAHIS:
    official_name: Grau Histopatológico
    translated_name: Histopathological grade
    description: DATASUS code for the tumour's histopathological grade as recorded on the radiotherapy
      APAC.
    code_system: internal
    codelists:
    - GRAU_HIS
  AR_INIAR1:
    official_name: Data de INÍCIO 1º (AAAAMMDD)
    translated_name: Start date, radiation field 1
    description: Planned start date, AAAAMMDD, of the first radiation field/application on this APAC.
    code_system: none
  AR_INIAR2:
    official_name: Data de INÍCIO 2º (AAAAMMDD)
    translated_name: Start date, radiation field 2
    description: Planned start date, AAAAMMDD, of the second radiation field/application on this APAC.
    code_system: none
  AR_INIAR3:
    official_name: Data de INÍCIO 3º (AAAAMMDD)
    translated_name: Start date, radiation field 3
    description: Planned start date, AAAAMMDD, of the third radiation field/application on this APAC.
    code_system: none
  AR_LINFIN:
    official_name: Linfonodos regionais invadidos (S = Sim; N =Não; 3= Não Avaliáveis)
    translated_name: Regional lymph nodes invaded
    description: Whether regional lymph nodes were found invaded by the tumour, with a separate code for
      cases where nodes could not be assessed.
    code_system: internal
    codelists:
    - LINF_INV
  AR_NUMC1:
    official_name: Nº Campo/Inserções 1º
    translated_name: Field/insertion count, radiation field 1
    description: Number of radiation fields or brachytherapy insertions delivered for the first course
      segment.
    code_system: none
    notes: Bound in the catalog to an INSERCAO codelist, likely a TabNet display lookup for a small integer
      range rather than a real classification.
  AR_NUMC2:
    official_name: Nº Campo/Inserções 2º
    translated_name: Field/insertion count, radiation field 2
    description: Number of radiation fields or brachytherapy insertions delivered for the second course
      segment.
    code_system: none
  AR_NUMC3:
    official_name: Nº Campo/Inserções 3º
    translated_name: Field/insertion count, radiation field 3
    description: Number of radiation fields or brachytherapy insertions delivered for the third course
      segment.
    code_system: none
  AR_TRANTE:
    official_name: Tratamentos anteriores (S = Sim; N = Não)
    translated_name: Prior treatments indicator
    description: Whether the patient had already received cancer treatment before this APAC; when S, up
      to three prior treatments are detailed in the AR_CIDINI*/AR_DTINI* fields.
    code_system: internal
    codelists:
    - TRA_ANTE
  ATD_ACEVAS:
    official_name: Acesso Vascular
    translated_name: Vascular access
    description: DATASUS code for the type of vascular access used for the patient's dialysis (e.g. fistula,
      catheter).
    code_system: internal
    codelists:
    - ATD_ACEVAS
  ATD_ALBUMI:
    official_name: Albumina
    translated_name: Albumin
    description: Patient's serum albumin lab result recorded on the dialysis-treatment APAC, a nutritional/renal
      status marker.
    code_system: none
  ATD_CARACT:
    official_name: Característica do tratamento
    translated_name: Treatment characteristic
    description: DATASUS code describing the modality/characteristic of the dialysis treatment being authorised.
    code_system: internal
    codelists:
    - ATD_CARACT
