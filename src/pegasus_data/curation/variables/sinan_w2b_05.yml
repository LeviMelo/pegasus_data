system: SINAN
asserted_by: pegasus_data

variables:

  CO_UF_1:
    official_name: Código da UF (1)
    translated_name: State code (1)
    description: >
      Two-character state (UF) code, first of what is likely a repeated slot
      for a place relevant to visceral leishmaniasis exposure or travel
      history, paired with the free-text DS_TRANS_1 in the same section.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is LEIV (leishmaniose visceral); CO_UF reads "código UF"; C2
      width matches the standard 2-letter/2-digit Brazilian state code, and
      the "_1" suffix mirrors DS_TRANS_1's numbered-slot pattern.

  DIAG_PAR_N:
    official_name: Resultado do exame parasitológico
    translated_name: Parasitological exam result
    description: >
      Result of the direct parasitological exam (e.g. bone-marrow or splenic
      aspirate microscopy) used to confirm visceral leishmaniasis: coded
      1=Positivo, 2=Negativo, 3=Não realizado.
    code_system: internal
    source: inferred
    reasoning: >
      LEIV form; catalog dictionary gives explicit values 1=Positivo,
      2=Negativo, 3=Não realizado, confirming this as a coded lab-result
      field rather than free text.

  DS_TRANS_1:
    official_name: Descrição do local de transmissão (1)
    translated_name: Transmission location description (1)
    description: >
      Free-text description of a place considered a likely site of visceral
      leishmaniasis transmission, first of a numbered set of location slots
      paired with CO_UF_1.
    code_system: none
    source: inferred
    reasoning: >
      LEIV form; DS_TRANS reads "descrição - transmissão"; C30 free-text
      width fits a place description; the "_1" suffix pairs with CO_UF_1 as
      a repeated location-instance pattern.

  DT_DESLC2:
    official_name: Data do 2º deslocamento
    translated_name: Date of second travel/movement
    description: >
      Date of a second recorded trip or change of location for the visceral
      leishmaniasis patient, used to help trace where infection was likely
      acquired when travel history includes more than one relevant move.
    code_system: none
    source: inferred
    reasoning: >
      LEIV form; DT_DESLC reads "data - deslocamento"; D8 width fits a date,
      and the "2" suffix indicates the second of a numbered travel-date
      series.

  TP_CAUSOUT:
    official_name: Outro tipo de causa (especificar)
    translated_name: Other injury cause (specify)
    description: >
      Free-text field describing the cause of the wound that put the patient
      at risk of accidental tetanus, used when the injury type isn't one of
      the form's standard cause categories.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is TETA (tétano acidental); TP_CAUSOUT reads "tipo de causa -
      outro"; wide C30 width fits a free-text "other, specify" companion to
      the coded TP_ORIGEM field.

  TP_ORIGEM:
    official_name: Tipo de origem do ferimento
    translated_name: Wound origin type
    description: >
      Coded category of how the tetanus-prone wound occurred (e.g.
      agricultural, domestic, occupational injury), the structured
      counterpart to the free-text TP_CAUSOUT.
    code_system: none
    source: inferred
    reasoning: >
      TETA form; TP_ tipo prefix with ORIGEM reading "origem"; C1 width fits
      a small enumerated cause category.

  TP_VACINA:
    official_name: Tipo de vacina antitetânica
    translated_name: Tetanus vaccine type
    description: >
      Coded type of tetanus vaccine (e.g. dT, dTpa) given to the patient as
      prophylaxis or treatment following the injury.
    code_system: none
    source: inferred
    reasoning: >
      TETA form; TP_VACINA reads "tipo de vacina"; C1 width fits a small
      enumerated vaccine-type code.

  ID_CNS_SUS:
    official_name: Número do Cartão Nacional de Saúde
    translated_name: National Health Card (CNS) number
    description: >
      Patient's Cartão Nacional de Saúde (CNS) number, the personal SUS
      identifier used to link this anthrax notification to the patient's
      other health records.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is ANTR (antraz); C15 width matches the standard 15-digit CNS
      number used across DATASUS systems as the personal health identifier.

  CON_INF_OU:
    official_name: Outra condição de imunossupressão
    translated_name: Other immunosuppressive condition
    description: >
      Free-text/coded field noting another immunosuppressive condition
      (beyond a standard checklist) present in the patient, relevant to both
      Chagas disease and visceral leishmaniasis since immunosuppression
      (e.g. HIV) worsens outcomes in both.
    code_system: none
    source: inferred
    reasoning: >
      Shared between CHAG and LEIV agravos; CON_INF_OU reads
      "condição/contexto de infecção - outra"; C12 width fits a short coded
      or abbreviated entry, and both diseases share an immunosuppression risk
      factor.

  CS_NEG_ESP:
    official_name: Espécie identificada (cultura negativa para cólera)
    translated_name: Species identified (culture negative for cholera)
    description: >
      Free-text field recording an organism identified by stool culture when
      the test came back negative for Vibrio cholerae — i.e. what alternate
      species, if any, was found instead.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is COLE (cólera); NEG_ESP reads "negativo - espécie"; wide C30
      width fits a free-text organism name rather than a coded flag.

  OUTROANI:
    official_name: Outro animal envolvido
    translated_name: Other animal involved
    description: >
      Flag for whether an animal other than the disease's typical
      tick-associated hosts (e.g. horses, capybaras) was reported in the
      epidemiological context of this Brazilian spotted fever case.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is FMAC (febre maculosa); OUTROANI reads "outro animal"; C1
      width fits a coded yes/no flag.

  IDENT_MICR:
    official_name: Identificação microbiológica
    translated_name: Microbiological identification
    description: >
      Free-text description of the pathogen species identified by laboratory
      testing (e.g. the Rickettsia species found), used when the causative
      organism needs to be recorded beyond a simple positive/negative result.
    code_system: none
    source: inferred
    reasoning: >
      Shared between FMAC and a related rickettsial/tick-borne agravo; name
      reads "identificação microbiológica"; wide C50 width fits a written
      species identification rather than a coded field.

  OUT_AGENTE:
    official_name: Outro agente tóxico
    translated_name: Other toxic agent (specify)
    description: >
      Free-text field naming the toxic agent responsible for a poisoning
      case when it isn't one of the form's standard agent categories
      (pesticide, medication, industrial chemical, etc.).
    code_system: none
    source: inferred
    reasoning: >
      Agravo is IEXO (intoxicação exógena); OUT_AGENTE reads "outro agente";
      C30 free-text width fits an "other, specify" companion to a coded
      agent-type field.

  TONR_CER_N:
    official_name: Tônus cervical normal
    translated_name: Normal cervical muscle tone
    description: >
      Coded neurological-exam finding on the acute flaccid paralysis (polio
      surveillance) form indicating whether cervical muscle tone was found
      to be normal on clinical examination.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is PFAN (paralisia flácida aguda); C1 width fits a coded
      exam-finding flag. The exact meaning of "TONR_CER_N" is not confirmed
      by documentation; read as "tônus cervical normal" from the AFP exam's
      tone/reflex assessment, but with lower confidence than other entries
      in this file.

  TPEVIDENCI:
    official_name: Tipo de evidência diagnóstica
    translated_name: Type of diagnostic evidence
    description: >
      Coded category of the evidence used to confirm maternal syphilis
      (e.g. clinical signs, non-treponemal test, treponemal test) on the
      syphilis-in-pregnancy notification.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is SIFG (sífilis em gestante); TPEVIDENCI reads "tipo de
      evidência"; C1 width fits a small enumerated evidence-type code.

  VACINACAO:
    official_name: Situação vacinal da mãe (rubéola)
    translated_name: Mother's rubella vaccination status
    description: >
      Whether the mother was vaccinated against rubella, recorded on the
      congenital rubella syndrome form since maternal immunity is what
      prevents the syndrome in the first place.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is SRC (síndrome da rubéola congênita); name reads
      "vacinação"; C1 width fits a coded yes/no immunization flag.

  OUTRAS_DES:
    official_name: Outro desfecho (especificar)
    translated_name: Other treatment outcome (specify)
    description: >
      Free-text field specifying the tuberculosis treatment outcome when it
      doesn't match the form's standard closing categories (cure, default,
      death, transfer).
    code_system: none
    source: inferred
    reasoning: >
      Agravo is TUBE (tuberculose); OUTRAS_DES reads "outro[a] desfecho";
      wide C40 width fits a free-text "other, specify" outcome field.

  DEF_ESPEC:
    official_name: Especificação da deficiência
    translated_name: Disability specification
    description: >
      Free-text field describing the type of disability a violence victim
      has, recorded because disability is tracked on this form as a
      vulnerability factor for interpersonal/self-inflicted violence.
    code_system: none
    source: inferred
    reasoning: >
      Agravo is VIOL (violência); DEF_ESPEC reads "deficiência -
      especificar"; C30 free-text width fits a written disability
      description rather than a coded flag.
