# CNES.DC — Complementary data
# Dados Complementares
#
# Additional establishment attributes not carried on the ST record.
system: CNES
asserted_by: pegasus_data

variables:
  ABRANDAD:
    official_name: Indica se faz tratamento de agua com abrandador
    translated_name: Water treatment with water softener
    description: 'Flag (1-Sim, 0-Nao) for whether the establishment''s dialysis water-treatment
      chain includes a water softener. This sits in the DC record''s dialysis-infrastructure
      block (alongside CNS_NEFR/DIALISE): it describes water pretreatment for hemodialysis
      specifically, not general building water treatment.'
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.2 Layout dos arquivos de Dados Complementares (DC*.dbf), SEQ 34
  ARMAZ_FT:
    official_name: Numero de salas de armazenamento de fontes - (Radioterapia)
    translated_name: Radiotherapy sealed-source storage rooms
    description: Count of sealed-source storage rooms reported for the establishment's
      radiotherapy service, on the DC record's radiotherapy-infrastructure block. Establishments
      without a registered radiotherapy service report 0 here, so a 0 does not by itself
      mean under-reporting.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.2 Layout dos arquivos de Dados Complementares (DC*.dbf), SEQ 42
  BLOCOPER:
    official_name: Numero de salas de bloco personalizado - (Radioterapia)
    translated_name: Radiotherapy custom-block fabrication rooms
    description: Count of custom-block fabrication rooms reported for the establishment's
