    official_name: Indica a existencia de algum REQUISITO DE DIALISE para este CNES
    translated_name: Dialysis service requirements met
    description: Flag (1-Sim, 0-Nao) summarizing whether the establishment meets the
      set of declared dialysis-service requirements (water treatment, machines, responsible
      nephrologist, etc.) captured elsewhere on this same DC record. It is a derived
      compliance-style indicator rather than an independently observed fact.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
