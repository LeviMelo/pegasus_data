# CNES.ST — Establishments
# Estabelecimentos
#
# One row per health establishment — the spine of CNES, which every other CNES
# dataset hangs off by CNES code.
system: CNES
asserted_by: pegasus_data

variables:
  ALVARA:
    official_name: Número do alvará
    translated_name: Operating-permit (alvará) number
    description: 'The establishment''s operating-license/permit number, as issued by
      the local sanitary or municipal authority. A free-form identifier, not a code
      with a lookup meaning.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Número do alvará"'
  ATENDAMB:
    official_name: Atendimento ambulatorial (instalação física)
    translated_name: Outpatient-care physical-facility flag
    description: 'Flags whether the establishment has a physical installation for outpatient/ambulatory
      care. About physical infrastructure existing, not whether outpatient visits actually
      occurred in a given period.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Indica a existência de instalação física de ATENDIMENTO AMBULATORIAL"'
  ATENDHOS:
    official_name: Atendimento hospitalar (instalação física)
    translated_name: Inpatient-care physical-facility flag
    description: 'Flags whether the establishment has a physical installation for hospital/inpatient
      care. Mirrors ATENDAMB for the inpatient side.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Indica a existência de instalação física de ATENDIMENTO HOSPITALAR"'
  AV_ACRED:
    official_name: Indica se o estabelecimento foi avaliado segundo o Manual de Acreditacao
      Hospitalar do MS
    translated_name: Evaluated under the Ministry of Health Hospital Accreditation
      Manual
    description: Flag for whether the establishment has been evaluated under the Ministry
      of Health's Manual de Acreditacao Hospitalar, on the Estabelecimentos (ST) record.
      Records only that an evaluation took place, not the resulting grade (see CLASAVAL)
      or its date (DT_ACRED).
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 35
    codelists:
    - AVALIADO
    notes: Coded 1-Sim / 2-Nao in this layout table - note the 2, not the 0 used by
      most other CNES sim/nao flags in this batch (e.g. LEITHOSP, COMISS01-12 all use
      1-sim/0-nao). Do not assume 0/1 semantics for this field.
  AV_PNASS:
    official_name: Indica se o estabelecimento foi avaliado segundo o Programa Nacional
      de Avaliacao de Servicos de Saude - PNASS
    translated_name: Evaluated under PNASS (National Health-Services Evaluation Program)
    description: Flag for whether the establishment has been evaluated under PNASS
      (Programa Nacional de Avaliacao de Servicos de Saude), on the Estabelecimentos
      (ST) record. Independent of, and not to be confused with, the separate AV_ACRED
      hospital-accreditation evaluation.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 38
    notes: Coded 1-Sim / 2-Nao, the same non-0/1 convention as AV_ACRED - see that
      field's note.
  CENTRCIR:
    official_name: Indica a existencia de INSTALACAO FISICA de ATENDIMENTO HOSPITALAR-CENTRO
      CIRURGICO para este CNES
    translated_name: Surgical center (centro cirurgico) installation exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a physical surgical-center
      installation, on the Estabelecimentos (ST) record's facilities block. Physical
      infrastructure only, not a count of operating rooms or a statement that surgery
      is an authorized/offered activity (that is tracked separately via the AP0#CV0#
      service flags).
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 93
  CENTRNEO:
    official_name: Indica a existencia de INSTALACAO FISICA de ATENDIMENTO HOSPITALAR-UNIDADE
      NEONATAL para este CNES
    translated_name: Neonatal unit installation exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a physical neonatal-unit
      installation, on the Estabelecimentos (ST) record's facilities block. Physical
      infrastructure only, distinct from the neonatal bed totals carried separately
      in the Leitos (LT) file.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 114
  CENTROBS:
    official_name: Indica a existencia de INSTALACAO FISICA de ATENDIMENTO HOSPITALAR-CENTRO
      OBSTETRICO para este CNES
    translated_name: Obstetric center (centro obstetrico) installation exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a physical obstetric-center
      installation (e.g. delivery/labour facilities), on the Estabelecimentos (ST)
      record's facilities block. Physical infrastructure only.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 98
  CLASAVAL:
    official_name: Classificacao da avaliacao do estabelecimento segundo o Manual de
      Acreditacao Hospitalar do MS
    translated_name: Hospital accreditation classification/grade
    description: 'Grade from the Ministry of Health''s Manual de Acreditacao Hospitalar,
      applying when AV_ACRED marks the establishment evaluated: 1/2/3 = accredited
      at level 1/2/3, 0 = did not meet the minimum standards, -9 = grade not informed.'
    code_system: internal
    source: def
    source_ref: CNV/CLASAVAL.CNV, from ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Auxiliar/TAB_CNES.zip
      (TabWin value-label table bound to the CLASAVAL codelist)
    codelists:
    - CLASAVAL
  COLETRES:
    official_name: Indica a existencia de alguma coleta de residuo para este CNES
    translated_name: Any waste-collection arrangement exists
    description: 'Aggregate flag (1-sim, 0-nao): true if the establishment declared
      at least one of the four waste-collection streams - biological, chemical, radioactive,
      common (RES_BIOL, RES_QUIM, RES_RADI, RES_COMU) - on the Estabelecimentos (ST)
      record. It is a derived any-of indicator over those four fields, not an independently
      collected fact; the four component flags themselves fall outside this batch (ST
      SEQ 139-142).'
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 143
    depends_on:
    - RES_BIOL
    - RES_QUIM
    - RES_RADI
    - RES_COMU
  COMISS01:
    official_name: Existe comissao de ETICA MEDICA
    translated_name: Medical ethics commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing medical
      ethics commission ('comissao de etica medica'), on the Estabelecimentos (ST)
      record's commissions block. Records the declared existence of the commission,
      not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 144
    codelists:
    - COM_ETMD
  COMISS02:
    official_name: Existe comissao de ETICA DE ENFERMAGEM
    translated_name: Nursing ethics commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing nursing
      ethics commission ('comissao de etica de enfermagem'), on the Estabelecimentos
      (ST) record's commissions block. Records the declared existence of the commission,
      not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 145
    codelists:
    - COM_ETEF
  COMISS03:
    official_name: Existe comissao de FARMACIA E TERAPEUTICA
    translated_name: Pharmacy and therapeutics commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing pharmacy
      and therapeutics commission ('comissao de farmacia e terapeutica'), on the Estabelecimentos
      (ST) record's commissions block. Records the declared existence of the commission,
      not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 146
    codelists:
    - COM_FMTR
  COMISS04:
    official_name: Existe comissao de CONTROLE DE INFECCAO HOSPITALAR
    translated_name: Hospital infection control commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing hospital
      infection control commission ('comissao de controle de infeccao hospitalar'),
      on the Estabelecimentos (ST) record's commissions block. Records the declared
      existence of the commission, not its membership, meeting cadence, or activity
      level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 147
    codelists:
    - COM_CTIH
  COMISS05:
    official_name: Existe comissao de APROPRIACAO DE CUSTOS
    translated_name: Cost apportionment commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing cost
      apportionment commission ('comissao de apropriacao de custos'), on the Estabelecimentos
      (ST) record's commissions block. Records the declared existence of the commission,
      not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 148
    codelists:
    - COM_APCT
  COMISS06:
    official_name: Existe comissao de CIPA
    translated_name: CIPA (internal workplace-accident prevention commission) commission
      exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing CIPA
      (internal workplace-accident prevention commission) commission ('comissao de
      cipa'), on the Estabelecimentos (ST) record's commissions block. Records the
      declared existence of the commission, not its membership, meeting cadence, or
      activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 149
    codelists:
    - COM_CIPA
  COMISS07:
    official_name: Existe comissao de REVISAO DE PRONTUARIOS
    translated_name: Medical-record review commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing medical-record
      review commission ('comissao de revisao de prontuarios'), on the Estabelecimentos
      (ST) record's commissions block. Records the declared existence of the commission,
      not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 150
    codelists:
    - COM_RVPR
  COMISS08:
    official_name: Existe comissao de REVISAO DE DOCUMENTACAO MEDICA E ESTATISTICA
    translated_name: Medical/statistical documentation review commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing medical/statistical
      documentation review commission ('comissao de revisao de documentacao medica
      e estatistica'), on the Estabelecimentos (ST) record's commissions block. Records
      the declared existence of the commission, not its membership, meeting cadence,
      or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 151
    codelists:
    - COM_RDME
  COMISS09:
    official_name: Existe comissao de ANALISE DE OBITOS E BIOPSIAS
    translated_name: Death and biopsy review commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing death
      and biopsy review commission ('comissao de analise de obitos e biopsias'), on
      the Estabelecimentos (ST) record's commissions block. Records the declared existence
      of the commission, not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 152
    codelists:
    - COM_ANOB
  COMISS10:
    official_name: Existe comissao de INVESTIGACAO EPIDEMIOLOGICA
    translated_name: Epidemiological investigation commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing epidemiological
      investigation commission ('comissao de investigacao epidemiologica'), on the
      Estabelecimentos (ST) record's commissions block. Records the declared existence
      of the commission, not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 153
    codelists:
    - COM_IVEP
  COMISS11:
    official_name: Existe comissao de NOTIFICACAO DE DOENCAS
    translated_name: Disease notification commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing disease
      notification commission ('comissao de notificacao de doencas'), on the Estabelecimentos
      (ST) record's commissions block. Records the declared existence of the commission,
      not its membership, meeting cadence, or activity level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 154
    codelists:
    - COM_NTFD
  COMISS12:
    official_name: Existe comissao de CONTROLE DE ZOONOSES E VETORES
    translated_name: Zoonoses and vector control commission exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a standing zoonoses
      and vector control commission ('comissao de controle de zoonoses e vetores'),
      on the Estabelecimentos (ST) record's commissions block. Records the declared
      existence of the commission, not its membership, meeting cadence, or activity
      level.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 155
    codelists:
    - COM_CTZV
  COMISSAO:
    official_name: Indica a existencia de alguma comissao para este CNES
    translated_name: Any standing commission exists
    description: 'Aggregate flag (1-sim, 0-nao): true if the establishment declared
      at least one of the twelve standing commissions COMISS01-COMISS12 on the Estabelecimentos
      (ST) record. Derived any-of indicator over those twelve fields, not an independently
      collected fact.'
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 156
    depends_on:
    - COMISS01
    - COMISS02
    - COMISS03
    - COMISS04
    - COMISS05
    - COMISS06
    - COMISS07
    - COMISS08
    - COMISS09
    - COMISS10
    - COMISS11
    - COMISS12
  CONTRATE:
    official_name: Numero do contrato/convenio ESTADUAL do vinculo com o SUS
    translated_name: State SUS contract/agreement number
    description: Contract/agreement number of the establishment's state-level (ESTADUAL)
      linkage to the SUS, on the Estabelecimentos (ST) record; the state-level sibling
      of CONTRATM. A free-form identifier, not a coded classification; paired with
      its publication year-month in DT_PUBLE.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 30
    notes: The layout table documents this field as CHAR(20), but the declared width
      actually observed on the CNES file headers in this catalog is 11 characters -
      the same width as CONTRATM. Do not size buffers or validate on the documented
      20-character width.
  CONTRATM:
    official_name: Numero do contrato/convenio MUNICIPAL do vinculo com o SUS
    translated_name: Municipal SUS contract/agreement number
    description: Contract/agreement number of the establishment's municipal-level (MUNICIPAL)
      linkage to the SUS, on the Estabelecimentos (ST) record. A free-form identifier,
      not a coded classification; paired with its publication year-month in DT_PUBLM.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 28
  CO_AGENC:
    official_name: Codigo da Agencia do Estabelecimento
    translated_name: Bank branch/agency number of the establishment's account
    description: Branch/agency number, at the bank identified by CO_BANCO, of the establishment's
      bank account, on the Estabelecimentos (ST) record. An identifying number specific
      to that bank, not a classification code.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 26
  CO_BANCO:
    official_name: Codigo do Banco do Estabelecimento
    translated_name: Bank code (Febraban/COMPE) of the establishment's account
    description: The Febraban/COMPE bank-identification code (e.g. 001 Banco do Brasil,
      341 Itau Unibanco) of the bank holding the establishment's account, on the Estabelecimentos
      (ST) record. A nationally standardized bank code, kept beside CO_AGENC and C_CORREN.
    code_system: external
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 25
  C_CORREN:
    official_name: Codigo da Conta Corrente do Estabelecimento
    translated_name: Checking-account number of the establishment
    description: Checking-account number, at the branch identified by CO_AGENC, of
      the establishment's bank account, on the Estabelecimentos (ST) record. Free-form
      banking identifier.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 27
  DT_ACRED:
    official_name: Ano e Mes da Acreditacao (AAAAMM)
    translated_name: Year-month of the hospital accreditation evaluation
    description: Year and month (AAAAMM, 6 digits) the AV_ACRED/CLASAVAL hospital accreditation
      evaluation was recorded, on the Estabelecimentos (ST) record.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 37
  DT_ATUAL:
    official_name: Ano e Mes de competencia da atualizacao da informacao pelo estabelecimento
      (AAAAMM)
    translated_name: Year-month the establishment last updated its registration data
    description: Year and month (AAAAMM, 6 digits) of the competencia in which the
      establishment itself last updated its registration information, on the Estabelecimentos
      (ST) record - distinct from COMPETEN, the competencia of the CNES snapshot/extract
      itself (ST SEQ 202, outside this batch).
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 201
    codelists:
    - ANO_MES
    notes: Printed in the source PDF as 'DT_ATUA' (the table cell appears to drop the
      trailing letter); the catalogued/actual field name is DT_ATUAL, matched here
      by its CHAR(6)/AAAAMM description and its position right after MOTDESAB in the
      SEQ order.
  DT_EXPED:
    official_name: Ano e Mes de da expedicao do alvara (AAAAMM)
    translated_name: Year-month the operating license (alvara) was issued
    description: Year and month (AAAAMM, 8-character field) the establishment's operating
      license (alvara) was issued, on the Estabelecimentos (ST) record; paired with
      ORGEXPED.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 33
    codelists:
    - ANO_MES
  DT_PNASS:
    official_name: Ano e Mes da Avaliacao PNASS (AAAAMM)
    translated_name: Year-month of the PNASS evaluation
    description: Year and month (AAAAMM, 6 digits) the AV_PNASS evaluation was recorded,
      on the Estabelecimentos (ST) record.
    code_system: none
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 39
  DT_PUBLE:
    official_name: Ano e Mes de publicacao do contrato/convenio ESTADUAL (AAAAMM)
