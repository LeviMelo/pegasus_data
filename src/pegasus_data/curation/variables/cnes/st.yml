  URGEMERG:
    official_name: Indica a existencia de INSTALACAO FISICA de URGENCIA/EMERGENCIA
      para este CNES
    translated_name: Emergency-care physical installation exists
    description: Flag (1-sim, 0-nao) for whether the establishment has a physical emergency/urgent-care
      installation (rooms/area), as declared on the ST record's facilities block. This
      records physical infrastructure, not whether the establishment is authorized
      or actually operates urgency/emergency care as a listed activity (that is tracked
      separately, e.g. via the AP04CVxx service-by-payer flags and TP_UNID).
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 72
