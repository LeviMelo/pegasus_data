  SERAPOIO:
    official_name: Indica a existencia de algum servico de apoio para este CNES
    translated_name: Any support service exists
    description: 'Aggregate flag (1-sim, 0-nao): true if the establishment reported
      at least one of the eleven support services (SERAP01P/T through SERAP11P/T) as
      either in-house or outsourced. It is a derived any-of indicator, not an independently
      collected fact.'
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
