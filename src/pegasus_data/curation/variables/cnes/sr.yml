# CNES.SR — Specialised services
# Serviços Especializados
#
# Specialised services offered, and their classifications.
system: CNES
asserted_by: pegasus_data

variables:
  AMB_NSUS:
    official_name: Atendimento ambulatorial não SUS
    translated_name: Outpatient care outside SUS
    description: 'Whether the service treats outpatients outside SUS. The non-SUS side
      of the ambulatorial/hospitalar split.

      '
    code_system: internal
    codes: {"1": "Sim", "0": "Não"}
    source: def
    source_ref: AMB_HOSP.CNV
    reasoning: AMB reads ambulatorial and NSUS não SUS; bound to the AMB_HOSP codelist.
  AMB_SUS:
    official_name: Atendimento ambulatorial SUS
    translated_name: Outpatient care for SUS
    description: 'Whether the service treats SUS outpatients. Pairs with AMB_NSUS,
      and the two are not exclusive — most establishments do both.

      '
    code_system: none
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.6 Serviço Especializado (SR*.dbf) SEQ 25
      AMB_HOSP ''Indica se o Serviço é Ambulatorial Não SUS / Ambulatorial SUS /
      Hospitalar Não SUS / Hospitalar SUS, onde: 1-Sim 0-Não'' (this column is one of
      those four flags, published as a separate field)'
  CARACTER:
    official_name: Caracterização do serviço
    translated_name: Service arrangement
    description: 'Whether the service is run in-house or contracted out, and whether
      it is outpatient or hospital, SUS or not. Four distinctions in one code.

      '
    code_system: internal
    source: def
    source_ref: SRV_CARACT.CNV
    reasoning: 'Bound to SRV_CARACT, whose values are próprio, terceirizado, ambulatorial,
      SUS-ambulatorial, hospitalar and SUS-hospitalar.

      '
  CLASS_SR:
    official_name: Classificação do Serviço Especializado
    translated_name: Specialized-service classification code
    description: 'Code of the classification (sub-type) of the specialized service in
      SERV_ESP, or 999 when the service has no classification.'
    code_system: internal
    # A classification code means nothing alone: S_CLASSEN is keyed by service
    # + classification ("159001" = 159 ATENCAO PRIMARIA / 001 ATENCAO
    # PRIMARIA), the way TabWin's .DEF combines the two columns (ADR-0088).
    codelist: S_CLASSEN
    key: [SERV_ESP, CLASS_SR]
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.6 Serviço Especializado (SR*.dbf) SEQ 4
      ''Código da classificação do serviço ou 999, caso INEXISTENTE'''
    notes: 'No observed values or bound codelist were captured, so which numeric codes
      map to which classification labels is not established here.

      '
  CNESTERC:
    official_name: CNES do terceiro
    translated_name: Contracted provider CNES
    description: 'The CNES code of the third party providing a contracted-out service.
      What makes it possible to follow a service to the establishment that actually
      performs it rather than the one that reports it.

      '
    code_system: external
    codelist: CADGERBR
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.6 Serviço Especializado (SR*.dbf) SEQ 28
      ''Número nacional do estabelecimento de saúde TERCEIRO'''
  CONTSRVU:
    official_name: Indicador de serviço especializado único
    translated_name: Unique specialized-service indicator
    description: 'Flag marking the row that counts a specialized service once per
      establishment (unique CNES + SERV_ESP), since a service with several
      classifications appears on several rows. Use it to count services without double
      counting; it does not say whether the service is contracted out.'
    code_system: none
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.6 Serviço Especializado (SR*.dbf) SEQ 27
      ''INDICADOR de serviço especializado ÚNICO'' (cf. SEQ 5 SRVUNICO, filled once per
      CNES + SERV_ESP)'
  HOSP_NSUS:
    official_name: Atendimento hospitalar não SUS
    translated_name: Hospital care outside SUS
    description: 'Whether the service admits non-SUS patients. Set together with HOSP_SUS
      for the mixed hospitals that are most of Brazilian capacity.

      '
    code_system: none
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.6 Serviço Especializado (SR*.dbf) SEQ 25
      AMB_HOSP ''Indica se o Serviço é Ambulatorial Não SUS / Ambulatorial SUS /
      Hospitalar Não SUS / Hospitalar SUS, onde: 1-Sim 0-Não'' (this column is one of
      those four flags, published as a separate field)'
  HOSP_SUS:
    official_name: Atendimento hospitalar SUS
    translated_name: Hospital care for SUS
    description: 'Whether the service admits SUS patients. The hospital counterpart
      of AMB_SUS, and the flag that identifies which establishments SIH activity can
      come from.

      '
    code_system: none
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.6 Serviço Especializado (SR*.dbf) SEQ 25
      AMB_HOSP ''Indica se o Serviço é Ambulatorial Não SUS / Ambulatorial SUS /
      Hospitalar Não SUS / Hospitalar SUS, onde: 1-Sim 0-Não'' (this column is one of
      those four flags, published as a separate field)'
  SERV_ESP:
    official_name: Serviço especializado
    translated_name: Specialised service
    description: 'Which specialised service the establishment offers (3-digit service code).
      CLASS_SR narrows it to a classification, decoded with this column as its key.

      '
    code_system: internal
    codelist: SRN_ORD_N
    source: def
    source_ref: SRN_ORD_N.CNV (TAB_CNES), service names by 3-digit code; checked against
      CNES-SR AC 2023-01 (159 = ATENCAO PRIMARIA)
    reasoning: C(3) service code. The S_CLASSE tables are keyed by service + classification
      (6 digits), so they decode CLASS_SR with SERV_ESP as its key, not this column alone.
  SRVUNICO:
    official_name: Classificação do serviço
    translated_name: Service classification
    description: 'A service code (3 digits, the same codes as SERV_ESP) carried once per
      establishment and service, for counting distinct services.

      '
    code_system: internal
    codelist: SRN_ORD_N
    source: def
    source_ref: SRN_ORD_N.CNV (TAB_CNES); checked against CNES-SR AC 2023-01, where its
      values are service codes (159 = ATENCAO PRIMARIA)
    reasoning: C(3). The earlier reading as "the classification" is contradicted by the data,
      whose values are service codes decoded by the service table.
