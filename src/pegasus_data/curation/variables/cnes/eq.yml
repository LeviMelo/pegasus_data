# CNES.EQ — Equipment
# Equipamentos
#
# Equipment held by an establishment, and how much of it is in use.
system: CNES
asserted_by: pegasus_data

variables:
  CODEQUIP:
    official_name: Código do equipamento
    translated_name: Equipment code
    description: 'Code of the specific equipment item within its group (TIPEQUIP): the pair TIPEQUIP + CODEQUIP
      identifies the equipment (gamma camera, CT scanner, haemodynamics X-ray, ventilator).'
    code_system: internal
    key: [TIPEQUIP, CODEQUIP]
    codelist: EQUIPAM2507
    codelists: [EQUIPAM2508]
    source: def
    source_ref: 'TAB_CNES Equipamento.def: "XEquipam ate 202507, TIPEQUIP, 1, cnv\equipam2507.cnv" and "XEquipam a
      partir 202508, TIPEQUIP, 1, cnv\equipam2508.cnv" (the CNV reads from TIPEQUIP on, so its code is TIPEQUIP followed
      by CODEQUIP); IT_CNES_1706 §2.5 SEQ 21-22'
    notes: 'From 202508 TIPEQUIP is written in two characters (group 10, dialysis, was created) and the key is four wide
      (0101 Gama Camara) where it was three (101); the two tables do not share a code, so each year is decoded by the
      table of its width. Measured 2026-11-25 on AL: 2023-12, 12,355 rows, all decoded by equipam2507; 2025-12, 13,300
      rows, all decoded by equipam2508. Before 2026-11-25 the column had no codelist and read as bare codes.'
  IND_NSUS:
    official_name: Equipamento não disponível ao SUS
    translated_name: Equipment not available to SUS
    description: 'Flag for equipment not available to SUS (1=Sim, 0=Não). Recorded as
      its own flag beside IND_SUS rather than derived from it.'
    code_system: internal
    codes: {"1": "Sim", "0": "Não"}
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.5 Equipamentos (EQ*.dbf) SEQ 26 ''Indicador
      de EQUIPAMENTO NÃO DISPONÍVEL para o SUS, onde: 1 = SIM 0 = NÃO'''
    reasoning: "The layout prints the values: IT_CNES_1706.pdf §2.5 SEQ 26 IND_NSUS \"1 = SIM 0 = NÃO\"; in the CNES-EQ AM 2024 file it is the exact complement of IND_SUS (4,329 rows 1 and 7,754 rows 0, against IND_SUS 0 and 1) (2026-10-24)."
  IND_SUS:
    official_name: Equipamento disponível ao SUS
    translated_name: Equipment available to SUS
    description: 'Whether the equipment serves SUS patients. A scanner registered at
      a hospital is not necessarily reachable through the public system.

      '
    code_system: internal
    source: def
    source_ref: IND_SUS.CNV
    reasoning: 'Bound to IND_SUS, whose values are equipamento para o SUS and equipamento
      não SUS.

      '
  QT_USO:
    official_name: Quantidade de equipamentos em uso
    translated_name: Equipment in use
    description: 'How many of the registered units are actually in use. The gap between
      this and the number existing is the interesting quantity: registered equipment
      that has broken down is rarely deregistered.

      '
    code_system: none
    source: layout_doc
    source_ref: 'CNES - Informe Técnico 2017-06 (DATASUS) —
      ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
      (local: sources/IT_CNES_1706.txt), §2.5 Equipamentos (EQ*.dbf) SEQ 24 ''Quantidade
      em uso do equipamento'''
  TIPEQUIP:
    official_name: Tipo de equipamento
    translated_name: Equipment group
    description: 'The equipment group (diagnostic imaging, infrastructure, optical methods, graphic methods, life
      support, other, dentistry, audiology, telehealth imaging; from 202508 also dialysis, anthropometry, radiotherapy,
      chemotherapy, rehabilitation, clinical and surgical procedures). The item itself is CODEQUIP, read with this group.'
    code_system: internal
    codelist: GRP_EQPAM2507
    codelists: [GRP_EQPAM2508]
    source: def
    source_ref: 'TAB_CNES Equipamento.def: "XGrupo Equipam ate 202507, TIPEQUIP, 1, cnv\grp_eqpam2507.cnv" and "XGrupo
      Equipam a partir 202508 ..., cnv\grp_eqpam2508.cnv"'
    reasoning: 'Was described as the equipment item and bound by measurement to TP_EQUIPAM (groups 1-8), which left group 9
      (telehealth, 900 of 12,355 AL rows in 2023-12) and every two-character code from 202508 undecoded (2026-11-25).
      grp_eqpam2507 is one character wide (1-9) and grp_eqpam2508 two (01-16), so each year is decoded by the table of
      its width.'
