# CNES — columns carried by more than one dataset.
#
# The notification header and other cross-dataset fields. Described once
# against the system, because that is the scope on which they are the
# same column.
system: CNES
asserted_by: pegasus_data

variables:
  AP01CV01:
    official_name: Atendimento prestado INTERNACAO/Convenio SUS
    translated_name: Inpatient admission (internacao) offered under the SUS public
      system
    description: 'SUS-covered patients: flag (1=yes/0=no) for whether the establishment
      offers inpatient admission (internacao), self-declared on its service/payer grid.'
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 157
    codelists:
    - AP01CV01
    notes: This same 7x6 grid (7 services x 6 payers) is also carried, field-for-field,
      on the Dados Complementares (DC) record and, from Apr/2007 onward, on the Equipes
      (EP) record - confirm which file an extract's AP0#CV0# column actually came from.
      The seven per-service any- payer flags roll up into a single establishment-level
      summary flag, ATEND_PR, which sits outside this batch (ST SEQ 199).
