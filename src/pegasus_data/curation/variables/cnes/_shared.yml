  ATEND_PR:
    official_name: Atendimento prestado
    translated_name: '"Any service provided" flag'
    description: 'Summary flag for whether the establishment has any "atendimento prestado"
      recorded at all. Appears to be a roll-up of a more detailed per-service-type
      grid (columns named AP01CV01…AP07CV06) that this batch could not independently
      verify — see notes.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Indica a existência de algum atendimento prestado"'
    notes: 'Do not infer the meaning of the AP0#CV0# columns from this flag; they were
      left undescribed in this batch because no source could confirm what the AP0#
      groups or CV0# sub-columns individually represent.

      '
  ATIVIDAD:
    official_name: Atividade de ensino
    translated_name: Teaching/research activity of the establishment
    description: 'Whether and how the establishment is linked to teaching or research
      activity — the domain runs roughly from university unit through teaching hospital,
      with a not-applicable/not-informed code for facilities with no such link. This
      is an institutional attribute independent of care volume: a large hospital with
      no teaching link still treats patients normally.

      '
    code_system: internal
    source: web
    source_ref: '[MICRODATASUS] `"1"~"Unidade Universitária" ... "5"~"Hospital de ensino"`

      '
    codelists:
    - ATIV_ENS
    notes: 'Independent of TP_UNID (facility type) — a hospital can be TP_UNID=hospital
      and ATIVIDAD=teaching-linked at the same time; the two axes are orthogonal.

      '
  CLIENTEL:
    official_name: Fluxo de clientela
    translated_name: Patient-flow / referral-intake type
    description: 'How patients reach the establishment — spontaneous demand (walk-in),
      referred-only, a mix of both, or "flow not required" when the concept does not
      apply to that facility type. This is about intake channel, not clinical urgency
      or triage.

      '
    code_system: internal
    source: web
    source_ref: '[MICRODATASUS] `"1"~"Atendimento de demanda espontânea" ... "0"~"Fluxo
      não exigido"`

      '
    codelists:
    - FLUX_CLI
  CMPT_FIM:
    official_name: Competência final
    translated_name: End year-month of the habilitação record's validity period
    description: 'The AAAAMM year-month at which the habilitação/accreditation record
      this row describes (see SGRUPHAB) stopped being in effect; an accreditation still
      current at extraction time typically carries the latest available competência
      rather than a real end date. Paired with CMPT_INI.

      '
    code_system: none
    source: inferred
    reasoning: Same reasoning as CMPT_INI, its paired start-of-period column.
  CMPT_INI:
    official_name: Competência inicial
    translated_name: Start year-month of the habilitação record's validity period
    description: 'The AAAAMM year-month at which the habilitação/accreditation record
      this row describes (see SGRUPHAB) began being in effect. Read together with CMPT_FIM,
      which marks the end of the same validity window.

      '
    code_system: none
    source: inferred
    reasoning: 'CMPT_ is DATASUS''s "competência" period-field prefix (paired here
      with CMPT_FIM), the column is bound to the "COMPT" period codelist, and it appears
      only in the habilitação- family series (EE, EF, EFUFAAMM, GM, GMUFAAMM, HB) alongside
      SGRUPHAB/DTPORTAR/ MAPORTAR/PORTARIA.

      '
  CNPJ_MAN:
    official_name: CNPJ da mantenedora
    translated_name: CNPJ of the establishment's holding/maintaining entity
    description: 'National registry number (CNPJ) of the legal entity that maintains/owns
      the establishment — e.g. a hospital chain''s holding company, the diocese running
      a philanthropic hospital, or a municipal health secretariat. One mantenedora
      CNPJ commonly recurs across many CNES establishment records belonging to the
      same network.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "CNPJ da mantenedora do estabelecimento"'
    notes: An organizational tax identifier, not a personal one — pass through unmodified.
  CODUFMUN:
    official_name: Código do Município (UF + Município)
    translated_name: IBGE municipality code of the establishment
    description: 'The 6-digit IBGE code (state digits + municipality digits) of the
      municipality where the establishment is registered. It is also the join key the
      catalog uses to reach several derived territorial-classification lookups (Legal
      Amazon membership, state- capital flag, extreme-poverty area, land-border-strip
      zone) — those are auxiliary joins keyed on this code, not separate facts stored
      in the column itself.

      '
    code_system: external
    source: web
    source_ref: '[PCDAS] "Código do município do estabelecimento: UF + MUNIC"'
    codelists:
    - BR_AMAZLEGAL
    - BR_CAPITAL
    - BR_EXTRPOBREZ
    - BR_FRONTFAIXA
    - BR_FRONTZONA
  COD_CEP:
    official_name: Código de Endereçamento Postal (CEP)
    translated_name: Postal code (CEP) of the establishment's address
    description: 'The Brazilian postal code (CEP) of the establishment''s registered
      street address — finer-grained than CODUFMUN. Useful for street/neighbourhood-level
      geocoding, but CEP boundaries are redrawn by the postal service over time and
      are not a stable long-run key.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Código do CEP do estabelecimento"'
  COD_IR:
    official_name: Código de retenção do imposto de renda
    translated_name: Income-tax withholding classification code
    description: 'Classifies the establishment''s institutional nature for income-tax
      withholding purposes on the SUS payments it receives — roughly twenty categories
      spanning public, philanthropic, and private-for-profit institutions. An administrative/fiscal
      attribute of the payee, not a clinical field.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Indicates tax retention type (10=Public through 19=Code 19)";
      [MICRODATASUS] "Maps codes 0-19 to institutional types (public, philanthropic,
      private, etc)"

      '
    codelists:
    - RETENMAN
    notes: 'Conceptually close to RETENCAO (also a tax-withholding classification);
      the two were not confirmed to be identical, so keep them as separate columns
      rather than assuming redundancy.

      '
  COMPETEN:
    official_name: Competência (Ano/Mês)
    translated_name: Reference year-month of the CNES snapshot
    description: 'The AAAAMM (year+month) "competência" the record belongs to — which
      monthly CNES extract this row was published in, not a date tied to any real-world
      event at the establishment. CNES is republished monthly, so the same establishment
      reappears under the same identity fields across many COMPETEN values as its record
      is refreshed.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Ano e Mês de competência da informação (AAAAMM)"'
  CPF_CNPJ:
    official_name: CPF/CNPJ do estabelecimento
    translated_name: CPF or CNPJ of the establishment itself
    description: 'The establishment''s own tax/personal identifier: a CPF (individual
      taxpayer number) when PF_PJ marks it as pessoa física — e.g. a self-employed
      professional''s own office — or a CNPJ (company registry number) when it is pessoa
      jurídica. Distinct from CNPJ_MAN, which identifies the parent/maintaining entity
      rather than the establishment itself.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "CPF do estabelecimento, caso pessoa física ou CNPJ"'
    notes: 'Can hold a CPF — a personal identifier of an individual professional/proprietor,
      not just an organizational code. Surface it plainly; propose no masking.

      '
  DISTRADM:
    official_name: Distrito administrativo / Módulo assistencial
    translated_name: Local administrative/care-module district code
    description: 'Code of a local administrative subdivision ("módulo assistencial")
      a municipal or state health authority uses to organize its services. The source
      dictionary states this explicitly follows a locally defined table, so the same
      numeric code means different things in different municipalities.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Código do Módulo Assistencial conforme tabela local"'
    notes: 'Codes are defined per municipality, not nationally — cross-municipality
      comparison or aggregation needs each municipality''s own lookup, which this catalog
      does not carry.

      '
  DISTRSAN:
    official_name: Distrito sanitário
    translated_name: Sanitary/health district code
    description: 'Code of the sanitary district — a health-service administrative subdivision,
      chiefly used by larger municipalities to split the city into local health-planning
      areas — that the establishment belongs to.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Código do distrito sanitário"'
    notes: No codelist is bound to this column in this catalog; the district numbering
      is set locally.
  DTPORTAR:
    official_name: Data da portaria
    translated_name: Date of the ordinance (portaria) granting the habilitação
    description: 'Calendar date of the ministerial/state ordinance ("portaria") that
      granted or altered the habilitação/accreditation this row records — the legal
      act''s date, not the date CNES was updated to reflect it.

      '
    code_system: none
    source: inferred
    reasoning: 'DT_ is DATASUS''s date-field prefix; the same record group carries
      PORTARIA (declared as a long text field consistent with an ordinance citation)
      and MAPORTAR (a companion AAAAMM period), so DTPORTAR reads naturally as the
      calendar date of that same ordinance.

      '
  ESFERA_A:
    official_name: Esfera administrativa
    translated_name: Administrative sphere / level of government
    description: 'One of federal, state, municipal, or private — which of those holds
      administrative authority over the establishment. This is about who administers
      the facility, separate from who is responsible for it within SUS (that is TPGESTAO):
      a privately-owned facility can still be municipally managed within SUS.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Código da esfera administrativa: 01-Federal; 02-Estadual";
      [MICRODATASUS] `"1"~"Federal", "2"~"Estadual", "3"~"Municipal", "4"~"Privada"`

      '
    codelists:
    - ESFERADM
  GESPRG1E:
