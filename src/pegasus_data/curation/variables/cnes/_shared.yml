  MAPORTAR:
    official_name: Mês/Ano da portaria
    translated_name: Year-month of the ordinance (portaria)
    description: 'The AAAAMM year-month of the same ordinance recorded in DTPORTAR/PORTARIA
      — a coarser, period-grain companion to the exact date.

      '
    code_system: none
    source: inferred
    reasoning: 'Declared width C(6,0) matches AAAAMM, and it is bound to the same "COMPT"
      period codelist as CMPT_INI/CMPT_FIM; sits beside DTPORTAR/PORTARIA in the habilitação
      series.

      '
  MICR_REG:
    official_name: Microrregião de saúde
    translated_name: Health micro-region code (NOAS regionalization)
    description: 'Code of the health micro-region — a finer subdivision of REGSAUDE
      — the establishment is assigned to under the same NOAS regionalization framework.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Código da microrregião de saúde NOAS"'
    notes: Same caveat as REGSAUDE — no codelist is bound to it in this catalog.
  NIVATE_A:
    official_name: Indica a existencia de Nivel de Atencao AMBULATORIAL, de gestao
      Municipal/Estadual, para este CNES
    translated_name: Outpatient (ambulatorial) care tier exists for this establishment
    description: Flag (1-sim, 0-nao) for whether this establishment has an outpatient
      (ambulatorial) care tier at all, under either municipal or state management,
      on the Estabelecimentos (ST) record. It is a coarse existence flag - it does
      not say which of GESPRG1E/M, GESPRG2E/M or GESPRG4E/M is the one that is set,
      only that at least one ambulatorial management combination applies.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 46
  NIVATE_H:
    official_name: Indica a existencia de Nivel de Atencao HOSPITALAR, de gestao Municipal/Estadual,
      para este CNES
    translated_name: Inpatient (hospitalar) care tier exists for this establishment
    description: Flag (1-sim, 0-nao) for whether this establishment has an inpatient
      (hospitalar) care tier at all, under either municipal or state management, on
      the Estabelecimentos (ST) record. Sibling of NIVATE_A for the hospital side;
      a coarse existence flag, not a breakdown by GESPRG5E/M vs GESPRG6E/M.
    code_system: internal
    source: layout_doc
    source_ref: IT_CNES_1706.pdf (CNES - Informe Tecnico 2017-06), ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/IT_CNES_1706.pdf,
      Sec 2.1 Layout dos arquivos de Estabelecimentos (ST*.dbf), SEQ 53
  NIV_DEP:
    official_name: Grau/Nível de dependência
    translated_name: Institutional dependency level
    description: 'Whether the establishment is administratively independent (Individual)
      or subordinate to / maintained by another establishment or entity (Mantida) —
      e.g. a satellite outpatient unit reported under its parent hospital''s registration.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Grau de dependência, onde: 1-Individual 3-Mantida"; [MICRODATASUS]
      `"1" ~ "Individual", "3" ~ "Mantida"`

      '
    codelists:
    - NIVELDEP
  NIV_HIER:
    official_name: Nível de hierarquia
    translated_name: Care-network hierarchy level
    description: 'Places the establishment within the SUS care-complexity hierarchy
      (roughly primary/ basic care through higher-complexity referral levels). The
      exact mapping from code to hierarchy level was not individually confirmed for
      every code in the sources found; rely on the bound codelist for that, not on
      this description.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Código do nível de hierarquia"; [MICRODATASUS] (8 hierarchy
      levels)'
    codelists:
    - NIV_HIER
  PF_PJ:
    official_name: Indicador de pessoa física/jurídica
    translated_name: Individual-person vs legal-entity indicator
    description: 'Marks whether the establishment is registered as a natural person
      (pessoa física, code 1 — e.g. an independent professional''s own practice) or
      a legal entity (pessoa jurídica, code 3 — a company, hospital, clinic, etc).
      Governs whether CPF_CNPJ holds a CPF or a CNPJ.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Indicador de pessoa: 1-Física 3-Jurídica"; [MICRODATASUS]
      `"1" ~ "Pessoa física", "3" ~ "Pessoa jurídica"`

      '
    codelists:
    - TP_PFPJ
  PORTARIA:
    official_name: Portaria
    translated_name: Ordinance number/citation
    description: 'Identifier of the ministerial/state ordinance ("portaria") that authorized
      the habilitação/accreditation this row records — e.g. its number and issuing
      body. Declared as a 50-character field, consistent with holding a citation string
      rather than a bare numeric code.

      '
    code_system: none
    source: inferred
    reasoning: 'Field name plus declared C(50,0) width (too wide for a bare code, right
      for a citation string) and its presence alongside DTPORTAR/MAPORTAR/SGRUPHAB
      in the same habilitação series.

      '
  QT_EXIST:
    official_name: Quantidade existente
    translated_name: Existing-quantity count
    description: 'A generic numeric count of how many of the thing this record is about
      currently exist at the establishment. The same column name is reused across file
      series with different referents: in the LT (leitos/beds) series it counts existing
      beds of the row''s type, and in the EQ (equipamentos) series it counts existing
      units of the row''s equipment type. Always read it together with whatever row-identifying
      code sits alongside it in that series — the column itself does not say what is
      being counted.

      '
    code_system: none
    source: inferred
    reasoning: 'QT_ is DATASUS''s quantity-field prefix, declared N(4,0) numeric; [PDFCOFFEE]
      independently glosses it as "Quantidade de Leitos Existentes" in the beds context,
      and the evidence shows the same column also carries the EQ equipment series,
      so the generic "existing quantity of X" reading (rather than a beds-only meaning)
      is inferred from combining the two.

      '
  REGSAUDE:
    official_name: Região de saúde
    translated_name: Health-region code (NOAS regionalization)
    description: 'Code of the health region — a Ministry of Health NOAS-regionalization
      grouping of several neighbouring municípios used for health-service planning
      above the municipal level — that the establishment''s municipality belongs to.

      '
    code_system: none
    source: web
    source_ref: '[PCDAS] "Código da região de saúde NOAS"'
    notes: 'A real regional-planning identifier used across several SUS systems, not
      a DATASUS-invented code — but no codelist is bound to it in this catalog, so
      there is no label to resolve it to here.

      '
  RETENCAO:
    official_name: Código de retenção
    translated_name: Tax-withholding classification code
    description: 'Classifies the establishment for tax-withholding ("retenção na fonte")
      purposes on payments it receives — a small enumerated domain (roughly 0-16) tied
      to the establishment''s institutional/ownership category. An administrative/fiscal
      attribute, not a clinical one.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Tax retention code (00-16 range)"; [MICRODATASUS] "Maps codes
      0-16 to establishment types"

      '
    codelists:
    - RETENCAO
    notes: See COD_IR — a related but not confirmed-identical tax-classification column.
  SGRUPHAB:
    official_name: Sigla do grupo de habilitação
    translated_name: Habilitação (SUS accreditation) group code
    description: 'Identifies which specific SUS service accreditation/habilitação this
      row grants the establishment — e.g. a qualification tied to a particular incentive
      programme, bed type, or specialized-service designation. The catalog binds it
      to six different DATASUS domain tables rather than one single codelist, so resolving
      a given code''s meaning needs the matching domain table, not an assumption from
      the column alone.

      '
    code_system: internal
    source: inferred
    reasoning: 'SGRUPHAB sits in the same EE/EF/GM/HB series as CMPT_INI, CMPT_FIM,
      DTPORTAR, MAPORTAR and PORTARIA — a period-plus-ordinance cluster of fields consistent
      with a habilitação record — and is bound to six habilitação/incentive-related
      DATASUS domain tables (ESTABENS, ESTABFIL, GESTAO, HABILITA, INCENTIVOS, REGRAS),
      matching DATASUS''s SG_ ("sigla") short-code naming convention.

      '
    codelists:
    - ESTABENS
    - ESTABFIL
    - GESTAO
    - HABILITA
    - INCENTIVOS
    - REGRAS
  TERCEIRO:
    official_name: Terceiro
    translated_name: Outsourced-link flag
    description: 'Binary flag marking whether the linked professional or service relationship
      recorded in this row is an outsourced/third-party ("terceirizado") arrangement
      rather than a direct bond to the establishment. Appears in the team/professional-linkage
      series (e.g. EE, EF, EP, GM), not in the core ST establishment file.

      '
    code_system: internal
    source: web
    source_ref: '[MICRODATASUS] `"1"~"Sim", "0"/"2"~"Não"`'
    codelists:
    - TERCEIRO
  TPGESTAO:
    official_name: Tipo de gestão
    translated_name: SUS management level
    description: 'Which level of the SUS system manages and is responsible for the
      establishment''s inclusion in the health network: Municipal, Estadual (state),
      Dupla (dual state+municipal), or Z/S for "sem gestão" (not informed/none). See
      ESFERA_A for the separate question of who administratively owns the facility.

      '
    code_system: internal
    source: web
    source_ref: '[MICRODATASUS] `"D"~"Dupla", "E"~"Estadual", "M"~"Municipal", "Z"/"S"~"Sem
      gestão"`

      '
    codelists:
    - NIVELDEP
    - TPGESTAO
  TP_PREST:
    official_name: Tipo de prestador
    translated_name: Provider ownership/legal-nature classification
    description: 'Classifies the establishment as a services provider by ownership/legal
      nature for SUS billing purposes — the domain runs from public-federal through
      private-nonprofit (public federal/state/municipal, private for-profit, private
      nonprofit, etc).

      '
    code_system: internal
    source: web
    source_ref: '[MICRODATASUS] `"30"~"Público federal" ... "60"~"Privado sem fins
      lucrativos"`; [PCDAS] "Healthcare provider type (30-99 range)"

      '
    codelists:
    - TIPOPRES
  TP_UNID:
    official_name: Tipo de unidade (estabelecimento)
    translated_name: Health-establishment type
    description: 'CNES''s own facility-type taxonomy — over 30 category codes distinguishing,
      e.g., general hospital, basic health unit (UBS), specialty clinic, diagnostic-support
      unit, pharmacy, mobile unit, etc. This is the primary "what kind of place is
      this" field that most downstream tabulations filter or group by.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Tipo de unidade (estabelecimento)"; [MICRODATASUS] (30+ codes
      mapped to facility types)'
    codelists:
    - TP_ESTAB
  TURNO_AT:
    official_name: Turno de atendimento
    translated_name: Operating shift/hours code
    description: 'Which shift(s) the establishment operates in — the domain runs from
      intermittent/ irregular hours through fixed day/evening/night shifts, with a
      not-informed code. Describes the opening-hours pattern, not staffing levels or
      attendance volume.

      '
    code_system: internal
    source: web
    source_ref: '[MICRODATASUS] `"1"~"Turnos intermitentes" ... "7"~"Noite"`

      '
    codelists:
    - TURNOSAT
  VINC_SUS:
    official_name: Vínculo com o SUS
    translated_name: SUS-linkage flag
    description: 'Whether the establishment has a formal bond with SUS, the public
      health system (1-Sim) or not (0/2-Não, i.e. it serves only private/supplementary-health
      patients). A yes/no relationship flag, not a measure of how much SUS activity
      the facility performs.

      '
    code_system: internal
    source: web
    source_ref: '[PCDAS] "Vínculo com SUS: 1-Sim 0-Não"; [MICRODATASUS] `"0"/"2" ~
      "Não", "1" ~ "Sim"`

      '
    codelists:
    - VINC_SUS
