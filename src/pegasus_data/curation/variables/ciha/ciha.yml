# CIHA.CIHA — Hospital and outpatient communication
# Comunicação de Internação Hospitalar e Ambulatorial
#
# One admission or outpatient episode outside SUS funding.
system: CIHA
asserted_by: pegasus_data
variables:
  CAR_INT:
    official_name: Caráter da internação (campo reservado, vazio na CIHA)
    translated_name: Character of admission (reserved, blank in CIHA)
    description: 'Two-character slot in the same record position DATASUS''s SIH-SUS layout
      uses for "caráter da internação" (elective vs. urgent admission), but the CIHA layout
      table lists this field''s content as "(Vazio)" - DATASUS does not populate it for CIHA.
      Every CIHA*.dbf row carries blanks here regardless of competência or year.

      '
    code_system: none
    notes: 'Do not read this as SIH''s admission-character code. The catalog shows no codelist
      bound and no observed values for this field in CIHA, which is consistent with the layout
      document''s own "(Vazio)" note - the slot exists for positional compatibility with the
      SIH record shape, not because CIHA collects the information.

      '
  CGC_CONSOR:
    official_name: CNPJ do consórcio de saúde (inferido)
    translated_name: CNPJ of the reporting health consortium (inferred)
    description: CNPJ of the intermunicipal health consortium (consórcio público de saúde,
      Lei 11.107/2005) through which the remittance was submitted, where a facility files
      via a consortium rather than directly. Sits alongside CGC_HOSP and is the same 14-character
      shape.
    code_system: none
    source: inferred
    reasoning: 'Name decomposes under DATASUS''s own convention as CGC_ (legacy pre-1998 name
      for CNPJ, used elsewhere in this very file as CGC_HOSP) + CONSOR (consórcio). Declared
      width C(14,0) is exactly CNPJ''s 14-digit length and matches CGC_HOSP''s width in the
      same record, i.e. a second legal-entity identifier slot alongside the establishment''s
      own CNPJ - the pattern DATASUS uses when a second reporting entity (a consortium) can
      stand in for the facility.

      '
    notes: Not documented in the Layout_Arquivos_CIHA.pdf I read (the 2011 rollout table,
      29 fields, ending at MODALIDADE). This column post-dates that document; treat this description
      as a naming/width inference, not a confirmed field definition, until a newer layout
      document surfaces. Absent from the 29-field 2011 baseline layout, so it entered in a
      later revision. The consortium reading is inferred from the name and the CNPJ-shaped
      width; no layout document in hand states it.
  CGC_HOSP:
    official_name: CNPJ do Estabelecimento de Saúde
    translated_name: CNPJ (tax id) of the health establishment
    description: 'The 14-digit CNPJ (National Registry of Legal Entities number) of the establishment
      that filed the CIHA remittance - the legal entity, not the physical facility unit. CNES
      (also in this record) identifies the specific facility; a single CNPJ can own several
      CNES-coded units.

      '
    code_system: none
    notes: 'Organizational tax id, not personal data. It is a real-world identifier (per the
      project''s code_system rule, identifiers are filed under "none" rather than "external"
      alongside dates/counts/free text), and combined with CNES/MUNIC_MOV it pins down a specific
      hospital, so treat it as identifying information for access-control purposes even though
      it is not personal.

      '
  CNES:
    official_name: Código CNES do estabelecimento
    translated_name: CNES code of the establishment
    description: 'The 7-digit National Registry of Health Establishments (CNES) code of the
      specific facility unit that generated the record - the facility, as distinct from CGC_HOSP''s
      legal-entity CNPJ. This is the standard join key DATASUS uses across systems (SIH, SIA,
      CNES itself) to attach an establishment''s registered attributes (type, management sphere,
      address, services) to a production record.

      '
    code_system: external
    notes: 'The catalog binds CNES to per-state establishment cadastre tables (CADGER + UF
      suffix, e.g. CADGERBA for Bahia) rather than one national table - use the table matching
      the record''s state to resolve a CNES code to the establishment''s name and attributes.

      '
  COBRANCA:
    official_name: Motivo da cobrança
    translated_name: Billing/discharge reason code
    description: 'Coded reason associated with the billing event tied to the record''s discharge/completion
      - "Motivo da cobrança" per the layout document. Draws on codelist SAIDAPERM.

      '
    code_system: internal
    codelist: SAIDAPERM
    notes: 'CIHA reuses the field name COBRANCA from SIH-SUS, where the same name documents
      "motivo de saída/permanência" (discharge/stay outcome reason) - the codelist name SAIDAPERM
      matches that concept, so treat COBRANCA as encoding how/why the episode ended, not a
      monetary amount.

      '
  DIAG_SECUN:
    official_name: Diagnóstico secundário (CID-10)
    translated_name: Secondary diagnosis (ICD-10)
    description: '"Diagnóstico secundário, segundo a CID-10" - the secondary ICD-10 diagnosis
      code recorded for the visit, alongside the record''s primary diagnosis (DIAG_PRINC,
      not in this batch). Four characters, matching CID-10''s category.subcategory code length.

      '
    code_system: external
    codelist: CID10_01
    codelists:
    - CID10GRUPO
    - CID10GRUPOC
    - CID10GRUPOS
    - CID10CAC
    - CID10CAP
    notes: 'The extra codelists beyond CID10_01 are chapter/group/category groupings TabNet
      derives from the same ICD-10 code for tabulation axes, not alternate codings of the
      field itself.

      '
  DIAS_PERM:
    official_name: Dias de permanência
    translated_name: Length of stay (days)
    description: '"Dias de permanência" - the number of days the episode this record documents
      lasted, i.e. length of stay between admission/attendance and discharge.

      '
    code_system: none
    notes: 'SPURIOUS-BINDING CANDIDATE: the catalog binds a PERM codelist to this field (source
      def), but PERM is a TabNet tabulation band (e.g. "1 a 3 dias") computed FROM this count
      for cross-tab display, not a code the raw field carries - the field itself is a plain
      count of days, per the layout document''s own description.

      '
  DT_ATEND:
    official_name: Data do atendimento
    translated_name: Date of attendance/admission
    description: '"Data do atendimento, formato AAAAMMDD" - the date of the outpatient attendance
      or hospital admission event the record documents, 8 digits, year-month-day.

      '
    code_system: none
    notes: 'SPURIOUS-BINDING CANDIDATE: the catalog binds ANO and MESES codelists to this
      field, but those are TabNet''s Ano/Mês tabulation axes derived from the date, not values
      the raw column takes - the field itself is a date, exactly as the layout document states.

      '
  ESPEC:
    official_name: Especialidade (campo reservado, vazio na CIHA)
    translated_name: Bed/ward specialty (reserved, blank in CIHA)
    description: '"(Vazio)" per the layout document - the bed-specialty slot inherited from
      the SIH record shape, left blank for CIHA.

      '
    code_system: none
    notes: 'Present but unpopulated in CIHA*.dbf files; do not confuse with SIH-SUS''s own
      ESPEC field (ward/bed specialty), which is populated there. No codelist is bound and
      no values are observed here, matching the "(Vazio)" note.

      '
  FONTE:
    official_name: Fonte da remuneração
    translated_name: Source of remuneration/funding
    description: '"Fonte da remuneração" - the coded source of funding behind the reported
      care (e.g. private health plan, out-of-pocket, or a Ministry-run financing program such
      as PRONON/PRONAS-PCD, which CIHA''s own remuneration-source table lists as valid entries
      alongside more general categories).

      '
    code_system: internal
    codelist: FONTE
  GESTAO:
    official_name: Tipo de gestão
    translated_name: Management tier of the hospital
    description: '"Indica o tipo de gestão do hospital" - the coded administrative- management
      tier the reporting hospital falls under (the same concept SIH-SUS''s own GESTAO field
      encodes, e.g. municipal vs. state management), one character.

      '
    code_system: internal
    codelist: GESTAO
  HOMONIMO:
    official_name: Homônimo (campo reservado, vazio na CIHA)
    translated_name: Homonymous-patient flag (reserved, blank in CIHA)
    description: '"(Vazio)" per the layout document - the slot inherited from SIH-SUS''s flag
      for a patient record that is a same-name duplicate of another, left blank in CIHA.

      '
    code_system: none
    notes: 'Present but unpopulated; it cannot be used to detect duplicate patient records
      in CIHA the way the equivalent SIH field sometimes can.

      '
  IDADE:
    official_name: Idade
    translated_name: Age
    description: '"Idade, na unidade do campo COD_IDADE" - the patient''s age, but the UNIT
      it is expressed in (days, months or years) depends on the value of COD_IDADE, a separate
      column not in this batch. The layout document gives COD_IDADE''s code table directly:
      0 = ignorada (unknown), 2 = dias, 3 = meses, 4 = anos, 5 = anos (para maiores de 100
      anos).

      '
    code_system: none
    depends_on:
    - COD_IDADE
    notes: 'Reading IDADE as "years" unconditionally is wrong whenever COD_IDADE is 2 or 3
      (age recorded in days or months - typically newborns/infants under one year). The project''s
      open gap semantics.cod_idade_units names this exact ambiguity as unresolved for SIH''s
      identical field layout; CIHA''s own layout document, unlike SIH''s, does give the unit
      codes directly (quoted above), so decoding is possible here once COD_IDADE is read alongside
      this column.

      '
  MODALIDADE:
    official_name: Modalidade do atendimento
    translated_name: Care modality
    description: '"Modalidade do atendimento" - the coded classification of how the reported
      care was organized/delivered (e.g. hospitalization vs. outpatient modality), two characters.

      '
    code_system: internal
    codelist: MODALIDADE
  MORTE:
    official_name: Óbito (saída com morte)
    translated_name: Death outcome flag
    description: '"Indica se o paciente teve saída com morte" - a one-character flag for whether
      this episode ended in the patient''s death, coded per the layout document itself as
      0 = Não, 1 = Sim.

      '
    code_system: internal
    codelist: MORTES
    notes: 'The catalog binds this field to a codelist named MORTES (plural), not MORTE -
      same field, differently-named lookup table.

      '
  MUNIC_MOV:
    official_name: Município do estabelecimento
    translated_name: Municipality of the establishment
    description: '"Código do município onde se localiza o hospital" - the 6-digit IBGE code
      of the municipality where the REPORTING ESTABLISHMENT is physically located. Not the
      patient''s residence - that is MUNIC_RES.

      '
    codelist: BR_MUNICIPALFA
    codelists:
    - BR_MUNICIP
    - BR_REGIAO
    - BR_MACSAUD
    - BR_PNDR
    - BR_CAPITAL
    code_system: external
    notes: 'The extra codelists are TabNet-derived geography (macro-region, health macro-region,
      PNDR regional-development typology, capital flag) computed from this same municipality
      code, not alternate codings of the field.

      '
  MUNIC_RES:
    official_name: Município de residência
    translated_name: Municipality of patient residence
    description: '"Município de residência" - the 6-digit IBGE code of the municipality where
      the PATIENT lived, as declared at the visit. Not where care was given - that is MUNIC_MOV.

      '
    codelist: BR_MUNICIPALFA
    codelists:
    - BR_MUNICIP
    - BR_REGIAO
    - BR_MACSAUD
    - BR_PNDR
    - BR_CAPITAL
    code_system: external
    notes: 'Same derived-axis caveat as MUNIC_MOV: the extra bound codelists are TabNet geography
      computed from this code, not alternate values it takes.

      '
  NACIONAL:
    official_name: Nacionalidade (campo reservado, vazio na CIHA)
    translated_name: Nationality (reserved, blank in CIHA)
    description: '"(Vazio)" per the layout document - the nationality-code slot, left blank
      in CIHA.

      '
    code_system: none
    notes: Present but unpopulated; no codelist is bound and none should be inferred.
  NASC:
    official_name: Data de nascimento do paciente
    translated_name: Patient date of birth
    description: '"Data de nascimento do paciente" - the patient''s date of birth, 8 characters.

      '
    code_system: none
    notes: 'Unlike DT_ATEND/DT_SAIDA, the layout document does not spell out this field''s
      digit format explicitly. The declared width (8 chars) and DATASUS''s system-wide date
      convention (used for DT_ATEND/DT_SAIDA in this same record) make AAAAMMDD (YYYYMMDD)
      the expected format, but that specific format claim is inferred from convention, not
      quoted from the document.

      '
  NATUREZA:
    official_name: Natureza da relação com o SUS
    translated_name: Nature of the hospital's SUS relationship
    description: '"Natureza da relação do hospital com o SUS" - the coded classification of
      the reporting hospital''s legal/contractual relationship to SUS, two characters.

      '
    code_system: internal
    codelist: NATUREZA
    codelists:
    - NATUREZC
    notes: 'Two vintages of the code table are bound (NATUREZA and NATUREZC); which applies
      may depend on the record''s competência year - check both before assuming a code is
      unlabelled.

      '
  QT_PROC:
    official_name: Quantidade de procedimento
    translated_name: Procedure count
    description: '"Quantidade de procedimento" - how many times the procedure recorded elsewhere
      in the record (PROC_REA, not in this batch) was performed for this attendance.

      '
    code_system: none
  SEXO:
    official_name: Sexo do paciente
    translated_name: Patient sex
    description: '"Sexo do paciente" - the patient''s coded sex, one character.

      '
    code_system: internal
    codelist: SEXO
    notes: 'No observed values are catalogued for CIHA (this system is profiled from file
      headers, not value frequencies), so the specific code-to-label mapping is not asserted
      here - only that the field draws on the SEXO codelist. Do not assume it matches another
      system''s code/label pairing without checking a CIHA-scoped dictionary entry.

      '
