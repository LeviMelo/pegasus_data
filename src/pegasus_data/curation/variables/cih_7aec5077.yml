system: CIH
asserted_by: pegasus_data
variables:
  FONTE:
    official_name: Fonte da remuneração
    translated_name: Payment/funding-source code
    description: >
      A 2-digit code naming which channel remunerates the admission, positioned
      right after CNES and before the patient's name. Distinct from COBRANCA
      (why the stay ended) and from any money amount, which this field never
      carries.
    code_system: internal
    source: layout_doc
    source_ref: >
      ftp://ftp.datasus.gov.br/dissemin/publicos/CIH/200801_201012/Auxiliar/TAB_CIH.zip
      -> "FQA CIH 180610.doc" (Ficha de Qualificação de Arquivo Disseminável),
      field 27 "FONTE ... CHAR (02) ... Fonte da remuneração".
    notes: >
      No code-list values for this field are listed in CIH's own dictionary or
      catalogued as observed data (CIH is profiled from headers, not per-file
      value counts), so only the field's purpose is asserted here.
