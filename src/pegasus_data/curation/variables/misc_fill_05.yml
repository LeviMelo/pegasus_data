# PNI — the one straggler column left in this dataset. Completes the
# DOSE1/DOSEN/DIFER dropout-rate family already documented in pni_a.yml.
system: PNI
asserted_by: pegasus_data

variables:

  ABAND:
    official_name: Taxa de Abandono
    translated_name: Vaccination dropout (abandonment) rate
    description: >
      Published dropout-rate percentage for this row's vaccine/dose/age
      combination — DIFER (DOSE1 minus DOSEN) divided by DOSE1 and
      multiplied by 100, the same computation chain documented for
      DOSE1/DOSEN/DIFER in pni_a.yml, here as the final output figure.
    code_system: none
    source: inferred
    reasoning: >
      "ABAND" abbreviates abandono; the column appears only in the DPNIUF
      (dropout-by-UF) tabulation series, completing the DOSE1/DOSEN/DIFER
      dropout-rate family already documented, the same way COBERT is that
      family's completed coverage percentage.
    notes: >
      Declared N(11,0) with zero decimals despite representing a percentage
      — consistent with the width/type quirks already flagged on QT_DOSE and
      other PNI fields in pni_a.yml.
