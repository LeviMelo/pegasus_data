# Context fields: properties of a place and a year that are not health events
# (PegaSUS's "field" kind, docs/history/: a property of place-time, beside
# flows and stocks). Read from IBGE's aggregates API
# (https://servicodados.ibge.gov.br/api/v3/agregados), at municipality level.
#
# The IBGE entries are read through the general SIDRA interface (pegasus_data.sidra, ADR-0142): any table of
# `pegasus-data sidra search --level N6` that covers the municipalities (check its count: PNS lists only the capitals) can be declared here.
#
# Each entry names IBGE's own table and variable, as its metadata
# (`/agregados/<table>/metadados`) states them, and the unit. `classification`
# picks one category of a classification ({classification id: category id});
# a classification left out is IBGE's Total. Only totals are
# stored: a per-capita figure is computed at use, over POPSVS, never stored
# (CLAUDE.md: stored aggregates are sums and counts, never finished means).
#
# IBGE's markers are kept as a status beside the value: "-" is a true zero;
# ".." not applicable, "..." not available and "X" suppressed for disclosure
# are null with their reason, never zero.

fields:

  gdp:
    table: 5938
    variable: 37
    unit: R$ thousand, current prices
    what: >
      Produto Interno Bruto a preços correntes, the municipality's GDP for the
      year (IBGE, Produto Interno Bruto dos Municípios, reference 2010).
    years: 2002-2023
    verified: {year: 2021, municipalities: 5570, total_thousand_reais: 9012142031, measured: 2026-10-03}

  gross_value_added_public_administration:
    table: 5938
    variable: 525
    unit: R$ thousand, current prices
    what: >
      Gross value added of public administration, defence, public education
      and health and social security: the weight of the public sector in the
      municipal economy.
    years: 2002-2023

  gross_value_added_agriculture:
    table: 5938
    variable: 513
    unit: R$ thousand, current prices
    what: Gross value added of agriculture and livestock.
    years: 2002-2023

  # Census context, 2000 / 2010 / 2022 (Censo Demográfico). A field with `series:` is one measure of a series
  # stitched across the censuses (curation/sidra/series.yml, which states each series' comparability and gaps;
  # `pegasus-data sidra series NAME --report`). A numerator and its denominator are separate fields, so a share is
  # computed at use; the sums are stored, the ratio never. A municipality created after a census has no figure in
  # it (IBGE's `...`), and the status says so.

  households:
    series: households_total
    unit: households
    what: >
      Households of the census: permanent private households in 2000 and 2010, occupied permanent private households
      in 2022 (the denominator of the household fields below).
    years: 2000, 2010, 2022

  households_sewer_network:
    table: 6805
    variable: 381
    classification: {11558: 46290}
    unit: households
    what: >
      Occupied households whose sewage goes to the general or storm network,
      or to a septic tank connected to it (rede geral, rede pluvial ou fossa
      ligada à rede). Over `households`. Census 2022 only: the broader 2022 category has
      no counterpart in 2000 and 2010 (use `households_sewer_network_comparable`).
    years: 2022

  households_sewer_network_comparable:
    series: households_sewer_network
    measure: numerator
    unit: households
    what: >
      Households whose sewage goes to the general sewer or storm network, in the wording the three censuses share
      (2022 without the septic tanks connected to the network). Over `households`.
    years: 2000, 2010, 2022

  households_without_bathroom:
    series: households_without_bathroom
    measure: numerator
    unit: households
    what: Households with neither bathroom nor toilet. Over `households`.
    years: 2000, 2010, 2022

  households_water_network:
    table: 6803
    variable: 381
    classification: {1821: 72144}
    unit: households
    what: >
      Occupied households connected to the general water network and using it
      as the main supply. Over `households`. Census 2022 only (use `households_water_network_comparable`
      across censuses).
    years: 2022

  households_water_network_comparable:
    series: households_water_network
    measure: numerator
    unit: households
    what: >
      Households supplied by the general water network: the form of supply in 2000 and 2010, the main supply in
      2022 (close, not identical; see the series). Over `households`.
    years: 2000, 2010, 2022

  households_waste_collected:
    series: households_waste_collected
    measure: numerator
    unit: households
    what: Households whose waste is collected (at the door or by skip). Over `households`.
    years: 2000, 2010, 2022

  persons_15_plus:
    series: literacy_15plus
    measure: denominator
    unit: persons
    what: >
      Persons aged 15 or more (2000: the 15-19 and 20+ groups added; 2010: preliminary universe table; 2022: universe).
    years: 2000, 2010, 2022

  persons_15_plus_literate:
    series: literacy_15plus
    measure: numerator
    unit: persons
    what: Persons aged 15 or more who can read and write a simple note. Over `persons_15_plus`.
    years: 2000, 2010, 2022

  persons_10_plus:
    series: literacy_10plus
    measure: denominator
    unit: persons
    what: Persons aged 10 or more, Census 2000 and 2010 (the 2022 census publishes no 10+ literacy).
    years: 2000, 2010

  persons_10_plus_literate:
    series: literacy_10plus
    measure: numerator
    unit: persons
    what: Persons aged 10 or more who can read and write a simple note. Over `persons_10_plus`.
    years: 2000, 2010

  population_resident_census:
    series: population_urban
    measure: denominator
    unit: persons
    what: Resident population of the census (table 202 for 2000 and 2010, 9923 for 2022), the denominator of `population_urban`.
    years: 2000, 2010, 2022

  population_urban:
    series: population_urban
    measure: numerator
    unit: persons
    what: >
      Residents in IBGE's urban situation at each census (its legal urban perimeter of the time: the definition moves
      between censuses). Over `population_resident_census`.
    years: 2000, 2010, 2022

  population_race_universe:
    series: population_race
    measure: denominator
    unit: persons
    what: >
      Resident population of the race/colour tables (the table's own Total, which includes people with no declared
      race): the denominator of the race fields. 2000 is the sample.
    years: 2000, 2010, 2022

  population_white:
    series: population_race
    measure: numerator
    where: {race_color: [white]}
    unit: persons
    what: Resident population declared white (branca), Census 2000 (sample), 2010 and 2022. Over `population_race_universe`.
    years: 2000, 2010, 2022

  population_black:
    series: population_race
    measure: numerator
    where: {race_color: [black]}
    unit: persons
    what: Resident population declared black (preta), Census 2000 (sample), 2010 and 2022.
    years: 2000, 2010, 2022

  population_asian:
    series: population_race
    measure: numerator
    where: {race_color: [asian]}
    unit: persons
    what: Resident population declared of Asian origin (amarela), Census 2000 (sample), 2010 and 2022.
    years: 2000, 2010, 2022

  population_brown:
    series: population_race
    measure: numerator
    where: {race_color: [brown]}
    unit: persons
    what: Resident population declared brown (parda), Census 2000 (sample), 2010 and 2022.
    years: 2000, 2010, 2022

  population_indigenous:
    series: population_race
    measure: numerator
    where: {race_color: [indigenous]}
    unit: persons
    what: Resident population declared indigenous (indígena), Census 2000 (sample), 2010 and 2022.
    years: 2000, 2010, 2022

  # Income in the minimum wages of the census year (R$151, R$510, R$1,212): a share is read within its year, never
  # compared in reais. persons_low_income / persons_income_universe is the share of people with a per-capita income
  # of up to half a minimum wage or none; 2000 is the family's per-capita income, 2010 and 2022 the household's.
  persons_income_universe:
    series: persons_income_band
    measure: denominator
    unit: persons
    what: >
      Persons in the per-capita income tables (residents of private households; in 2010 and 2022 excluding pensioners,
      domestic workers and their relatives), the denominator of the income fields.
    years: 2000, 2010, 2022

  persons_low_income:
    series: persons_income_band
    measure: numerator
    where: {income_band: [le_half, none]}
    unit: persons
    what: >
      Persons with a per-capita income of up to half a minimum wage of the census year, or none (the sum of the
      two lowest bands of `persons_income_band`). Over `persons_income_universe`.
    years: 2000, 2010, 2022

  persons_no_income:
    series: persons_income_band
    measure: numerator
    where: {income_band: [none]}
    unit: persons
    what: Persons with no income (the 'sem rendimento' band), included in `persons_low_income`. Over `persons_income_universe`.
    years: 2000, 2010, 2022

  persons_income_over_2_sm:
    series: persons_income_band
    measure: numerator
    where: {income_band: ['2_3', '3_5', gt_5]}
    unit: persons
    what: Persons with a per-capita income of more than two minimum wages of the census year. Over `persons_income_universe`.
    years: 2000, 2010, 2022

  # Weather, measured where a station stands (sources/inmet.py): one row per
  # station and month, in the municipality whose IBGE boundary contains the
  # station. No interpolation; a municipality without a station has no row.
  climate:
    source: inmet
    unit: "mm (precipitation), °C (temperature): sums, counts and extremes"
    what: >
      Monthly precipitation (sum, readings) and air temperature (sum, readings,
      maximum, minimum) of INMET's automatic (hourly, 2000 on) and
      conventional (daily) stations, from the CC-BY-4.0 Zenodo mirror of
      INMET's releases (record 14925215, checked identical to INMET's own
      archive), positioned from INMET's station API first. A mean is
      sum / readings, at use.
    years: 1961-2024

  # Disasters recorded in S2iD (sources/s2id.py): one row per municipal event.
  disasters:
    source: s2id
    unit: events; people (human-damage counts as reported)
    what: >
      Events recorded in S2iD since 1991 (MIDR/SEDEC, the data behind Atlas
      Digital de Desastres): IBGE municipality, event date, COBRADE code,
      typology and group (climatological, hydrological, meteorological,
      other), status (registered or federally recognised), and deaths,
      injured, sick, homeless, displaced, missing and affected as reported.
    years: 1991-2025

  # Supplementary-health plan links (sources/ans.py), December of each year:
  # the observed input to a SUS-dependent population (a modelled product,
  # ADR-0139), never that population itself.
  ans_beneficiaries:
    source: ans
    unit: active beneficiary links (vínculos), not persons
    what: >
      ANS's consolidated beneficiaries (informacoes_consolidadas_de_beneficiarios),
      the December file of each year: active beneficiaries by municipality of
      residence, sex, age band and plan coverage (Médico-hospitalar or
      Odontológico). Someone with two plans counts twice.
    years: 2021-2025
    verified: {year: 2022, month: 12, medical_hospital: 50530569, equals: "ANS TabNet tabnet_02 Assistência Médica, 28 of 28 UF files", measured: 2026-10-04}

  # Basic-education enrolments (sources/inep.py), the school census's
  # published margins per municipality: an observation of the population by
  # age, sex and race for the population account (ADR-0139), never a count of
  # persons.
  inep_enrolments:
    source: inep
    unit: enrolments (matrículas) in basic education, at the school's municipality
    what: >
      INEP's school census (microdados_ed_basica_<year>), one row per school since
      the 2021 release, summed to the municipality: the total, and separately the
      margins by sex, colour/race (with "not declared") and age band (0-3, 4-5,
      6-10, 11-14, 15-17, 18+). The crossing of the three is not published.
    years: 2021-2024
    verified: {year: 2023, total: 47304632, municipalities: 5570, each_margin_sums_to_total: true, measured: 2026-10-04}

