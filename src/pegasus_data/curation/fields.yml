      IBGE's published survey estimate of the share of adults (18+) who suffered violence or aggression from a stranger in the 12 months before the interview, among all residents aged 18 or more, by state, both sexes and
      all households (IBGE, PNS, table 5351, variable 5828; limits 5829 and 5830, CV 5831). A design-based estimate IBGE
      publishes, not a ratio pegasus_data computes: the survey's weighted universe is not published as a count, so the
      share cannot be rebuilt from pns_violence_by_stranger and is stored as published. It does not add across states or years; a
      coarser figure is IBGE's own (level N1/N2), never a mean of these.
    years: 2013
