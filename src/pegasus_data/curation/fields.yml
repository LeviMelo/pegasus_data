  # Certification quality of the cause of death (SIM-DO, a records cube: `source: records`, `fields.records_cube`): counts of
  # deaths by municipality of residence and year of death, 1996-2023 (ICD-10). Counts, never finished shares: a share is a
  # numerator over `sim_deaths_residence`, formed at use and lifted to any place by summing both.
  sim_deaths_residence:
    label: "Deaths by residence (SIM)"
    over: population
    source: records
    dataset: SIM-DO
    event: death
    years: 1996-2023
    law: sum
    unit: deaths
    what: >
      Deaths of the year, by municipality of residence (SIM-DO, counted by the dataset's event rules): the denominator
      of the two certification-quality fields below.
    gaps: >
      Deaths whose residence is no IBGE municipality are in no municipality's row (0.2% in 2019; they count in the state and
      the country, cube manifest `unplaced_events`). SIM under-enumerates deaths in part of the North and Northeast (RIPSA
      ficha F.11), where a low share of ill-defined causes can also reflect low coverage.
  sim_deaths_ill_defined:
    label: "Deaths from ill-defined causes (R00-R99)"
    over: sim_deaths_residence
    source: records
    dataset: SIM-DO
    event: death
    where: {CAUSABAS: {prefix: [R]}}
    years: 1996-2023
    law: sum
    unit: deaths
    what: >
      Deaths whose underlying cause (CAUSABAS) is in ICD-10 chapter XVIII, symptoms, signs and abnormal findings not
      elsewhere classified (R00-R99), by municipality of residence. Over `sim_deaths_residence`: the proportion of deaths
      from ill-defined causes, the classic indicator of the quality of the information on the DO (RIPSA, ficha C.5).
    gaps: >
      The whole chapter counts, as the RIPSA indicator does (R95-R99 and R54, senility, included). A low share where SIM
      coverage is low is not good certification.
  sim_deaths_garbage_codes:
    label: "Deaths with a garbage-code cause (GBD 2019)"
    over: sim_deaths_residence
    source: records
    dataset: SIM-DO
    event: death
    where: {CAUSABAS: {garbage_codes: GBD2019}}
    years: 1996-2023
    law: sum
    unit: deaths
    what: >
      Deaths whose underlying cause is a garbage code of the Global Burden of Disease 2019 list (Johnson et al. 2021;
      `garbage_codes('GBD2019')`: causes that say little of what the person died of, in any chapter), by municipality of
      residence. Over `sim_deaths_residence`.
    gaps: >
      The list holds codes by prefix (a three-character category covers its subcategories). GBD2017, the list Brazilian
      studies cite, classifies COVID-19 (B34.2) as garbage and GBD2019 does not, which is why GBD2019 is used for the
      pandemic years.

  # Pesquisa Nacional de Saúde (PNS 2013 and 2019), by state. The PNS is a household sample survey designed for the
  # state, and only the capitals of the municipalities are published, so these fields are `level: N3`: one row per state
  # (`uf`, `uf_abbr`) and year, never a value copied onto a state's municipalities. Each carries the survey's own 95%
  # confidence limits and coefficient of variation (`interval`), IBGE's variables of the same table, as `lower`, `upper`
  # and `cv` (thousand persons, thousand persons, per cent). A count, not IBGE's percentage: the percentage of the same
  # table is this count over the question's universe (named in each `what`; IBGE publishes no count of any universe),
  # and is not stored. Where the universe is all adults the percentage and the count give 159.0 million adults in
  # Brazil in 2019 and 145.4 to 146.3 million in 2013.

  pns_chronic_spine_problem:
    label: "Adults reporting chronic spine problem (PNS, by state)"
    level: N3
    table: 4638
    variable: 4615
    interval: {lower: 4616, upper: 4617, cv: 4934}
    unit: thousand persons
    what: >
      Persons aged 18 or more who report a chronic spine problem (problema crônico de coluna), by state, both sexes and
      all households (IBGE, Pesquisa Nacional de Saúde 2013 and 2019, table 4638, variable 4615; limits 4616 and 4617, CV
      4934). The percentage IBGE publishes (variable 4618) is this count over all residents aged 18 or more.
    years: 2013, 2019

  pns_hypertension:
    label: "Adults reporting hypertension diagnosis (PNS, by state)"
    level: N3
    table: 4418
    variable: 4396
    interval: {lower: 4397, upper: 4398, cv: 4861}
    unit: thousand persons
    what: >
      Persons aged 18 or more who report a medical diagnosis of arterial hypertension, by state, both sexes and all
      households (IBGE, PNS 2013 and 2019, table 4418, variable 4396; limits 4397 and 4398, CV 4861). The percentage IBGE
      publishes (variable 4399) is this count over all residents aged 18 or more.
    years: 2013, 2019

  pns_helmet_motorcycle_driver:
    label: "Motorcycle drivers always using helmet (PNS, by state)"
    level: N3
    table: 5267
    variable: 5712
    interval: {lower: 5713, upper: 5714, cv: 5715}
    unit: thousand persons
    what: >
      Persons aged 18 or more who always wear a helmet when driving a motorcycle, by state, both sexes and all
      households (IBGE, PNS 2013 and 2019, table 5267, variable 5712; limits 5713 and 5714, CV 5715). The universe of
      IBGE's percentage (variable 5716) is the adults who drive a motorcycle, a population IBGE publishes in no table of
      the PNS as a count (it is count over percentage: 34.8 million in Brazil in 2013, 36.7 million in 2019); it is not
      all adults and not the state's population, so `over` is left out.
    years: 2013, 2019

  pns_seat_belt_front:
    label: "Adults always using front seat belt (PNS, by state)"
    level: N3
    table: 8082
    variable: 11688
    interval: {lower: 11689, upper: 11690, cv: 11691}
    unit: thousand persons
    what: >
      Persons aged 18 or more who always wear the seat belt in the front seat when driving or riding a car, by state,
      both sexes and all households (IBGE, PNS 2019, table 8082, variable 11688; limits 11689 and 11690, CV 11691). The
      universe of IBGE's percentage (variable 11692) is the adults who drive or ride a car, published as no count (count
      over percentage: 154.6 million in Brazil in 2019, against 159.0 million adults), so `over` is left out.
    years: 2019

  pns_alcohol_abusive_use:
    label: "Adults with abusive alcohol use (PNS 2019, by state)"
    level: N3
    table: 7726
    variable: 4298
    interval: {lower: 4299, upper: 4300, cv: 4829}
    unit: thousand persons
    what: >
      Persons aged 18 or more with abusive alcohol consumption in the 30 days before the interview, by state, both sexes
      and all households (IBGE, PNS 2019, table 7726, variable 4298; limits 4299 and 4300, CV 4829). The percentage IBGE
      publishes (variable 4301) is this count over all residents aged 18 or more.
    years: 2019

  pns_violence_by_stranger:
    label: "Adults assaulted by a stranger (PNS 2013, by state)"
    level: N3
    table: 5351
    variable: 5824
    interval: {lower: 5825, upper: 5826, cv: 5827}
    unit: thousand persons
    what: >
      Persons aged 18 or more who suffered any violence or aggression from a stranger in the 12 months before the
      interview, by state, both sexes and all households (IBGE, PNS 2013, table 5351, variable 5824; limits 5825 and
      5826, CV 5827). The percentage IBGE publishes (variable 5828) is this count over all residents aged 18 or more.
    years: 2013

  pns_chronic_spine_problem_percent:
    label: "Share of adults with chronic spine problem (PNS, by state)"
    level: N3
    table: 4638
    variable: 4618
    interval: {lower: 4619, upper: 4620, cv: 4935}
    unit: percent
    what: >
      IBGE's published survey estimate of the share of adults (18+) reporting a chronic spine problem, among all residents aged 18 or more, by state, both sexes and
      all households (IBGE, PNS, table 4638, variable 4618; limits 4619 and 4620, CV 4935). A design-based estimate IBGE
      publishes, not a ratio pegasus_data computes: the survey's weighted universe is not published as a count, so the
      share cannot be rebuilt from pns_chronic_spine_problem and is stored as published. It does not add across states or years; a
      coarser figure is IBGE's own (level N1/N2), never a mean of these.
    years: 2013, 2019

