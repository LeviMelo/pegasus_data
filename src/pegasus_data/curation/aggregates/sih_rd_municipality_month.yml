# The first aggregate: hospital admissions by municipality and month.
#
# This is the dominant PegaSUS shape — geography x time -> measures — and the
# vertical slice that proves the machinery. Measured on real data: SIH-RD for
# Acre in 2022 is 49,547 admissions and 130 s to fetch; the same rows at
# municipality x month x sex are 989 cells. The artifact exists because of that
# ratio, and the ratio is also why the dimension list is short: DIAG_PRINC has
# ~14,000 ICD codes and would multiply the cells by roughly a thousand, at which
# point the artifact stops being smaller than the microdata it replaces.
#
# `geography_binding` and `time_binding` are keys of `semantic_axes` in
# curation/datasets/core.yml. They are NOT field names: SIH declares residence
# (MUNIC_RES) and facility (MUNIC_MOV), and which one you mean is a question
# about the analysis, not about the file.

name: sih_rd_municipality_month
dataset: SIH-RD
label: Internações hospitalares
description: >
  SUS hospital admissions by municipality of residence and competence month,
  with sex and race/colour retained. Accumulator state only: length of stay is
  stored as (n, sum) so a mean can be derived at any level, never as a mean.

geography_binding: residence      # semantic_axes.geography.residence -> MUNIC_RES
time_binding: competence          # semantic_axes.time.competence -> ANO_CMPT, MES_CMPT
time_grain: month

# Widened by measurement, not by appetite (AGGREGATE_DESIGN §6 still rules).
# On PE/2022 the full set below lands at 3.4 rows per cell -- the artifact
# stays an order of magnitude under the microdata while carrying the variables
# an epidemiologist reaches for first. ESPEC and COBRANCA measured too and
# left out: each roughly doubles the cells for a narrower question, and the
# design's answer to that is a SECOND artifact, not a fatter one.
dimensions:
  - SEXO
  - RACA_COR
  - CAR_INT
  - MORTE

# Age is DERIVED, not read: no raw column holds years. SIH keeps the unit in
# COD_IDADE beside the value (2=days, 3=months, 4=years, 5=100+); anything
# sub-year lands in the first band, anything undecodable in its own level.
age_dimension:
  encoding: sih
  fields: [IDADE, COD_IDADE]

# What the interface calls these. A column name is not a label, and curation's
# translated names are English while the interface is Portuguese -- so the
# artifact's own spec, where an analyst says what this artifact IS, names them.
dimension_labels:
  SEXO: Sexo
  RACA_COR: Raça/cor
  CAR_INT: Caráter da internação
  MORTE: Óbito na internação

level_labels:
  # MORTE is a 0/1 flag the reference tables do not bind; the words are the
  # spec's own statement, verified against the observed codes (0 and 1 only).
  MORTE:
    "0": "Sem óbito"
    "1": "Com óbito"

measures:
  admissions:
    kind: count
    label: Internações
    unit: admission          # checked against the declared grain, which is `admission`
  deaths:
    kind: sum
    label: Óbitos hospitalares
    field: MORTE             # 0/1 in the raw codes, so summing counts deaths
    unit: death
  los:
    kind: mean
    label: Permanência média
    field: DIAS_PERM
    unit: day                # stored as (n, sum); the mean is derived on read
  cost:
    kind: sum
    label: Valor total
    field: VAL_TOT
    unit: brl                # nominal reais at billing time, never deflated
  uti_days:
    kind: sum
    label: Dias de UTI
    field: UTI_MES_TO
    unit: day                # ICU-days billed in the month; a flow, it sums
