# Deaths by municipality of residence and month of death.
#
# This is the SECOND artifact, and its job is to test the claim the whole
# frontend rests on: that no view is dataset-specific. If drawing SIM requires
# touching a component, the capability descriptor failed.
#
# It is deliberately DIFFERENT from SIH in every way that matters:
#
#   * the grain is a `death`, not an `admission` — so `count` means something
#     else and the unit check has to agree;
#   * the time axis is a RECORD DATE (`DTOBITO`), not a billing competence, so
#     `partial_periods` is exercised for the first time on a real build: a
#     death in December of the last fetched year is registered in the following
#     year's file, and the artifact says which periods it therefore cannot have
#     filled;
#   * `SEXO` uses DIFFERENT CODES from SIH — 1/2 here against 1/3 there. The
#     codelist is scoped by system precisely so these cannot be merged, and the
#     interface reads whichever the descriptor gives it;
#   * `LOCOCOR` is a place-of-death dimension SIH has no analogue for, so the
#     sidebar has to grow a control it was never told about.

name: sim_do_municipality_month
dataset: SIM-DO
label: Óbitos
description: >
  Deaths by the deceased's municipality of residence and month of occurrence,
  with sex, race/colour and place of death retained. Accumulator state only.

geography_binding: residence      # semantic_axes.geography.residence -> CODMUNRES
time_binding: occurrence          # semantic_axes.time.occurrence -> DTOBITO (a DATE)
time_grain: month

# Kept few for the same reason SIH's list is short: each dimension multiplies
# the cells and spends the compression that justifies the artifact. CAUSABAS is
# deliberately absent — ~14,000 ICD codes would multiply the cell count by
# roughly a thousand.
dimensions:
  - SEXO
  - RACACOR
  - LOCOCOR

# The mortality pyramid's missing axis. SIM packs the unit into IDADE's
# leading digit (4xx = xx years, 5xx = 100+xx; 1xx/2xx/3xx are sub-year units
# that all land in the under-1 band; 0xx and 9xx are unknown and keep their
# own level). Near-singleton cells are expected at this width and are not a
# new disclosure: SIM's row-level microdata is itself public.
age_dimension:
  encoding: sim
  fields: [IDADE]

dimension_labels:
  SEXO: Sexo
  RACACOR: Raça/cor
  LOCOCOR: Local do óbito

# What this artifact's codes mean, where the reference tables fall short.
#
# SEXO: measured on the built cells, SIM-DO 2022 codes sex as 0/1/2 and the
# bound table labels them with SINGLE LETTERS -- I, M, F. A letter is a code
# wearing a label's clothes; the words are stated here. (First guess was that
# SIM writes M/F/I; the verification against the artifact said otherwise, which
# is why these keys are the OBSERVED codes and not the documented ones.)
#
# RACACOR: the bound table is truncated at source -- `Bra`, `Amar`, `Indig` --
# the .CNV truncation measured in FINDINGS. The codes are the table's own; only
# the words are completed.
#
# LOCOCOR is left to its reference table. Open question, not overridden: that
# table maps 2 -> "Via pública" and 4 -> "Outro" where the modern SIM dictionary
# says 2 = outro estabelecimento de saúde and 4 = via pública, and it labels
# 5, 6 and 9 all "Ignorado". Overriding institutional-vs-street deaths on a
# guess would be worse than the ambiguity; this needs the vintage-correct
# dictionary, not an opinion.
level_labels:
  SEXO:
    "0": Ignorado
    "1": Masculino
    "2": Feminino
  RACACOR:
    "1": Branca
    "2": Preta
    "3": Amarela
    "4": Parda
    "5": Indígena
    "9": Ignorado

measures:
  deaths:
    kind: count
    label: Óbitos
    unit: death        # checked against the declared grain, which is `death`
