    - 'Late submissions edit past months (§3.8.2): a month is read again when its size or ETag changes.'
    - 'The server streams at about 0.8 MB/s per connection: a 2019-2021 build is hours of download.'
    citation: ANVISA, dados abertos do SNGPC (https://dados.anvisa.gov.br/dados/SNGPC/)
    dictionary: https://dados.anvisa.gov.br/dados/Dicionario_de_Dados_Painel_SNGPC_Venda_de_Industrializados.pdf (ANVISA; §3.7 the published period, §5 the fields and codes)
    origin:
      kind: files
      format: csv
      csv:
        sep: ;
        encoding: latin1
      pattern: https://dados.anvisa.gov.br/dados/SNGPC/Industrializados/EDA_Industrializados_{period}.csv
      months: 201401-202110,202601-202609
    columns:
      NU_ANO_VENDA:
        role: year of the sale
        type: integer
      NU_MES_VENDA:
        role: month of the sale
        type: integer
      SG_UF_VENDA:
        role: state (UF) of the pharmacy
        type: code
      NO_MUNICIPIO_VENDA:
        role: name of the pharmacy's municipality (no IBGE code in the file)
        type: label
      NO_CONSELHO_PRESCRITOR:
        role: the prescriber's professional council (CRM, CRO, CRMV, ...)
        type: code
        aliases:
        - NO_CONSEITOR
      SG_UF_CONSELHO_PRESCRITOR:
        role: state of the prescriber's council registration
        type: code
      TP_RECEITUARIO:
        role: type of prescription form (ANVISA's SNGPC dictionary, the sales panels' data dictionary)
        type: code
        codes: {"1": "Receita de Controle Especial em 2 vias (Receita Branca)", "2": "Notificação de Receita B (Notificação Azul)",
                "3": "Notificação de Receita Especial (Notificação Branca)", "4": "Notificação de Receita A (Notificação Amarela)",
                "5": "Receita Antimicrobiano e GLP-1 em 2 vias"}
      CO_CID10:
        role: the patient's ICD-10 code, entered by the pharmacist for antimicrobials (often blank)
        type: code
      SG_SEXO:
        role: the patient's sex (antimicrobials only; ANVISA's SNGPC dictionary)
        type: code
        codes: {"1": male, "2": female}
      NU_IDADE:
        role: the patient's age, in the unit NU_UNIDADE_IDADE gives (antimicrobials)
        type: number
      NU_UNIDADE_IDADE:
        role: the unit of NU_IDADE (antimicrobials only; ANVISA's SNGPC dictionary)
        type: code
        codes: {"1": years, "2": months}
      DS_PRINCIPIO_ATIVO:
        role: active principle(s) of the manufactured medicine
        type: label
      DS_DESCRICAO_APRESENTACAO:
        role: presentation of the medicine as registered
        type: label
      QT_VENDIDA:
        role: quantity sold, in DS_UNIDADE_MEDIDA
        type: number
      DS_UNIDADE_MEDIDA:
        role: unit of the quantity sold (CAIXA, FRASCO, ...)
        type: code
    place:
      column: NO_MUNICIPIO_VENDA
      uf: SG_UF_VENDA
      type: municipality_name
    period:
      type: parts
      year: NU_ANO_VENDA
      month: NU_MES_VENDA
      grain: month
      valid: 2014-2026
    fields:
      sngpc_industrialized_sales:
        measure:
          sum: QT_VENDIDA
        by:
        - DS_PRINCIPIO_ATIVO
        - DS_UNIDADE_MEDIDA
        unit: the unit of DS_UNIDADE_MEDIDA
        what: Quantity of each active principle sold, by municipality and month.
      sngpc_industrialized_sales_by_cid:
        measure:
          sum: QT_VENDIDA
        by:
        - DS_PRINCIPIO_ATIVO
        - DS_UNIDADE_MEDIDA
        - CO_CID10
        unit: the unit of DS_UNIDADE_MEDIDA
        what: 'The same by the patient''s ICD-10 code as entered (antimicrobials). Rarely filled: 221,273 of 57,087,497 lines in
          2021 (0.39%); oral sulfadiazine 311 lines, 1 with B58; spiramycin 7,894 lines, none with B58.'
