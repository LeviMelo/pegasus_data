          and the truck''s purpose. The register''s people supplied (NU_PESSOAS_ABASTECIDAS) is not summed into a field:
          registrants often enter the whole municipality''s population on each truck (Fortaleza 2023, six trucks of
          3,000,000 each; 23 of 1,608 entries above 100,000 hold 96% of the total), so the sum counts the same people many
          times.'
  sngpc_industrialized:
    system: SNGPC
    series: IND
    system_name:
      official_name: Sistema Nacional de Gerenciamento de Produtos Controlados
      translated_name: National system for the management of controlled products
      authority: ANVISA
      what_it_is: Retail-pharmacy sales of controlled medicines and antimicrobials, published monthly by ANVISA.
    official_name: Vendas de medicamentos industrializados
    translated_name: Vendas de medicamentos industrializados
    what: Manufactured controlled medicines and antimicrobials sold by retail pharmacies.
    one_row: "one group of sales: a medicine presentation sold in one municipality and month on prescriptions with the same council, type and (antimicrobials) patient sex, age and ICD-10"
    unit_of_analysis: sales group
    use: context
    why_no_event_type: >-
      Groups of sales of one medicine presentation with no pharmacy, prescription or patient identifier: a row
      can stand for more than one sale (ANVISA's dictionary v1.0, section 5.2.1) and the quantity says how many
      boxes or vials. Medicine sold per municipality and month, not dispensing events nor patients.
    known_biases: >-
      Only sales that pharmacies are obliged to record in the SNGPC appear: controlled substances and
      antimicrobials, and from 2026-01-02 GLP-1 agonists (dictionary section 3.4); the patient fields apply to
      antimicrobials only (section 3.6); late submissions edit past months (section 3.8.2).
    gotchas:
    - 'Published months: 2014-01 to 2021-10 and 2026-01 on; 2021-11 to 2025-12 were never published (ANVISA''s dictionary, §3.7).'
    - 'The 2014-2017 headers misspell NO_CONSELHO_PRESCRITOR as NO_CONSEITOR: read through its alias.'
    - 'No municipality code: the name is matched to IBGE''s within the state where the folded name is the same; otherwise unplaced,
      the name kept.'
    - 'Late submissions edit past months (§3.8.2): a month is read again when its size or ETag changes.'
    - 'The server streams at about 0.8 MB/s per connection: a 2019-2021 build is hours of download.'
    - >-
        A row can stand for more than one sale of the same medicine when its other fields are identical
        (ANVISA's dictionary v1.0, 2020, section 5.2.1): rows are lines, so sum the quantity.
    - >-
        The file has no pharmacy, prescription or patient identifier; the patient fields (sex, age, ICD-10)
        apply to antimicrobials only.
    - >-
        TP_RECEITUARIO is written with a trailing period ('5.', '1.') in these files, in the three landed
        months read (2014-01, 2017-12, 2021-10) and in the raw files of 2014-01, 2021-10 and 2026-01; it is read as
        `int_code`, so '5.' is the code '5' with the value as filed in TP_RECEITUARIO__RAW, from the next landing of the
        months (OQ 90); NU_IDADE is written '67.' or '5.0'.
    citation: ANVISA, dados abertos do SNGPC (https://dados.anvisa.gov.br/dados/SNGPC/)
    dictionary: https://dados.anvisa.gov.br/dados/Dicionario_de_Dados_Painel_SNGPC_Venda_de_Industrializados.pdf (ANVISA; §3.7 the published period, §5 the fields and codes)
    origin:
      kind: files
      format: csv
      csv:
        sep: ;
        encoding: latin1
      pattern: https://dados.anvisa.gov.br/dados/SNGPC/Industrializados/EDA_Industrializados_{period}.csv
      months: 201401-202110,202601-202609
    columns:
      NU_ANO_VENDA:
        description: year of the sale
        type: integer
      NU_MES_VENDA:
        description: month of the sale
        type: integer
      SG_UF_VENDA:
        description: state (UF) of the pharmacy
        type: code
      NO_MUNICIPIO_VENDA:
        description: name of the pharmacy's municipality (no IBGE code in the file)
        type: label
      NO_CONSELHO_PRESCRITOR:
        description: the prescriber's professional council (CRM, CRO, CRMV, ...)
        type: code
        aliases:
        - NO_CONSEITOR
      SG_UF_CONSELHO_PRESCRITOR:
        description: state of the prescriber's council registration
        type: code
      TP_RECEITUARIO:
        description: type of prescription form (ANVISA's SNGPC dictionary, the sales panels' data dictionary)
        type: int_code      # filed '5.', '1.' in the industrialised files (OQ 90)
        codes: {"1": "Receita de Controle Especial em 2 vias (Receita Branca)", "2": "Notificação de Receita B (Notificação Azul)",
                "3": "Notificação de Receita Especial (Notificação Branca)", "4": "Notificação de Receita A (Notificação Amarela)",
                "5": "Receita Antimicrobiano e GLP-1 em 2 vias"}
      CO_CID10:
        description: the patient's ICD-10 code, entered by the pharmacist for antimicrobials (often blank)
        type: code
        codelist: ICD10
      SG_SEXO:
        description: the patient's sex (antimicrobials only; ANVISA's SNGPC dictionary)
        type: code
        codes: {"1": male, "2": female}
      NU_IDADE:
        description: the patient's age, in the unit NU_UNIDADE_IDADE gives (antimicrobials)
        type: number
      NU_UNIDADE_IDADE:
        description: the unit of NU_IDADE (antimicrobials only; ANVISA's SNGPC dictionary)
        type: code
        codes: {"1": years, "2": months}
      DS_PRINCIPIO_ATIVO:
        description: active principle(s) of the manufactured medicine
        type: label
      DS_DESCRICAO_APRESENTACAO:
        description: presentation of the medicine as registered
        type: label
      QT_VENDIDA:
        description: quantity sold, in DS_UNIDADE_MEDIDA
        type: number
      DS_UNIDADE_MEDIDA:
        description: unit of the quantity sold (CAIXA, FRASCO, ...)
        type: code
    place:
      column: NO_MUNICIPIO_VENDA
      uf: SG_UF_VENDA
      type: municipality_name
    period:
      type: parts
      year: NU_ANO_VENDA
      month: NU_MES_VENDA
      grain: month
      valid: 2014-2026
    fields:
      sngpc_industrialized_sales:
        label: "Industrialized medicines sold"
        measure:
          sum: QT_VENDIDA
        by:
        - DS_PRINCIPIO_ATIVO
        - DS_UNIDADE_MEDIDA
        unit: the unit of DS_UNIDADE_MEDIDA
        what: Quantity of each active principle sold, by municipality and month.
      sngpc_industrialized_sales_by_cid:
        label: "Industrialized medicines sold, by patient ICD-10"
        measure:
          sum: QT_VENDIDA
        by:
        - DS_PRINCIPIO_ATIVO
        - DS_UNIDADE_MEDIDA
        - CO_CID10
        unit: the unit of DS_UNIDADE_MEDIDA
        what: 'The same by the patient''s ICD-10 code as entered (antimicrobials). Rarely filled: 221,273 of 57,087,497 lines in
          2021 (0.39%); oral sulfadiazine 311 lines, 1 with B58; spiramycin 7,894 lines, none with B58.'
  sngpc_compounded:
    system: SNGPC
    series: MAN
    system_name:
      official_name: Sistema Nacional de Gerenciamento de Produtos Controlados
      translated_name: National system for the management of controlled products
      authority: ANVISA
      what_it_is: Retail-pharmacy sales of controlled medicines and antimicrobials, published monthly by ANVISA.
    official_name: Vendas de medicamentos manipulados
    translated_name: Vendas de medicamentos manipulados
    what: Compounded controlled medicines and antimicrobials sold by retail pharmacies.
    one_row: "one group of sales: an active substance of compounded medicines sold in one municipality and month with the same pharmacotechnical unit, prescriber council and prescription type"
    unit_of_analysis: sales group
    use: context
    why_no_event_type: >-
      Groups of sales of one active substance of compounded medicines, with no pharmacy, prescription or patient
      identifier: the quantity says how many pharmacotechnical units, and the compounded-medicines dictionary
      does not say whether a row is one sale. Medicine sold per municipality and month, not dispensing events
      nor patients.
    known_biases: >-
      Only sales that pharmacies are obliged to record in the SNGPC appear: controlled substances and
      antimicrobials; the patient fields apply to antimicrobials only; late submissions edit past months.
    gotchas:
    - 'Published months: 2014-01 to 2021-10 and 2026-01 on; 2021-11 to 2025-12 were never published (ANVISA''s dictionary, §3.7).'
    - 'The 2014-2017 headers misspell NO_CONSELHO_PRESCRITOR as NO_CONSEITOR: read through its alias.'
    - 'No municipality code: the name is matched to IBGE''s within the state where the folded name is the same; otherwise unplaced,
      the name kept.'
    - 'Late submissions edit past months (§3.8.2): a month is read again when its size or ETag changes.'
    - 'The server streams at about 0.8 MB/s per connection: a 2019-2021 build is hours of download.'
    - >-
        The file has no pharmacy, prescription or patient identifier; the patient fields (sex, age, ICD-10)
        apply to antimicrobials only, and the compounded-medicines dictionary does not say whether a row is
        one sale.
    citation: ANVISA, dados abertos do SNGPC (https://dados.anvisa.gov.br/dados/SNGPC/)
    dictionary: https://dados.anvisa.gov.br/dados/Dicionario_de_Dados_Painel_SNGPC_Venda_de_Manipulados.pdf (ANVISA; the same codes under the panel's names)
    origin:
      kind: files
      format: csv
      csv:
        sep: ;
        encoding: latin1
      pattern: https://dados.anvisa.gov.br/dados/SNGPC/Manipulados/EDA_Manipulados_{period}.csv
      months: 201401-202110,202601-202609
    columns:
      NU_ANO_VENDA:
        description: year of the sale
        type: integer
      NU_MES_VENDA:
        description: month of the sale
        type: integer
      SG_UF_VENDA:
        description: state (UF) of the pharmacy
        type: code
      NO_MUNICIPIO_VENDA:
        description: name of the pharmacy's municipality (no IBGE code in the file)
        type: label
      NO_CONSELHO_PRESCRITOR:
        description: the prescriber's professional council (CRM, CRO, CRMV, ...)
        type: code
        aliases:
        - NO_CONSEITOR
      SG_UF_CONSELHO_PRESCRITOR:
        description: state of the prescriber's council registration
        type: code
      TP_RECEITUARIO:
        description: type of prescription form (ANVISA's SNGPC dictionary, the sales panels' data dictionary)
        type: code
        codes: {"1": "Receita de Controle Especial em 2 vias (Receita Branca)", "2": "Notificação de Receita B (Notificação Azul)",
                "3": "Notificação de Receita Especial (Notificação Branca)", "4": "Notificação de Receita A (Notificação Amarela)",
                "5": "Receita Antimicrobiano e GLP-1 em 2 vias"}
      CO_CID10:
        description: the patient's ICD-10 code, entered by the pharmacist for antimicrobials (often blank)
        type: code
        codelist: ICD10
      SG_SEXO:
        description: the patient's sex (antimicrobials only; ANVISA's SNGPC dictionary)
        type: code
        codes: {"1": male, "2": female}
      NU_IDADE:
        description: the patient's age, in the unit NU_UNIDADE_IDADE gives (antimicrobials)
        type: number
      NU_UNIDADE_IDADE:
        description: the unit of NU_IDADE (antimicrobials only; ANVISA's SNGPC dictionary)
        type: code
        codes: {"1": years, "2": months}
      DS_DCB:
        description: the active principle's Denominação Comum Brasileira
        type: label
        label_from: NO_PRINCIPIO_ATIVO
      NO_PRINCIPIO_ATIVO:
        description: name of the active principle
        type: label
      QT_ATIVO_POR_UNID_FARMACOTEC:
        description: amount of active principle per pharmacotechnical unit
        type: number
      DS_UNIDADE_MEDIDA_PRINCIPIO_ATIVO:
        description: unit of that amount
        type: code
      QT_UNIDADE_FARMACOTECNICA:
        description: pharmacotechnical units sold
        type: number
      DS_TIPO_UNIDADE_FARMACOTECNICA:
        description: kind of pharmacotechnical unit (capsule, ...)
        type: code
    place:
      column: NO_MUNICIPIO_VENDA
      uf: SG_UF_VENDA
      type: municipality_name
    period:
      type: parts
      year: NU_ANO_VENDA
      month: NU_MES_VENDA
      grain: month
      valid: 2014-2026
    fields:
      sngpc_compounded_units:
        label: "Compounded medicine units sold"
        measure:
          sum: QT_UNIDADE_FARMACOTECNICA
        by:
        - NO_PRINCIPIO_ATIVO
        - DS_TIPO_UNIDADE_FARMACOTECNICA
        unit: pharmacotechnical units
        what: Compounded units of each active principle sold, by municipality and month.

  s2id:
    system: S2ID
    series: EVENTOS
    system_name:
      official_name: Sistema Integrado de Informações sobre Desastres (S2iD)
      translated_name: Integrated Disaster Information System (S2iD)
      authority: Ministério da Integração e do Desenvolvimento Regional / SEDEC
      what_it_is: The federal register of disasters that municipalities and states report to obtain recognition and federal aid (the data behind the Atlas Digital de Desastres).
    official_name: Danos informados
    translated_name: Reported damages
    what: >
      Disasters recorded in S2iD since 1991 (MIDR/SEDEC, CC-BY): one row per municipal event, with its IBGE municipality, its
      date, the COBRADE code with its typology and group, the status (registered or federally recognised), and the human,
      material, environmental and economic damages as reported.
    one_row: one disaster event reported by one municipality
    unit_of_analysis: municipal event
    use: context
    why_no_event_type: >-
      Disasters are events, but not health events: a row is a municipal disaster report with the damage as the
      municipality counts it, which conditions health outcomes (it is not one). The same people are in every
      event that affects them: 'other affected' sums to 295,022,756 over the 76,190 events, more than Brazil's
      population.
    known_biases: >-
      A disaster enters S2iD when a municipality reports it to obtain recognition and federal aid, so reporting
      capacity and incentives shape the series as much as the hazards do; the damages are the municipality's own
      counts.
    gotchas:
      - S2iD types an event by its trigger, not its consequence - the great landslide disasters are registered as intense rain (Petrópolis 2022, São Sebastião 2023) or flash floods (the Serrana region 2011), not as mass movement.
      - The damage columns are counts as reported by the municipality; a value that is no number is kept in its __RAW column and counted in `unparsed`.
      - MIDR's firewall rejects a path ending in lowercase .csv; the portal's bare /download route passes.
      - >-
          The human damage columns are counts per event, not additive across events as persons: DH_OUTROS
          AFETADOS sums to 295,022,756 over the 76,190 events of 1991-2025, more than Brazil's population.
    citation: MIDR/SEDEC, S2iD, Danos Informados 1991-2025 (dadosabertos.mdr.gov.br, dataset s2id_sedec, CC-BY)
    dictionary: https://dadosabertos.mdr.gov.br/dataset/1aabd419-5677-4fa2-a0e3-a1a3e1a42234 (resources Dicionário de dados and COBRADE)
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: mixed, multiline: true}
      files: [{key: events, extension: csv, url: "https://dadosabertos.mdr.gov.br/dataset/1aabd419-5677-4fa2-a0e3-a1a3e1a42234/resource/1c8aac93-f874-4f07-9405-86a0398dadd6/download"}]
    columns:
      Protocolo_S2iD: {description: "the event's protocol (state, type, municipality, COBRADE code and date)", type: code}
      Cod_IBGE_Mun: {description: IBGE code of the municipality (7 digits), type: municipality}
      Data_Evento: {description: date of the event (dd/mm/yyyy), type: date, format: "%d/%m/%Y"}
      Cod_Cobrade: {description: COBRADE code of the disaster, type: code}
      descricao_tipologia: {description: typology of the disaster, type: label}
      grupo_de_desastre: {description: "group of the disaster (climatological, hydrological, meteorological, ...)", type: label}
      Status: {description: registered (Registro) or federally recognised (Reconhecido), type: code}
      DH_MORTOS: {description: people killed, type: integer}
      DH_FERIDOS: {description: people injured, type: integer}
      DH_ENFERMOS: {description: people sick, type: integer}
      DH_DESABRIGADOS: {description: people left homeless, type: integer}
      DH_DESALOJADOS: {description: people displaced, type: integer}
      DH_DESAPARECIDOS: {description: people missing, type: integer}
      DH_AFETADOS_SECA_ESTIAGEM: {description: people affected by drought, type: integer}
      DH_OUTROS AFETADOS: {description: other people affected, type: integer}
    place: {column: Cod_IBGE_Mun, type: municipality}
    period: {type: date, column: Data_Evento, grain: year}
    fields:
      disasters:
        label: "Disaster events (S2iD)"
        rows:
          protocol: PROTOCOLO_S2ID
          municipality7: COD_IBGE_MUN
          municipality: _MUNICIPALITY
          event_date: DATA_EVENTO
          cobrade: COD_COBRADE
          typology: DESCRICAO_TIPOLOGIA
          group: GRUPO_DE_DESASTRE
          status: STATUS
          deaths: DH_MORTOS
          injured: DH_FERIDOS
          sick: DH_ENFERMOS
          homeless: DH_DESABRIGADOS
          displaced: DH_DESALOJADOS
          missing: DH_DESAPARECIDOS
          affected_by_drought: DH_AFETADOS_SECA_ESTIAGEM
          other_affected: DH_OUTROS AFETADOS
        unit: events; people (human-damage counts as reported)
        what: >
          Events recorded in S2iD since 1991 (MIDR/SEDEC, the data behind Atlas Digital de Desastres): IBGE municipality, event
          date, COBRADE code, typology and group (climatological, hydrological, meteorological, other), status (registered or
          federally recognised), and deaths, injured, sick, homeless, displaced, missing and affected as reported.
        years: 1991-2025
        declares:
          # The ICD-10 external causes that record a person harmed by events of these typologies, by the ICD-10 titles:
          # X30 exposure to excessive natural heat, X31 to excessive natural cold, X36 victim of avalanche, landslide and
          # other earth movements, X37 of cataclysmic storm, X38 of flood; X00-X09 exposure to smoke, fire and flames (every
          # fire: a forest fire is one of its causes, not the only one). A death or admission coded here is the person-level
          # trace of a registered event; PegaSUS reads the correspondence to ask whether an excess of those codes was also a
          # registered disaster (corroboration). S2iD types an event by its trigger: the great landslide disasters are
          # registered as rain, not as mass movement (Petrópolis 2022, Recife and Jaboatão 2022, São Sebastião 2023:
          # Chuvas Intensas; Petrópolis, Nova Friburgo, Teresópolis 2011: Enxurradas; Rio 2010: Movimento de Massa;
          # checked 2026-10-07), so X36 takes the triggers too.
          icd10:
            X00-X09: [Incêndio Florestal]
            X30: [Onda de Calor e Baixa Umidade]
            X31: [Onda de Frio]
            X36: [Movimento de Massa, Rompimento/Colapso de barragens, Erosão, Chuvas Intensas, Enxurradas]
            X37: [Vendavais e Ciclones, Tornado, Granizo, Chuvas Intensas]
            X38: [Inundações, Enxurradas, Alagamentos, Chuvas Intensas]
          # the columns that count people harmed by an event (the rest count people affected): 2% of events report a death,
          # and the great disasters report tens to hundreds (Recife 2022 43, Petrópolis 2022 242, Nova Friburgo 2011 420)
          harm: [deaths, injured, sick, missing]

  ans:
    system: ANS
    series: ICB
    system_name:
      official_name: Agência Nacional de Saúde Suplementar (ANS), dados abertos
      translated_name: National Agency for Supplementary Health (ANS), open data
      authority: ANS
      what_it_is: The regulator's open data on private health plans and their beneficiaries.
    official_name: Informações consolidadas de beneficiários
    translated_name: Consolidated information on beneficiaries
    what: >
      ANS's consolidated beneficiaries (PDA-024): per month and state, every plan's active, joined and cancelled beneficiaries
      by the beneficiary's municipality, sex and age band, with the plan's coverage (medical-hospital or dental only).
    one_row: the beneficiary links of one operator's plan in one municipality, sex and age band, in one month
    unit_of_analysis: plan x municipality x sex x age band
    use: denominator
    why_no_event_type: >-
      Beneficiary links (vínculos) of private plans per operator's plan, municipality, sex and age band: not
      persons (someone with two plans counts twice) and not events. It is the covered population that
      sus_dependent.py subtracts from the resident population.
    known_biases: >-
      A beneficiary is a link to a plan, not a person: someone with two plans counts twice, so the counts
      overstate the people covered (the bias has one sign; its size is not measured). Beneficiaries with no
      state (XX) or municipality (-1) cannot be placed.
    gotchas:
      - A beneficiary here is a plan LINK (vínculo), not a person - someone with two plans counts twice.
      - The state file XX holds the beneficiaries with no state; its municipality code is -1 and it is unallocated, not a place.
      - Within a state, a code ending in 0000 (270000) is the state's "ignored municipality", unallocated too.
      - Only the December file of each year is read (the year-end position the SUS-dependent population is built on).
    citation: ANS PDA-024, informacoes_consolidadas_de_beneficiarios, December of the year (dadosabertos.ans.gov.br)
    dictionary: https://dadosabertos.ans.gov.br/FTP/PDA/informacoes_consolidadas_de_beneficiarios-024/
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: utf8}
      pattern: https://dadosabertos.ans.gov.br/FTP/PDA/informacoes_consolidadas_de_beneficiarios-024/{period}/pda-024-icb-{uf}-{year}_{month}.zip
      months: 202112,202212,202312,202412,202512
      across:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO, XX]
    columns:
      ID_CMPT_MOVEL: {description: the month of the position (yyyy-mm), type: code}
      SG_UF: {description: state of the beneficiary (XX when none), type: code}
      CD_MUNICIPIO: {description: IBGE code of the beneficiary's municipality (6 digits; -1 when none), type: municipality}
      TP_SEXO: {description: "sex of the beneficiary (F, M)", type: code}
      DE_FAIXA_ETARIA: {description: age band of the beneficiary, type: label}
      COBERTURA_ASSIST_PLAN: {description: coverage of the plan (Médico-hospitalar or Odontológico), type: code}
      QT_BENEFICIARIO_ATIVO: {description: active beneficiary links, type: integer}
      QT_BENEFICIARIO_ADERIDO: {description: links joined in the month, type: integer}
      QT_BENEFICIARIO_CANCELADO: {description: links cancelled in the month, type: integer}
    place: {column: CD_MUNICIPIO, type: municipality}
    period: {type: file}
    fields:
      ans_beneficiaries:
        label: "Private health-plan beneficiaries"
        measure: {sum: QT_BENEFICIARIO_ATIVO}
        by: [{TP_SEXO: sex}, {DE_FAIXA_ETARIA: age_band}, {COBERTURA_ASSIST_PLAN: coverage}, {SG_UF: file_uf}]
        over: population
        unit: active beneficiary links (vínculos), not persons
        what: >
          ANS's consolidated beneficiaries (informacoes_consolidadas_de_beneficiarios), the December file of each year: active
          beneficiaries by municipality of residence, sex, age band and plan coverage (Médico-hospitalar or Odontológico).
          Someone with two plans counts twice.
        years: 2021-2025
        declares:
          # its rows are strata: read as one value per place, the medical-hospital plans (a dental plan is another link)
          where: {coverage: Médico-hospitalar}
          verified: {year: 2022, month: 12, medical_hospital: 50530569, equals: "ANS TabNet tabnet_02 Assistência Médica, 28 of 28 UF files", measured: 2026-10-04}

  ans_beneficiaries_municipal:
    system: ANS
    series: BB
    official_name: Beneficiários por município (ANS TabNet, base tb_bb)
    translated_name: Beneficiaries of private health plans by municipality (ANS TabNet)
    what: >
      ANS's beneficiaries by municipality (the TabNet base behind "Beneficiários por Município"), the quarter-end stock of
      private-plan beneficiaries from March 2000 to now: one row per month, state, municipality, sex, age band, contract type,
      segmentation and plan period, with the count of beneficiaries of medical-hospital plans, of dental-only plans and their total.
    one_row: the beneficiaries of one cell (month, municipality, sex, age band, contract type, segmentation, plan period)
    unit_of_analysis: month x municipality x sex x age band x contract type x segmentation x plan period
    use: denominator
    why_no_event_type: >-
      A stock of private-plan beneficiary links at the end of a quarter, by the cell's strata: not persons (someone with two plans
      counts twice) and not events. It is the covered population that sus_dependent.py subtracts from the resident population.
    known_biases: >-
      The municipality is the beneficiary's residence as the operator registered it in the SIB, so a small place can hold more
      beneficiaries than residents. A beneficiary is a link to a plan, not a person. Beneficiaries in a non-municipal code or in the
      age code 99 (inconsistent) cannot be placed in a place or band. The columns T (total), M (medical-hospital) and O (dental only)
      relate as T = M + O.
    gotchas:
      - "NR_BENEF_M is the beneficiaries of plans with medical-hospital care (with or without dental); NR_BENEF_O only of dental-only plans; NR_BENEF_T = M + O. Read M for the population a plan insures against hospital care."
      - "One row is a stratum cell, not a person: sum the counts, never count the rows."
      - "CD_FAIXA_E is finer than the TabNet bands: two codes make one five-year band from 15-19 to 55-59 (04+05 = 15-19, 06+07 = 20-24 ... 20+21 = 55-59), 26+27 are 80 and over (CNV cd_idade_faixa5, the Caderno do Gestor's grouping). The RN 63 bands (cd_idade_rn63: 19-23 = 05+06, 24-28 = 07+08 ...) are consistent with it, so the first code of a pair is its band's younger years and the second its last year."
      - "Only the quarter-end months (03, 06, 09, 12) are published as a position; a quarter's file is the stock on that month's last day."
    citation: ANS TabNet, Beneficiários por município (tb_bb), Microdados dados_dbc (dadosabertos.ans.gov.br)
    dictionary: https://dadosabertos.ans.gov.br/FTP/Base_de_dados/Microdados/arquivos_auxiliares_de_tab_def_e_cnv/arquivos_auxiliares_de_tabulacao.zip (DEF/tabnet_02.def and the CNV files it names)
    origin:
      kind: files
      format: dbc
      pattern: https://dadosabertos.ans.gov.br/FTP/Base_de_dados/Microdados/dados_dbc/beneficiarios/municipios/tb_bb_{year}-{month}.dbc
      months: 200003,200006,200009,200012,200103,200106,200109,200112,200203,200206,200209,200212,200303,200306,200309,200312,200403,200406,200409,200412,200503,200506,200509,200512,200603,200606,200609,200612,200703,200706,200709,200712,200803,200806,200809,200812,200903,200906,200909,200912,201003,201006,201009,201012,201103,201106,201109,201112,201203,201206,201209,201212,201303,201306,201309,201312,201403,201406,201409,201412,201503,201506,201509,201512,201603,201606,201609,201612,201703,201706,201709,201712,201803,201806,201809,201812,201903,201906,201909,201912,202003,202006,202009,202012,202103,202106,202109,202112,202203,202206,202209,202212,202303,202306,202309,202312,202403,202406,202409,202412,202503,202506,202509,202512,202603,202606,202609
    columns:
      ID_CMPT: {description: the quarter-end month of the position (YYYYMM), type: code}
      SEXO: {description: "sex of the beneficiary (CNV tp_sexo; the CNV reads N as female)", type: code, codes: {"M": Masculino, "F": Feminino, "N": "Feminino (CNV tp_sexo groups N with F)"}}
      TP_VIGENCI: {description: "period of the plan's contract (CNV tp_vigencia_plano)", type: code, codes: {"A": "Anterior à Lei 9.656/98", "P": "Posterior à Lei 9.656/98"}}
      SG_UF: {description: state of the beneficiary's municipality, type: code}
      CD_MUNICIP: {description: "IBGE code of the beneficiary's municipality as the operator registered it (6 digits)", type: municipality}
      CD_CAPITAL: {description: "code of the capital when the municipality is one (000000 when not)", type: code}
      CD_RM: {description: code of the metropolitan region (0000 when none), type: code}
      CD_CONTR: {description: "type of contract (CNV cd_tp_contratacao3)", type: code, codes: {"1": "Individual ou Familiar", "2": "Coletivo Empresarial", "3": "Coletivo por adesão", "4": "Coletivo não identificado", "0": "Não Informado"}}
      CD_SEGMENT: {description: "segmentation of the plan (CNV cd_segmentacao_plano)", type: code, codes: {"05": "Referência", "13": "Hosp. c/ Obstetrícia + Ambulatorial + Odonto", "06": "Hosp. c/ Obstetrícia + Ambulatorial", "10": "Hosp. c/ Obstetrícia + Odonto", "02": "Hosp. c/ Obstetrícia", "12": "Hosp. c/s Obstetrícia + Ambulatorial", "15": "Hosp. c/s Obstetrícia + Odonto", "09": "Hosp. c/s Obstetrícia", "14": "Hosp. s/ Obstetrícia + Ambulatorial + Odonto", "07": "Hosp. s/ Obstetrícia + Ambulatorial", "11": "Hosp. s/ Obstetrícia + Odonto", "03": "Hosp. s/ Obstetrícia", "08": "Ambulatorial + Odonto", "01": "Ambulatorial", "04": "Odontológico", "99": "Informado incorretamente", "00": "Não Informado"}}
      CD_FAIXA_E: {description: "age band of the beneficiary (CNV cd_idade_faixa5: each code is read as the TabNet band that groups it)", type: code, codes: {"00": "Até 1 ano", "01": "1 a 4 anos", "02": "5 a 9 anos", "03": "10 a 14 anos", "04": "15 a 19 anos", "05": "15 a 19 anos", "06": "20 a 24 anos", "07": "20 a 24 anos", "08": "25 a 29 anos", "09": "25 a 29 anos", "10": "30 a 34 anos", "11": "30 a 34 anos", "12": "35 a 39 anos", "13": "35 a 39 anos", "14": "40 a 44 anos", "15": "40 a 44 anos", "16": "45 a 49 anos", "17": "45 a 49 anos", "18": "50 a 54 anos", "19": "50 a 54 anos", "20": "55 a 59 anos", "21": "55 a 59 anos", "22": "60 a 64 anos", "23": "65 a 69 anos", "24": "70 a 74 anos", "25": "75 a 79 anos", "26": "80 anos ou mais", "27": "80 anos ou mais", "99": "Inconsistente"}}
      NR_BENEF_T: {description: "beneficiaries of the cell, medical-hospital and dental-only together (T = M + O)", type: integer}
      NR_BENEF_M: {description: "beneficiaries of plans with medical-hospital care (with or without dental)", type: integer}
      NR_BENEF_O: {description: beneficiaries of dental-only plans, type: integer}
    place: {column: CD_MUNICIP, type: municipality}
    period: {type: month, column: ID_CMPT, grain: month, valid: 2000-2026}
    fields:
      ans_beneficiaries_quarterly:
        label: "Medical-hospital plan beneficiaries by quarter"
        measure: {sum: NR_BENEF_M}
        by: [{SEXO: sex}, {CD_FAIXA_E: age_band}, {CD_CONTR: contract}, {CD_SEGMENT: segmentation}, {TP_VIGENCI: plan_period}]
        over: population
        unit: beneficiary links of medical-hospital plans at the quarter's end, not persons
        what: >
          ANS's beneficiaries of plans with medical-hospital care (with or without dental) by municipality of registered residence, sex,
          age band, contract type, segmentation and plan period, at the end of each quarter from 2000 (TabNet tb_bb, NR_BENEF_M).
          Someone with two plans counts twice.
        years: 2000-2026
        declares: {law: stock}      # a quarter-end position: a year is its December, never the sum of its quarters
      ans_dental_beneficiaries_quarterly:
        label: "Dental-only plan beneficiaries by quarter"
        measure: {sum: NR_BENEF_O}
