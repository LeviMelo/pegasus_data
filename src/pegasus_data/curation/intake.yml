# Intake of the sources that are not on the DATASUS FTP (ADR-0162): each entry is read by pegasus_data/intake.py, which does
# everything else (fetch, stream, reduce, serve as `curation/fields.yml` fields). The format:
#
#   what / citation     one sentence, and the string every row of the field carries as `source`
#   one_row, unit_of_analysis, known_biases, gotchas, use, why_no_event_type
#                       the dataset's description, the keys of curation/datasets/*.yml (what one row is, what misleads, and what the
#                       dataset is for: `use` is context | denominator | support | reference | not_an_event_source, with the evidence
#                       for having no event type, ADR-0195)
#   origin              the one route used: kind api (DEMAS: base, endpoint, paging {rows: the answer's list key, size, style})
#                       or files (Portal de Dados Abertos: files [{url, key?, extension?, year?}] or pattern + years/months, and
#                       `across: {name: [values]}` for further axes of the pattern, one file per combination (ANS: one per state);
#                       format csv|parquet, csv {sep, encoding (latin1|utf8|mixed|a codec), member: the CSV of a zip that holds more
#                       than one, `{year}` allowed, multiline: true when a quoted field holds line breaks, so the records are counted
#                       by a second parser and not by lines}); `keep: true` keeps the raw file (default: reduced, then deleted).
#                       `months` files the units by month, and each is the publication of its month: a query for one month opens
#                       that month's part file. `years` and listed files are filed by year, whatever month column their records
#                       hold (`period` below dates the records, never the publication)
#   origin.on_request   `true` for a source too large to land whole (SI-PNI's doses, 200 GiB zipped): `pegasus-data fields`
#                       with no names leaves its fields out, and a build of it must name its years. A pattern may name the
#                       month as `{month}` (01-12) or `{month_pt}` (jan, fev, ..., dez: the Portal's spelling)
#   origin.static       (api) `true` when the table cannot grow (a closed series, a code list): a piece that ended short of its
#                       size is then final. Left out, such a piece is *incomplete* and read again on every run, because the
#                       endpoint may have grown (the safe default: the cost is a request). Toggling it changes every unit's
#                       fingerprint (`origin` is in it), so the next run reads the source once more.
#   cache_empty         (api, read by filter) `true` when an empty answer is final. Left out, an empty slice is returned and
#                       not kept, because an empty answer may be transient (a gateway under load, a period not yet reported).
#                       No source sets either flag today: SIES grows monthly, and BNAFAR's current month answers empty until
#                       its first report, so one source-wide flag would freeze that month as empty.
#   compare             the other route, only to count its rows against the used one (the independent figure)
#   columns             the columns used, as the source's own dictionary names them: `role` (the dictionary's words), `type`
#                       (roles.yml's vocabulary: municipality, code, label, date, number...; `int_code` reads a code filed as a
#                       float's text, '5.0' or '6.0000000000', as '5', the value as filed kept in <NAME>__RAW), `codes` (its code
#                       list, raw value -> meaning, when the dictionary gives one), `codelist` (a table the package ships, ICD10
#                       or CBO2002, when the dictionary names a standard instead of listing codes), `key` (the columns whose concatenated values are the code's lookup key, when the code means something only with them: TISS's item with its TUSS table, ADR-0088), `label_from` (a sibling column
#                       of the same record that names the code, ADR-0090), `decimal` for a number written with a comma,
#                       `derived` (the curated recipe of a column made from this one, as variables/*.yml writes it)
#   place               the key a context is served by: {column, type: municipality (IBGE code, 6 or 7 digits, as given) |
#                       municipality_name (+ uf: the state column; exact fold match against IBGE's names) | code, as: name}
#   period              {type: date (+ format, take) | month (YYYYMM) | year | parts (year, month columns) | file (the file's own
#                       year), grain: year|month, valid: the years kept}
#   fields              each a measure over the rows: `count` or `{sum: column}` (never a mean), `where` {column: [raw values]},
#                       `by` [columns kept as extra keys; `{COLUMN: name}` names the key], `unit`, `what`; or `unpivot` {as: [k1, k2],
#                       columns: {COLUMN: [v1, v2]}} for a source that files its strata as columns (one row per column, labels
#                       QUOTED: YAML reads 0_3 as the number 3); or `rows` {name: lake column} for a register read as events (one row
#                       per record, nothing summed). `declares` is what the field says about itself to its readers (fields.yml's own
#                       keys: `where`, the rows that make it one value per place; `icd10`, `harm`; `verified`). A field with an
#                       `outcome` {column: values | {above/below: x}} beside its `where` is a share: it counts the population's
#                       records that have the outcome, over a field of its own, `<name>_assessed` (the `where`; its label is the
#                       outcome's `population_label`), and has a row (0 where none had it) wherever the population has one. Every field states the period's `grain` and, when it
#                       counts or sums, `law: sum` (ADR-0192): a year is the sum of its months, a share's numerator and denominator alike
#   one_row, unit_of_analysis, known_biases, gotchas   the dataset's description (`info`, `facts`): what a row is, what it
#                       counts, what the source silently leaves out, and the mistakes made with it first
#   verified            the check made: {rows, against, measured}
#   fields.<name>.label  the field's short name in a list (sentence case, about six words), unique among all declared fields:
#                       `unlabelled_fields` and `shared_labels` (pegasus_data.fields) list the failures
#
# What the reduction leaves out is counted, never silent: unplaced (no municipality given), unallocated (given, but not an
# IBGE municipality of the universe), undated, out of range; and a value that its declared type (date, number, integer, year) does
# not read is null in the typed column, kept in `__RAW`, and counted per column in `unparsed`.

dictionaries:
  sisagua:
    NO_REGIAO:
      description: Macrorregião do Brasil do município de coleta.
      aliases:
      - Região Geográfica
    SG_UF:
      description: Sigla da UF do município de coleta.
      aliases:
      - UF
    NO_REGIONAL:
      description: Regional de saúde do município, mantida pelos gestores do SISAGUA em cada UF (free text, not IBGE's).
      aliases:
      - Regional de Saúde
    NO_MUNICIPIO:
      description: Nome do município onde se fez a coleta. A water system serving several municipalities appears in each; an SAC
        is always in one.
      aliases:
      - Município
    CO_MUNICIPIO_IBGE:
      description: 'Código IBGE do município, 6 dígitos, as given. The Distrito Federal is split into its Regiões Administrativas
        with codes 530001-5300xx made up in the same format (Brasília itself is 530010): they are not IBGE municipalities.'
      aliases:
      - Código IBGE
      type: municipality
    TP_ABRANGENCIA:
      description: 'Abrangência da instituição responsável pelo SAA ou SAC: Local (um município) ou Regional (mais de um).'
      aliases:
      - Tipo da Instituição
    TP_EMPRESA:
      description: Tipo da instituição responsável (control, other parameters; values such as Empresa Estadual). The dictionary describes
        it as the institution type.
    SG_INSTITUICAO:
      description: Sigla da instituição responsável pelo SAA ou SAC.
      aliases:
      - Sigla da Instituição
    NO_INSTITUICAO:
      description: Nome da instituição responsável pelo SAA ou SAC.
      aliases:
      - Nome da Instituição
    NU_CNPJ_INSTITUICAO:
      description: CNPJ da instituição (da sede, se Regional). Stored as the source writes it (often with a trailing .0).
      aliases:
      - CNPJ da Instituição
    NO_ESCRITORIO_REGIONAL_LOCAL:
      description: Escritório regional ou local da instituição; empty for Local institutions.
      aliases:
      - Nome do escritório regional/local
    NU_CNPJ_ESCRITORIO_REGIONAL_LOCAL:
      description: CNPJ do escritório; empty for Local institutions.
      aliases:
      - CNPJ do escritório regional/local
    TP_ABASTECIMENTO:
      description: 'Tipo da forma de abastecimento: SAA sistema de abastecimento de água, SAC solução alternativa coletiva, SAI solução
        alternativa individual (the control has SAA and SAC only).'
      aliases:
      - Tipo da Forma de Abastecimento
    NU_SOLUCAO_ABASTECIMENTO:
      description: Código da forma de abastecimento, gerado pelo SISAGUA no cadastro (S + 6-digit municipality + sequence).
      aliases:
      - Código Forma de abastecimento
    NO_SOLUCAO_ABASTECIMENTO:
      description: Nome da forma de abastecimento.
      aliases:
      - Nome da Forma de Abastecimento
    NO_ETA:
      description: Estação ou unidade de tratamento onde se coletou; empty when the sample was taken elsewhere.
      aliases:
      - Nome da ETA/UTA
      - Nome da ETA / UTA
    TP_FILTRACAO:
      description: 1 sem filtração, 2 filtração lenta, 3 filtração rápida, 4 filtração em membranas (control dictionary).
      aliases:
      - Tipo de Filtração
    NU_ANO:
      description: Ano de coleta (control and surveillance) das amostras.
      aliases:
      - Ano
      - Ano de referência
      type: integer
    NU_MES:
      description: Mês de coleta.
      aliases:
      - Mês
      - Mês de referência
      type: integer
    DT_COLETA:
      description: Data em que foi realizada a coleta da amostra.
      aliases:
      - Data da Coleta
      - Data da coleta
      - DT_COLETA_AMOSTRA
      type: date
      take: 10
      formats:
      - '%Y/%m/%d'
      - '%d/%m/%Y'
    HR_COLETA:
      description: Horário da coleta.
      aliases:
      - Hora da Coleta
      - Hora da coleta
    DT_LAUDO:
      description: Data de emissão do laudo pelo laboratório.
      aliases:
      - Data do Laudo
      type: date
      take: 10
      formats:
      - '%Y/%m/%d'
      - '%d/%m/%Y'
    DT_INCLUSAO_REGISTRO:
      description: Data de registro no SISAGUA (saved by the system).
      aliases:
      - Data de Registro no SISAGUA
      - Data de registro
      type: date
      take: 10
      formats:
      - '%Y/%m/%d'
      - '%d/%m/%Y'
    DT_FORMULARIO_CADASTRO:
      description: Data em que o responsável preencheu o relatório mensal (control).
      aliases:
      - Data de preenchimento do relatório mensal
      type: date
      take: 10
      formats:
      - '%Y/%m/%d'
      - '%d/%m/%Y'
    DT_ANALISE:
      description: Data em que a amostra foi analisada.
      aliases:
      - Data da análise
      - DT-ANALISE
      type: date
      take: 10
      formats:
      - '%Y/%m/%d'
      - '%d/%m/%Y'
    NU_AMOSTRA:
      description: 'Número de identificação da amostra: from GAL when the municipality uses it, otherwise typed by the water-quality
        surveillance officer. Not unique across municipalities.'
      aliases:
      - Número da amostra
    TP_MOTIVO_COLETA:
      description: 'Motivo da coleta: Rotina, Denúncia, Desastre ou Surto. Surto and Desastre samples follow an event, so they are
        not routine surveillance.'
      aliases:
      - Motivo da coleta
    TP_PROCEDENCIA_COLETA:
      description: 'Parte da forma de abastecimento da coleta: ponto de captação, estação de tratamento de água, sistema de distribuição,
        intra-domiciliar/intrapredial, solução alternativa.'
      aliases:
      - Procedência da Coleta
    TP_PONTO_COLETA:
      description: 'Ponto de coleta (surveillance: torneira, cavalete/hidrômetro, reservatório, chafariz, bebedouro, ...) or, in
        the monthly control from 2015, the point of monitoring (pós-filtração, saída do tratamento, sistema de distribuição,
        ponto de consumo, ...).'
      aliases:
      - Ponto de Coleta
      - Ponto de Monitoramento
    PT_MONITORAMENTO:
      description: 'Ponto de monitoramento do controle: sistema de distribuição (reservatórios, rede do SAA) ou ponto de consumo
        (chafariz, torneira pública de uma SAC).'
    DS_LOCAL:
      description: Descrição (texto livre) do local da coleta.
      aliases:
      - Descrição do Local
    TP_ZONA:
      description: Rural ou Urbana.
      aliases:
      - Zona
    NO_CATEGORIA_AREA:
      description: Bairro, sede de distrito, povoado, aldeia indígena, comunidade quilombola, ribeirinha, ... (the dictionary lists
        ten).
      aliases:
      - Categoria Área
      - Categoria da área
    NO_AREA:
      description: Nome da área da coleta.
      aliases:
      - Área
    TP_LOCAL:
      description: Tipo do local da coleta (estabelecimento de ensino
      aliases:
      - Tipo do local
      - Tipo do Local
    NO_LOCAL:
      description: Nome do local da coleta.
      aliases:
      - Local
    NO_ENDERECO:
      description: Endereço da coleta (control
      aliases:
      - Endereço
    NU_LATITUDE:
      description: Latitude do ponto de coleta.
      aliases:
      - Latitude
      - LATITUDE
      type: number
      decimal: ','
    NU_LONGITUDE:
      description: Longitude do ponto de coleta.
      aliases:
      - Longitude
      - LONGIDADE
      type: number
      decimal: ','
    TP_CAPTACAO:
      description: Tipo de captação (superficial / subterrâneo) when the sample has a capture point.
      aliases:
      - Tipo de captação
    NO_CATEGORIA_MANANCIAL:
      description: Categoria do manancial superficial.
      aliases:
      - Categoria do manancial superficial
    NO_MANANCIAL:
      description: Nome do manancial superficial.
      aliases:
      - Nome do manancial superficial
    TP_CATEGORIA_CAPT_SUB:
      description: Categoria do ponto de captação subterrânea.
      aliases:
      - Categoria do ponto de captação subterrânea
    NO_PONTO_CAPTACAO:
      description: Nome do ponto de captação subterrânea.
      aliases:
      - Nome do ponto de captação subterrânea
    GRUPO_PARAMETROS:
      description: 'Grupo do parâmetro: agrotóxicos, organolépticos, produtos secundários de desinfecção, radioatividade, substâncias
        inorgânicas, orgânicas (other parameters); cianobactérias, cianotoxinas.'
      aliases:
      - Grupo de parâmetros
      - Grupo
    PARAMETRO:
      description: Parâmetro de qualidade da água, with its unit in the name for the basic ones (Turbidez (uT), Cloro Residual Livre
        (mg/L), Cor (uH), Fluoreto (mg/L), pH, Coliformes totais, Escherichia coli, Bactérias Heterotróficas (UFC/mL)); in
        the other-parameters table the name carries the limit (VMP). Spelling differs between tables (Cloro residual livre
        / Cloro Residual Livre).
      aliases:
      - Parâmetro
      - Parâmetro (ciano)
      - Parâmetro (demais parâmetros)
    CAMPO:
      description: 'Tipo do monitoramento do controle mensal: número de amostras analisadas, percentil 95, número de dados acima/abaixo
        de um limite (the limits are the control''s bins), número de amostras com presença/ausência de coliformes.'
      aliases:
      - Campo
    ANALISE_REALIZADA:
      description: EM_CAMPO or EM_LABORATORIO (surveillance basic parameters, from 2023).
    UNIDADE:
      description: Unidade de medida do parâmetro (control
    LD:
      description: 'Limite de detecção do método: a menor concentração que pode ser detectada, não necessariamente quantificada (filled
        from 2023).'
      type: number
      decimal: ','
    LQ:
      description: 'Limite de quantificação: a menor concentração determinável com precisão e exatidão aceitáveis (filled from 2023).'
      type: number
      decimal: ','
    RESULTADO:
      description: 'Resultado da análise: a quantified value (decimal comma), MENOR_LD or MENOR_LQ (below the detection / quantification
        limit), PRESENTE/AUSENTE for coliforms; in the outside-the-standard list, the result of the sample the supplier listed.'
      aliases:
      - Resultado
      type: result
      tokens:
        MENOR_LD: below_ld
        MENOR_LQ: below_lq
        PRESENTE: present
        PRESENÇA: present
        AUSENTE: absent
        AUSÊNCIA: absent
        NAO_REALIZADA: not_done
        NÃO_REALIZADA: not_done
    VALOR:
      description: 'Valor do controle mensal para o par parâmetro x campo: a count of analyses or of results above/below a limit,
        a percentile or a mean, as CAMPO says.'
      aliases:
      - Valor
      type: result
      tokens:
        MENOR_LD: below_ld
        MENOR_LQ: below_lq
        PRESENTE: present
        PRESENÇA: present
        AUSENTE: absent
        AUSÊNCIA: absent
        NAO_REALIZADA: not_done
        NÃO_REALIZADA: not_done
    PROVIDENCIA:
      description: Providência da vigilância (free text), filled until 2022.
      aliases:
      - Providência
    PROVIDENCIA_CONTROLE:
      description: Ação do prestador ao identificar amostras que não atendem ao padrão (control, outside the standard).
      aliases:
      - Providência do controle

    FILTRACAO:
      description: 'Existência de filtração na forma de abastecimento (cadastro população abastecida): Sim ou Não (dictionary,
        dicionario_cadastro_populacao_abastecida.odt).'
      aliases:
      - Filtração
    DESINFECCAO:
      description: 'Existência de desinfecção na forma de abastecimento (cadastro população abastecida): Sim ou Não.'
      aliases:
      - Desinfecção
    CAPTACAO_SUPERFICIAL:
      description: Existência de ponto(s) de captação em manancial superficial na forma de abastecimento (Sim / Não).
      aliases:
      - Captação superficial
    CAPTACAO_SUBTERRANEA:
      description: Existência de ponto(s) de captação de água subterrânea na forma de abastecimento (Sim / Não).
      aliases:
      - Captação subterrânea
    CAPTACAO_AGUA_CHUVA:
      description: Existência de captação de água de chuva (Sim / Não); SAC only.
      aliases:
      - Captação de água de chuva
    CARRO_PIPA:
      description: Carro-pipa como tipo de suprimento de água (Sim / Não); SAC only (cadastro população abastecida).
      aliases:
      - Carro Pipa
    CISTERNA:
      description: Cisterna como tipo de suprimento e reservação (Sim / Não); not filled for SAA.
      aliases:
      - Cisterna
    NU_VALOR_POPULACAO_ESTIMADA:
      description: 'População estimada abastecida pela forma de abastecimento no município e ano. A SAC or SAI whose population also
        receives SAA water is counted in both (POP_RECEBE_AGUA_SAA), so the supply forms of a municipality do not add up to
        its population.'
      aliases:
      - População estimada
      type: number
    NU_VALOR_RURAL:
      description: População rural abastecida (estimada) pela forma de abastecimento.
      type: number
    NU_VALOR_URBANA:
      description: População urbana abastecida (estimada) pela forma de abastecimento.
      type: number
    POP_RECEBE_AGUA_SAA:
      description: A população da SAC ou SAI também recebe água de SAA (S / N).
    NU_PESSOAS_ABASTECIDAS:
      description: Número estimado de pessoas abastecidas pelo carro-pipa no município (cadastro carro-pipa população).
      aliases:
      - Nº estimado de pessoas abastecidas
      type: number
    DT_TRANSPORTE_INICIO:
      description: Data de início da autorização do transporte de água pelo carro-pipa.
      type: date
      take: 10
      format: '%Y/%m/%d'
    DT_TRANSPORTE_FIM:
      description: Data de fim da autorização do transporte de água pelo carro-pipa.
      type: date
      take: 10
      format: '%Y/%m/%d'
    DS_TIPO_FINALIDADE:
      description: 'Finalidade do carro-pipa: Operação carro-pipa (the federal programme), prestador de serviço, particular, saúde
        indígena, outro.'
    SG_EMPRESA:
      description: Sigla da instituição responsável pelo SAA ou SAC (cadastro população abastecida; SG_INSTITUICAO in the other files). Empty for SAI.
    NO_EMPRESA:
      description: Nome da instituição responsável pelo SAA ou SAC (cadastro população abastecida; NO_INSTITUICAO in the other files). Empty for SAI.
    NU_CNPJ:
      description: CNPJ da instituição responsável pelo SAA ou SAC; da sede se Regional (cadastro população abastecida). Empty for SAI.
    NO_EMPRESA_1:
      description: Nome do escritório regional ou local da instituição (cadastro população abastecida); empty for Local institutions and for SAI.
    NU_CNPJ_1:
      description: CNPJ do escritório regional ou local da instituição (cadastro população abastecida); empty for Local institutions and for SAI.
    CHAFARIZ:
      description: Chafariz como tipo de suprimento de água (Sim / Não); SAC only (cadastro população abastecida, dictionary dicionario_cadastro_populacao_abastecida.odt).
    FONTE:
      description: Fonte como tipo de suprimento de água (Sim / Não); SAC only (cadastro população abastecida).
    CANALIZAÇÃO:
      description: Existência de canalização para distribuição da água até as residências (Sim / Não); SAC only (cadastro população abastecida). The header keeps its accent.
    CAIXA_DAGUA:
      description: Caixa d'água como tipo de suprimento de água (Sim / Não), whether the SAI has one; SAI only (cadastro população abastecida).
    SEM_RESERVACAO:
      description: Ausência de reservatório de água na residência (Sim / Não); SIM means there is no storage; SAI only (cadastro população abastecida).
    OUTRO_TIPO_SUPRIMENTO:
      description: Descrição (free text) de outro tipo de suprimento de água não tabulado pelo SISAGUA; empty for SAA (cadastro população abastecida).
    NU_ECONOMIA_DOMICILIO_PERMAN:
      description: Número de economias residenciais destinadas ao uso como domicílio permanente (moradia), as opposed to occasional use; not the same as active economies (cadastro população abastecida).
      type: number
    NU_ECONOMIAS_DOMICILIOS_NAO_PE:
      description: Número de economias residenciais de uso ocasional, such as holiday homes (cadastro população abastecida). The header is truncated by the source.
      type: number
    POP_RECEBE_AGUA_SAA_SAC:
      description: A população abastecida pela SAI também recebe água de SAA ou SAC (S / N); SAI only (cadastro população abastecida).
    NU_CNPJ_NO_INSTITUICAO:
      description: CNPJ da instituição responsável pelo carro-pipa; da sede se Regional. Only for a legal-person responsible (cadastro carro-pipa população, dicionario_cadastro_carro_pipa_populacao.odt).
    NU_CNPJ_NO_ESCRITORIO_REGIONAL_LOCAL:
      description: CNPJ do escritório regional ou local da instituição responsável pelo carro-pipa; empty for Local institutions (cadastro carro-pipa população).
    NU_CARRO_PIPA:
      description: Código de identificação do carro-pipa, generated by SISAGUA when the truck is registered (cadastro carro-pipa população).
    NU_PLACA:
      description: Número da placa do carro-pipa (cadastro carro-pipa população). A vehicle identifier, kept as filed.
    DT_CRIACAO:
      description: Data de criação do carro-pipa no cadastro (cadastro carro-pipa população).
    DT_PREENCHIMENTO_FORMULARIO:
      description: Data de preenchimento das informações de cadastro pelo responsável pelo carro-pipa (cadastro carro-pipa população).
    NU_AUTORIZACAO:
      description: Número da autorização para abastecimento de água para consumo humano pelo carro-pipa (cadastro carro-pipa população).
    NO_RESPONSAVEL_CADASTRO:
      description: Responsável pelas informações relacionadas ao carro-pipa (cadastro carro-pipa população). A person's or company's name as filed.
    TP_PESSOA:
      description: Tipo de responsável pelo abastecimento pelo carro-pipa - Pessoa Física ou Pessoa Jurídica (cadastro carro-pipa população).
    NO_RESPONSAVEL_CADASTRO_CARRO_PIPA:
      description: Nome da pessoa física responsável pelo carro-pipa; filled only when the responsible is a natural person (cadastro carro-pipa população). Personal name.

sources:

  catmat:
    what: "The open CATMAT catalogue (Compras.gov.br, modulo-material): the drugs (PDM) of class 6505 and their items and supply units."
    origin:
      kind: api
      base: https://dadosabertos.compras.gov.br/modulo-material
      paging: {style: page, page_param: pagina, size_param: tamanhoPagina, size: 500, rows: resultado, pages_key: totalPaginas}
    columns: {}

  bnafar:
    what: >
      BNAFAR/Hórus medicine stock (DEMAS daf/estoque-medicamentos-bnafar-horus): each lot's CURRENT stock position at an
      establishment (one row per establishment x product x lot, dated by its last report), read by filter (CATMAT code, month,
      state, programme), never in bulk.
    citation: DEMAS /daf/estoque-medicamentos-bnafar-horus (BNAFAR/Hórus, DAF/SECTICS)
    system: BNAFAR
    series: STOCK
    system_name:
      official_name: Base Nacional de Dados de Ações e Serviços da Assistência Farmacêutica (BNAFAR / Hórus)
      translated_name: National Pharmaceutical Care Database (BNAFAR / Hórus)
      authority: Ministério da Saúde / DAF / SECTICS
      what_it_is: >
        The stock of medicines that establishments report to the Ministry's pharmaceutical-care systems (Hórus and the
        state systems that feed BNAFAR).
    official_name: Posição de estoque de medicamentos
    translated_name: Medicine stock position
    snapshot: true
    one_row: one lot of one product at one establishment, at its last stock report
    unit_of_analysis: lot position
    use: context
    why_no_event_type: >-
      Stock positions of a lot at an establishment on its last report (11,220 rows read, quantities 0 to
      225,760): a stock of medicines, not events; the endpoint serves the current position only.
    known_biases: >-
      A position, not a history: each read is the current stock of every lot at the establishments that reported
      it, so a place with no rows has not reported, which is not the same as no stock.
    gotchas:
      - The endpoint serves each lot's CURRENT position, not a history; every read is kept here with its read day (_READ_ON), so a history accrues from the first read.
      - A municipality code ending in 0000 is the state's "ignored municipality", not a place.
      - Offset paging of the live table is unstable (pages overlap and differ between reads), so a filter is split by state until it fits one page.
      - >-
          The endpoint serves codigo_cnes as a number: 396 of 11,220 rows read have fewer than the 7
          characters of a CNES code (leading zeros lost), which curation/roles/BNAFAR-STOCK.yml declares as
          width 7.
    place: {column: codigo_municipio, type: municipality}
    period: {type: date, column: data_posicao_estoque}
    origin:
      kind: api
      endpoint: /daf/estoque-medicamentos-bnafar-horus
      paging: {short_page_is_end: true}
      # The table is read without an ORDER BY while it changes: offset pages overlap and differ between reads, so a filter is
      # split by state (and by municipality where a state is still a full page) until each slice fits in one page.
      partition: [{param: codigo_uf, values: uf_code}, {param: codigo_municipio, values: municipality, within: codigo_uf}]
    columns:
      codigo_uf: {description: state of the establishment, type: code}
      uf: {description: state abbreviation, type: label}
      codigo_municipio: {description: municipality of the establishment, type: municipality}
      municipio: {description: municipality name, type: label}
      codigo_cnes: {description: establishment, type: facility}
      data_posicao_estoque: {description: date of the lot's last stock report, type: date}
      codigo_catmat: {description: "CATMAT item with its supply unit (BR + item + unit, taken whole by the filter)", type: code}
      descricao_produto: {description: product description, type: label}
      quantidade_estoque: {description: quantity in stock, type: number}
      numero_lote: {description: lot, type: code}
      data_validade: {description: expiry, type: date, take: 10}
      # tipo_produto: TP_PRODUTO of the dictionary "Posição de Estoque" (ckan.saude.gov.br/bnafar/estoque/Dicionario_de_dados_Posicao_estoque.pdf, same dataset, same 15 attributes in
      # the same order, same description "Sigla do Tipo do produto em estoque"): B Componente Básico (Anexos I e IV da RENAME), E Componente Especializado (Anexo III),
      # S Componente Estratégico (Anexos II e IV), O produtos financiados somente com recursos próprios do ente.
      tipo_produto: {description: product type, type: code, codes: {"B": "Componente Básico da Assistência Farmacêutica (Anexos I e IV da RENAME)", "E": "Componente Especializado da Assistência Farmacêutica (Anexo III da RENAME)", "S": "Componente Estratégico da Assistência Farmacêutica (Anexos II e IV da RENAME)", "O": "Financiado somente com recursos próprios do ente"}}
      sigla_programa_saude: {description: health programme (NI = not informed), type: code}
      sigla_sistema_origem: {description: system the report came from, type: code}

  yellow_fever_humans:
    system: FA
    series: HUM
    system_name:
      official_name: Monitoramento da Febre Amarela
      translated_name: Yellow Fever Monitoring
      authority: Ministério da Saúde / SVSA
      what_it_is: >
        The Ministry's monitoring series of yellow fever in humans and in non-human primates (epizootics), by monitoring
        period (July to June, the seasonal year of transmission), published as two open files.
    official_name: Febre Amarela em humanos
    translated_name: Yellow fever in humans
    what: >
      Confirmed yellow-fever cases in humans, 1994-2026, one row per case, placed at the probable place of infection (LPI)
      and dated by the onset of symptoms.
    one_row: one confirmed human case of yellow fever, at its probable place of infection
    unit_of_analysis: case
    known_biases: >
      The Ministry publishes the cases it has confirmed, after investigation, so the file is not the notified cases (6,525 were
      notified in the 2017/2018 season, 1,261 confirmed and 1,301 still under investigation on 8 May 2018), and a recent season is
      incomplete until its investigations close. The figures move with reclassification: the Ministry warns that confirmed cases
      can fall as well as rise between its publications. The file is the Ministry's monitoring series from 1994, not a census:
      the seasons of 2012/2013 and 2013/2014 hold two cases each, and the outbreak of 2016/2017 and 2017/2018 holds 2,154 of the
      2,911.
    gotchas:
      - "The municipality is the probable place of infection, not of residence or notification."
      - "The year and month are those of the onset of symptoms; the monitoring period runs July to June."
      - "The file ends with an empty row (ID blank in 1 of 2,912 rows: the event type's `present` drops it), and a few cases carry no municipality code (counted as unplaced)."
      - "The cases are the confirmed ones. The file has no classification column, and its seasons equal the Ministry's confirmed totals, not its notified ones (2016/2017 has 778 cases and 262 deaths where the PAHO/WHO update of 13 December 2017 gives 779 and 262; 2017/2018 has 1,376 cases and 483 deaths where the Ministry's informe of 8 May 2018 had 1,261 confirmed and 409 deaths among 6,525 notified). An earlier version of this entry called them suspected and confirmed."
      - "OBITO is SIM, NÃO or IGN (the evolution to death of the case); 32 of the 1,069 SIM rows carry no DT_OBITO."
      - "DT_IS is not a date in 17 rows: blank in 6, the word Assintomático in 9 (no onset: an asymptomatic case) and a date with day 00 in 2 (00/04/2000); they are null in DT_IS and kept in DT_IS__RAW, the case still has its ANO_IS and MES_IS."
      - "IDADE is in years with a decimal comma for infants (0,9; 0,5; 0,016666667); the dictionary gives no unit."
    citation: Portal de Dados Abertos do SUS, fa_casoshumanos_1994-2026.csv (SVSA/MS); DEMAS /arboviroses/febre-amarela-humanos-primatas-nao-humanos holds one copy of the first case more
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Febre+Amarela/Dicionario+de+variaveis.pdf
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: latin1}
      files: [{url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Febre+Amarela/fa_casoshumanos_1994-2026.csv"}]
    compare:
      kind: api
      endpoint: /arboviroses/febre-amarela-humanos-primatas-nao-humanos
      paging: {rows: febre_amarela_humanos_primatas}
    columns:
      ID: {description: sequential unique identifier, type: integer}
      MACRORREG_LPI: {description: abbreviation of the macro-region of the probable place of infection, type: code}
      COD_UF_LPI: {description: IBGE code of the state of the probable place of infection, type: code}
      UF_LPI: {description: abbreviation of the state of the probable place of infection, type: code}
      COD_MUN_LPI: {description: IBGE code of the municipality of the probable place of infection, type: municipality}
      MUN_LPI: {description: name of the municipality of the probable place of infection, type: label}
      SEXO: {description: sex of the individual, type: code, codes: {"M": Masculino, "F": Feminino}}
      IDADE: {description: age of the individual, type: number, decimal: ","}
      DT_IS: {description: date of the onset of symptoms (dd/mm/yyyy), type: date, format: "%d/%m/%Y"}
      SE_IS: {description: epidemiological week of the onset of symptoms, type: integer}
      MES_IS: {description: month of the onset of symptoms, type: integer}
      ANO_IS: {description: year of the onset of symptoms, type: integer}
      MONITORAMENTO_IS: {description: monitoring period of the onset of symptoms (July to June), type: code}
      OBITO: {description: evolution to death, type: code, codes: {"SIM": died, "NÃO": did not die, "IGN": ignored}}
      DT_OBITO: {description: date of death (dd/mm/yyyy), type: date, format: "%d/%m/%Y"}
    place: {column: COD_MUN_LPI, type: municipality}
    period: {type: parts, year: ANO_IS, month: MES_IS, grain: month, valid: 1994-2026}
    fields:
      yellow_fever_human_cases:
        label: "Yellow-fever human cases"
        measure: count
        unit: cases
        what: Yellow-fever human cases by municipality of the probable place of infection and month of onset.
      yellow_fever_human_deaths:
        label: "Yellow-fever human deaths"
        measure: count
        where: {OBITO: [SIM]}
        unit: deaths
        what: Of those, the cases that evolved to death.

  yellow_fever_epizootics:
    system: FA
    series: EPIZ
    official_name: Epizootias de febre amarela em primatas não humanos
    translated_name: Yellow-fever epizootics in non-human primates
    what: >
      Epizootics in non-human primates attributed to yellow fever, 1999-2026, one row per occurrence, placed where it occurred
      and dated by the year and month of occurrence (the day is mostly empty).
    one_row: one epizootic occurrence in non-human primates, at the municipality where it occurred
    unit_of_analysis: occurrence
    known_biases: >
      An epizootic enters the Ministry's monitoring when someone finds and reports dead or sick primates, so the series follows
      where people look and notify as much as where the virus circulates. The Ministry reports several classes of epizootic
      (7,410 notified in the 2017/2018 season by 8 May 2018: 738 confirmed, 2,225 under investigation, 2,544 indeterminate, 1,903
      discarded), and this file has no classification column: it holds 867 rows for that season. It is read as the confirmed
      epizootics by size, which the file itself does not state.
    gotchas:
      - "The date of the occurrence (DATA_OCOR) and the week are blank in 22 of 2,637 rows and the month in 13 (an earlier version of this entry said they were mostly empty); the year and month are the period."
      - "Which epizootics the file holds is unsettled. Its 2017/2018 season (867) lies between the Ministry's 738 confirmed on 8 May 2018 and its 7,410 notified; its 2016/2017 season (425) is below the 474 confirmed on 10 May 2017 (COES informe 40/2017), which the Ministry's warning that confirmed numbers fall on reclassification allows but does not show."
      - "An epizootic is an event of animals: no person, no sex or age (the event type has `persons: false`). The animals involved (5,352 in the 474 confirmed epizootics of 10 May 2017) are not in the file."
      - "UF_OCOR writes one row in lower case (pr)."
    citation: Portal de Dados Abertos do SUS, fa_epizpnh_1994-2026.csv (SVSA/MS); DEMAS /arboviroses/febre-amarela-epzootias lacks the month of 13 rows
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Febre+Amarela/Dicionario+de+variaveis.pdf
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: latin1}
      files: [{url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Febre+Amarela/fa_epizpnh_1994-2026.csv"}]
    compare:
      kind: api
      endpoint: /arboviroses/febre-amarela-epzootias
      paging: {rows: febre_amarela_epzootias}
    columns:
      ID: {description: sequential unique identifier, type: integer}
      MACRORREG_OCOR: {description: abbreviation of the macro-region of the place of occurrence, type: code}
      COD_UF_OCOR: {description: IBGE code of the state of the place of occurrence, type: code}
      UF_OCOR: {description: abbreviation of the state of the place of occurrence, type: code}
      COD_MUN_OCOR: {description: IBGE code of the municipality of the place of occurrence, type: municipality}
      MUN_OCOR: {description: name of the municipality of the place of occurrence, type: label}
      DATA_OCOR: {description: date of the occurrence (dd/mm/yyyy), type: date, format: "%d/%m/%Y"}
      SE_OCOR: {description: epidemiological week of the occurrence, type: integer}
      MES_OCOR: {description: month of the occurrence, type: integer}
      ANO_OCOR: {description: year of the occurrence, type: integer}
      MONITORAMENTO_OCOR: {description: monitoring period of the occurrence (July to June), type: code}
    place: {column: COD_MUN_OCOR, type: municipality}
    period: {type: parts, year: ANO_OCOR, month: MES_OCOR, grain: month, valid: 1994-2026}
    fields:
      yellow_fever_epizootics:
        label: "Yellow-fever epizootics in non-human primates"
        measure: count
        unit: epizootics
        what: Epizootics in non-human primates by municipality of occurrence and month.

  srag:
    system: SRAG
    series: NOTIF
    system_name:
      official_name: Sistema de Informação da Vigilância Epidemiológica da Gripe (SIVEP-Gripe)
      translated_name: Influenza Epidemiological Surveillance Information System (SIVEP-Gripe)
      authority: Ministério da Saúde / SVSA
      what_it_is: >
        The Ministry's system for the notification of severe acute respiratory syndrome (SRAG), hospitalised or fatal: the
        official record of SRAG cases and deaths in Brazil, published as one open file per epidemiological year.
    official_name: Síndrome Respiratória Aguda Grave (SRAG) hospitalizada, fichas de registro individual
    translated_name: Severe acute respiratory syndrome (hospitalised), individual notification records
    what: >
      Severe acute respiratory syndrome (hospitalised or fatal) notified in SIVEP-Gripe, 2019-2026, one row per notification, 194
      columns as the Portal's yearly files.
    one_row: "one notification of severe acute respiratory syndrome (SRAG): a hospitalised patient or a death by SRAG, with the signs, risk factors, tests, care and outcome the form records"
    unit_of_analysis: notification
    known_biases: >
      The system records the severe end of respiratory illness (people admitted to hospital and deaths by SRAG), so a count is
      shaped by who is admitted and by which hospitals notify, not by every respiratory infection. Before the covid-19 pandemic
      the surveillance rested on sentinel units for influenza; from 2020 it was widened to covid-19 and the other respiratory
      viruses (the Portal's description of the dataset), so the 48,866 notifications of 2019 and the 1,193,597 of 2020 are not
      one series. The Ministry says the notifications are subject to typing and filling errors and are reviewed continuously by
      the local teams: the files of 2019-2024 are frozen, the current year is rewritten weekly. The files are anonymised (no
      name, CPF, CNS, address or notifying unit), so a patient notified twice cannot be found and the hospital is known only
      by NM_UN_INTE, its name.
    gotchas:
      - "A row is a notification, not a person; NU_NOTIFIC is the record number, unique but for 29 of 4,666,910 rows that are the same notification in two yearly files (INFLUD24 and INFLUD25) with a corrected onset date."
      - "A yearly file holds the notifications of its epidemiological year, and the lake partitions by the year of the first symptoms (DT_SIN_PRI), not by the file's year or by DT_NOTIFIC. The 2022 file holds 553,231 notifications dated 2022, 7,281 dated 2023 and 65 later; the 2021 file holds 5,556 onsets of 2022."
      - "Do not filter on HOSPITAL = 1. The system warns that a record whose answer is not 1 does not meet the case definition, and the files keep them; 4,615 of the 11,646 rows of 2022 that answer No died of SRAG."
      - "CLASSI_FIN has no code for a discarded case. It is blank while the case is open (4.97% of the 2022 file, more in the current year), and 4, SRAG não especificado, is the unspecified residue (43% of 2022)."
      - "The INFLUD19 and INFLUD20 files (onsets of 2019 and 2020) file CLASSI_FIN, EVOLUCAO, PCR_SARS2 and AN_SARS2 as float text ('5.0'), and RAIOX_RES is '6.0000000000' in every file. Landing reads them as '5' and '6' (type int_code, the value as filed in <NAME>__RAW); a lake landed before that still holds '5.0' and an exact match on '5' misses the covid-19 wave of 2020."
      - "CS_SEXO is M, F and I in the open files; the dictionary's 1, 2 and 9 are the DBF export's."
      - "A place comes as a pair, the name (ID_MUNICIP, ID_MN_RESI, ID_MN_INTE, ID_PAIS, ID_REGIONA) and the code (CO_MUN_NOT, CO_MUN_RES, CO_MU_INTE, CO_PAIS, CO_REGIONA); the dictionary calls them one field. The Distrito Federal's residences are its administrative regions (530040, 530180...), not IBGE municipalities: 13,247 rows of 2022 (2.4%), placed in Brasília."
      - "NU_IDADE_N is an age in the unit TP_IDADE (days, months, years), never years alone; the age stratum is IDADE_anos."
    citation: Portal de Dados Abertos do SUS, SRAG/YYYY/INFLUD*.parquet (SIVEP-Gripe, SVSA/MS)
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/dicionario-de-dados-2019-a-2025.pdf
    origin:
      kind: files
      format: parquet
      # the file names carry the date of the cut (23-03-2026 for the frozen years 2019-2024; 28-09-2026 for 2025 and 2026, which the Portal
      # republishes weekly under a new date: INFLUD25-19-10-2026 on 2026-10-19). A reading of another vintage names its file here.
      files:
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2019/INFLUD19-23-03-2026.parquet", year: 2019}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2020/INFLUD20-23-03-2026.parquet", year: 2020}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2021/INFLUD21-23-03-2026.parquet", year: 2021}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2022/INFLUD22-23-03-2026.parquet", year: 2022}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2023/INFLUD23-23-03-2026.parquet", year: 2023}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2024/INFLUD24-23-03-2026.parquet", year: 2024}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-28-09-2026.parquet", year: 2025}
        - {url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2026/INFLUD26-28-09-2026.parquet", year: 2026}
    columns:
      NU_NOTIFIC: {description: "Record number generated by the system; digit 1 is the form type (1 SG, 2 SRAG-UTI, 3 SRAG hospitalizado) (dictionary: Número do registro)"}
      DT_NOTIFIC: {description: "Date the notification form was filled (dictionary: Data do preenchimento da ficha de notificação)", type: date, take: 10, format: "%Y-%m-%d"}
      SEM_NOT: {description: "Epidemiological week of the notification form (dictionary: Semana Epidemiológica do preenchimento da ficha de notificação)"}
      DT_SIN_PRI: {description: "Date of the first symptoms (dictionary: Data de 1ºs sintomas)", type: date, take: 10, format: "%Y-%m-%d"}
      SEM_PRI: {description: "Epidemiological week of the first symptoms (dictionary: Semana Epidemiológica dos Primeiros Sintomas)"}
      SG_UF_NOT: {description: "State of the notifying unit (dictionary: UF (da unidade notificadora))"}
      ID_REGIONA: {description: "Name of the health region of the notifying municipality (the file gives the name here and the code in CO_REGIONA) (dictionary: Regional de Saúde de Notificação)"}
      CO_REGIONA: {description: "Code of the health region of the notifying municipality, as the system files it (the dictionary says IBGE code; values such as 1331 for GVE I CAPITAL are the system's own) (dictionary: Regional de Saúde de Notificação)"}
      ID_MUNICIP: {description: "Name of the notifying municipality (the file gives the name here and the IBGE code in CO_MUN_NOT) (dictionary: Município de notificação)"}
      CO_MUN_NOT: {description: "IBGE code (6 digits) of the municipality of the notifying unit (dictionary: Município de notificação, código (IBGE))"}
      CS_SEXO: {description: "Sex of the patient (dictionary: Sexo)", codes: {"M": "Masculino", "F": "Feminino", "I": "Ignorado"}}
      DT_NASC: {description: "Date of birth of the patient (dictionary: Data de nascimento)", type: date, take: 10, format: "%Y-%m-%d"}
      NU_IDADE_N: {description: "Age of the patient in the unit TP_IDADE; calculated by the system from the birth date and the first symptoms when the birth date is given (dictionary: Idade)", type: number, derived: [{name: IDADE_anos, from: [NU_IDADE_N, TP_IDADE], age: {form: unit_column, units: {'1': day, '2': month, '3': year}}, rule: "fractional years (ADR-0070); TP_IDADE 1 days, 2 months, 3 years, measured against DT_NASC and DT_SIN_PRI (SRAG 2022: 1.0 day, 30.2 days and 365-368 days a unit); a negative age is null. One converter, _age.years_column"}]}
      TP_IDADE: {description: "Unit of NU_IDADE_N (dictionary: Tipo da idade)", codes: {"1": "Dia", "2": "Mês", "3": "Ano"}}
      COD_IDADE: {description: "Age as the unit digit TP_IDADE followed by the age in three digits (dictionary: Código da idade)"}
      CS_GESTANT: {description: "Gestational age of the patient (dictionary: Gestante)", codes: {"1": "1º Trimestre", "2": "2º Trimestre", "3": "3º Trimestre", "4": "Idade Gestacional Ignorada", "5": "Não", "6": "Não se aplica", "9": "Ignorado"}}
      CS_RACA: {description: "Race or colour declared by the patient (dictionary: Raça/Cor)", codes: {"1": "Branca", "2": "Preta", "3": "Amarela", "4": "Parda", "5": "Indígena", "9": "Ignorado"}}
      CS_ETINIA: {description: "Ethnic group of an indigenous patient, by name (SIASI's table) (dictionary: Se indígena, qual etnia?)"}
      CS_ESCOL_N: {description: "Schooling of the patient (dictionary: Escolaridade)", codes: {"0": "Sem escolaridade/Analfabeto", "1": "Fundamental 1º ciclo (1ª a 5ª série)", "2": "Fundamental 2º ciclo (6ª a 9ª série)", "3": "Médio (1º ao 3º ano)", "4": "Superior", "5": "Não se aplica", "9": "Ignorado"}}
      ID_PAIS: {description: "Name of the country of residence (the file gives the name here and the code in CO_PAIS) (dictionary: País de residência)"}
      CO_PAIS: {description: "Code of the country of residence (dictionary: País (se residente fora do Brasil))"}
      SG_UF: {description: "State of residence of the patient (dictionary: UF de residência)"}
      ID_RG_RESI: {description: "Name of the health region of the municipality of residence (dictionary: Regional de Saúde de Residência)"}
      CO_RG_RESI: {description: "Code of the health region of the municipality of residence, as the system files it (dictionary: Regional de Saúde de Residência)"}
      ID_MN_RESI: {description: "Name of the municipality of residence (the file gives the name here and the IBGE code in CO_MUN_RES) (dictionary: Município de residência)"}
      CO_MUN_RES: {description: "IBGE code (6 digits) of the municipality of residence of the patient (dictionary: Município de residência, código (IBGE))"}
      CS_ZONA: {description: "Geographic zone of the address of residence (dictionary: Zona)", codes: {"1": "Urbana", "2": "Rural", "3": "Periurbana", "9": "Ignorado"}}
      NOSOCOMIAL: {description: "SRAG with infection acquired after admission (dictionary: Caso nosocomial (infecção adquirida no hospital)?)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
      AVE_SUINO: {description: "Contact with birds, swine or another animal (dictionary: Paciente trabalha ou tem contato direto com aves, suínos, ou outro animal?)", codes: {"1": "Sim, aves e/ou suínos", "2": "Não, nenhum", "3": "Sim, outros", "9": "Ignorado"}}
      OUT_ANIM: {description: "The other animal, free text (dictionary: Contato com outro animal (especificar))"}
      FEBRE: {description: "Fever (dictionary: Sinais e Sintomas/Febre)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
      TOSSE: {description: "Cough (dictionary: Sinais e Sintomas/Tosse)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
