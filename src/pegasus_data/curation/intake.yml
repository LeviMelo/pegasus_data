      SURTO_SG: {description: "The case is part of an outbreak chain of influenza-like illness (dictionary: Faz parte de uma cadeia de surto de SG?)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
      CO_DETEC: {description: "Co-detection: two viruses identified at the same time (dictionary: É um caso de co-detecção?)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
      VG_OMS: {description: "Variant named by the WHO designation (dictionary: Designação da variante (OMS))", codes: {"1": "Ômicron", "2": "Delta", "3": "Alfa", "4": "Beta", "5": "Gama", "6": "Recombinante (exemplos XE, XF, XQ, XS)", "7": "Outra, especifique"}}
      VG_OMSOUT: {description: "The other variant, free text (dictionary: Designação da variante (OMS): Outra, especifique)"}
      VG_LIN: {description: "Lineage from the genomic sequencing (dictionary: Linhagem da variante)"}
      VG_MET: {description: "Most recent laboratory method (dictionary: Método laboratorial mais recente)", codes: {"1": "Sequenciamento genômico completo", "2": "Sequenciamento genômico parcial", "3": "RT-PCR em tempo real de inferência", "4": "Outro, especifique"}}
      VG_METOUT: {description: "The other method, free text (dictionary: Método laboratorial mais recente: Outro, especifique)"}
      VG_DTRES: {description: "Date of the genomic result (dictionary: Data do resultado (vigilância genômica))", type: date, format: "%d/%m/%Y"}
      VG_ENC: {description: "Closure of the variant case under technical note NT 1.129/2021-CGPNI/DEIDT/SVS/MS (dictionary: Encerramento do caso (para VOC, VOI ou VUM))", codes: {"1": "Confirmado por Sequenciamento genômico completo", "2": "Provável por Sequenciamento genômico parcial", "3": "Sugestivo por RT-PCR de inferência", "4": "Sugestivo por vínculo epidemiológico", "5": "Descartado"}}
      VG_REINF: {description: "Possible covid-19 reinfection (earlier positive record 90 or more days before) (dictionary: Possível caso de reinfecção por covid-19?)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
      VG_CODEST: {description: "CNES code of the establishment that filled the genomic-surveillance block (dictionary: Código (CNES) do Estabelecimento responsável pelo preenchimento (vigilância genômica))"}
      REINF: {description: "Possible covid-19 reinfection (dictionary: Possível caso de reinfecção por covid-19?)"}
    place: {column: CO_MUN_RES, type: municipality}
    period: {type: date, column: DT_SIN_PRI, grain: month}
    fields:
      srag_cases:
        label: "SRAG notifications"
        measure: count
        unit: notifications
        what: SRAG notifications by municipality of residence and month of the first symptoms.
      srag_covid:
        label: "SRAG notifications classified covid-19"
        measure: count
        where: {CLASSI_FIN: ["5"]}
        unit: notifications
        what: Of those, the notifications classified SRAG by covid-19 (CLASSI_FIN 5).
      srag_deaths:
        label: "SRAG deaths"
        measure: count
        where: {EVOLUCAO: ["2"]}
        unit: notifications
        what: Of those, the notifications that evolved to death by SRAG (EVOLUCAO 2); a death by another cause (3) is not counted.
      srag_icu:
        label: "SRAG notifications admitted to ICU"
        measure: count
        where: {UTI: ["1"]}
        unit: notifications
        what: Of those, the notifications of patients admitted to an intensive care unit (UTI 1).

  sies:
    system: SIES
    series: DIST
    system_name:
      official_name: Sistema de Informação de Insumos Estratégicos
      translated_name: Strategic Supplies Information System
      authority: Ministério da Saúde / SVSA / PNI
      what_it_is: Requests and distributions of immunobiologicals and supplies from the national programme to the state health secretariats.
    official_name: Solicitações e distribuições de imunobiológicos e insumos
    translated_name: Immunobiological requests and distributions
    what: >
      Immunobiologicals and supplies requested by and distributed to each state health secretariat (SES) by month, 2018-2026:
      doses, by supply.
    one_row: one supply requested or distributed to one secretariat in one month (an aggregate)
    unit_of_analysis: secretariat x supply x month x kind
    use: context
    why_no_event_type: >-
      Quantities of immunobiologicals and supplies requested by or distributed to a state health secretariat in
      a month: a supply flow (secretariat x supply x month x kind), not care given.
    known_biases: >-
      These are the national programme's flows to the state secretariats: they say nothing of the doses applied
      to people, nor of the municipalities.
    gotchas:
      - The IBGE column holds one code per secretariat (27 distinct values for 27 secretariats), the secretariat's seat; the unit is the state secretariat, not the municipality, so the key here is the secretariat (TX_SIGLA).
      - ORIGEM says whether the quantity was requested (Solicitado) or distributed (Distribuido).
    citation: DEMAS /vacinacao/sistema-de-informacao-de-insumos-estrategicos (SIES, SVSA/PNI); equal to the Portal's sies_csv.zip
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SIES/dicionario-de-dados-do-sies-ok.pdf
    origin:
      kind: api
      endpoint: /vacinacao/sistema-de-informacao-de-insumos-estrategicos
      paging: {rows: sies}
    compare:
      kind: files
      format: csv
      csv: {sep: ";", encoding: latin1}
      files: [{url: "https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SIES/csv/sies_csv.zip"}]
    columns:
      TX_SIGLA: {description: state health secretariat (SES) and state that requested or received the supplies, type: code}
      IBGE: {description: IBGE code of the municipality of the secretariat, type: code}
      TX_INSUMO: {description: type of immunobiological or supply, type: label}
      ANO: {description: year requested and distributed, type: year}
      MES: {description: month requested and distributed, type: integer}
      QTDE: {description: quantity requested and distributed, type: number}
      ORIGEM: {description: request or distribution, type: code, codes: {Solicitado: requested, Distribuido: distributed}}
      TX_AREA: {description: "immunobiologicals and supplies (vaccines, sera, immunoglobulins, supplies)", type: label}
    place: {column: TX_SIGLA, type: code, as: ses, states: 'SES-'}   # a state's secretariat: SES- and its abbreviation
    period: {type: parts, year: ANO, month: MES, grain: month, valid: 2018-2026}
    fields:
      sies_distributed:
        label: "Supplies distributed to state secretariats"
        measure: {sum: QTDE}
        where: {ORIGEM: [Distribuido]}
        by: [TX_INSUMO]
        unit: doses and units
        what: Quantity of each supply distributed to the state secretariat, by month.
      sies_requested:
        label: "Supplies requested by state secretariats"
        measure: {sum: QTDE}
        where: {ORIGEM: [Solicitado]}
        by: [TX_INSUMO]
        unit: doses and units
        what: Quantity of each supply requested by the state secretariat, by month.

  health_regions:
    system: REGIAO
    series: MUNICIPIO
    system_name:
      official_name: Macrorregiões e regiões de saúde dos municípios
      translated_name: Health macro-regions and regions of the municipalities
      authority: Ministério da Saúde / DEMAS
      what_it_is: The Ministry's list of each municipality's health region and macro-region, with the IBGE population estimate it uses.
    official_name: Municípios com macrorregião e região de saúde
    translated_name: Municipalities with health macro-region and region
    what: Each municipality's health region and macro-region (codes and names) as the Ministry publishes them now, with IBGE's 2022 population estimate.
    one_row: one municipality
    unit_of_analysis: municipality
    use: reference
    why_no_event_type: >-
      A lookup: each municipality's health region and macro-region as the Ministry publishes them now, with no
      period.
    gotchas:
      - The table is a current state with no period; it is kept as read, stamped with the year of the read.
      - The municipality name carries its state ("AC - ACRELANDIA").
    citation: DEMAS /macrorregiao-e-regiao-de-saude/municipio (Ministério da Saúde)
    origin:
      kind: api
      endpoint: /macrorregiao-e-regiao-de-saude/municipio
      paging: {rows: macrorregiao_regiao_saude_municipios, short_page_is_end: true}
      # Unfiltered offset paging loses rows here (4,870 of 5,571 municipalities): each state is read whole.
      partition: [{param: sigla_uf, values: uf_sigla}]
    columns:
      codigo_regiao_pais: {description: code of the country region (1 Norte ... 5 Centro-Oeste), type: code}
      regiao_pais: {description: name of the country region, type: label}
      codigo_uf: {description: IBGE code of the state, type: code}
      uf: {description: name of the state, type: label}
      codigo_macrorregiao_saude: {description: code of the health macro-region, type: code}
      macrorregiao_saude: {description: name of the health macro-region, type: label}
      codigo_regiao_saude: {description: code of the health region, type: code}
      regiao_saude: {description: name of the health region, type: label}
      codigo_municipio: {description: IBGE code of the municipality (6 digits), type: municipality}
      municipio: {description: name of the municipality with its state, type: label}
      populacao_estimada_ibge_2022: {description: IBGE population estimate 2022, type: integer}
    place: {column: codigo_municipio, type: municipality}
    period: {type: file}

  sisagua_surveillance_basic:
    system: SISAGUA
    series: VIGB
    system_name:
      official_name: Sistema de Informação de Vigilância da Qualidade da Água para Consumo Humano
      translated_name: Drinking-water quality surveillance information system
      authority: Ministério da Saúde / SVSA
      what_it_is: The water-quality records of Brazil's drinking-water surveillance (by the health sector) and control (by the
        suppliers), published as open files on the Portal de Dados Abertos.
    official_name: Vigilância - parâmetros básicos
    translated_name: Vigilância - parâmetros básicos
    what: 'Vigilância: samples collected by the health sector (the municipal or state water-quality surveillance), one row per
      sample and parameter. Basic parameters: turbidity, free and combined chlorine, chlorine dioxide, pH, colour, fluoride,
      total coliforms, E. coli.'
    one_row: one analysis of one sample for one parameter
    unit_of_analysis: sample x parameter
    use: context
    why_no_event_type: >-
      Analyses of water samples by parameter, taken by the health sector's surveillance: they describe the water
      of a place and month (a sample analysed for several parameters is several rows), not events that happened
      to people.
    known_biases: >-
      Samples are taken where and when the surveillance chooses, so the share of failing samples is not the
      share of the population exposed; a month with no sample is missing, not clean water (Santa Maria, 2018:
      March and September unsampled, docs/evaluation/2026-10-14-sisagua.md).
    gotchas:
    - 'The files mix UTF-8 and Windows-1252, even within a line: read as `encoding: mixed`.'
    - 'The Distrito Federal is split into its Regiões Administrativas with made-up codes 530001-5300xx (Brasília 530010): not
      IBGE municipalities, so unallocated in the fields, kept in the records.'
    - 'Two header generations (the system''s NO_/CO_ names and the dictionary''s accented ones): read through `aliases`.'
    - 'Out-of-standard fields assess against Portaria GM/MS nº 888, de 4 de maio de 2021 (altera o Anexo XX da Portaria de Consolidação
      GM/MS nº 5/2017): only limits read from its text are declared.'
    citation: Portal de Dados Abertos do SUS, SISAGUA (https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/)
    dictionary: https://arquivosdadosabertos.saude.gov.br/dados/sisagua/dicionarios/ (archived at web.archive.org; copies in
      registries/sisagua/dictionaries)
    dictionary_columns: sisagua
    origin:
      kind: files
      format: csv
      csv:
        sep: ;
        encoding: mixed
      pattern: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/vigilancia_parametros_basicos_{year}_csv.zip
      years: 2014-2026
    place:
      column: CO_MUNICIPIO_IBGE
      type: municipality
    period:
      type: parts
      year: NU_ANO
      month: NU_MES
      grain: month
      valid: 2014-2026
    fields:
      sisagua_surveillance_analyses:
        label: "Water surveillance analyses"
        measure: count
        by:
        - PARAMETRO
        unit: analyses
        what: Surveillance analyses by parameter (a sample analysed for several parameters counts once for each).
      sisagua_surveillance_censored:
        label: "Water results below detection/quantification limit"
        measure: count
        by:
        - PARAMETRO
        where:
          RESULTADO__FLAG:
          - below_ld
          - below_lq
        unit: analyses
        what: Of those, results below the limit of detection or quantification (not zeros).
      sisagua_surveillance_result_sum:
        label: "Sum of quantified water results"
        measure:
          sum: RESULTADO
        by:
        - PARAMETRO
        where:
          RESULTADO__FLAG:
          - numeric
        unit: the parameter's unit
        what: Sum of the quantified results by parameter (with `sisagua_surveillance_quantified`, their mean).
      sisagua_surveillance_quantified:
        label: "Quantified water results (count)"
        measure: count
        by:
        - PARAMETRO
        where:
          RESULTADO__FLAG:
          - numeric
        unit: analyses
        what: Quantified results by parameter (the count the sum is over).
      sisagua_surveillance_outbreak_analyses:
        label: "Water analyses from outbreak samples"
        measure: count
        by:
        - PARAMETRO
        where:
          TP_MOTIVO_COLETA:
          - Surto
        unit: analyses
        what: Analyses of samples collected because of an outbreak (Surto).
      sisagua_surveillance_ecoli_present:
        label: "Water samples with E. coli"
        population_label: "Water samples assessed for E. coli"
        measure: count
        where:
          PARAMETRO:
          - Escherichia coli
          RESULTADO__FLAG:
          - present
          - absent
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          - SAI
        outcome:
          RESULTADO__FLAG:
          - present
        unit: analyses
        what: 'Samples with Escherichia coli present (Portaria GM/MS 888/2021, Anexo XX, Anexo 1 (ausência em 100 mL, SAI e
          SAA/SAC na saída do tratamento e na distribuição): absence required).'
      sisagua_surveillance_total_coliforms_present:
        label: "Water samples with total coliforms"
        population_label: "Water samples assessed for total coliforms"
        measure: count
        where:
          PARAMETRO:
          - Coliformes totais
          RESULTADO__FLAG:
          - present
          - absent
        outcome:
          RESULTADO__FLAG:
          - present
        unit: analyses
        what: 'Samples with total coliforms present (a fact, not a standard: the rule is by population and share of the month''s
          samples).'
      sisagua_surveillance_turbidity_above_5:
        label: "Turbidity analyses above 5 uT"
        population_label: "Turbidity analyses assessed (5 uT limit)"
        measure: count
        where:
          PARAMETRO:
          - Turbidez (uT)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            above: 5.0
        unit: analyses
        what: Turbidity above 5,0 uT (Portaria GM/MS 888/2021, Anexo XX, art. 28 §2º and Anexo 11 (VMP 5,0 uT in the distribution
          network, reservoirs and consumption points)). Results below a limit of detection or quantification, empty or unparsed
          are not assessed.
      sisagua_surveillance_chlorine_below_0_2:
        label: "Free chlorine analyses below 0.2 mg/L"
        population_label: "Free chlorine analyses assessed (0.2 mg/L minimum)"
        measure: count
        where:
          PARAMETRO:
          - Cloro residual livre (mg/L)
          - Cloro Residual Livre (mg/L)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            below: 0.2
        unit: analyses
        what: Free residual chlorine below 0,2 mg/L (Portaria GM/MS 888/2021, Anexo XX, art. 32 (minimum 0,2 mg/L in the network,
          reservoirs and consumption points) and Anexo 9 (VMP 5 mg/L)). Results below a limit of detection or quantification,
          empty or unparsed are not assessed.
      sisagua_surveillance_chlorine_above_5:
        label: "Free chlorine analyses above 5 mg/L"
        population_label: "Free chlorine analyses assessed (5 mg/L maximum)"
        measure: count
        where:
          PARAMETRO:
          - Cloro residual livre (mg/L)
          - Cloro Residual Livre (mg/L)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            above: 5.0
        unit: analyses
        what: Free residual chlorine above 5,0 mg/L (Portaria GM/MS 888/2021, Anexo XX, art. 32 (minimum 0,2 mg/L in the network,
          reservoirs and consumption points) and Anexo 9 (VMP 5 mg/L)). Results below a limit of detection or quantification,
          empty or unparsed are not assessed.
      sisagua_surveillance_fluoride_above_1_5:
        label: "Fluoride analyses above 1.5 mg/L"
        population_label: "Fluoride analyses assessed (1.5 mg/L limit)"
        measure: count
        where:
          PARAMETRO:
          - Fluoreto (mg/L)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          - SAI
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
          - ESTAÇÃO DE TRATAMENTO DE ÁGUA
        outcome:
          RESULTADO:
            above: 1.5
        unit: analyses
        what: Fluoride above 1,5 mg/L (Portaria GM/MS 888/2021, Anexo XX, Anexo 9 and art. 36 §1º (VMP 1,5 mg/L)). Results below
          a limit of detection or quantification, empty or unparsed are not assessed.
      sisagua_surveillance_colour_above_15:
        label: "Apparent colour analyses above 15 uH"
        population_label: "Apparent colour analyses assessed (15 uH limit)"
        measure: count
        where:
          PARAMETRO:
          - Cor Aparente (uH)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            above: 15.0
        unit: analyses
        what: Apparent colour above 15 uH (Portaria GM/MS 888/2021, Anexo XX, Anexo 11 (VMP 15 uH, organoleptic)). Results below
          a limit of detection or quantification, empty or unparsed are not assessed.
