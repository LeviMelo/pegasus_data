  sisagua_supply_population:
    system: SISAGUA
    system_name:
      official_name: Sistema de Informação de Vigilância da Qualidade da Água para Consumo Humano
      translated_name: Drinking-water quality surveillance information system
      authority: Ministério da Saúde / SVSA
      what_it_is: The water-quality records of Brazil's drinking-water surveillance (by the health sector) and control (by the
        suppliers), published as open files on the Portal de Dados Abertos.
    series: CADP
    official_name: Cadastro - população abastecida
    translated_name: Register - population supplied
    what: 'Cadastro: each supply form (SAA network system, SAC collective alternative, SAI individual alternative) registered
      in a municipality in a year, with the estimated population it supplies, its intake (surface, ground, rain) and whether
      it filters and disinfects (dicionario_cadastro_populacao_abastecida.odt).'
    one_row: one supply form in one municipality and year
    unit_of_analysis: supply form x municipality x year
    use: context
    why_no_event_type: >-
      A register of the water supplies of a place and year and the population each serves: it describes where people's
      water comes from and how it is treated, not events that happened to people.
    known_biases: >-
      Populations are the registrant's estimates; a SAC or SAI whose population also receives SAA water is counted in both,
      so the forms of a municipality overlap. Individual solutions (SAI) are registered unevenly between municipalities, so
      the SAI population measures the register as much as the wells. A year's register is updated during the following
      year (2026 is partial).
    gotchas:
    - 'The file is Windows-1252: read as `encoding: mixed`, as the other SISAGUA files.'
    - 'FILTRACAO and DESINFECCAO are Sim / Não; an empty value is not Não.'
    citation: Portal de Dados Abertos do SUS, SISAGUA (https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/)
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/dicionario_cadastro_populacao_abastecida.odt
    dictionary_columns: sisagua
    origin:
      kind: files
      format: csv
      csv:
        sep: ;
        encoding: mixed
      files:
      - url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/cadastro_populacao_abastecida_csv.zip
    place:
      column: CO_MUNICIPIO_IBGE
      type: municipality
    period: {type: year, column: NU_ANO, grain: year}
    fields:
      sisagua_supply_population:
        label: "Population supplied, by supply form (SISAGUA register)"
        measure:
          sum: NU_VALOR_POPULACAO_ESTIMADA
        by:
        - TP_ABASTECIMENTO
        unit: persons
        what: Estimated population supplied by each form of supply (SAA, SAC, SAI) registered in the municipality and year.
      sisagua_supply_population_filtered:
        label: "Population supplied with filtration (SISAGUA register)"
        measure:
          sum: NU_VALOR_POPULACAO_ESTIMADA
        by:
        - TP_ABASTECIMENTO
        where:
          FILTRACAO:
          - Sim
        unit: persons
        what: Estimated population supplied by forms that filter the water.
      sisagua_supply_population_surface:
        label: "Population supplied from surface intakes (SISAGUA register)"
        measure:
          sum: NU_VALOR_POPULACAO_ESTIMADA
        by:
        - TP_ABASTECIMENTO
        where:
          CAPTACAO_SUPERFICIAL:
          - Sim
        unit: persons
        what: Estimated population supplied by forms with at least one surface intake.
      sisagua_supply_population_surface_filtered:
        label: "Population supplied from surface intakes with filtration (SISAGUA register)"
        measure:
          sum: NU_VALOR_POPULACAO_ESTIMADA
        by:
        - TP_ABASTECIMENTO
        where:
          CAPTACAO_SUPERFICIAL:
          - Sim
          FILTRACAO:
          - Sim
        unit: persons
        what: Estimated population supplied by forms with a surface intake that filter the water.
      sisagua_supply_population_disinfected:
        label: "Population supplied with disinfection (SISAGUA register)"
        measure:
          sum: NU_VALOR_POPULACAO_ESTIMADA
        by:
        - TP_ABASTECIMENTO
        where:
          DESINFECCAO:
          - Sim
        unit: persons
        what: Estimated population supplied by forms that disinfect the water.
