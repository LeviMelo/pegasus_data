  sisagua_surveillance_basic:
    system: SISAGUA
    series: VIGB
    system_name:
      official_name: Sistema de Informação de Vigilância da Qualidade da Água para Consumo Humano
      translated_name: Drinking-water quality surveillance information system
      authority: Ministério da Saúde / SVSA
      what_it_is: The water-quality records of Brazil's drinking-water surveillance (by the health sector) and control (by the
        suppliers), published as open files on the Portal de Dados Abertos.
    official_name: Vigilância - parâmetros básicos
    translated_name: Vigilância - parâmetros básicos
    what: 'Vigilância: samples collected by the health sector (the municipal or state water-quality surveillance), one row per
      sample and parameter. Basic parameters: turbidity, free and combined chlorine, chlorine dioxide, pH, colour, fluoride,
      total coliforms, E. coli.'
    one_row: one analysis of one sample for one parameter
    unit_of_analysis: sample x parameter
    gotchas:
    - 'The files mix UTF-8 and Windows-1252, even within a line: read as `encoding: mixed`.'
    - 'The Distrito Federal is split into its Regiões Administrativas with made-up codes 530001-5300xx (Brasília 530010): not
      IBGE municipalities, so unallocated in the fields, kept in the records.'
    - 'Two header generations (the system''s NO_/CO_ names and the dictionary''s accented ones): read through `aliases`.'
    - 'Out-of-standard fields assess against Portaria GM/MS nº 888, de 4 de maio de 2021 (altera o Anexo XX da Portaria de Consolidação
      GM/MS nº 5/2017): only limits read from its text are declared.'
    citation: Portal de Dados Abertos do SUS, SISAGUA (https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/)
    dictionary: https://arquivosdadosabertos.saude.gov.br/dados/sisagua/dicionarios/ (archived at web.archive.org; copies in
      registries/sisagua/dictionaries)
    dictionary_columns: sisagua
    origin:
      kind: files
      format: csv
      csv:
        sep: ;
        encoding: mixed
      pattern: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SISAGUA/vigilancia_parametros_basicos_{year}_csv.zip
      years: 2014-2026
    place:
      column: CO_MUNICIPIO_IBGE
      type: municipality
    period:
      type: parts
      year: NU_ANO
      month: NU_MES
      grain: month
      valid: 2014-2026
    fields:
      sisagua_surveillance_analyses:
        measure: count
        by:
        - PARAMETRO
        unit: analyses
        what: Surveillance analyses by parameter (a sample analysed for several parameters counts once for each).
      sisagua_surveillance_censored:
        measure: count
        by:
        - PARAMETRO
        where:
          RESULTADO__FLAG:
          - below_ld
          - below_lq
        unit: analyses
        what: Of those, results below the limit of detection or quantification (not zeros).
      sisagua_surveillance_result_sum:
        measure:
          sum: RESULTADO
        by:
        - PARAMETRO
        where:
          RESULTADO__FLAG:
          - numeric
        unit: the parameter's unit
        what: Sum of the quantified results by parameter (with `sisagua_surveillance_quantified`, their mean).
      sisagua_surveillance_quantified:
        measure: count
        by:
        - PARAMETRO
        where:
          RESULTADO__FLAG:
          - numeric
        unit: analyses
        what: Quantified results by parameter (the count the sum is over).
      sisagua_surveillance_outbreak_analyses:
        measure: count
        by:
        - PARAMETRO
        where:
          TP_MOTIVO_COLETA:
          - Surto
        unit: analyses
        what: Analyses of samples collected because of an outbreak (Surto).
      sisagua_surveillance_ecoli_present:
        measure: count
        where:
          PARAMETRO:
          - Escherichia coli
          RESULTADO__FLAG:
          - present
          - absent
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          - SAI
        outcome:
          RESULTADO__FLAG:
          - present
        unit: analyses
        what: 'Samples with Escherichia coli present (Portaria GM/MS 888/2021, Anexo XX, Anexo 1 (ausência em 100 mL, SAI e
          SAA/SAC na saída do tratamento e na distribuição): absence required).'
      sisagua_surveillance_total_coliforms_present:
        measure: count
        where:
          PARAMETRO:
          - Coliformes totais
          RESULTADO__FLAG:
          - present
          - absent
        outcome:
          RESULTADO__FLAG:
          - present
        unit: analyses
        what: 'Samples with total coliforms present (a fact, not a standard: the rule is by population and share of the month''s
          samples).'
      sisagua_surveillance_turbidity_above_5:
        measure: count
        where:
          PARAMETRO:
          - Turbidez (uT)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            above: 5.0
        unit: analyses
        what: Turbidity above 5,0 uT (Portaria GM/MS 888/2021, Anexo XX, art. 28 §2º and Anexo 11 (VMP 5,0 uT in the distribution
          network, reservoirs and consumption points)). Results below a limit of detection or quantification, empty or unparsed
          are not assessed.
      sisagua_surveillance_chlorine_below_0_2:
        measure: count
        where:
          PARAMETRO:
          - Cloro residual livre (mg/L)
          - Cloro Residual Livre (mg/L)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            below: 0.2
        unit: analyses
        what: Free residual chlorine below 0,2 mg/L (Portaria GM/MS 888/2021, Anexo XX, art. 32 (minimum 0,2 mg/L in the network,
          reservoirs and consumption points) and Anexo 9 (VMP 5 mg/L)). Results below a limit of detection or quantification,
          empty or unparsed are not assessed.
      sisagua_surveillance_chlorine_above_5:
        measure: count
        where:
          PARAMETRO:
          - Cloro residual livre (mg/L)
          - Cloro Residual Livre (mg/L)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            above: 5.0
        unit: analyses
        what: Free residual chlorine above 5,0 mg/L (Portaria GM/MS 888/2021, Anexo XX, art. 32 (minimum 0,2 mg/L in the network,
          reservoirs and consumption points) and Anexo 9 (VMP 5 mg/L)). Results below a limit of detection or quantification,
          empty or unparsed are not assessed.
      sisagua_surveillance_fluoride_above_1_5:
        measure: count
        where:
          PARAMETRO:
          - Fluoreto (mg/L)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          - SAI
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
          - ESTAÇÃO DE TRATAMENTO DE ÁGUA
        outcome:
          RESULTADO:
            above: 1.5
        unit: analyses
        what: Fluoride above 1,5 mg/L (Portaria GM/MS 888/2021, Anexo XX, Anexo 9 and art. 36 §1º (VMP 1,5 mg/L)). Results below
          a limit of detection or quantification, empty or unparsed are not assessed.
      sisagua_surveillance_colour_above_15:
        measure: count
        where:
          PARAMETRO:
          - Cor Aparente (uH)
          RESULTADO__FLAG:
          - numeric
          TP_ABASTECIMENTO:
          - SAA
          - SAC
          TP_PROCEDENCIA_COLETA:
          - SISTEMA DE DISTRIBUIÇÃO
          - INTRA-DOMICILIAR / INTRA-PREDIAL
          - SOLUÇÃO ALTERNATIVA
        outcome:
          RESULTADO:
            above: 15.0
        unit: analyses
        what: Apparent colour above 15 uH (Portaria GM/MS 888/2021, Anexo XX, Anexo 11 (VMP 15 uH, organoleptic)). Results below
          a limit of detection or quantification, empty or unparsed are not assessed.
