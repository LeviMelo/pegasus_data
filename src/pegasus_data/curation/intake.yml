      FAB_RE_BI: {description: "Manufacturer of the bivalent booster, as filed (dictionary: Fabricante dose reforço bivalente COVID-19)"}
      LOTE_1_COV: {description: "Lot of the first dose (dictionary: Lote da vacina COVID-19: Lote 1ª Dose)"}
