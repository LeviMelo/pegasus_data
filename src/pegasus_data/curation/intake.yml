        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    columns:
      ID_EVENTO_ATENCAO_SAUDE: {description: "the event's identifier, the key between the consolidated (CONS) and detailed (DET) tables and the remuneration table (REM); ANS's own number, a pseudonymous identifier kept as filed", type: code}
      ID_PLANO: {description: "ANS's identifier of the beneficiary's plan, valid only inside these files (the key of DADOS_DE_PLANOS/PLANOS.zip); a pseudonymous identifier kept as filed", type: code}
      FAIXA_ETARIA: {description: "age band of the beneficiary; the spelling differs by layout ('30 a 39' to 2022, '30 a 39 anos' from 2023)", type: label}
      SEXO: {description: "sex of the beneficiary (Masculino, Feminino; empty when the SIB or CNS crossing did not find it)", type: code}
      CD_MUNICIPIO_BENEFICIARIO: {description: "IBGE code (6 digits) of the beneficiary's municipality of residence; empty when the SIB or CNS crossing did not find it", type: municipality}
      PORTE: {description: "size class of the operator by active beneficiary links in the latest month of the SIB (GRANDE from 100,000, MÉDIO 20,000 to 99,999, PEQUENO below 20,000, SEM BENEFICIÁRIOS)", type: code}
      CD_MODALIDADE: {description: "code of the operator's modality", type: code, codes: {"21": "Administradora", "55": "Administradora", "22": "Cooperativa médica", "23": "Cooperativa odontológica", "24": "Autogestão", "25": "Medicina de grupo", "26": "Odontologia de grupo", "27": "Filantropia", "28": "Seguradora especializada em saúde", "29": "Seguradora especializada em saúde"}}
      NM_MODALIDADE: {description: "the operator's modality, by legal status", type: label}
      CD_MUNICIPIO_PRESTADOR: {description: "IBGE code (6 digits) of the municipality of the provider that executed the care", type: municipality}
      UF_PRESTADOR: {description: "state of the provider that executed the care", type: code}
      DT_REALIZACAO: {description: "year and month the care was given (yyyy-mm)", type: date, format: "%Y-%m"}
      CD_CARATER_ATENDIMENTO: {description: "character of the care (TUSS 23)", type: int_code, codes: {"1": "Eletivo", "2": "Urgência/Emergência"}}
      TIPO_ATENDIMENTO: {description: "type of care (TUSS 50; the dictionary lists no codes)", type: int_code}
      REGIME_ATENDIMENTO: {description: "regime of care (TUSS 76; from 2023, the dictionary lists no codes)", type: int_code, optional: true}
      CD_MOTIVO_SAIDA: {description: "reason the care ended (TUSS 39; the dictionary lists no codes)", type: int_code}
      CBO: {description: "occupation of the professional, CBO (TUSS 24)", type: code, codelist: "CBO2002"}
      TIPO_CONSULTA: {description: "type of consultation (TUSS 52; the dictionary lists no codes)", type: int_code}
      SAUDE_OCUPACIONAL: {description: "occupational-health marker (TUSS 77; from 2023, the dictionary lists no codes)", type: int_code, optional: true}
      IND_ACIDENTE_DOENCA: {description: "whether the care is due to an accident or a related disease (TUSS 36; the dictionary lists no codes)", type: int_code}
      VL_EVENTO_INFORMADO: {description: "total assistance expense billed by the provider for the event (reais, nominal; from 2023, filed to the earlier years in 2026)", type: number, decimal: ",", optional: true}
      VL_EVENTO_PAGO: {description: "total the operator paid the provider for the event (reais, nominal; from 2023, filed to the earlier years in 2026)", type: number, decimal: ",", optional: true}
      VL_EVENTO_GLOSA: {description: "total billed whose payment the operator refused (reais, nominal; from 2023, filed to the earlier years in 2026)", type: number, decimal: ",", optional: true}
      LG_VALOR_PREESTABELECIDO: {description: "whether the event belongs to a pre-established-value contract (the operator pays the contracted amount whether or not care is given); its items then have zero value or only a bonus", type: code, codes: {"0": "no", "1": "yes"}}
    place: {column: CD_MUNICIPIO_BENEFICIARIO, type: municipality}
    period: {type: date, column: DT_REALIZACAO, format: "%Y-%m", grain: month, valid: 2015-2025}
    fields:
      ans_tiss_outpatient_events:
        label: "Private-plan outpatient events by residence"
        measure: count
        by: [{SEXO: sex}, {CD_CARATER_ATENDIMENTO: care_character}]
        unit: outpatient events reported to ANS
        grain: month
        law: sum
        what: >
          Outpatient events of private health plans reported to ANS (TISS), by the beneficiary's municipality of residence and month,
          sex and character of the care (1 elective, 2 urgent or emergency). Events with no residence are not in the field (the
          records count them as unplaced).
        years: 2015-2025

  ans_tiss_amb_det:
    system: ANS
    series: TISS_AMB_DET
    official_name: "Procedimentos ambulatoriais por UF, detalhado (TISS)"
    translated_name: "Outpatient events of private health plans by state, itemised (TISS)"
    what: >
      The items (procedures, medicines, materials, groups) of the outpatient events of private health plans reported to ANS under the
      TISS standard, 2015-2025: one row per item of an event, with the TUSS code and table, the quantity and value billed (and, from
      2023, paid), whether it belongs to a package, and the provider's state. Joined to the consolidated table by the event's identifier.
    one_row: "one item (procedure, medicine, material or group) billed within one outpatient event, with its TUSS table and code, quantity and value"
    unit_of_analysis: event item
    use: context
    why_no_event_type: >-
      Items of events, not events: a row is a procedure, a medicine or a material billed within an outpatient event. The event is the CONS row.
    known_biases: >-
      These are the events operators sent to ANS under the TISS standard, not a census of private care: an event the operator never sent
      is absent, and ANS rewrites the files (the 2023 and later files were rebuilt in 2026 with payment columns added).
      Residence (sex, municipality) is filled by a crossing with the SIB or CNS, so it is empty for beneficiaries that crossing did not find.
      An identifier of the beneficiary is not published: events of one person cannot be linked, nor can one plan's events across operators.
    gotchas:
      - "CD_PROCEDIMENTO is a TUSS procedure code only where CD_TABELA_REFERENCIA is 22 (19 OPME, 20 medicines); 63 is a group of procedures and 90 and 98 are operators' own packages. A code of one table can equal one of another: always read the pair."
      - "Items inside a package (IND_PACOTE = 1) carry the item and its table but no quantity or value; the package's own line carries them."
      - "CD_TABELA_REFERENCIA is also '0' or '00' (the same thing filed twice) wherever IND_TABELA_PROPRIA is 1, and CD_PROCEDIMENTO then reads 'TABELA PROPRIA': an operator's own item, which cannot be identified (16% of the hospital items and 4% of the outpatient items of the AC and RR sample)."
      - "CD_PROCEDIMENTO keeps its leading zeros ('031'); read it as text."
      - "Items of TUSS tables 22 and 63 are named by the pair (CD_TABELA_REFERENCIA + CD_PROCEDIMENTO, codelist TUSS, ANS's terminology of PDA 049): one name per code, the current one, so a procedure renamed since is named as today. Tables 19 and 20 (OPME, medicines), 90, 98 and an operator's own code stay undecoded. `tuss_sigtap(codes)` is ANS's correspondence of table 22 to SIGTAP (April 2017: 4,299 pairs, no later terms)."
      - "There is no beneficiary municipality in DET, only the provider's state: join CONS on ID_EVENTO_ATENCAO_SAUDE for residence, sex and age."
      - "Two layouts: files to 2022 lack the payment columns (VL_EVENTO_*, QT_ITEM_EVENTO_PAGO, VL_ITEM_EVENTO_PAGO), UNIDADE_MEDIDA, REGIME_ATENDIMENTO and SAUDE_OCUPACIONAL, which exist from 2023 (the dictionary: new message fields from May 2023, payment fields published in 2026 for 2023 on). FAIXA_ETARIA is spelled '30 a 39' to 2022 and '30 a 39 anos' from 2023."
      - "Events of pre-established-value contracts (LG_VALOR_PREESTABELECIDO = 1) are in the files with zero item values or only a bonus: sums of value understate what those contracts cost."
      - "FAIXA_ETARIA is also filed '<1' and 'Menos de 1 ano', '80 ou mais' and '80 anos ou mais', and 'N¿o identificado' (the file's mangled 'Não identificado'; the dictionary's word for it is 'Informada Incorretamente'): read it as filed, never by a code."
      - "A beneficiary with no residence has no sex either (both come from one crossing with the SIB or CNS), and such an event is unplaced in the field."
      - "Code lists the dictionary names by TUSS table number (23, 57, 41, 39, 50, 76, 52, 24, 77, 36, 60, 79) are not in it: those codes stay undecoded, as filed."
      - "An outpatient event is a consultation guide or an SP/SADT guide not linked to an admission."
      - "The ambulatory files are large: 197.6 GiB zipped for 2015-2025 (CONS 105.9, DET 79.7, REM 11.9), so every ambulatory source is declared on request."
    citation: ANS PDA, TISS (D-TISS), Procedimentos ambulatoriais por UF, detalhado (TISS) (dadosabertos.ans.gov.br)
    dictionary: https://dadosabertos.ans.gov.br/FTP/PDA/TISS/DICIONARIO/ (Dicionario_de_variaveis_ate_2022.ods and Dicionario_de_variaveis_a_partir_de_2023.ods)
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: utf8}
      pattern: https://dadosabertos.ans.gov.br/FTP/PDA/TISS/AMBULATORIAL/{year}/{uf}/{uf}_{period}_AMB_DET.zip
      months: 201501-202512
      on_request: true
      across:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    columns:
      ID_EVENTO_ATENCAO_SAUDE: {description: "the event's identifier, the key between the consolidated (CONS) and detailed (DET) tables and the remuneration table (REM); ANS's own number, a pseudonymous identifier kept as filed", type: code}
      UF_PRESTADOR: {description: "state of the provider", type: code}
      DT_REALIZACAO: {description: "year and month the care was given (yyyy-mm)", type: date, format: "%Y-%m"}
      CD_PROCEDIMENTO: {description: "code of the procedure or item, by the table CD_TABELA_REFERENCIA names (TUSS 19, 20, 22), or of a group (TUSS 63) or an operator's package (tables 90, 98); named by the pair (the TUSS terminology of tables 22 and 63; 19 and 20 are not held)", type: code, codelist: TUSS, key: [CD_TABELA_REFERENCIA, CD_PROCEDIMENTO]}
      CD_TABELA_REFERENCIA: {description: "the TUSS table CD_PROCEDIMENTO belongs to", type: code, codes: {"19": "TUSS 19, OPME and special materials", "20": "TUSS 20, medicines", "22": "TUSS 22, procedures and health events", "63": "TUSS 63, groups of procedures and items (a group, not a procedure)", "90": "a package created by the operator (not a TUSS code)", "98": "a package created by the operator (not a TUSS code)"}}
      QT_ITEM_EVENTO_INFORMADO: {description: "quantity of the item billed by the provider", type: number, decimal: ","}
      VL_ITEM_EVENTO_INFORMADO: {description: "value billed for the item (reais, nominal)", type: number, decimal: ","}
      QT_ITEM_EVENTO_PAGO: {description: "quantity of the item the operator paid (from 2023)", type: number, decimal: ",", optional: true}
      VL_ITEM_EVENTO_PAGO: {description: "value the operator paid for the item (reais, nominal; from 2023)", type: number, decimal: ",", optional: true}
      VL_ITEM_PAGO_FORNECEDOR: {description: "value the operator paid directly to suppliers (reais, nominal)", type: number, decimal: ","}
      UNIDADE_MEDIDA: {description: "unit of measure of the item (TUSS 60; from 2023)", type: code, optional: true}
      IND_PACOTE: {description: "whether the item is part of a package of procedures", type: code, codes: {"0": "no", "1": "yes"}}
      IND_TABELA_PROPRIA: {description: "whether the operator reported its own code, not a TUSS one: the item then cannot be identified", type: code, codes: {"0": "no", "1": "yes"}}
    period: {type: date, column: DT_REALIZACAO, format: "%Y-%m", grain: month, valid: 2015-2025}
    fields:
      ans_tiss_outpatient_items:
        label: "Private-plan outpatient items billed"
        rows:
          event: ID_EVENTO_ATENCAO_SAUDE
          month: DT_REALIZACAO
          provider_uf: UF_PRESTADOR
          table: CD_TABELA_REFERENCIA
          procedure: CD_PROCEDIMENTO
          quantity: QT_ITEM_EVENTO_INFORMADO
          value: VL_ITEM_EVENTO_INFORMADO
          package: IND_PACOTE
          own_table: IND_TABELA_PROPRIA
        unit: item lines (one row per item of an event)
        grain: month
        what: >
          The itemised lines of private-plan outpatient events reported to ANS (TISS): the TUSS table and code, quantity and value
          billed, package and own-table flags, by event and month. A register of lines, not an aggregate.
        years: 2015-2025

  ans_tiss_amb_rem:
    system: ANS
    series: TISS_AMB_REM
    official_name: "Modelo de remuneração, ambulatorial (TISS)"
    translated_name: "Remuneration model of outpatient events of private health plans (TISS)"
    what: >
      How operators remunerate providers for outpatient events, 2023-2025: one row per event and remuneration model, with the value the
      model covers. Published from May 2023, when the field entered the message.
    one_row: "the value of one outpatient event under one remuneration model (TUSS 79)"
    unit_of_analysis: event x remuneration model
    use: context
    why_no_event_type: >-
      A property of an event's payment (model and value), keyed by the event's identifier; it has no place or month of its own.
    known_biases: >-
      These are the events operators sent to ANS under the TISS standard, not a census of private care: an event the operator never sent
      is absent, and ANS rewrites the files (the 2023 and later files were rebuilt in 2026 with payment columns added).
      Residence (sex, municipality) is filled by a crossing with the SIB or CNS, so it is empty for beneficiaries that crossing did not find.
      An identifier of the beneficiary is not published: events of one person cannot be linked, nor can one plan's events across operators.
    gotchas:
      - "REM exists from 2023 only (the field entered the TISS message in May 2023) and the dictionary says it may be absent for events."
      - "It has no municipality, state or month: join CONS or DET on ID_EVENTO_ATENCAO_SAUDE. The file's month is the publication's month."
      - "CD_MODELO_REMUNERACAO is TUSS table 79, which the dictionary does not reproduce: the codes stay undecoded."
    citation: ANS PDA, TISS (D-TISS), Modelo de remuneração, ambulatorial (TISS) (dadosabertos.ans.gov.br)
    dictionary: https://dadosabertos.ans.gov.br/FTP/PDA/TISS/DICIONARIO/ (Dicionario_de_variaveis_ate_2022.ods and Dicionario_de_variaveis_a_partir_de_2023.ods)
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: utf8}
      pattern: https://dadosabertos.ans.gov.br/FTP/PDA/TISS/AMBULATORIAL/{year}/{uf}/{uf}_{period}_AMB_REM.zip
      months: 202301-202512
      on_request: true
      across:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    columns:
      ID_EVENTO_ATENCAO_SAUDE: {description: "the event's identifier, the key between the consolidated (CONS) and detailed (DET) tables and the remuneration table (REM); ANS's own number, a pseudonymous identifier kept as filed", type: code}
      CD_MODELO_REMUNERACAO: {description: "remuneration model between operator and provider (TUSS 79; the dictionary lists no codes)", type: code}
      VL_TOTAL_REMUNERACAO: {description: "value of the procedures and items of the event under the remuneration model (reais, nominal)", type: number, decimal: ","}
    period: {type: file}
    fields:
      ans_tiss_outpatient_remuneration:
        label: "Private-plan outpatient remuneration models"
        rows:
          event: ID_EVENTO_ATENCAO_SAUDE
          model: CD_MODELO_REMUNERACAO
          value: VL_TOTAL_REMUNERACAO
        unit: remuneration lines (one row per event and model)
        what: >
          The remuneration model of private-plan outpatient events and the value it covers (TISS, from 2023), by event. A register of
          lines, not an aggregate.
        years: 2023-2025

  inep:
    system: INEP
    series: EDBASICA
    system_name:
      official_name: Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (INEP), dados abertos
      translated_name: National Institute for Educational Studies and Research (INEP), open data
      authority: INEP / MEC
      what_it_is: The education ministry's statistics agency; its open microdata include the annual school census.
    official_name: Censo Escolar da Educação Básica, microdados
    translated_name: Basic-education school census, microdata
    what: >
      INEP's school census (microdados_ed_basica_<year>), one row per school since the 2021 release: its municipality, its
      dependency and location, and its enrolments in basic education, in total and by sex, by colour/race (with "not
      declared") and by age band (0-3, 4-5, 6-10, 11-14, 15-17, 18+). The crossing of the three is not published.
    one_row: one school in one census year
    unit_of_analysis: school
    use: context
    why_no_event_type: >-
      A census of schools: one row per school and year with its enrolments by sex, race and age band; a school
      is a unit and an enrolment is not a person or a health event.
    known_biases: >-
      An enrolment is taken at the census date (the last Wednesday of May, which also fixes the age bands) and
      counts a place at a school, not a person.
    gotchas:
      - The municipality is where the school is, not where the student lives, and an enrolment is not a person.
      - The zip holds a second table (suplemento_cursos_tecnicos); only the schools' table is read.
      - Each margin (sex, race, age band) sums to the total (QT_MAT_BAS).
      - >-
          The age bands are computed from the student's age on the census reference date, the last Wednesday
          of May (INEP's dictionary).
    citation: INEP, Censo Escolar da Educação Básica, microdados_ed_basica (download.inep.gov.br/dados_abertos)
    dictionary: https://download.inep.gov.br/dados_abertos/ (the dictionary inside each year's zip)
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: latin1, member: "microdados_ed_basica_{year}.csv"}
      pattern: https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_{year}.zip
      years: 2021-2024
    columns:
      NU_ANO_CENSO: {description: census year, type: year}
      CO_MUNICIPIO: {description: IBGE code of the school's municipality (7 digits), type: municipality}
      CO_ENTIDADE: {description: the school's INEP code, type: code}
      QT_MAT_BAS: {description: enrolments in basic education (total), type: integer}
      QT_MAT_BAS_FEM: {description: "enrolments, female", type: integer}
      QT_MAT_BAS_MASC: {description: "enrolments, male", type: integer}
      QT_MAT_BAS_BRANCA: {description: "enrolments, white", type: integer}
      QT_MAT_BAS_PRETA: {description: "enrolments, black", type: integer}
      QT_MAT_BAS_PARDA: {description: "enrolments, brown", type: integer}
      QT_MAT_BAS_AMARELA: {description: "enrolments, yellow", type: integer}
      QT_MAT_BAS_INDIGENA: {description: "enrolments, indigenous", type: integer}
      QT_MAT_BAS_ND: {description: "enrolments, colour/race not declared", type: integer}
      QT_MAT_BAS_0_3: {description: enrolments aged 0 to 3, type: integer}
      QT_MAT_BAS_4_5: {description: enrolments aged 4 to 5, type: integer}
      QT_MAT_BAS_6_10: {description: enrolments aged 6 to 10, type: integer}
      QT_MAT_BAS_11_14: {description: enrolments aged 11 to 14, type: integer}
      QT_MAT_BAS_15_17: {description: enrolments aged 15 to 17, type: integer}
      QT_MAT_BAS_18_MAIS: {description: enrolments aged 18 or more, type: integer}
    place: {column: CO_MUNICIPIO, type: municipality}
    period: {type: year, column: NU_ANO_CENSO, grain: year}
    fields:
      inep_enrolments:
        label: "Basic-education enrolments"
        unpivot:
          as: [margin, category]
          columns:
            QT_MAT_BAS: [total, all]
            QT_MAT_BAS_FEM: [sex, fem]
            QT_MAT_BAS_MASC: [sex, masc]
            QT_MAT_BAS_BRANCA: [race, branca]
            QT_MAT_BAS_PRETA: [race, preta]
            QT_MAT_BAS_PARDA: [race, parda]
            QT_MAT_BAS_AMARELA: [race, amarela]
            QT_MAT_BAS_INDIGENA: [race, indigena]
            QT_MAT_BAS_ND: [race, not declared]
            QT_MAT_BAS_0_3: [age_band, "0_3"]
            QT_MAT_BAS_4_5: [age_band, "4_5"]
            QT_MAT_BAS_6_10: [age_band, "6_10"]
            QT_MAT_BAS_11_14: [age_band, "11_14"]
            QT_MAT_BAS_15_17: [age_band, "15_17"]
            QT_MAT_BAS_18_MAIS: [age_band, 18_mais]
        over: population
        unit: enrolments (matrículas) in basic education, at the school's municipality
        what: >
          INEP's school census (microdados_ed_basica_<year>), one row per school since the 2021 release, summed to the
          municipality: the total, and separately the margins by sex, colour/race (with "not declared") and age band (0-3,
          4-5, 6-10, 11-14, 15-17, 18+). The crossing of the three is not published.
        years: 2021-2024
        declares:
          # its rows are margins, each summing to the total: read as one value per place, the total
          where: {margin: total}
          verified: {year: 2023, total: 47304632, municipalities: 5570, each_margin_sums_to_total: true, measured: 2026-10-04}

  pni_doses:
    system: PNI
    series: DOSES
    official_name: Doses aplicadas pelo Programa Nacional de Imunizações (SI-PNI / RNDS), microdados
    translated_name: Vaccine doses applied (SI-PNI / RNDS), one record per dose
    what: >
      Every vaccine dose applied in Brazil and sent to the RNDS (the national health data network), 2020-01 on, one row per dose:
      the vaccine, the dose, the date, the establishment that applied it and the person's sex, race/colour, age, municipality of
      residence and a pseudonymous person code. Published by the Ministry as one zipped CSV per month on the Portal de Dados
      Abertos; 200.1 GiB zipped for 2020-01 to 2026-09 (81 monthly files: 13.9 GiB for 2020, 54.5 for 2021, 37.0 for 2022, 23.7 for
      2023, 24.3 for 2024, 25.4 for 2025, 21.2 for 2026 to September), about 1.47 billion rows and 128 GiB once landed
      (five months of 2023 measured: 12.8 GiB zipped, 93.6 million rows, 8.2 GiB of Parquet, 2026-10-10).
    one_row: "one vaccine dose applied to one person, as a document of the RNDS (co_documento), with its vaccine, dose, date and establishment"
    unit_of_analysis: dose
    known_biases: >
      The RNDS receives what the vaccinating systems send (e-SUS APS, SI-PNI, state systems): a dose given but never
      transmitted is absent, and the coverage of transmission grew over 2020-2021. A document can be replaced or altered
      (co_troca_documento, st_documento): only `final` documents are doses. The Ministry rewrites the published months
      (2023's files were last modified in August 2026; September 2026's on 2026-11-08), so a month landed is a version of it.
      The person code is a pseudonymous hash: doses of one person link within the files, never to another system.
    gotchas:
      - "Too large to land whole on most machines (128 GiB of Parquet projected): it is declared on request, so `pegasus-data fields` with no names leaves it out, and a build names the years (pegasus-data fields --name vaccine_doses_residence --years 2023)."
      - "Months not yet published answer HTTP 403 on the bucket (October and November 2026, read 2026-11-08), a recorded gap and not an absence."
      - "nu_idade_paciente holds -1, 120 and 220 (DATA_SOURCES, PNI); co_vacina_fabricante is mostly empty and does not pair with ds_nome."
      - "The code lists are the files' own descriptor columns beside each code (sg_imunobiologico for co_vacina, ds_tipo_dose for co_dose_vacina): read with label_from, never from a separate table."
    use: context
    why_no_event_type: >
      A dose is a vaccination of a person and could be an event type; none is declared yet because no roles type these columns
      (curation/roles has no PNI-DOSES). Until a study needs vaccination as an exposure of persons, the doses are served as the
      records and as the context field vaccine_doses_residence (place, month, vaccine, dose).
    citation: Portal de Dados Abertos do SUS, PNI/csv/vacinacao_<mês>_<ano>_csv.zip (SI-PNI / RNDS, Ministério da Saúde)
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/dbbni/Dicionario_tb_ria_rotina.pdf
    origin:
      kind: files
      format: csv
      csv: {sep: ";", encoding: latin1}
      pattern: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/PNI/csv/vacinacao_{month_pt}_{year}_csv.zip
      months: 202001-202609
      on_request: true
    columns:
      co_documento: {description: code of the document in the RNDS (every FHIR document entering the RNDS receives one), type: code}
      co_paciente: {description: pseudonymous code of the patient assigned in the RNDS (a hash; a personal identifier kept as filed), type: code}
      tp_sexo_paciente: {description: "biological sex of the patient (F, M, I)", type: code}
