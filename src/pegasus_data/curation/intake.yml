      LOTE_REF: {description: "Lot of the booster dose (dictionary: Lote da vacina COVID-19: Lote dose reforço)"}
      LOTE_REF2: {description: "Lot of the second booster dose (dictionary: Lote da vacina COVID-19: Lote 2ª dose reforço)"}
      LOTE_ADIC: {description: "Lot of the additional dose (dictionary: Lote da vacina COVID-19: Lote dose adicional)"}
      LOT_RE_BI: {description: "Lot of the bivalent booster (dictionary: Lote da vacina COVID-19: Lote dose reforço bivalente)"}
      FNT_IN_COV: {description: "How the covid-19 vaccine data were entered (dictionary: Fonte dos dados/informação sobre a vacina COVID-19)", codes: {"1": "Manual", "2": "Integração"}}
      TRAT_COV: {description: "Received an antiviral for covid-19 (dictionary: Recebeu tratamento antiviral para covid-19?)", codes: {"1": "Sim", "2": "Não", "9": "Ignorado"}}
      TIPO_TRAT: {description: "The antiviral used for covid-19 (dictionary: Qual antiviral (covid-19)?)", codes: {"1": "Nirmatrelvir/ritonavir (Paxlovid)", "2": "Molnupiravir (Lagevrio)", "3": "Baricitinibe (Olumiant)", "4": "Outro, especifique"}}
      DT_TRT_COV: {description: "Date the covid-19 antiviral began (dictionary: Data do início do tratamento (covid-19))", type: date, take: 10, format: "%Y-%m-%d"}
