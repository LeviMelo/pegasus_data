      QT_MAT_BAS_PRETA: {role: enrolments, black, type: integer}
      QT_MAT_BAS_PARDA: {role: enrolments, brown, type: integer}
      QT_MAT_BAS_AMARELA: {role: enrolments, yellow, type: integer}
      QT_MAT_BAS_INDIGENA: {role: enrolments, indigenous, type: integer}
      QT_MAT_BAS_ND: {role: enrolments, colour/race not declared, type: integer}
      QT_MAT_BAS_0_3: {role: enrolments aged 0 to 3, type: integer}
      QT_MAT_BAS_4_5: {role: enrolments aged 4 to 5, type: integer}
      QT_MAT_BAS_6_10: {role: enrolments aged 6 to 10, type: integer}
      QT_MAT_BAS_11_14: {role: enrolments aged 11 to 14, type: integer}
      QT_MAT_BAS_15_17: {role: enrolments aged 15 to 17, type: integer}
      QT_MAT_BAS_18_MAIS: {role: enrolments aged 18 or more, type: integer}
    place: {column: CO_MUNICIPIO, type: municipality}
    period: {type: year, column: NU_ANO_CENSO, grain: year}
    fields:
      inep_enrolments:
        unpivot:
