# The author's curated SIDRA compendium (SIDRA_COMPENDIUM.md, 97 tables), as an overlay on the registry.
# IBGE's metadata is the truth about a table (names, units, periods, categories); this file says only
# which tables PegaSUS wants (tier), how they group, and per variable whether it is kept by default
# (`keep`) and what kind of quantity it is: c count, m monetary, p percent/share, md mean or median,
# r rate or index, o other. Kind is what refuses a sum of means. `categories` names a policy per classification where
# the full cube is not wanted (all, total, non_total, level:N); the default is every category. `pegasus-data sidra check` reports where
# this file and IBGE's metadata disagree (variables IBGE no longer lists, tables with no municipal level).

