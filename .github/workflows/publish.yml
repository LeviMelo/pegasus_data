name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build and verify release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python scripts/verify_distribution.py \
            --expected-version "${RELEASE_TAG#v}" dist/*

      - name: Prove the release sdist rebuilds independently
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          rebuild_root="$(mktemp -d)"
          mkdir "$rebuild_root/rebuilt-dist"
          tar -xzf dist/*.tar.gz -C "$rebuild_root"
          source_root="$(find "$rebuild_root" -mindepth 1 -maxdepth 1 -type d \
            ! -name rebuilt-dist -print -quit)"
          python -m build --wheel --outdir "$rebuild_root/rebuilt-dist" "$source_root"
          python scripts/verify_distribution.py \
            --expected-version "${RELEASE_TAG#v}" "$rebuild_root"/rebuilt-dist/*.whl

      - name: Smoke-test the installed release wheel
        run: |
          smoke_root="$(mktemp -d)"
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --upgrade pip
          "$smoke_root/venv/bin/python" -m pip install dist/*.whl
          cd "$smoke_root"
          "$smoke_root/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            --forbid-root "$GITHUB_WORKSPACE"
          "$smoke_root/venv/bin/pegasus-data" --help

      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-data-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pegasus-data
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pegasus-data-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
