name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The same extras a contributor gets, so a check that passes here
          # passes locally: `all` carries the optional decoders (pypdf,
          # openpyxl, rarfile, polars) that several tests skip without.
          python -m pip install -e ".[dev,all]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Tests
        # Offline by default. Nothing here reaches ftp.datasus.gov.br.
        run: pytest -q

      - name: Types
        # NOT blocking, and deliberately so rather than silently. mypy reports
        # 116 findings on this tree, essentially all `dict[str, object]` values
        # that need a per-site annotation; none is a known defect. The number is
        # recorded in CONTRIBUTING.md so it can be ratcheted down rather than
        # rediscovered. Make this step blocking when it reaches zero.
        continue-on-error: true
        run: mypy src/pegasus_data

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify archive contents
        run: python scripts/verify_distribution.py dist/*

      - name: Prove the sdist rebuilds independently
        run: |
          rebuild_root="$(mktemp -d)"
          mkdir "$rebuild_root/rebuilt-dist"
          tar -xzf dist/*.tar.gz -C "$rebuild_root"
          source_root="$(find "$rebuild_root" -mindepth 1 -maxdepth 1 -type d \
            ! -name rebuilt-dist -print -quit)"
          python -m build --wheel --outdir "$rebuild_root/rebuilt-dist" "$source_root"
          python scripts/verify_distribution.py "$rebuild_root"/rebuilt-dist/*.whl

      - name: Smoke-test the installed wheel outside the checkout
        run: |
          smoke_root="$(mktemp -d)"
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --upgrade pip
          "$smoke_root/venv/bin/python" -m pip install dist/*.whl
          cd "$smoke_root"
          "$smoke_root/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            --forbid-root "$GITHUB_WORKSPACE"
          "$smoke_root/venv/bin/pegasus-data" --help

      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-data-distributions
          path: dist/
          if-no-files-found: error
