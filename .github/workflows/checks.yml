name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The same extras a contributor gets, so a check that passes here
          # passes locally: `all` carries the optional decoders (pypdf,
          # openpyxl, rarfile, polars) that several tests skip without.
          python -m pip install -e ".[dev,all]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Tests
        # Offline by default. Nothing here reaches ftp.datasus.gov.br.
        run: pytest -q

      - name: Types
        # NOT blocking, and deliberately so rather than silently. mypy reports
        # 96 findings on this tree, essentially all `dict[str, object]` values
        # that need a per-site annotation; none is a known defect. The number is
        # recorded in CONTRIBUTING.md so it can be ratcheted down rather than
        # rediscovered. Make this step blocking when it reaches zero.
        continue-on-error: true
        run: mypy src/pegasus_data
