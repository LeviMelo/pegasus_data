# ESUSNOTIFICA / DCCR — chronic Chagas disease notifications, e-SUS Notifica.
#
# One row is one notification of chronic Chagas disease (doença de Chagas
# crônica, DCC), compulsorily notifiable since Portaria nº 1.061/2020 and
# collected on the e-SUS Notifica form released 6 January 2023. The published
# DCCBR*.dbc is an *anonymised, technically qualified* export, not the raw
# system table: personal-data columns are dropped, duplicates and cancelled
# records are removed, several fields are blanked on consistency rules, and the
# category codes are expanded to their label text.
#
# READ THIS BEFORE USING ANY COLUMN BELOW.
# Almost every categorical column in this file holds the *label text*, not a
# code. Declared widths match label lengths exactly and repeatedly — CS_SEXO is
# C(9) ("Masculino"), CS_RACA C(8) ("Indígena"), BNZ_GASTRO C(29)
# ("Intolerância gastrointestinal"), ST_ENCERRA C(35) ("Permanece em
# acompanhamento clínico") — and the Nota Informativa lists "Retirada de
# acentos (´^~Ç)" among the export adjustments, an operation that only applies
# to text. The one genuinely coded column is NU_IDADE_N. Where the catalog
# binds a SINAN numeric codelist (SIM_NAO, CS_SEXO, CS_RACA, SG_UF) to one of
# these columns, those codes do not occur in the data.
system: ESUSNOTIFICA
asserted_by: pegasus_data
source: layout_doc
source_ref: /dissemin/publicos/ESUSNOTIFICA/DOCS/Nota_Informativa_Doenca_de_Chagas_Cronica.pdf

variables:

  # ------------------------------------------------------------------ notifier

  SG_UF_NOT:
    official_name: Estado da Notificação
    translated_name: State of notification
    description: >
      Federative unit of the health establishment that entered the notification.
      It is not chosen by the notifier: e-SUS Notifica derives it from the CNES
      establishment the user selects when opening the ficha, so it tracks where
      the reporting service sits, not where the patient lives (SG_UF) or was
      probably infected (COUFINF).
    code_system: none
    notes: >
      Declared C(19) and carries the state name spelled out ("Rio Grande do
      Norte"), accents stripped — not the two-letter sigla the SG_ prefix
      suggests. The catalog binds the SINAN SG_UF_NOT code table to it; those
      numeric codes do not appear here.

  ID_MUNICIP:
    official_name: Município da Notificação
    translated_name: Municipality of notification
    description: >
      Municipality of the establishment that entered the notification, carried
      as the municipality name. Like SG_UF_NOT it is inherited from the CNES
      establishment selected at notification time rather than typed in.
      CD_MUNICIP holds the matching IBGE code.
    code_system: none
    depends_on: [CD_MUNICIP]
    notes: >
      Name text, accents stripped. Join on CD_MUNICIP rather than on this
      column — municipality names are not unique across Brazil.

  CNES:
    official_name: CNES do estabelecimento notificante
    translated_name: Notifying establishment (CNES)
    description: >
      The health establishment, in the national CNES registry, that the
      notifying user selected when opening this ficha. A user may hold more than
      one CNES registration and picks one per notification; the state and
      municipality of notification recorded on the ficha are the ones attached
      to whichever CNES was selected.
    code_system: external
    source: web
    source_ref: https://datasus.saude.gov.br/wp-content/uploads/2023/10/Guia-para-notificacao-de-doenca-de-Chagas-cronica-DCC_02_10_23.pdf
    notes: >
      Not listed in either DATASUS dictionary for this dataset; the meaning
      above comes from the e-SUS Notifica user guide. Declared C(37), far wider
      than a 7-digit CNES number, so the column appears to carry an
      establishment name or a code-plus-name string — inspect it before
      attempting a join to the CNES establishment table.

  # -------------------------------------------------------------- the patient

  ID_ESTRANG:
    official_name: Estrangeiro
    translated_name: Foreign national
    description: >
      Whether the notified person is a foreign national. It gates the address
      rules for the rest of the ficha: for a foreign national the residence
      fields are filled with the address where they are staying in Brazil, and
      ID_PAIS becomes mandatory.
    code_system: none
    depends_on: [ID_PAIS]
    notes: Holds "Sim"/"Nao" as text in a C(3) column, not a 1/2 code.

  ID_PAIS:
    official_name: País de origem
    translated_name: Country of origin
    description: >
      Country the patient came from, required only when ID_ESTRANG says the
      patient is a foreign national. Distinct from SG_PAIS, which is where they
      were living at the time of notification.
    code_system: none
    depends_on: [ID_ESTRANG]
    notes: >
      The dictionary types this as externally coded (ISO), but the column is
      C(8) and carries country name text with accents stripped, not an ISO
      alpha-2/alpha-3 code.

  NU_IDADE_N:
    official_name: Idade
    translated_name: Age (SINAN composite)
    description: >
      Age at notification encoded in SINAN's four-digit composite form, NOT a
      plain age in years. The first digit is the unit — 1 hour, 2 day, 3 month,
      4 year — and the remaining three digits give the magnitude in that unit.
      4018 is eighteen years old; 3009 is nine months old.
    code_system: internal
    codelists: [IDADEDETESUS, FXIDAD5ESUS, FXIDAD9ESUS, FXIDAD13ESUS, FXRIPSA6ESUS]
    notes: >
      Reading this column as a number is the single most damaging mistake
      available in this dataset: it turns an 18-year-old into 4018 and a
      nine-month-old into 3009, and a naive mean age comes out in the
      thousands. Decode the leading digit first. Note also that the published
      base excludes records with age of one year or under, so infants are
      absent by construction rather than by rarity. The bound FXIDAD*/IDADEDET
      tables are TabNet age-band recodes of this composite, not a value
      dictionary for it.

  ANO_NASC:
    official_name: Ano de Nascimento
    translated_name: Year of birth
    description: >
      Four-digit year of birth. The form itself collects a full date of birth
      (DT_NASC); the disseminated file replaces it with the year alone because
      the Ministry classifies the full date as sensitive personal data. This is
      the only birth information published, so exact ages cannot be
      reconstructed from this file.
    code_system: none
    notes: >
      Appended at the end of the record, after the CD_* block, rather than in
      the position DT_NASC occupies on the form — a sign it is added during the
      export rather than captured on the ficha.

  CS_SEXO:
    official_name: Sexo ao nascimento
    translated_name: Sex at birth
    description: >
      Biological sex recorded at birth, as reported at notification. The form
      offers only Masculino and Feminino — there is no ignored/other category
      here, so blanks are missing data rather than an "unknown" response.
    code_system: none
    notes: >
      C(9) holding the label ("Masculino"), not SINAN's 1/2/9 code. The catalog
      binds the CS_SEXO code table; matching on 1/2/9 returns nothing.

  CS_RACA:
    official_name: Raça/cor
    translated_name: Race/colour
    description: >
      Race/colour as declared by the patient, in the IBGE five-category scheme
      (branca, preta, parda, amarela, indígena) plus ignorado. Self-declared at
      the notifying service, not assigned by the notifier.
    code_system: none
    notes: >
      C(8) holding the label with accents stripped ("Indigena"), not SINAN's
      1-5/9 code, to which the catalog nevertheless binds CS_RACA.

  CS_ESCOL_N:
    official_name: Escolaridade
    translated_name: Educational attainment
    description: >
      Highest school stage the patient was attending or had completed with
      approval at the time of notification, on the e-SUS Notifica scale
      (nenhuma, EF incompleto, EF completo, EM incompleto, EM completo,
      superior) plus não se aplica and ignorado.
    code_system: none
    notes: >
      This is a coarser scale than SINAN's classic nine-level CS_ESCOL_N and
      the categories are not interchangeable with it. Values are label text in
      a C(13) column.

  CS_GESTANT:
    official_name: Gestante (no ano de notificação)
    translated_name: Pregnancy status in the notification year
    description: >
      Whether the patient was pregnant during the notification year and, if so,
      the trimester at notification. Mandatory when CS_SEXO is Feminino.
    code_system: none
    depends_on: [CS_SEXO, MO_SUSPEIT]
    notes: >
      Blanked during export where the record says pregnant, the patient is over
      70, and the case did not enter through pre-natal care — so a blank here
      can mean "cleaned as implausible" rather than "not asked".

  ID_OCUPA_N:
    official_name: Ocupação (CBO)
    translated_name: Occupation (CBO)
    description: >
      Patient's occupation, drawn from the CBO-2002 *família* level (the
      four-digit occupational family), not the full six-digit CBO occupation.
      Resolution is therefore coarser than CBO-coded fields elsewhere in
      DATASUS.
    code_system: none
    notes: >
      C(85), carrying the família name as text; the numeric CBO code is not
      present in this file, so joining to a CBO table means matching on
      accent-stripped names.

  # ------------------------------------------------------------- where they live

  SG_UF:
    official_name: Estado de Residência
    translated_name: State of residence
    description: >
      State where the patient lived at notification. For people without an
      address (the form names "morador de rua, cigano ou análogo") this is
      filled with the place of notification instead, and for foreign nationals
      with the address where they are staying — so it is not always a residence.
    code_system: none
    notes: >
      C(19) holding the state name spelled out ("Nome do estado" per the
      dictionary), not the sigla. The catalog binds the SG_UF sigla/code table.

  ID_MN_RESI:
    official_name: Município de Residência
    translated_name: Municipality of residence
    description: >
      Municipality of residence at notification, as a name. Same substitution
      rules as SG_UF: place of notification for people with no address, place
      of stay for foreign nationals. CD_MN_RESI carries the IBGE code, and
      MN_RESI_TF supersedes this if the patient later moved.
    code_system: none
    depends_on: [CD_MN_RESI, MN_RESI_TF]

  SG_PAIS:
    official_name: País de residência
    translated_name: Country of residence
    description: >
      Country where the patient was living at notification — as opposed to
      ID_PAIS, the country they originally came from. Mandatory for foreign
      nationals.
    code_system: none
    depends_on: [ID_ESTRANG]
    notes: >
      Documented as ISO-coded but declared C(7) and carrying name text with
      accents stripped.

  UF_NASC:
    official_name: UF de Nascimento do paciente
    translated_name: State of birth
    description: >
      State where the patient was born. In a disease whose transmission is
      strongly regional and whose chronic phase presents decades later, this is
      often a better clue to where infection happened than the state of
      residence.
    code_system: none
    notes: State name text in C(19), not the sigla.

  MUN_NASC:
    official_name: Município de Nascimento do paciente
    translated_name: Municipality of birth
    description: >
      Municipality of birth, as a name; CD_MUN_NAS holds the IBGE code. Marked
      "campo essencial" rather than mandatory, so it is incomplete by design.
    code_system: none
    depends_on: [CD_MUN_NAS]

  COUFINF:
    official_name: UF de Infecção (provável da fonte de infecção)
    translated_name: State of probable infection
    description: >
      State where the patient is judged to have been infected. In chronic
      Chagas this is a retrospective judgement made at notification, often
      decades after the event and frequently inferred from where the patient
      grew up — treat it as an epidemiological opinion, not an observation.
    code_system: none
    notes: >
      The dictionary says this holds the state sigla, but the column is C(19),
      the same width as the other state-name columns. The catalog binds the
      UFSIGLA/UFCSIGLA tables; verify before joining on either.

  COMUNINF:
    official_name: Município Provável de Infecção
    translated_name: Municipality of probable infection
    description: >
      Municipality where the patient was probably infected, as a name, with
      CD_COMUNIN carrying the IBGE code. Same retrospective-judgement caveat as
      COUFINF.
    code_system: none
    depends_on: [CD_COMUNIN]

  # ------------------------------------------------------------- notification

  DT_NOTIFIC:
    official_name: Data da Notificação
    translated_name: Notification date
    description: >
      Date the ficha was filled in. This is an administrative date; in chronic
      Chagas it can trail the actual diagnosis by many years, because the form
      was created in 2023 and existing patients were notified retrospectively —
      ANO_DIAG, not this, is the year of diagnosis.
    code_system: none
    depends_on: [ANO_DIAG, DT_CRIACAO]
    notes: >
      For records whose notification year was earlier than 2023 the export
      overwrites this with the date the ficha was created in the system,
      because the form did not exist before 2023 and earlier dates were
      inconsistent. Counting notifications by this date therefore measures
      data-entry activity for the retrospective backlog, not case detection.

  ANO_DIAG:
    official_name: Ano provável do diagnóstico
    translated_name: Probable year of diagnosis
    description: >
      Four-digit year of the patient's *first* Chagas diagnosis. Where the
      record is a retrospective notification and the true year is unknown, the
      notifier is instructed to estimate a probable year, so the column mixes
      recorded and estimated years with no flag distinguishing them.
    code_system: none
    notes: >
      Blanked during export where the diagnosis year is earlier than the birth
      year or is not four digits, so blanks include cleaned-away impossible
      values as well as genuinely unknown ones.

  MO_SUSPEIT:
    official_name: Modo de suspeição
    translated_name: Route of case detection
    description: >
      The door through which the case entered — where the first suspicion arose
      and diagnosis was requested. The options span organ-donor screening,
      transplant recipients, blood banks, antenatal care, primary-care
      screening, several kinds of active case-finding (chart review, family
      contacts, follow-up of a triatomine bug found in the dwelling), walk-in
      demand at a UBS or specialised hospital, HIV/aids services, and death
      investigation committees.
    code_system: none
    notes: >
      This column decides which follow-up location block is mandatory:
      screening/primary-care/family routes require the UBS fields
      (UF_UBS_AC, MUN_UBS_AC), while donor, transplant, specialised-hospital
      and HIV/aids routes require the specialised-service fields (HOSP_ESP,
      UF_HOSPESP, MUN_ESP). It is also the strongest confounder in this
      dataset: case counts by municipality largely reflect which screening
      programmes are running, not underlying prevalence. Label text in C(53);
      the "Rastreamento/Busca ativa" grouping survives only for legacy records.

  # --------------------------------------------------------------- laboratory

  EIE_IGG:
    official_name: Sorologia (IgG) – Ensaio Imunoenzimático (EIE) (ELISA)
    translated_name: ELISA IgG serology result
    description: >
      Result of the anti-T. cruzi IgG enzyme immunoassay: reagente, não
      reagente, inconclusivo, não realizado, or sem informação. Chronic Chagas
      is confirmed on two reagent serological tests using different methods or
      antigen preparations, so this column is read together with IFI_IGG,
      HAI_IGG and QUIMIO_IGG rather than alone.
    code_system: none
    notes: >
      "Não realizado" and "Sem informação" are different answers — the first
      says the test was not done, the second that the notifier does not know.
      Both are non-blank. Label text in C(14).

  IFI_IGG:
    official_name: Sorologia (IgG) – IFI-Imunofluorescência
    translated_name: Indirect immunofluorescence IgG result
    description: >
      Result of the indirect immunofluorescence assay for anti-T. cruzi IgG,
      on the same five-answer scale as EIE_IGG. One of the methods that can
      supply the second confirmatory result.
    code_system: none

  HAI_IGG:
    official_name: Sorologia (IgG) – HAI-Hemaglutinação
    translated_name: Indirect haemagglutination IgG result
    description: >
      Result of the indirect haemagglutination assay for anti-T. cruzi IgG, on
      the same five-answer scale as EIE_IGG.
    code_system: none

  QUIMIO_IGG:
    official_name: Sorologia (IgG) – Quimioluminescência
    translated_name: Chemiluminescence IgG result
    description: >
      Result of the chemiluminescent immunoassay (CMIA) for anti-T. cruzi IgG,
      on the same five-answer scale as EIE_IGG.
    code_system: none

  PCR:
    official_name: PCR detectável?
    translated_name: PCR detectable
    description: >
      Whether T. cruzi DNA was detected by PCR, if PCR was performed. PCR is
      not part of the confirmatory definition for the chronic phase — parasite
      load is low and intermittent then — so a negative PCR does not rule out
      chronic infection.
    code_system: none
    notes: Three answers in C(13) as text — Sim, Nao, Nao realizado.

  OUTRO_POSI:
    official_name: Outros exames positivos?
    translated_name: Other positive Chagas tests
    description: >
      Whether some other Chagas test not covered by the four serology columns
      or PCR returned a positive result.
    code_system: none

  # ------------------------------------------------------- follow-up location

  AC_NOT:
    official_name: A Unidade de Saúde de acompanhamento é a mesma de notificação?
    translated_name: Follow-up unit same as notifying unit
    description: >
      Whether the service now following the case is the same one that notified
      it. When it is not, the UBS or specialised-service location columns
      identify where follow-up actually happens.
    code_system: none
    notes: >
      Also used as a de-duplication tiebreaker by the technical area: where
      duplicate notifications exist, the one with AC_NOT filled is the one
      kept, so this column's completeness is not independent of which rows
      survived into the published base.

  UF_UBS_AC:
    official_name: UF da UBS de acompanhamento do caso
    translated_name: State of the follow-up primary-care unit
    description: >
      State of the primary-care unit (UBS) following the case, filled when
      follow-up is not at the notifying unit. Mandatory only for the screening,
      antenatal, primary-care, family-contact, triatomine-follow-up and
      walk-in-UBS detection routes.
    code_system: none
    depends_on: [MO_SUSPEIT, AC_NOT]

  MUN_UBS_AC:
    official_name: Município da UBS de acompanhamento do caso
    translated_name: Municipality of the follow-up primary-care unit
    description: >
      Municipality of the UBS following the case, as a name; CD_MUN_UBS carries
      the IBGE code. Same conditional-fill rule as UF_UBS_AC.
    code_system: none
    depends_on: [MO_SUSPEIT, AC_NOT, CD_MUN_UBS]

  HOSP_ESP:
    official_name: Está sendo acompanhado em Hospital/Serviço especializado?
    translated_name: Followed at a specialised hospital or service
    description: >
      Whether the case is being followed in a hospital or specialised
      outpatient service rather than primary care. Mandatory for the donor
      screening, transplant recipient, specialised-hospital walk-in and
      HIV/aids service detection routes.
    code_system: none
    depends_on: [MO_SUSPEIT]

  UF_HOSPESP:
    official_name: Estado Hospital/Serviço Especializado
    translated_name: State of the specialised hospital or service
    description: >
      State of the hospital or specialised service following the case.
    code_system: none
    depends_on: [MO_SUSPEIT, HOSP_ESP]

  MUN_ESP:
    official_name: Município Hospital/Serviço Especializado
    translated_name: Municipality of the specialised hospital or service
    description: >
      Municipality of the hospital or specialised service following the case,
      as a name; CD_MUN_ESP carries the IBGE code.
    code_system: none
    depends_on: [MO_SUSPEIT, HOSP_ESP, CD_MUN_ESP]

  # ----------------------------------------------------- complementary exams

  ELETROCARD:
    official_name: Exames complementares – Eletrocardiograma
    translated_name: Electrocardiogram result
    description: >
      Whether the ECG was altered, normal, or not performed. The ECG is the
      workhorse test for detecting the cardiac form of chronic Chagas, so
      "alterado" here is what usually drives a cardiac entry in FORMA.
    code_system: none
    depends_on: [FORMA]
    notes: >
      Records only whether the tracing was abnormal, not what the abnormality
      was — no conduction defect or arrhythmia detail is carried.

  RX_TORAX:
    official_name: Exames complementares – RX tórax
    translated_name: Chest X-ray result
    description: >
      Whether the chest radiograph was altered, normal, or not performed;
      cardiomegaly is the finding it is aimed at.
    code_system: none

  RX_COLON:
    official_name: Exames complementares – RX cólon
    translated_name: Colon X-ray result
    description: >
      Whether the contrast colon radiograph was altered, normal, or not
      performed. It is the test for megacolon, one half of the digestive form
      of chronic Chagas.
    code_system: none

  RX_ESOFAGO:
    official_name: Exames complementares – RX Esôfago
    translated_name: Oesophagus X-ray result
    description: >
      Whether the contrast oesophageal radiograph was altered, normal, or not
      performed. It is the test for megaoesophagus, the other half of the
      digestive form.
    code_system: none

  ECOCARDIO:
    official_name: Exames complementares – Ecocardiograma
    translated_name: Echocardiogram result
    description: >
      Whether the echocardiogram was altered, normal, or not performed. Used to
      separate advanced cardiac disease (ventricular dysfunction) from the
      milder cardiac form.
    code_system: none

  OUTRO_EXAM:
    official_name: Exames complementares – Outros
    translated_name: Other complementary exam result
    description: >
      Whether some other complementary exam was altered, normal, or not
      performed. Which exam it was is written in EXAME_DESC.
    code_system: none
    depends_on: [EXAME_DESC]

  EXAME_DESC:
    official_name: Exames complementares – Outros - descrever
    translated_name: Other complementary exam, described
    description: >
      Free-text description of the other complementary exam counted in
      OUTRO_EXAM. Required when OUTRO_EXAM is altered or normal.
    code_system: none
    source_ref: /dissemin/publicos/ESUSNOTIFICA/DOCS/Dicionario_de_Dados_Doenca_de_Chagas_Cronica.pdf
    modifies: OUTRO_EXAM
    notes: >
      Operator-typed free text in a C(254) field, upper-case and unaccented by
      form rule. Not a controlled vocabulary — expect spelling variants and
      abbreviations.

  # ------------------------------------------------------------ comorbidities

  COMORBID:
    official_name: Comorbidades
    translated_name: Any comorbidity present
    description: >
      The comorbidity question on the ficha — whether the patient had any
      already-identified comorbidity at notification. The eight columns that
      follow it (HIV through OUT_COMORB) record which ones.
    code_system: none
    source_ref: /dissemin/publicos/ESUSNOTIFICA/DOCS/Dicionario_de_Dados_Doenca_de_Chagas_Cronica.pdf
    notes: >
      Do not treat this as a boolean without looking at it first. The data
      dictionary types it Sim/Não, but the column is declared C(117) — far too
      wide for that — and the Nota Informativa says the export splits
      comorbidities into the separate per-category columns. The most likely
      reading is that this retains the raw multi-select answer while the split
      columns carry the parsed result, but that is not documented anywhere.
      It is also the one column in this dataset that the Nota Informativa's
      list of published fields omits entirely.

  HIV:
    official_name: Comorbidades - HIV/aids
    translated_name: Comorbidity — HIV/aids
    description: >
      Whether HIV/aids was among the comorbidities identified at notification.
      Clinically load-bearing here rather than incidental: immunosuppression is
      what allows chronic Chagas to reactivate, and HIV/aids services are
      themselves one of the detection routes in MO_SUSPEIT.
    code_system: none
    depends_on: [REATIVACAO]
    notes: >
      "Sim"/"Nao" as text in C(3). The catalog binds SINAN's numeric SIM_NAO
      codelist; those codes do not occur.

  HIPERTEN:
    official_name: Comorbidades - Hipertensão
    translated_name: Comorbidity — hypertension
    description: >
      Whether hypertension was among the comorbidities identified at
      notification. It confounds the cardiac-form assessment, since
      hypertensive heart disease produces ECG and echo abnormalities of its own.
    code_system: none
    notes: >
      "Sim"/"Nao" as text in C(3). Unlike its seven sibling columns, this one
      has no SIM_NAO codelist bound in the catalog.

  HEPATITE:
    official_name: Comorbidades - Hepatite crônica
    translated_name: Comorbidity — chronic hepatitis
    description: >
      Whether chronic hepatitis was among the comorbidities identified at
      notification. Relevant to treatment because benznidazole and nifurtimox
      are both hepatically handled.
    code_system: none
    notes: '"Sim"/"Nao" as text in C(3), not the bound SIM_NAO numeric codes.'

  DIABETES:
    official_name: Comorbidades - Diabetes
    translated_name: Comorbidity — diabetes
    description: >
      Whether diabetes was among the comorbidities identified at notification.
    code_system: none
    notes: '"Sim"/"Nao" as text in C(3), not the bound SIM_NAO numeric codes.'

  CARDIOPAT:
    official_name: Comorbidades - Cardiopatia de outra etiologia
    translated_name: Comorbidity — heart disease of other aetiology
    description: >
      Whether the patient had heart disease attributable to something other
      than Chagas. This is the column that keeps FORMA honest: a cardiac
      finding in a patient flagged here may not be Chagas cardiomyopathy at all.
    code_system: none
    depends_on: [FORMA]
    notes: '"Sim"/"Nao" as text in C(3), not the bound SIM_NAO numeric codes.'

  NEOPLASIA:
    official_name: Comorbidades - Neoplasias/Outras condições de imunossupressão
    translated_name: Comorbidity — neoplasia or other immunosuppression
    description: >
      Whether a neoplasm or another immunosuppressive condition was identified.
      Grouped with immunosuppression rather than listed as cancer alone because
      what matters for Chagas is the reactivation risk.
    code_system: none
    depends_on: [REATIVACAO]
    notes: '"Sim"/"Nao" as text in C(3), not the bound SIM_NAO numeric codes.'

  LEISHMANIA:
    official_name: Comorbidades - Leishmaniose
    translated_name: Comorbidity — leishmaniasis
    description: >
      Whether leishmaniasis was identified as a comorbidity. Beyond
      co-endemicity, Leishmania and T. cruzi are related trypanosomatids and
      cross-reactivity is a recognised source of false-reagent Chagas serology,
      so this column bears on how EIE_IGG and its siblings should be read.
    code_system: none
    depends_on: [EIE_IGG]
    notes: '"Sim"/"Nao" as text in C(3), not the bound SIM_NAO numeric codes.'

  OUT_COMORB:
    official_name: Comorbidades - Outras
    translated_name: Comorbidity — other
    description: >
      Whether some comorbidity outside the seven named categories was
      identified. On the form this opens a free-text box (ESP_COMORB), which is
      not published in this file — so the "other" cases cannot be resolved into
      actual conditions here.
    code_system: none
    notes: '"Sim"/"Nao" as text in C(3), not the bound SIM_NAO numeric codes.'

  # ------------------------------------------------------------ clinical form

  FORMA:
    official_name: Forma Clínica
    translated_name: Clinical form
    description: >
      Clinical form of chronic Chagas identified at notification: indeterminada
      (seropositive, no cardiac or digestive involvement detected), cardíaca
      leve/moderada, cardíaca avançada, digestiva, cardiodigestiva, or em
      investigação.
    code_system: none
    depends_on: [ELETROCARD, ECOCARDIO, RX_COLON, RX_ESOFAGO]
    notes: >
      This is the form *at the moment of notification*, not a final
      classification — "em investigação" means the workup was unfinished, and
      the indeterminate form can progress for decades afterwards. The
      notification is not updated as the patient's disease evolves, so this
      column cannot be used to study progression. Label text in C(22).

  REATIVACAO:
    official_name: Ocorreu episódio de reativação (reagudização)
    translated_name: Reactivation episode occurred
    description: >
      Whether the chronic infection reactivated — reverted to a patent,
      acute-like parasitaemia — between diagnosis and closure of the
      notification. Reactivation happens in immunosuppressed patients, so this
      column is read against HIV and NEOPLASIA.
    code_system: none
    depends_on: [HIV, NEOPLASIA]

  # -------------------------------------------------------------- treatment

  HIST_BNZ:
    official_name: Tem histórico de tratamento anterior com Benznidazol?
    translated_name: Prior benznidazole treatment
    description: >
      Whether the patient had already been treated with benznidazole before
      this notification — asked because many notified cases are long-standing
      patients being registered retrospectively, not new diagnoses. Distinct
      from TRAT_BNZ, which is a current prescription.
    code_system: none
    depends_on: [TRAT_BNZ]

  TRAT_BNZ:
    official_name: Prescrições atuais - Tratamento específico 1ª linha, Benznidazol (BNZ)
    translated_name: Benznidazole prescribed now
    description: >
      Whether benznidazole — the first-line trypanocidal drug — was prescribed
      at the moment of notification. It gates the BNZ dose, duration and
      adverse-reaction columns.
    code_system: none

  BNZ_TOT_CP:
    official_name: Benznidazol (BNZ) - Total de comprimidos
    translated_name: Benznidazole tablets prescribed
    description: >
      Total tablets of benznidazole in the current prescription.
    code_system: none
    depends_on: [TRAT_BNZ, BNZ_DIAS]
    notes: >
      The dictionary specifies four digits but the column is declared C(3), so
      prescriptions of a thousand tablets or more cannot be represented as
      written. Tablet strength is not recorded anywhere in the file, so tablets
      do not convert to milligrams.

  BNZ_DIAS:
    official_name: Benznidazol (BNZ) - Nº dias de tratamento
    translated_name: Benznidazole treatment days
    description: >
      Days of benznidazole treatment in the current prescription. Standard
      chronic-phase courses run 60 days, so this is a compliance-relevant
      column rather than a formality.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: >
      This is the prescribed duration recorded at notification, not the
      duration actually completed — the ficha is not revisited to correct it.

  TRAT_NFX:
    official_name: Prescrições atuais - Tratamento específico 2ª linha, Nifurtimox (NFX)
    translated_name: Nifurtimox prescribed now
    description: >
      Whether nifurtimox — the second-line trypanocidal drug, used when
      benznidazole is not tolerated or not available — was prescribed at
      notification.
    code_system: none

  NFX_TOT_CP:
    official_name: Nifurtimox (NFX) - Total de comprimidos
    translated_name: Nifurtimox tablets prescribed
    description: >
      Total tablets of nifurtimox in the current prescription.
    code_system: none
    depends_on: [TRAT_NFX, NFX_DIAS]
    notes: >
      Declared C(3) although the dictionary specifies four digits, and tablet
      strength is not recorded, so this does not convert to a dose.

  NFX_DIAS:
    official_name: Nifurtimox (NFX) - Nº dias de tratamento
    translated_name: Nifurtimox treatment days
    description: >
      Days of nifurtimox treatment in the current prescription.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: >
      Declared N(1,0) — a degenerate single-digit numeric where a three-digit
      field is specified. A column collapsed to this width in a DBF export
      normally carries nothing at all, so treat it as empty until proven
      otherwise.

  # ------------------------------------------ adverse reactions: benznidazole

  ADVERS_BNZ:
    official_name: Apresentou reações adversas ao BNZ? Sem reações
    translated_name: Benznidazole — no adverse reaction
    description: >
      The "no adverse reactions" box of the benznidazole reaction question. It
      is one option in a multi-select set, not a summary of the others: the set
      as a whole is answered by ticking any combination of ADVERS_BNZ,
      BNZ_LEVE, BNZ_GRAVE, BNZ_AUGESI, BNZ_PAREST, BNZ_DEPRE, BNZ_GASTRO,
      BNZ_ARTRAL and REAC_BNZ.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: >
      Each box in this set is its own column, and C(11) here is exactly the
      length of the label "Sem reacoes" — the column holds that text when
      ticked and is blank when not. A blank therefore means "not ticked", which
      is not the same as "no reaction"; that is what this column says. Counting
      any of these as a yes/no code will fail.

  BNZ_LEVE:
    official_name: Apresentou reações adversas ao BNZ? Dermopatia leve/moderada
    translated_name: Benznidazole — mild/moderate dermopathy
    description: >
      Mild-to-moderate skin reaction to benznidazole. Rash is the commonest
      benznidazole adverse effect and the usual reason a course is interrupted.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: C(24) holding the label text when ticked, blank when not.

  BNZ_GRAVE:
    official_name: Apresentou reações adversas ao BNZ? Dermopatia grave
    translated_name: Benznidazole — severe dermopathy
    description: >
      Severe skin reaction to benznidazole — the grade that ends treatment
      rather than pausing it.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: C(16) holding the label text when ticked, blank when not.

  BNZ_AUGESI:
    official_name: Apresentou reações adversas ao BNZ? Ageusia
    translated_name: Benznidazole — ageusia
    description: >
      Loss of taste during benznidazole treatment.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: >
      The column name is a transposition of "ageusia"; the NFX counterpart is
      spelled NFX_AGEUSI. C(7) holding the label when ticked, blank when not.

  BNZ_PAREST:
    official_name: Apresentou reações adversas ao BNZ? Parestesias
    translated_name: Benznidazole — paraesthesia
    description: >
      Paraesthesia during benznidazole treatment — the peripheral neuropathy
      that is the drug's characteristic late toxicity.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: C(11) holding the label text when ticked, blank when not.

  BNZ_DEPRE:
    official_name: Apresentou reações adversas ao BNZ? Depressão med. óssea
    translated_name: Benznidazole — bone-marrow suppression
    description: >
      Bone-marrow depression during benznidazole treatment — the most dangerous
      of the listed reactions.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: >
      Declared N(1,0) rather than the C(22) its label would need, unlike every
      other box in this set. A DBF column collapsed to a single numeric digit
      normally holds nothing, so treat this as empty rather than as zero
      reactions.

  BNZ_GASTRO:
    official_name: Apresentou reações adversas ao BNZ? Intolerância gastrointestinal
    translated_name: Benznidazole — gastrointestinal intolerance
    description: >
      Gastrointestinal intolerance during benznidazole treatment.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: C(29) holding the label text when ticked, blank when not.

  BNZ_ARTRAL:
    official_name: Apresentou reações adversas ao BNZ? Artralgias
    translated_name: Benznidazole — arthralgia
    description: >
      Joint pain during benznidazole treatment.
    code_system: none
    depends_on: [TRAT_BNZ]
    notes: C(10) holding the label text when ticked, blank when not.

  REAC_BNZ:
    official_name: Apresentou reações adversas ao BNZ? Outras
    translated_name: Benznidazole — other adverse reaction
    description: >
      An adverse reaction to benznidazole outside the eight named categories.
      Despite the generic name, this is the "Outras" box of the same
      multi-select set, not a summary flag for the set.
    code_system: none
    depends_on: [TRAT_BNZ, BNZ_OUTRAS]
    notes: >
      C(6) — the length of "Outras". Easy to mistake for an overall
      benznidazole-reaction indicator because of the name; it is not one.

  BNZ_OUTRAS:
    official_name: Apresentou reações adversas ao BNZ? Outras - descrever
    translated_name: Benznidazole — other reaction, described
    description: >
      Free-text description of the other benznidazole reaction ticked in
      REAC_BNZ. Required when that box is selected.
    code_system: none
    source_ref: /dissemin/publicos/ESUSNOTIFICA/DOCS/Dicionario_de_Dados_Doenca_de_Chagas_Cronica.pdf
    modifies: REAC_BNZ
    notes: Operator-typed free text in C(254), upper-case and unaccented by form rule.

  # --------------------------------------------- adverse reactions: nifurtimox

  ADVERS_NFX:
    official_name: Apresentou reações adversas ao NFX? Sem reações
    translated_name: Nifurtimox — no adverse reaction
    description: >
      The "no adverse reactions" box of the nifurtimox reaction question, one
      option in the multi-select set that runs from here through REAC_NFX.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: >
      Same structure as the benznidazole set: C(11) holding "Sem reacoes" when
      ticked, blank when not. Blank means unticked, not "no reaction".

  NFX_LEVE:
    official_name: Apresentou reações adversas ao NFX? Dermopatia leve/moderada
    translated_name: Nifurtimox — mild/moderate dermopathy
    description: Mild-to-moderate skin reaction to nifurtimox.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: C(24) holding the label text when ticked, blank when not.

  NFX_GRAVE:
    official_name: Apresentou reações adversas ao NFX? Dermopatia grave
    translated_name: Nifurtimox — severe dermopathy
    description: Severe skin reaction to nifurtimox.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: C(16) holding the label text when ticked, blank when not.

  NFX_AGEUSI:
    official_name: Apresentou reações adversas ao NFX? Ageusia
    translated_name: Nifurtimox — ageusia
    description: Loss of taste during nifurtimox treatment.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: C(7) holding the label text when ticked, blank when not.

  NFX_PAREST:
    official_name: Apresentou reações adversas ao NFX? Parestesias
    translated_name: Nifurtimox — paraesthesia
    description: Paraesthesia during nifurtimox treatment.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: C(11) holding the label text when ticked, blank when not.

  NFX_MEDULA:
    official_name: Apresentou reações adversas ao NFX? Depressão medula óssea
    translated_name: Nifurtimox — bone-marrow suppression
    description: Bone-marrow depression during nifurtimox treatment.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: >
      Declared N(1,0) rather than a character field wide enough for its label,
      exactly like its benznidazole counterpart BNZ_DEPRE — most likely an
      empty column in the published extract.

  NFX_GASTRO:
    official_name: Apresentou reações adversas ao NFX? Intolerância gastrointestinal
    translated_name: Nifurtimox — gastrointestinal intolerance
    description: Gastrointestinal intolerance during nifurtimox treatment.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: C(29) holding the label text when ticked, blank when not.

  NFX_ARTRAL:
    official_name: Apresentou reações adversas ao NFX? Artralgias
    translated_name: Nifurtimox — arthralgia
    description: Joint pain during nifurtimox treatment.
    code_system: none
    depends_on: [TRAT_NFX]
    notes: C(10) holding the label text when ticked, blank when not.

  REAC_NFX:
    official_name: Apresentou reações adversas ao NFX? Outras
    translated_name: Nifurtimox — other adverse reaction
    description: >
      An adverse reaction to nifurtimox outside the eight named categories —
      the "Outras" box of the multi-select set, not a summary flag.
    code_system: none
    depends_on: [TRAT_NFX, NFX_OUTRAS]
    notes: C(6) — the length of "Outras". Not an overall reaction indicator.

  NFX_OUTRAS:
    official_name: Apresentou reações adversas ao NFX? Outras - descrever
    translated_name: Nifurtimox — other reaction, described
    description: >
      Free-text description of the other nifurtimox reaction ticked in
      REAC_NFX.
    code_system: none
    source_ref: /dissemin/publicos/ESUSNOTIFICA/DOCS/Dicionario_de_Dados_Doenca_de_Chagas_Cronica.pdf
    modifies: REAC_NFX
    notes: Operator-typed free text in C(254), upper-case and unaccented by form rule.

  # ------------------------------------------------- family and active search

  HIST_EPID:
    official_name: Nº de Familiares (vivos) com história epidemiológica COM diagnóstico prévio e confirmado de doença de Chagas
    translated_name: Living relatives already diagnosed with Chagas
    description: >
      How many living relatives sharing the patient's epidemiological history
      already had a previous, confirmed Chagas diagnosis. Chagas clusters in
      households because transmission is domestic, so this is a case-finding
      lead rather than a demographic detail.
    code_system: none
    notes: >
      Not a free integer. The form offers "Sem informação" plus the
      zero-padded values 00 to 10 only, and the column is C(14) — wide enough
      for the words "Sem informacao" — so it holds text, and 10 is a ceiling
      rather than an observed maximum. The DBF name is truncated from the
      dictionary's HIST_EPIDE.

  BUSCAATIVA:
    official_name: Realizada busca ativa?
    translated_name: Active case-finding performed
    description: >
      Whether active case-finding among the patient's relatives was carried out
      from this index case. It gates the three family-outcome columns that
      follow.
    code_system: none

  DIAG_FAMIL:
    official_name: Nº de Familiares com história epidemiológica SEM diagnóstico prévio de doença de Chagas
    translated_name: Relatives identified without a prior diagnosis
    description: >
      How many relatives in the same epidemiological context the patient
      identified as having no previous Chagas diagnosis — the pool that active
      case-finding is supposed to reach. "Family" is defined broadly on the
      form: people linked by blood, kinship, domestic dependence or shared
      living arrangements in the same household.
    code_system: none
    depends_on: [BUSCAATIVA]
    notes: >
      Categorical text, not an integer: "Sem informação" or 00 through 10, in a
      C(14) field. The chain DIAG_FAMIL → EXAM_FAMIL → CONF_FAMIL is the
      case-finding funnel — identified, examined, confirmed — and each step is
      capped at 10.

  EXAM_FAMIL:
    official_name: Nº de Familiares com realização de exames para doença de Chagas, após busca ativa
    translated_name: Relatives tested after active case-finding
    description: >
      How many relatives were actually tested for Chagas as a result of the
      active search — the second step of the case-finding funnel, and the one
      that measures whether the search reached anyone.
    code_system: none
    depends_on: [BUSCAATIVA, DIAG_FAMIL]
    notes: 'Categorical text in C(14): "Sem informação" or 00 through 10.'

  CONF_FAMIL:
    official_name: Nº de Familiares confirmados para doença de Chagas, após busca ativa
    translated_name: Relatives confirmed after active case-finding
    description: >
      How many of the tested relatives were confirmed as having Chagas — the
      yield of the active search from this index case.
    code_system: none
    depends_on: [BUSCAATIVA, EXAM_FAMIL]
    notes: >
      Categorical text in C(14): "Sem informação" or 00 through 10. These
      relatives are counted here but are not themselves rows in this file
      unless separately notified, so summing this column does not give a case
      count and will double-count relatives shared between index cases.

  # ------------------------------------------------------ changes in follow-up

  TF_RESIDEN:
    official_name: Transferência de residência?
    translated_name: Change of residence during follow-up
    description: >
      Whether the patient moved to a different state or municipality during
      follow-up. When yes, UF_RESI_TF and MN_RESI_TF hold the current
      residence and SG_UF/ID_MN_RESI become historical.
    code_system: none
    depends_on: [UF_RESI_TF, MN_RESI_TF]

  UF_RESI_TF:
    official_name: Novo Estado de Residência
    translated_name: New state of residence
    description: >
      State the patient moved to during follow-up. Supersedes SG_UF for
      questions about where the patient is now, but not for where they were at
      notification.
    code_system: none
    depends_on: [TF_RESIDEN]

  MN_RESI_TF:
    official_name: Novo Município de Residência
    translated_name: New municipality of residence
    description: >
      Municipality the patient moved to during follow-up, as a name;
      CD_MN_RES0 carries the IBGE code.
    code_system: none
    depends_on: [TF_RESIDEN, CD_MN_RES0]
    notes: >
      Declared N(1,0) — a single-digit numeric where the dictionary specifies a
      municipality name — as is its code companion CD_MN_RES0. Both are almost
      certainly empty in the published extract.

  MUD_UBS_AC:
    official_name: Mudança de UBS de acompanhamento?
    translated_name: Change of follow-up primary-care unit
    description: >
      Whether the patient changed the primary-care unit following the case
      during the investigation.
    code_system: none
    depends_on: [UF_NOV_AC, MUN_NOV_AC]

  UF_NOV_AC:
    official_name: UF da nova UBS de acompanhamento do caso
    translated_name: State of the new follow-up primary-care unit
    description: >
      State of the UBS the patient moved to for follow-up.
    code_system: none
    depends_on: [MUD_UBS_AC]

  MUN_NOV_AC:
    official_name: Município da nova UBS de acompanhamento do caso
    translated_name: Municipality of the new follow-up primary-care unit
    description: >
      Municipality of the UBS the patient moved to for follow-up, as a name;
      CD_MUN_NOV carries the IBGE code.
    code_system: none
    depends_on: [MUD_UBS_AC, CD_MUN_NOV]

  NOVO_ESPEC:
    official_name: Houve Alteração de Ambulatório Especializado ou Hospital?
    translated_name: Change of specialised service or hospital
    description: >
      Whether the specialised outpatient service or hospital caring for the
      patient changed during follow-up. The specialised-service counterpart of
      MUD_UBS_AC.
    code_system: none
    depends_on: [ANT_UF_ESP, ANT_MUN]

  ANT_UF_ESP:
    official_name: Estado da nova unidade
    translated_name: State of the new specialised unit
    description: >
      State of the specialised service or hospital now caring for the patient,
      filled when NOVO_ESPEC says the service changed.
    code_system: none
    depends_on: [NOVO_ESPEC]
    notes: >
      The ANT_ prefix reads as "anterior" but this is the *new* unit, not the
      previous one — the dictionary is explicit that it is where the patient is
      followed after the change.

  ANT_MUN:
    official_name: Município da nova unidade
    translated_name: Municipality of the new specialised unit
    description: >
      Municipality of the specialised service or hospital now caring for the
      patient, as a name; CD_ANT_MUN carries the IBGE code.
    code_system: none
    depends_on: [NOVO_ESPEC, CD_ANT_MUN]
    notes: >
      As with ANT_UF_ESP, this is the new unit despite the ANT_ prefix.

  # ------------------------------------------------------------------ closure

  ST_ENCERRA:
    official_name: Situação de encerramento
    translated_name: Case closure status
    description: >
      How the notification was closed: still under clinical follow-up, death
      from Chagas disease, death from other causes, abandonment, or
      cancelled/excluded.
    code_system: none
    depends_on: [DT_ENCERRA, DT_OBITO]
    notes: >
      Cancelled records are removed from the published base, so the
      "Cancelado/Excluir" category should not appear here at all — its presence
      in the category list is a property of the source system, not of this
      file. Deaths recorded here are notification outcomes, not certified
      causes of death; SIM is the authority for that.

  DT_OBITO:
    official_name: Data do Óbito
    translated_name: Date of death
    description: >
      Date the patient died, required when the case was closed as a death from
      Chagas or from other causes.
    code_system: none
    depends_on: [ST_ENCERRA]
    notes: >
      Blanked during export where it falls before the date of birth, so blanks
      include cleaned-away impossible values. Held as a C(10) string in
      DD/MM/AAAA form, not a DBF date type — note that SIH and SIM use other
      orderings, so this does not compare directly with them without parsing.

  DT_ENCERRA:
    official_name: Data do Encerramento
    translated_name: Case closure date
    description: >
      Date the notification was closed. Because "permanece em acompanhamento
      clínico" is itself a closure status, a closure date does not mean the
      patient's care ended — only that the notification record was finalised.
    code_system: none
    depends_on: [ST_ENCERRA]
    notes: C(10) string in DD/MM/AAAA form, not a DBF date type.

  SITUACAO:
    official_name: Situação
    translated_name: Record cancellation flag
    description: >
      Flags notifications deleted through the e-SUS Notifica "Ações" function.
      Its only documented value is "Cancelado".
    code_system: none
    notes: >
      Expected to be empty throughout the published file: the technical area
      uses this column to drop cancelled records before release, so anything
      surviving here has already been filtered on. Consistent with that, it is
      declared N(1,0).

  DT_CRIACAO:
    official_name: Criação
    translated_name: Record creation date
    description: >
      Date the ficha was created in e-SUS Notifica. For retrospectively
      notified cases this is the date the backlog was keyed in, and it is what
      DT_NOTIFIC was overwritten with for records whose notification year
      predated 2023.
    code_system: none
    depends_on: [DT_NOTIFIC]
    notes: >
      The data dictionary collapses creation and data entry into one row and
      names only this column; the Nota Informativa names both DT_CRIACAO and
      DT_DIGITACAO with a single shared description, so the distinction between
      the two is not documented anywhere.

  DT_DIGITAC:
    official_name: Digitação
    translated_name: Data-entry date
    description: >
      Date the ficha was keyed into the system, published alongside DT_CRIACAO.
      The two are listed against one shared description in the Nota Informativa
      and no source states how they differ.
    code_system: none
    depends_on: [DT_CRIACAO]
    notes: >
      Name truncated from DT_DIGITACAO by the ten-character DBF limit. Since no
      published source distinguishes it from DT_CRIACAO, compare the two
      columns empirically before relying on either.

  # ------------------------------------------------------- IBGE code companions

  CD_MUNICIP:
    official_name: COD IBGE - Município da Notificação
    translated_name: IBGE code, municipality of notification
    description: >
      Six-digit IBGE municipality code for the notifying establishment's
      municipality, added during export so the name column ID_MUNICIP can be
      joined reliably.
    code_system: external
    codelists: [MUNICBR, CAPITAL]
    modifies: ID_MUNICIP
    notes: >
      Six digits, not seven — IBGE's code without its check digit, the standard
      DATASUS form.

  CD_MN_RESI:
    official_name: COD IBGE - Município de Residência
    translated_name: IBGE code, municipality of residence
    description: >
      Six-digit IBGE code for the municipality of residence named in
      ID_MN_RESI. This is where the patient lived at notification, not where
      they were treated (CD_MUN_UBS / CD_MUN_ESP) or probably infected
      (CD_COMUNIN).
    code_system: external
    codelists: [MUNICBR, CAPITAL]
    modifies: ID_MN_RESI

  CD_MUN_NAS:
    official_name: COD IBGE - Município de Nascimento do paciente
    translated_name: IBGE code, municipality of birth
    description: >
      Six-digit IBGE code for the municipality of birth named in MUN_NASC.
    code_system: external
    modifies: MUN_NASC
    notes: >
      Name truncated from the dictionary's CD_MUN_NASC by the DBF
      ten-character limit. No municipality codelist is bound to this column in
      the catalog although its siblings carry one.

  CD_COMUNIN:
    official_name: COD IBGE - Município Provável de Infecção
    translated_name: IBGE code, municipality of probable infection
    description: >
      Six-digit IBGE code for the municipality of probable infection named in
      COMUNINF. This is the column to map for transmission geography — not
      CD_MN_RESI, which reflects where patients live decades after infection.
    code_system: external
    codelists: [MUNICBR]
    modifies: COMUNINF

  CD_MUN_UBS:
    official_name: COD IBGE - Município da UBS de acompanhamento do caso
    translated_name: IBGE code, municipality of the follow-up primary-care unit
    description: >
      Six-digit IBGE code for the municipality of the UBS following the case,
      named in MUN_UBS_AC.
    code_system: external
    codelists: [MUNICBR]
    modifies: MUN_UBS_AC

  CD_MUN_ESP:
    official_name: COD IBGE - Município Hospital/Serviço Especializado
    translated_name: IBGE code, municipality of the specialised service
    description: >
      Six-digit IBGE code for the municipality of the hospital or specialised
      service following the case, named in MUN_ESP.
    code_system: external
    codelists: [MUNICBR]
    modifies: MUN_ESP

  CD_MN_RES0:
    official_name: COD IBGE – Município de transferência
    translated_name: IBGE code, new municipality of residence
    description: >
      Six-digit IBGE code for the municipality the patient moved to during
      follow-up — the code companion to MN_RESI_TF.
    code_system: external
    source: inferred
    reasoning: >
      The Nota Informativa lists the export's IBGE code columns and names this
      one CD_MN_RESI_TF ("Código IBGE de novo município de residência"), but
      that is thirteen characters and truncating it to the DBF ten-character
      limit yields CD_MN_RESI, which the file already uses for the municipality
      of residence; DBF resolves such a collision by altering the last
      character, giving CD_MN_RES0. Position confirms it: the seven documented
      code columns appear in the file in the same order as their name columns,
      and this one sits exactly where the MN_RESI_TF companion belongs, between
      CD_MUN_ESP and CD_MUN_NOV.
    modifies: MN_RESI_TF
    notes: >
      Declared N(1,0), like MN_RESI_TF itself, so the column is almost
      certainly empty in the published extract.

  CD_MUN_NOV:
    official_name: COD IBGE – Município de nova UBS
    translated_name: IBGE code, municipality of the new follow-up unit
    description: >
      Six-digit IBGE code for the municipality of the UBS the patient
      transferred to for follow-up — the code companion to MUN_NOV_AC.
    code_system: external
    source: inferred
    reasoning: >
      The Nota Informativa names this column CD_MUN_NOV_AC and defines it as
      the IBGE code of the municipality of the new follow-up UBS; CD_MUN_NOV is
      that name cut to the DBF ten-character limit. Its position in the code
      block matches MUN_NOV_AC's position among the name columns, following the
      same parallel ordering as the other six code companions.
    modifies: MUN_NOV_AC
    notes: >
      No municipality codelist is bound to this column in the catalog, unlike
      its siblings.

  CD_ANT_MUN:
    official_name: COD IBGE - Município da nova unidade
    translated_name: IBGE code, municipality of the new specialised unit
    description: >
      Six-digit IBGE code for the municipality of the new hospital or
      specialised service, the code companion to ANT_MUN.
    code_system: external
    modifies: ANT_MUN
    notes: >
      The data dictionary and the Nota Informativa give this column slightly
      different glosses — "Município da nova unidade" versus "Município do novo
      Hospital/Serviço Especializado" — but both point at ANT_MUN. No
      municipality codelist is bound to it in the catalog.
