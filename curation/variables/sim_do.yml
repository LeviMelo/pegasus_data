# SIM — Declaração de Óbito (DO). One row is one death certificate.
system: SIM
source_ref: /dissemin/publicos/SIM/CID10/DOCS/Estrutura_do_SIM_2025.pdf
asserted_by: pegasus_data

variables:
  TIPOBITO:
    official_name: Tipo do óbito
    translated_name: Death type
    description: Whether the death was foetal or non-foetal.
    code_system: internal
    source: layout_doc

  DTOBITO:
    official_name: Data do Óbito
    translated_name: Date of death
    description: Date of death, stored as DDMMAAAA.
    code_system: none
    source: layout_doc
    notes: >
      DDMMAAAA here, not the AAAAMMDD used by SIH. Reading one convention as the
      other silently produces valid-looking wrong dates for every day <= 12.

  DTNASC:
    official_name: Data de nascimento
    translated_name: Date of birth
    code_system: none
    source: layout_doc

  CAUSABAS:
    official_name: Causa básica do óbito
    translated_name: Underlying cause of death
    description: >
      The underlying cause, as a CID-10 code without the dot. This is the code
      selected by the coder from the certificate's causal chain — it is the
      cause mortality statistics are built on.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    multi_valued: false
    token_rule: {width: 4}
    source: layout_doc
    notes: >
      One death has exactly one underlying cause by construction. The LINHAA-D
      fields hold what the physician wrote; CAUSABAS holds what was selected
      from it, and the two disagree often enough that using LINHAA as a cause
      of death is a different analysis, not a more detailed one.

  CAUSABAS_O:
    official_name: Causa básica original
    translated_name: Original underlying cause
    description: >
      The underlying cause before recoding, where the record was investigated
      and the cause revised.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    source: layout_doc

  LINHAA:
    official_name: Linha A da declaração de óbito
    translated_name: Certificate line A
    description: >
      The immediate cause of death, as written by the certifying physician.
      Several CID-10 codes may appear in one cell.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    multi_valued: true
    token_rule: {delimiter: "*", width: 4}
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      The record layout gives the field a width of 20 and does not state the
      packing. Measured over 7,823 distinct observed values of LINHAA-D: values
      are '*'-prefixed and '*'-separated, and 10,196 of ~12,000 inter-'*'
      segments are exactly 4 characters, matching CID-10 without the dot.
      Examples: '*I10X*I429*I219', '*R092*I509*I10X'. Width 20 therefore holds
      up to four codes. The delimiter is the primary rule and the width is the
      corroborating check.
    notes: >
      Order is meaningful — it is the causal sequence as the physician wrote it,
      running from the immediate cause (A) to the underlying one (D). Preserve
      it when rendering, and do not sort or deduplicate the tokens.

  LINHAB:
    official_name: Linha B da declaração de óbito
    translated_name: Certificate line B
    description: Antecedent cause leading to the condition in line A.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    multi_valued: true
    token_rule: {delimiter: "*", width: 4}
    source: inferred
    asserted_by: pegasus_data
    reasoning: Same packing as LINHAA, measured over the same 7,823 values.
    notes: Order is the causal sequence. Preserve it.

  LINHAC:
    official_name: Linha C da declaração de óbito
    translated_name: Certificate line C
    description: Antecedent cause leading to the condition in line B.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    multi_valued: true
    token_rule: {delimiter: "*", width: 4}
    source: inferred
    asserted_by: pegasus_data
    reasoning: Same packing as LINHAA, measured over the same 7,823 values.
    notes: Order is the causal sequence. Preserve it.

  LINHAD:
    official_name: Linha D da declaração de óbito
    translated_name: Certificate line D
    description: The underlying cause as written by the physician.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    multi_valued: true
    token_rule: {delimiter: "*", width: 4}
    source: inferred
    asserted_by: pegasus_data
    reasoning: Same packing as LINHAA, measured over the same 7,823 values.
    notes: >
      This is the physician's stated underlying cause, which is NOT the same as
      CAUSABAS — CAUSABAS is what the coder selected after applying the ICD
      selection rules. They differ routinely.

  LINHAII:
    official_name: Linha II da declaração de óbito
    translated_name: Certificate part II
    description: >
      Other significant conditions contributing to death but not in the causal
      chain of part I.
    code_system: external
    codelists: [CID10, CID9WHO]
    vintage_note: >
      SIM ran on CID-9 until the CID-10 changeover and the FTP tree still
      carries both: SIM/CID9 spans 1979-1998 and SIM/CID10 spans 1996-2024, so
      they OVERLAP for 1996-1998 and a year threshold would mis-assign three
      years of deaths. Both classifications are bound instead. That is safe
      because their code spaces are disjoint — measured: 9,740 CID-9 codes and
      14,198 CID-10 codes for SIM share exactly ZERO codes, CID-9 being numeric
      and CID-10 letter-prefixed — so exact matching selects the right
      classification per row without anything having to know the row's vintage.
    multi_valued: true
    token_rule: {delimiter: "*", width: 4}
    source: inferred
    asserted_by: pegasus_data
    reasoning: >
      Same '*'-delimited 4-character packing as LINHAA-D, measured over the same
      value set. Declared width is 30 rather than 20, so it holds up to six codes.
    notes: Part II conditions are contributory, not causal. Order is not a chain.

  RACACOR:
    official_name: Raça Cor
    translated_name: Race/colour
    code_system: internal
    source: layout_doc

  SEXO:
    official_name: Sexo
    translated_name: Sex
    code_system: internal
    source: layout_doc

  IDADE:
    official_name: Idade
    translated_name: Age
    description: >
      Age at death, encoded with its unit in the leading digit rather than in a
      separate column.
    code_system: internal
    source: layout_doc
    notes: >
      SIM packs the unit into the value itself, unlike SIH which uses a separate
      COD_IDADE column. The two systems' IDADE columns are not comparable
      without decoding each by its own rule.

  CODMUNRES:
    official_name: Município de residência
    translated_name: Municipality of residence
    code_system: internal
    codelist: CADMUN
    source: layout_doc

  CODMUNOCOR:
    official_name: Município de ocorrência
    translated_name: Municipality of occurrence
    code_system: internal
    codelist: CADMUN
    source: layout_doc
    notes: >
      Residence and occurrence differ systematically for deaths in referral
      hospitals, which concentrate in capitals. Mapping deaths by CODMUNOCOR
      draws a map of where hospitals are.

  CODESTAB:
    official_name: Estabelecimento
    translated_name: Establishment
    description: CNES code of the establishment where the death occurred.
    code_system: internal
    source: layout_doc

  ATESTANTE:
    official_name: Condição do médico atestante
    translated_name: Certifying physician's relationship
    description: >
      Whether the certifying physician was the attending doctor, a substitute,
      the IML (medico-legal institute) or the SVO (verification-of-death service).
    code_system: internal
    source: layout_doc
    notes: >
      IML and SVO certification indicate external or unclarified causes
      respectively, so this field conditions how much to trust CAUSABAS.

  NECROPSIA:
    official_name: Necrópsia
    translated_name: Autopsy performed
    code_system: internal
    source: layout_doc
