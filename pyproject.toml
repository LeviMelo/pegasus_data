[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus-data"
version = "0.1.0a1"
description = "A queryable, self-describing, typed data lake over Brazil's DATASUS public health data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PegaSUS" }]
keywords = ["datasus", "sus", "brazil", "health", "epidemiology", "parquet", "ftp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14",
  "duckdb>=0.10",
  "dbfread>=2.0.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
pdf = ["pypdf>=4", "pdfplumber>=0.11"]
excel = ["openpyxl>=3.1"]
rar = ["rarfile>=4"]
fast = ["polars>=1.0"]
all = ["pegasus-data[pdf,excel,rar,fast]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
pegasus-data = "pegasus_data.cli:main"

[project.urls]
Homepage = "https://github.com/pegasus-sus/pegasus-data"
Repository = "https://github.com/pegasus-sus/pegasus-data.git"
Issues = "https://github.com/pegasus-sus/pegasus-data/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The map of DATASUS (1.3 MB) ships: it is what makes `explore()` answer on a
# fresh install with no crawl and no network, and it is the module's most
# distinctive asset. Curation ships because it is the manual-authority rung of
# the semantic layer -- without it a pip-installed package has no way for a
# person's judgement to outrank an extraction, which was the whole point of §4.
# The label pack (30.0 MB) and the bindings (39 KB) ship for the same reason. They
# are what turns I219 into "Infarto agudo do miocardio" and 120017 into
# "Capixaba", and before they shipped, `fetch(labels=True)` on a fresh install
# returned data and translated NOTHING -- the labels existed only inside a 14 GB
# catalog no user has any reason to build. Distilled to 3.65M versioned runs by
# storing code RANGES rather than every code in them, and by storing once what
# every system agrees on. Entity directories (CADGER*, establishments) are held
# out as optional local resources; the 10.3 MB temporal CNES<->CNPJ crosswalk
# extracted from them ships, because that is a join key, not a label.
#
# What does NOT ship, and must not: the dictionary database (531 MB), the lake,
# the blob cache, the catalog, and full semantic bundles (153 MB). All are
# derived, all are reproducible, and all are downloads rather than wheel weight.
pegasus_data = [
  "catalog/*.sql",
  "resources/*.parquet",
  "resources/*.json",
  "curation/*.yml",
  "curation/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: test requires live network access to ftp.datasus.gov.br or the DEMAS API",
  "slow: test takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# SIM105: teardown paths against a flaky FTP server and a closing SQLite handle
# read more plainly as try/except/pass than as nested contextlib.suppress blocks.
# SIM115: the archive readers hand out handles that outlive the call by design.
# B006: mutable defaults are used deliberately to bind loop variables in closures.
ignore = ["E501", "B006", "B008", "SIM105", "SIM108", "SIM115", "C401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

# pyarrow.compute builds its function namespace at import time from the Arrow
# C++ registry, so `pc.utf8_trim_whitespace` and friends exist at runtime and
# are invisible to a static checker. Left on, they were ~190 of ~197 findings
# and buried the handful that were real (one of which was a genuine
# type-shadowing bug in ontology.py). Suppressed at the module level, so a real
# error elsewhere is legible.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "pegasus_data.normalize.*",
  "pegasus_data.profile.accumulators",
  "pegasus_data.sources.ibge",
  "pegasus_data.decode.dbf",
]
disable_error_code = ["attr-defined", "call-overload", "arg-type"]
